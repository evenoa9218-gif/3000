// ── Firebase REST API 헬퍼 (SDK 없이 fetch로 직접 사용) ──
const FB_URL = "https://project-1720248149706690221-default-rtdb.asia-southeast1.firebasedatabase.app";

const fb = {
  // 값 읽기
  get: async (path) => {
    try {
      const r = await fetch(`${FB_URL}/${path}.json`);
      if (!r.ok) return null;
      return await r.json();
    } catch { return null; }
  },
  // 값 쓰기 (PUT: 덮어쓰기)
  set: async (path, data) => {
    try {
      await fetch(`${FB_URL}/${path}.json`, {
        method: 'PUT',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(data)
      });
    } catch {}
  },
  // 값 병합 (PATCH: 부분 업데이트)
  update: async (path, data) => {
    try {
      await fetch(`${FB_URL}/${path}.json`, {
        method: 'PATCH',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(data)
      });
    } catch {}
  },
  // 전체 목록 읽기
  list: async (path) => {
    try {
      const r = await fetch(`${FB_URL}/${path}.json`);
      if (!r.ok) return {};
      const data = await r.json();
      return data || {};
    } catch { return {}; }
  }
};

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

// window.storage — GitHub Pages에서는 localStorage로 폴백
window.storage = window.storage || (() => {
  const PREFIX = 'qhub_';
  return {
    get: async (key) => {
      try {
        const v = localStorage.getItem(PREFIX + key);
        return v !== null ? { key, value: v } : null;
      } catch { return null; }
    },
    set: async (key, value) => {
      try {
        localStorage.setItem(PREFIX + key, value);
        return { key, value };
      } catch { return null; }
    },
    delete: async (key) => {
      try { localStorage.removeItem(PREFIX + key); return { key, deleted: true }; } catch { return null; }
    },
    list: async (prefix) => {
      try {
        const keys = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith(PREFIX + (prefix||''))) {
            keys.push(k.slice(PREFIX.length));
          }
        }
        return { keys };
      } catch { return { keys: [] }; }
    }
  };
})();

[17, "채무자가 금전채무에 관하여 채권자를 상대로 채무부존재확인소송을 제기하였고 사실심의 심리 결과 채무의 존재가 인정되어 이에 대한 확인판결을 선고할 경우, 그 지연손해금 산정에 대하여 「소송촉진등에관한특례법」 제3조의 법정이율을 적용할 수 있다.", false, "▸ [민소] 금전채무에 관하여 채무자가 채권자를 상대로 채무부존재확인소송을 제기하였을 뿐 채권자의 이행소송이 없는 경우, 채무 일부 인정되어 확인판결을 선고하더라도 이는 금전채무의 전부·일부 이행 명하는 판결 선고 아니므로, 지연손해금 산정에 대해 소송촉진법 제3조 법정이율을 적용할 수 없다. [2018다276768]", "채권의목적"],
[18, "종류채권의 목적물이 특정되기 전에 멸실된 경우 채무자는 같은 종류의 다른 물건을 급부할 의무가 있지만, 목적물이 특정된 후에 멸실된 경우에는 같은 종류의 다른 물건을 급부할 의무가 없다.", true, "▸ 특정 이전 멸실 → 채무자는 조달의무 O", "채권의목적"],
[19, "甲이 乙로부터 1리터 용량의 페인트 10통을 구매하기로 하는 계약을 체결한 경우, 페인트의 품질에 관하여 甲과 乙 사이에 합의가 없다면 乙은 甲에게 중등 품질을 인도하여야 한다.", true, "[조문] 제375조(종류채권) ① 채권의 목적을 종류로만 지정한 경우에 법률행위의 성질이나 당사자의 의사에 의하여 품질을 정할 수 없는 때에는 채무자는 중등품질의 물건으로 이행하여야 한다.", "채권의목적"],
[20, "채권액이 다른 나라 통화로 지정된 때에는 채무자는 지급할 때에 있어서의 이행지의 환금시가에 의하여 우리나라 통화로 변제할 수 있다.", true, "▸ 변제기 X, 현실로 이행할 때 O [90다2147] [조문] 제378조(동전) 채권액이 다른 나라 통화로 지정된 때에는 채무자는 지급할 때에 있어서의 이행지의 환금시가에 의하여 우리나라 통화로 변제할 수 있다.", "채권의목적"],
[21, "채권의 목적으로 선택할 수 개의 행위 중에 선택권이 없는 자의 과실로 이행불능이 된 것이 있다면, 채권의 목적은 잔존한 것에 존재한다.", false, "[조문] 제385조(불능으로 인한 선택채권의 특정) ① 채권의 목적으로 선택할 수 개의 행위중에 처음부터 불능한 것이나 또는 후에 이행불능하게 된 것이 있으면 채권의 목적은 잔존한 것에 존재한다. ② 선택권없는 당사자의 과실로 인하여 이행불능이 된 때에는 전항의 규정을 적용하지 아니한다.", "채권의목적"],
[22, "채권자가 고의 또는 과실로 이자제한법상 최고이자율을 초과하여 채무자로부터 받은 이자가 전부 원본에 충당된 경우, 채권자에게 민법 제750조에 따른 불법행위 책임은 성립하지 않는다.", true, "▸ [AI해설] 초과 지급 이자가 전부 원본에 충당된 경우 채무자에게 남은 손해가 없으므로 750조 불법행위 책임 성립하지 않음 (위 9번 해설의 법리 동일 적용)", "채권의목적"],
[23, "乙이 甲에게 사과 10상자를 주문하여 甲이 약정된 날짜에 乙의 주소지로 이를 배달하였으나 乙이 아무런 사전 연락 없이 외출하여 사과를 인도하지 못하고 되돌아오던 중 甲의 경과실로 사과가 훼손되었다면, 甲은 훼손된 상태 그대로 사과를 乙에게 인도하면 된다.", true, "▸ 고의나 중과실로 훼손되었다면? 그렇더라도 지문은 옳은 지문임. 乙의 주소지로 배달한 순간 특정물이 되었고, 특정물은 제462조에 따라 이행기의 현상대로만 이행하면 족하기 때문임. 다만 경과실이나 중과실 이상이냐에 따라 甲이 이행불능 책임을 지는 여부(제401조) 및 사과대금 지급청구 가부(제538조 제1항 제2문에 관한 통설의 해석)만 달라지는 것임 [조문] 제462조(특정물의 현상인도) 특정물의 인도가 채권의 목적인 때에는 채무자는 이행기의 현상대로 그 물건을 인도하여야 한다.", "채권의목적"],
[24, "甲이 乙이 소유하고 있는 물건 A와 B 중 어느 하나를 매수하기로 하고 그 선택을 甲이 하기로 한 경우, 甲의 과실로 A가 멸실되었더라도 甲은 여전히 B의 인도를 청구할 수 있다.", true, "▸ 선택권자의 과실에 의한 불능이므로 제385조 제1항 적용. 급부 목적물은 잔존하는 B로 특정됨. 甲은 B에 대한 인도를 구할 수 있음(A의 멸실에 대한 손해배상책임은 별개 문제임)", "채권의목적"],
[25, "甲이 乙이 소유하고 있는 물건 A와 B 중 어느 하나를 매수하기로 하고 그 선택을 甲이 하기로 한 경우, 甲은 乙의 동의가 있더라도 甲 자신이 매매목적물로 A를 선택한 것을 철회할 수 없다.", false, "▸ 선택권 있는 자(甲)는 상대방(乙)의 동의 있으면 선택을 철회할 수 있음", "채권의목적"],
[26, "금전채무의 이행지체로 인하여 발생하는 지연손해금은 3년의 단기소멸시효의 대상이 되지 않는다.", true, "▸ 지연손해금은 손해배상 O, 이자 X → 163조 1호 3년 단기시효 X [88다카214] ▸ 채무불이행 손해배상청구권의 '소멸시효기간'은 원채권 시효기간 동일 ∵ 동일성. '기산점'은 채무불이행시부터 → 현실적 손해 발생 시점부터 진행 [2018다240462]", "채권의목적"],
[27, "불법행위로 인한 손해배상채무의 경우, 불법행위 성립일로부터 지체책임을 부담함이 원칙이다.", true, "▸ 불법행위 손해배상채무는 불법행위일 '당일'부터 지체책임 [74다1393]", "채권의목적"],
[28, "금전채무불이행으로 인한 손해배상에 관하여 채권자는 손해를 증명할 필요가 없다.", true, "[조문] 제397조(금전채무불이행에 대한 특칙) ① 금전채무불이행의 손해배상액은 법정이율에 의한다. 그러나 법령의 제한에 위반하지 아니한 약정이율이 있으면 그 이율에 의한다. ② 전항의 손해배상에 관하여는 채권자는 손해의 증명을 요하지 아니하고 채무자는 과실없음을 항변하지 못한다.", "채권의목적"],
[29, "임대인의 이행보조자가 임차인으로 하여금 임차목적물을 사용·수익하지 못하게 하여 임대인은 임차인에게 채무불이행책임을 지고 이행보조자는 임차인에게 불법행위책임을 지는 경우, 양 책임은 부진정연대채무관계에 있다.", true, "▸ 임대인의 관리인이 임차인의 임차점포 출입 봉쇄하여 사용·수익 못하게 한 경우 임대인은 채무불이행책임(391조), 이행보조자는 불법행위책임(750조) → 양자의 책임은 부진정연대채무관계 [94다22446]", "채무불이행"],
[30, "금전소비대차의 채권자가 고의 또는 과실로 「이자제한법」상의 최고이자율을 초과하는 이자를 받은 경우, 그 초과 부분이 원본에 충당됨으로써 원본이 전부 소멸하고도 남는 금액이 있으면, 특별한 사정이 없는 한 그 부분에 대해서는 채권자에게 불법행위책임이 발생한다.", true, "▸ 금전 대여한 채권자가 고의·과실로 이자제한법 위반하여 최고이자율 초과 이자를 받아 채무자에게 손해 입힌 경우 특별한 사정 없는 한 750조 불법행위 O. 초과 지급 이자는 원본 충당되고(이자제한법 2조 4항), 원본 소멸하고도 남은 초과 지급액이 손해 → 부당이득반환청구권과 불법행위로 인한 손해배상청구권은 서로 별개 청구권 [2020다230239]", "채무불이행"],
[31, "금전채권의 일부에 대한 전부명령이 확정되면, 압류채무자에 대하여 그 채권에 대한 반대채권을 가진 제3채무자의 상계는 채권 총액에 대한 전부된 부분의 채권액과 전부되지 않은 부분의 채권액의 각 비율에 따라 행사되어야 한다.", false, "▸ 채권의 일부양도가 있으면 각 분할된 부분에 독립한 분할채권 성립 → 채무자는 양도인을 비롯한 각 분할채권자 누구든 상대방으로 삼아 상계 O → 분할채권자인 양수인이 대항요건을 갖추었다고 하더라도 다른 부분에 먼저 상계 혹은 비율에 따라 상계되어야 한다는 이의 X [2000다50596] → 채권의 일부에 압류·전부명령 있는 경우에도 동일한 판례 있음", "채무불이행"],
[32, "보증채무의 연체이율에 관하여 별도의 약정이 없는 한 보증채무에는 주채무에 대하여 약정된 연체이율이 적용된다.", false, "▸ 보증채무는 주채무와 별개 채무 → 보증채무 자체의 이행지체로 인한 지연손해금은 보증 한도액과 별도로 부담 O → 보증채무 연체이율의 특별한 약정 있으면 약정에 따라, 특별한 약정 없으면 거래행위 성질에 따라 상법·민법 법정이율 적용. 주채무에 약정 연체이율 당연 적용은 X [2001다29803]", "채무불이행"],
[33, "피보증인의 불법행위로 인하여 손해가 발생하게 되면, 신원보증인은 피보증인의 불법행위 시부터 신원보증채무에 대한 지체책임을 진다.", false, "▸ 신원보증인의 채무는 피보증인의 불법행위로 인한 손해배상채무 그 자체가 아니고 신원보증계약에 기하여 발생한 채무로서 이행기의 정함이 없는 채무이므로 채권자로부터 이행청구를 받지 않으면 지체의 책임 X [2009다59671]", "채무불이행"],
[34, "신원보증인의 채무는 피보증인의 불법행위로 인한 손해배상채무 그 자체가 아니고 신원보증계약에 기하여 발생한 채무로서 이행기의 정함이 없는 채무이므로 채권자로부터 이행청구를 받지 않으면 지체의 책임이 생기지 않는다.", true, "▸ [2009다59671] [AI해설] 신원보증인의 채무는 피보증인의 불법행위로 인한 손해배상채무 자체가 아니라 신원보증계약에 기한 채무 → 이행기가 불확정한 채무의 이행청구를 받은 때부터 지체책임 발생", "채무불이행"],
[35, "기한이익 상실의 특약은 특별한 사정이 없는 이상 위 특약에서 정한 사유가 발생한 후 채권자의 통지나 청구 등 채권자의 의사행위를 기다려 비로소 이행기가 도래하는 것으로 하는 형성권적 기한이익 상실의 특약으로 추정된다.", true, "▸ 기한이익 상실 특약이 '정지조건부'와 '형성권적' 중 어느 쪽인지 불분명한 경우 채권자에 더 유리한 '형성권적' 특약 추정 → 1회 불이행 등 상실 사유 발생해도 각 할부금의 각 변제기 도래시마다 순차로 소멸시효 진행, 채권자가 특히 잔존채무 전액 변제 청구한 경우만 전액에 그때부터 소멸시효 진행 [2002다28340]", "채무불이행"],
[36, "이행기의 정함이 없는 채권의 양수인이 채무자를 상대로 그 이행을 구하는 소를 제기하고 소송계속 중 채무자에 대한 채권양도 통지가 이루어진 경우에는 특별한 사정이 없는 한 채무자는 채권양도 통지가 도달된 다음 날부터 이행지체의 책임을 진다.", true, "▸ 기한 정함 없는 채권 양도되고 양수인이 양수금 청구하여 소송계속 중에 양도통지가 채무자에 도달하면 통지 도달 다음 날부터 지체책임 [2012다29557]", "채무불이행"],
[37, "쌍무계약의 당사자 일방이 먼저 한 번 현실의 제공을 하여 상대방을 수령지체에 빠지게 하였다고 하더라도, 그 이행의 제공이 중지되어 더 이상 그 제공이 계속되지 아니하는 기간 동안에는 상대방의 의무가 이행지체 상태에 빠졌다고 할 수는 없으므로, 그 이행의 제공이 중지된 이후에 상대방의 의무가 이행지체되었음을 전제로 하는 손해배상청구를 할 수 없다.", true, "▸ 계속적 이행제공설: 쌍무계약 당사자 일방이 먼저 한 번 현실 제공을 하고 상대방을 수령지체에 빠지게 했더라도 그 이행제공이 계속되지 않은 경우에는 과거 한 번 이행제공 사실만으로 상대방의 동시이행 항변권 소멸 X [66다1174]", "채무불이행"],
[38, "예금계약은 은행 등 법률이 정하는 금융기관을 수치인으로 하는 금전의 소비임치계약으로서 소비대차에 관한 민법의 규정이 준용되므로, 만기가 정해진 예금계약에 따른 금융기관의 예금 반환채무는 만기가 도래한 때 이행기가 도래하며, 금융기관인 수치인은 예금 만기 시부터 임치인에 대하여 예금반환 지연으로 인한 지체책임을 부담한다.", false, "▸ 예금계약은 은행 등 금융기관을 수치인으로 하는 금전 소비임치 계약 → 만기 정해진 예금계약에서 금융기관의 예금반환채무는 만기 도래하더라도, 임치인이 미리 만기 후 예금 수령방법 지정한 경우처럼 특별한 사정 없는 한, 만기 도래만으로 금융기관인 수치인이 임치인에 대해 예금반환 지연으로 인한 지체책임 부담 X. 정당한 권한 있는 임치인의 지급청구에도 불구하고 수치인이 예금반환 지체한 경우에 지체책임 O [2023다218353]", "채무불이행"],
[39, "민법 제684조 제1항은 '수임인은 위임사무의 처리로 인하여 받은 금전 기타의 물건 및 그 수취한 과실을 위임인에게 인도하여야 한다.'라고 규정하고 있는데, 이때 인도 시기는 당사자 간에 특약이 있거나 위임의 본뜻에 반하는 경우 등과 같은 특별한 사정이 없는 한 위임계약이 종료된 때이므로, 수임인이 반환할 금전의 범위도 위임 종료 시를 기준으로 정해진다.", true, "▸ 수임인은 위임사무 처리로 받은 금전 기타 물건, 수취한 과실을 위임인에게 인도해야 함(684조 1항) → 인도 시기는 특별한 사정 없는 한 위임계약 종료 시, 반환할 금전 범위도 위임 종료시 기준으로 [2004다64432, 2021다215060]", "채무불이행"],
[40, "甲과 乙은 X상가와 Y아파트의 공유자이고 甲은 乙에게 X상가의 임대 등 관리와 Y아파트의 매도를 위임하였다. 乙은 2022. 1. Y아파트를 매도하였고 甲은 2023. 1.경 乙과의 위임계약을 해지하였는데, 甲이 2025. 2.경에 이르러 乙을 상대로 위임사무의 처리로 취득한 X상가의 임대수익금, Y아파트의 매매대금 중 甲의 지분에 해당하는 금액 및 이에 대한 지연손해금을 청구한 경우, 甲과 乙 사이의 특약 등 특별한 사정이 없는 한 乙은 甲에게 위 각 금원 및 이에 대한 2023. 1.경부터의 지연손해금을 지급하여야 한다.", true, "▸ [AI해설] 수임인이 위임사무 처리로 받은 금전 기타 물건 및 수취한 과실은 위임인에게 이전해야 하는 의무 O (686조, 684조). 甲 지분 해당 임대수익금·매매대금은 위임사무 처리로 받은 금전에 해당 → 반환의무 O", "채무불이행"],
[41, "확정기한부 채권이라고 하더라도 지시채권의 경우에는 증서를 제시하여 이행을 청구하여야 이행지체가 된다.", true, "▸ 매매계약 목적물상 담보권설정등기 말소할 의무와 잔대금 지급의무는 특별한 사정 없는 한 동시이행관계 → 쌍방이 이행기에 이행하지 않으면 그 이후 쌍방 채무는 기한의 정함이 없는 동시이행채무로 되어 일방이 자기 채무 이행제공하면서 이행 최고해야 상대방이 그 다음 날부터 지체책임 [80다1037] → 확정기한부 채권도 쌍방이 이행기 경과하면 모두 기한 정함 없는 채무로 되어 일방이 자기 채무 이행제공하면서 이행 최고해야 상대방이 그 다음 날부터 지체책임", "채무불이행"],
[42, "추심명령의 제3채무자가 압류채권자로부터 압류된 채권액 상당에 관하여 지체책임을 지는 것은 집행법원으로부터 추심명령을 송달받은 다음날부터이다.", false, "▸ 추심명령 송달된 경우 제3채무자가 압류채권자에게 지체책임 지는 것은 압류채권자로부터 추심금 청구 받은 다음날부터 O (추심명령 송달받은 때 X) ∵ 추심명령은 추심권능 수여에 그칠 뿐, 지급 명하거나 기한 정하는 것 X [2010다47117]", "채무불이행"],
[43, "신축중인 건물의 분양계약에 따른 중도금지급기일을 '1층 골조공사 완료시'로 정한 경우, 중도금 지급의무는 1층 골조공사가 완료된 다음날부터 이행지체책임이 발생한다.", false, "▸ 중도금 지급기일을 '1층 골조공사 완료시'로 정한 것은 불확정기한 → 중도금 이행지체 책임 지우려면 1층 골조공사가 완료된 것만으로는 부족 → 채무자가 그 완료 사실을 알아야 [2005다38546]", "채무불이행"],
[44, "금전채무 불이행으로 인한 손해배상을 청구하는 채권자는 손해의 주장·증명을 할 필요는 없으나, 손해 발생원인인 채무불이행 사실은 주장·증명할 필요가 있다.", false, "▸ 금전채무불이행의 손해배상에서 채권자는 손해 증명 요하지 않으나 손해가 발생했다는 주장은 하여야 [99다49644] [조문] 제397조(금전채무불이행에 대한 특칙) ① 금전채무불이행의 손해배상액은 법정이율에 의한다. 그러나 법령의 제한에 위반하지 아니한 약정이율이 있으면 그 이율에 의한다. ② 전항의 손해배상에 관하여는 채권자는 손해의 증명을 요하지 아니하고 채무자는 과실없음을 항변하지 못한다.", "채무불이행"],
[45, "계약해제 시 반환할 금전에 가산할 이자는 원상회복의 범위에 속하는 것으로서 반환의무의 지체로 인한 지연손해금이 아니므로 그 이자에 관하여 당사자 사이에 약정이 있더라도 이를 지연손해금 산정의 기준으로 삼을 수는 없다.", false, "▸ 원상회복의무 약정이율을 원상회복의무의 지연손해금에 적용 O → 그러나 약정이율이 법정이율보다 낮다면 적용 못하고 법정이율에 의한 지연손해금 청구 O ∵ 이자 면제해도 법정이율 지연손해금 청구 가능 [2011다50509]", "채무불이행"],
[46, "금전채무 불이행으로 인한 손해배상과 관련하여 당사자 사이에 지연손해금률에 관한 별도의 약정이 있으면 그에 따라야 할 것이고, 설사 그것이 법정이율보다 낮다 하더라도 마찬가지이다.", true, "▸ 지연손해금률 자체를 따로 약정했다면 법정이율보다 낮더라도 약정 지연손해금률을 그대로 적용 [2011다50509]", "채무불이행"],
[47, "甲이 2022. 7. 1. 대학 동창 乙에게 1억 원을 이율 월 1%(매월 말일 지급), 지연이율 연 20%, 변제기 2023. 6. 30.로 정하여 대여하였고, 乙의 친구 丙은 1억 2,000만 원 한도 내에서 이를 보증하였으나 변제기가 지나도록 乙과 丙은 아무런 변제도 하고 있지 않다.§원금 1억 원에 대한 지연손해금채무는 금전채무의 이행지체로 인한 손해배상채무로서 이행기의 정함이 없는 채무에 해당하므로 甲이 2023. 7. 1.부터 2023. 9. 30.까지로 기간을 산정해 확정한 지연손해금 채권에 대해 이행청구를 하는 경우 乙은 그 지연손해금 채무에 대하여도 지체책임을 부담한다.", true, "▸ 지연손해금은 금전채무 이행지체 따른 손해배상으로 기한 없는 채무 → 확정된 지연손해금을 채권자가 이행청구 하면 채무자 지체책임. 이행판결 확정된 지연손해금도 채권자 이행청구로 지체책임 ∵ 판결로 권리 실체적 내용 바뀌지 않으므로 [2018다259213, 2021다232331]", "채무불이행"],
[48, "甲이 2022. 7. 1. 대학 동창 乙에게 1억 원을 이율 월 1%(매월 말일 지급), 지연이율 연 20%, 변제기 2023. 6. 30.로 정하여 대여하였고, 乙의 친구 丙은 1억 2,000만 원 한도 내에서 이를 보증하였으나 변제기가 지나도록 乙과 丙은 아무런 변제도 하고 있지 않다.§丙의 보증채무는 乙의 주채무와는 별개의 채무이기 때문에 보증채무 자체의 이행지체로 인한 지연손해금은 보증 한도액과는 별도로 부담하여야 하고, 다른 약정이 없는 이상 민법에서 정한 법정이율인 연 5%의 법정지연손해금율에 의한다.", true, "▸ 보증채무는 주채무와 별개 채무 → 보증채무 자체의 이행지체로 인한 지연손해금은 보증 한도액과 별도로 부담 O → 보증채무 연체이율의 특별한 약정 있으면 약정에 따라, 특별한 약정 없으면 거래행위 성질에 따라 상법·민법 법정이율 적용. 주채무에 약정 연체이율 당연 적용은 X [2001다29803, 97다1433]", "채무불이행"],
[49, "채권의 가압류가 있는 경우에 그 채권의 이행기가 도래하여도 제3채무자는 이행지체책임을 지지 않는다.", false, "▸ 채권 가압류가 있어도 이행기 도래하면 제3채무자 지체책임 O ∵ 가압류는 제3채무자에 대해 지급금지할 뿐 채무 그 자체 면하게 하는 것 X → 제3채무자는 487조 공탁으로 지체책임 면할 수 있음 ∵ 이중변제 위험. 채권 가압류되면 '채권자가 변제를 받을 수 없는 때' O → 공탁금출급청구권에 가압류 존재 [93다951] ### 이행불능", "채무불이행"],
[50, "매매목적물의 수용으로 인하여 매도인의 소유권이전등기의무가 이행불능되었다면, 그로부터 상당한 기간이 지난 뒤에야 수용으로 인한 보상금청구의 방법과 절차가 마련되었더라도 대상청구권의 소멸시효는 이행불능 시부터 진행한다.", false, "▸ 대상청구권은 매수인이 대상청구권을 행사할 수 있는 시점인 매도인의 소유권이전등기의무 이행불능 시점부터 소멸시효 진행 → 수용뿐 아니라 이중매매와 같이 채무자 귀책사유로 발생한 대상청구권도 마찬가지 [2018다248244]. 그러나 권리 행사 가능해야 → 수용 이후 상당 기간 지나 보상금 지급 구할 방법·절차 마련되었다면 그때부터 진행 [99다23901]", "채무불이행"],
[51, "甲이 乙을 상대로 사해행위취소 및 원물반환으로 근저당권설정등기의 말소를 청구하여 승소판결이 확정되었는데, 그 후 해당 부동산이 경매에서 제3자에게 매각됨으로써 위 확정판결에 기한 乙의 근저당권설정등기 말소의무가 이행불능되었다. 이 경우 甲은 대상청구권을 행사하여 乙이 위 근저당권에 기하여 지급받은 배당금의 반환을 청구할 수 있다.", true, "▸ 사해행위취소 및 근저당권등기말소 승소 확정되었으나 임의경매 진행으로 경락되어 근저당권등기말소의무가 이행불능으로 된 경우에 대상청구권 행사로서 수익자가 받은 배당금 반환청구 O [2010다71431]", "채무불이행"],
[52, "매매에 따른 소유권이전등기 전에 매매목적물이 수용된 경우 매수인이 매도인을 상대로 수용보상금청구권이 자신에게 속한다는 채권의 귀속에 관한 확인을 구하는 청구는, 하나의 채권에 관하여 2인 이상이 서로 채권자라고 주장하는 경우로 그 확인의 이익이 있다.", false, "▸ 매수인이나 취득시효 완성자는 토지 수용된 경우 수용보상금이나 채권에 대상청구권 행사 O → 그러나 수용보상금의 수령권자가 자신이라는 확인 구할 수 X [95다2074]", "채무불이행"],
[53, "증여의 대상인 권리가 계약 당시 타인에게 귀속되어 있다면 증여자의 계약에 따른 이행은 불능이라고 보아야 한다.", false, "▸ 민법이 타인의 권리 매매를 인정하고 있는 것처럼 타인 권리의 증여도 가능. 이 경우 채무자는 권리를 취득하여 채권자에게 이전해야 → 대상인 권리가 타인에게 귀속되어 있다는 이유만으로 계약의 이행 불능은 X [2016다200729]", "채무불이행"],
[54, "매매 목적 부동산에 관하여 매도인이 이중으로 제3자와 매매계약을 체결하였다는 사실만 가지고는 선행 매매계약이 이행불능이라고 할 수 없다.", true, "▸ 매매목적물에 이중으로 제3자와 매매계약 체결했다는 사실만으로 이행불능은 X → 채무의 이행불능은 단순히 절대적·물리적 불능 아니라 사회생활 경험법칙이나 거래상 관념에 비추어 채권자가 채무자의 이행 실현을 기대할 수 없는 경우 [96다14616]", "채무불이행"],
[55, "임대차계약상 목적물을 사용·수익하게 할 임대인의 의무는 임대인이 소유권을 상실하였다는 이유만으로는 불능하게 된 것이라고 단정할 수 없다.", true, "▸ 임대인의 소유권 상실이 바로 이행불능 X [93다37977] → 그러나 임차인이 진실한 소유자로부터 목적물 반환청구나 차임 상당액 지급청구 받으면 이행불능 O → 임차인은 임대차 당연종료 이유로 차임지급 거절 O [94다54641]", "채무불이행"],
[56, "부동산소유권이전등기의무자가 그 부동산에 관하여 가등기를 경료한 경우 그 가등기만으로는 소유권이전등기의무가 이행불능이 된다고 할 수 없으나, 제3자 앞으로 채무담보를 위하여 소유권이전등기를 경료한 경우 그 의무자가 위 채무를 변제할 자력이 없는 때에는 특단의 사정이 없는 한 그 소유권이전등기의무는 이행불능이 된다.", true, "▸ 부동산에 가등기 경료만으로 소유권이전의무 이행불능은 X ∵ 가등기는 본등기의 순위보전 효력 가지는 것에 불과, 소유권이전등기의무자의 처분권한 상실된 것도 X [91다8104]", "채무불이행"],
[57, "매매목적물이 화재로 인하여 소멸됨으로써 매도인의 매매목적물에 대한 인도의무가 이행불능이 되었다면 매수인은 화재사고로 인해 매도인이 지급받게 되는 화재보험금에 대하여 대상청구권을 행사할 수 있고, 이때 매수인이 화재보험금에 대하여 행사할 대상청구권의 범위는 실제 지급하거나 지급하기로 약정한 매매대금 상당액의 한도로 제한된다.", false, "▸ 대상청구권의 행사 범위에 관하여 1) 제한설, 2) 무제한설[통판] → 매매 목적물이 화재 소멸되어 매도인이 받는 화재보험금·화재공제금 '전부'에 대하여 매수인은 대상청구권 O, 이행불능 당시 매수인이 지급했거나 지급하기로 약정한 '매매대금' 상당액 한도 내로 범위 제한 X [2013다7769]", "채무불이행"],
[58, "물권적 방해배제청구권의 행사로 등기말소를 구하는 소유자가 그 후 소유권을 상실함으로써 이제 등기말소를 청구할 수 없게 되었다면, 등기말소의무자에 대하여 그 권리의 이행불능을 이유로 「민법」 제390조상의 손해배상청구권을 행사할 수 없다.", true, "▸ 소유자가 소유권에 기하여 등기명의인 상대로 등기말소나 진정명의회복 구하는 권리는 물권적 청구권으로서 방해배제청구권(214조) → 소유자가 그 후에 소유권 상실하면, 말소의무자에게 물권적청구권 실현 불능을 이행불능으로 390조 손해배상청구 X ∵ ⓐ 390조 채무불이행 손해배상청구권은 계약·법률에 기하여 이미 성립한 채권관계에서 본래 채권이 동일성 유지하며 내용이 확장·변경된 것, ⓑ 등기말소청구권 등 물권적 청구권은 권리자가 소유권 상실하면 그 발생 기반이 아예 없게 되어 더 이상 존재 자체 X → 이는 이미 말소등기청구가 확정되었어도 마찬가지 [2010다28604]", "채무불이행"],
[59, "매매 목적 부동산에 대하여 가압류 또는 처분금지가처분 집행이 되어 있다거나, 매도인이 매매 목적 부동산의 원소유자에 대하여 가지는 소유권이전등기청구권이 가압류 또는 처분금지가처분이 되어 있다는 것만으로 매도인의 채무가 이행불능이 되는 것은 아니다.", true, "▸ 미등기전매에서 매도인의 소유권이전등기청구권이 가압류·처분금지가처분 된 경우에 매도인이 무자력이면 이행불능 O [2005다39211]", "채무불이행"],
[60, "양자간 등기명의신탁에서 명의수탁자가 신탁부동산을 처분하여 제3취득자가 유효하게 소유권을 취득한 경우에는 명의신탁자의 소유권에 기한 말소등기청구권에 따른 명의수탁자의 의무는 이행불능이 되어 채무불이행책임이 성립한다.", false, "▸ 수탁자가 제3자에게 처분한 후 우연히 수탁자가 다시 취득하여도 신탁자는 등기말소·진정명의회복 X ∵ 신탁자가 실명법 4조 3항에 의해 소유권을 상실한 사실은 변함없어 물권적 청구권 존재 자체 X [2010다89814]. 소유자가 소유권에 기하여 등기명의인 상대로 등기말소나 진정명의회복 구하는 권리는 물권적 청구권으로서 방해배제청구권(214조) → 소유자가 그 후에 소유권 상실하면, 말소의무자에게 물권적청구권 실현 불능을 이행불능으로 390조 손해배상청구 X ∵ ① 390조 채무불이행 손해배상청구권은 계약·법률에 기하여 이미 성립한 채권관계에서 본래 채권이 동일성 유지하며 내용이 확장·변경된 것. ② 등기말소청구권 등 물권적 청구권은 권리자가 소유권 상실하면 그 발생 기반이 아예 없게 되어 더 이상 존재 자체 X → 이는 이미 말소등기청구가 확정되었어도 마찬가지 [2010다28604]\n▸ 위 두 판례를 결합한 지문으로 볼 수 있음", "채무불이행"],
[61, "부동산 매수인이 이행기일을 도과한 후에 이르러 매도인에 대하여 계약상 의무 없는 과다한 채무의 이행을 요구하는 경우 매도인으로서는 매매계약을 해제할 수 있으나 이 경우에도 자기 채무의 이행제공이 필요하다.", false, "▸ 쌍무계약인 부동산 매매계약에서 매수인이 이행기일 도과 후 매도인에 대해 계약상 의무 없는 과다한 채무 이행 요구하는 경우 매도인으로서는 자기 채무 이행제공이나 최고 없이도 계약 해제 O ∵ 매수인이 이미 자기 채무 이행의사 없음을 표시한 것 [92다9463]", "채무불이행"],
[62, "채무의 이행불능이란 단순히 절대적·물리적으로 불능인 경우가 아니라, 사회생활의 경험법칙 또는 거래상의 관념에 비추어 채권자가 채무자의 이행의 실현을 기대할 수 없는 경우를 말하므로, 매매목적물이 가압류되었다면 특별한 사정이 없는 한 매도인의 소유권이전등기의무는 이행불능이 된다.", false, "▸ 매매목적물에 가등기·가압류·가처분만으로는 이행불능 X → 그러나 매도인이 변자력 없거나 강제집행으로 소유권 잃은 경우는 이행불능 O [91다8104, 99다11045, 2000다47361]", "채무불이행"],
[63, "매도인의 소유권이전등기의무가 이행불능이 되어 이를 이유로 매수인이 매매계약을 해제함에 있어서는 매수인의 잔대금지급의무가 매도인의 소유권이전등기의무와 동시이행관계에 있다고 하더라도 그 이행의 제공을 필요로 하지 않는다.", true, "▸ [통판] 이행불능, 이행거절로 인한 해제는 최고나 이행제공 불요", "채무불이행"],
[64, "임대차 목적물이 화재로 소멸됨으로써 임차인의 목적물 반환의무가 이행불능이 된 경우에, 임차인은 이행불능이 자기가 책임질 수 없는 사유로 인한 것이라는 증명을 다하지 못하면 목적물 반환의무의 이행불능으로 인한 손해를 배상할 책임을 지며, 화재의 구체적인 발생 원인이 밝혀지지 아니한 경우에도 마찬가지이다.", true, "▸ 임대차 목적물이 화재로 소멸되어 임차인의 목적물반환의무가 이행불능 된 경우, 임차인은 귀책사유 없음 입증 못하는 한 이행불능 손해배상책임(화재의 구체적 발생원인 밝혀지지 않은 경우도 마찬가지) → 그러나 화재가 임대인의 지배·관리 영역 존재 하자로 발생 추단되면, 임차인이 하자 미리 알았거나 알 수 있었다는 등 특별한 사정 없는 한, 임차인은 이행불능 손해배상책임 X [2012다86895]", "채무불이행"],
[65, "매도인의 매매목적물에 관한 소유권이전의무가 이행불능이 되었다고 할지라도, 그 이행불능이 매수인의 귀책사유에 의한 경우에는 매수인은 매도인의 이행불능을 이유로 계약을 해제할 수 없다.", true, "▸ 이행불능 이유로 계약 해제하려면 이행불능이 채무자 귀책사유에 의한 경우여야(546조) → 매수인 귀책사유에 의하여 불능 되면 매수인은 이행불능 이유로 계약 해제 X [2000다50497]", "채무불이행"],
["19.②", "채무불이행에 있어 특별한 사정으로 인한 손해는 당사자들의 개별적, 구체적 사정에 따른 손해를 말한다.", true, "▸ 특별손해는 당사자들의 개별적·구체적 사정에 따른 손해 [2013다66904]", "손해배상"],
["19.③", "수급인이 제공한 하자 있는 목적물을 도급인이 사용함에 따라 발생하는 도급인의 정신적 고통으로 인한 손해는 수급인이 그러한 사정을 알았을 경우 특별 손해로서 도급인이 배상받을 수 있다.", true, "▸ 일반적으로 건물 신축 도급계약에서 신축한 건물에 하자가 있는 경우 도급인이 받은 정신적 고통은 하자 보수나 하자보수 갈음 손해배상으로 회복 → 그것으로 회복될 수 없는 정신적 고통은 특별 손해 [95다12798]", "손해배상"],
["19.④", "불법행위로 인하여 건물이 훼손되었으나 수리가 가능한 경우에는 그 수리비가 통상의 손해이므로, 수리비가 교환가치를 초과한다고 하더라도 수리비 전액이 손해배상액이 된다.", false, "▸ 수리 가능한 경우 수리비가 통상 손해이나, 수리비가 건물 교환가치를 넘는 경우(=경제적 수리불능)에는 건물 교환가치 범위 내로 제한되어야 [90다카7569] ### 3. 손해배상액의 산정", "손해배상"],
["20.②", "불법행위로 인하여 물건이 훼손되었을 때 수리를 한 후에도 일부 수리가 불가능한 부분이 남아있는 경우에는 수리비 외에 수리불능으로 인한 교환가치의 감소액도 통상의 손해에 해당한다.", true, "▸ 불법행위로 물건 훼손 시 통상손해: ⓐ 수리 가능하면 수리비, ⓑ 수리 불가능하면 교환가치 감소액, ⓒ 수리한 후에도 일부 수리 불가능한 부분 남으면 수리비 + 수리불능 교환가치 감소액 O [2016다248806]", "손해배상"],
["21.①", "채무자가 이행거절의 의사를 명백히 표시하여 채권자가 최고 없이 이행에 갈음하는 손해배상을 청구할 수 있는 경우, 그 손해액의 산정은 청구 당시의 급부목적물의 시가를 표준으로 해야 한다.", false, "▸ 이행지체에 의한 전보배상 손해액 산정은 최고 후 상당 기간 경과한 당시의 시가, 이행불능으로 인한 전보배상액은 이행불능 당시의 시가, 이행거절로 인한 손해액 산정은 이행거절 당시의 시가가 표준 [2005다63337]", "손해배상"],
["21.⑤", "손해배상 예정액이 부당하게 과다한 경우 당사자의 주장이 없더라도 법원은 직권으로 이를 감액할 수 있다.", true, "▸ [99다38637] [AI해설] 손해배상 예정액이 부당히 과다한 경우 당사자의 주장이 없어도 법원이 직권으로 감액 가능 (제398조 제2항) — 금액의 부당성은 계약 목적과 내용, 예정액 비율, 예상 손해액, 거래관행 등 참작", "손해배상"],
["22.ㄱ", "ㄱ. 표현대리가 성립하여 본인에 대하여 이행청구를 함에 있어서 상대방에게 과실이 있더라도 과실상계의 법리를 적용할 수 없다.", true, "▸ [과실상계] 과실상계 적용 X: 손해배상액 예정 [72다108], 해제 원상회복 [2013다34143], 피해자 부주의를 이용한 고의 불법행위(=사기·횡령·배임 등 영득행위, 위조 ∵ 가해자가 불법행위의 이익 최종 보유하면 공평·신의칙에 반하므로) [99다50538], 표현대리 [95다49554], 본래의 급부이행 [96다8468], 673조 책임 [2000다37296]", "손해배상"],
["22.ㄴ", "ㄴ. 손해배상청구권 중 일부가 청구된 경우의 과실상계는 전체 손해액에서 과실비율에 의한 감액을 하고, 잔액이 청구액을 초과하면 청구액을 인용하고 잔액이 청구액을 초과하지 않으면 그 잔액을 인용한다.", true, "▸ 손해 전액에서 과실비율 감액하고 그 잔액이 청구액을 초과할 경우는 청구 전액을 / 잔액이 청구액을 초과 않을 경우는 잔액을 각 인용하는 것이 일부청구 당사자의 의사 [75다819] → 외측설", "손해배상"],
["23.ㄱ", "ㄱ. 해제자가 해제의 원인이 된 채무불이행에 관하여 원인의 일부를 제공한 경우에는, 계약의 해제로 인한 원상회복청구권에 대하여도 손해배상에서의 과실상계에 준하여 권리의 내용을 제한할 수 있다.", false, "▸ [2013다34143] [AI해설] 해제로 인한 원상회복청구권에 대하여는 손해배상에서의 과실상계 법리를 유추적용하여 권리의 내용을 제한할 수 있음. 과실상계와 유사한 법적 원칙이 원상회복 범위에도 적용될 수 있으나, 그 적용은 신중해야 함 — [판례] 해제자에게 해제 원인인 채무불이행에 귀책사유가 있더라도, 계약 해제로 인한 원상회복청구권에 대해 손해배상의 과실상계 법리를 준용하여 권리를 제한하는 것이 가능", "손해배상"],
["23.ㄴ", "ㄴ. 사용자가 피용자의 고의에 의한 불법행위로 인하여 사용자책임을 부담하는 경우에, 피해자에게 그 손해의 발생과 확대에 기여한 과실이 있다면 사용자책임의 범위를 정함에 있어서 이러한 피해자의 과실을 고려하여 그 책임을 제한할 수 있다.", true, "▸ 피해자 부주의 이용한 고의 불법행위 가해자의 과실상계 주장 불허는 신의칙 반하기 때문 → 중개보조원이 피해자 부주의를 이용하여 고의 불법행위 한 경우, 중개보조원을 고용했을 뿐 불법행위 가담하지 않은 중개업자에게 책임 묻는 피해자에게 과실 있다면 법원은 직권 과실상계로 참작 [2011다21143]", "손해배상"],
["23.ㄷ", "ㄷ. 甲이 의사 乙을 상대로 의료과오를 이유로 7,000만 원의 지급을 구하는 소를 제기하면서 일부청구임을 명시하였으며, 법원은 전체 손해액이 1억 원이고 甲의 과실비율이 40%임을 인정한 경우, 지연손해금을 논외로 할 때 법원으로서는 피해자의 청구 중 4,200만 원을 인용하여야 한다.", false, "▸ 손해 전액에서 과실비율 감액하고 그 잔액이 청구액을 초과할 경우는 청구 전액을 / 잔액이 청구액을 초과 않을 경우는 잔액을 각 인용하는 것이 일부청구 당사자의 의사 [75다819] → 외측설에 따라, 지문의 경우 1억 원의 40%로서 청구액을 초과하지 않는 잔액 6,000만 원을 인용해야 함(4,200만 원은 안분설에 따른 결론)", "손해배상"],
["23.ㄹ", "ㄹ. 채권자 甲이 채무자 乙을 상대로 채무불이행으로 인한 손해배상을 청구한 사건에서 손해액이 100만 원, 甲의 과실비율이 30%, 乙이 채무를 이행하였더라면 甲이 지출하였을 비용이 20만 원인 경우, 乙이 甲에게 배상하여야 할 금액은 50만 원이 된다.", true, "▸ 과실상계 먼저 하고 손익상계 ㄱ → ㅅ [80다3277] 100만 원에서 먼저 30% 과실상계 하면 70만 원, 다음으로 20만 원 손익상계 하면 최종 50만 원이 올바른 정답으로서 옳은 지문. 이와 달리 손익상계 먼저 하고 과실상계하면 56만 원이 틀린 지문으로 출제될 수 있음", "손해배상"],
["24.ㄱ", "ㄱ. 불법행위로 영업용 선박, 자동차, 건물 등의 물건이 멸실된 경우에 그 물건의 교환가격 상당액의 배상 이외에 그 물건을 대체할 다른 물건의 제조 또는 구입시까지의 기간 동안 그 멸실된 물건을 사용·수익하지 못하여 입은 손해의 배상을 별도로 구할 수는 없다.", false, "▸ 휴업손해는 통상손해 O. 영업용 물건이 멸실되면 '대체 물건 마련'에, 일부 손괴되면 '수리'에 각 합리적으로 필요한 기간 동안 영업을 계속했다면 얻을 수 있었던 이익 [2001다82507] → 멸실된 물건의 교환가치 외에 별도로 휴업손해를 배상하여야", "손해배상"],
["24.ㄷ", "ㄷ. 매매계약의 이행불능으로 인한 전보배상책임의 범위는 이행불능 당시의 매매목적물의 시가이고, 이행불능 당시의 시가가 계약 당시의 시가보다 현저하게 상승되었다 할지라도 이행불능 당시 시가가 통상손해이다.", true, "▸ 매도인의 소유권이전등기의무 이행불능으로 매수인이 입는 손해액은 원칙적으로 이행불능 당시 시가 상당액 O. 그 이후 목적물 가격 취등하여도 그로 인한 손해는 특별손해이므로 매도인이 '이행불능 당시' 그러한 특수한 사정을 알았거나 알 수 있었을 때에 한하여 손해배상 O [94다61359]", "손해배상"],
["24.ㅁ", "ㅁ. 부동산을 매수하고 소유권이전등기까지 넘겨받았지만, 진정한 소유자가 제기한 등기말소청구소송에서 매도인과 매수인 앞으로 된 소유권이전등기의 말소를 명한 판결이 확정됨으로써 매도인의 소유권이전의무가 이행불능된 경우, 그 손해배상액 산정의 기준시점은 위 판결이 확정된 때이다.", true, "▸ 매도인 및 매수인의 소유권이전등기 말소의무가 원소유자의 말소등기절차이행 청구소송에서 확정되었다면, 매도인의 이행불능으로 인한 손해배상액의 산정은 그 패소확정시 기준 O, 등기말소시 X [80다417]", "손해배상"],
["25.③", "피해자의 부주의를 이용하여 고의로 불법행위를 저지른 자가 피해자의 부주의를 이유로 자신의 책임을 감하여 달라고 주장하는 것은 허용되지 않으며, 이는 고의의 불법행위가 영득행위에 해당하지 않아 가해자가 불법행위로 인한 이익을 최종적으로 보유하지 않은 경우에도 마찬가지이다.", false, "▸ 피해자 부주의 이용한 고의 불법행위자의 과실상계 불허되는 이유는 고의 불법행위가 영득행위 해당하는 경우 가해자로 하여금 불법행위로 인한 이익 최종적 보유하게 하여 공평·신의칙 반하는 결과 때문 → 고의 불법행위도 이러한 결과 초래되지 않는다면 과실상계나 공평 원칙에 기한 책임제한 가능 O [2006다16758]", "손해배상"],
["26.ㄱ", "ㄱ. 매매계약에 따른 소유권이전의무의 이행불능으로 인한 손해배상채권은 불능이 된 때로부터 소멸시효가 진행하며, 특별한 사정이 없는 한 불능 당시의 목적물 시가를 기준으로 손해액을 정한다.", true, "▸ [AI해설] 매매계약에 따른 소유권이전의무의 이행불능으로 인한 손해배상채권은 불능 된 때로부터 소멸시효가 진행하며, 특별한 사정이 없는 한 불능 당시의 목적물 시가를 기준으로 손해액을 정함", "손해배상"],
["27.②", "불법행위로 인하여 피해자에게 손해가 발생하고 그 손해발생으로 이득이 생긴 경우에 손해배상액을 산정함에 있어 법원은 먼저 손익상계를 한 다음에 과실상계를 하여야 한다.", false, "▸ 과실상계 먼저 하고 손익상계 ㄱ → ㅅ [80다3277] ### 4. 손해배상액의 예정", "손해배상"],
["28.ㄱ", "ㄱ. 금전채무의 불이행에 대하여 손해배상액을 예정한 경우, 감액 요건인 '부당성'은 계약의 목적과 내용, 손해배상액을 예정한 동기, 채무액에 대한 예정액의 비율, 예상 손해액의 크기, 당시의 거래관행 등뿐만 아니라, 통상적인 연체금리도 고려하여 판단하여야 한다.", true, "▸ 지문 ㄱ, ㄴ 관련: 부당성은 채권자·채무자 지위, 계약 목적·내용, 손해배상액 예정한 동기·경위 등 모든 사정 참작하여 일반 사회관념상 예정액 지급이 경제적 약자인 채무자에게 부당한 압박 공정성 잃는 결과 초래하는 경우에 인정 → 기록상 실제 (예상) 손해액 알 수 있다면 대비해 볼 필요 O, 단지 예정액 자체가 크다거나 해제 시까지 단기라고 감액해서는 X → 배상액 예정이 없더라도 채무자가 받을 수 있던 금액보다 적은 금액으로 감액하면 X → 사실심의 전권 사항 O, 다만 형평의 원칙에 비추어 현저히 불합리하면 불허 [2017다8876, 2022다227619]", "손해배상"],
["28.ㄴ", "ㄴ. 손해배상 예정액의 감액 사유에 대한 사실인정이나 그 비율을 정하는 것은 원칙적으로 사실심의 전권에 속하는 사항이지만, 손해배상액의 예정이 없더라도 채무자가 당연히 지급의무를 부담하여 채권자가 받을 수 있던 금액보다 적은 금액으로 감액하는 것은 감액의 한계를 벗어나는 것이다.", true, "▸ 지문 ㄱ, ㄴ 관련: 부당성은 채권자·채무자 지위, 계약 목적·내용, 손해배상액 예정한 동기·경위 등 모든 사정 참작하여 일반 사회관념상 예정액 지급이 경제적 약자인 채무자에게 부당한 압박 공정성 잃는 결과 초래하는 경우에 인정 → 기록상 실제 (예상) 손해액 알 수 있다면 대비해 볼 필요 O, 단지 예정액 자체가 크다거나 해제 시까지 단기라고 감액해서는 X → 배상액 예정이 없더라도 채무자가 받을 수 있던 금액보다 적은 금액으로 감액하면 X → 사실심의 전권 사항 O, 다만 형평의 원칙에 비추어 현저히 불합리하면 불허 [2017다8876, 2022다227619]", "손해배상"],
["28.ㄷ", "ㄷ. 도급계약에서 손해배상액의 예정으로서 지체상금을 계약 총액에 지체상금률을 곱하여 산출하기로 정한 경우, 지체상금의 과다 여부는 지체상금률 그 자체가 과다한지를 기준으로 판단한다.", false, "▸ 손해배상의 예정에 해당하는 지체상금의 과다 여부는 지체상금 '총액'을 기준으로 판단 ∵ 문언상 예정한 손해배상액 총액을 의미 [95다11436] → '지체상금률' 자체는 과다하지 않더라도 지체일수 증가로 지체상금 총액 증가한 경우 총액 기준으로 감액 O", "손해배상"],
["28.ㄹ", "ㄹ. 수급인의 하자보수의무 불이행 시 도급인에게 귀속하는 것으로 약정된 하자보수보증금은 특별한 사정이 없는 한 손해배상액의 예정으로 볼 것이므로, 도급인은 수급인의 하자보수의무 불이행을 이유로 하자보수보증금의 몰취 외에 그 실손해액을 증명하여 수급인으로부터 그 초과액 상당의 손해배상을 받을 수는 없다.", false, "▸ '하자보수보증금'은 특성상 실손해가 이를 초과한다면 입증하여 그 외 따로 손해배상 받을 수 있는 '특수한 손해배상액의 예정' [2000다17810]", "손해배상"],
["29.③", "손해배상의 예정이 있는 경우, 채무불이행으로 인한 손해의 발생 및 확대에 채권자에게도 과실이 있다면 「민법」 제398조 제2항에 따라 손해배상 예정액을 감액할 수는 있을지언정 채권자의 과실을 들어 과실상계를 할 수는 없다.", true, "▸ [72다108] [AI해설] 손해배상의 예정이 있는 경우 채권자에게도 과실이 있다면 398조 2항에 따라 손해배상 예정액을 감액할 수는 있으나, 채권자의 과실을 들어 과실상계를 할 수는 없음", "손해배상"],
["30.②", "채무불이행에 있어 채무자의 귀책사유를 묻지 아니한다는 약정이 없는 한 채무자는 자신의 귀책사유가 없음을 증명함으로써 손해배상의 예정액의 지급책임을 면할 수 있다.", true, "▸ 귀책사유 필요설 [통판]: 채무자의 귀책사유를 불문한다는 약정이 없는 한, 채무자는 귀책사유 없음을 주장·입증하여 예정배상액의 지급책임 면할 수 O. 무과실책임 약정의 존재는 엄격하게 해석 [2006다9408]", "손해배상"],
["SS1.②", "채무불이행에 관한 위약금 약정이 손해배상액의 예정과 위약벌의 성격을 함께 가지는 경우 특별한 사정이 없는 한 법원은 직권으로 위약금 전체 금액을 기준으로 감액할 수 있다.", true, "▸ 乙이 지급의무 위반하면 甲에 대한 채권을 포기하기로 하는 위약금 약정 → 甲은 채권포기 주장 외에 따로 손해배상 구하기 어렵고, 약정금 지급 강제 및 의무위반 제재 수단이기도 하면, 위약금약정은 손해배상액 예정 O → 법원은 당사자 주장 없더라도 직권으로 398조 2항 감액 O, 채권 전액 포기가 부당하게 과다하다면 감액 O [2017다275270]", "손해배상"],
["SS1.③", "채무의 내용인 급부가 실현되기 위하여 채권자의 수령이 필요한 경우에 채무자가 채무의 내용에 따른 이행제공을 하였는데도 채권자가 이행을 받지 않은 때에는, 채무자는 채권자지체를 이유로 일반적인 채무불이행책임과 마찬가지로 손해배상이나 계약 해제를 주장할 수 있다.", false, "▸ 400조 채권자지체 성립에 채권자 귀책사유 필요 X → 채권자지체 효과는 원칙적으로 민법 규정 따른 401조, 402조, 403조, 538조 1항만 인정, 채무불이행 같은 손해배상 X, 해제 X → 그러나 계약 당사자가 채권수령의무·협력의무를 명시적·묵시적 약정했거나 구체적 사안에서 신의칙상 그러한 채권자 의무 인정될 특별한 사정 있다면, 의무위반에 따른 채권자 책임 O → 채권자의 수령의무·협력의무 불이행으로 계약 목적 달성 불능하면 채무자는 해제 O [2019다293036]", "손해배상"],
["SS1.④", "매매의 목적물인 토지에 폐기물이 매립되어 있고 매수인이 폐기물을 처리하기 위해 비용이 발생한 경우, 매도인의 하자담보책임과 채무불이행책임은 경합적으로 인정될 수 있고 폐기물 처리비용은 하자담보책임과 채무불이행책임에서 말하는 손해에 해당한다.", true, "▸ 토지 매도인이 지하에 폐기물 은밀히 매립하고 매도하여 매수인에게 토지 폐기물처리비용 상당 손해 입히면 불완전이행(채무불이행) 인한 손해배상책임 O, 이는 하자 있는 토지 매매로 인한 580조 하자담보책임과 경합 O [2002다51586]", "손해배상"],
["SS1.⑤", "임대인이 임대차계약에 따른 수선의무를 이행하기 위하여 제3자에게 도급을 주어 공사를 하던 중 수급인의 과실로 화재가 발생한 경우, 수급인이 임대인의 지시나 감독을 받지 않는 지위에 있더라도 임대인은 이행보조자의 과실을 이유로 임차인에게 채무불이행책임을 진다.", true, "▸ \"391조의 피용자는 채무자의 의사관여 있으면 충분, 지시감독관계·종속성 불문\" → 임대인이 임차인과의 약정 이행 위하여 제3자에 도급주어 시설물설치 중 수급인 과실로 화재 발생하면 임대인이 임차인에 채무불이행책임 O [2001다44338]", "손해배상"],
["SS2.ㄴ", "ㄴ. 채권자가 연대보증인들에 대하여 그 보증채무의 이행을 구하고 있다면 과실상계의 법리는 적용될 여지가 없다.", true, "▸ [96다8468, 95다49141] → 보증채무 이행은 본래 급부 청구이므로 과실상계 적용할 여지 없음", "손해배상"],
["SS3.ㄱ", "ㄱ. 법원은 채무자가 과실상계 항변을 한 경우에 한하여 채권자의 과실을 참작하여 손해액을 정할 수 있고, 그 비율은 사실심의 전권사항이다.", false, "▸ 피해자에게 과실 인정되면 배상의무자가 주장하지 않더라도 법원은 손해배상 책임·금액 정함에 있어 이를 직권으로 참작하여야 [96다30113] 과실상계 비율 자체는 사실심 전권사항 O", "손해배상"],
["SS3.ㄴ", "ㄴ. 부동산의 등기청구권을 보전하기 위한 처분금지가처분이 부당하게 집행되어 채무자가 부동산을 처분할 기회를 상실하는 불이익을 입었다면, 채무자는 그 불이익이 당해 부동산을 보유하면서 얻는 점용이익을 초과하였는지와 무관하게 손해를 입었다고 볼 수 있다.", false, "▸ 부동산의 등기청구권을 보전하기 위한 처분금지가처분 부당 집행 → 처분금지의 상대적 효력이어서 그 집행 후에도 채무자는 당해 부동산 사용·수익하면서 여전히 처분 가능 → 가처분의 존재로 처분기회 상실했거나 그 대가를 제때 지급받지 못하는 불이익 있었더라도, 부동산의 점용이익 초과하지 않는 한 손해 발생 X → 설사 점용이익 초과 불이익으로 손해 발생했더라도 특별손해로서 가처분채권자가 알았거나 알 수 있었을 때 한하여 배상책임 [98다21366]", "손해배상"],
["31.ㄴ", "ㄴ. 위약벌 약정에 대해서는 민법 제398조 제2항을 유추적용하여 그 액을 감액할 수는 없지만, 위약벌 약정의 대상이 된 채무의 강제에 의하여 얻어지는 채권자의 이익에 비하여 약정된 벌이 과도하게 무거울 때에는 그 일부 또는 전부가 공서양속에 반하여 무효가 될 수 있다.", true, "▸ 위약금이 위약벌(=실손해 배상과는 별도로 받는 제재금)로 되려면 특별한 사정 주장·입증해야 하고, 위약벌의 경우 398조 2항의 감액 X → 다만 과도하게 무거운 경우는 103조 공서양속에 반하여 무효일 여지 O [92다46905]", "손해배상"],
["31.ㄷ", "ㄷ. 채무불이행에 관하여 손해배상액을 예정한 경우에 채권자는 통상의 손해만이 아니라 특별한 사정으로 인한 손해에 관해서도 예정된 배상액만을 청구할 수 있고, 특별한 사정이 없는 한 손해배상의 예정액을 초과한 배상액을 청구할 수 없다.", true, "▸ 특별손해 포함설 [86다카2375]", "손해배상"],
["31.ㄹ", "ㄹ. 건물건축공사에 관한 도급계약에서 수급인이 건축공사를 지체하여 약정기한까지 건물을 완성하여 인도하지 않은 경우, 건물에 대한 임료 상당액을 통상의 손해로 배상하여야 한다.", true, "▸ 인도의무의 이행지체를 이유로 한 손해배상은 일반적으로 그 물건의 사용 수익 이익, 즉 그 물건의 차임 상당액이 통상 손해 O → 건물신축 도급계약에서 수급인의 건물 완성 및 인도의무 지체도 마찬가지 [94다44774]", "손해배상"],
["32.①", "위약금 약정은 민법 제398조 제4항에 따라 손해배상액의 예정으로 추정된다.", true, "[조문] 제398조(배상액의 예정) ① 당사자는 채무불이행에 관한 손해배상액을 예정할 수 있다. ② 손해배상의 예정액이 부당히 과다한 경우에는 법원은 적당히 감액할 수 있다. ③ 손해배상액의 예정은 이행의 청구나 계약의 해제에 영향을 미치지 아니한다. ④ 위약금의 약정은 손해배상액의 예정으로 추정한다.", "손해배상"],
["32.②", "위약벌 약정은 민법 제398조 제2항의 손해배상 예정액의 감액 규정을 유추적용하여 법원이 감액할 수 있다.", false, "▸ 위약벌은 398조 2항 유추적용으로 감액 X, 현재 판례 유지 ∵ 위약벌(이행 확보)과 손배예정(증명곤란 해결, 분쟁 방지, 이행 확보)은 성질·기능 본질적으로 다름. 398조 4항 문언상 손배예정과 구별되는 것 존재 전제. 위약벌 약정 사적 자치 존중하여 법원 개입 최소화. 103조 위반 무효로 통제 가능 [2018다248855]", "손해배상"],
["32.③", "위약벌 약정과 손해배상액의 예정인 위약금 약정은 하나의 계약에서 병행하여 존재할 수 있다.", true, "▸ 위약금 약정이 손해배상액 예정인지 위약벌인지는, 계약서 내용, 체결 경위, 목적 등 종합하여 구체적·개별적 판단해야 → 손해배상액 예정 추정되지만(398조 4항), 하나의 계약에 채무불이행 손해배상에 관해 손해배상액 예정 조항 따로 있거나 실손해 배상 전제로 조항 있고 별도로 위약금 조항 있다면 위약벌로 보아야 ∵ 손해배상액 예정으로 해석하면 이중배상 [2018다248855]", "손해배상"],
["32.④", "위약벌 약정이 있더라도 별도로 채무불이행으로 인해 실제 발생한 손해에 대해 배상을 청구할 수 있다.", true, "▸ 위약벌은 손해배상과 별개이며, 위 판례도 마찬가지의 취지임", "손해배상"],
["33.③", "쌍무계약에서 채권자의 수령거절 의사가 확고한 경우, 채권자 위험부담주의에 관한 민법 제538조 제1항에서의 수령지체의 성립을 위해서는 채무자의 구두제공조차 요구되지 않는다.", false, "▸ 채권자지체(400조) 성립 위하여 변제제공(460조) 있어야 하는데 채권자의 수령거절 의사가 확고한 이른바 ‘영구적 불수령’의 경우 구두 제공조차 필요 없으나 이는 그로써 채무불이행을 면한다는 것에 불과하고(461조), 538조 1항 2문 ‘수령지체’ 중 쌍방 책임 없는 불능을 이유로 채무자가 반대급부를 청구하기 위해서는 현실제공이나 구두제공이 있었어야 [2001다79013]", "채권자지체"],
["34.ㄱ", "甲이 미등기 건물을 매수하였으나 소유권이전등기를 하지 못한 경우, 甲은 위 건물의 소유권을 원시취득한 매도인 乙을 대위하여 불법점유자 丙을 상대로 직접 자신에게 위 건물을 인도할 것을 청구할 수 있다.", true, "▸ [79다1928] 미등기 건물 매수인은 소유권이전등기를 받지 못하였더라도 채권적 청구권 보전을 위해 소유자인 매도인을 대위하여 불법점유자에 대해 직접 자신에게 건물인도청구 가능 ∵ 매수인의 채권은 매도인의 소유권에 기한 방해배제청구권과 밀접한 관련, 현실적 이행의 유효·적절한 확보를 위해 대위행사 필요", "채권자대위권"],
["34.ㄴ", "甲이 乙에 대한 금전채권을 보전하기 위하여 乙의 丙에 대한 금전채권을 대위행사하면서 직접 자신에게 이행하도록 청구하여 승소판결이 확정된 경우, 乙의 丙에 대한 금전채권이 변제 등으로 소멸하기 전이라면 乙의 일반채권자인 丁은 乙의 丙에 대한 금전채권을 압류할 수 있다.", true, "▸ 대위소송에서 제3채무자로부터 직접 대위채권자에게 금전지급 판결 확정되더라도 변제 등으로 소멸되기 전에는 채무자의 다른 채권자가 (가)압류 O ∵ 채권자는 채무자를 대위하여 피대위채권(집행채권)에 대한 변제를 수령할 뿐이며 자신의 채권에 대한 변제로서 수령하는 것 X [2015다236547]", "채권자대위권"],
["34.ㄷ", "乙이 丙에게 채권의 양도를 구할 수 있는 권리를 가지고 있고 甲이 乙의 丙에 대한 위 권리를 대위행사하는 경우, 甲은 丙에 대하여 직접 자신에게 채권양도 절차를 이행하도록 청구할 수 있다.", false, "▸ 채무자가 제3채무자에게 채권양도 구할 권리 있고 채권자가 이를 대위행사할 경우는 금전지급·물건인도나 등기말소 등과 같은 직접청구의 예외 X, 채권자는 제3채무자에 대해 ‘채무자에게’ 채권양도절차 이행하도록 청구해야 O, 직접 ‘자신에게’ 채권양도 이행할 것 청구 X ∵ 채무자에게 이행하면 채무자에게 채권이 귀속되어 별도 급부수령 불필요, 채권자에게 양도하면 채권이 이전되어 대위행사 효과가 채무자 아닌 채권자에게 귀속 [2023다301682]", "채권자대위권"],
["34.ㄹ", "X 부동산의 최종 매수인 甲이 중간 매수인 乙에 대한 소유권이전등기청구권을 보전하기 위해 乙을 대위하여 매도인 丙을 상대로 X 부동산에 대한 처분금지가처분을 받았고 乙이 위 대위 사실을 알게 된 경우, 이후 甲이 乙을 대위하여 丙을 상대로 소유권이전등기절차의 이행을 구하더라도, 丙은 乙에게 X 부동산에 관하여 소유권이전등기를 마쳐 준 사실로 甲에 대하여 대항할 수 없다.", false, "▸ 가처분신청의 대위사실을 안 경우도 피대위권리 처분이 금지되지만(2006다85921 판결), 소유권이전등기를 받는 ‘변제수령’은 제405조 제2항의 ‘처분’이 아니므로 대항 O (한편 처분금지가처분은 채무자 이외의 제3자에 대한 처분을 금지하는 것일 뿐이므로 채무자에게로 처분하는 것은 가처분의 효력에도 저촉되지 않음)", "채권자대위권"],
["35.①", "甲은 乙에 대하여 변제기가 도래한 2억 원의 대여금채권(A 채권)을 가지고 있고, 채무초과 상태인 乙은 丙에 대하여 변제기가 도래한 2억 원의 대여금채권(B 채권)을 가지고 있으며, 乙은 그 소유의 X 부동산을 丁에게 증여하였다.§甲은 A 채권을 보전하기 위해 乙을 대위하여 丙을 상대로 직접 자신에게 B 채권을 지급할 것을 구하는 소를 제기할 수 있으며, 그 판결 확정 후 甲의 채권자 戊가 이러한 甲의 丙에 대한 지급청구권에 대하여 압류 및 전부명령을 받았다면 그 압류명령 및 전부명령은 모두 무효이다.", true, "▸ 대위소송에서 제3채무자로부터 직접 금전 지급받는 판결 확정되어도 (대위채권자의 채권자가) 이러한 채권에 대하여 받은 압류명령은 무효 ∵ 피대위채권이 대위채권자에게 이전·귀속 X, 추심권능 내지 변제수령권능은 자체로서 독립적 처분·환가 X, 압류 X [2015다236547]", "채권자대위권"],
["35.③", "甲은 乙에 대하여 변제기가 도래한 2억 원의 대여금채권(A 채권)을 가지고 있고, 채무초과 상태인 乙은 丙에 대하여 변제기가 도래한 2억 원의 대여금채권(B 채권)을 가지고 있으며, 乙은 그 소유의 X 부동산을 丁에게 증여하였다.§乙이 甲의 丙에 대한 채권자대위권행사 사실을 알게 된 후 채권자대위소송 계속 중 乙의 다른 채권자인 己의 신청에 의하여 B 채권에 대한 압류 및 전부명령이 이루어졌다면, B 채권에 대한 전부명령은 특별한 사정이 없는 한 무효이나 압류명령은 유효하므로 甲의 丙에 대한 위 채권자대위소송은 기각된다.", false, "▸ 채무자가 대위소송 사실 통지 받거나 알게 된 후 피대위채권에 대한 전부명령은 무효 ∵ 민집법 229조 5항 유추적용(전부명령 송달 전에 다른 채권자가 압류·가압류·배당요구한 경우 전부명령은 무효), 추심소송과 공통점 있는 대위소송의 무익화, 대위채권자의 압류·가압류·배당요구 등 채권배당절차 참여할 기회 박탈, 405조 2항 채권자대위권 실질 효과 확보 취지 [2015다236547] ▸ [민소] 채권에 대한 가압류·가처분·압류가 있더라도 채무자의 제3채무자에 대한 이행 청구 인용 O, 법원은 가압류 이유로 배척할 수 X ∵ 집행권원 취득 필요, 집행단계 저지 가능, 가압류취소 후 소 제기 불편, 시효중단 필요 [2001다59033] → 사례형 1순위 예상문제인데 선택형에 어려운 지문으로 출제됨", "채권자대위권"],
["36.⑤", "채무자의 공유지분이 다른 공유자들의 공유지분과 함께 근저당권을 공동으로 담보하고 있고, 근저당권의 피담보채권이 채무자의 공유지분 가치를 초과하여 채무자의 공유지분만을 경매하면 남을 가망이 없어 경매절차가 취소될 수밖에 없는 반면, 공유물분할의 방법으로 공유부동산 전부를 경매하면 각 공유지분의 경매대가에 비례해서 공동근저당권의 피담보채권을 분담하게 되어 채무자의 공유지분 경매대가에서 근저당권의 피담보채권 분담액을 변제하고 남을 가망이 있는 경우라면, 금전채권자는 채무자를 대위하여 부동산에 관한 공유물분할청구권을 행사할 수 있다.", false, "▸ 공유물분할청구권은 일신전속권 아니고 피대위권리 O → 그러나 금전채권 보전 위한 부동산 공유물분할청구권 대위행사는 보전 필요성 X ∵ 책임재산 보전과 직접적 관련 X, 현실적 이행 유효·적절 확보 필요 X, 부당한 간섭 → 극히 예외적으로만 인정 → 채무자 지분이 다른 지분과 함께 공동근저당 목적이고 피담보채권이 채무자 지분 초과하여 채무자 지분만 경매하면 남을 가망 없어 경매 취소되지만(민집법 102조) 공유물분할 방법으로 전부 경매하면 368조 1항 의해 채무자 지분에서 피담보채권 분담액 변제하고 남을 가망이 있는 경우라도 마찬가지 [2018다879]", "채권자대위권"],
["37.ㄴ", "甲은 비법인사단인 乙과 공사계약을 체결한 후 공사를 완료하여 乙에 대한 공사대금채권을 가지고 있었으나, 乙은 丙에 대한 매매대금채권을 가지고 있는 외에는 달리 재산이 없었다. 이에 甲은 乙에 대한 자신의 위 공사대금채권을 보전하기 위하여 乙을 대위하여 丙에게 위 매매대금의 지급을 청구하는 소를 제기한 후 乙에게 채권자대위권 행사의 통지를 하였다.§丙은 위 소송에서 甲과 乙 사이의 공사계약이 무효라거나 공사대금채권이 변제되어 소멸하였다는 사실을 주장하여 다툴 수 있다.", true, "▸ 대위소송에서 제3채무자는 채무자의 채권자에 대한 항변권·형성권 등과 같이 권리자에 의한 행사를 필요로 하는 사유로 다툴 수 X, 그러나 피보전채권의 발생원인인 법률행위가 무효라거나 피보전채권이 변제 등으로 소멸했다는 사실로 다툴 수 O, 이 경우 법원은 제3채무자의 주장 고려하여 피보전채권 인정 여부를 직권 심리·판단해야 → 각하 [2013다55300]", "채권자대위권"],
["37.ㄷ", "甲은 비법인사단인 乙과 공사계약을 체결한 후 공사를 완료하여 乙에 대한 공사대금채권을 가지고 있었으나, 乙은 丙에 대한 매매대금채권을 가지고 있는 외에는 달리 재산이 없었다. 이에 甲은 乙에 대한 자신의 위 공사대금채권을 보전하기 위하여 乙을 대위하여 丙에게 위 매매대금의 지급을 청구하는 소를 제기한 후 乙에게 채권자대위권 행사의 통지를 하였다.§甲이 위 소송 도중 乙로부터 丙에 대한 매매대금채권을 양수하여 양수금청구로 소를 교환적으로 변경한 경우에도 당초의 채권자대위소송으로 인한 소멸시효중단의 효과는 소멸하지 않는다.", true, "▸ 대위소송 중 원고가 피대위채권 자체를 양수하여 양수금청구로 교환적 변경해도 당초 대위소송 제기로 인한 시효중단효 유지 ∵ 양 청구는 동일한 소송물의 권리의무 특정승계, 시효중단효는 특정승계인에게 미침, 소송참가·소송인수는 최초 소제기시 소급하여 시효중단효 생김, 권리 위에 잠자는 자 아님 [2010다17284]", "채권자대위권"],
["38.②", "이행인수계약에서 인수인이 그 인수한 채무를 이행하지 않는 경우 채권자는 인수인에 대하여 직접 자신에게 이행할 것을 청구할 수는 없지만, 채권자대위권에 의하여 채무자의 인수인에 대한 청구권을 대위행사할 수는 있다.", true, "▸ 이행인수인은 채무자에 대하여 ‘채권자에게 채무를 이행’할 의무 O, 그러나 채권자에 대해서는 인수인이 채무부담 X, 불이행해도 그에게 채무불이행 X, 채권자는 인수인에게 직접 채무 이행청구 X → 채권자는 채무자의 인수인에 대한 청구권을 대위행사 O ∵ 채무자의 인수인에 대한 이행청구권은 일신전속권 아닌 재산권 O [2008다75072]", "채권자대위권"],
["38.④", "채권자대위소송에서 피보전채권의 소멸시효가 완성되었다 하더라도 제3채무자는 원칙적으로 위 소멸시효 완성의 항변을 원용할 수 없다.", true, "▸ 대위소송에서 제3채무자는 피보전채권의 소멸시효 주장 X ∵ 소멸시효 원용은 직접수익자만 가능하기 때문이기도 [92다35899]", "채권자대위권"],
["38.⑤", "채권자대위권을 행사함에 있어서 채권자가 채무자를 상대로 하여 그 보전되는 청구권에 기한 이행청구의 소를 제기하여 승소판결을 선고받고 그 판결이 확정되면 제3채무자는 그 청구권의 존재를 다툴 수 없다고 보는 것이 원칙이나, 그 청구권의 취득이 강행법규에 위반되어 무효인 경우 제3채무자는 그 존재를 다툴 수 있다.", true, "▸ 채권자가 채무자 상대로 피보전채권 이행청구 승소판결 확정되었다면, 원칙적으로 제3채무자에 대한 관계에서도 증명된 것 O → 그러나 대위소송을 주목적으로 확정판결이나 화해조서 이뤄져서 강행법규 위반 무효라면, 판결·화해가 (준)재심으로 취소되지 않았더라도, 대위소송의 제3채무자에 대한 관계에서는 피보전권리 존재 없는 것 → 제3채무자는 피보전권리 부존재 주장 O, 당사자적격 없는 대위소송은 각하 [2017다228618]", "채권자대위권"],
["39.ㄱ", "채무자가 채권자대위권 행사의 통지를 받은 후에 제3채무자가 채무자의 채무불이행을 이유로 그 채무자와의 매매계약을 해제한 경우, 특별한 사정이 없는 한 제3채무자는 대위권을 행사하는 채권자에게 그 계약해제로써 대항할 수 있다.", true, "▸ 채무불이행으로 법정해제 되게 한 것은 405조 2항의 '처분' 아니므로 통지받은 후 채무 불이행함으로써 약정 자동해제되거나 제3채무자가 법정해제한 경우 제3채무자는 해제로써 채권자에게 대항 O ∵ ⓐ 채무불이행 사실 자체가 채권 소멸시키는 적극적 행위 X, ⓑ 법정해제는 채무불이행에 대한 정당한 법적 대응, ⓒ 채권 압류·가압류된 경우도 채권 발생원인인 기본계약 해제 인정한 판례. 그러나 실질적으로 합의해제이면서 형식적으로만 법정해제처럼 보이거나 외관을 만든 특별한 사정 있다면 처분이므로 대항 X [2011다87235]", "채권자대위권"],
["39.ㄹ", "채권자 甲이 채무자 乙에 대한 금전채권을 보전하기 위하여 제3채무자 丙에 대한 금전채권을 대위행사하는 경우, 甲이 乙에게 대위권 행사사실을 통지하거나 乙이 이를 알게 된 이후에는, 피대위채권에 대한 전부명령은 우선권 있는 채권에 기초한 것이라는 등의 특별한 사정이 없는 한 무효이다.", true, "▸ 대위소송에서 제3채무자로부터 직접 대위채권자에게 금전지급 판결 확정되더라도 변제 등으로 소멸되기 전에는 채무자의 다른 채권자가 (가)압류 O ∵ 채권자는 채무자를 대위하여 피대위채권(집행채권)에 대한 변제를 수령할 뿐이며 자신의 채권에 대한 변제로서 수령하는 것 X → But 채무자가 대위소송 사실 통지 받거나 알게 된 후 피대위채권에 대한 전부명령은 무효 ∵ 민집법 229조 5항 유추적용(전부명령 송달 전에 다른 채권자가 압류·가압류·배당요구한 경우 전부명령은 무효), 추심소송과 공통점 있는 대위소송의 무익화, 대위채권자의 압류·가압류·배당요구 등 채권배당절차 참여할 기회 박탈 [2015다236547]", "채권자대위권"],
["40.ㄴ", "채권자대위권은 채무자의 제3채무자에 대한 권리를 행사하는 것이므로, 제3채무자는 채무자에 대해 가지는 모든 항변사유로 채권자에게 대항할 수 있으나, 채권자는 채무자가 주장할 수 있는 사유의 범위 내에서 주장할 수 있을 뿐 자기와 제3채무자 사이의 독자적인 사정에 기한 사유를 주장할 수는 없다.", true, "▸ 채권자대위권에서 채권자는 채무자 자신이 주장할 사유 범위 내에서 주장할 수 있을 뿐 자기와 제3채무자 사이 독자적인 사정에 기한 사유를 주장할 수 X [2009다4787]", "채권자대위권"],
["41.⑤", "甲은 乙에 대하여 1억 원의 대여금 채권을 가지고 있고, 乙은 丙에 대하여 1억 원의 자동차 매매대금 채권을 가지고 있다. 甲은 乙에 대한 채권을 보전하기 위하여 乙을 대위하여 丙에 대하여 매매대금을 직접 자신에게 지급하라는 소송을 제기하고 이러한 사실을 乙에게 통지하였다.§丙은 乙에게 매매대금 1억 원을 변제하고, 이를 항변사유로 하여 甲에게 대항할 수 있다.", true, "▸ 변제수령은 405조가 금지하는 처분이 아님(채권 소멸시키는 처분행위가 아닌 채권의 이행수령에 불과) → 제3채무자는 '자신의 채무자(乙)에 대한 항변사유'로 채권자(甲)에 대항 O ∵ 채권자대위권은 채무자의 제3채무자에 대한 권리를 행사하는 것이므로 제3채무자는 채무자에 대해 가지는 항변사유로 채권자에게 대항 O [92다35899, 2009다4787]", "채권자대위권"],
["SS4.①", "채권자가 채무자를 상대로 보전되는 청구권에 기한 이행청구의 소를 제기하여 승소판결을 선고받고 확정되었다면 청구권의 발생원인이 되는 사실관계가 제3채무자에 대한 관계에서도 증명되었다고 볼 수 있지만, 그 청구권의 취득이 강행법규에 위반되어 무효라고 볼 수 있는 경우에는 그 피보전권리가 존재하지 않는다고 보아야 한다.", true, "▸ 채권자가 채무자 상대로 피보전채권 이행청구 승소판결 확정되었다면, 원칙적으로 제3채무자에 대한 관계에서도 증명된 것 O → 그러나 대위소송을 주목적으로 확정판결이나 화해조서 이뤄져서 강행법규 위반 무효라면, 판결·화해가 (준)재심으로 취소되지 않았더라도, 대위소송의 제3채무자에 대한 관계에서는 피보전권리 존재 없는 것 → 제3채무자는 피보전권리 부존재 주장 O, 당사자적격 없는 대위소송은 각하 [2017다228618]", "채권자대위권"],
["SS4.②", "채권자대위소송에서 채권의 보전이 필요한지 여부는 사실심 변론종결 당시를 표준으로 판단하여야 한다.", true, "▸ 피보전채권이 금전채권이라면 변론종결 당시 채무자 무자력 사실을 채권자가 주장·입증해야 [75다1086]", "채권자대위권"],
["SS4.⑤", "채무자가 제3채무자에게 채권의 양도를 구할 수 있는 권리를 가지고 있고 채권자가 이를 대위행사하는 경우 제3채무자로 하여금 직접 채권자에게 채권양도절차를 이행하도록 청구할 수 없다.", false, "▸ [AI해설] 채무자가 제3채무자에게 채권양도 구할 권리 있고 채권자가 이를 대위행사할 경우, 금전지급·물건인도·등기 등과 같은 직접청구의 예외와 달리 채무자에게 채권양도절차를 이행하도록 청구해야 O, 직접 '자신에게' 채권양도 이행할 것 청구 X ∵ 채무자에게 이행하면 채무자에게 채권이 귀속되어 별도 급부수령 불필요, 채권자에게 양도하면 채권이 이전되어 대위행사 효과가 채무자 아닌 채권자에게 귀속 [2023다301682]", "채권자대위권"],
["SS5.ㄱ", "분양계약을 해제한 수분양자 甲이 분양대금 반환채권을 보전하기 위해 분양자 乙 주식회사를 대위하여 그로부터 사업 및 대리사무 약정에 따라 분양수입금 등의 자금관리를 위탁받은 수탁자 丙 주식회사를 상대로 사업비 지출 요청권을 행사하려고 한다.§乙이 丙에 대하여 갖는 사업비 지출 요청권은 甲이 보전하려는 권리인 분양대금 반환채권과 밀접하게 관련되어 있다고 할 수 없으므로, 甲이 乙의 사업비 지출 요청권을 대위하여 행사하는 것은 乙의 자유로운 재산관리행위에 대한 부당한 간섭이 된다.", false, "▸ 피보전채권과 피대위권리가 밀접한 관련 있고, 피보전채권의 현실적 이행의 유효·적절한 확보 위해 대위행사가 필요하면(적극적 요건), 채무자 재산관리 자유에 부당한 간섭되는 등 특별한 사정 없는 한(소극적 요건) [2013다71784] → 분양계약을 해제한 수분양자 甲이 분양대금 반환채권을 보전하기 위해 분양자 乙 주식회사를 대위하여 그로부터 분양수입금 등의 자금관리를 위탁받은 수탁자 丙 주식회사를 상대로 사업비 지출 요청권을 행사한 경우, 밀접한 관련 있다고 보았음", "채권자대위권"],
["SS5.ㄴ", "분양계약을 해제한 수분양자 甲이 분양대금 반환채권을 보전하기 위해 분양자 乙 주식회사를 대위하여 그로부터 사업 및 대리사무 약정에 따라 분양수입금 등의 자금관리를 위탁받은 수탁자 丙 주식회사를 상대로 사업비 지출 요청권을 행사하려고 한다.§乙이 甲의 채권자대위권 행사에 반대하더라도 그 대위권 행사는 가능하다.", true, "▸ 채무자의 동의를 얻을 필요는 없고 채무자가 반대한 경우도 대위권 행사 O", "채권자대위권"],
["SS5.ㄷ", "분양계약을 해제한 수분양자 甲이 분양대금 반환채권을 보전하기 위해 분양자 乙 주식회사를 대위하여 그로부터 사업 및 대리사무 약정에 따라 분양수입금 등의 자금관리를 위탁받은 수탁자 丙 주식회사를 상대로 사업비 지출 요청권을 행사하려고 한다.§甲의 채권자대위소송이 적법하다면 乙의 丙에 대한 사업비 지출 요청권에 대한 소멸시효 중단의 효과가 발생한다.", true, "▸ 대위소송으로 피대위권리의 소멸시효가 중단 O", "채권자대위권"],
["SS6.ㄱ", "乙이 甲의 X 토지 위에 Y 건물을 무단으로 신축한 후 이를 丙에게 임대한 후 임대기간이 만료한 경우이다.§乙이 甲의 X 토지 위에 Y 건물을 무단으로 신축한 후 이를 丙에게 임대한 후 임대기간이 만료한 경우, 甲은 乙을 대위하여 丙을 상대로 임대차계약의 해지 및 건물의 인도를 청구할 수 있다.", true, "▸ 물권적 청구권 보전을 위한 채권자대위권 행사 O → 토지 소유권에 근거하여 지상 건물의 임차인 상대로 ‘건물퇴거’ 청구할 수 있더라도, 건물 임대인을 대위하여 임차인에게 임대차 ‘해지통고’ 및 ‘건물인도’청구 O ∵ 퇴거청구와 해지통고·건물인도 대위청구는 요건·효과 달라 퇴거청구 가능성이 보전 필요성 부정되지 않음, 임대차계약 해지권은 행사상 일신전속권 X [2006다82700] 다만 지문에서 ‘기간만료’라고 하고 ‘해지권’을 대위한다고 표현한 것은 부적절함", "채권자대위권"],
["SS6.ㄷ", "乙이 丙에게 설정한 무효인 소유권이전등기청구권의 보전을 위한 가등기를 丁과 유용하기로 합의한 후 그에 따라 丁이 그 가등기 이전의 부기등기를 마치자 乙의 채권자 甲이 丁을 상대로 乙을 대위하여 가등기의 말소를 구한 경우, 丁이 乙과의 유용합의를 이유로 항변하였다면 甲은 그 부기등기 전에 부동산을 가압류한 사실을 주장할 수 있다.", false, "▸ 채권자는 자기와 제3채무자 사이의 독자적 사정에 기한 사유 주장 X → 채무자와 제3채무자 사이 무효 가등기 유용합의에 따른 부기등기 하기 전에 부동산에 가압류 등기한 채권자가 채무자를 대위하여 제3채무자에게 말소 X [2009다4787]", "채권자대위권"],
["SS6.ㄹ", "甲의 금전채무자인 乙이 丙에게 대여금채권을 가지고 있는 경우, 甲이 乙을 대위하여 丙에게 대여금지급청구의 소를 제기하였다면 甲의 乙에 대한 금전채권의 소멸시효는 소 제기에 의하여 중단된다.", false, "▸ 대위소송으로 피대위권리의 소멸시효가 중단 O → 피보전채권 소멸시효 중단 X", "채권자대위권"],
["42.①", "대지 소유자가 자기 소유 대지 상의 건물 소유자에 대하여 가지는 소유권에 기한 방해배제청구권은 채권자대위권의 피보전권리가 될 수 있다.", true, "▸ 물권적 청구권 보전을 위한 채권자대위권 행사 O → 토지 소유권에 근거하여 지상 건물의 임차인 상대로 ‘건물퇴거’ 청구할 수 있더라도, 건물 임대인을 대위하여 임차인에게 임대차 ‘해지통고’ 및 ‘건물인도’청구 O ∵ 퇴거청구와 해지통고·건물인도 대위청구는 요건·효과 달라 퇴거청구 가능성이 보전 필요성 부정되지 않음, 임대차계약 해지권은 행사상 일신전속권 X [2006다82700] → 본 판결에서 유일하게 ‘물권적 청구권’을 피보전권리로 한 채권자대위를 인정하였고, 이에 관한 지문으로는 최초 출제임", "채권자대위권"],
["42.②", "수임인이 위임인에 대하여 가지는 민법 제688조 제2항의 대변제청구권을 보전하기 위하여 위임인의 권리를 대위행사하는 경우, 위임인이 무자력이 아닌 한 보전의 필요성이 인정되지 않는다.", false, "▸ 대변제청구권은 통상의 금전채권과 달라서 수임인이 대변제청구권을 보전하기 위해 위임인의 권리(상계권)를 대위행사함에 위임인의 무자력은 불필요 [2001다52506]", "채권자대위권"],
["42.③", "채권자가 채무자를 상대로 소유권이전등기절차이행의 소를 제기하여 패소 확정판결을 받게 되면, 채권자는 더 이상 채무자에 대하여 동일한 청구원인으로 소유권이전등기청구를 할 수 없으므로 그 소유권이전등기청구권을 보전하기 위한 채권자대위소송은 부적법하다.", true, "▸ [민소] 채권자가 채무자 상대로 ⓐ채권의 이행청구 패소 확정 → 채권자가 ⓐ를 보전하기 위하여 제3채무자에 대해 대위소송하면 보전의 필요성 X → 각하 ∵ 피보전채권 부존재 사실에 기판력 생겨 더 이상 청구 못하므로 [2000다55171]", "채권자대위권"],
["42.④", "미등기 건물의 매수인은 같은 건물의 소유권을 원시취득한 매도인을 대위하여 불법점유자를 상대로 직접 자기에게 인도할 것을 청구할 수 있다.", true, "▸ 물건의 인도나 금전지급은 대위채권자에게 직접 이행할 것을 청구 O", "채권자대위권"],
["43.ㄱ", "공유물분할청구권은 채권자대위권의 목적이 될 수 없다.", false, "▸ [AI해설] 공유물분할청구권은 일신전속권이 아니고 피대위권리 O → 그러나 금전채권 보전을 위한 부동산 공유물분할청구권 대위행사는 보전 필요성 X ∵ 책임재산 보전과 직접적 관련 X, 현실적 이행 유효·적절 확보 필요 X, 부당한 간섭 → 채무자 지분이 다른 지분과 함께 공동근저당 목적이고 피담보채권이 채무자 지분 초과하여 채무자 지분만 경매하면 남을 가망이 없어 경매 취소되지만(민집법 102조) 공유물분할 방법으로 전부 경매하면 368조 1항 의해 채무자 지분에서 피담보채권 분담액 변제하고 남을 가망이 있는 경우라도 마찬가지 [2018다879]", "채권자대위권"],
["43.ㄴ", "임차인의 보증금반환채권에 대해 질권을 설정받은 채권자는 제3채무자인 임대인에 대한 직접청구권을 보전하기 위하여 임대인을 대위하여 임차인에게 임대차종료를 원인으로 한 인도청구권을 행사할 수 있다.", true, "▸ 임대차보증금반환채권의 근질권자가 갱신 없는 임대차 종료 주장하며 임대인을 대위하여 임차인 상대로 아파트 인도청구 → 임대인은 갱신거절 의사표시 없고 갱신 존속 중임을 전제로 임차인에게 증액보증금 납부 청구하여 임차인이 이행했다면, 임대인은 갱신거절 주장 X → 근질권설정계약상 ‘임대차계약 갱신은 채권자 동의 필요’ 규정은 채권자와 제3채무자 사이 독자적 사정이므로 주장 X [2020다223781]", "채권자대위권"],
["43.ㄷ", "채권자가 채권자대위권을 행사하는 경우, 채권자가 채무자를 상대로 보전되는 청구권에 기한 이행청구의 소를 제기하여 승소판결이 확정되었다면 특별한 사정이 없는 한 그 청구권의 발생원인이 되는 사실관계가 제3채무자에 대한 관계에서도 증명되었다고 볼 수 있다.", true, "▸ 채권자가 채무자 상대로 피보전채권 이행청구 승소판결 확정되었다면, 원칙적으로 제3채무자에 대한 관계에서도 증명된 것 O → 그러나 대위소송을 주목적으로 확정판결이나 화해조서 이뤄져서 강행법규 위반 무효라면, 판결·화해가 (준)재심으로 취소되지 않았더라도, 대위소송의 제3채무자에 대한 관계에서는 피보전권리 존재 없는 것이고, 제3채무자는 피보전권리 부존재 주장 O, 당사자적격 없는 대위소송은 각하 [2017다228618]", "채권자대위권"],
["43.ㄹ", "채권자가 채권자대위소송을 제기한 경우, 제3채무자는 채권자의 채무자에 대한 권리의 발생원인이 된 법률행위가 무효라거나 위 권리가 변제 등으로 소멸하였다는 등의 사실을 주장하여 채권자의 채무자에 대한 권리가 인정되는지 여부를 다툴 수 있다.", true, "▸ [AI해설] 대위소송에서 제3채무자는 채무자의 채권자에 대한 항변권·형성권 등과 같이 권리자에 의한 행사를 필요로 하는 사유로는 다툴 수 X. 그러나 피보전채권의 발생원인인 법률행위가 무효라거나 피보전채권이 변제 등으로 소멸하였다는 사실로는 다툴 수 O — 이 경우 법원은 제3채무자의 주장을 고려하여 피보전채권 인정 여부를 직권 심리·판단해야 → 각하 [2013다55300]", "채권자대위권"],
["44.ㄱ", "甲은 乙에게 X 부동산을 매도하였고, 乙은 丙에게 이를 다시 전매하였다. 丙은 乙을 대위하여 甲을 상대로 乙에 대한 소유권이전등기절차의 이행을 구하는 소(이하 ‘대위소송’이라고 한다)를 제기하였다.§甲은 乙이 丙으로부터 아직 매매대금을 지급받지 못하였음을 들어 다툴 수는 없지만, 乙과 丙 사이의 매매계약이 무효임을 들어 피보전채권의 부존재를 다툴 수는 있다.", false, "▸ [AI해설] 대위소송에서 제3채무자(甲)는 채무자(乙)의 채권자(丙)에 대한 항변권·형성권(乙이 丙에게 대금미수령을 이유로 매매계약 해제하는 것)과 같이 권리자에 의한 행사를 필요로 하는 사유로는 다툴 수 X. 그러나 乙과 丙 사이 매매계약이 무효라거나 피보전채권이 변제 등으로 소멸하였다는 사실로는 다툴 수 O [2013다55300]", "채권자대위권"],
["44.ㄴ", "甲은 乙에게 X 부동산을 매도하였고, 乙은 丙에게 이를 다시 전매하였다. 丙은 乙을 대위하여 甲을 상대로 乙에 대한 소유권이전등기절차의 이행을 구하는 소(이하 ‘대위소송’이라고 한다)를 제기하였다.§丙이 대위소송을 제기한 뒤 그 사실을 乙에게 통지하였다면, 그 후 甲이 乙에게 소유권이전등기를 경료하였더라도 이를 丙에게 대항할 수 없다.", false, "▸ 채권자가 채권자대위권 행사 사실을 채무자에게 통지하거나 채무자가 안 후에는 채무자는 피대위권리를 처분할 수 없으나 변제 수령은 처분행위 X → 甲이 乙에게 소유권이전등기를 경료한 것은 변제수령에 해당하여 처분행위 X, 丙에게 대항 O [90다9407]", "채권자대위권"],
["44.ㄹ", "甲은 乙에게 X 부동산을 매도하였고, 乙은 丙에게 이를 다시 전매하였다. 丙은 乙을 대위하여 甲을 상대로 乙에 대한 소유권이전등기절차의 이행을 구하는 소(이하 ‘대위소송’이라고 한다)를 제기하였다.§丙이 乙을 대위하여 甲을 상대로 X 부동산의 처분금지가처분을 하였다면, 그 후 甲이 乙에게 소유권이전등기를 경료하였더라도 이를 丙에게 대항할 수 없다.", false, "▸ [집행법] 부동산 전득자(채권자)가 양수인 겸 전매인(채무자)에 대한 소유권이전등기청구권을 보전하기 위하여 양수인을 대위하여 양도인(제3채무자) 상대로 처분금지가처분결정 받아 등기 경료 → 가처분 이후 양도인이 양수인에게 소유권이전등기 마쳐주고 이에 터 잡아 다른 등기 마쳐도 그 등기는 위 가처분 효력에 위배되지 X ∵ 위 가처분은 전득자가 자신의 양수인에 대한 소이등청구권을 보전하기 위해 양도인이 양수인 이외의 자에게 소유권이전 등 처분행위 못하게 할 목적, 피보전권리는 양수인의 양도인에 대한 소이등청구권 O, 전득자의 양수인에 대한 소이등청구권은 포함 X, 제3자 중에 양수인은 포함 X [87다카3155, 93다42665]", "채권자대위권"],
["45.①", "채권자대위소송에서 피대위자인 채무자가 이미 사망한 사람인 경우 그를 피대위자로 한 소는 당사자적격이 없어 부적법하다.", true, "▸ 피대위자인 채무자가 실존인물 아니거나 사망한 사람이면 대위소송은 당사자적격 없어 부적법 각하 ∵ 피보전채권 X [2020다300893] → 국가를 상대로 토지소유권확인 구하는 대위소송에서 채무자(소유자) 사망하고 그 상속인은 알 수 없었던 사안", "채권자대위권"],
["45.⑤", "채권자대위소송에서 제3채무자로 하여금 직접 대위채권자에게 금전의 지급을 명하는 판결이 확정되었더라도 채권자대위소송에서 확정된 판결에 따라 대위채권자가 제3채무자로부터 지급받을 채권에 대한 대위채권자의 채권자가 받은 압류명령은 무효이다.", true, "▸ 금전채권 보전하기 위해 채무자의 금전채권을 대위행사하는 채권자는 제3채무자로 하여금 직접 대위채권자 자신에게 지급의무 이행하도록 청구할 수 있고 제3채무자로부터 변제 수령할 수 O → 대위소송에서 제3채무자로부터 직접 금전 지급받는 판결 확정되어도 (대위채권자의 채권자가) 이러한 채권에 대하여 받은 압류명령은 무효 ∵ 피대위채권이 대위채권자에게 이전·귀속 X, 추심권능 내지 변제수령권능은 자체로서 독립적 처분·환가 X, 압류 X [2015다236547]", "채권자대위권"],
["46.ㄷ", "甲은 乙에 대하여 대여금채권을 가지고 있고, 乙은 丙에 대하여 매매대금채권을 가지고 있다. 채무초과상태인 乙은 매매대금채권의 변제기가 도래하였음에도 불구하고 丙에 대하여 그 채권을 추심하지 않고 있다. 甲은 乙을 대위하여 丙을 상대로 매매대금의 지급을 구하는 소를 제기하였다.§甲이 매매대금채권의 대위행사 사실을 乙에게 통지하지 않았더라도 乙이 그 사실을 알게 되었다면 丙은 乙에 대한 매매대금 채무의 변제를 이유로 甲의 청구에 대항할 수 없다.", false, "▸ 채권자가 채권자대위권 행사 사실을 채무자에게 통지하거나 채무자가 안 후에는 채무자는 피대위권리를 처분할 수 없으나 변제 수령은 처분행위 X → 대위행사 사실을 통지하지 않았더라도 乙이 그 사실을 알게 된 경우에도 동일하게 피대위채권에 대한 변제 수령(丙이 乙에게 매매대금 변제)은 처분행위 X, 甲에게 대항 O [90다9407]", "채권자대위권"],
["47.ㄱ", "甲은 乙에 대하여 1억 원의 금전채권을 가지고 있었는데, 乙은 자기의 유일한 재산인 X 부동산을 丙에게 매도하고 소유권이전등기까지 마쳐 주었다. 그 후 甲은 丙을 상대로 X 부동산 매매계약에 대한 사해행위취소 및 원상회복을 구하는 소를 제기하였다. (각 지문은 독립적)§甲의 丙에 대한 사해행위취소 및 원상회복청구 소송에서 승소판결이 확정된 후 乙에게 소유권이전등기 명의가 회복되기 전 甲의 乙에 대한 금전채권이 소멸한 경우, 丙은 청구이의의 소로써 위 확정판결의 집행력의 배제를 구할 수 없다.", false, "▸ 사해취소·원상회복 확정되어도 피보전채권 소멸하면 청구이의 O [2015다224469]", "채권자취소권"],
["47.ㄷ", "甲은 乙에 대하여 1억 원의 금전채권을 가지고 있었는데, 乙은 자기의 유일한 재산인 X 부동산을 丙에게 매도하고 소유권이전등기까지 마쳐 주었다. 그 후 甲은 丙을 상대로 X 부동산 매매계약에 대한 사해행위취소 및 원상회복을 구하는 소를 제기하였다. (각 지문은 독립적)§甲의 丙에 대한 사해행위취소 및 원상회복청구 소송에서 승소판결이 확정되어 乙에게 소유권이전등기 명의가 회복된 후 乙이 다시 X 부동산을 丁에게 매도하여 소유권이전등기를 마쳐 준 경우, 乙이 X 부동산을 丙에게 매도한 후 乙에 대한 금전채권을 가지게 된 戊는 丁 명의의 소유권이전등기 말소를 청구할 수 있다.", false, "▸ 채무자가 사해행위취소로 등기 회복한 부동산을 제3자에게 처분하더라도 ‘무권리자의 처분’으로 무효, 제3자 혹은 순차로 마쳐진 소유권이전등기 등은 모두 원인무효 → 취소채권자나 407조로 효력을 받는 채권자는 ‘강제집행’을 하여 원인무효 등기 말소청구 O [2015다217980] 사해행위 이후 채권을 취득한 채권자는 407조의 채권자 X → 배당 제외 [2009다18502] → 원상회복된 재산을 채무자가 처분하면 취소채권자나 407조의 채권자가 말소를 구할 수 있는데, 사안의 戊는 407조 효력을 받는 채권자가 아니어서 말소 불가", "채권자취소권"],
["47.ㄹ", "甲은 乙에 대하여 1억 원의 금전채권을 가지고 있었는데, 乙은 자기의 유일한 재산인 X 부동산을 丙에게 매도하고 소유권이전등기까지 마쳐 주었다. 그 후 甲은 丙을 상대로 X 부동산 매매계약에 대한 사해행위취소 및 원상회복을 구하는 소를 제기하였다. (각 지문은 독립적)§丙의 일반채권자인 A가 丙 명의로 X 부동산에 관한 소유권이전등기가 마쳐진 것을 기화로 X 부동산을 압류하고 X 부동산에 관하여 진행된 경매절차에서 배당을 받았더라도, 이후 甲이 丙에 대하여 사해행위취소 및 원상회복으로서 가액배상의 확정판결을 받았다면 A는 가액배상액의 범위 내에서 甲에게 위 배당금을 부당이득으로 반환하여야 한다.", false, "▸ 사해행위로 취득한 부동산을 가압류한 수익자의 채권자에게는 사해행위취소 판결의 효력 X → 가압류한 자는 강제집행 O [89카35421] → 상대적 효력. 채무자 부동산이 증여 등 사해행위로 수익자에게 소유권 이전된 후 경매 실행으로 배당절차 진행된 경우, 부동산 가액 중 수익자의 채권자가 배당 참여하여 취득한 배당액 상당은 사해행위 당시 공동담보 O이지만 가액배상 등 원상회복에서 공제 X → 수익자의 채권자가 채무자의 일반채권자 지위를 겸해도 마찬가지 [2022다244928, 2004다49532] → 수익자의 채권자도 별개로 배당받을 수 있다(상대적 효력)이므로, 지문과 같은 부당이득반환은 성립할 수 없음", "채권자취소권"],
["48.①", "사해행위로 부동산 소유권이 이전된 후 그 부동산에 관하여 제3자가 저당권이나 지상권 등의 권리를 취득한 경우 채권자는 수익자를 상대로 사해행위취소 및 채무자에 대한 소유권이전등기절차의 이행을 청구할 수 있다.", true, "▸ 사해행위 ‘후’ 근저당권 설정한 사안은 피담보채권액을 공제 X, 가액 전부 배상 O 이 경우 채권자 스스로 불이익 감수하는 원물반환도 O [2003다40286]", "채권자취소권"],
["48.②", "甲이 2023. 7.경 자신의 명의신탁약정에 따라 명의신탁 사실을 알지 못하는 X 부동산의 소유자 丙과 X 부동산에 대한 매매계약을 체결하고 乙 명의로 소유권이전등기가 경료된 후 채무초과 상태에 있는 甲이 실질적인 당사자가 되어 X 부동산을 제3자에게 매도하였다면, 甲의 매도행위는 甲의 일반채권자들에 대한 사해행위가 된다.", true, "▸ 신탁자가 부부간 유효한 명의신탁약정을 해지함을 전제로 다시 제3자에게 처분하며 3자간 합의로 중간생략하고 곧바로 제3자에게 등기 마쳐준 경우, 사해행위 O ∵ 명의신탁 해지로 인한 신탁자의 소유권이전등기청구권도 책임재산인데, 제3자에게 등기함으로써 소멸하였으므로 [2015다56086]", "채권자취소권"],
["48.③", "채무자가 그 소유의 유일한 재산인 부동산에 관하여 매매예약에 따른 예약완결권의 제척기간 경과가 임박한 상태에서 제척기간을 연장하기 위하여 새로 매매예약을 하는 행위는 채권자취소권의 대상인 사해행위가 될 수 있다.", true, "▸ 유일한 재산에 관하여 매매예약의 예약완결권 제척기간 경과 임박하자 제척기간 연장 위한 새로운 매매예약 O ∵ 채무자가 부담하지 않아도 될 채무를 새롭게 부담하게 되므로 [2017다247190]", "채권자취소권"],
["48.④", "사해행위가 있은 후 채권자가 취소원인이 있음을 알면서 피보전채권을 양도하고 양수인이 그 채권을 보전하기 위하여 채권자취소권을 행사하는 경우에는, 그 채권의 양도인이 취소원인을 안 날을 기준으로 제척기간 도과 여부를 판단하여야 한다.", true, "▸ 사해행위 후 채권자가 취소원인 알면서 피보전채권 양도하고 양수인이 채권자취소권을 행사할 경우 제척기간은 ‘양도인’이 안 날 기준 [2016다272311]", "채권자취소권"],
["48.⑤", "乙이 2023. 7.경 친구인 甲과 체결한 명의신탁약정에 따라 명의신탁 사실을 알지 못하는 X 부동산의 소유자 丙과 X 부동산에 대한 매매계약을 체결하고 乙 명의로 소유권이전등기가 경료된 후 채무초과 상태에 있는 甲이 실질적인 당사자가 되어 X 부동산을 제3자에게 매도하였다면, 甲의 매도행위는 甲의 일반채권자에 대한 사해행위가 된다.", false, "▸ 상대방 선의의 계약명의신탁에서, 무자력의 신탁자가 실질적 당사자가 되어 제3자에게 매도하고 등기 넘겨도 사해행위 X ∵ 신탁자는 수탁자에게 부당이득반환채권만 있고, 부동산은 신탁자 책임재산 X, 책임재산 감소 초래 X [2011다89903]", "채권자취소권"],
["49.ㄱ", "2022. 6. 22. 甲은 채무초과 상태에서 그 소유의 유일한 재산인 X 부동산을 乙에게 매도하고, 2022. 8. 22. 소유권이전등기를 경료해 주었다. 甲의 채권자 丙은 사해행위취소의 소를 적법하게 제기하였다.§X 부동산에 관하여 채권자를 丁, 채무자를 甲, 채권최고액을 3억 9천만 원으로 하는 근저당권이 설정되어 있었던 경우, 매매 당시 X 부동산의 가액은 3억 원, 피담보채권액은 3억 4천만 원일 때 甲의 매매행위는 사해행위에 해당한다.", false, "▸ 저당권 설정된 부동산 매각할 경우 사해행위는 부동산 시가에서 채권최고액이 아닌 실제 발생해 있는 피담보채권액을 공제한 잔액 범위 내에서 성립 → 만일 피담보채권액이 부동산 가액을 초과한다면 부동산양도는 사해행위 X [2000다42618]", "채권자취소권"],
["49.ㄴ", "2022. 6. 22. 甲은 채무초과 상태에서 그 소유의 유일한 재산인 X 부동산을 乙에게 매도하고, 2022. 8. 22. 소유권이전등기를 경료해 주었다. 甲의 채권자 丙은 사해행위취소의 소를 적법하게 제기하였다.§X 부동산에 근저당권이 설정되어 있었던 상태에서 사해행위 후 채권 전액을 변제하여 근저당권설정등기가 말소된 경우, 丙은 가액의 배상을 구할 수 있을 뿐이고 그 가액산정은 사해행위 당시를 기준으로 하여야 한다.", false, "▸ 저당권 설정된 부동산에 관한 사해행위 있은 후 수익자 또는 제3자 등의 변제로 저당권설정등기가 말소된 경우, 부동산 가액에서 저당권의 피담보채권액을 공제한 잔액의 한도에서 일부취소 및 가액배상 명해야 ∵ 부동산 자체의 회복 명하는 것은 당초 일반채권자의 공동담보가 아닌 부분까지 회복시켜 공평에 반하므로 [96다23207, 2002다41589] → 이 경우 부동산 가액 산정은 사실심 변론종결 기준 [97다6711]", "채권자취소권"],
["50.ㄱ", "乙은 甲에 대하여 1억 원의 대여금채권을 가지고 있다. 甲은 자신의 유일한 재산인 X 토지에 대하여 채권자 丙 명의로 근저당권을 설정해 주었다. 乙은 甲에 대한 대여금채권을 피보전채권으로 하여 丙을 상대로 甲과 丙 사이에 체결된 근저당권설정계약을 취소하는 사해행위 취소의 소를 제기하였다.§乙이 제척기간 내에 사해행위 취소의 소를 제기하였다면, 제척기간이 경과한 후에 피보전채권을 위 대여금채권에서 乙의 甲에 대한 부당이득급반환채권으로 변경할 수 있다.", true, "▸ [민소] 소송물은 채권자 고유의 채권자취소권 → 피보전채권의 교환·추가는 공격방법의 변경에 불과하고 소송물 변경 X [2001다13532] → 피보전채권을 늦게 추가한다고 하여 제척기간 도과한 것 아님", "채권자취소권"],
["50.ㄹ", "乙은 甲에 대하여 1억 원의 대여금채권을 가지고 있다. 甲은 자신의 유일한 재산인 X 토지에 대하여 채권자 丙 명의로 근저당권을 설정해 주었다. 乙은 甲에 대한 대여금채권을 피보전채권으로 하여 丙을 상대로 甲과 丙 사이에 체결된 근저당권설정계약을 취소하는 사해행위 취소의 소를 제기하였다.§乙은 사해행위 당시 甲이 공동담보 부족으로 인하여 일반채권자가 채권변제를 받기 어렵게 될 위험이 생긴다는 사실을 인식하였다는 사실만 증명하면 족하고, 특정 채권자를 해한다는 甲의 인식까지 증명하여야 하는 것은 아니다.", true, "▸ 수익자의 악의는 추정되고, 채무자 무자력 인식(일반채권자 해함) + 특정 채권자 해할 인식은 불필요 [97다57320]", "채권자취소권"],
["50.ㅁ", "乙은 甲에 대하여 1억 원의 대여금채권을 가지고 있다. 甲은 자신의 유일한 재산인 X 토지에 대하여 채권자 丙 명의로 근저당권을 설정해 주었다. 乙은 甲에 대한 대여금채권을 피보전채권으로 하여 丙을 상대로 甲과 丙 사이에 체결된 근저당권설정계약을 취소하는 사해행위 취소의 소를 제기하였다.§처분행위 당시에는 채권자를 해하는 것이었더라도 그 후 甲이 자력을 회복하거나 채무가 감소하여 사해행위 취소소송의 사실심 변론종결시에 채권자를 해하지 않게 되었다면, 甲의 당사자적격이 없으므로 법원은 사해행위 취소의 소를 각하하여야 한다.", false, "▸ 처분행위 당시 무자력이었으나 그 후 채무자가 자력 회복하여 사실심 변론종결시에 해하지 않게 된 사정변경은 채권자취소소송의 피고가 입증해야 → 자력회복되면 보전의 필요성 X, 채권자취소권 소멸 [2007다54849] → 기각", "채권자취소권"],
["51.①", "사해행위인 매매예약에 기하여 수익자 앞으로 가등기를 마친 후 전득자 앞으로 가등기 이전의 부기등기를 마치고 나아가 가등기에 기한 본등기까지 마친 경우, 수익자는 가등기 및 본등기에 대한 말소청구소송에서 피고적격은 없더라도 사해행위취소의 상대방은 될 수 있다.", true, "▸ 사해행위인 매매예약으로 수익자 앞으로 가등기 마친 후, 전득자에게 가등기 이전의 부기등기 마치고 나아가 본등기 마친 경우 → 채권자는 수익자를 상대로 사해행위인 매매예약의 취소 및 가액배상 O ∵ 부기등기를 통해 수익자의 지위가 소멸하는 것은 X, 말소청구소송에서 가등기·본등기의 피고적격이 전득자에게만 있다고 하여 수익자가 가액배상 의무까지 없는 것은 X [2012다952]", "채권자취소권"],
["51.②", "채무자가 제3자의 채무를 담보하기 위한 근저당권이 설정되어 있는 부동산을 양도한 경우, 근저당권의 피담보채권액과 채권최고액이 모두 부동산 가격을 초과하는 때에는 부동산의 양도가 사해행위에 해당하지 않는다.", true, "▸ 저당권 설정된 부동산 매각할 경우 사해행위는 부동산 시가에서 채권최고액이 아닌 실제 발생해 있는 피담보채권액을 공제한 잔액 범위 내에서 성립 → 만일 피담보채권액이 부동산 가액을 초과한다면 부동산양도는 사해행위 X [2000다42618]", "채권자취소권"],
["51.⑤", "채무초과 상태의 채무자가 수익자에게 자신의 책임재산을 이전해 주기 위하여, 수익자가 원고가 되어 채무자를 상대로 제기한 부동산 소유권이전등기 소송에서 자백간주 확정판결을 받아 수익자 앞으로 소유권이전등기를 마친 경우, 위 확정판결을 통해 마쳐진 소유권이전등기가 사해행위 취소로 인한 원상회복으로써 말소된다고 하더라도, 그것이 확정판결의 효력에 반하거나 모순되는 것이라고는 할 수 없다.", true, "▸ [민소] 무자력인 채무자가 수익자와 합의하여 수익자가 제기한 소송에서 자백하여 패소판결 혹은 그러한 취지 화해권고결정을 받아 확정시키고 수익자 앞으로 등기 경료 → 일련의 행위 실질적 원인인 이전합의가 사해행위 → 수익자 앞으로 확정판결 통해 마쳐진 소유권이전등기에 대해 채권자가 사해행위취소 및 원상회복으로 말소등기 청구해도 전소 확정판결 기판력 저촉 X ∵ 사해행위취소판결은 수익자가 채권자에 대해 그로 인한 원상회복 의무 부담할 뿐, 채권자와 채무자 사이에서 취소로 인한 법률관계 형성 X (상대적 효력) [2016다204783]", "채권자취소권"],
["52.ㄴ", "甲은 乙에 대하여 1억 원의 금전채권을 가지고 있었는데, 乙은 자기의 유일한 재산인 X부동산을 丙에게 매도하고 소유권이전등기까지 마쳐주었고, 그 후 X부동산에 관하여 A가 저당권을 취득하였다. 甲이 丙을 상대로 사해행위취소 및 원상회복을 구하는 소를 제기한 경우§甲이 원상회복의 방법으로 가액배상 대신 丙을 상대로 丙 명의의 소유권이전등기의 말소를 구하거나, 乙 앞으로 직접 소유권이전등기절차를 이행할 것을 구할 수는 없다.", false, "▸ 채권자 스스로 위험·불이익 감수하면서 원물반환 O → 이 경우 수익자 등기의 말소 혹은 채무자 앞 직접 소유권이전등기 O [2000다57139]", "채권자취소권"],
["52.ㄹ", "甲은 乙에 대하여 1억 원의 금전채권을 가지고 있었는데, 乙은 자기의 유일한 재산인 X부동산을 丙에게 매도하고 소유권이전등기까지 마쳐주었고, 그 후 X부동산에 관하여 A가 저당권을 취득하였다. 甲이 丙을 상대로 사해행위취소 및 원상회복을 구하는 소를 제기한 경우§甲이 일단 사해행위취소 및 원상회복으로서 丙 명의의 등기의 말소를 청구하여 승소판결이 확정되었다면, 어떠한 사유로 丙명의의 등기를 말소하는 것이 불가능하게 되었다고 하더라도 다시 丙을 상대로 원상회복청구권을 행사하여 가액배상을 청구하거나 원물반환으로서 乙 앞으로 직접 소유권이전등기절차를 이행할 것을 청구할 수는 없다.", true, "▸ 채권자가 일단 사해행위취소 및 원상회복 청구 승소확정된 경우라면, 그 후 어떤 사유로 원상회복 목적 달성 불가능해도 다시 원상회복으로 가액배상 청구 X → 각하 ∵ 권리보호이익 X, 원물반환과 가액배상 중의 선택은 사실심 변론종결시에 둘 중 하나로 확정 [2004다54978]", "채권자취소권"],
["53.ㄱ", "사해행위의 목적물인 부동산에 관하여 우선변제권 있는 임차인이 있는 경우에는 부동산 가액 중 임차보증금 해당 부분은 일반 채권자의 공동담보에 제공되었다고 볼 수 없으므로, 임대차계약의 체결시기와 상관없이 그 임차보증금 반환채권액은 가액반환의 범위에서 공제되어야 한다.", false, "▸ 사해행위 ‘이전’에 임대차계약 체결되었고 임차보증금 우선변제권 있다면 이처럼 임차보증금액 공제 O → 그러나 사해행위 ‘이후’ 채무자가 부동산 임대했다면 공제 X ∵ 부동산 가액 중 임차보증금 해당 부분도 공동담보였음 [2018다215756]", "채권자취소권"],
["53.ㄴ", "채무자 소유의 유일한 재산인 부동산에 관한 매매예약완결권이 제척기간 경과가 임박하여 소멸할 예정인 상태에서, 채무자가 제척기간을 연장하기 위하여 새로 매매예약을 하는 행위는 기존에 부담하는 채무 외에 추가로 채무를 부담하는 것이 아니므로 사해행위에 해당하지 아니한다.", false, "▸ 유일한 재산에 관하여 매매예약의 예약완결권 제척기간 경과 임박하자 제척기간 연장 위한 새로운 매매예약 O ∵ 채무자가 부담하지 않아도 될 채무를 새롭게 부담하게 되므로 [2017다247190]", "채권자취소권"],
["53.ㄷ", "채무초과상태에 있는 채무자가 상속을 포기하는 것은 사해행위취소의 대상이 되지 않고, 유증을 포기하는 것도 직접적으로 채무자의 일반재산을 감소시키지 아니하므로 사해행위취소의 대상이 되지 아니한다.", true, "▸ 가족법상 행위는 사해행위 X → 상속의 승인·포기 X (∵ 순수한 재산적 행위는 X, 인정하면 법률관계 복잡, 재산 현재보다 악화는 아님), 유증의 포기 X (∵ 1074조는 유언자 사망 후 언제든 유증의 승인·포기 자유롭고 소급효 인정, 재산 현재보다 악화는 아님) [2011다29307, 2018다260855]", "채권자취소권"],
["53.ㄹ", "신축건물의 도급인이 「민법」 제666조가 정한 수급인의 저당권설정청구권의 행사에 따라 공사대금채무의 담보로 그 건물에 저당권을 설정하는 행위는 특별한 사정이 없는 한 사해행위에 해당하지 아니하고, 수급인으로부터 공사대금채권을 양수받은 자의 저당권설정청구에 의하여 신축건물의 도급인이 그 건물에 저당권을 설정하는 행위 역시 다른 특별한 사정이 없는 한 사해행위에 해당하지 아니한다.", true, "▸ [2015다19827] [AI해설] 신축건물의 도급인이 민법 제666조가 정한 수급인의 저당권설정청구권 행사에 따라 공사대금채무의 담보로 그 건물에 저당권을 설정하는 행위는, 수급인의 청구권에 기초한 것으로서 기존 채무의 이행에 해당하므로 특별한 사정이 없는 한 사해행위에 해당하지 않음. 또한 수급인으로부터 공사대금채권을 양수받은 자의 저당권설정청구에 의하여 신축건물의 도급인이 그 건물에 저당권을 설정하는 행위 역시 다른 특별한 사정이 없는 한 사해행위에 해당하지 않음", "채권자취소권"],
["54.④", "수인의 채권자 중 1인이 채무자의 재산처분 행위의 취소를 구하는 사해행위 취소의 소를 제기하였는데 그 소송 계속 중 다른 채권자가 채무자의 동일한 재산처분 행위의 취소를 구하는 사해행위 취소의 소를 제기하더라도, 이는 중복제소에 해당하지 않는다.", true, "▸ [민소] 여러 채권자가 동시·이시에 사해행위취소 구해도 중복제소 X, 한 채권자가 승소판결 확정되었어도 그 후 다른 채권자의 동일한 청구는 권리보호이익 有 ∵ 채권자취소권 요건 갖춘 각 채권자는 ‘고유의 권리’로서 사해행위취소·원상회복 구할 수 있으므로 → 이미 원상회복까지 마친 경우 비로소 중첩 범위에 권리보호이익 無 (=채무자·수익자 사이에 사해행위가 ‘해제’되어 원상회복 마친 경우도 마찬가지) [2005다51457]", "채권자취소권"],
["55.⑤", "甲에 대하여 대여금채무를 부담하고 있는 乙이 그의 유일한 소유 재산인 부동산을 그의 아들인 丙에게 매도하고, 그 후 丙은 이를 다시 丁에게 매도한 후 각 소유권이전등기가 경료되었다.§甲은 丙 및 丁을 상대로 사해행위 취소 및 원상회복을 구함에 있어 사해행위의 취소만을 먼저 청구한 다음 원상회복을 나중에 청구할 수도 있는데, 이 경우 사해행위 취소청구가 「민법」 제406조 제2항에 정하여진 기간 안에 제기되었다면 원상회복의 청구는 그 기간이 지난 뒤에도 할 수 있다.", true, "▸ 사해행위 취소만을 먼저 기간 내 제기하였다면 원상회복은 기간 경과하여 제기해도 적법 O [2001다14108]", "채권자취소권"],
["56.②", "乙 은행은 甲과 丙 사이의 위 매매계약이 통정허위표시로서 무효인 경우라도 채권자취소권을 행사하여 위 계약의 취소를 구할 수 있다.", true, "▸ 통정허위표시로서 무효인 법률행위도 채권자취소 O [97다50985]", "채권자취소권"],
["SS7.①", "甲과 그 배우자인 乙이 X아파트를 각 1/2 지분씩 공동소유하고 있었는데, 甲과 乙은 위 각 지분에 관하여 근저당권자 丙 앞으로 채무자 甲으로 된 근저당권설정등기를 마쳐주었다. 이후 甲이 乙에게 자신의 X아파트 지분을 증여하고 乙 앞으로 지분소유권이전등기를 마치자, 甲의 채권자 丁이 甲과 乙 사이에 체결된 X아파트 지분에 관한 증여계약이 사해행위에 해당한다고 주장하면서 乙을 상대로 증여계약의 취소와 원상회복 청구를 하였다. 甲과 乙 사이의 증여계약은 사해행위에 해당한다.§丁은 원상회복 청구로서 乙을 상대로 甲 지분의 이전등기말소를 청구할 수도 있고, 乙로 하여금 甲 앞으로 직접 지분소유권의 이전등기절차를 이행할 것을 청구할 수도 있다.", true, "▸ 말소등기와 진명소이등은 소송물이 동일하며, 실제로 99다53704 판결은 수익자에 대하여 말소청구나 진명소이등청구 모두 가능하다고 판시하였음(로민정 정변멘트)", "채권자취소권"],
["SS7.③", "甲과 그 배우자인 乙이 X아파트를 각 1/2 지분씩 공동소유하고 있었는데, 甲과 乙은 위 각 지분에 관하여 근저당권자 丙 앞으로 채무자 甲으로 된 근저당권설정등기를 마쳐주었다. 이후 甲이 乙에게 자신의 X아파트 지분을 증여하고 乙 앞으로 지분소유권이전등기를 마치자, 甲의 채권자 丁이 甲과 乙 사이에 체결된 X아파트 지분에 관한 증여계약이 사해행위에 해당한다고 주장하면서 乙을 상대로 증여계약의 취소와 원상회복 청구를 하였다. 甲과 乙 사이의 증여계약은 사해행위에 해당한다.§丙의 담보권실행으로 X아파트에 경매절차가 진행되어 乙에게 지급될 배당금(잉여금)이 있는 경우라면, 丁은 乙의 배당금지급청구권에 대하여 지급금지가처분을 마친 다음 원상회복 청구로서 甲 앞으로 甲 지분에 해당하는 배당금채권을 양도할 것과 그 채권양도의 통지를 청구할 수 있다.", true, "▸ 甲의 乙에 대한 1/2 지분 소유권을 이전하는 증여가 사해행위인 경우, 경매절차에서 乙이 ‘소유자’로서 배당받는 배당금에 대해서는 甲의 몫인 1/2을 책임재산으로 회복해야 함 → 배당금채권양도도 원상회복으로서 배당금액배상으로 [참고판례] 근저당권설정계약을 사해행위 취소한 경우 경매 진행 및 근저당권등기말소되었다면, 가액배상 받아야 (원물반환 불가능) → ⓐ 배당 종료되고 수익자가 배당금 수령했다면 배당금반환 명함, ⓑ 배당표 확정되었으나 지급금지가처분 등으로 수익자 배당금 지급받지 못했다면 배당금지급채권의 양도 및 채권양도 통지 명함, ⓒ 채권자가 배당기일 출석하여 배당에 이의했다면 채권자는 사해행위취소의 소와 원상회복으로서 배당이의의 소를 병합하여 제기 O [2003다6200]", "채권자취소권"],
["SS7.④", "甲과 그 배우자인 乙이 X아파트를 각 1/2 지분씩 공동소유하고 있었는데, 甲과 乙은 위 각 지분에 관하여 근저당권자 丙 앞으로 채무자 甲으로 된 근저당권설정등기를 마쳐주었다. 이후 甲이 乙에게 자신의 X아파트 지분을 증여하고 乙 앞으로 지분소유권이전등기를 마치자, 甲의 채권자 丁이 甲과 乙 사이에 체결된 X아파트 지분에 관한 증여계약이 사해행위에 해당한다고 주장하면서 乙을 상대로 증여계약의 취소와 원상회복 청구를 하였다. 甲과 乙 사이의 증여계약은 사해행위에 해당한다.§위 ③의 경우에 丁은 배당금채권을 자신에게 양도해 달라고 청구할 수도 있다.", false, "▸ '가액배상'이라면 丁이 자신에게 지급하라고 할 수 있으나, '배당금채권의 양도'라면 책임재산 회복을 자신에게만 양도하라고 할 수는 없음 — 배당금채권 양도는 책임재산을 채권자 자신에게 귀속시키는 결과가 되어 불허", "채권자취소권"],
["SS7.⑤", "甲과 그 배우자인 乙이 X아파트를 각 1/2 지분씩 공동소유하고 있었는데, 甲과 乙은 위 각 지분에 관하여 근저당권자 丙 앞으로 채무자 甲으로 된 근저당권설정등기를 마쳐주었다. 이후 甲이 乙에게 자신의 X아파트 지분을 증여하고 乙 앞으로 지분소유권이전등기를 마치자, 甲의 채권자 丁이 甲과 乙 사이에 체결된 X아파트 지분에 관한 증여계약이 사해행위에 해당한다고 주장하면서 乙을 상대로 증여계약의 취소와 원상회복 청구를 하였다. 甲과 乙 사이의 증여계약은 사해행위에 해당한다.§만약 甲과 乙의 증여계약 당시 丙의 채권최고액 한도 내의 근저당권 피담보채무액이 X아파트 전체의 가액에는 미치지 않더라도 X아파트 1/2 지분의 가액을 초과하는 상황이라면 위 증여계약은 사해행위에 해당하지 않는데, 이는 사실심 변론종결시에 이르러 부동산가액이 상승하였더라도 마찬가지이다.", false, "▸ 저당권 설정된 부동산 매각할 경우 사해행위는 부동산 시가에서 채권최고액이 아닌 실제 발생해 있는 피담보채권액을 공제한 잔액 범위 내에서 성립 → 만일 피담보채권액이 부동산 가액을 초과한다면 부동산양도는 사해행위 X [2000다42618]. 공동저당권 목적인 수 개 부동산 중 일부 부동산 혹은 공유부동산 중 일부 지분이 물상보증인 또는 제3취득자의 소유인 경우라면, 채무자 소유 부동산의 피담보채권액은 공동저당권의 피담보채권액 전액 O ∵ 물상보증인·제3취득자는 481조, 482조 변제자대위 O [2008다25671, 2007다78234, 2012다5643] → 설문에서 甲이 채무자로서 乙 지분은 물보 소유, 공동저당권 피담보채무 전액이 甲 지분에 부담, 1/2 가액 초과한다면 甲 지분은 사해행위 당시 가치 없어 사해행위 X → 또한 사해행위 성부 판단에 변론종결시 가액은 전혀 기준이 되지 않음", "채권자취소권"],
["SS8.ㄱ", "채무자 甲이 채권자 乙의 요구에 따라 그에 대한 기존 매매대금채무의 변제를 위하여 소비대차계약을 체결하고 강제집행을 승낙하는 취지가 기재된 공정증서를 작성하여 준 경우", false, "▸ 기존채무 변제 위해 소비대차계약을 체결하고 강제집행 승낙의 공정증서 작성해도 사해행위 X → 수익자가 채무자에게 가지게 된 부당이득반환채권을 가지고 원상회복된 재산 강제경매절차에서 수익자는 배당요구 O ∵ 사해행위 이후 취득한 채권 [2012다14975]", "채권자취소권"],
["SS8.ㄴ", "채무자 甲의 모친이 사망한 후 사실상 유일한 상속재산이라고 볼 수 있는 주택을 공동상속인인 부친 乙 소유로 하는 상속재산 분할협의를 하여 甲의 상속분에 관한 권리를 포기한 경우", true, "▸ 상속분 포기하고 대신 소비하기 쉬운 현금을 지급받기로 한 상속분할협의는 사해행위 O ∵ 매각과 유사 [2007다73765]", "채권자취소권"],
["SS8.ㄷ", "유효한 종중 명의신탁에서 종원(수탁자)인 채무자 甲이 종중인 乙에게 명의신탁약정 해지를 원인으로 신탁부동산의 소유권이전등기를 마쳐준 경우", false, "▸ 유효한 부부간 명의신탁에서 수탁자가 반환의무이행으로서 신탁자에게 등기를 마쳐주는 것은 사해행위 X ∵ 기존채무 이행 [2006다79704]", "채권자취소권"],
["SS9.ㄴ", "사해행위로 주장되는 토지나 건물의 양도 자체에 대한 양도소득세와 지방소득세 채무는 사해행위로 주장되는 행위 당시의 채무초과상태를 판단할 때 소극재산으로 고려될 수 있다.", false, "▸ ‘사해행위’의 채무초과 판단의 소극재산은 사해행위 전에 발생되어야 → 그러나 사해행위 당시 이미 채무 성립 기초 법률관계 성립, 가까운 장래 채무 성립 고도 개연성, 실질로 채무 성립했다면 그 채무도 채무자의 소극재산 포함 O → 채무 성립 기초 법률관계는 약정뿐 아니라 준법률관계·사실관계 O, 계약 교섭 상당 진행으로 계약체결 고도 개연성 단계도 포함 O [2019다281156] → 그러나 사해행위로 주장되는 토지·건물 양도에 대한 양도소득세·지방소득세 채무는 통상적으로 매매대금 완납 이후 비로소 발생하여 사해행위 당시 발생 X, 채무 성립 기초가 이미 성립되지도 X, 채무 성립 고도 개연성도 X, 양도계약 교섭 진행되었어도 양도소득세·지방소득세 채무 성립 위한 교섭은 X → 양도소득세·지방소득세는 소극재산 X", "채권자취소권"],
["SS9.ㄷ", "원상회복의 전제가 되는 사해행위의 취소가 없는 이상 원상회복청구권은 인정되지 않으므로 사해행위의 취소를 구하지 않고 원상회복만을 구할 수는 없다.", true, "▸ 이유 中 : 원상회복의 전제인 사해행위 취소가 없는 이상 원상회복청구권은 인정되지 않으므로 사해행위취소 없이 원상회복만 구할 수는 X [2007다69162] → 기각설", "채권자취소권"],
["SS10.ㄱ", "乙은 K 은행으로부터 1억 5천만 원을 빌리면서 자신의 유일한 재산인 시가 3억 원 상당(이후 시가변동은 없음)의 X 부동산에 관하여 채권최고액 2억 원의 근저당권을 설정한 후, 甲에게 2억 원의 대출금 채무를 부담하였다. 이후 乙은 丙에게 X 부동산을 증여하고 소유권이전등기를 마쳤고, 丙은 丁에게 X 부동산을 매도하고 소유권이전등기를 마쳤다.§甲이 乙과 丙 사이의 증여계약을 사해행위로 취소하고 소유권이전등기의 말소를 청구하는 경우, 甲은 K 은행의 근저당권 채권최고액 2억 원을 제외한 나머지 1억 원에 대해서만 취소권을 행사할 수 있다.", false, "▸ 등기말소 등 ‘원물반환’을 구할 경우에는 언제나 ‘전체취소’를 하는 것이지 사해행위 당시 목적물에 저당권이 있었다고 하여 이를 공제한 일부취소를 하는 것이 아님", "채권자취소권"],
["SS10.ㄴ", "乙은 K 은행으로부터 1억 5천만 원을 빌리면서 자신의 유일한 재산인 시가 3억 원 상당(이후 시가변동은 없음)의 X 부동산에 관하여 채권최고액 2억 원의 근저당권을 설정한 후, 甲에게 2억 원의 대출금 채무를 부담하였다. 이후 乙은 丙에게 X 부동산을 증여하고 소유권이전등기를 마쳤고, 丙은 丁에게 X 부동산을 매도하고 소유권이전등기를 마쳤다.§丁이 乙과 丙 사이의 증여계약이 사해행위임을 알았더라도, 丁이 丙으로부터 X 부동산을 매수할 때 적정한 대가를 지급하였다면 甲은 丁에 대해 소유권이전등기의 말소를 청구할 수 없다.", false, "▸ 丁과 丙의 매매계약은 전득행위일 뿐 사해행위가 아니어서 사해성도 필요 없거니와, 그와 별개로 매매에서 적정한 대가를 지급했다고 하여 사해행위가 아닌 것도 아님", "채권자취소권"],
["SS10.ㄷ", "乙은 K 은행으로부터 1억 5천만 원을 빌리면서 자신의 유일한 재산인 시가 3억 원 상당(이후 시가변동은 없음)의 X 부동산에 관하여 채권최고액 2억 원의 근저당권을 설정한 후, 甲에게 2억 원의 대출금 채무를 부담하였다. 이후 乙은 丙에게 X 부동산을 증여하고 소유권이전등기를 마쳤고, 丙은 丁에게 X 부동산을 매도하고 소유권이전등기를 마쳤다.§甲이 乙과 丙 사이의 증여계약이 있은 날로부터 5년 내에 위 증여계약을 사해행위로 취소하였다면, 甲은 증여계약이 있은 날로부터 6년이 된 시점에도 丙 또는 丁에게 원상회복을 청구할 수 있다.", true, "▸ 사해행위 취소만을 먼저 기간 내 제기하였다면 원상회복은 기간 경과하여 제기해도 적법 O [2001다14108] → 지문에서는 기간 내 이루어진 증여계약 취소가 누구를 피고로 했는지 나타나 있지 않으나, 丙이나 丁을 각 피고로 하여 이뤄진 것을 전제로 함", "채권자취소권"],
["57.②", "사해행위인지가 문제되는 법률행위가 대리인에 의하여 이루어진 때에는 수익자의 사해의사 또는 전득자의 사해행위에 대한 악의의 유무는 그 대리인을 표준으로 결정하여야 한다.", true, "▸ [2006다22661], 민법 제116조 제1항", "채권자취소권"],
["57.③", "사해행위 후 그 목적물인 부동산에 관하여 선의의 제3자가 저당권을 취득하였음을 이유로 수익자에게 가액배상을 명하는 경우, 사해행위 당시 일반 채권자들의 공동담보가 된 부동산의 가액에서 사해행위 당시의 저당권 피담보채무액을 공제한 금액을 기준으로 가액배상액을 산정하여야 한다.", true, "▸ 사해행위 ‘후’ 근저당권 설정한 사안은 피담보채권액을 공제 X, 가액 전부 배상 O (이 경우 채권자 스스로 불이익 감수하는 원물반환도 O) [2003다40286]", "채권자취소권"],
["57.⑤", "채권자가 채권자취소권을 행사하여 직접 수령한 가액배상금에 대하여 채무자의 다른 채권자는 취소채권자를 상대로 채권액에 따른 안분액의 지급을 청구할 수 있다.", false, "▸ 사해행위 취소와 원상회복은 모든 채권자의 이익을 위하여 효력 O(407조), 채무자에게 회복된 재산에 취소채권자 우선변제권 X, 다른 채권자도 총채권액 중 자기 채권 해당 안분액 변제받을 수 O → 그러나 민사집행법 등 법률상 절차 거치지 않고 직접 취소채권자에게 안분액 지급청구 X, 취소채권자의 분배의무 X → 결국 가액배상금 수령한 취소채권자의 사실상 우선변제 결과는 불가피 [2007다37837]", "채권자취소권"],
["58.②", "수익자가 원상회복으로서 가액배상을 할 경우, 수익자가 채권자취소권을 행사하는 채권자에 대하여 가지는 별개의 다른 채권을 집행하기 위하여 그에 대한 집행권원을 가지고 채권자의 수익자에 대한 가액배상채권을 압류하고 전부명령을 받을 수 있다.", true, "▸ 수익자의 취소채권자에 대한 별개의 다른 채권을 집행하기 위해 취소채권자의 수익자에 대한 가액배상채권에 대하여 압류 및 전부명령 O ∵ 상계·공제와 성질 다름, 제3채무자가 채권자 자신인 경우도 채권압류 금지되지 않음 [2017마499]", "채권자취소권"],
["58.③", "부동산에 관한 법률행위가 사해행위에 해당하여 취소된 경우, 수익자가 사해행위 이후 그 부동산을 직접 사용하였다면 원상회복으로서 그 부동산을 반환하는 외에 그 사용이익을 반환하여야 한다.", false, "▸ 사해행위 취소된 경우 수익자·전득자가 사해행위 이후 그 부동산을 사용하여 얻은 사용이익이나 임대하여 받은 임료상당액은 원상회복으로 반환할 필요 X ∵ 사해행위취소 및 원상회복은 책임재산 보전 필요 범위 내로 한정되어야, 사용이익은 당초 채권자의 공동담보 책임재산 X [2007다69162]", "채권자취소권"],
["58.④", "어느 한 채권자가 동일한 사해행위에 관하여 채권자취소 및 원상회복청구를 하여 승소판결을 받아 그 판결이 확정되고 그에 기하여 재산이나 가액의 회복을 마친 경우에는, 다른 채권자의 채권자취소 및 원상회복청구는 그와 중첩되는 범위 내에서 소의 이익이 없게 된다.", true, "▸ 여러 채권자가 동시·이시에 사해행위취소 구해도 중복제소 X, 한 채권자가 승소판결 확정되었어도 그 후 다른 채권자의 동일한 청구는 권리보호이익 有 ∵ 채권자취소소권 요건 갖춘 각 채권자는 '고유의 권리'로서 사해행위취소·원상회복 구할 수 있으므로 → 그러나 이미 원상회복까지 마친 경우에는 비로소 중첩 범위 권리보호이익 無(=채무자·수익자 사이 사해행위가 '해제'되어 원상회복 마친 경우도 마찬가지) [2005다51457]", "채권자취소권"],
["58.⑤", "사해행위취소의 청구에는 그 취소판결이 미확정인 상태에서도 그 취소의 효력을 전제로 하는 원상회복청구를 병합하여 제기할 수 있다.", true, "▸ [민소] 형성의 소와 장래 형성될 법률관계에 대한 이행의 소 병합 → 원칙적 X, 그러나 예외적으로 법률상 허용되는 경우: ① 사해행위취소와 원상회복청구, ② 재판상 이혼과 재산분할청구 및 위자료청구, ③ 양육자지정과 양육비지급청구", "채권자취소권"],
["59.ㄱ", "부동산 등기명의인인 원고가 저당권 등기명의인인 피고를 상대로 소유권에 기한 저당권등기 말소청구 소송을 제기하고, 피고가 원고를 상대로 사해행위의 취소 및 원고 명의의 소유권이전등기의 말소를 구하는 반소를 적법하게 제기하였는데, 법원이 반소 청구가 이유 있다고 판단하여 사해행위의 취소 및 원상회복을 명하는 판결을 선고하는 경우§반소 청구에 대한 판결이 확정되지 않았더라도 법원은 사해행위인 법률행위가 취소되었음을 전제로 원고의 본소 청구를 기각할 수 있다.", true, "사해행위취소소송은 형성의 소로서 판결 확정되어야 권리변동 효력 생기지만 406조 1항은 취소판결 미확정 상태에서도 취소 효력 전제로 원상회복청구 병합 제기 허용 → 원고가 매매계약 등 법률행위에 기하여 소유권 취득했음을 전제로 피고를 상대로 일정한 청구하면, 피고는 원고의 소유권취득 원인인 법률행위가 사해행위로 취소돼야 한다고 다투며 '반소'로써 사해취소 및 원상회복청구 O → 법원이 반소청구 이유 있다 판단하여 사해행위 취소·원상회복 선고하면서 (사해행위 판결 확정되지 않았어도) 원고 소유권취득이 취소되었음을 전제로 본소 심리·판단하여 기각 O ∵ 사해행위취소 여부는 반소 청구원인 + 본소청구에 대한 방어방법 + 본소청구 인용 여부의 선결문제, 본소·반소가 동일절차 내에서 함께 심리·판단되어 소송경제·모순저촉회피 [2018다277785]", "채권자취소권"],
["59.ㄴ", "부동산 등기명의인인 원고가 저당권 등기명의인인 피고를 상대로 소유권에 기한 저당권등기 말소청구 소송을 제기하고, 피고가 원고를 상대로 사해행위의 취소 및 원고 명의의 소유권이전등기의 말소를 구하는 반소를 적법하게 제기하였는데, 법원이 반소 청구가 이유 있다고 판단하여 사해행위의 취소 및 원상회복을 명하는 판결을 선고하는 경우이다.§저당권이 설정되어 있는 부동산이 사해행위로 양도된 이후, 저당권설정행위를 사해행위로 취소하는 판결이 선고되었다면 부동산양도행위에 관한 사해행위취소를 구하는 채권자는 양도인의 양도행위 전체의 취소를 구할 수 있다.", false, "▸ 저당권 설정된 부동산에 관한 사해행위 있은 후 수익자 등의 변제로 저당권설정등기가 말소되면 부동산 가액에서 저당권의 피담보채권액을 공제한 잔액의 한도에서 일부취소 및 가액배상 명해야 ∵ 공평 [96다23207] → 위 법리는 이후 (말소된) 저당권설정행위에 대하여 사해행위 취소소송 인용판결이 확정되었더라도 마찬가지 (일부취소 및 피담보채무 공제한 잔액 범위 가액배상 해야) ∵ 위 저당권설정 사해행위취소 판결의 효력은 상대적 효력만 있고, 소유권 취득자에게 효력 X [2018다214319] → 응용지문으로서, ‘양도행위’의 사해행위취소 범위가 이미 설정되어 있던 저당권의 ‘사해행위취소 판결’로 아예 영향받을 수 없다는 의미", "채권자취소권"],
["60.①", "이혼당사자가 재산분할청구권을 행사하지 않은 경우 이혼당사자의 채권자가 재산분할청구권을 대위행사할 수 있다.", false, "▸ 가족법상 권리 X → 친생부인권, 이혼청구권, 부양청구권, 상속의 승인·포기, 이혼 재산분할청구권, 유류분반환청구권은 모두 피대위권리 X", "채권자취소권"],
["60.②", "이혼으로 인한 재산분할협의가 재산분할을 구실로 이루어진 재산처분으로서 이혼에 따른 재산분할의 상당한 정도를 초과한 경우라면 그 부분은 채권자취소권의 대상이 될 수 있다.", true, "▸ 채무초과 상태에서 이혼 재산분할로 재산을 양도함으로써 공동담보 감소되었더라도, 839조의2 취지 따른 상당 정도 벗어나 과대하다는 특별한 사정 없는 한 사해행위 X, 단, 상당 정도 초과 부분은 사해행위 O, 여기서 상당 정도 벗어난 과대한 재산분할 사실은 ‘채권자’ 입증책임 [2000다63516]", "채권자취소권"],
["60.③", "이혼으로 인한 재산분할청구권은 협의 또는 심판에 의해 구체화되지 않은 경우라면 이를 포기하더라도 채권자취소소권의 대상이 될 수 없다.", true, "▸ 협의·심판으로 구체화되지 않은 이혼 재산분할청구권의 포기는 사해행위 X ∵ 이혼 성립해야 비로소 발생하고 구체적 내용 형성 전에는 불명확·불확정하여 채무자의 책임재산 X [2013다7936]", "채권자취소권"],
["61.ㄱ", "사해행위취소소송의 상대방이 된 수익자는 피보전채권이 소멸시효 완성으로 소멸하였음을 원용할 수 있다.", true, "▸ 사해행위취소소송에서 피고인 수익자는 피보전채권의 소멸시효 완성 주장 O → 인정되면 기각 [2007다54849]", "채권자취소권"],
["61.ㄴ", "채무자와 물상보증인의 공유인 부동산에 관하여 저당권이 설정되어 있고 채무자가 그 부동산 중 자신의 지분을 양도한 경우, 그 양도가 사해행위에 해당하는지를 판단할 때 채무자 소유의 부동산 지분이 부담하는 피담보채권액은 원칙적으로 각 공유지분의 비율에 따라 분담된 금액이다.", false, "▸ 공동저당권 목적인 수 개 부동산 중 일부 부동산 혹은 공유부동산 중 일부 지분이 물상보증인 또는 제3취득자의 소유인 경우라면, 채무자 소유 부동산의 피담보채권액은 공동저당권의 피담보채권액 전액 O ∵ 물상보증인·제3취득자는 481조, 482조 변제자대위 O [2008다25671, 2007다78234, 2012다5643]", "채권자취소권"],
["61.ㄷ", "채무자가 소멸시효 완성 후에 소멸시효이익을 포기한 경우, 채무자가 부담하지 않아도 되는 채무를 새롭게 부담하게 되는 것이므로 그러한 포기행위는 채권자취소권의 대상인 사해행위가 될 수 있다.", true, "▸ 소멸시효 이익 포기행위는 결과적으로 채무자가 부담하지 않아도 되는 채무를 새로이 부담한 것이어서 사해행위취소 대상 O [2012마712]", "채권자취소권"],
["61.ㄹ", "가등기와 본등기의 원인인 법률행위가 다르다면 사해행위 요건의 구비 여부는 본등기의 원인인 법률행위를 기준으로 판단해야 하고 제척기간의 기산일도 본등기의 원인인 법률행위가 사해행위임을 안 때라고 보아야 한다.", true, "▸ 가등기 원인 법률행위와 본등기 원인 법률행위가 다르지 않다면, 사해행위 요건 구비 여부는 가등기 원인 법률행위 기준으로 판단해야 → 그러나 각 원인 법률행위가 다르면 사해행위 요건 구비는 본등기 원인 법률행위 기준으로 판단해야, 제척기간도 본등기 원인 법률행위가 사해행위임을 안 때 → 채무자가 유일한 재산인 부동산의 가등기 효력 소멸 상태에서 새로 매매계약 체결하고 말소해야 할 가등기를 기초로 본등기 마친 행위는 가등기 원인 법률행위와 별개로 일반채권자 공동담보 감소시키는 사해행위 O → 본등기 원인인 새로운 매매계약을 기준으로 사해행위 여부나 제척기간 준수 여부 판단해야 [2019다266409]", "채권자취소권"],
["62.ㄱ", "甲에 대하여 대여금 채무를 부담하고 있는 乙이 丙과 사이에 자신의 유일한 재산인 X 부동산에 관한 매매예약을 체결하고 가등기를 마쳐 주었고, 丙은 위 매매예약상의 권리를 丁에게 양도하고 가등기 이전의 부기등기를 마쳐주었다. 甲은 위 매매예약에 대하여 채권자취소권을 행사하고자 한다.§만약 위 매매예약 당시 乙의 대여금채무의 변제기가 도래하지 않았다면 甲은 위 매매예약에 대하여 채권자취소권을 행사할 수 없다.", false, "▸ 채권자취소권에서는 사해행위 당시 피보전채권이 존재하면 족하고 이행기가 도래할 필요는 없으며, 채권자대위권의 경우 그 행사를 위해 피보전채권의 이행기 도래가 요건인 점과 구별해야 함", "채권자취소권"],
["62.ㄴ", "甲에 대하여 대여금 채무를 부담하고 있는 乙이 丙과 사이에 자신의 유일한 재산인 X 부동산에 관한 매매예약을 체결하고 가등기를 마쳐 주었고, 丙은 위 매매예약상의 권리를 丁에게 양도하고 가등기 이전의 부기등기를 마쳐주었다. 甲은 위 매매예약에 대하여 채권자취소권을 행사하고자 한다.§만약 위 매매예약 이후에 戊가 甲으로부터 乙에 대한 대여금 채권을 양수하였다면 戊는 위 매매예약에 대하여 채권자취소권을 행사할 수 없다.", false, "▸ 사해행위 이전에 성립된 채권이 사해행위 이후에 채권양도 있거나 대항요건을 갖추더라도 채권자취소권의 피보전채권 O [2004다5822]", "채권자취소권"],
["62.ㄷ", "甲에 대하여 대여금 채무를 부담하고 있는 乙이 丙과 사이에 자신의 유일한 재산인 X 부동산에 관한 매매예약을 체결하고 가등기를 마쳐 주었고, 丙은 위 매매예약상의 권리를 丁에게 양도하고 가등기 이전의 부기등기를 마쳐주었다. 甲은 위 매매예약에 대하여 채권자취소권을 행사하고자 한다.§甲이 丁을 상대로 채권자취소의 소를 제기할 경우 丁의 악의 판단에서는 丁이 위 매매예약상의 권리를 양수할 당시 그 양수행위의 사해성을 인식하였는지만이 문제될 뿐, 丙이 위 매매예약의 사해성을 인식하였는지는 문제되지 않는다.", false, "▸ 수익자는 사해행위 당시에, 전득자는 전득행위 당시에 ‘채무자-수익자 사이 법률행위’의 사해성을 인식하는 것 → 전득행위의 사해성은 X [2004다61280]", "채권자취소권"],
["62.ㄹ", "甲에 대하여 대여금 채무를 부담하고 있는 乙이 丙과 사이에 자신의 유일한 재산인 X 부동산에 관한 매매예약을 체결하고 가등기를 마쳐 주었고, 丙은 위 매매예약상의 권리를 丁에게 양도하고 가등기 이전의 부기등기를 마쳐주었다. 甲은 위 매매예약에 대하여 채권자취소권을 행사하고자 한다.§甲이 丁을 상대로 채권자취소의 소를 제기할 경우 원물반환으로서 丁 명의의 부기등기의 말소를 구할 수 있다.", false, "▸ 피담보채무 소멸 혹은 근저당권설정등기 당초 원인무효인 경우 주등기인 근저당권설정등기 말소만 O, 부기등기는 별도로 말소 X ∵ 근저당권이전 부기등기는 주등기인 근저당권설정등기에 종속되어 주등기와 일체 이루는 것, 주등기 말소에 따라 직권 말소 [95다7550]", "채권자취소권"],
["62.ㅁ", "甲에 대하여 대여금 채무를 부담하고 있는 乙이 丙과 사이에 자신의 유일한 재산인 X 부동산에 관한 매매예약을 체결하고 가등기를 마쳐 주었고, 丙은 위 매매예약상의 권리를 丁에게 양도하고 가등기 이전의 부기등기를 마쳐주었다. 甲은 위 매매예약에 대하여 채권자취소권을 행사하고자 한다.§甲이 丙과 丁을 상대로 채권자취소의 소를 제기할 경우 취소를 구하는 청구취지를 丙에 대한 것과 丁에 대한 것으로 분리하지 않았더라도 丙에 대하여만 취소를 구한 것으로 볼 수는 없다.", true, "▸ 채권자가 수익자·전득자 공동피고로 채권자취소의 소 제기하며 청구취지로 ‘채무자·수익자 사이 사해행위취소’ 구하는 취지 명시 → 사해행위취소 청구취지를 수익자와 전득자로 분리하여 각각 기재하지 않았더라도 전득자에게도 사해행위취소 행사한 것 O [2018다271909]", "채권자취소권"],
["63.④", "사해행위가 있은 후 채권자가 취소원인을 알면서 피보전채권을 양도하고 양수인이 그 채권을 보전하기 위하여 채권자취소권을 행사하는 경우에는, 채권의 양도인이 취소원인을 안 날을 기준으로 제척기간 도과 여부를 판단하여야 한다.", false, "▸ 사해행위 후 채권자가 취소원인 알면서 피보전채권 양도하고 양수인이 채권자취소권을 행사할 경우 제척기간은 '양도인'이 안 날 기준 [2016다272311]", "채권자취소권"],
["63.⑤", "채권자취소권 행사의 제척기간의 기산점인 ‘채권자가 취소원인을 안 날’은 채무자가 재산의 처분행위를 하였다는 사해행위의 객관적 사실을 채권자가 알았을 경우 그 취소원인을 알았다고 추정된다.", false, "▸ 사해의 객관적 사실만으로는 X (등기를 열람한 것만으로는 X), 채무자가 채권자를 해함을 알면서 사해행위 한 사실, 즉 사해의사 있는 사실을 안 날 O [2002다23857]", "채권자취소권"],
["64.ㄱ", "채권자 甲, 乙이 수익자 丁을 상대로 2022. 3. 1. 체결된 채무자 丙과 丁 사이의 X 토지(시가 2억 원이고, 피담보채무 1억 원의 저당권이 기존에 설정되어 있었으나 丁이 같은 달 2. 소유권이전등기 후 변제하여 당일 저당권말소 시킴) 매매계약에 대하여 사해행위취소 및 가액반환을 구하는 소를 각각 제기하였는데, 모두 승소하여 위 매매계약은 취소되었고 甲은 1억 원, 乙은 8,000만 원의 가액반환판결을 받아 확정되었다. 丁은 판결확정 후 甲에게 9,000만 원을 지급하고서 甲으로부터는 남은 금액에 대해 집행하지 않겠다는 각서를 받았다.§乙이 8,000만 원의 확정판결로 丁의 재산에 대해 집행할 경우 丁은 제3자이의의 소를 제기하여 그 집행을 배제할 수 있다.", false, "▸ ㄱ, ㄴ 지문 : 채권자의 피보전채권액 합한 금액이 공동담보가액(목적물 가액에서 일반채권자들 공동담보 아닌 부분 공제한 잔액)을 초과한다면 수익자는 채권자들에게 공동담보가액만 반환 → 공동담보가액 초과 범위 이중반환 위험 → 각 판결에서 산정한 공동담보가액 액수가 서로 다른 경우, 특별한 사정이 없는 한 최대액으로 산정한 공동담보가액에서 수익자가 어느 채권자에게 반환한 가액을 공제한 금액을 초과하는 범위에서 다른 채권자에게 청구이의로 집행력 배제 구해야 ∵ 채권자취소권의 취지, 변론주의 [2018다202774] 설문은 공동담보가액 1억 원(변론종결 시까지 X토지 시가 변동 없음을 전제로 2억 원에서 변제액 1억원을 공제), 甲 가액배상 1억 원, 乙은 가액배상 8,000만 원 → 그런데 丁이 甲에게 9,000만 원 지급했으므로 乙로서는 丁의 최대 반환금액 1억 원에서 이를 공제한 1,000만 원만 집행 가능 → 초과된 7,000만 원의 집행에 대하여는 제3자이의가 아닌 청구이의로", "채권자취소권"],
["64.ㄴ", "채권자 甲, 乙이 수익자 丁을 상대로 2022. 3. 1. 체결된 채무자 丙과 丁 사이의 X 토지(시가 2억 원이고, 피담보채무 1억 원의 저당권이 기존에 설정되어 있었으나 丁이 같은 달 2. 소유권이전등기 후 변제하여 당일 저당권말소 시킴) 매매계약에 대하여 사해행위취소 및 가액반환을 구하는 소를 각각 제기하였는데, 모두 승소하여 위 매매계약은 취소되었고 甲은 1억 원, 乙은 8,000만 원의 가액반환판결을 받아 확정되었다. 丁은 판결확정 후 甲에게 9,000만 원을 지급하고서 甲으로부터는 남은 금액에 대해 집행하지 않겠다는 각서를 받았다.§丁은 乙에게 1,000만 원을 지급하여야 한다.", true, "▸ 각 판결에서 산정한 공동담보가액의 액수가 서로 다른 경우, 특별한 사정이 없는 한 최다액으로 산정한 공동담보가액에서 수익자가 어느 채권자에게 반환한 가액을 공제한 금액을 초과하는 범위에서 다른 채권자에게 청구이의로 집행 배제 [2018다202774] → 설문은 공동담보가액 1억 원(변론종결 시까지 X토지 시가 변동 없음을 전제로 2억 원에서 변제액 1억원을 공제), 甲 가액배상 1억 원, 乙은 가액배상 8,000만 원 → 그런데 丁이 甲에게 9,000만 원 지급했으므로 乙로서는 丁의 최대 반환금액 1억 원에서 이를 공제한 1,000만 원만 집행 가능 → 초과된 7,000만 원의 집행에 대하여는 제3자이의가 아닌 청구이의로", "채권자취소권"],
["64.ㄷ", "채권자 甲, 乙이 수익자 丁을 상대로 2022. 3. 1. 체결된 채무자 丙과 丁 사이의 X 토지(시가 2억 원이고, 피담보채무 1억 원의 저당권이 기존에 설정되어 있었으나 丁이 같은 달 2. 소유권이전등기 후 변제하여 당일 저당권말소 시킴) 매매계약에 대하여 사해행위취소 및 가액반환을 구하는 소를 각각 제기하였는데, 모두 승소하여 위 매매계약은 취소되었고 甲은 1억 원, 乙은 8,000만 원의 가액반환판결을 받아 확정되었다. 丁은 판결확정 후 甲에게 9,000만 원을 지급하고서 甲으로부터는 남은 금액에 대해 집행하지 않겠다는 각서를 받았다.§甲의 집행포기의 효력이 乙에게 미치므로 乙은 권리보호의 이익이 없어 丁에게 금원을 청구할 수 없다.", false, "▸ 각 승소 확정한 채권자취소소송에서 1인의 집행포기는 상대적 효력이 있을 뿐임", "채권자취소권"],
["65.③", "채무자 甲이 저당권이 설정된 X 주택을 채권자를 해할 목적으로 乙에게 매도하고, 乙은 X주택을 丙에게 임대하여 인도한 후 乙이 그 피담보채무를 변제하여 저당권을 말소한 경우, 사해행위취소로 인한 乙의 가액반환의 액수는 사실심 변론종결시점의 X 건물의 가액에서 乙의 변제액과 丙의 우선변제권 있는 임차보증금채권액을 공제하여 산정해야 한다.", true, "▸ 사해행위 이전에 임대차계약 체결되었고 임차보증금 우선변제권 있다면 이처럼 임차보증금액 공제 O. 그러나 사해행위 이후 채무자가 부동산 임대했다면 공제 X ∵ 부동산 가액 중 임차보증금 해당 부분도 공동담보보였음 [2018다215756] → 사실심 변론종결 시점의 X 건물의 가액에서 乙의 변제액과 丙의 우선변제권 있는 임차보증금채권액을 공제하여 산정해야 한다는 지문은 X — 사해행위 이전에 임대차계약 체결되었고 임차보증금 우선변제권 있다면 공제 O이므로 지문은 X (공제해야 하는데 지문이 X라고 했으므로 지문 X가 정답 O)", "채권자취소권"],
["65.⑤", "채무자의 수익자에 대한 채권양도가 사해행위로 취소되고 그에 따른 원상회복으로서 제3채무자에게 채권양도가 취소되었다는 통지가 이루어진 경우, 채권자는 채무자를 대위하여 제3채무자를 상대로 위 채권의 이행을 청구할 수 없다.", true, "▸ 채권양도가 사해행위로 취소되는 경우 수익자가 제3채무자에게서 아직 채권을 추심하지 않았다면 원상회복은 수익자가 제3채무자에게 채권양도가 취소되었다는 통지를 하도록 청구 O, 이 경우 통지 이루어진 후에도 채권자는 채무자를 대위하여 제3채무자에 대하여 지급청구 X ∵ 채권자와 수익자 관계에서 채권이 채무자 책임재산으로 취급될 뿐, 채무자가 직접 채권을 취득하여 권리자로 되는 것은 X [2021다2743]", "채권자취소권"],
["66.②", "채권자의 채권이 사해행위 이전에 성립한 이상 사해행위 이후에 채권이 양도되었다고 하더라도 그 양수인은 채권자취소권을 행사할 수 있다.", true, "▸ 사해행위 이전에 성립된 채권이 사해행위 이후에 채권양도 있거나 대항요건 갖추더라도 채권자취소권의 피보전채권 O [2004다5822]", "채권자취소권"],
["67.ㄹ", "채무자가 소멸시효 완성 후에 한 소멸시효이익의 포기행위는 원래부터 존재하였던 채무를 승인한 것에 불과하여 채무자가 부담하지 않아도 되는 채무를 새롭게 부담하는 행위가 아니므로 사해행위취소의 소를 제기할 수 없다.", false, "▸ 소멸시효 이익 포기행위는 결과적으로 채무자가 부담하지 않아도 되는 채무를 새로이 부담한 것이어서 사해행위취소 대상 O [2012마712]", "채권자취소권"],
["68.ㄹ", "사해행위취소의 소에서 수익자가 가액배상을 할 경우, 수익자 자신도 채무자에 대한 채권자 중의 1인이라는 이유로 취소채권자에게 상계를 주장하여 자기채권에 해당하는 안분액의 지급을 거절할 수 없다.", true, "▸ 수익자가 가액배상을 할 때 자신도 채무자에 대한 채권자라면서 채무자에 대한 반대채권으로 상계 X [99다63183]", "채권자취소권"],
["69.ㄴ", "甲과 乙은 甲 소유의 X 토지를 乙이 매수하는 계약을 체결하면서 매매대금은 X 토지의 인도 및 소유권이전등기의 경료와 동시에 지급하기로 약정하였다. 丙은 위 매매계약에 따른 乙의 甲에 대한 매매대금 지급채무를 연대보증하였다.§甲은 丁에게 乙에 대한 매매대금채권을 양도하면서 위 계약 내용 및 X 토지에 관하여 아직 소유권이전등기를 마쳐 주지 아니한 사실을 설명하였고, 같은 날 乙은 채권양도에 대하여 이의를 보류하지 않는 승낙을 하였다. 이후 丁이 乙에게 양수금의 지급을 청구할 경우 乙은 甲으로부터 소유권이전등기의무의 이행제공이 없었음을 이유로 丁의 청구를 거절할 수 없다.", false, "▸ 이의를 보류하지 않은 승낙(제451조 제1항) : 항변권 상실 = 양도인에게 대항할 수 있는 사유로써 양수인에게 대항 X (≠451조 2항 통지 → 항변 O = 동일성)", "채권양도"],
["69.ㄷ", "甲과 乙은 甲 소유의 X 토지를 乙이 매수하는 계약을 체결하면서 매매대금은 X 토지의 인도 및 소유권이전등기의 경료와 동시에 지급하기로 약정하였다. 丙은 위 매매계약에 따른 乙의 甲에 대한 매매대금 지급채무를 연대보증하였다.§甲이 丁에게 乙에 대한 매매대금채권을 양도하고 확정일자 있는 증서에 의하여 乙에게 이를 통지하였더라도, 甲이 乙에 대한 채권을 다시 戊에게 양도한 후에 甲과 丁 사이의 채권양도계약을 합의해지하고 합의해지 사실을 丁이 乙에게 통지하였다면 특별한 사정이 없는 한 戊는 乙에 대한 매매대금채권을 취득한다.", false, "▸ “양도인이 지명채권을 제1양수인에게 양도하고 확정일자 있는 증서로 대항요건을 갖춘 ‘후’ 양도인이 동일한 채권을 제2양수인에게 양도해도 제2양수인은 채권 취득 X” ∵ “지명채권 양도는 준물권행위·처분행위, 유효하려면 양도인 처분권한 있어야 하는데 제1양수인이 확정일자까지 적법하게 갖춤으로써 양도인은 채권 처분권한 상실” (제1차 채권양도가 양도담보인 경우도 마찬가지 ∵ 대외적으로 제1양수인에게 이전) 그 후 제1차 양도계약이 합의해지되고 통지함으로써 채권이 다시 양도인에게 귀속되었어도 특별한 사정 없는 한 제2차 양도계약이 채권양도로서 유효하게 될 수는 X, 제2양수인이 당연히 채권 취득 X [2015다46119]", "채권양도"],
["70.①", "임차인 甲이 임대인 乙에 대한 임대차보증금반환채권을 丙에게 양도한 후 내용증명우편으로 乙에게 양도통지를 하였고, 그 통지가 乙에게 도달하였다.§乙은 채권양도통지 도달 이후에는 甲의 연체차임을 임대차보증금반환채권에서 공제할 수 없다.", false, "▸ 임차보증금반환채권에 대한 전부명령이 있더라도 임대차 종료 후 명도시에 연체차임 등 임차인의 모든 피담보채무를 공제한 잔액에 관하여만 전부명령 유효 ∵ 전부명령이 있더라도 제3채무자인 임대인은 임차인에게 대항할 수 있는 사유로서 전부채권자에게 대항 O, 임대차보증금반환채권은 종료 후 명도시 모든 피담보채무를 공제한 잔액이 있을 것으로 조건으로 그 잔액에 관하여 발생하는 채권(= 임대인의 채권 발생을 해제조건으로 하는 것) [87다카1315] 임차인이 임대차보증금 반환채권을 양도하고, 임대인에게 양도통지 하여도 임차인이 임대차목적물을 인도하기 전까지는 임대인이 소송비용을 임대차보증금에서 당연히 공제 O [2012다49490]", "채권양도"],
["70.②", "임차인 甲이 임대인 乙에 대한 임대차보증금반환채권을 丙에게 양도한 후 내용증명우편으로 乙에게 양도통지를 하였고, 그 통지가 乙에게 도달하였다.§乙에게 채권양도통지 도달 이후 甲의 채권자 丁이 동일한 채권에 대해 압류를 하여 그 결정이 乙에게 송달된 경우, 丙은 압류의 부담이 있는 채권을 양수한다.", false, "▸ 채권양도 후 확정일자 있는 통지 갖추었다면, 그 후 양도인의 다른 채권자가 양도된 채권에 대하여 압류·가압류하더라도 압류·가압류 무효 ∵ 압류·가압류 당시 피압류채권은 이미 존재 X [2010다57213]", "채권양도"],
["70.③", "임차인 甲이 임대인 乙에 대한 임대차보증금반환채권을 丙에게 양도한 후 내용증명우편으로 乙에게 양도통지를 하였고, 그 통지가 乙에게 도달하였다.§乙에게 채권양도통지가 도달되기 전에 甲의 채권자 己가 동일한 채권에 대해 가압류를 하여 그 결정이 먼저 송달된 경우, 丙에 대한 채권양도는 己가 甲에 대한 본안소송에서 승소하여 집행권원을 취득하더라도 유효하다.", false, "▸ 가압류된 채권도 양도에 아무 제한 無, 다만 가압류된 채권을 양수받은 양수인은 가압류로 권리 제한된 상태의 채권을 양수 → 가압류 채권자가 본안승소 등 집행권원 취득하면 가압류로 제한된 채권양도는 무효로 확정됨 ∵ 채권가압류의 처분금지효력은 집행권원을 얻는 등 피보전권리의 존재 확정을 조건으로 발생 = 이는 채권양도 받았으나 확정일자 있는 통지·승낙 대항요건 갖추지 않은 사이 양도된 채권이 가압류된 경우도 동일 [2001다59033]", "채권양도"],
["70.④", "임차인 甲이 임대인 乙에 대한 임대차보증금반환채권을 丙에게 양도한 후 내용증명우편으로 乙에게 양도통지를 하였고, 그 통지가 乙에게 도달하였다.§乙에게 채권양도통지가 도달되기 전에 甲의 채권자 己가 동일한 채권에 대해 가압류를 하여 그 결정이 먼저 송달된 경우, 丙은 양수금청구의 소를 제기할 수 없다.", false, "▸ [AI해설] 채권에 가압류 있어도 현실 추심만 금지할 뿐 채무자는 제3채무자를 상대로 이행청구소송 O, 법원도 가압류 이유로 배척 X → 인용 ∵ 집행권원 취득 필요, 집행단계에서 저지 가능, 가압류 취소 후 다시 소제기 불편, 시효중단 필요 [2001다59033]", "채권양도"],
["71.①", "전세기간 만료 이후 전세권양도계약 및 전세권이전의 부기등기가 이루어진 것만으로는 전세금반환채권의 양도에 관하여 확정일자 있는 통지나 승낙이 있었다고 볼 수 없어 이로써 제3자인 전세금반환채권의 압류·전부 채권자에게 대항할 수 없다.", true, "▸ 전세기간 만료 이후 전세권양도계약 및 전세권이전의 ‘부기등기’ 이뤄진 것만으로는 전세금반환채권 양도에 관하여 ‘확정일자’ 있는 통지·승낙 X → 전세금반환채권의 압류·전부채권자에게 대항할 수 X [2003다35659]", "채권양도"],
["71.④", "부동산매매로 인한 소유권이전등기청구권의 양도는 특별한 사정이 없는 한 통상의 채권양도와 달리 양도인의 채무자에 대한 통지만으로는 채무자에 대한 대항력이 생기지 않으며 반드시 채무자의 동의나 승낙을 받아야 대항력이 생긴다.", true, "▸ 매매로 인한 소유권이전등기청구권은 그 성질상 양도가 제한되고 양도에 채무자의 동의·승낙 요하며 양도통지만으로 채무자에게 대항 X ∵ 매매 소유권이전등기청구권은 이행과정에 신뢰관계가 따르므로 [2000다51216]", "채권양도"],
["72.②", "채권자가 그 채권을 제3자에게 양도하는 경우 주채무자에 대하여만 채권양도의 대항요건을 갖추었을 뿐, 보증인에 대하여는 채권양도의 대항요건을 갖추지 않았더라도, 특별한 사정이 없는 한 채권양수인은 보증인에 대하여 보증채무의 이행을 구할 수 있다.", true, "▸ 주채무자에 대하여 채권양도통지 등 대항요건 갖추면 보증인에게도 효력 O (즉, 보증인에 대하여 따로 통지할 필요 없음) [75다1100]", "채권양도"],
["73.②", "당사자 사이에 양도금지의 특약이 있는 채권이더라도 전부명령에 의하여 전부되는 데에는 지장이 없고, 전부채권자로부터 다시 그 채권을 양수한 자가 그 특약의 존재를 알았다고 하더라도 채무자는 위 특약을 근거로 그 채권양도의 무효를 주장할 수 없다.", true, "▸ 당사자 사이 양도금지특약 있더라도 전부명령 O, 집행채권자의 선약의 불문, 전부채권자로부터 다시 양수한 자가 악의라 하여도 채권양도 유효 [2001다3771]", "채권양도"],
["73.⑤", "채권양도의 통지는 그 양도인이 채권이 양도되었다는 사실을 채무자에게 알리는 행위에 불과하므로, 그것만으로 도급계약에 관하여 「민법」 제667조 내지 제671조에 규정된 하자담보책임의 제척기간 준수에 필요한 권리의 행사에 해당한다고 할 수 없다.", true, "▸ 채권양도 통지는 제척기간 준수에 필요한 권리행사 X [2010다28840]", "채권양도"],
["74.②", "선순위의 근저당권부채권을 양도하였으나 아직 대항요건을 갖추지 못한 경우, 후순위근저당권자는 대항요건을 갖추지 못하였음을 이유로 그 채권양도의 효력을 부인할 수 없다.", true, "▸ ① 대항요건 못 갖춘 채권양수인, ② 채권양도 해제되었으나 해제통지 못 갖춘 양도인 등이 선순위저당채권자일 경우에 그 후순위저당권자는 ‘채권양도 대항요건을 갖추지 않은 경우 대항할 수 없는 제3자’에 포함되지 X → 후순위 저당권자가 선순위 저당권자가 채권양도 대항요건 갖추지 못했다며 배당이의의 X [2004다29279, 2011다109357]", "채권양도"],
["75.①", "채권자가 채무자의 제3채무자에 대한 채권을 가압류한 후에도 채무자는 제3채무자를 상대로 그 이행의 소를 제기할 수 있다.", true, "▸ [AI해설] 채권에 가압류 있어도 현실 추심만 금지할 뿐 채무자는 제3채무자를 상대로 이행청구소송 O [2001다59033]. 전세기간 만료 이후 전세권양도계약 및 전세권이전의 '부기등기'만 이뤄진 것만으로는 전세금반환채권 양도에 관하여 '확정일자' 있는 통지·승낙이 있었다고 볼 수 없어 이로써 제3자인 전세금반환채권의 압류·전부채권자에게 대항할 수 없음 [2003다35659]", "채권양도"],
["76.②", "당사자의 의사표시에 의한 채권양도금지 특약은 제3자가 악의인 경우는 물론 제3자가 채권양도금지 특약을 알지 못한 데에 중대한 과실이 있는 경우에도 채권양도금지 특약으로써 대항할 수 있고, 제3자의 악의 내지 중과실은 채권양도금지 특약으로 양수인에게 대항하려는 자가 이를 주장·증명하여야 한다.", true, "▸ 채권양도금지특약에 반하여 채권양도 이뤄진 경우, 양수인이 양도금지특약의 존재를 알았거나 중과실로 알지 못한 경우는 채권양도 무효, 중과실 없이 알지 못했다면 채권양도 유효 → 양수인의 악의나 중과실에 대한 입증책임은 채무자 부담 → 채무자는 487조 후단 채권자 불확지 변제공탁 O [2000다55904]", "채권양도"],
["76.③", "당사자의 의사표시에 의한 채권양도금지 특약이 있는 경우 악의의 양수인으로부터 다시 선의로 양수한 전득자는 그 채권을 유효하게 취득하나, 선의의 양수인으로부터 다시 채권을 양수한 악의의 전득자는 그 채권을 유효하게 취득하지 못한다.", false, "▸ 449조 2항 단서는 전득자 포함 O, 악의 양수인으로부터 선의로 양수한 전득자 O, 선의 양수인으로부터 악의로 양수한 전득자 O [2012다118020]", "채권양도"],
["SS11.ㄹ", "채권양도에서 채무자가 이의를 보류하지 않고 승낙을 한 경우에도 양수인이 악의 또는 중과실의 경우에 해당한다면 채무자는 승낙 당시까지 양도인에 대하여 생긴 사유로 양수인에게 대항할 수 있다.", true, "▸ 이의를 보류 없는 승낙을 하였더라도 양수인이 악의나 중과실인 경우라면 채무자는 승낙 당시까지 양도인에 대해 생긴 사유로 양수인에게 대항 O [99다18039]", "채권양도"],
["SS12.①", "| SS 25.08모-06 채무자가 제3채무자에 대한 채권을 특정 채권자에게 양도하였다가 그 채권양도가 사해행위라는 이유로 취소판결이 확정되었으나, 그 채권자가 당해 채권에 대하여 채권압류 및 추심명령도 받아 둔 경우에는, 당해 채권에 대한 제3채무자의 혼합공탁에 따른 배당절차에서 그 채권자가 사해행위의 수익자인 당해 채권의 양수인의 자격으로는 배당받을 수 없으나, 압류 및 추심명령을 받은 채권자의 지위에서 배당받는 것은 가능하다.", true, "▸ 채무자가 채권을 특정 채권자에게 양도한 채권양도가 사해행위로 취소판결 확정됐으나 양수인이 양수받은 채권에 압류 및 추심명령도 받아둔 상태 → 당해 채권에 대한 제3채무자의 혼합공탁에 따른 배당절차에서 사해행위 수익자인 당해 채권의 양수인 자격으로는 배당 X, 그러나 압류 및 추심명령 받은 채권자 지위에서 배당 O [2011다107818]", "채권양도"],
["SS12.②", "택지분양계약의 채권자와 채무자 사이에, 택지분양권이 전전양도되는 경우를 예상하여 그에 대한 채권양도의 승낙을 할 이익을 미리 포기하여 승낙없이 택지분양권의 양도를 채무자에게 대항할 수 있게 하는 내용으로 체결한 특약은 효력이 있다.", true, "▸ 채권양도 승낙은 미리 포기 가능", "채권양도"],
["SS12.③", "채권압류명령 당시 피압류채권이 이미 양도되고 제3자에 대한 대항요건을 갖추어 그 채권압류명령이 효력이 없는 것이 되었더라도, 그 후 사해행위취소소송에서 위 채권양도계약이 취소되어 그 채권이 원채권자인 양도인에게 복귀하였다면 위 채권압류명령은 집행목적에 비추어 효력이 있다고 할 것이다.", false, "▸ 압류 및 추심명령 당시 피압류채권이 이미 대항요건 갖춰 양도되어 그 명령이 무효로 되었다면, 그 후 사해행위취소소송에서 채권양도계약이 취소되어 채권이 원채권자인 양도인에게 복귀하였더라도 이미 무효로 된 압류 및 추심명령이 다시 유효로 될 수는 X ∵ 사해행위취소의 상대효 및 비소급효 [2019다235702, 2022다247521]", "채권양도"],
["SS12.⑤", "채무자가 양도되는 채권의 성립이나 소멸에 영향을 미치는 사정에 관하여 채권양수인에게 알리지 않았다고 하더라도 특별한 사정이 없는 한 불법행위는 성립하지 않는다.", true, "▸ 채무자가 이의無보류 승낙 할 때 채권 성립·소멸 사정을 양수인에게 알려줄 신의칙상 의무 X, 설명 없었어도 불법행위 X ∵ 양수인 자신 책임 [2014다49241]", "채권양도"],
["SS13.ㄹ", "甲과 乙은 甲의 乙에 대한 대여금채권의 양도를 금지하기로 특약을 맺었는데, 甲이 K은행에 채권을 양도해도 된다는 乙의 승낙을 받은 후 위 대여금채권을 K은행에게 양도하고 이 사실을 확정일자 있는 증서에 의하여 乙에게 통지한 후 甲이 위 채권을 W은행에게 양도한 경우, 甲과 K은행이 채권양도계약을 합의해지하고 그 사실을 乙에게 통지하였다면 W은행은 위 채권을 유효하게 취득한다.", false, "▸ [AI해설] 양도인이 지명채권을 제1양수인에게 양도하고 확정일자 있는 증서로 대항요건을 갖춘 '후' 양도인이 동일한 채권을 제2양수인에게 양도해도 제2양수인은 채권 취득 X ∵ '지명채권 양도는 준물권행위·처분행위, 유효하려면 양도인 처분권한 있어야 하는데 제1양수인이 확정일자까지 적법하게 갖춤으로써 양도인은 채권 처분권한 상실' (제1차 채권양도가 양도담보인 경우도 마찬가지) ∵ 대외적으로 제1양수인에게 이전 [2015다46119]", "채권양도"],
["77.①", "채권의 양수인이 채권에 양도금지특약이 있다는 사실을 알았더라도 채무자가 그 양도에 대하여 사후에 승낙을 한 경우, 다른 약정이 없는 한 채권양도는 그 양도 당시로 소급하여 유효하게 된다.", false, "▸ 악의·중과실의 채권양수인에 대해 채무자가 사후승낙하면 무효인 채권양도행위가 추인되어 승낙 시부터 유효 O, 소급효 X [2009다47685] → 139조 무효행위의 추인은 소급효 없기 때문", "채권양도"],
["77.③", "지명채권의 양도통지를 한 후 양도계약이 해제된 경우에 채권양도인이 해제를 이유로 다시 원래의 채무자에 대하여 양도채권으로 대항하려면, 채권양도인이 채권양수인의 동의를 받거나 채권양수인이 채무자에게 그 해제의 사실을 통지하여야 한다.", true, "▸ 452조 1항은 채권양도가 해제·합의해제로 소급해서 무효로 되는 경우도 유추적용 O → 통지 후 해제·합의해제된 경우 양도인이 해제 이유로 채무자에게 대항하려면 양수인의 동의를 받아 통지를 철회하거나 양수인이 채무자에게 해제 사실 통지하여야 [2011다17953] [조문] 제452조(양도통지와 금반언) ① 양도인이 채무자에게 채권양도를 통지한 때에는 아직 양도하지 아니하였거나 그 양도가 무효인 경우에도 선의인 채무자는 양수인에게 대항할 수 있는 사유로 양도인에게 대항할 수 있다. ② 전항의 통지는 양수인의 동의가 없으면 철회하지 못한다.", "채권양도"],
["77.⑤", "| SS 25.08모-06 (ⓔ 별도 추기) 채권양도 후 대항요건이 구비되기 전에 채권양도인은 채무자의 제3채무자에 대한 채권을 가압류할 수 있다.", true, "▸ 채권양도 후 대항요건 구비 전의 양도인은 채무자의 제3채무자에 대한 채권에 대하여 채권가압류 O, 배당받은 것은 유효 O ∵ 대항요건 구비 전의 양도인은 채무자에 대한 관계에서 여전히 채권자 지위 O [2016다8589]", "채권양도"],
["78.ㄱ", "A는 B에 대한 대여금 채권을 C에게 양도하고 그 사실을 B에게 통지하였다. A와 B는 대여금 채권의 양도를 금지하는 특약을 한 바 있는데 C는 이러한 사정을 알고 있었다.§C가 B에게 양수금을 청구하는 경우, B는 양도금지특약의 존재 및 이에 대한 C의 악의를 증명하여 책임을 면할 수 있다.", true, "▸ [2000다55904] [AI해설] 채권양도에서 채권양도금지 특약에 반하여 채권양도가 이뤄진 경우, 양수인이 양도금지특약의 존재를 알았거나 중과실로 알지 못한 경우는 채권양도 무효, 중과실 없이 알지 못했다면 채권양도 유효 → 양수인의 악의나 중과실에 대한 입증책임은 채무자 부담 → 채무자는 487조 후단 채권자 불확지 변제공탁 O", "채권양도"],
["78.ㄴ", "A는 B에 대한 대여금 채권을 C에게 양도하고 그 사실을 B에게 통지하였다. A와 B는 대여금 채권의 양도를 금지하는 특약을 한 바 있는데 C는 이러한 사정을 알고 있었다.§A의 채권자 乙이 A의 대여금채권에 대해 전부명령을 받아 B에게 전부금을 청구하는 경우, B는 양도금지특약의 존재 및 乙의 악의를 증명하여 책임을 면할 수 있다.", false, "▸ [2001다3771] [AI해설] 당사자 사이 양도금지특약 있더라도 전부명령 O, 집행채권자의 선악 불문. 전부채권자로부터 다시 양수한 자가 그 특약의 존재를 알았더라도 채권양도는 유효 — 전부명령은 사적자치 영역 밖의 국가 공권력 행사이므로 특약 효력 미치지 않음", "채권양도"],
["78.ㄷ", "A는 B에 대한 대여금 채권을 C에게 양도하고 그 사실을 B에게 통지하였다. A와 B는 대여금 채권의 양도를 금지하는 특약을 한 바 있는데 C는 이러한 사정을 알고 있었다.§B가 양도금지특약의 존재 및 C의 악의를 증명한 때에도, C로부터 위 대여금채권을 양수하여 대항요건을 갖춘 D는 선의이며 중과실이 없으면 양수금을 지급받을 수 있다.", true, "▸ [2012다118020] [AI해설] 449조 2항 단서는 전득자 포함 O → 악의 양수인(C)으로부터 선의이며 중과실 없는 전득자(D)는 유효하게 채권 취득. 선의 양수인으로부터 악의 전득자가 다시 양수한 경우 악의 전득자는 유효하게 채권 취득하지 못함", "채권양도"],
["79.②", "채권양도인은 채권양도 후라도 그 대항요건을 갖추기 전이면 채무자를 상대로 시효중단의 효력이 있는 재판상 청구를 할 수 있다.", true, "▸ ②·③ 지문 관련: 채권양도 대항요건을 갖추기 전이면, 채무자에 대한 관계에서 채권자는 ‘양도인’이므로 ‘양도인’의 재판상 청구는 당연히 시효중단 효력이 있고, ‘양수인’의 재판상 청구가 문제되지만, 판례는 양수인의 경우도 권리행사로 인정 O 관련판례: [2008두20109] 채권양도 대항요건 갖추지 못한 상태에서 양수인의 재판상 청구 O ∵ 동일성은 대항요건과 무관, 149조 조건부권리의 처분·보존 등, 권리 위에 잠잔다고 할 수 없음 [2005다41818]", "채권양도"],
