["79.③", "채권양수인은 채권양수 후 그 대항요건을 갖추지 못한 상태라도 채무자를 상대로 시효중단의 효력이 있는 재판상 청구를 할 수 있다.", true, "▸ [AI해설] 채권양도 대항요건 갖추지 못한 상태에서 양수인의 재판상 청구 O ∵ 동일성은 대항요건과 무관, 149조 조건 성취 전 이해관계를 침해 못한다는 규정 유추적용. 채권양도 대항요건 갖추지 못해도 채무자는 양수인에게 변제하면 유효 [2005다41818]", "채권양도"],
["79.④", "| 24.10모-26 (추정) 乙이 甲으로부터 丙에 대한 채권을 양수한 다음 그 대항요건을 갖추지 못한 상태에서 丙의 丁에 대한 채권을 가압류하여 그 가압류에 기해 배당절차에서 배당을 받은 경우 乙에 대한 배당은 유효하다.", false, "▸ [AI해설] 채권양도 후 대항요건 구비 전의 '양도인'은 채무자의 제3채무자에 대한 채권에 대하여 채권가압류 O, 배당받은 것은 유효 O → 채무자에 대한 관계에서 채권자는 여전히 '양도인'이기 때문 [2016다8589]", "채권양도"],
["79.⑤", "甲이 丙에 대한 채권을 乙에게 양도한 다음 그 대항요건이 갖추어지기 전에 丙의 丁에 대한 채권을 가압류하여 그 가압류에 기해 배당절차에서 배당을 받은 경우 甲에 대한 배당은 유효하다.", true, "▸ 채권양도 후 대항요건 구비 전의 '양도인'은 채무자의 제3채무자에 대한 채권에 대하여 채권가압류 O, 배당받은 것은 유효 O → 채무자에 대한 관계에서 채권자는 여전히 '양도인'이기 때문 [2016다8589]", "채권양도"],
["80.ㄱ", "채권양도가 다른 채무의 담보 조로 이루어진 경우, 채무자는 그 피담보채무가 변제로 소멸되었다는 이유로 양수금 청구를 거절할 수 없다.", true, "▸ 채권양도가 다른 채무 담보 조로 이뤄진 경우 그 채무 변제돼도 채무자는 이를 이유로 양수금청구 거절 X ∵ 채무 변제나 소멸 여부는 양도인·양수인 간의 문제일 뿐 채무자는 양수인에게 변제해야 [99다23093]", "채권양도"],
["80.ㄹ", "채무자는 양도통지를 받은 이후에 양도인에 대하여 생긴 사유로 양수인에게 대항할 수 없으므로, 양도통지 후 채권자와의 계약이 합의해제되었더라도 이를 양수인에게 주장할 수 없다.", false, "▸ 계약상 채권의 양수인은 548조 1항 단서 제3자 X, 해제 효과에 반하여 자신의 권리 주장 X ∵ 새로운 이해관계 뿐 아니라 등기·인도 등 완전한 권리를 취득해야 보호 [2000다22850, 95다49882] → 매매계약 합의해제 사안으로서, 본 판례를 두고 채권양수인은 법정해제뿐 아니라 ‘합의해제’의 경우에도 보호될 수 없다는 견해(다수설)를 수업시간에 소개하는데, 최초로 이러한 견해에 입각한 지문이 등장했으며, 이에 따르면 이 쟁점에 관하여 ‘채권양수인’은 ‘압류채권자’와 동일한 지위가 됨", "채권양도"],
["80.ㅁ", "임대인이 임대차보증금반환채권의 양도에 대하여 이의를 보류 없이 승낙한 경우 임대인은 위 채권이 이미 타인에게 양도되었다거나 연체차임에 의하여 공제된다는 등의 사유로 양수인에게 대항할 수 없다.", false, "▸ 이의를 보류 없는 승낙을 한 채무자도 ‘채권이 타인에게 양도된 사실’, ‘임대차보증금의 속성상 공제하는 사실’로는 양수인에게 대항할 수 있음 ▸ 451조 1항 ‘양도인에게 대항할 수 있는 사유’란 채권의 성립·존속·행사를 저지·배척하는 사유를 말할 뿐, 채권의 귀속(=이미 타인에게 양도된 사실)은 X ∵ 채권 귀속 우열은 오로지 확정일자 있는 통지·승낙의 유무와 선후로써만 결정 [93다35551] → 이의無보류승낙(=단순승낙)은 채권의 귀속·우열에 아무 영향 X ▸ 임대차보증금반환채권을 양도함에 임대인이 단순승낙 했어도 인도시까지 생긴 연체차임, 임차인의 원상복구비용 상당의 손해배상액 등 임차인의 모든 채무 공제 O ∵ 임대차보증금의 속성 [2002다52657]", "채권양도"],
["81.③", "저당권부채권의 양수인은 저당권이전의 부기등기를 마치고 저당권실행의 요건을 갖추고 있어도 채권양도의 대항요건을 갖추고 있지 않다면 저당권 실행을 위한 경매신청을 할 수 없고, 양수채권의 변제를 받을 수도 없다.", true, "▸ 담보채권을 근저당과 함께 양수한 자가 채권양도 대항요건 X, 저당권이전 부기등기 O → 경매신청 O → 다만 채무자는 즉시항고나 이의 가능 O → 이런 절차로 실효되지 않는 한 경매절차 적법 → 후순위저당권자는 채권양도 대항요건 흠결의 경우 대항할 수 없는 채무자 이외의 ‘제3자’에 포함되지 X → 이상은 근저당권부채권의 양도통지 후 채권양도계약 해제되었으나 양수인의 해제 통지 없이 양도인이 경매신청한 경우도 마찬가지 [2011다109357]", "채권양도"],
["81.④", "근저당부 채권을 양수한 채권자가 저당권 이전의 부기등기는 경료하였으나 채권양도의 대항요건을 갖추지 않은 경우, 그보다 후순위의 저당권자에 대하여 채권양도로써 대항할 수 없다.", false, "▸ [AI해설] 후순위저당권자는 채권양도 대항요건을 갖추지 않은 경우 대항할 수 없는 채무자 이외의 '제3자'에 포함되지 X → 이상은 근저당권부 채권의 양도통지 후 채권양도계약이 해제되었으나 양수인의 해제 통지 없이 양도인이 경매신청한 경우도 마찬가지 [2011다109357]", "채권양도"],
["82.ㄴ", "채권양도 당시 이미 채권자의 채무자에 대한 채권이 가압류되어 있던 중 그 가압류채권자가 본안소송에서 승소하여 위 채권의 집행권원을 취득한 경우, 양도인의 양도행위는 무효가 된다.", false, "▸ 가압류된 채권도 양도에 아무 제한 無, 다만 가압류된 채권을 양수받은 양수인은 가압류로 권리 제한된 상태의 채권을 양수 → 가압류 채권자가 본안승소 등 집행권원 취득하면 가압류로 제한된 채권양도는 무효로 확정됨 ∵ 채권가압류의 처분금지효력은 집행권원을 얻는 등 피보전권리의 존재 확정을 조건으로 발생 [2001다59033]", "채권양도"],
["83.⑤", "甲이 乙에 대한 채권을 丙에게 양도하고 확정일자부 증서에 의하여 乙에게 이를 통지하였더라도, 甲이 乙에 대한 채권을 다시 戊에게 양도한 후에 甲과 丁 사이의 채권양도계약을 합의해지하고 합의해지 사실을 丁이 乙에게 통지하였다면 특별한 사정이 없는 한 戊는 乙에 대한 매매대금채권을 취득한다.", false, "▸ [AI해설] 양도인이 지명채권을 제1양수인에게 양도하고 확정일자 있는 증서로 대항요건 갖춘 '후' 동일 채권을 제2양수인에게 양도해도 제2양수인은 채권 취득 X [2015다46119]. 이의를 보류하지 않은 승낙은 양수인에게 대항할 수 있는 사유 상실시키나, 이의 보류한 승낙 또는 단순승낙은 채권 귀속·우열에 영향 X [93다35551]", "채권양도"],
["84.ㄱ", "甲은 乙로부터 乙 소유의 X토지를 9억 원에 매수하되, X토지의 임차인인 丙에 대하여 乙이 부담하고 있는 5억 원의 임대차보증금반환채무를 인수하고, 위 채무액을 매매대금에서 공제하기로 약정하였다.§甲이 乙로부터 X토지에 관한 임대차보증금반환채무를 인수하는 한편 그 채무액을 매매대금에서 공제하기로 약정한 경우, 그 인수는 특별한 사정이 없는 이상 이행인수로 보아야 하고, 면책적 채무인수로 보기 위해서는 이에 대한 丙의 승낙이 있어야 한다.", true, "▸ 부동산 매수인이 매매목적물의 근저당권 피담보채무, 가압류채무, 임대차보증금반환채무를 인수하는 한편 그 채무액을 매매대금에서 공제하기로 약정한 경우, 특별한 약정이 없는 이상 이행인수 O, 면책적 채무인수 X [92다23193]", "채무인수"],
["85.③", "乙과 丙 사이에 면책적 채무인수에 관한 약정이 있었던 경우, 甲이 승낙을 거절하였다면 그 이후에는 다시 승낙하여도 특별한 사정이 없는 한 甲에 대하여 면책적 채무인수로서의 효력이 생기지 않는다.", false, "▸ 채권자가 승낙 거절한 후 다시 승낙해도 채무인수 효력 X [98다33765]", "채무인수"],
["86.①", "중첩적 채무인수는 채권자와 채무인수인과의 합의가 있는 이상 채무자의 의사에 반하여서도 이루어질 수 있다.", true, "▸ [87다카1836] → 채권자·인수인 사이 계약은 ‘보증’ 성질 → 이해관계 없는 제3자가 채무자의 의사에 반하여 병존적 채무인수 O", "채무인수"],
["SS14.②", "인수채무가 원래 5년의 상사시효의 적용을 받던 채무라면 면책적 채무인수 후에도 그 소멸시효의 기간은 여전히 5년의 상사시효의 적용을 받는다.", true, "▸ 면책적 채무인수는 채무의 동일성 유지하면서 종래의 채무자로부터 제3자인 인수인에게 이전하는 것 → 원래 채무가 5년 상사시효 적용 받았다면 면책적 채무인수로 채무자 지위가 교체되었더라도 소멸시효기간은 여전히 5년 상사시효 적용 O → 면책적 채무인수와 동시에 이뤄진 소멸시효 중단사유, 즉 채무승인에 따라 소멸시효기간은 채무인수일로부터 새로이 진행 [99다12376]", "채무인수"],
["SS14.③", "계약인수에 의하여 계약당사자의 지위가 제3자에게 이전되는 경우 계약상 지위를 전제로 한 권리관계뿐만 아니라 불법행위에 기한 손해배상청구권도 별도의 채권양도절차 없이 제3자에게 그대로 이전된다.", false, "▸ 계약인수는 계약당사자 지위 승계, 계약에서 생기는 채권·채무, 해제권 등 포괄적 권리의 무 양도, 양도인은 계약관계 탈퇴, 특별한 사정 없는 한 잔류당사자와 양도인 사이 계약관계 X, 채권채무 소멸 → 채권양도에서 채무자 보호 위한 대항요건은 계약인수에서는 별도 요구 X, 상법상 영업양도 수반 계약인수도 마찬가지 甲주식회사·乙주식회사 사이 영업양도계약 체결하며 근로자(丙 등)에 대한 사용자의 모든 권리의무 이전, 丙도 乙회사와 동일조건 근로계약(종전 근로기간 소급 작성) → 영업양도 전 甲이 丙회사 업무 관련 고객 돈 횡령한 경우, 甲회사의 丙에 대한 손해배상채권도 乙회사가 승계취득 O ∵ 잔류당사자 丙이 영업양도 인식하고 근로계약 인수 승낙, 인수인 乙회사에 사용자 지위뿐 아니라 근로계약 기초로 이미 발생한 손해배상채권도 이전, 대항요건 불필요 [2020다245958]", "채무인수"],
["SS14.④", "매수인이 매매목적물에 관한 근저당권의 피담보채무를 인수하는 것으로 매매대금의 지급에 갈음하기로 약정한 경우 특별한 사정이 없는 한 매수인이 매매대금에서 그 채무액을 공제한 나머지를 지급함으로써 잔금지급의무를 다하였다고 볼 것이고, 매수인이 피담보채무인 대출금채무의 이자를 일부 지급하지 않았다는 사정만으로 매매계약을 해제할 수는 없다.", true, "▸ 매수인은 현실적으로 당장 변제할 의무 X, 매매대금에서 채무액 공제한 나머지를 지급함으로써 잔금지급의무 다한 것 O, 인수인이 인수채무를 현실적 변제 않았다는 사정만으로 매도인은 매매계약 해제 X [93다19108]", "채무인수"],
["SS14.⑤", "전채무자의 채무에 관하여 담보를 제공한 제3자가 있는 경우에, 제3자가 면책적 채무인수에 동의하지 않았다면 그 담보는 채무인수로 인하여 소멸한다.", true, "[조문] 제459조(채무인수와 보증, 담보의 소멸) 전채무자의 채무에 대한 보증이나 제3자가 제공한 담보는 채무인수로 인하여 소멸한다. 그러나 보증인이나 제삼자가 채무인수에 동의한 경우에는 그러하지 아니하다.", "채무인수"],
["87.ㄷ", "금전소비대차계약으로 인한 채무에 관하여 제3자가 채무자를 위하여 어음이나 수표를 발행하는 것은 특별한 사정이 없는 한 중첩적 채무인수에 해당한다.", true, "▸ 금전소비대차계약 채무에 관하여 제3자가 채무자를 위하여 어음·수표 발행함은 특별한 사정 없는 한 동일 채무 중첩적 인수 O [97다52493]", "채무인수"],
["87.ㄹ", "민법 제459조 단서는 보증인이나 제3자가 채무인수에 동의한 경우에는 전 채무자의 채무에 대한 보증이나 제3자가 제공한 담보는 채무인수로 인하여 소멸하지 아니하는 것으로 규정하고 있으므로, 위 조항에 규정된 채무인수에 대한 동의는 인수인을 위하여 새로운 담보를 설정하도록 하는 의사표시를 의미하는 것이다.", false, "▸ 물상보증인이 채무의 인수인이 되었다면 459조의 동의 O → 그러나 이는 당초 채무자가 부담하여 물상보증인이 인수한 채무만 O, 인수 후 물상보증인이 새로 부담하게 된 채무는 X [98다40657, 2000다56204]", "채무인수"],
["87.ㅁ", "면책적 채무인수의 경우, 종래의 채무자는 채무관계에서 탈퇴하여 면책되고 채무인수로 종래의 채무가 소멸하므로 저당권의 부종성으로 인하여 당연히 위 소멸한 채무를 담보하는 저당권도 소멸한다.", false, "▸ 면책적 채무인수로 '제3자'가 제공한 인적·물적 담보가 소멸할 뿐 채무자가 제공한 담보는 소멸하지 않으므로, 면책적 채무인수만으로 채무 소멸과 부종성으로 인해 담보가 소멸한다는 논리는 틀림 (96다27476)", "채무인수"],
["88.③", "물상보증인이 채무인수에 동의함으로써 소멸하지 않는 담보는 당연히 기존의 담보와 동일한 내용을 갖는다.", true, "▸ 물상보증인의 채무인수에 관한 동의는 채무인수인을 위해 새로운 담보 설정하겠다는 의사표시가 아니라 기존의 담보를 채무인수인을 위해 계속 유지하겠다는 의사표시 → 동의로 유지되는 담보는 기존 담보와 동일한 내용 [2000다56204]", "채무인수"],
["88.④", "물상보증인이 저당권의 채무자의 계약상 지위를 인수한 것이 아니라, 다만 그 채무만을 면책적으로 인수하고 이를 원인으로 하여 근저당권 변경의 부기등기가 경료된 경우, 특별한 사정이 없는 한 채무를 인수한 물상보증인이 다른 원인으로 근저당권자에 대하여 부담하게 된 새로운 채무까지 담보하는 것으로 볼 수는 없다.", true, "▸ 물상보증인이 면책적 인수를 하고 근저당권 변경의 부기등기 경료되면 이는 당초 채무자가 근저당권자에 대해 부담하고 있던 것으로서 물상보증인이 인수한 채무만을 대상으로 하는 것 → 그 후 채무 인수한 물상보증인이 다른 원인으로 근저당권자에 대하여 부담하게 된 새로운 채무까지 담보하는 것은 X [98다40657]", "채무인수"],
["89.ㄴ", "甲이 乙에 대해 부담하는 채무를 乙과 丙의 합의에 따라 丙이 중첩적으로 인수하는 경우, 그 채무인수에 대하여 甲이 동의하지 않더라도 중첩적 채무인수의 효력에는 아무런 영향이 없다.", true, "▸ 채권자·인수인 사이 계약은 '보증' 성질 → 이해관계 없는 제3자가 채무자의 의사에 반하여 병존적 채무인수 O", "채무인수"],
["89.ㄷ", "乙이 甲 소유의 토지를 매수하면서, 甲과 乙 사이에 중도금 및 잔금을 乙이 甲의 채권자 丙에게 직접 지급하기로 하여 丙으로 하여금 그 채권을 취득하게 할 의사로 약정한 경우, 그 약정은 제3자를 위한 계약으로서 중첩적 채무인수에 해당한다.", true, "▸ 채무자·인수인 사이의 병존적 채무인수는 제3자를 위한 계약 O → 구별기준: 제3자에게 직접 채권을 취득하게 할 의사가 있는지 여부", "채무인수"],
["90.ㄷ", "병존적 채무인수에서 인수인이 채무자의 부탁 없이 채권자와의 계약으로 채무를 인수하는 것은 매우 드문 일이므로, 채무자와 인수인은 통상 주관적 공동관계가 있는 연대채무관계에 있고, 인수인이 채무자의 부탁을 받지 아니하여 주관적 공동관계가 없는 경우에는 부진정연대관계에 있는 것으로 보아야 한다.", true, "▸ 중첩적 채무인수가 채무자의 부탁 없이 채권자와의 계약으로 채무를 인수하는 것은 매우 드문 일이므로, 원칙적으로 주관적 공동관계가 있는 연대채무 / 부탁이 없어 주관적 공동관계 없다면 부진정연대채무 [2009다32409]", "채무인수"],
["91.ㄹ", "甲은 乙로부터 乙 소유의 X 건물을 10억 원에 매수하는 매매계약을 체결하면서 위 매매대금 중 4억 원은 이미 X 건물에 설정되어 있던 乙의 근저당권부 차용금채무 4억 원을 甲이 인수하는 것으로 하고, 나머지 6억 원은 X 건물의 소유권이전등기서류와 상환으로 지급하기로 약정하였다.§甲이 위 근저당권부 차용금채무 4억 원의 변제를 불이행하여 乙이 대신 변제한 경우, 甲의 구상채무 이행의무와 乙의 소유권이전등기 이행의무는 동시이행관계에 있지 않다.", false, "▸ 부동산매매계약·이행인수계약이 함께 이뤄진 경우, ⓐ 매수인의 인수채무불이행으로 말미암아 또는 ⓑ 임의로, 매도인이 인수채무를 대신 변제했다면, 그로 인한 ⓐ 손해배상채무 또는 ⓑ 구상채무는 인수채무의 변형(=매매대금지급채무에 갈음한 것의 변형)이므로 매도인의 소유권이전등기의무와 동시이행 O → 인수인이 인수채무 변제 게을리 하여 경매가 개시되고 매도인이 경매 막고자 변제했다면 매도인은 손해배상채권 취득 O, 이를 들어 매매 해제 O [92다23193]", "채무인수"],
["92.①", "채무인수에 있어서 면책적 인수인지 중첩적 인수인지 분명하지 아니한 때에는 특별한 사정이 없는 한 중첩적 채무인수로 보아야 한다.", true, "▸ [2002다36228] [AI해설] 채무인수에 있어서 면책적 인수인지 중첩적(병존적) 인수인지 분명하지 아니한 때에는 특별한 사정이 없는 한 채무자의 의사는 자기의 채무를 면하려는 데 있으므로 면책적 채무인수보다는 중첩적 채무인수로 보아야 함", "채무인수"],
["93.ㄱ", "계약인수에서는 개별 채권양도에서 채무자 보호를 위하여 요구되는 대항요건은 별도로 요구되지 않고, 이러한 법리는 「상법」상 영업양도에 수반된 계약인수에 대해서도 마찬가지로 적용된다.", true, "▸ 계약인수는 계약당사자 지위 승계 → 개별 채권양도의 대항요건 별도 불필요, 상법상 영업양도 수반 계약인수도 마찬가지 [2020다245958]", "채무인수"],
["93.ㄴ", "「표시·광고의 공정화에 관한 법률」상 허위·과장광고의 불법행위를 원인으로 하는 손해배상청구권을 가지고 있던 아파트 수분양자가 수분양자의 지위를 제3자에게 양도하면, 양수인은 특별한 사정이 없는 한 별도의 채권양도 절차 없이도 위 손해배상청구권을 행사할 수 있다.", false, "▸ 구 표시·광고의 공정화에 관한 법률상 허위·과장광고로 인한 손해배상청구권은 불법행위 손해배상청구권 성격 → 계약상 지위 양도로 계약당사자 지위가 제3자에게 이전되더라도 계약상 지위 전제로 한 권리관계만 이전, 불법행위 기한 손해배상청구권은 별도 채권양도 없이 이전 X → 특별한 사정(허위·과장광고 그대로 믿고 광고로 높아진 가격에 수분양자 지위 양수)이 있어야 행사 가능 [2012다15336]", "채무인수"],
["93.ㄷ", "매도인의 매수인에 대한 매매대금 채권이 압류된 이후 매도인의 지위를 이전하는 계약인수가 이루어진 경우, 매도인과 매수인 사이의 계약관계는 소멸하더라도 인수인은 위 압류에 의하여 권리가 제한된 상태의 매매대금 채권을 이전받게 된다.", true, "▸ 채권 압류는 지급금지 명하지만 채권 발생원인인 법률관계에 대한 처분까지 구속 X → 계약인수 O, 양도인은 계약관계 탈퇴하지만 양도인이 계약관계로 가지던 권리·의무 동일성 유지한 채 양수인에게 승계, 양수인은 압류로 권리 제한된 상태의 채권 이전받음 → 제3채무자는 계약인수 내세워 압류채권자에게 대항 X [2012다41359]", "채무인수"],
["94.③", "매수인의 잔대금 지급의무와 매도인의 소유권이전등기의무가 동시이행의 관계에 있는 경우, 매수인이 잔대금 지급기일까지 그 대금을 지급하지 못하면 그 계약이 자동으로 해제된다는 취지의 약정이 있다면, 특별한 사정이 없는 한 매도인의 이행제공 없이도 매수인의 대금 미지급으로 계약은 자동해제된다.", false, "▸ 잔금을 기일에 지급하지 못하면 자동해제된다는 약정이 있더라도, 매도인이 잔금지급기일에 소유권이전등기 필요 서류 이행제공을 하여 매수인을 이행지체에 빠지게 하였을 때 비로소 자동해제 O [88다카28891]", "변제"],
["94.⑤", "채권자가 변제를 수령하지 않을 의사가 명백하여 수령거절의사를 반복할 가능성이 보이지 않는 경우, 채무자는 구두의 변제제공을 하지 않더라도 채권자에게 이행지체책임을 지지 않는다.", true, "▸ 460조는 수령거절의 번의가능성을 고려하여 구두제공을 규정한 취지, 변제를 수령하지 않을 의사가 명백하여 번의가능성 없다면 구두제공도 불필요 → 채무자는 채무불이행 책임 X [76다2218]", "변제"],
["95.③", "부동산의 매수인은 법률상 이해관계가 있는 제3자가 아니므로, 권리실현에 장애가 되는 부동산에 대한 담보권 등의 권리를 소멸시키기 위한다는 이유로 매도인의 반대의사에도 불구하고 매도인의 채무를 대신 변제할 수 없다.", false, "▸ 매도인이 제3자에게 먼저 양도담보로 소유권이전등기 마쳐주면 매수인은 변제할 법률상 이해관계 있는 제3자 해당 O → 피담보채무 변제하고 매도인을 대위하여 말소등기청구 O [71다1888]", "변제"],
["95.④", "공동저당의 목적인 물상보증인 소유 부동산에 후순위로 채권담보를 목적으로 하는 소유권이전청구권가등기가 설정되어 있는데, 그 부동산에 대하여 먼저 경매가 실행되어 공동저당권자가 매각대금 전액을 배당받고 채무의 일부가 남은 경우, 그 가등기권리자는 채무 잔액의 변제에 관하여 이해관계 있는 제3자에 해당하지 않는다.", true, "▸ 공동저당에서 물상보증인 소유 후순위담보권자는 공동저당권자가 물보 소유물에서 배당받고 남은 채무를 채무자 의사에 反하여 대위변제할 이해관계 X ∵ 물상보증인이 대위취득한 채무자 소유 부동산에 대한 공동저당권자의 저당권을 후순위담보권자가 물상대위할 수 있으므로 집행 받거나 권리 잃을 지위 없음 [2008마109]", "변제"],
["95.⑤", "| 24.06모-25 채권담보 목적의 가등기가 되어 있는 부동산을 시효취득하여 소유권이전등기청구권을 취득한 자가 그 등기를 하지 못하던 중에 채권자가 가등기담보 등에 관한 법률상 요구되는 청산절차를 거치지 아니하고 가등기에 기하여 본등기를 하였다면, 시효완성자는 부동산 소유자에 대한 소유권이전등기청구권을 보전하기 위하여 소유자를 대위하여 그의 채권자에게 채무를 변제할 법률상 권한이 있어 이해관계 있는 제3자에 해당한다.", true, "▸ [90다17774] → 위 ③과 동일한 법리", "변제"],
["96.ㄱ", "A는 B에 대하여 15억 원의 대여금채권과 15억 원의 약속어음금채권을 각각 가지고 있다. A가 위 약속어음에 대한 공정증서에 기초하여 B의 C에 대한 물품대금채권 중 15억 원에 관해 채권압류명령을 받아 그 명령이 C에게 송달되었으나, C는 이를 간과하고 B에게 12억 원을 지급하였다. B는 수령한 12억 원을 그대로 A에게 전달하면서 대여금채무와 약속어음금채무 중 어느 채무에 충당하는지에 대해 지정하지 않았다.§압류명령이 제3채무자에게 송달되어 압류의 효력이 생기면 제3채무자의 채무자에 대한 지급이 금지되므로, 특별한 사정이 없는 한 C는 압류명령을 송달받은 이후 B에게 12억 원을 지급한 사실로써 A에게 대항할 수 없다.", true, "▸ 압류명령 송달로 압류 효력 발생하면 제3채무자의 채무자에 대한 지급 금지 → 특별한 사정 없는 한 C는 압류명령 송달 이후 B에게 지급한 사실로 A에게 대항 불가", "변제"],
["96.ㄴ", "A는 B에 대하여 15억 원의 대여금채권과 15억 원의 약속어음금채권을 각각 가지고 있다. A가 위 약속어음에 대한 공정증서에 기초하여 B의 C에 대한 물품대금채권 중 15억 원에 관해 채권압류명령을 받아 그 명령이 C에게 송달되었으나, C는 이를 간과하고 B에게 12억 원을 지급하였다. B는 수령한 12억 원을 그대로 A에게 전달하면서 대여금채무와 약속어음금채무 중 어느 채무에 충당하는지에 대해 지정하지 않았다.§C가 B에게 지급한 12억 원이 그대로 A에게 전달된 것은 C가 정당한 추심권자인 A에게 추심금 중 12억 원을 변제한 것으로 볼 수 있다.", false, "▸ C가 B에게 지급한 돈이 A에게 전달되었다고 하려면 이는 C가 A에게 직접 지급했어야 할 추심금으로서의 ‘물품대금채권의 전달’이어야 하는데 사안은 그렇게 볼 여지가 없어 이를 ‘추심금 12억 원의 변제’로 볼 수는 없음", "변제"],
["96.ㄷ", "A는 B에 대하여 15억 원의 대여금채권과 15억 원의 약속어음금채권을 각각 가지고 있다. A가 위 약속어음에 대한 공정증서에 기초하여 B의 C에 대한 물품대금채권 중 15억 원에 관해 채권압류명령을 받아 그 명령이 C에게 송달되었으나, C는 이를 간과하고 B에게 12억 원을 지급하였다. B는 수령한 12억 원을 그대로 A에게 전달하면서 대여금채무와 약속어음금채무 중 어느 채무에 충당하는지에 대해 지정하지 않았다.§민법 제472조에서 ‘채권자가 이익을 받은’ 경우란 변제수령자가 채권자에게 변제로 받은 급부를 전달한 경우는 물론이고, 변제수령자가 변제로 받은 급부를 가지고 채권자의 자신에 대한 채무의 변제에 충당하거나 채권자의 제3자에 대한 채무를 대신 변제함으로써 채권자의 기존 채무를 소멸시키는 등 채권자에게 실질적인 이익이 생긴 경우를 포함한다.", true, "▸ 472조 권한 없는 자에 대한 변제에서 ‘이익을 받은 경우’란 ⓐ 수령자가 채권자에게 변제로 전달, ⓑ 채권자가 사후추인, ⓒ 수령자가 채권자의 자신·제3자에 대한 채무ⓐ에 충당·변제하여 기존 채무 소멸시킨 경우 포함 O, 그러나 수령자가 자신의 채권자에 대한 채무 변제한 경우는 X ∵ 채권자에게 실질적 이익 X [2017다278729]", "변제"],
["96.ㄹ", "A는 B에 대하여 15억 원의 대여금채권과 15억 원의 약속어음금채권을 각각 가지고 있다. A가 위 약속어음에 대한 공정증서에 기초하여 B의 C에 대한 물품대금채권 중 15억 원에 관해 채권압류명령을 받아 그 명령이 C에게 송달되었으나, C는 이를 간과하고 B에게 12억 원을 지급하였다. B는 수령한 12억 원을 그대로 A에게 전달하면서 대여금채무와 약속어음금채무 중 어느 채무에 충당하는지에 대해 지정하지 않았다.§변제수령자가 변제로 받은 급부를 가지고 자신이나 제3자의 채권자에 대한 채무를 변제한 때에는 채권자에게 실질적인 이익이 생긴 경우로서 민법 제472조에 의한 변제의 효력이 인정된다.", false, "▸ [2017다278729] [AI해설] 472조 권한 없는 자에 대한 변제에서 '이익을 받은 경우'란 ⓐ 수령자가 채권자에게 변제로 받은 급부를 전달한 경우, ⓑ 채권자가 사후추인, ⓒ 수령자가 변제로 받은 급부를 가지고 채권자의 자신에 대한 채무의 변제에 충당하거나 채권자의 제3자에 대한 채무를 대신 변제함으로써 채권자의 기존 채무를 소멸시키는 등 채권자에게 실질적인 이익이 생긴 경우를 포함 O. 그러나 수령자가 자신의 채권자에 대한 채무를 변제한 경우는 채권자에게 실질적 이익 X → 472조 변제 효력 인정 안 됨", "변제"],
["96.ㅁ", "A는 B에 대하여 15억 원의 대여금채권과 15억 원의 약속어음금채권을 각각 가지고 있다. A가 위 약속어음에 대한 공정증서에 기초하여 B의 C에 대한 물품대금채권 중 15억 원에 관해 채권압류명령을 받아 그 명령이 C에게 송달되었으나, C는 이를 간과하고 B에게 12억 원을 지급하였다. B는 수령한 12억 원을 그대로 A에게 전달하면서 대여금채무와 약속어음금채무 중 어느 채무에 충당하는지에 대해 지정하지 않았다.§A가 12억 원을 수령하면서 이를 대여금채권에 변제충당한다고 B에게 통보하였다면, A가 B로부터 12억 원을 그대로 전달받아 실질적인 이익을 얻었으므로, B의 변제는 민법 제472조에 따라 12억 원의 범위에서 그 효력이 있다.", false, "▸ 위 사안은 A가 B에 대한 채권ⓐ를 집행채권으로 B의 C에 대한 물품대금채권에 압류 및 전부명령 → C는 이를 간과한 채 B에게 물품대금채권을 변제함 → B는 C로부터 수령한 변제금을 충당 지정 없이 A에게 전달 → A는 C에 대한 전부소송에서 전부명령 무효(압류 경합)로 인해 패소 후 다시 자신이 받은 압류명령에 기초하여 추심명령 받고 C에 대해 추심금청구 → A 승소, C는 472조 주장 X ∵ B가 C로부터 받은 돈을 A에게 전달한 것으로 보이나 A의 지정으로 채권ⓐ에 충당되었으므로 이는 B가 자신의 채권자에 대한 다른 채무 변제한 것일 뿐임, 전부명령이 민집법 229조 5항으로 무효이더라도 압류명령은 유효하므로 C가 압류명령 받은 후 압류채무자 B에게 변제하여 스스로 이중지급 위험 감수해야", "변제"],
["97.②", "채권자와 채무자 사이에 미리 채권자가 적당하다고 인정하는 순서와 방법에 의하여 충당하기로 하는 내용의 변제충당에 관한 약정이 있다면, 변제수령권자인 채권자가 위 약정에 터 잡아 변제충당을 한 이상 변제자에 대한 의사표시와 관계없이 충당의 효력이 있다.", true, "▸ 미리 채권자·채무자 사이에 ‘채권자가 적당하다고 인정하는 순서·방법에 의하여 충당하기로’ 약정했다면, 변제수령권자 스스로 정한 순서·방법으로 변제충당 O → 이 경우 채무자가 변제하면서 지정충당 X [98다27517]", "변제"],
["98.③", "비용, 이자, 원본에 대한 변제충당에 있어 당사자 사이에 특별한 합의가 없는 한 비용, 이자, 원본의 순서로 충당하여야 하고 채무자는 물론 채권자라도 위 법정순서와 다르게 일방적으로 충당의 순서를 지정할 수는 없으나, 상대방의 이의제기가 없어 묵시적인 합의가 있다고 볼 경우에는 그러하지 아니하다.", true, "▸ 합의 없는 상태에서 비·이·원 법정 순서와 다르게 당사자가 일방적 지정함에 대하여 상대방이 지체없이 이의 아니했다면 묵시적 합의의 충당 O [2002다12871]", "변제"],
["SS15.①", "변제에 관한 증명책임은 채무자에게 있으므로, 특정 채무의 변제로서 급부를 하였다는 채무자의 주장에 대하여 채권자가 이를 수령한 사실을 인정하면서도 다른 채무의 변제에 충당하였다고 다투는 경우에는 특정 채무에 변제충당하기로 하는 합의나 지정 또는 특정 채무가 법정충당의 우선순위에 있었다는 사실을 채무자가 주장·증명해야 한다.", false, "▸ ‘변제’의 증명책임은 채무자, 채무자가 객관적으로 특정채무 내용에 적합한 급부 했다면 특별한 사정 없는 한 그 채무 변제로 인정 여러 채무 내용 적합하나 채무 전부 소멸시키기 부족한 경우 ‘변제충당’ 문제됨 → 채무자가 그중 특정채무 변제로서 급부했다고 주장함에 대해, 채권자가 수령한 사실 인정하면서 다른 채무 변제에 ‘충당’했다고 주장할 경우, 채권자는 ① 다른 채권 존재 사실, ② 다른 채권에 변제충당 합의, 지정, 법정충당 우선순위 있었던 사실 주장·증명해야 [2024다258921]", "변제"],
["SS15.②", "비용, 이자, 원본에 대한 변제충당에 있어서는 지정변제충당이 허용되지 않으므로 한쪽 당사자의 일방적인 지정에 대하여 상대방이 지체없이 이의를 제기하지 않았더라도 반드시 법정충당의 순서에 따라 충당이 이루어져야 한다.", false, "▸ [2002다12871] [AI해설] 합의 없는 상태에서 비·이·원 법정 순서와 다르게 당사자가 일방적 지정함에 대하여 상대방이 지체없이 이의를 제기하지 않았다면 묵시적 합의 충당 O — 지정변제충당이 허용되지 않는다는 명제 자체는 비·이·원 충당에서는 맞으나, 묵시적 합의로 다른 순서 충당이 인정될 수 있으므로 '반드시 법정충당 순서에 따라야 한다'는 표현은 틀림", "변제"],
["SS15.③", "근저당권에 의하여 담보된 피담보채무가 여러 차례에 걸쳐 대여받은 채무들로 이루어져 있는 경우 수 개의 채무라고 보아야 하고, 담보권 실행을 위한 경매에서 배당금이 수 개의 피담보채무 전부를 소멸시키기에 부족한 경우 변제충당을 합의에 의하여 지정변제충당은 허용될 수 없고 합의에 의한 변제충당은 허용된다.", false, "▸ 경매에서는 합의충당 X → 획일적으로 가장 공평 타당한 477조 법정충당 O [95다55504]", "변제"],
["99.①", "변제자가 주채무자이고 연대보증약정이 있는 경우로서 다른 조건이 동일하다면, 연대보증기간 내의 채무와 연대보증기간 종료 후의 채무 사이의 변제이익은 같다.", true, "▸ 보증기간 중 채무와 보증기간 종료 후 채무는 변제이익 차이 없으므로 주채무자 변제액은 변제기 먼저 도래한 채무부터 법정충당 [99다26481, 2019다207141]", "변제"],
["99.④", "주채무자 이외의 자가 변제자인 경우로서 다른 조건이 동일하다면, 변제자가 발행 또는 배서한 어음에 의하여 담보되는 채무가 그렇지 않은 채무보다 변제이익이 더 많다.", true, "▸ [99다22281] [AI해설] 주채무자 이외의 자가 변제자인 경우로서 다른 조건이 동일하다면, 변제자가 발행 또는 배서한 어음에 의하여 담보되는 채무가 그렇지 않은 채무보다 변제이익이 더 많음 — 어음채무자는 어음 상환의무를 면하면 그 부담에서 벗어나므로 이익이 더 큼", "변제"],
["99.⑤", "변제자가 주채무자인 경우로서 다른 조건이 동일하다면, 담보로 주채무자 자신이 발행 또는 배서한 어음에 의하여 담보되는 채무가 그렇지 않은 채무보다 변제이익이 더 많다.", true, "▸ 지문 ④⑤ : 제3자가 담보로 발행 or 배서한 약속어음 교부된 채무와 다른 채무 사이에 변제이익 차이 없고 동일 → 그러나 변제하는 자가 발행 or 배서한 어음으로 담보되는 채무는 다른 채무보다 변제이익 많음 [99다22281]", "변제"],
["100.⑤", "담보권 실행을 위한 경매에서 배당금이 담보권자가 가지는 수 개의 피담보채권 전부를 소멸시키기에 부족한 경우에는 채권자와 채무자 사이에 변제충당에 관한 합의가 있었다고 하더라도 그 합의충당은 허용될 수 없고, 획일적으로 민법 제477조 및 제479조에 따른 법정변제충당의 방법에 따라 충당하여야 한다.", true, "▸ 합의가 있었더라도 합의충당이 허용될 수 없으며, 획일적으로 가장 공평타당한 충당방법인 민법 477조 및 479조 규정에 의한 법정변제충당 방법에 따라야 [2000다51339]", "변제"],
["101.ㄱ", "甲은 乙에게 (1) 2021. 10. 5. 2억 원을 이자 월 0.5%(매월 4. 후불로 지급), 변제기 2022. 10. 4.로 정하여 대여하고(이하 '제1차 대여'), (2) 2022. 3. 5. 2,000만 원을 이자 월 1%(매월 4. 후불로 지급), 변제기 2023. 3. 4.로 정하여 대여(이하 '제2차 대여')하였다. 乙은 위 각 대여금에 대한 원금 및 이자 등을 전혀 변제하지 않다가 2023. 6. 4. 甲에게 3,000만 원을 지급하였다.§乙의 위 3,000만 원 지급 시, 乙이 별다른 말없이 돈을 교부하였고 甲도 말없이 수령하였다면, 법원은 甲의 청구를 일부 인용(乙에게 1,300만 원 및 이에 대한 2023. 6. 5. 이후의 지연손해금의 지급을 명함)하는 판결을 선고해야 한다.", true, "▸ 합의나 지정이 없으므로 법정충당 → 23.6.4. 당시 각 부채권 합계액 2,300만에 우선 충당, 그 후 남은 700만이 변제기 도래, 변제이익 높은 고이율 2차 대여금 원금 2,000만에 충당 → 법원은 2차 대여금 청구에 잔여 원금 1,300만 원 및 23.6.5.부터 지연손해금 인용", "변제"],
["101.ㄴ", "甲은 乙에게 (1) 2021. 10. 5. 2억 원을 이자 월 0.5%(매월 4. 후불로 지급), 변제기 2022. 10. 4.로 정하여 대여하고(이하 '제1차 대여'), (2) 2022. 3. 5. 2,000만 원을 이자 월 1%(매월 4. 후불로 지급), 변제기 2023. 3. 4.로 정하여 대여(이하 '제2차 대여')하였다. 乙은 위 각 대여금에 대한 원금 및 이자 등을 전혀 변제하지 않다가 2023. 6. 4. 甲에게 3,000만 원을 지급하였다.§乙의 위 3,000만 원 지급 시 乙이 '제2차 대여'의 원리금에 지정하여 변제한다는 의사를 표시하였으나 甲이 이에 대하여 즉시 이의를 제기한 경우, 법원은 甲의 청구를 일부 인용(일부인용의 범위는 위 ㄱ과 동일)하는 판결을 선고하여야 한다.", false, "▸ 2020다261776 판결 이후 '지정충당' 용어 변경 취지에 비춰, '지정하여 변제'는 '채무를 지정한 변제'의 문제로 봐야 함 → 甲이 이의 제기 불가, 2차 대여금 원금 2,300만 전체 충당 후 남은 700만도 2차 대여금 원금에 충당 → 법원은 2차 대여금 청구 전부 기각해야 함", "변제"],
["101.ㄷ", "甲은 乙에게 (1) 2021. 10. 5. 2억 원을 이자 월 0.5%(매월 4. 후불로 지급), 변제기 2022. 10. 4.로 정하여 대여하고(이하 '제1차 대여'), (2) 2022. 3. 5. 2,000만 원을 이자 월 1%(매월 4. 후불로 지급), 변제기 2023. 3. 4.로 정하여 대여(이하 '제2차 대여')하였다. 乙은 위 각 대여금에 대한 원금 및 이자 등을 전혀 변제하지 않다가 2023. 6. 4. 甲에게 3,000만 원을 지급하였다.§乙의 위 3,000만 원 지급 시 乙이 별다른 말없이 돈을 교부하였고 甲도 말없이 수령하였는데 위 설문의 사실관계와 달리 '제1차 대여'의 이자율이 월 0.5%가 아니라 월 1%인 경우라면, 법원은 甲의 청구를 일부인용하는 판결을 선고해야 하나 그 범위는 위 ㄱ과 다르다.", true, "▸ 각 부채권 합계액 2,300만에 우선 충당은 ㄱ과 동일. 그 후 남은 700만은 모두 변제기 도래, 변제이익 동일하므로 변제기 먼저 도래한 1차 대여금 원금 2억에 우선 충당 → 법원은 2차 대여금 청구에 원금 2,000만 원 및 23.6.5.부터 지연손해금 인용", "변제"],
["102.ㄴ", "甲은 乙로부터 2019. 5. 1. 2,000만 원을 빌리면서(A 차용금) 이자는 월 1%로 매월 말일 지급하기로 하고 변제기는 2019. 12. 31.로 정하였다. 2019. 10. 1. 甲은 다시 乙로부터 2,000만 원을 빌렸고(B 차용금), 이자는 월 1.5%로 매월 말일에 지급하며 변제기는 2020. 4. 30.로 정하였다.§甲에게 어느 채무에 충당할지에 대한 지정권이 있고 甲이 이를 행사하지 않는 경우 乙이 지정권을 행사할 수 있지만, 乙의 지정에 의한 변제의 충당에 대하여 甲은 즉시 이의를 제기할 수 있다.", true, "▸ 지정충당(476조): 1차 변제자 → 2차 수령자(단, 변제자 즉시 이의하면 법정충당 [통설])", "변제"],
["102.ㄷ", "甲은 乙로부터 2019. 5. 1. 2,000만 원을 빌리면서(A 차용금) 이자는 월 1%로 매월 말일 지급하기로 하고 변제기는 2019. 12. 31.로 정하였다. 2019. 10. 1. 甲은 다시 乙로부터 2,000만 원을 빌렸고(B 차용금), 이자는 월 1.5%로 매월 말일에 지급하며 변제기는 2020. 4. 30.로 정하였다.§甲이 乙에게 2020. 1. 31. 1,000만 원을 변제한 경우, 법정변제충당의 순서는 고이율의 이자로 변제이익이 많은 B 차용금의 원본이 A 차용금의 원본보다 우선한다.", false, "▸ 변제일 20.1.31. 현재 A 차용금은 변제기 도래, B 차용금은 변제기 미도래이므로 변제이익(2호)까지 검토할 필요 없이 A 차용금에 우선 충당됨(1호)", "변제"],
["103.①", "변제충당에 관한 규정은 임의규정이므로 채권자와 채무자 사이의 합의에 따라 비용, 이자, 원본의 순서와 다르게 충당할 수도 있고, 이는 임의경매절차에서 배당금이 담보권자가 가지는 수 개의 피담보채권 전부를 소멸시키기에 부족한 경우에도 마찬가지이다.", false, "▸ [95다55504, 2000다51339] [AI해설] 경매에서는 합의충당 X → 획일적으로 가장 공평 타당한 477조 법정충당 O — 임의경매절차에서 배당금이 담보권자가 가지는 수 개의 피담보채권 전부를 소멸시키기에 부족한 경우도 마찬가지", "변제"],
["103.②", "변제자가 보증인인 경우 그 보증채무는 변제자 자신의 채무에 비하여 변제의 이익이 적으며, 변제자가 주채무자인 경우 보증인이 있는 채무는 보증인이 없는 채무에 비하여 변제의 이익이 적다.", false, "▸ 보증인으로서 부담하는 보증채무(연대보증채무 포함)는 변제자 자신의 채무에 비하여 변제이익이 적음 [99다68652] → 지문 전단은 O. 보증인이 있는 채무와 없는 채무, 물상보증인 제공 물적 담보가 있는 채무와 없는 채무는 변제이익 차이 없음 [2013다8250] → 지문 후단은 X", "변제"],
["103.④", "채무자가 이행기가 도래한 수 개의 채무를 변제할 경우 그 법정충당의 순서는, 변제이익이 가장 큰 채무의 비용, 이자, 원본의 순서로 충당한 뒤, 그 다음으로 변제이익이 큰 채무의 비용, 이자, 원본의 순서로 충당하는 방식에 의한다.", false, "▸ 변제충당의 순서: 합의충당 → 비용·이자·원본충당 → 지정충당 → 법정충당 順. 법정충당에서 변제이익 기준보다 비용·이자·원본의 순서가 먼저임", "변제"],
["103.⑤", "변제충당의 지정이나 합의가 있었다는 점은 이를 주장하는 자에게 주장 및 증명책임이 있으나 법정충당의 우선순위에 있게 되는 사정에 관하여는 법원이 직권으로 조사하여야 한다.", false, "▸ 477조 4호 안분비례 법정충당과 달리 그 이상으로 자신에게 유리한 합의·지정·우선적 법정충당 주장하는 자는 이를 주장·증명할 책임 부담 → 증명 못하면 각 채무액 안분비례 법정충당 [2007다77712, 2021다247937]", "변제"],
["104.ㄱ", "甲은 乙에 대한 3억 원의 대여금 채권을 담보하기 위하여, 乙 소유의 X 토지, 丙 소유의 Y 토지, 丁 소유의 Z 토지에 각각 저당권을 취득하였고 戊와는 보증계약을 체결하였다. (이자·지연손해금·집행비용은 불고려, 각 지문 독립적)§丙이 乙의 채무를 면책적으로 인수한 경우, 丙은 특별한 사정이 없는 한 乙에 대하여 구상권을 가진다.", false, "▸ 물상보증인의 구상권 취득요건에 면책적 채무인수는 포함 X ∵ 채무소멸 X → 물상보증인이 면책적 채무인수 해도 구상권 X [2017다274703]", "변제자대위"],
["104.ㄴ", "甲은 乙에 대한 3억 원의 대여금 채권을 담보하기 위하여, 乙 소유의 X 토지, 丙 소유의 Y 토지, 丁 소유의 Z 토지에 각각 저당권을 취득하였고 戊와는 보증계약을 체결하였다. (이자·지연손해금·집행비용은 불고려, 각 지문 독립적)§A가 乙로부터 X 토지를 취득한 후에 戊가 甲에게 3억 원을 변제한 경우, 戊는 X 토지에 설정된 위 저당권에 관하여 대위의 부기등기를 하지 않더라도 A에 대하여 甲을 대위할 수 있다.", true, "▸ 지문 ㄴ, ㄷ 관련: 제3취득자가 목적부동산 권리 취득한 ‘후’ 채무 변제한 보증인은 대위 부기등기 없이도 대위 O ∵ 482조 2항 1호는 제3취득자를 예측 불허 손해로부터 보호, 보증인 변제 전 권리 취득한 제3취득자는 등기부상 저당권 존재 알고 권리 취득하여 불측 손해 염려 X [2019다222041]", "변제자대위"],
["104.ㄷ", "甲은 乙에 대한 3억 원의 대여금 채권을 담보하기 위하여, 乙 소유의 X 토지, 丙 소유의 Y 토지, 丁 소유의 Z 토지에 각각 저당권을 취득하였고 戊와는 보증계약을 체결하였다. (이자·지연손해금·집행비용은 불고려, 각 지문 독립적)§乙로부터 X 토지를 취득한 A가 X 토지에 설정된 위 저당권의 실행으로 소유권을 잃은 경우, A는 丙, 丁에 대하여 甲을 대위할 수 없다.", true, "▸ 482조 2항에 ‘물상보증인’과 ‘제3취득자’ 상호간 변제자대위에 관하여 규정 無, 물상보증인이 채무 변제나 담보권 실행으로 소유권 잃은 때에는 보증인과 마찬가지로 제3취득자에 대하여 구상권 범위 내 채권자를 대위 O, 그러나 제3취득자는 채무 변제나 담보권 실행으로 소유권 잃더라도 물상보증인에 대하여 채권자를 대위 X ∵ 370조·341조는 물상보증인에게 보증인의 구상권 준용 인정, 482조 2항 5호는 보증인·물상보증인을 인원수 비례로 대위하게 하여 우열 X, 만일 물상보증인·제3취득자 상호간 각 부동산 가액 비례로 대위하게 하면 우연한 사정으로 뜻밖의 손해·이익을 주어 부당, 482조 2항 1, 2호 [2011다50233]", "변제자대위"],
["104.ㄹ", "甲은 乙에 대한 3억 원의 대여금 채권을 담보하기 위하여, 乙 소유의 X 토지, 丙 소유의 Y 토지, 丁 소유의 Z 토지에 각각 저당권을 취득하였고 戊와는 보증계약을 체결하였다. (이자·지연손해금·집행비용은 불고려, 각 지문 독립적)§丙이 甲에게 3억 원을 변제한 후 Z 토지에 설정된 위 저당권에 관하여 대위의 부기등기를 하지 않고 있는 동안에 A가 丁으로부터 Z 토지를 취득한 경우, 丙은 Z 토지에 설정된 위 저당권에 관하여 대위의 부기등기를 하지 않더라도 A에 대하여 甲을 대위할 수 있다.", false, "▸ 공동저당에서 자기 소유 부동산이 먼저 경매된 물상보증인이 다른 부동산에 미리 대위의 부기등기를 하지 않은 사이에 제3취득자가 부동산을 취득하면 482조 2항 5호 단서가 적용되어 대위 X [90다카10305] → 이 법리는 물보1·물보2 사안에서도 동일 적용됨(전자는 채무자에 대한 변제자대위, 후자는 법정대위자 상호간 변제자대위인 차이일 뿐)", "변제자대위"],
["106.ㄱ", "채무를 변제할 정당한 이익이 있는 자가 채무를 대위변제한 경우에 통상 채무자에 대하여 구상권을 가짐과 동시에 변제자의 법정대위에 관한 「민법」 제481조에 의하여 당연히 채권자를 대위하나, 위 구상권과 변제자대위권은 별개의 권리이므로, 대위변제자와 채무자 사이에 구상금에 관한 지연손해금 약정이 있더라도 이 약정은 변제자대위권을 행사하는 경우에는 적용될 수 없다.", true, "▸ 물상보증인(연대채무자 1인)이 채무자(다른 연대채무자)를 위해 변제한 경우 구상권을 가짐과 동시에 당연히 채권자를 대위 → 구상권과 변제자대위권은 원본·변제기·이자·지연손해금 유무 등에 내용이 다른 → 별개의 권리, 행사자 선택의 자유 [97다1556, 2013다214970] → 대위변제자와 채무자 사이에 구상금에 관한 지연손해금 약정이 있더라도 구상금이 아닌 변제자대위권 행사할 경우에는 적용되지 X [2005다32418]", "변제자대위"],
["106.ㄴ", "변제할 정당한 이익이 있는 자가 채무자를 위하여 근저당권의 피담보채무의 일부를 대위변제한 경우에 대위변제자는 피담보채무의 일부 대위변제를 원인으로 한 근저당권 일부이전의 부기등기의 경료 여부와 관계없이 변제한 가액의 범위 내에서 종래 채권자가 가지고 있던 채권 및 담보에 관한 권리를 법률상 당연히 취득하게 되는 것이므로, 이러한 경우에 대위변제자는 위 채권자보다 우선하여 배당받는다.", false, "▸ 근저당권의 피담보채권 확정 전(=거래관계 종료 전)에 그 채권의 일부를 양도·대위변제한 경우 근저당권이 양수인·대위변제자에게 이전할 여지 X → 그러나 피담보채권 확정되면 최고액 초과하지 않는 한 ‘근저당권’이나 ‘경락대금에 대한 권리’ 중 그 ‘피담보채권액을 담보하고 남는 부분’은 저당권의 일부이전 부기등기의 경료 여부와 관계없이 대위변제자에게 법률상 당연히 이전 O [2001다53929] → 확정되어야 이전하고 그 경우에도 일부 대위변제자보다 채권자가 우선변제권 있음", "변제자대위"],
["106.ㄷ", "채무자 소유 부동산과 물상보증인 소유 부동산에 공동근저당권을 설정한 채권자가 채무자 소유 부동산에 대한 담보를 상실하게 하거나 감소하게 한 경우, 공동근저당권자는 물상보증인 소유 부동산에 관한 경매절차에서 물상보증인이 담보 상실 내지 감소로 인한 면책을 주장할 수 있는 한도에서, 물상보증인 소유 부동산의 후순위 근저당권자에 우선하여 배당받을 수 없다.", true, "▸ 채무자 및 물상보증인 각 소유 부동산의 공동근저당권자가 채무자 소유 부동산 담보를 상실·감소케 하면, 물상보증인은 그로 인해 상환받을 수 없는 한도에서 면책 O ∵ 물상보증인의 변제자대위 기대권은 485조로 보호 → 이 경우 물보 소유 부동산 경매절차에서, 공동근저당권자는 위 물보 소유 부동산의 면책 주장 한도에서 물보 소유 부동산의 후순위 근저당권자에 우선하여 배당 X [2017다292756]", "변제자대위"],
["105", "甲은 2020. 8. 11. 乙과 대출계약을 체결하면서 乙에 대한 채권을 담보하기 위하여 乙 소유의 X 토지에 채권최고액 12억 원의 근저당권을 설정하였고, 丙과 丁이 乙의 부탁을 받아 甲과 연대보증계약을 체결하였다. 甲은 乙이 위 채무를 변제하지 않자 2023. 1. 23. X 토지에 관하여 위 근저당권에 기한 임의경매를 신청하였고, 경매신청 시 甲의 乙에 대한 채권액은 12억 원이었다. 경매절차 진행 중 丙은 4억 원, 丁은 2억 원을 각 甲에게 변제하였고, 그에 따라 甲으로부터 근저당권 일부의 이전등기를 받았다. 甲은 경매신청 후 2023. 5. 12. 乙에게 3억 원을 추가로 대여하였고, 경매절차에서 戊가 X 토지를 9억 원에 매수하여 2023. 8. 18. 그 대금을 완납하였다.§위 경매절차에서 甲, 丙, 丁에게 각 배당될 금액의 조합으로 옳은 것은? → 정답: 甲 6억 원, 丙 2억 원, 丁 1억 원", false, "▸ 근저당권자 스스로 경매신청하면 경매신청 시에 피담보채무 원본 확정되므로 사안에서 甲이 경매를 신청한 후 추가 대출한 3억 원은 X토지의 근저당권으로 배당받을 수 없고, 결국 甲은 12억 원을 배당받을 수 있음. 한편 丙·丁은 연대보증인으로서 각 4억 원, 2억 원씩 변제했으니 변제자로서 일부대위 가능. 그러나 일부대위자와 채권자 사이 관계에 대하여 통설·판례는 채권자우선설 → 결론적으로 甲은 12억 원 중 변제받은 6억 원을 제외한 [6억] 원을 우선배당받고, 경매대금에서 남은 3억 원(= 9억 − 6억)은 丙, 丁이 변제한 금액에 비례하여 각 [2억] 원, [1억] 원으로 배당받음", "변제자대위"],
["107.ㄷ", "甲은 乙에게 1억 원을 대여하면서 乙 소유인 X 토지상의 근저당권을 설정받았다. 丙은 乙의 부탁을 받고 乙의 위 채무를 보증하였다. 변제기가 도래하였음에도 乙이 채무를 변제하지 않고 있다.§丙이 보증채무를 모두 변제하였다. 丙이 X 토지상의 근저당권에 관하여 자신의 명의로 부기등기를 경료하지 않고 있는 사이에 乙은 다시 丁으로부터 금원을 차용하고 丁에게 제2순위 근저당권을 설정하여 주었다. X 토지가 경매되는 경우 丙이 변제사실을 증명하여 배당요구하면 丙은 丁보다 우선하여 배당받을 수 있다.", true, "▸ 저당 부동산에 대하여 후순위 저당권을 취득한 제3자는 제3취득자 X → 보증인은 미리 대위 부기등기 없었어도 후순위 저당권자에 대하여 대위 O, 후순위 저당권자도 보증인에 대하여 대위 O ∵ 저당부동산에 소유권·지상권·전세권을 취득한 제3취득자는 364조, 367조 등 이익보호 규정 있으므로 482조 2항 1, 2호가 제3취득자보다 보증인을 보호한 취지였는데, 후순위 저당권을 취득한 자는 이익보호 규정 無 [2012다48855] 다만 예외적으로 선순위 저당권등기 ‘불법 말소’ 후 새로 저당권 취득한 자는 제3취득자에 포함시키는 해석을 하였음 [2011다30666]", "변제자대위"],
["SS16.ㄹ", "물상보증인 소유 부동산과 채무자 소유 부동산에 공동저당이 설정된 경우, 물상보증인이 저당권의 실행으로 그 소유권을 잃은 때에는 채무자로부터 담보부동산을 취득한 제3자에 대하여 구상권의 범위 내에서 위 각 부동산의 가액에 비례하여 채권자를 대위할 수 있다.", false, "▸ [AI해설] 물상보증인이 채무 변제나 담보권 실행으로 소유권 잃은 때에는 보증인과 마찬가지로 제3취득자에 대하여 구상권 범위 내 채권자를 대위 O. 그러나 제3취득자는 채무 변제나 담보권 실행으로 소유권 잃더라도 물상보증인에 대하여 채권자를 대위 X ∵ 370조·341조는 물상보증인에게 보증인의 구상권 준용 인정, 482조 2항 5호는 보증인·물상보증인을 인원수 비례로 대위하게 하여 우열 X, 만일 물상보증인·제3취득자 상호간 각 부동산 가액 비례로 대위하게 하면 우연한 사정으로 뜻밖의 손해·이익을 주어 부당 [2011다50233]", "변제자대위"],
["SS17.ㄱ", "변제자가 주채무자인 경우 보증인이 있는 채무와 보증인이 없는 채무 사이에 변제이익은 같으며, 변제자가 채무자인 경우 물상보증인이 제공한 물적 담보가 있는 채무와 그러한 담보가 없는 채무 사이에도 변제이익의 차이는 없다.", true, "▸ 보증인이 있는 채무와 없는 채무, 물상보증인이 제공 물적 담보가 있는 채무와 없는 채무는 변제이익 차이 없고 동일함 [2013다8250]", "변제자대위"],
["SS17.ㄴ", "乙의 甲에 대한 금전채무를 담보하기 위해 乙의 부동산과 丙의 부동산에 甲 명의의 공동저당권이 설정되었고 이후 丙의 부동산에 丁 명의의 소유권이전등기청구권 가등기가 설정된 경우이다.§丙의 부동산에 경매가 실행되어 배당이 이루어졌으나 乙의 채무 일부가 여전히 남아 있는 상태라면 丁은 乙의 의사에 반하여 乙의 甲에 대한 채무 잔액을 대위변제할 수 있다.", false, "▸ 공동저당에서 물상보증인 소유 후순위담보권자는 공동저당권자가 물보 소유물에서 배당받고 남은 채무를 채무자 의사에 反하여 대위변제할 이해관계 X ∵ 물상보증인이 대위취득한 채무자 소유 부동산에 대한 공동저당권자의 저당권을 후순위담보권자가 물상대위할 수 있으므로 집행 받거나 권리 잃을 지위 없음 [2008마109] → 해당 사안에서 후순위담보권자가 소유권이전청구권 가등기를 마친 자임", "변제자대위"],
["SS17.ㄷ", "乙의 甲에 대한 금전채무를 담보하기 위해 乙의 부동산과 丙의 부동산에 甲 명의의 공동저당권이 설정되었고 이후 丙의 부동산에 丁 명의의 소유권이전등기청구권 가등기가 설정된 경우이다.§乙의 甲에 대한 금전채무를 담보하기 위해 乙의 부동산과 丙의 부동산에 甲 명의의 누적적 근저당권을 설정하였고 丙의 부동산에 경매가 실행되어 甲이 그 매각대금에서 변제를 받은 경우, 丙은 甲의 乙의 부동산에 관한 근저당권을 대위취득하여 행사할 수 있다.", true, "▸ 1개 기본계약에서 발생하는 동일한 채권을 담보하기 위해 여러 부동산에 근저당권 설정하면서, 각 근저당권 채권최고액 합한 금액을 우선변제받기 위해 ‘공동근저당권’ 형식이 아닌 ‘개별 근저당권’ 형식 취하면, 누적적 담보 O, 368조 X → 동시·이시배당 선택 O, 최고액 범위에서 피담보채권 전부·일부 우선변제 받은 다음 피담보채권 소멸할 때까지 나머지 근저당권 실행하여 그 근저당권의 최고액 범위에서 다시 반복하여 우선변제 O → 채무자·물상보증인 각 소유 부동산에 누적적 근저당권 설정받고 물보 소유 부동산 먼저 경매되어 변제받은 경우, 물상보증인은 채무자에 대해 구상권 취득 및 변제자대위권으로 종래 채권자 보유하던 채무자 소유 부동산에 관한 근저당권 대위취득 행사 O [2014다51756]", "변제자대위"],
["SS17.ㄹ", "수급인이 공사대금의 지급에 갈음하여 도급인과 수급인이 완공한 건물을 대물변제받기로 약정한 경우, 도급인이 수급인에게 공사대금을 지급하였더라도 수급인은 위 대물변제계약에 기하여 그 건물에 대한 소유권이전등기를 청구할 수 있다.", false, "▸ 대물변제는 ‘이행’을 해야 ‘성립’하는 요물계약 → 대물변제 성립 전에 본래 급부 내용대로 이행하는 ‘변제’했다면 채무 소멸, 대물변제 불성립 → 대물변제 이행 청구 X", "변제자대위"],
["108.①", "B는 A로부터 1억 원을 차용하면서 A에게 본인 소유의 X부동산에 관하여 저당권을 설정해 주었다. D는 A에게 위 차용금채무의 담보로 본인 소유인 Y부동산에 관하여 저당권을 설정해 주었다. C는 B의 A에 대한 채무를 연대보증하였다. B는 1억 원의 금전채권자 K에게 X부동산에 관하여 2순위로 저당권을 설정해 준 후 B는 X부동산을 E에게 매도하고 이전등기를 마쳐주었다.§E�� 변제할 정당한 이익이 있는 자로서 변제로 당연히 A를 대위한다. E가 C와 D에 대하여 A를 대위하기 위해서는 대위의 부기등기를 하여야 한다.", false, "▸ 제482조(변제자대위의 효과, 대위자간의 관계) ② 전항의 권리행사는 다음 각호의 규정에 의하여야 한다. 2. 제3취득자는 보증인에 대하여 채권자를 대위하지 못한다. ▸ 482조 2항에 ‘물상보증인’과 ‘제3취득자’ 상호간 변제자대위에 관하여 규정 無. 물상보증인이 채무 변제나 담보권 실행으로 소유권 잃은 때에는 보증인과 마찬가지로 제3취득자에 대하여 구상권 범위 내 채권자를 대위 O. 그러나 제3취득자는 채무 변제나 담보권 실행으로 소유권 잃더라도 물상보증인에 대하여 채권자를 대위 X [2011다50233] ▸ E는 채무자로부터의 ‘제3취득자’로서 변제로 당연히 A를 대위하더라도 B에 대하여만 대위가 가능하고, 연대보증인 C, 물상보증인 D에 대해서는 대위 자체를 할 수 없음(부기등기를 할 필요성을 따질 필요도 없음)", "변제자대위"],
["109.①", "대위변제의 정당한 이익을 갖는 자가 있다는 사정만으로 채권자가 자신의 채권이나 담보권을 성실히 행사하여야 할 의무를 부담한다고 할 수 없으므로, 특단의 사정이 없는 한 채권자가 자신의 채권이나 담보권을 행사하지 않거나 포기하였다고 하여 이를 불법행위에 해당한다고 할 수 없다.", true, "▸ 담보권 행사는 채권자의 선택이므로, 법정대위자가 있다고 하더라도 채권자가 자신의 채권이나 담보권을 성실히 행사할 의무 X, 채권·담보권의 불행사·포기가 485조 면책이 적용되는 별론으로 해도 불법행위는 X [2001다42677]", "변제자대위"],
["109.③", "근저당권의 피담보채권의 일부를 대위변제한 경우, 피담보채권이 확정되기 전이라면 대위변제자는 채권자를 대위할 수 없다.", true, "▸ [2001다53929] [AI해설] 근저당권의 피담보채권 확정 전(=거래관계 종료 전)에 그 채권의 일부를 양도·대위변제한 경우 근저당권이 양수인·대위변제자에게 이전할 여지 X. 그러나 피담보채권 확정되면 최고액 초과하지 않는 한 '근저당권'이나 '경락대금에 대한 권리' 중 그 '피담보채권액을 담보하고 남는 부분'은 저당권의 일부이전 부기등기의 경료 여부와 관계없이 대위변제자에게 법률상 당연히 이전 O → 확정되어야 이전하고 그 경우에도 일부 대위변제자보다 채권자가 우선변제권 있음", "변제자대위"],
["109.⑤", "보증인이 채무자 소유 부동산에 설정된 선순위저당권의 피담보채권을 대위변제한 경우, 대위의 부기등기가 없다면 저당부동산의 후순위저당권자에게 변제자대위를 주장할 수 없다.", false, "▸ [2012다48855] [AI해설] 저당 부동산에 대하여 후순위 저당권을 취득한 제3자는 제3취득자 X → 보증인은 미리 대위 부기등기 없었어도 후순위 저당권자에 대하여 대위 O, 후순위 저당권자도 보증인에 대하여 대위 O ∵ 저당부동산에 소유권·지상권·전세권을 취득한 제3취득자는 364조, 367조 등 이익보호 규정 있으므로 482조 2항 1, 2호가 제3취득자보다 보증인을 보호한 취지였는데, 후순위 저당권을 취득한 자는 이익 보호 규정 無. 다만 예외적으로 선순위 저당권등기 '불법 말소' 후 새로 저당권 취득한 자는 제3취득자에 포함시키는 해석을 하였음 [2011다30666]", "변제자대위"],
["110.ㄴ", "공동저당의 목적인 물상보증인 소유의 부동산에 후순위로 담보가등기를 설정받은 자는 그 부동산에 대하여 먼저 경매가 실행되어 공동저당권자가 매각대금 전액을 배당받았으나 채무의 일부가 남아 있다면 채무자의 의사에 반하여 채무 잔액을 대위변제할 수 있다.", false, "▸ 공동저당에서 물상보증인 소유 후순위담보권자는 공동저당권자가 물보 소유물에서 배당받고 남은 채무를 채무자 의사에 反하여 대위변제할 이해관계 X, 단지 사실상 이해관계에 불과함 ∵ 물상보증인이 대위취득한 채무자 소유 부동산에 대한 공동저당권자의 저당권을 후순위담보권자가 물상대위 할 수 있으므로 집행 받거나 권리 잃을 지위 없음 [2008마109]", "변제자대위"],
["110.ㄹ", "채무자와 물상보증인 소유 부동산이 공동담보로 제공된 경우, 채무자로부터 담보부동산을 취득한 제3자가 채무를 변제하였다면 물상보증인에 대하여 담보부동산의 가액에 비례하여 채권자를 대위할 수 있다.", false, "▸ 482조 2항에 '물상보증인'과 '제3취득자' 상호간 변제자대위에 관하여 규정 無. 제3취득자는 채무 변제나 담보권 실행으로 소유권 잃더라도 물상보증인에 대하여 채권자를 대위 X → 가액에 비례할 필요 없고 전액을 대위 O (물보가 제3취득자에 대해서) [2011다50233]", "변제자대위"],
["111.①", "변제공탁의 요건 중 '변제자가 과실 없이 채권자를 알 수 없는 경우'라 함은 객관적으로 채권자 또는 변제수령권자가 존재하고 있으나 채무자가 선량한 관리자의 주의를 다하여도 채권자가 누구인지를 알 수 없는 경우를 말한다.", true, "▸ [2000다55904] [AI해설] 변제공탁 요건 중 '채권자를 알 수 없는 경우'는 채권자 또는 변제수령권자가 객관적으로 존재하나 채무자가 선관주의를 다하여도 채권자가 누구인지 알 수 없는 경우를 말하며, 채권자 불확지 변제공탁의 근거 조항 [2000다55904]", "대물변제공탁경개면제혼동"],
["111.②", "변제공탁의 목적인 채무는 현존하는 확정채무일 필요는 없으므로 장래의 채무나 불확정채무도 변제공탁의 목적이 될 수 있다.", false, "▸ 변제공탁의 목적 채무는 현존하는 확정채무여야 → 장래 채무나 불확정채무는 원칙적 변제공탁 X, 각 채권자의 채권이 모두 동일한 채권일 필요는 없음 [2014다207245]", "대물변제공탁경개면제혼동"],
["111.③", "채권자의 태도로 보아 채무자가 설사 채무의 이행제공을 하였더라도 그 수령을 거절하였을 것이 명백한 경우에는 채무자는 이행의 제공을 하지 않고 바로 변제공탁할 수 있다.", true, "▸ [93다42276] → 위 경우는 구두제공조차 필요 없이 채무불이행 면하고 공탁 가능", "대물변제공탁경개면제혼동"],
["111.④", "변제공탁이 적법한 경우에는 채권자가 공탁물 출급청구를 하였는지와 관계없이 공탁을 한 때에 변제의 효력이 발생한다.", true, "▸ 변제공탁 적법하면 채권자 출급 여부 관계없이 공탁한 때 변제 효력 발생 [2018마5697]", "대물변제공탁경개면제혼동"],
["111.⑤", "공탁물 출급청구권과 공탁물 회수청구권은 서로 독립한 별개의 청구권이므로 공탁물 출급청구권에 대한 압류는 공탁물 회수청구권에 대하여 영향을 미치지 않는다.", true, "▸ 공탁물 '출급청구권'과 '회수청구권'은 서로 독립한 별개 청구권 → 출급청구권에 대한 압류는 회수청구권에 아무런 영향 X [2018마5697]", "대물변제공탁경개면제혼동"],
["112.ㄱ", "공동불법행위자 중 1인이 피해자로부터 손해배상채무를 면제받았더라도 다른 공동불법행위자는 피해자에 대한 채무 전부를 이행하여야 한다.", true, "▸ 연대채무 채무면제 419조는 공동불법행위자 상호간 부진정연대채무에 적용 X, 효력 미치지 X [79다1107]", "대물변제공탁경개면제혼동"],
["112.ㄴ", "연대채무자 甲, 乙이 A에게 부담하는 채무액이 3억 원이고 甲과 乙의 부담비율이 2:1인데 甲이 A로부터 1억 5천만 원의 범위에서 채무를 면제받은 경우, 乙의 A에 대한 채무액은 2억 5천만 원으로 감소한다.", true, "▸ 채권자가 연대채무자 중 1인의 채무를 '일부' 면제한 경우도 특별한 사정이 없는 한 면제된 부담부분에 한하여 419조 면제의 절대적 효력 O. 피면제자의 잔존 채무액이 부담부분보다 적다면 그 차액 범위에서 면제의 절대적 효력 발생하여 다른 연대채무자의 채무가 차액만큼 감소 O [2019다216435] → 설문에서 甲, 乙의 부담부분은 2억, 1억인데, A가 甲의 채무 3억 중 1.5억을 면제해주면 甲의 부담부분 2억 중에서 0.5억이 소멸하는 것이므로 乙의 채무액은 0.5억 소멸하여 2.5억이 남게 됨", "대물변제공탁경개면제혼동"],
["112.ㄷ", "지명채권 양수인이 '양도되는 채권의 채무자'인 때에는 채권양도에 따른 처분행위 시 채권과 채무가 동일한 주체에 귀속한 때에 해당하므로 채권이 혼동에 의하여 소멸한다.", true, "▸ 지명채권 양수인이 '양도되는 채권의 채무자'여서 507조 본문에 따라 채권이 혼동으로 소멸한 '후'에 채권 압류 등이 송달되면 압류 등은 무효 [2019다272855]", "대물변제공탁경개면제혼동"],
["112.ㄹ", "지명채권 양도 당시 확정일자 있는 증서에 의한 대항요건을 갖추지 못한 경우, 그 후 그 채권에 관해 이루어진 가압류 결정을 송달받은 제3채무자(지명채권 양수인)는 가압류채권자에게 혼동으로 대항하지 못한다.", false, "▸ [2019다272855] [AI해설] 대항요건을 갖추지 못했더라도 채권양도에 따른 처분행위 시점에 이미 혼동이 발생하여 채권이 소멸한다. 450조 2항의 제3자(=대항요건을 갖추지 못한 경우 대항할 수 없는 제3자)는 채권이 이전되어야 존재 가능한 제3자인데, 채권양도 시 혼동으로 이미 소멸했으므로 가압류채권자는 450조 2항의 제3자에 해당하지 않아 이미 소멸한 채권에 대한 가압류는 무효 → 따라서 양수인은 혼동으로 대항 O [2019다272855]", "대물변제공탁경개면제혼동"],
["113.①", "변제공탁의 효력이 발생하기 위해서는 채무 전부에 대한 변제의 제공 및 채무전액에 대한 공탁이 있어야 하지만, 채무 일부에 대한 공탁이 있는 경우 채권자가 공탁금을 채권의 일부에 충당한다는 유보의 의사표시를 하고 이를 수령한 때에는 그 공탁금은 채권의 일부의 변제에 충당된다.", true, "▸ 일부공탁 X → 전부무효 O, 채무 일부소멸 효과도 없음 [2005다37208]. 채무자가 전액임을 밝히고 공탁했는데 채권자가 명시·묵시적 유보 의사표시 없이 수령했다면 전부공탁 효력 O [83다카88]. 채권자가 일부에 충당한다는 유보 의사표시하고 수령했다면 채무 일부소멸 [2008다51359]", "대물변제공탁경개면제혼동"],
["114.ㄴ", "甲이 乙에 대한 공사대금채권의 일부를 丙에게 양도하고 통지한 후 丙이 乙에게 양수금의 지급을 청구하자 乙이 甲에 대한 하자보수에 갈음한 손해배상채권으로써 상계를 주장하였다.", true, "▸ 자동채권과 수동채권이 서로 동시이행 관계에 있는 경우에는 양도통지가 채무자에게 도달하여 대항요건이 갖춰진 후에 자동채권이 발생했더라도 채무자는 동시이행항변권을 주장할 수 있고 따라서 상계로 대항 O [2014다80945]", "상계"],
["115.③", "도급인 甲과 수급인 乙은 2023. 2. 1. 건물신축공사에 관한 도급계약을 체결하면서 완공 즉시 공사대금을 지급하기로 하였고, 乙은 2023. 9. 1. 공사를 완료하였다. (각 지문은 독립적)§丙이 乙의 甲에 대한 공사대금 채권에 대하여 2023. 4. 1. 압류 및 전부명령을 받고 그 다음 날 甲, 乙에게 위 압류 및 전부명령이 모두 송달되어 확정된 경우, 甲이 위 압류 및 전부명령을 송달받기 전에 乙에 대한 대여금 채권을 가지고 있었고 그 대여금 채권의 변제기가 2023. 8. 1.이라면 甲은 乙에 대한 대여금 채권을 자동채권으로 하여 丙의 전부금 채권과 상계할 수 있다.", true, "▸ 압류명령 받은 제3채무자가 압류채무자에 대한 반대채권을 가지고 있는 경우 상계로써 압류채권자에게 대항하려면, ⓐ 압류 효력 발생 당시 양 채권이 상계적상에 있거나, ⓑ 당시 자동채권이 변제기에 이르지 않았다면 수동채권(피압류채권)의 변제기와 동시에 또는 보다 먼저 변제기에 도달하는 경우여야 [2011다45521] → '변제기 선도래설'. 甲의 채권 변제기(23.8.1.)가 압류된 乙의 채권 변제기(23.9.1. 완공시)보다 먼저이므로 甲은 丙과 상계 O", "상계"],
["115.④", "도급인 甲과 수급인 乙은 2023. 2. 1. 건물신축공사에 관한 도급계약을 체결하면서 완공 즉시 공사대금을 지급하기로 하였고, 乙은 2023. 9. 1. 공사를 완료하였다. (각 지문은 독립적)§乙이 2023. 10. 1. 丙에게 甲에 대한 공사대금 채권을 양도하고 2023. 11. 1. 甲에게 확정일자 있는 증서에 의한 양도통지가 도달한 경우, 丙이 양수금 채권으로 甲의 丙에 대한 2023. 9. 1.이 변제기인 대여금 채권과 상계한다면 그 상계적상일은 2023. 11. 1.이다.", false, "▸ 채권양수인이 양수채권을 자동채권으로 하여 상계하는 경우, 상계적상일은 채권양도 전에 이미 도래한 양 채권의 변제기 X, 채권양도 대항요건 갖춘 시점 O ∵ 양 채권의 변제기(23.9.1.)가 모두 채권양도 통지일(23.11.1.)보다 앞서므로 채권양도 통지일이 상계적상일 [2022다200089]", "상계"],
["115.⑤", "도급인 甲과 수급인 乙은 2023. 2. 1. 건물신축공사에 관한 도급계약을 체결하면서 완공 즉시 공사대금을 지급하기로 하였고, 乙은 2023. 9. 1. 공사를 완료하였다. (각 지문은 독립적)§乙이 2023. 4. 1. 丙에게 甲에 대한 공사대금 채권을 양도하고 그 다음 날 甲에게 확정일자 있는 증서에 의한 양도통지가 도달한 다음, 乙의 채권자 丁이 2023. 5. 1. 乙의 甲에 대한 공사대금 채권에 대하여 압류명령을 받은 경우, 그 후 乙의 다른 채권자인 戊가 제기한 사해행위취소소송에 의하여 위 채권양도가 취소되었다면 위 압류명령은 장래에 乙에게 원상회복될 공사대금 채권에 대한 것으로서 유효하다.", false, "▸ 압류 당시 피압류채권이 이미 대항요건 갖춰 양도되어 압류명령이 무효로 된 경우, 그 후 사해행위취소로 채권이 원채권자에게 복귀해도 이미 무효로 된 압류명령이 다시 유효로 될 수는 X ∵ 사해행위취소의 상대효 및 비소급효 [2019다235702, 2022다247521]", "상계"],
["116.ㄱ", "甲은 자신의 X 토지에 Y 건물을 신축하기 위해 공사업자인 乙과 공사도급계약을 체결하였다. 甲은 乙이 丙으로부터 X 토지를 담보로 대출을 받아 그 공사 비용을 지출할 수 있도록 하기 위하여 X 토지에 관하여 채권자를 丙, 채무자를 乙로 하는 근저당권을 설정해 주었고, 乙은 丙으로부터 대출받은 돈을 공사대금으로 사용하였다. 공사 진행 도중 乙의 채권자인 丁은 乙의 甲에 대한 공사대금채권 중 일부에 대한 압류 및 전부명령을 받아 그대로 확정되었다. 이후 공사가 완료되었음에도 乙이 丙에 대한 대출금을 변제하지 못하자 甲은 乙을 대위하여 丙에게 대출금 및 연체이자를 변제하였다.§전부명령이 甲에게 송달된 때에 소급하여 전부된 채권 부분과 전부되지 않은 채권 부분에 대하여 丁과 乙에게 분할채권이 성립하게 된다.", true, "▸ 가분적인 금전채권의 일부에 대한 전부명령이 확정되면 특별한 사정이 없는 한 전부명령이 제3채무자에게 송달된 때에 소급하여 전부된 채권 부분과 전부되지 않은 채권 부분에 대하여 각기 독립한 분할채권이 성립 [2007다35152]", "상계"],
["116.ㄴ", "甲은 자신의 X 토지에 Y 건물을 신축하기 위해 공사업자인 乙과 공사도급계약을 체결하였다. 甲은 乙이 丙으로부터 X 토지를 담보로 대출을 받아 그 공사 비용을 지출할 수 있도록 하기 위하여 X 토지에 관하여 채권자를 丙, 채무자를 乙로 하는 근저당권을 설정해 주었고, 乙은 丙으로부터 대출받은 돈을 공사대금으로 사용하였다. 공사 진행 도중 乙의 채권자인 丁은 乙의 甲에 대한 공사대금채권 중 일부에 대한 압류 및 전부명령을 받아 그대로 확정되었다. 이후 공사가 완료되었음에도 乙이 丙에 대한 대출금을 변제하지 못하자 甲은 乙을 대위하여 丙에게 대출금 및 연체이자를 변제하였다.§乙의 Y 건물 인도의무는 甲의 공사대금채무와 동시이행관계에 있으나, 乙의 X 토지에 대한 근저당권말소의무는 위 공사도급계약상 고유한 대가관계가 있는 의무가 아니므로 甲의 공사대금채무와 이행상 견련관계를 인정할 수 없다.", false, "▸ 수급인의 근저당권말소의무가 공사도급계약에서 파생되는 의무가 아니더라도, 도급인이 자신의 소유 토지에 근저당권을 설정해 주었고 그 피담보채무의 이행이 완료됨으로써 말소의무를 부담하게 된 경우, 수급인의 근저당권 말소의무는 도급인의 공사대금 지급의무와 대가관계에 있어 동시이행관계 O", "상계"],
["116.ㄷ", "甲은 자신의 X 토지에 Y 건물을 신축하기 위해 공사업자인 乙과 공사도급계약을 체결하였다. 甲은 乙이 丙으로부터 X 토지를 담보로 대출을 받아 그 공사 비용을 지출할 수 있도록 하기 위하여 X 토지에 관하여 채권자를 丙, 채무자를 乙로 하는 근저당권을 설정해 주었고, 乙은 丙으로부터 대출받은 돈을 공사대금으로 사용하였다. 공사 진행 도중 乙의 채권자인 丁은 乙의 甲에 대한 공사대금채권 중 일부에 대한 압류 및 전부명령을 받아 그대로 확정되었다. 이후 공사가 완료되었음에도 乙이 丙에 대한 대출금을 변제하지 못하자 甲은 乙을 대위하여 丙에게 대출금 및 연체이자를 변제하였다.§甲의 대위변제에 따른 乙의 구상금채무는 乙의 X 토지에 대한 근저당권말소의무의 변형물로서 그 대등액의 범위 내에서 甲의 공사대금채무와 동시이행관계에 있다.", true, "▸ 甲의 乙에 대한 구상금채권은 근저당권말소의무의 변형물로서 甲의 공사대금채무와 동시이행관계 O", "상계"],
["120.ㄱ", "제3채무자의 채무자에 대한 자동채권이 수동채권인 피압류채권과 동시이행의 관계에 있는 경우에는, 압류명령이 제3채무자에게 송달되어 압류의 효력이 생긴 후에 자동채권이 발생하였다고 하더라도, 제3채무자는 그 채권에 의한 상계로 압류채권자에게 대항할 수 있다.", true, "▸ 자동채권이 수동채권인 피압류채권과 동시이행 관계면 가압류명령 송달 이후 생긴 자동채권이어도 상계로써 압류채권자에게 대항 O ∵ 자동채권 발생의 기초 원인은 수동채권 가압류 전에 이미 성립·존재하고 있었으므로, 그 자동채권은 498조의 '지급금지명령을 받은 후에 취득한 채권'에 해당하지 X [2000다43819]", "상계"],
["120.ㄴ", "유치권이 인정되는 아파트를 경매로 매수한 자는 아파트 일부를 점유·사용하고 있는 유치권자에 대한 임료 상당의 부당이득 반환채권을 자동채권으로 하여 유치권자가 종전 소유자에 대하여 가지는 유익비상환채권을 상계할 수 있다.", false, "▸ 상대방의 상계자에 대한 채권이 아닌 제3자에 대한 채권을 수동채권으로 허용하면 상대방이 제3자로부터 현실급부 받을 이익 침해, 상계자만 독점 만족을 주어 부당 [2010다101394]", "상계"],
["120.ㄷ", "고의로 인한 불법행위나 중과실로 인한 불법행위 모두 피해자에게 현실의 변제를 받을 수 있도록 할 필요성은 동일하므로, 고의의 불법행위로 인한 손해배상채권에 대한 상계금지는 중과실의 불법행위로 인한 손해배상채권의 경우에도 적용할 수 있다.", false, "▸ 496조 고의 불법행위자의 상계금지는 중과실 불법행위까지 유추·확대 적용 X → 중과실 불법행위자는 상계 O [93다52808]", "상계"],
["121.ㄴ", "A채권(대여금채권): 甲은 2012. 12. 31. 乙에게 2,000만 원을 변제기 2013. 3. 5.로 정하여 대여하였다.§B채권(부당이득채권): 乙은 2012. 1. 1.부터 2012. 12. 31.까지 사이에 권원 없음을 알면서도 甲의 의사에 반하여 甲 소유인 X 아파트를 무단으로 점유하면서 사용하였다. 이로 인한 차임 상당 부당이득금은 2,000만 원이다.§C채권(컴퓨터 대금채권): 乙은 2012. 12. 5. 甲에게 컴퓨터 10대를 대금 2,000만 원, 대금지급기일 2013. 2. 5.로 정하여 매도하였고, 아직 컴퓨터를 인도하지 않았다.§D채권(양수금채권): 丙은 2012. 10. 1. 甲에게 2,000만 원을 변제기 2013. 2. 5.로 정하여 대여하였다. 乙은 2012. 12. 1. 丙으로부터 이 채권을 양수하였고, 丙이 양도통지를 보내어 그 통지가 2012. 12. 11. 甲에게 도달하였다.§乙은 2014. 1. 2. 甲에게 D 채권을 자동채권으로, B 채권을 수동채권으로 하여 상계의사표시를 하였다. 상계는 인정된다.", false, "▸ [민소] 확정판결 변론종결 전에 상계적상의 채권 있고 그 존재를 알았다면 변론종결 후에 상계 O, 청구이의의 O. 민집법 44조 2항 O ∵ 상계는 쌍방 채무가 상계적상에 있다고 바로 채무소멸 효력 생기는 것 아니고 상계 의사표시 있어야 비로소 효력 생기므로 [66다780]", "상계"],
["122.ㄱ", "도급인의 지체상금채권과 수급인의 공사대금채권은 서로 동시이행관계에 있으므로, 현실적으로 이행하여야 할 필요가 있는 경우가 아닌 한 상계가 가능하다.", false, "▸ 지체상금채권과 공사대금채권은 특별한 사정 없는 한 동시이행 X [2013다81224] → 따라서 甲이 채권양도 통지를 받은 후에 乙에 대한 지체상금채권이 생긴 경우에는, 丙의 甲에 대한 양수금청구(혹은 하도급법상 직접지급청구)에 대하여 甲이 지체상금채권을 가지고 상계를 주장하는 것은 불허(동이행 관계에 따른 예외 아님)", "상계"],
["122.ㄹ", "임대인으로서는 임대차계약이 존속 중이더라도 임대차보증금반환채무에 관한 기한의 이익을 포기하고 임차인에 대한 차임채권 또는 목적물의 멸실·훼손으로 인한 손해배상채권을 자동채권으로 하고 임차인의 임대차보증금반환채권을 수동채권으로 하여 상계할 수 있다.", true, "▸ 임대차보증금반환채무는 임대차계약 종료시점에 이행기 도달, 임대인은 임대차계약 존속 중 그 기한 이익 포기하고 차임채권 등과 상계 O [2015다252501]", "상계"],
["SS16.①", "상대방의 기망행위로 소비대차계약을 체결한 채권자가 계약상 채권에 기하여 대여금 및 이자 등의 지급을 청구한 경우에도 불법행위로 인한 손해배상을 청구한 경우와 마찬가지로 민법 제496조가 유추적용되어 상대방은 상계로 채권자에게 대항할 수 없다.", false, "▸ 상대방 기망으로 소비대차계약 체결한 자가 불법행위 손해배상청구 하지 않고 계약상 채권 따른 대여금·이자 지급 구하는 경우 496조 유추적용 X ∵ 계약상 채권은 기망행위 아닌 쌍방 계약 기초 발생 권리로서 급부이행이 지향하는 경제적 이익이 불법행위 손해배상채권과 달라 양자 경합 X, 496조 취지(복적적 불법행위 억제)와도 맞지 않음 [2024다204696]", "상계"],
["SS16.⑤", "공제도 복수 채권·채무의 상호 정산을 내용으로 하는 채권소멸 원인이라는 점에서 상계와 유사하므로, 원칙적으로 상계적상, 상계 금지나 제한, 상계의 기판력 등 상계에 관한 법률 규정이 유추적용된다.", false, "▸ 복수 채권·채무 상호 정산을 내용으로 하는 채권소멸 원인이라는 점에서 '공제'와 '상계'는 유사 → 그러나 공제는 상계적상, 상계금지·제한, 상계 기판력 등 상계 법률 규정이 원칙적으로 적용되지 않는 점, 임대차관계 등 특정 법률관계에서는 일정 사유 발생하면 원칙적 공제 의사표시 없이도 당연히 공제 이뤄진다고 보는 점 등에서 상계와 구별, 제3자에 우선하여 채권 실질적 만족 얻게 하는 점에서 상계보다 강한 담보적 효력 → 공제·상계 요건 설정, 시점, 의사표시 요부 등은 자유롭게 약정 O [2024다227699]", "상계"],
["SS17.ㄱ", "甲의 기망행위로 소비대차계약을 체결한 乙이 계약상 채권에 따른 대여금의 지급을 구하는 경우, 甲은 위 대여금채권을 수동채권으로 한 상계로 乙에게 대항하지 못한다.", false, "▸ 상대방 기망으로 소비대차계약 체결한 자가 불법행위 손해배상청구 하지 않고 계약상 채권에 따른 대여금 지급 구하면 496조 유추적용 X [2024다204696]", "상계"],
["SS17.ㄴ", "상속채권자가 피상속인에 대하여는 채권을 보유하면서 상속인에 대하여는 채무를 부담하는 경우, 상속채권자가 상속이 개시된 후 피상속인에 대한 채권을 자동채권으로 하여 상속인에 대한 채무에 대하여 상계하였더라도 이후 상속인이 한정승인을 하면 상계는 소급하여 효력을 상실한다.", true, "▸ 상속채권자가 상속인에 대해 채무 부담하는데 상속 개시되면 상계적상 O → 한정승인 하면 상속재산과 고유재산 분리되므로(1031조) 상속채권자의 피상속인에 대한 채권과 상속인에 대한 채무 사이 상계 X → 상계 후 한정승인 있으면 상계는 소급하여 효력 상실, 자동채권 및 수동채권 부활 [2022다254154]", "상계"],
["SS17.ㄷ", "「국세징수법」상 압류채권자가 채무자의 제3채무자에 대한 채권을 압류한 경우, 그 피압류채권에 대하여 이중압류 등이 없다면, 위 압류채권자는 피압류채권을 자동채권으로 하여 제3채무자의 위 압류채권자에 대한 채권과 상계할 수 있다.", false, "▸ 국세징수법에 의한 채권압류 후 압류채권자는 피압류채권을 자동채권으로 제3채무자의 압류채권자에 대한 채권과 상계 X, 이중압류·배분요구 등 없더라도 마찬가지 ∵ 법률규정 등 특별한 사정 없는 한 자동채권은 상계자가 상대방에 대해 가지는 채권이어야(제3자가 상대방에 대해 가지는 채권은 X), 압류채권자는 추심권 취득할 뿐 피압류채권이 압류채권자에게 이전·귀속되지 않으므로 이는 압류채권자가 제3채무자에 대해 가지는 채권 X, 상계적상 X [2022다218271]", "상계"],
["SS18.ㄷ", "공사도급계약에서 선급금을 지급한 후 계약의 해지 등의 사유로 수급인이 도중에 선급금을 반환하여야 할 사유가 발생하였다면, 특별한 사정이 없는 한 그 때까지의 기성고에 해당하는 공사대금 중 미지급액은 선급금에 당연충당된다.", true, "▸ 공사도급계약의 수수되는 '선급금'은 수급인이 도급인이 장차 지급할 공사대금 미리 지급하는 것 → 전체 공사에 대한 공사대금 O, 구체적 기성고 공사대금 X → 해제·해지로 도중에 선급금 반환하게 되면 특별한 사정 없는 한 별도 상계 의사표시 없이 선급금이 그때까지 기성고 해당 미지급 공사대금에 충당 O, 도급인은 나머지 공사대금 있다면 그 금액만 지급의무 부담 [2016다267067]", "상계"],
["SS18.ㄹ", "고의의 불법행위가 동시에 부당이득 원인을 구성하여 손실자가 이득자에게 부당이득반환청구권을 행사한 경우, 이득자는 손실자에 대한 채권을 자동채권으로 하여 위 부당이득반환채권과 상계할 수 있다.", false, "▸ 부당이득의 원인이 고의의 불법행위인 경우, 불법행위로 인한 손해배상채권과 부당이득반환채권이 경합한 경우, 피해자가 부당이득반환채권만 청구한 경우에도 496조 유추적용 O, 수익자(가해자)의 상계 X ∵ 청구의 실질적 이유는 고의 불법행위, 손해배상채권이 현실적 만족 받아야 한다는 취지 동일 [2001다52506]", "상계"],
["123.ㄱ", "甲은 乙에게 변제기가 2023. 7. 9.인 1억 원의 금전채권(A 채권)이 있고, 乙은 甲에게 변제기가 2023. 4. 7.인 5,000만 원의 금전채권(B 채권)이 있다.§B 채권이 물품매매대금 채권이고 2023. 7. 10.까지 乙이 물품인도채무의 이행 또는 이행의 제공을 하지 않은 상태인 경우, 2023. 7. 10. 甲은 상계할 수 있으나 乙은 상계할 수 없다.", true, "▸ B 채권은 동시이행항변권이 붙어 있으므로 그 채권자 乙이 자동채권으로는 상계 불허, 그러나 그 채무자 甲이 동이행 포기하고 B 채권을 수동채권으로 상계는 허용", "상계"],
["123.ㄴ", "甲은 乙에게 변제기가 2023. 7. 9.인 1억 원의 금전채권(A 채권)이 있고, 乙은 甲에게 변제기가 2023. 4. 7.인 5,000만 원의 금전채권(B 채권)이 있다.§甲에 대한 채권자 丙이 A 채권에 대하여 압류 및 전부명령을 받아 그 명령이 2023. 7. 3. 甲과 乙에게 송달되고 7. 10. 확정되었다면, 2023. 7. 12. 乙은 B 채권을 가지고 丙에게 전부된 A 채권과의 상계를 주장할 수 있다.", true, "▸ 압류명령 받은 제3채무자가 압류채무자에 대한 반대채권을 가지고 있는 경우 상계로써 압류채권자에게 대항하려면 압류 효력 발생 당시 양 채권이 상계적상에 있거나 자동채권이 수동채권보다 먼저 또는 동시에 변제기 도래해야 [2011다45521] → 丙의 압류 및 전부명령이 23.7.3. 乙에게 송달될 당시 乙은 B 채권을 가지고 있었을 뿐 아니라 변제기까지 도래한 상계적상 상태였으므로 乙은 상계로 丙에게 대항 O", "상계"],
["123.ㄷ", "甲은 乙에게 변제기가 2023. 7. 9.인 1억 원의 금전채권(A 채권)이 있고, 乙은 甲에게 변제기가 2023. 4. 7.인 5,000만 원의 금전채권(B 채권)이 있다.§甲이 2023. 4. 6. 丁에게 A 채권을 양도하고 같은 날 乙에게 채권양도를 통지한 경우, 乙은 2023. 6. 9. B 채권에 의한 상계로써 丁에게 대항할 수 없다.", false, "▸ 채무자가 통지를 받는 당시 이미 상계할 수 있는 원인이 있었던 경우에는 아직 상계적상에 있지 않더라도 그 후 상계적상에 이르면 채무자는 양수인에 대하여 상계로 대항 O [2017다222962] → 451조 2항 '채권양도와 상계'에 대한 해석: 통지 도달 당시 자동채권의 변제기 도래 불필요하고 발생만 하면 충분하므로, 통지 도달 당시(23.4.6.) B 채권의 변제기(23.4.7.)는 도래하지 않아도 무방하고 B 채권이 성립하여 존재하기만 하면 충분(다만 설문상 B 채권의 성립일을 알 수는 없고 그 전일 것으로 추정)", "상계"],
["124.①", "채권양수인이 양수채권을 자동채권으로 하여 그 양수채권의 채무자가 채권양수인에 대해 가지고 있던 기존 채권과 상계하는 경우, 채권양도 전에 이미 양 채권의 변제기가 도래하였다면 상계의 효력은 변제기로 소급한다.", false, "▸ 채권양수인이 양수채권을 자동채권으로 하여 상계하는 경우 상계적상일은 채권양도 전에 이미 도래한 양 채권의 변제기 X, 채권양도 대항요건 갖춘 시점 O [2022다200089]", "상계"],
["124.③", "동시이행관계에 있는 자동채권과 수동채권이라고 해도 서로 현실적으로 이행하여야 할 필요가 없는 경우라면 특별한 사정이 없는 한 상계가 허용된다.", true, "▸ 자동·수동 양 채권이 동시이행관계에 있더라도 서로 현실적으로 이행할 필요 없는 경우라면 상계의 불이익 발생 우려 없고 오히려 상계를 허용하는 것이 동시이행관계 채권·채무 관계 간명 해소 → 상계 허용 O ∵ 상계로 인한 불이익 발생 우려 없고 오히려 상계를 허용하는 것이 동시이행관계 채권·채무 관계 간명 해소하는 결과 [2004다54633]", "상계"],
["124.④", "상계적상의 시점 이전에 수동채권에 대하여 이자나 지연손해금이 발생한 경우, 상계적상 시점까지 수동채권의 이자나 지연손해금을 계산한 다음 자동채권으로써 먼저 수동채권의 이자나 지연손해금을 소각하고 잔액을 가지고 원본을 소각하여야 한다.", true, "▸ 상계적상 시점까지 수동채권의 약정이자·지연손해금 계산하여 자동채권으로써 먼저 수동채권의 약정이자·지연손해금 소각하고 잔액으로 원본 소각 [2005다8125]", "상계"],
["125.ㄱ", "A는 B에 대하여 1억 원의 대여금채권(변제기 2020. 1. 1.)을 가지고 있으며, B는 A에 대하여 8천만 원의 매매대금채권(변제기 2019. 3. 1.)을 가지고 있다. A는 C에 대한 채무를 변제하기 위하여 2021. 1. 1. B에 대한 위 대여금채권을 C에게 양도하고 2021. 1. 1. 채권양도의 대항요건을 갖추었다.§B가 2021. 5. 1. C에 대한 5천만 원의 대여금채권(변제기 2019. 12. 1.)을 자동채권으로 하여 C의 양수금채권과 상계한 경우, 양수금 채권은 2020. 1. 1.에 소급하여 5천만 원의 범위에서 소멸한다.", false, "▸ 전술한 2022다200089 판결에 따라, B가 C에 대해 가지던 채권(변제기 19.12.1.)과 C가 양수받은 채권(변제기 20.1.1.)의 각 변제기보다 채권양도 통지 도달일(21.1.1.)이 더 늦은 경우에는 채권양도 통지 도달일이 상계적상일이므로 21.1.1.로 소급하여 소멸하는 것임", "상계"],
["125.ㄴ", "A는 B에 대하여 1억 원의 대여금채권(변제기 2020. 1. 1.)을 가지고 있으며, B는 A에 대하여 8천만 원의 매매대금채권(변제기 2019. 3. 1.)을 가지고 있다. A는 C에 대한 채무를 변제하기 위하여 2021. 1. 1. B에 대한 위 대여금채권을 C에게 양도하고 2021. 1. 1. 채권양도의 대항요건을 갖추었다.§B가 2021. 5. 1. C에 대한 5천만 원의 대여금채권(변제기 2019. 12. 1.)을 자동채권으로 하여 C의 양수금채권과 상계한 경우, A의 채권자 甲의 신청에 의한 A의 대여금채권에 관한 압류 및 전부명령이 2021. 10. 1. A와 B에게 도달하였다면, B는 C에 대한 상계로써 甲에게 대항할 수 없다.", false, "▸ 甲의 대여금채권에 대한 압류 및 전부명령이 21.10.1. B에게 송달되었으므로, ③ C에 대한 채권양도가 확정일자 없는 경우라면 압류 자체가 무효, ④ 확정일자 없는 경우라면 C보다 甲이 우선하겠으나 B가(확정일자 없더라도) 양도 통지 받은 후 이미 21.5.1. C와 상계한 이상 그보다 늦게 압류 송달시킨 甲에게 상계로 대항 가능", "상계"],
["125.ㄷ", "A는 B에 대하여 1억 원의 대여금채권(변제기 2020. 1. 1.)을 가지고 있으며, B는 A에 대하여 8천만 원의 매매대금채권(변제기 2019. 3. 1.)을 가지고 있다. A는 C에 대한 채무를 변제하기 위하여 2021. 1. 1. B에 대한 위 대여금채권을 C에게 양도하고 2021. 1. 1. 채권양도의 대항요건을 갖추었다.§B가 2021. 5. 1. A에 대한 매매대금채권을 자동채권으로 하여 A의 대여금채권과 상계하였다면, B의 C에 대한 양수금 채무액은 2천만 원이다.", true, "▸ B의 매매대금채권은 19.3.1. 이전에 발생한 채권으로서 양도통지 도달일 21.1.1.보다 앞서므로 2017다222962 판결에 따라 B는 매매대금채권을 자동채권으로 C에게 양도된 A의 대여금채권과 상계 가능. B의 매매대금채권(A에 대한 채권, 채권양도를 한 덕분에 상계가 가능해짐)을 구별하라는 최신판례 수업 내용이 완벽하게 현실화된 문제임. 결국 B의 C에 대한 양수금 채무액 = 1억 - 8천만 = 2천만 원", "상계"],
["126.①", "고의에 의한 불법행위가 동시에 채무불이행에 해당하여 불법행위로 인한 손해배상채권과 채무불이행으로 인한 손해배상채권이 경합하는 경우, 채무자는 고의의 채무불이행으로 인한 손해배상채권을 수동채권으로 한 상계로써 채권자에게 대항할 수 있다.", false, "▸ 496조는 고의 불법행위에 적용, 고의 채무불이행에는 적용 X. 그러나 고의 행위가 불법행위 및 채무불이행을 구성하여 양 손해배상채권이 경합한 경우는 고의의 채무불이행으로 인한 손해배상채권을 수동채권으로 해도 496조 유추적용 O, 채무자의 상계 X ∵ 손해배상채권이 현실적 만족 받아야 한다는 취지 동일 [2014다19783]", "상계"],
["126.④", "여러 개의 자동채권이 있고 수동채권의 원리금이 자동채권의 원리금 합계에 미치지 못하는 경우에는 우선 자동채권의 채권자가 상계의 대상이 되는 자동채권을 지정할 수 있고, 다음으로 자동채권의 채무자가 이를 지정할 수 있으며, 양 당사자가 모두 지정하지 아니한 때에는 법정변제충당의 방법으로 상계충당이 이루어진다.", true, "▸ 자동채권이 여러 개이고 수동채권 원리금이 자동채권 원리금 합계에 못 미칠 경우, 우선 자동채권의 채권자(=상계자, '채무자')가 상계 대상인 자동채권을 지정 → 다음으로 자동채권의 채무자(=피상계자, '채권자')가 지정 → 모두 지정하지 않으면 법정충당 [2011다24814]", "상계"],
["126.⑤", "수탁보증인이 주채무자에 대하여 가지는 민법 제442조의 사전구상권에는 민법 제443조의 담보제공청구권이 항변권으로 부착되어 있으므로, 특별한 사정이 없는 한 이를 자동채권으로 하는 상계는 허용되지 않는다.", true, "▸ 수탁보증인은 442조 사전구상권을 자동채권으로 상계 X ∵ 사전구상권에는 주채무자의 443조 면책청구권이 항변권으로 부착 [2001다81245]", "상계"],
["127.ㄹ", "甲이 乙을 피고로 대여금채권 1천만 원의 승소확정판결을 받은 후, 乙이 이미 그 변론종결 이전부터 甲에게 갖고 있던 금전채권을 가지고 상계하는 경우", true, "▸ 확정판결 변론종결 전에 상계적상의 채권 있고 그 존재를 알았더라도 변론종결 후에 상계 O, 청구이의의 O. 민집법 44조 2항 '청구이의의 원인이 변론종결 이후 생긴 것' O ∵ 상계는 쌍방 채무가 상계적상에 있다고 바로 채무소멸 효력 생기는 것 아니고 상계 의사표시 있어야 비로소 효력 생기므로 [66다780]", "상계"],
["128.⑤", "소멸시효가 완성된 채권이 그 완성 전에 상계할 수 있었던 것이면 그 채권자는 상계할 수 있다.", true, "▸ 제495조(소멸시효완성된 채권에 의한 상계) 소멸시효가 완성된 채권이 그 완성전에 상계할 수 있었던 것이면 그 채권자는 상계할 수 있다.", "상계"],
["129.ㄴ", "고의의 불법행위로 인한 피해자는 가해자에 대한 손해배상채권과 가해자의 자신에 대한 대여금 채권을 상계할 수 있다.", true, "▸ 496조의 취지가 고의 불법행위 피해자가 현실 변제 받도록, 불법행위 유발 방지 → 가해자가 수동채권으로 하는 상계 금지(그 채무자는 상계 대항 X), 그러나 피해자가 이를 자동채권으로 상계하는 것은 허용", "상계"],
["130.②", "피용자의 고의의 불법행위로 인하여 사용자책임이 성립하는 경우, 사용자는 피해자의 사용자에 대한 손해배상채권을 수동채권으로 하여 상계할 수 있다.", false, "▸ 피용자의 고의 불법행위로 인하여 사용자책임 성립하는 경우 사용자에게도 496조 적용 O, 사용자 상계 X ∵ 756조 사용자책임은 대체적 책임, 단서의 문언상 사용자의 과실은 직접 가해행위 아닌 선임·감독 관련 과실 [2004다63019]", "상계"],
["130.③", "채권의 일부양도가 이루어진 경우, 그 분할된 채권에 대하여 양도인에 대한 반대채권으로 상계하고자 하는 채무자는 양도인을 비롯한 각 분할채권자 중 어느 누구라도 상계의 상대방으로 지정하여 상계할 수 있다.", true, "▸ 채권의 일부양도 있으면 각 분할된 부분에 독립한 분할채권 성립 → 채무자는 양도인에 대한 반대채권으로 양도인을 비롯한 각 분할채권자 누구든 상대방으로 삼아 상계 O → 분할채권자인 양수인이 대항요건을 갖추었다고 하더라도 다른 부분에 먼저 상계 혹은 비율에 따라 상계되어야 한다는 이의 X [2000다50596]", "상계"],
["131.ㄱ", "건물 공유자들의 그 건물 무단 점유자에 대한 차임 상당 부당이득반환청구권은 특별한 사정이 없는 한 성질상 불가분채권이다.", false, "▸ 단독으로 공유물 침해에 대한 부당이득·손해배상 X → 자기 지분비율 범위 내에서 O [70다171] → 공유자들의 분할채권", "서론분할불가분"],
["131.ㄴ", "금전채권의 불가분채권자들 중 1인을 집행채무자로 한 압류 및 전부명령이 이루어진 경우, 그 집행채무자인 불가분채권자의 채권은 전부채권자에게 이전되더라도 다른 불가분채권자는 그 불가분채권의 채무자에게 불가분채권 전부의 이행을 청구할 수 있다.", true, "▸ 불가분채권자 중 1인을 집행채무자로 압류·전부명령 있어도 다른 불가분채권자는 모든 채권자 위해 불가분채권 전부의 이행청구 O, 채무자도 모든 채권자 위해 다른 불가분채권자에게 전부를 이행 O. 이는 금전채권 일부에만 압류·전부명령 내려져도 마찬가지 O ∵ 전부명령으로 집행채무자인 불가분채권자의 채권은 전부채권자에게 이전되나 다른 불가분채권자에게는 효력 X [2021다264253]", "서론분할불가분"],
["131.ㄷ", "타인 소유 대지 위에 권원 없이 세워진 건물의 소유자를 상속한 공동상속인들의 건물철거의무는 다른 공동상속인의 지분에 관하여도 철거의무를 부담하는 불가분채무이므로, 이 경우 공동상속인들을 상대로 한 건물철거소송은 필수적 공동소송이다.", false, "▸ 공동상속인들의 건물철거의무는 각자 그 지분의 한도 내에서 건물 전체에 대한 철거의무 [80다756]. 지문에서 '다른 공동상속인의 지분에 관하여도 철거의무를 부담한다'는 부분이 틀리고(공유자 1인은 자기 지분 한도에서만 의무 부담함), 불가분채무라는 부분은 옳으나, 필수적 공동소송이라는 부분도 틀린 부분임", "서론분할불가분"],
["SS19.ㄱ", "X 부동산을 1/2 지분씩 공유하는 甲과 乙이 丙에게 X 부동산을 2억 원에 매도하는 매매계약을 체결하였다. 丙은 甲과 乙에게 계약금으로 5,000만 원을 지급하였다. 그 후 丙은 위 매매계약을 甲과 乙의 이행지체를 이유로 적법하게 해제하였다.§丙은 甲만을 상대로 계약금 전부의 반환을 청구할 수 있다.", true, "▸ 불가분채무자가 변제 기타 자기 출재로 공동면책 얻으면 다른 불가분채무자의 부담부분에 대해 구상권 행사 O. 이때 부담부분은 균등 추정 원칙이나 특약 있거나 수익비율이 다르면 그에 따라 부담부분 결정 ∵ 411조, 425조 1항, 424조, 연대채무자 사이에 관한 2012다97420 판결 [2020다208195]", "서론분할불가분"],
["SS19.ㄴ", "X 부동산을 1/2 지분씩 공유하는 甲과 乙이 丙에게 X 부동산을 2억 원에 매도하는 매매계약을 체결하였다. 丙은 甲과 乙에게 계약금으로 5,000만 원을 지급하였다. 그 후 丙은 위 매매계약을 甲과 乙의 이행지체를 이유로 적법하게 해제하였다.§甲이 丙을 단독 상속한 경우에도 甲은 乙에 대하여 계약금 전부의 반환을 청구할 수 있다.", true, "▸ 불가분채무는 424조, 425조 등 연대채무의 규정들을 준용하지만, 혼동에 관한 420조는 준용 X → 지문에서 불가분채무자 1인 甲이 채권자 丙을 단독상속 하면 혼동이 일어나고, 이제 채권자의 지위가 된 甲은 乙에게 계약금 전부를 청구 O. 이때 불가분채무자 중 1인 甲의 혼동이 다른 불가분채무자인 乙에게 영향을 줄 수 없으므로(절대효 준용 X), 결국 甲은 乙에게 5,000만 원 전액을 청구 O", "서론분할불가분"],
["SS19.ㄷ", "X 부동산을 1/2 지분씩 공유하는 甲과 乙이 丙에게 X 부동산을 2억 원에 매도하는 매매계약을 체결하였다. 丙은 甲과 乙에게 계약금으로 5,000만 원을 지급하였다. 그 후 丙은 위 매매계약을 甲과 乙의 이행지체를 이유로 적법하게 해제하였다.§甲이 丙에게 계약금 전부를 반환한 경우, 甲과 乙 사이의 계약금 분배비율이 공유지분비율과 다르다면, 甲은 乙을 상대로 그 분배비율에 따른 부담부분에 대하여 구상권을 행사할 수 있다.", true, "▸ 불가분채무자가 변제 기타 자기 출재로 공동면책 얻으면 다른 불가분채무자의 부담부분에 대해 구상권 행사 O. 이때 부담부분은 균등 추정 원칙이나 특약 있거나 수익비율이 다르면 그에 따라 부담부분 결정 [2020다208195] → 甲이 丙에게 계약금 전부 반환한 경우, 甲과 乙 사이의 분배비율에 따른 부담부분에 대하여 구상권 행사 O", "서론분할불가분"],
["132.①", "불가분채권의 경우 각 채권자는 모든 채권자를 위하여 이행을 청구할 수 있고 채무자는 모든 채권자를 위하여 각 채권자에게 이행할 수 있으며, 이러한 모든 채권자에게 효력이 있는 사항을 제외하고는 불가분채권자 중 1인의 행위나 1인에 관한 사항은 다른 채권자에게 효력이 없다.", true, "▸ 제409조(불가분채권) + 제410조(1인의 채권자에 생긴 사항의 효력) 조문 내용 그대로", "서론분할불가분"],
["132.③", "공동상속인들의 건물철거의무는 그 성질상 불가분채무라고 할 것이고, 각자 그 지분의 한도 내에서 건물 전체에 대한 철거의무를 진다.", true, "▸ 공동상속인들의 건물철거의무는 각자 그 지분의 한도 내에서 건물 전체에 대한 철거의무를 부담하는 불가분채무 [80다756]", "서론분할불가분"],
["132.④", "여러 사람이 공동으로 법률상 원인 없이 타인의 재산을 사용한 경우의 부당이득반환채무는 특별한 사정이 없는 한 불가분적 이득의 반환으로서 불가분채무이고, 불가분채무는 각 채무자가 채무 전부를 이행할 의무가 있으며, 1인의 채무이행으로 다른 채무자도 그 의무를 면하게 된다.", true, "▸ 수인이 공동으로 법률상 원인 없이 타인 재산을 사용한 경우 부당이득반환채무는 불가분채무 [80다2587]", "서론분할불가분"],
["132.⑤", "건물의 공유자가 공동으로 건물을 임대하고 보증금을 수령한 경우, 특별한 사정이 없는 한 그 임대는 각자 공유지분을 임대한 것이 아니고 임대목적물을 다수의 당사자로서 공동으로 임대한 것이고 그 보증금 반환채무는 성질상 불가분채무에 해당된다.", true, "▸ 건물공유자가 공동임대하고 보증금 수령한 경우 보증금반환채무는 불가분채무 ∵ 각자 공유지분을 임대한 것이 아니고 임대목적물을 다수의 당사자로서 공동으로 임대한 것 [98다43137]", "서론분할불가분"],
["133.ㄷ", "X 주택을 공유하고 있는 공동임대인 甲, 乙이 임차인 丙에 대하여 부담하는 임차보증금반환채무", true, "▸ [불가분채무] 건물공유자가 공동임대하고 보증금 수령한 경우 보증금반환채무는 불가분채무 ∵ 각자 공유지분을 임대한 것이 아니고 임대목적물을 다수의 당사자로서 공동으로 임대한 것 [98다43137]", "서론분할불가분"],
["134.ㄱ", "연대채무자 중 1인이 채무 일부를 면제받는 경우에 그 연대채무자가 지급해야 할 잔존 채무액이 부담부분을 초과하는 경우 다른 연대채무자는 채무 전액을 부담하여야 한다.", true, "▸ 채권자가 연대채무자 중 1인의 채무를 '일부' 면제한 경우도 특별한 사정이 없는 한 면제된 부담부분에 한하여 419조 면제의 절대적 효력 O. 피면제자의 잔존 채무액이 부담부분을 초과한다면 다른 연대채무자는 채무 전액 부담해야 ∵ 피면제자의 부담부분 감소 없으므로 [2019다216435]", "연대채무"],
["134.ㄷ", "채권자가 연대채무자 중 1인의 소유 부동산에 대하여 경매신청을 하고 그로부터 6개월 내에 다른 연대채무자를 상대로 재판상 청구를 하였다면, 경매신청 시로부터 그 다른 연대채무자에 대한 채권의 소멸시효가 중단되고, 중단된 시효는 위 경매절차 종료 시로부터 새로 진행된다.", false, "▸ 연대채무자 A 소유 부동산에 '경매신청' 후 6월 내 연대채무자 B에 대하여 재판상 청구하면 A 소유 부동산 경매신청시에 이뤄지고(여기까지 옳은 지문), 그러나 B에 대하여 재판상 청구가 된 이상 판결이 확정되면 그때부터 재진행 [2001다22840]", "연대채무"],
["136.ㄱ", "A, B, C가 연대하여 甲에 대하여 900만 원의 채무를 부담하는데, A, B, C의 부담부분은 균등하다.§A가 甲에 대하여 450만 원의 반대채권을 가지고 있음에도 상계권을 행사하지 아니하는 경우, B 또는 C는 이 채권을 가지고 A의 부담부분인 300만 원에 한하여 상계할 수 있고, 상계권 행사로 300만 원의 연대채무가 소멸한다.", true, "▸ 제418조(상계의 절대적 효력) ① 어느 연대채무자가 채권자에 대하여 채권이 있는 경우에 그 채무자가 상계한 때에는 채권은 모든 연대채무자의 이익을 위하여 소멸한다. ② 상계할 채권이 있는 연대채무자가 상계하지 아니한 때에는 그 채무자의 부담부분에 한하여 다른 연대채무자가 상계할 수 있다.", "연대채무"],
["136.ㄴ", "A, B, C가 연대하여 甲에 대하여 900만 원의 채무를 부담하는데, A, B, C의 부담부분은 균등하다.§甲이 A에 대하여 연대의 면제를 하였고 이후 B가 무자력이 된 경우, 최종적으로 A의 분담부분은 300만 원, C의 분담부분은 450만 원이 된다.", true, "▸ 제427조(상환무자력자의 부담부분) ① 연대채무자 중에 상환할 자력이 없는 자가 있는 때에는 그 채무자의 부담부분은 구상자 및 다른 자력이 있는 채무자가 그 부담부분에 비례하여 분담한다. ② 전항의 경우에 구상자에게 과실이 있는 때에는 다른 연대채무자에 대하여 분담을 청구하지 못한다. 연대의 면제를 받은 A는 자기 부담부분(300만)만 부담, B가 무자력이 되어 B의 부담부분 300만을 A와 C가 추가 분담(각 150만) → A: 300, C: 300+150=450", "연대채무"],
["136.ㄷ", "A, B, C가 연대하여 甲에 대하여 900만 원의 채무를 부담하는데, A, B, C의 부담부분은 균등하다.§A가 300만 원을 변제하였다면 B, C에게 각 100만 원을 청구할 수 있고, B가 450만원을 변제하였다면 B는 A, C에게 각 150만 원을 청구할 수 있는데, 이 경우 A는 이미 300만 원을 변제하였다는 이유로 B의 구상청구를 거절할 수 있다.", false, "▸ '연대채무' 관계이므로 A가 300만원을 변제했다면 B, C에게 각 100만원씩 구상할 수 있고, C가 450만원을 변제하였다면 A, C에게 각 150만원씩 구상할 수 있는데, 이 상태에서 C가 A에게 150만원의 구상을 요구할 경우 A는 100만원에 대해서는 상계나 공제를 이유로 거절할 수 있지만 50만원의 구상에는 응해야 하므로 단순히 거절할 수 있는 것은 아님. A, C 모두 사전·사후통지를 한 것을 전제로 함", "연대채무"],
["137.①", "부진정연대채무관계에 있는 채무자들 중 1인에 대하여 이행의 청구를 하더라도 그 효력은 다른 채무자에게 미치지 않는다.", true, "▸ [95다42027] → 부진정연대채무에서는 변제·대물변제·공탁·상계 이외에는 모두 상대효", "부진정연대채무"],
["135.ㅁ", "공동불법행위자 중 1인에 대하여 구상의무를 부담하는 다른 공동불법행위자가 수인인 경우에는 특별한 사정이 없는 이상 그들의 구상권자에 대한 채무는 각자의 부담부분에 따른 분할채무로 봄이 상당하지만, 구상권자인 공동불법행위자 측에 과실이 없는 경우, 즉 내부적인 부담부분이 전혀 없는 경우에는 그에 대한 수인의 구상의무 사이의 관계를 부진정연대관계로 보아야 한다.", true, "▸ [2003다24147] [AI해설] 공동불법행위자 중 1인에 대하여 구상의무를 부담하는 다른 공동불법행위자가 수인인 경우에는 특별한 사정이 없는 이상 그들의 구상권자에 대한 채무는 각자의 부담부분에 따른 분할채무로 봄이 상당. 단, 구상권자인 공동불법행위자 측에 과실이 없는 경우(내부적 부담부분이 전혀 없는 경우)에는 그에 대한 수인의 구상의무 사이의 관계를 부진정연대관계로 보아야 함", "연대채무"],
["138.①", "주채무자에 대한 확정판결에 의하여 「민법」 제163조 각 호의 단기소멸시효에 해당하는 주채무의 소멸시효기간이 10년으로 연장된 상태에서 주채무를 보증하였더라도, 특별한 사정이 없는 한 보증채무의 소멸시효기간은 이와 별개로 보증채무의 성질에 따라 결정된다.", true, "▸ 보증채무는 주채무와 별개 독립한 채무이므로 소멸시효기간은 채무 성질에 따라 각 별개로 결정 → 단기 3년 물품대금채권이 판결 확정되어 10년 연장(165조)된 상태에서 연대보증을 한 경우, 보증채무에 단기시효 적용될 여지는 X, 보증인에 대한 채권이 민사라면 10년 상사라면 5년 [2011다76105]", "보증채무"],
["138.②", "다른 사람이 발행하는 약속어음에 명시적으로 어음보증을 하는 사람은 그 어음보증으로 인한 어음상의 채무만을 부담하는 것이 원칙이다.", true, "▸ [상법] 다른 사람이 발행한 약속어음에 배서인이 된 사람은 배서행위로 어음법상 채무만 부담하는 것이 원칙 → 다만 채권자에 대해 어음 발행의 원인이 된 민사상 채무까지 보증하겠다는 뜻으로 배서를 한 경우에 한하여 발행인의 채권자에 대한 민사상 채무에 관한 보증책임 부담 [87다카1105]", "보증채무"],
["138.③", "여러 공동불법행위자 중 1인의 신원보증인이 피보증인의 손해배상채무를 변제한 경우, 피보증인이 아닌 다른 공동불법행위자에 대하여는 그 부담부분에 한하여 구상권을 행사할 수 있다.", true, "▸ 공동불법행위자 1인 위한 보증인이 손해배상채무 변제한 경우, 그 보증인은 피보증인 아닌 다른 공동불법행위자에 대하여 그 부담부분에 한하여 구상 O. 다만 다른 공동불법행위자 부담부분 없으면 구상·부당이득반환청구 X [95다47176]", "보증채무"],
["138.④", "계속적 채권관계에서 발생하는 주계약상의 불확정채무에 대하여 보증한 경우, 보증채무는 보증계약의 종료 시점과 관계없이 주계약상의 채무가 확정된 때에 이와 함께 확정된다.", false, "▸ 계속적 채권관계에서 주계약상 불확정 채무 보증한 경우, 주채무자와의 거래기간 연장되었으나 보증인과 보증기간(3년) 연장되지 않아 보증계약관계 종료되면 보증채무 확정 → 보증인은 그 당시 주계약상 채무만 책임, 그 후의 채무는 책임 X [99다26481]", "보증채무"],
["138.⑤", "주채권과 분리하여 보증채권만 양도하기로 하는 약정은 효력이 없다.", true, "▸ 주채권과 분리하여 보증채권만 양도하는 약정은 무효 ∵ 주채권과 보증인에 대한 채권의 귀속주체 달리하면 보증인 항변권 침해 등 부종성에 반함, 인정할 실익도 없음 [2002다21509]", "보증채무"],
["139.ㄱ", "甲, 乙, 丙이 공동의 불법행위로 丁에게 9,000만 원의 부진정연대채무를 부담하고 있고 과실비율은 균등하다. 이 경우 甲의 보증인 戊가 6,000만 원을 변제하였다면 戊는 乙과 丙에 대해 각 2,000만 원의 구상권을 취득한다.", false, "▸ 공동불법행위자 1인 위한 보증인이 손해배상채무 변제한 경우, 그 보증인은 피보증인 아닌 다른 공동불법행위자에 대하여 그 부담부분에 한하여 구상 O. 다만 다른 공동불법행위자 부담부분 없으면 구상 X [95다47176] → 설문에서 戊는 피보증인 甲의 부담부분 3,000만원보다 3,000만원 초과하여 변제했으므로 乙·丙에게 각 1,500만원씩 구상권 취득", "보증채무"],
["139.ㄴ", "주채무자인 甲의 부탁을 받은 乙은 채권자 丙에 대해 주채무금액 5,000만 원에 관한 보증을 하였다. 이후 주채무의 변제기인 2022. 8. 31.이 도래하고 甲이 변제를 하지 않아 2022. 9. 30.자로 약정이자 1,000만 원, 지연손해금 50만 원이 발생하게 되면 2022. 9. 30. 乙은 甲에게 6,050만 원의 사전구상금액을 청구할 수 있다.", true, "▸ 사전구상권 범위는 주채무 원금, 사전구상 응할 때까지 이미 발생한 이자 및 지연손해금, 피할 수 없는 비용 기타 손해 O → 주채무 원금 완제일까지 지연손해금 X, 수탁보증인이 아직 지출 않은 금원의 지연손해금 X [2003다46758]", "보증채무"],
["139.ㄷ", "甲은 주채무자, 戊는 채권자인 상황에서 乙, 丙, 丁이 戊에 대해 주채무금액 9,000만 원에 관한 연대보증을 하였고 그 비율이 균등하다. 이 경우 丙이 3,000만 원을 변제한 후 丁이 6,000만 원을 변제하였다면 丁은 다른 연대보증인 중 乙에 대해서만 3,000만 원의 구상권을 취득한다.", true, "▸ 연대보증인은 분별의 이익 없으나, 연대보증인들 상호 내부관계는 주채무에 대한 출재 분담의 일정 부담부분 O, 특약 없으면 평등 비율 → 연보 1인이 자기 부담부분 초과 변제하면 다른 연보에게 구상. 그러나 연보 중 이미 자기 부담부분 변제한 사람에게는 구상 X [2007다70155] → 설문에서 丙은 이미 자기 부담부분 3,000만원을 전액 변제한 사람이므로 丁은 丙에게 구상할 수 없고 乙에게만 3,000만원 구상권 有", "보증채무"],
["140.ㄴ", "보증채무를 부담하는 내용의 지급보증서에서 보증금액을 정하여 두었다고 하더라도 보증채무는 주채무와는 별개의 채무이기 때문에 보증채무 자체의 이행지체로 인한 지연손해금은 지급보증의 한도액과는 별도로 부담하여야 한다.", true, "▸ 보증채무는 주채무와 별개 채무 → 보증채무 자체의 이행지체로 인한 지연손해금은 보증 한도액과 별도로 부담 O → 보증채무 연체이율의 특별한 약정 있으면 약정에 따라, 특별한 약정 없으면 상법·민법 법정이율 적용, 주채무에 약정 연체이율 당연 적용은 X [2001다29803, 97다1433]", "보증채무"],
["140.ㄷ", "보증계약 체결 후 채권자가 보증인의 승낙 없이 주채무자에 대하여 변제기를 연장하여 주었다면 보증인의 책임을 가중하는 것이라고 할 수 있으므로, 보증채무에 대하여는 그 효력이 미치지 않는다.", false, "▸ 주채무 변제기 연장은 보증인에게 효력 O ∵ 보증인 책임 가중 아님 [95다49141]", "보증채무"],
["140.ㄹ", "주채무에 대한 소멸시효가 완성되어 보증채무가 소멸된 상태에서 보증인이 보증채무를 이행하거나 승인한 경우, 주채무의 시효소멸에도 불구하고 보증채무를 이행하겠다는 의사를 표시한 경우 등과 같이 부종성을 부정하여야 할 다른 특별한 사정이 없는 한 보증인은 여전히 주채무의 시효소멸을 이유로 보증채무의 소멸을 주장할 수 있다.", true, "▸ 보증채무 시효 중단되었더라도 주채무 소멸시효 완성하면 주채무 당연 소멸하고 부종성에 따라 보증채무 역시 당연 소멸 O → 주채무 소멸시효가 완성되어 보증채무 소멸된 상태에서 보증인이 보증채무 이행·승인하였더라도 주채무자 아닌 보증인의 행위로 주채무 소멸시효 이익 포기 효과 X, 주채무 시효소멸에도 불구하고 보증채무 이행하겠다는 의사표시 등 부종성 부정할 특별한 사정이 없는 한 보증인은 여전히 주채무의 시효소멸 이유로 보증채무 소멸 주장 O [2010다51192]", "보증채무"],
["140.ㅁ", "채권자와 주채무자 사이의 확정판결에 의하여 주채무가 확정되어 그 소멸시효기간이 10년으로 연장되면, 그 보증채무도 보증채무 부종성의 원칙상 종전 소멸시효가 단기의 소멸시효에 해당하는 것이라도 그 적용이 배제되고 10년의 소멸시효기간이 적용된다.", false, "▸ 주채무자 상대로 승소판결 확정되어 시효기간 10년으로 연장되어도(165조) 보증인에게 시효기간 연장효과 X [86다카1569]", "보증채무"],
["SS21.ㄱ", "甲이 乙로부터 2019. 5. 1. 3억 원을 이자 월 1%(매월 말일 지급), 변제기 2020. 4. 30.으로 정하여 차용하였고, 丙, 丁, 戊는 甲의 부탁을 받고 위 차용금채무를 연대보증하였다.§丙이 2020. 4. 30. 乙에게 차용원리금 중 1억 원을 변제하였다면, 丙은 丁을 상대로 구상을 청구할 수 있다.", false, "▸ 연대보증인은 분별의 이익 없으나, 연대보증인들 상호 내부관계는 주채무에 대한 출재 분담의 일정 부담부분 O, 특약 없으면 평등 비율 → 연보 1인이 자기 부담부분 초과 변제하면 다른 연보에게 구상, 그러나 연보 중 이미 자기 부담부분 변제한 사람에게는 구상 X [2007다70155]", "보증채무"],
["SS21.ㄴ", "甲이 乙로부터 2019. 5. 1. 3억 원을 이자 월 1%(매월 말일 지급), 변제기 2020. 4. 30.으로 정하여 차용하였고, 丙, 丁, 戊는 甲의 부탁을 받고 위 차용금채무를 연대보증하였다.§丙과 丁이 2020. 4. 30. 乙에게 차용원리금 중 각 1억 6,000만 원과 1억 2,000만 원을 변제하였다면, 丙은 丁을 상대로 구상을 청구할 수 없다.", true, "▸ [2007다70155] → 연대보증인 丙, 丁, 戊의 균등 부담부분은 각 1억 원. 丙은 1.6억 원을 변제하여 자기 부담부분(1억) 초과 변제, 丁도 1.2억 원을 변제하여 자기 부담부분(1억) 초과 변제. 연대보증인 중 이미 자기 부담부분을 변제한 사람에게는 구상 X [2007다70155] → 설문에서 丁도 이미 자기 부담부분 1억 원을 전액 변제한 사람이므로, 丙은 丁을 상대로 구상할 수 없음", "보증채무"],
["SS21.ㄷ", "甲이 乙로부터 2019. 5. 1. 3억 원을 이자 월 1%(매월 말일 지급), 변제기 2020. 4. 30.으로 정하여 차용하였고, 丙, 丁, 戊는 甲의 부탁을 받고 위 차용금채무를 연대보증하였다.§丙이 2024. 4. 30. 乙에게 차용이자 중 600만 원을 변제하였다 하더라도, 丙은 甲의 이자채무가 시효로 소멸하였음을 이유로 나머지 이자에 대한 보증채무의 소멸을 주장할 수 있다.", true, "▸ 2024.4.30.은 甲의 모든 이자채무가 3년 단기시효로 소멸하였고, 이자 시효 완성 후 보증인 丙이 이자 일부를 변제했더라도 시효이익 포기로 볼 수 없음(최근 판례 변경이 있었던 대법원 2025.7.24. 선고 2023다240299 전원합의체 판결에 따르면 채무자의 이러한 행위가 시효이익 포기 자체에 해당하기 어렵고, 설령 판례 변경 전이라고 하더라도 보증인의 행위로 이미 시효 주채무 소멸시효 이익을 포기할 수 없었기 때문) → 전원합의체 판결과 상관없이 옳은 지문", "보증채무"],
["SS21.ㄹ", "甲이 乙로부터 2019. 5. 1. 3억 원을 이자 월 1%(매월 말일 지급), 변제기 2020. 4. 30.으로 정하여 차용하였고, 丙, 丁, 戊는 甲의 부탁을 받고 위 차용금채무를 연대보증하였다.§丙이 변제기 전인 2019. 10. 31. 주채무자 甲에게 통지하지 않고 乙에게 차용원금 1억 원을 변제하였다면, 출재에 보증인의 과실이 존재하므로 丙은 甲에 대하여 민법 제441조에 따른 사후구상권을 취득할 수 없다.", false, "▸ 보증인이 사전통지를 하지 않은 경우, '주채무자가 이중변제'를 했을 때 445조 1항에 의해 그에게 구상할 수 없을 뿐이지, 사후구상권 자체가 없어지는 것이 아님", "보증채무"],
["SS21.ㅁ", "甲이 乙로부터 2019. 5. 1. 3억 원을 이자 월 1%(매월 말일 지급), 변제기 2020. 4. 30.으로 정하여 차용하였고, 丙, 丁, 戊는 甲의 부탁을 받고 위 차용금채무를 연대보증하였다.§甲이 丙에 대하여 변제기가 2020. 6. 30.인 1억 원의 물품대금채권을 가지고 있었는데, 甲의 다른 채권자 己가 2020. 5. 31. 甲의 위 채권을 가압류하였다. 丙이 2020. 7. 31. 乙에게 차용원금 중 1억 원을 변제하였다면, 丙은 甲에 대한 사전구상권에 의한 상계로 가압류채권자 己에게 대항할 수 있다.", false, "▸ 가압류 시점인 20.5.31.은 주채무 변제기 20.4.30. 이후라 수탁보증인 丙의 사전구상권은 발생, 그러나 丙이 주채무의 면책행위를 한 것은 20.7.31.이고, 이 시점에 사전구상권의 담보제공청구 항변권을 소멸시키는 것은 20.7.31.이고, 이 시점이 가압류된 채권의 변제기 20.6.30.보다 늦으므로, 결국 丙은 사전구상권에 의한 상계로 가압류채권자 己에게 대항 X [2017다274703]", "보증채무"],
["141.②", "보증채무를 부담하는 내용의 지급보증서에서 보증금액을 정하여 두었다고 하더라도 보증채무는 주채무와는 별개의 채무이기 때문에 보증채무 자체의 이행지체로 인한 지연손해금은 지급보증의 한도액과는 별도로 부담하여야 한다.", true, "▸ 보증채무는 주채무와 별개 채무 → 보증채무 자체의 이행지체로 인한 지연손해금은 보증 한도액과 별도로 부담 O [2001다29803, 97다1433]", "보증채무"],
["141.③", "보증채무를 부담하는 내용의 지급보증서에서 보증금액을 정하여 두었다고 하더라도 보증채무는 주채무와는 별개의 채무이기 때문에 보증채무 자체의 이행지체로 인한 지연손해금은 지급보증의 한도액과는 별도로 부담하여야 한다.", false, "▸ 채권자가 보증계약을 체결한 후 주채무자가 이행기에 이행할 수 없음을 미리 알게 되었음에도 지체 없이 보증인에게 그 사실을 알리지 않아 보증인에게 손해가 발생한 경우 그 손해액만큼 보증채무액이 감경된다는 것이 제436조의2의 내용이나, 이 조항의 효과는 '감경'이지 '면제'가 아님", "보증채무"],
["142.③", "丙이 乙과 보증계약을 체결하면서 甲의 채무를 중첩적으로 인수하기로 약정한 경우, 특별한 사정이 없는 한 丙은 위 대여금채무를 변제하더라도 甲을 상대로 구상권을 행사할 수 없다.", false, "▸ 채권자와 보증인 사이에 보증인이 주채무를 중첩적으로 인수하기로 약정하였다 하더라도 특별한 사정이 없는 한 보증인은 주채무자에 대한 관계에서는 종전의 보증인의 지위를 그대로 유지 [2003다37730]", "보증채무"],

const CSS = `

*{box-sizing:border-box;margin:0;padding:0;}
:root{

/* ── 라이트 테마 ───────────────────────────────────── */
html.light {
  --bg:#f6f8fa;--sf:#ffffff;--sf2:#f0f2f5;--bd:#d0d7de;--bd2:#e8ecf0;
  --gold:#a87c2a;--gold2:#c9952f;--tx:#1f2328;--tx2:#57606a;--tx3:#8c959f;
  --purple:#7c4dba;--ok:#1a7f37;--er:#d1242f;--er-bg:rgba(209,36,47,.08);
}
html.light body { background:var(--bg); color:var(--tx); }

/* ── 테마 토글 버튼 ────────────────────────────────── */
.theme-toggle {
  display:flex;align-items:center;justify-content:center;
  width:32px;height:32px;border-radius:8px;cursor:pointer;
  background:var(--sf2);border:1px solid var(--bd);
  font-size:15px;transition:background .15s,border .15s;

}
.theme-toggle:hover{background:var(--bd);border-color:var(--tx3);}

.fb-btn{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;border:1px solid var(--bd);background:transparent;color:var(--tx3);font-size:11px;cursor:pointer;transition:all .15s;}
