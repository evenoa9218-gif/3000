  ["003.ㄹ", "계약교섭의 부당한 중도파기가 불법행위를 구성하는 경우, 이행의 착수가 상대방의 적극적인 요구에 의한 것이고 그 이행에 들인 비용의 지급에 관하여 이미 계약교섭이 진행되고 있었다는 등의 특별한 사정이 있는 경우에는 이행을 위하여 지출한 비용도 상당인과관계가 있는 손해가 될 수 있다.", true, "▸ 계약 교섭단계는 아직 계약 성립된 것 아니므로 일방이 '이행행위'에 준비·착수하는 것은 이례적, 설령 이행 착수했더라도 자기 판단과 책임 → 그러나 만일 이행 착수가 상대방 적극적 요구에 따른 것이고 그 이행 비용 지급에 관해 이미 계약 교섭 진행되고 있는 등 특별한 사정 있다면, 일방이 계약 성립 기대하고 이행 위해 지출했거나 지출이 확실한 비용은 계약체결 신뢰로 발생한 손해 O\n계약교섭 부당파기로 인한 손해배상 범위 O [2021다216773]\n\n[AI해설] 이행 착수가 상대방 적극적 요구에 의하고 그 비용 지급 교섭이 진행 중이었다는 특별한 사정이 있으면, 이행 위해 지출한 비용도 손해배상 범위에 포함될 수 있다.", "계약의종류·성립"],
  // 동시이행의항변권,
  ["004.①", "도급계약에서 수급인이 도급계약에 따른 의무를 제대로 이행하지 못함으로 말미암아 도급인의 신체 또는 재산에도 손해가 발생한 경우, 이러한 확대손해로 인한 수급인의 손해배상채무와 도급인의 공사대금채무는 동시이행관계에 있지 아니하다.", false, "▸ 도급에서 하자확대손해로 인한 손해배상채무와 공사대금채무도 동시이행관계 O [2004다37676]", "동시이행의항변권"],
  ["004.②", "채무담보의 목적으로 경료된 채권자 명의의 소유권이전등기나 그 청구권보전 가등기의 말소의무는 피담보채무의 변제와 동시이행관계에 있다.", false, "▸ 저당권을 포함한 모든 담보물권 등기의 말소보다 피담보채무의 변제가 선이행의무", "동시이행의항변권"],
  ["004.⑤", "상가건물임대차에서 임차인의 임차목적물 반환의무와 임대인의 권리금 회수 방해로 인한 손해배상의무는 임대차계약의 종료라는 동일한 원인에 기하여 발생한 것일뿐만 아니라 공평의 관점에서 보더라도 이행의 견련관계를 인정할 수 있다.", false, "▸ 동시이행관계는 쌍무계약 고유 대가관계 채무 아니더라도 대가적 의미 있거나 공평의 관점에서 인정 가능 → 임차목적물반환의무와 권리금 회수 방해로 인한 손해배상의무는 공평 관점에서도 동시이행관계 × ∵ 전자는 임대차계약 종료로, 후자는 상임법의 권리금 회수기회 보호의무 위반으로 발생 [2018다242727]", "동시이행의항변권"],
  ["005.ㄷ", "원고가 단순이행청구를 함에 대하여 피고가 동시이행의 항변권을 행사하지 않더라도 법원은 직권으로 상환이행판결을 할 수 있다.", false, "▸ [민소] 변론주의 → 피고가 항변으로 주장해야 → 인정되면 상환이행판결(일부승소)", "동시이행의항변권"],
  ["SS1.ㄴ", "甲과 乙이 甲 소유 X토지에 관하여 매매계약을 체결한 상황에서, 甲의 채권자 丙이 甲의 乙에 대한 매매대금 잔금 채권에 대해 압류 및 추심명령을 얻은 후 乙이 甲에게 소유권이전등기를 청구한 경우, 甲은 乙의 잔금 미지급을 이유로 동시이행항변권을 행사할 수 있다.", true, "▸ [집행] 압류 및 추심명령 있는 경우, 추심채무자는 제3채무자에 대해 피압류채권에 기한 동시이행항변권을 상실하지 않음 ∵ 추심채권자에게 채무자의 제3채무자에 대한 채권의 추심권능만 부여하고 그 채권이 추심채권자에게 이전·귀속되는 것은 × [2000다73490]\n→ 최근 판례 변경(대법원 2025. 10. 23. 선고 2021다252977 전원합의체)과 상관없이 이 지문은 여전히 옳다.", "동시이행의항변권"],
  ["006.ㄱ", "채무의 이행확보를 위하여 어음을 발행한 경우, 채무의 이행과 어음의 반환은 동시이행관계에 있다.", true, "▸ 채무 이행확보를 위하여 어음을 발행한 경우 채무 이행과 어음 반환은 동시이행 관계 O [92다8712]\n→ 단, 이 경우 원인채무 이행기 도래하면 어음반환으로 항변하지 않는 한 원칙적으로 지체책임 진다는 93다11203 판결과 구별할 것", "동시이행의항변권"],
  ["007.ㄱ", "채권증서 반환청구권이나 영수증 교부의무는 모두 변제와 동시이행관계에 있다.", false, "제474조(영수증청구권) 변제자는 변제를 받는 자에게 영수증을 청구할 수 있다.\n▸ 채무자·제3자가 전부를 변제한 때 채권자에게 채권증서 반환청구 O (475조) → 채권증서 반환은 영수증 교부의무와 달리 변제와 동시이행관계 × [2003다22042]\n[AI해설] 채권증서 반환청구권은 변제와 동시이행관계가 아니므로, 양자 모두 동시이행관계라는 지문은 틀렸다.", "동시이행의항변권"],
  ["007.ㄷ", "동시이행의 관계에 있는 쌍방의 채무 중 어느 한 채무가 이행불능이 됨으로 인하여 발생한 손해배상채무는 여전히 다른 채무와 동시이행관계에 있다.", true, "▸ 채권양도·채무인수, 이행불능으로 인한 손해배상채무로 변경, 급부 불능으로 인한 대상청구권 발생 → 동일성 있으므로 여전히 동시이행 O", "동시이행의항변권"],
  ["007.ㄹ", "임대차 종료 후 임차인의 임차목적물 인도의무와 임대인의 연체임료 기타 손해배상금을 공제하고 남은 임차보증금 반환의무와는 동시이행관계에 있으므로, 임차인이 동시이행항변권에 기하여 임차목적물을 점유하고 사용·수익한 경우 그 점유·사용으로 인한 이익에 대하여 부당이득반환의무가 인정되지 않는다.", false, "▸ 임차인이 동시이행 항변권에 기하여 임차목적물을 점유 사용·수익한 경우 불법점유로 인한 손해배상청구 × → 그러나 사용·수익으로 인하여 실질적으로 얻은 이익 있으면 부당이득반환 O [98다15545]", "동시이행의항변권"],
  ["007.ㅁ", "근저당권 실행을 위한 경매가 무효로 되어 근저당권자인 채권자가 채무자를 대위하여 경매절차상 매수인에 대한 소유권이전등기 말소청구권을 행사하는 경우, 매수인이 부담하는 소유권이전등기 말소의무와 위 근저당권자가 매수인에 대하여 부담하는 배당금 반환채무는 서로 이행의 상대방을 달리하는 것으로서 동시이행관계에 있지 않다.", true, "▸ 임의경매 무효인 경우 채권자(=근저당권자)가 채무자를 대위하여 경락인에게 하는 소유권이전등기 말소청구와 경락인이 배당금을 수령한 채권자(=근저당권자)에게 하는 배당금반환청구는 동시이행 × ∵ 서로 이행의 상대방 다름 [2006다24049]", "동시이행의항변권"],
  ["008.①", "주택임대차보호법상의 임차권등기명령에 의하여 임차권이 등기된 경우 임대인의 임대차보증금반환의무와 임차인의 임차권등기말소의무는 동시이행관계에 있다.", false, "▸ 임차권등기명령에 의한 등기는 이미 이행지체에 빠진 임대인에 대한 것 → 보증금반환의무가 임차권등기 말소의무보다 선이행의무 [2005다4529] → 동시이행관계 아님을 주의", "동시이행의항변권"],
  ["008.②", "채무를 담보하기 위하여 어음이 발행된 경우 채권자가 원인채권을 행사함에 있어서 채무자는 원칙적으로 어음과 상환으로 지급하겠다는 항변으로 채권자에게 대항할 수 있다.", true, "▸ 원인채권과 어음채권 병존할 경우, 채권자가 원인채권 행사하면 채무자는 원칙적으로 어음 상환 항변 O → 이러한 거절은 이중지급 위험 면할 목적, 원인채권 이행청구권과 어음반환청구권 사이 536조 쌍무계약상 채권채무관계나 유사한 대가관계는 × → 어음상 권리 시효소멸로 이중지급 위험 없고 채무자가 다른 어음상 채무자에 대해 권리 행사도 불가한 경우, 채권자의 원인채권 행사에 채무자 어음상환 동이항 × [2009다69692]\n\n[AI해설] 원칙적으로 어음상환항변 O이나, 이중지급 위험이 없는 경우(어음시효소멸 등)에는 해당 항변 행사 ×", "동시이행의항변권"],
  ["008.③", "부동산매수인이 매매계약을 체결하면서 매매목적물에 관한 근저당권의 피담보채무를 인수하는 한편 그 채무액을 매매대금에서 공제하기로 하는 이행인수계약이 함께 이루어진 경우 매수인의 인수채무 불이행으로 인한 손해배상채무와 매도인의 소유권이전등기의무는 동시이행관계에 있다.", true, "▸ 부동산매매계약·이행인수계약이 함께 이뤄진 경우, 매수인의 인수채무불이행으로 인한 손해배상채무 또는 구상채무는 인수채무의 변형(=매매대금지급채무에 갈음한 것의 변형)이므로 매도인의 소유권이전등기의무와 동시이행 O → 매도인 매매 해제 O [92다23193]", "동시이행의항변권"],
  ["009.①", "부동산매매계약에서 매수인의 소유권이전등기청구권을 보전하기 위하여 매수인 명의로 가등기가 마쳐진 경우, 계약이 해제되면 매수인의 가등기말소의무와 매도인의 매매대금반환의무는 동시이행의 관계에 있다.", true, "▸ 분양계약 해제된 경우 계약이행 일환으로 마쳐진 매수인 명의 가등기말소의무와 매도인의 계약금반환의무는 원상회복의무로서 동시이행관계 O [89다카19412]", "동시이행의항변권"],
  ["010.ㄱ", "상환이행판결에 의하여 강제집행을 하는 경우, 원고가 해야 하는 반대급부의 이행 제공은 원칙적으로 집행문 부여의 요건이다.", false, "▸ 동시이행판결의 반대의무 이행·이행제공은 집행개시 요건으로서 채권자의 증명방법에 제한 없음 → 법원은 반대의무 내용을 명확하게 특정해야 [2020다290804]\n▸ 동시이행항변 따른 상환이행판결의 집행에서 원고의 반대채무 이행은 집행개시요건 + 집행기관 심사 [통판] (v. 집행문부여요건 + 법원이 심사 → 선이행의무인 경우)", "동시이행의항변권"],
  ["010.ㄴ", "채권자의 영수증 교부의무는 채무자의 변제와 동시이행관계에 있다.", true, "제474조(영수증청구권) 변제자는 변제를 받는 자에게 영수증을 청구할 수 있다.\n▸ 채무자·제3자가 전부를 변제한 때 채권자에게 채권증서 반환청구 O (475조) → 채권증서 반환은 영수증 교부의무와 달리 변제와 동시이행관계 × [2003다22042]\n[AI해설] 영수증 교부의무는 변제와 동시이행관계 O이나, 채권증서 반환은 동시이행관계 ×임을 구별할 것", "동시이행의항변권"],
  ["011.ㄴ", "도급인 甲, 수급인 乙, 하수급인 丙 사이에 甲에 대한 乙의 공사대금채권을 丙에게 양도하기로 합의하여 공사대금채권이 丙에게 귀속된 이후에 乙에 대하여 도급계약상의 지체상금채권이 甲에게 발생한 경우, 공사대금채권과 지체상금채권 사이에는 동시이행관계가 있다.", false, "▸ 지체상금채권과 공사대금채권은 특별한 사정 없는 한 동시이행 × [2013다81224]\n→ 甲이 채권양도 통지를 받은 후에 乙에 대한 지체상금채권이 생긴 경우에는, 丙의 甲에 대한 양수금청구에 대하여 甲이 지체상금채권을 가지고 동이항 관계에 따른 예외 주장 ×", "동시이행의항변권"],
  ["012.④", "동시이행관계에 있는 쌍방 채무 중 어느 한 채무가 이행불능이 됨으로 인하여 발생한 손해배상채무도 여전히 다른 채무와 동시이행의 관계에 있다.", true, "▸ [97다30066]\n[AI해설] 동시이행관계에 있는 채무 중 하나가 이행불능으로 손해배상채무로 변형되어도 급부의 동일성이 유지되므로, 여전히 다른 채무와 동시이행관계에 있다. (007.ㄷ 참조)", "동시이행의항변권"],
  ["012.⑤", "매수인이 선이행의무인 중도금지급채무를 이행하지 않은 상태에서 잔대금 지급기일이 도래한 경우, 다른 특별한 사정이 없는 한, 매수인의 중도금 지급과 매도인의 소유권이전기서류의 제공은 동시이행관계에 있다.", true, "▸ 매수인이 선이행의무인 중도금을 이행하지 않았더라도 계약 해제되지 않은 상태에서 잔금과 동시이행관계인 매도인의 등기서류 제공 없이 잔금기일 도과되면, 매수인의 중도금 및 잔금 지급과 매도인의 소유권이전등기 서류 제공은 동시이행 관계 O → 그때부터는 매수인은 중도금에 이행지체 책임 × [91다6368]\n\n[AI해설] 중도금 선이행의무 불이행 상태에서 잔금기일이 도래하고 매도인 등기서류 제공이 없으면, 중도금·잔금 지급의무와 소유권이전등기서류 제공의무는 동시이행 관계로 전환된다.", "동시이행의항변권"],
  ["013.ㄱ", "도급인이 수급인의 하수급인에 대한 공사대금채무를 인수한 경우, 도급인은 하수급인의 공사대금청구에 대하여 수급인의 하수급인에 대한 하자보수청구권으로 동시이행의 항변을 할 수 있다.", true, "▸ [2007다31914]\n제458조(전채무자의 항변사유) 인수인은 전 채무자의 항변할 수 있는 사유로 채권자에게 대항할 수 있다.\n[AI해설] 채무인수인(도급인)은 전 채무자(수급인)의 항변사유를 원용할 수 있으므로(458조), 수급인이 하수급인에게 갖는 하자보수청구권으로 동시이행항변 가능하다.", "동시이행의항변권"],
  ["013.ㄷ", "매매계약에 따른 소유권이전의무와 잔금지급의무가 동시이행의 관계에 있다면 어느 일방의 채무에 관한 이행의 제공이 있기 이전에는 소멸시효가 진행하지 않는다.", false, "▸ 매매에 동시이행항변권 있더라도 이행기 되면 소멸시효 진행 O [90다9797]", "동시이행의항변권"],
  // 위험부담,
  ["014.ㄷ", "甲과 乙은 공동으로 丙에게 특수한 인쇄기계의 제작을 대금 3억 원에 도급하였다. 그 계약에서 도급대금은 완성된 인쇄기계의 인도와 동시에 지급하기로 약정하고 그 지급에 관하여 甲과 乙이 연대채무를 부담하기로 하였다.§甲·乙은 인쇄기계가 완성되기 전부터 丙에게 근거 없이 도급대금을 지급할 수 없다는 취지의 확고한 이행거절의사를 표시하였다. 인쇄기계가 완성된 후 丙이 甲·乙에게 대금청구 및 인쇄기계 수령을 최고하기 전에 甲, 乙, 丙의 과실 없이 위 인쇄기계가 멸실되었다. 이 경우 丙은 甲·乙에게 도급대금을 청구할 수 있다.", false, "제537조(채무자위험부담주의) 쌍무계약의 당사자 일방의 채무가 당사자쌍방의 책임없는 사유로 이행할 수 없게 된 때에는 채무자는 상대방의 이행을 청구하지 못한다.\n제538조(채권자귀책사유로 인한 이행불능) ① 쌍무계약의 당사자 일방의 채무가 채권자의 책있는 사유로 이행할 수 없게 된 때에는 채무자는 상대방의 이행을 청구할 수 있다. 채권자의 수령지체 중에 당사자쌍방의 책임없는 사유로 이행할 수 없게 된 때에도 같다. ② 전항의 경우에 채무자는 자기의 채무를 면함으로써 이익을 얻은 때에는 이를 채권자에게 상환하여야 한다.\n▸ 기계의 채권자가 수령지체 하다가 쌍방 귀책 없이 멸실된 것인지 문제되므로 538조의 문제 → 다만 영구적 불수령 상태를 두고 '수령지체 중'이라고 볼 수 있는지 혹은 최소한 구두제공 필요한지 문제됨 → 채권자지체(400조) 성립 위하여 변제제공(460조) 있어야 하는데 채권자의 수령거절 의사가 확고한 이른바 '영구적 불수령'의 경우 구두 제공조차 필요 없으나 이는 그로써 채무불이행을 면한다는 것에 불과하고(461조), 538조 1항 2문 '수령지체' 중 쌍방 책임 없는 불능을 이유로 채무자가 반대급부를 청구하기 위해서는 현실제공이나 구두제공이 있었어야 [2001다79013] → 구두제공조차 없었다면 '수령지체 중'으로 볼 수 없고 결국 537조가 적용됨", "위험부담"],
  ["015.ㄱ", "위험부담에 관한 민법 제537조와 제538조는 임의규정이므로 당사자의 특약으로 달리 정할 수 있다.", true, "▸ 민법 규정 중 강행규정과 제103조 공서양속 규정과 같이 사회성이 강한 일부 규정을 제외하고는, 나머지 모든 규정은 임의규정으로서 특약으로 배제할 수 있음", "위험부담"],
  ["015.ㄴ", "종류물매매라고 하더라도 특정된 이후에는 급부의 위험은 채권자인 매수인이 부담한다.", true, "▸ 종류물은 특정 전에는 채무자가 물건(급부)의 위험을 부담하고(조달의무), 특정 후에는 채권자가 부담함(불능이 되면 채권·채무 소멸)", "위험부담"],
  ["015.ㄷ", "동산 소유권유보부매매에 있어서 인도에 의하여 위험이 이전된다는 입장에 따르면, 매수인이 인도받은 후 대금 완납 전에 쌍방의 귀책사유 없이 목적물이 멸실된 경우 매수인은 매도인에게 다른 동산의 인도를 청구할 수 없으므로 매매잔대금 또한 지급할 필요가 없다.", false, "▸ 위 견해에 따르면 인도로 매수인에게 소유권이 이전되지는 않지만 물건의 위험은 이전되어 멸실되면 매수인은 다른 동산의 인도를 구할 수 없고, 그러나 이와 별개로 매수인은 매잔금은 지급해야 함", "위험부담"],
  ["016.②", "매매계약에서 매수인의 이행거절의 의사가 확고하면 매도인의 구두의 제공 없이도 매수인의 채권자지체는 성립할 수 있고, 이 경우 매도인의 귀책사유 없이 소유권이전등기의무를 이행할 수 없게 되더라도 매수인은 대금지급의무를 부담한다.", false, "▸ 채권자지체(400조) 성립 위하여 변제제공(460조) 있어야 하는데 채권자의 수령거절 의사가 확고한 이른바 '영구적 불수령'의 경우 구두 제공조차 필요 없으나 이는 그로써 채무불이행을 면한다는 것에 불과하고(461조), 538조 1항 2문 '수령지체' 중 쌍방 책임 없는 불능을 이유로 채무자가 반대급부를 청구하기 위해서는 현실제공이나 구두제공이 있었어야 [2001다79013]\n[AI해설] '영구적 불수령'은 구두제공 없이 채무불이행 책임을 면하게 해줄 뿐, 538조 1항 2문의 '수령지체 중' 불능으로 인정받기 위해서는 구두·현실제공이 필요하므로, 구두제공 없이는 537조가 적용되어 채무자는 반대급부를 청구할 수 없다.", "위험부담"],
  // 제3자를위한계약,
  ["017.ㄱ", "甲이 乙에 대한 급부에 갈음하여 乙의 지시에 따라 乙의 채권자인 丙에게 급부를 한 경우, 甲과 乙 사이의 법률관계가 무효이더라도 甲은 丙에 대하여 부당이득반환청구를 할 수 없다.", true, "▸ 丙에 대한 반환청구를 긍정하면 자기 책임으로 체결된 계약 위험을 제3자에게 전가하여 계약법 위반, 제3자가 상대방에 대해 가지는 항변 침해 → 이 경우 丙이 급부 수령 당시 甲·乙 사이 원인관계에 무효 등 흠이 있음을 알고 있었다고 하더라도 마찬가지 [2006다46278]", "제3자를위한계약"],
  ["018.ㄴ", "제3자를 위한 계약의 체결 원인이 된 요약자와 제3자 사이의 법률관계의 효력은 요약자와 낙약자 사이의 법률관계의 성립이나 효력에 영향을 미친다.", false, "▸ 제3자를 위한 계약의 체결 원인인 요약자와 수익자 사이의 법률관계(이른바 '대가관계')의 효력은 제3자를 위한 계약 자체는 물론 그에 기한 요약자와 낙약자 사이의 법률관계(이른바 '기본관계')의 성립이나 효력에 영향 미치지 ×, → 대가관계에 관한 항변을 가지고, '낙약자가 수익자에게' 혹은 '요약자가 낙약자에게' 대항 × [2003다49771]", "제3자를위한계약"],
  ["018.ㄷ", "요약자의 채무불이행으로 인하여 낙약자가 계약을 해제한 경우에는 낙약자는 제3자에 대하여 계약의 해제로 인한 원상회복을 청구할 수 있다.", false, "▸ 제3자를 위한 계약에서 낙약자와 요약자 사이 법률관계(기본관계)를 이루는 계약이 무효이거나 해제된 경우 낙약자가 이미 제3자에게 급부한 것에 관하여서는 요약자를 상대로 원상회복청구나 부당이득반환청구를 해야 O ∵ 계약관계의 청산은 계약당사자인 낙약자와 요약자 사이에 이루어져야, 계약상의 위험을 제3자에게 전가시키면 × [2005다7566]\n이유 중 : 제3자를 위한 계약에서의 제3자는 548조 1항 단서 제3자에 해당 ×, 그렇다고 계약해제로 인한 원상회복의무 부담 ×, 낙약자가 미지급급부에 대해 지급 거절할 수 있으나(542조), 이는 이미 지급한 급부의 원상회복과는 다른 문제", "제3자를위한계약"],
  ["019.ㄷ", "甲이 약정기일 내에 체육관이 완성되지 아니하여 도급계약을 해제하는 경우, 丙의 동의를 받을 필요가 없다.", true, "▸ 제3자를 위한 계약에서 낙약자의 귀책사유로 인한 이행불능·이행지체가 있을 때 요약자는 제3자의 동의 없이 계약당사자로서 계약을 해제 O [69다1410]", "제3자를위한계약"],
  ["SS2.ㄱ", "제3자를 위한 계약에서 수익자가 낙약자에 대해 금전채권인 수익권을 취득한 뒤, 낙약자와 요약자 사이의 기본계약이 해제된 경우 수익자는「민법」제548조 제1항 단서의 제3자이므로 낙약자에 대하여 수익권을 행사할 수 있다.", false, "▸ 이유 중 : 제3자를 위한 계약에서의 제3자는 548조 1항 단서 제3자에 해당 ×, 그렇다고 계약해제로 인한 원상회복의무 부담 ×, 낙약자가 미지급급부에 대해 지급 거절할 수 있으나(542조), 이는 이미 지급한 급부의 원상회복과는 다른 문제 [2005다7566]", "제3자를위한계약"],
  ["SS2.ㄴ", "낙약자가 요약자에게 동산을 납품하는 계약을 체결하면서 제3자를 수익자로 지정하였고, 그에 따라 수익자가 위 동산을 인도받았는데(수익자와 요약자 간 대가관계에서는 요약자가 수익자에게 위 동산을 공급하는 계약을 체결하였다) 낙약자와 요약자 사이의 계약이 요약자의 채무불이행을 이유로 해제된 경우 수익자는「민법」제548조 제1항 단서의 제3자이므로 여전히 위 동산 소유권을 보유한다.", true, "▸ 제3자를 위한 계약에서 낙약자·요약자 사이 법률관계(기본관계)에 기초하여 수익자가 요약자와 원인관계(대가관계) 맺음으로써 해제 전에 새로운 이해관계 갖고 그에 따라 등기·인도 등 완전한 권리 취득했다면 수익자는 548조 1항 단서의 제3자 O [2018다244976]\n→ 제3자를 위한 계약의 '수익자'는 원칙적으로 해제에서 보호되는 '제3자' 아니지만, 기본관계(함포납품계약)를 '기초로' 대가관계(현물변상계약) 맺고 함포 인도받아(간접점유) 소유권 취득한 수익자는 함포납품계약 해제에 보호되는 548조 1항 단서 제3자 O\n→ 지문에서 수익자가 인도를 갖춘 것은 드러나 있으나, 가장 핵심인 '대가관계가 기본관계에 기초하여' 성립했다는 부분이 없어 다소 아쉬운 지문임(私見)", "제3자를위한계약"],
  ["SS2.ㄷ", "甲이 乙에게 부동산을 매도하여 乙에게 소유권이전등기가 된 후 乙의 채권자 A가 위 부동산에 가압류등기를 한 경우, 그 가압류등기 전에 甲이 乙에 대한 위 부동산 소유권이전등기 말소청구권 보전을 위해 처분금지가처분을 경료하였고, 乙을 상대로 매매계약 해제를 주장하며 소유권이전등기 말소소송을 제기하여 승소확정판결을 받았다면, A의 가압류등기는 선행가처분등기에 반하는 등기로서 말소될 수밖에 없으므로 A는 위 해제에서의 보호받는 제3자가 아니다.", true, "▸ 부동산 가압류를 한 가압류채권자도 548조 1항 단서 제3자 O → 그러나 가압류에 앞서 전 소유자(매도인)가 말소청구권 보전을 위한 처분금지가처분을 마친 다음 매매 해제로 인한 말소청구가 승소 확정되었다면(상환이행판결 포함), 위 가압류채권자는 548조 1항 단서 제3자 × ∵ 가압류 말소될 운명 [2003다33004]", "제3자를위한계약"],
  ["SS2.ㄹ", "채무불이행 대상이 된 채무가 해제권 행사 시점에 소멸시효가 완성된 경우에도, 소멸시효 완성 전에 이미 법정해제권이 발생하였다면 그 법정해제권을 행사할 수 있다.", false, "▸ 채무불이행 해제 의사표시 당시 이미 채무불이행 대상 원채권이 시효소멸 했다면, 소멸시효 주장이 신의칙에 반하여 불허되는 등 특별한 사정 없는 한, 채무불이행 시점이 원채권의 시효완성 전인지 후인지 불문, 채권자는 채무불이행 이유로 해제권·원상회복청구권 × ∵ 법정해제권은 채무불이행의 구제수단이어서 본래 채무 이행불능 이유로 계약 해제하려면 그 이행불능 대상인 본래 채무는 유효하게 존속해야, 167조 소멸시효의 소급효 [2019다204593]", "제3자를위한계약"],
  ["020.②", "甲이 물건을 인도하지 아니한 경우, 丙의 청구에 대해 乙은 동시이행의 항변을 할 수 있다.", true, "제542조(채무자의 항변권) 채무자는 제539조의 계약에 기한 항변으로 그 계약의 이익을 받을 제3자에게 대항할 수 있다.", "제3자를위한계약"],
  ["020.③", "甲과 丙 사이의 계약이 취소되어 丙의 甲에 대한 채권이 소멸하였더라도, 乙이 이러한 사정을 들어 수익의 의사표시를 한 丙에게 1천만 원의 지급을 거절할 수 없다.", true, "▸ 제3자를 위한 계약의 체결 원인인 요약자와 수익자 사이의 법률관계(이른바 '대가관계')의 효력은 제3자를 위한 계약 자체는 물론 그에 기한 요약자와 낙약자 사이의 법률관계(이른바 '기본관계')의 성립이나 효력에 영향 미치지 ×, → 대가관계에 관한 항변을 가지고, '낙약자가 수익자에게' 혹은 '요약자가 낙약자에게' 대항 × [2003다49771]", "제3자를위한계약"],
  ["021.③", "제3자를 위한 계약 당시 수익자는 현존하지 않아도 되므로 성립 중의 법인을 위한 계약도 유효하다.", true, "▸ 재단법인의 설립준비 중 제3자가 그 설립자에 대하여 장차 설립될 동 법인에 설립을 조건으로 무상 재산출연을 약정하거나 동 법인을 수익자로 제3자를 위한 재산출연에 관한 계약을 했을 경우, 동 법인은 전자는 설립과 동시에, 후자는 설립 후 수익의 의사표시에 의해 동 재산상 권리 취득 O [4292민상773]", "제3자를위한계약"],
  ["021.④", "수익자는 제3자를 위한 계약의 당사자가 아니므로 낙약자에 대하여 채무불이행을 원인으로 한 손해배상을 직접 청구할 수는 없다.", false, "▸ 수익의 의사표시를 한 수익자는 요약자가 계약을 해제한 경우에 낙약자에게 하자로 인한 손해배상청구 O [92다41559]", "제3자를위한계약"],
  ["021.⑤", "제3자를 위한 유상·쌍무계약의 경우, 요약자는 낙약자의 귀책사유로 인한 이행불능이 있을 때 채무불이행을 이유로 제3자의 동의 없이 계약을 해제할 수 있다.", true, "▸ 제3자를 위한 계약에서 낙약자의 귀책사유로 인한 이행불능·이행지체가 있을 때 요약자는 제3자의 동의 없이 계약당사자로서 계약을 해제 O [69다1410]", "제3자를위한계약"],
  ["022.①", "甲과 乙의 매매계약이 합의해제된다면 丙은 선의의 여부를 불문하고 더 이상 乙에게 1억 원의 지급을 청구할 수 없다.", true, "▸ 수익자는 매매계약에 관하여 '새로운' 법률상 이해관계를 맺은 자가 아니므로 의사표시나 해제 규정에서 보호되는 '제3자'가 아님", "제3자를위한계약"],
  ["022.②", "甲과 乙은 X 토지에 대한 매매계약을 합의해제할 수 없다.", true, "제541조(제3자의 권리의 확정) 제539조의 규정에 의하여 제3자의 권리가 생긴 후에는 당사자는 이를 변경 또는 소멸시키지 못한다.\n▸ 통설은 합의해제를 위 541조에서 금지하는 '변경 또는 소멸'로 해석함", "제3자를위한계약"],
  ["기타02", "대가관계의 흠결은 계약의 효력에 영향을 미치지 않는다.", true, "▸ 제3자를 위한 계약의 체결 원인인 요약자와 수익자 사이의 법률관계(이른바 '대가관계')의 효력은 제3자를 위한 계약 자체는 물론 그에 기한 요약자와 낙약자 사이의 법률관계(이른바 '기본관계')의 성립이나 효력에 영향 미치지 ×, → 대가관계에 관한 항변을 가지고, '낙약자가 수익자에게' 혹은 '요약자가 낙약자에게' 대항 × [2003다49771]", "제3자를위한계약"],
  // 해제,
  ["023.ㄱ", "甲은 2023. 2. 1. 乙에게 甲 소유 X 부동산을 1억 원에 매도하기로 하는 계약을 체결하고, 계약 당일 乙로부터 계약금 1천만 원을 수령하였다. 위 계약서상 중도금 3천만 원에 대한 지급기일은 2023. 5. 1.로, 잔금 6천만 원에 대한 지급기일은 2023. 8. 1.로 각 정해져 있으며, 다음과 같은 내용이 포함되어 있다. 제△△조(계약의 해제) ① 매수인이 약정한 날짜에 중도금을 지급하지 아니한 경우 계약은 자동적으로 해제된다. 이 경우 매수인은 지급한 계약금의 반환을 청구할 수 없다. ② 매도인의 고의 또는 과실로 매수인이 X 부동산의 소유권을 취득하지 못하게 되어 매수인이 계약을 해제한 경우, 매도인은 매수인으로부터 지급받은 금전에 대하여 그 수령 일부터 계약을 해제한 때까지 연 10%의 이자를 가산하여 반환한다.§乙이 2023. 5. 1.까지 甲에게 중도금을 지급하지 못하였다면 특별한 사정이 없는 한 별도의 최고나 해제의 의사표시 없이도 위 계약은 해제되고, 乙은 지급한 계약금의 반환을 청구할 수 없다.", true, "▸ 중도금을 기일에 지급 못하면 자동해제된다는 약정은 그대로 O [88다카132]", "해제"],
  ["023.ㄴ", "甲은 2023. 2. 1. 乙에게 甲 소유 X 부동산을 1억 원에 매도하기로 하는 계약을 체결하고, 계약 당일 乙로부터 계약금 1천만 원을 수령하였다. 위 계약서상 중도금 3천만 원에 대한 지급기일은 2023. 5. 1.로, 잔금 6천만 원에 대한 지급기일은 2023. 8. 1.로 각 정해져 있으며, 다음과 같은 내용이 포함되어 있다. 제△△조(계약의 해제) ① 매수인이 약정한 날짜에 중도금을 지급하지 아니한 경우 계약은 자동적으로 해제된다. 이 경우 매수인은 지급한 계약금의 반환을 청구할 수 없다. ② 매도인의 고의 또는 과실로 매수인이 X 부동산의 소유권을 취득하지 못하게 되어 매수인이 계약을 해제한 경우, 매도인은 매수인으로부터 지급받은 금전에 대하여 그 수령 일부터 계약을 해제한 때까지 연 10%의 이자를 가산하여 반환한다.§위 계약이 제△△조 제1항에 따라 해제되었다고 하더라도 甲과 乙이 계약이 여전히 유효함을 전제로 논의를 계속하면서 甲이 해제에 따른 법률효과를 주장하지 아니한 채 계약 내용에 따른 이행을 촉구하였다면 특별한 사정이 없는 한 甲과 乙 사이에서는 해제된 계약을 부활시키기로 하는 합의가 있었다고 봄이 상당하다.", true, "▸ 자동해제로 약정하고 일방 채무불이행 하면 별도 최고나 해제 의사표시 없이 불이행 자체로써 자동해제 O → 그러나 당사자들이 계약 여전히 유효 전제로 논의의 계속, 해제 법률효과 주장 않은 채 계약 내용 이행 촉구, 온전한 이행 못 받은 상대방이 이의 없이 급부 중 일부 수령 → 특별한 사정 없는 한 계약당사자들 사이 자동해제약정 효력 상실시키고 자동해제된 계약 부활시키는 합의 O [2019다216817]", "해제"],
  ["023.ㄷ", "甲은 2023. 2. 1. 乙에게 甲 소유 X 부동산을 1억 원에 매도하기로 하는 계약을 체결하고, 계약 당일 乙로부터 계약금 1천만 원을 수령하였다. 위 계약서상 중도금 3천만 원에 대한 지급기일은 2023. 5. 1.로, 잔금 6천만 원에 대한 지급기일은 2023. 8. 1.로 각 정해져 있으며, 다음과 같은 내용이 포함되어 있다. 제△△조(계약의 해제) ① 매수인이 약정한 날짜에 중도금을 지급하지 아니한 경우 계약은 자동적으로 해제된다. 이 경우 매수인은 지급한 계약금의 반환을 청구할 수 없다. ② 매도인의 고의 또는 과실로 매수인이 X 부동산의 소유권을 취득하지 못하게 되어 매수인이 계약을 해제한 경우, 매도인은 매수인으로부터 지급받은 금전에 대하여 그 수령 일부터 계약을 해제한 때까지 연 10%의 이자를 가산하여 반환한다.§乙이 위 제△△조 제2항에 따라 위 계약을 해제하고 甲에게 지급한 금전의 반환 및 그 이자의 지급을 청구하였는데 甲이 그 이행을 지체한 경우, 특별한 사정이 없는 한 그에 따른 지연손해금은 연 10%의 비율로 계산하여야 한다.", true, "▸ 부당이득반환성질을 가지고 이행지체책임이 아니므로 쌍방 동시이행 관계 상관없이 연 5% 법정이자 가산하여야. 이는 '약정해제권' 행사의 경우도 마찬가지 [2000다9123]\n→ 원상회복 금전 이율 약정 있다면 약정이율 적용 → 원상회복의무는 기한의 정함이 없는 채무로서 이행청구 받은 다음날부터 지연손해금 별도 발생 → 원상회복의무 약정이율을 원상회복의무의 지연손해금에 적용 O. 다만 법정이율보다 낮다면 적용 못하고 법정이율 적용", "해제"],
  ["023.ㄹ", "甲은 2023. 2. 1. 乙에게 甲 소유 X 부동산을 1억 원에 매도하기로 하는 계약을 체결하고, 계약 당일 乙로부터 계약금 1천만 원을 수령하였다. 위 계약서상 중도금 3천만 원에 대한 지급기일은 2023. 5. 1.로, 잔금 6천만 원에 대한 지급기일은 2023. 8. 1.로 각 정해져 있으며, 다음과 같은 내용이 포함되어 있다. 제△△조(계약의 해제) ① 매수인이 약정한 날짜에 중도금을 지급하지 아니한 경우 계약은 자동적으로 해제된다. 이 경우 매수인은 지급한 계약금의 반환을 청구할 수 없다. ② 매도인의 고의 또는 과실로 매수인이 X 부동산의 소유권을 취득하지 못하게 되어 매수인이 계약을 해제한 경우, 매도인은 매수인으로부터 지급받은 금전에 대하여 그 수령 일부터 계약을 해제한 때까지 연 10%의 이자를 가산하여 반환한다.§만일 甲과 乙이 위 계약서 조항과는 무관하게 계약을 해제하기로 합의하면서 그 합의해제로 인하여 반환할 금전에 가산할 이자에 관하여는 별도로 약정한 바가 없다면, 乙이 지급한 금전에 대하여는 그 지급일로부터 연 10%의 이율을 적용하여 반환하여야 한다.", false, "▸ 합의해제에서는 반환할 금전에 받은 날부터 이자가산 × [95다16011] → 548조 2항 ×", "해제"],
  ["024.ㄱ", "채권자가 채무불이행을 이유로 계약을 해제하는 경우 특별한 사정이 없는 한 해제된 계약의 내용에 포함된 손해배상액의 예정도 소급적으로 소멸한다.", false, "▸ 채권자가 채무불이행 이유로 계약 해제·해지해도 원칙적으로 손해배상액 예정은 실효되지 ×, 특별한 사정 없는 한 전보배상도 손해배상 예정에 따라 배상액 결정해야 ∵ 398조 1·3항, 551조 문언·내용, 계약당사자 일반적 의사 → 다만 계약을 전제로 정한 약정이라는 등 특별한 사정이 있다면 해제·해지로 실효 [2019다292736]", "해제"],
  ["024.ㄴ", "채권자가 채무의 내용인 급부 실현을 위해 필요한 협력행위를 하지 않아 계약 목적을 달성할 수 없는 경우, 채무자가 이를 이유로 계약을 해제하려면 채권자의 협력의무에 대한 약정이 있거나 신의칙상 채권자에게 협력의무가 있다고 인정될 만한 특별한 사정이 있어야 한다.", false, "▸ 400조 채권자지체 성립에 채권자 귀책사유 필요 × → 채권자지체 효과는 원칙적으로 민법 규정 따른 401조, 402조, 403조, 538조 1항만 인정, 채무불이행 같은 손해배상 ×, 해제 × → 그러나 계약 당사자가 채권자의 급부수령의무나 이행협력의무 명시적·묵시적 약정했거나 구체적 사안에서 신의칙상 그러한 채권자 의무 인정될 특별한 사정 있다면, 의무위반에 따른 채권자 책임 O → 채권자의 수령의무·협력의무 불이행으로 계약 목적 달성 불가능하면 채무자는 해제 O [2019다293036]", "해제"],
  ["025.②", "甲과 乙은 이행기를 정하여 甲 소유의 X 건물에 대한 매매계약을 체결하였으나, 乙의 잔대금채무에 대한 이행지체를 이유로 甲이 위 매매계약을 해제하려고 한다.§위 매매계약에서 다른 약정 없이 '乙이 잔대금을 지급하지 아니한 상태로 지급기일을 경과하면 매매계약 자체가 자동적으로 해제된다'는 취지의 약정이 있는 경우에는 甲이 자신의 채무에 대한 이행제공을 통하여 乙을 이행지체에 빠뜨리지 않더라도 잔대금 지급기일의 경과만으로 위 매매계약은 자동 해제된 것으로 볼 수 있다.", false, "▸ 잔금을 기일에 지급하지 못하면 자동해제된다는 약정이 있더라도, 매도인이 잔금지급기일에 소유권이전등기 필요 서류 이행제공을 하여 매수인을 이행지체에 빠지게 하였을 때 비로소 자동해제 O [88다카28891]", "해제"],
  ["026.②", "甲이 乙에게 X 토지를 매도하는 내용의 계약을 체결한 경우.§매매계약 체결 시 甲과 乙이 매매대금의 지급 방법 및 매매 토지에 관한 기존의 임대차관계 승계 등에 관해 특약을 하였는데, 甲의 계속된 특약사항의 이행촉구가 있었음에도 乙이 특약의 존재를 부정하면서 이를 이행하지 않을 의사를 분명히 표시하였다면, 甲은 자기 채무의 이행제공이 없더라도 그 매매계약을 해제할 수 있다.", true, "▸ 매매계약 체결하면서 매대대금 지급방법 및 매매 토지에 관한 기존 임대차관계 승계 등에 관해 특약 했음에도 계속된 특약 사항 이행 촉구에도 매수인이 특약 존재를 부정하면서 이행하지 않을 의사 분명히 표시 → 매도인은 특약 사항 이행하지 않을 의사 분명히 표시한 것이므로 매도인은 자기 채무의 이행제공 없더라도 매매계약 해제 O ∵ 매수인은 특약 사항 이행하지 않을 의사 분명히 표시 [97다30257]", "해제"],
  ["026.③", "甲이 乙에게 X 토지를 매도하는 내용의 계약을 체결한 경우.§매매계약 체결 당시 X 토지가 丙 소유이고 甲이 丙에 대하여 가지는 소유권이전등기청구권이 가압류되어 있거나 처분금지가처분이 되어 있는데 甲이 그 가압류 또는 가처분 집행을 모두 해제할 수 없는 무자력의 상태에 있다고 인정되는 경우, 乙은 甲의 소유권이전등기의무가 이행불능임을 이유로 매매계약을 해제할 수 있다.", true, "▸ 매매목적물에 가등기·가압류·가처분만으로는 이행불능 × → 그러나 매도인이 변제자력 없거나 강제집행으로 소유권 잃은 경우는 이행불능 O [91다8104, 99다11045, 2000다47361]", "해제"],
  ["027.ㄴ", "매매계약에 있어서 매수인이 중도금을 약정한 일자에 지급하지 아니하면 그 계약을 무효로 한다고 하는 특약이 있는 경우, 매수인이 약정한 대로 중도금을 지급하지 아니하면 매도인의 해제의 의사표시를 요하지 않고 계약은 위 약정 일자에 자동적으로 해제된다.", true, "▸ 중도금을 기일에 지급 못하면 자동해제된다는 약정은 그대로 O [88다카132]", "해제"],
  ["028.②", "甲은 乙에게 자기 소유의 X 부동산을 매도하는 매매계약을 乙과 체결하였다.§甲이 乙에게 X 부동산을 인도하고 소유권이전등기를 마쳐 주었지만 乙이 甲에게 잔금을 지급하지 못하던 중, 甲과 乙은 합의하여 계약을 해제하였다. 합의해제 후 乙이 丙에게 X 부동산을 매도하고 소유권이전등기까지 마쳐 주었다면, 丙은 합의해제 사실을 알았더라도「민법」제548조 제1항 단서의 제3자에 해당한다.", false, "▸ 합의해제 '후'에 원상회복등기 이뤄지기 '전' 양립되지 않은 법률관계를 가진 '선의' 제3자 보호 O, 제3자의 악의는 계약해제 주장자가 입증책임 [2005다6341]", "해제"],
  ["028.③", "甲은 乙에게 자기 소유의 X 부동산을 매도하는 매매계약을 乙과 체결하였다.§乙의 채권자 丁이 乙의 甲에 대한 X 부동산의 소유권이전등기청구권을 가압류한 이후에도 甲은 乙의 채무불이행을 이유로 매매계약을 해제할 수 있지만, 계약이 해제되기 전에 丁이 가압류에 이어 위 소유권이전등기청구권을 압류한 경우에는 압류채권자로서「민법」제548조 제1항 단서의 제3자에 해당한다.", false, "▸ 계약상 '채권'을 양수한 자나 가압류·압류한 자 × [99다51685]", "해제"],
  ["028.④", "甲은 乙에게 자기 소유의 X 부동산을 매도하는 매매계약을 乙과 체결하였다.§甲이 X 부동산을 丙에게 매도하고 소유권이전등기를 마쳐 주자 乙은 甲의 소유권이전등기의무가 이행불능되었다는 이유로 甲에 대하여 계약의 해제와 함께 원상회복을 청구하였다. 만약 乙이 해제의 의사표시를 할 당시 이미 乙의 甲에 대한 소유권이전등기청구권의 소멸시효가 완성된 상태라면 위 이행불능 시점이 소유권이전등기청구권의 시효완성 전이라고 하더라도 乙의 해제권과 원상회복청구권은 원칙적으로 인정될 수 없다.", true, "▸ 채무불이행 해제 의사표시 당시 이미 채무불이행 대상 원채권이 시효소멸 했다면, 소멸시효 주장이 신의칙에 반하여 불허되는 등 특별한 사정 없는 한, 채무불이행 시점이 원채권의 시효완성 전인지 후인지 불문, 채권자는 채무불이행 이유로 해제권·원상회복청구권 × ∵ 법정해제권은 채무불이행의 구제수단이어서 본래 채무 이행불능 이유로 계약 해제하려면 그 이행불능 대상인 본래 채무는 유효하게 존속해야, 167조 소멸시효의 소급효 [2019다204593]", "해제"],
  ["028.⑤", "甲은 乙에게 자기 소유의 X 부동산을 매도하는 매매계약을 乙과 체결하였다.§乙이 매매대금을 지급한 후 甲의 귀책사유로 소유권이전등기의무가 이행불능되었고, 乙이 1주일 후 甲의 채무불이행을 이유로 계약을 해제한 경우, 그 계약의 해제로 인한 원상회복청구권의 소멸시효는 해제권 발생 시부터 진행한다.", false, "▸ 해제로 인한 원상회복청구권의 소멸시효 기산점은 계약 약 해제시 O(=원상회복청구권 발생시) 해제권 발생시 × [2009다63267] ∵ 원상회복청구권 행사 가능 시점", "해제"],
  ["029.ㄷ", "甲은 자기 소유 X 토지를 乙에게 매도하였는데, 약정에 따라 계약금과 중도금만 지급받은 후 乙에게 소유권이전등기를 마쳐주었다. 그 후 甲은 乙의 매매잔대금 지급의무의 지체를 이유로 매매계약을 해제하였다.§甲의 매매대금반환의무와 乙의 소유권이전등기말소의무가 동시이행관계에 있는지 여부와 관계없이 甲은 이미 지급받은 매매대금에 이자를 더하여 반환해야 한다.", true, "▸ 부당이득반환 성질 가지고 이행지체책임이 아니므로 쌍방 동시이행 관계 있는지 상관없이 연 5% 법정이자 가산하여야. 이는 '약정해제권' 행사의 경우도 마찬가지 [2000다9123]", "해제"],
  ["030.①", "매도인으로부터 매매 목적물의 소유권을 이전받은 매수인이 매도인의 계약해제 이전에 제3자에게 목적물을 처분하여 계약해제에 따른 원물반환이 불가능하게 된 경우, 매수인이 원상회복의무로서 반환하여야 하는 목적물의 가액은 특별한 사정이 없는 한 그 처분 당시의 대가 또는 그 시가 상당액이다.", false, "▸ 매도인으로부터 목적물 소유권 이전받은 매수인이 매도인의 해제 전 제3자에게 목적물 처분하여 해제 원물반환 불가능하면 '가액배상' → 처분 당시 목적물의 (대가 또는) 시가 상당액과 처분으로 얻은 이익의 이득일부터의 법정이자를 가산한 금액 [2013다14675]", "해제"],
  ["030.④", "해제자가 계약 해제의 원인이 된 채무불이행에 관하여 그 원인의 일부를 제공하였다면, 신의칙 또는 공평의 원칙에 기하여 일반적으로 손해배상에 있어서의 과실상계에 준하여 계약의 해제로 인한 원상회복청구권의 내용이 제한될 수 있다.", false, "▸ [2013다34143]\n[AI해설] 해제로 인한 원상회복청구권은 과실상계 유추적용의 대상이 되지 않으므로, 채무불이행의 원인 일부 제공을 이유로 원상회복청구권 내용이 제한될 수 없다.", "해제"],
  ["031.①", "외관상 부수적 채무라도 그 불이행으로 인하여 채권자가 계약의 목적을 달성할 수 없는 경우라면 해제가 가능하다.", true, "▸ 부수적 채무의 불이행은 계약 목적 달성할 수 없거나 특약이 존재하는 경우를 제외하고는 해제 × ex. 분묘이장, 시사회, 전대차와 근저당권설정", "해제"],
  ["031.③", "채무불이행을 이유로 계약을 해제하거나 해지하고 손해배상을 청구하는 경우, 이행이익의 배상을 구하는 것이 원칙이다. 그러나 채권자는 그 대신에 계약이 이행되리라고 믿고 지출한 비용의 배상을 채무불이행으로 인한 손해라고 볼 수 있는 한도에서 청구할 수도 있다.", true, "▸ 채무불이행 이유로 계약해제와 아울러 손해배상 청구할 경우 계약이행으로 인하여 채권자가 얻을 이익(=이행이익)의 배상 구함이 원칙. 그러나 그에 갈음하여 그 계약이 이행되리라 믿고 채권자가 지출한 비용(=신뢰이익)의 배상 구할 수도 O → 신뢰이익 중 통상의 지출 비용은 통상손해, 초과하여 지출된 비용은 특별손해로 상대방이 알았거나 알 수 있었을 경우만 배상, 신뢰이익은 이행이익 범위 초과 × [2002다2539]", "해제"],
  ["031.⑤", "아파트 수분양자가 분양자로부터 열쇠를 교부받아 임차인을 입주케 하고 임차인이 주택임대차보호법상 대항력을 갖춘 후, 수분양자가 분양계약상 아파트 입주를 위하여 요구되는 의무를 다하지 못해 분양계약이 해제되어 수분양자가 주택의 소유권을 취득하지 못하였다고 하더라도, 임차인은 아파트 소유자인 분양자에 대하여 임차권으로 대항할 수 있다.", true, "▸ 주택의 소유자가 아니더라도 적법한 임대권한 있으면 주임법상의 임대차 O → 주택 인도 받은 미등기 매수인은 사용·수익할 수 있는 지위에서 적법하게 임대할 수 O → 이러한 매수인으로부터 해제 전에 주택 임차하고 인도·주민등록 마쳐 주임법 3조 1항 대항요건 갖춘 임차인은 548조 1항 단서 제3자 O → 매매계약 해제되어도 매도인에 대하여 임차권으로 대항 O [2007다38908] → 지문은 본 판례의 사실관계임", "해제"],
  ["032.①", "부동산매매계약에 따른 채무이행으로 이미 소유권이전등기가 경료된 후 그 매매계약이 합의해제되었다면, 합의해제에 따른 매도인의 원상회복청구권인 소유권이전등기 말소청구권은 소멸시효의 대상이다.", false, "▸ 부동산 매매계약의 합의해제로 소유권은 당연히 매도인에게 복귀, 매도인의 원상회복청구권인 물권적 청구권은 소유권에 기한 물권적 청구권으로서 소멸시효 × [80다2968]", "해제"],
  ["032.②", "합의해지의 효력은 그 합의의 내용에 의하여 결정되고 민법 제548조 제2항의 규정은 적용되지 아니하므로, 당사자 사이에 약정이 없는 이상 합의해지로 인하여 반환할 금전에 그 받은 날로부터의 이자를 가산하여야 할 의무가 있는 것은 아니다.", true, "▸ 합의해제는 법정해제와 달리 548조 2항 ×, 반환할 금전에 받은 날부터 이자 가산 × [95다16011] → 지문처럼 합의 '해지'라고 하여 달리 볼 것 아님", "해제"],
  ["032.④", "상속재산 분할협의가 합의해제된 경우에도 민법 제548조 제1항 단서의 규정에 따라 제3자의 권리를 해하지 못한다.", true, "▸ 상속재산 분할협의가 합의해제 되면 분할협의의 이행으로 변동된 물권은 당연히 분할협의의 없었던 원상태로 복귀하나, 548조 1항 단서 규정상 이 합의해제를 가지고 해제 전 분할협의 의로부터 생긴 법률효과를 기초로 새로운 이해관계 가져 등기·인도 등 완전한 권리 취득한 제3자의 권리 해하지 못함 [2002다73203]", "해제"],
  ["033.①", "해제계약이 행해진 경우 해제된 계약의 목적물에 관하여 그 전에 물권이나 대항력 있는 권리를 취득한 제3자는 해제의 소급효로부터 보호된다.", true, "▸ 계약의 합의해제에 있어서도 548조 1항 단서 제3자의 권리 해할 수 없으나 완전한 권리 취득해야 [79다932]", "해제"],
  ["033.⑤", "채무불이행을 이유로 채권자가 계약해제권을 행사하는 경우 그는 이와 더불어 이행이익의 배상은 청구할 수 있지만, 신뢰이익의 배상을 청구할 수는 없다.", false, "▸ 채무불이행 이유로 계약해제와 아울러 손해배상 청구할 경우 계약이행으로 인하여 채권자가 얻을 이익(=이행이익)의 배상 구함이 원칙. 그러나 그에 갈음하여 그 계약이 이행되리라 믿고 채권자가 지출한 비용(=신뢰이익)의 배상 구할 수도 O → 신뢰이익 중 통상의 지출 비용은 통상손해, 초과하여 지출된 비용은 특별손해로 상대방이 알았거나 알 수 있었을 경우만 배상, 신뢰이익은 이행이익 범위 초과 × [2002다2539]", "해제"],
  ["034.①", "합의해제가 행해진 경우에도 그로 인한 원상회복 등기가 행해지기 전에 해당 물건에 관하여 대항력 있는 권리를 취득한 선의의 제3자는 해제의 소급효로부터 보호된다.", true, "▸ 합의해제 '후'에 원상회복등기 이뤄지기 '전' 양립되지 않은 법률관계를 가진 '선의'의 제3자 보호 O, 제3자의 악의는 계약해제 주장자가 입증책임 [2005다6341]", "해제"],
  ["035.④", "부동산매수인의 채권자가 매수인 명의로 소유권이전등기가 된 부동산을 가압류한 후 부동산매매계약이 해제된 경우, 그 가압류채권자는 민법 제548조 제1항 단서의 제3자에 해당한다.", true, "▸ 부동산 가압류를 한 가압류채권자도 548조 1항 단서 제3자 O [99다40937]", "해제"],
  ["036.①", "매도인 甲과 매수인 乙 사이에 체결된 X토지의 매매계약의 해제에 관한 설명.§X토지가 토지거래허가구역으로 지정된 구역안의 토지인 경우, 위 매매계약이 체결된 후 계약금만 수수한 상태에서 당사자가 토지거래허가신청을 하여 관할관청으로부터 그 허가를 받았더라도 甲은 계약금의 배액을 상환하여 매매계약을 해제할 수 있다.", true, "▸ [2008다62427]\n[AI해설] 토지거래허가를 받은 경우라도 계약금만 수수한 단계에서는 아직 이행에 착수한 것이 아니므로, 매도인은 계약금의 배액을 상환하여 매매계약을 해제할 수 있다.", "해제"],
  ["036.⑤", "매도인 甲과 매수인 乙 사이에 체결된 X토지의 매매계약의 해제에 관한 설명.§甲이 소유권이전등기를 해주지 않은 상태에서 乙에게 X토지의 사용을 승낙하여 乙이 그 지상에 Y건물을 신축한 후 이를 丙에게 매도하고 그 후 甲이 乙로부터 매매대금을 지급받지 못하여 X토지에 대한 매매계약을 해제한 경우, 丙은 위 계약해제로부터 보호받을 수 있는 제3자에 해당하지 않는다.", true, "▸ [90다카16761] → 다만 甲이 토지 사용을 승낙한 이상 丙은 신의칙에 의해 보호될 여지는 있음", "해제"],
  ["037.③", "계약이 합의해제된 경우, 별도의 약정이 없는 한 합의해제로 인하여 반환해야 할 금전에 법정이자를 가산해야 하는 것은 아니다.", true, "▸ 합의해제에서는 합의의 내용에 의해 결정되고 여기에는 해제에 관한 548조 2항 적용 ×, 약정이 없는 이상 반환할 금전에 이자 가산 × [95다16011]", "해제"],
  ["038.③", "甲과 乙이 甲 소유 X토지에 대하여 매매계약을 체결하였으나 그 매매계약을 합의해제하는 경우에 관한 설명 중 옳은 것은?§매매계약이 합의해제 되었더라도 특별한 사정이 없는 한 甲 또는 乙은 상대방에 대하여 채무불이행을 원인으로 한 손해배상을 청구할 수 있다.", false, "▸ 합의해제 시에는 채무불이행으로 인한 손해배상 청구 × [86다카1147] → 551조 ×", "해제"],
  // 증여,
  ["SS3.②", "증여계약에 따라 이미 이행된 부분은, 설령 수증자의 망은(忘恩)행위가 있더라도 원칙적으로 해제할 수 없다.", true, "제558조(해제와 이행완료부분) 전3조의 규정에 의한 계약의 해제는 이미 이행한 부분에 대하여는 영향을 미치지 아니한다.", "증여"],
  ["SS3.③", "자녀가 없는 고령의 A가 조카 B에게 자신을 부양해 줄 것을 대가로 토지를 증여하고 소유권이전등기를 해주었는데, B가 위 부양의무를 불이행한 경우, A는 B의 채무불이행을 이유로 증여계약을 해제하고 B에게 준 토지를 다시 반환받을 수 있다.", true, "▸ 556조 1항 2호의 '부양의무'는 제974조 직계혈족·그 배우자·생계 같이 하는 친족 간의 부양의무 가리킴 → 친족 아닌 당사자 사이 약정 부양의무는 × → 556조 2항 제척기간 적용 ×, 558조 이행완료 무영향 적용 × → 원상회복 O [95다43358]\n제556조(수증자의 행위와 증여의 해제) ①수증자가 증여자에 대하여 다음 각호의 사유가 있는 때에는 증여자는 그 증여를 해제할 수 있다. 1. 증여자 또는 그 배우자나 직계혈족에 대한 범죄행위가 있는 때 2. 증여자에 대하여 부양의무있는 경우에 이를 이행하지 아니하는 때 ② 전항의 해제권은 해제원인있음을 안 날로부터 6월을 경과하거나 증여자가 수증자에 대하여 용서의 의사를 표시한 때에는 소멸한다.", "증여"],
  ["SS3.④", "부담부증여에서 증여자의 증여 이행이 완료되지 않은 경우, 수증자가 부담의 이행을 완료하였더라도, 각 당사자는 원칙적으로 서면에 의하지 않은 증여임을 이유로 증여계약을 임의로 해제할 수 있다.", false, "▸ 561조는 부담부증여에 '본절 규정 외에' 쌍무계약 규정 적용 → 부담부증여도 비서면이라면 각 당사자 555조 해제 O → 그러나 증여자가 증여 미이행이더라도 수증자가 부담 이행 완료했다면, 실질적으로 부담 없는 증여라는 등 특별한 사정 없는 한, 각 당사자는 비서면 해제 × ∵ 부담부증여는 쌍무계약 준용되고(561조) 부담 한도 담보책임 등 부담 없는 증여와 구별, 555조 비서면 해제에 적용되는 558조 '이미 이행한 부분'에 이행한 부담도 포함되므로 부담 이행했는데 555조로 해제하면 증여자가 부담 이행 이익만 보유하여 부당 [2021다299976]", "증여"],
  ["SS3.⑤", "증여계약 후 아직 계약에 따른 이행이 완료되기 전에 수증자의 증여자에 대한 범죄행위가 있고, 그 범죄행위가 수증자와 증여자 사이의 신뢰관계를 중대하게 침해하여 수증자에게 증여의 효과를 그대로 유지함이 사회통념상 허용되지 않을 정도라면, 설령 수증자가 아직 형사처벌을 받지 않았더라도 증여자는 증여계약을 해제할 수 있다.", true, "▸ 윤리적 요청을 고려한 556조 1항 1호의 '범죄행위'는 수증자가 감사의 마음을 가져야 함에도 증여자가 배은망덕하다고 느낄 정도로 둘 사이 신뢰관계 중대하게 침해하여 증여 효과 유지함이 사회통념상 허용되지 않을 정도의 범죄 의미 → 범죄행위의 동기·경위, 피해 정도, 침해 법익 유형, 친밀도 등 종합적 고려해야 → 범죄행위로 수증자가 반드시 형사처벌 받을 필요는 × [2017다207475] → 다만 사안은 무죄판결 확정된 경우로서 종합적 고려 결과 '범죄행위 해제' ×", "증여"],
  ["039.ㄱ", "서면에 의한 증여란, 증여의사가 문서를 통하여 확실히 알 수 있는 정도로 서면에 나타낸 증여를 말하는 것이므로 그 서면에 증여의사가 표시되었다고 하더라도 서면의 형식이 매매계약서로 작성되어 있다면 민법 제555조에서 말하는 서면에 해당하지 않는다.", false, "▸ 서면 자체는 매매계약서·매도증서로 되어 있더라도 증여의사 표시한 것이면 555조의 '서면' O [91다6160]", "증여"],
  ["039.ㄷ", "증여계약 후 증여자의 재산상태가 현저히 변경되고 그 이행으로 인하여 생계에 중대한 영향을 미칠 경우에는 증여자는 증여계약을 해제할 수 있는데, 이미 이행한 부분에 대하여는 영향이 없다.", true, "제557조(증여자의 재산상태변경과 증여의 해제) 증여계약 후에 증여자의 재산상태가 현저히 변경되고 그 이행으로 인하여 생계에 중대한 영향을 미칠 경우에는 증여자는 증여를 해제할 수 있다.\n제558조(해제와 이행완료부분) 전3조의 규정에 의한 계약의 해제는 이미 이행한 부분에 대하여는 영향을 미치지 아니한다.", "증여"],
  ["039.ㄹ", "정기의 급여를 목적으로 한 증여는 증여자가 사망하면 비록 기간이 남아 있다고 하더라도 그 효력을 잃는다.", true, "제560조(정기증여와 사망으로 인한 실효) 정기의 급여를 목적으로 한 증여는 증여자 또는 수증자의 사망으로 인하여 그 효력을 잃는다.", "증여"],
  ["039.ㅁ", "약정에 따라 부양의무를 부담하는 증여계약에서 수증자가 부양의무를 이행하지 않은 경우 그 해제권은 해제원인 있음을 안 날로부터 6월이 경과하면 소멸한다.", false, "▸ 556조 1항 2호의 '부양의무'는 974조 직계혈족, 그 배우자, 생계 같이 하는 친족 간의 부양의무 가리킴 → 친족 아닌 당사자 사이 약정 부양의무는 × → 556조 2항 제척기간 적용 ×, 558조 이행완료 무영향 적용 × → 원상회복 O [95다43358]\n▸ 위 판례에 따르면 '약정'에 의한 부양의무 불이행은 556조 1항 2호의 부양의무에 해당하지 않으므로, 결국 이 경우는 6월의 제척기간도 적용될 수 없음", "증여"],
  ["040.①", "서면에 의하지 아니한 증여에서의 해제는 일종의 특수한 철회일 뿐 본래 의미의 계약해제와는 다르다고 할 것이어서 형성권에 관한 제척기간의 적용을 받지 않는다.", true, "▸ 555조 해제는 형성권 제척기간 적용 없음 × ∵ 특수한 철회 O, 본래 의미의 해제 × [2003다1755]", "증여"],
  ["040.⑤", "생전처분으로 재단법인을 설립하는 경우 서면에 의한 증여(출연)이더라도 민법 총칙규정에 따라 출연자가 착오에 기한 의사표시라는 이유로 출연의 의사표시를 취소할 수 있다.", true, "▸ ∵ 555조의 비서면 해제는 착오 취소와 요건·효과 다름 [98다9045]", "증여"],
  ["041.③", "증여자 甲이 서면에 의하지 않고 생전에 X 토지를 乙에게 증여하고 그 소유권이전등기에 필요한 서류를 모두 제공하였지만 乙 명의의 소유권이전등기가 甲의 사망 이후에 마쳐졌다면, 甲의 상속인은 서면에 의하지 아니한 증여라는 이유로 증여계약을 해제하고 소유권이전등기의 말소를 청구할 수 있다.", false, "▸ 증여자가 생전에 증여의사로 소유권이전등기 필요 서류 제공했다면 증여자 사망 후에 등기 경료되었더라도 증여자의 상속인이 비서면 증여라는 이유로 증여계약 해제해도 영향 무 ∵ 증여자 의사에 따른 증여 이행 O [2001다29643]", "증여"],
  // 매매일반효력,
  ["042.①", "甲은 2022. 1. 10. X 토지를 乙에게 1억 원에 매도하는 계약을 체결하였는데, 乙은 계약 당일 계약금 1,000만 원을, 2022. 3. 10. 중도금 4,000만 원을 지급하기로 하고, 2022. 5. 10. 잔금 5,000만 원을 지급하면서 甲으로부터 소유권이전등기에 필요한 서류를 교부받기로 하였다.§매매계약의 성립 당시 X 토지가 甲의 소유가 아니라면 매매계약은 무효이므로 甲은 乙에게 X 토지의 소유권을 이전해 주어야 할 의무를 지지 않는다.", false, "제569조(타인의 권리의 매매) 매매의 목적이 된 권리가 타인에게 속한 경우에는 매도인은 그 권리를 취득하여 매수인에게 이전하여야 한다.", "매매일반효력"],
  ["042.③", "甲은 2022. 1. 10. X 토지를 乙에게 1억 원에 매도하는 계약을 체결하였는데, 乙은 계약 당일 계약금 1,000만 원을, 2022. 3. 10. 중도금 4,000만 원을 지급하기로 하고, 2022. 5. 10. 잔금 5,000만 원을 지급하면서 甲으로부터 소유권이전등기에 필요한 서류를 교부받기로 하였다.§매매계약의 성립 후 X 토지가 1억 5천만 원에 수용된 경우, 乙은 1억 원 한도에서 甲에게 대상청구권을 행사하여 토지수용보상금의 지급을 구할 수 있다.", false, "▸ 대상청구권의 행사 범위에 관하여 1) 제한설, 2) 무제한설[통판] → 매매 목적물이 화재 소실되어 매도인이 받는 화재보험금·화재공제금 '전부'에 대하여 매수인은 대상청구권 O, 이행불능 당시 매수인이 지급했거나 지급하기로 약정한 '매매대금' 상당액 한도 내로 범위 제한 × [2013다7769] → 설문은 1.5억 전액에 대상청구권 O", "매매일반효력"],
  ["042.④", "甲은 2022. 1. 10. X 토지를 乙에게 1억 원에 매도하는 계약을 체결하였는데, 乙은 계약 당일 계약금 1,000만 원을, 2022. 3. 10. 중도금 4,000만 원을 지급하기로 하고, 2022. 5. 10. 잔금 5,000만 원을 지급하면서 甲으로부터 소유권이전등기에 필요한 서류를 교부받기로 하였다.§X 토지가「부동산 거래신고 등에 관한 법률」상 토지거래허가구역 내에 있고 그 계약에 관해 토지거래허가를 받지 못한 경우, 乙이 2022. 3. 10.까지 중도금을 지급하지 아니하였더라도 甲은 채무불이행을 이유로 매매계약을 해제할 수 없다.", true, "▸ 토지거래허가 전의 토지거래 유동적 무효 → 채무불이행 ×, 그로 인한 손해배상 ×, 해제 × [93다25875]", "매매일반효력"],
  ["042.⑤", "甲은 2022. 1. 10. X 토지를 乙에게 1억 원에 매도하는 계약을 체결하였는데, 乙은 계약 당일 계약금 1,000만 원을, 2022. 3. 10. 중도금 4,000만 원을 지급하기로 하고, 2022. 5. 10. 잔금 5,000만 원을 지급하면서 甲으로부터 소유권이전등기에 필요한 서류를 교부받기로 하였다.§계약체결 당일 乙이 계약금의 일부인 200만 원만을 지급하고 이를 후 나머지 800만 원을 지급하기로 하였다면, 2022. 1. 11. 甲은 수령한 금액의 배액인 400만 원을 지급하면서 계약을 해제할 수 있다.", false, "▸ 계약금 일부만 지급된 경우 매도인의 주장과 같이 수령자가 매매계약을 해제할 수 있다고 하더라도 그 해약금의 기준 금원은 '실제 교부받은 계약금'이 아니라 '약정 계약금'이라고 보아야 ∵ 당사자의 계약금 금액 결정 의사 反, 교부된 금액이 소액이면 계약 구속력 약화 [2014다231378]", "매매일반효력"],
  ["043.③", "매매예약의 완결권은 일종의 형성권으로서 당사자 사이에 행사기간을 약정한 때에는 그 기간 내에, 약정이 없는 때에는 예약이 성립한 때부터 10년 내에 이를 행사하여야 하고, 그 기간이 지난 때에는 예약완결권은 제척기간의 경과로 소멸한다.", true, "▸ 계약에서 기간을 정하지 않은 경우는 예약 성립시로부터 10년의 제척기간, 그 행사 시기를 따로 정하거나 목적물을 인도받은 경우에도 '예약성립일'로부터 10년 [96다47494]", "매매일반효력"],
  ["044.①", "甲은 자신이 소유하는 X 토지에 대해서 乙과 매매계약을 체결하면서 乙이 甲에게 계약금으로 1억 원을 지급하기로 합의하였다.§乙이 아직 계약금을 지급하지도 않았다면 甲과 乙은 매매계약을 임의로 해제할 수 있다.", false, "▸ 계약성립 후 일방이 임의로 해제 ×, 다만 주된 계약과 더불어 계약금계약을 한 경우 565조 1항 임의 해제 O → 계약금계약은 금전 기타 유가물 교부 요요건으로 → 단지 '계약금 지급하기로 약정만 한 단계'에서는 아직 계약금 효력 ×, 565조 해제 권리 × [2007다73611]", "매매일반효력"],
  ["044.②", "甲은 자신이 소유하는 X 토지에 대해서 乙과 매매계약을 체결하면서 乙이 甲에게 계약금으로 1억 원을 지급하기로 합의하였다.§乙이 甲에게 계약금지급의무를 이행하지 않는 경우, 甲은 계약금의 지급을 최고하고 상당한 기간이 경과하면 계약금계약을 해제할 수 있다.", false, "▸ 당사자가 계약금 일부만 지급하고 잔액은 나중에 지급하기로 약정한 경우, 나머지 계약금 잔금을 지급하지 않으면 상대방은 계약금 지급의무 이행청구 O, 채무불이행 이유로 계약금약정 해제 O(만일 계약금약정 없었다면 주계약 체결하지 않았을 사정 있으면 주계약도 해제 O) → 그러나 계약금 잔금을 지급하지 않는 한 계약금계약 성립 ×, 임의로 주계약 해제 × [2007다73611]", "매매일반효력"],
  ["044.③", "甲은 자신이 소유하는 X 토지에 대해서 乙과 매매계약을 체결하면서 乙이 甲에게 계약금으로 1억 원을 지급하기로 합의하였다.§乙이 甲에게 계약금의 일부만을 지급한 경우에 甲은 실제 지급받은 계약금의 배액을 상환하여도 매매계약을 해제할 수는 없다.", true, "▸ 계약금 일부만 지급된 경우 매도인의 주장과 같이 수령자가 매매계약을 해제할 수 있다고 하더라도 그 해약금의 기준 금원은 '실제 교부받은 계약금'이 아니라 '약정 계약금'이라고 보아야 ∵ 당사자의 계약금 금액 결정 의사 反, 교부된 금액이 소액이면 계약 구속력 약화 [2014다231378]", "매매일반효력"],
  ["044.④", "甲은 자신이 소유하는 X 토지에 대해서 乙과 매매계약을 체결하면서 乙이 甲에게 계약금으로 1억 원을 지급하기로 합의하였다.§甲과 乙이 계약금 상당액을 위약금으로 약정하였다면, 계약금계약이 성립하지 않았더라도 甲의 채무불이행에 의해서 매매계약이 해제되는 경우에 甲은 乙에게 1억 원을 지급하여야 한다.", true, "▸ 계약금 상당액을 위약금(손해배상액 예정)으로 약정했다면 계약금계약의 불성립으로 인하여 해약금해제가 불가능한 경우라 해도 그와 별개인 손해배상액 예정까지 불성립하는 것은 아니므로, 당사자는 채무불이행을 한 상대방에 대하여 계약금 상당액을 손해배상액 예정으로 요구할 수 있음\n위 [2014다231378] 판결에서 대법원은 제1, 2심이 '계약금계약과 손해배상액 예정은 법적 성격이 다르므로 당사자가 손해배상액을 계약금 상당액으로 예정했다면 설령 계약금계약이 불성립했다고 하더라도 손해배상액 예정까지 불성립하는 것은 아니라고 판단'한 것을 옳다고 인정함", "매매일반효력"],
  ["044.⑤", "甲은 자신이 소유하는 X 토지에 대해서 乙과 매매계약을 체결하면서 乙이 甲에게 계약금으로 1억 원을 지급하기로 합의하였다.§乙이 계약금 1억 원을 지급한 경우에 특별한 사정이 없다면 이행기 전에 이행에 착수하더라도 甲과 乙은 더 이상 계약금의 배액을 지급하거나 계약금을 포기하고 계약을 해제할 수 없다.", true, "▸ 이행기 전 착수 금지 특약 없는 이상, 이행기 전 이행에 착수 O → 이행기 전 이행 착수 있어도 해약금해제 × [2004다11599]", "매매일반효력"],
  ["045.①", "계약금을 수수하면서 '교부자가 채무불이행시 수령자는 계약금을 몰수하고 수령자가 채무불이행시 교부자에게 배액상환'이라는 위약금 약정이 있는 경우, 해약금 해제를 할 수 없다.", false, "▸ 매매당사자 사이 수수된 계약금에 대하여 매수인이 위약시 몰취하고, 매도인이 위약시 배액상환하는 '약정' 있는 경우 그 계약금은 398조 손해배상액의 예정의 성질뿐 아니라 565조 해약금의 성질도 겸유한 것 [91다2151]", "매매일반효력"],
  ["045.③", "계약금이 교부되고 계약당사자 일방이 이행에 착수한 경우, 계약당사자는 해약금 해제를 하지 못하는데, 이때 이행의 착수는 단순히 이행의 준비만으로는 부족하나 반드시 계약 내용에 들어맞는 이행제공의 정도까지 이르러야 하는 것은 아니다.", true, "▸ '이행의 착수'는 객관적으로 외부에서 인식할 수 있는 정도로 채무의 이행행위의 일부를 하거나 이행을 위해 필요한 전제행위를 하는 경우 O. 단순히 이행의 준비만으로는 부족, 계약 내용에 들어맞는 이행제공의 정도까지 이를 필요는 × [2007다72274] → 기존 로민정 서술 '이행에 필요한 전제행위'도 포함되는 점으로 판단", "매매일반효력"],
  ["045.④", "중도금 일부 지급에 갈음하여 매도인에게 제3자에 대한 대여금채권을 양도하기로 약정하고 그 자리에 제3자가 참석하였다고 하더라도 이행의 착수가 있었다고 볼 수 없다.", false, "▸ 중도금 일부의 지급에 갈음하여 제3자에 대한 채권 양도하기로 약정하고 당시 제3자도 참석하여 통지도 이뤄졌다면 매수인 이행 착수 O [2005다39594]", "매매일반효력"],
  ["045.⑤", "해약금 해제에 있어서도 이를 이유로 한 손해배상청구가 가능하다.", false, "제565조(해약금)\n② 제551조의 규정은 전항의 경우에 이를 적용하지 아니한다.", "매매일반효력"],
  ["046.⑤", "甲 소유의 X 토지에 관하여 2012. 1. 1. 乙과 매매에 대한 일방예약이 체결되었다.§예약완결권이 가등기된 상태에서 乙에서 丁으로 양도되고, 丁명의로 가등기이전의 부기등기가 경료된 뒤 예약완결권이 소멸되면, 甲의 가등기말소는 丁을 상대로 청구하여야 한다.", true, "▸ [AI해설] 예약완결권이 양도되어 부기등기가 경료되면 이전된 권리에 기한 가등기의 말소 역시 현재의 가등기 권리자인 丁을 상대로 청구해야 한다.", "매매일반효력"],
  ["047.③", "매매계약이 있은 후에도 인도하지 않은 목적물로부터 발생한 과실은 특별한 사정이 없는 한 매도인에게 속하지만, 목적물을 인도하기 전에 매수인이 매매대금을 완납한 경우에는 그 이후의 과실수취권은 매수인에게 귀속된다.", true, "▸ [2004다8210]\n[AI해설] 매매계약 후 미인도 목적물의 과실은 원칙적으로 매도인에게 귀속되나(587조), 매수인이 대금을 완납한 경우에는 그 이후의 과실수취권은 매수인에게 귀속된다.", "매매일반효력"],
  ["048.①", "매매의 당사자 일방이 계약 당시에 금전 기타 물건을 계약금으로 상대방에게 교부한 때에는 당사자 간에 다른 약정이 없는 한 당사자의 일방이 이행에 착수할 때까지 교부자는 이를 포기하고 수령자는 그 배액을 상환하여 매매계약을 해제할 수 있다.", true, "제565조(해약금) ① 매매의 당사자 일방이 계약당시에 금전 기타 물건을 계약금, 보증금등의 명목으로 상대방에게 교부한 때에는 당사자간에 다른 약정이 없는 한 당사자의 일방이 이행에 착수할 때까지 교부자는 이를 포기하고 수령자는 그 배액을 상환하여 매매계약을 해제할 수 있다. ② 제551조의 규정은 전항의 경우에 이를 적용하지 아니한다.", "매매일반효력"],
  ["048.⑤", "매매계약 체결 후 시가 상승이 예상되자 매도인이 증액 요청을 하였고 매수인이 이에 확답하지 않은 상태에서 중도금을 이행기 전에 제공한 경우, 매도인은 계약을 해제할 수 없다.", true, "▸ 이행기 전 착수 금지 특약 없는 이상, 이행기 전 이행에 착수 O → 이행기 전 이행 착수 있어도 해약금해제 × [2004다11599] ← 시가 상승 예상되자 매도인이 구두로 구체적 금액 제시 없이 매매대금 증액 요청하자 매수인이 확답하지 않은 채 이행기 전에 중도금 제공한 사안", "매매일반효력"],
  // 매도인의담보책임,
  ["049.⑤", "甲과 乙은 2016. 3. 1. 甲 소유의 X토지를 乙에게 매도하는 매매계약을 체결하면서, 매매대금은 5억 원으로 하고, 계약금 5,000만 원은 계약 당일 지급하며, 중도금 2억 원은 2016. 4. 30.까지, 잔대금 2억 5,000만 원은 2016. 6. 30. 소유권이전등기서류교부와 동시에 지급하기로 약정하였다. 그런데 乙이 계약 당일지급한 계약금은 1,000만 원 뿐이었고, 위약금에 대한 별도의 약정은 없었다.§甲이 매매계약의 이행에 착수한 바가 없더라도 乙이 중도금을 지급한 후라면 乙은 해약금(민법 제565조)에 의하여 매매계약을 해제할 수 없다.", true, "▸ '일방'은 상대방에만 국한되지 × → 매수인이 중도금 지급한 이후는 매도인뿐 아니라 매수인도 해약금해제 × [99다62074]", "매도인의담보책임"],
  ["050.ㄱ", "乙이 甲으로부터 A 소유 X 건물을 매수하기 위하여 매매계약을 체결하였다. X 건물이 甲의 소유가 아니라는 점을 알지 못한 乙은 타인 권리의 매매를 이유로 甲에게 담보책임에 따른 손해배상을 청구하였다.§乙이 X 건물의 소유권이 甲에게 속하지 아니함을 알지 못한 것이 乙의 과실에 의한 경우, 법원은 甲이 배상할 손해액을 산정할 때 이를 참작하여야 한다.", true, "▸ 타인 물건 매매에서 매수인이 물건의 소유권이 매도인에게 속하지 않음을 알지 못한 것에 과실에 기인하면 매도인의 배상액 산정에 참작해야 [71다218]\n→ 위 판결은 23년도에도 출제되었고, 하자담보책임이 무과실책임이더라도 공평의 원칙상 하자 발생·확대에 가공한 매수인의 잘못을 참작해야 한다는 94다23920 판결과도 궤를 같이 하므로 일단 익혀둬야 하나, 私見으로는 위 판결이 70년대 판례로서 이론적 정합성이 부족하다고 생각됨(다행인 것이 ㄱ 지문은 정답결정력이 없었음). 즉, 매도인의 담보책임에서 손해는 '타인 권리를 이전해주지 못함'으로서 발생하는 것인데, 만약 매수인이 '타인 권리'이전 불능'이라는 결과에 기여한 과실이 있다고 하여 그러한 이전이 불가능하게 된 것에 기여를 인정하기는 어려울 것이기 때문임. 게다가 '타인 권리 매매'를 기본적으로 유효로 보는 우리 민법의 태도(제569조)에 비추어 더욱 그러함. 이는 '고의·과실(주의의무위반)'과 '악의·과실(알 수 있었음)'의 혼동에서 오는 문제로 보임(물론 때로는 '알 수 있었기' 때문에 '주의의무위반'이 인정되는 경우가 있으나, 이 경우는 그렇게 보기 어려움).", "매도인의담보책임"],
  ["050.ㄴ", "乙이 甲으로부터 A 소유 X 건물을 매수하기 위하여 매매계약을 체결하였다. X 건물이 甲의 소유가 아니라는 점을 알지 못한 乙은 타인 권리의 매매를 이유로 甲에게 담보책임에 따른 손해배상을 청구하였다.§甲 또한 X 건물이 자기 소유가 아니고 A 소유임을 알지 못한 상태에서 위 매매계약을 체결하고, 甲이 계약을 위반하면 계약금의 배액을 乙에게 배상하고 乙이 위약할 때에는 계약금의 반환을 구할 수 없다는 내용의 약정을 하였다면, 그 위약금 약정은 타인 권리의 매매로 인한 담보책임까지 예상하여 손해배상액을 예정한 것이라고 볼 수 없다.", false, "▸ 매도인 담보책임에서의 손해배상에 대해서도 배상액 예정 O [76다1699] → 매매당사자가 모두 타인 소유인 사실 모르고 계약한 사안", "매도인의담보책임"],
  ["050.ㄷ", "乙이 甲으로부터 A 소유 X 건물을 매수하기 위하여 매매계약을 체결하였다. X 건물이 甲의 소유가 아니라는 점을 알지 못한 乙은 타인 권리의 매매를 이유로 甲에게 담보책임에 따른 손해배상을 청구하였다.§甲이 X 건물의 소유권을 취득하여 乙에게 이전해야 할 의무가 甲의 귀책사유로 이행불능이 된 경우, 乙은 甲에 대하여 타인 권리의 매매로 인한 담보책임으로 손해배상을 청구할 수 있을 뿐만 아니라 일반적인 채무불이행으로서 계약을 해제하고 손해배상을 청구할 수 있다. 이때 위 담보책임으로 인한 손해배상의 범위는 이행불능 당시를 기준으로 한 이행이익 상당이다.", true, "▸ 타인 권리 매매에서 매도인의 권리이전의무가 매도인 귀책사유로 불능이었다면 (악의) 매수인이 매도인 담보책임으로 손해배상청구 못해도(570조 단서) 채무불이행 일반 규정(546조, 390조)으로 해제 O, 손해배상 O [93다37328]\n타인 권리 매매에서 권리이전할 수 없게 된 때 매도인은 선의의 매수인에게 불능 당시 시가를 표준으로 그 계약이 완전히 이행된 것과 동일한 경제적 이익을 배상할 의무 있음 [66다2618]", "매도인의담보책임"],
  ["050.ㄹ", "乙이 甲으로부터 A 소유 X 건물을 매수하기 위하여 매매계약을 체결하였다. X 건물이 甲의 소유가 아니라는 점을 알지 못한 乙은 타인 권리의 매매를 이유로 甲에게 담보책임에 따른 손해배상을 청구하였다.§甲이 乙에게 X 건물의 소유권을 이전할 수 없게 된 것이 오직 乙의 귀책사유에 의한 경우에도 甲은 타인 권리의 매매로 인한 담보책임을 부담한다.", false, "▸ 타인 권리의 이전불능이 오직 매수인의 귀책사유에 의한 경우는 매도인이 타인권리매매 담보책임 × [79다564]", "매도인의담보책임"],
  ["051.ㄱ", "매수인에게 즉시 목적물의 검사와 하자통지를 할 의무를 지우고 있는「상법」제69조의 규정은 매수인이 상인인 한 매도인이 상인인지 여부를 불문하고 적용된다.", false, "상법 제69조(매수인의 목적물의 검사와 하자통지의무) ① 상인간의 매매에 있어서 매수인이 목적물을 수령한 때에는 지체없이 이를 검사하여야 하며 하자 또는 수량의 부족을 발견한 경우에는 즉시 매도인에게 그 통지를 발송하지 아니하면 이로 인한 계약해제, 대금감액 또는 손해배상을 청구하지 못한다. 매매의 목적물에 즉시 발견할 수 없는 하자가 있는 경우에 매수인이 6월내에 이를 발견한 때에도 같다.\n▸ [상법] [93다7174]", "매도인의담보책임"],
  ["051.ㄴ", "매매목적물에 하자가 있는 경우, 매수인은 하자담보책임의 제척기간이 지났다고 하더라도 그러한 하자 있는 물건의 인도가 불완전이행에 해당하면 매도인에 대해 채무불이행에 따른 손해배상청구를 물을 수 있다.", true, "▸ 매매 목적물에 하자 있으면 매수인의 하자담보책임과 채무불이행책임은 별개 권원 경합적 인정 O → 하자 보수 비용이 하자담보책임·채무불이행책임에서의 '손해' → 폐기물처리 비용에 대해 매수인은 390조 채무불이행 혹은 580조 1항 하자담보책임으로 손해배상 청구 O [2017다202050]", "매도인의담보책임"],
  ["051.ㄷ", "상인간의 매매에서 매매의 목적물에 상인에게 통상 요구되는 객관적인 주의의무를 다하여도 즉시 발견할 수 없는 하자가 있는 경우에도 매수인은 6월 내에 그 하자를 발견하여 지체없이 이를 통지하지 아니하면 매수인은 과실의 유무를 불문하고 매도인에게 하자담보책임을 물을 수 없다.", true, "▸ [상법] [98다1584]", "매도인의담보책임"],
  ["051.ㄹ", "경락인이 강제경매절차를 통하여 부동산을 매수하였으나 강제경매의 집행권원이 된 약속어음공정증서가 위조된 것이어서 경매 부동산에 대한 소유권을 취득하지 못하게 된 경우, 경락인은 경매채권자에게「민법」제578조 제2항에 의한 담보책임을 물을 수 있다.", false, "▸ 578조 경매 담보책임은 매매와 마찬가지로 경매절차는 유효하게 이뤄졌으나 경매 목적 권리의 하자가 있는 경우 인정되는 것이고, 경매절차 자체가 무효인 경우는 담보책임 인정 여지 × [91다21640] ← 강제집행의 집행권원인 약속어음공정증서 위조로 무효인 경우", "매도인의담보책임"],
  ["052.⑤", "하자담보에 기한 손해배상청구권은 원칙적으로 10년의 소멸시효에 걸리고 매수인이 매매목적물을 인도받은 때부터 소멸시효가 진행한다.", true, "▸ 제척기간 규정 있어도 소멸시효 규정 배제 ×, 매매 토지 지하 폐기물 매립된 경우 582조 하자담보책임 '안 날 6개월' 제척기간 규정 있으나 인도받은 때로부터 10년 지나면 담보책임 손해배상청구권 소멸시효 완성(162조 1항) [2011다10266]", "매도인의담보책임"],
  ["053.④", "토지의 매매에 있어 목적물을 등기부상 평수에 따라 특정한 경우라도 당사자가 그 지정된 구획을 전체로서 평가하였고 평수에 의한 계산이 대상토지를 특정하고 그 대금을 결정하기 위한 방편에 불과하였다면, 그 매매는「민법」제574조에서 규정하는 '수량을 지정한 매매'라고 할 수 없다.", true, "▸ 574조 '수량지정 매매'는 당사자가 매매 목적물이 일정 수량을 가지는 것에 주안을 두고 대금도 그 수량 기준으로 결정해야. 토지 매매 목적물을 등기부 평수로 특정했어도 대상특정 및 대금 결정 방편인 경우 수량지정매매 × [92다56674]", "매도인의담보책임"],
  ["053.⑤", "매매목적물의 하자가 경미하여 수선 등의 방법으로도 계약의 목적을 달성하는 데 별다른 지장이 없는 반면 매도인에게 하자 없는 물건의 급부의무를 지우면 다른 구제방법에 비하여 지나치게 큰 불이익이 매도인에게 발생되는 경우에는 매수인의 완전물급부청구권 행사를 제한할 수 있다.", true, "▸ 하자담보의무 이행이 오히려 공평의 원칙 반하면 완전물급부청구권 × [2012다72582] → BMW 자동차 운행 5일 만에 계기판 속도계 작동 안 한 경우 간단한 수리 가능함에도 신차 교환 요구 ×", "매도인의담보책임"],
  ["054.④", "매매의 목적이 된 권리가 타인에게 속하여 매도인이 그 권리를 취득하여 매수인에게 이전할 수 없게 된 경우, 그 권리가 타인에게 속함을 알지 못한 매수인이 매도인에게 배상을 청구할 수 있는 손해에는 매수인이 얻을 수 있었던 이익의 상실은 포함되지 않는다.", false, "▸ 타인 권리 매매에서 권리이전할 수 없게 된 때 매도인은 선의의 매수인에게 불능 당시 시가를 표준으로 그 계약이 완전히 이행된 것과 동일한 경제적 이익을 배상할 의무 O [66다2618] → 타인권리 매매는 이행이익설", "매도인의담보책임"],
  ["055.⑤", "甲 소유의 X 토지를 무단 점유하고 있던 乙은 등기서류를 위조하여 X 토지에 관하여 자기 앞으로 소유권이전등기를 마쳤다. 乙은 2010. 10. 27. 자신이 X 토지의 소유자라고 거짓말하여 이에 속은 丙과 매매계약을 체결하고, 2010. 12. 27. 丙으로부터 매매대금 1억 원을 지급받은 다음 丙에게 X 토지에 관한 소유권이전등기를 마쳐주고 X 토지를 인도하였다. 뒤늦게 이와 같은 사실을 알게 된 甲은 2011. 9. 1. 丙을 상대로 X 토지에 관한 소유권이전등기의 말소를 구하는 소를 제기하여 2012. 3. 4. 승소판결을 받았고, 그 판결은 丙의 항소포기로 확정되었다.§甲이 2012. 4. 2. 丙을 상대로 2010. 12. 27.부터 X 토지의 인도 완료일까지 그 사용으로 얻은 부당이득의 반환을 구하는 소를 제기한 경우, 丙은 2012. 4. 2.부터 악의의 점유자로 본다.", false, "▸ 설문 자체에서 甲이 이미 丙을 상대로 소유권이전등기 말소를 구하는 소를 제기했으므로, 말소소송 제기일 2011. 9. 1. 무렵으로서 그 소장 부본 송달일부터 丙은 악의의 점유자로 간주되어야\n소유자는 점유자를 상대로 물건반환 및 권원 없는 사용이익 반환 구하면서 물건반환 인용될 것을 전제로 소송이 계속된 때 이후 기간 사용이익 반환 청구 O [2016다220044] → 197조 2항의 문언에 불구하고 소장 부본 송달일부터 악의로 간주\n제197조(점유의 태양) ② 선의의 점유자라도 본권에 관한 소에 패소한 때에는 그 소가 제기된 때로부터 악의의 점유자로 본다.", "매도인의담보책임"],
  ["SS4.ㄱ", "피담보채권이 변제된 저당권설정등기를 기초로 경매개시결정이 내려지면 해당 경매절차 자체가 무효이므로, 매수인은 경매목적물인 부동산의 소유권을 취득할 수 없고, 경매절차에서 배당받은 채권자에게 자신이 지급한 매각대금에 관하여 부당이득반환을 청구할 수 있다.", true, "▸ 임의경매 무효인 경우 경락인은 배당금 수령 채권자(=근저당권자)에 대하여 배당금의 부당이득반환청구 O [2006다24049]\n민집법 267조(매수인의 부동산 취득은 담보권 소멸로 영향받지 않는다)는 '경매개시 후' 담보권 소멸했음에도 경매 진행되어 매각된 경우에만 적용(예외적 공신력), 종래 판례 유지 O ∵ 유효한 담보권에 기해 일단 경매개시되면 국가에게 처분권, 애초 담보권 소멸했다면 경매개시 위법, 공신력 없는 등기제도와 조화 [2018다205209]", "매도인의담보책임"],
  ["SS4.ㄷ", "물상보증인이 제공한 담보물이 타인 소유로 밝혀져 물상보증인의 등기와 경매절차상 매수인의 등기가 모두 원인무효 등기로 말소된 경우, 위 매수인은 경매와 매도인의 담보책임에 관한「민법」제578조 제1항에 따라 채무자에게 담보책임을 물을 수 있다.", false, "▸ 578조 1항 '채무자'에는 임의경매에서 물상보증인도 포함 O → 경락인이 담보책임으로 해제권 행사하면 물상보증인은 경락인에 대하여 원상회복의무 부담 [87다카2641] → 물상보증인설(채무자가 아니라 물상보증인이 담보책임을 부담함)", "매도인의담보책임"],
  ["SS4.ㄹ", "경매목적물에 존재하는 법령상 규제나 제한은 원칙적으로 물건의 하자에 해당하므로 경매절차상 매수인은 이를 이유로 담보책임을 주장할 수 있다.", false, "제580조(매도인의 하자담보책임) ① 매매의 목적물에 하자가 있는 때에는 제575조제1항의 규정을 준용한다. 그러나 매수인이 하자있는 것을 알았거나 과실로 인하여 이를 알지 못한 때에는 그러하지 아니하다. ② 전항의 규정은 경매의 경우에 적용하지 아니한다.", "매도인의담보책임"],
  ["056.①", "매도인 甲과 매수인 乙은 甲 소유의 X토지에 관하여 매매계약을 체결하였다. 甲의 담보책임에 관한 설명으로 옳지 않은 것은?§X토지의 일부가 丙의 소유임을 乙이 알고 있었을 경우, 甲이 해당 부분을 丙으로부터 취득하여 乙에게 이전할 수 없더라도, 乙은 대금의 감액을 청구할 수 없다.", false, "제572조(권리의 일부가 타인에게 속한 경우와 매도인의 담보책임) ① 매매의 목적이 된 권리의 일부가 타인에게 속함으로 인하여 매도인이 그 권리를 취득하여 매수인에게 이전할 수 없는 때에는 매수인은 그 부분의 비율로 대금의 감액을 청구할 수 있다. ② 전항의 경우에 잔존한 부분만이면 매수인이 이를 매수하지 아니하였을 때에는 선의의 매수인은 계약전부를 해제할 수 있다.\n▸ 일부 타인권리 매매에서 대금감액청구권은 매수인의 선악 불문함", "매도인의담보책임"],
  ["056.②", "매도인 甲과 매수인 乙은 甲 소유의 X토지에 관하여 매매계약을 체결하였다. 甲의 담보책임에 관한 설명으로 옳지 않은 것은?§X토지의 일부가 丙의 소유여서 甲이 이를 乙에게 이전할 수 없는 경우, 乙이 잔존 토지만을 매수하지는 않았을 것으로 인정된다면 선의의 乙은 계약전부를 해제할 수 있다.", true, "▸ 위 572조 2항 해설 참조\n[AI해설] 572조 2항에 따라 잔존 부분만이면 매수하지 않았을 경우 선의 매수인은 계약 전부 해제 가능하므로 O", "매도인의담보책임"],
  ["056.③", "매도인 甲과 매수인 乙은 甲 소유의 X토지에 관하여 매매계약을 체결하였다. 甲의 담보책임에 관한 설명으로 옳지 않은 것은?§X토지의 면적이 1,000㎡임을 전제로 매매대금을 1억 원(1㎡ 당 10만 원)으로 하여 계약을 체결하였으나 실측 결과 900㎡인 경우, 선의인 乙은 대금의 감액 및 손해배상을 청구할 수 있다.", true, "▸ 부동산매매에서 실제면적이 계약면적에 미달할 경우, 수량지정매매에 해당할 때 한하여 574조, 572조 대금감액청구는 별론, 매매계약이 그 미달 부분만큼 일부 무효라며 부당이득반환청구 ×, 미달 부분 원시적 불능 이유로 535조 계약체결상 과실에 따른 책임 청구 × [99다47396]", "매도인의담보책임"],
  ["056.⑤", "매도인 甲과 매수인 乙은 甲 소유의 X토지에 관하여 매매계약을 체결하였다. 甲의 담보책임에 관한 설명으로 옳지 않은 것은?§乙이 X토지에 설정된 저당권의 피담보채무를 인수하는 것으로 매매대금 지급에 갈음하기로 甲과 약정한 경우, 그 저당권의 실행으로 인하여 乙이 X토지의 소유권을 취득할 수 없게 되더라도 乙은 계약을 해제할 수 없다.", false, "▸ 매수인이 매매목적물에 관한 근저당권 피담보채무의 인수로 매매대금 지급에 갈음하는 약정을 한 경우(=이행인수)에는 매수인이 매도인에 대하여 576조 1항 담보책임을 '면제' 해주었거나 '포기'한 것 O, 576조 담보책임 × [2002다11151]", "매도인의담보책임"],
  ["057.ㄴ", "甲이 乙에게 토지 2,000㎡를 3억 원에 매도하였는데, 그 중 300㎡가 제3자인 丙의 소유에 속하기 때문에 甲이 위 300㎡ 부분에 대한 소유권을 매수인에게 이전할 수 없는 경우, 乙은 위 300㎡ 부분이 丙의 소유인 사실을 알고 있었는지 여부와 관계없이 매매계약 전부를 해제할 수 있다.", false, "▸ 일부 타인권리 매매에서 '해제권'은 선의 매수인만 행사 가능(≠ 전부 타인권리 매매)\n제572조(권리의 일부가 타인에게 속한 경우와 매도인의 담보책임) ② 전항의 경우에 잔존한 부분만이면 매수인이 이를 매수하지 아니하였을 때에는 선의의 매수인은 계약전부를 해제할 수 있다.", "매도인의담보책임"],
  ["057.ㄷ", "매매목적물이 지상권·지역권·전세권·질권·유치권의 목적이 된 경우에 매수인은 그 사실에 대한 선의 여부를 묻지 않고 매도인에 대하여 담보책임을 물을 수 있다.", false, "제575조(제한물권 있는 경우와 매도인의 담보책임) ① 매매의 목적물이 지상권, 지역권, 전세권, 질권 또는 유치권의 목적이 된 경우에 매수인이 이를 알지 못한 때에는 이로 인하여 계약의 목적을 달성할 수 없는 경우에 한하여 매수인은 계약을 해제할 수 있다. 기타의 경우에는 손해배상만을 청구할 수 있다.", "매도인의담보책임"],
  ["058.②", "민법 제571조 제1항은 선의의 매도인이 매매의 목적인 권리의 전부를 이전할 수 없는 경우에 적용될 뿐 매매의 목적인 권리의 일부를 이전할 수 없는 경우에는 적용될 수 없고, 수 개의 권리를 일괄하여 매매의 목적으로 정하였으나 그 중 일부의 권리를 이전할 수 없는 경우에도 마찬가지이다.", true, "▸ 571조 선의 매도인 해제 특칙은 '전부' 타인권리 매매에만 적용 O, 일부 타인권리 매매에는 × [2002다33557]", "매도인의담보책임"],
  ["058.③", "매매계약을 체결함에 있어서 토지의 면적을 기초로 평당 가액에 면적을 곱하여 대금을 산정하였는데 그 토지의 일부가 매매계약 당시에 이미 도로부지로 편입되어 있었고 매수인이 그와 같은 사실을 알지 못한 채 매매계약을 체결한 것이라면, 매수인은 매도인에 대하여 그 토지 중 도로부지로 편입된 부분의 비율로 대금의 감액을 청구할 수 있다.", true, "▸ 매매계약 체결함에 토지 면적을 기초로 평수에 따라 대금 산정했는데 토지 일부가 매매계약 당시 이미 도로 부지로 편입되어 있다면 선의 매수인은 제574조에 따라 매도인에 대해 도로 부지 편입 부분의 비율로 대금감액청구 O [92다30580]", "매도인의담보책임"],
  ["059.①", "부동산을 매수하고 소유권이전등기까지 넘겨받았지만 진정한 소유자가 제기한 등기말소청구소송에서 매도인과 매수인 앞으로 된 소유권이전등기의 말소를 명한 판결이 확정됨으로써 매도인의 소유권이전의무가 이행불능된 경우, 그 손해배상액 산정의 기준시점은 위 판결이 선고된 때이다.", false, "▸ 원소유자가 매도인 상대로 제기한 소유권이전등기 말소등기소송이 매도인의 패소로 확정된 경우, 매도인의 선의의 매수인에 대한 담보책임의 손해배상액은 패소 확정시의 목적물 시가를 표준으로 산정 [80다3122]", "매도인의담보책임"],
  ["059.②", "타인의 물건 매매에 있어서, 매수인이 그 물건의 소유권이 매도인에게 속하지 아니함을 알지 못한 것이 매수인의 과실에 기인한 경우에는 매도인의 배상액을 산정함에 있어서 이를 참작하여야 한다.", true, "▸ 타인 물건 매매에서 매수인이 물건의 소유권이 매도인에게 속하지 않음을 알지 못한 것에 과실에 기인하면 매도인의 배상액 산정에 참작해야 [71다218]", "매도인의담보책임"],
  ["059.③", "매매의 목적물의 하자로 인한 담보책임에 있어서 그 하자의 존부는 매매계약 성립 시를 기준으로 판단한다.", true, "▸ 하자란 매매 목적물이 거래통념상 기대되는 객관적 성질·성능 결여하거나 당사자가 예정·보증한 성질 결여한 경우 → 매매 토지에 건축허가 받을 수 없는 법률적 제한·장애는 매매목적물의 하자이며, 하자 존부는 매매계약 성립시를 기준으로 판단해야 [98다18506]", "매도인의담보책임"],
  ["060.ㄹ", "甲이 乙에게 하자담보책임을 근거로 완전물급부청구권을 행사하는 것은 공평의 원칙상 허용될 수 없다.", true, "▸ 하자담보의무 이행이 오히려 공평의 원칙 반하면 완전물급부청구권 × [2012다72582] → BMW 자동차 운행 5일 만에 계기판 속도계 작동 안 한 경우 간단한 수리 가능함에도 신차 교환 요구 ×", "매도인의담보책임"],
  ["061.③", "甲이 X부동산을 乙에게 매도하고 乙은 다시 이를 丙에게 전매한 뒤, 甲은 직접 丙 명의로 소유권이전등기를 경료하여 주었다. 이에 관한 다음 설명 중 옳지 않은 것은?§丙 명의로 소유권이전등기가 경료되기 전에 丁이 甲에 대한 피담보채권으로 X부동산에 유치권을 행사하여 계약의 목적을 달성할 수 없는 경우, 선의의 丙은 乙과의 계약을 해제하고 손해배상을 청구할 수 있다.", true, "▸ 575조 1항에 의해 매매 목적물에 유치권 있는 경우 선의 매수인은 계약 해제 및 손해배상 O\n[AI해설] 丙은 乙로부터 매수한 매수인이므로, 甲·丙 사이가 아닌 乙·丙 사이의 매매계약에서 담보책임을 묻는다. 유치권으로 계약 목적 달성 불가 → 선의 丙은 乙에게 575조 담보책임 O", "매도인의담보책임"],
  // 민법상임대차,
  ["062.②", "매도인의 하자담보책임에 기한 매수인의 손해배상청구권의 제척기간은 특별한 사정이 없는 한 소멸시효 규정의 적용을 배제하지 않는다.", true, "▸ 제척기간 규정 있어도 소멸시효 규정 배제 ×, 매매 토지 지하 폐기물 매립된 경우 582조 하자담보책임 '안 날 6개월' 제척기간 규정 있으나 인도받은 때로부터 10년 지나면 담보책임 손해배상청구권 소멸시효 완성(162조 1항) [2011다10266]", "민법상임대차"],
  ["063.ㄱ", "甲은 건물을 소유할 목적으로 乙 소유 X 토지에 관하여 乙과 임대차계약을 체결한 후, X 토지에 Y 건물을 신축하였다. 임대차계약이 종료된 후 Y 건물에 대한 매수청구권의 행사에 관한 설명 중 옳지 않은 것을 모두 고른 것은?§X 토지에 관한 임대차계약이 종료되기 전에 甲이 Y 건물을 미등기 무허가 상태로 A에게 매도하였다면, A가 乙의 동의를 얻어 X 토지의 임차인이 되었다고 하더라도 특별한 사정이 없는 한 A는 乙을 상대로 Y 건물에 대한 매수청구권을 행사할 수 없다.", false, "▸ 종전 임차인으로부터 미등기 무허가건물을 매수하여 점유하고 있는 '임차인'은 임대인에 대하여 지상물매수청구 O ∵ 지상물매수청구권 제도 취지상 행정관청 허가받은 적법한 건물 아니어도 O. 건물을 점유하는 미등기 매수인은 점유 중인 건물에 대하여 법률상·사실상 처분권 O [2013다48364]", "민법상임대차"],
  ["063.ㄴ", "甲은 건물을 소유할 목적으로 乙 소유 X 토지에 관하여 乙과 임대차계약을 체결한 후, X 토지에 Y 건물을 신축하였다. 임대차계약이 종료된 후 Y 건물에 대한 매수청구권의 행사에 관한 설명 중 옳지 않은 것을 모두 고른 것은?§설문과 달리 乙이 아닌, 乙로부터 X 토지의 관리를 위탁받은 B가 계약 당사자로서 甲과 임대차계약을 체결한 경우라고 하더라도, X 토지에 관한 임대차계약이 종료되기 전에 乙이 B로부터 임대인의 지위를 승계하였다면, 甲은 乙을 상대로 Y 건물에 대한 매수청구권을 행사할 수 있다.", true, "▸ 토지 소유자 아닌 제3자가 토지 임대행위 한 경우, 적법한 대리 혹은 무권대리 추인 있다면 토지 소유자가 지상물매수청구 상대방 O → 그러나 제3자가 당사자로서 토지 임대했다면 토지 소유자가 임대인 지위 승계하는 등의 특별한 사정이 없는 한 임대인이 아닌 토지 소유자에 대하여 지상물매수청구권 × ∵ 지상물매수청구권은 임차권 소멸 당시 토지소유권 가진 임대인을 상대로 행사해야 [2014다72449]\n→ 甲이 Y건물 소유권보존등기로 X토지 임대차에 대항력 발생했으므로 그 후 X토지 소유권을 취득한 丙은 임대인 지위를 승계하게 됨", "민법상임대차"],
  ["063.ㄷ", "甲은 건물을 소유할 목적으로 乙 소유 X 토지에 관하여 乙과 임대차계약을 체결한 후, X 토지에 Y 건물을 신축하였다. 임대차계약이 종료된 후 Y 건물에 대한 매수청구권의 행사에 관한 설명 중 옳지 않은 것을 모두 고른 것은?§甲이 乙을 상대로 제1심에서 Y 건물에 대한 매수청구권을 행사하였다가 乙의 동의를 얻어 철회한 후 항소심에서 다시 이를 행사하더라도 이는 허용된다.", true, "▸ [민소] 건물 매수청구권은 행사에 특정 방식 요하지 않아 재판 외에서 행사할 수도 있고, 행사 시기도 제한 없으므로, 임차인이 제1심에서 건물매수청구권을 행사했다가 철회한 후 항소심에서 다시 행사해도 허용 O [2001다42080]", "민법상임대차"],
  ["063.ㄹ", "甲은 건물을 소유할 목적으로 乙 소유 X 토지에 관하여 乙과 임대차계약을 체결한 후, X 토지에 Y 건물을 신축하였다. 임대차계약이 종료된 후 Y 건물에 대한 매수청구권의 행사에 관한 설명 중 옳지 않은 것을 모두 고른 것은?§甲의 乙을 상대로 한 매수청구 대상인 Y 건물의 매수 가격에 관하여 甲과 乙 사이에 의사 합치가 이루어지지 않았다면, 법원은 매수청구권 행사 당시 Y 건물 시가를 매매대금으로 하는 매매계약이 성립하였음을 인정할 수 있을 뿐, 인정된 시가를 임의로 증감하여 직권으로 매매대금을 정할 수 없다.", true, "▸ 지상물매수청구 대상 건물의 매수가격에 당사자 의사합치 없었다면 법원은 여러 사정 종합하여 매수청구권 행사 당시 건물 시가를 매매대금으로 매매계약 성립 인정할 수 있을 뿐, 법원이 해당 시가를 임의로 증감하여 직권으로 매매대금 결정 × ∵ 지상물매수청구권은 형성권, 행사로써 곧바로 행사 당시 시가를 대금으로 매매계약 체결된 것 같은 효과 발생하므로 [2023다309020]", "민법상임대차"],
  ["064.①", "건물 소유를 목적으로 하는 토지 임대차에서 임차인의 지상물매수청구권에 관한 설명 중 옳지 않은 것은?§종전 토지 임차인으로부터 미등기 무허가건물을 매수하여 점유하고 있는 현재의 토지 임차인은 소유자로서의 등기명의가 없더라도 특별한 사정이 없는 한 임대인에 대하여 지상물매수청구권을 행사할 수 있다.", true, "▸ 종전 임차인으로부터 미등기 무허가건물을 매수하여 점유하고 있는 '임차인'은 임대인에 대하여 지상물매수청구 O ∵ 지상물매수청구권 제도 취지상 행정관청 허가받은 적법한 건물 아니어도 O. 건물을 점유하는 미등기 매수인은 점유 중인 건물에 대하여 법률상·사실상 처분권 O [2013다48364]", "민법상임대차"],
  ["064.②", "건물 소유를 목적으로 하는 토지 임대차에서 임차인의 지상물매수청구권에 관한 설명 중 옳지 않은 것은?§토지 임차인의 지상물매수청구권은 임대차기간이 만료된 경우뿐만 아니라, 기간의 정함이 없는 임대차에서 임대인에 의한 해지통고에 의하여 그 임차권이 소멸된 경우에도 인정된다.", true, "▸ 기간 약정 없는 토지임대차에서 임대인 해지통고 했다면 임차인은 계약갱신을 청구할 필요 없이 곧바로 건물매수청구권 O [94다51178]", "민법상임대차"],
  ["064.③", "건물 소유를 목적으로 하는 토지 임대차에서 임차인의 지상물매수청구권에 관한 설명 중 옳지 않은 것은?§토지 소유자가 아닌 제3자가 임대차계약의 당사자로서 토지를 임대한 경우, 토지 소유자가 임대인의 지위를 승계하였다는 등의 특별한 사정이 없는 한, 임대인이 아닌 토지 소유자가 직접 지상물매수청구권의 상대방이 될 수는 없다.", true, "▸ 토지 소유자 아닌 제3자가 토지 임대행위 한 경우, 적법한 대리 혹은 무권대리 추인 있다면 토지 소유자가 지상물매수청구 상대방 O → 그러나 제3자가 당사자로서 토지 임대했다면 토지 소유자가 임대인 지위 승계하는 등의 특별한 사정이 없는 한 임대인이 아닌 토지 소유자에 대하여 지상물매수청구권 × ∵ 지상물매수청구권은 임차권 소멸 당시 토지소유권 가진 임대인을 상대로 행사해야 [2014다72449]", "민법상임대차"],
  ["064.④", "건물 소유를 목적으로 하는 토지 임대차에서 임차인의 지상물매수청구권에 관한 설명 중 옳지 않은 것은?§임차인 소유 건물이 임대차 대상 토지 외에 임차인 또는 제3자 소유의 토지 위에 걸쳐서 건립되어 있는 경우, 임차지에 서 있는 건물 부분 중 구분소유의 객체가 될 수 있는 부분에 한하여 임차인은 지상물매수청구를 할 수 있다.", true, "▸ 임차인 소유 건물이 임대 토지 외에 임차인·제3자 소유 토지 위에 걸쳐서 건립된 경우, 임차지 상 건물 중 구분소유 객체 될 수 있는 부분에 한하여 매수청구 허용 [93다42634] ∵ 임대인 매수 후에 철거의무·손해배상의무 생겨 강요할 수 없고, 면적비율로 공유하더라도 공유에 따른 제약", "민법상임대차"],
  ["065.ㄱ", "甲은 건물의 소유를 목적으로 乙 소유의 토지에 대한 임대차계약을 乙과 체결하였는데, 그 후 甲은 건물을 완성한 다음 이를 丙에게 임대하였다. 다음 설명 중 옳은 것을 모두 고른 것은?§丙이 甲의 동의를 얻어 기존의 출입문을 제거하고 유리출입문과 새시를 부속물로서 설치한 경우, 甲과 丙 사이의 건물임대차계약이 丙의 차임지급채무불이행으로 인하여 해지되었다면, 丙의 甲에 대한 부속물매수청구는 허용되지 않는다.", true, "▸ 임차인의 채무불이행으로 해지된 경우는 부속물매수청구 × [88다카7245]", "민법상임대차"],
  ["066.①", "건물의 소유를 목적으로 하는 토지임대차계약에 있어서 계약의 갱신 및 지상물매수청구권에 관한 설명으로 옳지 않은 것은?§토지임대차계약이 묵시의 갱신이 되는 경우, 전(前)임대차에 대하여 제3자가 제공한 담보는 기간의 만료로 인하여 소멸한다.", true, "제639조(묵시의 갱신) ① 임대차기간이 만료한 후 임차인이 임차물의 사용, 수익을 계속하는 경우에 임대인이 상당한 기간내에 이의를 하지 아니한 때에는 전임대차와 동일한 조건으로 다시 임대차한 것으로 본다. 그러나 당사자는 제635조의 규정에 의하여 해지의 통고를 할 수 있다. ② 전항의 경우에 전임대차에 대하여 제3자가 제공한 담보는 기간의 만료로 인하여 소멸한다.", "민법상임대차"],
  ["066.④", "건물의 소유를 목적으로 하는 토지임대차계약에 있어서 계약의 갱신 및 지상물매수청구권에 관한 설명으로 옳지 않은 것은?§임차인이 지상물매수청구권을 행사한 경우 임대인은 그 매수를 거절하지 못하고, 임차인의 지상물매수청구권 행사를 제한하는 약정으로서 임차인에게 불리한 것은 그 효력이 없다.", true, "제643조(임차인의 갱신청구권, 매수청구권) 건물 기타 공작물의 소유 또는 식목, 채엄, 목축을 목적으로 한 토지임대차의 기간이 만료한 경우에 건물, 수목 기타 지상시설이 현존한 때에는 제283조의 규정을 준용한다.\n제652조(강행규정) 제627조, 제628조, 제631조, 제635조, 제638조, 제640조, 제641조, 제643조 내지 제647조의 규정에 위반하는 약정으로 임차인이나 전차인에게 불리한 것은 그 효력이 없다.", "민법상임대차"],
  ["066.⑤", "건물의 소유를 목적으로 하는 토지임대차계약에 있어서 계약의 갱신 및 지상물매수청구권에 관한 설명으로 옳지 않은 것은?§토지임차인의 지상물매수청구권은 매수청구의 대상이 되는 건물에 근저당권이 설정되어 있는 경우에는 인정되지 않는다.", false, "▸ 643조 건물매수청구권의 매수가격은 여러 사정을 종합적 고려하여 청구권 행사 당시 건물 현존 상태로 평가된 시가 상당액 → 건물에 근저당권 설정된 경우도 채권최고액·피담보채무액 공제 ×, 다만 근저당권 말소 않는다면 토지소유자는 588조에 의해 말소될 때까지 채권최고액 상당 대금 지급 거절 O [2007다4356]", "민법상임대차"],
  ["067.ㄴ", "甲은 지상에 건물을 신축하기 위하여 2018. 4. 20. 乙로부터 乙 소유의 X 토지를 임대차기간 2018. 4. 20.부터 2021. 4. 19.까지, 임대차보증금 없이 차임 월 300만 원으로 정하여 임차하였다. 甲은 위 X 토지 위에 Y 건물을 지어 2019. 4. 1. Y 건물에 관하여 자신의 이름으로 소유권보존등기를 마쳤다.§만약 임대차계약 체결 후 乙이 사업자금이 필요하여 2020. 4. 1. 丙에게 X 토지를 매도하고 다음 날 X 토지에 관하여 丙 앞으로 소유권이전등기를 마쳤다면, 甲은 임대차기간 만료 후 丙이 甲에게 Y 건물을 철거하고 X 토지를 인도할 것을 요구하더라도 丙을 상대로 지상물매수청구권을 행사할 수 있다.", true, "▸ 643조 지상물매수청구권은 국민경제, 임차인보호의 취지로서 원칙적으로 임차권 소멸 당시 토지 소유권 가진 임대인을 상대로 O. 임대인이 제3자에게 토지 양도 등 토지 소유권 이전된 경우는 임대인 지위 승계되거나 임차인이 토지 소유자에게 임차권 대항할 수 있다면 새로운 토지 소유자 상대로 지상물매수청구권 O [2014다72449]\n→ 甲이 Y건물 소유권보존등기로 X토지 임대차에 대항력 발생했으므로 그 후 X토지 소유권을 취득한 丙은 임대인 지위를 승계하게 됨\n제622조(건물등기있는 차지권의 대항력) ① 건물의 소유를 목적으로 한 토지임대차는 이를 등기하지 아니한 경우에도 임차인이 그 지상건물을 등기한 때에는 제삼자에 대하여 임대차의 효력이 생긴다.", "민법상임대차"],
  ["067.ㄷ", "甲은 지상에 건물을 신축하기 위하여 2018. 4. 20. 乙로부터 乙 소유의 X 토지를 임대차기간 2018. 4. 20.부터 2021. 4. 19.까지, 임대차보증금 없이 차임 월 300만 원으로 정하여 임차하였다. 甲은 위 X 토지 위에 Y 건물을 지어 2019. 4. 1. Y 건물에 관하여 자신의 이름으로 소유권보존등기를 마쳤다.§만약 임대차기간 만료 전인 2020. 5. 1. 甲이 丁에게 Y 건물을 양도하고 다음 날 丁 앞으로 소유권이전등기를 마쳐주었는데 이에 관하여 乙로부터 별도의 동의를 받지 않았다면, 위 임대차기간 만료 후 乙이 Y 건물의 철거 및 X 토지 인도를 요구한 경우 丁은 원칙적으로 乙을 상대로 지상물매수청구권을 행사할 수 있다.", false, "▸ 건물 소유 목적 토지임차인이 건물에 저당권 설정하였다가 저당권 실행된 경우 358조에 의하여 경락인이 건물과 함께 토지 임차권도 취득 → 이 경우에도 629조 적용, 토지임대인에 대한 관계에서는 그의 동의가 없는 한 경락인은 임차권 취득을 대항 × → 622조 1항은 건물 소유 목적 토지임차인이 건물을 등기한 때 토지의 권리를 취득한 제3자에 대해 임대차 효력 주장하는 규정일 뿐, 임차인으로부터 건물 소유권과 함께 건물 소유 목적 토지임차권을 취득한 사람이 토지임대인에 대한 관계에서 동의 없는 임차권 양도를 대항 규정 × [92다24950, 95다29345]", "민법상임대차"],
  ["068.②", "건물소유를 목적으로 하는 토지임대차에서 지상건물 매수청구권에 관한 설명으로 옳은 것은?§매수청구의 대상이 되는 건물에 근저당권이 설정되어 있는 경우, 그 건물의 매수가격은 매수청구권 행사 당시 건물이 현존하는 대로의 상태에서 평가된 시가 상당액에서 근저당권의 채권최고액이나 피담보채무액을 공제한 금액이다.", false, "▸ 643조 건물매수청구권의 매수가격은 여러 사정을 종합적 고려하여 청구권 행사 당시 건물 현존 상태로 평가된 시가 상당액 → 건물에 근저당권 설정된 경우도 채권최고액·피담보채무액 공제 ×, 다만 근저당권 말소 않는다면 토지소유자는 588조에 의해 말소될 때까지 채권최고액 상당 대금 지급 거절 O [2007다4356]", "민법상임대차"],
  ["069.ㄱ", "토지의 임대인이 임차인에 대하여 토지인도 및 건물철거청구 소송을 제기하여 청구인용의 확정판결을 선고받았으나 건물철거를 집행하지 않은 경우, 임차인은 전 소에서 건물매수청구권을 행사하지 않았더라도 별소로 이를 행사하여 임대인에 대하여 건물 매매대금의 지급을 구할 수 있다.", true, "▸ [민소] 토지 임대인의 토지인도 및 건물철거청구 소송에서 임차인의 패소판결 확정된 이후에도, 그에 기해 건물철거 집행되지 아니한 이상, 임차인은 건물매수청구권 행사 O, 별소·반소로 임대인에 대하여 건물매매대금 지급청구 O [95다42195]", "민법상임대차"],
  ["070.③", "임차인이 임차목적물에 지출한 각종 유익비의 상환청구권을 미리 포기하기로 한 특약은 강행법규위반으로 효력이 발생하지 않는다.", false, "▸ 비용상환청구권은 임의규정이므로 포기특약 유효", "민법상임대차"],
  ["071.ㄴ", "임대인의 수선의무 면제특약에 면제되는 수선의무의 범위를 명시하지 않은 경우, 특별한 사정이 없는 한 대파손의 수리, 건물의 주요 구성부분의 대수선, 기본적 설비 교체 등 대규모의 수선은 여전히 임대인이 수선의무를 부담한다.", true, "▸ 특약으로 임대인 수선의무 면제 O → 그러나 특별한 사정 없는 한 통상 파손 등 소규모 수선만 면제되고, 대파손, 건물 주요 구성부분, 기본설비 교체와 같은 대규모 수선은 면제되지 × [2009다96984, 94다34692]", "민법상임대차"],
  ["072.②", "임대차종료 후 임차인이 임대차계약의 목적에 따라 사용·수익하지 아니하여 실질적 이득이 없더라도 임차인이 자신의 시설물을 반출하지 아니하였다면 임차인의 부당이득반환의무는 성립한다.", false, "▸ 부당이득의 이득은 실질적 이익을 의미하므로 임대차계약이 소멸된 이후 임차인이 임차건물을 계속 점유했으나 본래의 임대차계약상 목적에 따라 사용·수익하지 않아 실질적 이득 얻은 바 없다면 그로 인해 임대인에게 손해 발생했더라도 부당이득반환의무 ×, 이는 임차인 사정이어도 마찬가지 [98다8554]", "민법상임대차"],
  ["SS5.ㄱ", "임차인이 임대인의 동의를 얻어 임차물을 전대한 경우, 전차인은 전대차계약상의 차임지급시기 전에 전대인에게 차임을 지급한 사정을 들어 임대인에게 대항하지 못하지만, 차임지급시기 이후에 지급한 차임으로는 임대인에게 대항할 수 있고, 전대차계약상의 차임지급시기 전에 전대인에게 지급한 차임이라도, 임대인의 차임청구 전에 차임지급시기가 도래한 경우에는 그 지급으로 임대인에게 대항할 수 있다.", true, "▸ 대항할 수 없는 차임의 범위는 전대차계약상의 차임지급시기를 기준으로 그 전에 전대인에게 지급한 차임에 한정 → 그 이후에 지급한 차임은 임대인에게 대항 O [2006다45459]\n전대차계약상의 차임지급시기 전에 전대인에게 지급한 차임이라도, 임대인의 차임청구 전에 차임지급시기가 도래했다면 그 지급으로 임대인에게 대항 O [2018다200518]", "민법상임대차"],
  ["SS5.ㄴ", "임대차계약 존속 중에 발생한 임대목적물 훼손으로서, 그 훼손이 임대인이 지배, 관리하는 영역에 존재하는 하자로 발생한 것이 아니라면, 임차인은 임대차 종료 후 목적물 훼손에 대하여 자신의 귀책사유 없음을 증명하지 못하는 한 임대인에게 손해배상책임을 부담하며, 설령 해당 훼손에 대해 임대인이 임대차 존속 중 수선의무를 부담하더라도 결론은 같다.", true, "▸ 임대차 목적물이 화재로 소멸되어 임차인의 목적물반환의무가 이행불능 된 경우, 임차인은 귀책사유 없음 입증 못하는 한 이행불능 손해배상책임(화재의 구체적 발생원인 밝혀지지 않은 경우도 마찬가지) → 이러한 법리는 목적물 반환의무가 불능은 아니지만 훼손되어 손해배상 구할 때도 마찬가지 [2023다244895]", "민법상임대차"],
  ["SS5.ㄷ", "임대인은 임차목적물을 임차인이 용법에 맞게 사용·수익할 수 있도록 유지할 의무를 부담하는데, 이러한 임대인의 의무는 임차인이 임차목적물의 하자를 미리 알았다면 원칙적으로 면제된다.", false, "▸ 임대인은 목적물 사용·수익할 수 있도록 목적물을 임차인에게 인도해야(623조 전단), 하자 있으면 임대인은 하자 제거하여 목적물 사용·수익에 아무런 장해 없도록 해야 → 하자 발생에 임대인 귀책사유 없거나 임대인이 하자 발생 몰랐거나 반대로 임차인이 알거나 알 수 있었다 해도 임대인은 임차목적물 사용·수익상태 유지의무 O [2021다202309]", "민법상임대차"],
  ["SS5.ㄹ", "「주택임대차보호법」제6조의3에 따라 임차인이 임대차종료 전 6개월에서 2개월 사이에 적법하게 계약갱신을 요구하였더라도 임대인 또는 임차주택의 양수인으로서 임대인 지위를 승계한 자는 장차 실거주할 것을 주장하며 위 기간 내에 갱신을 거절할 수 있다.", true, "▸ 주임법 3조 4항으로 임대인 지위 승계한 '주택 양수인'도 주택에 실제 거주하려는 경우에는 임차인의 갱신요구에 대해 6조 1항 기간 내에 8호 사유로 갱신거절 O ∵ 6조, 6조의3 등 관련규정 내용·체계·입법취지 [2021다266631]\n주택임대차보호법 제6조의3(계약갱신 요구 등) ① 제6조에도 불구하고 임대인은 임차인이 제6조제1항 전단의 기간 이내에 계약갱신을 요구할 경우 정당한 사유 없이 거절하지 못한다. 다만, 다음 각 호의 어느 하나에 해당하는 경우에는 그러하지 아니하다. 8. 임대인(임대인의 직계존속·직계비속을 포함한다)이 목적 주택에 실제 거주하려는 경우", "민법상임대차"],
  ["073.⑤", "건물의 소유를 목적으로 하는 토지임대차계약 종료 시 토지 임대인이 토지 임차인을 상대로 하여 토지 임차인이 그의 비용으로 그 토지 지상에 신축한 건물 철거와 그 부지 인도 청구를 하고, 이에 대하여 토지 임차인은 지상물매수청구권을 행사하는 경우에는 토지 임대인의 청구에 해당 건물 매수대금 지급과 동시에 건물명도를 구하는 청구가 포함되어 있다고 볼 수 없다.", true, "▸ [민소] 토지임대인의 토지인도 및 건물철거 청구에는 임차인이 건물매수청구권을 행사한 경우 매매대금지급과 상환으로 건물인도 청구 포함 × → 청구변경이 없는 한 기각 → 다만, 법원으로서는 매매대금지급과 상환으로 건물인도 청구할 의사 있는지 적극적 석명의무 ∵ 분쟁의 1회적 해결 [94다34265]", "민법상임대차"],
  // 주택임대차보호법,
  ["074.ㄱ", "임차권등기명령에 의하여 임차권등기를 한 임차인은 위 임차권등기가 첫 경매개시결정등기 전에 경료된 경우, 별도로 배당요구를 하지 않아도 배당받을 채권자에 속한다.", true, "민사집행법 제148조(배당받을 채권자의 범위) 제147조제1항에 규정한 금액을 배당받을 채권자는 다음 각호에 규정된 사람으로 한다. 4. 저당권·전세권, 그 밖의 우선변제청구권으로서 첫 경매개시결정등기전에 등기되었고 매각으로 소멸하는 것을 가진 채권자", "주택임대차보호법"],
  ["075.③", "甲이 X주택을 乙에게 임대하였고, 乙은 X주택을 인도받고 전입신고를 하였다.§乙이 甲의 동의를 얻어 X주택을 丙에게 전대하였고, 전대차계약을 체결한 당일 丙이 X주택을 인도받아 그 즉시 전입신고를 한 경우, 乙의 임차권의 대항력은 유지된다.", true, "▸ 임대인의 동의 받은 전차인이 주택을 인도받아 자신의 주민등록을 마친 때 임차인은 주임법상 대항력 적취 O. 주임법상 대항력은 임차인이 간접점유하여도 인정 O, 다만 간접점유자에 불과한 임차인의 주민등록은 적× , 점유매개관계로 실제 거주하는 직접점유자가 주민등록 마쳐야 [2000다55645, 2005다64255]\n주임법상 대항력 갖춘 임차인이 임대인 동의 얻어 적법하게 임차권양도나 전대한 경우, 양수인·전차인이 임차인 주민등록퇴거일로부터 주민등록상 전입신고기간 내에 전입신고 마치고 인도받아 점유 계속한다면, 공시방법인 점유·주민등록 변경되었더라도, 원래 임차인의 임차권 대항력 동일성 유지·존속 O [87다카2509]", "주택임대차보호법"],
  ["075.④", "甲이 X주택을 乙에게 임대하였고, 乙은 X주택을 인도받고 전입신고를 하였다.§甲이 丁으로부터 X주택을 매수하여 소유권이전등기를 마친 후에 乙에게 임대한 경우, 丁이 甲의 매매대금채무의 이행지체를 이유로 매매계약을 해제하더라도 乙은 丁에게 임차권을 주장할 수 있다.", true, "▸ 주택 매매계약 해제로 소유권 상실한 임대인으로부터 해제 전에 주택 임차받아 인도·주민등록 마쳐 대항력 갖춘 임차인은 548조 1항 단서 제3자 O → 해제로 소유권 회복한 제3자는 주임법 3조 4항에 의해 임대인 지위 승계 O [2003다12717]", "주택임대차보호법"],
  ["076.①", "「주택임대차보호법」은 임대주택의 소유자가 아니더라도 그 주택에 관하여 적법하게 임대차계약을 체결할 수 있는 권한을 가진 임대인과 체결한 임대차계약에 적용된다.", true, "▸ 주택의 소유자가 아니어도 적법한 임대권한 있으면 주임법 O [2007다38908] → 인도받은 미등기 매수인은 임대할 적법한 권한 O", "주택임대차보호법"],
  ["077.ㄱ", "주택임대차보호법 제3조의3에 의한 임차권등기가 경료되어 있을 경우, 임대인의 임대차보증금 반환의무는 임차인의 임차권등기 말소의무보다 먼저 이행되어야 한다.", true, "▸ 임차권등기명령에 의한 등기는 이미 이행지체에 빠진 임대인에 대한 것으로서 보증금반환의무가 임차권등기 말소의무보다 선이행의무 [2005다4529] → 동시이행관계 아님을 주의", "주택임대차보호법"],
  ["077.ㄷ", "채권양수인이 주택임대차보호법상의 우선변제권을 행사할 수 있는 주택임차인으로부터 임차보증금반환채권을 양수하였더라도 임차권과 분리된 임차보증금반환채권만을 양수하였다면, 그 채권양수인은 위 법상의 우선변제권을 행사할 수 있는 임차인에 해당한다고 볼 수 없다.", true, "▸ [2010다10276] → 임차권 양수인, 전차인은 기존 임차인의 우선변제권을 행사 또는 대위행사할 수 있으나, 임대차보증금반환채권의 양수인은 우선변제권 ×", "주택임대차보호법"],
  ["SS6.②", "주택임대차에서 임차인이 임대인의 동의 없이 주택의 일부만을 전대한 경우에도 임대인은 임차인의 계약갱신요구를 거절하지 못한다.", false, "주택임대차보호법 제6조의3(계약갱신 요구 등) ① 제6조에도 불구하고 임대인은 임차인이 제6조제1항 전단의 기간 이내에 계약갱신을 요구할 경우 정당한 사유 없이 거절하지 못한다. 다만, 다음 각 호의 어느 하나에 해당하는 경우에는 그러하지 아니하다. 4. 임차인이 임대인의 동의 없이 목적 주택의 전부 또는 일부를 전대한 경우", "주택임대차보호법"],
  ["SS7.ㄱ", "당사자들이 자유로운 의사에 따라 임대차기간을 영구로 정한 경우 이때 영구임대라는 취지는, 차임지급 지체 등 임차인의 귀책사유로 인한 채무불이행이 없는 한 임대인이 임차인에게 임대차관계의 유지를 원하는 동안 임대차계약이 존속도록 이를 임차인에게 보장하여 주는 의미인 동시에, 임대목적물을 사용수익에 제공할 의무에 관한 채무불이행이 없는 한 임대인에게는 영구적으로 차임채권을 보장하는 의미이므로, 임차인이 언제라도 임대차기간 영구보장의 이익을 포기할 수 있는 것은 아니다.", false, "▸ 임대차기간을 영구로 정한 약정 유효 O ∵ 계약 자유 원칙, 헌법재판소의 651조 위헌결정 이후 619조 단기임대차 외에는 불허 규정 없음. 소유자의 사용·수익 권능 대세적 포기는 불허되나 특정인에 대한 채권적 사용·수익권 포기는 허용. 실제의 필요성, 사정변경 차임증감청구권·해지권 등으로 이해관계 조정 가능 영구 임대의 취지는 임차인이 차임연체 등 채무불이행 없는 한 유지 원하는 동안 존속 보장 의미 → 임대인에게는 영구적으로 차임채권을 보장하는 의미, 임차인은 언제든지 권리포기 O → 포기하면 기간 정함 없는 임대차 O [2023다209045]", "주택임대차보호법"],
  ["SS7.ㄴ", "甲이 乙로부터 아파트를 매수하기로 하는 계약을 체결하였고, 위 계약 체결 무렵 위 아파트에 거주 중인 임차인 丙이 임대차계약기간 만료 후 계약갱신요구권을 행사하지 않고 아파트를 인도할 것이라고 하였는데, 잔금 지급일 직전 丙이 계약갱신요구권을 행사해 위 아파트에 2년 더 거주하겠다고 통보한 경우, 乙이 약정한 기일에 아파트를 甲에게 현실인도하기 곤란해졌다고 하더라도, 甲으로서는 임대목적물에 대한 소유권을 취득하여 임차인 丙의 갱신 요구를 거절할 수 있었으므로, 약정 인도일에 乙이 임대목적물을 현실로 인도하지 확실하지 않는다는 점을 들어 甲이 매매대금 잔금의 이행을 거절할 수는 없다.", false, "▸ 536조 2항 '상대방 이행이 곤란할 현저한 사유'는 상대방의 신용불안이나 재산상태 악화 등 사정변경 생기고 당초 계약 내용 따른 선이행의무 이행케 하는 것이 공평·신의칙 반하게 되는 경우 → 상대방 채무가 아직 이행기에 이르지 않았어도 O [2019다215791, 2023다269139] → 2023다269139 판결의 경우, 아파트 매매계약 당시 임차인이 갱신요구 없이 인도할 것이라 했는데 잔금 지급일 직전 갱신요구권 행사했다면 현실인도의무보다 잔금지급의무가 선이행의무였어도 매수인은 지급 거절 O ∵ 현실인도의무 이행 곤란해 현저한 사정 O, 공평·신의칙", "주택임대차보호법"],
  ["SS7.ㄷ", "상가건물 임대차보호법이 적용되는 임대차가 기간만료나 당사자의 합의, 해지 등으로 종료된 경우, 임차인이 보증금을 반환받을 때까지 임차 목적물을 계속 점유하면서 사용·수익하였다면 임차인은 임대인에게 시가에 따른 차임에 상응하는 부당이득금을 지급할 의무를 부담한다.", false, "▸ 상임법 적용되는 임대차 종료하고 보증금 반환받을 때까지 목적물 계속 점유·사용·수익한 임차인은 종전 임대차계약의 차임 지급의무 부담할 뿐, 시가 따른 차임 상당 부당이득반환의무 × ∵ 상임법 9조 2항 입법취지(보증금반환 실질 보장), 종료 후 의제되는 임대차관계의 법적 성격 [2023다257600]", "주택임대차보호법"],
  ["SS7.ㄹ", "주택임대차보호법에 정한 대항력과 우선변제권 두 가지 권리를 겸유하고 있는 임차인이 먼저 우선변제권을 선택하여 임차주택에 대하여 진행되고 있는 경매절차에서 배당요구를 하였으나 보증금 전액을 배당받지 못한 경우 임차인은 여전히 대항요건을 유지함으로써 임대차관계의 존속을 주장할 수 있으므로, 임차인이 대항력을 구비한 후 임차주택을 양수한 자는 그와 같이 존속되는 임대차의 임대인 지위를 당연히 승계한다.", true, "▸ 주임법상 대항력과 우선변제권의 두 권리 겸유한 임차인이 먼저 우선변제권 선택하여 경매절차에서 배당요구 했으나 순위 늦어 보증금 전액을 배당받을 수 없었다면 나머지 반환 받을 때까지 경락인에게 대항하여 임대차관계의 존속 주장 O → 경락인은 법 3조 4항 의해 임대차 종료 상태의 임대인 지위 승계 [98다2754]", "주택임대차보호법"],
  ["SS7.ㅁ", "임차인이 임대차보증금반환채권에 질권을 설정하고 임대인이 그 질권 설정을 승낙한 후에 주택임대차보호법상 대항력 있는 임차인이 설정된 임대주택이 양도된 경우에 양수인의 법률상 당연승계 규정을 기초로 하여 질권의 제3채무자 지위도 양수인이 승계한다.", true, "▸ 주택임차인 대항력 갖춘 후 임대주택 소유권 양도되어 그 양수인이 주임법 3조 1, 4항에 의해 임대인 지위를 승계한 경우, 임대차보증금반환채무도 주택 소유권과 결합하여 일체로서 임대인 지위를 승계한 양수인에게 이전 O, 양도인의 임대인 지위나 보증금반환채무 소멸 O → 임차인이 임대차보증금반환채권에 질권을 설정하고 임대인이 질권설정을 승낙한 후에 주택이 양도된 경우에도 임대인은 주임법 3조 4항에 의해 임대차관계에서 탈퇴, 임대차보증금반환채무를 면함 [2018다201610]", "주택임대차보호법"],
  ["078.②", "甲이 자기 소유 X 주택을 임대차기간 2년, 보증금 2억 원, 월 차임 100만 원으로 정하여 乙에게 임대하였고, 乙은 甲에게 보증금을 지급하고 X 주택을 인도받은 후 주민등록까지 마쳤다.§乙이 배우자 A, 자녀 B, C와 함께 X 주택에 주민등록을 마쳤는데, 乙이 다른 지역의 사무실로 근무처를 옮기게 되어 가족들 중 乙만 일시적으로 주민등록을 X 주택이 아닌 다른 곳으로 옮긴 경우, 그 자체만으로 乙이 이미 취득한 대항력이 상실되는 것은 아니다.", true, "▸ 임차인이 가족과 함께 주택 점유 계속하며 가족의 주민등록은 그대로 둔 채 임차인만 주민등록을 일시 다른 곳으로 옮겼다면 대항력 유지 O ∵ 전체적으로나 종국적으로 주민등록 이탈 × [88다카143]", "주택임대차보호법"],
  ["078.③", "甲이 자기 소유 X 주택을 임대차기간 2년, 보증금 2억 원, 월 차임 100만 원으로 정하여 乙에게 임대하였고, 乙은 甲에게 보증금을 지급하고 X 주택을 인도받은 후 주민등록까지 마쳤다.§乙의 채권자 丁이 乙의 甲에 대한 임대차보증금반환채권을 가압류한 상태에서 甲이 X 주택을 戊에게 양도한 후에는, 丁은 甲에 대해서는 위 가압류의 효력을 주장할 수 없다.", true, "▸ 임대차보증금반환채권이 가압류되면 제3채무자의 지위는 임대인의 지위와 분리 ×. 임대주택 양도로 임대인 지위가 일체로 양수인에게 이전되면 채권가압류의 제3채무자 지위도 임대인 지위와 함께 이전 O, 가압류채권자도 주택의 양도인이 아니라 양수인에 대하여만 가압류 효력 주장 O ∵ 임대차보증금 우선변제는 주택의 매각대금으로 [2011다49523]", "주택임대차보호법"],
  ["079.ㄷ", "주택임대차보호법 제3조 제1항의 대항요건을 갖춘 임차인의 임대차보증금반환채권에 대한 압류 및 전부명령이 확정되어 임차인의 임대차보증금반환채권이 집행채권자에게 이전된 후 소유자인 임대인이 당해 주택을 제3자에게 매도한 경우 그 임대인은 전부금 지급의무를 부담하지 않는다.", true, "▸ 주임법상 대항요건 갖춘 임차인의 임대차보증금반환채권에 압류·전부명령이 확정되어 임대차보증금반환채권이 집행채권자에게 이전되면, 제3채무자인 임대인으로서는 그 채무를 집행채권자에 대해 부담할 뿐 주택의 소유자로서 주택을 제3자에게 매도할 권능은 그대로 보유 → 임대인이 주택 매도하면 주임법 3조 4항에 의해 전부채권자에 대한 보증금지급의무 면하게 됨 [2005다23773]", "주택임대차보호법"],
  ["079.ㄹ", "임차인이 임대차보증금반환채권에 질권을 설정하고 임대인이 그 질권 설정을 승낙한 후에 주택임대차보호법상 대항력 있는 임차인이 설정된 임대주택이 양도된 경우에 양수인의 법률상 당연승계 규정을 기초로 하여 질권의 제3채무자 지위도 양수인이 승계한다.", true, "▸ 주택임차인 대항력 갖춘 후 임대주택 소유권 양도되어 그 양수인이 주임법 3조 1, 4항에 의해 임대인 지위를 승계한 경우, 임대차보증금반환채무도 주택 소유권과 결합하여 일체로서 임대인 지위를 승계한 양수인에게 이전 O, 양도인의 임대인 지위나 보증금반환채무 소멸 O → 임차인이 임대차보증금반환채권에 질권을 설정하고 임대인이 질권설정을 승낙한 후에 주택이 양도된 경우에도 임대인은 주임법 3조 4항에 의해 임대차관계에서 탈퇴, 임대차보증금반환채무를 면함 [2018다201610]", "주택임대차보호법"],
  ["080.①", "甲은 자신의 명의로 소유권이전등기가 되어 있는 X 주택에 대해서 乙과 임대차계약을 체결하였고, 乙은 주택 인도와 주민등록을 마쳤다.§甲이 무효인 계약명의신탁의 수탁자이고 매도인이 악의여서 甲 명의의 등기가 무효인 경우, 乙은 매도인에게 X 주택에 대한 임차권을 주장할 수 없다.", false, "▸ 매도인이 악의인 계약명의신탁에서 수탁자로부터 명의신탁 목적물인 주택 임차하여 인도·주민등록 마쳐 주임법 3조 1항 대항력 갖춘 임차인은 부동산실명법 4조 3항의 제3자에 해당 O → 임차인은 수탁자 소유권등기 말소되어 등기 명의 회복한 매도인, 매도인으로부터 소유권이전등기 마친 신탁자에 대해 임차권을 대항 O, 신탁자가 주임법 3조 4항에 따라 임대인 지위 승계 O ∵ 주임법 입법목적 및 3조 4항 개정 취지가 임차인 보호 [2021다210720]", "주택임대차보호법"],
  ["080.②", "甲은 자신의 명의로 소유권이전등기가 되어 있는 X 주택에 대해서 乙과 임대차계약을 체결하였고, 乙은 주택 인도와 주민등록을 마쳤다.§甲이 丙으로부터 X 주택을 매수하여 소유권이전등기를 마쳤지만 甲과 丙의 매매계약이 해제된 경우에 乙은 丙에게 X 주택에 대한 임차권을 주장할 수 있다.", true, "▸ 주택 매매계약 해제로 소유권 상실한 임대인으로부터 해제 전에 주택 임차받아 인도·주민등록 마쳐 대항력 갖춘 임차인은 548조 1항 단서 제3자 O → 해제로 소유권 회복한 제3자는 주임법 3조 4항에 의해 임대인 지위 승계 O [2003다12717]", "주택임대차보호법"],
  ["080.④", "甲은 자신의 명의로 소유권이전등기가 되어 있는 X 주택에 대해서 乙과 임대차계약을 체결하였고, 乙은 주택 인도와 주민등록을 마쳤다.§甲이 X 주택의 소유자가 아니더라도 적법하게 임대차를 체결할 수 있는 권한을 가졌다면 乙은 X 주택에 대한 임차권의 대항력을 취득한다.", true, "▸ 주택의 소유자가 아니어도 적법한 임대권한 있으면 주임법 O [2007다38908]", "주택임대차보호법"],
  ["080.⑤", "甲은 자신의 명의로 소유권이전등기가 되어 있는 X 주택에 대해서 乙과 임대차계약을 체결하였고, 乙은 주택 인도와 주민등록을 마쳤다.§X 주택에 적법하게 전세권설정등기를 마친 乙이 전세권설정계약과 동일성이 인정되는 임대차계약을 체결하고 대항요건을 갖춘 경우, 乙이 경매절차에서 전세권자로서 배당요구를 하여 전세권이 소멸하더라도 임차보증금을 모두 지급받지 못하였다면 乙은 경락인에게 임차권을 주장할 수 있다.", true, "▸ 전세권자 지위와 주임법상 대항력 갖춘 임차인 지위 함께 가지는 경우 (지위 강화 방편) 양자는 별개의 권리 → 전세권자로서 배당요구 하고 못 받은 나머지 보증금으로 임차권에 기한 대항력 주장할 때 주택 매수인이 임대인 지위 승계 [2010마900]", "주택임대차보호법"],
  ["081.ㄱ", "매도인이 악의인 계약명의신탁에서 명의수탁자로부터 명의신탁의 목적물인 주택을 임차하여 주택 인도와 주민등록을 마침으로써 주택임대차보호법 제3조 제1항에 의한 대항요건을 갖춘 임차인은, 명의수탁자의 소유권이전등기가 말소됨으로써 등기명의를 회복하게 된 매도인 및 매도인으로부터 다시 소유권이전등기를 마친 명의신탁자에 대해 자신의 임차권을 대항할 수는 있지만, 명의신탁자가 임대인의 지위를 승계하는 것은 아니다.", false, "▸ [2021다210720]\n[AI해설] 명의신탁자는 주임법 3조 4항에 따라 임대인 지위를 승계한다. '대항은 가능하지만 임대인 지위 승계는 아님'이라는 지문은 틀렸다.", "주택임대차보호법"],
  ["081.ㄴ", "공동임차인으로서 임대차계약을 체결한 것은 기본적으로 임대차계약에 따른 권리·의무를 함께하겠다는 것이지만, 임대차보증금에 관한 지분을 정하여 그 지분에 따라 임대차보증금을 지급하거나 반환받기로 약정하였다면 임대차계약 자체를 지분으로 분리하겠다는 것으로 볼 수 있다.", false, "▸ 주택의 공동임차인 중 1인이라도 주임법 3조 1항 대항력 요건 갖추면 임대차 전체에 대항력 O (이렇게 봐도 제3자 권리 침해 ×) → 임차건물 양도되면 특별한 사정 없는 한 공동임차인에 대한 보증금반환채무 전부가 임대인 지위 승계한 양수인에게 이전 O, 양도인의 채무 소멸 O → 계약당사자 사이 공동임차인의 임대차보증금 지분을 별도로 정한 경우도 마찬가지 ∵ 임대차계약 자체를 지분으로 분리한다는 의미 × [2021다238650]", "주택임대차보호법"],
  ["082.④", "대항력과 우선변제권을 겸유하고 있는 임차인이 우선변제권을 행사하여 경매절차에서 보증금 전액에 대하여 배당요구를 하였으나 그 전액을 배당받을 수 없었던 경우, 경락인과의 관계에서 임대차관계는 계속되고 이러한 임차권에는 더 이상 우선변제권이 인정되지 않는다.", true, "▸ 주임법상 대항력과 우선변제권의 두 권리 겸유한 임차인이 먼저 우선변제권 선택하여 경매절차에서 배당요구 했으나 순위 늦어 보증금 전액을 배당받을 수 없었다면 나머지 반환 받을 때까지 경락인에게 대항하여 임대차관계의 존속 주장 O → 배당요구로 임대차 해지되나 4조 2항에 의해 보증금 잔액 받을 때까지 임대차관계 존속 의제될 뿐 → 경락인은 법 3조 4항 의해 임대차 종료 상태의 임대인 지위 승계, 임차인의 우선변제권은 경락으로 소멸 → 경락인이 마침 종전 소유자인 임대인이라 해도 그 후 그 주택에 새로 마친 저당권에 기한 경매절차에서 임차인은 우선변제권 × [98다2754]\n제3조의5(경매에 의한 임차권의 소멸) 임차권은 임차주택에 대하여「민사집행법」에 따른 경매가 행하여진 경우에는 그 임차주택의 경락에 따라 소멸한다. 다만, 보증금이 모두 변제되지 아니한, 대항력이 있는 임차권은 그러하지 아니하다.", "주택임대차보호법"],
  // 상가건물임대차보호법,
  ["083.ㄱ", "「상가건물 임대차보호법」의 적용 대상인 상가건물에 있어서 보증금액이 같은 법 제2조 제1항 단서의 대통령령으로 정하는 보증금액을 초과하는 임대차.§기간의 약정 없는 임대차의 경우, 임차인이 임대차 기간 동안 계약을 위반한 사실이 없어도 임차인의 계약갱신요구권이 인정되지 않는다.", true, "▸ 상임법 9조 1항(기간 정하지 않으면 1년 간주)은 환산보증금 초과하는 상가임대차에 적용 ×(동법 2조 1항 단서) → 보증금 초과하고 임대기간 정하지 않으면 민법 적용 O, 임대인은 언제든지 해지통고 O, 6개월 지나면 효력(민법 635조 1항, 2항 1호) → 이 경우는 10조 1항 갱신요구권 적용 여지 × ∵ 갱신요구권은 임대기간 정해져 있음을 전제로 함 [2021다233730]", "상가건물임대차보호법"],
  ["083.ㄴ", "「상가건물 임대차보호법」의 적용 대상인 상가건물에 있어서 보증금액이 같은 법 제2조 제1항 단서의 대통령령으로 정하는 보증금액을 초과하는 임대차.§임차인이 임차건물에 대하여 임대차보증금반환청구소송의 확정판결에 의해 경매를 신청하는 경우 반대의무의 이행이나 이행의 제공을 집행개시의 요건으로 하지 않는다.", false, "상임법 제5조(보증금의 회수) ① 임차인이 임차건물에 대하여 보증금반환청구소송의 확정판결, 그 밖에 이에 준하는 집행권원에 의하여 경매를 신청하는 경우에는「민사집행법」제41조에도 불구하고 반대의무의 이행이나 이행의 제공을 집행개시의 요건으로 하지 아니한다.", "상가건물임대차보호법"],
  ["083.ㄷ", "「상가건물 임대차보호법」의 적용 대상인 상가건물에 있어서 보증금액이 같은 법 제2조 제1항 단서의 대통령령으로 정하는 보증금액을 초과하는 임대차.§임차인이 3기의 차임액에 달하는 차임을 연체했으나 임대인이 임대차계약을 해지하기 전에 임차인이 연체차임 전액을 지급한 경우, 임대인은 임차인이 임대차 기간 만료 5개월 전에 계약갱신 요구를 하더라도 이를 거절할 수 있다.", true, "▸ 임대기간 중 어느 때든 3기분 달하도록 차임 연체된 사실 있다면 임대인은 임차인의 갱신요구 거절 O (상임법 10조 1항 1호) ∵ 10조 1항 1호 갱신요구 거절사유는 '3기 차임액 해당 금액 이르도록 차임 연체한 사실 있는 경우'로 규정하여 10조의8 차임연체 계약해지요건 '차임연체액이 3기 차임액 달하는 때'와 문언 다름. 임차인과의 계약관계 연장 수용할 신뢰 깨어짐 → 임차인 갱신요구권 행사 당시에 3기 차임액 연체되어 있어야 하는 것은 × [2020다255429]", "상가건물임대차보호법"],
  ["083.ㄹ", "「상가건물 임대차보호법」의 적용 대상인 상가건물에 있어서 보증금액이 같은 법 제2조 제1항 단서의 대통령령으로 정하는 보증금액을 초과하는 임대차.§임대인이 임대차 기간 종료 시 특별한 사유를 제시하지 않은 채 임차인이 주선한 신규 임차인과의 임대차계약 체결을 거절한 후 임차건물을 양도한 경우, 임대인과 임차건물 양수인의 비영리 사용기간을 합쳐 1년 6개월 이상이 경과하면 임대인은 권리금 침해로 인한 손해배상 책임이 없다.", false, "제10조의4(권리금 회수기회 보호 등) ① 임대인은 임대차기간이 끝나기 6개월 전부터 임대차 종료 시까지 다음 각 호의 어느 하나에 해당하는 행위를 함으로써 권리금 계약에 따라 임차인이 주선한 신규임차인이 되려는 자로부터 권리금을 지급받는 것을 방해하여서는 아니 된다. 다만, 제10조제1항 각 호의 어느 하나에 해당하는 사유가 있는 경우에는 그러하지 아니하다. 4. 그 밖에 정당한 사유 없이 임대인이 임차인이 주선한 신규임차인이 되려는 자와 임대차계약의 체결을 거절하는 행위 ② 다음 각 호의 어느 하나에 해당하는 경우에는 제1항제4호의 정당한 사유가 있는 것으로 본다. 3. 임대차 목적물인 상가건물을 1년 6개월 이상 영리목적으로 사용하지 아니한 경우\n▸ 상임법 10조의4 2항 3호 '상가건물을 1년 6개월 이상 영리목적으로 사용하지 않은 경우'로 정당한 사유 있으려면, 임대인이 임대차 종료 시 임차인이 주선한 자와 신규 임대차계약 체결을 그 사유로 거절하고 실제 1년 6개월 동안 영리목적 사용하지 않아야 → 다른 사유로 거절하고 사후적으로 1년 6개월 동안 영리목적 사용하지 않았다는 사정은 정당한 사유 × ∵ 10조의4의 문언·체계·입법목적·연혁 등을 종합 [2019다285257]", "상가건물임대차보호법"],
  ["SS8.ㄱ", "임차인 乙은 2021. 12. 24. 임대인 甲으로부터 상가건물 임대차보호법이 적용되는 X점포를 임대차기간 2022. 1. 1.부터 2023. 12. 31.까지, 임대차보증금 3천만 원, 차임 매월 180만 원으로 정하여 임차하고 같은 날 위 점포를 인도받아 사업자등록까지 마쳤다. 甲은 임대차기간이 만료되기 6개월 전부터 1개월 전까지 사이에 乙에게 갱신거절의 통지 또는 조건변경의 통지를 하지 아니하였고, 그 기간 동안에 별다른 조치를 취하지 않았던 乙이 2023. 12. 23. 甲에게 임대차계약의 갱신거절의 통지를 하여 그 통지가 같은 날 도달하였다. 乙은 임차권등기를 마친 후 2024. 1. 31. 甲에게 X점포를 인도하였다. / 임차인 丁은 2022. 3. 5. 임대인 丙으로부터 주택임대차보호법이 적용되는 Y주택을 임대차기간을 2022. 3. 10.부터 2024. 3. 9.까지로 정하여 임차하였다. 丁은 임대차기간 만료 전인 2024. 1. 3. 丙에게 임대차계약의 갱신을 요구하는 통지를 하여 그 통지가 2024. 1. 5. 丙에게 도달하였는데, 그 후 丁은 마음을 바꿔 2024. 1. 28. 갱신된 임대차계약의 해지를 통지하여 그 통지가 2024. 1. 29. 丙에게 도달하였다.§乙이 2024. 1월 기간 동안 X점포를 사용수익하지 않은 경우 보증금에서 2024. 1월분 차임 혹은 차임 상당의 부당이득은 공제되지 않는다.", true, "▸ 부당이득의 이득은 실질적 이익을 의미하므로 임대차계약이 소멸된 이후 임차인이 임차건물을 계속 점유했으나 본래의 임대차계약상 목적에 따라 사용·수익하지 않아 실질적 이득 얻은 바 없다면 그로 인해 임대인에게 손해 발생했더라도 부당이득반환의무 ×, 이는 임차인 사정이어도 마찬가지 [98다8554]\n→ 위 임대차는 23. 12. 31. 기간 만료로 종료했으므로(그 이유는 ㄷ 해설 참조), 1월 내내 사용수익을 하지 않은 이상 부당이득 ×(24. 1. 31. 인도는 무관)", "상가건물임대차보호법"],
  ["SS8.ㄴ", "임차인 乙은 2021. 12. 24. 임대인 甲으로부터 상가건물 임대차보호법이 적용되는 X점포를 임대차기간 2022. 1. 1.부터 2023. 12. 31.까지, 임대차보증금 3천만 원, 차임 매월 180만 원으로 정하여 임차하고 같은 날 위 점포를 인도받아 사업자등록까지 마쳤다. 甲은 임대차기간이 만료되기 6개월 전부터 1개월 전까지 사이에 乙에게 갱신거절의 통지 또는 조건변경의 통지를 하지 아니하였고, 그 기간 동안에 별다른 조치를 취하지 않았던 乙이 2023. 12. 23. 甲에게 임대차계약의 갱신거절의 통지를 하여 그 통지가 같은 날 도달하였다. 乙은 임차권등기를 마친 후 2024. 1. 31. 甲에게 X점포를 인도하였다. / 임차인 丁은 2022. 3. 5. 임대인 丙으로부터 주택임대차보호법이 적용되는 Y주택을 임대차기간을 2022. 3. 10.부터 2024. 3. 9.까지로 정하여 임차하였다. 丁은 임대차기간 만료 전인 2024. 1. 3. 丙에게 임대차계약의 갱신을 요구하는 통지를 하여 그 통지가 2024. 1. 5. 丙에게 도달하였는데, 그 후 丁은 마음을 바꿔 2024. 1. 28. 갱신된 임대차계약의 해지를 통지하여 그 통지가 2024. 1. 29. 丙에게 도달하였다.§甲이 X점포를 戊에게 다시 임대한 경우, 戊는 상가건물 임대차보호법 제14조에 따른 소액보증금의 최우선변제를 받을 권리가 없다.", true, "▸ 주택임대차보호법상의 대항력과 우선변제권을 겸유하고 있는 임차인으로서 우선변제권을 선택하여 경매절차에서 배당요구를 하였으나 배당을 전혀 받지 못한 임차인은 주택임대차보호법 제4조 제2항에 따라 경매절차의 매수인에게 대항하여 임대차보증금을 반환받을 때까지 주택에 관한 임대차관계의 존속을 주장할 수 있다. 나아가 주택임대차보호법 제3조의3 제6항은 임차권등기명령의 집행에 따른 임차권등기가 끝난 주택을 그 이후에 임차한 임차인은 소액임차보증금 최우선변제권이 없다고 규정하고, 주택임대차보호법에서 임차권의 대항력과 우선변제권에 관한 규정은 임차인이 주택의 인도와 주민등록을 마친 때에는 대항력이 생기고 임대차계약증서에 확정일자를 갖추면 우선변제권까지 생긴다고 정하고 있을 뿐 선순위 임차권 내지 임차권등기의 존재를 소극적 요건으로 정하고 있지 않으므로, 임차권등기가 마쳐진 주택을 임차한 임차인에게도 소액임차보증금에 관한 최우선변제권을 제외한 대항력과 우선변제권을 인정할 수 있다. [2022다246610]\n주택임대차보호법 제3조의3(임차권등기명령) ⑥ 임차권등기명령의 집행에 따른 임차권등기가 끝난 주택(임대차의 목적이 주택의 일부분인 경우에는 해당 부분으로 한정한다)을 그 이후에 임차한 임차인은 제8조에 따른 우선변제를 받을 권리가 없다.", "상가건물임대차보호법"],
  ["SS8.ㄷ", "임차인 乙은 2021. 12. 24. 임대인 甲으로부터 상가건물 임대차보호법이 적용되는 X점포를 임대차기간 2022. 1. 1.부터 2023. 12. 31.까지, 임대차보증금 3천만 원, 차임 매월 180만 원으로 정하여 임차하고 같은 날 위 점포를 인도받아 사업자등록까지 마쳤다. 甲은 임대차기간이 만료되기 6개월 전부터 1개월 전까지 사이에 乙에게 갱신거절의 통지 또는 조건변경의 통지를 하지 아니하였고, 그 기간 동안에 별다른 조치를 취하지 않았던 乙이 2023. 12. 23. 甲에게 임대차계약의 갱신거절의 통지를 하여 그 통지가 같은 날 도달하였다. 乙은 임차권등기를 마친 후 2024. 1. 31. 甲에게 X점포를 인도하였다. / 임차인 丁은 2022. 3. 5. 임대인 丙으로부터 주택임대차보호법이 적용되는 Y주택을 임대차기간을 2022. 3. 10.부터 2024. 3. 9.까지로 정하여 임차하였다. 丁은 임대차기간 만료 전인 2024. 1. 3. 丙에게 임대차계약의 갱신을 요구하는 통지를 하여 그 통지가 2024. 1. 5. 丙에게 도달하였는데, 그 후 丁은 마음을 바꿔 2024. 1. 28. 갱신된 임대차계약의 해지를 통지하여 그 통지가 2024. 1. 29. 丙에게 도달하였다.§甲과 乙의 임대차계약은 묵시적으로 갱신되었으나, 乙이 2023. 12. 23. 갱신을 거절하였으므로, 위 임대차계약은 그로부터 3개월이 지난 2024. 3. 23. 해지되어 종료되었다.", false, "▸ 상가 임차인이 임대기간 만료 1개월 전부터 만료일 사이 갱신거절 통지한 경우에도 묵시적 갱신 ×, 임대차기간 만료일에 종료 O, 만료일 6개월부터 1개월 전까지 사이에 임차인이 별다른 조치 없다고 만료 전 1개월 이라는 갱신거절 통지기간 제한 있는 것과 혼동하지 말 것 ∵ 기간 정함 있는 임대차는 기간만료 종료 원칙, 민법 639조는 만료 후 상당 기간 이의 없어야 하고 만료 전 갱신거절 통지하면 묵시갱신 ×, 상임법 10조 1항은 임차인의 갱신요구권 인정할 뿐 임대인의 '갱신거절 통지'는 기간 제한 없음, 4항은 묵시적 갱신 규정하면서 '임대인'의 갱신거절·조건변경 통지 기간 제한했을 뿐 '임차인'에 대해서는 기간 제한 규정 없음(≠ 주임법 6조 1항 후문은 '임차인' 2개월 전이라는 갱신거절 통지기간 제한 있는 것과 차이), 규정 없는 이상 상가의 임차인의 갱신거절 통지기간은 제한 없음, 문언해석, 임차인 보호 입법취지 [2023다307024]\n→ 설문에서 임대차 만료일 23. 12. 31. 직전인 23. 12. 23. 임차인 乙이 甲에게 갱신거절 통지를 했으므로 묵시 갱신은 일어날 수 없고, 원래 만료일 23. 12. 31.에 만료로 임대차가 종료함", "상가건물임대차보호법"],
  ["SS8.ㄹ", "임차인 乙은 2021. 12. 24. 임대인 甲으로부터 상가건물 임대차보호법이 적용되는 X점포를 임대차기간 2022. 1. 1.부터 2023. 12. 31.까지, 임대차보증금 3천만 원, 차임 매월 180만 원으로 정하여 임차하고 같은 날 위 점포를 인도받아 사업자등록까지 마쳤다. 甲은 임대차기간이 만료되기 6개월 전부터 1개월 전까지 사이에 乙에게 갱신거절의 통지 또는 조건변경의 통지를 하지 아니하였고, 그 기간 동안에 별다른 조치를 취하지 않았던 乙이 2023. 12. 23. 甲에게 임대차계약의 갱신거절의 통지를 하여 그 통지가 같은 날 도달하였다. 乙은 임차권등기를 마친 후 2024. 1. 31. 甲에게 X점포를 인도하였다. / 임차인 丁은 2022. 3. 5. 임대인 丙으로부터 주택임대차보호법이 적용되는 Y주택을 임대차기간을 2022. 3. 10.부터 2024. 3. 9.까지로 정하여 임차하였다. 丁은 임대차기간 만료 전인 2024. 1. 3. 丙에게 임대차계약의 갱신을 요구하는 통지를 하여 그 통지가 2024. 1. 5. 丙에게 도달하였는데, 그 후 丁은 마음을 바꿔 2024. 1. 28. 갱신된 임대차계약의 해지를 통지하여 그 통지가 2024. 1. 29. 丙에게 도달하였다.§丙과 丁 사이의 주택임대차계약이 종료한 시점은 약정한 임대차기간 만료일인 2024. 3. 9.이다.", false, "▸ ㄹ, ㅁ 해설 : 주임법 6조의3(갱신요구권) 제4항이 준용하는 제6조의2(묵시갱신) 제1항에 따라 임차인이 계약갱신 요구하면 갱신거절사유 없는 한 갱신요구 도달 시에 갱신 효력 발생하고, 갱신 효력 발생 후 임차인은 언제든지 해지통고 O, 그로부터 3개월 지나면 효력 발생 → 계약해지 통지가 갱신된 임대차계약 기간 개시 전에 임대인에게 도달하더라도 마찬가지 [2023다258672]\n→ 丙과 丁 사이 주택임대차가 종료한 시점은 丁의 해지통고 도달일 24. 1. 29.로부터 3개월이 지난 24. 4. 29. 종료함(원래의 기간만료일인 24. 3. 9. 종료하는 것이 아니며, 이 점에서 상가임대차에서 기간만료일에 종료하는 ㄷ 같은 상황과 구별할 것)\n한편 丁의 갱신 요구 도달 시에 갱신되었다는 지문도 챙겨둘 것", "상가건물임대차보호법"],
  ["SS8.ㅁ", "임차인 乙은 2021. 12. 24. 임대인 甲으로부터 상가건물 임대차보호법이 적용되는 X점포를 임대차기간 2022. 1. 1.부터 2023. 12. 31.까지, 임대차보증금 3천만 원, 차임 매월 180만 원으로 정하여 임차하고 같은 날 위 점포를 인도받아 사업자등록까지 마쳤다. 甲은 임대차기간이 만료되기 6개월 전부터 1개월 전까지 사이에 乙에게 갱신거절의 통지 또는 조건변경의 통지를 하지 아니하였고, 그 기간 동안에 별다른 조치를 취하지 않았던 乙이 2023. 12. 23. 甲에게 임대차계약의 갱신거절의 통지를 하여 그 통지가 같은 날 도달하였다. 乙은 임차권등기를 마친 후 2024. 1. 31. 甲에게 X점포를 인도하였다. / 임차인 丁은 2022. 3. 5. 임대인 丙으로부터 주택임대차보호법이 적용되는 Y주택을 임대차기간을 2022. 3. 10.부터 2024. 3. 9.까지로 정하여 임차하였다. 丁은 임대차기간 만료 전인 2024. 1. 3. 丙에게 임대차계약의 갱신을 요구하는 통지를 하여 그 통지가 2024. 1. 5. 丙에게 도달하였는데, 그 후 丁은 마음을 바꿔 2024. 1. 28. 갱신된 임대차계약의 해지를 통지하여 그 통지가 2024. 1. 29. 丙에게 도달하였다.§丙과 丁의 임대차계약은 丁이 갱신을 요구한 2024. 1. 5. 갱신되었으나, 丁이 다시 갱신된 임대차계약을 해지하였으므로 그 해지통지가 도달한 2024. 1. 29.부터 3개월이 지난 시점에 해지되어 종료되었다.", true, "▸ ㄹ, ㅁ 해설 : 주임법 6조의3(갱신요구권) 제4항이 준용하는 제6조의2(묵시갱신) 제1항에 따라 임차인이 계약갱신 요구하면 갱신거절사유 없는 한 갱신요구 도달 시에 갱신 효력 발생하고, 갱신 효력 발생 후 임차인은 언제든지 해지통고 O, 그로부터 3개월 지나면 효력 발생 → 계약해지 통지가 갱신된 임대차계약 기간 개시 전에 임대인에게 도달하더라도 마찬가지 [2023다258672]\n→ 丙과 丁 사이 주택임대차가 종료한 시점은 丁의 해지통고 도달일 24. 1. 29.로부터 3개월이 지난 24. 4. 29. 종료함", "상가건물임대차보호법"],
  // 도급,
  ["084.①", "甲은 자기 소유의 X 토지에 Y 건물을 신축하기 위하여 乙과 공사대금을 2억 원으로 하는 Y 건물 공사도급계약을 체결하였다.§乙이 공사를 중단하여 약정된 공사 기한 내에 공사를 완공하는 것이 불가능하다는 것이 명백해진 경우, 甲은 공사 기한이 도래하기 전이라도 계약을 해제할 수 있지만, 그에 앞서 원칙적으로 乙에 대하여 공사 기한으로부터 상당한 기간 내에 완공할 것을 최고하여야 한다.", true, "▸ 공사도급계약에서 수급인의 공사중단·지연으로 약정된 공사기한 내 공사완공이 불가능함이 명백해진 경우, 도급인은 공사기한 도래 전에도 해제 O. 그러나 그에 앞서 수급인에 대해 공사기한으로부터 상당 기간 내 완공할 것을 최고해야. 다만 예외적으로 수급인이 미리 이행하지 않을 의사 표시했다면 최고 없이 해제 O [96다21393]", "도급"],
  ["084.②", "甲은 자기 소유의 X 토지에 Y 건물을 신축하기 위하여 乙과 공사대금을 2억 원으로 하는 Y 건물 공사도급계약을 체결하였다.§甲과 乙 사이의 도급계약이 乙의 채무불이행을 이유로 해제된 경우, 해제 당시 공사가 상당한 정도로 진척되어 이를 원상회복하는 것이 중대한 사회적·경제적 손실을 초래하고 완성된 부분이 甲에게 이익이 된다면 도급계약은 미완성 부분에 대하여만 실효된다.", true, "▸ 건축도급계약에서 미완성부분 있더라도 공사가 상당 정도 진척되어 그 원상회복이 중대한 사회·경제적 손실 초래하고 완성된 부분이 도급인에게 이익이 되는 경우, 수급인의 채무불이행을 이유로 도급인이 도급계약 해제해도 미완성부분만 도급계약 실효 → 수급인은 해제한 때 상태로 도급인에게 인도, 도급인은 완성부분 상당한 보수(약정총공사비에 중단 당시 공사기성고비율 곱한 금액) 지급해야 O [93다25080] → 공사대금 지급 긍정 지문만 자주 출제되다가 실효 부분 지문은 최초로 출제됨", "도급"],
  ["084.③", "甲은 자기 소유의 X 토지에 Y 건물을 신축하기 위하여 乙과 공사대금을 2억 원으로 하는 Y 건물 공사도급계약을 체결하였다.§甲과 乙 사이의 도급계약에 지체상금 약정이 포함되어 있는 경우, 甲의 지체상금 채권과 乙의 공사대금 채권은 특별한 사정이 없는 한 동시이행관계에 있다.", false, "▸ 지체상금채권과 공사대금채권은 특별한 사정 없는 한 동시이행 × [2013다81224]", "도급"],
  ["084.④", "甲은 자기 소유의 X 토지에 Y 건물을 신축하기 위하여 乙과 공사대금을 2억 원으로 하는 Y 건물 공사도급계약을 체결하였다.§乙이 완성한 Y 건물에 하자가 있어 甲이 하자보수에 갈음하여 1억 원 상당의 손해배상청구권을 행사한 경우, 특별한 사정이 없는 한 甲의 공사대금 지급채무는 이행지체에 빠지지 않고, 甲이 하자보수에 갈음한 손해배상채권을 자동채권으로 하고 乙의 공사대금 채권 2억 원을 수동채권으로 하여 상계의 의사표시를 한 다음 날 공사대금 지급채무가 이행지체에 빠진다.", true, "▸ 도급계약에서 도급인의 하자보수청구권이나 갈음한 손해배상청구권은 수급인의 공사대금채권과 동시이행관계 → 도급인이 하자보수나 손해배상청구권 보유하고 행사하는 한에서는 도급인의 공사잔대채권은 이행지체 빠지지 않고, 도급인이 하자보수나 손해배상채권을 자동채권, 공사잔대금채권을 수동채권으로 하여 상계 의사표시를 한 다음날 공사대금 지급채무가 이행지체에 빠짐 [96다7250]\n→ 그러나 95다12798 판결 등에서는 공사대금채권과 손해배상채권의 경우에는 '상응하는 금액만' 동시이행관계가 있는 것이어서, 이에 따르면 甲이 '1억 원'의 손해배상채권을 행사할 경우 甲의 공사대금채권 2억 원 중 '1억 원'만 지체에 빠지지 않는 것이므로, '상계할 때까지는 2억 원이 이행지체에 빠지지 않다가 상계를 하면 그 다음날부터 그 잔액인 1억 원(논의의 편의상 부대채권·상계적상일은 불고려)에 비로소 지체가 발생한다는 취지'의 위 판례와 서로 일관되지 않는 측면이 있음(私見)", "도급"],
  ["084.⑤", "甲은 자기 소유의 X 토지에 Y 건물을 신축하기 위하여 乙과 공사대금을 2억 원으로 하는 Y 건물 공사도급계약을 체결하였다.§乙이 완성한 Y 건물에 중대한 하자가 있고, 이로 인하여 Y 건물이 무너질 위험성이 있어 보수가 불가능하고 다시 건축할 수밖에 없다면, 특별한 사정이 없는 한 甲은 Y 건물을 철거하고 다시 건축하는 데 드는 비용 상당액을 하자로 인한 손해배상으로 청구할 수 있다.", true, "▸ 완성된 건물에 중대한 하자가 있어 무너질 위험성 있고 보수 불가능하여 다시 건축할 수밖에 없다면 철거 및 재건축 비용 상당액 손해배상 O [2014다31691]", "도급"],
  ["085.③", "甲이 자신이 소유하는 X토지 위에 Y건물을 신축하기 위하여 乙과 건축도급계약을 체결하였다.§乙이 공사를 완공하지 못한 채 건축도급계약이 해제되어 기성고에 따른 공사비를 乙에게 정산하여야 할 경우, 甲은 乙이 공사를 중단할 당시를 기준으로 乙이 실제로 지출한 비용을 지급하여야 한다.", false, "▸ 건축도급계약에서 미완성부분 있더라도 공사가 상당 정도 진척되어 그 원상회복이 중대한 사회·경제적 손실 초래하고 완성된 부분이 도급인에게 이익이 되는 경우, 수급인의 채무불이행을 이유로 도급인이 도급계약 해제해도 미완성부분만 도급계약 실효 → 수급인은 해제한 때 상태로 도급인에게 인도, 도급인은 완성부분 상당한 보수, 즉 약정총공사비에 중단 당시 기성고비율 곱한 금액 지급해야 O, 실제 지출한 비용 × [93다25080]", "도급"],
  ["086.ㄷ", "甲 건설회사는 2013. 1. 2. 乙 유통회사에게 甲 회사 소유인 X 토지를 대금 10억 원에 매도하고 계약금 1억 원을 지급받았다. 그 매매계약에서 \"매수인은 중도금 지급시까지 계약금을 포기하고 해약할 수 있고, 매도인은 그때까지 계약금의 배액을 지급하고 해약할 수 있다.\"라고 약정되었다. 같은 날 甲 회사는 乙 회사로부터 Y 토지 지상에 유통시설 신축공사를 도급받았는데, 그 계약에서 도급대금은 6억 원, 공사기간은 2013. 1. 11.부터 같은 해 11. 10.까지 10개월로 정하였다. 위 도급계약에서는 \"수급인은 공사가 지체될 경우 도급인에게 지체된 1일당 도급대금의 1,000분의 1의 비율에 의한 지체상금을 지급한다.\"라고 약정되었다. 甲 회사가 유통시설 신축공사를 시작하였으나 2013. 5.초경 자금사정 악화로 인하여 공사를 중단하였다.§甲 회사가 공사를 중단할 당시까지 투입한 공사비용은 2억 원이고 미시공 부분을 완성할 때까지 추가로 소요될 공사비용은 3억 원으로 추정되었다. 미완성 건축물을 철거하는 경우 중대한 사회적, 경제적 손실을 초래하고 완성된 부분이 乙 회사에게 이익이 된다고 판단되었다. 乙 회사가 미완성 건축물을 인도받으면서 甲 회사에게 지급하여야 할 도급대금은 2억 4,000만 원이다.", true, "▸ 약정총공사비는 총 6억 원이고, 중단 당시 기성고율은 40%(= 중단 당시 투입비용 2억 / 총 투입 예정 비용 5억 × 100) → 수급인이 받을 수 있는 보수는 2억 4,000만원(= 6억 × 40/100)\n▸ 건축도급계약에서 미완성부분 있더라도 공사가 상당 정도 진척되어 그 원상회복이 중대한 사회·경제적 손실 초래하고 완성된 부분이 도급인에게 이익이 되는 경우, 수급인의 채무불이행을 이유로 도급인이 도급계약 해제해도 미완성부분만 도급계약 실효 → 수급인은 해제한 때 상태로 도급인에게 인도, 도급인은 완성부분 상당한 보수, 즉 약정총공사비에 중단 당시 기성고비율 곱한 금액 지급해야 O, 실제 지출한 비용 × [93다25080]", "도급"],
  ["SS9.ㄱ", "위임계약 당사자 일방이 상대방의 채무불이행을 이유로 위임계약 해지의 의사표시를 하였는데 법정해지의 요건이 갖추어지지 않은 경우, 특별한 사정이 없는 한 위임계약의 임의해지의 효력이 인정되지 않는다.", false, "▸ 위임계약 당사자가 상대방의 채무불이행을 이유로 해지하였으나 실제로는 그 해지요건 갖추지 못했더라도 689조 1항 임의해지 효력 O [2012다71411]", "도급"],
  ["SS9.ㄴ", "도급인이 수급인의 채무불이행을 이유로 도급계약 해제의 의사표시를 하였는데 법정해제의 요건을 갖추지 못한 경우, 특별한 사정이 없는 한 일의 완성 전의 도급인의 해제권에 관한「민법」제673조에 따른 임의해지의 효력이 인정되지 않는다.", true, "▸ 도급인이 수급인의 채무불이행 이유로 도급계약 해제 의사표시 했으나 실제로는 채무불이행 해제 요건 갖추지 못한 경우, 위 의사표시에 673조 임의해제 의사 × ∵ 채무불이행 해제는 손해배상 청구하고 673조 해제는 손해배상을 해줘야 하므로 도급인의 의사 다름, 수급인은 채무불이행 없으므로 해제 무효라고 믿고 일 계속했다가 673조 해제되면 불측 손해 [2022다246757]\n→ 위 두 판례의 차이점 비교를 강조했는데 실제 두 지문을 나란히 출제하였음", "도급"],
  ["SS9.ㄷ", "수임인이 위임사무를 처리하는 과정에서 선관주의의무를 위반한 사실이 있더라도, 그 후 수임인이 위임사무 처리를 위해 비용을 지출하였고, 해당 비용의 지출 과정에서 수임인이 선량한 관리자로서의 주의를 다하였다면, 수임인은 선행 선관주의의무 위반과 상당인과관계 있는 비용 증가에 대하여 손해배상의무를 부담하는 것은 별론으로 하고 위임인에 대하여 필요비의 상환을 청구할 수 있다.", true, "▸ 수임인이 위임사무 처리 과정에서 선관주의의무 위반한 사실이 있더라도, 이후 수임인이 선량한 관리자 주의 다하여 위임사무 처리 위한 비용 지출했다면, 선행 선관주의 위반으로 인한 비용 증가 손해배상의무 부담은 별론, 위임인에 대하여 688조 1항의 필요비 상환 청구 O → 상환 청구 가능한 필요비는 수임인이 선관주의 다하여 필요하다고 판단하여 지출한 비용 O, 위임인에게 실익 발생 여부나 위임인의 목적 달성 여부는 불문 [2004다69420, 2023다294470]", "도급"],
  ["SS10.ㄱ", "甲은 자기 소유의 X 토지 위에 건물을 신축하기 위하여 乙과 공사대금 10억 원으로 하는 도급계약을 체결하였고, 乙은 건물의 축조공사를 맡기는 하도급계약을 丙과 체결하였다. 甲과 乙은 완성된 건물의 소유권 귀속에 관한 합의를 하지 않았고, 건축에 필요한 노력과 재료는 乙이 전적으로 부담하였다. 丙은 건축에 필요한 주요 자재를 1억 원에 丁으로부터 공급받기로 하는 소유권유보부 매매계약을 丁과 체결하고 丁으로부터 인도받은 건축자재를 가지고 Y건물을 완공하였다. 지급기일이 도과하였음에도 甲과 乙은 각자의 공사대금을 지급하지 않았고 丙은 丁에게 매매대금을 지급하지 않았다.§乙은 甲으로부터 공사대금을 전부 지급받을 때까지 Y 건물에 대한 유치권을 행사할 수 있다.", false, "▸ 수급인의 재료와 노력으로 건축된 건물에 대해 수급인은 유치권 × ∵ 수급인이 원시취득하여 소유. 유치권은 타물권인 점 [91다14116]\n다만 도급계약에서는 수급인이 자기 노력·재료를 들여 건물 완성해도 도급인과 수급인 사이 도급인 명의로 건축허가를 받아 소유권보존등기를 하기로 한 경우, 완성된 건물의 소유권을 도급인에게 귀속시키는 묵시적 합의 O, 완성된 건물 소유권은 원시적으로 도급인 귀속 [91다25505]\n→ 설문은 특별한 약정 없어 수급인 소유권 취득 O → 유치권 ×", "도급"],
  ["SS10.ㄴ", "甲은 자기 소유의 X 토지 위에 건물을 신축하기 위하여 乙과 공사대금 10억 원으로 하는 도급계약을 체결하였고, 乙은 건물의 축조공사를 맡기는 하도급계약을 丙과 체결하였다. 甲과 乙은 완성된 건물의 소유권 귀속에 관한 합의를 하지 않았고, 건축에 필요한 노력과 재료는 乙이 전적으로 부담하였다. 丙은 건축에 필요한 주요 자재를 1억 원에 丁으로부터 공급받기로 하는 소유권유보부 매매계약을 丁과 체결하고 丁으로부터 인도받은 건축자재를 가지고 Y건물을 완공하였다. 지급기일이 도과하였음에도 甲과 乙은 각자의 공사대금을 지급하지 않았고 丙은 丁에게 매매대금을 지급하지 않았다.§丁은 乙이 그 자재에 대한 소유권유보 사실을 알고 있는 경우에도 乙에게 부당이득에 관한 규정에 의하여 보상청구를 할 수 없다.", false, "▸ 261조 보상청구권이 인정되려면 261조 자체의 요건 외에 부당이득반환의 요건도 모두 충족되어야 → 매도인에게 소유권 유보된 자재가 제3자와 매수인 사이 도급계약 이행으로 제3자 소유 건물에 부합된 경우, 제3자가 도급계약에 제공된 자재의 소유권 유보 사실에 관하여 선의·무과실이라면, 선의취득 법리 유추적용하여 제3자가 자재 귀속 이익을 보유할 법률상 원인 O → 매도인은 제3자(도급인)를 상대로 보상청구 × [2009다15602] → 乙이 알고 있다면 丁은 乙에 대해 보상청구 O", "도급"],
  ["087.ㄱ", "甲은 건축업을 영위하는 乙 회사와 건물신축 공사계약을 체결하고 공사대금은 200억 원, 공사기간 2년, 대금지급방법은 기성고에 따라 매 4개월마다 20억 원씩 5회 지급하고, 나머지 대금 100억 원은 공사완료 후 즉시 지급하기로 약정하였다. 위 건물신축공사 계약에 따라 甲 명의로 건축허가를 받아 乙 회사가 공사를 개시하고 20개월 동안 기성고에 따라 100억 원의 공사비가 지급되었다. 모든 공정이 종료되고 그 주요 구조 부분이 약정된 대로 시공되어 건물로서 완성되었으나 건물의 일부에 하자가 발생하였다. 乙 회사는 건물에 하자가 남아 있는 상태에서 甲에게 공사대금 잔금 100억 원의 지급을 청구하였다.§예정된 공정을 완료하고 건물이 완성되었으므로 비록 하자가 있다 하더라도 공사는 완료된 것이므로 乙 회사의 甲에 대한 공사대금청구권은 발생한다.", true, "▸ 건물 신축공사 '미완성'과 '하자' 구별 기준은 공사가 도중 중단되어 예정된 최후 공정을 종료하지 못한 것은 '미완성', 당초 예정된 최후 공정까지 일단 종료하고 주요 구조 부분이 약정대로 시공되어 사회통념상 건물로서 완성되고 다만 불완전하여 보수해야 할 경우는 '완성'되었으나 '하자' 있는 경우 [97다44768]", "도급"],
