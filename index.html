// ── Firebase REST API 헬퍼 (SDK 없이 fetch로 직접 사용) ──
const FB_URL = "https://project-1720248149706690221-default-rtdb.asia-southeast1.firebasedatabase.app";

const fb = {
  // 값 읽기
  get: async (path) => {
    try {
      const r = await fetch(`${FB_URL}/${path}.json`);
      if (!r.ok) return null;
      return await r.json();
    } catch { return null; }
  },
  // 값 쓰기 (PUT: 덮어쓰기)
  set: async (path, data) => {
    try {
      await fetch(`${FB_URL}/${path}.json`, {
        method: 'PUT',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(data)
      });
    } catch {}
  },
  // 값 병합 (PATCH: 부분 업데이트)
  update: async (path, data) => {
    try {
      await fetch(`${FB_URL}/${path}.json`, {
        method: 'PATCH',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(data)
      });
    } catch {}
  },
  // 전체 목록 읽기
  list: async (path) => {
    try {
      const r = await fetch(`${FB_URL}/${path}.json`);
      if (!r.ok) return {};
      const data = await r.json();
      return data || {};
    } catch { return {}; }
  }
};

// window.storage — GitHub Pages에서는 localStorage로 폴백
window.storage = window.storage || (() => {
  const PREFIX = 'qhub_';
  return {
    get: async (key) => {
      try {
        const v = localStorage.getItem(PREFIX + key);
        return v !== null ? { key, value: v } : null;
      } catch { return null; }
    },
    set: async (key, value) => {
      try {
        localStorage.setItem(PREFIX + key, value);
        return { key, value };
      } catch { return null; }
    },
    delete: async (key) => {
      try { localStorage.removeItem(PREFIX + key); return { key, deleted: true }; } catch { return null; }
    },
    list: async (prefix) => {
      try {
        const keys = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith(PREFIX + (prefix||''))) {
            keys.push(k.slice(PREFIX.length));
          }
        }
        return { keys };
      } catch { return { keys: [] }; }
    }
  };
})();

// ── 헬퍼 ─────────────────────────────────────────────
const TOPIC_ICONS = {
  "계약의종류·성립":"📝","동시이행의항변권":"⚖","위험부담":"⚠",
  "제3자를위한계약":"🤝","해제":"🔓","증여":"🎁","매매일반효력":"🏷",
  "매도인의담보책임":"🛡","민법상의임대차":"🏠","주택임대차보호법":"🏡",
  "상가건물임대차보호법":"🏢","도급":"🔨","기타전형계약":"📋",
  "사무관리":"📂","부당이득":"💸","일반불법행위":"⚡","특수불법행위":"🚗",
  "채권의목적":"⚖","채무불이행":"⚡","손해배상":"💰","채권자지체":"⏰","채권자대위권":"🔗","채권자취소권":"✂","채권양도":"📤","채무인수":"📥","변제":"✅","대물변제":"🔄","상계":"↔","분할·불가분채권관계":"🔀","연대채무":"👥","보증채무":"🛡"};

// ── 메인 앱 ───────────────────────────────────────────
function App() {
  // ── 로그인/세션 상태
  const [uid,    setUid]    = useState(null);     // 현재 사용자 ID
  const [isAdmin,setIsAdmin]= useState(false);

  // ── 화면 상태
  const [screen, setScreen] = useState("hub");    // hub | quiz | archive | admin
  const [activeModule, setActiveModule] = useState(null); // 현재 선택된 모듈

  // ── 퀴즈 설정
  const [cfgRound,  setCfgRound]  = useState(1);
  const [cfgMode,   setCfgMode]   = useState("all");
  const [cfgTopics, setCfgTopics] = useState([]);

  // ── 퀴즈 진행
  const [inQuiz,   setInQuiz]   = useState(false);
  const [queue,    setQueue]    = useState([]);
  const [qidx,     setQidx]     = useState(0);
  const [answered, setAnswered] = useState(null);
  const [userAns,  setUserAns]  = useState(null);
  const [showExp,  setShowExp]  = useState(false);
  const [sessCor,  setSessCor]  = useState(0);
  const [sessErr,  setSessErr]  = useState(0);
  const [sessMark, setSessMark] = useState(0);
  const [done,     setDone]     = useState(false);
  const [label,    setLabel]    = useState("");

  // ── 스토리지 (모듈별 회독별)
  const [wrongMap,  setWrongMap]  = useState({});
  const [markedMap, setMarkedMap] = useState({});
  const [progMap,   setProgMap]   = useState({});

  // ── 아카이브
  const [archExp,     setArchExp]     = useState({});
  const [archFilter,  setArchFilter]  = useState("wrong");

  // ── 피드백
  const [fbOpen,    setFbOpen]    = useState(false);
  const [fbType,    setFbType]    = useState("오류 제보");
  const [fbText,    setFbText]    = useState("");
  const [fbList,    setFbList]    = useState([]);  // 현재 문항 피드백
  const [fbLoading, setFbLoading] = useState(false);
  const [archRound,   setArchRound]   = useState(1);
  const [awWrongMap,  setAwWrongMap]  = useState({});
  const [awMarkMap,   setAwMarkMap]   = useState({});

  // ── 이어풀기 세션
  const [savedSession, setSavedSession] = useState(null);

  // ── 관리자
  const [adminUsers,  setAdminUsers]  = useState([]);
  const [adminSearch, setAdminSearch] = useState("");
  const [adminResult, setAdminResult] = useState(null);

  // ── 테마 (dark / light)
  const [theme, setTheme] = React.useState(() => {
    try { return localStorage.getItem('quiz_theme') || 'dark'; } catch { return 'dark'; }
  });
  React.useEffect(() => {
    document.documentElement.classList.toggle('light', theme === 'light');
    try { localStorage.setItem('quiz_theme', theme); } catch {}
  }, [theme]);

  // ── 문제 데이터 로딩 상태
  const [dataLoaded, setDataLoaded] = React.useState(false);
  useEffect(() => {
    fetch('./questions.json')
      .then(r => r.json())
      .then(data => { window.QUESTIONS_DATA = data; setDataLoaded(true); })
      .catch(() => setDataLoaded(true));
  }, []);

  // ── 초기화: 로컬스토리지에서 마지막 uid 복원
  useEffect(() => {
    const saved = localStorage.getItem("hub_last_uid") || "";
    if (saved) tryLogin(saved, true);
  }, []);

  // ── 스토리지 저장 헬퍼
  const sw = async (key, val) => { try { await window.storage.set(key, JSON.stringify(val)); } catch {} };
  const gr = async (key, fallback) => { try { const r = await window.storage.get(key); return r ? JSON.parse(r.value) : fallback; } catch { return fallback; } };

  // ── 로그인
  async function tryLogin(id, silent=false) {
    if (!id.trim()) return;
    const isAdm = id === ADMIN_ID;
    setUid(id);
    setIsAdmin(isAdm);
    localStorage.setItem("hub_last_uid", id);

    // 접속 시각 갱신 (PIN 로그인에서 이미 info 설정됨, 여기서는 lastSeen만 갱신)
    if (!isAdm) {
      const safeId = id.replace(/[.#$\[\]]/g, '_');
      try {
        const existing = await fb.get(`users/${safeId}/info`);
        if (existing) {
          await fb.set(`users/${safeId}/info`, {
            ...existing,
            lastSeen: Date.now(),
            lastDate: new Date().toLocaleDateString('ko-KR')
          });
        }
      } catch {}
      await sw(K_UTIME(id), Date.now());
    }

    // 첫 번째 활성 모듈 설정
    const firstMod = MODULE_REGISTRY.find(m => m.status === "active");
    if (firstMod) setActiveModule(firstMod.id);

    setScreen("hub");
  }

  // ── 모듈 스토리지 로드
  async function loadModuleData(mid) {
    if (!uid) return;
    const sid = toSafeId(uid);
    const wm = {}, mm = {}, pm = {}, awm = {}, amm = {};

    for (const r of ROUNDS) {
      // Firebase 우선, 없으면 localStorage 폴백
      const fbW = await fb.get(fbPath.wrong(sid,mid,r));
      wm[r] = new Set(fbW || await gr(K_WRONG(uid,mid,r), []));

      const fbM = await fb.get(fbPath.marked(sid,mid,r));
      mm[r] = new Set(fbM || await gr(K_MARKED(uid,mid,r), []));

      const fbP = await fb.get(fbPath.prog(sid,mid,r));
      const lsP = await gr(K_PROG(uid,mid,r), {answered:[],correct:[],wrong:[]});
      const p   = fbP || lsP;
      pm[r] = { answered:new Set(p.answered||[]), correct:new Set(p.correct||[]), wrong:new Set(p.wrong||[]) };

      const fbAW = await fb.get(fbPath.awWrong(sid,mid,r));
      awm[r] = new Set(fbAW || await gr(K_AW_WRONG(uid,mid,r), []));

      const fbAM = await fb.get(fbPath.awMark(sid,mid,r));
      amm[r] = new Set(fbAM || await gr(K_AW_MARK(uid,mid,r), []));
    }

    setWrongMap(wm); setMarkedMap(mm); setProgMap(pm);
    setAwWrongMap(awm); setAwMarkMap(amm);

    // 아카이브 회독
    const fbAR = await fb.get(fbPath.archRound(sid,mid));
    const arVal = fbAR ?? await gr(K_AW_ROUND(uid,mid), 1);
    setArchRound(arVal);

    // 세션
    const fbSess = await fb.get(fbPath.session(sid,mid));
    const lsSess = await gr(K_SESSION(uid,mid), null);
    setSavedSession(fbSess || lsSess);

    // 수정본 (공유)
    const edits = await gr(K_EDITS(mid), {});
    setUserEdits(edits);
  }

  useEffect(() => { if (uid && activeModule) loadModuleData(activeModule); }, [uid, activeModule]);

  // 수정본 저장 (공유: 모든 유저에게 적용)
  const saveEdit = async (qid, q, e) => {
    const next = {...userEdits};
    if (q === null) {
      delete next[qid];
    } else {
      next[qid] = { ...(next[qid]||{}), question: q, explanation: e };
    }
    setUserEdits(next);
    await window.storage.set(K_EDITS(activeModule), JSON.stringify(next));
  };

  // 현재 문항에 수정본 적용
  const applyEdit = (q) => {
    if (!q) return q;
    const ed = userEdits[q.id];
    if (!ed) return q;
    return { ...q, question: ed.question ?? q.question, explanation: ed.explanation ?? q.explanation };
  };

  // 이중 저장: Firebase(공유) + localStorage(빠른 읽기)
  const _fbsw = (path, data) => { fb.set(path, data); }; // fire-and-forget

  const saveWrong = (r,s) => {
    const arr = [...s];
    sw(K_WRONG(uid,activeModule,r), arr);
    _fbsw(fbPath.wrong(toSafeId(uid),activeModule,r), arr);
  };
  const saveMarked = (r,s) => {
    const arr = [...s];
    sw(K_MARKED(uid,activeModule,r), arr);
    _fbsw(fbPath.marked(toSafeId(uid),activeModule,r), arr);
  };
  const saveProg = (r,p) => {
    const obj = {answered:[...p.answered],correct:[...p.correct],wrong:[...p.wrong]};
    sw(K_PROG(uid,activeModule,r), obj);
    _fbsw(fbPath.prog(toSafeId(uid),activeModule,r), obj);
  };
  const saveAwWrong = (r,s) => {
    const arr = [...s];
    sw(K_AW_WRONG(uid,activeModule,r), arr);
    _fbsw(fbPath.awWrong(toSafeId(uid),activeModule,r), arr);
  };
  const saveAwMark = (r,s) => {
    const arr = [...s];
    sw(K_AW_MARK(uid,activeModule,r), arr);
    _fbsw(fbPath.awMark(toSafeId(uid),activeModule,r), arr);
  };
  const saveArchRound = (r) => {
    sw(K_AW_ROUND(uid,activeModule), r);
    _fbsw(fbPath.archRound(toSafeId(uid),activeModule), r);
  };
  const saveSession = (sess) => {
    sw(K_SESSION(uid,activeModule), sess || null);
    _fbsw(fbPath.session(toSafeId(uid),activeModule), sess || null);
  };

  // ── 퀴즈 시작
  function launchQuiz(round, mode, topics, resumeData=null) {
    const mod = MODULE_REGISTRY.find(m => m.id === activeModule);
    if (!mod) return;
    const all = mod.getData();
    let pool, lbl;

    // 아카이브 전용 회독(aw_*): archRound 기준
    if (mode === "aw_wrong") {
      const r = archRound;
      pool = all.filter(q => (awWrongMap[r]||new Set()).has(q.id));
      if (!pool.length) return;
      lbl = `아카이브 ${r}회독 · 오답 (${pool.length}문제)`;
    } else if (mode === "aw_mark") {
      const r = archRound;
      pool = all.filter(q => (awMarkMap[r]||new Set()).has(q.id));
      if (!pool.length) return;
      lbl = `아카이브 ${r}회독 · 헷갈림 (${pool.length}문제)`;
    } else if (mode === "aw_all") {
      const r = archRound;
      const wids = awWrongMap[r]||new Set(), mids = awMarkMap[r]||new Set();
      pool = all.filter(q => wids.has(q.id)||mids.has(q.id));
      if (!pool.length) return;
      lbl = `아카이브 ${r}회독 · 전체 (${pool.length}문제)`;
    } else if (mode === "wrong") {
      pool = all.filter(q => (wrongMap[round]||new Set()).has(q.id));
      if (!pool.length) return;
      lbl = `${round}회독 오답 (${pool.length}문제)`;
    } else if (mode === "marked") {
      pool = all.filter(q => (markedMap[round]||new Set()).has(q.id));
      if (!pool.length) return;
      lbl = `${round}회독 헷갈림 (${pool.length}문제)`;
    } else if (mode === "rnd100") {
      pool = shuffle([...all]).slice(0, 100);
      lbl = `${round}회독 무작위 100문제`;
    } else if (mode === "topic") {
      pool = topics.length > 0 ? all.filter(q => topics.includes(q.topic)) : [...all];
      lbl = `${round}회독 · ${topics.length > 0 ? topics.map(t=>mod.topics.find(x=>x.key===t)?.label||t).join(', ') : '전체'} (${pool.length}문제)`;
    } else {
      pool = [...all];
      lbl = `${round}회독 전체 ${all.length}문제`;
    }

    // 이어풀기: resumeData가 있으면 복원, 없으면 섞어서 시작
    let finalQueue, startIdx;
    if (resumeData && resumeData.mode === mode && resumeData.round === round) {
      // 저장된 큐 순서 복원 (ID 배열로 저장 → 실제 문제 객체로 매핑)
      const qMap = Object.fromEntries(all.map(q=>[q.id, q]));
      const restored = (resumeData.queueIds||[]).map(id=>qMap[id]).filter(Boolean);
      if (restored.length > 0) {
        finalQueue = restored;
        startIdx = resumeData.qidx || 0;
        lbl = resumeData.label || lbl;
      } else {
        finalQueue = shuffle(pool);
        startIdx = 0;
      }
    } else {
      finalQueue = shuffle(pool);
      startIdx = 0;
    }

    // 세션 저장
    const sessData = {
      mode, round, topics,
      queueIds: finalQueue.map(q=>q.id),
      qidx: startIdx,
      label: lbl,
      module: activeModule,
    };
    saveSession(sessData);
    setSavedSession(sessData);

    setQueue(finalQueue);
    setQidx(startIdx); setAnswered(null); setUserAns(null); setShowExp(false);
    setSessCor(0); setSessErr(0); setSessMark(0);
    setDone(false); setLabel(lbl); setInQuiz(true); setScreen("quiz");
  }

  function exitQuiz() {
    // 종료 시 현재 위치 저장 (qidx 갱신된 상태 유지 → 이어풀기용)
    setInQuiz(false); setDone(false); setScreen("quiz");
  }

  function handleAnswer(choice) {
    if (answered !== null) return;
    const cur = queue[qidx];
    const correct = choice === cur.answer;
    setUserAns(choice); setAnswered(correct ? "ok" : "er"); setShowExp(false);
    const r = cfgRound;
    const np = {
      answered: new Set([...(progMap[r]?.answered||[]), cur.id]),
      correct:  new Set([...(progMap[r]?.correct||[])]),
      wrong:    new Set([...(progMap[r]?.wrong||[])])
    };
    const nw = new Set(wrongMap[r]||[]);
    if (correct) { np.correct.add(cur.id); setSessCor(p=>p+1); }
    else { np.wrong.add(cur.id); nw.add(cur.id); setSessErr(p=>p+1); }
    setProgMap(pm=>({...pm,[r]:np}));
    setWrongMap(wm=>({...wm,[r]:nw}));
    saveProg(r,np); saveWrong(r,nw);

    // 아카이브 회독용 오답 추가 (메인 오답은 아카이브 현재 회독에도 자동 적재)
    if (!correct) {
      const ar = archRound;
      const nawm = new Set(awWrongMap[ar]||[]);
      nawm.add(cur.id);
      setAwWrongMap(m=>({...m,[ar]:nawm}));
      saveAwWrong(ar, nawm);
    }
  }

  function toggleMark() {
    const cur = queue[qidx]; const r = cfgRound;
    const nm = new Set(markedMap[r]||[]);
    if (nm.has(cur.id)) { nm.delete(cur.id); setSessMark(p=>Math.max(0,p-1)); }
    else { nm.add(cur.id); setSessMark(p=>p+1); }
    setMarkedMap(mm=>({...mm,[r]:nm}));
    saveMarked(r,nm);

    // 아카이브 회독용 헷갈림도 동기화
    const ar = archRound;
    const namm = new Set(awMarkMap[ar]||[]);
    if (nm.has(cur.id)) namm.add(cur.id); else namm.delete(cur.id);
    setAwMarkMap(m=>({...m,[ar]:namm}));
    saveAwMark(ar, namm);
  }

  function handleNext() {
    if (qidx+1 >= queue.length) {
      setDone(true);
      saveSession(null); // 완료 시 세션 삭제
      setSavedSession(null);
    } else {
      const nextIdx = qidx+1;
      setQidx(nextIdx);
      setAnswered(null); setUserAns(null); setShowExp(false);
      // 세션 qidx 갱신
      if (savedSession) {
        const updated = {...savedSession, qidx: nextIdx};
        setSavedSession(updated);
        saveSession(updated);
      }
    }
  }

  async function resetModule() {
    if (!confirm(`${activeModule} 모듈 전체 기록을 초기화하시겠습니까?`)) return;
    for (const r of ROUNDS) {
      const np = {answered:new Set(),correct:new Set(),wrong:new Set()};
      setProgMap(pm=>({...pm,[r]:np}));
      setWrongMap(wm=>({...wm,[r]:new Set()}));
      setMarkedMap(mm=>({...mm,[r]:new Set()}));
      saveProg(r,np); saveWrong(r,new Set()); saveMarked(r,new Set());
    }
  }

  // ── 헬퍼
  const getMod   = () => MODULE_REGISTRY.find(m => m.id === activeModule);
  const getAll   = () => getMod()?.getData() || [];
  const wCnt     = r => (wrongMap[r]||new Set()).size;
  const mCnt     = r => (markedMap[r]||new Set()).size;
  const awCnt    = r => (awWrongMap[r]||new Set()).size;
  const amCnt    = r => (awMarkMap[r]||new Set()).size;
  const awTotal  = r => { const w=awWrongMap[r]||new Set(), m=awMarkMap[r]||new Set(); return new Set([...w,...m]).size; };
  const tCnt     = k => getAll().filter(q=>q.topic===k).length;
  const tWrong   = (r,k) => getAll().filter(q=>q.topic===k&&(wrongMap[r]||new Set()).has(q.id)).length;
  const TOTAL    = getAll().length;
  const getProg  = r => { const p=progMap[r]||{answered:new Set()}; return { ans:p.answered.size, pct:Math.round(p.answered.size/Math.max(TOTAL,1)*100) }; };
  const canStart = cfgMode !== "topic" || cfgTopics.length > 0;
  const startCnt = cfgMode==="all" ? TOTAL : cfgMode==="rnd100" ? 100 : cfgMode==="topic" ? getAll().filter(q=>cfgTopics.includes(q.topic)).length : cfgMode==="wrong" ? wCnt(cfgRound) : mCnt(cfgRound);
  const cur      = applyEdit(queue[qidx]);
  const curMark  = cur && (markedMap[cfgRound]||new Set()).has(cur.id);

  // 아카이브 표시
  const archItems = r => {
    const wids = wrongMap[r]||new Set(), mids = markedMap[r]||new Set();
    if (archFilter==="wrong")  return getAll().filter(q=>wids.has(q.id));
    if (archFilter==="marked") return getAll().filter(q=>mids.has(q.id)&&!wids.has(q.id));
    return getAll().filter(q=>wids.has(q.id)||mids.has(q.id));
  };

  // 관리자 유저 목록 로드
  // ── 피드백 로드 (현재 문항)
  async function loadFeedbacks(qid, mid) {
    try {
      const data = await fb.list(`feedbacks/${mid}/${qid}`);
      const items = Object.values(data||{})
        .filter(Boolean)
        .sort((a,b)=>(b.ts||0)-(a.ts||0));
      setFbList(items);
    } catch { setFbList([]); }
  }

  // ── 피드백 제출
  async function submitFeedback(qid, mid) {
    if (!fbText.trim()) return;
    setFbLoading(true);
    try {
      const key = Date.now().toString();
      await fb.set(`feedbacks/${mid}/${qid}/${key}`, {
        uid, type: fbType, text: fbText.trim(),
        ts: Date.now(),
        date: new Date().toLocaleDateString('ko-KR'),
        qid, mid,
      });
      setFbText(""); setFbOpen(false);
      loadFeedbacks(qid, mid);
    } catch(e) { alert("피드백 저장 실패: " + e.message); }
    setFbLoading(false);
  }

  // ── 피드백 전체 로드 (관리자)
  async function loadAllFeedbacks() {
    try {
      const allMods = {};
      for (const mod of MODULE_REGISTRY.filter(m=>m.status==="active")) {
        const modData = await fb.list(`feedbacks/${mod.id}`);
        const items = [];
        for (const [qid, qFbs] of Object.entries(modData||{})) {
          for (const fb_item of Object.values(qFbs||{})) {
            if (fb_item) items.push({...fb_item, qid, modLabel:mod.label});
          }
        }
        if (items.length) allMods[mod.id] = items.sort((a,b)=>(b.ts||0)-(a.ts||0));
      }
      return allMods;
    } catch { return {}; }
  }


  async function loadAdminUsers() {
    // Firebase에서 전체 유저 + 완전한 학습 통계 조회
    const fbAll = await fb.list('users');
    if (!fbAll) { setAdminUsers([]); return; }

    const users = [];
    for (const [safeId, userData] of Object.entries(fbAll)) {
      if (!userData || typeof userData !== 'object') continue;
      // info 서브키 있는 경우(신규)와 없는 경우(구버전) 모두 지원
      const info = userData.info || {};
      const id = info.id || userData.id || safeId;
      if (!id || id === ADMIN_ID) continue;
      const lastSeen = info.lastSeen || userData.lastSeen || 0;
      const lastDate = info.lastDate || userData.lastDate || '';

      const stats = userData?.stats || {};
      let total_ans=0, total_cor=0, total_wrg=0;
      const modStats = [];

      for (const mod of MODULE_REGISTRY.filter(m=>m.status==="active")) {
        const modData = stats[mod.id] || {};
        let m_ans=0, m_cor=0, m_wrg=0;
        for (const r of ROUNDS) {
          const p = modData[`prog_${r}`] || {};
          m_ans += (p.answered||[]).length;
          m_cor += (p.correct||[]).length;
          m_wrg += (p.wrong||[]).length;
        }
        total_ans+=m_ans; total_cor+=m_cor; total_wrg+=m_wrg;
        if (m_ans>0) modStats.push({mod:mod.label, ans:m_ans, cor:m_cor, wrg:m_wrg,
          pct: m_ans>0?Math.round(m_cor/m_ans*100):0});
      }
      users.push({ id, last:lastSeen, lastDate, ans:total_ans, cor:total_cor, wrg:total_wrg, modStats });
    }
    users.sort((a,b)=>(b.last||0)-(a.last||0));
    setAdminUsers(users);
  }

  async function adminSearchUser(searchId) {
    if (!searchId.trim()) return;
    const id = searchId.trim();
    const safeId = toSafeId(id);

    // Firebase에서 완전한 데이터 조회
    const userData = await fb.get(`users/${safeId}`);
    if (!userData) { setAdminResult({id, notFound:true}); return; }

    // info 서브키 있는 경우(신규)와 없는 경우(구버전) 모두 지원
    const info  = userData.info  || {};
    const stats = userData.stats || {};
    const lastSeen_ = info.lastSeen || userData.lastSeen || 0;
    const lastDate_ = info.lastDate || userData.lastDate || '';
    let total_ans=0, total_cor=0, total_wrg=0;
    const modStats = [];

    for (const mod of MODULE_REGISTRY.filter(m=>m.status==="active")) {
      const modData = stats[mod.id] || {};
      let m_ans=0, m_cor=0, m_wrg=0, m_wrg_cnt=0, m_mk_cnt=0;
      for (const r of ROUNDS) {
        const p = modData[`prog_${r}`] || {};
        m_ans += (p.answered||[]).length;
        m_cor += (p.correct||[]).length;
        m_wrg += (p.wrong||[]).length;
        m_wrg_cnt += (modData[`wrong_${r}`]||[]).length;
        m_mk_cnt  += (modData[`marked_${r}`]||[]).length;
      }
      total_ans+=m_ans; total_cor+=m_cor; total_wrg+=m_wrg;
      if (m_ans>0) modStats.push({mod:mod.label, ans:m_ans, cor:m_cor, wrg:m_wrg,
        pct:m_ans>0?Math.round(m_cor/m_ans*100):0, wrongCnt:m_wrg_cnt, markCnt:m_mk_cnt});
    }

    if (!lastSeen_ && total_ans===0) { setAdminResult({id, notFound:true}); return; }
    setAdminResult({id, last:lastSeen_, lastDate:lastDate_, ans:total_ans, cor:total_cor, wrg:total_wrg, modStats});
  }

  useEffect(() => { if (isAdmin && screen==="admin") loadAdminUsers(); }, [screen, isAdmin]);

  // ══════════════════════════════════════════

  // 데이터 로딩 중
  if (!dataLoaded) return <div className="loading">⚖ 문제 데이터 불러오는 중...</div>;

  // 로그인 전
  if (!uid) return (
    <><style>{CSS}</style>
    <LoginScreen onLogin={tryLogin} />
    </>
  );

  return (
    <><style>{CSS}</style>
    <div className="app">

      {/* 헤더 */}
      <div className="hdr">
        <div className="hdr-left">
          <div className="hdr-title">📚 3000제 퀴즈 허브</div>
          <div className="hdr-sub"><span style={{display:"inline-block",background:"#1a1a18",color:"#fff",padding:"1px 8px",borderRadius:"4px",fontWeight:700,fontSize:"11px"}}>민법 &amp; 민소법</span> 제4판: 선택형 기출 최신빈출지문</div>
        </div>

            {theme==='dark' ? '☀️' : '🌙'}
          </button>
          <span className="uid-badge">👤 {uid}</span>
          <button className="logout-btn" onClick={()=>{ setUid(null); setIsAdmin(false); localStorage.removeItem("hub_last_uid"); }}>로그아웃</button>
        </div>
      </div>

      {/* 탭 */}
      <div className="tabs">
        {[
          ["hub","모듈 선택"],
          activeModule && getMod()?.status==="active" ? ["quiz","퀴즈"] : null,

            <div style={{marginBottom:14}}>

              <div className="hub-notice">
                <span className="hub-notice-icon">📖</span>
                <span>정연석 3000제 문제를 100% 구현. 누락·오류 검수 1차 완료 후 문제 업데이트. 기타 문제 발견이나 원하는 기능은 페이지 내 피드백 기능을 이용해주세요.</span>

                            {mc>0&&<span className="module-stat" style={{color:"var(--purple)",borderColor:"rgba(188,140,255,.2)"}}>헷갈림 {mc}</span>}
                          </>
                        ) : (
                          <span className="module-stat">{mod.count||"?"} 문제</span>

                      <span className="admin-stat gold">정답률 <b>{u.ans>0?Math.round(u.cor/u.ans*100)+"%" :"-"}</b></span>
                      {(u.lastDate||u.last>0)&&<span className="admin-stat">마지막 접속 <b style={{color:"var(--gold)"}}>{u.lastDate||new Date(u.last).toLocaleDateString("ko-KR")}</b></span>}
                    </div>
                  </div>
                  {u.modStats && u.modStats.length > 0 && (
                    <div style={{display:"flex",gap:8,marginTop:6,flexWrap:"wrap",width:"100%"}}>
                      {u.modStats.map(m=>(
                        <div key={m.mod} style={{fontSize:11,background:"var(--bg)",border:"1px solid var(--bd2)",borderRadius:6,padding:"4px 10px",color:"var(--tx3)"}}>
                          <b style={{color:"var(--tx)"}}>{m.mod}</b> · 시도 {m.ans} · 정답률 {m.pct}%
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              ))}
            </div>

            {/* 수정 내역 */}
          </div>
        )}

      </div>
    </div>
    </>
  );
}


/* ── 관리자: 수정 내역 컴포넌트 ─────────────────────────── */


/* ── 로그인 화면 컴포넌트 ─────────────────────────────── */
function LoginScreen({ onLogin }) {
  const FB_BASE = "https://project-1720248149706690221-default-rtdb.asia-southeast1.firebasedatabase.app";
  const ADMIN_ID_L = "정연석";

  const [step, setStep]       = React.useState("id");   // id | pin_new | pin_check
  const [uid,  setUid]        = React.useState(localStorage.getItem("hub_last_uid")||"");
  const [pin,  setPin]        = React.useState(["","","",""])
  const [status, setStatus]   = React.useState({msg:"", type:"info"});
  const [loading, setLoading] = React.useState(false);
  const pinRefs = [React.useRef(), React.useRef(), React.useRef(), React.useRef()];

  // Firebase 단순 fetch
  const fbGet = async (path) => {
    try {
      const r = await fetch(`${FB_BASE}/${path}.json`);
      return r.ok ? await r.json() : null;
    } catch { return null; }
  };
  const fbSet = async (path, data) => {
    try {
      await fetch(`${FB_BASE}/${path}.json`, {
        method:'PUT', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(data)
      });
    } catch {}
  };

  const toSafe = id => id.replace(/[.#$\[\]]/g,'_');

  // PIN 입력 핸들러
  const handlePinInput = (i, val) => {
    if (!/^[0-9]?$/.test(val)) return;
    const next = [...pin];
    next[i] = val;
    setPin(next);
    if (val && i < 3) pinRefs[i+1].current?.focus();
  };
  const handlePinKey = (i, e) => {
    if (e.key === "Backspace" && !pin[i] && i > 0) {
      pinRefs[i-1].current?.focus();
    }
    if (e.key === "Enter") handlePinSubmit();
  };
  const pinFull = pin.join("");

  // 1단계: 아이디 확인
  const handleIdNext = async () => {
    const id = uid.trim();
    if (!id) return;
    if (!/^[a-zA-Z0-9가-힣_-]{1,20}$/.test(id)) {
      setStatus({msg:"20자 이내 한글/영문/숫자/_-만 가능합니다.", type:"er"}); return;
    }
    // 관리자는 PIN 없이 바로
    if (id === ADMIN_ID_L) {
      // 관리자도 PIN 확인
      setPin(["","","",""]);
      setStep("pin_check");
      setStatus({msg:"관리자 PIN을 입력해주세요.", type:"info"});
      setTimeout(()=>pinRefs[0].current?.focus(), 100);
      return;
    }

    setLoading(true);
    setStatus({msg:"확인 중...", type:"info"});
    const safeId = toSafe(id);
    const existing = await fbGet(`users/${safeId}/info`);
    setLoading(false);

    if (existing && existing.pin) {
      // 기존 유저 → PIN 확인
      setPin(["","","",""]);
      setStep("pin_check");
      setStatus({msg:"등록된 PIN을 입력해주세요.", type:"info"});
      setTimeout(()=>pinRefs[0].current?.focus(), 100);
    } else {
      // 신규 유저 → PIN 등록
      setPin(["","","",""]);
      setStep("pin_new");
      setStatus({msg:"사용할 4자리 PIN을 설정해주세요.", type:"info"});
      setTimeout(()=>pinRefs[0].current?.focus(), 100);
    }
  };

  // 2단계: PIN 제출
  const handlePinSubmit = async () => {
    if (pinFull.length !== 4) {
      setStatus({msg:"4자리를 모두 입력해주세요.", type:"er"}); return;
    }
    const id = uid.trim();
    const safeId = toSafe(id);
    setLoading(true);

    if (step === "pin_new") {
      // 신규: PIN 저장 후 로그인
      await fbSet(`users/${safeId}/info`, {
        id, pin: pinFull,
        lastSeen: Date.now(),
        lastDate: new Date().toLocaleDateString('ko-KR')
      });
      setStatus({msg:"PIN 설정 완료!", type:"ok"});
      setLoading(false);
      setTimeout(()=>onLogin(id), 500);
    } else {
      // 기존: PIN 검증 (관리자는 고정 PIN)
      const ADMIN_PIN = "2027";
      const isAdminUser = uid.trim() === ADMIN_ID_L;
      const existing = isAdminUser ? null : await fbGet(`users/${safeId}/info`);
      const correctPin = isAdminUser ? ADMIN_PIN : existing?.pin;
      if (correctPin === pinFull) {
        // 접속시간 갱신 (관리자 제외)
        if (!isAdminUser && existing) {
          await fbSet(`users/${safeId}/info`, {
            ...existing,
            lastSeen: Date.now(),
            lastDate: new Date().toLocaleDateString('ko-KR')
          });
        }
        setStatus({msg:"로그인 성공!", type:"ok"});
        setLoading(false);
        setTimeout(()=>onLogin(id), 300);
      } else {
        setStatus({msg:"PIN이 일치하지 않습니다.", type:"er"});
        setPin(["","","",""]);
        setLoading(false);
        setTimeout(()=>pinRefs[0].current?.focus(), 50);
      }
    }
  };

  return (
    <div className="login-wrap">
      <div className="login-box">
        <div className="login-header">
          <div className="login-logo">📚 3000제 퀴즈 허브</div>
          <div className="login-title"><span style={{display:"inline-block",background:"#1a1a18",color:"#fff",padding:"2px 10px",borderRadius:"5px",fontWeight:700,letterSpacing:"1px"}}>민법 &amp; 민소법</span><br/>제4판 선택형 기출 최신빈출지문</div>
          <div className="login-desc">아이디 + PIN으로 어느 기기에서든<br/>학습 기록이 이어집니다.</div>
        </div>
        <div className="login-card">
          {/* 단계 표시 */}
          <div className="login-step">
            {step==="id" ? "① 아이디 입력" : step==="pin_new" ? "② PIN 설정 (신규)" : "② PIN 확인"}
          </div>

          {/* 아이디 입력 */}
          {step === "id" && (
            <>
              <div className="login-label">아이디</div>
              <input className="login-input" value={uid}
                placeholder="한글/영문/숫자 20자 이내"
                onChange={e=>{ setUid(e.target.value); setStatus({msg:"",type:"info"}); }}
                onKeyDown={e=>e.key==="Enter"&&handleIdNext()}
                autoFocus />
              <div className={`pin-status ${status.type}`}>{status.msg}</div>
              <button className="login-btn" onClick={handleIdNext} disabled={loading}>
                {loading ? "확인 중..." : "다음 →"}
              </button>
            </>
          )}

          {/* PIN 입력 */}
          {(step === "pin_new" || step === "pin_check") && (
            <>
              <div className="login-label" style={{textAlign:"center"}}>
                👤 {uid}
              </div>
              <div className="pin-row">
                {[0,1,2,3].map(i=>(
                  <input key={i} ref={pinRefs[i]}
                    className="pin-digit" type="password"
                    maxLength={1} value={pin[i]}
                    onChange={e=>handlePinInput(i, e.target.value)}
                    onKeyDown={e=>handlePinKey(i,e)} />
                ))}
              </div>
              <div className={`pin-status ${status.type}`}>{status.msg}</div>
              <button className="login-btn" onClick={handlePinSubmit} disabled={loading||pinFull.length!==4}>
                {loading ? "처리 중..." : step==="pin_new" ? "PIN 설정 완료" : "로그인"}
              </button>
              <button style={{width:"100%",background:"none",border:"none",color:"var(--tx3)",
                fontSize:12,cursor:"pointer",marginTop:8,padding:"6px 0"}}
                onClick={()=>{ setStep("id"); setPin(["","","",""]); setStatus({msg:"",type:"info"}); }}>
                ← 아이디 다시 입력
              </button>
            </>
          )}

          <div className="login-hint" style={{marginTop:12}}>
            {step==="id" ? "처음 입력하는 아이디는 자동으로 계정이 생성됩니다." :
             step==="pin_new" ? "PIN은 4자리 숫자입니다. 잊지 않도록 메모해두세요." :
             "PIN을 잊으셨으면 관리자에게 문의해주세요."}
          </div>
        </div>
      </div>
    </div>
  );
}


function AdminFeedbacks({ loadAllFeedbacks }) {
  const [data, setData] = React.useState({});
  const [loading, setLoading] = React.useState(false);
  const [filter, setFilter] = React.useState("전체");

  async function load() {
    setLoading(true);
    const d = await loadAllFeedbacks();
    setData(d);
    setLoading(false);
  }
  React.useEffect(()=>{ load(); }, []);

  const allItems = Object.values(data).flat();
  const filtered = filter==="전체" ? allItems : allItems.filter(f=>f.type===filter);
  const total = allItems.length;

  return (
    <div className="card" style={{marginTop:16}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
        <div className="card-title" style={{marginBottom:0}}>💬 피드백 목록 ({total}건)</div>
        <button className="act-btn" style={{flex:"none",padding:"6px 14px",fontSize:12}} onClick={load}>🔄 새로고침</button>
      </div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:14}}>
        {["전체","오류 제보","정답 이의","해설 보완","기능 요청","기타"].map(t=>(
          <button key={t}
            style={{padding:"4px 12px",borderRadius:14,border:"1px solid var(--bd)",
              background:filter===t?"var(--gold)":"var(--sf2)",
              color:filter===t?"#0d1117":"var(--tx3)",
              fontSize:11,cursor:"pointer",fontWeight:filter===t?700:400}}
            onClick={()=>setFilter(t)}>{t}</button>
        ))}
      </div>
      {loading ? (
        <div style={{textAlign:"center",padding:20,color:"var(--tx3)"}}>불러오는 중...</div>
      ) : filtered.length===0 ? (
        <div style={{textAlign:"center",padding:20,color:"var(--tx3)"}}>피드백이 없습니다.</div>
      ) : filtered.map((f,i)=>(
        <div key={i} className="fb-admin-item">
          <div className="fb-admin-meta">
            <span className="fb-admin-no">No.{f.qid}</span>
            <span className="fb-admin-type">{f.type}</span>
            <span className="fb-admin-uid">👤 {f.uid}</span>
            <span className="fb-admin-date">{f.date}</span>
          </div>
          <div className="fb-admin-q">{(f.mid||"")} · 문항 {f.qid}</div>
          <div className="fb-admin-body">{f.text}</div>
        </div>
      ))}
    </div>
  );
}
