["005.②", "★ 법정대리인의 동의 없이 신용구매계약을 체결한 미성년자가 사후에 그 동의 없음을 이유로 신용구매계약을 취소하는 것은 신의칙에 위배된다.", false, "▸ 미성년자 체결한 신용카드이용계약 취소는 가능 — 신용구매계약 취소는 별개 문제인데, 성년에 가깝고 경제활동으로 소득 있는 미성년자가 월 소득 범위 내 비교적 소규모의 일상적 거래행위 했다면, 얻고 있던 소득에 대해서는 부모의 6조 묵시적 처분허락 있으므로 취소 ✕ — 제한능력자 규정은 강행규정이므로 '신의칙'을 이유로 취소 배척할 수는 ✕ [2005다71659]", "신의성실의원칙"],
["04", "★ 신의성실의 원칙에 반하는 것 또는 권리남용은 강행규정에 위배되는 것이므로 당사자의 주장이 없더라도 법원은 직권으로 판단할 수 있다.", true, "▸ [민소] 신의성실원칙 위반, 권리남용은 강행규정 위배로서 당사자 주장 없더라도 법원은 직권 판단 ○ [94다42129]", "신의성실의원칙"],
["006.ㄱ", "★ 태아는 살아서 출생하는 한 태아인 동안에도 증여를 받을 수 있다.", false, "▸ 증여에 관하여는 태아의 권리능력을 인정하는 개별규정이 없으므로 개별주의를 취하는 우리 민법 하에서 태아는 증여를 받을 수 ✕", "권리능력·행위능력"],
["007.ㄱ", "■보충 「민법」 제921조에 따라 미성년자의 법정대리인으로 특별대리인을 선임하는 경우에 법원은 특별대리인이 처리할 법률행위를 특정하여 이를 심판 주문에 표시하는 것이 원칙이다.", true, "▸ 특별대리인선임신청서에는 선임되는 특별대리인이 처리할 법률행위 특정하여 적시해야 하고, 법원도 선임 심판시 이를 주문에 표시하는 것이 원칙 — 특별대리인이 법률행위를 무엇이든 처리할 수 있도록 포괄적 권한 수여하는 심판 ✕ — 제921조 특별대리인 제도의 친권 남용 방지 및 미성년 이익 보호 취지상 특별대리인은 이해상반되는 특정 법률행위에 관하여 개별적 선임되어야 하므로 [96다1139] → 정답결정력 없음", "권리능력·행위능력"],
["007.ㄴ", "법정대리인이 미성년자에게 특정한 영업을 허락한 경우에 법정대리인은 그 허락을 취소할 수 없다.", false, "▸ 제8조(영업의 허락) ① 미성년자가 법정대리인으로부터 허락을 얻은 특정한 영업에 관하여는 성년자와 동일한 행위능력이 있다. ② 법정대리인은 전항의 허락을 취소 또는 제한할 수 있다. 그러나 선의의 제삼자에게 대항하지 못한다.", "권리능력·행위능력"],
["007.ㄷ", "미성년자가 성폭력을 당한 경우에 이로 인한 손해배상청구권의 소멸시효는 그가 성년이 될 때까지 진행하지 않는다.", true, "▸ 제766조(손해배상청구권의 소멸시효) ③ 미성년자가 성폭력, 성추행, 성희롱, 그 밖의 성적(性的) 침해를 당한 경우에 이로 인한 손해배상청구권의 소멸시효는 그가 성년이 될 때까지는 진행되지 아니한다. [신설 2020.10.20]", "권리능력·행위능력"],
["008.①", "★ 甲이 乙의 의사에 반함에도 불구하고 乙과의 공동명의로 丙을 대리하는 법률행위를 하였다면, 그 법률행위는 상대방의 선의 여부를 불문하고 효력이 없다.", false, "▸ 제920조의2(공동친권자의 일방이 공동명의로 한 행위의 효력) 부모가 공동으로 친권을 행사하는 경우 부모의 일방이 공동명의로 자를 대리하거나 자의 법률행위에 동의한 때에는 다른 일방의 의사에 반하는 때에도 그 효력이 있다. 그러나 상대방이 악의인 때에는 그러하지 아니한다. → 상대방 선의이면 유효", "권리능력·행위능력"],
["008.②", "★ 丙이 甲과 乙의 동의 없이 신용카드회사 戊와 신용카드 이용계약을 체결하고 발급받은 카드를 이용하여 그로부터 구입한 물품의 대금을 戊가 지급한 이후에, 甲과 乙이 戊와의 신용카드 이용계약을 취소하였으나 근와의 매매계약은 취소하지 않고 구입한 물품을 丙이 모두 소비하였다면, 丙은 戊에게 부당이득반환의무를 부담하지 않는다.", false, "▸ 미성년자 신용카드 판례 — 신용카드이용계약 취소는 가능, 신용구매계약 취소는 별개 문제(전자의 취소가 있어도 후자는 그와 무관하게 유효 존속) — 미성년자 141조 현존이익 반환 특칙 적용되지만, '대금채무 면제는 금전상 이익이므로 현존 추정 ○' [2003다60297]", "권리능력·행위능력"],
["008.④", "★ 甲의 사망 후, 乙이 자신이 대표이사로 있는 주식회사의 채무담보를 위하여 乙과 丙의 공유재산에 대하여 특별대리인을 선임하지 않고 丙의 법정대리인의 자격으로 근저당권을 설정한 행위는 이해상반행위이므로 무효이다.", false, "▸ '행위의 객관적 성질상 이해 대립 생길 우려가 있는 행위'를 의미하고, 친권자의 의도나 행위의 결과 실제 이해 대립 발생 여부는 불문 — 친권자의 오빠 혹은 친권자가 대표이사·대주주인 주식회사의 채무를 담보하기 위해 친권자가 자신과 미성년인 子의 공유재산에 대하여 각 본인 겸 법정대리인 자격으로 근저당권설정 대리한 경우 이해상반 ✕ [91다32466, 96다10270]", "권리능력·행위능력"],
["009.①", "★ 미성년자 甲이 법정대리인 乙의 동의 없이 신용카드회사 丙과 신용카드 이용계약을 체결하고 그 카드를 이용하여 丁으로부터 구입한 물품의 대금을 丙이 지급한 이후에, 甲이 丙과의 신용카드 이용계약을 취소하더라도 이는 신의칙에 위배되지 않으며, 이 경우 甲이 丁과의 매매계약을 취소하지 않고 위 물품을 모두 소비하였다면 더 이상 현존이익이 존재하지 않으므로 甲은 丙에게 부당이득반환의무를 부담하지 않는다.", false, "▸ 미성년자가 신용카드이용계약을 취소한 경우 신용카드회원인 미성년자는 가맹점에 대한 매매대금 지급채무를 법률상 원인 없이 면제받은 이익 ○ — 금전상 이익이므로 현존 추정 [2003다60297]", "권리능력·행위능력"],
["009.②", "★ 미성년자 甲 소유의 부동산에 관해 증여를 원인으로 하여 甲의 친권자 乙 명의의 소유권이전등기가 경료된 경우에는, 이를 위해 필요한 특별대리인 선임이 있었던 것으로 추정된다.", true, "▸ 등기명의인이 미성년자이고 당해 부동산을 친권자에게 증여하는 행위가 이해상반행위라 하더라도 일단 친권자에게 이전등기가 경료된 이상, 특별한 사정이 없는 한, 이전등기에 관하여 필요한 절차를 적법하게 거친 것으로 추정 ○ [2001다72029] → 증여계약서에 특별대리인 선임 표시 없다는 이유만으로 특별대리인 선임 없었다는 판단 ✕", "권리능력·행위능력"],
["010.ㄱ", "★ 미성년자가 법률행위를 할 때 단순히 자신이 성년자라고 말하였을 뿐 그 이상의 적극적인 속임수를 사용하지 않은 경우 법정대리인은 위 법률행위를 취소할 수 없다.", false, "▸ 제17조(제한능력자의 속임수) ① 제한능력자가 속임수로써 자기를 능력자로 믿게 한 경우에는 그 행위를 취소할 수 없다. ② 미성년자나 피한정후견인이 속임수로써 법정대리인의 동의가 있는 것으로 믿게 한 경우에도 제1항과 같다. → 17조의 속임수가 되려면 적극적 기망을 요하고 단순히 능력자라 칭하는 것은 ✕ [71다2045] v, 학설은 소극적 기망도 포함", "권리능력·행위능력"],
["010.ㄴ", "★ 공동상속인인 친권자와 미성년인 수인의 자(子) 사이에 상속재산 분할협의를 하게 되는 경우에는 미성년자 각자마다 특별대리인을 선임하여 그 각 특별대리인이 각 미성년자인 자(子)를 대리하여 상속재산분할의 협의를 해야 한다.", true, "▸ 공동상속인인 친권자와 미성년인 수인의 子 사이에 상속재산분할협의를 할 경우 미성년자 각자마다 특별대리인 선임해야 [92다54524]", "권리능력·행위능력"],
["011.ㄴ", "★ 법정대리인이 미성년자에게 영업의 종류를 특정하여 영업을 허락하였다면, 법정대리인은 허락한 영업과 관련된 행위를 스스로 대리할 수 없다.", true, "▸ 영업을 허락한 경우 해당 영업에 관하여는 법정대리인의 대리권이 소멸함", "권리능력·행위능력"],
["SS1.ㄱ", "甲은 자신이 소유하는 X 토지에 근저당권을 설정해 주고 乙 은행으로부터 1억 원을 대출받은 후, 이를 당시 동석한 지인 丙에게 바로 대여하였다. 甲은 이러한 법률행위 당시 사회적 연령 7세, 의사소통 영역은 5세, 작업 영역은 7세 정도에 해당하고, 지능지수는 58로서 '정신지체'에 속하는 지적 능력을 가지고 있었다.§★ 甲과 乙 사이 대출계약과 근저당권설정합의가 유효하기 위해서는 甲이 이러한 법률행위의 일상적 의미뿐만 아니라 법률적 의미나 효과에 대해서도 이해할 수 있어야 한다.", true, "▸ 의사능력 유무는 구체적 법률행위 관련하여 개별적 판단되어야, 어떤 법률행위가 그 일상적 의미만 이해해서는 알기 어려운 특별한 법률적 의미·효과가 부여되어 있는 경우 의사능력 인정되려면 일상적 의미뿐만 아니라 법률적 의미·효과도 이해할 수 있어야 [2008다58367]", "권리능력·행위능력"],
["SS1.ㄴ", "甲은 자신이 소유하는 X 토지에 근저당권을 설정해 주고 乙 은행으로부터 1억 원을 대출받은 후, 이를 당시 동석한 지인 丙에게 바로 대여하였다. 甲은 이러한 법률행위 당시 사회적 연령 7세, 의사소통 영역은 5세, 작업 영역은 7세 정도에 해당하고, 지능지수는 58로서 '정신지체'에 속하는 지적 능력을 가지고 있었다.§★ 甲이 의사무능력을 이유로 위 대출계약과 근저당권설정합의의 무효를 주장하는 경우, 그에 관한 증명책임은 甲이 부담한다.", true, "▸ 의사무능력 이유로 법률행위 무효 주장하는 측은 증명책임 부담 [2022다261237]", "권리능력·행위능력"],
["SS1.ㄷ", "甲은 자신이 소유하는 X 토지에 근저당권을 설정해 주고 乙 은행으로부터 1억 원을 대출받은 후, 이를 당시 동석한 지인 丙에게 바로 대여하였다. 甲은 이러한 법률행위 당시 사회적 연령 7세, 의사소통 영역은 5세, 작업 영역은 7세 정도에 해당하고, 지능지수는 58로서 '정신지체'에 속하는 지적 능력을 가지고 있었다.§■보충 甲이 위 대출계약과 근저당권설정합의 당시 장애인복지법령에 따른 지적장애인 등록을 하지 않았거나 등록 기준을 충족하지 못한 사정이 있다면 의사능력을 갖추었다고 보아야 한다.", false, "▸ 장애인복지법령에 따르면 특별한 사정이 없는 한 지능지수 70 이하인 사람은 교육 통한 사회적·직업적 재활 가능하더라도 지적장애인으로서 위 법령 보호 대상 ○ — 지적장애인에 해당해도 의학적 질병이나 신체적 이상 드러나지 않아 사회 일반인이 보았을 때 아무런 장애 없는 것처럼 보이는 경우 있음 — 지적장애 가진 사람이 장애인복지법령에 따라 지적장애인 등록 하지 않았거나 등록 기준 충족 못했다고 해서 반드시 의사능력 있다고 단정할 수 ✕ [2019다213344]", "권리능력·행위능력"],
["SS1.ㄹ", "甲은 자신이 소유하는 X 토지에 근저당권을 설정해 주고 乙 은행으로부터 1억 원을 대출받은 후, 이를 당시 동석한 지인 丙에게 바로 대여하였다. 甲은 이러한 법률행위 당시 사회적 연령 7세, 의사소통 영역은 5세, 작업 영역은 7세 정도에 해당하고, 지능지수는 58로서 '정신지체'에 속하는 지적 능력을 가지고 있었다.§★ 甲이 의사무능력자였음이 밝혀진 경우, 甲이 丙에게 대출금을 바로 대여한 이상 甲에게는 현존하는 이익이 없으므로, 乙은 甲을 상대로 위 대출계약 등의 무효에 따른 부당이득으로 대출금 자체의 반환을 구할 수 있다.", false, "▸ 141조 단서는 제한능력자 보호 취지로 부당이득반환 범위인 748조의 특칙, 의사무능력자에게 유추적용 ○ — 다만 금전상 이익은 현존 추정 — 의사무능력자가 자기 소유 부동산에 저당권 설정해주고 금융기관으로부터 대출받아 제3자에게 대여했다면 대출로 받은 이익이 제3자에 대한 대여금채권 또는 부당이득반환채권 형태로 현존 → 대출금 자체 반환 구할 수 ✕, 현존이익인 위 채권 양도를 구할 수 ○ [2008다58367]", "권리능력·행위능력"],
["SS2.ㄴ", "16세의 미성년자 甲은 2022. 4. 13. 친권자인 법정대리인 乙의 동의 없이 자기 소유의 X 토지를 丙에게 매매하는 계약을 체결하고 丙에게 그 소유권이전등기를 마쳐주었고, 丙은 2023. 12. 14. X 토지를 丁에게 매매하여 丁 명의로 소유권이전등기를 마쳐주었다.§甲이 미성년임을 이유로 乙이 2024. 1. 12. 丁을 상대로 취소의 의사표시를 하여 그 무렵 丁에게 그와 같은 의사가 도달한 경우, 甲과 丙의 매매계약은 적법하게 취소된다.", false, "▸ 취소는 '상대방에 대한 의사표시'여야 하므로 甲 또는 乙은 甲과의 계약 체결에 취소사유가 있는 계약 상대방 丙에 대하여 취소의 의사표시를 하여야 — 丙과 취소를 하고 난 뒤에야 丁을 상대로 말소를 구해야", "권리능력·행위능력"],
["SS2.ㄷ", "16세의 미성년자 甲은 2022. 4. 13. 친권자인 법정대리인 乙의 동의 없이 자기 소유의 X 토지를 丙에게 매매하는 계약을 체결하고 丙에게 그 소유권이전등기를 마쳐주었고, 丙은 2023. 12. 14. X 토지를 丁에게 매매하여 丁 명의로 소유권이전등기를 마쳐주었다.§★ 甲과 丙의 계약이 甲이 미성년임을 이유로 적법하게 취소된 경우, 丁이 그와 같은 사정을 알지 못하였다면 甲은 계약의 취소로 丁에게 대항할 수 없다.", false, "▸ 제한능력자의 행위를 취소하면 소급하여 절대적 무효(=제3자 보호 없음)", "권리능력·행위능력"],
["SS2.ㄹ", "16세의 미성년자 甲은 2022. 4. 13. 친권자인 법정대리인 乙의 동의 없이 자기 소유의 X 토지를 丙에게 매매하는 계약을 체결하고 丙에게 그 소유권이전등기를 마쳐주었고, 丙은 2023. 12. 14. X 토지를 丁에게 매매하여 丁 명의로 소유권이전등기를 마쳐주었다.§甲이 2023. 12. 27. 丙과의 매매계약을 추인하는 의사표시를 하였다면 乙도 더 이상 甲과 丙의 매매계약을 취소할 수 없다.", true, "▸ 취소할 수 있는 법률행위(유동적 유효)의 추인 = 취소권의 포기 → 확정적 유효(더 이상 취소 불가)", "권리능력·행위능력"],
["012.ㄱ", "★ 의사무능력자가 체결한 계약이라는 이유로 계약이 무효인 경우, 의사무능력자는 무효인 계약에 기초하여 받은 이익 중 현존이익만 부당이득으로 반환하면 된다.", true, "▸ 141조 단서는 제한능력자 보호 취지로 부당이득반환 범위인 748조의 특칙, 의사무능력자에게 유추적용 ○, 다만 금전상 이익은 현존 추정 [2008다58367]", "권리능력·행위능력"],
["012.ㄴ", "후견감독인의 동의가 필요한 법률행위를 후견인이 후견감독인의 동의 없이 한 경우, 그 법률행위는 무권대리로서 원칙적으로 효력이 없다.", false, "▸ 무효가 되는 것이 아니라 취소할 수 있는 행위임", "권리능력·행위능력"],
["013.①", "■보충 의사능력이란 자기 행위의 의미나 결과를 정상적인 인식력과 예기력을 바탕으로 합리적으로 판단할 수 있는 정신적 능력이나 지능을 말하므로 甲이 대출거래약정서와 근저당권설정계약서에 직접 서명·날인한 경우라면 의사능력이 있는 것으로 추정된다.", false, "▸ 계약 당시 직접 방문하여 일부 서류에 서명날인 하였더라도 이를 가지고 행위의 법률적 의미·효과까지 이해한 것이라 할 수는 ✕ [2001다10113]", "권리능력·행위능력"],
["013.②", "의사능력 유무는 법률적 의미나 효과를 이해할 수 있는 능력까지는 아니더라도 일상적인 의미만 알고 있어도 의사능력을 인정할 수 있으므로 한정후견심판을 받은 甲은 근저당권설정계약을 취소하고 난 후 그 말소를 구할 수 있다.", false, "▸ [2008다58367] → 지문에서 앞부분도 틀렸지만, 한정후견심판의 경우 피한정후견인의 모든 행위를 취소할 수도 없거니와 '행위 당시' 한정후견심판이 없었으므로 근저당권설정행위의 경우 행위능력은 전혀 문제되지 않아 지문의 뒤부분도 틀림", "권리능력·행위능력"],
["013.④", "★ 의사무능력을 이유로 甲에 대한 대출과 丙에 대한 대여가 무효인 경우 乙 은행은 현존이익의 반환으로 甲의 丙에 대한 부당이득반환채권의 양도를 甲에게 구할 수 있다.", true, "▸ 의사무능력자가 자기 소유 부동산에 저당권 설정해주고 금융기관으로부터 대출받아 제3자에게 대여했다면, 현존이익인 위 채권 양도를 구할 수 ○ [2008다58367]", "권리능력·행위능력"],
["013.⑤", "■보충 甲의 대출과 근저당설정이 의사무능력으로 무효로 되는 경우 소송대리인의 선임과 같은 소송행위도 무효로 된다.", false, "▸ [민소] 이유: 원고가 직접 변호사에게 소송대리 위임하여 원고 명의로 소 제기한 소송행위의 효력은, 정신능력(지능지수 70, 사회연령 6세), 당해 소송행위 성질·효과 등 여러 사정 종합하여 결정 → 원고 자신의 이익·권리 위해 변호사에게 소송대리권 수여한다는 점에서 소송행위 효력 인정 ○ [2001다10113]", "권리능력·행위능력"],
["014.①", "미성년자가 법률행위를 함에 있어서 요구되는 법정대리인의 동의는 묵시적으로도 가능하다.", true, "▸ 성년에 가깝고 경제활동으로 소득 있는 미성년자가 월 소득 범위 내 비교적 소규모의 일상적 거래행위 했다면, 얻고 있던 소득에 대해서는 부모의 6조 묵시적 처분허락 있으므로 취소 ✕ [2005다71659] → 해당 판례는 미성년자에 대한 5조 동의, 6조 허락 모두 묵시적 의사표시 인정된다고 판시함", "권리능력·행위능력"],
["014.②", "★ 미성년자는 법정대리인으로부터 허락을 얻은 특정한 영업에 관하여 성년자와 동일한 행위능력을 갖는다.", true, "▸ 제8조(영업의 허락) ① 미성년자가 법정대리인으로부터 허락을 얻은 특정한 영업에 관하여는 성년자와 동일한 행위능력이 있다.", "권리능력·행위능력"],
["014.③", "★ 성전환자에게 미성년자인 자녀가 있는 경우, 가족관계등록부에 기재된 성별을 정정하여 미성년자인 자녀의 법적 지위와 그에 대한 사회적 인식에 곤란을 초래하는 것은 허용되지 않으므로, 성전환자의 성별정정은 허용되지 않는다.", false, "▸ [친족] 성전환자의 성별정정 허가 여부 판단할 때 성전환자 기본권 보호와 미성년 자녀 보호·복리 조화 필요 → 종합적 고려 실질적 판단 없고 단지 성전환자에게 미성년 자녀 있다는 사정만으로 성별정정 불허하면 ✕ [2020스616]", "권리능력·행위능력"],
["014.④", "미성년자인 상속인이 상속채무가 상속재산을 초과함에도 불구하고 성년이 되기 전에 단순승인한 경우, 미성년자는 성년이 된 후 상속채무 초과사실을 안 날부터 3개월 내에 한정승인을 할 수 있다.", true, "▸ 제1019조(승인, 포기의 기간) ④ 제1항에도 불구하고 미성년자인 상속인이 상속채무가 상속재산을 초과하는 상속을 성년이 되기 전에 단순승인한 경우에는 성년이 된 후 그 상속의 상속채무 초과사실을 안 날부터 3개월 내에 한정승인을 하지 아니하였거나 할 수 없었던 경우에도 또한 같다. [신설 2022.12.13] ▸ [상속] 최근 상속법이 개정되었음", "권리능력·행위능력"],
["014.⑤", "★ 책임능력 있는 미성년자의 불법행위가 있는 경우에 민법 제750조의 요건을 갖추면 미성년자의 감독의무자도 손해배상책임을 부담하는데, 이혼으로 인하여 부모 중 1명이 친권자 및 양육자로 지정된 경우 비양육친은 미성년자의 부모라는 사정만으로는 미성년자에 대하여 감독의무를 부담한다고 볼 수 없다.", true, "▸ 이혼으로 부모 중 1명이 친권자 및 양육자로 지정된 경우, 비양육친에게는 자녀에 대한 친권·양육권이 없어 자녀 보호·교양에 관한 913조 등 친권에 관한 규정 적용 ✕ — 비양육친의 자녀와의 면접교섭권(837조의2 제1항)은 자녀 복리 실현 목적일 뿐 제3자와의 관계에서 손해배상책임의 근거인 감독의무 규정 ✕, 면접교섭권만으로 비양육친이 일반적·일상적 자녀 지도·조언하는 등 보호·감독할 의무 ✕ [2020다240021]", "권리능력·행위능력"],
["015.②", "★ 권리만을 얻거나 의무만을 면하는 행위는 미성년자가 단독으로 할 수 있는데, 경제적으로 미성년자에게 유리한 행위라도 이에 속하지 않을 수 있다.", true, "▸ 권리만을 얻거나 의무만을 면하는 행위 — 경제적으로 유리하더라도 법률적으로 부담이 생기는 행위라면 해당 ✕", "권리능력·행위능력"],
["016.ㄷ", "★ 만일 甲과 L사와의 신용카드 이용계약이 취소되었음에도 L사가 乙에게 甲의 신용카드 이용대금을 지급한 경우, L사는 甲에게 부당이득의 반환을 구할 수 있다.", true, "▸ 신용카드이용계약 취소 후에도 가맹점에 대한 매매대금 지급채무를 법률상 원인 없이 면제받은 이익은 현존이익으로 추정 → L사는 甲에게 부당이득반환 청구 ○", "권리능력·행위능력"],
["017.ㄱ", "★ 미성년자에 대하여는 복수의 미성년후견인을 둘 수 있다.", false, "▸ 제930조(후견인의 수와 자격) ① 미성년후견인의 수는 한 명으로 한다.", "권리능력·행위능력"],
["017.ㄴ", "★ 불법행위의 피해자가 미성년자인 경우에는 특별한 사정이 없는 한 그 법정대리인이 손해 및 가해자를 알아야 손해배상청구권의 소멸시효가 진행된다.", true, "▸ 피해자가 미성년자인 경우 그 법정대리인이 손해 및 가해자를 알아야 소멸시효 진행 [2009다79897] — 단, 2020년 개정으로 미성년자에 대한 '성적 침해' 불법행위의 경우는 특칙 있음", "권리능력·행위능력"],
["017.ㄷ", "★ 법정대리인인 친권자의 대리행위가 객관적으로 볼 때 미성년자에게 경제적인 손실만을 초래하는 반면, 그 친권자나 제3자에게는 경제적인 이익을 가져오는 행위이고 상대방이 이러한 사실을 안 때에는 그 행위의 효과는 미성년자에게 미치지 않는다.", true, "▸ 친권자 대리행위가 객관적으로 미성년자 본인에게 경제적 손실만 초래, 친권자·제3자에게 경제적 이익, 상대방이 이를 알았거나 알 수 있었다면 107조 1항 단서 유추적용하여 子에게 효과 ✕ [2011다64669]", "권리능력·행위능력"],
["018.ㄱ", "■보충 부재자 재산관리인이 부재자 소유 부동산을 매도하였으나 법원의 허가를 받지 아니하여 무효라는 이유로 매수인의 소유권이전등기청구가 기각된 판결이 확정되었더라도, 패소판결의 확정 후에 위 권한초과행위에 대하여 법원의 허가를 받게 되면 다시 매수인은 위 매매계약에 기한 소유권이전등기청구의 소를 제기할 수 있다.", true, "▸ [민소] 부재자 재산관리인의 부재자 소유 부동산 매매계약이 권한 초과하고 법원 허가 없다는 이유로 그 소유권이전등기청구 패소 확정 후 위 행위에 법원의 허가 받았다면 다시 매매 소유권이전등기청구 ○ → 변론종결 후 새로운 사유인 법원의 허가가 있기 때문에 기판력에 저촉되지 않는 것임", "부재와실종"],
["018.ㄴ", "부재자 재산관리인의 처분행위에 대하여 법원의 허가를 신청하는 행위는 공법상 청구권의 행사에 해당하므로 부재자 재산관리인이 권한초과행위에 대하여 허가신청 절차를 이행하기로 약정하고서 그 이행을 태만히 하더라도 상대방은 위 약정에 기한 허가절차의 이행을 소구할 수 없다.", false, "▸ 법원 선임 부재자 재산관리인이 권한 초과하여 체결한 부동산 매매계약에 관해 허가신청 절차 이행할 것 약정함은 관리권한행위 ○ → 이행하지 않으면 매수인은 재산관리인을 상대로 허가절차 이행 소구 ○ [2001다41971]", "부재와실종"],
["018.ㄷ", "부재자 재산관리인에 의하여 소송절차가 진행되던 중 부재자 본인에 대한 실종선고가 확정되면 상속인등에 의한 적법한 소송수계가 있을 때까지 소송절차가 중단된다.", true, "▸ [민소] 부재자 재산관리인이 부재자의 대리인으로서 소 제기하여 소송계속 중 부재자에 대한 실종선고 확정 → 소 제기 전 사망으로 간주되어 당사자능력 상실 ✕, 실종선고 확정 시 소송절차 중단 ○, 부재자의 상속인 등이 수계 ○ [2007다11057] → 민사소송 절차에서의 실종선고는 '확정 시' 사망처럼 다뤄짐", "부재와실종"],
["018.ㄹ", "■보충 부재자 재산관리인이 부재자의 사망을 확인한 경우, 부재자 재산관리인 선임결정이 취소되지 아니하였더라도 부재자 재산관리인은 권한을 행사할 수 없다.", false, "▸ 법원에서 선임된 부재자 재산관리인은 선임결정 취소되지 않는 한 계속 권한 행사 ○ → 선임결정 취소 전 재산관리인 처분행위로 경료된 등기는 법원의 처분허가 등 절차 거쳐 적법하게 경료된 것으로 추정 ○ [91다11810]", "부재와실종"],
["019.②", "★ 실종선고 후 그 취소 전에 선의로 한 행위의 효력은 실종선고의 취소에 의해서 영향을 받지 않는다.", true, "▸ 실종선고 취소 전에 선의로 한 행위는 그 효력을 잃지 않음 — 당사자 쌍방 모두 선의여야 한다는 것이 통설·판례", "부재와실종"],
["020.①", "■보충 이사가 사임의 의사표시를 하였더라도 법인의 승낙이 없으면 사임의 효력은 발생하지 않는다.", false, "▸ 재단법인 이사는 법인에 대한 일방적 사임 의사표시에 의해 법률관계를 종료시킬 수 있고, 수령권 있는 기관에 의사표시 도달함으로써 효력 발생 ○, 사임 효력 발생에 법인의 승낙은 불필요 [92다749]", "법인"],
["020.②", "★ 법인과 이사의 이익이 상반되는 사항에 관하여 이해관계인 또는 검사의 청구가 있는 경우, 법원은 이사를 선임하여야 한다.", false, "▸ 제63조(임시이사의 선임) 이사가 없거나 결원이 있는 경우에 이로 인하여 손해가 생길 염려 있는 때에는 법원은 이해관계인이나 검사의 청구에 의하여 임시이사를 선임하여야 한다. 제64조(특별대리인의 선임) 법인과 이사의 이익이 상반하는 사항에 관하여는 이사는 대표권이 없다. 이 경우에는 전조의 규정에 의하여 특별대리인을 선임하여야 한다. → 결원 시에는 '임시이사'(제63조), 이익상반 시에는 '특별대리인'(제64조) 구별할 것", "법인"],
["020.③", "■보충 감사는 필요적 상설기관이므로 감사의 성명과 주소는 정관의 필요적 기재 사항이다.", false, "▸ 제66조(감사) 법인은 정관 또는 총회의 결의로 감사를 둘 수 있다. — 임의기관이므로 필요적 기재 사항 ✕", "법인"],
["020.④", "★ 직무대행자는 주무관청의 허가를 얻어 법인의 통상사무에 속하지 아니한 행위를 할 수 있다.", false, "▸ 제60조의2(직무대행자의 권한) ①제52조의2의 직무대행자는 가처분명령에 다른 정함이 있는 경우 외에는 통상사무에 속하지 아니한 행위를 하지 못한다. 다만, 법원의 허가를 얻은 경우에는 그러하지 아니하다. → 주무관청의 허가가 아닌 '법원'의 허가를 얻어야 통상사무 외의 행위를 할 수 있음", "법인"],
["020.⑤", "★ 법인이 정관에서 이사의 해임 사유와 절차를 정하였고 그 해임 사유가 실제로 발생하였다면, 법인과 이사 사이의 신뢰관계가 더 이상 유지되기 어려울 정도에 이르지 않았더라도 법인은 정관에서 정한 절차에 따라 이사를 해임할 수 있다.", true, "▸ 정관에 정한 해임사유가 발생한 이상 이사 해임 ○, 법인·이사 사이 신뢰관계 유지 어렵다는 요건은 불필요, 설령 신뢰관계 파탄이 전제된 해임사유이더라도 그 사유 판단으로 충분하고 별도로 판단할 필요 ✕ [2023다263537]", "법인"],
["021.ㄱ", "「민법」상 사단법인과 재단법인의 정관의 변경은 주무관청의 허가를 얻지 못하면 그 효력이 없다.", true, "▸ 제42조(사단법인의 정관의 변경) ② 정관의 변경은 주무관청의 허가를 얻지 아니하면 그 효력이 없다. 제45조(재단법인의 정관변경) 재단법인의 정관은 그 변경방법을 정관에 정한 때에 한하여 변경할 수 있다.", "법인"],
["021.ㄴ", "「민법」상 법인은 이사를 두지 않아도 된다.", false, "▸ 제57조(이사) 법인은 이사를 두어야 한다.", "법인"],
["022.ㄱ", "★ 민법상 재단법인의 기본재산에 관한 저당권 설정행위는 특별한 사정이 없는 한 정관의 기재사항을 변경하여야 하는 경우에 해당하지 않고, 이에 관하여 주무관청의 허가를 얻을 필요도 없다.", true, "▸ 재단법인의 기본재산에 대한 저당권설정은 주무관청 허가 불요 — 재단법인의 기본재산에 강제집행 실시할 경우 소유권취득 요건 ○ → 매각허가결정시까지 허가 없으면 매각불허가결정 [2017마1565]", "법인"],
["022.ㄴ", "비법인 사단에 대하여 법원이 선임한 임시이사는 원칙적으로 정식이사와 동일한 권한을 가진다.", true, "▸ 비법인 사단에 대하여 제63조에 의해 법원이 선임한 임시이사는 원칙적으로 정식이사와 동일한 권한 ○ [2019다208953]", "법인"],
["022.ㄷ", "■보충 법원이 민법상 법인의 이사회 소집을 허가할 근거는 법률에 없다. 다만, 법원은 이사회 결의의 효력에 관하여 다툼이 발생하면 소집절차의 적법 여부를 판단할 수 있을 뿐이다.", true, "▸ 법원은 민법상 법인의 이사회 소집을 허가할 법률상 근거가 없고, 다만 이사회 결의의 효력에 관하여 다툼 발생하면 소집절차의 적법 여부 판단할 수 있을 뿐 [2017그661]", "법인"],
["022.ㄹ", "★ 민법은 사단법인의 구성원들이 2개의 법인으로 나뉘어 각각 독립한 법인으로 존속하면서 종전 사단법인에게 귀속되었던 재산을 소유하는 방식의 사단법인 분열을 인정하지 아니한다.", true, "▸ 사단법인의 구성원 탈퇴·해산은 인정하지만 구성원들이 2개 법인으로 나뉘어 각각 독립 법인으로 존속하며 종전 재산을 소유하는 '사단법인의 분열' ✕ → 비법인사단도 마찬가지이므로 '교회의 분열' ✕ [2004다37775]", "법인"],
["023.③", "★ 법인의 여러 이사가 대표권을 공동으로 행사하도록 사원총회에서 의결하고 이를 법인의 정관에 기재하였지만 등기하지 아니한 경우에, 이러한 사실을 알면서도 이사 1인과 계약을 체결한 사람이 계약상 의무의 이행을 법인에게 청구하면 법인은 그 이행을 적법하게 거절할 수 없다.", true, "▸ 제60조(이사의 대표권에 대한 제한의 대항요건) 이사의 대표권에 대한 제한은 등기하지 아니하면 제3자에게 대항하지 못한다. → 법인은 대표권 제한 등기 없으면 정관 규정에 대해 선의나 악의에 관계없이 제3자에 대항 ✕ [91다24564] → 무제한설", "법인"],
["11", "★ 이사가 없거나 결원이 있는 경우에 이로 인하여 손해가 생길 염려가 있는 때에는 법원은 이해관계인이나 검사의 청구에 의하여 특별대리인을 선임하여야 한다.", false, "▸ 이 경우 선임하는 것은 '임시이사'이지 특별대리인이 아님 (제63조)", "법인"],
["13", "★ 청산사무가 종결되지 않았다면 비록 청산종결등기를 마쳤다 하더라도 그 범위 내에서는 청산법인으로서 존속한다.", true, "▸ [99다66427] → 청산종결 등기가 되었어도 청산사무(ex. 채권추심, 채무변제)가 종결되지 않았다면 그 한도 청산법인 존속 ○, 민소법상 당사자능력 ○", "법인"],
["024.ㄴ", "■보충 「민법」상 법인의 상태가 임기만료된 이사에게 후임 이사 선임 시까지 업무수행권을 인정할 필요가 있는 경우에 해당하더라도, 그 임기만료된 이사에게 이사로서의 지위는 인정되지 아니한다.", false, "▸ 법인의 상태가 임기만료된 이사에게 후임 이사 선임시까지 업무수행권을 인정할 필요가 있는 경우에 해당하더라도 임기만료된 이사에게 '이사'로서의 지위는 인정할 수 ✕ — 다만 급박한 사정 해소 위해 퇴임이사로 하여금 업무 수행하게 할 필요 있는지 개별적·구체적으로 검토 필요하고 퇴임이사라는 사정만으로 당연히 포괄적으로 부여되는 지위는 아니므로 [96다37206]", "법인"],
["024.ㄷ", "■보충 「민법」 제63조에 의하여 법원이 선임한 임시이사 및 「상법」 제386조 제2항에 의하여 법원이 선임한 일시이사는 모두 법인의 통상사무에 속하지 아니한 행위를 하지 못한다.", false, "▸ 민법상 법인에 대하여 제63조에 의해 법원이 선임한 임시이사는 원칙적으로 정식이사와 동일한 권한 ○ [2012다40332] — [상법] [68마119]", "법인"],
["025.①", "★ 매매계약이 乙의 적법한 대표권 범위 내에서 체결된 것이라면 매매계약의 불이행에 따른 채무불이행책임은 甲이 직접 부담한다.", true, "▸ 제59조(이사의 대표권) ② 법인의 대표에 관하여는 대리에 관한 규정을 준용한다. 제114조(대리행위의 효력) ① 대리인이 그 권한내에서 본인을 위한 것임을 표시한 의사표시는 직접 본인에게 대하여 효력이 생긴다. → 적법한 대표와 맺은 법률행위의 효과는 대표자 개인이 아닌 본인인 법인에 귀속(59조 2항) — 그 법률행위상 의무 위반한 채무불이행 손해배상책임도 대표자 개인이 아닌 법인만 책임 귀속주체 [2017다53265]", "법인"],
["025.②", "매매계약이 乙의 적법한 대표권 범위 내에서 체결되었다고 하더라도 매매계약이 乙 자신만을 위한 것이고, 丙이 이러한 사실을 알았거나 알 수 있었던 경우가 아니라면 甲과 丙 사이의 매매계약은 유효하다.", true, "▸ 사리 도모 목적이 있어도 유권대표인 것이 원칙이나, 이러한 남용 사실에 대해 상대방도 악의나 경과실이 있다면 대표권남용 법리에 의하여 법인에 대해 효력 ✕, 계약상 책임 ✕ → 107조 1항 단서 유추적용", "법인"],
["025.③", "甲이 丙에 대하여 매매계약에 따른 채무불이행책임을 지는 경우, 甲의 고의·과실은 乙의 고의·과실 여부를 기준으로 결정한다.", true, "▸ 제59조(이사의 대표권) ② 법인의 대표에 관하여는 대리에 관한 규정을 준용한다. 제116조(대리행위의 하자) ① 의사표시의 효력이 의사의 흠결, 사기, 강박 또는 어느 사정을 알았거나 과실로 알지 못한 것으로 인하여 영향을 받을 경우에 그 사유의 유무는 대리인을 표준하여 결정한다.", "법인"],
["025.④", "甲이 丙에 대하여 매매계약에 따른 채무불이행책임을 지는 경우, 乙에게 불법행위책임 등이 별도로 성립하지 않더라도 乙은 대표기관 개인으로서 丙에 대해 손해배상책임을 부담하지 않는다.", false, "▸ 지문 ① 해설 참조 — 다만 해당 지문은 아래 판례를 고려할 때 다소 의문임: 적법한 대표와 맺은 법률행위의 효과는 대표자 개인이 아닌 본인인 법인에 귀속 → 대표자 개인이 손해배상책임 지려면 750조 불법행위책임 별도로 성립해야 → 법인 내부행위 벗어나 제3자에 대한 관계에서 사회상규에 반하는 위법한 행위라 인정될 정도 이르러야 [2017다53265]", "법인"],
["025.⑤", "丙이 매수하는 것에 관하여 乙의 이익과 甲의 이익이 상반되는 경우, 乙은 위 매매계약 체결에 대해 甲을 대표할 권한이 없다.", true, "▸ 제64조(특별대리인의 선임) 법인과 이사의 이익이 상반하는 사항에 관하여는 이사는 대표권이 없다. 이 경우에는 전조의 규정에 의하여 특별대리인을 선임하여야 한다.", "법인"],
["026.ㄱ", "★ 법인의 정관에 대표권의 제한에 관한 규정이 있으나 그와 같은 취지가 등기되어 있지 않다면, 법인은 그와 거래한 상대방이 그와 같은 정관의 규정에 대하여 선의나 악의에 관계없이 그 상대방에 대하여 위 대표권 제한 사실로써 대항할 수 없다.", true, "▸ 법인은 대표권 제한 등기 없으면 정관 규정에 대해 선의나 악의에 관계없이 제3자에 대항 ✕ [91다24564] → 무제한설", "법인"],
["026.ㄴ", "★ 법인은 언제든지 이사를 해임할 수 있지만, 법인의 정관에 이사의 해임사유에 관한 규정이 있는 경우에는 법인은 이사의 중대한 의무위반 또는 정상적인 사무집행 불능 등의 특별한 사정이 없는 한 정관에서 정하지 아니한 사유로는 이사를 해임할 수 없다.", true, "▸ 정관에 이사 해임사유에 관한 규정이 있는 경우 이사의 중대한 의무위반·정상적 사무집행 불능 등 특별한 사정 없는 한 정관에서 정하지 아니한 사유로는 이사 해임 불가 [2011다41741]", "법인"],
["027.ㄴ", "★ 만약 乙이 대표자로 등기되어 있지 않았다면, 丙은 甲 법인을 상대로 민법 제35조에서 정한 법인의 불법행위책임에 따른 손해배상을 청구할 수 없다.", false, "▸ 35조에서 '대표자'에는 명칭·직위 여하, 대표자 등기 여부 불문 → 법인을 실질적으로 운영하는 사실상의 대표 [2008다15438]", "법인"],
["027.ㄷ", "★ 乙의 행위가 자신의 이익을 도모하기 위한 것이라면 직무관련성이 부정되므로, 丙은 甲 법인을 상대로 민법 제35조에서 정한 법인의 불법행위책임에 따른 손해배상을 청구할 수 없다.", false, "▸ 외형상 법인 직무행위로 인정되면 대표자 개인 私利 도모 위한 것, 법령 규정 위배되었더라도 직무관련성 ○ [68다2320]", "법인"],
["027.ㄹ", "★ 乙의 행위가 실제로 직무에 관한 행위에 해당하지 아니함을 丙이 알았거나 과실로 알지 못한 경우에는 甲 법인을 상대로 민법 제35조에서 정한 법인의 불법행위책임에 따른 손해배상을 청구할 수 없다.", false, "▸ 직무관련성 없음을 상대방이 악의나 중과실이면 35조 책임 ✕ [2002다27088] → 단순히 '과실'이라고 하면 경과실을 의미하므로 틀린 지문", "법인"],
["028.ㄱ", "학교법인이 용도변경이나 의무부담을 내용으로 하는 계약을 체결한 경우, 반드시 계약 전에 관할청의 허가를 받아야만 하는 것은 아니고 계약 후라도 관할청의 허가를 받으면 유효하게 될 수 있다.", true, "▸ 학교법인이 기본재산 용도변경, 의무 부담할 때 관할청 허가 받아야(사립학교법 28조 1항) → 관할청 허가 없이 이러한 행위하면 무효 — 다만 반드시 계약 전에 관할청 허가 받아야만 하는 것은 ✕ → 계약 후라도 관할청 허가 받으면 유효하게 ○ — 관할청 허가처분이 있는 경우, 당사자가 허가신청 하지 않을 의사 명백히 표시하거나 계약 이행의사 철회한 경우, 관할청 허가를 받는 것이 사실상 불가능한 경우 등에는 무효로 확정 [2019다289815]", "법인"],
["028.ㄴ", "★ 법인의 대표기관이, 법인과 사이에 계약을 체결한 거래상대방인 제3자에 대하여 자연인으로서 민법 제750조에 기한 불법행위책임을 부담한다고 보기 위해서는, 그 대표기관의 행위로 인해 법인에 귀속되는 효과가 대외적으로 제3자에 대한 채무불이행의 결과를 야기한다는 점만으로는 충분하고, 법인의 내부행위를 벗어나 제3자에 대한 관계에서 사회상규에 반하는 위법한 행위라고 인정될 수 있는 정도에 이를 필요는 없다.", false, "▸ 적법한 대표와 맺은 법률행위의 효과는 대표자 개인이 아닌 본인인 법인에 귀속(59조 2항) → 대표자 개인이 손해배상책임 지려면 750조 불법행위책임 별도로 성립해야 → 법인 내부행위 벗어나 제3자에 대한 관계에서 사회상규에 반하는 위법한 행위라 인정될 정도 이르러야 [2017다53265]", "법인"],
["029.②", "■보충 이사 중 일부의 임기가 만료되었더라도 아직 임기가 만료되지 아니한 다른 이사들로 정상적인 활동을 할 수 있는 경우, 임기 만료된 이사는 당연히 퇴임하여 업무수행권이 없다.", true, "▸ 이사 중 일부의 임기 만료되었더라도 아직 임기 만료되지 않은 다른 이사들로 정상적 활동 가능하면, 임기 만료된 이사는 당연 퇴임 ○, 업무수행권 ○ — ∵ 임기 만료된 이사의 업무수행권은 이사 결원으로 법인 정상적 활동 불능 방지 취지 [2013마1801]", "법인"],
["030.③", "★ 乙이 만약 대표권 없는 이사인 경우라도 일반 이사의 행위에 대해서 민법상 법인은 민법 제35조 제1항에 따라 그 손해배상책임을 지므로 甲 법인은 丙에 대해 손해배상책임을 부담한다.", false, "▸ 35조의 '이사 기타 대표자'는 법인의 대표기관 의미 → 대표권 없는 이사는 법인의 기관이지만 대표기관은 ✕, 그들의 행위로는 35조 법인의 불법행위 ✕ [2003다30159]", "법인"],
["030.⑤", "★ 乙의 행위로 甲 법인의 손해배상책임이 인정되는 경우라도 乙이 丙에 대하여 자연인으로서 민법 제750조에 기한 불법행위책임을 지기 위해서는 乙의 행위가 甲 법인 내부의 행위를 벗어나 丙에 대한 관계에서 사회상규에 반하는 위법한 행위라고 인정될 수 있는 정도에 이르러야 한다.", true, "▸ 적법한 대표와 맺은 법률행위의 효과는 대표자 개인이 아닌 본인인 법인에 귀속(59조 2항) → 그 법률행위상 의무 위반한 채무불이행 손해배상책임도 대표자 개인이 아닌 법인만 책임 귀속주체 → 대표자 개인이 손해배상책임 지려면 750조 불법행위책임 별도로 성립해야 → 법인 내부행위 벗어나 제3자에 대한 관계에서 사회상규에 반하는 위법한 행위라 인정될 정도 이르러야 [2017다53265]", "법인"],
["031.ㄴ", "★ 대표기관의 행위가 법인의 불법행위에 해당하는지 여부는 행위의 외형상 법인의 대표자의 직무행위라고 인정할 수 있는지에 따라 결정된다.", true, "▸ 외형상 법인 직무행위로 인정되면 대표자 개인 私利 도모 위한 것, 법령 규정 위배되었더라도 직무관련성 ○ [68다2320]", "법인"],
["032.ㄴ", "★ A가 금전을 차용함에 있어 이사회 결의를 거치지 않았으나 甲법인이 이와 같은 대표권제한의 내용을 등기하지 않은 경우, 乙이 그 대표권제한의 사실을 알고서 거래하였더라도 乙은 甲에게 금전소비대차계약에 기한 1억 원의 대여금채무의 이행을 구할 수 있다.", true, "▸ 제60조(이사의 대표권에 대한 제한의 대항요건) 이사의 대표권에 대한 제한은 등기하지 아니하면 제3자에게 대항하지 못한다. → 법인은 대표권 제한 등기 없으면 정관 규정에 대해 선의나 악의에 관계없이 제3자에 대항 ✕ [91다24564] → 무제한설", "법인"],
["033.③", "★ 법인이 적법한 대표기관을 통하여 계약을 체결한 때에는 대표기관 개인이 아닌 법인만이 그 계약상 채무의 불이행으로 인한 책임의 귀속주체가 되는 것이 원칙이다.", true, "▸ 적법한 대표와 맺은 법률행위의 효과는 대표자 개인이 아닌 본인인 법인에 귀속(59조 2항) [2017다53265]", "법인"],
["SS법인1.②", "★ 유언으로 재단법인을 설립하는 경우에도 제3자에 대한 관계에서는 출연재산이 부동산인 경우는 그 법인에의 귀속에는 법인의 설립 외에 등기를 필요로 한다.", true, "▸ 설립등기나 유언자 사망 이후 부동산 등기는 제3자가 먼저 마친 사안이 문제됨 — 법인과 제3자 사이에는 등기 없어도 48조가 정한 시기에 귀속됨. 법인이 제3자에 대항하려면 186조 원칙으로 돌아가 등기 필요 [78다481] — 유언으로 재단법인 설립하는 경우도 같은 이유에서 재단법인이 그 소유권등기를 마치지 않았다면 유언자의 상속인 1인으로부터 그 지분 취득하여 이전등기 마친 선의 제3자에게 대항 ✕ [93다8054]", "법인"],
["SS법인1.④", "★ 민법상의 법인에 대하여 민법 제63조에 의하여 법원이 선임한 임시이사는 원칙적으로 정식이사와 동일한 권한을 가진다.", true, "▸ 민법상 법인에 대하여 제63조에 의해 법원이 선임한 임시이사는 원칙적으로 정식이사와 동일한 권한 ○ [2012다40332]", "법인"],
["SS법인2.ㄷ", "■보충 「민법」상 사단법인은 총 사원 4분의 3 이상의 동의가 없으면 해산을 결의하지 못하고, 정관에 다른 규정이 있더라도 마찬가지이다.", false, "▸ 제78조(사단법인의 해산결의) 사단법인은 총사원 4분의 3 이상의 동의가 없으면 해산을 결의하지 못한다. 그러나 정관에 다른 규정이 있는 때에는 그 규정에 의한다.", "법인"],
["SS법인2.ㄹ", "■보충 「민법」상 법인이 채무를 완제하지 못하게 된 때에는 이사는 지체없이 파산신청을 하여야 한다.", true, "▸ 제79조(파산신청) 법인이 채무를 완제하지 못하게 된 때에는 이사는 지체없이 파산신청을 하여야 한다.", "법인"],
["SS법인2.ㅁ", "「상법」상 회사의 이사가 법령 또는 정관에 위반하여 회사의 존속을 허용할 수 없는 행위를 한 때 법원은 직권으로 회사의 해산을 명할 수 있다.", true, "▸ 상법 제176조(회사의 해산명령) ① 법원은 다음의 사유가 있는 경우에는 이해관계인이나 검사의 청구에 의하여 또는 직권으로 회사의 해산을 명할 수 있다. 3. 이사 또는 회사의 업무를 집행하는 사원이 법령 또는 정관에 위반하여 회사의 존속을 허용할 수 없는 행위를 한 때", "법인"],
["SS법인2.ㅂ", "★ 「민법」상 법인의 이사가 없거나 결원이 있는 경우에 이로 인하여 손해가 생길 염려 있는 때에는 법원은 이해관계인이나 검사의 청구에 의하여 임시이사를 선임하여야 한다.", true, "▸ 제63조(임시이사의 선임) 이사가 없거나 결원이 있는 경우에 이로 인하여 손해가 생길 염려 있는 때에는 법원은 이해관계인이나 검사의 청구에 의하여 임시이사를 선임하여야 한다.", "법인"],
["034.②", "★ 丙이 甲의 대표자로서 乙의 제3자에 대한 채무를 보증하는 행위는 甲의 재산 그 자체의 관리·처분이 따르지 아니하는 단순한 채무부담행위에 불과하므로 종중총회의 결의가 필요한 총유물의 관리·처분행위라고 할 수 없다.", false, "▸ 275조, 276조 1항의 '총유물의 관리·처분'은 총유물 그 자체에 관한 이용·개량행위나 법률적·사실적 처분행위를 의미하는 것 → 비법인사단의 타인 금전채무 보증행위는 총유물 그 자체 관리·처분이 아닌 단순한 채무부담행위에 불과하여 종중총회의 결의가 필요한 총유물의 관리·처분 ✕ → 이때 임원회의 결의 등 거치도록 한 규약은 대표권 제한 규정 ○ → 거래 상대방이 대표권 제한 및 위반 사실을 알았거나 알 수 있었을 때 거래행위 무효 → 상대방 악의·과실은 비법인사단 측 입증책임 → 금전차용행위도 마찬가지 [2004다60072, 2009다64383]", "권리능력없는사단"],
["035.ㄷ", "★ 법인 아닌 사단의 대표자가 대표권을 행사함에 있어서는 사원총회의 결의를 거쳐야 한다는 정관의 규정이 있는 경우, 이에 대해 과실로 알지 못하고 대표자와 계약을 체결한 상대방에 대해서는 그 법인 아닌 사단은 당해 계약의 체결에 있어 사원총회의 결의가 없었음을 이유로 계약이 무효임을 주장할 수 있다.", true, "▸ 비법인사단은 등기할 방법 없어 60조 준용 ✕ → 대표권제한 위반한 경우에 그 대표권 제한 및 위반 사실에 대해 상대방의 악의나 과실 있다면 비법인사단에 대하여 무효, 상대방 악의·과실은 비법인사단 측 입증·주장책임 [2004다60072]", "권리능력없는사단"],
["036.ㄴ", "★ 보충 종중 토지에 대한 수용보상금의 분배에 관한 총회의 결의내용이 현저하게 불공정하여 무효인 경우, 종원은 바로 종중을 상대로 하여 스스로 공정하다고 주장하는 분배금의 지급을 청구할 수 없다.", true, "▸ 총유물인 종중 토지 매각대금의 분배는 정관 기타 규약에 달리 정함이 없는 한 종중총회의 결의에 의하여만 처분 → 분배결의의 없으면 종원이 종중에 대해 직접 분배청구 ✕ → 매각대금 분배에 관한 종중총회 결의가 무효라면 무효확인 등을 승소판결 받은 후 새로운 종중총회에서 공정한 내용으로 다시 결의하도록 해야 → 새로운 총회 결의 없이 곧바로 종중을 상대로 공정 주장하는 분배금 지급 구할 수 ✕ [2007다42310]", "권리능력없는사단"],
["037.①", "★ 자녀의 복리를 위하여 자녀의 성과 본을 변경할 필요가 있어 성년인 자녀의 성과 본이 모(母)의 성과 본으로 변경되었을 경우 그 자녀는 모(母)가 속한 종중의 공동선조와 성과 본을 같이 하는 후손으로서 기존 부(父)의 종중에서의 탈퇴와 모(母)의 종중에 대한 가입절차를 거쳐야 모(母)의 종중의 구성원이 될 수 있다.", false, "▸ 781조 6항에 따라 자녀 복리 위해 자녀의 성과 본을 母의 성과 본으로 변경한 경우, 성년인 자녀는 母가 속한 종중의 당연한 구성원 ○ [2017다260940]", "권리능력없는사단"],
["037.②", "공동선조의 후손 중 특정 범위 내의 종원만으로 조직체를 구성하여 활동하고 있다면 이는 소종중으로서 본래 의미의 종중의 하나로 보아 그 종원은 성년의 남성으로만 구성될 수 있다.", false, "▸ 종중 유사 비법인사단은 목적·기능은 고유 의미 종중과 별 차이 없으나 사적 임의단체라는 점이 달라 구성원 자격·가입조건 자유롭게 결정 [2018다264628] → 종중 유사 단체는 성년 남성으로만 구성될 수 있으나, 이를 '본래 의미의 종중'의 하나로 볼 수는 없고 그와 구별되는 사적 임의단체임", "권리능력없는사단"],
["037.③", "■보충 종중의 임원은 종중재산의 관리·처분에 관한 사무를 처리함에 있어 종중규약 또는 종중총회의 결의에 따라야 하고, 선량한 관리자로서의 주의를 다하여야 할 의무가 있다.", true, "▸ 종중과 위임 유사 계약관계 있는 종중의 임원은 종중재산의 관리·처분에 관한 사무 처리함에 있어 종중규약·종중총회 결의에 따라야 하고 선량한 관리자 주의 다할 의무 ○ [2017다231249]", "권리능력없는사단"],
["037.④", "■보충 종중총회 소집통지의 방법은 구두 또는 전화로 하거나 다른 종중원이나 세대주를 통하여 하여도 무방하나, 소집통지를 받지 않은 종중원이 다른 방법에 의하여 이를 알게 된 경우에는 적법한 통지방법이라 볼 수 없으므로 그 종중원이 종중총회에 참석하지 않은 경우 종중총회의 결의는 하자 있는 결의로서 무효이다.", false, "▸ 종중총회 소집통지 방법은 반드시 서면만 아닌 구두·전화 ○, 소집통지 받지 않은 종중원이 다른 방법으로 알게 된 경우라면 그가 종중총회 참석 않았더라도 총회결의의 무효가 아님 [2011다70169]", "권리능력없는사단"],
["SS물건1.①", "■보충 집합건물의 소유 및 관리에 관한 법률상 구분건물의 전유부분에 대한 소유권보존등기만 경료되고 대지지분에 대한 등기가 경료되기 전에 전유부분에 대해서만 가압류결정이 내려진 경우, 가압류결정의 효력은 특별한 사정이 없는 한 대지권에까지 미친다.", true, "▸ 전유부분만 소이등 마치고 저당권 설정한 후 나중에 대지지분 등기 마치면 저당권은 종된 권리인 대지사용권에 당연히 ○ [2001다22604] → 로민정 해당 판례로 가압류도 종된 권리에 미친다고 유추할 수 있음", "물건"],
["SS물건1.②", "주물 자체의 효용과 관계없는 물건은 주물의 소유자나 이용자의 사용에 공여되고 있더라도 종물이 아니다.", true, "▸ 종물이 주물의 상용에 이바지함은 주물 그 자체의 경제적 효용을 다하게 하는 것 ○, 주물의 '소유자·이용자'의 사용에 공여되고 있더라도 주물 그 자체의 효용과 직접 관계 없는 물건은 종물 ✕ [2000마3530]", "물건"],
["SS물건1.⑤", "원본채권이 양도된 경우, 이미 변제기에 도달한 이자채권은 종된 권리이므로 당연히 양도된다.", false, "▸ 기본적 이자채권은 발생·소멸·처분에 있어 원본채권과 운명을 같이, 지분적 이자채권(변제기 도래)은 독립성 있어 분리 양도 가능(원본채권 양도 시에 당연히 같이 양도되는 것은 아님)", "물건"],
["038.⑤", "★ 부동산의 매매계약에 있어 쌍방당사자가 모두 토지 X를 계약의 목적물로 삼았으나 그 목적물의 지번에 관하여 착오를 일으켜 계약서상 그 목적물을 X와는 별개인 토지 Y로 표시하였다 하여도 X를 매매의 목적물로 한다는 쌍방당사자의 의사합치가 있는 이상 위 매매계약은 X에 관하여 성립한 것으로 보아야 한다.", true, "▸ 매매계약에서 쌍방당사자 모두 甲토지를 목적물로 삼았으나 지번의 착오로 계약서에 乙토지로 표시하였어도 쌍방 의사합치 있는 이상 매매계약은 甲토지에 관하여 성립 → 乙토지에 매매 원인으로 소유권이전등기 마친 것은 원인 무효이므로 매도인은 등기말소청구 ○ [93다2629]", "법률행위"],
["039.①", "★ 불공정한 법률행위에 해당하여 무효인 법률행위는 추인에 의하여 유효로 될 수 없다.", true, "▸ 민법 104조 위반의 효과는 확정적 무효, 추인 ✕ — 다만 판례는 배임행위 적극가담으로 103조 위반인 경우, 배임 피해자 본인의 추인은 인정한 바 있음에 유의할 것", "법률행위"],
["039.②", "■보충 법인 아닌 사단의 총회에서 회의 소집 통지에 목적 사항으로 기재하지 않은 사항에 관하여 결의한 경우, 구성원 전원이 회의에 참석하여 해당 사항에 관하여 의결하였더라도 그 결의는 효력이 없다.", false, "▸ 법인 아닌 사단의 총회에서 회의 소집 통지에 목적 사항으로 기재하지 않은 사항에 관하여 결의한 때에는 구성원 전원이 회의에 참석하여 그 사항에 의결한 경우가 아닌 한 결의는 원칙적 무효 [2011다101155]", "법률행위"],
["039.③", "★ 증여계약과 같이 아무런 대가관계 없이 당사자 일방이 상대방에게 일방적인 급부를 하는 법률행위는 불공정한 법률행위의 해당 여부를 논의할 수 있는 성질의 것이 아니다.", true, "▸ 대가관계 없는 일방적 급부행위인 '증여'는 불공형 ✕, 104조 적용 ✕, 진정 취하 조건으로 거액의 증여도 마찬가지 [99다56833]", "법률행위"],
["039.④", "양도소득세의 일부를 회피할 목적으로 매매계약서에 실제로 거래한 가액을 매매대금으로 기재하지 아니하고 그보다 낮은 금액을 매매대금으로 기재하였더라도 그 매매계약을 사회질서에 반하는 법률행위로서 무효라고 할 수는 없다.", true, "▸ 세금 일부 회피 목적 다운계약서 작성하더라도 매매계약 자체는 반사회적 법률행위로서 무효라 할 수 없음 [2007다3285]", "법률행위"],
["039.⑤", "「부동산 거래신고 등에 관한 법률」상 토지거래허가구역 내의 토지에 대하여 토지거래허가 없이 매매계약이 체결되어 유동적 무효 상태에 있던 중, 토지거래허가구역이 지정해제 되었다면 그 매매계약은 확정적으로 유효로 된다.", true, "▸ 유동적 무효가 확정적 유효로 되는 경우: 허가구역 지정해제, 지정기간 만료 [98다40459]", "법률행위"],
["040.④", "★ 대리인에 의한 법률행위에 있어서 경솔과 무경험은 대리인을 기준으로 판단하고, 궁박상태에 있는지의 여부는 본인을 기준으로 판단한다.", true, "▸ 대리인이 매매계약 체결한 경우 궁박은 본인의 입장에서, 경솔·무경험은 대리인을 기준으로 판단 [71다2255]", "법률행위"],
["SS법률1.②", "■보충 어떠한 행위가 형사처벌 대상이라는 사정 때문에 그 행위로 체결된 계약의 효력이 당연히 부정된다고 할 수는 없다.", true, "▸ 유사수신행위가 형사처벌 대상이라는 사정 때문에 유사수신행위로 체결된 계약의 효력이 당연히 부정된다고 할 수 없음", "법률행위"],
["SS법률1.③", "당사자가 계약을 지키지 않는 경우 얻을 이익이 이로 인해 입을 불이익보다 크다고 판단하여, 그 불이익의 발생을 예측하면서도 이를 감수할 생각으로 계약에 반하는 행위를 함으로써 계약 상대방과의 관계에서 그가 주장하는 급박한 곤궁 상태에 이르렀다면, 이와 같이 그가 자초한 상태를 민법 제104조의 궁박이라고 인정하는 것은 엄격하고 신중하게 이루어져야 한다.", true, "▸ '궁박'에는 정신적·심리적 원인 포함 ○ → 당사자가 계약 불이행으로 얻을 이익이 불이익보다 크다고 판단하여 불이익 예측하면서도 감수하고 계약 위반행위를 함으로써 상대방과의 관계에서 급박한 곤궁 상태에 이른 것이면, 자초한 궁박에 104조를 적용하는 것에는 엄격하고 신중해야 [2023다301712]", "법률행위"],
["SS법률1.⑤", "■보충 특정 법률이나 그 시행령의 규정이 단순한 단속규정에 불과할 뿐 효력규정이라고 할 수 없다고 하더라도, 당사자가 통정하여 위와 같은 단속규정을 위반하는 법률행위를 한 경우에는 선량한 풍속 기타 사회질서에 위반한 사항을 내용으로 하는 법률행위가 될 수 있다.", true, "▸ 지역주택조합의 조합원 자격에 관한 주택법이나 시행령 규정은 단순한 단속규정 ○, 효력규정 ✕, 위반한 약정도 무효 아님 — 다만 당사자가 통정하여 위 단속규정 위반하는 법률행위 하면 선량한 풍속 기타 사회질서 위반 법률행위 ○ [2024다249040]", "법률행위"],
["041.ㄱ", "민법 제104조의 요건을 갖추지 못한 행위라도 민법 제103조에 의하여 무효로 되는 반사회질서 행위가 될 수 있다.", true, "▸ 행정기관 진정서 제출로 상대방 궁지에 빠뜨린 후 취하 조건으로 거액 급부 제공 약정 → 제103조 위반 무효 ○, 제104조 위반은 ✕ — 진정 취하는 청원권 행사의 철회로서 재산적 이익 평가 ✕, 위 약정은 재산상 대가관계 없는 일방적 급부의 무상행위이므로 [99다56833]", "법률행위"],
["042.ㄹ", "★ 불공정한 법률행위를 무효라고 규정한 민법 제104조는 경매의 경우에도 적용된다.", false, "▸ 경매는 104조 불공정성 문제 ✕ [80마77]", "법률행위"],
["043.⑤", "★ 대리인이 상대방과 공모하여 대리권을 남용한 경우, 본인은 그에 따라 형성된 법률관계를 기초로 새로운 이해관계를 맺은 선의의 제3자에 대하여 무효를 주장할 수 없다.", true, "▸ 친권자 대리행위가 객관적으로 미성년자 본인에게 경제적 손실만 초래, 친권자·제3자에게 경제적 이익, 상대방이 이를 알았거나 알 수 있었다면 107조 1항 단서 유추적용하여 子에게 효과 ✕ → 이렇게 형성된 법률관계를 기초로 새로운 법률상 이해관계를 맺은 선의의 제3자 보호 ○ — ∵ 107조 '2항'도 유추적용 ○ [2016다3201]", "법률행위"],
["044.②", "★ 도박자금 제공을 목적으로 체결한 금전소비대차계약과 그 차용금의 담보를 위한 근저당권설정계약이 무효라면, 그 설정자는 이미 마쳐진 근저당권설정등기의 말소를 청구할 수 있다.", true, "▸ 103조 위반한 도박채무의 담보로 근저당권을 설정했다면 불법원인급여 ✕ → 말소청구 ○ — ∵ 종국적·불법원인급여의 이익은 종국적이어야, 종속적이면 ✕, 이익 향수 위해 경매 신청의 별도조치 취해야 하므로 [93다55234]", "법률행위"],
["044.③", "★ 법률행위가 사회질서에 반하는 경우 당사자가 그 무효임을 알고 추인하더라도 새로운 법률행위를 한 효과가 발생하지 않는다.", true, "▸ 통설·판례에 따라 강행규정·제103조·제104조 위반의 행위들은 '추인' 또는 '법정추인'이 불허됨(다만 매매계약이 반사회적 법률행위이고 상대방 적극 가담한 경우, 배임 피해자 본인인 법인이 추인하면 새로운 법률행위 효과 발생 ○, 무효인 이유는 본인인 법인의 이익 보호 위한 것 [2010다91831])", "법률행위"],
["045.①", "★ 비진의의 의사표시에 있어서 진의란 표의자가 진정으로 마음속에서 바라는 사항을 뜻하는 것이므로, 표의자가 강박에 의하여 증여의 의사표시를 할 당시 재산을 강제로 빼긴다는 것이 표의자의 본심으로 잠재되어 있었다면 위 증여의 의사표시는 증여라는 내심의 효과의사가 결여된 것으로서 비진의의 의사표시에 해당한다.", false, "▸ 진의란 특정 내용 의사표시를 할 표의자의 생각 ○, 진정 마음속 바라는 사항 ✕ — 강박에 의하여서나마 증여하려고 의사표시를 한 이상 내심의 효과의사 결여 아님 [92다41528]", "의사표시"],
["045.③", "★ 부동산 매매계약에 있어 당사자인 甲과 乙이 모두 A 토지를 계약의 목적물로 삼았으나 그 목적물의 지번에 관하여 착오를 일으켜 계약서상 그 목적물을 B 토지로 표시하였다면, 규범적 해석에 따라 일단 B 토지에 관하여 매매계약이 성립된 것으로 보아야 하고, 다만 매도인 甲은 착오를 이유로 위 매매계약을 취소할 수 있다.", false, "▸ 매매계약에서 쌍방당사자 모두 甲토지를 목적물로 삼았으나 지번의 착오로 계약서에 乙토지로 표시하였어도 쌍방 의사합치 있는 이상 매매계약은 甲토지에 관하여 성립 → 乙토지에 매매 원인으로 소유권이전등기 마친 것은 원인 무효이므로 매도인은 등기말소청구 ○ [93다2629]", "의사표시"],
["045.⑤", "★ 반환소송을 당하게 된다면 아무런 보상도 받지 못한 채 부동산을 반환하여야 할 것으로 착각하고 이를 매도하는 매매계약을 체결한 경우 이는 동기의 착오에 불과하고, 그 동기를 의사표시의 내용으로 삼기로 하는 합의가 있어야만 매도인은 착오를 이유로 위 매매계약을 취소할 수 있다.", false, "▸ 동기를 당해 의사표시의 내용으로 삼을 것을 상대방에게 표시한 경우 착오 이유로 취소 ○, 동기를 내용으로 삼는 합의까지는 필요 없음 [97다26210]", "의사표시"],
["046.ㄴ", "★ 대리인이 상대방과 공모하여 대리권을 남용한 경우, 본인은 그에 따라 형성된 법률관계를 기초로 새로운 이해관계를 맺은 선의의 제3자에 대하여 무효를 주장할 수 없으며, 제3자의 악의는 무효를 주장하는 자가 주장·증명하여야 한다.", true, "▸ 107조 1항 단서 유추적용의 경우, 이렇게 형성된 법률관계를 기초로 새로운 법률상 이해관계를 맺은 선의의 제3자 보호 ○(107조 2항 유추), 제3자의 악의는 무효를 주장하는 자가 주장·증명해야 [2016다3201]", "의사표시"],
["046.ㄷ", "★ 임대차보증금반환채권의 양도계약이 통정허위표시로서 무효인 경우, 이를 알지 못한 채 임대차보증금반환채권에 대한 압류 및 추심명령을 받은 양수인의 채권자에 대해서도 양도인은 채권양도가 무효임을 주장할 수 없다.", true, "▸ 통정허위표시인 채권양도 후에 양수인의 채권자가 양도된 채권에 압류·추심명령 받은 경우 그는 108조 2항의 제3자 ○ [2013다59753]", "의사표시"],
["046.ㄹ", "채권의 준점유자에 대한 변제가 유효하기 위한 요건인 변제자의 '선의'는 변제자가 준점유자에게 변제수령 권한이 없다는 것을 알지 못하는 것만을 의미할 뿐 적극적으로 진정한 권리자라고 믿었음을 요하지 않는다.", false, "▸ 채권의 준점유자에 대한 변제 유효 요건인 선의는 준점유자에게 변제수령 권한 없음을 알지 못하는 것뿐만 아니라 적극적으로 진정한 권리자라고 믿었음을 필요로, 과실은 그렇게 믿는 데 과실 없음을 뜻함 [98다61593]", "의사표시"],
["047.ㄷ", "★ 파산채무자가 통정한 허위의 의사표시를 통하여 가장채권을 보유하고 있다가 파산이 선고된 경우 그 가장채권도 일단 파산재단에 속하게 되고, 파산관재인은 파산채무자의 포괄승계인이어서 「민법」 제108조 제2항의 통정허위표시의 제3자에 해당하지 않는다.", false, "▸ 파산자가 상대방과 통정허위표시를 통해 가장채권을 보유하다가 파산 선고된 경우 가장채권도 일단 파산재단에 속하게 되고, 파산선고에 따라 파산자와는 독립한 지위에서 파산채권자 전체의 공동이익을 위해 직무를 행하게 된 파산관재인은 그 허위표시에 따라 외형상 형성된 법률관계를 토대로 실질적으로 새로운 법률상 이해관계를 가지게 된 108조 2항의 제3자에 해당 ○ [2002다48214]", "의사표시"],
["047.ㄹ", "★ 「민법」 제108조 제2항의 통정한 허위의 의사표시의 무효로 대항할 수 없는 제3자는 선의이면 족하고 무과실은 요건이 아니다.", true, "▸ 108조 2항의 제3자는 선의이면 족하고 무과실은 요건이 아님 [2003다70041]", "의사표시"],
["048.①", "★ 甲이 실제 차주인 丙에 대한 여신제한 등의 규정을 회피하기 위하여 甲 자신 명의로 금융기관 乙과의 소비대차계약서에 서명날인했다 하더라도, 乙과 소비대차에 따른 법률효과를 丙에게 귀속시키기로 약정하거나 乙이 이를 양해하는 등 특별한 사정이 없는 이상, 甲과 乙 사이의 소비대차계약은 통정허위표시가 아니며 甲이 이 계약에 따른 채무를 부담한다.", true, "▸ 제3자가 은행을 직접 방문하여 금전소비대차약정서에 주채무자로서 서명·날인했다면, 여신도 제한한 채무자로 하여금 금대출받아 사용하도록 할 의도가 있었다거나 타인의 부담으로 상환하기로 했더라도 특별한 사정 없는 한 이는 소비대차계약에 따른 경제적 효과를 타인에게 귀속시키려는 의사일 뿐, 그 법률상 효과까지도 타인에게 귀속시키려는 진의 ✕, 제3자의 진의와 표시의 불일치 ✕, 통정허위표시 ✕ [98다17909]", "의사표시"],
["048.③", "★ 甲 은행이 乙과의 통정허위표시에 의한 가장의 대출채권을 보유하던 중 파산한 경우, 법원에 의해 선임된 파산관재인 丙은 통정허위표시에서의 제3자에 해당하며, 이때 선의의 여부는 丙을 기준으로 하는 것이 아니라 총 파산채권자를 기준으로 하여야 하므로, 파산채권자 모두가 악의가 아닌 이상 乙은 丙을 상대로 자신에게 대출채무가 존재하지 않는다고 주장할 수 없다.", true, "▸ 파산관재인의 선의·악의를 기준으로 할 수는 없고 총파산채권자를 기준으로 파산채권자 모두가 악의가 되지 않는 한 파산관재인은 선의의 제3자 ○ [2004다10299]", "의사표시"],
["048.④", "★ 甲이 부동산의 매수자금을 乙로부터 차용하고 그 담보조로 乙에게 가등기를 해 주기로 약정하였으나 그 부동산에 대한 자신의 다른 채권자들의 강제집행을 우려하여 丙에게 이 부동산을 양도한 다음 乙에게 가등기를 경료해 준 경우, 乙은 통정허위표시에서의 제3자에 해당하지 않는다.", false, "▸ 소유자로부터 담보가등기 받기로 약정한 자가 제3자 앞으로 허위의 소유권이전등기 마쳐진 후 이어 가등기 받았다면 허위표시의 제3자 ✕ — 형식상은 가장양수인으로부터 담보권을 설정받은 것이나 실질적으로는 새로운 법률원인으로 취득한 것 아니므로 [80다1403] → 그가 허위표시에 악의였더라도 그에 대해 가등기말소청구 ✕", "의사표시"],
["048.⑤", "★ 甲이 통정허위표시로 乙에게 甲 소유의 부동산에 관한 전세권설정등기를 해 준 이후 丙이 이 전세권을 목적으로 한 근저당권설정등기를 마친 다음 丁이 丙의 전세권근저당부 채권을 가압류한 경우, 설사 丁이 선의라 하더라도 丙이 악의인 이상 甲은 丁에게 위 전세권이 무효임을 주장할 수 있다.", false, "▸ 전세권근저당권자가 악의여도 전세권근저당부채권을 가압류한 자가 선의면 보호 ○ — ∵ 丙의 전세권근저당부채권은 허위표시에 의해 외형상 형성된 전세권을 목적물로 하는 전세권근저당의 피담보채권이고, 丁은 이러한 전세권근저당부채권을 가압류하고 압류명령 얻음으로써 그 채권에 관한 담보권의 목적물에 해당하는 전세권에 대해 새로이 법률상이해관계를 가지게 되었으므로 [2012다49292]", "의사표시"],
["049.ㄱ", "★ 甲과 乙 사이의 허위의 의사표시에 기한 채무를 보증하고 그에 따라 보증채무자로서 그 채무를 이행한 경우, 보증인 丙은 통정허위표시에서의 제3자에 해당한다.", true, "▸ 보증인은 보증채무 이행하면 구상권 취득 관련하여 법률상 이해관계가 되므로 제3자 ○ (이유 中: 보증금 지급 당시의 선의 여부로 판단) [99다51258]", "의사표시"],
["050.ㄹ", "★ 파산자가 통정허위표시를 통하여 가장채권을 보유하고 있다가 파산이 선고된 경우, 파산관재인은 그 허위표시에 따라 외형상 형성된 법률관계를 토대로 실질적으로 새로운 법률상 이해관계를 가지게 된 제3자에 해당하는데, 이때 선의의 여부는 파산관재인 개인을 기준으로 판단한다.", false, "▸ 총파산채권자를 기준으로 파산채권자 모두가 악의로 되지 않는 한 파산관재인은 선의의 제3자 ○ [2004다10299]", "의사표시"],
["SS의사1.ㄷ", "乙이 등기서류를 위조하여 甲의 부동산을 자기 앞으로 소유권이전등기를 한 후 丙에게 그 소유권이전등기를 경료한 경우, 丙이 이러한 사정을 알지 못했다면 민법 제108조 제2항을 유추적용하여 丙은 甲의 말소등기청구에 대항할 수 있다.", false, "▸ 甲으로부터 부동산에 관한 담보설정 대리권만 수여받은 乙이 자기 앞으로 부동산의 소유권이전등기를 마친 후 丙에게 매도하여 소유권이전등기를 경료한 경우 — 甲이 통정·용인했거나 알면서 방치한 것 아니라면 108조 제2항 유추 ✕ [80다1475] → 통정허위표시 유추적용 긍정설로 평가되는 판례(다수설) — 지문은 판례 단순 결론 묻는 것", "의사표시"],
["SS의사1.ㄹ", "★ 甲이 乙에게 대여금채권을 통하여 허위로 丙에게 양도하고 같은 날 乙이 이를 알지 못하는 乙에게 채권양도사실을 통지한 경우, 乙이 丙에게 채권양도사실을 알게 되었다 하여도 대여금채무를 이행하지 않았다면 乙은 허위표시의 무효를 이유로 대항할 수 없는 제3자가 아니다.", true, "▸ 원채권자가 퇴직금채권을 양도했다 하더라도 퇴직금채무자가 그 퇴직금을 동안 채권양도계약이 허위표시임이 밝혀진 이상 자신이 허위표시의 선의 제3자임을 내세워 진정한 퇴직금전부채권자에게 지급을 거절할 수 ✕ [82다594] → 가장 채권양도에서 채무자는 108조 2항 제3자 ✕", "의사표시"],
["051.ㄱ", "대리인이 본인을 속일 목적으로 상대방과 통정하여 허위표시를 한 경우, 그 의사표시가 유효라고 믿은 선의·무과실의 본인에게 상대방은 의사표시의 무효를 주장할 수 없다.", true, "▸ 대리인과 상대방 사이의 통정허위표시에서 본인을 제3자로 볼 수 있는지의 문제로서, 학설 대립 있는데 통설은 본인을 제3자로 볼 수 있다는 입장이며, 출제 시 관련 학설·판례 없으므로 출제되기 어려움", "의사표시"],
["051.ㄴ", "임대차보증금반환채권을 담보할 목적으로 임차인과 임대인 사이 합의로 임차인 명의로 임대인 소유 임차목적물에 전세권설정등기를 마친 경우, 임대인 겸 전세권설정자는 이러한 사정을 알고 전세권저당권 등기를 마친 자에게 전세권설정계약의 전부가 통정허위표시라 주장하여 전세권저당권설정등기의 말소를 청구할 수 있다.", false, "▸ 임대차보증금반환채권을 담보 목적으로 마친 임차인 명의의 전세권설정등기는 유효 ○ — ∵ 전세금 지급은 이미 지급한 임대차보증금으로 대신, 장차 목적물 사용·수익 완전 배제 아님 — 이때 임대인과 임차인이 그 임대차보증금반환채권 담보 목적 의미의 전세권설정계약을 체결했다면 이 전세권설정계약은 통정허위표시로서 무효인 것이 아니라 임대차보증금반환채권의 담보를 위한 정당한 약정으로 유효 ○ [2018다268538]", "의사표시"],
["052.ㄷ", "★ 통정 허위표시를 원인으로 한 부동산에 관한 가등기 및 그 가등기에 기한 본등기로 인하여 丁의 소유권이전등기가 말소된 후 이러한 사실을 모르고 위 본등기에 터잡아 부동산에 대하여 소유권이전등기를 마친 양수인 戊를 상대로 丁이 소유권이전등기말소청구의 소를 제기한 경우에는 위 허위표시의 당사자·포괄승계인이 이외의 자로서 허위표시에 의하여 외형상 형성된 법률관계를 토대로 실질적으로 새로운 법률상 이해관계 맺은 선의의 제3자에 대하여는, 허위표시 당사자뿐 아니라 그 누구도 대항 ✕ → 허위표시에 의한 가등기, 그에 기한 본등기로 인하여 직권말소 소유권이전등기 마친 자에 대해 허위표시 무효 주장 ✕ [94다12074]", true, "▸ 허위표시의 당사자·포괄승계인 이외의 자로서 허위표시에 의하여 외형상 형성된 법률관계를 토대로 실질적으로 새로운 법률상 이해관계 맺은 선의의 제3자에 대하여는, 허위표시 당사자뿐 아니라 그 누구도 대항 ✕ → 허위표시에 의한 가등기, 그에 기한 본등기로 인하여 직권말소 소유권이전등기 마친 자에 대해 허위표시 무효 주장 ✕ [94다12074]", "의사표시"],
["053.④", "★ 통정허위표시에 의한 근저당권에 기하여 배당이 이루어진 경우, 배당채권자는 통정허위표시의 무효를 주장하여 그에 기한 배당이의의 소를 제기할 수 있다.", true, "▸ 허위 근저당권에 배당 이뤄진 경우, 배당채권자는 채권자취소소송으로 통정허위표시를 취소하지 않았더라도 그 무효를 주장하여 그 채권의 존부·범위·순위에 관한 배당이의의 소 제기 ○ [2000다9611]", "의사표시"],
["054.④", "★ 재단법인의 설립을 위해 서면으로 재산을 출연한 자는 이를 기본재산으로 하여 법인이 설립된 경우에도 착오를 이유로 출연의 의사표시를 취소할 수 있다.", true, "▸ 서면에 의한 재단법인 설립의 출연행위(상대방 없는 단독행위)도 총칙규정에 따라 출연자의 착오를 이유로 취소 ○ — ∵ 555조의 비서면 해제는 착오 취소와 요건·효과 다름 [98다9045]", "의사표시"],
["055.①", "★ 매매계약 내용의 중요부분에 착오가 있는 경우, 매수인은 매도인의 하자담보책임이 성립하는지와 상관없이 착오를 이유로 매매계약을 취소할 수 있다.", true, "▸ 매매계약 내용 중요 부분에 착오 있다면 매수인은 매도인의 하자담보책임 성립 상관없이 착오 이유로 매매계약 취소 ○ — ∵ 착오 취소(109조)와 매도인 하자담보책임(580조)은 각 제도 취지·요건·효과 서로 다름 [2015다78703]", "의사표시"],
["055.②", "★ 매도인이 매수인의 채무불이행을 이유로 매매계약을 적법하게 해제한 후라도 매수인으로서는 착오를 이유로 취소권을 행사하여 매매계약 전체를 무효로 만들 수 있다.", true, "▸ 매도인이 매수인의 채무불이행으로 매매계약을 적법하게 해제한 후라도 매수인은 그 손해배상책임을 피하기 위해 착오로 취소 가능 ○ [91다11308]", "의사표시"],
["055.③", "★ 의사표시의 착오가 표의자의 중대한 과실로 발생하였으나 상대방이 표의자의 착오를 알고 이용한 경우, 표의자는 의사표시를 취소할 수 있다.", true, "▸ 상대방이 표의자의 중과실 알고 이용한 경우에는 표의자는 착오 취소 ○ [2013다49794]", "의사표시"],
["055.⑤", "★ 경과실에 의한 착오를 이유로 의사표시를 취소한 자는 상대방이 그 의사표시의 유효를 믿었음으로 인하여 발생한 손해에 대해 불법행위 책임을 진다.", false, "▸ 착오에 빠져 계약보증서 발급한 것이나 그 착오를 이유로 보증계약 취소한 것은 위법하지 ✕ → 불법행위 손해배상책임 ✕ [97다13023]", "의사표시"],
["056.ㄱ", "★ 甲이 제3자의 기망행위에 의하여 신원보증서류에 서명날인한다는 착오에 빠진 상태로 연대보증의 서면에 서명날인하였다면, 甲은 연대보증계약의 상대방이 위 기망행위를 알았거나 알 수 있었을 경우에만 연대보증계약을 취소할 수 있다.", false, "▸ 신원보증서에 서명날인 한다고 착각하여 연대보증서면에 서명날인한 경우 → 기망인의 착오로서 표시상의 착오 ○ — But 착오가 제3자 기망행위에 의한 의사표시라도 사기의 의한 의사표시라고 볼 수 없고 단지 의사와 표시의 불일치 있을 뿐이므로 의사표시 취소에 상대방의 악의·과실 조건 ✕ → 상대방이 악의·과실인 경우에 한하여 취소할 수 있다는 제3자 사기 규정 적용 ✕ [2004다43824]", "의사표시"],
["056.ㄴ", "★ 원고가 피고를 상대로 매매계약의 이행을 청구하는 소송에서 피고가 착오를 이유로 매매계약의 취소를 주장하는 경우, 피고는 착오가 자신의 중대한 과실에 의한 것이 아니라는 점에 대한 증명책임을 진다.", false, "▸ 착오에 의한 의사표시 취소를 저지하려는 상대방은 표의자의 중대한 과실에 대한 증명책임 [2005다6228]", "의사표시"],
["SS의사2.ㄷ", "법률행위를 할 당시 의사표시자의 어떠한 인식이 장래에 있을 어떤 사항에 대한 단순한 예측이나 기대에 머무르는 것이 아니라 그 예측이나 기대의 근거가 되는 현재 사정에 대한 인식을 포함하고 있고 그 인식이 실제로 있는 사실과 일치하지 않는다면 이를 착오로 다룰 수 있다.", true, "▸ 어떠한 인식이 장래 사항에 대한 단순한 예측·기대에 머물지 않고 그 인식의 근거가 되는 현재 사정에 대한 인식 포함하고 있고 그 인식이 실제 사실과 일치하지 않는다면 착오 ○ — 특정 목적 위한 기부·후원 내용의 증여계약에서 목적이 계약 내용의 중요 부분에 관한 것인지는 재산권 무상 이전뿐 아니라 이전 목적이 중요한 특수성 업무에 두면서 여러 사정 종합적 고려하여 판단해야 [2024다206760]", "의사표시"],
["057.ㄱ", "★ 보증인인 전문건설공제조합이 착오를 이유로 채권자(도급인)와 체결한 보증계약을 적법하게 취소한 경우, 공제조합이 해당 조합원(채무자 겸 수급인)의 실제 도급금액을 확인하지 않고 계약보증서를 발급한 잘못이 있다고 하더라도, 공제조합은 채권자 겸 도급인에 대하여 불법행위위책임을 부담하지 않는다.", true, "▸ 착오에 빠져 계약보증서 발급한 것이나 그 착오를 이유로 보증계약 취소한 것은 위법하지 ✕ → 불법행위 손해배상책임 ✕ [97다13023]", "의사표시"],
["057.ㄹ", "계약당사자 쌍방이 계약의 전제·기초사항에 같은 내용의 착오가 있고 이로 인해 그에 관한 구체적 약정을 하지 않았다면, 당사자가 그러한 착오가 없었다면 약정하였을 것으로 보이는 내용으로 당사자의 의사를 보충하여 계약을 해석할 수 있다.", true, "▸ 계약당사자 쌍방이 계약의 전제·기초사항에 같은 내용의 착오가 있고 이로 인해 그에 관한 구체적 약정 하지 않았다면, 당사자가 그런 착오 없었다면 약정했을 것으로 보이는 내용으로 보충하여 계약 해석 가능 ○ [2005다13288]", "의사표시"],
["058.④", "★ 동기의 착오를 이유로 의사표시를 취소하기 위하여 먼저 그 동기를 의사표시의 내용으로 삼을 것을 상대방에게 표시하여 의사표시의 해석상 동기가 법률행위의 내용으로 되어 있어야 한다.", true, "▸ 동기를 당해 의사표시의 내용으로 삼을 것을 상대방에게 표시한 경우 착오 이유로 취소 ○, 동기를 내용으로 삼는 합의까지는 필요 없음 [97다26210]", "의사표시"],
["059.②", "★ 착오를 이유로 의사표시를 취소하는 자는 법률행위의 내용에 착오가 있었다는 사실과 함께 그 착오가 의사표시에 결정적인 영향을 미쳤다는 점, 즉 만약 착오가 없었다면 그 의사표시를 하지 않았을 것이라는 점을 증명하여야 한다.", true, "▸ 착오로 취소하는 자는 '법률행위 내용의 중요부분의 착오'라는 사실에 대해 증명책임 [2007다74188]", "의사표시"],
["060.ㄴ", "■보충 매수인이 매도인의 기망행위로 인하여 부동산을 고가에 매수하게 됨으로써 입게 된 손해는 부동산의 매수 당시 시가와 매수가격과의 차액이고, 그 후 부동산 시가가 상승하여 매수가격을 상회하게 되었다고 하여 매수인에게 손해가 발생하지 않았다고 할 수는 없다.", true, "▸ 매도인 기망행위로 부동산을 고가 매수하여 입게 된 손해는 매수 당시 시가와 매수가격의 차액 ○ → 그 후 매수인이 일부에서 보상금 수령했거나 부동산 시가가 상승으로 매수가격 상회했다 하여도 이미 손해 발생한 것 ○ [2009다91828]", "의사표시"],
["061.③", "★ 강박에 의하여 의사표시를 한 당사자가 그 의사표시가 강박에 의한 것이어서 당연무효라고 하는 주장 속에는 강박에 의한 의사표시를 취소한다는 주장이 포함되어 있다고 볼 수 없다.", false, "▸ [민소] [95다40038]", "의사표시"],
["062.②", "★ 착오가 착오자를 경제적으로 더 불이익하게 하지 않는 경우에는 법률행위의 중요부분의 착오라고 할 수 없다.", true, "▸ 착오로 인하여 표의자가 경제적 불이익을 입은 것이 아니라면 중요부분 ✕ [2006다41457]", "의사표시"],
["063.ㄱ", "甲은 자기 소유의 X 토지를 적절한 가격에 매도할 것을 乙에게 위임하면서 그에 관한 대리권도 함께 수여하였다.§★ 甲의 대리인으로서 X 토지에 관하여 丙과 매매계약을 체결한 후 중도금까지 받았다는 사정을 알고 있는 丁이 乙에게 적극적으로 매도를 요청하여 乙이 甲의 대리인으로서 丁에게 다시 X 토지를 매도하고 소유권이전등기까지 마쳐주었다면, 甲이 이러한 사실을 몰랐다고 하더라도 甲과 丁 사이의 매매계약은 무효이다.", true, "▸ 이중매매에서 대리인의 적극가담 사실을 본인이 몰랐거나 반사회성 야기한 것 아니더라도 매매계약은 103조 위반 무효 [97다45532] → 다만, 판례는 '제2매수인' 측 대리인이 '배임행위에 적극 가담'한 사안이고, 지문은 '매도인' 측 대리인(제2매수인의 적극 가담에 따라) '배임행위'를 한 사안이므로 판례 변형 지문으로 볼 수 있음", "대리"],
["063.ㄴ", "★ 乙이 甲의 대리인으로서 X 토지에 관하여 丙과 매매계약을 체결하면서 丙에게 위한 강박을 하였다면, 丙은 甲이 이러한 사실을 알았거나 알 수 있었을 경우에 한하여 甲과의 매매계약을 취소할 수 있다.", false, "▸ 은행의 출장소장처럼 대리인 등 상대방과 동일시할 수 있는 자는 제3자 ✕ (상대방 선악 불문 취소 ○), 단순한 피용자는 제3자 ○ [96다41496, 98다60828] → 대리인의 기망이나 강박은 제3자 사기·강박 아닌 당사자 사기·강박이므로 상대방 선악의 불문하고 취소 ○", "대리"],
["063.ㄷ", "★ 乙이 甲의 대리인으로서 X 토지에 관하여 丙과 매매계약을 체결하였는데 丙이 약정한 날짜에 잔금을 지급하지 않은 경우, 乙이 丙에게 상당한 기간을 정하여 이행의 최고를 하였으나 그 기간 내에 丙이 잔금을 지급하지 않았다면 乙은 위 매매계약을 해제할 수 있다.", false, "▸ 계약체결 대리권 → 해제 권한 ✕, 원상회복 수령 권한 ✕ → 계약체결 대리인이 계약 해제 등 일체 처분과 상대방의 의사수령 권한 ✕ — ∵ 수권된 법률행위를 하면 원인된 법률관계의 목적 달성으로 종료하고 임의대리권도 소멸하므로(128조) [85다카1971]", "대리"],
["063.ㄹ", "乙이 甲의 대리인으로서 甲의 허락 없이 자기를 X 토지의 매수인으로 하는 계약을 체결하였다면, 그 계약은 특별한 사정이 없는 한 무효이다.", true, "▸ 제124조(자기계약, 쌍방대리) 대리인은 본인의 허락이 없으면 본인을 위하여 자기와 법률행위를 하거나 동일한 법률행위에 관하여 당사자 쌍방을 대리하지 못한다. 그러나 채무의 이행은 할 수 있다.", "대리"],
["064.③", "丙이 제3자 丁으로부터 기망을 당하여 乙과 매매계약을 체결한 경우, 乙이 丁의 기망사실을 안 때에 한하여 丙은 사기에 의한 의사표시를 이유로 매매계약을 취소할 수 있다.", false, "▸ 제110조(사기, 강박에 의한 의사표시) ② 상대방있는 의사표시에 관하여 제삼자가 사기나 강박을 행한 경우에는 상대방이 그 사실을 알았거나 알 수 있었을 경우에 한하여 그 의사표시를 취소할 수 있다. → 제3자 사기이므로 상대방도 결국은 대리인인 乙인데, 이때 상대방도 악의·과실인 경우에 한하여 취소 가능한데, '알 수 있었을 경우'도 포함 → 지문은 '알았을 때'만 취소 가능하다고 했으므로 틀림", "대리"],
["064.⑤", "甲이 乙에게 대리권을 수여한 후 甲에 대하여 성년후견이 개시되더라도 乙의 대리권은 소멸하지 않는다.", false, "▸ 제127조(대리권의 소멸사유) 대리권은 다음 각 호의 어느 하나에 해당하는 사유가 있으면 소멸된다. 2. 대리인의 사망, 성년후견의 개시 또는 파산 → 본인에게 성년후견 개시되면 임의대리권 소멸 사유에 해당", "대리"],
["065.②", "★ 乙이 매매계약을 체결하면서 甲을 위한 것임을 표시하지 않았지만 乙이 甲의 대리인으로서 계약을 체결하고 있다는 점을 丙이 알았다면 甲과 丙 사이에 매매계약이 유효하게 성립한다.", true, "▸ 제115조(본인을 위한 것임을 표시하지 아니한 행위) 대리인이 본인을 위한 것임을 표시하지 아니한 때에는 그 의사표시는 자기를 위한 것으로 본다. 그러나 상대방이 대리인으로서 한 것임을 알았거나 알 수 있었을 때에는 전조제1항의 규정을 준용한다.", "대리"],
["065.③", "丙이 乙에게 매매대금을 지급하였다면 비록 乙이 매매대금을 甲에게 전달하지 않았다고 하더라도 丙의 변제는 유효하다.", true, "▸ 계약 체결 대리인은 본인을 위하여 계약상 급부를 변제로 수령할 권한 ○ → 계약 체결된 대리인이 급부 수령한 후 채무불이행으로 계약 해제되면 원상회복의무는 대리인이 아니라 계약 당사자인 본인이 부담 → 이는 본인이 대리인으로부터 급부를 현실적 인도받지 못했거나 해제 원인이 대리인 책임이어도 동일 [2011다30871]", "대리"],
["065.④", "복대리인 선임에 관한 甲의 승낙이 없는 경우에도 부득이한 사유가 있는 때에는 乙은 복대리인을 선임하여 그로 하여금 丙과 매매계약을 체결하도록 할 수 있다.", true, "▸ 제120조(임의대리인의 복임권) 대리권이 법률행위에 의하여 부여된 경우에는 대리인은 본인의 승낙이 있거나 부득이한 사유있는 때가 아니면 복대리인을 선임하지 못한다.", "대리"],
["066.ㄴ", "★ 甲이 본인 乙을 위한 것임을 표시하여 이 사건 계약을 체결하였고, 2015. 3. 7. 丙으로부터 대금 1억 원을 수령하였다. 그 후 丙은 乙을 상대로 X 토지에 관한 소유권이전등기를 청구하였다. 만일 甲이 아직 위 1억 원을 乙에게 전달하지 않았다면 특별한 사정이 없는 한 乙은 대금이 지급되지 않았음을 이유로 이행을 거절할 수 있다.", false, "▸ 계약 체결 대리인은 본인을 위하여 계약상 급부를 변제로 수령할 권한 ○ → 대리인이 급부 수령한 후 채무불이행으로 계약 해제되면 원상회복의무는 계약 당사자인 본인이 부담 [2011다30871]", "대리"],
["066.ㄷ", "★ 甲이 乙로부터 대리권을 수여받음을 이용하여 매매대금을 乙에게 전달하지 않고 자신의 유흥비로 소비할 의도를 가지고 본인 乙을 위한 것임을 표시하여 이 사건 계약을 체결하였고, 2015. 3. 7. 丙으로부터 대금 1억 원을 수령하여 유흥비로 사용하였다면, 丙이 이 사건 계약 체결 당시 위와 같은 甲의 의도를 알 수 있었다 하더라도 乙은 丙에게 이 사건 X 토지에 관한 소유권이전등기의 의무를 부담한다.", false, "▸ 대리권남용: 대리인이 대리권 범위 내에서 대리행위 했지만 본인의 이익이 아닌 대리인 자신이나 제3자의 이익을 위해 한 경우, 대리권남용 사실에 대한 상대방 인식을 이유로 효력 부인 → 107조 1항 단서 유추적용하여 본인은 아무런 책임 ✕ [94다29850]", "대리"],
["067.①", "★ 매매계약의 체결과 이행에 관하여 포괄적으로 대리권을 수여받은 대리인이라도 특별한 사정이 없는 한 상대방에 대하여 약정된 매매대금 지급기일을 연기해 줄 권한은 갖지 않는다.", false, "▸ 계약체결 대리권 → 대금수령 권한 ○, 대금 지급기일 연기 권한 ○(체결·이행에 포괄적 대리권 수여받은 경우) [91다43107]", "대리"],
["067.③", "★ 甲 소유의 X 토지에 관하여 매매계약을 체결할 대리권을 수여받은 乙이 매수인 丙으로부터 잔금을 수령하였다면, 특별한 사정이 없는 한 乙이 잔금을 甲에게 전달하지 않았더라도 丙의 잔금지급채무는 소멸한다.", true, "▸ 계약 체결 대리인은 본인을 위하여 계약상 급부를 변제로 수령할 권한 ○ [2011다30871]", "대리"],
["068.ㄱ", "★ 본인은 기초적 법률관계가 종료하기 이전에도 수권행위를 철회하여 대리권을 소멸시킬 수 있다.", true, "▸ 제128조(임의대리의 종료) 법률행위에 의하여 수여된 대리권은 전조의 경우 외에 그 원인된 법률관계의 종료에 의하여 소멸한다. 법률관계의 종료전에 본인이 수권행위를 철회한 경우에도 또한 같다.", "대리"],
["068.ㄴ", "★ 미성년자의 부모가 공동으로 친권을 행사하는 경우에 부모 일방이 다른 일방의 의사에 반하여 공동의 명의로 미성년자를 대리한다는 사실을 상대방이 알았다면 그 대리행위는 효력이 없다.", true, "▸ 제920조의2(공동친권자의 일방이 공동명의로 한 행위의 효력) 부모가 공동으로 친권을 행사하는 경우 부모의 일방이 공동명의로 자를 대리하거나 자의 법률행위에 동의한 때에는 다른 일방의 의사에 반하는 때에도 그 효력이 있다. 그러나 상대방이 악의인 때에는 그러하지 아니한다.", "대리"],
["068.ㄷ", "★ 대리인과 계약을 체결한 상대방이 본인에 대하여 그 이행을 청구하는 경우, 대리권의 존재에 대한 증명책임은 그 상대방이 부담한다.", false, "▸ [2008다42195] → 대리권의 존재는 추정되지 않으며 그 주장자가 증명하여야 → 다만 등기의 추정력을 받는 자가 대리를 주장하면 등기 추정력에 의해 대리권도 추정됨", "대리"],
["069.①", "★ 대리인이 본인을 대리하여 부동산을 매수함에 있어서 이중매매라는 사정을 잘 알고 매도인의 배임행위에 적극 가담하더라도 본인이 그러한 사정을 몰랐거나 알 수도 없었다면 대리인이 한 부동산 매매계약을 반사회적 법률행위라고 볼 수 없다.", false, "▸ 이중매매에서 대리인의 적극가담 사실을 본인이 몰랐거나 반사회성 야기한 것 아니더라도 매매계약은 103조 위반 무효 [97다45532]", "대리"],
["070.①", "★ 甲이 乙의 대리인 丙과 매매계약을 체결한 후 丙의 기망행위를 이유로 매매계약을 취소하고자 할 경우, 甲은 乙이 丙의 기망행위를 알았거나 알 수 있었는지의 여부를 불문하고 매매계약을 취소할 수 있다.", true, "▸ 대리인 등 상대방과 동일시할 수 있는 자는 제3자 ✕ → 제3자 사기 아닌 당사자 사기이므로 상대방의 선악의 불문하고 110조 1항으로 취소 ○ [98다60828]", "대리"],
["071.ㄹ", "★ 대리인이 복대리인을 선임할 권한이 없음에도 불구하고 선임한 복대리인에 의하여 체결된 본인 명의 계약에서, 유권대리행위로 믿고 그렇게 믿을 만한 정당한 사유가 인정되는 상대방은 그 계약의 효력을 본인에게 주장할 수 있다.", true, "▸ 복대리인 선임권 없는 대리인에 의해 선임된 복대리인의 권한도 126조 기본대리권 ○, 만일 행위자가 복대리인 아닌 사자라 해도 대리인 별도로 있고 그에게 기본대리권이 수여된 이상 기본대리권 ○ [97다48982]", "대리"],
["072.③", "★ 甲이 乙 소유의 부동산에 관하여 乙의 대리인 丙과 매매계약을 체결하고 이를 원인으로 소유권이전등기를 마쳤으나 乙이 무권대리를 이유로 등기말소를 구하는 경우, 丙의 대리권 없음은 乙이 증명하여야 한다.", false, "▸ 부동산 매수하여 '등기한 자'가 전 소유자의 대리인으로부터 매수했다고 주장하면 대리권 존재도 추정 ○ [79다645]", "대리"],
["073.⑤", "★ 임의대리인은 그 책임으로 복대리인을 선임할 수 있으나, 법정대리인은 본인의 승낙이 있는 경우에 한하여 복대리인을 선임할 수 있다.", false, "▸ 제122조(법정대리인의 복임권과 그 책임) 법정대리인은 그 책임으로 복대리인을 선임할 수 있다. 그러나 부득이한 사유로 인한 때에는 전조제1항에 정한 책임만 있다.", "대리"],
["074.①", "★ 표현대리가 성립하는 경우, 본인은 상대방에 대하여 표현대리행위에 따른 전적인 책임을 져야 하고, 상대방에게 과실이 있다고 하더라도 과실상계의 법리는 유추적용되지 아니한다.", true, "▸ 표현대리가 성립하면 본인은 상대방에게 전적인 책임 ○, 과실상계 유추 ✕ [95다49554]", "대리"],
["075.①", "★ 甲의 대리행위가 권한을 넘은 표현대리에 해당하는지 여부를 판단함에 있어서 정당한 이유의 존부는 甲의 대리행위시를 기준으로 판단하여야 한다.", true, "▸ 권한을 넘은 표현대리에서 정당한 이유의 존부는 대리행위시를 기준으로 판단 [81다322]", "대리"],
["075.③", "★ 丙이 乙을 상대로 제기한 위 매매계약의 이행청구 소송에서 丙이 甲의 행위가 유권대리에 해당한다고 주장한 경우, 그 주장 속에는 甲의 행위가 표현대리에 해당한다는 주장이 포함되어 있는 것으로 볼 수 없다.", false, "▸ 유권대리 주장 속에 무권대리에 속하는 표현대리 주장 포함되지 ✕ — ∵ 표현대리가 성립된다 = 무권대리 성질로 전환 ✕, 양자 주요사실이 다름(유권대리는 본인 수권행위 중심, 표현대리는 대리권 없음에도 법률로 본인에게 효과 미치는 것) [83다카1489]", "대리"],
["SS대리1.②", "★ 본인의 성명을 모용하여 자기가 마치 본인인 것처럼 기망하여 본인 명의로 직접 법률행위를 한 경우에는 특별한 사정이 없는 한 민법 제126조 소정의 표현대리는 성립될 수 없다.", true, "▸ 126조 표현대리는 대리인이 본인을 위한다는 의사 표시하거나 대리의사를 가지고 권한 외의 행위하는 경우에 성립, 사술을 써서 대리행위 표시 없이 단지 본인 성명을 모용하여 마치 본인인 것처럼 기망하여 본인 명의로 직접 법률행위한 경우는 '특별한 사정'이 없는 한 표현대리 ✕ [2001다49814]", "대리"],
["SS대리1.③", "법률행위의 체결 및 성립 여부에 관한 최종적인 결정권한이 본인에게 유보되어 있다는 사정은 대리와 사자를 구별하는 결정적 기준이나 징표가 된다.", false, "▸ 대리는 행위자 본인에게 효력 발생할 의사표시 내용을 스스로 결정하여 상대방과 관계에서 자신 이름으로 법률행위를 체결·성립시키고, 사자는 본인이 완성해 둔 의사표시의 단순한 전달자 → 법률행위 체결·성립 여부에 관한 최종적 결정권한이 본인에게 유보되어 있다는 점 → 대리인도 본인의 지시에 따라 행위(116조 2항) → 상대방의 합리적 시각을 중심으로 행위자가 지칭하는 자격·지위·역할 표시 내용, 행위자의 구체적 역할, 행위자의 권한·재량 부여 여부 등을 종합하여 합리적 판단해야 [2023다225580]", "대리"],
["SS대리1.⑤", "민법 제126조의 표현대리에서 표현대리인이 대리권을 갖고 있다고 믿는 데 상대방의 과실이 있는지는 계약 성립 당시의 제반사정 및 표현대리인의 주관적 사정을 함께 고려하여 결정하여야 한다.", false, "▸ 126조 정당한 이유 여부는 대리행위(매매계약) 당시를 기준으로 제반사정을 객관적으로 관찰하여 결정, 매매계약 성립 이후의 사정은 고려 ✕ [2017다2472]", "대리"],
["076.②", "법정대리인인 친권자가 부동산을 매수하여 이를 그 자(子)에게 증여하는 행위는 미성년자인 자(子)에게 이익만을 주는 행위이므로 친권자와 자(子) 사이의 이해상반행위에 속하지 않고, 또 자기계약이지만 유효하다.", true, "▸ 이해상반행위 제921조는 제124조의 특칙으로서 형식적인 판단설이 아닌 이해 대립이 실질적으로 생길 수 있는 행위인지 기준으로 하므로, 위 증여는 '자기계약'이지만 이해상반행위 아니며 금지도 되지 않음(이는 '형식적 판단설'과는 별개의 논의이므로 구별)", "대리"],
["076.③", "★ 호텔운영업자 甲이 호텔의 시설이용·우대회원 모집계약을 乙과 체결하고, 乙이 甲의 판매점, 총대리점 등의 명칭을 사용하여 회원모집 안내를 하거나 입회계약을 체결하는 것을 甲이 묵인하였다면, 민법 제125조의 표현대리가 성립할 여지가 있다.", true, "▸ 자신의 직함·명칭 등 사용을 승낙·묵인했다면 대리권 수여 표시 ○ → 호텔 시설이용·우대회원 모집계약 체결하면서 자신의 판매점·총대리점·연락사무소 등 명칭 사용하여 회원 모집 안내나 입회계약 체결하는 것을 甲이 승낙·묵인한 경우 125조 ○ [97다53762]", "대리"],
["076.④", "★ 대리인이 대리권 소멸 후 복대리인을 선임하여 복대리인으로 하여금 상대방과 사이에 대리행위를 하도록 한 경우, 상대방이 대리권 소멸 사실을 알지 못하여 복대리인에게 적법한 대리권이 있는 것으로 믿었고 과실이 없다면 민법 제129조에 따른 표현대리가 성립할 여지가 있다.", true, "▸ 대리인이 대리권 소멸 후 복대리인을 선임하여 대리행위를 하도록 한 경우도 상대방이 대리권 소멸 사실 알지 못하여 복대리인에게 적법한 대리권 있는 것으로 믿고 과실 없다면 제129조에 따른 표현대리 성립 ○ [97다55317]", "대리"],
["077.④", "★ 대리인이 대리권 소멸 후 복대리인을 선임하여 복대리인으로 하여금 상대방과 사이에 대리행위를 하도록 한 경우에는 민법 제129조에 따른 표현대리가 성립할 여지가 없다.", false, "▸ 대리인이 대리권 소멸 후 복대리인 선임하여 대리행위하도록 한 경우도 상대방이 대리권 소멸 사실 알지 못하여 복대리인에게 적법한 대리권 있는 것으로 믿고 과실 없다면 129조 표현대리 ○ [97다55317]", "대리"],
["078.⑤", "★ 처가 남편 몰래 관련 서류를 위조하여 제3자를 남편으로 가장시켜 남편 소유의 부동산을 담보로 제공하고 금융기관으로부터 남편 명의로 대출을 받은 경우, 제3자를 남편이라고 믿은 금융기관은 그 계약에 기하여 남편에게 대출금반환청구를 할 수 있다.", false, "▸ 126조 표현대리는 대리인이 본인을 위한다는 의사 표시하거나 대리의사를 가지고 권한 외의 행위하는 경우에 성립, 사술을 써서 대리행위 표시 없이 단지 본인 성명을 모용하여 마치 본인인 것처럼 기망하여 본인 명의로 직접 법률행위한 경우는 '특별한 사정'이 없는 한 표현대리 ✕ [2001다49814]", "대리"],
["079.ㄱ", "★ 매매계약 체결 당시 A에게 대리권이 없음을 알지 못한 乙이 甲의 추인이 있기 전에 甲에 대하여 계약을 철회하는 의사표시를 한 경우, 매매계약은 확정적으로 무효가 되어 甲은 A의 무권대리행위를 추인할 수 없다.", true, "▸ 상대방이 유효한 134조 철회권 행사하면 무권대리행위는 확정적 무효, 그 후에는 본인이 추인을 무권대리인에게 한 경우에도 소급효 ✕ [2017다213838]", "대리"],
["079.ㄴ", "■보충 甲이 乙에게 매매대금을 4억 원으로 변경하여 추인의 의사표시를 한 경우, 乙과의 매매계약은 특별한 사정이 없는 한 매매대금을 4억 원으로 하는 계약으로서 효력이 있다.", false, "▸ 무권대리 추인은 일부에 대하여 하거나 내용을 변경하여 추인하면 상대방의 동의 없는 한 추인 무효 [81다카549]", "대리"],
["079.ㄷ", "★ 乙이 A에게 대리권이 있다고 믿을 만한 정당한 사유가 인정되는 경우, 甲은 乙에 대하여 매매계약을 이행할 책임이 있다. 여기서 정당한 사유가 있는지는 대리행위 당시뿐만 아니라 이후의 사정을 종합적으로 고려하여 판단하여야 한다.", false, "▸ 126조 정당한 이유 여부는 대리행위(매매계약) 당시를 기준으로 제반사정을 객관적으로 관찰하여 결정, 매매계약 성립 이후의 사정은 고려 ✕ [81다322, 2017다2472]", "대리"],
["079.ㄹ", "A가 「민법」 제135조 제1항에 따른 무권대리인의 책임을 지는 경우, A는 乙의 선택에 따라 乙에 대하여 매매계약을 이행할 책임 또는 손해를 배상할 책임이 있다.", true, "▸ 제135조(상대방에 대한 무권대리인의 책임) ① 다른 자의 대리인으로서 계약을 맺은 자가 그 대리권을 증명하지 못하고 또 본인의 추인을 받지 못한 경우에는 그는 상대방의 선택에 따라 계약을 이행할 책임 또는 손해를 배상할 책임이 있다.", "대리"],
["080.ㄴ", "★ 위 매매계약에서 甲의 채무불이행에 대비한 손해배상액이 예정된 경우, 甲의 추인 거절로 丙이 乙에게 매매계약의 이행을 구하였으나 乙이 이행하지 아니하여 손해배상책임을 진다면, 특별한 사정이 없는 한 그 책임은 위 손해배상액의 예정에 따라 정해진다.", true, "▸ 135조 책임으로 상대방이 계약이행 선택하면 무권대리인은 본인이 부담했을 것과 같은 내용의 채무 이행해야 → 채무불이행 손해배상액도 ○, 손배액 예정조항 있다면 그에 따르고 과다면 감액 ○ [2018다210775]", "대리"],
["081.①", "★ 甲이 乙의 대리권 없음을 이유로 丙에게 위 매매계약을 원인으로 마쳐진 소유권이전등기의 말소를 구하는 소를 제기하는 경우, 甲은 乙의 대리권 부존재를 증명하여야 한다.", true, "▸ 부동산 매수하여 '등기한 자'가 전 소유자의 대리인으로부터 매수했다고 주장하면 대리권 존재도 추정 ○ [79다645] → 말소를 구하는 자가 대리권 부존재를 증명해야", "대리"],
["081.⑤", "★ 위 매매계약에서 甲의 채무불이행에 대비한 손해배상액이 예정된 경우, 乙이 무권대리인으로서 丙에 대하여 계약이행의 채무를 부담하게 되었으나 이를 이행하지 아니하여 손해배상책임을 지다면, 특별한 사정이 없는 한 그 책임은 위 손해배상액의 예정에 따라 정해진다.", true, "▸ 135조 책임으로 상대방이 계약이행 선택하면 무권대리인은 본인이 부담했을 것과 같은 내용의 채무 이행해야 → 채무불이행 손해배상액도 ○, 손배액 예정조항 있다면 그에 따르고 과다면 감액 ○ [2018다210775]", "대리"],
["082.ㄷ", "무권대리의 상대방이 본인에게 추인여부를 밝힐 것을 상당한 기간을 정하여 최고하였는데 본인이 최고기간 내에 확답을 발하지 않은 경우 추인을 거절한 것으로 본다.", true, "▸ 제131조(상대방의 최고권) 대리권없는 자가 타인의 대리인으로 계약을 한 경우에 상대방은 상당한 기간을 정하여 본인에게 그 추인여부의 확답을 최고할 수 있다. 본인이 그 기간내에 확답을 발하지 아니한 때에는 추인을 거절한 것으로 본다.", "대리"],
["082.ㄹ", "★ 무권대리의 상대방이 본인을 상대로 무권대리임을 몰랐고 모르는 데 과실이 없는 상태에서 무권대리인과 계약을 체결한 후 본인이 사망하여 무권대리인이 본인을 단독상속한 경우, 무권대리인은 무권대리의 추인을 거절할 수 없다.", true, "▸ 무권대리인이 본인을 상속한 경우 상대방에게 무권대리 주장하며 거절 ✕ — 135조 이행책임 있으므로 신의칙·모순행위금지 위반 [94다20617]", "대리"],
["083.②", "★ 甲이 乙의 자녀로서 대리권 없이 丙과 위 매매계약 체결 후 丙에게 X 토지의 소유권이전등기까지 마쳐주고, 丙은 X 토지를 丁에게 매도하여 소유권이전등기를 마쳐준 경우라면 甲이 단독상속인이 된 경우라도 甲은 丁을 상대로 그 등기의 무효를 주장하며 말소를 구할 수 있다.", false, "▸ 무권대리인이 본인을 상속한 경우 상대방에게 무권대리 주장하며 거절 ✕ — 135조 이행책임 있으므로 신의칙·모순행위금지 위반 [94다20617]", "대리"],
["083.④", "★ 丙이 乙을 상대로 위 매매계약에 기해 소유권이전등기청구의 소를 제기할 경우, 丙은 乙의 대리권 존재를 주장·증명하여야 하고, 이러한 유권대리의 주장 속에는 표현대리의 주장이 당연히 포함되어 있는 것으로 볼 수 없다.", true, "▸ 유권대리 주장 속에 무권대리에 속하는 표현대리 주장 포함되지 ✕ [83다카1489]", "대리"],
["084.ㄷ", "★ 계약이 대리인에 의하여 체결된 경우, 그 대리인의 진의가 본인의 이익이나 의사에 반하여 자기 또는 제3자의 이익을 위한 것이고 상대방이 그 사정을 알았거나 알 수 있었다면, 본인은 대리행위에 따른 계약상의 책임을 지지 아니한다.", true, "▸ 비진의표시가 대리인에 의해 이뤄지고 대리인의 진의가 본인의 이익·의사에 반하여 자기·제3자의 이익 위한 배임적인 것을 그 상대방이 알았거나 알 수 있었을 경우, 107조 1항 단서 유해석상 그 대리인의 행위에 대하여 본인은 아무런 책임 ✕ [94다29850]", "대리"],
["085.①", "★ ■보충 근로자의 기망으로 체결된 근로계약이 사용자에 의해 적법하게 취소된 경우, 이미 제공된 근로자의 노무를 기초로 형성된 취소 이전의 법률관계는 소급적으로 그 효력을 잃는다.", false, "▸ 근로계약은 기본적 법적 성질이 사법상 계약 → 계약체결에 관한 당사자들 의사표시에 무효·취소 사유 있으면 주장 ○ — 다만 그동안의 근로자의 노무제공 효과를 소급하여 부정하는 것은 타당하지 ✕ → 취소 의사표시 이후 장래에 관하여만 근로계약 효력 소멸 [2013다25194]", "무효와취소"],
["085.②", "★ 매매계약이 약정된 매매대금의 과다로 말미암아 불공정한 법률행위로서 무효인 경우, 당사자 쌍방이 무효를 알았더라면 대금을 다른 액으로 정하여 매매계약에 합의하였을 것이라고 인정되는 때에는, 그 다른 대금액을 내용으로 하는 매매계약이 유효하게 성립할 수 있다.", true, "▸ 매매대금 과다로 매매계약이 104조 불공정한 법률행위로서 무효인 경우에도 138조 무효행위 전환 적용 ○ → 쌍방이 무효 알았더라면 대금을 다른 액으로 정하여 합의했을 것으로 예외적 인정되는 경우는 그 대금액의 매매계약 유효 성립 ○ → 대금액은 가정적 의사, 시가는 참고자료에 불과 [2009다50308]", "무효와취소"],
["086.ㄱ", "★ 「농지법」에 따른 제한을 회피하고자 「부동산 실권리자명의 등기에 관한 법률」을 위반하여 무효인 명의신탁약정에 따라 명의신탁자가 명의수탁자에게 등기를 넘겨주는 행위는, 사회질서에 반하는 행위여서 「민법」 제746조 본문의 불법원인급여에 해당되어, 명의신탁자는 명의수탁자를 상대로 진정명의의 회복을 원인으로 한 소유권이전등기를 구할 수 없다.", false, "▸ 농지법 제한 회피하고자 실명법을 위반하여 명의수탁자 명의로 등기해도 신탁자는 수탁자를 상대로 등기말소 ○, 불법원인급여 ✕ — ∵ 실명법도 부동산 소유권을 실질적으로 수탁자에게 귀속시킴을 전제로 규율하지 않음, 명의신탁을 반사회적인지 아닌지 구분하여 적용 달리해서는 ✕ [2013다218156]", "무효와취소"],
["086.ㄷ", "★ 무권리자가 타인의 권리를 처분한 경우에는 특별한 사정이 없는 한 권리가 이전되지 않지만 권리자가 무권리자의 처분을 추인하는 것은 허용되며, 그 경우 「민법」 제130조의 무권대리에 관한 규정 및 같은 법 제133조의 추인의 효력에 관한 규정을 유추 적용할 수 있다.", true, "▸ 무권리자의 처분행위에 대한 권리자의 추인은 사적 자치 원칙에 따라 허용되고, 무권대리 추인과 이익상황 유사하므로 130조·133조를 유추적용 ○, 원칙적으로 계약체결시로 소급효 ○ [2017다3499]", "무효와취소"],
["SS무효1.①", "★ 토지거래허가를 받지 않아 유동적 무효상태인 매매계약의 경우 매도인이 매수인의 대금지급의무 불이행을 이유로 매매계약을 해제할 수 없다.", true, "▸ 토지거래허가 받지 못했다 계약내용 대로의 효력 ✕, 당사자는 계약내용 따른 의무 부담 ✕ → 매매계약 해제할 수 없음 ✕ — 매매계약내용 대로의 채무불이행을 이유로 매매계약을 해제할 수 없음 [93다25875]", "무효와취소"],
["SS무효1.②", "■보충 토지거래허가를 받지 않아 유동적 무효상태인 매매계약에서, 당사자 사이에 별개의 약정으로 매매 잔금이 그 지급기일에 지급되지 아니하는 경우 매매계약을 자동적으로 해제하기로 약정할 수 있다.", true, "▸ 토지거래허가 받지 않아 유동적 무효 상태에서 대금지급의무 불이행을 이유로 매매계약 해제할 수 없으나, 별개 약정으로 매매 잔금이 그 지급기일에 지급되지 않는 경우 매매계약 자동적 해제 약정은 가능 ○ [2010다1456]", "무효와취소"],
["SS무효1.④", "토지거래허가구역 내 토지에 관하여 허가를 배제하거나 잠탈하는 내용으로 매매계약이 체결된 경우에는, 강행법규인 구 국토의 계획 및 이용에 관한 법률 제118조 제6항에 따라 체결된 때부터 확정적으로 무효이다.", true, "▸ 토지거래허가구역 내 토지에 관하여 허가를 배제하거나 잠탈하는 내용으로 매매계약이 체결된 경우에는, 강행법규인 구 국토법 제118조 제6항에 따라 체결된 때부터 확정적으로 무효 → 다만 허가구역이 지정해제되고, 당사자들이 기존 매매계약 무효임을 알면서 추인했다면 139조 단서로 매매계약은 추인한 때부터 새로운 법률행위로서 유효하게 됨 ○ [2017다228618, 2024다255328]", "무효와취소"],
["SS무효1.⑤", "■보충 토지거래허가를 받지 않아 유동적 무효상태인 매매계약의 경우 매수인이 매도인의 의무이행을 촉구하였음에도 매도인이 그 의무 이행을 거절함에 대하여 의무이행을 구하는 소송을 제기하여 1심에서 승소판결을 받은 때에는, 매수인이 그 계약의 이행에 착수하였다고 할 수 있으므로, 매도인이 계약금의 배액을 상환하고 매매계약을 해제할 수 없다.", false, "▸ 토지거래허가 받지 않아 유동적 무효 상태에서 매수인이 매도인 의무이행 촉구했거나 소송 제기하여 1심 승소판결 받은 것만으로는 매수인 이행 착수 ✕, 매도인 해약금 해제 ○ [97다9369] → 소송 제기만으로는 착수 아니라는 판례와 동일한 결론", "무효와취소"],
["087.ㄴ", "★ 무권리자의 처분행위에 대하여 권리자가 추인하는 경우에는 그 처분행위의 효력이 권리자에게 미치므로, 권리자는 무권리자에 대하여 무권리자가 그 처분행위로 인하여 얻은 이득의 반환을 구할 수 없다.", false, "▸ 무권리자 처분행위를 추인하면 → 권리자 본인에게 처분행위의 효력 발생 ○, 권리자는 무권리자에 대하여 무권리자가 그 처분행위로 인하여 얻은 이득의 부당이득반환청구 ○ [2001다44291]", "무효와취소"],
["088.ㄷ", "★ 종중을 대표할 권한 없는 자가 종중을 대표하여 한 소송행위는 효력이 없으나 나중에 종중이 총회결의에 따라 위 소송행위를 추인하면 그 행위시로 소급하여 유효하게 되며, 이 경우 무권대리행위에 대한 추인의 경우에 있어 배타적 권리를 취득한 제3자에 대하여 그 추인의 소급효를 제한하고 있는 민법 제133조 단서의 규정은 적용될 여지가 없다.", true, "▸ [민소] [91다25383]", "무효와취소"],
["089.①", "★ 부동산 거래신고 등에 관한 법률상 토지거래허가를 받지 않아 유동적 무효인 매매계약을 체결한 경우에도, 매매계약 체결 당시 일방이 토지거래허가를 받기 위한 협력 자체를 이행하지 아니하거나 허가신청에 이르기 전에 매매계약을 철회하는 경우, 상대방에게 일정한 손해액을 배상하기로 하는 약정을 유효하게 할 수 있다.", true, "▸ 토지거래허가 받지 못한 유동적 무효 상태에서도 허가 협력 이행하지 않거나 허가신청 전에 철회 시 손해배상 약정은 유효 [2008다62427]", "무효와취소"],
["090.ㄱ", "★ 甲이 乙의 채무불이행을 이유로 매매계약을 해제하였다 그 후 乙은 착오를 이유로 매매계약을 취소할 수 없다.", false, "▸ 매도인이 매수인의 채무불이행으로 매매계약을 적법하게 해제한 후라도 매수인은 그 손해배상책임을 피하기 위해 착오로 취소 가능 ○ [91다11308]", "무효와취소"],
["090.ㄴ", "★ X 토지에 하자가 있는 경우, 乙은 甲의 하자담보책임의 성립 여부와 관계없이 착오를 이유로 매매계약을 취소할 수 있다.", true, "▸ 매매계약 내용 중요 부분에 착오 있다면 매수인은 매도인의 하자담보책임 성립 상관없이 착오 이유로 매매계약 취소 ○ [2015다78703]", "무효와취소"],
["091.ㄱ", "제한능력자가 의사무능력 상태에서 법률행위를 한 경우, 제한능력자임을 이유로 그 법률행위를 취소할 수 있다.", true, "▸ 통설은 무효와 취소할 수 있는 행위의 경합을 인정함", "무효와취소"],
["091.ㄷ", "★ 매매대금의 과다로 매매계약이 민법상 '불공정한 법률행위'에 해당하여 무효인 경우에도 민법 제138조가 적용될 수 있다.", true, "▸ 매매대금 과다로 매매계약이 104조 불공정한 법률행위로서 무효인 경우에도 138조 무효행위 전환 적용 ○ [2009다50308]", "무효와취소"],
["091.ㄹ", "법률행위의 취소권은 원칙적으로 법률행위의 당사자 지위와 분리하여 양도할 수 없다.", true, "▸ 통설의 입장이며, 계약의 취소·해제권은 계약의 당사자만 가진다는 점과 연결됨", "무효와취소"],
["091.ㅁ", "★ 근로계약이 적법하게 취소된 경우, 이미 제공된 근로자의 노무를 기초로 형성된 취소 이전의 법률관계는 효력을 잃는다.", false, "▸ 근로계약의 취소는 소급하여 무효가 되는 것이 아니라 이후 장래에 관하여만 효력이 소멸 [2013다25194]", "무효와취소"],
["092.①", "★ 법률행위의 효력 발생 또는 소멸을 장래 불확실한 사실의 발생 여부에 의존케 하려는 의사가 있더라도, 외부에 표시되지 않으면 법률행위의 부관으로서의 조건이 될 수 없다.", true, "▸ 조건은 법률행위 효력 발생·소멸을 장래 불확실한 사실의 발생 여부에 따라 좌우되게 하는 법률행위의 부관, 법률행위에서 효과의사와 일체적 내용 이루는 의사표시 그 자체 ○ → 조건을 붙이고자 하는 의사는 법률행위 내용으로 외부에 표시되어야 [2020다202821]", "조건과기한"],
["092.②", "★ 어떠한 법률행위가 정지조건부 법률행위에 해당한다는 사실에 대한 증명책임은 그 법률행위로 인한 법률효과가 발생하지 않았다고 주장하는 자에게 있다.", true, "▸ 정지조건부라는 점(= 조건 '존재')은 법률행위 효력 발생 저지하려는 자가 입증책임 [93다20832]", "조건과기한"],
["092.③", "★ '조건의 성취를 방해한 때'란 사회통념상 일방 당사자의 방해행위가 없었더라면 조건이 성취되었을 것으로 보이는 상황에서 방해행위로 인하여 조건이 성취되지 못한 경우로서, 이는 방해행위가 없었더라도 조건의 성취가능성이 현저히 낮은 경우까지 포함한다.", false, "▸ 150조 1항은 신의성실 반하는 방해행위만으로 곧바로 ✕, 사회통념상 방해행위 없었더라면 조건 성취되었을 것으로 보이는 상황에서 방해행위로 인하여 조건이 성취되지 못한 경우로서, 이는 방해행위 없었더라도 조건 성취가능성 현저히 낮다면 ✕ [2022다266645]", "조건과기한"],
["092.④", "★ 해제조건부 증여로 인한 부동산소유권이전등기를 마친 후 해제조건이 성취되면 그 소유권은 증여자에게 복귀되고, 이 경우 조건성취 전에 수증자가 한 처분행위는 조건성취의 효과를 제한하는 한도 내에서는 무효라고 할 것이나, 그 조건이 등기되지 않았다면 그 처분행위로 인하여 권리를 취득한 제3자에게 위 무효를 주장할 수 없다.", true, "▸ 해제조건부 증여로 소유권이전등기 후 해제조건 성취되면 소유권은 증여자에게 복귀 ○ → 조건성취 전에 수증자가 한 처분행위는 조건성취의 효과를 제한하는 한도 내에서는 무효 → 다만 조건이 등기되어 있지 않다면 그 처분행위로 권리를 취득한 제3자에게 위 무효 주장 ✕ [92다5584]", "조건과기한"],
["092.⑤", "★ 당사자가 불확정한 사실이 발생한 때를 이행기한으로 정한 경우에는 그 사실이 발생한 때는 물론 그 사실의 발생이 불가능하게 된 때에도 이행기한이 도래한 것으로 보아야 한다.", true, "▸ 당사자가 불확정한 사실이 발생한 때를 이행기한으로 정한 경우에서 그 사실의 발생이 불가능하게 된 때에도 이행기한이 도래한 것으로 보아야 한다. [88다카10579]", "조건과기한"],
["093.①", "★ 조건이 법률행위 당시에 이미 성취할 수 없는 것인 경우 그 조건이 해제조건이면 그 법률행위는 조건 없는 법률행위가 된다.", true, "▸ 제151조(불법조건, 기성조건) ③ 조건이 법률행위의 당시에 이미 성취할 수 없는 것인 경우에는 그 조건이 해제조건이면 조건없는 법률행위로 하고 정지조건이면 그 법률행위는 무효로 한다.", "조건과기한"],
["093.②", "★ 약혼예물의 수수는 혼인의 불성립을 해제조건으로 하는 증여와 유사한 성질을 가진다.", true, "▸ 약혼예물 수수는 혼인 불성립을 해제조건으로 하는 증여와 유사한 성질 [94므895]", "조건과기한"],
["093.③", "부관이 붙은 법률행위에 있어서 부관에 표시된 사실이 발생하지 아니하면 채무를 이행하지 않아도 된다고 보는 것이 상당한 경우에는 해당 부관을 조건이 아니라 불확정기한으로 보아야 한다.", false, "▸ 부관에 표시된 사실이 발생하지 않으면 채무 이행하지 않아도 된다는 취지라면 조건, 표시된 사실이 발생한 때는 물론 발생하지 않는 것이 확정된 때도 채무 이행해야 한다는 취지라면 불확정기한 → 이미 부담하고 있는 채무의 변제에 붙인 부관은 특별한 사정이 없는 한 변기 유예로서 그 사실이 발생한 때 또는 발생 없는 것이 확정된 때 기한 도래 ○ [2003다24215]", "조건과기한"],
["094.ㄷ", "★ 형성권적 기한이익의 상실의 특약이 있는 할부채무에 있어서는 1회의 불이행이 있더라도 각 할부금에 대해 그 각 변제기의 도래 시마다 그때부터 순차로 소멸시효가 진행하고, 채권자가 특히 잔존 채무 전액의 변제를 구하는 취지의 의사를 표시한 경우에 한하여 전액에 대하여 그때부터 소멸시효가 진행한다.", true, "▸ 1회 불이행 등 상실 사유 발생해도 각 할부금의 각 변제기 도래시마다 순차로 소멸시효 진행, 채권자가 특히 잔존채무 전액 변제 구하는 경우에만 전액에 그때부터 소멸시효 진행 [2002다28340]", "조건과기한"],
["095.②", "★ 조건의 성취로 불이익을 받을 당사자가 신의성실에 반하여 조건의 성취를 방해할 경우 상대방은 조건이 성취된 것으로 주장할 수 있고, 이 경우 조건이 성취된 것으로 의제되는 시점은 방해행위가 없었더라면 조건이 성취되었을 것으로 추산되는 시점이다.", true, "▸ 조건 성취로 불이익 받을 당사자가 신의성실에 반하여 조건 성취 방해한 경우, 조건 성취 의제 시점은 반신의행위(방해행위) 시점 ✕ [98다42356] → 반신의행위(방해행위) 시점 ✕", "조건과기한"],
["096.①", "채권자와 채무자 모두가 기한의 이익을 갖는 이자부 금전소비대차계약에서, 채무자가 변제기 전에 변제하는 경우 변제기까지의 약정이자 등 채권자의 손해를 배상하여야 한다. 그러나 위 차용금반환채무의 담보를 제공한 물상보증인이 변제기 전에 그 차용원금과 변제할 때까지의 약정이자를 변제제공하면, 채권자는 그 수령을 거절할 수 있다.", false, "▸ 이자부 금전소비대차는 채권자와 채무자 모두 기한의 이익 ○ → 채무자가 기한 이익 포기하고 변제기 전에 변제하면 변제기까지의 약정이자 등 채권자 손해 배상해야 → 이러한 손해 배상과 함께 변제 제공하면 채권자는 수령거절 ✕ — 물상보증인이 변제기 전에 차용원금과 변제할 때까지의 약정이자를 변제제공하면 채권자는 그 수령을 거절할 수 ✕ (변제기까지의 약정이자 등 채권자 손해 배상 함께 제공하였으므로) [2021다305338]", "조건과기한"],
["096.②", "★ 부관이 붙은 법률행위의 경우에, 부관에 표시된 사실이 발생하지 아니하면 채무를 이행하지 아니하여도 된다고 보는 것이 타당한 경우에는 불확정기한으로 보아야 하고, 표시된 사실이 발생한 때에는 물론이고 반대로 발생하지 아니하는 것이 확정된 때에도 채무를 이행하여야 한다고 보는 것이 타당한 경우에는 표시된 사실의 발생 여부가 확정되는 것을 조건으로 정한 것으로 보아야 한다.", false, "▸ 조건과 불확정기한의 구별이 반대로 기술된 지문임 — 부관에 표시된 사실이 발생하지 않으면 채무 이행하지 않아도 된다는 취지라면 '조건', 표시된 사실이 발생한 때는 물론 발생하지 않는 것이 확정된 때도 채무 이행해야 한다는 취지라면 '불확정기한' [2003다24215]", "조건과기한"],
["096.③", "★ 조건이 법률행위 당시 이미 성취한 것인 경우에는 그 조건이 정지조건이면 조건없는 법률행위로 하고 해제조건이면 그 법률행위는 무효로 한다.", true, "▸ 제151조(불법조건, 기성조건) ② 조건이 법률행위의 당시에 이미 성취한 것인 경우에는 그 조건이 정지조건이면 조건없는 법률행위로 하고 해제조건이면 그 법률행위는 무효로 한다.", "조건과기한"],
["096.④", "★ 조건부 계약의 일방 당사자가 상대방 당사자의 신의성실에 반하는 조건성취 방해행위를 주장·증명하면, 방해행위로 인한 조건성취의 가능성을 고려할 필요 없이 조건성취가 의제된다.", false, "▸ 150조 1항은 신의성실 반하는 방해행위만으로 곧바로 ✕, 사회통념상 방해행위 없었더라면 조건 성취되었을 것으로 보이는 상황에서 방해행위로 인하여 조건이 성취되지 못한 경우여야 [2022다266645]", "조건과기한"],
["096.⑤", "★ 기한을 정하지 않은 채무에 정지조건이 있는 경우, 정지조건이 객관적으로 성취되면 바로 지체책임이 발생한다. 조건과 기한은 하나의 법률행위에 독립적으로 작용하는 부관이므로, '조건의 성취'는 '기한이 없는 채무에서 이행기의 도래'와는 별개의 문제이기 때문이다.", false, "▸ 기한 정하지 않은 채무에 정지조건 있는 경우, 정지조건 성취 후 채권자가 이행청구하면 지체책임 발생 — ∵ 조건과 기한은 하나의 법률행위에 독립적으로 작용하는 부관이므로, '조건의 성취'는 '기한 없는 채무에서 이행기의 도래'와는 별개 문제 → 청구금액 불확정이어도 지체책임 ○ [2015다207044]", "조건과기한"],
["097.③", "조건부 법률행위에 있어서 조건의 내용 자체가 불법적인 것이어서 무효일 경우 그 조건만을 분리하여 무효라고 할 수 없고 그 법률행위 전부가 무효이다.", true, "▸ 103조의 무효는 법률행위 내용 자체가 선량한 풍속 기타 사회질서 위반한 경우, 내용 자체는 아니어도 법률적 강제하거나 반사회 질서적 조건 또는 금전적 대가 결부됨으로써 반사회질서적 성질 띠게 되는 경우, 표시되거나 상대방에게 알려진 법률행위 동기가 반사회질서적인 경우 포함 ○ — 조건부 법률행위에서 조건의 내용 자체가 불법적인 것이어서 무효일 경우 그 조건만 분리하여 무효로 할 수 ✕, 법률행위 전부가 무효 [2005마541]", "소멸시효"],
["098.①", "乙이 소멸시효 완성 사실을 모르고 위 채무의 변제로 甲에게 5,000만 원을 지급한 경우, 乙은 甲에게 그 반환을 청구할 수 없다.", true, "▸ 소멸시효 완성 사실을 '모르고' 변제한 경우는 시효이익 포기로 볼 수는 없으나, 제744조에 비추어 반환을 구할 수 없게 됨(통설), 이와 비교할 것으로 '취득시효'의 경우는 모르고 포기한 경우 시효이익의 포기로 볼 수는 없으나 신의칙상 취득시효를 주장할 수 없게 됨", "소멸시효"],
["098.②", "丙이 甲의 乙에 대한 위 채권을 담보하기 위해 소멸시효 완성 전에 자기 소유의 X 토지에 저당권을 설정해 준 경우, 丙은 위 채권의 소멸시효 완성을 주장할 수 있다.", true, "▸ 물상보증인은 시효 원용할 지위 ○ [2006다33364] → 또한 물상보증인은 채무자가 아니므로 그의 담보설정행위는 소멸시효 중단사유인 채무 승인으로 볼 수 없음", "소멸시효"],
["098.⑤", "甲이 소멸시효 완성 후 乙을 상대로 채권의 소를 제기하였는데 乙이 사실심 변론 종결 시까지 소멸시효 완성 사실을 주장하지 않은 경우, 법원은 직권으로 소멸시효 완성을 고려하여야 한다.", false, "▸ [2016다258124] → 변론주의에 따라 소멸시효 항변은 주장이 있어야 판단하는 것일 뿐 직권으로 판단하지 않음 (≠제척기간)", "소멸시효"],
["099.ㄱ", "乙이 2023. 8. 31. 甲에게 매매대금을 지급하였는데 甲과 乙 사이의 매매계약이 무효인 경우, 乙의 甲에 대한 매매대금 상당의 부당이득반환청구권의 소멸시효는 특별한 사정이 없는 한 乙이 매매대금을 지급한 때부터 진행한다.", true, "▸ 매매계약 무효 원인 매매대금 상당 부당이득반환채권은 특별한 사정 없는 한 매매대금 지급한 때 성립하고 동시에 권리행사 가능, 매매대금 지급한 때부터 소멸시효 진행 ○ [2023다302920]", "소멸시효"],
["099.ㄷ", "甲이 2023. 8. 31. 乙에게 X 토지를 인도하고 소유권이전등기를 마쳐주었지만 乙은 매매대금을 지급하지 않았다. 이후 甲이 X 토지의 매매대금 채권을 보전하기 위하여 乙의 丙에 대한 채권에 대해 가압류를 신청하여 그 결정이 2023. 10. 1. 丙에게 송달되었지만 그 사실이 乙에게 통지되지 않았다면 甲의 乙에 대한 매매대금 채권의 소멸시효는 중단되지 않는다.", false, "▸ 채권 가압류는 시효중단 효력이 있으나, 그러기 위해서는 기본적으로 가압류의 효력이 발생할 필요가 있고, 제3채무자에게 송달되었다면 채무자에게는 통지되지 않더라도 가압류 효력 발생하여 시효중단(단, 가압류 신청 시에 소급하여 발생)", "소멸시효"],
["099.ㄹ", "甲이 2023. 8. 31. 乙에게 X 토지를 인도하고 소유권이전등기를 마쳐주었지만 乙은 매매대금을 지급하지 않았다. 이후 甲의 채권자 A가 甲을 대위하여 乙을 상대로 매매대금의 지급을 구하는 소를 제기하였더라도 甲의 乙에 대한 매매대금 채권의 소멸시효는 중단되지 않는다.", false, "▸ 채권자대위소송 제기 → 피대위권리(소송물)의 소멸시효가 중단됨", "소멸시효"],
["100.①", "채무불이행으로 인한 손해배상채권은 본래의 채권이 시효로 소멸하더라도 함께 소멸하지 않는다.", false, "▸ 본래 채권이 시효로 소멸한 때는 손해배상채권도 함께 소멸 ○ [2016다45779]", "소멸시효"],
["100.②", "★ 3년의 단기소멸시효가 적용되는 도급을 받은 자의 공사에 관한 채권은 공사대금 채권만을 의미하고, 그 공사에 부수되는 채권으로서 수급인의 저당권설정청구권은 도급을 받은 자의 공사에 관한 채권에 해당되지 않는다.", false, "▸ 수급인의 666조 저당권설정청구권도 수급인의 공사에 관한 채권으로서 3년의 소멸시효에 걸림 [2014다211978]", "소멸시효"],
["100.③", "★ 후순위담보권자는 선순위담보권의 피담보채권의 소멸로 직접 이익을 받는 자이므로 선순위담보권의 피담보채권에 관한 소멸시효의 완성을 원용할 수 있다.", false, "▸ 후순위 담보권자는 선순위 담보권의 피담보채권 소멸시효 주장 ✕ — ∵ 후순위 담보권자는 선순위 담보권의 피담보채권 소멸로 직접 이익 받는 자 ✕, 순위 상승하고 배당액 증가하는 것은 반사적 기대이익에 불과 [2016다232597]", "소멸시효"],
["100.④", "★ 물상보증인이 그 피담보채무의 부존재 또는 소멸을 이유로 제기한 저당권설정등기 말소등기절차이행청구소송에서, 채권자 겸 저당권자가 청구기각의 판결을 구하고 피담보채권의 존재를 주장하여 승소하더라도 채권자의 위 응소행위는 피담보채권에 대한 시효중단 사유인 '재판상 청구'에 해당하지 않는다.", true, "▸ 제3취득자·물상보증인이 제기한 저당권등기말소청구 등 소송에서 응소는 재판상 청구 ✕ — ∵ 시효 원용할 지위에 있으나 직접 채무 부담하는 자 아니므로 [2006다33364]", "소멸시효"],
["100.⑤", "채권자가 채무자의 제3채무자에 대한 채권을 압류 또는 가압류한 경우, 채무자의 제3채무자에 대한 채권에 확정적 시효중단의 효력이 생긴다.", false, "▸ 채권자대위소송 제기 → 피대위권리(소송물)의 소멸시효 중단 ○ — ∵ 1호 청구채권 가압류·압류 신청 → 피보전채권 ③가 시효중단 ○ — ∵ 2호 압류·가압류단, 압류·추심명령 송달 → 피압류채권 ⑥에 최고의 효력 ○ → 송달 후 6월 내 추심의 소 제기 등 필요(174조) [2003다16238]", "소멸시효"],
["101.계산", "대부업을 하는 甲은 乙에게 세 차례에 걸쳐 총 3억 원을 대여하였다. 대여일·원금·이자(월 1%, 매월 말일 지급)·원금 변제기: 2018.1.1./1억/2018.12.31., 2019.1.1./1억/2019.12.31., 2020.7.1./1억/2021.6.30. 乙이 위 채무의 변제를 전혀 하지 않아 甲은 2024.1.12. 위 각 대여금의 원금 및 이에 대한 2023.12.31.까지의 이자 또는 지연손해금의 지급을 구하는 소를 제기하려고 한다. 乙이 소멸시효 항변을 할 것으로 예상되는 경우, 甲이 소송에서 최대로 인용받을 수 있는 청구 금액은?", true, "▸ 대부업 하므로 상행위로 모든 원금은 각 변제기로부터 소멸시효기간 5년, 이자채권은 매월 각 변제기로부터 소멸시효기간 3년 → 현재 2024.1.12. 소 제기한다면, ① 18년도 채권은 원금·이자 모두 시효소멸, ② 19년도 채권은 원금 존속, 이자는 모두 시효소멸, ③ 20년도 채권은 원금 존속, 2021년 1월부터 6월분까지의 이자채권이 존속(20년 12월분까지의 이자채권은 각 변제기로부터 3년 지나 시효소멸) → 19년도 대여금의 원금 1억 원, 그에 대한 지연손해금 4,800만원(48개월분) 20년도 대여금의 원금 1억 원, 이자 600만원(6개월분), 그에 대한 지연손해금 3,000만원(30개월분) → 총합계 2억 8,400만원", "소멸시효"],
["102.ㄴ", "원고 甲이 乙의 사망 사실을 모르고 乙을 피고로 표시하여 제기한 대여금청구의 소에서 乙의 사망 사실을 간과한 청구인용판결이 확정되었다 하더라도 그 후 6개월 내에 다시 乙의 상속인 丙을 상대로 대여금청구의 소를 제기하였다면, 원고 甲의 피고 乙에 대한 소제기 시에 위 대여금채권의 소멸시효가 중단된다.", false, "▸ [민소] 이미 사망한 자를 피고로 제기된 소는 부적법 → 간과한 본안판결은 당연무효, 상속인에게 효력 미치지 ✕ → 상속인 당사자표시정정이 이뤄지는 특별한 사정 없는 한, 애초부터 시효중단 효력 ✕, 민법 170조 2항 적용 ✕ [2013다94312]", "소멸시효"],
["102.ㄹ", "★ 소장에서 청구의 대상으로 삼은 채권 중 일부만을 청구하면서 소송의 진행 경과에 따라 장차 청구금액을 확장할 뜻을 표시하였으나 당해 소송이 종료될 때까지 실제로 청구금액을 확장하지 않은 경우에 대하여는 소제기로 인한 시효중단의 효력이 발생하지 않지만, 다른 특별한 사정이 없는 한 채권자는 당해 소송이 종료된 때부터 6개월 내에 재판상 청구를 함으로써 그 나머지 부분에 대한 소멸시효를 중단시킬 수 있다.", true, "▸ [2019다223723] — 소 종료 후 6월 내 재판상 청구로 시효 중단 가능, 다만 소 계속 중 나머지 부분도 최고에 의해 권리행사 상태 지속된 것 ○", "소멸시효"],
["103.②", "★ 무권대리인 甲이 대리권을 증명하지 못하고 본인의 추인도 얻지 못한 경우, 그 상대방 乙이 甲에 대해 가지는 계약이행청구권이나 손해배상청구권의 소멸시효는 乙이 위 두 청구권 중 하나를 선택할 수 있을 때부터 진행한다.", true, "▸ 무권대리인이 대리권을 증명하지 못하고 본인의 추인도 얻지 못한 경우 상대방의 계약이행청구권이나 손해배상청구권의 소멸시효는 그 선택권을 행사할 수 있을 때부터 진행한다. [63다323]", "소멸시효"],
["104.ㄴ", "★ 이행인수인이 채권자에 대하여 채무자의 채무를 승인하더라도 다른 특별한 사정이 없는 한 채무자에 대하여 시효중단의 효력은 생기지 않는다.", true, "▸ 이행인수인은 승인하더라도 시효중단 ✕ — ∵ 이행인수인이 채권자에 대한 관계에서 직접 이행의무 부담 ✕, 시효중단사유인 승인은 시효이익을 받을 당사나 대리인만 [2015다239744]", "소멸시효"],
["104.ㄹ", "★ 「주택임대차보호법」에 기한 임차권등기명령에 따른 임차권등기에는 임대차보증금반환채권에 대한 소멸시효 중단사유인 압류 또는 가압류, 가처분에 준하는 시효중단의 효력이 없다.", true, "▸ 주임법 3조의3 임차권등기명령 따른 임차권등기는 소멸시효 중단 ✕ — ∵ 임차권등기는 특정 목적물의 집행·보전처분 실행인 압류·가압류·가처분과 달리 주임법상 대항력·우선변제권 취득·유지 위한 담보 목적, 민집법 가압류 절차규정 일부 준용하지만 보전처분 성질 ✕ [2017다226629]", "소멸시효"],
["105.④", "★ 채권자가 채무자의 제3채무자에 대한 채권을 압류 또는 가압류한 경우, 압류 또는 가압류된 채무자의 제3채무자에 대한 채권에 대하여는 시효 중단의 효력이 생긴다고 할 수 없다.", true, "▸ 채권 가압류의 경우 168조 2호에 의해 소멸시효가 중단되는 것은 권리자의 채권인 집행채권이며, 피압류채권의 시효는 중단되지 않음 [2003다16238]", "소멸시효"],
["106.②", "★ 3자 간 등기명의신탁에 의한 등기가 「부동산 실권리자명의의 등기에 관한 법률」에서 정한 유예기간의 경과로 무효로 된 경우, 목적 부동산을 인도받아 점유하고 있는 명의신탁자의 매도인에 대한 소유권이전등기청구권에 관한 소멸시효는 진행되지 않는다.", true, "▸ 부동산 매수인이 부동산을 인도받아 사용·수익하다가 그 부동산에 대한 보다 적극적인 권리행사의 일환으로 타인에게 처분하고 인도해준 경우도 스스로 계속 사용·수익하는 경우와 다를 바 없어 역시 소멸시효 진행 ✗ [2013다26647]", "소멸시효"],
["107.②", "★ 동시이행의 항변권이 붙어 있는 채권이라 하더라도 약정한 이행기부터 소멸시효가 진행한다.", true, "▸ 매매에 동시이행항변권 있더라도 이행기 되면 소멸시효 진행 ○ [90다9797]", "소멸시효"],
["107.④", "★ 채권양도의 대항요건을 갖추지 못한 상태에서 채권의 양수인이 채무자를 상대로 양수금의 지급을 재판상 청구하는 경우, 그 양수금채권의 소멸시효는 중단되지 않는다.", false, "▸ 채권양도 대항요건 갖추지 못한 상태에서 양수인의 재판상 청구 ○ — ∵ 동일성은 대항요건과 무관, 149조 조건부권리의 처분·보존 등, 권리 위에 잠진다고 할 수 없음 [2005다41818]", "소멸시효"],
["108.③", "★ 채권양도 후 대항요건이 구비되기 전의 양도인이 채무자를 상대로 제기한 소송 중에 채무자가 채권양도의 효력을 인정하는 등의 사정으로 인하여 양도인의 청구가 기각되고 양수인이 그로부터 6월 내에 채무자를 상대로 양수금청구의 소를 제기한 경우, 양도인의 최초의 소 제기 시에 위 채권의 소멸시효가 중단된다.", true, "▸ 채권양도 대항요건 구비 전 '양도인'이 재판상 청구하다 채무자가 채권양도 효력 인정하여 기각된 경우, '양수인'이 그로부터 6월 내에 재판상 청구하면 '양도인'의 최초 재판상 청구로 소 시효중단 ○ [2008두20109]", "소멸시효"],
["108.⑤", "★ 소송 당사자가 「민법」에 따른 소멸시효기간을 주장한 경우에도 법원은 직권으로 「상법」에 따른 소멸시효기간을 적용할 수 있다.", true, "▸ [민소] 변론주의의 원칙상 소멸시효 항변은 권리소멸이라는 법률관계를 발생시키는 사실에 관한 주장 ✕, 단순히 법률해석·적용에 관한 의견 표명 → 법원이 당사자 주장에 구속되지 않고 직권 판단 ○ → 당사자가 민사 소멸시효기간 주장해도 법원은 직권으로 상사 소멸시효기간 적용 ○ [2016다258124]", "소멸시효"],
["109.ㄴ", "★ 채권자의 신청에 의한 경매개시결정에 따라 연대채무자 1인 소유의 부동산이 압류된 경우, 이로써 이 연대채무자에 대한 채권의 소멸시효는 중단되지만 다른 연대채무자에 대한 채권의 소멸시효는 중단되지 않는다.", true, "▸ 연대채무자 A 소유 부동산의 '경매개시결정'은 연대채무자 B에 중단효 ✕ — ∵ 169조, 연대채무에서 압류는 절대효 ✗ [2001다22840] → 만일 경매개시결정이 B에게 통지되었다면 중단효 미칠 수 ○", "소멸시효"],
["110.⑤", "★ 소멸시효가 완성된 경우 채무자에 대한 일반 채권자는 채권자의 지위에서 독자적으로 시효소멸의 주장을 할 수 없지만 자기의 채권을 보전하기 위하여 필요한 한도 내에서 채무자를 대위하여 시효소멸의 주장을 할 수 있다.", true, "▸ 채무자의 일반채권자는 독자적으로 소멸시효 주장 ✕ — 그러나 자기 채권을 보전하기 위해 필요 한도에서 채무자를 대위하여 소멸시효 주장 ○ [2011다109500]", "소멸시효"],
["111.①", "★ 부동산 매수인이 매도인으로부터 부동산을 인도받아 사용·수익하다가 이를 타인에게 처분하고 그 점유를 승계하여 준 경우에도 위 부동산 매수인의 매도인에 대한 소유권이전등기청구권에 관한 소멸시효는 진행되지 않는다.", true, "▸ 부동산 매수인이 부동산을 인도받아 사용·수익하다가 그 부동산에 대한 보다 적극적인 권리행사의 일환으로 타인에게 처분하고 인도해준 경우도 스스로 계속 사용·수익하는 경우와 다를 바 없어 역시 소멸시효 진행 ✗ [98다32175]", "소멸시효"],
["111.④", "★ 사해행위취소소송에서 수익자는 취소채권자의 피보전채권에 대하여 시효소멸을 주장할 수 있다.", true, "▸ 사해행위취소소송에서 피고인 수익자는 피보전채권의 소멸시효 완성 주장 ○ → 인정되면 기각 [2007다54849]", "소멸시효"],
["112.①", "★ 채무불이행으로 인한 손해배상청구권의 소멸시효기간은 채무불이행시부터 진행하는데, 그 시효기간은 본래의 채권에 적용될 기간에 의한다.", true, "▸ 채무불이행으로 인한 손해배상청구권의 소멸시효기간은 채무불이행시부터 진행하고, 그 시효기간은 본래의 채권에 적용될 기간에 의함 [90다카22513]", "소멸시효"],
["112.②", "★ 실제의 소멸시효 기산일과 당사자가 주장하는 기산일이 다른 경우, 법원은 당사자가 주장하는 기산일을 기준으로 삼아야 한다.", true, "▸ 당사자가 주장하는 '기산일'이 본래 기산일보다 앞이든 뒤이든 법원은 당사자 주장한 기산일을 기준으로 [94다35886]", "소멸시효"],
["SS소멸1.①", "확정판결에 따른 소유권이전등기청구권이 시효완성으로 소멸한 상태에서 소유권이전등기가 이루어졌고 그 시효의 이익을 받는 자가 소멸시효 완성을 주장하며 소유권이전등기의 말소를 구하는 경우, 그 소유권이전등기는 원인무효의 등기에 해당하므로 말소되어야 한다.", false, "▸ 소멸시효 완성으로 소유권이전등기청구권 소멸한 상태에서 소유권이전등기 이뤄졌고 시효이익 받는 자가 소멸시효 완성 주장하며 소유권이전등기 말소를 구하는 경우, 그 소유권이전등기는 원인무효 등기에 해당 ✕ — 시효로 소멸된 채권에 기해 이뤄진 등기는 무효가 아니므로 실체관계 부합하는 등기로 말소되어야 하지 않음 [2024다232523] → 실체관계 부합", "소멸시효"],
["SS소멸1.②", "★ 소송위임계약으로 성공보수를 약정하였을 경우 심급대리의 원칙에 따라 수임한 소송사무가 종료하는 시기인 해당 심급의 판결을 송달받은 때부터 그 소멸시효기간이 진행된다.", true, "▸ 소송위임계약의 성공보수는 지급 시기의 특약이 없는 한 소송사무 종료 시인 해당 심급 판결 송달받은 때부터 소멸시효 진행 — ∵ 686조 2항(위임사무 완료해야 보수 청구), 심급대리 원칙 [2022다276307]", "소멸시효"],
["SS소멸1.③", "■보충 변호사가 의뢰인과 소송위임계약을 체결하여 제1심, 항소심, 상고심 소송수행을 위임받아 소송을 위임받아 소송을 수행하다가 변호사의 과실로 제1심 법원의 각하 판결을 받은 뒤 최종적으로 의뢰인의 패소가 확정된 경우 확정시가 아니라 제1심 법원의 각하 판결시부터 변호사에 대한 손해배상청구권의 소멸시효가 진행한다.", false, "▸ 채무불이행 손해배상청구권의 기산점은 채무불이행시부터 → 현실적 손해 발생 시점부터 진행 [2018다240462] → 변호사의 채무불이행으로 소송이 의뢰인에게 불리하게 된 것이 '확정'되거나 이에 준하는 상태가 된 때 비로소 현실적 손해 발생, 손해배상청구권의 소멸시효도 그때부터 진행 ○", "소멸시효"],
["SS소멸1.④", "■보충 수사기관의 압수물에 대한 위법한 폐기처분으로 인한 손해배상청구권에 관한 장기소멸시효의 기산점은 위법한 폐기처분이 이루어진 시점이 아니라 무죄의 형사판결이 확정된 때이다.", true, "▸ 수사기관의 압수물에 대한 위법한 폐기처분으로 인한 손해배상청구권의 장기 소멸시효 기산점은 무죄의 형사판결이 확정된 때 [2019다282197]", "소멸시효"],
["SS소멸1.⑤", "★ 매매계약의 무효를 원인으로 한 매매대금 상당의 부당이득반환청구권은 특별한 사정이 없는 한 매매대금을 지급한 때에 성립하고 그 성립과 동시에 권리를 행사할 수 있으므로 그때부터 소멸시효가 진행한다.", true, "▸ 매매계약 무효 원인 매매대금 상당 부당이득반환채권은 특별한 사정 없는 한 매매대금 지급한 때 성립하고 동시에 권리행사 가능, 매매대금 지급한 때부터 소멸시효 진행 ○ [2023다302920]", "소멸시효"],
["SS소멸2.①", "★ 대상청구권은 특별한 사정이 없는 한 매도인의 소유권이전등기의무가 이행불능 되었을 때부터 소멸시효가 진행하는 것이 원칙이며, 그 대상청구권이 매도인의 귀책사유로 발생한 때에도 마찬가지이다.", true, "▸ 대상청구권은 수용 등 매도인의 소유권이전등기의무가 이행불능 되었을 때부터 소멸시효 진행 ○ — 그러나 법규 미비 등 보상금 지급 방법·절차 없었다면 방법 마련된 시점부터 대상청구권 소멸시효 진행 ∵ 추상적 대상청구권만으로는 이행기 도래시 논리가 맞지 않음", "소멸시효"],
["SS소멸3.ㄱ", "★ 보험사고 발생 여부가 객관적으로 분명하지 않으면 보험금청구권자가 보험사고 발생을 알았거나 알 수 있었을 때부터 소멸시효가 진행한다.", true, "▸ [상법] 보험금청구권의 소멸시효는 특별한 사정 없는 한 보험사고가 발생한 때부터 진행하는 것이 원칙 → 보험사고 발생 여부가 객관적으로 분명하지 않은 경우는 보험금청구권자가 보험사고 발생을 알았거나 알 수 있었던 때부터 소멸시효 진행 [2007다19624]", "소멸시효"],
["SS소멸3.ㄷ", "불법행위에 기한 손해배상청구권에서 「민법」 제766조 제2항에 의한 10년의 소멸시효의 기산점이 되는 '불법행위를 한 날'이란 현실적으로 손해의 결과가 발생한 날이 아니라 가해행위가 있었던 날을 의미한다.", false, "▸ '불법행위를 한 날'이란 가해행위 있었던 날이 아니라 현실적으로 손해 결과가 발생한 날 ○ [77다1894]", "소멸시효"],
["SS소멸4.ㄱ", "★ ■보충 甲의 乙에 대한 유치권확인청구의 소송에서 피담보채권의 존부에 관하여 실질적 심리가 이루어졌다면, 위 소송의 제기는 민법 제168조 제1호의 재판상 청구에 준하는 것으로 본다.", true, "▸ 시효중단 사유로서 재판상 청구에는 소멸시효 대상인 권리 자체의 이행·확인청구만이 아니라 권리 발생한 기본적 법률관계를 기초로 소의 형식 주장 ○, 권리를 기초로·포함하여 형성된 후속 법률관계에 관한 청구하면서 권리실행 의사 표명한 경우 ○, 기판력 미치는 범위와 일치하여 고찰할 필요 ✕ → 유치권확인청구 소송에서 피담보채권인 각 공사대금채권의 존재 주장하였고 실질적 심리 이뤄졌다면 공사대금채권에 관하여 권리 행사 ○, 이는 재판상 청구에 준하여 소멸시효 중단 [2024다241152]", "소멸시효"],
["113.ㄴ", "★ 가등기담보법 제11조의 내용과 제척기간 제도의 본질에 비추어 보면, 채무자 등이 피담보채무의 변제기가 지난 때로부터 10년이 경과하기 전에 피담보채무의 변제를 조건으로 담보목적으로 마친 소유권이전등기의 말소를 청구하였다면 이는 위 조항에 따른 제척기간 준수에 필요한 권리의 행사에 해당한다.", false, "▸ 가담법 11조 '변제기 전의 10년'의 제척기간은 채무액을 변제하지 않은 채 말소청구 해서는 준수한 것이 ✕, 말소등기 소 제기해도 ✕ [2012다47074]", "소멸시효"],
["113.ㄷ", "민법상 수급인의 하자담보책임에 관한 기간은 제척기간으로서 재판상 또는 재판 외의 권리행사기간이며 재판상 청구를 위한 출소기간은 아니라고 할 것이다.", true, "▸ 수급인의 하자담보책임 제척기간은 재판상 또는 재판 외 권리행사 기간 ○, 출소기간 ✕ [2000다15371]", "소멸시효"],
["114.ㄷ", "가압류결정 이전에 가압류의 피보전권리인 어음채권이 시효로 소멸한 경우, 그 가압류결정에 의해 원인채권의 소멸시효를 중단시킬 수 없다.", true, "▸ 이미 시효 소멸된 어음채권을 청구채권으로 채무자 재산을 압류하더라도 원인채권 시효중단 ✕ — ∵ 적법한 권리행사 ✕ [2010다6345]", "소멸시효"],
["114.ㄹ", "임차계약 해지에 따른 임치물 반환청구권의 소멸시효는 특별한 사정이 없는 한 임치계약이 성립하여 임치물이 수치인에게 인도된 때부터 진행한다.", false, "▸ 임치물 반환청구권의 소멸시효는 특별한 사정 없는 한 임치계약 성립하여 임치물이 수치인에게 인도된 때부터 진행 ✕ → 임치계약 해지된 때부터 ✕ — ∵ 임치물 반환청구는 임치계약 성립 시부터 당연히 예정된 것, 임치인은 언제든지 계약 해지하고 임치물을 반환 구할 수 ○ (699조 참조), 따라서 임치계약 성립 시부터 소멸시효가 진행하는 것이 원칙 → 다만 임대차의 경우 임차물 반환청구권의 소멸시효는 임대차계약이 해지된 때부터 ✗ [2020다220140]", "소멸시효"],
["115.③", "★ 丙이 乙을 상대로 양수금 청구의 소를 제기한 후 소송계속 중 채권양도의 대항요건을 갖춘 경우 소제기 시점부터 시효가 중단된다.", true, "▸ 채권양도 대항요건 갖추지 못한 상태에서 양수인의 재판상 청구도 시효중단 ○, 소송계속 중 대항요건 갖춘 경우 소제기 시점부터 시효 중단 [2005다41818]", "소멸시효"],
["115.⑤", "★ 甲의 채권이 저당권부 채권이고 丙에 대하여 저당권이전 부기등기가 이루어진 경우에도, 乙에게 대하여 저당권이전 부기등기 사실이 통지된 이상 丙은 저당권자로서 경매를 신청할 수 없고, 배당에서 우선변제를 받을 수도 없다.", false, "▸ 채권양도 대항요건 ✕, 저당권이전 부기등기 ○ → 채권양도 대항요건 갖추지 못했지만 양수인은 담보권 행사로 우선변제 ○ → 다만 채무자 이의는 가능 → 도중 통지 도달 등으로 하자 치유 ○ [2011다109357]", "소멸시효"],
["116.ㄱ", "★ 채무자가 소멸시효 완성 후 시효를 원용하지 아니할 것 같은 태도를 보여 권리자로 하여금 이를 신뢰하게 하였더라도, 채권자는 그러한 사정이 있은 때로부터 상당한 기간 내에 권리를 행사하여야만 채무자의 소멸시효 항변을 저지할 수 있다.", true, "▸ 시효 원용하지 않을 것 같은 태도 보여 권리자로 신뢰하게 하더라도 채권자는 그 사정이 있은 때로부터 상당한 기간 내에 권리를 행사하여야만 채무자의 소멸시효 항변을 저지할 수 있음 [98다42929]", "소멸시효"],
["116.ㄴ", "★ 소송위임계약으로 성공보수를 약정하였을 경우, 별다른 특약이 없는 한, 해당 소송사건이 확정된 때로부터 그 소멸시효기간이 진행됨이 원칙이다.", false, "▸ 소송위임계약의 성공보수는 지급 시기의 특약이 없는 한 소송사무 종료 시인 해당 심급 판결 송달받은 때부터 소멸시효 진행 [2022다276307]", "소멸시효"],
["117.②", "사용자가 상인으로서 영업을 위하여 근로자와 체결한 근로계약은 보조적 상행위이므로 사용자가 근로계약에 수반되는 신의칙상의 부수적 의무인 보호의무를 위반하여 근로자에게 손해를 입힘으로써 발생한 채무불이행으로 인한 손해배상청구권에는 5년의 상사소멸시효가 적용된다.", false, "▸ 근로계약상 보호의무 위반에 따른 근로자의 손해배상청구권은, 사용자가 상인으로서 영업을 위하여 체결한 근로계약이 보조적 상행위이더라도 10년의 민사시효 ○ — ∵ 보호의무 위반 법률관계는 근로자의 생명·신체 침해 문제로서 그 성질상 상법 64조의 취지인 대량, 정형, 신속 특성 ✕ [2018다270876]", "소멸시효"],
