  ["087.ㄷ", "甲은 건축업을 영위하는 乙 회사와 건물신축 공사계약을 체결하고 공사대금은 200억 원, 공사기간 2년, 대금지급방법은 기성고에 따라 매 4개월마다 20억 원씩 5회 지급하고, 나머지 대금 100억 원은 공사완료 후 즉시 지급하기로 약정하였다. 위 건물신축공사 계약에 따라 甲 명의로 건축허가를 받아 乙 회사가 공사를 개시하고 20개월 동안 기성고에 따라 100억 원의 공사비가 지급되었다. 모든 공정이 종료되고 그 주요 구조 부분이 약정된 대로 시공되어 건물로서 완성되었으나 건물의 일부에 하자가 발생하였다. 乙 회사는 건물에 하자가 남아 있는 상태에서 甲에게 공사대금 잔금 100억 원의 지급을 청구하였다.§만약 건물에 발생한 하자가 甲의 지시에 기인한 것임이 증명된다면, 甲은 乙 회사에 대하여 민법 제667조에 따른 담보책임은 물론 민법 제390조에 따른 채무불이행책임도 물을 수 없다.", false, "▸ 도급계약에 따른 완성물에 하자가 있는 경우, 수급인의 하자담보책임과 채무불이행책임이 별개 권원으로 경합적 인정 → 669조(도급인 제공 재료나 도급인 지시에 기인한 경우 수급인 면책)는 하자담보책임에만 적용되고, 채무불이행책임에 적용 × [2019다268252]", "도급"],
  ["087.ㄹ", "甲은 건축업을 영위하는 乙 회사와 건물신축 공사계약을 체결하고 공사대금은 200억 원, 공사기간 2년, 대금지급방법은 기성고에 따라 매 4개월마다 20억 원씩 5회 지급하고, 나머지 대금 100억 원은 공사완료 후 즉시 지급하기로 약정하였다. 위 건물신축공사 계약에 따라 甲 명의로 건축허가를 받아 乙 회사가 공사를 개시하고 20개월 동안 기성고에 따라 100억 원의 공사비가 지급되었다. 모든 공정이 종료되고 그 주요 구조 부분이 약정된 대로 시공되어 건물로서 완성되었으나 건물의 일부에 하자가 발생하였다. 乙 회사는 건물에 하자가 남아 있는 상태에서 甲에게 공사대금 잔금 100억 원의 지급을 청구하였다.§도급계약에서 정한 일의 완성 이전에 계약이 해제되었다면, 원칙적으로 수급인은 도급인에게 약정에 따른 보수를 청구할 수 없다.", true, "▸ 도급계약에서 보수는 완성물 인도와 동시에 지급해야, 인도 요하지 않는 경우 완성 후 지체없이 지급해야 → 도급인은 완성물 인도제공이나 완성 있을 때까지 보수지급 거절 O → 일의 완성 전에 계약 해제된 경우는 수급인 보수청구 ×\n다만 수급인 일부 미완성 부분 있더라도 해제 이유로 전부 원상회복함이 신의칙 등에 비추어 공평·타당하지 않은 특별한 경우는 예외적으로 완성된 부분에 수급인의 보수청구권 인정 O [2022다289174]", "도급"],
  ["088.①", "공사도급계약에서 하자보수보증금이 손해배상의 예정에 해당하는 경우 실손해액의 증명이 있다고 하더라도 수급인으로부터 그 초과액 상당의 손해배상을 받을 수 없다.", false, "▸ 하자보수보증금은 특성상 실손해가 이를 초과한다면 입증하여 그 외 따로 손해배상 받을 수 있는 '특수한' 손해배상액의 예정 [2000다17810]", "도급"],
  ["088.②", "수급인이 도급인으로부터 설계도면을 넘겨받아 설계도면의 기재대로 시공하였는데 완성된 부분에 하자가 발생한 경우 그 설계도면의 부적당함을 알고서도 이를 고지하지 않은 수급인은 도급인에 대하여 하자담보책임을 진다.", true, "제669조(동전–하자가 도급인의 제공한 재료 또는 지시에 기인한 경우의 면책) 전2조의 규정은 목적물의 하자가 도급인이 제공한 재료의 성질 또는 도급인의 지시에 기인한 때에는 적용하지 아니한다. 그러나 수급인이 그 재료 또는 지시의 부적당함을 알고 도급인에게 고지하지 아니한 때에는 그러하지 아니하다.", "도급"],
  ["088.③", "공사도급계약의 도급인이 될 자가 수급인 선정을 위한 입찰절차를 거쳐 낙찰자를 결정한 경우 입찰을 실시한 자와 낙찰자 사이에는 도급계약의 본계약 체결의무를 내용으로 하는 예약관계가 성립된다.", true, "▸ 도급계약의 도급인 될 자가 수급인 선정 위한 입찰절차 거쳐 낙찰자 결정하면 입찰 실시자와 낙찰자 사이에 도급계약의 본계약체결의무를 내용으로 하는 예약의 계약관계 성립 O → 일방이 정당한 이유 없이 본계약 체결 거절하면 예약채무불이행 손해배상 O [2011다41659]", "도급"],
  ["089.③", "수급인이 도급인에게 건물의 인도를 위한 이행의 제공을 하지 않으면 도급인이 동시이행의 항변을 하지 않더라도 공사대금채무에 대한 도급인의 이행지체책임이 발생하지 않는다.", true, "▸ 동시이행항변권의 존재효\n[AI해설] 공사대금과 건물인도는 동시이행관계이므로, 수급인이 이행제공 없으면 도급인은 이행지체에 빠지지 않는다(항변권의 존재효).", "도급"],
  ["089.④", "수급인의 채무불이행으로 계약이 해제되더라도 수급인은 해제시점까지 총공사비에 기성고 비율을 적용한 금액을 도급인에게 청구할 수 있다.", true, "▸ 건축도급계약에서 미완성부분 있더라도 공사가 상당 정도 진척되어 그 원상회복이 중대한 사회·경제적 손실 초래하고 완성된 부분이 도급인에게 이익이 되는 경우, 수급인의 채무불이행을 이유로 도급인이 도급계약 해제해도 미완성부분만 도급계약 실효 → 수급인은 해제한 때 상태로 도급인에게 인도, 도급인은 완성부분 상당한 보수, 즉 약정총공사비에 중단 당시 기성고비율 곱한 금액 지급해야 O, 실제 지출한 비용 × [93다25080]", "도급"],
  ["089.⑤", "도급인에게 도급이나 지시에 관하여 중대한 과실이 없다면 도급인은 수급인이 그 일에 관하여 제3자에게 가한 손해를 배상할 책임이 없다.", true, "제757조(도급인의 책임) 도급인은 수급인이 그 일에 관하여 제삼자에게 가한 손해를 배상할 책임이 없다. 그러나 도급 또는 지시에 관하여 도급인에게 중대한 과실이 있는 때에는 그러하지 아니하다.", "도급"],
  ["090.①", "도급인이 완성된 건물의 하자로 인하여 계약의 목적을 달성할 수 없는 경우이더라도 담보책임을 이유로 도급계약을 해제할 수 없지만, 특별한 사정이 없는 한 채무불이행을 원인으로 하여서는 도급계약을 해제할 수 있다.", false, "제668조(동전–도급인의 해제권) 도급인이 완성된 목적물의 하자로 인하여 계약의 목적을 달성할 수 없는 때에는 계약을 해제할 수 있다. 그러나 건물 기타 토지의 공작물에 대하여는 그러하지 아니하다.\n[AI해설] 건물의 경우 하자를 이유로 도급계약 해제 불가한 것은 담보책임에 의한 해제만의 문제가 아니라 채무불이행을 원인으로 한 해제도 포함된다는 것이 통설이다.", "도급"],
  ["090.②", "도급인의 지시에 따라 건축공사를 하는 수급인이 그 지시가 부적당함을 알면서도 이를 도급인에게 고지하지 아니한 경우, 완성된 건물의 하자가 도급인의 지시에 기인한 것이므로 수급인은 그에 대한 하자담보책임을 부담하지 않는다.", false, "제669조(동전–하자가 도급인의 제공한 재료 또는 지시에 기인한 경우의 면책) 전2조의 규정은 목적물의 하자가 도급인이 제공한 재료의 성질 또는 도급인의 지시에 기인한 때에는 적용하지 아니한다. 그러나 수급인이 그 재료 또는 지시의 부적당함을 알고 도급인에게 고지하지 아니한 때에는 그러하지 아니하다.", "도급"],
  ["090.⑤", "제작물공급계약에서 보수의 지급시기에 관하여 당사자 사이의 특약이나 관습이 없으면 도급인은 완성된 목적물을 인도받음과 동시에 수급인에게 보수를 지급하는 것이 원칙이고, 이때 목적물의 인도는 완성된 목적물에 대한 단순한 점유의 이전만을 의미하는 것이 아니라 도급인이 목적물을 검사한 후 그 목적물이 계약내용대로 완성되었음을 명시적 또는 묵시적으로 시인하는 것까지 포함하는 의미이다.", true, "▸ 제작물공급계약에서 보수 지급시기에 특약이나 관습 없으면 완성된 목적물 인도받음과 동시에 수급인에게 보수를 지급함이 원칙 → 인도는 단순한 점유 이전만 의미하지 ×, 도급인이 목적물 검사한 후 계약내용대로 완성되었음을 명시적·묵시적 시인하는 것까지 포함하는 의미 O [2004다21862]", "도급"],
  ["091.③", "도급인이 하자보수에 갈음한 손해배상채권에 기하여 수급인의 공사대금채권 전부에 대하여 동시이행의 항변을 할 수 있을 때에는, 수급인은 위 손해배상에 관한 이행의 제공을 하지 아니한 이상 공사대금채권에 기한 유치권을 행사할 수 없다.", true, "▸ 수급인이 완공한 신축건물에 하자가 있고 하자 및 손해에 상응하는 금액이 공사잔대금액 이상이어서 도급인이 수급인에 대한 하자보수청구권 혹은 하자보수 갈음한 손해배상채권으로 수급인의 공사잔대금채권 전부에 대해 동시이행 항변을 한 경우 → 수급인은 공사잔대금채권으로 유치권 × ∵ 공사잔대금채권의 '변제기'가 도래하지 않은 경우와 마찬가지 [2013다30653]", "도급"],
  ["092.ㄴ", "수급인이 도급계약에 따른 의무를 제대로 이행하지 못함으로 말미암아 도급인의 신체 또는 재산에도 손해가 발생한 경우 하자확대손해로 인한 수급인의 손해배상채무는 도급인의 공사대금채무와 동시이행관계에 있다.", true, "▸ 하자확대손해로 인한 수급인의 (채무불이행) 손해배상채무도 공사대금채무와 동시이행 O ∵ 비록 쌍무계약관계 고유의 대가관계는 없더라도 이행상 견련성 인정할 사정 있다면 동시이행 항변권 인정, 667조 3항에서 536조 준용으로 하자 손해배상채권이 동시이행관계인 점 [2004다37676]", "도급"],
  ["093.③", "수급인이 건물을 완공하여 도급인에게 인도한 경우, 그 건물에 하자가 있더라도 도급인은 수급인에게 담보책임을 물어서 계약을 해제할 수 없다.", true, "제668조(동전–도급인의 해제권) 도급인이 완성된 목적물의 하자로 인하여 계약의 목적을 달성할 수 없는 때에는 계약을 해제할 수 있다. 그러나 건물 기타 토지의 공작물에 대하여는 그러하지 아니하다.\n▸ 건물 기타 공작물은 '완공' 이후에는 어떠한 하자가 있든 '해제'는 불허됨", "도급"],
  ["094.①", "甲은 자기 소유인 X 토지에 Y 건물을 신축하기 위하여 건축업자 乙과 공사대금을 6억 원으로 하는 도급계약을 체결하였고 乙은 Y 건물의 골조공사를 丙에게 맡기는 하도급계약을 체결하였다. Y건물은 착공한 지 1년 후 甲의 출재로 완공되었다. 甲은 공사대금의 일부를 지급하지 않고 있다. 乙은 공사대금채권을 담보하기 위하여 甲을 상대로 저당권설정을 청구하였다.§乙의 甲에 대한 저당권설정청구권의 소멸시효기간은 3년이다.", true, "▸ 666조 저당권설정청구권의 소멸시효기간은 3년 ∵ 공사대금채권 및 공사에 부수되는 채권은 163조 3호 3년 단기시효, 666조는 공사대금채권을 담보하기 위한 채권적 청구권으로서 공사에 부수되는 채권 [2014다211978]\n제666조(수급인의 목적부동산에 대한 저당권설정청구권) 부동산공사의 수급인은 전조의 보수에 관한 채권을 담보하기 위하여 그 부동산을 목적으로 한 저당권의 설정을 청구할 수 있다.", "도급"],
  ["094.②", "甲은 자기 소유인 X 토지에 Y 건물을 신축하기 위하여 건축업자 乙과 공사대금을 6억 원으로 하는 도급계약을 체결하였고 乙은 Y 건물의 골조공사를 丙에게 맡기는 하도급계약을 체결하였다. Y건물은 착공한 지 1년 후 甲의 출재로 완공되었다. 甲은 공사대금의 일부를 지급하지 않고 있다. 乙은 공사대금채권을 담보하기 위하여 甲을 상대로 저당권설정을 청구하였다.§乙의 甲에 대한 공사대금채권이 양도되는 경우 특별한 사정이 없는 한 乙의 甲에 대한 저당권설정청구권도 이에 수반하여 이전된다.", true, "▸ 공사대금채권 양도되면 저당권설정청구권도 수반하여 함께 이전 O ∵ 저당권설정청구권은 공사대금채권에 부수한 권리 → 수급인으로부터 공사대금채권 양수한 자의 저당권설정청구로 도급인의 저당권설정행위는 사해행위 × [2015다19827]", "도급"],
  ["088.④", "도급계약에 따라 완성된 목적물에 하자가 있는 경우 수급인의 하자담보책임과 채무불이행책임은 별개의 권원에 의하여 경합적으로 인정되며, 이는 도급인이 하자보수비용을 하자보수에 갈음하여 손해배상으로 구하는 경우에도 마찬가지이다.", true, "▸ 도급계약의 완성물에 하자 있는 경우, 수급인의 하자담보책임과 채무불이행책임은 별개 권원에 의해 경합적 인정 O → 도급인은 하자보수비용을 667조 2항 하자담보책임으로도, 390조 채무불이행으로도 구할 수 O [2020다201156]", "도급"],
  ["088.⑤", "건물을 완성하지는 못하였지만 사회통념상 독립한 건물이라고 볼 수 있는 상태에서 건축주의 사정으로 공사가 중단된 후 다른 사람이 그 미완성의 건물을 인도받아 나머지 공사를 마치고 완성한 경우 특별한 사정이 없는 한 그 완성건물의 원시취득자는 자기의 비용과 노력을 들인 원래의 건축주이다.", true, "▸ 건축주 사정으로 건축공사 중단되었던 미완성 건물을 인도받아 나머지 공사 마치고 완공한 경우 → 중단 시점에 이미 사회통념상 독립한 건물(최소한의 기둥, 지붕, 주벽)이라면 원래의 건축주가 원시취득 [2000다16350]\n건물신축 공사 진행 중 독립한 건물 요건 갖추지 못한 단계에서 중지된 것을 제3자가 이어받아 진행함으로써 건물 소유권 원시취득 → 애초 신축 중 건물에 대한 소유권 상실한 사람은 261조, 257조, 259조 준용하여 건물의 원시취득자에 대하여 부당이득 규정에 기하여 보상청구 O [2009다83933]", "도급"],
  // 기타전형계약,
  ["095.ㄱ", "수임인은 특별한 약정이 없으면 위임인에 대하여 보수를 청구하지 못한다.", true, "제686조(수임인의 보수청구권) ① 수임인은 특별한 약정이 없으면 위임인에 대하여 보수를 청구하지 못한다.", "기타전형계약"],
  ["095.ㄴ", "민법상의 위임계약은 본질상 당사자는 언제든지 이를 해지할 수 있으나, 다만 상대방이 불리한 시기에 해지한 때에는 해지가 부득이한 사유에 의한 것이 아닌 한 그로 인한 손해를 배상하여야 하고, 그 배상의 범위는 위임이 해지되었다는 사실로부터 생기는 손해이다.", false, "▸ 689조 2항의 손해는 해지로 생긴 손해 ×, 적당한 시기에 해지되었더라면 입지 않았을 손해 O [90다18968]\n제689조(위임의 상호해지의 자유) ① 위임계약은 각 당사자가 언제든지 해지할 수 있다. ② 당사자 일방이 부득이한 사유없이 상대방의 불리한 시기에 계약을 해지한 때에는 그 손해를 배상하여야 한다.", "기타전형계약"],
  ["095.ㄹ", "당사자가 위임계약을 체결하면서 민법 제689조에 규정된 바와 다른 내용으로 해지사유 및 절차 등을 정하였다면, 민법 제689조가 위 약정과는 별개 독립적으로 적용된다고 볼 만한 특별한 사정이 없는 한, 위 약정에서 정한 해지사유 및 절차에 의하지 않고는 계약을 해지할 수 없다.", true, "▸ 위임 689조 1·2항(상호해지자유, 손해배상)은 임의규정 → 당사자 약정으로 위 규정 배제 O → 약정하면 해지의 사유·절차, 손해배상책임은 약정에 따르게 되고, 위임계약 자유롭게 해지할 수 × [2017다53265]", "기타전형계약"],
  ["096.ㄴ", "甲은 자신의 명의로 실명확인을 거친 후 A 은행과 3억 원을 예치하는 계약을 체결하고 그에 관한 계약서를 작성하여 예금원장에 3억 원의 입금사실이 기록되었다. 그 후 甲이 乙에 대한 매매대금 3억 원을 지급하기 위하여 A 은행을 통해 乙이 거래하는 B 은행의 乙 계좌로 송금한다는 것이 착오로 계좌번호를 잘못 기재하여 丙이 거래하는 B 은행의 丙 계좌로 송금하고 말았다.§甲과 丙 사이에는 급부의 원인관계가 존재하지 않으므로 甲은 丙 계좌가 개설된 B 은행에 대하여 3억 원의 부당이득반환청구권을 갖게 된다.", false, "▸ 착오송금의 경우 부당이득반환은 수취인을 상대로 O, 수취은행을 상대로 × ∵ 송금의뢰인과 수취인 사이 계좌이체 원인 존부 불문하고 이체와 동시에 수취인과 수취은행 사이 계좌이체 금액 상당의 예금계약이 성립하고, 수취인은 수취은행에 대하여 위 금액 상당 예금채권 취득 → 수취은행은 이익 × [2007다51239]", "기타전형계약"],
  ["097.②", "계좌이체가 된 경우에는 예금원장에 입금기록이 된 때에 예금이 된다고 예금거래기본약관에 정하여져 있더라도, 송금의뢰인이 계좌이체의 원인인 법률관계가 존재하지 아니하에도 착오로 수취인의 예금구좌에 계좌이체를 한 경우, 수취인이 수취은행에 대하여 위 금액 상당의 예금채권을 취득하는 것은 아니다.", false, "▸ 착오송금의 경우 부당이득반환은 수취인을 상대로 O, 수취은행을 상대로 × ∵ 송금의뢰인과 수취인 사이 계좌이체 원인 존부 불문하고 이체와 동시에 수취인과 수취은행 사이 계좌이체 금액 상당의 예금계약이 성립하고, 수취인은 수취은행에 대하여 위 금액 상당 예금채권 취득 → 수취은행은 이익 × [2007다51239]", "기타전형계약"],
  ["098.①", "조합계약의 체결 당사자는「민법」이 정한 조합의 해산 사유와는 다른 사유를 추가할 수 있으나 청산에 관한 규정과 그 내용을 달리하는 특약은 효력이 없다.", false, "▸ 조합의 해산·청산 절차는 강행규정 × (특약으로 달리 정할 수 O) [84다카1921] ∵ 어차피 조합원 개인책임 부담, 조합채권자 보호 위한 것 ×", "기타전형계약"],
  ["098.②", "「민법」상 조합의 성질을 가지는 공동수급체의 구성원 지위는 원칙적으로 회사의 분할합병으로 인한 포괄승계의 대상이 되지 않는다.", true, "▸ [상법] 공동수급체는 민법상 조합 성질, 공동수급체 구성원 사이에 구성원 지위 제3자 양도 가능 약정 없는 이상, 공동수급체의 구성원 지위는 상속 ×, 다른 구성원들 동의가 없으면 이전 불허되는 귀속상 일신전속적 권리의무 O. 회사 분할합병으로 인한 포괄승계 대상 × [2010다44002]", "기타전형계약"],
  ["098.③", "조합 당사자 간 불화, 대립으로 신뢰관계가 파괴되어 조합업무의 원만한 운영을 기대할 수 없다는 사정만으로는「민법」제720조가 규정한 조합의 해산청구 사유인 '부득이한 사유'에 해당하지 않는다.", false, "▸ 제720조 조합 해산사유 '부득이한 사유'에는 경제계 사정변경, 조합 재산상태 악화 등으로 조합 목적달성 현저히 곤란하게 된 경우 외에 조합원 사이 반목·불화·대립으로 신뢰관계 파괴되어 조합의 원만한 공동운영 기대할 수 없게 된 경우 포함 O, 신뢰관계 파괴에 책임 있는 당사자도 조합 해산청구권 O [92다21098]", "기타전형계약"],
  ["098.④", "조합이 존속기간을 정하고 있는 때에는 부득이한 사유가 있더라도 조합원은 조합의 불리한 시기에 탈퇴할 수 없다.", false, "제716조(임의탈퇴) ① 조합계약으로 조합의 존속기간을 정하지 아니하거나 조합원의 종신까지 존속할 것을 정한 때에는 각 조합원은 언제든지 탈퇴할 수 있다. 그러나 부득이한 사유없이 조합의 불리한 시기에 탈퇴하지 못한다. ② 조합의 존속기간을 정한 때에도 조합원은 부득이한 사유가 있으면 탈퇴할 수 있다.", "기타전형계약"],
  ["098.⑤", "조합에서 조합원이 탈퇴하는 경우, 탈퇴자와 잔존자 사이의 탈퇴로 인한 지분계산에 있어서는 조합 내부의 손익분배비율이 아니라 실제 출자한 자산가액비율에 의하여야 하는 것이 원칙이다.", false, "▸ 조합에서 조합원이 탈퇴하는 경우, 탈퇴자와 잔존자 사이의 탈퇴로 인한 계산은 특별한 사정이 없는 한 719조 1항, 2항에 따라 '탈퇴 당시의 조합재산상태'를 기준으로 평가한 조합재산 중 탈퇴자의 지분에 해당하는 금액을 금전으로 반환해야 → 조합원 지분비율은, 조합 청산에서 실제 출자한 자산가액 비율로 하는 것과 달리, 조합 내부 손익분배 비율 기준으로 계산해야 [2022다285523, 2022다285530]", "기타전형계약"],
  ["099.ㄱ", "조합원의 임의 탈퇴는 조합계약에 관한 일종의 해지로서 다른 조합원에 대한 의사표시로써 하여야 하는데, 그 의사표시는 묵시적으로도 할 수 있다.", true, "▸ [2015다30206]\n[AI해설] 조합원의 임의 탈퇴 의사표시는 명시적 뿐 아니라 묵시적으로도 가능하다.", "기타전형계약"],
  ["099.ㄴ", "乙이 탈퇴함으로써 조합관계가 종료되고 그 결과 조합은 당연히 해산 또는 청산된다.", false, "▸ 2인에서 1인 임의탈퇴 O → 조합관계 종료 O → 조합해산 ×, 청산 × → 합유재산이 단독소유 되고 탈퇴자·잔존자 사이 계산 O [86다카2484]", "기타전형계약"],
  ["099.ㄷ", "甲과 乙의 합유에 속한 조합재산은 乙의 탈퇴 후 甲의 단독소유에 속한다.", true, "▸ 위 지문 ㄴ. 해설 참조\n[AI해설] 2인 조합에서 1인 탈퇴 시 조합 해산·청산 없이 합유재산은 잔존 조합원 단독소유가 된다.", "기타전형계약"],
  ["099.ㄹ", "乙은 甲에 대해 탈퇴로 인한 조합재산의 계산을 요구할 수 있으며 그 계산은 乙의 탈퇴 당시의 조합재산 상태에 의하여야 한다.", true, "▸ 탈퇴자는 탈퇴 당시의 조합재산 계산 결과 조합 재산상태가 적자 아닌 경우에 지분 환급 O → 탈퇴자는 별도 약정 없는 한 지분 환급을 주장하는 사람에게 조합재산 상태 증명책임 O [2019다207851]", "기타전형계약"],
  ["099.ㅁ", "乙의 지분을 계산할 때 지분을 계산하는 방법에 관해서 별도 약정이 있다는 등 특별한 사정이 없는 한 조합재산의 상태를 증명할 책임은 甲에게 있다.", false, "▸ 위 지문 ㄹ. 해설 참조\n[AI해설] 지분 환급을 주장하는 탈퇴자(乙)가 조합재산 상태를 증명할 책임을 부담하므로, 甲에게 증명책임이 있다는 지문은 틀렸다.", "기타전형계약"],
  ["SS11.ㄱ", "조합에서 조합원이 탈퇴하는 경우, 탈퇴자에게는 조합재산 중 탈퇴자의 지분에 해당하는 금액을 금전으로 반환한다.", true, "▸ ㄱ, ㄴ 지문 해설 : 조합에서 조합원이 탈퇴하는 경우, 탈퇴자와 잔존자 사이의 탈퇴로 인한 계산은 특별한 사정이 없는 한 719조 1항, 2항에 따라 '탈퇴 당시의 조합재산상태'를 기준으로 평가한 조합재산 중 탈퇴자의 지분에 해당하는 금액을 금전으로 반환해야 [2022다285523, 2022다285530]", "기타전형계약"],
  ["SS11.ㄴ", "조합에서 조합원이 탈퇴하는 경우, 탈퇴자와 잔존자 사이의 탈퇴로 인한 지분계산에 있어서는 조합 내부의 손익분배비율이 아니라 실제 출자한 자산가액비율에 의하여야 하는 것이 원칙이다.", false, "▸ ㄱ, ㄴ 지문 해설 : 조합에서 조합원이 탈퇴하는 경우, 탈퇴자와 잔존자 사이의 탈퇴로 인한 계산은 특별한 사정이 없는 한 719조 1항, 2항에 따라 '탈퇴 당시의 조합재산상태'를 기준으로 평가한 조합재산 중 탈퇴자의 지분에 해당하는 금액을 금전으로 반환해야 → 조합원 지분비율은, 조합 청산에서 실제 출자한 자산가액 비율로 하는 것과 달리, 조합 내부 손익분배 비율 기준으로 계산해야 [2022다285523, 2022다285530]", "기타전형계약"],
  ["SS11.ㄷ", "조합계약으로 조합의 존속기간을 조합원의 종신까지로 정한 경우 조합원은 부득이한 사유가 있어야 조합에서 탈퇴할 수 있다.", false, "제716조(임의탈퇴) ① 조합계약으로 조합의 존속기간을 정하지 아니하거나 조합원의 종신까지 존속할 것을 정한 때에는 각 조합원은 언제든지 탈퇴할 수 있다. 그러나 부득이한 사유없이 조합의 불리한 시기에 탈퇴하지 못한다.", "기타전형계약"],
  ["SS11.ㄹ", "조합의 구성원들 사이에 내부적인 법률관계를 규율하기 위한 약정이 있는 경우 한쪽 당사자가 그 약정에 따른 의무를 이행하지 않아 다른 상대방에게 손해가 발생하였다면 그 상대방에게 채무불이행에 기한 손해배상청구권이 인정된다.", true, "▸ 조합계약도 계약자유 원칙 적용 O, 구성원들은 자유로운 의사에 따라 조합계약 내용 정할 수 O → 조합 구성원들 사이 내부적 법률관계 규율 위한 약정 있는 경우 그들 사이 권리·의무는 원칙적으로 그 약정에 따라 → 한쪽 당사자가 약정에 따른 의무 이행하지 않아 상대방이 도급인에 대한 의무 이행하기 위해 손해 발생했다면 상대방에게 채무불이행 손해배상책임 O [2021다284035]", "기타전형계약"],
  ["SS11.ㅁ", "조합의 채무는 조합원들이 합유적으로 부담하는 채무이고 2인으로 이루어진 조합관계에 있어 그 중 1인이 탈퇴하면 탈퇴자와의 사이에 조합관계는 종료된다 할 것이나, 특별한 사정이 없는 한 조합은 해산되지 아니하고 조합원들의 합유에 속한 조합재산은 남은 조합원에게 귀속하게 되므로 이 경우 조합채권자는 잔존 조합원에게 그 조합채무 전부에 대한 이행을 청구할 수 있다.", true, "▸ 조합채무는 조합원들이 합유적으로 부담하는 채무, 2인 조합에서 1인 탈퇴하면 조합관계 종료 O → 조합해산 ×, 합유인 조합재산은 남은 조합원에게 귀속 O → 조합채권자는 잔존 조합원에게 조합채무 전부 이행 청구 O [99다1284]", "기타전형계약"],
  ["SS12.ㄱ", "甲과 乙은 각각 2억 원씩 출자하여 공동사업을 경영하기로 하는 조합계약을 체결하였다.§乙이 출자 시기를 지체한 때에는 연체이자를 지급하는 외에 손해를 배상하여야 한다.", true, "제705조(금전출자지체의 책임) 금전을 출자의 목적으로 한 조합원이 출자시기를 지체한 때에는 연체이자를 지급하는 외에 손해를 배상하여야 한다.", "기타전형계약"],
  ["SS12.ㄴ", "甲과 乙은 각각 2억 원씩 출자하여 공동사업을 경영하기로 하는 조합계약을 체결하였다.§乙의 채권자 丙이 乙에 대한 대여금채권으로써 乙을 집행채무자로 하여 조합의 채권에 대하여 강제집행을 하는 경우, 甲은 보존행위로서 제3자 이의의 소를 제기하여 그 강제집행의 불허를 구할 수 있다.", true, "▸ 조합의 채권은 조합원 전원에게 합유적 귀속, 조합원 1인이 임의로 조합의 채무자에 대해 출자지분 비율에 따른 급부청구 × → 조합원 중 1인의 채권자가 그 조합원 개인을 집행채무자로 조합의 채권에 대해 강제집행하면, 다른 조합원으로서는 보존행위로서 단독으로 제3자이의 소 제기 O [97다4401]", "기타전형계약"],
  ["SS12.ㄷ", "甲과 乙은 각각 2억 원씩 출자하여 공동사업을 경영하기로 하는 조합계약을 체결하였다.§乙이 조합에서 탈퇴하는 경우, 특별한 사정이 없는 한 조합채권자는 甲에게 조합채무 전부의 이행을 청구할 수 있다.", true, "▸ 조합채무는 조합원들이 합유적으로 부담하는 채무, 2인 조합에서 1인 탈퇴하면 조합관계 종료 O → 조합해산 ×, 합유인 조합재산은 남은 조합원에게 귀속 O → 조합채권자는 잔존 조합원에게 조합채무 전부 이행 청구 O [99다1284]", "기타전형계약"],
  ["SS12.ㄹ", "甲과 乙은 각각 2억 원씩 출자하여 공동사업을 경영하기로 하는 조합계약을 체결하였다.§조합계약으로 조합의 존속기간을 甲의 종신까지로 정한 경우 조합원은 부득이한 사유가 있어야 조합에서 탈퇴할 수 있다.", false, "제716조(임의탈퇴) ① 조합계약으로 조합의 존속기간을 정하지 아니하거나 조합원의 종신까지 존속할 것을 정한 때에는 각 조합원은 언제든지 탈퇴할 수 있다. 그러나 부득이한 사유없이 조합의 불리한 시기에 탈퇴하지 못한다.", "기타전형계약"],
  ["100.①", "조합채무는 조합원들이 조합재산에 의하여 합유적으로 부담하는 채무이고 2인으로 이루어진 조합관계에 있어 그 중 1인이 탈퇴하면 탈퇴자와의 사이에 조합관계는 종료된다 할 것이나, 특별한 사정이 없는 한 조합은 해산되지 아니하고 조합원들의 합유에 속한 조합재산은 남은 조합원에게 귀속하게 되므로 이 경우 조합채권자는 잔존 조합원에게 그 조합채무 전부에 대한 이행을 청구할 수 있다.", true, "▸ 2인에서 1인 임의탈퇴 O → 조합관계 종료 O → 조합해산 ×, 청산 × → 합유재산이 단독소유 되고 탈퇴자·잔존자 사이 계산 O [86다카2484]", "기타전형계약"],
  ["100.②", "조합원 중 1인이 조합에서 탈퇴하고 조합재산에 대한 그 지분을 포기하기로 하는 의사를 표시하였다 하더라도 등기를 하지 아니하는 한 지분권자는 제3자에 대하여는 여전히 조합재산인 부동산의 합유지분권자의 지위를 가진다.", true, "▸ 조합재산이 부동산인 경우에는 잔존 조합원의 단독소유 등기를 해야 소유권변동 효력 O ∵ 조합관계 탈퇴라는 법률행위에 의한 물권변동 [2008다2807]", "기타전형계약"],
  ["100.③", "별도의 정함이 없는 한 조합원의 2/3 찬성으로 업무집행조합원을 선임할 수 있지만, 해임 시에는 조합원 전원의 동의가 있어야 한다.", true, "제706조(사무집행의 방법) ① 조합계약으로 업무집행자를 정하지 아니한 경우에는 조합원의 3분의 2 이상의 찬성으로 써 이를 선임한다.\n제708조(업무집행자의 사임, 해임) 업무집행자인 조합원은 정당한 사유없이 사임하지 못하며 다른 조합원의 일치가 아니면 해임하지 못한다.", "기타전형계약"],
  ["101.ㄹ", "조합원은 조합의 채권을 자동채권으로 하여 조합채무자가 조합원 자신에게 갖는 채권을 상계할 수 없다.", true, "제715조(조합채무자의 상계의 금지) 조합의 채무자는 그 채무와 조합원에 대한 채권으로 상계하지 못한다.", "기타전형계약"],
  ["095.ㄷ", "당사자가 위임계약을 체결하면서 민법 제689조에 규정된 바와 다른 내용으로 해지 사유 및 절차 등을 정하였다면, 민법 제689조가 위 약정과는 별개 독립적으로 적용된다고 볼 만한 특별한 사정이 없는 한, 위 약정에서 정한 해지사유 및 절차에 의하지 않고는 계약을 해지할 수 없다.", true, "▸ 위임의 689조 1·2항(상호해지자유, 손해배상)은 임의규정 → 당사자 약정으로 위 규정 배제 O → 약정하면 해지의 사유·절차, 손해배상책임은 약정에 따르게 되고, 위임계약 자유롭게 해지할 수 × [2017다53265]", "기타전형계약"],
  ["102.②", "甲은 이웃에 사는 乙이 해외여행을 간 사이에 폭우가 내려 乙의 담장이 무너지려는 것을 보고 건축업자인 丙과 위 담장이 무너지지 않도록 보강공사 도급계약을 체결하고, 丙은 위 보강공사를 완료하였다.§丙과 乙 사이에는 계약관계가 존재하지 않으므로 丙은 乙을 상대로 위 담장의 보강공사로 인하여 증가한 이득액에 대하여 부당이득반환청구를 할 수 있다.", false, "▸ 계약상 급부가 계약 상대방뿐 아니라 제3자의 이익으로 된 경우에 급부를 한 계약당사자가 계약 상대방에 대한 계약상 반대급부청구권 이외에 그 제3자에 대하여 직접 부당이득반환청구 × ∵ 자기 책임하 체결된 계약에 따른 위험을 제3자에게 전가시켜 계약법 기본원리 반함, 계약당사자가 채무자인 계약 상대방의 일반채권자에 비하여 우대받아 일반채권자 이익을 해침, 수익인인 제3자가 계약 상대방에 대하여 가지는 항변권 침해 [99다66564] → 설문의 사안에는 비록 사무관리가 등장하지만, 사무관리와 관련된 2011다17106 판결이나 2012다43539 판결과는 무관하다는 점을 유의", "기타전형계약"],
  ["103.①", "사인이 처리한 국가의 사무가 사인이 국가를 대신하여 처리할 수 있는 것으로서 사무처리의 긴급성 등 국가의 사무에 대한 사인의 개입이 정당화되는 경우라도, 사인이 법령상 근거 없이 국가의 사무를 수행할 수 없다는 점을 고려하면, 사인은 국가에 대하여 국가의 사무를 처리하면서 지출한 비용의 상환을 청구할 수 없다.", false, "▸ 국가의 사무는 사인이 국가를 대신하여 처리할 수 있는 성질로서 사무처리의 긴급성 등 사인의 국가사무 개입이 정당화되는 경우에 한하여 사무관리 O → 그 범위 내에서 국가에 대해 비용상환청구 O [2012다15602]", "기타전형계약"],
  ["103.⑤", "직업에 의하여 유상으로 타인을 위하여 일하는 甲이 향후 계약이 체결될 것을 예정하여 그 직업의 범위 내에서 乙을 위한 행위를 하였으나 그 후 계약이 체결되지 아니함에 따라 타인을 위한 사무를 관리한 것으로 인정되는 경우, 甲이 다른 사람을 고용하지 않고 직접 사무를 처리하였다면 甲은 乙에게 통상의 보수에 상응하는 금액을 필요비 내지 유익비로 청구할 수 있다.", true, "▸ [2007다55477]\n[AI해설] 향후 계약 체결을 예정하고 직업 범위 내에서 타인을 위해 행위하였으나 계약이 체결되지 않아 사무관리가 된 경우, 직접 사무를 처리한 자는 통상 보수에 상응하는 금액을 필요비 내지 유익비로 청구할 수 있다.", "기타전형계약"],
  ["104.④", "채권자가 자신의 채권을 보전하기 위하여 채무자와 다른 상속인이 공동으로 상속받은 부동산에 관하여 공동상속등기를 대위신청하여 등기가 행하여진 경우, 채권자는 자신의 채무자가 아닌 제3자에 대하여도 특별한 사정이 없는 한 사무관리에 기하여 그 등기에 소요된 비용의 상환을 청구할 수 있다.", true, "▸ 채권자가 자기 채권 보전 위해 채무자가 공동상속 받은 부동산에 공동상속등기를 대위신청한 경우 채무자 아닌 상속인에 대한 사무관리 O [2013다30882]", "기타전형계약"],
  ["105.ㄱ", "의무 없이 타인을 위하여 사무를 관리한 자는 타인에 대하여 민법상 사무관리 규정에 따라 비용상환 등을 청구할 수 있는 외에, 사무관리에 의하여 결과적으로 사실상 이익을 얻은 제3자에 대하여 직접 부당이득반환을 청구할 수는 없다.", true, "▸ 의무 없이 타인 위해 사무 관리한 자는 그 타인에 대하여 민법 사무관리 규정에 따라 비용 상환 청구할 수 있는 외에, 사무관리로 사실상 이익 결과 얻은 다른 제3자에 대하여 직접 부당이득반환청구 × [2011다17106] → 계약상 급부를 한 경우 전용물소권이 부정되는 법리가 사무관리에도 확장", "기타전형계약"],
  // 부당이득,
  ["106.①", "저당물의 멸실, 훼손 또는 공용징수로 인하여 저당권자가 물상대위권을 행사할 수 있었으나 저당권자가 압류하기 전에 저당물의 소유자가 금전 등을 수령함으로써 물상대위권을 행사할 수 없게 된 경우, 저당권자는 저당물 소유자에 대하여 채권최고액을 한도로 하는 피담보채권액을 부당이득으로 청구할 수 있다.", true, "▸ 물상대위권 행사 전에 저당물 소유자가 수령해버리면 더 이상 물상대위 × → 다만 그를 상대로 부당이득반환청구 O ∵ 저당권자는 최고액 범위 내 저당권 상실 손해 O, 소유자는 교환가치 양보할 지위인데 마치 부담 없던 상태 대가 취득하는 이익 O, 인과관계 O → 채권최고액 한도 피담보채권액 범위 내 이득 반환 [2008다17656]", "부당이득"],
  ["107.ㄱ", "부동산 실권리자명의 등기에 관한 법률을 위반하여 무효인 명의신탁약정에 따라 명의신탁자에 의해 명의수탁자 명의로 경료된 소유권이전등기는 불법원인급여에 해당하므로 명의신탁자는 그 말소를 청구할 수 없다.", false, "▸ 농지법 제한 회피하고자 실명법을 위반하여 명의수탁자 명의로 등기해도 신탁자가 수탁자를 상대로 등기말소 O, 불법원인급여 × ∵ 실명법도 부동산 소유권을 실권리자에게 귀속시킴을 전제로 규율하고 있음. 명의신탁을 반사회적인지 아닌지 구분하여 적용 달리해서는 × [2013다218156]", "부당이득"],
  ["107.ㄹ", "계약의 일방 당사자가 계약 상대방의 지시 등으로 급부과정을 단축하여 계약상 대방과 또 다른 계약관계를 맺고 있는 제3자에게 직접 급부한 자는 지시자와의 원인관계가 무효가 되더라도 제3자를 상대로 직접 부당이득반환을 청구할 수 없다.", true, "▸ 그 급부로써 급부한 계약 당사자의 상대방에 대한 급부가 이루어질 뿐 아니라 상대방의 제3자에 대한 급부로도 이루어지는 것이므로, 계약 일방 당사자는 제3자를 상대로 법률상 원인 없이 급부 수령했다는 이유로 부당이득반환청구 × [2001다46730] → ∵ 계약관계의 청산은 계약 상대방과 이루어져야, 직접 부당이득반환청구를 할 수 있다고 보면 계약 위험 부담을 제3자에게 전가시켜 계약법 기본원리 반하고 수익인인 제3자가 계약 상대방에 대하여 가지는 항변권 침해", "부당이득"],
  ["108.ㄱ", "甲의 乙에 대한 부당이득반환청구가 인정되는 경우(○)와 부정되는 경우(×)를 올바르게 짝지은 것은?§乙 소유의 토지를 시효취득한 甲이 그 사실을 알지 못하는 乙에 의하여 그 토지에 설정된 丙 명의의 근저당권을 제거하기 위하여 乙의 丙에 대한 피담보채무를 변제한 경우, 甲은 이를 이유로 乙에 대하여 변제액 상당의 부당이득반환을 청구할 수 있다.", false, "▸ 시효취득자가 원소유자에 의하여 설정된 근저당권의 피담보채무를 변제한 경우라도 원소유자에게 대위변제를 이유로 구상권 ×, 부당이득반환청구 × ∵ 그 변제행위는 시효취득자가 용인해야 할 토지상 부담 제거하여 완전한 소유권 확보하는 자신의 이익을 위한 행위 [2005다75910]", "부당이득"],
  ["SS13.ㄱ", "경매개시결정 당시 이미 피담보채권이 소멸하여 저당권이 무효인 경우, 매수인은 매각대금을 납입하였더라도 경매목적물의 소유권을 취득하지 못하며, 경매채권자 등 배당금을 수령한 자를 상대로 그가 배당받은 금액에 대하여 부당이득반환을 청구할 수 있다.", true, "▸ 임의경매 무효인 경우 경락인은 배당금 수령 채권자(=근저당권자)에 대하여 배당금의 부당이득반환청구 O [2006다24049]\n민집법 267조(매수인의 부동산 취득은 담보권 소멸로 영향받지 않는다)는 '경매개시 후' 담보권 소멸했음에도 경매 진행되어 매각된 경우에만 적용(예외적 공신력), 종래 판례 유지 O ∵ 유효한 담보권에 기해 일단 경매개시되면 국가에게 처분권, 애초 담보권 소멸했다면 경매개시 위법, 공신력 없는 등기제도와 조화 [2018다205209]", "부당이득"],
  ["SS13.ㄴ", "경매개시결정 당시 이미 피담보채권이 소멸하여 저당권이 무효인 경우, 저당권자의 배당금채권에 대해 적법하게 발부되어 확정된 압류·전부명령을 받은 자가 배당금을 수령하였다면, 이로써 저당권자는 전부채권자에게 부담하던 채무 소멸의 이익을 얻었으므로, 매수인은 저당권자를 상대로 부당이득반환을 청구할 수 있다.", false, "▸ 당연한 법리로 정리 : 경매절차가 무효라면 배당금채권도 존재 ×, 존재하지 않는 배당금 채권에 대한 압류·전부명령도 무효 → 전부채권자가 수령한 배당금은 부당이득 → 저당권자는 채무 소멸 이익 없음 → 경락인은 저당권자가 아닌 배당받은 전부채권자를 상대로 부당이득반환 구해야\n▸ 경매 신청 당시 피담보채권 이미 소멸되어 무효인 근저당권에 기초하여 임의경매절차 개시, 매수인 매각대금 완납 → 경매절차 무효, 경락인 소유권 취득 × → 경락인은 배당금 수령한 채권자 상대로 반환청구 O\n피압류채권 존재하지 않는다면 압류명령과 전부명령 무효 → 집행채권 변제로 소멸되는 효과 × [2023다228107]", "부당이득"],
  ["109.②", "수익자가 취득한 것이 성질상 계속적으로 반복하여 거래되는 물품으로서 곧바로 판매되어 환가될 수 있는 금전과 유사한 대체물인 경우에는, 이를 취득한 자가 소비하였는가 여부를 불문하고 이득이 현존하는 것으로 추정한다.", true, "▸ 부당이득으로 취득한 것이 성질상 계속 반복하여 거래되는 물품으로서 곧바로 판매되어 환가될 수 있는 금전과 유사한 대체물이라면 현존 추정됨 [2007다20440]", "부당이득"],
  ["109.③", "법정지상권이 있는 건물의 양수인으로서 장차 법정지상권을 취득할 지위에 있어 대지 소유자의 건물 철거나 대지 인도 청구를 거부할 수 있는 자라 하더라도, 그 대지를 점유·사용함으로 인하여 얻은 이득은 부당이득으로서 대지 소유자에게 반환할 의무가 있다.", true, "▸ 법정지상권 있는 건물양수인이 법정지상권 취득할 지위로서 건물철거 거부할 수 있다고 하더라도 대지 점유사용으로 얻은 실질적 이득은 대지소유자에게 손해 끼치는 한에서는 부당이득반환의무 O [94다61144]", "부당이득"],
  ["109.⑤", "타인 소유물을 권원 없이 점유한 악의의 수익자는 받은 이익에 이자를 붙여 반환하여야 하고, 그 이자의 이행지체로 인한 지연손해금도 지급해야 한다.", true, "제201조(점유자와 과실) ② 악의의 점유자는 수취한 과실을 반환하여야 하며 소비하였거나 과실로 인하여 훼손 또는 수취하지 못한 경우에는 그 과실의 대가를 보상하여야 한다.\n제748조(수익자의 반환범위) ② 악의의 수익자는 그 받은 이익에 이자를 붙여 반환하고 손해가 있으면 이를 배상하여야 한다.\n▸ 201조 2항은 748조 2항의 특칙이 아니므로, 타인 재산에 대한 악의의 점유·사용자는 과실(부당이득) 외에 이자, 손해배상도 해야 함", "부당이득"],
  ["110.②", "저당권자와 같이 배당받을 권리 있는 채권자가 자신이 배당에서 제외되는 것으로 배당표가 작성됨으로써 비로소 배당을 받게 된 다른 채권자를 상대로 부당이득반환청구를 할 수 있다.", true, "▸ 배당받을 권리 있는 채권자(선순위 권리자)가 자신이 배당받을 몫을 받지 못하고 그로 인해 권리 없는 다른 채권자(후순위 권리자)가 그 몫을 배당받는 경우, 배당이의 여부, 배당표 확정 여부와 관계없이 배당받을 수 있었던 채권자가 배당금을 수령한 다른 채권자를 상대로 부당이득반환 O ∵ 실체법 질서에 부합, 현실적 필요성(배당이의의 소의 한계, 채권자취소소송 가액반환 문제점 보완) → 종래 대법원 판례 유지 [2014다206983]", "부당이득"],
  ["110.③", "집행력 있는 정본을 가진 채권자는 배당요구의 종기까지 배당요구를 하지 않았다고 하더라도, 자신이 배당에서 제외되는 것으로 배당표가 작성됨으로써 비로소 배당을 받게 된 다른 채권자를 상대로 부당이득반환청구를 할 수 있다.", false, "▸ 배당요구채권자가 배당요구 하지 않았다면 배당받을 수 없고 배당실시 이후 배당받은 자에게 부당이득반환청구 × [2001다70702]", "부당이득"],
  ["110.⑤", "구분소유자 중 일부가 정당한 권원 없이 집합건물의 복도, 계단 등과 같은 공용부분을 배타적으로 점유·사용함으로써 이익을 얻고 그로 인하여 다른 구분소유자들이 해당 공용부분을 사용할 수 없게 되었다 하더라도, 해당 공용부분이 구조상 이를 별개 용도로 사용하거나 다른 목적으로 임대할 수 있는 대상이 아니라면 부당이득반환의무가 인정되지 아니한다.", false, "▸ 구분소유자 중 일부가 정당한 권원 없이 집합건물의 복도·계단 등 '공용부분' 배타적 점유·사용함으로써 이익 얻고 그로 인해 다른 구분소유자들이 사용할 수 없게 되면 부당이득반환의무 O → 구조상 별개 용도 사용하거나 다른 목적 임대할 수 없는 공용부분이어도 마찬가지 → 제3자가 공용부분을 권원 없이 배타적 점유·사용할 경우도 마찬가지 [2017다220744] → 2020년 전원합의체로 위와 같이 판례변경", "부당이득"],
  ["111.①", "유효한 도급계약에 기하여 수급인 丙이 도급인 乙로부터 甲 소유의 물건을 인도받아 수리한 결과 그 물건의 가치가 증가한 경우 丙은 甲을 상대로 직접 증가액 상당의 민법 제203조에 의한 비용상환이나 제741조에 의한 부당이득반환을 청구할 수 없다.", true, "▸ [99다66564]\n[AI해설] 계약상 급부가 계약 상대방(乙) 아닌 甲에게 이익이 된 경우라도, 수급인 丙은 계약관계의 청산을 계약 당사자(乙)와 해야 하므로 甲을 상대로 직접 비용상환·부당이득반환 청구 불가.", "부당이득"],
  ["111.②", "수익자가 법률상 원인 없이 이득한 재산을 처분함으로 인하여 원물반환이 불가능한 경우 반환하여야 할 가액은 특별한 사정이 없는 한 가액반환 당시의 시가를 기준으로 할 것이 아니라 처분 당시의 대가를 기준으로 하여야 한다.", true, "▸ 수익자가 원물을 처분한 경우 가액반환은 처분당시의 대가의 가액이고, 그 후 가격 앙등분은 이득 × [94다25551]", "부당이득"],
  ["111.③", "급부부당이득의 경우 법률상 원인이 없다는 점에 대한 증명책임은 부당이득반환을 주장하는 사람에게 있고, 침해부당이득의 경우에는 부당이득반환청구의 상대방이 스스로 그 이익을 보유할 정당한 권원이 있다는 점을 증명하여야 한다.", true, "▸ 일방이 자신의 의사로 일정한 급부를 한 다음 급부가 법률상 원인 없음을 이유로 반환청구 하는 이른바 '급부부당이득'의 경우, 법률상 원인 없음에 대한 증명책임은 부당이득반환 주장자 / 타인 재산권 등을 침해하여 이익 얻었음을 이유로 부당이득반환 구하는 이른바 '침해부당이득'의 경우, 청구 상대방이 이익 보유할 정당한 권원 있음을 증명하여야 [2017다37324]", "부당이득"],
  ["111.④", "토지매수인이 소유권이전등기를 마치기 전에 매매계약의 이행으로 목적토지를 인도받아 점유·사용하는 경우 매도인이 매수인에 대하여 임료 상당의 부당이득반환을 청구할 수 있다.", false, "▸ 매수인이 아직 소유권이전등기 마치지 않았더라도 매매계약 이행으로 인도받은 때에는 매매계약의 효력으로서 이를 점유·사용할 권리 있으므로, 매도인이 매수인에 대해 부당이득반환청구 × [87다카1682]", "부당이득"],
  ["112.③", "원물반환이 불가능하여 수익자가 가액을 반환해야 하는 경우, 수익자가 그 이익을 반환할 수 없다면 수익자로부터 무상으로 그 이익의 목적물을 양수한 제3자는 선의라 하더라도 이를 반환할 책임이 있다.", false, "제747조(원물반환불능한 경우와 가액반환, 전득자의 책임) ① 수익자가 그 받은 목적물을 반환할 수 없는 때에는 그 가액을 반환하여야 한다. ② 수익자가 그 이익을 반환할 수 없는 경우에는 수익자로부터 무상으로 그 이익의 목적물을 양수한 악의의 제3자는 전항의 규정에 의하여 반환할 책임이 있다.\n[AI해설] 747조 2항은 무상 양수 + 악의인 경우에만 전득자 책임 발생 → '선의라 하더라도' 반환 책임 있다는 지문은 틀렸다.", "부당이득"],
  ["113.ㄱ", "지능지수가 낮아 6세 정도의 사회연령을 가진 甲은, 친구 乙의 부탁을 받아 직접 丙 금융기관을 방문하여 5천만 원을 대출받으면서 그 이행을 담보하기 위하여 甲 소유 부동산에 丙 명의의 근저당권을 설정하였다. 그리고 이와 같이 대출받은 5천만 원을 다시 乙에게 빌려주었다. 丙이 甲에게 이행을 청구하자 甲이 의사무능력을 이유로 소비대차계약의 무효를 주장하여 승소하였고, 이에 丙은 甲에게 부당이득의 반환을 청구한다.§甲은 丙에 대하여 선의·악의를 불문하고 현존이익의 범위 내에서만 부당이득반환의무를 부담한다.", true, "▸ 141조 단서는 제한능력자 보호 취지로 부당이득반환 범위인 748조의 특칙, 의사무능력자에게 유추적용 O. 다만 금전상 이익은 현존 추정 → 의사무능력자가 자기 소유 부동산에 저당권 설정해주고 금융기관으로부터 대출받아 제3자에게 대여했다면 대출로 받은 이익이 제3자에 대한 대여금채권 또는 부당이득반환채권 형태로 현존 → 금융기관은 대출약정 무효에 따른 부당이득으로 대출금 자체의 반환을 구할 수는 ×, 현존이익인 위 채권 양도를 구할 수 O [2008다58367]", "부당이득"],
  ["114.⑤", "도박자금을 제공함으로 인하여 발생한 채권의 담보로 부동산에 관하여 근저당권설정등기가 경료되었을 뿐이라면 위 근저당권설정등기로 근저당권자가 받을 이익은 민법 제746조에서 말하는 이익에는 해당하지 아니하므로, 그 부동산의 소유자는 위 등기의 말소를 청구할 수 있다.", true, "▸ 103조 위반한 도박채무의 담보로 근저당권을 설정했다면 불법원인급여 × → 말소청구 O ∵ 종국적 ×, 불법원인급여의 이익은 종국적이어야, 종속적이면 ×, 이익 향수 위해 경매신청의 별도 조치 취해야 하므로 [93다55234]", "부당이득"],
  ["115.②", "매도인에게 소유권이 유보된 채 매수인에게 인도된 건축자재가, 매매대금이 모두 지급되지 않은 상태에서 매수인과 제3자 사이에 체결된 도급계약의 이행에 따라 제3자 소유의 신축건물에 부합된 경우, 매도인은 제3자가 소유권 유보에 관하여 과실 없이 알지 못하였더라도 그에게 부당이득의 반환을 청구할 수 있다.", false, "▸ 261조 보상청구권이 인정되려면 261조 자체의 요건 외에 부당이득반환의 요건도 모두 충족되어야 → 매도인에게 소유권 유보된 자재가 제3자와 매수인 사이 도급계약 이행으로 제3자 소유 건물에 부합된 경우, 제3자가 도급계약에 제공된 자재의 소유권 유보 사실에 관하여 선의·무과실이라면, 선의취득 법리 유추적용하여 제3자가 자재 귀속 이익을 보유할 법률상 원인 O → 매도인은 제3자(도급인)를 상대로 보상청구 × [2009다15602]", "부당이득"],
  ["115.④", "타인 소유의 토지 위에 권원 없이 건물을 소유하고 있는 자는 그 건물을 실제로 사용, 수익하고 있지 아니하더라도 특별한 사정이 없는 한 법률상 원인 없이 타인의 재산으로 인하여 토지의 차임에 상당하는 이익을 얻고 이로 인하여 타인에게 동일한 금액 상당의 손해를 주고 있다고 볼 수 있다.", true, "▸ 타인 소유 토지 위에 권한 없이 건물 소유하는 자는 그 자체로써 법률상 원인 없이 타인 재산으로 '토지' 차임 상당 이익 얻어 이로 인해 타인에게 동액 상당 손해 주는 것 [98다2389] → 건물에서 영업 안 했어도 실질이익 O, 부당이득 O", "부당이득"],
  ["115.⑤", "채무자가 횡령한 금전으로 자신의 채권자에 대한 채무를 변제하는 경우, 채권자가 그 변제를 수령함에 있어 악의 또는 중대한 과실이 있다면 채권자의 금전 취득은 피해자에 대한 관계에 있어서 법률상 원인을 결여한 것으로 된다.", true, "▸ 채무자가 피해자로부터 횡령한 금전으로 채권자에게 변제한 경우 → 피해자의 손실과 채권자 이득 사이 인과관계 있음은 명백 → 채권자가 변제를 수령함에 있어 횡령사실에 악의·중과실 있다면 채권자 금전 취득이 피해자에 대한 관계에서 법률상 원인 결여, 단순히 경과실이면 변제 유효하고 법률상 원인 결여 × [2003다8862]", "부당이득"],
  ["SS14.①", "이해관계 없는 제3자의 변제가 채무자의 의사에 반하여 무효라면, 원칙적으로 제3자는 채권자에게 부당이득반환을 청구할 수 있다. 그러나 이 변제를 유효하다고 믿었고 그렇게 믿은 데 과실이 없는 채권자가 원채무자가 제공한 담보물을 반환함으로써 원채무자에 대한 채권행사가 사실상 불가능하게 되었다면, 제3자는 채권자에게 부당이득반환을 청구할 수 없다.", true, "제745조(타인의 채무의 변제) ① 채무자 아닌 자가 착오로 인하여 타인의 채무를 변제한 경우에 채권자가 선의로 증서를 훼멸하거나 담보를 포기하거나 시효로 인하여 그 채권을 잃은 때에는 변제자는 그 반환을 청구하지 못한다.", "부당이득"],
  ["SS14.②", "임차인이 임대인의 동의를 받지 않고 제3자에게 임차권을 전대하여 임차목적물을 사용·수익하게 하였다는 이유로 임대차계약이 적법하게 해지되었다면, 소유자인 임대인은 여전히 그 목적물을 사용·수익하는 전차인에 대해 부당이득반환청구를 할 수 있다.", true, "▸ 무단전대의 경우 임대인이 해지하거나 임대차 적법 종료하지 않는 한 임대차계약이 존속하는 한도 내에서는 제3자에게 불법점유 이유로 차임 상당 손해배상청구 ×, 부당이득반환 × ∵ 여전히 임차인에 대해 차임청구권 보유하므로 [2006다10323]\n그러나 임대차계약 종료 이후에는 임차물 소유자인 임대인은 제3자에 대해 차임 상당 손해배상청구 O, 부당이득반환청구 O [2022다296165]", "부당이득"],
  ["SS14.③", "근저당권부 채권의 질권자 A에게 근저당목적물인 부동산에 대한 경매절차에서 배당이 이루어졌는데, 근저당권자 B의 근저당권 피담보채무자 C에 대한 채권이 100만 원임에도 불구하고, 150만 원으로 잘못 알고 A에게 150만 원이 배당되었다면(A의 질권설정자 겸 근저당권자 B에 대한 채권은 200만 원), 초과 배당된 50만 원에 관하여 A가 아니라 B가 이를 정당하게 배당받을 권리가 있는 배당채권자에게 부당이득으로 반환해야 한다.", true, "▸ 부당한 배당에 대한 부당이득반환의무 부담하는 자는 실체법적으로 법률상 원인없이 이득 얻은 사람을 의미, 경매절차에서 현실적으로 배당금을 수령한 사람과 언제나 일치하여야 하는 것은 ×\n질권설정자의 채무자에 대한 근저당권부채권 범위 초과하여, 질권자의 질권설정자에 대한 피담보채권 범위 내에서, 질권자에게 배당금이 직접 지급됨으로써 질권자가 피담보채권의 만족 얻으면 실체법상 배당으로 법률상 원인 없는 이득 얻은 자는 질권자 ×, 질권설정자 O ∵ 질권자는 실체법적 법률상 원인에 기해 배당금 수령, 질권설정자는 근저당권부채권이라는 법률상 원인 범위 초과하여 질권자에게 배당금 지급되게 함으로써 자신의 질권자에 대한 피담보채무 소멸하는 이익 O [2023다315155]", "부당이득"],
  ["SS14.⑤", "양도담보 목적물인 동산이 타인의 토지 위에 무단으로 설치된 경우, 토지소유자에 대한 부당이득반환의무는 특별한 사정이 없는 한 양도담보권자가 아니라 양도담보설정자가 부담한다.", true, "▸ 양도담보 설정자가 채권 담보 위하여 그 소유 동산을 채권자에게 양도한 경우, 반대 특약이 없는 한 양도담보 설정자가 동산의 사용·수익권 O → 양도담보 동산이 특정 토지 위에 설치되어 토지 점유·사용이 문제된 경우 원칙적으로 양도담보설정자가 토지를 점유·사용하여 부당이득 한 것 O [2018다201429]", "부당이득"],
  ["116.③", "채무자가 편취한 금전으로 채무를 변제한 경우에 채권자가 그 금전이 편취된 것을 알았거나 중대한 과실로 알지 못하였다면 피해자는 채권자에게 부당이득의 반환을 청구할 수 있다.", true, "▸ 채무자가 피해자로부터 편취한 금전으로 채권자에게 변제한 경우 채권자가 변제 수령함에 있어 편취사실에 악의·중과실 있다면 채권자 금전 취득이 피해자에 대한 관계에서 법률상 원인 결여되어 부당이득반환해야 [2006다53733]", "부당이득"],
  ["116.⑤", "취득시효가 완성되었지만 점유자가 아직 소유권이전등기를 마치지 않았다면 소유자는 점유자에게 무단사용으로 인한 부당이득의 반환을 청구할 수 있다.", false, "▸ 부동산 취득시효 완성되면 점유자가 소유권이전등기 경료 아니하여 아직 소유권 취득 못했더라도 소유명의자는 점유자에 대해 점유 부당이득반환청구 × ∵ 점유자는 소유명의자에 대해 취득시효완성 원인 소이등을 청구할 수 있고 소유명의자는 이에 응할 의무 있으므로 [92다51280]", "부당이득"],
  ["117.ㄱ", "X 건물에 관하여 甲과 乙이 각 1/2 지분으로 공유하고 있는데, 乙이 甲과 협의 없이 위 건물을 단독으로 점유하고 있던 중, 甲의 동의 없이 丙에게 위 건물의 개량을 위한 구조변경공사를 2억 원에 도급하였다. 丙은 약정기한인 2023. 3. 10. 위 공사를 완료하였으나 乙로부터 공사대금을 지급받지 못하자 X 건물을 현재까지 점유하고 있다. 위 공사로 인하여 X 건물의 가치는 1억 원 상당 증가하여 현재에 이르고 있다.§丙은 甲에게 도급계약에 따른 공사대금을 청구할 수 없다.", true, "▸ 지문 전체 종합 해설 :\n타인 소유 or 공유물 도급에서 계약당사자 아닌 소유자(공유자)에 대한 금전지급청구:\n① 공사대금청구 × ∵ 계약당사자 ×\n(266조 공유물부담 규정 청구 × ∵ 266조는 내부관계 [90다20220])\n② 유익비상환청구 × ∵ 수급인은 비용지출자 × [99다66564]\n③ 부당이득반환청구 × ∵ 전용물소권 부정 [99다66564]\n④ 사무관리 비용상환청구 × ∵ '의무 없이' × [2012다43539]\n⑤ 유치권으로 인도거절 O ∵ 도급인에 대한 대금채권을 피담보채권으로", "부당이득"],
  ["117.ㄴ", "X 건물에 관하여 甲과 乙이 각 1/2 지분으로 공유하고 있는데, 乙이 甲과 협의 없이 위 건물을 단독으로 점유하고 있던 중, 甲의 동의 없이 丙에게 위 건물의 개량을 위한 구조변경공사를 2억 원에 도급하였다.§丙은 甲에게 사무관리에 따른 비용상환을 청구할 수 있다.", false, "▸ 위 ㄱ 지문 해설 참조\n[AI해설] 수급인 丙은 乙의 의뢰에 의해 공사를 진행한 것으로 '의무 없이' 타인 사무를 관리한 것이 아니므로, 사무관리가 성립하지 않아 甲에게 비용상환 청구 × [2012다43539]", "부당이득"],
  ["117.ㄷ", "X 건물에 관하여 甲과 乙이 각 1/2 지분으로 공유하고 있는데, 乙이 甲과 협의 없이 위 건물을 단독으로 점유하고 있던 중, 甲의 동의 없이 丙에게 위 건물의 개량을 위한 구조변경공사를 2억 원에 도급하였다.§丙은 甲에게 민법 제203조에 따른 X 건물의 가치 증가분 중 甲의 지분에 상당한 유익비상환을 청구할 수 있다.", false, "▸ 위 ㄱ 지문 해설 참조\n[AI해설] 수급인 丙은 점유자에 해당하지 않고(乙로부터 의뢰받은 시공자), 203조 유익비상환청구는 점유자가 점유물에 지출한 비용을 소유자에게 청구하는 것이므로, 丙은 甲에게 203조 유익비상환 청구 ×", "부당이득"],
  ["117.ㄹ", "X 건물에 관하여 甲과 乙이 각 1/2 지분으로 공유하고 있는데, 乙이 甲과 협의 없이 위 건물을 단독으로 점유하고 있던 중, 甲의 동의 없이 丙에게 위 건물의 개량을 위한 구조변경공사를 2억 원에 도급하였다.§丙은 甲에게 부당이득반환을 청구할 수 없다.", true, "▸ 위 ㄱ 지문 해설 참조", "부당이득"],
  ["기타03", "선의의 점유자는 점유물의 과실을 취득하므로, 비록 법률상 원인 없이 타인의 토지를 점유사용하고 이로 말미암아 그에게 손해를 입혔다 하더라도 그 점유사용으로 인한 이득을 그 타인에게 반환할 의무는 없다.", true, "▸ 건물의 사용이익은 건물의 과실에 준하고, 201조 1항은 선의 점유자의 과실수취권을 인정하므로, 선의의 점유자는 비록 법률상 원인 없이 타인의 건물을 점유·사용하여 손해를 입혔더라도 점유·사용이득 반환의무 × [67다2272]", "부당이득"],
  // 일반불법행위,
  ["118.ㄱ", "의사가 수술 등에 대한 환자의 승낙을 얻기 위한 설명의무는 그 의료행위에 따르는 후유증이나 부작용 등의 위험 발생 가능성이 희소하다는 사정만으로 면제될 수 없으며, 그 후유증이나 부작용이 당해 치료행위에 전형적으로 발생하는 위험이거나 회복할 수 없는 중대한 것인 경우에는 그 발생 가능성의 희소성에도 불구하고 설명의 대상이 된다.", true, "▸ 의사가 수술 등에 환자의 승낙을 얻기 위한 설명의무는 의료행위에 따르는 후유증·부작용 등 위험발생 가능성이 희소하다는 사정만으로 면제될 수 ×, 당해 치료행위에 전형적 발생하는 위험이거나 회복할 수 없는 중대한 것이라면 발생가능성 희소성에 불구하고 설명 대상 O → 의사 설명의무 위반한 수술 등으로 환자 사망 등 중대한 결과 발생한 경우, 환자 측이 자기결정권 행사할 수 없게 된 것에 위자료만이 아닌 전 손해의 배상 구하려면, 설명의무 위반이 구체적 치료과정에서 요구되는 의사의 주의의무 위반과 동일시할 정도이고 그 위반행위와 사망 사이에 인과관계가 입증되어야 [95다56095]", "일반불법행위"],
  ["118.ㄴ", "의사의 설명의무 위반에 대한 증명책임은 특별한 사정이 없는 한 환자 측에 있다.", false, "▸ 위 지문 ㄱ. 해설 참조\n[AI해설] 설명의무 위반에 대한 증명책임은 의사(가해자) 측에 있다 — '환자 측에 있다'는 지문은 틀렸다.", "일반불법행위"],
  ["118.ㄷ", "의사의 설명의무는 의료행위가 행해질 때까지 적절한 시간적 여유를 두고 이행되어야 한다.", true, "▸ 의사의 설명의무는 의료행위 행해질 때까지 적절한 시간적 여유 두고 이행되어야 → 의사가 환자의 의사결정에 충분한 시간 주지 않고 설명한 다음 곧바로 의료행위 나아가면 환자의 선택할 기회 침해 O ∵ 환자가 의료행위 응할지 합리적 결정하려면 의료행위의 필요성·위험성 등을 환자 스스로 숙고하고 필요하면 가족 등과 상의하고 결정할 시간적 여유 주어져야 [2021다265010]", "일반불법행위"],
  ["118.ㄹ", "환자가 미성년자로 의사결정능력이 있다 하더라도 자신의 신체에 위험을 가하는 의료행위에 관한 자기결정권까지 가진다고 보기는 어려우므로 원칙적으로 의사는 미성년자인 환자에 대해서는 의료행위에 관하여 설명할 의무를 부담하지 아니한다.", false, "▸ 환자가 미성년자라도 의사결정능력 있는 이상 자신 신체에 위험 가하는 의료행위에 자기결정권 O, 의사는 미성년자 환자에 설명의무 부담 O → 그러나 의사가 미성년자 환자의 친권자·법정대리인에게 의료행위 설명했다면 그를 통해 전달됨으로써 미성년자 환자에 설명의무 이행 O → 다만 친권자 등에게 설명해도 전달되지 않아 의료행위 결정·시행에 미성년자 의사 배제될 것 명백하거나 미성년 환자가 의료행위에 적극적 거부의사 보이는 등 특별한 사정 있다면 친권자 등에 대한 설명만으로 설명의무 ×, 미성년자 환자에게 직접 설명해야 [2020다218925]", "일반불법행위"],
  ["119.①", "甲이 위법하게 乙의 점유를 침탈하여 乙의 유치권이 소멸한 경우, 乙이 甲에게 불법행위로 인한 손해배상 청구를 하려면 점유를 침탈당한 날부터 1년 이내에 손해배상을 구하는 소를 제기해야 한다.", false, "▸ 204조 3항의 제척기간 1년은 출소기간 → 본권 침해로 인한 손해배상청구권 행사에는 적용 × → 점유 침탈로 유치권 소멸당한 자의 손해배상청구권은 침탈당한 날부터 1년 내에 행사할 필요 × [2021다213866]", "일반불법행위"],
  ["119.②", "일반 공중의 통행에 공용된 도로의 소유자 아닌 甲이 乙의 통행을 방해하여 불법행위가 성립한 경우, 乙은 甲에게 손해배상 청구를 할 수 있으나 장래에 생길 방해를 예방하기 위하여 통행방해 행위 금지를 청구할 수는 없다.", false, "▸ 불특정 다수인 일반 공중 통행에 공용된 도로, 즉 '공로'를 통행하려는 자는 그 도로에 관해 다른 사람 권리 등 침해하는 등 특별한 사정 없는 한, 일상생활상 필요한 범위 내에서 다른 사람들과 같은 방법으로 도로 통행할 자유 O → 제3자가 특정인에 대하여만 도로 통행 방해함으로써 일상생활 지장 받게 하여 통행의 자유 침해하면 민법상 불법행위 O → 침해받은 자는 방해배제나 장래 방해예방 위해 통행방해행위금지 소구 O [2020다229239]", "일반불법행위"],
  ["119.③", "근로자의 불법행위로 인해 사용자의 근로자에 대한 손해배상채권이 발생한 상태에서 영업양도에 수반하는 근로계약의 인수가 이루어지고 위 근로자도 이에 대해 동의하더라도 불법행위로 인한 손해배상채권을 인수 대상에 포함하기로 하는 특약이 없는 한 이 채권은 영업양수인에게 이전되지 않는다.", false, "▸ 계약인수는 계약당사자 지위 승계, 계약에서 생기는 채권, 채무, 해제권 등 포괄적 권리의무 양도, 양도인은 계약관계 탈퇴, 특별한 사정 없는 한 잔류당사자와 양도인 사이 계약관계 ×, 채권채무 소멸 → 계약인수는 당사자 3인 관여 있어야 효력 발생(통상 양도인·양수인·잔류당사자 합의 삼면계약, 2인 합의가 선행하면 나머지 동의·승낙 있어야 효력 발생), 개별 채권양도는 양도인·양수인 2인 관여로 효력 발생 → 채권양도에서 채무자 보호 대항요건은 계약인수에서는 별도 요구 × → 상법상 영업양도 수반 계약인수도 마찬가지\n甲주식회사·乙주식회사 사이 영업양도계약 체결하며 근로자(丙 등)에 대한 사용자의 모든 권리의무 이전, 丙도 乙회사와 동일조건 근로계약(종전 근로기간 소급 작성) → 영업양도 전 丙이 甲회사 업무 관련 고객 돈 횡령한 경우, 甲회사의 丙에 대한 손해배상채권도 乙회사가 승계취득 O ∵ 잔류당사자 丙이 영업양도 인식하고 근로계약 인수 승낙, 인수인 乙회사에 사용자 지위뿐 아니라 근로계약 기초로 이미 발생한 손해배상채권도 이전, 대항요건 불필요 [2020다245958]", "일반불법행위"],
  ["119.⑤", "책임능력 있는 미성년 자녀가 제3자에게 불법행위 책임을 지게 된 경우, 그 부모 중 비양육자의 면접교섭권에 관한 규정은 제3자와의 관계에서 손해배상책임의 근거가 되는 감독의무를 부과하는 규정이라고 할 수 없다.", true, "▸ 이혼으로 부모 중 1명이 친권자 및 양육자로 지정된 경우, 비양육친에게는 자녀에 대한 친권·양육권이 없어 자녀 보호·교양에 관한 913조 등 친권에 관한 규정 적용 × → 비양육친의 자녀와의 면접교섭권(837조의2 제1항)은 자녀 복리 실현 목적일 뿐 제3자와의 관계에서 손해배상책임의 근거인 감독의무 부과 규정 ×, 면접교섭권만으로 비양육친이 일반적·일상적 자녀 지도·조언하는 등 보호·감독할 의무 × [2020다240021]", "일반불법행위"],
  ["120.③", "금전을 대여한 채권자가 고의 또는 과실로「이자제한법」을 위반하여 최고이자율을 초과하는 이자를 받아 채무자에게 손해를 입힌 경우, 특별한 사정이 없는 한 불법행위가 성립한다.", true, "▸ 금전 대여한 채권자가 고의·과실로 이자제한법 위반하여 최고이자율 초과 이자를 받아 채무자에게 손해 입힌 경우, 특별한 사정 없는 한 750조 불법행위 O → 초과 지급 이자는 원본 충당되고(이자제한법 2조 4항), 원본 소멸하고도 남은 초과 지급액이 손해 → 부당이득반환청구권과 불법행위로 인한 손해배상청구권은 서로 별개 청구권 → 이때 채권자와 공동으로 혹은 가담하여 이자제한법 위반행위 한 자는 760조 O [2020다230239]", "일반불법행위"],
  ["121.①", "사용자가 피용자와 제3자의 책임비율에 의하여 정해진 피용자의 부담부분을 초과하여 피해자에게 손해를 배상한 경우, 사용자는 제3자에 대하여도 구상권을 행사할 수 있으나 그 구상의 범위는 제3자의 부담부분에 국한된다.", true, "▸ 피용자와 제3자가 공동불법행위로 피해자에게 손해를 가한 경우 피용자와 제3자는 공동불법행위자로서 부진정연대관계 → 사용자의 손해배상책임은 피용자의 배상책임에 대한 대체적 책임이어서 사용자도 제3자와 부진정연대관계 → 사용자가 피용자와 제3자의 책임비율에서 피용자 부담부분 초과하여 피해자에게 배상했다면 사용자는 제3자에 대해 제3자의 부담부분에 한하여 구상권 행사 O [91다33070]", "일반불법행위"],
  ["SS15.ㄱ", "「건축법」등 관계 법령에 일조방해에 관한 직접적인 단속법규가 있다면 그 법규에 적합한지가 사법상 위법성을 판단함에 있어서 중요한 판단자료이나, 이러한 공법적 규제에 의하여 확보하고자 하는 일조는 원래 사법상 보호되는 일조권을 공법적인 면에서도 가능한 한 보장하려는 것으로서 특별한 사정이 없는 한 일조권 보호를 위한 최소한도의 기준이므로, 건물 신축이 건축 당시의 공법적 규제에 형식적으로 적합하더라도 현실적인 일조방해의 정도가 현저하게 커서 사회통념상 수인한도를 넘는 경우에는 위법행위로 평가될 수 있다.", true, "▸ [98다56997]\n[AI해설] 건축법령의 일조 기준은 최소한도이므로, 공법 기준에 적합해도 수인한도를 넘는 현실적 일조방해가 있으면 위법행위로 평가될 수 있다.", "일반불법행위"],
  ["SS15.ㄴ", "철도소음·진동을 규제하는 행정법규에서 정하는 기준을 넘는 철도소음·진동이 있다고 하여 바로 사회통념상 일반적으로 참아야 할 정도를 넘는 위법한 침해행위가 있어 민사책임이 성립한다고 단정할 수는 없다.", true, "▸ [2015다23321] → 열차 소음으로 부근의 한우들 유·사산 피해 발생한 사안", "일반불법행위"],
  ["SS15.ㄷ", "도로소음으로 인한 생활방해를 원인으로 제기된 사건에서 공동주택에 거주하는 사람들이 참을 한도를 넘는 생활방해를 받고 있는지는 특별한 사정이 없는 한 일상생활이 실제 이루어지는 장소인 거실에서 도로 등 소음원에 면한 방향의 모든 창호를 개방한 상태로 측정한 소음도가「환경정책기본법」상 소음환경기준 등을 초과하는지에 따라 판단하는 것이 타당하다.", true, "▸ [2014다57846]\n[AI해설] 공동주택 거주자의 도로소음 수인한도 초과 여부는 거실에서 소음원 방향 창호 개방 상태로 측정한 소음도가 환경정책기본법상 소음환경기준을 초과하는지로 판단한다.", "일반불법행위"],
  ["SS15.ㄹ", "기존 건물의 건립으로 인하여 피해건물에 발생한 일조방해의 정도가 수인한도를 넘지 않고 있었는데 그로부터 상당한 기간이 경과한 후 타인 소유의 인접건물이 신축되고 그 기존 건물과 인접건물로 인하여 생긴 일영(日影)이 결합하여 비로소 피해건물에 수인한도를 넘는 일조방해가 발생한 때에는, 피해자는 원칙적으로 기존 건물의 소유자를 상대로 불법행위책임을 물을 수 없다.", true, "▸ [2008다23729]\n[AI해설] 기존 건물의 일조방해가 수인한도 미만이었다가 새 인접건물과 결합하여 처음으로 수인한도를 넘게 된 경우, 기존 건물 소유자는 불법행위책임을 지지 않는다.", "일반불법행위"],
  ["SS15.ㅁ", "위법한 일조방해로 직사광선이 차단되는 등 생활환경이 악화됨으로써 피해 건물의 거주자가 입게 되는 정신적 손해 관련 위자료 청구권의 소멸시효는, 가해자가 일조방해에 따른 불법행위책임으로 가해건물 철거의무를 지지 않더라도, 가해 건물이 피해 부동산의 일조를 방해하는 상태로 존속하는 한, 날마다 개별적으로 진행한다.", false, "▸ 위법한 건축행위로 건물 준공되거나 외부골조공사 완료된 때부터 일조방해행위로 인한 손해배상청구권 소멸시효 진행 O → 다만 지극히 예외적으로, 철거의무 부과할 정도라면, 철거의무 계속적으로 이행하지 않는 부작위는 새로운 불법행위로서 날마다 새로운 불법행위 발생하므로 피해자가 각 손해 안 때부터 각별로 소멸시효 진행 O [2006다35865]", "일반불법행위"],
  ["SS16.ㄱ", "A가 운전하는 자동차에 B가 호의동승하던 중 C가 운전하던 자동차와 접촉사고가 발생한 경우.§A가 현저하게 난폭운전을 하거나 그 밖의 사유로 인하여 사고 발생의 위험성이 상당한 정도로 우려된다는 점을 B가 인식할 수 있었다는 등의 특별한 사정이 없는 한 B가 A에게 안전운전을 촉구할 주의의무를 부담하지는 않는다.", true, "▸ [94다15332]\n[AI해설] 동승자는 특별한 사정 없는 한 운전자에게 안전운전을 촉구할 주의의무를 부담하지 않는다.", "일반불법행위"],
  ["SS16.ㄴ", "A가 운전하는 자동차에 B가 호의동승하던 중 C가 운전하던 자동차와 접촉사고가 발생한 경우.§A, B가 호의동승관계에 있다면 A는「자동차손해배상 보장법」상 운행자에 해당하지 않고, B는 이 법에 따라 손해배상청구를 할 수 있는 타인에 해당하지 않는다.", false, "▸ 피해자가 사고자동차에 호의동승한 것만으로는 자배법상 타인이 아니라고 할 수 없고, 사고에 있어 어떤 과실 있었다고 할 수 × [90다13710]", "일반불법행위"],
  ["SS16.ㄷ", "A가 운전하는 자동차에 B가 호의동승하던 중 C가 운전하던 자동차와 접촉사고가 발생한 경우.§A의 운행목적, A와 B의 인적관계, 동승한 경위, 동승을 요구한 목적과 적극성 등을 고려하여 A에게 일반 교통사고와 동일한 책임을 지우는 것이 신의칙이나 형평의 원칙에 비추어 매우 불합리한 경우 B에 대한 배상액을 감경할 수 있다.", true, "▸ 차량 운행자로서 아무 대가 없이 오직 동승자의 편의·이익 위해 동승 제공하고 동승자로서도 자신의 편의·이익 위해 제공받은 경우 → 운행 목적, 동승자·운행자의 인적관계, 동승한 경위 등 제반사정에 비추어 가해자에게 일반 교통사고와 같은 책임 지우는 것이 신의칙이나 형평 원칙에 비추어 매우 불합리한 것으로 인정되는 경우에는 배상액 감경 사유 O [87다카1090]", "일반불법행위"],
  ["SS16.ㄹ", "A가 운전하는 자동차에 B가 호의동승하던 중 C가 운전하던 자동차와 접촉사고가 발생한 경우.§B가 A와 C를 공동피고로 하여 손해배상청구의 소를 제기한 경우, A에 대한 관계에서 피해자 B에게 참작해야 할 과실이 있다면 A의 배상액만 과실상계를 이유로 감경되고 C의 배상액은 감경되지 않는다.", false, "▸ 피해자의 공동불법행위자들에 대한 과실비율 달라도 법원의 과실상계는 전원에 대한 과실로 전체적 평가해야 ∵ 공동불법행위는 '공동으로 가한' 불법행위에 대한 책임추궁 [96다55631]", "일반불법행위"],
  ["SS16.ㅁ", "A가 운전하는 자동차에 B가 호의동승하던 중 C가 운전하던 자동차와 접촉사고가 발생한 경우.§A에 대한 관계에서 B의 호의동승을 이유로 신의칙상 책임 제한을 하는 경우, C에 대한 관계에서도 이를 적용해야 한다.", true, "▸ 2인 이상의 공동불법행위로 호의동승자가 피해 입은 경우, 공동불법행위자 상호 간 내부관계의 부담 부분 있으나 피해자에 대한 관계에서는 부진정연대책임 지므로, 동승자 손해의 배상액을 산정할 때 먼저 호의동승으로 인한 감액 비율을 참작하여 공동불법행위자들이 동승자에 대하여 배상할 수액 결정 [2012다87263]", "일반불법행위"],
  ["122.①", "증권회사가 고객 소유의 주식을 위법하게 처분한 불법행위로 인하여 고객이 입게 된 손해의 액은 처분 당시의 주식의 시가를 기준으로 결정하여야 한다.", true, "▸ 재산상태 차이인 손해액은 원칙적으로 불법행위 시를 기준으로 산정해야 → 특정 주식의 가격상승에 관한 기망으로 매수하게 한 것이 불법행위에 해당할 경우도 마찬가지 → 매수 전후 정상적 거래대상이었고 기망 없었다면 매수하지 않았을 것이라 단정할 수 없다면, 불법행위로 인한 재산상 손해는 주식 매수대금에서 취득 당시 객관적 가액 상당을 공제한 차액 [2022다286335]", "일반불법행위"],
  ["122.②", "생명 또는 신체에 대한 불법행위로 인하여 입게 된 적극적 손해와 소극적 손해 및 정신적 손해는 서로 소송물을 달리하므로, 소송촉진 등에 관한 특례법 제3조 제2항에 따라 이행의무의 존부나 범위에 관하여 항쟁함이 상당한지 여부에 대해서는 각 손해별로 따로 판단해야 한다.", true, "▸ [민소] 소촉법 3조 제2항 '채무자가 이행의무 존부·범위 항쟁 타당' 여부는 생명·신체 불법행위로 입게 된 적극적 손해, 소극적 손해, 정신적 손해마다 따로 판단해야 ∵ 소송물이 서로 다르므로 [2022다200768]", "일반불법행위"],
  ["122.③", "생명침해의 불법행위로 인한 사망피해자 본인의 위자료 청구권과 민법 제752조에 의한 배우자 등 유족의 위자료 청구권은 별개이므로 소멸시효 완성 여부도 각각 그 권리를 행사한 때를 기준으로 판단하여야 한다.", true, "▸ 생명침해 불법행위로 인한 피해자 본인의 위자료 청구권과 제752조에 의한 배우자 등 유족 고유의 위자료 청구권은 별개로서 소멸시효 완성 여부도 각각 그 권리를 행사한 때를 기준으로 판단해야 [2013다200656]", "일반불법행위"],
  ["122.④", "불법행위로 인한 손해배상액의 산정에 있어 손익공제를 허용하기 위해서는 손해배상책임의 원인인 불법행위로 인하여 피해자가 새로운 이득을 얻었고, 그 이득과 불법행위 사이에 상당인과관계가 있어야 한다.", true, "▸ [2006다19603]\n[AI해설] 손익공제는 불법행위로 인해 피해자가 새로운 이득을 얻고 그 이득과 불법행위 사이에 상당인과관계가 있을 때 허용된다.", "일반불법행위"],
  ["122.⑤", "공동불법행위로 인한 손해배상책임의 범위는 피해자에 대한 관계에서 가해자들 전원의 행위를 전체적으로 함께 평가하여 정해야 하므로, 공동불법행위자 중 고의로 불법행위를 한 자가 있는 경우에는 과실로 불법행위를 한 다른 공동불법행위자 역시 과실상계를 주장할 수 없다.", false, "▸ 공동불법행위자 중 일부가 피해자 부주의를 이용하여 고의 불법행위 저지른 경우 그러한 사유가 없는 다른 불법행위자는 과실상계 주장 O [2005다32999]", "일반불법행위"],
  ["123.ㄱ", "甲이 丙 소유의 A 토지에 관하여 등기관계서류를 위조하여 원인무효의 소유권이전등기를 경료하고 다시 이를 다른 사람에게 매도하여 순차로 소유권이전등기가 경료된 후에 토지의 진정한 소유자 丙이 최종 매수인 乙을 상대로 말소등기청구소송을 제기하여 丙 승소의 판결이 확정된 경우, 甲의 불법행위로 인하여 乙이 입은 손해는 위 판결 확정 당시 A 토지의 시가 상당액이다.", false, "▸ 타인의 부동산에 불법 등기 경료한 자로부터 부동산 매수한 자가 그 후 진정한 권리자의 제소로 등기 말소된 경우 그가 불법행위로 인해 입은 손해는 원인무효 등기를 믿고 지급한 매매대금 O, 취득하지도 못한 소유권을 상실할 리 없으므로 소유권 상실 당시 시가 상당금 × [81다1006, 96다38971]", "일반불법행위"],
  ["123.ㄴ", "甲이 자기 소유인 B 아파트를 乙에게 매도하고 매매대금을 전부 지급받은 후 乙의 승낙 없이 임의로 B 아파트에 관하여 제3자에게 근저당권설정등기를 경료하였다면, 특별한 사정이 없는 한 乙은 甲의 불법행위로 인하여 그 피담보채무 상당의 손해를 입었다고 할 수는 있으나 곧바로 매매대금 상당액의 손해를 입었다고 할 수는 없다.", true, "▸ [97다4760]\n[AI해설] 매도인이 소유권이전 후 승낙 없이 근저당권설정등기를 경료한 경우, 매수인의 손해는 피담보채무 상당액이지 곧바로 매매대금 전액이 아니다.", "일반불법행위"],
  ["123.ㄷ", "甲 회사가 인터넷 사이트를 이용한 광고시스템 프로그램을 인터넷 사용자들에게 제공하여 이를 설치한 인터넷 사용자들이 乙 회사가 운영하는 인터넷 포털사이트를 방문하면 그 화면에 乙 회사가 제공하는 광고 대신 甲 회사의 광고가 대체 또는 삽입된 형태로 나타나게 한 경우, 그러한 甲 회사의 행위는 부정한 경쟁행위로서 민법상 불법행위에 해당될 수 있다.", true, "▸ [2008마1541]\n[AI해설] 경쟁자 사이트 방문 시 자신의 광고로 대체·삽입되도록 하는 행위는 부정한 경쟁행위로서 불법행위에 해당할 수 있다.", "일반불법행위"],
  ["123.ㄹ", "甲이 일반인들의 통행에 제공되어 온 도로에 토지관리소를 축조하고 개폐식 차단기를 설치한 다음 자동차 운전자들에게 행선지 및 방문목적 등을 확인한 후 차단기를 열어 통행할 수 있게 하면서 乙을 포함하는 특정인들이 운행하는 자동차에 대하여 통행을 금지한 경우, 乙은 甲의 행위가 민법상 불법행위에 해당함을 이유로 甲을 상대로 통행방해 행위의 금지를 소구할 수 있다.", true, "▸ 불특정 다수인 일반 공중 통행에 공용된 도로, 즉 '공로'를 통행하려는 자는 그 도로에 관해 다른 사람 권리 등 침해하는 등 특별한 사정 없는 한, 일상생활상 필요한 범위 내에서 다른 사람들과 같은 방법으로 도로 통행할 자유 O → 제3자가 특정인에 대하여만 도로 통행 방해함으로써 일상생활 지장 받게 하여 통행의 자유 침해하면 민법상 불법행위 O → 침해받은 자는 방해배제나 장래 방해예방 위해 통행방해행위금지 소구 O [2020다229239]", "일반불법행위"],
  ["124.①", "유효한 고용관계는 없지만 사실상 어떤 사람이 다른 사람을 위하여 그 지휘·감독 아래 그 의사에 따라 사업을 집행하는 관계에 있을 때에도 사용자책임이 성립하기 위한 사용자와 피용자의 관계가 인정될 수 있다.", true, "▸ 사용자책임에서 사용관계는 유효성 불문함", "일반불법행위"],
  ["124.②", "불법행위 당시 기간을 정한 계약에 따라 근무하고 있는 피해자의 일실수익 중 그 계약기간 이후의 것에 대하여는 특별한 사정이 없는 한 일용노동임금을 기초로 산정하여야 한다.", false, "▸ 피해자가 근무하던 회사가 사고 후 폐업 → 피해자의 사망 때문에 회사가 도산되었다는 등 특별한 사정 없는 한, 피해자가 폐업 이후 정년시까지 계속 근무할 수 있는 것을 전제로 일실수입 산정하면 × → 피해자의 연령·경력·전업가능성 등에 비추어 장차 피해자가 종사 가능해 보이는 직업과 그 소득을 조사 심리해야 → 폐업 이후 일실수입을 단순히 일반노동임금으로 × [97다5367]", "일반불법행위"],
  ["125.①", "불법행위의 성립요건으로서 위법성은 문제가 되는 행위마다 개별적·상대적으로 판단하는 것이 아니고, 관련 행위 전체를 일체로 보아 판단하여 결정해야 한다.", false, "▸ 750조의 '위법행위'는 법률 위반 한정되지 않고 전체 법질서 관점에서 사회통념 상 위법도 포함 O → 관련 행위 전체보다 문제된 행위마다 개별적·상대적으로 판단해야 → 소유권 비롯한 절대권 침해뿐 아니라 법률상 보호가치 있는 이익 침해도 포함 O [2019다268061]", "일반불법행위"],
  ["125.②", "부당한 보전처분으로 인한 손해배상책임이 성립하기 위해서는 일반적인 불법행위의 성립에 있어서 필요한 고의 또는 과실 이외에 오로지 채무자에게 고통을 주려고 보전처분을 하였다는 점까지 필요한 것은 아니다.", true, "▸ 가압류·가처분 집행 후에 본안소송 패소한 경우 보전처분 집행으로 인하여 채무자가 입은 손해에 대하여는 집행채권자의 고의·과실 추정 O [92다8453]", "일반불법행위"],
  ["125.③", "태양반사광으로 인하여 생활방해가 발생하는지를 판단하는 때에는 건물이 위치한 지역의「국토의 계획 및 이용에 관한 법률」상 용도뿐만 아니라 태양반사광 침해를 일으키고 있는 건물이 존재하는 해당 지역의 구체적인 이용 현황도 고려하여야 한다.", true, "▸ [2016다33202]\n[AI해설] 태양반사광에 의한 생활방해 판단 시 해당 지역의 법정 용도뿐만 아니라 구체적 이용 현황도 고려해야 한다.", "일반불법행위"],
  ["125.④", "법정대위를 할 자는, 채권자가 고의나 과실로 담보를 상실하게 하거나 감소하게 한 때에 원칙적으로 민법 제485조에 따라 면책을 주장할 수 있을 뿐이지만, 채권자가 제3자에 대하여 자신의 담보권을 성실하게 보존·행사하여야 할 의무를 부담하는 특별한 사정이 인정되는 경우에는 채권자의 담보권의 포기 행위가 불법행위에 해당할 수 있다.", true, "▸ 채권·담보권의 불행사·포기가 485조 면책이 적용되는 것은 별론으로 해도 불법행위는 아니지만, 채권자가 제3자에 대해 담보권 성실 보존·행사 의무 부담하는 특별한 사정 있다면 담보권 포기 행위가 예외적 불법행위 O\n물상보증인 甲, 채무자 乙, 그 공유토지에 공동근저당권자 丙 → 甲 지분 먼저 경매개시되어 경락인 완납 → 丙이 乙 지분의 근저당권등기 말소해준 → 위 경매 배당절차에서 丙의 신고채권액 전부 배당받는 배당표 작성 → 丙은 甲에 대해 자신의 담보권 성실 보존·행사할 의무 부담함에도 곧 변제자대위 대상이 될 채무자 지분의 근저당권설정등기 말소해준 저당권 포기행위는 750조 불법행위 O ∵ 변제자대위로 취득한 권리 침해에 준함, 丙에게 배당 이뤄지면 물상보증인 甲은 481조·482조 변제자대위 할 수 있는 정당한 기대 [2017다261882]", "일반불법행위"],
  // 특수불법행위,
  ["126.①", "피용자의 가해행위가 사용자의 사업과 시간적·장소적으로 근접하고 가해행위의 동기가 업무처리와 관련되어 있다면 사무집행관련성이 인정된다.", true, "▸ 피용자가 고의로 타인에게 가해행위(호텔 종업원의 손님 상해행위)를 한 경우, 행위가 피용자 사무집행 자체는 아니더라도 사용자 사업과 시간적·장소적 근접하고, 피용자 사무의 전부·일부 수행과정에서 이뤄지거나 가해행위의 동기가 업무처리와 관련되면 외형적·객관적으로 사무집행 관련성 O [99다47297]", "특수불법행위"],
  ["126.③", "사용자가 손해를 배상한 경우에 사용자의 피용자에 대한 구상권의 범위는 신의칙상 상당하다고 인정되는 범위로 제한된다.", true, "▸ 피용자의 업무집행으로 행한 불법행위로 인해 사용자가 직접 손해 입거나 사용자책임 부담한 결과로 손해 입은 경우, 사용자는 공평 분담 견지에서 신의칙 상 상당한 한도 내에서만 피용자에 대해 구상권 행사 → 사업의 성격·규모, 사업시설 상황, 피용자 업무내용·근로조건·근무태도, 가해행위 상황 등 제반사정 고려 [86다카1045]", "특수불법행위"],
  ["127.③", "피용자의 제3자에 대한 불법행위가 고의의 영득행위라면, 설사 그 제3자에게 부주의가 있었다 하더라도 사용자는 과실상계를 주장할 수 없다.", false, "▸ 피용자의 고의 영득행위라도 피해자(제3자)에게 손해발생·확대에 관한 과실 있으면 사용자는 과실상계 주장 O [2004다13083]\n[AI해설] 사용자책임에서의 과실상계는 피용자의 고의 여부와 무관하게 피해자의 과실이 있으면 허용된다.", "특수불법행위"],
  ["127.⑤", "피용자가 제3자와 공동으로(과실 비율 5:5) 피해자에게 손해를 가하고 사용자가 그 피해자에게 손해 전부를 배상하였다면 사용자는 위 제3자에 대하여 자신이 피해자에게 지급한 배상액 전부를 구상할 수 있다.", false, "▸ 피용자와 제3자가 공동불법행위로 피해자에게 손해를 가한 경우 피용자와 제3자는 공동불법행위자로서 부진정연대관계 → 사용자의 손해배상책임은 피용자의 배상책임에 대한 대체적 책임이어서 사용자도 제3자와 부진정연대관계 → 사용자가 피용자와 제3자의 책임비율에서 피용자 부담부분 초과하여 피해자에게 배상했다면 사용자는 제3자에 대해 제3자의 부담부분에 한하여 구상권 행사 O [91다33070]", "특수불법행위"],
  ["128.②", "피용자의 사무가 외형상 객관적으로 사무집행에 해당하는 경우에도 사무집행에 관한 것이 아님을 피해자가 알았거나 알 수 있었을 경우에는 사용자책임이 부정된다.", false, "▸ 피용자의 불법행위가 사용자의 사무집행행위에 해당되지 않음을 피해자 자신이 알았거나 또는 중대한 과실로 알지 못한 경우는 사용자책임 × [94다29850]", "특수불법행위"],
  ["129.ㄴ", "민법 제758조 제1항에 규정된 공작물의 설치 또는 보존의 하자는 공작물 자체가 통상 갖추어야 할 안전성을 결여한 상태를 의미하는 것으로서 하자의 존재에 관한 증명책임은 피해자에게 있다.", true, "▸ 공작물 설치·보존 하자의 존재의 증명책임은 피해자 → 일단 하자 인정된다면 손해발생이 천재지변 불가항력 의한 것으로서 위 하자 없었어도 불가피한 것인 점은 주장하는 점유자에게 증명책임 → 97.8mm 집중폭우 사실만으로 불가항력 × [82다카348]", "특수불법행위"],
  ["129.ㄷ", "교통사고로 인한 인적 사고의 경우에 자동차손해배상보장법상 손해배상책임이 인정되지 않는다면 민법상 불법행위책임도 인정될 수 없다.", false, "▸ 자동차사고 손해배상 사건에서 자배법이 민법에 우선 적용 → 자배법상 손해배상책임 인정되지 않는 경우 민법상 불법행위책임 O ∵ 자배법이 민법에 우선 적용이라 하여 피해자가 민법상 손해배상청구 못하는 것 아니므로 [2001다23201]", "특수불법행위"],
  ["129.ㄹ", "의사가 환자에게 설명의무를 다하지 아니한 채 환자의 승낙 없이 의료행위를 하더라도 의사에게 치료상 과실이 없다면 그 의료행위는 환자의 승낙권을 침해하는 위법한 행위가 되지 않는다.", false, "▸ 의사의 치료상 주의의무와 설명의무는 전혀 별개 문제([92다25885] 판결 참조)", "특수불법행위"],
  ["130.⑤", "공작물의 설치 또는 보존의 하자로 인하여 타인에게 손해를 가한 경우, 그 공작물의 점유가 대리점유 관계에 있을 때에는 직접점유자가 1차적인 배상책임을 지고, 직접점유자가 손해방지에 필요한 주의를 해태하지 아니한 때에 비로소 간접점유자에게 그 배상책임을 물을 수 있다.", true, "제758조(공작물등의 점유자, 소유자의 책임) ① 공작물의 설치 또는 보존의 하자로 인하여 타인에게 손해를 가한 때에는 공작물점유자가 손해를 배상할 책임이 있다. 그러나 점유자가 손해의 방지에 필요한 주의를 해태하지 아니한 때에는 그 소유자가 손해를 배상할 책임이 있다.", "특수불법행위"],
  ["131.②", "피해자가 공동불법행위자 중의 일부만을 상대로 손해배상을 청구하는 경우, 과실상계를 함에 있어 피해자에 대한 공동불법행위자 전원의 과실과 피해자의 공동불법행위자 전원에 대한 과실을 전체적으로 평가하여야 하고, 공동불법행위자 간의 과실의 경중이나 구상권행사의 가능 여부 등은 고려할 필요가 없다.", true, "▸ 피해자의 공동불법행위자들에 대한 과실비율 달라도 법원의 과실상계는 전원에 대한 과실로 전체적 평가해야 ∵ 공동불법행위는 '공동으로 가한' 불법행위에 대한 책임추궁 [96다55631]", "특수불법행위"],
  ["131.⑤", "공동불법행위자 중 1인의 손해배상채무가 시효로 소멸한 후에 다른 공동불법행위자 1인이 피해자에게 자기의 부담 부분을 넘는 손해를 배상하였을 경우, 그 공동불법행위자는 손해배상채무가 시효로 소멸한 다른 공동불법행위자에게 구상권을 행사할 수 있다.", true, "▸ 공동불법행위자 1인의 손해배상채무가 시효 소멸한 후 다른 공동불법행위자 1인이 피해자에게 자기 부담 부분 넘는 손해를 배상한 경우, 그는 다른 공동불법행위자에게 구상권 행사 O ∵ 공동불법행위자의 다른 공동불법행위자에 대한 구상권은 피해자의 다른 공동불법행위자에 대한 손해배상채권과 그 발생원인 및 성질을 달리하는 별개의 권리, 연대채무 소멸시효 절대적 효력 421조는 공동불법행위자 상호간 부진정연대채무에 적용 × [97다42830]", "특수불법행위"],
  ["SS17.ㄱ", "공동불법행위자 甲, 乙, 丙 중 甲이 피해자로부터 손해배상청구소송을 당하여 판결에 따라 손해배상금 전액을 지급함으로써 다른 공동불법행위자 乙, 丙이 공동면책된 경우.§乙이 甲의 구상금 청구에 대해 자신의 부담 부분을 초과하여 구상에 응하였고 그로 인하여 丙이 자신의 출연 없이 채무를 면하게 되는 경우, 乙은 丙의 부담 부분 내에서 자신의 부담 부분을 초과하여 변제한 금액에 관하여 丙에게 구상할 수 있다.", true, "▸ 분할채무 관계인 공동불법행위자들 중 1인이 자기 부담부분 초과하여 구상에 응했고 그로 인하여 다른 공동불법행위자가 출연 없이 채무 면하게 될 경우, 구상에 응한 공동불법행위자는 다른 공동불법행위자의 부담 부분 내에서 부담 부분을 초과하여 변제한 금액에 관하여 구상권 취득 O [2022다309474] → 다만 공동면책 시킨 다른 공동불법행위자로부터 구상금 청구 소송을 당하여 지출한 변호사보수는 나머지 공동불법행위자에 대해 구상 ×", "특수불법행위"],
  ["SS17.ㄴ", "공동불법행위자 甲, 乙, 丙 중 甲이 피해자로부터 손해배상청구소송을 당하여 판결에 따라 손해배상금 전액을 지급함으로써 다른 공동불법행위자 乙, 丙이 공동면책된 경우.§손해배상금을 지급한 甲은 자신의 부담 부분을 초과하여 공동 면책된 금액 중 乙, 丙의 과실비율에 상당하는 금액은 물론이고 그에 대한 공동 면책일 이후의 법정이자를 乙과 丙을 상대로 구상할 수 있다.", true, "▸ ㄴ, ㄷ 지문 해설 : 공동불법행위자 중 1인이 공동면책 시키고 면책 금액 중 다른 공동불법행위자 과실비율 상당 금액과 공동면책일 이후 법정이자 및 피할 수 없는 비용 기타 손해배상을 구상할 때, 피해자에게 지급한 소송비용상환액뿐 아니라 소송수행 과정에서 지출한 소송비용 및 합리적 범위 변호사보수도 포함 O [2022다309474]", "특수불법행위"],
  ["SS17.ㄷ", "공동불법행위자 甲, 乙, 丙 중 甲이 피해자로부터 손해배상청구소송을 당하여 판결에 따라 손해배상금 전액을 지급함으로써 다른 공동불법행위자 乙, 丙이 공동면책된 경우.§피해자의 손해배상청구소송에 대한 甲의 응소가 부당한 응소라는 등의 특별한 사정이 없는 한, 甲은 피해자에게 지급한 소송비용상환액뿐만 아니라 소송을 수행하는 과정에서 지출한 변호사보수 중에서 여러 가지 사정을 참작하여 합리적으로 판단하여 상당하다고 인정되는 범위 내의 금원을 乙, 丙에게 구상할 수 있다.", true, "▸ 위 ㄴ 해설 참조", "특수불법행위"],
  ["SS17.ㄹ", "공동불법행위자 甲, 乙, 丙 중 甲이 피해자로부터 손해배상청구소송을 당하여 판결에 따라 손해배상금 전액을 지급함으로써 다른 공동불법행위자 乙, 丙이 공동면책된 경우.§乙과 丙의 甲에 대한 구상금채무는 특별한 사정이 없는 이상 부진정연대채무이다.", false, "▸ 공동불법행위자 중 1인이 피해자로부터 소송 당하여 응소했으나 패소하여 판결로 인정된 돈을 손해배상으로 지급하고 다른 공동불법행위자 공동면책된 경우 → 부당응소라는 등 특별한 사정 없는 한, 공동면책된 금액 중 다른 공동불법행위자의 과실비율 상당 금액은 물론, 그에 대한 공동면책일 이후의 법정이자 및 피할 수 없는 비용(소송비용 포함) 기타의 손해배상을 구상 O [94다48257]", "특수불법행위"],
  ["SS18.ㄱ", "A 법인의 직원 甲은 사무집행을 하면서 알게 된 丙을 기망하여 이득을 얻고자 친구 乙과 함께 丙의 부주의를 고의로 이용하여 5억 원을 영득하였다. 이에 丙이 A 법인, 甲, 乙을 상대로 손해배상청구의 소를 제기하자 법원은 丙의 손해액을 5억 원으로 보고 甲과 乙은 丙에 대해 공동불법행위책임을, A 법인은 사용자책임을 부담하는 것으로 인정하였다. 또한 법원은 丙의 과실상계 비율을 60%로, 甲과 乙의 내부부담비율을 6:4로 판단하였다.§A 법인이 丙에게 1억 2천만 원을 배상한 경우, A 법인은 乙에게 구상권을 행사할 수 없다.", true, "▸ 사안에서 과실상계를 할 수 있는 A법인은 감액된 2억 원을, 과실상계를 할 수 없는 甲, 乙은 5억 원 전액을 부진정연대채무로 부담(내부부담 비율은 3억:2억)\n▸ 피용자와 제3자가 공동불법행위로 피해자에게 손해를 가한 경우 피용자와 제3자는 공동불법행위자로서 부진정연대관계 → 사용자의 손해배상책임은 피용자의 배상책임에 대한 대체적 책임이어서 사용자도 제3자와 부진정연대관계 → 사용자가 피용자와 제3자의 책임비율에서 피용자 부담부분 초과하여 피해자에게 배상했다면 사용자는 제3자에 대해 제3자의 부담부분에 한하여 구상권 행사 O [91다33070]\n→ A법인이 변제한 1.2억 원은 피용자 甲의 부담부분인 60%(5억을 기준으로 하면 3억, 2억을 기준으로 하면 1.2억)를 초과하지 않는 금액이므로 乙에게 구상할 수 ×", "특수불법행위"],
  ["SS18.ㄴ", "A 법인의 직원 甲은 사무집행을 하면서 알게 된 丙을 기망하여 이득을 얻고자 친구 乙과 함께 丙의 부주의를 고의로 이용하여 5억 원을 영득하였다.§乙이 丙에게 2억 원을 배상하면 丙은 A 법인에게 손해배상을 청구할 수 없다.", false, "▸ 판례의 외측설에 따라 乙이 3억 원을 초과하여 변제해야 A법인의 채무액이 줄어듦\n[AI해설] 乙(과실상계 불가, 5억 부담)이 2억만 변제해도 A법인(과실상계 가능, 2억 부담)의 채무는 여전히 존재한다. 丙은 A법인에게 나머지를 청구할 수 있다.", "특수불법행위"],

  ["001.ㄱ", "주위토지통행권에 관한 설명 중 옳은 것을 모두 고른 것은?§★ 포위된 토지의 소유자에게 공로에 통할 수 있는 자기의 공유토지가 있더라도 이 공유토지가 구분소유적 공유관계에 있고 공로에 접하는 공유 부분을 다른 공유자가 배타적으로 사용·수익하고 있으면, 포위된 토지의 소유자는 이 공유토지 이외의 인접 토지로서 제3자가 소유한 토지에 대한 통행권을 행사할 수 있다.", false, "▸ 공로에 통할 수 있는 자기 공유토지를 두고 공로에의 통로라 하여 남의 토지를 통행하는 것은, 설령 공유토지가 구분소유적 공유관계로서 공로에 접하는 공유 부분을 다른 공유자가 배타적 사용·수익하고 있다고 하더라도, 219조, 220조에 비추어 허용될 수 × [2021다245443]", "물권의소멸·소유권서론기타"],
  ["001.ㄴ", "주위토지통행권에 관한 설명 중 옳은 것을 모두 고른 것은?§■보충 甲이 소유한 토지의 일부가 乙에게 양도되었는데 乙이 양수한 부분이 공로에 통하지 못하는 포위된 토지인 경우, 乙이 甲의 통행 방해로 인해 부득이 인접한 Y토지의 소유자 丙에게 사용료를 지급하고 Y토지를 공로로 통하는 통로로 사용하였다면, 乙의 甲에 대한 무상의 주위토지통행권은 소멸한다.", false, "▸ 양도인이 포위된 토지 소유자에 대해 무상 주위토지통행을 허용하지 않음으로써 할 수 없이 주위의 다른 토지 소유자와 일정 기간 사용료로 지급하고 그 다른 토지 일부를 공로로 통하는 통로로 사용했더라도 포위된 토지의 소유자가 제220조 무상 주위토지통행권을 취득할 수 없는 것은 아님 [94다45869]", "물권의소멸·소유권서론기타"],
  ["001.ㄷ", "주위토지통행권에 관한 설명 중 옳은 것을 모두 고른 것은?§무상의 주위토지통행권이 발생하는 토지의 일부 양도라 함은 1필의 토지의 일부가 양도된 경우뿐만 아니라 일단(一團)으로 되어 있던 동일인이 소유한 여러 필지의 토지 중 일부가 양도된 경우도 포함된다.", true, "▸ 동일인 소유 토지 일부 양도로 공로에 통하지 못하고 포위된 토지를 위한 주위토지통행권은 일부 양도 전 '양도인' 소유 종전 토지에만 O, 다른 사람 소유 토지에 대하여는 × → 무상 주위토지통행권 발생하는 일부 양도는 1필 토지 일부 양도뿐 아니라 동일인 소유 일단의 여러 필지 중 일부 양도 포함 O [94다45869]", "물권의소멸·소유권서론기타"],
  ["001.ㄹ", "주위토지통행권에 관한 설명 중 옳은 것을 모두 고른 것은?§무상의 주위토지통행권에 관한 「민법」제220조는 토지의 직접 분할자 또는 일부 양도의 당사자들 사이에서만 적용되고, 포위된 토지 또는 피통행지의 특정승계인에게는 적용되지 않는다.", true, "▸ 분할·일부양도로 인한 통행사용권은 직접 분할자, 일부 양도 당사자 사이에만 적용, 피통행지의 특정승계인의 경우는 주위토지통행권 일반원칙으로 범위 정해야 → 현재 토지 용법 따른 이용 범위에서 인정될 뿐, 나아가 장차의 이용상황까지 미리 대비하여 통행로 정하면 × [96다33433]", "물권의소멸·소유권서론기타"],
  ["002.①", "주위토지통행권의 범위는 현재 토지의 용법에 따른 이용과 장차의 이용 상황을 모두 고려하여 정해져야 한다.", false, "▸ 주위토지통행권의 범위는 현재의 토지의 용법에 따른 이용의 범위에서 인정할 수 있을 뿐, 장래의 이용 상황까지 미리 대비하여 정할 것은 아니다 [2005다30993]", "물권의소멸·소유권서론기타"],
  ["002.③", "분할로 인하여 공로에 통하지 못하는 토지가 있는 때에는 그 토지소유자는 공로에 출입하기 위하여 다른 분할자의 토지를 통행할 수 있으나, 다른 분할자의 손해를 보상하여야 한다.", false, "▸ 제220조(분할, 일부양도와 주위통행권) ① 분할로 인하여 공로에 통하지 못하는 토지가 있는 때에는 그 토지소유자는 공로에 출입하기 위하여 다른 분할자의 토지를 통행할 수 있다. 이 경우에는 보상의 의무가 없다.\n▸ 분할·일부양도와 주위통행권(제220조) : 토지의 분할·일부양도로 공로에 통하지 못하는 토지 있는 때 그 토지소유자는 공로 출입 위해 다른 분할자 등의 토지 통행권 → 이 경우는 보상의무 ×", "물권의소멸·소유권서론기타"],
  ["002.④", "■보충 주위토지통행권은 통행을 위한 지역권과 마찬가지로 통행로가 항상 특정한 장소로 고정된다.", false, "▸ 주위토지통행권은 통행 지역권과 달리 통행로가 항상 특정한 장소로 고정되지는 × → 주위토지 소유자가 용법에 따라 기존 통행로로 이용되던 토지의 사용방법을 바꿨을 때는 대지 소유자는 그를 위해 보다 손해가 적은 다른 장소로 옮겨 통행할 수밖에 없는 경우도 있음 [2008다75300]", "물권의소멸·소유권서론기타"],
  ["002.⑤", "포위된 토지가 사정변경에 의하여 공로에 접하게 되어 주위토지통행권을 인정할 필요성이 없어지더라도 이미 성립된 주위토지통행권이 소멸하는 것은 아니다.", false, "▸ 일단 주위토지통행권 발생하였더라도 나중에 토지에 접하는 공로 개설됨으로써 인정 필요성 없어지면 주위토지통행권 소멸 [97다47118]", "물권의소멸·소유권서론기타"],
  ["15V03.③", "★ 타인 소유의 토지 위에 불법으로 건물을 신축하여 소유하고 있는 자로부터 건물을 매수하여 점유·사용하고 있으나 소유권이전등기를 경료받지 못한 자는 법률상 소유자가 아니므로, 토지소유자는 그를 상대로 건물의 철거를 구할 수 없다.", false, "▸ 건물철거는 소유권의 종국적 처분 해당하는 사실행위 → 그 소유자(등기명의자)에게만 철거처분권 있음이 원칙 → 그러나 건물을 매수하여 점유하는 자는 아직 등기 없더라도 점유하는 건물에 대해 법률상·사실상 처분할 수 있는 지위 O, 건물로 불법점유 당한 토지소유자는 미등기 건물점유자에 대해 철거청구 O [86다카1751]", "물권의소멸·소유권서론기타"],
  ["004.①", "자기 소유 토지에 대한 토지 소유자의 이른바 '독점적·배타적인 사용·수익권의 포기'가 인정되는 경우에 관한 설명으로 옳지 않은 것은?§독점적·배타적인 사용·수익권을 포기한 토지 소유자는 특별한 사정이 없는 한 자기 소유 토지를 점유·사용하는 타인을 상대로 부당이득반환을 청구할 수 있다.", false, "▸ 토지소유자 스스로 토지를 일반공중 용도로 제공한 경우 소유자의 독점적·배타적 사용·수익권 행사가 제한되는 법리(무상 통행권한 부여 등)는 대법원 판례 확립되어 여전히 타당 → 배타적 사용·수익권 포기라면 타인의 점유·사용에 인도청구 ×, 부당이득반환청구 × ∴ 손해 없으므로\n다만 토지소유자는 일반공중 통행 등 이용 방해하지 않는 범위 내에서 토지 처분·사용·수익 권능 O ∴ 사용·권능 대세적·영구적 포기는 물권법정주의 위반\n사망 전 배타적 사용·수익권 포기한 토지소유자의 '상속인'도 제한 승계 O, 경매나 매매 등 '특정승계인'도 특별한 사정이 없는 한 제한 승계 O ∴ 사용·수익 제한 부담 용인하거나 알고서 소유권 취득했으므로\n배타적 사용 제한은 토지소유자가 공공 목적 위해 토지를 제공할 당시의 객관적 토지이용현황 유지되는 한도 내에서만 존속 → 사정변경 있은 때부터 토지소유자는 다시 사용·수익 권능 포함 완전한 소유권 기한 권리 주장 O [2016다264556, 2022다228544, 2023다295442]", "물권의소멸·소유권서론기타"],
  ["004.②", "자기 소유 토지에 대한 토지 소유자의 이른바 '독점적·배타적인 사용·수익권의 포기'가 인정되는 경우에 관한 설명으로 옳지 않은 것은?§원소유자의 독점적·배타적인 사용·수익권의 행사가 제한되는 토지의 소유권을 경매, 매매, 대물변제 등에 의하여 특정승계한 자는, 특별한 사정이 없는 한 그 토지 부분에 대하여 독점적이고 배타적인 사용·수익권을 행사할 수 없다.", true, "▸ 위 004.① 해설 참조 [2016다264556, 2022다228544, 2023다295442]", "물권의소멸·소유권서론기타"],
  ["004.③", "자기 소유 토지에 대한 토지 소유자의 이른바 '독점적·배타적인 사용·수익권의 포기'가 인정되는 경우에 관한 설명으로 옳지 않은 것은?§독점적·배타적인 사용·수익권의 포기가 인정되는 토지가 상속재산에 해당하는 경우, 그 토지에 대한 상속인의 배타적인 사용·수익권의 행사 역시 제한된다.", true, "▸ 위 004.① 해설 참조 [2016다264556, 2022다228544, 2023다295442]", "물권의소멸·소유권서론기타"],
  ["004.④", "자기 소유 토지에 대한 토지 소유자의 이른바 '독점적·배타적인 사용·수익권의 포기'가 인정되는 경우에 관한 설명으로 옳지 않은 것은?§토지 소유자는 일반 공중의 이용을 방해하지 않는 범위 내에서만 그 토지를 처분하거나 사용·수익할 수 있다.", true, "▸ 위 004.① 해설 참조 [2016다264556, 2022다228544, 2023다295442]", "물권의소멸·소유권서론기타"],
  ["004.⑤", "자기 소유 토지에 대한 토지 소유자의 이른바 '독점적·배타적인 사용·수익권의 포기'가 인정되는 경우에 관한 설명으로 옳지 않은 것은?§독점적·배타적인 사용·수익권의 포기가 이루어진 토지이더라도 사정변경의 원칙에 따라 토지 소유자는 사용·수익권을 포함한 완전한 소유권에 기한 권리를 주장할 수 있다.", true, "▸ 위 004.① 해설 참조 [2016다264556, 2022다228544, 2023다295442]", "물권의소멸·소유권서론기타"],
  ["005.ㄱ", "집합건물의 구분소유에 관한 설명 중 옳지 않은 것을 모두 고른 것은?§★ 구분소유자는 대지지분의 보유 여부를 불문하고, 구분소유자 아닌 대지 공유자 또는 그로부터 대지 공유지분을 양수한 구분소유자에 대하여, 전유부분 면적이 차지하는 비율에 따른 차임 상당의 부당이득반환의무를 부담한다.", false, "▸ 공유토지 일부 배타적 점유 공유자는 지분 비율 관계없이 다른 공유자에 부당이득반환의무 × ∴ 공유자는 공유물 전부를 지분 비율 사용·수익(263조)\n→ 그러나 집합건물에서 구분소유자 아닌 대지 공유자는 공유지분권에 기초하여 적정 대지지분을 가진 구분소유자에 대해 대지 사용·수익 부당이득반환청구 × ∴ 집합건물은 일반건물과 달리 대지사용권이 구분소유권 목적인 전유부분에 종속 일체화된 관계, 전유부분 면적 비율 상응한 대지지분 가진 구분소유자는 대지 전부를 용도에 따라 사용·수익할 적법 권원 O, 집합건물 대지 공유관계에는 민법상 공유물 일반 법리 적용 × [2017다257067]", "물권의소멸·소유권서론기타"],
  ["005.ㄴ", "집합건물의 구분소유에 관한 설명 중 옳지 않은 것을 모두 고른 것은?§■보충 전유부분과 함께 그 대지지분을 매수한 자는, 그 대금을 모두 지급한 후 대지지분에 대한 소유권 이전등기를 함으로써 비로소 「집합건물의 소유 및 관리에 관한 법률」제2조 제6호 소정의 대지사용권을 취득한다.", false, "▸ 집합건물 건축자로부터 전유부분·대지지분을 함께 분양 형식으로 매수하여 대금 완납하여 소유권 취득의 실질적 요건 갖췄지만 전유부분만 소유권이전등기 경료받고 대지지분에는 아직 소유권이전등기 경료받지 못한 자는 매매계약 효력으로써 전유부분의 소유를 위하여 대지를 점유·사용할 권리가 O, 이는 단순한 점유권과는 차원 달리하는 본권 O, 집합건물법 상의 대지사용권에 해당 O → 수분양자로부터 전유부분·대지지분을 다시 양수받거나 전전 양수받은 자 역시 대지사용권 취득 O [98다45652]", "물권의소멸·소유권서론기타"],
  ["005.ㄷ", "집합건물의 구분소유에 관한 설명 중 옳지 않은 것을 모두 고른 것은?§구분소유권은 원칙적으로 건물 전체가 완성되어 당해 건물에 관한 건축물대장에 구분건물로 등록된 시점에 성립한다.", false, "▸ 1동의 건물에 대하여 구분소유 성립하기 위해서는 객관적·물리적 측면에서 1동 건물이 존재하고, 구분된 건물부분이 구조상·이용상 독립성 갖추며, 1동의 건물 중 물리적 구획된 건물부분을 각 구분소유권 객체로 하려는 구분행위가 있어야 → 구분행위는 법률관념상 건물의 특정 부분을 구분하여 별개 소유권 객체로 하려는 법률행위, 시기·방식에 제한 無, 처분권자의 구분의사가 객관적으로 외부에 표시되면 인정 → 구분건물 물리적 완성 전에도 건축허가신청·분양계약 등을 통해 장래 신축될 건물을 구분건물로 하겠다는 구분의사 객관적 표시되면 구분행위 O, 이후 1동의 건물 및 그 구분행위 상응하는 구분건물이 객관적·물리적 완성된 시점에 구분소유 성립 O (집합건축물대장 등록이나 구분건물 등기가 아직 이뤄지지 않았더라도) [2010다71578]", "물권의소멸·소유권서론기타"],
  ["005.ㄹ", "집합건물의 구분소유에 관한 설명 중 옳지 않은 것을 모두 고른 것은?§■보충 구분소유가 성립하기 전에 대지에 관하여만 근저당권이 설정되었다가 구분소유가 성립하여 대지사용권이 성립된 경우, 이미 설정된 그 근저당권의 실행으로 대지가 매각됨으로써 전유부분을 위한 대지사용권은 소멸한다.", true, "▸ 구분소유 성립 전에 대지만 근저당권 설정되었다가 구분소유 성립하여 대지사용권 성립되었더라도, 위 근저당권 실행으로 대지 매각됨으로써 전유부분으로부터 분리처분된 경우는 전유부분 위한 대지사용권 소멸 O [2017다9121]", "물권의소멸·소유권서론기타"],
  // 등기제도,
  ["006.ㄷ", "X토지에 관하여 甲 명의의 1996. 5. 1.자 소유권보존등기와 乙 명의의 1999. 5. 1.자 소유권보존등기가 각각 마쳐져 있다. 단, 甲 명의의 소유권보존등기의 원인무효 사유는 없다.§★ 중복등기로서 무효인 후행 보존등기에 기하여 A가 소유권이전등기를 마친 후에 그 부동산에 관하여 점유취득시효까지 완성되었다면, 선행 보존등기에 기하여 소유권을 주장하는 자는 A에 대하여 후행 보존등기에 기한 소유권이전등기의 말소청구를 할 수 없다.", false, "▸ 중복된 보존등기를 마친 자가 점유취득시효 완성해도 중복등기는 무효로서 말소되어야 [93다20177]", "등기제도"],
  ["007.ㄱ", "★ 부동산에 관한 유효한 명의신탁약정을 명의신탁자가 해지한 후 제3자에게 명의신탁 해지를 원인으로 한 소유권이전등기청구권을 양도한 경우, 명의수탁자의 동의나 승낙이 없는 이상 그 양수인은 명의수탁자에게 직접 소유권이전등기청구를 할 수 없다.", true, "▸ 명의신탁 해지 원인 소이등청구권도 양도에 명의수탁자가 동·승낙 않았다면 양수인은 수탁자에 대해 직접 소유권이전등기청구 × ∴ 중간생략등기합의에 전원 동의 요하는 법리 적용 [2018다280316]", "등기제도"],
  ["007.ㄷ", "★ 중복등기로서 무효인 후행 보존등기에 기하여 A가 소유권이전등기를 마친 후에 그 부동산에 관하여 점유취득시효까지 완성되었다면, 선행 보존등기에 기하여 소유권을 주장하는 자는 A에 대하여 후행 보존등기에 기한 소유권이전등기의 말소청구를 할 수 없다.", false, "▸ 중복된 보존등기를 마친 자가 점유취득시효 완성해도 중복등기는 무효로서 말소되어야 [93다20177]", "등기제도"],
  ["008.①", "甲은 자기 소유 X건물을 乙에게 매도하고 乙은 이를 다시 丙에게 매도하기로 하는 매매계약을 각각 체결하였다.§★ 甲, 乙, 丙이 전원의 의사합치에 따라 甲으로부터 丙에게 직접 소유권이전등기를 넘겨주기로 하는 중간생략등기의 합의를 한 경우, 丙은 甲을 상대로 X건물의 소유권이전등기를 청구할 수 있다.", true, "▸ 순차양도의 최종 양수인이 최초 양도인에 대하여 직접 소유권이전등기청구권을 행사하기 위하여는 당사자 전원의 의사합치, 즉 최초 양도인과 중간자의 동의 외에 최초 양도인과 최종 양수인 사이에도 중간생략등기 합의 있어야 [91다5761]", "등기제도"],
  ["009.①", "甲과 乙은 甲 소유 A부동산에 관하여 매매계약을 체결하였고, 그 후 乙은 소유권이전등기를 마치지 않은 상태에서 丙과 A부동산에 관한 매매계약을 체결하였다.§★ 甲, 乙, 丙 사이에 중간생략등기의 합의가 있었다 하더라도 乙의 甲에 대한 소유권이전등기청구권이 소멸되지는 않는다.", true, "▸ 중간생략등기 합의가 있었더라도 중간등기를 생략해도 이의가 없다는 의미일 뿐 중간매수인의 최초매도인에 대한 소유권이전등기청구권이 소멸된다거나 최초매도인의 중간매수인에 대한 소유권이전등기의무가 소멸되는 것은 × [91다18316]", "등기제도"],
  ["009.④", "甲과 乙은 甲 소유 A부동산에 관하여 매매계약을 체결하였고, 그 후 乙은 소유권이전등기를 마치지 않은 상태에서 丙과 A부동산에 관한 매매계약을 체결하였다.§★ 甲, 乙, 丙 사이에 중간생략등기의 합의가 있은 후에 甲과 乙 사이에 매매대금을 인상하는 약정이 체결된 경우, 甲은 인상된 매매대금이 지급되지 않았음을 이유로 丙으로의 소유권이전등기절차의 이행을 거절할 수 없다.", false, "▸ 중간생략등기 합의 있은 후에 甲과 乙 사이 매매대금 인상 약정 체결된 경우 → 甲은 '인상된' 매매대금이 지급되지 않았음을 이유로 丙에 대한 소유권이전등기의무 거절 O ∴ 중간생략등기 합의가 있다고 하여 최초매도인 甲이 중간매수인 乙에 대해 가지는 매매대금청구권의 행사가 제한되지 않으므로 [2003다66431]", "등기제도"],
  ["010.①", "甲과 乙은 甲 소유의 X 부동산에 관하여 매매대금을 1억 원으로 하여 매매계약을 체결하였고, 그 후 乙과 丙은 X에 관하여 매매대금을 1억 2,000만 원으로 하여 매매계약을 체결하였다.§★ 丙이 乙로부터 甲에 대한 소유권이전등기청구권을 양수하고 이 사실을 乙이 甲에게 통지하였다면, 丙은 甲에게 X에 관하여 직접 자기 앞으로 소유권이전등기를 해줄 것을 청구할 수 있다.", false, "▸ 매매로 인한 소유권이전등기청구권은 성질상 양도 제한되고 양도에 채무자의 승낙·동의 요하며 양도통지만으로 채무자에게 대항 × ∴ 매매 소유권이전등기청구권은 이행과정에 신뢰관계가 따르므로 [2000다51216]", "등기제도"],
  ["SS1.①", "X 부동산의 소유자인 甲은 2010. 2. 1. 乙에게 X 부동산에 관하여 2010. 1. 20.자 매매예약을 원인으로 하는 소유권이전청구권 가등기를 마쳐 주었는데, 甲과 乙은 예약완결권의 행사기간에 대해서는 별도로 약정하지 않았다. 甲의 채권자 丙은 2011. 2. 1. X 부동산에 대하여 적법한 가압류등기를 마쳤다. (각 지문은 독립적)§★ 甲이 2024. 1. 10. 乙에게 X 부동산을 매도하고 甲, 乙 간 가등기 유용의 합의에 따라 2024. 2. 1. X 부동산에 대한 乙 명의의 본등기를 마쳐 준 경우, 乙은 X 부동산의 소유권을 취득한다.", true, "▸ 매매예약완결권은 계약에서 기간을 정하지 않은 경우는 예약 성립시로부터 10년의 제척기간에 걸리고, 그 행사의 '시기'를 따로 정하거나 목적물을 인도받은 경우에도 '예약성립일'로부터 10년 [96다47494]\n→ 매매예약일인 2010. 1. 20.부터 10년이 경과한 2020. 1. 20. 매매예약완결권이 제척기간 경과로 소멸 → 乙 명의의 가등기는 무효 등기 → 무효등기 유용 합의로 본등기 마친 이상 실체관계 부합 O, 乙 소유권 취득 O", "등기제도"],
  ["SS1.②", "X 부동산의 소유자인 甲은 2010. 2. 1. 乙에게 X 부동산에 관하여 2010. 1. 20.자 매매예약을 원인으로 하는 소유권이전청구권 가등기를 마쳐 주었는데, 甲과 乙은 예약완결권의 행사기간에 대해서는 별도로 약정하지 않았다. 甲의 채권자 丙은 2011. 2. 1. X 부동산에 대하여 적법한 가압류등기를 마쳤다. (각 지문은 독립적)§甲이 2024. 1. 10. 乙에게 X 부동산을 매도하고 甲, 乙 간 가등기 유용의 합의에 따라 2024. 2. 1. X 부동산에 대한 乙 명의의 본등기를 마쳐 주어 丙 명의의 가압류등기가 말소된 경우, 乙은 丙의 가압류등기의 회복등기 절차에 대해 승낙의 의사표시를 할 의무를 진다.", true, "▸ 무효등기 유용 합의에 따른 부기등기를 마치기 전에 등기부상 이해관계를 가진 자에 대하여는 유용합의로 유효 주장 × [2009다4787]\n'등기상 이해관계 있는 제3자'란 회복·말소·변경·경정등기를 함으로써 손해 입을 우려가 있음이 등기부 기재에 의해 형식적으로 인정되는 자 [2005다43753]\n→ 丙은 무효등기 유용 전인 2011. 2. 1. X 부동산에 대하여 적법한 가압류등기 마친 이상 乙은 丙에 대하여 유용 합의에 따른 등기 유효 주장 ×, 乙은 丙의 가압류등기의 회복등기절차에 대하여 등기상 이해관계 있는 제3자 O, 실체법상 대항할 수 없으므로 승낙의무 O", "등기제도"],
  ["SS1.③", "X 부동산의 소유자인 甲은 2010. 2. 1. 乙에게 X 부동산에 관하여 2010. 1. 20.자 매매예약을 원인으로 하는 소유권이전청구권 가등기를 마쳐 주었는데, 甲과 乙은 예약완결권의 행사기간에 대해서는 별도로 약정하지 않았다. 甲의 채권자 丙은 2011. 2. 1. X 부동산에 대하여 적법한 가압류등기를 마쳤다. (각 지문은 독립적)§★ 甲이 2024. 2. 1. 丁과 X 부동산에 관한 매매예약을 체결하고 甲, 丁 간 가등기 유용의 합의에 따라 丁 명의로 가등기 이전의 부기등기를 마쳐 준 경우, 丁은 甲의 가등기 말소 청구에 대항할 수 있다.", true, "▸ 매매예약에 기하여 소유권이전등기청구권 보전을 위한 가등기 마쳤으나 그 매매예약완결권이 소멸했다면 가등기도 말소되어야 → 부동산 소유자와 제3자 사이 새로운 매매예약 체결하고 효력 상실된 가등기 유용하기로 합의하여 부기등기 마쳤다면, 제3자는 가등기 말소청구에 대항 O ∴ 유용합의의 有 → 다만 부기등기 전에 등기부상 이해관계 가진 자에 대하여 유용합의로 유효 주장 × [2009다4787]", "등기제도"],
  ["SS1.④", "X 부동산의 소유자인 甲은 2010. 2. 1. 乙에게 X 부동산에 관하여 2010. 1. 20.자 매매예약을 원인으로 하는 소유권이전청구권 가등기를 마쳐 주었는데, 甲과 乙은 예약완결권의 행사기간에 대해서는 별도로 약정하지 않았다. 甲의 채권자 丙은 2011. 2. 1. X 부동산에 대하여 적법한 가압류등기를 마쳤다. (각 지문은 독립적)§★ 甲이 2024. 2. 1. 丁과 X 부동산에 관한 매매예약을 체결하고 甲, 丁 간 가등기 유용의 합의에 따라 丁 명의로 가등기 이전의 부기등기를 마쳐 준 경우, 丁은 丙에 대해 가등기의 유효를 주장할 수 없다.", true, "▸ 부기등기 전에 등기부상 이해관계 가진 자에 대하여 유용합의로 유효 주장 × [2009다4787]\n→ 무효인 가등기 유용하여 그 가등기에 부기등기 마쳤다면 丁은 무효등기 유용 합의의 상대방인 甲의 가등기 말소청구에는 대항 O → 그러나 부기등기 전인 2011. 2. 1. 丙이 X 부동산에 대하여 작법한 가압류등기 마친 이상 丁은 등기부상 이해관계 가진 丙에 대하여 유용합의로 유효 주장 ×", "등기제도"],
  ["SS1.⑤", "X 부동산의 소유자인 甲은 2010. 2. 1. 乙에게 X 부동산에 관하여 2010. 1. 20.자 매매예약을 원인으로 하는 소유권이전청구권 가등기를 마쳐 주었는데, 甲과 乙은 예약완결권의 행사기간에 대해서는 별도로 약정하지 않았다. 甲의 채권자 丙은 2011. 2. 1. X 부동산에 대하여 적법한 가압류등기를 마쳤다. (각 지문은 독립적)§★ 甲이 2024. 2. 1. 丁과 X 부동산에 관한 매매예약을 체결하고 甲, 丁 간 가등기 유용의 합의에 따라 丁 명의로 가등기 이전의 부기등기를 마쳐 준 경우, 丙이 甲을 대위하여 가등기의 말소를 청구하면 丁은 甲, 丁 간 가등기 유용의 합의로써 丙에게 대항할 수 없다.", false, "▸ 채권자대위권에서 채권자는 채무자 자신이 주장할 사유 범위 내에서 주장할 수 있을 뿐 자기와 제3채무자 사이 독자적인 사정에 기한 사유를 주장할 수 × → 채권자가 무효인 가등기의 유용 합의에 따라 부기등기를 마친 제3채무자를 상대로 채무자를 대위하여 가등기 말소를 구하며 자신이 그 부기등기 전에 가압류한 사실을 주장 × ∴ 채권자 자신이 제3채무자에 대하여 가지는 사유에 관한 것이어서 불허 [2009다4787]", "등기제도"],
  ["SS2.②", "甲은 자신이 소유하는 미등기 건물을 乙에게 매도하여 인도하였고, 乙은 이를 다시 丙에게 전매하여 인도하였다.§甲에서 직접 丙으로의 소유권이전등기에 관해 甲, 乙, 丙 전원의 합의가 있는 경우, 丙은 乙의 등기청구권을 대위행사할 수 없다.", false, "▸ 중간생략등기 합의가 있었더라도 중간등기를 생략해도 이의가 없다는 의미일 뿐 중간매수인 B의 최초매도인 A에 대한 소유권이전등기청구권이 소멸된다거나 A의 B에 대한 소유권이전등기의무가 소멸되는 것은 × [91다18316]\n→ 따라서 丙이 직접 소이등을 구해도 되지만, 乙이 소이등 구해도 되고, 丙이 이러한 乙의 권리를 대위하는 것도 무방함", "등기제도"],
  ["SS2.④", "甲은 자신이 소유하는 미등기 건물을 乙에게 매도하여 인도하였고, 乙은 이를 다시 丙에게 전매하여 인도하였다.§丙이 丁에게 점유를 빼앗기더라도 丙의 乙에 대한 소유권이전등기청구권의 소멸시효는 진행하지 않는다.", false, "▸ 부동산 매수인이 부동산을 인도받아 사용·수익하다가 그 부동산에 대한 보다 적극적인 권리행사의 일환으로 타인에게 처분하고 인도해준 경우도 스스로 계속 사용·수익하는 경우와 다를 바 없어 역시 소멸시효 진행 × [98다32175] → 본 전원합의체 판결은 기존 판례를 폐기하며 ① 매수인이 점유 '침탈'당한 사안, ② '취득시효 완성자'가 점유 승계해준 사안은 폐기하지 않음 → 점유 침탈당하거나 취득시효 완성자가 인도해 준 경우는 위와 달리 점유상실시점부터 소멸시효 진행 O", "등기제도"],

  ["011.⑤", "X 부동산의 소유자인 甲은 2010. 2. 1. 乙에게 X 부동산에 관하여 2010. 1. 20.자 매매예약을 원인으로 하는 소유권이전청구권 가등기를 마쳐 주었는데, 甲과 乙은 예약완결권의 행사기간에 대해서는 별도로 약정하지 않았다. 甲의 채권자 丙은 2011. 2. 1. X 부동산에 대하여 적법한 가압류등기를 마쳤다. (각 지문은 독립적)§★ 甲이 2024. 2. 1. 丁과 X 부동산에 관한 매매예약을 체결하고 甲, 丁 간 가등기 유용의 합의에 따라 丁 명의로 가등기 이전의 부기등기를 마쳐 준 경우, 丙이 甲을 대위하여 가등기의 말소를 청구하면 丁은 甲, 丁 간 가등기 유용의 합의로써 丙에게 대항할 수 없다.", false, "▸ 위 SS1.⑤ 해설 참조 [2009다4787]", "등기제도"],
  ["012.ㄱ", "★ 선등기명의자의 소유권이전등기가 원인무효라고 하더라도 그 이후의 최종 등기명의자가 등기부시효취득의 항변을 제출하여 법원에서 그것이 받아들여진 경우라면, 그 전의 등기명의자들이 최종 등기명의자의 시효취득 사실을 원용하여 원소유자의 소유권 상실을 주장하더라도 원소유자의 소유권에 기한 등기말소청구는 인용될 수 있다.", false, "▸ 부동산이 피고로부터 매매 등으로 순차 이전되어 최종 소유권이전등기 마친 제3자가 시효취득으로 부동산 소유권 취득함에 따라 당초 부동산 소유자인 원고가 소유권 상실 → 피고의 소유권이전등기가 원인무효이어도, 원고는 소유권에 기한 등기말소청구 × ∴ 소유권이전등기 말소 구하려면 말소 청구할 권원 있음을 적극적 주장·증명해야 [2015다249352]", "등기제도"],
  ["012.ㄴ", "★ 부동산의 공유자 중 한 사람은 공유물에 경료된 원인무효의 등기에 관하여 각 공유자에게 해당 지분별로 진정명의회복을 원인으로 한 소유권이전등기를 이행할 것을 단독으로 청구할 수 있다.", true, "▸ 공유자 1인은 원인무효 등기에 관하여 보존행위로서 전부 말소청구 O 혹은 각 공유자에게 해당 지분별로 진정명의회복을 원인으로 한 소유권이전등기 이행할 것을 단독 청구 O ∴ 보존행위, 목·근·성 소송물 동일 [2003다40651]", "등기제도"],
  ["012.ㄷ", "★ 부동산가압류의 기입등기가 법원의 촉탁에 의하여 말소된 경우 가압류 채권자가 말소된 가압류기입등기의 회복등기를 소구할 수 없지만, 말소 당시 그 부동산에 관하여 소유권이전등기를 경료하고 있는 자를 상대로 말소된 가압류기입등기의 회복절차에 대한 승낙청구의 소를 제기할 수는 있다.", true, "▸ 경매신청채권자는 기입등기 말소 당시 부동산에 소유권이전등기 마쳤던 자를 상대로 '법원 촉탁 의한 기입등기 회복절차'에 대한 승낙청구 O ∴ 기입등기 회복 촉탁에 등기상 이해관계 있는 제3자 O [2015다253573]", "등기제도"],
  ["012.ㄹ", "★ 소유권이전등기의 추정력은 전소유자에 대하여도 미치므로, 원고가 이를 부인하여 소유권이전등기의 말소를 구하려면 등기의 무효원인이 되는 사실을 주장하고 증명할 책임이 있는데, 등기명의자 또는 제3자가 그에 앞선 등기명의인의 등기 관련 서류를 위조하여 소유권이전등기를 경료하였다는 점이 증명되었으면 원칙적으로 무효원인의 사실이 증명되었다고 보아야 한다.", true, "▸ 소유권이전등기의 추정력은 전소유자에 대하여도 미치므로, 원고가 말소를 구하려면 등기의 무효원인을 주장·증명해야 → 등기명의자 또는 제3자가 앞선 등기명의인의 등기 관련 서류를 위조하여 소유권이전등기를 경료하였다는 점이 증명되면 원칙적으로 무효원인의 사실이 증명된 것 [2009다105215]", "등기제도"],
  ["013.①", "★ 가등기는 그 성질상 본등기의 순위보전의 효력이 있어 후일 본등기가 경료된 때에는 본등기의 순위가 가등기한 때로 소급하지만 본등기에 의한 물권변동의 효력이 가등기한 때로 소급하여 발생하는 것은 아니다.", true, "▸ 가등기는 그 성질상 본등기의 순위보전 효력만 있고, 후일 본등기가 경료된 때 본등기 순위가 가등기시로 소급함으로써 가등기 후 본등기 전에 이뤄진 중간처분이 본등기보다 후순위로 되어 실효될 뿐, 물권변동 효력이 가등기한 때로 소급 × [81다1298]", "등기제도"],
  ["013.③", "★ 가등기에 기하여 본등기가 경료된 경우 가등기의 원인인 법률행위와 본등기의 원인인 법률행위가 명백히 다른 것이 아니면 사해행위 요건의 구비 여부는 본등기의 원인된 법률 행위 당시를 기준으로 판단하여야 한다.", false, "▸ 가등기에 기한 본등기가 된 경우 각 원인 명백히 다르지 않은 한 사해행위 요건 구비 여부는 가등기의 원인인 법률행위 당시를 기준으로 판단해야 [97다51919] → 제척기간의 진행도 마찬가지 [91다14079]", "등기제도"],
  ["014.②", "소유권이전등기 청구권 보전을 위한 가등기에서 가등기권리자가 가등기에 기한 본등기절차에 의하지 아니하고 가등기설정자로부터 별도의 소유권이전등기를 경료받았다고 하여 가등기권리자의 가등기에 의한 본등기청구권은 혼동의 법리에 의하여 소멸하지 않는다.", true, "▸ 부동산에 청구권 보전 가등기를 한 자가 별도로 소유권이전등기를 받았다고 하더라도, 그 소유자를 상속하거나 소유자의 본등기 절차 이행의무를 인수하지 않는 이상, 가등기에 기한 본등기청구권은 혼동으로 소멸 ×, 본등기청구 O ∴ 특정 물건에 관하여 채권을 가지는 자가 물건의 소유자가 되었다고 하더라도 채권·채무가 동일 주체에 귀속된 경우 아니어서 혼동 × [95다29888, 87다카1637]", "등기제도"],
  ["014.③", "★ 가등기가 이루어진 부동산에 관하여 제3취득자 앞으로 소유권이전등기가 마쳐진 후 그 가등기가 말소된 경우 말소된 가등기의 회복등기절차에서 회복등기의무자는 제3취득자이다.", true, "▸ 회복등기의무자는 말소될 당시의 소유자 → 가등기 후에 소유권 이전되고 가등기 말소된 경우, 가등기 당시 소유자 상대로 회복등기청구하면 각하 → 말소 당시 소유자인 제3취득자를 상대로 회복등기 구해야 [68다1617]", "등기제도"],
  ["015.ㄱ", "★ ■보충 가등기의무자 또는 가등기에 관하여 등기상 이해관계 있는 자는 가등기명의인의 승낙을 받은 경우라도 단독으로는 가등기의 말소를 신청할 수 없다.", false, "▸ 부동산등기법 제93조(가등기의 말소) ① 가등기 명의인은 제23조 제1항에도 불구하고 단독으로 가등기의 말소를 신청할 수 있다.\n부동산등기법 제23조(등기신청인) ① 등기는 법률에 다른 규정이 없는 경우에는 등기권리자와 등기의무자가 공동으로 신청한다.", "등기제도"],
  ["015.ㄴ", "★ 채무자가 유일한 재산인 부동산에 관하여 가등기의 효력이 소멸한 상태에서 새로 매매계약을 체결하고 말소되어야 할 가등기를 기초로 하여 본등기를 한 행위는 가등기의 원인인 법률행위와 별개로 일반채권자의 공동담보를 감소시키는 사해행위이지만, 이때에는 가등기의 원인인 법률행위를 기준으로 사해행위 여부나 제척기간의 준수 여부를 판단하여야 한다.", false, "▸ 가등기 원인 법률행위와 본등기 원인 법률행위가 다르지 않다면, 사해행위 요건 구비 여부는 가등기의 원인인 법률행위 당시를 기준으로 판단해야 → 그러나 각 원인 법률행위가 다르다면 본등기 원인인 법률행위를 기준으로 사해행위 여부나 제척기간 준수 여부를 판단해야 [2019다266409]", "등기제도"],
  ["016.①", "★ 부동산을 매수하면서 소유권이전등기청구권 보전을 위하여 가등기를 경료한 사람이 그 소유권이전등기청구권을 제3자에게 양도한 경우, 가등기의 부기등기 형태로 그 양도사실을 공시할 수 있다.", true, "▸ 가등기된 권리의 이전은 가등기 이전의 부기등기 형식으로 [98다24105]", "등기제도"],
  ["017.ㄴ", "甲은 乙에게 X 부동산을 매도하고 乙은 X 부동산에 대한 소유권이전등기청구권 보전을 위한 가등기를 마쳤다. 乙은 甲의 동의를 얻어 X 부동산에 대한 소유권이전등기 청구권을 丙에게 양도하였고 丙의 명의로 X 부동산에 설정된 가등기이전의 부기등기가 마쳐졌다. 다음의 설명 중 옳은 것을 모두 고른 것은?§★ X 부동산에 마쳐진 가등기가 무효라면 甲은 丙을 상대로 가등기의 말소를 청구해야 한다.", true, "▸ 근저당권이나 가등기의 말소등기청구는 양수인만을 상대로 O → 양도인을 상대로 ×, 양도인을 상대로 하면 피고적격 ×, 각하 ∴ 부기등기는 기존 권리의 승계를 등기부상 명시하는 것뿐 그 등기로 새로운 권리 발생 × [2000다19526]", "등기제도"],
  ["018.ㄱ", "甲 소유의 X 토지를 乙이 매수하였으나 아직 소유권이전등기를 마치지는 않았다.§乙이 甲과의 매매계약의 이행으로써 X 토지를 인도받았고, 이후 丙에게 다시 이를 매도하고 인도해주었더라도, 丙이 X 토지의 점유사용권을 취득한 것으로 볼 수 없다.", false, "▸ 부동산을 인도받은 미등기 매수인의 지위: 법률상 처분할 권리 O → 미등기 전매를 하여도 무권리자의 처분행위 아님 → 설문에서 丙은 X 토지 점유사용권 취득함", "등기제도"],
  ["018.ㄴ", "甲 소유의 X 토지를 乙이 매수하였으나 아직 소유권이전등기를 마치지는 않았다.§★ 乙의 채권자인 丁이 乙의 소유권이전등기청구권을 가압류하였는데 乙이 甲을 상대로 X 토지에 관하여 소유권이전등기 청구의 소를 제기하였다면, 법원은 가압류의 해제를 조건으로 하지 아니하는 한 乙의 청구를 인용하여서는 안 된다.", true, "▸ 소유권이전등기청구권이 가압류된 경우라면 → 가압류집행 해제를 조건으로 인용 ∴ 등기를 명하는 판결은 의사의 진술을 명하는 판결로서 일방적인 등기 신청이 가능하여 제3채무자의 집행단계 저지 불가능 [92다4680]", "등기제도"],
  ["019.ㄷ", "甲은 X 토지를 사정(査定)받은 자의 유일한 상속인이지만 X 토지의 소유자로 등기된 적 없었다. X 토지에 관하여 乙 명의로 허위의 소유권보존등기가 마쳐져 있고, 그 이후 이 등기에 터잡아 丙 및 丁 앞으로 순차 소유권이전등기가 마쳐져 있다. 이에 관한 법률관계 중 옳은 것(○)과 옳지 않은 것(×)을 올바르게 조합한 것은?§★ 丁이 등기부 취득시효 항변을 주장하여 법원에서 받아들여진 경우, 甲이 乙 명의의 소유권보존등기의 말소를 청구하는 소송에서 乙이 이를 원용하더라도, 그 때문에 甲의 乙에 대한 청구가 기각되는 것은 아니다.", false, "▸ 부동산이 피고로부터 매매 등으로 순차 이전되어 최종 소유권이전등기 마친 제3자가 시효취득으로 부동산 소유권 취득함에 따라 당초 부동산 소유자인 원고가 소유권 상실 → 피고의 소유권이전등기가 원인무효이어도, 원고는 소유권에 기한 등기말소청구 × ∴ 소유권이전등기 말소 구하려면 말소 청구할 권원 있음을 적극적 주장·증명해야 [2015다249352] → 출제 당시 당연한 법리로 존재했으나 판시되지 않았던 2019년 판례", "등기제도"],
  ["020.①", "★ 사망자 명의로 신청하여 이루어진 소유권이전등기는 일단 원인무효의 등기라고 볼 것이어서 등기의 추정력을 인정할 여지가 없으므로, 등기의 유효를 주장하는 자가 현재의 실체관계와 부합함을 증명할 책임이 있다.", true, "▸ 사망자 명의로 신청하여 이뤄진 이전등기는 일단 원인무효 O, 등기 추정력 × → 등기 유효 주장하는 자가 현재의 실체관계와 부합함을 증명할 책임 [83다카597]", "등기제도"],
  ["020.②", "★ 등기명의자가 전 소유자로부터 부동산을 취득함에 있어 등기부상 기재된 등기원인에 의하지 아니하고 다른 원인으로 적법하게 취득하였다고 하면서 등기원인행위의 태양이나 과정을 다소 다르게 주장한다고 하여 그 등기의 추정력이 깨어진다고 할 수는 없다.", true, "▸ 등기원인 행위의 태양·과정을 다소 다르게 주장한다고 추정력 깨지지 × [2001다23195]", "등기제도"],
  ["020.③", "★ 부동산에 관하여 소유권이전등기가 경료되어 있는 경우에는 그 등기명의자는 제3자에게 대하여서뿐만 아니라 그 전 소유자에 대하여서도 적법한 등기원인에 의하여 소유권을 취득한 것으로 추정된다.", true, "▸ 부동산 소유권이전등기 명의자는 제3자 뿐 아니라 직전 소유자에 대해서도 적법한 등기원인으로 소유권 취득한 것으로 추정 → 직전 명의인이 이를 부인하고 원인무효라고 다투려면 주장·증명책임 [76다3010, 2010다75044]", "등기제도"],
  ["020.④", "★ 등기명의자 또는 제3자가 그에 앞선 등기명의인의 등기 관련 서류를 위조하여 소유권이전등기를 경료하였다는 점이 증명되었으면 특별한 사정이 없는 한 무효원인의 사실이 증명되었다고 보아야 한다.", true, "▸ 소유권이전등기의 원인으로 주장된 계약서가 진정하지 않은 것으로 증명된 이상 그 등기의 적법추정력은 깨어짐 [98다29568]", "등기제도"],
  ["020.⑤", "■보충 의용 민법과 의용 부동산등기법 적용 당시 행하여진 가등기 뿐만 아니라 현행 「민법」과 현행 「부동산등기법」에 따라 이루어진 가등기에 관해서도 구체적인 등기원인이 존재하는 것으로 추정된다.", false, "▸ 의용 민법과 의용 부동산등기법 적용 당시 행하여진 가등기의 구체적인 등기원인이 존재하는 것으로 추정할 수 ×, 가등기의 추정력 부정은 현행 민법과 부동산등기법에 따라 이뤄진 가등기도 마찬가지 [2018다200730]", "등기제도"],
  ["021.ㄴ", "X 토지에 관하여 甲 명의의 소유권보존등기와 乙 명의의 소유권이전등기가 순차로 경료되어 있다는 사실은 아래 각 소송에서 다툼이 없다. 아래 각 소가 모두 적법하다는 전제에서, 이에 관한 설명 중 옳은 것을 모두 고른 것은?§★ 甲은 乙을 상대로 소유권이전등기말소 청구의 소를 제기하였다. 이 소송에서 乙이 X 토지를 甲의 대리인임을 자칭하는 A를 통하여 매수하였다는 사실에 대해서는 당사자 사이에 다툼이 없었고, A에게 대리권이 있었는지 여부에 관해서만 다투어졌는데, 이 대리권 존부에 관하여 증명되지 않은 경우 원고 甲이 승소한다.", false, "▸ 부동산을 매수하여 '등기한 자'가 전 소유자의 대리인으로부터 매수하였다고 주장한다면 그 대리권의 존재도 추정 O [79다645]", "등기제도"],
  ["022.ㄴ", "★ 신축된 건물의 소유권은 특별한 사정이 없는 한 이를 건축한 사람이 원시취득하는 것이므로, 건물 소유권보존등기의 명의자가 이를 신축한 것이 아니라면 그 등기의 권리추정력은 깨어지고, 등기명의자가 스스로 적법하게 그 소유권을 취득한 사실을 증명하여야 한다.", true, "▸ 신축 건물의 소유권은 특별한 사정이 없는 한 이를 건축한 사람이 원시취득 → 소유권보존등기 명의자가 이를 신축한 것이 아니라면 등기의 권리추정력은 깨어지고, 등기명의자가 스스로 적법하게 그 소유권을 취득한 사실을 증명해야 [95다30734]", "등기제도"],
  ["022.ㄷ", "★ 전 등기명의인이 미성년자이고 당해 부동산을 친권자에게 증여하는 행위가 이해상반행위라면, 일단 친권자에게 이전등기가 마쳐졌더라도 그 이전등기에 관하여 필요한 절차를 적법하게 거친 것으로 추정되지 않는다.", false, "▸ 등기명의인이 미성년자이고 당해 부동산을 친권자에게 증여하는 행위가 이해상반행위라 하더라도 일단 친권자에게 이전등기가 경료된 이상, 특별한 사정이 없는 한, 이전등기에 관하여 필요한 절차를 적법하게 거친 것으로 추정 O [2001다72029] → 증여계약서에 특별대리인 선임 표시 없다는 이유만으로 특별대리인 선임 없었다는 판단 ×", "등기제도"],
  ["023.②", "무허가건물대장은 행정관청이 행정상 사무처리의 편의를 위하여 비치한 대장으로서 건물의 물권변동을 공시하는 법률상의 등록원부가 아니므로 무허가건물대장에 건물주로 등재된다고 하여 권리자로 추정되지 않는다.", true, "▸ 무허가건물대장은 행정관청이 행정상 사무처리의 편의를 위해 비치한 대장으로서 건물의 물권변동을 공시하는 법률상의 등록원부가 아니므로 무허가건물대장에 건물주로 등재된다고 하여 권리자로 추정되지 않음 [97다48937]", "등기제도"],
  ["023.⑤", "■보충 소유권보존등기 명의인을 상대로 소유권보존등기 말소청구 소송을 제기하여 승소판결을 받은 원고가 그 판결에 기하여 기존의 소유권보존등기를 말소한 후 자신의 명의로 소유권보존등기를 마친 경우, 위 판결이 공시송달 절차에 의하여 선고되었다 하더라도 적법한 등기로 추정된다.", true, "▸ 부동산등기법 및 예규에 의하면 소유권보존등기 명의인을 상대로 한 소유권보존등기 말소청구소송 제기하여 승소판결 받은 원고가 그 판결에 기하여 기존 보존등기 말소한 후 자신 명의로 마친 소유권보존등기는 일단 적법 절차 따라 마쳐진 소유권보존등기라고 추정 O, 판결이 공시송달 절차 의했어도 마찬가지 [2006다17485]", "등기제도"],
  ["024.⑤", "토지에 관하여 소유권보존등기가 마쳐져 있는 경우, 그 등기명의자는 전 소유자로부터 그 토지를 양수한 것이라고 주장하고 전 소유자는 토지 양도 사실이 없다고 주장한다면 그 등기의 추정력이 깨어진다.", true, "▸ 소유권보존등기 명의자가 양수인이라 주장하는데 전 소유자는 양도사실을 부인한 경우에는 보존등기 추정력 깨어짐 [73다1658]", "등기제도"],
  ["025.③", "★ 매매를 등기원인으로 하여 가등기가 마쳐졌다면, 특별한 사정이 없는 한 매매계약이 유효하게 성립하였음이 추정된다.", false, "▸ 청구권보전 가등기가 있어도 소유권이전등기를 청구할 어떤 법률관계 추정되지 × [79다239]", "등기제도"],
  ["026.ㄱ", "경정등기에 관한 설명 중 옳은 것(○)과 옳지 않은 것(×)을 올바르게 조합한 것은?§■보충 등기명의인의 동일성이 인정되지 않는 위법한 경정등기가 마쳐졌으나 그것이 경정 후 명의인의 권리관계를 표상하는 결과에 이르러 그 경정등기가 실체관계에 부합하게 되었다면 그 경정등기는 유효하지만, 경정 전에 실제로 존재했던 경정 전 등기명의인의 권리가 소급적으로 소멸되지는 않는다.", true, "▸ [95다2135] → 등기가 실체관계에 부합하여 유효하게 되는 것은 소급효가 없음", "등기제도"],
  ["026.ㄴ", "경정등기에 관한 설명 중 옳은 것(○)과 옳지 않은 것(×)을 올바르게 조합한 것은?§등기명의인의 경정의 부기등기가 등기명의인의 동일성을 해치는 방법으로 행하여져서 실제 소유관계를 표상하고 있지 않은 경우, 이러한 경정등기의 말소등기절차의 이행을 청구하려는 자는 자신이 부동산의 원래의 등기명의인에 해당하는 자로서 진실한 소유자라는 사실을 증명하여야 한다.", true, "▸ 등기명의인의 표시변경·경정의 부기등기가 등기명의인 동일성 해치는 방법으로 행해져 실지 소유관계 표상하고 있지 않다면, 진실한 소유자는 소유권 내용인 침해배제청구권의 정당한 행사로써 그 표시상 소유명의자를 상대로 부기등기인 표시변경·경정등기의 말소등기절차 이행청구 O → 원고는 자신이 부동산의 원래 등기명의인으로서 진실한 소유자라는 사실 증명해야 [2020다299214]", "등기제도"],
  ["026.ㄷ", "경정등기에 관한 설명 중 옳은 것(○)과 옳지 않은 것(×)을 올바르게 조합한 것은?§■보충 등기관이 기존 등기에 존재하는 착오를 발견한 경우 지체 없이 그 등기를 경정하여야 하는데, 이때 경정될 등기와 등기부상 양립할 수 없는 등기가 있는 경우에는 그 등기명의인의 승낙을 받아야 한다.", false, "▸ 등기관이 등기의 착오나 빠진 부분이 등기관 잘못으로 인한 것임을 발견하면 지체 없이 등기를 직권 경정하여야, 다만 등기상 이해관계 있는 제3자가 있다면 제3자의 승낙이 있어야(부동산등기법 제32조 제2항) → '등기상 이해관계 있는 제3자'는 경정등기 허용함으로써 손해 입을 위험성 있는 등기상 권리자 O, 경정될 등기와 등기부상 양립할 수 없는 등기 내용은 단지 경정 대상이 될 뿐 등기상 이해관계 있는 제3자 ×, 승낙 받을 필요 × [2016마5579] → '회복등기'의 등기상 이해관계 있는 제3자와 마찬가지 법리", "등기제도"],
  ["026.ㄹ", "경정등기에 관한 설명 중 옳은 것(○)과 옳지 않은 것(×)을 올바르게 조합한 것은?§공유부동산에 관하여 단독 소유로 소유권보존등기가 마쳐진 경우, 진정한 권리자가 소유권보존등기의 일부 말소를 소로써 구하면 법원은 그 지분에 대해서만 말소를 명할 수 없으므로 경정등기를 명하여야 한다.", false, "▸ 공유 부동산에 단독소유 소유권보존등기 마쳐지면 일부 지분 등기가 무효이므로 일부 지분 말소를 구하여야 하고, 법원은 지분에 한하여만 말소 명할 수 있으나, 등기기술상 소유권보존등기의 일부말소 허용되지 않으므로 그 판결의 집행은 단독소유를 공유로 하는 경정등기 방식으로 O, 경정등기를 소로써 구하는 것은 × [2016다6309]\n→ '지분 말소'의 집행방법에 관한 수업시간 설명, 경정등기청구는 권리보호이익 ×", "등기제도"],
  // 점유권,
  ["038.ㄱ", "★ 직접점유자가 점유의 침탈을 당한 경우, 간접점유자는 그 물건을 직접점유자에게 반환할 것을 청구할 수 있고, 직접점유자가 그 물건의 반환을 받을 수 없는 때에는 자기에게 반환할 것을 청구할 수 있다.", true, "▸ 제207조(간접점유의 보호) ① 전 3조의 청구권은 제194조의 규정에 의한 간접점유자도 이를 행사할 수 있다. ② 점유자가 점유의 침탈을 당한 때 간접점유자는 그 물건을 점유자에게 반환할 것을 청구할 수 있고 점유자가 그 물건의 반환을 받을 수 없거나 이를 원하지 아니하는 때에는 자기에게 반환할 것을 청구할 수 있다.", "점유권"],
  ["038.ㄴ", "★ 타인의 소유물을 권원 없이 점유한 악의수익자는 받은 이익에 이자를 붙여 반환해야 하고, 위 이자의 이행지체로 인한 지연손해금도 지급해야 한다.", true, "▸ 제201조(점유자와 과실) ② 악의의 점유자는 수취한 과실을 반환하여야 하며 소비하였거나 과실로 인하여 훼손 또는 수취하지 못한 경우에는 그 과실의 대가를 보상하여야 한다.\n제748조(수익자의 반환범위) ② 악의의 수익자는 그 받은 이익에 이자를 붙여 반환하고 손해가 있으면 이를 배상하여야 한다.\n▸ 타인 소유물의 악 점유자는 201조 2항에서 과실수취권 부정되고, 748조 2항에 따라 받은 이익에 이자를 붙이고 이자 이행지체 지연손해금도 지급해야 [2001다61869]", "점유권"],
  ["038.ㄹ", "★ 甲의 점유가 타주점유인 경우, 특별한 사정이 없는 한 甲으로부터 상속에 의하여 점유를 승계한 乙의 점유는 타주점유이다.", true, "▸ 피상속인이 타주점유라면 상속인도 타주점유 (즉, 상속인 분리 주장 ×) → 자주점유가 되기 위하여는 소유자에게 소유의 의사 있는 것을 표시하거나 새로운 권원에 의해 다시 소유의사로 점유 시작해야 [96다25319]", "점유권"],
  ["039.ㄷ", "甲 소유의 X 동산을 乙이 점유하고 있다.§★ 乙이 선의의 점유자라도 甲이 제기한 소유권에 기한 인도청구의 소에서 패소하면 \"그 소가 제기된 때\"부터 악의의 점유자로 의제되는데, 여기서 \"그 소가 제기된 때\"는 甲의 소장이 법원에 접수된 때를 말한다.", false, "▸ 197조 2항, 749조 2항은 같은 취지 → '패소한 때'는 점유자나 수익자가 종국판결에서 패소로 확정된 경우 의미 → 악의로 보는 효과가 그때 발생한다는 것 뿐, 패소판결 확정 전에 이를 전제로 하는 청구 O → 소유자는 점유자를 상대로 물건반환 및 권원 없는 사용이익 반환 구하면서 물건반환 인용될 것을 전제로 소송계속 된 때 이후 기간 사용이익 반환 청구 O [2016다220044] → 여기서 '소를 제기한 때'를 '소송이 계속된 때(즉, 소장 부분 송달일)'로 해석하는 표현 → 객관식에서 '소장 접수일'의 의미가 아니라고 최초로 명시적으로 출제된 것", "점유권"],
  ["039.ㄹ", "甲 소유의 X 동산을 乙이 점유하고 있다.§★ 乙이 X를 丙에게 보관시킨 경우, 乙이 X를 丁에게 매각하여 丙에 대한 반환청구권을 丁에게 양도하고 채권양도의 대항요건을 갖추었다면, 丁은 X의 선의취득에 필요한 점유요건을 충족한다.", true, "▸ [97다48906] → 목적물반환청구권 양도 방식에 의한 선의취득 O", "점유권"],
  ["040.ㄴ", "★ 점유물이 소유의 의사가 있는 선의의 점유자의 책임 있는 사유로 인하여 멸실 또는 훼손된 때에는 그 점유자는 이익이 현존하는 한도에서 배상하여야 한다.", true, "▸ 제202조(점유자의 회복자에 대한 책임) 점유물이 점유자의 책임있는 사유로 인하여 멸실 또는 훼손한 때에는 악의의 점유자는 그 손해의 전부를 배상하여야 하며 선의의 점유자는 이익이 현존하는 한도에서 배상하여야 한다. 소유의 의사가 없는 점유자는 선의인 경우에도 손해의 전부를 배상하여야 한다.", "점유권"],
  ["SS3.①", "★ 점유권에 기한 본소에 대하여 본권자가 본소청구 인용에 대비하여 본권에 기한 예비적 반소를 제기하고 양 청구가 모두 이유 있는 경우, 법원은 점유권에 기한 본소와 본권에 기한 예비적 반소를 모두 인용해야 한다.", true, "▸ 점유회수청구에 대해 점유침탈자가 점유물에 대한 본권 있다는 주장으로 배척할 수 × ∴ 208조 → 점유권에 기한 본소에 본권자가 본소청구 인용 대비하여 본권에 기한 '예비적 반소' 제기 → 양 청구 모두 이유 있으면 본소 및 예비적 반소 모두 인용해야 → 모두 인용 확정되면, 점유자가 본소 확정판결의 집행문 부여받아 강제집행으로 점유 회복 O, 본권자는 본소 집행 후 집행문 부여받아 반소 확정판결 따른 강제집행으로 점유 회복 O ∴ 반소청구는 본소 의무 실현을 정지조건으로 → 이 과정에서 본권자가 점유 침탈 중 설치한 장애물 제거될 수 O (다만 예외 있음) [2019다202795]", "점유권"],
  ["041.ㄱ", "타인의 물건을 악의로 무단점유하는 자가 그 물건을 임대하여 차임을 수령한 경우, 그 물건을 소유자에게 반환할 때 점유기간 동안 지출한 통상의 필요비용의 상환을 청구하지 못한다.", false, "▸ 점유자가 과실을 취득한 경우 '통상'의 필요비 청구 × (203조 1항 단서) → 203조 1항 단서 '점유자가 과실 취득한 경우'란 점유자가 선의 점유자로 201조 1항에 따라 과실수취권 보유하는 경우 → 과실수취권 없는 악의 점유자에는 위 단서 규정 적용 × [2018다261889]\n→ 악의 점유자는 통상 필요비 청구 O", "점유권"],
  ["041.ㄴ", "■보충 점유자의 회복자에 대한 유익비상환청구 소송에서, 실제로 지출한 금액 및 현존하는 증가액에 관한 증명책임은 점유자에게 있다.", true, "▸ 유익비상환청구에서 실제 지출금액 및 현존 증가액에 관한 증명책임은 모두 유익비의 상환을 구하는 점유자에게 [2018다206707]", "점유권"],
  ["041.ㄷ", "위법한 강제집행에 의하여 부동산의 인도가 이루어진 경우, 그 강제집행이 종료한 후 즉시 자력으로 그 점유를 탈환한 것은 민법상 점유자의 자력구제에 해당한다.", true, "▸ 위법한 강제집행 종료(건물에 자물쇠) 후 불과 2시간 뒤에 자물쇠 풀고 들어가 종전처럼 아국 경영한 경우 부동산 자력구제의 '즉시' O [86다카1683]", "점유권"],
  ["041.ㄹ", "점유매개관계를 이루는 임대차계약 등이 종료된 이후에도 직접점유자가 목적물을 점유한 채 이를 반환하지 않고 있는 경우에는, 간접점유자의 반환청구권이 소멸한 것이 아니므로 간접점유의 점유매개관계가 단절된다고 할 수 없다.", true, "▸ 점유매개관계 이루는 임대차계약 종료 이후에도 직접점유자가 목적물을 점유한 채 반환하지 않고 있다면 간접점유자의 점유매개관계 존속 ∴ 간접점유자의 반환청구권 소멸하지 않았음 → 간접점유자 임대인의 유치권 O [2019다205329]", "점유권"],
  ["042.ㄱ", "★ 점유매개관계를 이루는 임대차계약 등이 종료된 이후에도 직접점유자가 목적물을 점유한 채 이를 반환하지 않고 있는 경우에는, 간접점유자의 반환청구권이 소멸한 것이 아니므로 간접점유의 점유매개관계가 단절된다고 할 수 없다.", true, "▸ 점유매개관계 이루는 임대차계약 종료 이후에도 직접점유자가 목적물을 점유한 채 반환하지 않고 있다면 간접점유자의 점유매개관계 존속 ∴ 간접점유자의 반환청구권 소멸하지 않았음 → 간접점유자 임대인의 유치권 O [2019다205329]", "점유권"],
  ["042.ㄷ", "★ 어떤 물건에 대하여 직접점유자와 간접점유자가 있는 경우, 그에 대한 점유, 사용으로 인한 부당이득반환의무는 서로 중첩되는 부분에 관해서는 부진정연대채무관계에 있다.", true, "▸ 물건의 직접점유자와 간접점유자가 있는 경우 점유·사용 부당이득반환의무는 부진정연대채무 [2011다76747]", "점유권"],
  ["042.ㄹ", "★ 상속에 의하여 점유권을 취득한 경우에 상속인은 새로운 권원에 의하지 않고도 피상속인의 점유를 떠나 자기만의 점유를 주장할 수 있다.", false, "▸ 피상속인이 타주점유라면 상속인도 타주점유 (즉, 상속인 분리 주장 ×) → 자주점유가 되기 위하여는 소유자에게 소유의 의사 있는 것을 표시하거나 새로운 권원에 의해 다시 소유의사로 점유 시작해야 [96다25319]", "점유권"],
  ["043.ㄴ", "직접점유자를 상대로 점유이전금지가처분을 한 뜻을 간접점유자에게 통지한 바 없는 경우, 가처분이 간접점유자에 대하여 시효중단의 효력을 가지지 않는다.", true, "▸ 직접점유자를 상대로 점유이전금지가처분을 한 뜻을 간접점유자에게 통지한 바 없다면 가처분은 간접점유자에 대하여 시효중단 효력 × ∴ 176조 [91다41064]", "점유권"],
  ["043.ㄷ", "★ 공동상속인 중 1인이 상속 부동산 전부를 점유하고 있는 경우에도 자신의 상속지분을 초과하는 부분에 대한 점유는 타주점유로 보아야 한다.", true, "▸ 공유 부동산은 공유자 1인이 전부 점유하더라도 특별한 사정이 없는 한 권원의 성질상 다른 공유자 지분비율 범위 내에서는 타주점유 [95다51861]", "점유권"],
  ["043.ㄹ", "★ 점유자가 유익비를 지출할 당시 계약관계 등 적법한 점유권원을 가진 경우, 계약관계 등의 상대방이 아닌 점유회복 당시의 소유자에 대하여 민법 제203조 제2항에 따른 비용의 상환을 구할 수 없다.", true, "▸ 203조 2항 유익비상환청구권은 점유자가 계약관계 등 적법하게 점유할 권리 가지지 않아 소유물반환청구에 응할 의무 있는 경우 성립 → 점유자는 비용 지출 당시 소유자 불문 점유회복 당시 소유자(=회복자)에 대해 비용상환청구 → 점유자가 유익비 지출 당시 계약관계 등 적법한 점유 권원 가진 경우라면 그 지출비용 상환은 그 계약관계 규율하는 법조항·법리가 적용, 점유자는 그 계약관계 상대방에 대하여 해당 법조항·법리로 비용상환청구권 행사할 수 있을 뿐 계약관계 상대방이 아닌 점유회복 당시 소유자에 대하여 203조 2항 비용상환청구 × [2001다64752]", "점유권"],
  ["043.ㅁ", "★ 점유자가 유익비를 지출할 당시 계약관계 등 적법한 점유권원을 가진 경우, 계약관계 등의 상대방이 아닌 점유회복 당시의 소유자에 대하여 민법 제203조 제2항에 따른 비용의 상환을 구할 수 없다.", true, "▸ 위 043.ㄹ 해설 참조 [2001다64752]", "점유권"],
  ["044.③", "★ 직접점유자가 간접점유자의 의사에 반하여 임의로 점유를 타인에게 양도하였다면 간접점유자는 자신의 점유침탈을 이유로 하여 그 양수인에게 점유회수의 소를 제기할 수 있다.", false, "▸ 횡령 등 직접점유자에 의한 간접점유 침해는 간접점유자의 의사에 반하더라도 점유물반환청구 × [92다5300]", "점유권"],
  ["045.⑤", "★ 점유자가 점유를 침탈당한 경우 침탈자에 대한 점유회수청구권의 행사기간은 출소기간이 아니다.", false, "▸ 204조 3항, 205조 2항 점유물반환청구 및 점유물방해제거청구에서의 제척기간은 반드시 그 기간 내 소 제기해야 하는 출소기간 O [2001다8097]", "점유권"],
  ["046.③", "★ 직접점유자가 임의로 점유를 타에 양도한 경우에는 점유이전이 간접점유자의 의사에 반한다 하더라도 간접점유자의 점유가 침탈된 것은 아니다.", true, "▸ 횡령 등 직접점유자에 의한 간접점유 침해는 간접점유자의 의사에 반하더라도 점유물반환청구 × [92다5300]", "점유권"],
  // 취득시효,
  ["047.ㄱ", "X 토지가 乙과 丙의 구분소유적 공유관계에 있는 경우, 乙의 특정 구분소유 부분에 대하여 취득시효를 완성한 점유자 甲은 乙뿐만 아니라 乙의 특정 구분소유 부분과 무관한 丙에 대하여도 그 토지 부분에 관한 각각의 공유지분에 대하여 취득시효 완성을 원인으로 한 소유권이전등기절차의 이행을 청구할 수 있다.", true, "▸ 구분소유적 공유 토지 중 1인 소유 특정 부분에 취득시효 완성되면 무관한 다른 공유자들도 그 부분에 관한 각각의 지분에 대하여 취득시효 원인 소유권이전등기의무 O ∴ 구분소유적 공유관계로 제3자에게 대항 × [97다1730]", "취득시효"],
  ["048.①", "취득시효의 대상이 미등기 부동산인 경우, 취득시효 기간이 완성되면 점유자는 등기 없이도 그 부동산의 소유권을 취득한다.", false, "▸ 취득시효 완성자는 소유권이전등기 마쳐야 소유권 취득(187조의 예외)\n제245조(점유로 인한 부동산소유권의 취득기간) ① 20년간 소유의 의사로 평온, 공연하게 부동산을 점유하는 자는 등기함으로써 그 소유권을 취득한다.", "취득시효"],
  ["048.②", "★ 취득시효 완성으로 인한 소유권이전등기청구권의 양도에 대해서는 매매로 인한 소유권이전등기청구권에 관한 양도제한의 법리가 적용되지 않는다.", true, "▸ 매매로 인한 소유권이전등기청구권은 성질상 양도 제한되고 양도에 채무자 동의·승낙 요하며 양도통지만으로 채무자에게 대항 × ∴ 매매 소이등청구권은 이행과정에 신뢰관계 따르므로 [2000다51216]\n▸ 그러나 취득시효 완성으로 인한 소유권이전등기청구권은 양도에 채무자 동의·승낙 불필요(=통상의 채권양도) ∴ 채권자·채무자 사이 아무런 계약관계·신뢰관계나 반대급부의 무 없음 [2015다36167]", "취득시효"],
  ["048.④", "★ 취득시효 기간 완성 전에 부동산에 압류 또는 가압류가 이루어졌다고 하더라도 이로 인해 취득시효의 진행이 중단되지 않는다.", true, "▸ 247조 2항은 소멸시효 중단규정을 점유취득시효에 준용하고, 168조 2호는 소멸시효 중단사유로 '압류·가압류·가처분' 규정 → 압류·가압류는 점유취득시효 중단사유 × ∴ 취득시효기간 완성 전에 부동산에 압류·가압류 조치 이뤄져도 종래 점유상태 계속 파괴된 것은 ×, 압류·가압류는 금전채권의 강제집행·보전 수단일 뿐 [2018다296878]", "취득시효"],
  ["048.⑤", "★ 양도담보권설정자가 부동산을 양도담보로 채권자에게 제공한 뒤 이를 20년간 소유의 의사로 평온·공연하게 점유하였다고 하더라도, 양도담보권자에게 점유취득시효의 완성을 이유로 담보 목적으로 경료된 소유권이전등기의 말소를 구할 수 없다.", true, "▸ 점유취득시효는 원시취득, 원소유자 소유권에 가해진 제한에 영향 받지 않는 완전한 소유권 취득 → 그러나 진정한 권리자 아니었던 채무자·물상보증인이 채권자에게 저당권설정등기·소유권이전등기(양도담보)를 마쳐준 후 시효취득한 경우는, 시효취득으로 저당권자·양도담보권자의 권리는 소멸 × ∴ 채무자·물상보증인은 변제의무·책임 등 이미 저당권·양도담보권의 존재를 용인하고 점유해 온 것 [2014다21649]", "취득시효"],
  ["049.②", "★ X 토지에 관하여 취득시효가 완성되어 점유자 앞으로 소유권이전등기가 마쳐지면, 그 토지에 관하여 취득시효 완성 전에 체결되어 소유권이전등기청구권가등기에 의하여 보전된 매매예약상의 매수인의 지위는 소멸된다.", true, "▸ 점유취득시효 20년 시효기간 경과 후 등기함으로써 각종 제한에 영향받지 않는 완전한 소유권 취득 → 취득시효 기간 진행 중 체결되어 소유권이전등기청구권가등기에 의하여 보전된 매매예약상 매수인의 지위 소멸 → 그러나 등기를 하지 않았다면 이러한 부담 소멸되지 × [2004다31463] → 원시취득이므로 완성 전 모든 제한은 소멸", "취득시효"],
  ["049.④", "★ X 토지의 소유자 甲이 점유자 乙의 취득시효가 완성된 사실을 알면서 그 토지를 丙에게 처분하여 소유권이전등기를 마쳐줌으로써 乙에 대한 소유권이전등기의무가 이행불능이 된 경우, 甲의 乙에 대한 불법행위가 성립한다.", true, "▸ 점유자가 취득시효 주장하면서 소 제기하여 입증까지 마쳤다면 소유자로서는 그 사실 알 수 있었고, 그 후 소유자의 부동산 처분행위는 완성자에 대한 위법한 불법행위로서 손해배상책임 O [92다47892]", "취득시효"],
  ["049.⑤", "★ 시효취득의 대상이 된 부동산에 관하여 취득시효가 완성된 후 점유자가 소유권이전등기를 마치기 전에 제3자가 원인무효의 소유권이전등기를 마친 경우, 점유자는 취득시효 완성 당시의 소유자를 대위하여 위 원인무효 등기의 말소를 구함과 아울러 위 소유자를 상대로 취득시효 완성을 원인으로 한 소유권이전등기를 구할 수 있다.", true, "▸ [2002다43417] → 완성 후 취득해도 무효라면 대위 말소는 동일", "취득시효"],
  ["050.ㄴ", "甲은 乙 소유의 X토지를 20년간 소유의 의사로 평온·공연하게 점유하여 2018. 1. 1. 점유취득시효가 완성되었다.§★ 2018. 4. 4. 乙은 甲의 X토지에 관한 취득시효 완성 사실을 알지 못하고서 K은행으로부터 3억 원을 차용하고 당일 K은행에게 근저당권설정등기를 마쳐준 후 甲이 취득시효 완성을 이유로 X토지에 관하여 소유권이전등기를 마쳤다면, 甲은 X토지에 설정된 근저당권의 피담보채무를 변제하고 乙에게 변제금액의 구상을 청구할 수 있다.", false, "▸ 원소유자가 취득시효 완성 이후 그 등기 전에 처분·제한물권설정·현상변경 등 소유자로서 권리 행사해도 불법행위 ×, 완성자는 완성 후 소유권·제한물권을 취득한 제3자에 대해 취득시효 완성 및 소급효로 대항 × → 결국 시효취득자는 원소유자의 적법한 권리행사로 인한 현상변경·제한물권 이뤄진 상태에서 등기에 의해 소유권 취득 →시효취득자가 원소유자에 의하여 설정된 근저당권의 피담보채무를 변제한 경우라도 원소유자에게 대위변제를 이유로 구상권 ×, 부당이득반환청구 × ∴ 그 변제행위는 시효취득자가 용인해야 할 토지상 부담 제거하여 완전한 소유권 확보하는, 자신의 이익을 위한 행위 [2005다75910]", "취득시효"],
  ["050.ㄷ", "甲은 乙 소유의 X토지를 20년간 소유의 의사로 평온·공연하게 점유하여 2018. 1. 1. 점유취득시효가 완성되었다.§★ 2010. 4. 1. 甲이 X토지의 진정한 소유자가 아님에도 丙으로부터 금원을 차용하면서 X토지에 관하여 丙 명의로 저당권설정등기를 마쳐준 경우, 2018. 4. 5. 甲이 취득시효완성을 이유로 X토지에 관하여 소유권이전등기를 마쳤다면, 이는 원시취득이므로 丙 명의의 위 저당권은 소멸하게 된다.", false, "▸ 점유취득시효는 원시취득, 원소유자 소유권에 가해진 제한에 영향 받지 않는 완전한 소유권 취득 → 그러나 진정한 권리자 아니었던 채무자·물상보증인이 채권자에게 저당권설정등기·소유권이전등기(양도담보)를 마쳐준 후 시효취득한 경우는, 시효취득으로 저당권자·양도담보권자의 권리는 소멸 × [2014다21649]", "취득시효"],
  ["051.①", "★ 법원은 당사자의 주장에 구애됨이 없이 소송자료에 의하여 부동산 취득시효의 요건인 진정한 점유의 개시시기를 인정할 수 있다.", true, "▸ 취득시효 기산점 및 점유권원은 주요사실 ×, 간접사실 O → 법원으로서는 당사자 주장에 구속되지 않고 소송자료로 인정할 수 O [82다565, 97다34037]", "취득시효"],
  ["051.③", "★ 취득시효기간 만료 당시의 점유자로부터 부동산을 양수하여 점유를 승계한 현점유자는 전 점유자의 소유자에 대한 소유권이전등기청구권을 대위행사할 수 있을 뿐, 전 점유자의 취득시효 완성의 효과를 주장하여 직접 자기에게 소유권이전등기를 청구할 권원은 없다.", true, "▸ 전 점유자의 점유를 승계한 자는 점유 자체와 하자만 승계, 그 점유로 인한 법률효과까지 승계 × → 취득시효기간 만료 당시의 점유자로부터 부동산을 양수하여 점유 승계한 현점유자는, 자신의 전 점유자에 대한 (매매 원인) 소이등청구권을 보전하기 위해, 전 점유자의 소유자에 대한 (취득시효 원인) 소이등청구권을 대위행사 할 수 있을 뿐 → 전 점유자 취득시효 완성 효과를 주장하여 직접 자기에게 소유권이전등기 청구 × [93다47745]", "취득시효"],
  ["052.①", "★ 건물공유자 중 일부만이 당해 건물을 점유하고 있더라도 이로써 건물공유자들 전원이 건물부지에 대한 공동점유를 하는 것이 되고, 그 건물부지에 대한 점유취득시효가 완성되면, 그 취득시효 완성을 원인으로 한 소유권이전등기청구권은 당해 건물의 공유지분비율과 같은 비율로 건물공유자들에게 귀속된다.", true, "▸ 건물공유자 중 일부만 당해 건물 점유하여도 그 부지는 건물 소유 위하여 공유명의자 전원이 공동점유하는 것 O → 건물공유자들이 건물부지 공동점유로 인해 건물부지에 대한 소유권 시효취득한 경우 취득시효 완성 원인 소유권이전등기청구권은 당해 건물 공유지분비율과 같은 비율로 건물 공유자들에게 귀속 O [2002다57935]", "취득시효"],
