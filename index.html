  ["133.③", "★ 도급인 소유의 부동산에 경매개시결정의 기입등기가 경료되어 있어 압류의 효력이 발생한 이후에 수급인이 도급인으로부터 위 부동산의 점유를 이전받고 이에 관한 공사 등을 시행함으로써 도급인에 대한 공사대금채권 및 이를 피담보채권으로 한 유치권을 취득한 경우, 부동산을 점유한 수급인은 그 부동산에 관한 경매절차의 매수인에게 유치권으로 대항할 수 없다.", true, "▸ 강제경매개시결정 기입등기가 마쳐져 압류 효력 발생한 이후에 채무자가 위 부동산에 관한 공사대금채권자에게 '점유 이전'함으로써 유치권을 취득하게 한 경우, 공사대금채권자는 유치권을 내세워 경매절차 매수인에게 대항 × [2005다22688]", "유치권"],
  ["134.②", "★ 부동산에 가압류등기가 경료되어 있을 뿐 현실적인 매각절차가 이루어지지 않고 있는 상황에서 적법·유효한 법률행위에 따른 채무자의 점유 이전으로 인하여 제3자가 유치권을 취득하게 될 경우 이를 가압류 채권자에게 대항할 수 없는 처분행위로 볼 수 있다.", false, "▸ 부동산 가압류등기의 처분금지효에서 말하는 '처분행위'란 당해 부동산 양도, 용익물권·담보물권 설정행위 O, 점유이전 같은 사실행위는 × → 부동산에 '가압류' 등기만 경료되고 현실 매각절차 이뤄지지 않은 상황에서는 채무자의 점유이전으로 제3자가 유치권 취득하게 되어도 '처분행위'라 할 수 × → 경매절차 매수인에게 유치권으로 대항 O → 당원 판례는 경매개시결정 기입등기로 '압류' 효력 생긴 이후에 점유이전으로 유치권 취득하게 하는 것을 처분행위로 보나, 이는 경매절차 공정성·신뢰를 현저히 훼손하거나 민사집행제도 운영에 심각한 지장 줄 우려 때문에 처분행위로 봄이 타당하다는 취지 [2009다19246]", "유치권"],
  ["135.⑤", "★ 유치권을 취득하기 위한 乙의 점유는 직접점유이든 간접점유이든 관계가 없으나, 乙이 직접점유자인 甲으로부터 간접점유를 취득한 경우에는 乙은 유치권을 행사할 수 없다.", true, "▸ 유치권자의 점유는 간접점유도 무방하나 만일 직접점유자가 채무자라면 × [2007다27236]", "유치권"],
  ["136.⑤", "★ 甲이 乙에게 토지를 매도하고 매매대금을 다 지급받지 않은 상태에서 소유권이전등기를 마쳐주었으나 토지를 계속 점유하고 있다고 하더라도 甲은 그 매매대금 채권을 피담보채권으로 하여 乙로부터 토지를 매수한 丁에게 유치권을 주장할 수 없다.", true, "▸ 매매에서 매도인의 목적물인도의무에 관하여 동시이행 항변권을 인정하는 것 외에 유치권까지 인정할 필요 × → 매도인이 매수인에게 등기마쳐 소유권 이전했다면 선이행으로 인한 위험은 스스로 감수해야 → 매매대금 일부 지급받지 못하였도 매수인이나 그로부터 소유권 취득한 제3자에게 유치권 주장 × [2011마2380] → 다만 제3자가 아닌 매수인이 소유권에 기해 인도를 구한다면 매도인은 213조 단서로서 동시이행항변권을 행사 O", "유치권"],
  ["137.④", "★ 乙이 신축건물의 경매를 신청한 경우, 乙은 배당절차에서 일반채권자와 동일한 순위로 배당받을 수 있다.", true, "▸ 유치권에 의한 경매도 강제경매 및 담보권 실행 경매와 마찬가지로 목적부동산 위 부담 소멸을 법정매각조건으로 실시(소멸주의), 일반채권자의 배당요구 허용, 유치권자는 일반채권자와 동일한 순위로 배당 ∴ ① 민집법 91조 2·3항, 268조는 강제경매·임의경매에서 소멸주의의 원칙으로, ② 민법 322조 1항 유치권자의 경매청구권 규정은 유치권 의한 경매도 채권자·채무자 존재 전제로 채권 실현·만족 위한 경매를 상정, ③ 인수주의의 취할 경우 절차나 범위 규정 없어 경락인 법적 지위 매우 불안정 → 단 집행법원은 부동산 위의 이해관계 살펴 위와 같은 법정매각조건과 달리 매각조건 변경결정으로 경락인이 인수하도록 할 수도 O [2010마1059]", "유치권"],
  ["137.⑤", "★ 乙이 신축건물의 점유를 계속하는 경우, 甲에 대한 공사대금채권의 소멸시효는 진행하지 않는다.", false, "▸ 제326조(피담보채권의 소멸시효) 유치권의 행사는 채권의 소멸시효의 진행에 영향을 미치지 아니한다.", "유치권"],
  ["SS16.①", "★ 부동산 실권리자명의의 등기에 관한 법률이 적용되는 계약명의신탁에서 명의수탁자가 당사자가 되어 명의신탁약정이 있다는 사실을 알지 못하는 소유자와 부동산에 관한 매매계약을 체결한 뒤 수탁자 명의로 소유권이전등기를 마친 경우, 명의신탁자의 명의수탁자에 대한 매매대금 상당의 부당이득반환청구권은 부동산 자체로부터 발생한 채권이 아닐 뿐만 아니라 부동산의 반환청구권과 동일한 법률관계나 사실관계로부터 발생한 채권에도 해당하지 않으므로 유치권 성립요건으로서의 목적물과 채권 사이의 견련관계를 인정할 수 없다.", true, "▸ 계약명의신탁에서 명의신탁자가 수탁자에 대하여 가지는 매수대금 상당의 부당이득반환청구권은 부동산 자체로부터 발생한 채권이 아닐 뿐만 아니라 부동산의 반환청구권과 동일한 법률관계나 사실관계로부터 발생한 채권에도 해당하지 않으므로 유치권 성립요건으로서의 목적물과 채권 사이의 견련관계 인정 불가 [2008다34828]", "유치권"],
  ["SS16.⑤", "★ 토지에 대한 담보권 실행 등을 위한 경매가 개시된 후 그 지상건물에 가압류등기가 경료되었는데, 甲이 채무자인 乙에게서 건물 점유를 이전받아 그 건물에 관한 공사대금채권을 피담보채권으로 한 유치권을 취득하였고, 그 후 건물에 대한 강제경매가 개시되어 丙이 토지와 건물을 낙찰받은 경우, 건물에 가압류등기가 경료된 후 乙이 甲에게 건물 점유를 이전한 것은 처분행위에 해당하지 않으므로, 甲은 丙에게 건물에 대한 유치권을 주장할 수 있다.", true, "▸ 부동산에 '가압류' 등기만 경료되고 현실 매각절차 이뤄지지 않은 상황에서는 채무자의 점유이전으로 제3자가 유치권 취득하게 되어도 '처분행위'라 할 수 × → 경매절차 매수인에게 유치권으로 대항 O [2009다19246]", "유치권"],
  ["SS17.②", "乙의 유치권 소멸청구로 丙의 유치권이 소멸하면 丙은 乙에게 즉시 X부동산을 인도하여야 한다.", true, "▸ 324조 2항 위반한 임대행위 있는 '후' 유치물 소유권을 취득한 제3자도 유치권소멸청구 O ∴ 324조 유치권소멸청구는 유치권자 선관주의의무 위반에 대한 제재로서 채무자나 유치물 소유자를 보호하기 위한 규정 [2019다295278]\n→ 설문에서 유치권자 丙이 14. 2. 1. 무단임대를 한 이후인 25. 5. 1. 乙이 소유권을 취득하였으므로 위 판례 쟁점이고, 乙은 소멸청구 O (현재 丁이 가족들과 직접점유 하고 있으므로 제213조 인도청구에 응할 의무도 있음)", "유치권"],
  ["SS17.③", "乙의 유치권 소멸청구로 丙의 유치권이 소멸하더라도 유치권 소멸 전까지는 丙에게 유치권자로서의 과실수취권이 인정되므로 丙이 직접 거주한 기간 동안의 사용수익 액을 피담보채권 변제에 충당하였다면 그 범위에서 乙의 부당이득반환청구권은 인정되지 않는다.", true, "▸ 유치권자는 유치권 소멸 전까지는 과실을 수취하여 피담보채권에 충당할 수 있으므로, 소유자는 그 충당한 부분에 대해 부당이득반환 구할 수 없음(제14회 기록형 출제)", "유치권"],
  ["SS17.④", "乙의 유치권 소멸청구로 丙의 유치권이 소멸하더라도 유치권 소멸 전까지는 丙에게 유치권자로서의 과실수취권이 인정되므로 丙이 직접 거주한 기간 동안의 사용수익 액을 피담보채권 변제에 충당하였다면 그 범위에서 乙의 부당이득반환청구권은 인정되지 않는다.", true, "▸ 위 SS17.③ 해설 참조", "유치권"],
  ["SS17.⑤", "★ 丙의 무단전대로 인한 부당이득액은 특별한 사정이 없는 한 전세금 1억 원에 대한 법정이자 상당액이다.", true, "▸ 유치권자가 유치물에 관해 제3자와 전세계약 체결하여 전세금 수령했다면 이득은 전세금 이용가능성(=전세금에 대한 법정이자), 추상적으로 산정된 차임 상당액 × [2009다32324]", "유치권"],
  ["SS18.ㄱ", "★ 유치권자의 점유는 직접점유이든 간접점유이든 묻지 않지만, 직접점유자가 자신의 점유를 간접점유자의 반환청구권을 승인하면서 행하는 것만으로는 점유매개관계가 인정되지 않으므로 유치권이 인정되지 않는다.", false, "▸ 간접점유 인정하려면 간접점유자와 직접점유자 사이 일정한 법률관계(점유매개관계) 필요 → 점유매개관계는 직접점유자가 자신의 점유를 간접점유자의 반환청구권을 승인하면서 행하는 경우에 인정 [2011다61424]", "유치권"],
  ["SS18.ㄴ", "★ 저당권자는 담보목적물의 경매절차에서 유치권 부존재 확인을 구할 법률상 이익이 있다.", true, "▸ [민소] 저당권자는 담보목적물의 경매절차에서 유치권 부존재 확인을 구할 법률상 이익이 있음 ∴ 유치권 존재를 알지 못한 매수인으로부터 담보책임 추급당할 우려 있어 법률상 지위 불안정 [2019다247385]", "유치권"],
  ["SS18.ㄹ", "★ 저당물의 제3취득자가 그 부동산의 보존, 개량을 위하여 필요비 또는 유익비를 지출하여 민법 제367조의 비용상환청구권을 취득한 경우, 제3취득자는 위 비용상환청구권을 피담보채권으로 하여 유치권을 행사할 수 있다.", false, "▸ 제3취득자가 367조에 의하여 비용상환청구권 우선상환을 받으려면 저당부동산의 경매절차에서 배당을 요구하는 방법으로 하여야 하고, 유치권으로 행사할 수 × [2007다27655]", "유치권"],
  ["138.②", "채무자 아닌 유치물의 소유자는 다른 상당한 담보를 제공하고 유치권의 소멸을 청구할 수 없다.", false, "▸ '채무자'는 상당한 담보 제공하고 유치권 소멸 청구(327조) → 채무자뿐 아니라 유치물의 '소유자'도 O → 유치물 가액이 피담보채권액보다 많을 경우는 피담보채권액 해당하는 담보 제공 O, 유치물 가액이 피담보채권액보다 적을 경우는 유치물 가액 해당하는 담보 제공 O [2019다216077]", "유치권"],
  ["138.④", "★ ■보충 유치권에 의한 경매절차가 정지된 상태에서 그 목적물에 대한 강제경매 또는 담보권 실행을 위한 경매절차가 진행되어 매각이 이루어지면 그 유치권은 소멸한다.", false, "▸ 유치권 의한 경매절차 정지된 상태에서 목적물에 강제경매나 담보권 실행 경매 진행되면, 유치권 소멸하지 × ∴ 부동산 강제경매나 담보권 실행 경매 절차에서의 매수인은 유치권의 피담보채권을 변제할 책임(민집법 91조 5항, 268조), 유치권 의한 경매절차는 목적물에 강제경매나 담보권 실행 경매절차 개시된 경우 정지(민집법 274조 2항) [2011다35593]", "유치권"],
  ["138.⑤", "유치권의 소멸을 위하여 다른 담보물을 제공하는 경우, 유치물 가액이 피담보채권보다 많은 경우에는 피담보채권액에 해당하는 담보를 제공하면 되고, 유치물 가액이 피담보채권액보다 적을 경우에는 유치물 가액에 해당하는 담보를 제공하면 된다.", true, "▸ 유치물 가액이 피담보채권액보다 많을 경우는 피담보채권액 해당하는 담보 제공 O, 유치물 가액이 피담보채권액보다 적을 경우는 유치물 가액 해당하는 담보 제공 O [2019다216077]", "유치권"],
  ["139.②", "임차인이 임차목적물을 임대차계약에 따라 사용하지 못한 것을 이유로 하는 손해배상청구권은 임차목적물에 관하여 생긴 채권이라 할 수 없다.", true, "▸ 임대차 목적물을 목적대로 사용하지 못한 손해배상청구권은 임대차목적물에 관하여 생긴 채권 ×, 유치권 × [75다1305]", "유치권"],
  ["140.ㄴ", "★ 경매절차에서 유치권이 주장되지 아니한 경우에는, 담보목적물이 매각되어 그 소유권이 이전됨으로써 근저당권이 소멸하였더라도 배당을 받은 채권자는 유치권의 존재를 알지 못한 매수인으로부터 담보책임을 추급당할 우려가 있고, 채권자인 근저당권자로서는 위 불안을 제거하기 위하여 유치권 부존재 확인을 구할 법률상 이익이 있다.", true, "▸ [민소] 경매절차에서 유치권 주장되지 않은 경우 → 채권자인 근저당권자는 매각으로 근저당권 소멸되더라도 유치권부존재 확인의 이익 O ∴ 유치권 존재를 알지 못한 매수인으로부터 담보책임 추급당할 우려 있어 법률상 지위 불안정 [2019다247385]", "유치권"],
  ["140.ㄷ", "★ 유치권은 법정담보물권이기는 하나 채권자의 이익보호를 위한 채권담보의 수단에 불과하므로 이를 포기하는 특약은 유효하고, 유치권을 사전에 포기한 경우 다른 법정요건이 모두 충족되더라도 유치권이 발생하지 않는 것과 마찬가지로 유치권을 사후에 포기한 경우 곧바로 유치권은 소멸한다.", true, "▸ 유치권 포기 특약 유효 → 사전포기 하면 다른 법정요건 충족해도 불발생 O → 유치권 포기·소멸 사실은 제3자도 주장 O [2014다52087]", "유치권"],
  ["141.③", "■보충 유치권자의 신청으로 부동산에 대하여 유치권에 의한 경매절차가 개시되어 진행되던 중 근저당권자의 신청으로 같은 부동산에 대하여 담보권 실행을 위한 경매절차가 개시되면, 유치권에 의한 경매절차는 정지된다.", true, "▸ 민사집행법 제274조(유치권 등에 의한 경매) ② 유치권 등에 의한 경매절차는 목적물에 대하여 강제경매 또는 담보권 실행을 위한 경매절차가 개시된 경우에는 이를 정지하고, 채권자 또는 담보권자를 위하여 그 절차를 계속하여 진행한다.", "유치권"],
  ["141.④", "★ 유치권자의 신청으로 부동산에 대하여 유치권에 의한 경매절차가 개시된 경우, 일반채권자도 그 경매절차에서 배당요구를 할 수 있고, 유치권자는 일반채권자와 동일한 순위로 배당을 받을 수 있다.", true, "▸ 유치권에 의한 경매도 강제경매 및 담보권 실행 경매와 마찬가지로 목적부동산 위 부담 소멸을 법정매각조건으로 실시(소멸주의), 일반채권자의 배당요구 허용, 유치권자는 일반채권자와 동일한 순위로 배당 [2010마1059]", "유치권"],
  ["141.⑤", "★ ■보충 채무자 소유의 부동산에 경매개시결정의 기입등기가 경료되어 압류의 효력이 발생한 이후에 채권자가 채무자로부터 위 부동산의 점유를 이전받고 이에 관한 공사를 시행함으로써 공사대금채권 및 이를 피담보채권으로 한 유치권을 취득한 경우, 채권자는 위 유치권을 내세워 위 부동산에 관한 경매절차의 매수인에게 대항할 수 없고, 이는 채권자가 위 부동산에 경매개시결정의 기입등기가 경료된 사실을 알지 못하였던 경우에도 마찬가지이다.", true, "▸ 채권자가 위 부동산에 경매개시결정기입등기 경료 여부를 알았는지 과실이 있는지 여부 등은 유치권으로 매수인에게 대항할 수 없다는 결론에 아무런 영향 없음 [2006다22050]", "유치권"],
  ["142.ㄴ", "★ 유치권자로부터 유치물을 임차하여 이를 직접 점유하는 자는 유치권자와의 임대차계약 종료 후에도 소유자의 소유물반환청구를 거부할 수 있다.", true, "▸ 점유매개관계 이루는 임대차계약 종료 이후에도 직접점유자가 목적물을 점유한 채 반환하지 않고 있다면 간접점유자의 점유매개관계 존속 → 간접점유자 임대인의 유치권 O [2019다205329]", "유치권"],
  ["143.③", "★ 乙이 丙에게 X를 적법하게 임대하여 점유하게 한 경우, 임대차계약이 적법하게 해지된 후 丙이 임차물의 반환을 거부하면 乙은 더 이상 甲에게 유치권을 주장할 수 없다.", false, "▸ 점유매개관계 이루는 임대차계약 종료 이후에도 직접점유자가 목적물을 점유한 채 반환하지 않고 있다면 간접점유자의 점유매개관계 존속 → 간접점유자 임대인의 유치권 O [2019다205329]", "유치권"],
  ["144.④", "★ 甲이 공사를 완료한 이후에 丙이 X건물의 소유권을 취득한 경우에 丙은 자신의 甲에 대한 대여금채권과 유치권의 피담보채권인 공사대금채권을 상계할 수 없다.", true, "▸ 유치권자가 있는 아파트의 경락인은 유치권자에 대한 차임 상당 부당이득반환채권을 자동채권으로 하고 유치권자의 종전 소유자에 대한 유익비상환채권(피담보채권)을 수동채권으로 하여 상계 × ∴ 수동채권으로 상대방의 상계자에 대한 채권이 아닌 제3자에 대한 채권을 허용하면 상대방이 제3자로부터 현실급부 받을 이익 침해 [2010다101394]", "유치권"],
  ["145.②", "★ 부동산에 관하여 체납처분에 의한 압류가 되어 있는 경우, 그 부동산에 관하여 경매개시결정등기가 되기 전에 유치권을 취득한 자는 경매절차의 매수인에게 그 유치권을 행사할 수 있다.", true, "▸ 국세징수법의 체납처분압류가 된 부동산이어도 경매개시결정등기 되기 전에 민사유치권 취득했다면 유치권자가 경락인에 대항 O ∴ 체납처분압류는 경매개시결정 따른 압류와 다름 [2009다60336]", "유치권"],
  ["146.③", "★ 건물의 신축공사를 도급받은 수급인이 사회통념상 독립한 건물이라고 볼 수 없는 정착물이 토지에 부합된 상태에서 공사가 중단된 경우에 위 공사금 채권에 기하여 토지에 대한 유치권을 행사할 수 없다.", true, "▸ 독립한 건물의 요건 갖추기 전에 공사 중단된 경우 ⓐ 정착물에 유치권 × (∴ 토지의 부합물에 불과), ⓑ 토지에 유치권 × (∴ 공사대금은 토지에 관하여 생긴 것 ×) [2007마98]", "유치권"],
  ["147.④", "★ 상대방의 목적물 인도청구의 소에 대하여 유치권자가 유치권을 행사하여 목적물의 인도를 거절하는 경우에 법원은 원고패소의 판결을 하여야 한다.", false, "▸ 인도청구소송에서 피고의 유치권 항변 인용되면 법원은 물건에 관하여 생긴 채권의 변제와 상환으로 인도 명해야 [69다1592] → 상환이행판결", "유치권"],
  ["기타07", "甲은 乙과 丙이 각 2/3, 1/3 지분을 공유하되, 乙이 단독으로 사용하고 있는 주거용 건물에 관하여 乙과 사이에 건물보수공사 도급계약을 체결한 다음, 乙로부터 건물을 인도받아 3,000만 원 상당의 공사비를 들여 공사를 마쳤다. 위 공사로 건물의 가치가 3,000만 원 상당 증가하였다.§★ 甲으로부터 건물을 임차하여 입주하고 전입신고까지 마친 丁은 甲이 乙로부터 공사비를 다 지급받을 때까지 乙에 대하여 건물 인도를 거절할 수 있다.", false, "▸ 유치권자가 채무자 승낙 없이 유치물 임대하면 임차인은 소유자나 경락인에게 임대 효력 주장 × [2002마3516] → 권한 없는 자의 임대로 임대차가 위법하므로 전입신고 등 임차권의 대항력의 무의미함", "유치권"],
  // 질권,
  ["148.ㄱ", "甲이 乙에 대한 임대차보증금반환채권에 관하여 丙에 대한 금전채무의 담보를 위하여 丙과 질권설정계약을 체결하고 이 사실을 확정일자 있는 증서로 乙에게 통지하였다.§甲이 저당권으로 담보되는 임대차보증금반환채권에 대하여 丙에게 질권을 설정한 경우, 질권의 부기등기에 채권의 지연손해금을 별도로 기재하지 않았다면, 이는 저당권부 질권의 피담보채권 범위에 포함되지 않는다.", false, "▸ 지연손해금을 별도로 등기부 기재하지 않았더라도 근저당권부 질권의 피담보채권의 범위가 등기부 기재된 약정이자에 한정되지는 ×, 지연손해금도 O ∴ 335조로 권리질권에 준용되는 334조(피담보채권 범위, 원·이·위·실·채·보·하), 부등법 76조 1항(지연손해금은 등기사항 아님) [2020다296840]", "질권"],
  ["148.ㄴ", "甲이 乙에 대한 임대차보증금반환채권에 관하여 丙에 대한 금전채무의 담보를 위하여 丙과 질권설정계약을 체결하고 이 사실을 확정일자 있는 증서로 乙에게 통지하였다.§★ 乙이 丙의 동의 없이 甲 채권과 상계하여 소멸시켜도 丙은 여전히 乙에게 직접 채무의 변제를 청구할 수 있다.", true, "▸ 질권설정자가 제3채무자에게 질권 설정 사실 통지하거나 제3채무자 승낙 → 제3채무자가 질권자의 동의 없이 질권의 목적인 채무를 변제하거나 질권설정자와 상계합의 하더라도 이로써 질권자에게 대항 × → 질권자는 제3채무자에 대하여 여전히 직접 채무 변제 청구 O [2016다265689]", "질권"],
  ["148.ㄷ", "甲이 乙에 대한 임대차보증금반환채권에 관하여 丙에 대한 금전채무의 담보를 위하여 丙과 질권설정계약을 체결하고 이 사실을 확정일자 있는 증서로 乙에게 통지하였다.§★ 甲 채권에 압류·전부명령이 내려진 경우, 명령이 乙에게 송달된 날보다 먼저 丙이 확정일자 있는 증서로 대항요건을 갖추었다면 乙은 전부채권자에게 변제했음을 丙에게 대항할 수 없다.", true, "▸ 질권설정자가 349조 1항으로 제3채무자에게 질권설정 사실 통지하거나 제3채무자 승낙하면 제3채무자가 질권자 동의 없이 질권 목적 채무 변제하더라도 질권자에게 대항 ×, 질권자는 여전히 제3채무자에게 직접 채무 변제 청구 O → 질권 목적 채권에 질권설정자의 채권자가 압류·전부명령 받았더라도 그보다 먼저 질권자가 확정일자 있는 통지·승낙 갖췄다면 전부채권자는 질권 설정된 채권을 이전받을 뿐 → 제3채무자는 전부채권자에게 변제한 사실로 질권자에게 대항 × [2018다21326]", "질권"],
  ["148.ㄹ", "甲이 乙에 대한 임대차보증금반환채권에 관하여 丙에 대한 금전채무의 담보를 위하여 丙과 질권설정계약을 체결하고 이 사실을 확정일자 있는 증서로 乙에게 통지하였다.§甲이 丙에게 질권을 설정한 후 甲의 임대차보증금반환채권 담보를 위해 乙 소유 부동산에 저당권이 설정된 경우, 丙이 저당권설정등기에 질권의 부기등기를 하지 않았다면 질권의 효력이 저당권에 미치지 않는다.", true, "▸ 무담보 채권에 질권 설정한 후 그 채권 담보하기 위해 저당권 설정된 경우, 저당권도 질권의 목적됨이 원칙이나, 질권자·설정자가 피담보채권만을 질권 목적으로 한 후 질권설정자가 질권자에게 제공할 의사 없이 저당권을 설정받는 등 특별한 사정이 있는 경우에는 저당권은 질권의 목적이 되지 않음 → 348조(저당권에 대한 질권과 부기등기) 저당권으로 담보한 채권을 질권의 목적으로 한 때에는 그 저당권등기에 질권의 부기등기를 하여야 그 효력이 저당권에 미침 [2016다235411]", "질권"],
  ["149.①", "★ 질권자는 질권의 목적이 된 채권과 지연손해금채권을 피담보채권 범위에 속하는 자기 채권액에 한하여 직접 추심하여 자기 채권의 변제에 충당할 수 있다.", true, "▸ 질권의 목적인 채권이 금전채권인 때 질권자는 자기채권 한도에서 그 채권 직접 청구 O, 채권질권은 그 채권의 지연손해금 등 부대채권에도 효력 미침 O [2003다40668]", "질권"],
  ["149.②", "★ 질권자가 제3채무자로부터 자기채권 초과한 금전을 지급받아 초과수령한 부분을 질권설정자에게 그대로 반환하였더라도 질권자는 제3채무자에 대해 부당이득반환의무를 부담하지 않는다.", true, "▸ 질권자가 제3채무자로부터 자기채권 초과하여 지급받은 부분은 위와 같은 급부 이뤄진 것 아니므로 부당이득반환 O → 그러나 질권자가 초과 지급 부분을 설정자에게 그대로 반환했다면 부당이득반환 × ∴ 질권자에게 실질적 이익 × [2012다92258]", "질권"],
  ["149.③", "★ 주택임차인이 임대차보증금반환채권에 질권을 설정하고 임대인이 질권설정을 승낙한 후 주택이 양도된 경우, 임대인은 임대차관계에서 탈퇴하고 임대차보증금반환채무를 면한다.", true, "▸ 주택임차인 대항력 갖춘 후 임대주택 소유권 양도되어 그 양수인이 주임법 3조 1, 4항에 의해 임대인 지위를 승계한 경우, 임대차보증금반환채무도 주택 소유권과 결합하여 일체로서 임대인 지위를 승계한 양수인에게 이전 O, 양도인의 임대인 지위나 보증금반환채무 소멸 O → 임차인이 임대차보증금반환채권에 질권을 설정하고 임대인이 질권설정을 승낙한 후 주택이 양도된 경우에도 임대인은 주임법 3조 4항에 의해 임대차관계에서 탈퇴, 임대차보증금반환채무를 면함 [2018다201610]", "질권"],
  ["149.④", "★ 질권의 목적인 채권의 양도행위는 특별한 사정이 없는 한 질권자의 이익을 해하는 변경에 해당하지 않으므로 질권자의 동의를 요하지 않는다.", true, "▸ 질권설정자는 질권자 동의 없이 질권의 목적인 권리를 소멸시키거나 질권자 이익을 해하는 변경 금지(352조) → 그러나 질권의 목적인 채권의 양도는 질권자의 동의 불필요 ∴ 채권양도는 '질권자 이익 해하는 변경'이 아님 [2003다55059]", "질권"],
  ["149.⑤", "★ 제3채무자가 질권설정 사실을 승낙한 후 질권자가 질권설정계약의 합의해지 사실을 통지했다면, 계약이 아직 해지되지 아니하였더라도 선의인 제3채무자는 설정자에게 대항할 수 있는 사유로 질권자에게 대항할 수 있다.", true, "▸ 채무자가 질권설정 승낙 후 질권설정계약 합의해지되면 질권자가 해지 통지해줘야 설정자가 채무자에 대항 → 해지되지 않았더라도 질권자가 해지 통지했다면 선의의 제3채무자는 설정자에게 대항할 수 있는 사유로 질권자에게 대항 O → 제3채무자의 악의는 질권자가 입증책임 [2013다76192]", "질권"],
  ["150.ㄷ", "★ 丙이 乙의 동의 없이 X채권을 甲에게 변제한 경우, 乙은 丙에 대하여 직접 채무의 변제를 청구할 수 있다.", true, "▸ 질권설정자가 제3채무자에게 질권 설정 사실 통지하거나 제3채무자 승낙 → 제3채무자가 질권자의 동의 없이 질권의 목적인 채무를 변제하더라도 이로써 질권자에게 대항 × → 질권자는 제3채무자에 대하여 여전히 직접 채무 변제 청구 O [2016다265689]", "질권"],
  ["150.ㅁ", "★ 乙이 丙에게 직접청구권을 행사하였고 자기채권을 초과하여 금전을 지급받은 경우, 특별한 사정이 없는 한 丙은 그 초과 지급 부분에 관하여 甲을 상대로 부당이득반환을 구하여야 한다.", true, "▸ 질권자가 제3채무자로부터 자기채권 초과하여 지급받은 부분은 부당이득반환 O → 그러나 질권자가 초과 지급 부분을 설정자에게 그대로 반환했다면 부당이득반환 × ∴ 질권자에게 실질적 이익 × [2012다92258]\n사안은 단순히 질권자의 채권보다 초과 지급했고 질권자가 설정자에게 반환한 사정 없으므로 설정자 甲이 아닌 질권자 乙을 상대로 부당이득반환 구해야", "질권"],
  ["151.ㄷ", "★ 담보가 없는 채권에 질권을 설정한 다음 그 채권을 담보하기 위하여 저당권이 설정된 경우 원칙적으로는 저당권도 질권의 목적이 되지만, 질권자와 질권설정자가 피담보채권만을 질권의 목적으로 하고 그 후 질권설정자가 질권자에게 제공할 의사 없이 저당권을 설정받는 등 특별한 사정이 있는 경우에는 저당권은 질권의 목적이 되지 않는다.", true, "▸ 무담보 채권에 질권 설정한 후 그 채권 담보하기 위해 저당권 설정된 경우, 저당권도 질권의 목적됨이 원칙이나, 질권자·설정자가 피담보채권만을 질권 목적으로 한 후 질권설정자가 질권자에게 제공할 의사 없이 저당권을 설정받는 등 특별한 사정이 있는 경우에는 저당권은 질권의 목적이 되지 않음 [2016다235411]", "질권"],
  ["152.④", "★ 금전채권의 질권자가 제3채무자에 대하여 직접청구권을 행사하여 입질채권을 추심하여 자기 채권의 변제에 충당한 경우, 입질채권의 발생원인인 계약관계에 무효 등의 흠이 있어 입질채권이 존재하지 않는 때에는 제3채무자는 원칙적으로 질권설정자에 대하여 부당이득반환을 구할 수 있을 뿐 질권자를 상대로 직접 부당이득반환을 구할 수 없다.", true, "▸ 입질채권 발생원인인 계약관계에 무효 등의 흠이 있어 입질채권이 부존재하더라도 제3채무자는 원칙적으로 질권설정자에 대하여 부당이득반환을 구할 수 있을 뿐 질권자를 상대로 직접 부당이득반환을 구할 수 × ∴ ⓐ 353조 직접청구권 행사는 질권자가 설정자의 대리인 같은 지위, 그 범위 내 제3채무자의 질권자에 대한 금전지급으로써 제3채무자의 설정자에 대한 급부 이루어짐, ⓑ 직접 부당이득반환청구 할 수 있다고 보면 자기 책임하 체결된 계약의 위험을 제3자인 질권자에게 전가하여 계약법 원리 반하고, 질권자가 설정자에 대해 가지는 항변권 등 침해 [2012다92258]", "질권"],
  ["SS질권1.①", "★ 질권의 목적인 채권에 대하여 질권설정자의 일반채권자의 신청으로 압류·전부명령이 내려진 경우, 그 명령이 제3채무자에게 송달된 날보다 먼저 질권자가 확정일자 있는 문서에 의해 민법 제349조 제1항에서 정한 대항요건을 갖추었다면, 제3채무자는 전부채권자에게 변제했음을 들어 질권채권자에게 대항할 수 없다.", true, "▸ 질권 목적 채권에 질권설정자의 채권자가 압류·전부명령 받았더라도 그보다 먼저 질권자가 확정일자 있는 통지·승낙 갖췄다면 전부채권자는 질권 설정된 채권을 이전받을 뿐 → 제3채무자는 전부채권자에게 변제한 사실로 질권자에게 대항 × [2018다21326]", "질권"],
  ["SS질권1.③", "★ 질권설정자는 채무변제기 전의 계약으로 질권자에게 변제에 갈음하여 질물의 소유권을 취득하게 하거나 법률에 정한 방법에 의하지 아니하고 질물을 처분할 것을 약정하지 못한다.", true, "▸ 제339조(유질계약의 금지) 질권설정자는 채무변제기 전의 계약으로 질권자에게 변제에 갈음하여 질물의 소유권을 취득하게 하거나 법률에 정한 방법에 의하지 아니하고 질물을 처분할 것을 약정하지 못한다.", "질권"],
  ["SS질권2.ㄱ", "X(채권질권자)는 A(질권설정자 겸 임차인)가 B(임대인)에 대해 갖는 국민임대주택 보증금반환채권에 질권을 설정받았고, A는 질권설정 사실을 B에게 확정일자부로 통지하였다. X와 A는 질권설정계약을 체결하면서 \"임대차계약 연장, 갱신 시 A는 X의 동의를 받아야 한다\"는 특약을 체결하였고, 이후 위 임대차계약에 대하여 묵시의 갱신이 이루어졌다.§X가 B를 대위하여 A와 B 사이의 임대차계약 갱신은 효력이 없다고 주장하는 경우 이 주장은 인용될 수 없다.", true, "▸ ㄱ, ㄴ 해설 : 임대차보증금반환채권의 근질권자가 갱신 없는 임대차 종료 주장하며 임대인을 대위하여 임차인 상대로 아파트 인도청구 → 임대인은 갱신거절 의사표시 없고 갱신존속 중임을 전제로 임차인에게 증액보증금 납부 청구했다는 점, 근질권설정계약상 채권자 동의 필요 규정은 채권자와 제3채무자 사이 독자적 사정이므로 주장 불가", "질권"],
  ["SS질권2.ㄴ", "★ 질권설정 통지를 받고도 A, B가 아무런 조치를 않아 임대차계약이 묵시적으로 갱신되었다면 이는 X에게 불이익하게 질권의 내용이 변경된 것이므로, 질권설정자의 권리처분제한에 관한 민법 제352조에 따라 묵시의 갱신은 X에 대하여 효력이 없다.", false, "▸ 임대인 갱신거절 없아 묵시적 갱신된 것은 질권 목적인 보증금반환채권 자체가 아닌 이를 발생시킨 기본적 계약관계에 관한 사항으로서 질권설정자(임차인)가 채권 자체 소멸시키거나 질권자 이익 해하는 변경 ×(352조 ×) [2020다223781]", "질권"],
  ["SS질권2.ㄷ", "★ 만약 A에 대한 일반채권자 Y가 A의 B에 대한 보증금반환채권을 가압류한 경우, A와 B 사이의 묵시적 갱신은 위 가압류의 처분금지효에도 불구하고 효력이 있다.", true, "▸ 임차인의 채권자로부터 임대보증금반환청구권에 압류 및 추심명령이 발령되었다는 사정은 임대인이 임대차계약의 갱신을 거절할 수 있는 특별한 사정이 아님 [2020다202371]", "질권"],
  ["SS질권2.ㄹ", "만약 묵시적 갱신이 이루어지지 않고 임대차계약이 종료하였다면, X는 B가 무자력이 아니더라도 B를 대위하여 A에게 목적물반환청구를 할 수 있다.", true, "▸ 임대차보증금 양수인이 임대인을 대위하여 임차인에 대해 임대차목적물 인도청구 할 때 임대인(채무자)의 무자력은 불요 ∴ 피보전채권과 피대위권리가 동시이행관계이므로 간·밀·현 O, 임대인 자력 무관하므로 [88다카4253]", "질권"],
  ["SS질권2.ㅁ", "★ B는 위 보증금에서 질권설정통지를 받은 후 발생한 A의 연체차임을 공제할 수 있으므로, 목적물을 계속 사용·수익하는 A는 보증금이 있다는 이유로 B의 A에 대한 연체차임 지급청구를 거절할 수 없다.", true, "▸ 임대차계약이 종료되었다 하더라도 목적물이 인도되지 않았다면 임차인은 보증금이 있음을 이유로 연체차임 지급을 거절할 수 × [99다24881]", "질권"],
  // 저당권,
  ["153.ㄴ", "★ 丙이 Y 토지의 보상금채권에 압류 등 조치를 취하지 아니하던 중 물상보증인 乙이 보상금을 수령하였다면 丙은 乙을 상대로 부당이득반환을 청구할 수 있다.", true, "▸ 물상대위권 행사 전에 저당물 소유자가 보상금 등을 이미 수령해버리면 더 이상 물상대위 × → 다만 그를 상대로 부당이득반환청구 O ∴ 저당권자는 최고액 범위 내 저당권 상실 손해 O, 소유자는 교환가치 양보할 지위인데 마치 부담 없던 상태 대가를 취득하는 이익 O, 인과관계 O [2008다17656] → 저당권자가 아닌 가압류권리자(물상대위 불가능)와 구별할 것", "저당권"],
  ["153.ㄷ", "★ 丙이 X 토지의 보상금채권에 압류 등 조치를 취하지 아니하던 중 甲의 채권자 戊가 그 보상금채권에 대하여 압류 및 전부 명령을 받아 보상금을 수령하였다면 丙은 戊를 상대로 부당이득반환을 청구할 수 있다.", false, "▸ 물상대위권 행사방법인 담보권 존재 증명서류 제출하여 채권압류 및 전부명령(민집법 273조) 혹은 배당요구(민집법 247조 1항)를 행사하지 않았다면 우선변제권 상실 → 다른 채권자가 그 보상금 혹은 변제공탁금으로부터 이득 얻었더라도 저당권자는 부당이득반환청구 × [2010다46756] → 위 지문의 '저당물 소유자'에 대한 부당이득반환청구 긍정 판례와 구별할 것", "저당권"],
  ["SS저당1.ㄱ", "★ 보증금이 수수된 저당부동산에 관한 임대차계약이 저당부동산에 대한 경매로 종료되었는데 저당권자가 차임채권 등에 대하여 민사집행법 제273조에 따른 채권집행의 방법으로 별개로 저당권을 실행한 경우에도 채권집행 절차에서 임차인이 실제로 차임 등을 지급하거나 공탁하지 아니하였다면, 잔존하는 차임채권 등의 상당액은 임차인이 배당받을 보증금에서 당연히 공제된다.", true, "▸ 359조의 '과실'에 저당부동산에 관한 차임채권 O → 다만, 차임채권 추심 또는 함께 매각하는 제도 × → 차임채권에 대한 저당권 실행은 저당권 효력 존속하는 동안 민집법 273조 채권에 대한 담보권실행 규정으로 저당부동산에 대한 경매절차와 별개 → 다만, 저당권자가 차임채권 등에 대하여 채권집행의 방법으로 저당권을 실행하지 않았거나 실행했더라도 임차인이 실제로 차임 등을 지급하거나 공탁하지 않았다면, 잔존하는 차임채권 등은 임차인이 배당받을 보증금 등에서 당연 공제 O [2015다230020]", "저당권"],
  ["SS저당1.ㄴ", "■보충 저당권의 양도에 있어서도 저당권을 이전할 것을 목적으로 하는 물권적 합의와 등기가 있어야 저당권이 이전된다고 할 것이고, 이때의 물권적 합의는 저당권의 양도인과 양수인뿐만 아니라 그 채무자나 물상보증인 사이에도 있어야 한다.", false, "▸ 저당권부 채권 양도에서 저당권 이전의 물권적 합의는 저당권의 양도·양수 당사자 사이에 있으면 족 O, 그 외에 그 채무자나 물상보증인 사이에까지 있을 필요는 × [2002다15412]", "저당권"],
  ["154.ㄴ", "★ 전세권을 목적으로 한 저당권이 설정된 경우 전세권의 존속기간이 만료되면, 전세권저당권자는 전세권 자체에 대하여 저당권을 실행할 수 없고 전세금반환채권에 대하여 물상대위권을 행사하여 전세금의 지급을 구하여야 한다.", true, "▸ 전세권이 기간만료로 종료하면 말소등기 없이 당연히 소멸 → 저당권자는 더이상 소유자에게 저당권 주장 ×, 전세권 자체에 대한 저당권 실행 × → 다만 저당권의 목적물인 전세권에 갈음하여 존속하는 전세금반환채권에 대하여 압류 및 추심명령·전부명령 받거나 제3자가 전세금반환채권에 대하여 실시한 강제집행절차에서 배당요구 하는 등 방법으로 권리 행사하여(370조, 342조, 민집법 273조) 비로소 전세금 지급 구할 수 O [98다31301]", "저당권"],
  ["154.ㄷ", "★ 동산 양도담보의 목적물이 소실되어 양도담보 설정자가 화재보험계약에 따른 보험금청구권을 취득한 경우, 동산 양도담보권자가 물상대위권의 행사로 보험금청구권에 대하여 압류 및 추심명령을 받아 추심권을 행사할 때, 특별한 사정이 없는 한 제3채무자인 보험회사는 양도담보 설정 후 취득한 양도담보 설정자에 대한 채권에 의한 상계로써 양도담보권자에게 대항할 수 없다.", true, "▸ 동산 양도담보권자가 물상대위권의 행사로서 양도담보설정자의 화재보험금청구권에 압류 및 추심명령을 얻어 추심권을 행사하는 경우, 제3채무자(보험회사)는 양도담보 설정 후 취득한 양도담보설정자에 대한 별개의 채권을 가지고 양도담보권자에게 상계로써 대항 × [2012다58609] = 전세금 저당권의 물상대위와 상계 판례", "저당권"],
  ["155.ㄷ", "★ 저당권의 실행으로 부동산이 경매된 경우에 그 부동산의 상용에 공하여진 물건은 누구의 소유인지 가릴 것 없이 해당 부동산의 매각대금을 완납한 매수인의 소유로 된다.", false, "▸ 저당권 실행된 경우 그 부동산의 부합물은 소유 불문하고 경락인 소유권 취득 O → 그러나 부동산의 상용에 공해진 물건일지라도 부동산 소유자 아닌 다른 사람 소유인 때에는 종물 ×, 저당권 효력 ×, 경락인 취득 × → 선의취득을 하려면 물건이 경매목적물로 되었고 경락인이 선의·무과실로 점유해야 [2007다36933]", "저당권"],
  ["156.①", "★ 丙이 乙에게 甲의 차용금채무를 변제한 후 甲에게 구상금을 청구할 경우, 그 구상권의 범위에는 면책된 날 이후의 법정이자가 포함된다.", true, "▸ 제441조(수탁보증인의 구상권) ① 주채무자의 부탁으로 보증인이 된 자가 과실없이 변제 기타의 출재로 주채무를 소멸하게 한 때에는 주채무자에 대하여 구상권이 있다.\n제425조(출재채무자의 구상권) ② 전항의 구상권은 면책된 날 이후의 법정이자 및 피할 수 없는 비용 기타 손해배상을 포함한다.", "저당권"],
  ["156.②", "★ 丁이 X 토지에 관하여 필요비를 지출하였더라도, 丁은 X 토지에 관한 저당권의 실행에 따른 경매 매각대금에서 그 필요비를 우선상환 받을 수는 없다.", true, "▸ 제367조(제3취득자의 비용상환청구권) 저당물의 제3취득자가 그 부동산의 보존, 개량을 위하여 필요비 또는 유익비를 지출한 때에는 제203조제1항, 제2항의 규정에 의하여 저당물의 경매대가에서 우선상환을 받을 수 있다.", "저당권"],
  ["156.③", "★ 丁은 X 토지에 관하여 저당권의 실행에 따른 경매절차의 경매인(競買人)이 될 수 있다.", true, "▸ 제363조(저당권자의 경매청구권, 경매인) ① 저당권자는 그 채권의 변제를 받기 위하여 저당물의 경매를 청구할 수 있다.", "저당권"],
  ["156.⑤", "★ 만약 甲이 戊의 차용금채무를 담보하기 위하여 X 토지에 乙 명의의 저당권을 설정해 주었는데 乙의 저당권 실행으로 丁이 X 토지에 대한 소유권을 잃었다면, 丁이 위 저당권의 피담보채무의 이행을 인수하였다는 등의 특별한 사정이 없는 한 丁은 戊에 대해 구상권을 행사할 수 있다.", true, "▸ 물상보증인으로부터 소유권 양수한 제3취득자는 저당권 실행되면 소유권을 상실하는 점에서 물상보증인과 유사한 지위 O → 물상보증인으로부터의 제3취득자가 변제하거나 저당권 실행으로 소유권 잃으면 물상보증인 구상권에 관한 370조, 341조 유추적용하여 보증채무 규정 의해 채무자에 대한 구상권 O [97다8403]", "저당권"],
  ["157.①", "저당권의 우선변제적 효력은 그 지상 건물에는 미치지 않고 저당권자가 우선변제를 받는 범위는 토지의 매각대금에 한정된다.", true, "▸ 제365조(저당지상의 건물에 대한 경매청구권) 토지를 목적으로 저당권을 설정한 후 그 설정자가 그 토지에 건물을 축조한 때에는 저당권자는 토지와 함께 그 건물에 대하여도 경매를 청구할 수 있다. 그러나 그 건물의 경매대가에 대하여는 우선변제를 받을 권리가 없다.", "저당권"],
  ["157.②", "저당권자가 건물의 매각대금에서 배당을 받으려면 적법한 배당요구를 하였거나 그 밖에 달리 배당을 받을 수 있는 채권으로서 필요한 요건을 갖추고 있어야 한다.", true, "▸ 토지·건물 공동저당 설정된 후 건물 철거되고 신축한 건물에 동순위 공동저당권 설정해 주지 않아 신축건물을 위한 법정지상권 없는 경우, 일괄매각 청구 O → 이때 토지 안분할 금액은 나대지로 평가 → 토지 저당권자가 건물 매각대금에서도 배당 받으려면 민집법 268조, 88조 의한 적법한 배당요구 등 필요한 요건 갖춰야 ∴ 365조 단서, 일괄매각 제도 취지 [2011다54587]", "저당권"],
  ["157.③", "★ 저당권설정자로부터 그 토지에 대한 용익권을 설정받은 자가 그 토지 위에 건물을 축조한 후 저당권설정자가 그 건물의 소유권을 취득하였다면 저당권자는 토지와 함께 그 건물에 대하여 경매를 청구할 수 있다.", true, "▸ 설정자가 건물 축조한 후 제3자에게 매도하여 제3자 소유한 경우 일괄경매청구권 × [99마146], 설정자로부터 용익권 취득한 자가 건물 축조하여 소유한 경우 일괄경매청구권 × → 그러나 설정자로부터 용익권 취득한 자가 축조한 건물을 설정자가 소유하게 되면 일괄경매청구권 O [2003다3850]", "저당권"],
  ["157.④", "★ 저당권설정자가 토지 위에 건물을 축조하고 그 건물을 제3자에게 매도하여 경매개시결정 당시 그 건물의 소유권이 제3자에게 귀속된 경우에도 그 건물에 대하여 일괄경매가 가능하다.", false, "▸ 설정자가 건물 축조한 후 제3자에게 매도하여 제3자 소유한 경우 일괄경매청구권 × [99마146]", "저당권"],
  ["157.⑤", "만약 저당권자가 토지에 대하여만 경매를 신청한 경우, 저당권자는 그 토지에 관한 경매기일 공고 시까지는 그 건물에 대하여 일괄경매의 추가신청을 할 수 있다.", true, "▸ 효과 : 저당권자는 토지와 함께 건물도 경매청구, 권리일 뿐 의무는 ×, 토지 경매 신청 후 경매기일 공고시까지 일괄경매 추가신청 O", "저당권"],
  ["SS저당2.ㄱ", "乙에게 일괄경매청구권이 인정되는 경우를 모두 고를 것§甲 소유 토지에 관하여 乙의 저당권이 설정될 당시 그 토지 위에 이미 건물의 축조가 진행되어 법정지상권의 성립이 인정되는 경우.", false, "▸ 토지에 저당권설정 당시 건물 존재 예측되고 사회경제적 관점에서 가치 유지해야 할 정도 축조 진행되었으면 × [86다카2856]", "저당권"],
  ["SS저당2.ㄴ", "★ 甲 소유 토지와 그 지상건물에 관하여 乙의 공동저당권이 설정된 후 甲이 그 건물을 철거하고 건물을 신축하여 소유하는 경우.", true, "▸ 토지·건물 공동저당 설정 후 건물 철거되고 신축한 건물에 토지 저당권과 동일한 순위 공동저당권 설정해 주는 등 특별한 사정이 없는 한, 신축건물을 위한 법정지상권 × ∴ 공동저당권자의 궁극적인 나대지의 교환가치 실현 기대 어긋나 불측의 손해 → 일괄매각청구 O [2011다54587]", "저당권"],
  ["SS저당2.ㄷ", "★ 甲 소유 나대지에 관하여 乙의 저당권이 설정된 후 甲이 그 토지 위에 건물을 신축하였고 건물소유권 보존등기를 마침과 동시에 丙에게 건물을 양도함으로써 경매개시결정 당시 건물의 소유권이 丙에게 귀속한 경우.", false, "▸ 설정자가 건물 축조한 후 제3자에게 매도하여 제3자 소유한 경우 일괄경매청구권 × [99마146] → 현재의 건물 소유자가 중요함(토지 저당권설정자가 건물 소유해야)", "저당권"],
  ["SS저당2.ㄹ", "★ 甲 소유 나대지에 관하여 乙의 저당권이 설정된 후 丙의 지상권이 설정되었고, 丙이 그 토지 위에 건물을 축조하여 甲에게 양도하고 그 소유권이전등기를 마쳐준 경우.", true, "▸ 설정자로부터 용익권 취득한 자가 건물 축조하여 소유한 경우 일괄경매청구권 × → 그러나 설정자로부터 용익권 취득한 자가 축조한 건물을 설정자가 소유하게 되면 일괄경매청구권 O [2003다3850]\n즉, 지문처럼 ① 법정지상권 불성립 + ② 설정자의 건물 소유라는 2가지 충족해야 일괄매각청구권 인정 O", "저당권"],
  ["158.ㄷ", "★ 저당권설정자로부터 점유권원을 설정받은 제3자의 점유가 저당권의 실현을 방해하기 위한 것이고, 그 점유에 의해서 저당권자의 교환가치의 실현 또는 우선변제청구권의 행사와 같은 저당권의 실현을 방해하는 사정이 있는 경우에는 저당권자는 제3자에 대하여 저당권에 기한 방해배제청구권을 행사할 수 있다.", true, "▸ 나대지에 저당권 설정 후 변제 못하여 저당권 실행이 예상되는데도 건물 신축공사 계속한다면, (법정지상권은 불성립하지만) 철거하기까지 별도 비용·시간 소요, 매수희망자 감소, 가격 하락으로 교환가치 실현 방해 염려 O → 저당권자는 저당권에 기한 방해배제청구로 공사중지청구 O (370조, 214조) [2003다58454]", "저당권"],
  ["159.ㄱ", "■보충 근저당권이 설정된 뒤 채무자 또는 근저당권설정자에 대하여 회생절차개시결정이 내려진 경우, 근저당권의 피담보채무는 특별한 사정이 없는 한 회생절차개시결정 시점을 기준으로 확정된다.", true, "▸ 근저당권 설정된 뒤 채무자 또는 근저당권설정자에 대해 회생절차개시결정이 내려진 경우, 근저당권 피담보채무는 특별한 사정 없는 한 회생절차개시결정 기준 확정 O → 확정 이후 새로운 거래관계로 발생한 원본채권은 담보되지 × [2018다286994]", "저당권"],
  ["159.ㄴ", "★ 근저당권자가 피담보채무의 불이행을 이유로 경매를 신청하면 경매신청 시에 피담보채권은 확정되며, 경매개시결정이 있은 후에 그 신청을 취하하더라도 채무확정의 효과는 번복되지 않는다.", true, "▸ 근저당권자의 경매신청, 압류신청시 → 절차 개시를 전제로 → 만일 신청 각하·취하되면 확정 효력 × → 그러나 경매절차 개시 후에 임의변제로 근저당권자가 경매신청 취하한 경우 확정 영향 無 [2001다73022]", "저당권"],
  ["159.ㄷ", "★ 공동근저당권자가 목적 부동산 중 일부 부동산에 대하여 제3자가 신청한 경매절차에 소극적으로 참가하여 우선배당을 받은 경우, 나머지 목적 부동산에 관한 근저당권의 피담보채권도 매수인이 매각대금을 지급한 때에 확정된다.", false, "▸ 공동근저당권자가 목적 부동산 중 일부 부동산에 대하여 제3자 신청한 경매절차에 소극적으로 참가하여 우선배당 받은 경우, 해당 부동산의 근저당권 피담보채권은 매각대금 완납시(= 해당 근저당권 소멸시) 확정 O, 그러나 나머지 부동산의 근저당권의 피담보채권은 확정 × (기본거래 종료나 채무자·물상보증인 파산선고 등의 다른 확정사유 발생하지 않는 한) ∴ 제3자 신청 경매절차에서 우선배당 받은 것만으로 기본거래 종료 ×, 담보가치 최대한 활용, 우선배당 받은 금액은 나머지 부동산 경매절차에서 우선변제권 없으므로 피담보채권액 증가해도 우선변제권 제한(예측불가 손해 없음) [2015다50637]", "저당권"],
  ["160.②", "★ 선순위의 근저당권부 채권의 양수인이 근저당권 이전의 부기등기를 마쳤다면, 채권양도의 대항요건을 갖추지 아니하였더라도, 후순위 근저당권자에게 채권양도로 대항할 수 있다.", true, "▸ 피담보채권을 근저당권과 함께 양수한 자가 채권양도 대항요건 ×, 저당권이전 부기등기 O → 경매신청 O → 다만 채무자는 즉시항고나 이의 가능 O → 이런 절차로 실효되지 않는 한 경매절차 적법 → 후순위저당권자는 채권양도 대항요건 흠결의 경우 대항할 수 없는 채무자 이외의 '제3자'에 포함되지 × → 이상은 근저당권부채권의 양도통지 후 채권양도계약 해제되었으나 양수인의 해제 통지 없이 양도인이 경매신청한 경우도 마찬가지 [2011다109357]", "저당권"],
  ["160.④", "★ 후순위 근저당권자가 경매를 신청한 경우, 선순위 근저당권의 피담보채무는 경매절차에서 매수인이 매각대금을 완납한 때에 확정된다.", true, "▸ 제3자가 경매신청 한 경우에는 매각대금 완납시에 근저당권의 피담보채무 확정 ∴ 근저당권자가 경매 신청한 것 아니므로 담보가치 최대한 활용하도록 [99다26085]", "저당권"],
  ["161.③", "★ 근저당권의 피담보채권의 총액이 채권최고액을 초과하는 경우, 근저당권자와 채무자 겸 근저당권설정자와의 관계에 있어서는 채권 전액의 변제가 있을 때까지 근저당권의 효력이 채권최고액과는 관계없이 잔존채무에 미친다.", true, "▸ 후순위 근저당권자가 없거나 다른 채권자의 교부청구가 없다면 근저당권자는 최고액을 초과한 채무 총액에서 우선변제 O → 최고액이 아닌 '채무 전액' 변제 있을 때까지 근저당권 효력은 잔존채무에 존속 O (즉, 채무자는 전액을 변제해야 근저당권 소멸 주장 O) [71마1151]", "저당권"],
  ["161.④", "★ 공동근저당권자가 공동담보의 목적 부동산 일부에 대한 환가대금으로부터 피담보채권의 일부를 우선변제받은 경우, 나머지 목적 부동산에 대한 우선변제권의 범위는 피담보채권의 확정 여부와 상관없이 최초의 채권최고액에서 우선변제받은 금액을 공제한 나머지 채권최고액으로 제한된다.", true, "▸ 368조는 공동근저당권에도 적용 O → 동시배당 이뤄지면 채권최고액 범위에서 부동산별로 각 환가대금 비례 액수 배당(368조 1항), 각 부동산에 대해 채권최고액만큼 반복 배당 × (이른바 누적적 배당 ×) → 이시배당의 경우도 동시배당과 마찬가지로 공동근저당권자가 채권최고액만큼 반복 배당 × ∴ 368조 1, 2항 취지 → 먼저 우선변제 받은 금액에 관하여는 다른 부동산 경매절차에서 다시 우선변제권 행사 ×, 우선변제권 범위는 최초 채권최고액에서 우선변제받은 금액을 공제한 나머지 채권최고액으로 제한 O, 이자·지연손해금도 마찬가지 [2013다16992]", "저당권"],
  ["161.⑤", "★ 공동근저당의 목적 부동산 일부에 대한 경매가 실행되어 그 경매대가로 피담보채권 일부가 변제된 후 잔존 원본에 대한 지연이자가 다시 발생하였다면, 공동근저당권자가 공동근저당권 목적 부동산의 각 환가대금으로부터 배당받는 원본 및 지연이자의 합산액이 결과적으로 최초의 채권최고액을 초과하더라도, 그 지연이자에 대하여는 나머지 목적 부동산에 관한 경매절차에서 다시 우선변제권을 행사할 수 있다.", false, "▸ ④·⑤ 지문 관련 : 368조는 공동근저당권에도 적용 O → 동시배당 이뤄지면 채권최고액 범위에서 부동산별로 각 환가대금 비례 액수 배당(368조 1항), 각 부동산에 대해 채권최고액만큼 반복 배당 × (이른바 누적적 배당 ×) → 이시배당의 경우도 동시배당과 마찬가지로 공동근저당권자가 채권최고액만큼 반복 배당 × ∴ 368조 1, 2항 취지 → 먼저 우선변제 받은 금액에 관하여는 다른 부동산 경매절차에서 다시 우선변제권 행사 ×, 우선변제권 범위는 최초 채권최고액에서 우선변제받은 금액을 공제한 나머지 채권최고액으로 제한 O, 이자·지연손해금도 마찬가지 [2013다16992]", "저당권"],
  ["SS저당3.①", "★ 근저당권의 확정된 피담보채무액이 채권최고액을 초과하는 경우, 채무자 겸 근저당권설정자는 채권최고액만을 변제한 채 근저당권설정등기의 말소를 청구할 수 없다.", true, "▸ 후순위 근저당권자가 없거나 다른 채권자의 교부청구가 없다면 근저당권자는 최고액을 초과한 채무 총액에서 우선변제 O → 최고액이 아닌 '채무 전액' 변제 있을 때까지 근저당권 효력은 잔존채무에 존속 O [71마1151]", "저당권"],
  ["SS저당3.②", "★ 근저당권 설정 후 부동산 소유권이 이전된 경우, 근저당권설정자인 종전의 소유자도 근저당권설정계약상 권리에 기하여 피담보채무의 소멸을 이유로 근저당권설정등기의 말소를 청구할 수 있다.", true, "▸ 저당권설정 후 소유권이 제3자에게 이전되고 피담보채무가 소멸했다면, 현재 소유자는 소유권에 기해 저당권등기 말소청구 O(214조), 종전의 소유자도 저당권설정계약의 '계약상의 권리'에 기초하여 말소청구 O [93다16338]", "저당권"],
  ["SS저당3.③", "■보충 근저당권실행비용은 채권최고액에 포함된다.", false, "▸ 채권최고액은 당사자 사이 계속적 거래관계에 생긴 채권 가운데 담보할 한도액 의미 → 근저당권 실행비용(경매비용)은 채권최고액에 포함 × [2001다47986]", "저당권"],
  ["SS저당3.④", "근저당권의 경우, 피담보채무 확정 전에 발생한 원본채권에 관하여 확정 후에 발생하는 이자나 지연손해금 채권은 채권최고액의 범위 내에서 담보된다.", true, "▸ 확정의 효과는 일반저당권으로 전환, 그러나 확정 후에도 이자·지연손해금 등은 최고액의 범위 내에서 계속 담보 O [2001다73022]", "저당권"],
  ["162.②", "★ 만약 변제기일이 도래하기 전에 丙이 변제할 당시 채무액 전액을 변제하였다면, 乙의 근저당권은 丙에게 이전된다.", false, "▸ 근저당권의 피담보채권 확정 전에 채권 일부 양도·대위변제한 경우 근저당권이 양수인·대위변제자에게 이전할 여지 × → 그러나 피담보채권이 확정되면 최고액 초과하지 않는 한 '근저당권' 혹은 '경락대금에 대한 권리' 중 그 피담보채권액을 담보하고 남는 부분은 저당권 부기등기의 경료 여부와 관계없이 대위변제자에게 법률상 당연히 이전 O [2001다53929]", "저당권"],
  ["162.③", "★ 만약 변제기일이 도래하기 전에 丙이 변제할 당시 채무액의 일부인 2,500만 원을 변제하였다면, 乙의 근저당권의 일부가 丙에게 이전되지 않는다.", true, "▸ 위 162.② 해설 참조 — 피담보채권 확정 전 일부 대위변제는 근저당권 이전 × [2001다53929]", "저당권"],
  ["162.④", "★ 만약 변제기일이 도래한 후에 丙이 5,000만 원을 변제하였다면, 乙의 근저당권의 일부가 丙에게 이전된다.", true, "▸ 위 162.② 해설 참조 — 피담보채권이 확정되면 최고액 초과하지 않는 한 그 피담보채권액을 담보하고 남는 부분은 저당권 부기등기의 경료 여부와 관계없이 대위변제자에게 법률상 당연히 이전 O [2001다53929]", "저당권"],
  // 공동저당·특수저당,
  ["SS공동1.ㄴ", "★ 乙의 X 부동산에 대한 임의경매신청에 기한 경매절차에서 丁이 매수인으로서 매각대금을 완납하고 매각대금이 乙에게 모두 배당된 경우, 丙이 구상할 수 있는 범위는 매각대금완납시의 부동산 시가가 아니라 매각대금 상당액이다.", true, "▸ 물상보증인의 구상권 범위는 경락인이 매각대금을 다 낸 때(소유권 잃을 때)의 부동산 시가 기준 O, 매각대금 × [2017다283028]", "공동저당·특수저당"],
  ["SS공동1.ㄷ", "甲의 乙에 대한 3억 원의 대출채무의 담보로 丙 소유의 X 부동산(시가 3억 원)과 甲 소유의 Y 부동산(시가 3억 원)에 관하여 공동저당권이 설정되었다.§★ 乙이 고의로 Y 부동산에 대한 저당권을 포기하여 소멸시킨 경우, 丙은 甲이 乙에게 부담하는 3억 원 대출채무의 소멸을 주장할 수 있다.", false, "▸ 제485조 법정대위자 '면책'에서 물상보증인의 면책은 피담보채무에 관한 물상보증인의 책임 소멸 의미, 채무자의 피담보채무 자체 소멸 의미 × [2015다65042]", "공동저당·특수저당"],
  ["SS공동1.ㄹ", "甲의 乙에 대한 3억 원의 대출채무의 담보로 丙 소유의 X 부동산(시가 3억 원)과 甲 소유의 Y 부동산(시가 3억 원)에 관하여 공동저당권이 설정되었다.§乙이 고의로 Y 부동산에 대한 저당권을 포기하여 소멸시킨 경우, 丙은 甲에게 부담하는 3억 원 대출채무에서 Y 부동산의 시가에 해당하는 3억 원을 감액하여 변제할 수 있다.", true, "▸ 채무자 및 물상보증인 각 소유 부동산의 공동저당권자가 채무자 소유 부동산 담보를 상실·감소케 하면, 물상보증인은 그로 인해 상환받을 수 없는 한도에서 면책 O ∴ 물상보증인의 변제자대위 기대권은 485조로 보호 → 이 경우 물상보증인 소유 부동산 경매절차에서, 공동저당권자는 위 물상보증인의 면책 주장 한도에서 물상보증인 소유 부동산의 후순위 근저당권자에 우선하여 배당 × [2017다292756]", "공동저당·특수저당"],
  ["163.ㄱ", "★ 채무자 甲 소유의 X 토지(시가 2,000만 원)와 Y 토지(시가 4,000만 원)에 관하여 丙 앞으로 피담보채권액 3,000만 원의 공동저당권이 설정되어 있는 상태에서, 甲이 Y 토지를 A에게 매도하여 A 명의의 소유권이전등기가 마쳐졌다. 甲의 일반채권자 乙(피보전채권액 1억 원)에 의해 Y 토지에 관한 매매계약이 사해행위로 취소되어 가액배상을 하는 경우, 가액배상액은 ( 가 )이다.§★ (가): 2,000만 원", true, "▸ 지문 ㄱ, ㄴ 관련 : 가액배상액은 ⓐ 피보전채권액, ⓑ 목적물 공동담보가액, ⓒ 수익자·전득자 취득이익액 중 가장 적은 금액을 한도로 (모두 변론종결 당시 기준)\n공동저당권이 설정된 수 개의 부동산 중 일부가 양도된 경우라면, 피담보채권액은 특별한 사정이 없는 한 공동저당권의 목적인 각 부동산의 가액에 비례하여 피담보채권액을 안분한 금액 ∴ 368조 규정 취지 [2003다39989]\n(가) 2,000만 원 : X 토지와 Y 토지 가액 비례(1:2)하여 피담보채권은 X 토지에 1,000만 원, Y 토지에 2,000만 원 안분 → Y 토지 시가 4,000만 원에서 선순위 공동저당권의 피담보채권 안분된 금액 2,000만 원을 제외한 2,000만 원이 공동담보가액 → 가액배상액은 乙의 피보전채권액 1억 원과 Y 토지의 공동담보가액 2,000만 원 중 더 적은 금액인 2,000만 원", "공동저당·특수저당"],
  ["163.ㄴ", "★ 채무자 甲 소유의 X 토지(시가 3,000만 원)와 Y 토지(시가 6,000만 원)에 관하여 丙 앞으로 피담보채권액 6,000만 원의 공동저당권이 설정되어 있는 상태에서, 甲이 X, Y 토지를 A에게 일괄매도하여 A 명의의 소유권이전등기가 마쳐졌다. 甲의 일반채권자 乙(피보전채권액 1억 원)에 의해 X, Y 토지에 관한 매매계약이 사해행위로 취소되어 가액배상을 하는 경우, 가액배상액은 3,000만 원이다.", true, "▸ (나) 3,000만 원 : X 토지는 1,000만 원(= 시가 3,000만 원 - 안분금액 2,000만 원), Y 토지는 2,000만 원(= 시가 6,000만 원 - 안분금액 4,000만 원)이 각 부동산 공동담보가액 → 합계 3,000만 원이 공동담보가액 → 가액배상액은 乙의 피보전채권액 1억 원과 X토지와 Y토지의 공동담보가액의 합계인 3,000만 원 중 더 적은 금액인 3,000만 원", "공동저당·특수저당"],
  ["164.ㄱ", "★ X 토지가 먼저 경매되어 매각대금(1억 원)으로 甲이 채권 전액을 배당받은 후 Y 토지가 경매되는 경우, Y 토지의 매각대금(8천만 원)에서 丁은 1천만 원을 변제받을 수 있다.", false, "▸ 채무자 소유 X토지가 먼저 경매되면, 甲이 1억 원의 채권 전액을 배당받고(여기까지 옳음), 丁은 남은 2,000만원을 받는 것일 뿐, 丁이 Y토지에 368조 2항의 대위 ×", "공동저당·특수저당"],
  ["164.ㄴ", "★ Y 토지가 먼저 경매되어 매각대금(8천만 원)이 전액 甲에게 배당된 경우, 乙은 丙에 대하여 가지고 있는 변제기가 도래한 5천만 원의 대여금채권을 丙이 乙에 대하여 취득한 구상금 채권과 상계함으로써 戊에게 대항할 수 있다.", false, "▸ 물상보증인 소유 Y토지가 먼저 경매되면, 甲이 8,000만원의 매각대금 전액을 배당받아 물상보증인 丙이 채무자 乙에 대하여 구상채권을 취득했을 때, 채무자는 물상보증인과 상계한 사실로 물상보증인 소유물의 후순위저당권자 戊에게 대항할 수 ×", "공동저당·특수저당"],
  ["164.ㄷ", "★ 乙이 X 토지를 己에게 매각하고 소유권이전등기를 마친 후 乙의 일반채권자 A(채권액 1억 원)에 의하여 위 매매계약이 사해행위로 취소되어 가액배상을 하여야 하는 경우, X 토지와 Y 토지의 시가 변동이 없다면 가액배상의 범위는 2천만 원이다.", false, "▸ 사해행위 목적물 X토지가 공동저당물 중 채무자 소유이고, 나머지 Y토지는 물상보증인 소유이므로, 甲의 1억 원은 X토지가 전액을 부담하고, 그렇다면 X토지의 공동담보가액은 2,000만원, 채권자 A의 피보전채권액은 1,000만원으로서, 최종적인 가액배상 범위는 乙의 피보전채권액 3억 원 × X 토지의 공동담보가액 2억 원 중 더 적은 금액인 2억 원\n→ 따라서 甲은 X토지가 전액을 부담하고, 그렇다면 X토지의 공동담보가액은 5억 원에서 선순위 丙의 피담보채권액 2억 원을 제외하면 3억 원(공동담보 전체는 X토지) → 가액배상액은 乙의 피보전채권액 3억 원과 X 토지의 공동담보가액 2억 원 중 더 적은 금액인 2억 원", "공동저당·특수저당"],
  ["165.ㄱ", "★ X 토지와 Y 건물의 근저당권이 공동근저당권인 경우 甲은 X 토지의 경매대금에서 2,000만 원을 배당받을 수 있다.", true, "▸ ㄱ 공동근저당권 경우라면, 甲은 X토지 및 Y건물에서 최대한 배당받더라도 채권최고액 1억 원을 초과할 수 없음 → 먼저 Y건물에서 8,000만원을 배당받은 甲은 실제 피담보채무액이 더 많더라도 X토지에서는 최고액 잔액 2,000만원만을 배당받을 수 있음", "공동저당·특수저당"],
  ["165.ㄴ", "★ X 토지와 Y 건물의 근저당권이 피담보채권을 누적적으로 담보하는 근저당권인 경우 甲은 X 토지의 경매대금에서 3,500만 원을 배당받을 수 있다.", true, "▸ ㄴ 누적적 근저당권인 경우라면, 甲은 X토지와 Y건물에서 각각 채권최고액 1억 원씩을 우선변제받을 수 있으므로, Y건물에서 얼마를 배당받았든 X토지 경매 당시 자신의 채권이 3,500만 원이라면 그 전액을 배당받을 수 있음(이러한 결론의 전제는 후술)", "공동저당·특수저당"],
  ["165.ㄷ", "★ X 토지와 Y 건물의 근저당권이 피담보채권을 누적적으로 담보하는 근저당권인 경우 丁은 X 토지의 경매대금에서 4,000만 원을 배당받을 수 있다.", false, "▸ 공동근저당권 경우라면, 甲은 X토지 및 Y건물에서 최대한 배당받더라도 채권최고액 1억 원을 초과할 수 없음 → 먼저 Y건물에서 8,000만원을 배당받은 甲은 실제 피담보채무액이 더 많더라도 X토지에서는 최고액 잔액 2,000만원만을 배당받을 수 있음\n▸ 유의할 점은, 이러한 누적적 근저당권의 경우에도, 채무자 소유 및 물상보증인 소유의 공동저당 법리는 동일하므로, 물상보증인 소유인 Y건물이 먼저 경매되어 甲이 8,000만원을 배당받으면, Y건물의 소유자인 물상보증인 丙이 채무자에 대해 구상권 취득 및 변제자대위권으로 종래 채권자 보유하던 채무자 소유 부동산에 관한 근저당권 대위취득 행사 O [2014다51756]\n→ 이 과정에서 채무자 소유인 X토지의 후순위 저당권자 丁은 아무런 배당을 받을 수 없게 됨", "공동저당·특수저당"],
  ["166.②", "★ 공동저당권의 목적물인 채무자 소유 부동산과 물상보증인 소유 부동산의 경매대가를 동시에 배당하는 경우, 물상보증인이 채무자를 위한 연대보증인의 지위를 겸하고 있더라도 채무자 소유 부동산의 경매대가에서 공동저당권자에게 우선적으로 배당을 하고, 부족분이 있는 경우에 한하여 물상보증인 소유 부동산의 경매대가에서 추가로 배당을 한다.", true, "▸ 일부 채무자 소유, 일부 물상보증인 소유인 공동저당권의 동시배당을 하면 368조 1항 × → 채무자 소유물에서 우선 배당, 부족분이 있을 때만 물보 소유물에서 추가 배당 ∴ 물상보증인은 481, 482조 변제자대위 지위 [2008다41475] → 이러한 법리는 물상보증인이 연대보증인 지위 겸해도 동일 [2014다231965]", "공동저당·특수저당"],
  ["166.③", "★ 공동저당권의 목적물인 채무자 소유 부동산과 물상보증인 소유 부동산 중 채무자 소유 부동산에 대하여 먼저 경매가 이루어져 경매대금에서 선순위 공동저당권자가 채권 전액을 변제받은 경우, 채무자 소유 부동산에 대한 후순위 저당권자는 물상보증인 소유 부동산에 대한 선순위 저당권에 대하여 물상대위를 할 수 있으므로, 물상보증인 소유 부동산에 대한 선순위 저당권설정등기에 대하여는 위 후순위 저당권자 앞으로 대위에 의한 부기등기가 경료되어야 한다.", false, "▸ 공동저당 목적인 채무자 소유 및 물상보증인 소유 부동산 중에 채무자 소유 부동산이 먼저 경매된 경우, 채무자 소유 부동산의 후순위 저당권자는 물상보증인 소유 부동산에 대해 선순위저당권자를 368조 2항의 대위 × [95마500] → 368조 2항의 대위를 할 수 없다는 판례인데, 물상대위 역시 당연히 할 수 없음", "공동저당·특수저당"],
  ["167.ㄷ", "★ 공동저당의 목적인 채무자 소유 부동산과 물상보증인 소유 부동산에 각각 채권자를 달리하는 후순위저당권이 설정되어 있는 경우, 물상보증인 소유 부동산에 먼저 경매가 이루어져 경매대금의 교부에 의하여 1번저당권자가 변제를 받은 때에는 물상보증인은 채무자에 대하여 구상권을 취득함과 동시에 변제자대위에 의하여 채무자 소유 부동산에 대한 1번저당권을 취득하고, 이러한 경우 물상보증인 소유 부동산에 대한 후순위저당권자는 물상보증인에게 이전한 1번저당권으로부터 우선하여 변제를 받을 수 있으며, 자기 소유 부동산이 먼저 경매되어 1번저당권자에게 대위변제를 한 물상보증인은 1번저당권을 대위취득하고, 물상보증인 소유 부동산의 후순위저당권자는 1번저당권에 대하여 물상대위를 할 수 있다.", true, "▸ 공동저당의 목적인 채무자·물상보증인 소유 부동산에 각각 후순위저당권이 있는 경우, 물보 소유 부동산 먼저 경매되어 공동저당권자 변제받으면 물보는 채무자 대해 구상권 취득하고 채무자 소유 1번저당권을 대위취득 → 이 경우 물보 소유 부동산의 후순위저당권자는 물보에게 이전한 1번저당권으로부터 우선변제받을 수 있고, 물보 소유 부동산의 후순위저당권자는 1번저당권에 대해 물상대위 가능 [93다25417]", "공동저당·특수저당"],
  ["168.ㄱ", "★ 근저당권이 설정된 후에 근저당권설정자와 근저당권자의 합의로 그 근저당권의 피담보채무를 변경할 수 있으며, 이때 후순위저당권자 등 이해관계인의 승낙을 받아야 한다.", false, "▸ 근저당권은 피담보채무 최고액만 정하고 채무 확정 장래 보류하여 설정하는 저당권(357조 1항) → 근저당권 설정 후 근저당설정자와 근저당권자 합의로 채무 추가·교체 등 피담보채무 범위 변경 O → 그 변경된 채무가 근저당권에 의해 담보 O → 후순위저당권자 등 이해관계인은 채권최고액 알고 이해관계 맺었으므로 변경으로 예측 못한 손해 ×, 피담보채무 범위나 채무자 변경 시 이해관계인 승낙 받을 필요 × → 등기사항 변경은 변경 등기 해야 효력, 그러나 등기사항 아닌 사항은 당사자 합의만으로 변경 효력 O [2021다255648]", "공동저당·특수저당"],
  ["168.ㄴ", "★ 당사자 사이에 하나의 기본계약에서 발생하는 동일한 채권을 담보하기 위하여 여러 개의 부동산에 근저당권을 설정하면서 각각의 근저당권 채권최고액을 합한 금액을 우선변제받기 위하여 공동근저당권의 형식이 아닌 개별 근저당권의 형식을 취한 경우, 이러한 근저당권을 설정받은 채권자는 피담보채권이 소멸할 때까지 개별 근저당권을 실행하여 그 근저당권의 채권최고액 범위에서 반복하여 우선변제를 받을 수 있다.", true, "▸ 1개 기본계약에서 발생하는 동일한 채권을 담보하기 위해 여러 부동산에 근저당권 설정하면서, 각 근저당권 채권최고액 합한 금액을 우선변제받기 위해 '공동근저당권' 형식 아닌 '개별 근저당권' 형식 취하면, 누적적 담보 O, 368조 × → 동시·이시배당 선택 O, 최고액 범위에서 피담보채권 전부·일부 우선변제 받은 다음 피담보채권 소멸할 때까지 나머지 근저당권 실행하여 그 근저당권의 최고액 범위에서 다시 반복하여 우선변제 O → 채무자·물상보증인 각 소유 부동산에 누적적 근저당권 설정받고 물보 소유 부동산 먼저 경매되어 변제받은 경우, 물상보증인은 채무자에 대해 구상권 취득 및 변제자대위권으로 종래 채권자 보유하던 채무자 소유 부동산에 관한 근저당권 대위취득 행사 O [2014다51756]", "공동저당·특수저당"],
  ["168.ㄷ", "★ 공동근저당권자가 경매 등의 환가절차를 통하여 공동담보의 목적 부동산 중 일부에 대한 환가대금으로부터 다른 권리자에 우선하여 피담보채권의 일부에 대하여 배당받은 경우, 공동근저당권자는 위와 같이 우선변제받은 금액에 관하여는 공동담보의 나머지 목적 부동산에 대한 경매 등의 환가절차에서 다시 공동근저당권자로서 우선변제권을 행사할 수 없다.", true, "▸ 368조는 공동근저당권에도 적용 O → 먼저 우선변제 받은 금액에 관하여는 다른 부동산 경매절차에서 다시 우선변제권 행사 ×, 우선변제권 범위는 최초 채권최고액에서 우선변제받은 금액을 공제한 나머지 채권최고액으로 제한 O, 이자·지연손해금도 마찬가지 [2013다16992]", "공동저당·특수저당"],
  ["169.ㄱ", "★ 공동저당에 제공된 채무자 소유의 부동산과 물상보증인 소유의 부동산 가운데 물상보증인 소유의 부동산이 먼저 경매되어 매각대금에서 선순위공동저당권자가 변제를 받은 때, 채무자는 물상보증인에 대한 반대채권이 있더라도 특별한 사정이 없는 한 물상보증인의 구상금 채권과 상계함으로써 물상보증인 소유의 부동산에 대한 후순위저당권자에게 대항할 수 없다.", true, "▸ 채무자 소유, 물상보증인 소유인 공동저당에서 물상보증인 소유 부동산이 먼저 경매된 경우, 채무자는 물상보증인에 대한 반대채권 있더라도 특별한 사정 없는 한 물상보증인의 구상금채권과 상계함으로써 물상보증인 소유 부동산의 후순위저당권자에 대항 × ∴ 물상보증인 소유 부동산 먼저 경매된다는 우연한 사정 좌우되는 상계에 대한 기대보다 물상보증인 소유 부동산의 후순위저당권자의 법적 지위가 우선 [2014다221777]", "공동저당·특수저당"],
  ["169.ㄷ", "★ 공동근저당권자가 경매 등의 환가절차를 통하여 공동담보의 목적 부동산 중 일부에 대한 환가대금 등으로부터 다른 권리자에 우선하여 피담보채권의 일부에 대하여 배당받은 경우에, 그와 같이 우선변제받은 금액에 관하여는 공동담보의 나머지 목적 부동산에 대한 경매 등의 환가절차에서 다시 공동근저당권자로서 우선변제권을 행사할 수 없다.", true, "▸ 368조는 공동근저당권에도 적용 O → 먼저 우선변제 받은 금액에 관하여는 다른 부동산 경매절차에서 다시 우선변제권 행사 ×, 우선변제권 범위는 최초 채권최고액에서 우선변제받은 금액을 공제한 나머지 채권최고액으로 제한 O [2013다16992]", "공동저당·특수저당"],
  ["170.ㄹ", "★ 乙이 고의로 Y 부동산에 대한 저당권을 포기하여 소멸시킴으로 인하여 丙이 상환을 받을 수 없는 경우, 그 한도에서 피담보채무에 관한 丙의 책임이 소멸한다.", true, "▸ 채무자 및 물상보증인 각 소유 부동산의 공동저당권자가 채무자 소유 부동산 담보를 상실·감소케 하면, 물상보증인은 그로 인해 상환받을 수 없는 한도에서 면책 O ∴ 물상보증인의 변제자대위 기대권은 485조로 보호 → 이 경우 물상보증인 소유 부동산 경매절차에서, 공동저당권자는 위 물상보증인의 면책 주장 한도에서 물상보증인 소유 부동산의 후순위 근저당권자에 우선하여 배당 × [2017다292756]", "공동저당·특수저당"],
  ["171.③", "★ 선순위 공동저당권자가 피담보채권을 변제받기 전에 공동저당 목적 부동산 중 일부에 관한 저당권을 포기한 경우, 후순위저당권자가 있는 부동산에 관한 경매절차에서 저당권을 포기하지 아니하였더라면 후순위저당권자가 대위할 수 있었던 한도에서는 후순위저당권자에 우선하여 배당받을 수 없다.", true, "▸ 선순위 공동저당권자가 저당권 일부를 포기하고 경매신청하면 후순위자는 대위권 기대했으므로 그 경매절차에서 선순위자보다 우선 × → '선순위자가 포기하지 않았다면 후순위자가 대위할 수 있었던 한도에서는 후순위저당권자에 우선하여 배당받을 수 없다'는 것이 판례의 입장 [2009다41250]", "공동저당·특수저당"],
  ["172.ㄱ", "★ 임대차기간이 만료되자 丙이 乙의 전세금반환채권을 압류·전부하여 甲에 대하여 1억 원의 지급을 청구한 경우, 甲은 자신이 2017. 12. 10. 乙에게 변제기를 2018. 12. 10.로 정하여 대여한 대여금채권을 자동채권으로 하는 상계로 丙에게 대항할 수 있다.", false, "▸ 전세권 목적 저당권 설정되고 전세권 존속기간 만료되면 전세권저당권자는 더 이상 전세권 자체에 대한 저당권 실행 ×, 물상대위권 행사로 전세금지급 구할 수 O → 전세권설정자가 전세권자에 대해 상계적성 있는 반채권 있더라도 물상대위권 행사하는 전세권저당권자에게 상계로 대항 × ∴ 종전 저당권의 우선변제권 효력이 전세금반환채권에 존속 → 단, 전세권저당권이 설정된 때 이미 전세권설정자가 반대채권 가지고 있고 반대채권 변제기가 장래 발생할 전세금반환채권 변제기와 동시에 또는 보다 먼저 도래한다면 상계 O ∴ 전세권설정자의 상계에 대한 합리적 기대 이익 O [2013다91672]\n→ 저당권 설정 당시인 2017.10.20. 기준: 대여금채권 변제기는 2018.12.10.이고, 전세금반환채권 변제기는 임대차기간 만료 이후인데 원래 전세기간은 임대차기간과 동일하여 2019.10.9.이므로 대여금채권 변제기(2018.12.10.)가 전세금반환채권 변제기(2019.10.9.)보다 먼저 → 상계 O인 것처럼 보임 → 그러나 저당권 설정 당시 이미 반채권이 존재하지 않았으므로(당시 아직 대여행위 하지 않았음) 상계 ×", "공동저당·특수저당"],
  ["172.ㄴ", "★ 丙은 전세권의 존속기간이 만료되면 더 이상 전세권 자체에 대하여 저당권을 실행할 수 없고, 전세금반환채권에 대하여 물상대위권을 행사하여 전세금의 지급을 구하여야 한다.", true, "▸ 실제로는 전세권설정계약이 없으면서 임대차보증금반환채권 담보 목적 또는 금융기관 자금융통 목적으로 임차인 명의로 전세권설정등기 하였다면 전세권설정계약은 통정허위표시로서 무효 → 그러나 전세권저당권자 혹은 전세권저당권부채권의 가압류채권자 등 선의의 제3자에게는 대항 × [2006다29372, 2006다58912]\n▸ 전세권 목적 저당권 설정되고 전세권 존속기간 만료되면 전세권저당권자는 더 이상 소유자에게 저당권 주장 ×, 전세권 자체에 대한 저당권 실행 × → 물상대위권 행사로 전세금지급 구할 수 O [98다31301]", "공동저당·특수저당"],
  ["173.①", "★ 丙의 저당권의 목적물은 乙의 전세권이므로 그 전세권이 기간만료로 소멸하면 丙은 더 이상 그 전세권에 대하여 저당권을 실행할 수 없다.", true, "▸ 전세권이 기간만료로 종료하면 말소등기 없이 당연히 소멸 → 저당권자는 더이상 소유자에게 저당권 주장 ×, 전세권 자체에 대한 저당권 실행 × [98다31301]", "공동저당·특수저당"],
  ["173.②", "★ 乙의 전세권이 기간만료로 소멸하면 丙의 저당권도 당연히 소멸된다.", false, "▸ 전세권이 기간만료로 종료하면 말소등기 없이 당연히 소멸 → 저당권자는 더이상 소유자에게 저당권 주장 × → 다만 저당권의 목적물인 전세권에 갈음하여 존속하는 전세금반환채권에 대하여 압류 및 추심명령·전부명령 받거나 배당요구 방법으로 권리행사 가능(370조, 342조, 민집법 273조) → 전세권저당권이 설정된 경우에도 전세권이 기간만료로 소멸되면 전세권설정자는 제3자의 압류 등이 없는 한 전세권자에 대하여만 전세금반환의무를 부담 O ∴ 물상대위는 위와 같이 행사를 해야 인정, 전세권 저당권의 설정은 소유자 의사와 무관 [98다31301] → 전세권이 소멸하면 저당권도 '소멸'한다는 지문은 우선 그 자체로는 타당함", "공동저당·특수저당"],
  ["173.③", "★ 乙의 전세권이 기간만료로 소멸하면 甲은 전세금반환채권에 대한 제3자의 압류 등이 없는 한 乙에 대하여만 전세금반환의무를 부담한다.", true, "▸ 전세권저당권이 설정된 경우에도 전세권이 기간만료로 소멸되면 전세권설정자는 제3자의 압류 등이 없는 한 전세권자에 대하여만 전세금반환의무를 부담 O [98다31301]", "공동저당·특수저당"],
  // 가등기담보법,
  ["174.①", "★ 「가등기담보 등에 관한 법률」에 따라 담보가등기를 마친 부동산에 대하여 강제경매개시결정이 있는 경우, 그 경매신청이 청산금을 지급하기 전(청산금이 없는 경우에는 청산기간이 지나기 전)에 행하여졌다면 담보가등기권리자는 그 가등기에 따른 본등기를 청구할 수 없다.", true, "▸ 가등기담보 등에 관한 법률 제14조(강제경매등의 경우의 담보가등기) 담보가등기를 마친 부동산에 대하여 강제경매등의 개시 결정이 있는 경우에 그 경매의 신청이 청산금을 지급하기 전에 행하여진 경우(청산금이 없는 경우에는 청산기간이 지나기 전)에는 담보가등기권리자는 그 가등기에 따른 본등기를 청구할 수 없다.", "가등기담보법"],
  ["174.②", "★ 가등기담보법에 따른 청산절차를 위반하여 담보목적 부동산에 관하여 본등기가 이루어진 경우, 담보목적 부동산에 관하여 진행된 경매절차에서 매수인이 본등기가 무효인 사실을 알지 못한 채 부동산을 매수하여 소유권을 취득하였다면, 채무자는 더 이상 채권자에 대하여 피담보채무액 전부를 변제하고 그 본등기의 말소를 청구할 수 없다.", true, "▸ ㄱ, ㄴ 해설 : 가담법 11조 단서 후문 '선의 제3자'에서는 제3자 악의는 주장·증명책임 → 선의의 제3자 소유권 취득하면 채무자 등은 더 이상 가담법 11조 본문의 말소청구 × → 반사적 효과로 무효인 채권자 명의의 본등기는 그 등기 마친 시점으로 소급하여 확정적 유효로 O, 담보목적부동산에 관한 채권자의 담보권 소멸, 청산절차 거치지 않아 무효였던 채권자 본등기에 터 잡아 이루어진 등기도 소급하여 유효하게 → 다만 이 경우에도 채무자 등과 채권자 사이의 청산금 지급 둘러싼 채권·채무 관계 모두 소멸은 아님 → 무효 본등기 마친 담보목적부동산의 경매절차에서 경락인이 본등기 무효 사실 모르고 매수한 경우에도 적용 O [2016다248325]", "가등기담보법"],
  ["175.ㄴ", "★ 가등기 설정 당시, 이행지체가 발생하는 경우 청산절차 없이 가등기에 기한 본등기를 경료하기로 특약을 맺었는데, 그 후 이행지체가 발생하자 乙은 위 특약에 따라 X 토지에 관하여 乙 앞으로 위 가등기에 기한 소유권이전등기를 경료하였다. 이 경우 乙은 X 토지의 소유권을 취득한 것이 아니지만 이 소유권이전등기는 약한 의미의 양도담보로서의 효력을 갖는다.", false, "▸ 가담법 위반하여 청산금의 지급 없이 이루어진 본등기는 무효 → 이는 '약한 의미 양도담보로서 담보 목적 내에서 유효'하다고 볼 수도 × ∴ 가담법은 편면적 '강행규정' [92다20132]", "가등기담보법"],
  ["SS가등기.ㄱ", "★ 乙은 甲에게 정산의무를 부담하지 않는다.", false, "▸ ㄱ, ㄴ 해설 : 가담법 11조 단서 후문 '선의 제3자'에서는 제3자 악의는 주장·증명책임 → 선의의 제3자 소유권 취득하면 채무자 등은 더 이상 가담법 11조 본문의 말소청구 × → 반사적 효과로 무효인 채권자 명의의 본등기는 그 등기 마친 시점으로 소급하여 확정적 유효로 O → 따라서 甲이 선의의 제3자 丙에게 매도하고 등기를 마쳐줬으므로 채권자 乙은 채무자 甲에게 청산해야 하고, 채권자 乙의 소유권 취득은 무효였던 본등기 시점으로 소급함에 유의 [2016다248325]", "가등기담보법"],
  ["SS가등기.ㄴ", "2024. 3. 4. 乙은 X 토지에 대한 소유권을 취득한다.", true, "▸ 위 SS가등기.ㄱ 해설 참조 [2016다248325]", "가등기담보법"],
  ["SS가등기.ㄷ", "乙의 매매행위로 인한 甲의 乙에 대한 불법행위 손해배상청구권의 10년의 소멸시효의 기산점은 2025. 5. 6.이다.", false, "▸ 채권자가 청산절차 없이 제3자에 처분하여 채무자가 말소청구 불가능해지면(11조 단서) 채권자는 담보물 위법 처분으로 인한 손해배상 → 말소 불능 시점의 담보목적 부동산 가액에서 그때까지 채무액 공제한 금액 [2010다27458]\n→ 불법행위일은 말소가 불가능해진 25. 10. 6. 병 명의의 소유권이전등기 경료일", "가등기담보법"],
  ["176.ㄷ", "★ 甲은 乙로부터 금전을 차용하고, 만약 변제기에 채무를 변제하지 못하면 甲이 소유하는 X 토지의 소유권을 乙에게 이전하기로 하는 내용의 약정을 체결하였다. 그 약정 당시 X 토지의 시가는 원금과 변제기까지의 이자의 합산액을 훨씬 상회하고 있었다. 甲이 乙에게 채무를 변제하지 못한 상태에서 변제기로부터 6개월이 경과한 시점에 丙의 신청에 따라 위 근저당권에 기한 경매가 개시되자, 乙은 바로 청산통지를 하고 정당하게 산정된 청산금을 지급한 다음 가등기에 기한 본등기를 마쳤다. 이 경우 乙의 본등기는 유효하다.", false, "▸ 가등기담보 등에 관한 법률 제14조(강제경매등의 경우의 담보가등기) 담보가등기를 마친 부동산에 대하여 강제경매등의 개시 결정이 있는 경우에 그 경매의 신청이 청산금을 지급하기 전에 행하여진 경우(청산금이 없는 경우에는 청산기간이 지나기 전)에는 담보가등기권리자는 그 가등기에 따른 본등기를 청구할 수 없다.", "가등기담보법"],
  ["177.①", "★ 「가등기담보 등에 관한 법률」은 매매대금채권을 담보하기 위하여 가등기를 한 경우에는 적용되지 않는다.", true, "▸ 매매대금, 공사대금의 지급 담보라면 가담법 적용 × [90다13765, 91다45356] → 가담법의 문언상 '차용물', 즉 소비대차계약 혹은 준소비대차계약에 기한 채무에만 적용됨", "가등기담보법"],
  ["177.②", "★ 채권자가 주관적으로 평가한 청산금의 액수가 정당하게 평가된 청산금의 액수에 미치지 못하여도 담보권 실행 통지로서의 효력이나 청산기간의 진행에는 아무런 영향이 없다.", true, "▸ 채권자가 주관적으로 평가한 청산금 액수가 정당하게 평가된 청산금 액수에 미치지 못하더라도 담보권 실행 통지로서의 효력이나 청산기간의 진행에는 아무런 영향이 없음 [92다10043]", "가등기담보법"],
  ["178.①", "★ 공사대금 채권을 담보하기 위하여 설정받은 가등기에 기하여 담보권을 실행하기 위해서는 「가등기담보 등에 관한 법률」(이하 '가등기담보법'이라고 한다)에 따른 청산절차를 거쳐야 한다.", false, "▸ 매매대금, 공사대금의 지급 담보라면 가담법 적용 × [90다13765, 91다45356]", "가등기담보법"],
  ["178.③", "가등기담보법에 따른 담보가등기가 설정된 부동산에 관한 경매절차에서, 매각대금 중 집행비용 등을 제외한 배당할 금액이 2,400만 원이고 담보가등기의 피담보채권이 2,000만 원, 선순위와 후순위 가압류채권의 청구금액이 각 1,000만 원씩인 경우, 선순위 가압류채권자는 600만 원, 가등기담보권자는 1,800만 원, 후순위 가압류채권자는 0원을 배당받는다.", true, "▸ 가등기담보권자는 선순위 가압류채권자에 대하여 우선변제권 주장 × → 그 피담보채권과 선순위 및 후순위 가압류채권에 대해 1차로 채권액 따른 안분비례로 평등배당 → 다음으로 후순위 가압류채권의 배당액으로부터 자기 채권액 만족시킬 때까지 흡수하여 우선변제 O → 이는 선순위·후순위 가압류채권자가 동일인이어도 마찬가지 [91다44407] = 저당권자인 경우의 개별상대효설, 흡수설\n사안에서 2400을 600, 1200, 600으로 1차 안분비례한 후 가등기담보권자가 후행 가압류채권자로부터 600을 모두 흡수하여 최종적으로 600, 1800, 0", "가등기담보법"],
  ["179.①", "★ 가등기담보권의 사적 실행에 있어서 채권자가 청산금의 지급 이전에 본등기와 담보목적물의 인도를 받을 수 있다거나 청산기간이나 동시이행관계를 인정하지 아니하는 '처분정산'형의 담보권실행은 「가등기담보 등에 관한 법률」상 허용되지 아니한다.", true, "▸ 가등기담보권의 사적 실행에 있어서 채권자가 청산금의 지급 이전에 본등기와 담보목적물의 인도를 받을 수 있다거나 청산기간이나 동시이행관계를 인정하지 아니하는 '처분정산'형 담보권실행은 가담법상 허용 × [2001다81856]", "가등기담보법"],
  ["179.④", "★ 채무자 등의 말소청구권이 제척기간의 경과로 소멸한 경우, 채권자는 담보목적 부동산의 소유권을 확정적으로 취득하고, 채무자 등은 채권자에게 청산금의 지급을 청구할 수 없다.", false, "▸ 가담법 11조 단서 제척기간 경과로 채무자의 말소청구권이 소멸하고 채권자가 담보목적부동산 소유권 확정적 취득하면, 채무자는 채권자에 대해 가담법 4조로 산정한 청산금 지급청구 O [2018다215947] → 이러한 채무자의 권리를 그에 대한 채권자가 대위행사할 수도 있음", "가등기담보법"],
  ["180.②", "채권자가 채무자와 담보계약을 체결하였지만, 담보목적부동산에 관하여 가등기나 소유권이전등기를 마치지 아니한 경우에는 「가등기담보 등에 관한 법률」 제3조, 제4조는 원칙적으로 적용될 수 없다.", true, "▸ 가담법 적용되려면 채권자가 담보목적부동산에 가등기나 소이등 마침으로써 '담보권' 취득했어야 → 담보계약만 체결하고 등기 마치지 않았다면 담보권 취득한 것 아니므로 가담법 적용 × ∴ 가담법 3, 4조는 '담보권' 실행 규정 → 담보계약 체결하고 등기 없다면 귀속정산 X [2019다247385 관련]", "가등기담보법"],
  ["181.②", "★ 甲의 차용금반환채무를 담보하기 위한 가등기인 경우, 乙이 가등기담보법의 실행에 관한 「가등기담보 등에 관한 법률」 소정의 청산절차를 거치지 않고 본등기를 하였다면, 이것은 부동산 양도담보로서 담보의 목적 내에서는 유효한 등기이다.", false, "▸ 가담법 위반하여 청산금의 지급 없이 이루어진 본등기는 무효 → 이는 '약한 의미 양도담보로서 담보 목적 내에서 유효'하다고 볼 수도 × ∴ 가담법은 편면적 '강행규정' [92다20132]", "가등기담보법"],
  ["182.ㄷ", "★ 甲과 乙의 대물변제 약정은 약한 의미의 양도담보로서 효력이 있으므로 변제기가 도래하면 乙은 본등기를 경료할 수 있고, 乙은 청산절차를 거치면 그 즉시 소유권을 취득할 수 있다.", false, "▸ 가담법 위반하여 청산금의 지급 없이 이루어진 본등기는 무효 → 이는 '약한 의미 양도담보로서 담보 목적 내에서 유효'하다고 볼 수도 × ∴ 가담법은 편면적 '강행규정' [92다20132] ≠ 민법 607, 608조 위반의 경우 판례는 '약한 의미의 양도담보'로 판시하였음", "가등기담보법"],
  ["183.③", "★ 甲이 X를 위와 같이 乙에게 양도한 후, X를 각각의 목적물로 하여 다른 채권자 丙과 피담보채권액 1,000만 원의 양도담보설정계약을 체결하고, 다시 乙과 피담보채권액 1,000만 원의 양도담보설정계약을 추가로 체결하였는데, 각 설정계약에서 점유개정의 방법으로 X를 인도하였다. 이 경우, 乙의 양도담보권의 피담보채권액은 2,000만 원에서 3,000만 원으로 증액되고, 丙은 양도담보권을 취득하지 못한다.", true, "▸ 점유개정에 의한 동산양도담보에서 동산 소유권이 신탁적으로 이전됨으로써 대외적 관계에서 채무자는 무권리자 → 채무자가 다시 다른 채권자와 양도담보설정계약을 체결하고 점유개정 방법으로 인도하더라도, 선의취득이 인정되지 않는 한, 나중에 양도담보설정계약 체결한 채권자는 양도담보권 취득 × → 점유개정으로 선의취득 부정되므로, 결국 뒤의 채권자는 양도담보권 취득 × [2003다30463] → 설문에서 丙은 양도담보권을 아예 취득할 수 없고, 양도담보권자 乙에 대한 추가 계약으로 乙의 양도담보권의 피담보채권액은 유효하게 증액됨", "가등기담보법"],

  ["002.③", "★ 제1심 법원이 제1차 변론준비기일에 부적법한 당사자표시정정신청을 받아들이고 피고가 이에 명시적으로 동의하여 제1심 및 항소심에서 본안판결이 선고된 경우, 그 후 피고가 위 표시정정신청이 부적법하다고 주장하는 것은 인정되지 아니한다.", true, "▸ 부적법한 표시정정신청에 대해 법원이 허용하고 피고도 동의하여 판결 선고되면 더 이상 상소 X ∵ 소송경제, 신의칙 [2008다11276]", "신의성실의원칙"],
  ["002.④", "★ 민사소송상 신의칙에 반하는 것은 강행규정에 위배되는 것이므로 당사자의 주장이 없더라도 법원은 직권으로 판단할 수 있다.", true, "▸ 민사소송상의 신의칙 위반은 소송요건으로 직권조사사항이라는 것이 통설·판례", "신의성실의원칙"],
  ["002.⑤", "★ 원고가 소권(항소권을 포함한다)을 남용하여 청구가 이유 없음이 명백한 소를 반복적으로 제기한 것에 대하여 법원이 변론 없이 판결로 소를 각하하는 경우에는 재판장은 직권으로 피고에 대하여 공시송달을 명할 수 있다.", true, "제194조(공시송달의 요건) ④ 원고가 소권(항소권을 포함한다)을 남용하여 청구가 이유 없음이 명백한 소를 반복적으로 제기한 것에 대하여 법원이 변론 없이 판결로 소를 각하하는 경우에는 재판장은 직권으로 피고에 대하여 공시송달을 명할 수 있다.", "신의성실의원칙"],
  // 관할,
  ["003.①", "아래 약정서에 따라 乙을 상대로 제기하는 소의 관할법원에 관한 설명 중 옳지 않은 것은?\n[약정서] 채권자 甲(서울 서초구 거주) / 채무자 乙(서울 송파구 거주)\n1. 乙은 甲에게 100,000,000원을 지급한다.\n2. 乙은 서울 강북구 소재 토지에 관하여 증여를 원인으로 한 소유권이전등기절차를 이행한다.§甲은 약정 사항 제1항과 제2항의 이행을 구하는 소를 乙의 주소지 관할법원에 제기할 수 있다.", true, "제2조(보통재판적) 소(訴)는 피고의 보통재판적이 있는 곳의 법원이 관할한다.\n▸ 피고 乙의 주소지(송파구)에 제기 가능 O", "관할"],
  ["003.②", "아래 약정서에 따라 乙을 상대로 제기하는 소의 관할법원에 관한 설명 중 옳지 않은 것은?\n[약정서] 채권자 甲(서울 서초구 거주) / 채무자 乙(서울 송파구 거주)\n1. 乙은 甲에게 100,000,000원을 지급한다.\n2. 乙은 서울 강북구 소재 토지에 관하여 증여를 원인으로 한 소유권이전등기절차를 이행한다.§★ 甲은 약정 사항 제1항만의 이행을 구하는 소를 甲의 주소지 관할법원에 제기할 수 있다.", true, "제8조(거소지 또는 의무이행지의 특별재판적) 재산권에 관한 소를 제기하는 경우에는 거소지 또는 의무이행지의 법원에 제기할 수 있다.\n▸ 금전채무의 의무이행지는 채권자의 현주소지 → 甲의 주소지(서초구)에 제기 가능 O", "관할"],
  ["003.③", "아래 약정서에 따라 乙을 상대로 제기하는 소의 관할법원에 관한 설명 중 옳지 않은 것은?\n[약정서] 채권자 甲(서울 서초구 거주) / 채무자 乙(서울 송파구 거주)\n1. 乙은 甲에게 100,000,000원을 지급한다.\n2. 乙은 서울 강북구 소재 토지에 관하여 증여를 원인으로 한 소유권이전등기절차를 이행한다.§★ 甲은 약정 사항 제2항만의 이행을 구하는 소를 甲의 주소지 관할법원에 제기할 수 없다.", true, "▸ 제2·3조에 따라 피고 乙의 주소지, 제20·21조에 따라 부동산 소재지(강북구)의 관할법원에는 제기할 수 있으나, 원고 甲의 주소지에 제기할 근거는 없음", "관할"],
  ["004.①", "★ 지방법원 합의부가 지방법원 단독판사의 판결에 대한 항소사건을 제2심으로 심판하는 도중에 지방법원 합의부의 관할에 속하는 반소가 제기되더라도 이미 정하여진 항소심 관할에는 영향이 없다.", true, "▸ 단독사건을 지법 합의부가 항소심으로 심판하는 도중 합의부 관할 소송이 새로 추가·변경되거나 반소로 제기되어도 계속 심판함 ∵ 심급관할은 '제1심' 법원의 존재에 의하여 결정되는 전속관할 [92다2066]", "관할"],
  ["004.②", "★ 피고가 제1심 법원에서 관할위반의 항변을 하지 않은 채 본안에 관한 답변서를 제출하고서 변론기일 또는 변론준비기일에 불출석함으로써 그 답변서가 진술간주된 경우에도 변론관할은 생긴다.", false, "▸ 불출석하여 그가 제출한 서면이 '진술간주'된 경우는 변론관할 X → 반드시 출석하여 현실적으로 변론·진술해야 변론관할 생김 [80마403]", "관할"],
  ["004.③", "★ 당사자가 임의관할에 관한 전속적 합의를 하더라도 다른 법원에 변론관할이 생길 수 있다.", true, "▸ 전속적 관할합의는 전속관할 X, 임의관할 O → 법원은 공익상 필요에 의해 다른 법원 이송 O [2007마1328] → 전속적 관할합의를 위반해도 다른 법원에 변론관할 O", "관할"],
  ["004.④", "★ 전속관할의 규정을 위반하더라도 이송결정이 확정되면 원칙적으로 기속력이 인정되지만, 심급관할위반의 이송결정을 한 경우에는 그 기속력이 이송 받은 상급심 법원에까지 미치지 아니한다.", true, "▸ 전속관할 위반한 이송결정도 기속력 O ∵ 이송결정 불복방법으로 즉시항고 마련, 이송 반복에 따른 소송지연 피할 공익적 요청 → 심급관할 위반 기속력은 상급심 구속 X\n∵ 심급의 이익, 이송된 법원이 대법원이라면 사실 주장·입증 기회 박탈 → 그러나 이송 받은 하급심은 구속 O ∵ 하급심·상급심 법원 간 반복 전전이송 불합리 결과 초래, 민사소송의 심급구조 [94마1059] → 상급심불구속설", "관할"],
  ["005.ㄹ", "서울특별시 서초구에 사는 甲은 수원시에 사는 乙에게 甲 소유의 X토지(인천광역시 소재)를 대금 2억 원에 매도하였다. 甲이 乙을 상대로 매매대금과 지연손해금을 청구하는 소를 제기하였다.§★ 甲이 서울동부지방법원에 위 소를 제기하였는데, 乙이 관할위반의 항변을 하지 아니하고 매매계약의 효력을 다투는 답변서를 제출하여 그것이 진술간주된 경우, 서울동부지방법원은 관할권을 가진다.", false, "▸ 불출석하여 그가 제출한 서면이 '진술간주'된 경우는 변론관할 X → 반드시 출석하여 현실적으로 변론 및 진술을 해야 변론관할 생김 [80마403] → 설문에서 동부지법에는 관할 없고, '진술간주'라서 변론관할도 생기기 X", "관할"],
  ["006.①", "★ ■보충 불법행위로 인한 손해배상과 관련하여 제기되는 채무부존재확인의 소는 불법행위지의 법원에 토지관할이 인정된다.", true, "▸ 불법행위로 인한 손해배상과 관련한 채무부존재확인소송은 제18조 불법행위지 근거한 토지관할 O [2011그65]", "관할"],
  ["006.②", "★ 약속어음의 의무이행을 구하는 소송의 토지관할권은 지급지를 관할하는 법원에 있다.", true, "제9조(어음·수표 지급지의 특별재판적) 어음·수표에 관한 소를 제기하는 경우에는 지급지의 법원에 제기할 수 있다.", "관할"],
  ["006.④", "■보충 영업에 관한 채무의 이행을 구하는 소는 제소 당시 채권 추심 관련 업무를 실제로 담당하는 채권자의 영업소 소재지 법원에 제기할 수 있다.", true, "▸ 민법 467조 2항의 '영업에 관한 채무'는 영업과 관련성 있는 채무 의미, '현영업소'는 변제 당시 기준 그 채무와 관련된 채권자의 영업소로서 주된 영업소(본점) 한정되지 않고 그 채권 추심 관련 업무를 실제로 담당하는 영업소 포함 O [2021마6868]", "관할"],
  ["007.①", "★ 사무소나 영업소에 계속하여 근무하는 사람에 대한 소는 그 업무와 관련이 없더라도 근무지 관할법원에 제기할 수 있다.", true, "▸ 제7조", "관할"],
  ["007.②", "★ 채권자가 수익자에 대하여 제기하는 사해행위의 취소 및 소유권이전등기의 말소등기청구의 소는 그 말소등기절차를 이행할 등기관서 소재지의 법원에 제기할 수 있다.", true, "▸ 채권자취소소송은 취소로 인해 형성되는 법률관계의 의무이행지 O, 원상회복이 등기말소라면 제21조에 따른 등기관서가 있는 곳 O → 취소 대상인 법률행위의 의무이행지 X [2002마1156]", "관할"],
  ["007.③", "★ ■보충 불법행위의 가해행위지와 결과발생지가 다른 경우, 그 불법행위로 인한 손해배상책임에 대한 채무부존재확인의 소는 가해행위지나 결과발생지 관할법원에 제기할 수 있다.", true, "▸ 불법행위로 인한 손해배상과 관련한 채무부존재확인소송은 제18조 불법행위지 근거한 토지관할 O [2011그65]", "관할"],
  ["007.④", "사무소 또는 영업소가 있는 사람이 그 사무소 또는 영업소의 업무와 관련이 있는 소를 제기하는 경우에는 그 사무소 또는 영업소가 있는 곳의 법원에 제기할 수 있다.", false, "제12조(사무소·영업소가 있는 곳의 특별재판적) 사무소 또는 영업소가 있는 사람에 대하여 그 사무소 또는 영업소의 업무와 관련이 있는 소를 제기하는 경우에는 그 사무소 또는 영업소가 있는 곳의 법원에 제기할 수 있다.\n▸ '사람에 대하여' 소를 제기하는 경우로서 그가 '피고'인 경우를 의미함 → 지문처럼 '원고'인 경우에는 틀린 지문", "관할"],
  ["007.⑤", "동일한 교통사고에 기하여 수인의 피해자들이 가해자를 상대로 제기하는 손해배상청구의 소는 공동원고 중 1인의 청구에 대한 관할권이 있는 법원에 제기할 수 있다.", true, "제25조(관련재판적) ② 소송목적이 되는 권리나 의무가 여러 사람에게 공통되거나 사실상 또는 법률상 같은 원인으로 말미암아 그 여러 사람이 공동소송인으로서 당사자가 되는 경우에는 제1항의 규정을 준용한다.", "관할"],
  ["008.ㄱ", "■보충 국제재판관할 합의의 유형이 분명하지 아니한 경우 그 합의로 정해진 관할은 전속적인 것으로 추정한다.", true, "국제사법 제8조(합의관할) ③ 합의로 정해진 관할은 전속적인 것으로 추정한다. [2022.1.4. 개정신설]", "관할"],
  ["008.ㄴ", "★ 대출금채권의 채권자와 채무자 사이에 있었던 관할합의의 효력은 그 채권의 특정승계인에게 미친다.", true, "▸ 채권의 특정승계인(채권양수인)에게 관할합의 효력 O ∵ 관할합의는 권리행사의 조건이자 실체적 이해의 변경이므로 당사자가 자유롭게 권리관계 내용 결정하는 지명채권에서는 승계 O [2005마902]", "관할"],
  ["009.ㄴ", "★ 특허권 등의 지식재산권에 관한 소를 제기하는 경우에는 민사소송법 제2조부터 제23조까지의 규정에 따른 관할법원 소재지를 관할하는 고등법원이 있는 곳의 지방법원의 전속관할로 한다.", true, "제24조(지식재산권 등에 관한 특별재판적) ② 특허등의 지식재산권에 관한 소를 제기하는 경우에는 제2조부터 제23조까지의 규정에 따른 관할법원 소재지를 관할하는 고등법원이 있는 곳의 지방법원의 전속관할로 한다. 다만, 서울고등법원이 있는 곳의 지방법원은 서울중앙지방법원으로 한정한다.\n▸ 전속관할임에도 심판편의 이송이 가능한 유일한 예외 규정임", "관할"],
  ["009.ㄷ", "★ 원고가 사해행위취소의 소의 채권자인 경우 사해행위취소에 따른 원상회복으로서의 소유권이전등기 말소등기의무의 이행지는 원고의 주소지이다.", false, "▸ 채권자취소소송은 취소로 인해 형성되는 법률관계의 의무이행지 O, 원상회복이 등기말소라면 제21조에 따른 등기관서가 있는 곳 O → 취소 대상인 법률행위의 의무이행지 X, 원고의 주소지 X [2002마1156]", "관할"],
  ["009.ㄹ", "★ 사무소 또는 영업소에 계속하여 근무하는 사람이 원고로서 소를 제기하는 경우에는 그 사무소 또는 영업소가 있는 곳을 관할하는 법원에 소를 제기할 수 있다.", false, "▸ '사람에 대하여' → 사무소·영업소 계속 근무자가 '원고'가 아니라 '피고'인 경우임", "관할"],
  ["010.①", "★ 소송목적의 값이 5억 원을 초과하는 민사사건은 지방법원 및 지방법원지원의 합의부에서 제1심으로 심판한다.", true, "민사 및 가사소송의 사물관할에 관한 규칙 제2조(지방법원 및 그 지원 합의부의 심판범위) 지방법원 및 지방법원지원의 합의부는 소송목적의 값이 5억 원을 초과하는 민사사건을 제1심으로 심판한다. [개정 2022.1.28]\n▸ 당시 '2억 원'으로 출제되었으나 2022년 개정규칙에 맞추어 지문을 '5억 원'으로 변형함", "관할"],
  ["010.④", "★ 근저당권설정자와 근저당권자 사이에 이루어진 관할합의의 효력은 근저당권 부담부의 소유권을 취득한 부동산 양수인에게 미친다.", false, "▸ 물권의 특정승계인에게는 관할합의의 효력 X → 근저당권설정자와 근저당권자 사이의 관할합의는 그 부동산 소유권의 양수인에게 효력 X [94마536]", "관할"],
  ["011.①", "★ 甲이 乙, 丙, 丁을 공동피고로 하여 乙에 대하여는 3억 원의 대여금을, 丙에 대하여는 2억 원의 매매대금을, 丁에 대하여는 1억 원의 부당이득금을 각 청구하는 경우, 지방법원단독판사가 관할권을 갖는다.", false, "제27조(청구를 병합한 경우의 소송목적의 값) ① 하나의 소로 여러 개의 청구를 하는 경우에는 그 여러 청구의 값을 모두 합하여 소송목적의 값을 정한다.\n▸ 합산 6억 원 초과 → 합의부 관할 → 단독판사 관할 X", "관할"],
  ["011.③", "★ 甲과 乙이 매매계약을 체결하면서 '이 매매계약과 관련된 제1심 소송은 부산지방법원만을 관할법원으로 한다'는 유효한 합의를 하였고, 그 후 甲이 乙을 상대로 위 매매계약에 기한 대금지급청구 소송을 부산지방법원에 제기한 경우, 부산지방법원은 현저한 손해나 지연을 피하기 위한 이송을 할 수 있다.", true, "▸ 전속적 관할합의는 전속관할 X, 임의관할 O → 법원은 공익상 필요에 의해 다른 법원 이송 O [2007마1328]", "관할"],
  ["012.①", "甲과 乙은 '甲이 乙에게 X 부동산을 대금 10억 원에 매도한다'는 매매계약을 체결하면서, 각자의 의무이행기한에 대하여는 별도의 약정을 하지 않았다.§★ 甲과 乙이 이 사건 계약을 체결하면서 '이 사건 계약과 관련된 제1심 소송은 인천지방법원만을 관할법원으로 한다'는 유효한 합의를 하였고, 그 후 乙에 대한 매매대금 채권이 丙에게 양도되었는데, 丙의 주소지가 광주지방법원의 토지관할구역 내에 있는 경우, 丙은 광주지방법원에 乙을 상대로 매매대금(양수금)의 지급을 구하는 소를 제기할 수 없다.", false, "▸ 채권의 특정승계인(채권양수인)에게 관할합의 효력 O ∵ 관할합의는 권리행사의 조건이자 실체적 이해의 변경이므로 당사자가 자유롭게 권리관계 내용 결정하는 지명채권에서는 승계 O [2005마902]", "관할"],
  ["기타민소15", "★ 관할에 관한 전속적 합의를 한 경우에는 당사자가 합의하지 아니한 법원으로 이송할 수 없다.", false, "▸ 전속적 관할합의는 전속관할 X, 임의관할 O → 법원은 공익상 필요에 의해 다른 법원 이송 O [2007마1328]", "관할"],
  ["기타민소24", "★ 전속적 관할합의도 전속관할이므로 소송의 이송은 허용되지 않는다.", false, "▸ 전속적 관할합의는 전속관할 X, 임의관할 O → 법원은 공익상 필요에 의해 다른 법원 이송 O [2007마1328]", "관할"],
  ["013.ㄴ", "★ 관할위반을 이유로 한 당사자의 이송신청은 단지 법원의 직권발동을 촉구하는 의미밖에 없으므로 이송신청 기각결정에 대하여는 즉시항고가 허용되지 않으나, 법원이 이송신청에 대하여 재판하지 않은 경우에는 재판에 영향을 미친 헌법위반이 있음을 이유로 한 특별항고가 허용된다.", false, "▸ 관할위반의 경우 당사자는 이송신청권 X → 법원이 이송 거부한 경우에도 당사자는 즉시항고권 X, 특별항고권 X → 재항고도 각하 [93마524]", "관할"],
  ["013.ㄷ", "★ 당사자가 즉시항고를 하지 아니하여 이송결정이 확정된 경우, 전속관할의 규정을 위반한 이송결정이라고 하더라도 원칙적으로 기속력이 인정된다.", true, "▸ 전속관할 위반한 이송결정도 기속력 O ∵ 이송결정 불복방법으로 즉시항고 마련, 이송 반복에 따른 소송지연 피할 공익적 요청", "관할"],
  ["013.ㄹ", "★ 심급관할을 위반한 이송결정의 기속력은 이송 받은 동일 심급의 법원과 하급심 법원에는 미치지만 상급심 법원에는 미치지 않는다.", true, "▸ 전속관할 위반한 이송결정도 기속력 O → 심급관할 위반 기속력은 상급심 구속 X\n∵ 심급의 이익, 이송된 법원이 대법원이라면 사실 주장·입증 기회 박탈 → 그러나 이송 받은 하급심은 구속 O ∵ 하급심·상급심 법원 간 반복 전전이송 불합리 결과 초래, 민사소송의 심급구조 [94마1059] → 상급심불구속설", "관할"],
  ["014.ㄱ", "항소장이 항소제기 기간 내에 제1심 법원 이외의 법원에 제출되었다 하더라도 항소제기의 효력이 인정된다.", false, "▸ 항소기간 준수 여부는 항소장이 제1심 법원에 접수된 때를 기준으로 판단, 항소장이 항소기간 내에 제1심 법원 이외의 법원에 제출되었어도 항소제기 효력 X [92마146]", "관할"],
  ["014.ㄷ", "★ 소송을 이송한 경우에 있어서 법률상 기간의 준수 여부는 소송이 이송된 때를 기준으로 하여야 한다.", false, "▸ 이송한 경우 법률상 기간 준수 여부는 이송된 때가 아닌 이송한 법원에 소가 제기된 때를 기준으로, 소멸시효 중단에 관하여도 동일 적용 [83다1981, 2007다54610]", "관할"],
  ["015.ㄱ", "★ 지방법원 본원 합의부가 지방법원 단독판사의 판결에 대한 항소사건을 항소심으로 심판하는 도중에 소가가 1억 5천만 원에서 5억 5천만 원으로 변경되면 이 사건을 합의사건의 항소심인 고등법원으로 이송하여야 한다.", false, "▸ 단독사건을 지법 합의부가 항소심으로 심판하는 도중 합의부 관할 소송이 새로 추가·변경되거나 반소로 제기되어도 계속 심판함 ∵ 심급관할은 '제1심' 법원의 존재에 의하여 결정되는 전속관할 [92다2066]", "관할"],
  ["016.ㄱ", "★ 지방법원 단독판사는 소송에 대하여 관할권이 있는 경우라도 상당하다고 인정하면 직권으로 소송의 전부 또는 일부를 같은 지방법원 합의부에 이송할 수 있으나, 당사자는 이러한 이송에 대해 신청권이 없다.", false, "제34조(관할위반 또는 재량에 따른 이송) ② 지방법원 단독판사는 소송에 대하여 관할권이 있는 경우라도 상당하다고 인정하면 직권 또는 당사자의 신청에 따른 결정으로 소송의 전부 또는 일부를 같은 지방법원 합의부에 이송할 수 있다.\n▸ 심판편의의 이송은 당사자에게 신청권 O (관할위반 이송의 경우 당사자의 신청권이 없는 것과 구별)", "관할"],
  ["016.ㄴ", "★ 당사자가 관할위반을 이유로 이송신청을 한 경우, 법원이 그 신청에 따른 직권발동으로 이송결정을 한 경우에는 즉시항고가 허용되지만, 항고심에서 당초의 이송결정이 취소되었다 하더라도 이에 대한 신청인의 재항고는 허용되지 않는다.", true, "▸ 당사자 신청에 따른 직권발동으로 이송결정 → 즉시항고 O(39조) → 항고심에서 당초 이송결정 취소 시 최초의 이송 신청인은 재항고 X → 재항고 각하 [2017마1332]", "관할"],
  ["016.ㄷ", "★ 지방법원 본원 합의부가 지방법원 단독판사의 판결에 대한 항소사건을 제2심으로 심판하는 도중에 지방법원 합의부의 관할에 속하는 소송이 새로 추가된 경우에는 지방법원 본원 합의부가 그 소송을 고등법원으로 이송하여야 한다.", false, "▸ 단독사건을 지법 합의부가 항소심으로 심판하는 도중 합의부 관할 소송이 새로 추가·변경되거나 반소로 제기되어도 계속 심판함 ∵ 심급관할은 '제1심' 법원의 존재에 의하여 결정되는 전속관할 [92다2066]", "관할"],
  ["017.②", "★ 법원이 전속관할을 위반한 소에 관해 심리하다가 관할법원으로 이송하면 그때까지 한 심리는 권한 없는 법원이 한 것으로서 무효로 된다.", false, "제40조(이송의 효과) ① 이송결정이 확정된 때에는 소송은 처음부터 이송 받은 법원에 계속된 것으로 본다.\n▸ 소송계속의 이전 효과 → 소제기 당시 시효중단·기간준수 효력 유지", "관할"],
  ["018.①", "★ 본소가 단독사건인 경우에 피고가 반소로 합의사건에 속하는 청구를 한 때에는 당사자는 관할위반을 이유로 본소와 반소를 합의부로 이송하여 달라는 신청을 할 수 있다.", true, "제269조(반소) ② 본소가 단독사건인 경우에 피고가 반소로 합의사건에 속하는 청구를 한 때에는 법원은 직권 또는 당사자의 신청에 따른 결정으로 본소와 반소를 합의부에 이송하여야 한다.\n▸ 이는 당사자가 관할위반을 이유로 이송을 신청할 수 있는 예외에 해당함", "관할"],
  ["기타민소02", "★ 지방법원 단독판사는 소송에 대하여 관할권이 있는 경우라도 전속관할에 속하는 것이 아닌 한 상당하다고 인정하면 직권 또는 당사자의 신청에 따른 결정으로 소송의 전부 또는 일부를 같은 지방법원 합의부에 이송할 수 있다.", true, "제34조(관할위반 또는 재량에 따른 이송) ② 지방법원 단독판사는 소송에 대하여 관할권이 있는 경우라도 상당하다고 인정하면 직권 또는 당사자의 신청에 따른 결정으로 소송의 전부 또는 일부를 같은 지방법원 합의부에 이송할 수 있다.", "관할"],
  // 제척기피회피,
  ["SS민소1.①", "★ 평균적 일반인으로서의 당사자의 관점에서 법관과 사건과의 관계로 인하여 법관이 불공정한 재판을 할 수 있다는 의심을 가질 만한 객관적인 사정이 있더라도 실제로 법관에게 편파성이 존재하지 않으면 기피가 인정될 수 없다.", false, "▸ 기피에서 '법관에게 공정한 재판을 기대하기 어려운 사정이 있는 때'는 우리 사회 평균적 일반인 관점에서 법관과 사건과의 관계(특수한 사적 관계, 특별한 이해관계 등)로 인하여 법관이 불공정한 재판을 할 수 있다는 의심할 만한 객관적인 사정 있고, 단순한 주관적 우려·추측 넘어 합리적이라 인정될 만한 때 → 실제로 법관에게 편파성 존재 않거나 공정한 재판 가능하더라도 기피 O [2018스563]", "제척기피회피"],
  ["SS민소1.⑤", "■보충 기피신청을 당한 법관이 그 사건에 관하여 직무를 집행하지 아니하게 된 경우에는 기피신청은 그 목적을 잃게 되어 기피신청의 이익이 없게 된다.", true, "▸ 기피신청 당한 법관이 그 사건에 관하여 직무 집행하지 않게 되었다면 기피신청은 그 목적을 잃어 기피신청 재판 이익 X [2023마8007]\n[참고판례] 법관에 대한 기피신청에 불구하고 법원이 44조 단서로 종국판결 선고하면 기피신청 재판 이익 X ∵ 그 법관을 사건 심리에서 배제할 목적 소멸 [93마1184]", "제척기피회피"],
  ["019.ㄱ", "■보충 항소심에서 제척이유가 있는 법관이 소송에 관여하였음을 이유로 상고하였더라도 판결에 영향이 없다면 심리불속행으로 인한 상고기각판결을 하여야 한다.", true, "상고심절차에 관한 특례법 제4조(심리의 불속행) ① 대법원은 상고이유에 관한 주장이 다음 각 호의 어느 하나의 사유를 포함하지 아니한다고 인정하면 더 나아가 심리를 하지 아니하고 판결로 상고를 기각한다. 6. 「민사소송법」 제424조 제1항 제1호부터 제5호까지에 규정된 사유가 있는 경우 ③ 상고이유에 관한 주장이 제1항 각 호의 사유를 포함하는 경우에도 다음 각 호의 어느 하나에 해당할 때에는 제1항의 예에 따른다. 2. 원심판결과 관계가 없거나 원심판결에 영향을 미치지 아니하는 때\n▸ 제척이유 있는 법관의 소송관여는 '절대적 상고이유'지만 이와는 별개로 판결결과에 영향 없다면 심리불속행 상고기각 가능 O", "제척기피회피"],
  ["019.ㄴ", "★ 상고심에서 파기환송되기 전의 원심판결에 관여한 법관은 파기환송된 사건에 관여하지 못한다.", true, "제436조(파기환송, 이송) ② 사건을 환송받거나 이송 받은 법원은 다시 변론을 거쳐 재판하여야 한다. 이 경우에는 상고법원이 파기의 이유로 삼은 사실상 및 법률상 판단에 기속된다. ③ 원심판결에 관여한 판사는 제2항의 재판에 관여하지 못한다.", "제척기피회피"],
  ["019.ㄷ", "★ 제척신청에 정당한 이유가 있다는 결정에 대하여는 즉시항고를 할 수 있다.", false, "제47조(불복신청) ① 제척 또는 기피신청에 정당한 이유가 있다는 결정에 대하여는 불복할 수 없다.", "제척기피회피"],
  ["019.ㄹ", "★ 종중 규약을 개정한 종중 총회 결의에 대한 무효확인을 구하는 소가 제기되었는데 원심 재판부를 구성한 판사 중 1인이 당해 종중의 구성원인 경우, 그 판사는 민사소송법 제41조 제1호에 정한 '당사자와 공동권리자·공동의무자의 관계에 있는 자'에 해당하지 아니하므로 당해 재판에 관여할 수 있다.", false, "▸ 사건 당사자와 공동권리자·공동의무자 관계인 소송목적에 공통되는 법률상 이해관계 있는 경우 → 종중원의 재산·신분상 권리관계에 직접 영향 미치는 종중규약을 개정한 총회결의의 효력 유무 관련 소송에서 판사 중 1인이 종중원이라면 제척 O [2009다102254]", "제척기피회피"],
  ["020.⑤", "제척의 이유가 있는 법관이 판결에 관여한 경우에는 절대적 상고이유에 해당한다.", true, "제424조(절대적 상고이유) ① 판결에 다음 각호 가운데 어느 하나의 사유가 있는 때에는 상고에 정당한 이유가 있는 것으로 한다.\n2. 법률에 따라 판결에 관여할 수 없는 판사가 판결에 관여한 때", "제척기피회피"],
  ["021.①", "★ 피고 종중의 회장 등 그 임원을 선출하고, 그 종중 규약을 개정하는 결의의 무효확인을 구하는 소에서 법관이 피고 종중의 중중원이라는 사실은 제척이유에 해당한다.", true, "▸ 사건 당사자와 공동권리자·공동의무자 관계인 소송목적에 공통되는 법률상 이해관계 있는 경우 → 종중원의 재산·신분상 권리관계에 직접 영향 미치는 종중규약을 개정한 총회결의의 효력 유무 관련 소송에서 판사 중 1인이 종중원이라면 제척 O [2009다102254]", "제척기피회피"],
  ["021.②", "★ 법관 제척의 이유가 되는 전심관여는 최종변론과 판결의 합의에 관여하거나 종국판결과 더불어 상급심의 판단을 받는 중간적인 재판에 관여하는 것은 물론 최종변론 전의 변론이나 증거조사 또는 기일지정의 재판에 관여하는 경우도 포함된다.", false, "▸ 제척사유에 있어 '실질적 관여'는 최종변론과 판결 합의 관여 혹은 중간적 재판에 관여해야 O → 최종변론 前의 변론이나 증거조사·기일지정 같은 소송지휘 재판 등에 관여한 경우는 X [96다56115]", "제척기피회피"],
  ["021.③", "★ 재심사건에 있어서 그 재심의 대상으로 삼고 있는 원재판은 법관의 제척이유에 해당하는 '불복사건의 이전심급의 재판'에 해당하지 않는다.", true, "▸ 재심대상재판인 원판결 관여는 제척에서의 전심 X [2000재다87]", "제척기피회피"],
  ["022.ㄹ", "★ 법관과 당사자 일방이 부부였으나 이혼한 사이인 경우, 해당 법관은 그 사건에서 제척된다.", true, "제41조(제척의 이유) 법관은 다음 각호 가운데 어느 하나에 해당하면 직무집행에서 제척된다.\n1. 법관 또는 그 배우자나 배우자이었던 사람이 사건의 당사자가 되거나, 사건의 당사자와 공동권리자·공동의무자 또는 상환의무자의 관계에 있는 때", "제척기피회피"],
  ["023.⑤", "★ 기피신청이 이유 있다는 결정에 대하여는 불복신청을 할 수 없다.", true, "제47조(불복신청) ① 제척 또는 기피신청에 정당한 이유가 있다는 결정에 대하여는 불복할 수 없다.", "제척기피회피"],
  ["024.⑤", "★ 법원은 제척 또는 기피신청이 있는 경우에는 그 재판이 확정될 때까지 소송절차를 정지하여야 하지만 종국판결을 선고하는 경우에는 그러하지 아니하다.", true, "제48조(소송절차의 정지) 법원은 제척 또는 기피신청이 있는 경우에는 그 재판이 확정될 때까지 소송절차를 정지하여야 한다. 다만, 제척 또는 기피신청이 각하된 경우 또는 종국판결을 선고하거나 긴급을 요하는 행위를 하는 경우에는 그러하지 아니하다.", "제척기피회피"],
  // 당사자,
  ["025.①", "★ 소장에 표시된 피고의 당사자능력이 인정되지 않는 경우에도 소장 전체의 취지를 합리적으로 해석하여 인정되는 올바른 당사자능력자로 피고의 표시를 정하는 것은 허용된다.", true, "▸ 당사자능력 없는 자 → 있는 자 O [96다3852]\n지점 → 본점 / 학교·학교장 → 지자체·학교법인·설립자개인 / 읍·면 → 국가·지자체", "당사자"],
  ["025.②", "★ 원고가 채무자의 1순위 상속인이 상속을 포기한 사실을 알지 못하여 그 1순위 상속인을 피고로 하여 소를 제기한 경우, 그 상속포기를 통해 비로소 상속인으로 된 자를 피고로 삼고자 하는 당사자표시정정 신청은 당사자의 동일성이 인정될 수 없어 부적법하다.", false, "▸ 선순위 상속인의 '상속포기'로 선순위 상속인에서 후순위 상속인(확정된 당사자)으로 표시정정 하는 경우 등에도 모두 표시정정 허용 O [2009다49964]", "당사자"],
  ["025.③", "★ 당사자의 동일성이 인정되는 당사자표시정정은 항소심에서도 허용된다.", true, "▸ 당사자 동일성 인정된다면 항소심에서도 표시정정 O [96다3852]", "당사자"],
  ["025.④", "★ 사망한 자를 상대로 소를 제기한 경우, 상고심에서 그 상속인으로 당사자표시정정을 하는 것은 허용되지 않는다.", true, "▸ 이미 사망한 자를 상대로 소를 제기하였다가 상고심에서 당사자표시정정 X [2010다105310]", "당사자"],
  ["025.⑤", "★ 당사자표시정정은 당사자로 표시된 자의 동일성이 인정되는 범위 안에서 그 표시만을 변경하는 경우에 한하여 허용되므로 종래의 당사자에 곁들여서 새로운 당사자를 추가하는 것은 허용되지 않는다.", true, "▸ 원고 甲을 상고인으로 추가하는 당사자표시정정 X ∵ 표시정정은 표시된 당사자와 동일성 있어야, 甲의 새로운 상소제기일 뿐 [91다8333]", "당사자"],
  ["026.ㄴ", "★ 피고로 표시된 자가 이미 사망한 사실을 모른 원고가 그를 피고로 표시하여 제소한 경우, 사망자의 제1순위 상속인이 상속을 포기하였다고 하더라도 제1순위 상속인으로 당사자표시정정이 허용된다.", false, "▸ 이미 사망한 사람 → 상속인 표시정정 O ∵ 사망자를 피고로 표시하였어도 표시를 그릇한 것에 불과할 뿐 실질적으로 최초부터 상속인이 피고 [69다1230] → 채무자 사망 후 채권자가 1순위 상속인의 상속포기 사실을 모르고 1순위 상속인을 상대로 소 제기한 경우도 마찬가지 → 후순위 상속인으로 표시정정 O [2009다49964]", "당사자"],
  ["026.ㄷ", "★ 甲 주식회사의 대표이사 乙이 개인 명의로 소를 제기하였다면 乙로부터 甲 주식회사로 원고의 표시를 변경하는 당사자표시정정은 허용되지 아니한다.", true, "▸ 회사 대표이사가 개인 명의로 소 제기 후 회사를 당사자로 추가하고 개인 명의의 소를 취하함으로써 당사자 변경 가져오는 당사자추가신청은 부적법 ∵ 표시정정은 실질적으로 당사자 변경되면 X, 필수적 공동소송 아닌 소송 도중 당사자 추가 불허되므로 [96다41496] → 개인에서 회사(그가 대표이사라 해도)로 표시정정 X ∵ 동일성 X → 원고 측이므로 피고경정도 X", "당사자"],
  ["026.ㄹ", "★ 소장의 당사자표시가 착오로 잘못 기재되고 이와 같이 잘못 기재된 당사자를 표시한 본안판결이 선고되어 확정되었다면, 그 확정판결의 효력은 잘못 기재된 당사자와 동일성이 인정되는 범위 내에서 적법하게 확정된 당사자에 대하여 미친다.", true, "▸ 당사자표시가 착오로 잘못 기재되었음에도(박종宜) 표시정정 없이 간과판결 선고·확정 → 판결 무효 아니며 동일성 있고 적법하게 확정된 당사자(박종직)에게 판결 효력 O [2008다27615]", "당사자"],
  ["SS민소2.①", "★ 원고가 사망 사실을 모르고 사망자를 피고로 표시하여 소를 제기하였는데 사망자의 제1순위 상속인이 상속을 포기한 경우, 그 상속을 포기한 자로 표시를 정할 수 없다.", true, "▸ 채무자 사망 후 채권자가 1순위 상속인의 상속포기 사실을 모르고 1순위 상속인을 상대로 소 제기한 경우도 마찬가지 → 후순위 상속인으로 표시정정 O [2009다49964] → 포기한 자로 표시정정 할 수는 없음", "당사자"],
  ["SS민소2.⑤", "★ 법원이 원고의 부적법한 당사자표시정정신청을 받아들이고 피고도 이에 명시적으로 동의하여 정정된 원고와 피고 사이에 변론이 진행된 다음 본안판결이 선고된 경우, 그 후 당사자표시정정의 적법성을 문제삼는 것은 소송경제나 신의칙에 비추어 허용되지 아니한다.", true, "▸ 부적법한 표시정정신청에 대해 법원이 허용하고 피고도 동의하여 판결 선고되면 더 이상 상소 X ∵ 소송경제, 신의칙 [2008다11276]", "당사자"],
  ["027.②", "甲은 乙에게 대여금청구의 소를 제기하였다.§★ 甲이 乙의 사망 사실을 알면서도 乙의 상속인이 누구인지를 확인할 수가 없어서 일단 乙을 상대로 소를 제기하고 그 후 바로 사실조회신청을 통해 상속인을 확인하여 표시정정신청을 하였더라도 그러한 표시정정은 허용되지 않는다.", false, "▸ 사망 사실을 알면서도 그를 피고로 기재하여 소를 제기한 경우 그 상속인이 실질적인 피고이고 다만 소장 표시에 잘못 있었던 것에 불과하므로, 그 상속인으로 표시정정 O [2010다99040] (소송실무에서 사실조회 등을 통해 자주 이용되는 상황임)", "당사자"],
  ["027.③", "甲은 乙에게 대여금청구의 소를 제기하였다.§■보충 법원은 甲의 청구를 기각하였으며 이 판결이 확정된 후 甲이 사망하였다. 이후에 甲의 상속인인 丙이 재판에 관여할 수 없는 법관의 재판 관여를 이유로 재심을 제기하면서 재심원고를 그대로 甲으로 표시하였다면 丙으로의 표시정정이 허용된다.", true, "▸ 당사자가 사망한 후 그 상속인이 소를 제기하면서 피상속인 명의로 표시한 경우 상속인으로의 표시정정 허용 O [78다1283]", "당사자"],
  ["028.③", "★ 당사자능력 유무는 소제기 시를 기준으로 판단한다.", false, "▸ 당사자능력 등 소송요건의 존부 판정 시기는 사실심 변론종결 시 (다만 관할권은 제소 시 기준)", "당사자"],
  ["028.④", "★ 법인에 대하여 청산절차가 진행되어 청산종결의 등기가 경료되면, 실제 청산사무가 종료되었는지 여부를 불문하고 법인의 당사자능력은 소멸한다.", false, "▸ 법인에 관하여 청산종결등기 경료된 경우에도 청산사무 종료되었다고 할 수 없는 경우는 청산법인으로서 당사자능력 O [97다3408]", "당사자"],
  ["029.①", "★ 소 제기 당시 이미 사망한 사실을 모르고 원고가 사망한 자를 피고로 표시하여 소를 제기한 경우, 실질적인 피고가 사망자의 상속인이고 다만 그 표시에 잘못이 있는 것에 지나지 않는다고 인정되면, 상고심에서도 사망자의 상속인으로 피고표시정정을 할 수 있다.", false, "▸ 이미 사망한 자를 상대로 소를 제기하였다가 '상고심'에서 당사자표시정정 X [2010다105310]", "당사자"],
  ["029.②", "★ 甲이 소송대리인에게 소송위임을 한 다음 소 제기 전에 사망하였는데, 소송대리인이 甲이 사망한 것을 모르고 甲을 원고로 표시하여 소를 제기하였다면, 소 제기는 적법하고 시효중단 등 소 제기의 효력은 甲의 상속인들에게 귀속된다.", true, "▸ 의뢰인이 소송대리인에게 소송위임을 하고 소제기 전에 이미 사망했는데 소송대리인이 모르고 그를 원고로 표시하여 제기한 소는 적법 O ∵ 당사자가 사망해도 95조 1호에 의해 소송대리권 소멸하지 X → 상속인들은 수계절차 O(233조 유추적용) [2014다210449]", "당사자"],
  ["029.④", "★ 소송계속 중 어느 일방 당사자의 사망에 의한 소송절차의 중단을 간과하고 변론이 종결되어 제1심 판결이 선고된 경우, 위 판결은 당연무효가 아니고 항소의 대상이 된다.", true, "▸ 소송계속 중 일방 사망에 의한 중단을 간과하고 변론종결, 판결선고 → 상속인이 수계신청하여 판결 송달받아 상고 or 사실상 송달받아 상고장 제출하고 '상고심'에서 수계절차 밟으면 → 수계와 상고 적법 O ∵ 중단 간과 판결은 위법하나 당연무효 X, 대리권흠결 상소·재심 추인 규정 유추 [94다28444]", "당사자"],
  ["030.④", "★ 피고에게 소장부본이 송달된 후에 피고가 사망하면 그 소송은 피고의 상속인들에게 승계되며, 이 경우 만약 피고의 소송대리인이 있다면 소송이 중단되지 않지만, 판결이 선고되면 그때 비로소 소송이 중단된다.", false, "▸ 소송계속 중 당사자 사망한 경우 소송대리인이 있으면 소송절차가 중단되지 않지만, 심급대리 원칙상 그 판결정본이 소송대리인에게 송달된 때 소송절차 중단 [94다23500] → 특별수권 없는 경우\n사망자의 소송대리인에게 상소제기 특별수권 있다면 판결 송달되어도 절차 중단 X, 상소기간 진행 O, 도과하면 판결 확정, 소송대리인·상속인·상대방에 의해 적법하게 상소 제기되면 판결 확정되지 X [2007다22859]", "당사자"],
  ["031.ㄱ", "★ 소 제기 후 소장 송달 전에 피고가 사망한 경우 제1심 판결이 선고되더라도 그 판결은 효력이 없다.", true, "▸ 사망자 피고로 한 소제기는 대립당사자구조 X, 실질적 소송관계 X → 그 상태로 선고된 제1심판결 당연무효 → 상속인 항소 X, 소송수계 X → 이러한 법리는 소제기 후 '소장 부본 송달 전' 피고 사망의 경우도 마찬가지 [2014다34041]", "당사자"],
  ["031.ㄴ", "★ 소 제기 후 소장 송달 전에 피고가 사망한 경우, 1심판결 후 그 판결에 대한 상속인들의 소송수계신청은 적법하다.", false, "▸ 사망자 피고로 한 소제기는 대립당사자구조 X, 실질적 소송관계 X → 그 상태로 선고된 제1심판결 당연무효 → 상속인 항소 X, 소송수계 X [2014다34041]", "당사자"],
  ["031.ㄷ", "★ 소 제기 후 소장 송달 전에 피고가 사망하였는데 사망한 자를 피고로 하여 제1심 판결이 선고된 경우, 그 판결에 대한 상속인들의 항소는 적법하다.", false, "▸ 사망자 피고로 한 소제기는 대립당사자구조 X, 실질적 소송관계 X → 그 상태로 선고된 제1심판결 당연무효 → 상속인 항소 X, 소송수계 X → 이러한 법리는 소제기 후 '소장 부본 송달 전' 피고 사망의 경우도 마찬가지 [2014다34041]", "당사자"],
  ["032.④", "★ 법인 아닌 사단의 대표자 자격에 관하여 상대방 당사자가 자백하더라도 이는 법원을 구속하지 않는다.", true, "▸ 비법인사단의 대표자 자격에 관한 사항은 직권조사사항으로서 자백에 구속되지 않음 [70다44]", "당사자"],
  ["032.⑤", "★ 실종자를 당사자로 한 판결이 특별한 조건 없이 선고되어 확정된 후에 실종선고가 확정되고 그로 인한 사망간주의 시점이 소 제기 전으로 소급하는 경우, 위 판결은 당사자능력이 없는 사망한 사람에 대한 것이므로 무효이다.", false, "▸ 소제기 후 실종선고 확정으로 소급하여 소제기 전 사망간주 되더라도 실종선고 확정 시 사망으로 중단된 것 [77다81]\n▸ 위 소급효 제한 법리는 실종자를 피고로 판결 확정된 후 실종선고 확정된 경우도 동일 → 실종선고로 소제기 전 사망간주 되더라도 판결 유효 O, 확정되면 기판력 O → 공시송달이었다면 상속인 소송수계 O + 추완항소 O [92다2455]", "당사자"],
  ["033.③", "★ 법인 아닌 사단이 당사자능력이 있는지 여부는 사실심 변론종결 시를 기준으로 판단한다.", true, "▸ 당사자능력 등 소송요건의 존부 판정 시기는 사실심 변론종결 시 (다만 관할권은 제소 시 기준)", "당사자"],
  ["034.②", "소제기시에는 조합이었으나 사실심변론종결시에 비법인사단으로서의 실체를 갖추었다면 당사자능력이 인정된다.", true, "▸ 당사자능력은 소송요건으로서 '변론종결시'를 기준으로 판단", "당사자"],
  ["034.③", "★ 사망한 당사자의 이름으로 소가 제기되었음을 간과하고 본안판결을 한 경우, 그 판결은 당연무효이며 상소나 재심도 허용되지 않는다.", true, "▸ 소 제기 전 사망 간과판결 : 당연무효 → 상속인에게 효력 X, 시효중단 효력 X → 상속인의 항소 X, 재심 X, 소송수계 X → 모두 각하", "당사자"],
  ["034.⑤", "지방자치단체는 당사자능력이 있으나 소송수행자 지정을 통해 그 소속 공무원이 소송대리하도록 할 수는 없다.", false, "▸ '국가'를 당사자로 하는 소송에서 '소송수행자' O → 지방자치단체는 소송수행자 X", "당사자"],
  ["035.①", "★ 공동선조와 동일한 성과 본을 가진 남자에 한하여 성년이 됨과 동시에 별도의 가입절차 없이 종원이 된다.", false, "▸ 종원의 자격을 성년 남자로만 제한하고 여성에게 종원 자격 부여하지 않는 종래 관습은 효력 X ∵ 종중은 공동선조 분묘수호 등 목적의 종족단체, 공동선조 사망과 동시에 후손에 의해 자연발생적 성립, 개인존엄·양성평등 위배로 정당성·합리성 X → 공동선조와 성·본을 같이하는 후손은 성별 구별 없이 성년이 되면 당연히 종중의 구성원이 된다고 보는 것이 '조리'에 합당 [2002다1178]", "당사자"],
  ["036.②", "등기의무자가 아닌 자나 등기에 관한 이해관계가 있는 제3자가 아닌 자를 상대로 등기의 말소절차이행을 구하는 소는 당사자적격이 없는 자를 상대로 한 것이므로 부적법하다.", true, "▸ 등기명의인이 아닌 위조행위자를 상대로 말소등기청구 → 각하 [93다39225]\n▸ 말소회복등기와 양립할 수 없는 등기는 회복의 전제로서 말소의 대상이 될 뿐, 그 등기명의인은 부동법 59조 회복등기에 등기상 이해관계 있는 제3자 X → 그를 상대로 회복등기에 대한 승낙청구 → 각하 ∵ 당사자적격 X [2003다35567]", "당사자"],
  ["036.④", "★ 채권자가 채권자대위권을 행사할 당시 이미 채무자가 그 권리를 재판상 행사하여 패소확정판결을 받았더라도 채권자는 채무자를 대위하여 위 채무자의 권리를 행할 당사자적격이 있다.", false, "▸ 대위소송 당시 이미 채무자가 재판상 권리 행사했다면 설령 패소판결 받았더라도 대위소송은 당사자적격 X [92다30016]", "당사자"],
  ["037.④", "★ 원인무효의 근저당권설정등기에 터 잡아 근저당권 이전의 부기등기가 마쳐진 경우, 근저당권의 양수인을 상대로 근저당권설정등기의 말소청구를 하여야 한다.", true, "▸ 근저당권설정등기 말소등기청구는 양수인만을 상대로 O, 양도인을 상대로 X (피고적격 X) ∵ 부기등기는 기존 권리들을 등기부상 명시하는 것 뿐 그 등기로 새로운 권리 발생 X → 양도인 상대 말소청구 각하 [2000다19526]", "당사자"],
  ["038.ㄱ", "■보충 순차로 소유권이전등기가 경료된 경우에, 중간의 등기명의인에 대한 진정한 등기명의의 회복을 위한 소유권이전등기청구의 소는 피고적격 흠결로 각하하여야 한다.", true, "▸ 진정명의 회복 원인 소유권이전등기청구는 현재 등기명의인을 상대로 O, 현재 등기명의인 아닌 자는 피고적격 X [2015다240645]", "당사자"],
  ["039.ㄹ", "★ 비법인사단인 채무자가 사원총회 결의 없이 제3채무자를 상대로 소를 제기하여 부적법 각하 판결을 받았더라도 이미 채무자가 권리를 행사한 이상 채권자가 제3채무자를 상대로 제기한 채권자대위소송은 부적법하다.", false, "▸ 비법인사단이 사원총회 결의 없이 제기한 총유재산에 관한 소는 소제기 특별수권 결하여 부적법, 비법인사단의 소제기 의사결정 없음 → 각하 확정된다면 채무자(비법인사단) 스스로 권리 행사한 것 X → 비법인사단의 채권자의 대위소송은 적법 O [2018다210539]\ncf. 채무자의 소송의 기각된 경우에는 권리행사 O", "당사자"],
  ["040.②", "★ 법인 아닌 사단인 종교단체의 대표자 또는 구성원의 지위에 관한 확인소송에서 그 단체를 상대로 하지 않고 대표자 또는 구성원 개인을 상대로 한 청구는 확인의 이익이 없어 부적법하다.", true, "▸ 이사회결의무효확인소송 같은 단체 내부 분쟁의 피고적격은 단체(=회사)에 O, 선출된 대표자 개인을 상대로는 결의 무효확인 구할 소의 이익 X [80다2425] → 단체피고설 [통판]\n비법인사단인 종교단체에서도 대표자·구성원의 지위에 관한 확인소송에서 단체가 아닌 대표자·구성원 개인을 상대로 하면 확인의 이익이 없는 문제로 볼 수도 있지만, 피고적격이 없다고 볼 수도 있음(私見) [2011다101155]", "당사자"],
  ["041.①", "★ 법인 아닌 사단에 해산사유가 발생했다고 하더라도 청산사무가 완료될 때까지 청산의 목적 범위 내에서 그 법인의 당사자능력은 계속 유지된다.", true, "▸ 법인 아닌 사단에 해산사유가 발생하더라도 청산사무가 완료될 때까지 청산의 목적 범위 내에서 당사자능력 유지됨 [92다23087]", "당사자"],
  ["042.④", "★ 종중의 대표자를 선출한 결의의 무효나 부존재의 확인을 구하는 소송에서 피고 적격을 가지는 자는 종중이다.", true, "▸ 이사회결의무효확인소송 같은 단체 내부 분쟁의 피고적격은 단체(=회사)에 O, 선출된 대표자 개인을 상대로는 결의 무효확인 구할 소의 이익 X [80다2425] → 단체피고설 [통판]", "당사자"],
  ["043.ㄹ", "★ 乙 명의의 부동산에 甲 명의로 소유권이전청구권 보전을 위한 가등기를 마쳤는데, 丙 앞으로 소유권이전등기가 마쳐지고 甲 명의의 가등기가 적법한 원인 없이 말소된 경우, 甲은 乙을 상대로 가등기의 회복등기철차의 이행을 구하는 소를 제기하여야 한다.", false, "▸ 말소등기 회복등기 구하는 소는 회복등기의무자, 즉 말소될 당시의 소유자만 피고적격 O → 가등기 마친 부동산이 제3취득자 앞으로 소유권이전등기 마쳐진 후 가등기가 말소되었다면 말소 당시 소유자인 제3취득자를 상대로 회복등기 청구해야 [2006다43903]", "당사자"],
  ["044.②", "★ 대표이사를 선임한 이사회결의에 무효사유가 있는 경우, 당해 대표이사 개인을 피고로 하여 이사회결의의 무효확인의 소를 제기할 수 있다.", false, "▸ 이사회결의무효확인소송 같은 단체 내부 분쟁의 피고적격은 단체(=회사), 선출된 대표자 개인은 피고적격 X [80다2425] → 단체피고설 [통판]", "당사자"],
  // 소송능력대리인,
  ["SS민소3.②", "미성년자의 후견인이 상대방의 소 또는 상소제기에 관하여 소송행위를 하는 경우에는 그 후견감독인으로부터 특별한 권한을 받을 필요가 없다.", true, "제56조(법정대리인의 소송행위에 관한 특별규정) ① 미성년후견인, 대리권 있는 성년후견인 또는 대리권 있는 한정후견인이 상대방의 소 또는 상소 제기에 관하여 소송행위를 하는 경우에는 그 후견감독인으로부터 특별한 권한을 받을 필요가 없다.\n▸ 상대방의 소·상소제기에 관하여 소송행위를 하는 것은 '수동'을 의미함", "소송능력대리인"],
  ["SS민소3.③", "★ 미성년자의 후견인이 소의 취하를 하기 위해서는 후견감독인으로부터 특별한 권한을 받아야 하나, 후견감독인이 없는 경우에는 수소법원으로부터 허가를 받아야 한다.", false, "제56조(법정대리인의 소송행위에 관한 특별규정) ② 제1항의 법정대리인이 소의 취하, 화해, 청구의 포기·인낙 또는 제80조에 따른 탈퇴를 하기 위해서는 후견감독인으로부터 특별한 권한을 받아야 한다. 다만, 후견감독인이 없는 경우에는 가정법원으로부터 특별한 권한을 받아야 한다.\n▸ 무엇보다 '수소법원'이 아니라 '가정법원'이고, 엄밀히는 용어도 '허가'가 아니라 '특별수권'을 받아야 함", "소송능력대리인"],
  ["045.ㄱ", "■보충 미성년자는 소송무능력자이므로 미성년자가 임금을 청구하는 소송에서도 소송능력이 없다.", false, "제55조(제한능력자의 소송능력) ① 미성년자 또는 피성년후견인은 법정대리인에 의해서만 소송행위를 할 수 있다. 다만, 다음 각 호의 경우에는 그러하지 아니하다. 1. 미성년자가 독립하여 법률행위를 할 수 있는 경우\n근로기준법 제68조(임금의 청구) 미성년자는 독자적으로 임금을 청구할 수 있다.\n▸ 미성년자는 원칙적으로 법정대리인에 의해서만 소송행위 할 수 있으나 미성년자 자신의 노무제공에 따른 임금청구는 근로기준법 68조에 의해 미성년자가 독자적 O [80다3149]", "소송능력대리인"],
  ["045.ㄴ", "★ 소송능력에 관한 사항은 직권조사사항으로서 재판상 자백의 대상이 되지 않는다.", true, "▸ 소송능력은 직권조사사항일 뿐만 아니라 직권탐지사항임", "소송능력대리인"],
  ["045.ㄷ", "★ 법원이 소송능력의 흠결을 간과하여 판결을 선고하면 이는 위법하므로 무능력자가 승소하였는지 패소하였는지를 가리지 않고 상소 또는 재심사유가 된다.", false, "▸ 소송무능력임을 간과한 판결은 상소(4호 유추), 재심(3호 유추) 가능 → 그러나 규정 취지상 무능력자가 승소한 경우 그 '상대방'이 상대방의 소송무능력을 들어 상소·재심 할 수는 X [통설]", "소송능력대리인"],
  ["046.②", "★ 미성년후견인이 소의 취하, 화해, 청구의 포기를 하는 경우에는 후견감독인으로부터 특별한 권한을 받아야 하지만, 상대방의 상소 제기에 관해 소송행위를 하는 경우에는 그러한 권한을 받을 필요가 없다.", true, "제56조(법정대리인의 소송행위에 관한 특별규정) ① 미성년후견인, 대리권 있는 성년후견인 또는 대리권 있는 한정후견인이 상대방의 소 또는 상소 제기에 관하여 소송행위를 하는 경우에는 그 후견감독인으로부터 특별한 권한을 받을 필요가 없다.", "소송능력대리인"],
  ["047.③", "미성년자인 甲 명의의 소유권이전등기가 마쳐진 X 토지에 관하여 매매를 원인으로 하여 乙 명의로 소유권이전등기가 마쳐졌다. 甲이 乙을 상대로 X 토지에 관한 乙 명의의 소유권이전등기 말소등기절차의 이행을 구하는 소를 제기하였다.§★ 법원은 기간을 정하여 甲의 소송능력을 보정하도록 명하여야 하며, 설령 보정하는 것이 지연됨으로써 손해가 생길 염려가 있는 경우에도 甲에게 소송행위를 하게 할 수 없다.", false, "제59조(소송능력 등의 흠에 대한 조치) 소송능력·법정대리권 또는 소송행위에 필요한 권한의 수여에 흠이 있는 경우에는 법원은 기간을 정하여 이를 보정하도록 명하여야 하며, 만일 보정하는 것이 지연됨으로써 손해가 생길 염려가 있는 경우에는 법원은 보정하기 전의 당사자 또는 법정대리인으로 하여금 일시적으로 소송행위를 하게 할 수 있다.", "소송능력대리인"],
  ["048.ㄴ", "★ 당사자가 소송대리인에게 소송위임을 한 다음 소 제기 전에 사망하였는데, 소송대리인이 당사자의 사망 사실을 모르고 그 당사자를 원고로 표시하여 소를 제기하였다면, 이러한 소의 제기는 적법하고 시효중단 등 소 제기의 효력은 상속인들에게 귀속된다.", true, "▸ 의뢰인이 소송대리인에게 소송위임을 하고 소제기 전에 이미 사망했는데 소송대리인이 모르고 그를 원고로 표시하여 제기한 소는 적법 O ∵ 당사자가 사망해도 95조 1호에 의해 소송대리권 소멸하지 X → 상속인들은 수계절차 O(233조 유추적용) [2014다210449]", "소송능력대리인"],
  ["048.ㄷ", "★ 소송대리권의 범위는 특별한 사정이 없는 한 해당 심급에 한정되므로, 상소 제기의 특별수권을 받지 않은 소송대리인의 소송대리권은 그 심급의 판결을 송달받은 때 소멸된다.", true, "▸ 소송계속 중 당사자 사망한 경우 소송대리인이 있으면 소송절차가 중단되지 않지만, 심급대리 원칙상 그 판결정본이 소송대리인에게 송달된 때 소송절차 중단 [94다23500]\n사망자의 소송대리인에게 상소제기 특별수권 있다면 판결 송달되어도 절차 중단 X [2007다22859]", "소송능력대리인"],
  ["048.ㄹ", "★ 선정당사자가 변호사와 소송위임계약을 체결하면서 선정자로부터 별도의 수권을 받지 않고 변호사 보수에 관한 약정을 한 경우, 그 약정은 선정자의 추인이 없더라도 선정자에 대하여 효력이 있다.", false, "▸ 선정당사자가 선정자들로부터 별도 수권 없이 변호사보수약정 했어도 선정자들이 추인하지 않는 한 선정자들에 효력 X ∵ 변호사보수약정은 소송수행에 필요한 사법상 행위 아니므로 [2009다105246]", "소송능력대리인"],
  ["049.ㄷ", "★ 항소심 판결이 상고심에서 파기되고 사건이 항소심 법원으로 환송되더라도 환송 전 항소심에서의 소송대리인의 소송대리권은 부활하지 않는다.", false, "▸ 항소심판결이 상고심에서 파기되고 사건이 환송되는 경우 환송받은 항소심법원이 환송 전 절차 속행해야 하고 환송 전 항소심에서의 소송대리인의 소송대리권 부활 O → 항소심 사건 소송대리인의 위임사무는 항소심 판결정본 송달되면 종료되나, 상고심 파기되면 환송 후 항소심소무도 처리해야 위임사무 종료 따른 보수청구 가능 [2014다1447]", "소송능력대리인"],
  ["049.ㄹ", "★ 당사자에게 여러 소송대리인이 있는 경우, 항소기간은 소송대리인 중 1인에게 최초로 판결정본이 송달되었을 때부터 진행한다.", true, "▸ 여러 사람이 공동대리권 행사시 1인에게 송달 가능한 180조는 여러 명의 '소송대리인'에게는 적용 여지 X ∵ 93조 각자대리 원칙 → 법원은 판결정본을 각각의 소송대리인에게 송달하여야 → 다만 소송대리인 중 1인에게 최초로 판결정본 송달 시에 당사자에 대한 판결정본 송달의 효력 발생, 그때부터 항소기간 기산 ∵ 모든 소송대리인이 당사자 본인을 위해 송달받을 지위 O [2011마1335]", "소송능력대리인"],
  ["SS민소4.⑤", "★ 무권대리인이 한 소송행위의 추인은 소송행위 전체를 일괄하여야 하므로, 소취하 행위를 제외한 나머지 소송행위만을 추인하는 것은 허용되지 아니한다.", false, "▸ 무권대리인이 한 행위는 일괄추인이 원칙이나(무권대리인이 한 상소행위만 추인하는 것은 X), 소송혼란 우려 없고 소송경제상 적절하면 일부추인 O → 무권대리인이 선임한 변호사가 승소한 후 상대방이 항소하자 2심에서 소취하한 경우, 소 취하 행위만 제외하고 나머지 소송행위만 추인 O [69다60]", "소송능력대리인"],
  ["050.②", "甲이 乙을 상대로 제기한 X토지의 소유권이전등기말소 청구의 소의 항소심법원은 甲에게 소유권이 인정되지 않는다는 이유로 甲이 승소한 제1심 판결을 취소하고 甲의 청구를 기각하는 판결을 선고하였다. 이에 대하여 甲이 상고를 제기하였는데, 상고 법원은 항소심판결을 파기하고 항소심법원에 환송하는 판결을 선고하였다.§★ 환송 후 항소심의 판결정본이 환송 전 항소심의 甲의 대리인인 변호사 B에게 송달되면 송달로서의 효력이 생기지 않는다.", false, "▸ 항소심판결이 상고심에서 파기되고 사건이 환송되는 경우 환송받은 항소심법원이 환송 전 절차 속행해야 하고 환송 전 항소심에서의 소송대리인의 소송대리권 부활 O [2014다1447]", "소송능력대리인"],
  ["050.⑤", "★ 환송 후의 항소심판결에 대하여 乙이 적법하게 상고를 제기한 경우 환송 전의 상고심에서 乙을 대리하였던 변호사 E의 소송대리권은 환송 후의 상고심에서 부활하지 않는다.", true, "▸ 파기환송 되었다가 재상고 된 경우, (항소심 소송대리인의 소송대리권은 부활하고) 환송 전 상고심 소송대리인의 대리권이 부활하지는 X [96마148] → 환송 전후의 항소심과는 달리 재상고심은 새로운 절차이며 종전 상고심절차의 속행은 아니므로", "소송능력대리인"],
  ["051.②", "★ 소송절차가 진행되는 중에 법정대리권이 소멸한 경우에는 본인 또는 대리인이 상대방에게 그 사실을 통지하지 아니하면 소멸의 효력을 주장하지 못하지만, 상대방이 소멸 사실을 알고 있었다면 소멸의 효력을 주장할 수 있다.", false, "제63조(법정대리권의 소멸통지) ① 소송절차가 진행되는 중에 법정대리권이 소멸한 경우에는 본인 또는 대리인이 상대방에게 소멸된 사실을 통지하지 아니하면 소멸의 효력을 주장하지 못한다. 다만, 법원에 법정대리권의 소멸사실이 알려진 뒤에는 그 법정대리인은 제56조제2항의 소송행위를 하지 못한다.\n▸ 대표권 소멸을 통지하지 않았다면 상대방 악의·과실 불문하고 대표자 소송행위는 유효 ∵ 64조, 63조의 취지는 획일적 처리로 소송절차 안정·명확 취지 [95다52710]", "소송능력대리인"],
  ["052.②", "★ ■보충 원고가 국가를 상대로 부동산에 관한 소유권이전등기 청구를 하는 경우에 국가를 위한 소송담당자가 법무부장관의 승인 없이 원고의 청구를 인낙하면, 그 인낙은 효력이 없다.", false, "국가를 당사자로 하는 소송에 관한 법률 제7조(지정대리인의 권한) 제3조제1항·제2항, 제5조제1항 또는 제6조제2항에 따라 법무부장관, 각급 검찰청의 장(제13조에 따라 권한이 위임된 경우만 해당된다) 또는 행정청의 장이 지정한 사람은 그 소송에 관하여 대리인 선임을 제외한 모든 재판상의 행위를 할 수 있다.\n▸ 국가소송수행자로 지정된 자는 특별 수권 없이 청구 인낙 O, 법무부장관 등의 승인 없이 인낙했어도 내부적 지휘감독상 책임을 지는 것은 별론으로 소송법상 효력에 영향 없음 ∵ 국가를 당사자로 하는 소송에 관한 법률 7조(소송수행자는 대리인 선임 외의 모든 재판상 행위 할 수 있음) [95다3077] → 민소법 92조 참조", "소송능력대리인"],
  ["053.②", "★ 소송대리인에게 소송상 화해나 청구의 포기에 관한 특별수권이 되어 있다면 특별한 사정이 없는 한 그러한 소송행위에 대한 수권만이 아니라 그러한 소송행위의 전제가 되는 당해 소송물인 권리의 처분이나 포기에 대한 권한도 수여되어 있다고 보아야 한다.", true, "▸ 소송상 화해, 청구의 포기에 관한 특별수권 받은 소송대리인은 그 소송행위 자체 뿐 아니라 그 소송행위의 전제인 소송물인 권리의 처분·포기 권한, 즉 실체법상 화해할 권한도 수여된 것 O [93다52105]", "소송능력대리인"],
  // 소송요건,
  ["6_001.①", "★ 상고심 법원은 매매예약완결권이 제척기간 도과로 인하여 소멸되었다는 주장이 적법한 상고이유서 제출기간 경과 후에 상고인에 의하여 주장되었다 할지라도 이를 판단하여야 한다.", true, "▸ 상고이유서 제출기간 경과 후에 매매예약완결권 제척기간 도과 주장된 경우에도 상고법원은 판단하여야 ∵ 제척기간 도과 여부는 직권조사사항 [99다18725]", "소송요건"],
  ["6_001.②", "★ 순차적으로 경료된 소유권이전등기의 전부 말소를 구하는 소송에서, 후순위등기의 말소등기청구가 기각되고 그 판결이 확정됨으로써 직접적으로는 그 전순위등기의 말소등기의 실행이 불가능해졌다면 그 전순위등기의 말소를 구할 소의 이익이 없다.", false, "▸ 순차로 된 소유권이전등기에서 후순위등기의 말소청구가 패소확정 되어 그 전순위등기의 말소등기 실행이 불가능하게 되었더라도 그 전순위등기의 말소를 구할 소의 이익 O [93다20955]", "소송요건"],
  ["6_001.④", "★ 근저당권의 피담보채무에 관한 부존재확인의 소는 근저당권이 말소되면 확인의 이익이 없게 된다.", true, "▸ 근저당권의 피담보채무에 관한 부존재확인의 소는 근저당권이 말소되면 과거의 권리·법률관계 존부에 관한 것으로서 확인의 이익 X [2012다17585]", "소송요건"],
  ["6_002.①", "★ 당사자들이 부제소합의를 쟁점으로 소의 적법을 다투지 아니함에도 법원이 직권으로 부제소합의에 위배되었다는 이유로 소가 부적법하다고 판단하기 위해서는 당사자에게 그와 같은 법률적 관점에 대하여 의견을 진술할 기회를 주어야 하고, 부제소합의를 하게 된 동기 및 경위, 당사자의 진정한 의사 등에 관하여도 충분히 심리를 하여야 한다.", true, "▸ 부제소합의의 위배로 제기된 소는 권리보호이익 없고 신의칙에도 어긋나므로 부제소합의 위배는 직권조사사항 → 당사자가 부제소합의의 쟁점으로 적법 여부 다투지 않는데도 법원이 직권 부적법 각하하려면 당사자 의견진술 기회 주고 충분히 심리해야 ∵ 재판청구권 포기라는 중대한 소송법상 효과 발생 [2011다80449]", "소송요건"],
  ["6_003.①", "甲종중(대표자 乙)은 종중원 丙을 상대로 A토지에 관하여 명의신탁 해지를 원인으로 한 소유권이전등기청구의 소를 제기하였다.§★ 乙의 대표권의 유무는 소송요건에 해당하여 법원이 직권으로 조사할 사항이다.", true, "▸ 종중이 당사자인 경우 대표자의 적법한 대표권은 소송요건, 직권조사사항 → 자백 대상 X, 법원이 직권으로 탐지할 의무까지는 없더라도 적법성에 의심 갈 만한 사정 있으면 심리·조사할 의무 O [2009다22846]", "소송요건"],
  ["6_003.②", "甲종중(대표자 乙)은 종중원 丙을 상대로 A토지에 관하여 명의신탁 해지를 원인으로 한 소유권이전등기청구의 소를 제기하였다.§★ 乙의 대표권의 유무에 관한 사실은 자백의 대상이 될 수 있다.", false, "▸ 종중이 당사자인 경우 대표자의 적법한 대표권은 소송요건, 직권조사사항 → 자백 대상 X [2009다22846]", "소송요건"],
  ["6_003.③", "甲종중(대표자 乙)은 종중원 丙을 상대로 A토지에 관하여 명의신탁 해지를 원인으로 한 소유권이전등기청구의 소를 제기하였다.§★ 丙이 乙의 대표권의 유무에 관하여 주장하지 않더라도 법원으로서는 이미 제출된 자료에 의하여 그 대표권의 유무에 의심이 갈 만한 사정이 엿보인다면 그에 관하여 심리하여야 한다.", true, "▸ 종중이 당사자인 사건에서 종중 대표자에게 적법한 대표권 존부는 소송요건에 관한 것으로서 직권조사사항이고 자백의 대상 X, 법원이 직권으로 탐지할 의무까지는 없더라도 의심 갈 만한 사정 있으면 심리·조사할 의무 O [2009다22846]", "소송요건"],
  ["6_004.ㄷ", "★ 종중이 원고인 소송에서 그 대표자 甲의 대표권 흠결을 이유로 소각하판결이 선고되어 확정되었더라도, 그 후 새로 소집된 종중총회에서 甲이 적법한 대표자로 선임되었다면 동일한 소를 다시 제기할 수 있다.", true, "▸ 소송판결도 소송요건 흠결에 기판력 발생 O → 다만 판결 확정 후 소송요건 흠결 보완하면 기판력 미치지 X → 당사자능력 없는 단체가 각하된 후 비법인사단 실체 갖추어 소 제기하면 기판력 X, 적법 O [2002다70181]", "소송요건"],
  ["6_004.ㄹ", "소를 각하한 제1심판결을 항소심법원이 취소하는 경우 원칙적으로 스스로 본안판결을 하여야 한다.", false, "제418조(필수적 환송) 소가 부적법하다고 각하한 제1심 판결을 취소하는 경우에는 항소법원은 사건을 제1심 법원에 환송하여야 한다. 다만, 제1심에서 본안판결을 할 수 있을 정도로 심리가 된 경우, 또는 당사자의 동의가 있는 경우에는 항소법원은 스스로 본안판결을 할 수 있다.", "소송요건"],
  ["6_004.ㅁ", "★ 종중이 당사자인 사건에서 그 대표자에게 적법한 대표권이 있다는 주장에 대하여 상대방이 자백하였더라도 법원은 직권으로 조사하여 그 대표자에게 적법한 대표권이 없음을 확인하였다면 소를 각하하여야 한다.", true, "▸ 종중이 당사자인 사건에서 종중 대표자에게 적법한 대표권 존부는 소송요건에 관한 것으로서 직권조사사항이고 자백의 대상 X [2000다42908]", "소송요건"],
  ["6_005.③", "★ 직권조사사항은 자백의 대상이 될 수 있다.", false, "▸ 종중이 당사자인 사건에서 종중 대표자에게 적법한 대표권 존부는 소송요건에 관한 것으로서 직권조사사항이고 자백의 대상 X [2000다42908]", "소송요건"],
  ["6_016.①", "★ 민사소송에서 청구의 취지는 내용 및 범위를 명확히 알아볼 수 있도록 구체적으로 특정되어야 하고 청구취지의 특정 여부는 직권조사사항이므로, 청구취지가 특정되지 않은 경우에는 법원은 직권으로 보정을 명하고 보정명령에 응하지 않을 때에는 소를 각하하여야 한다.", true, "▸ 민사소송에서 청구취지는 내용·범위 명확히 알아볼 수 있도록 구체적 특정되어야, 특정 여부는 직권조사사항 → 청구취지 특정되지 않은 경우 법원은 피고 이의 불문하고 직권으로 보정 명하여야 → 당자자 명백히 간과하고 있는데 보정 기회 주지 않고 당사자 전혀 예상 못하였던 청구취지 불특정 이유로 각하하면 석명의무 위반, 위법 O → 보정 명했는데 불응하면 소 각하 O [2011다111459]", "소송요건"],
  ["6_016.③", "★ 확인의 이익 등 소송요건은 사실심의 변론종결시를 기준으로 판단하여야 하므로, 사실심 변론종결 이후에 소송요건이 흠결되거나 그 흠결이 치유된 경우에도 상고심에서 이를 참작할 수 없다.", false, "▸ 확인의 이익 등 소송요건은 직권조사사항, 사실심 변론종결 이후에 소송요건이 흠결되거나 흠결 치유된 경우 상고심에서도 참작하여야 [2019다247385]", "소송요건"],
  // 공통소의이익,
  ["6_006.⑤", "甲 종중이 소유한 X 임야를 乙이 무단으로 점유·사용하고 있다. 이에 A는 甲 종중을 대표하여 乙을 상대로 차임 상당 부당이득반환청구의 소를 제기하였다.§★ 甲 종중이 위 소송에서 승소확정판결을 받고 10년이 경과한 후 위 확정판결에 의한 채권의 소멸시효 중단을 위해 다시 동일한 소(후소)를 제기하더라도, 법원은 특별한 사정이 없는 한 후소를 곧바로 소의 이익이 없음을 이유로 각하해서는 안 된다.", true, "▸ 확정된 승소판결 받은 자가 동일한 청구 소 제기하면 권리보호이익 없으나, 예외적으로 소멸시효기간 10년 경과 임박하면 시효중단 위한 재소는 소의 이익 O → 이 경우 후소법원은 그 확정된 권리의 요건 구비 다시 심리할 수 X ∵ 전소 승소 확정판결 내용에 저촉 금지 [2018다22008]\n그러나 전소 변론종결 후 발생한 변제·소멸시효완성 등 채권소멸사유는 후소 심리대상 O → 후소에서 채무자 항변 인정되면 '기각'하여야 [2018다24349]", "공통소의이익"],
  ["6_007.①", "근저당권설정등기의 말소등기절차의 이행을 구하는 소송 도중에 그 근저당권설정등기가 경매절차에서의 매각을 원인으로 하여 말소된 경우에는 더 이상 근저당권설정등기의 말소를 구할 법률상 이익이 없다.", true, "▸ 근저당설정등기 말소등기 구하는 중 근저당설정등기가 경매로 말소되거나 말소될 수밖에 없는 경우는 말소를 구할 법률상 이익 X [2002다57904]", "공통소의이익"],
  ["6_007.②", "★ 확정판결에 의한 채권의 소멸시효기간 경과가 임박한 경우에 그 시효중단을 위한 재소는 소의 이익이 있고, 이 경우 후소 법원으로서는 그 확정된 권리를 주장할 수 있는 모든 요건이 구비되어 있는지에 관하여 다시 심리하여야 한다.", false, "▸ 확정된 승소판결 받은 자가 동일한 청구 소 제기하면 권리보호이익 없으나, 예외적으로 소멸시효기간 10년 경과 임박하면 시효중단 위한 재소는 소의 이익 O ∵ 다른 중단사유 압류·가압류·승인도 1회 제한 없음, 파산·회생 면책제도와의 균형 → 이 경우 후소법원은 그 확정된 권리의 요건 구비 다시 심리할 수 X ∵ 전소 승소 확정판결 내용에 저촉 금지 [2018다22008]", "공통소의이익"],

  ["6_007.⑤", "★ 소각하 판결의 기판력은 그 판결에서 확정한 소송요건의 흠결에 관하여 미친다.", true, "▸ 소송판결 O → 소송요건 흠결에 기판력 [97다25521] → 각하⇨각하", "공통소의이익"],
