  ["052.③", "★ 부동산에 대한 점유취득시효가 완성된 후 취득시효 완성을 원인으로 한 소유권이전등기를 하지 않고 있는 사이에 그 부동산에 관하여 제3자 명의의 소유권이전등기가 경료된 경우라 하더라도, 당초의 점유자가 계속 점유하고 있고 소유자가 변동된 시점을 기산점으로 삼아도 다시 취득시효의 점유기간이 경과한 경우에는, 점유자로서는 제3자 앞으로의 소유권 변동시를 새로운 점유취득시효의 기산점으로 삼아 2차의 취득시효의 완성을 주장할 수 있다.", true, "▸ 취득시효 완성 후 제3자 명의 등기가 마쳐진 경우에도 계속 점유하고 있는 점유자는 소유자 변동 시점을 기산점으로 삼아 2차의 취득시효의 완성 주장 O → 완성 전 취득자가 권리의무 당사자로서 불이익 받는 법리는 새로이 2차 취득시효 개시되고 그 취득시효기간 경과 전에 소유명의자 다시 변경된 경우에도 마찬가지로 적용 O [2007다15172]\n→ '소유자무변동요건' 폐기", "취득시효"],
  ["053.ㄷ", "甲은 乙 명의로 소유권보존등기가 마쳐진 X 토지를 乙로부터 매수하여 소유권이전등기를 마치지 아니한 채 20년 넘게 점유하고 있다. 다음 중 옳은 것을 모두 고른 것은?§★ X 토지에 관하여 丙 명의로 유효한 소유권이전등기가 마쳐지게 되면 乙의 甲에 대한 취득시효 완성을 원인으로 한 소유권이전등기의무는 이행불능이 되므로, 甲이 乙을 상대로 그 의무 이행을 구하는 소가 계속되고 있는 중에 丙 명의의 소유권이전등기가 적법하게 말소되더라도 甲은 승소할 수 없다.", false, "▸ 점유취득시효 완성 후 제3자가 취득하면 완성자는 그에게 대항할 수 없으나, 그 후 어떠한 사유로 취득시효완성 당시 소유자에게 소유권 회복되면 그 소유자에게 시효취득 효과 다시 주장 O ∴ 취득시효완성 당시의 소유자에 대한 소유권이전등기청구권 상실한 것 ×, 이행불능으로 된 것일 뿐 [90다14225]", "취득시효"],
  ["054.ㄴ", "甲은 乙 소유의 X 토지를 25년 동안 점유해오고 있다. 甲이 乙을 상대로 취득시효 완성을 원인으로 한 소유권이전등기청구권을 행사하였다.§★ 만약 甲의 X에 대한 취득시효가 완성된 후 甲이 점유를 상실하였다면, 특별한 사정이 없는 한 甲의 소유권이전등기청구권은 점유를 상실한 날로부터 10년간 행사하지 않으면 소멸시효가 완성한다.", true, "▸ 취득시효 완성자의 소유권이전등기청구권은 채권적 청구권으로 10년 소멸시효 → 취득시효 완성으로 인한 소유권이전등기청구권은 목적물 점유 계속되는 한 시효 진행 × → 점유 상실해도 시효이익 포기 아닌 한 소유권이전등기청구권 바로 소멸 × → 그러나 완성자가 점유 상실한 때로부터 취득시효 완성으로 인한 소유권이전등기청구권의 소멸시효 10년 진행 O [95다34866]", "취득시효"],
  ["SS4.③", "★ 점유자가 취득시효기간의 만료로 일단 소유권이전등기청구권을 취득한 이상, 그 후 점유를 상실하였다고 하더라도 이를 시효이익의 포기로 볼 수 있는 경우가 아닌 한, 이미 취득한 소유권이전등기청구권은 곧바로 소멸되지 아니한다.", true, "▸ 취득시효 완성으로 인한 소유권이전등기청구권은 목적물 점유 계속되는 한 시효 진행 × → 점유 상실해도 시효이익 포기 아닌 한 소유권이전등기청구권 바로 소멸 × → 그러나 완성자가 점유 상실한 때로부터 취득시효 완성으로 인한 소유권이전등기청구권의 소멸시효 10년 진행 O [95다34866]", "취득시효"],
  ["SS4.⑤", "★ 원소유자가 취득시효의 완성 이후 그 등기가 있기 전에 그 토지를 제3자에게 처분하거나 제한물권의 설정 등 소유자로서의 권리를 행사하였다 하여도 특별한 사정이 없는 한 시효취득자에 대한 관계에서 불법행위가 성립하지 아니하나, 시효취득자는 위 처분행위를 통하여 그 토지의 소유권이나 제한물권 등을 취득한 제3자에 대하여 취득시효의 완성 및 그 권리취득의 소급효를 들어 대항할 수 있다.", false, "▸ 원소유자가 취득시효 완성 이후 그 등기 전에 처분·제한물권설정·현상변경 등 소유자로서 권리 행사해도 원칙적으로 불법행위 ×, 완성자는 완성 후 소유권·제한물권을 취득한 제3자에 대해 취득시효 완성 및 소급효로 대항 × [2005다75910]", "취득시효"],
  ["SS5.ㄴ", "甲 소유의 X 토지를 丙이 乙에게 시가 3억 원에 매도하여 乙은 2015. 2. 3. X 토지에 관한 소유권이전 등기를 마쳤다. 乙은 2004. 6. 3.부터 2025. 10. 20. 현재까지 X 토지를 평온·공연하게 점유하고 있다.§2025. 10. 20. 현재 甲은 乙에게 소유권이전등기의 말소를 청구할 수 있다.", false, "▸ 乙은 매수인이므로 04. 6. 3.부터 자주·평온·공연하게 점유해왔고 이에 따라 24. 6. 3. 점유취득시효가 완성됨 → 그때 乙 명의의 등기도 실체관계 부합하게 되면서 소유권을 취득함(그 전에는 甲의 소유이므로 丙·乙 간의 매매는 무권리자 처분행위로서 원인무효인 등기였음)\n→ 따라서 甲은 乙에게 소유권이전등기 말소 청구 ×", "취득시효"],
  ["SS5.ㄷ", "甲 소유의 X 토지를 丙이 乙에게 시가 3억 원에 매도하여 乙은 2015. 2. 3. X 토지에 관한 소유권이전 등기를 마쳤다. 乙은 2004. 6. 3.부터 2025. 10. 20. 현재까지 X 토지를 평온·공연하게 점유하고 있다.§★ 2024. 10. 3. 甲이 丙의 처분행위를 승인한 경우, 甲은 丙에게 부당이득의 반환을 청구할 수 없다.", false, "▸ 무권리자 처분행위의 추인을 한 경우, 권리자는 무권리자가 처분행위로 얻은 이득에 대해 부당이득반환청구 O [2001다44291]", "취득시효"],
  ["055.②", "미등기 토지에 대해 점유취득시효 완성 후 취득시효 완성 당시 소유자의 상속인 명의로 소유권보존등기가 마쳐진 경우 점유자는 그 등기명의인에게 취득시효 완성을 주장할 수 있다.", true, "▸ 상속은 포괄승계로서 새로운 이해관계인이 아니고 등기 시점은 의미가 없음\n[관련판례] 증여받은 자가 소이등 없던 중 소유자 사망으로 상속 개시된 후 점유자 취득시효 완성 → 취득시효 완성 후 수증자 앞으로 증여 원인 소이등 되면 완성 후 새로운 이해관계인 O → 다만 수증자가 상속인 중 1인이라면 적어도 자기 상속지분 범위 내에서는 새로운 이해관계인 ×, 점유자에 대해 취시 완성 원인 소이등의무 부담 [2011다59445]", "취득시효"],
  ["055.⑤", "지상건물과 함께 그 대지를 매수하여 현실 인도를 받고, 인접 토지와의 경계선을 정확하게 확인하지 않아 인접 토지의 일부를 자신이 취득한 대지에 속한다고 믿은 경우, 특별한 사정이 없는 한 그 인접 토지의 일부에 대한 자주점유는 인정되지 않는다.", false, "▸ 자주점유는 점유권원 성질에 의해 객관적 결정 → 지상건물과 함께 그 대지 매수취득하여 점유 개시함에 있어 매수인이 인접토지와의 경계선 정확하게 확인 않고 착오로 인접토지의 일부를 매수취득한 대지에 속하는 것으로 믿고 점유하여 왔다면 인접토지에 대한 점유는 소유의 의사 O [92다2844]", "취득시효"],
  ["056.ㄴ", "甲은 乙 명의로 등기되어 있는 X 토지를 20년 간 소유의 의사로 평온·공연하게 점유하였다.§甲이 취득시효기간 만료로 소유권이전등기청구권을 취득한 후 乙에게 X 토지의 매수 제의를 하였다면, 甲은 시효의 이익을 포기한 것으로 보아야 한다.", false, "▸ 취득시효 기간 경과 후 매수 제의했다고 타주점유 ×, 시효이익 포기 × ∴ 분쟁해결을 위해 매수 시도 사례 허다함 [82다708, 90다12977]", "취득시효"],
  ["056.ㄹ", "★ 丙이 X 토지를 乙에게 유효하게 명의신탁한 바 있었고, 甲이 취득시효기간 만료로 소유권이전등기청구권을 취득한 후 위 명의신탁이 해지되어 X 토지의 등기명의가 乙에서 丙으로 이전되었다면, 특별한 사정이 없는 한 甲은 丙을 상대로 점유취득시효 완성을 원인으로 한 소유권이전등기를 청구할 수 있다.", false, "▸ 명의신탁된 부동산에 대하여 점유취득시효 완성 후 시효취득자가 소유권이전등기하기 전에 명의신탁 해지되어 명의수탁자로부터 명의신탁자에게 등기가 이전된 경우 명의신탁자는 완성 후 취득자 O, 그에게 취득시효 주장 × ∴ 내부적 소유권변동 없더라도 대외적으로는 완전히 새로운 소유권 변동 O [94다22484]", "취득시효"],
  ["057.④", "★ 자기 소유명의의 부동산에 관한 제3자의 취득시효가 완성된 사실을 모르고 그 부동산의 소유권을 타인에게 처분한 자에 대하여, 그 처분 후 비로소 취득시효를 주장하는 그 제3자는 그 처분으로 인한 손해배상책임을 물을 수 없을 뿐만 아니라 대상청구권도 주장하지 못한다.", true, "▸ 점유취득시효 완성 이후 그 등기 전에 처분·제한물권설정·현상변경 등 소유자로서 권리 행사해도 원칙적으로 불법행위 × → 처분 당시 알고 있었다면 불법행위 가능하나, 알지 못하고 처분했다면 불법행위 × → 손배청구 ×, 대상청구권도 ×", "취득시효"],
  ["058.⑤", "甲은 乙 소유의 X토지를 1975. 6. 1.부터 소유의 의사로 평온, 공연하게 20년간 점유하였다. 乙은 1997. 5. 1. X토지를 丙에게 매도하고 같은 날 소유권이전등기를 마쳐주었다.§★ 甲이 乙에 대해서 대상청구권을 행사하기 위해서는 乙이 丙에게 X토지의 소유권이전등기를 마쳐주기 전에 취득시효 완성을 이유로 권리를 주장하거나 소유권이전등기청구권을 행사하여야 한다.", true, "▸ 점유취득시효 등기청구권이 불능으로 되었다며 대상청구권 행사하려면 이행불능 전에 점유취득시효로 인한 권리 주장이나 등기청구권을 행사하였어야 [94다43825]", "취득시효"],
  ["059.ㄷ", "X 토지에 관하여 甲, 乙 명의로 순차 소유권이전등기가 되어 있었다. 乙 명의의 등기는 서류를 위조하여 경료한 무효의 등기였다. 甲이 등기를 회복하지 않고 있는 사이에 乙이 丙에게 X 토지를 매도하고 소유권이전등기를 마쳤다. 甲이 乙과 丙을 공동피고로 하여 각 피고들 명의의 소유권이전등기말소 청구의 소를 제기하였다. 乙과 丙은, 丙이 등기부취득시효 완성을 원인으로 소유권을 취득했다고 주장하고 있다.§★ 丙에게 등기부취득시효가 완성되었다는 사실이 증명된 경우 甲은 乙에 대하여 등기말소청구권의 이행불능을 이유로 「민법」제390조 상의 손해배상을 청구할 수 있다.", false, "▸ 소유자가 소유권에 기하여 등기명의인 상대로 등기말소나 진정명의회복 구하는 권리는 물권적 청구권으로서 방해배제청구권(214조) → 소유자가 그 후에 소유권 상실하면, 말소의무자에게 물권적청구권 실현 불능을 이행불능으로 390조 손해배상청구 × ∵ 390조 채무불이행 손해배상청구권은 계약·법률에 기하여 이미 성립한 채권관계에서 본래 채권이 동일성 유지하며 내용이 확장·변경된 것, 등기말소청구권 등 물권적 청구권은 권리자가 소유권 상실하면 그 발생 기반이 아예 없게 되어 더 이상 존재 자체 × [2010다28604]", "취득시효"],
  ["060.①", "■보충 등기원인이 누락된 소유권이전등기에 대해서는 등기부 취득시효가 성립할 수 없다.", false, "▸ 소유권이전등기에서 등기원인 누락되었더라도 실제의 권리관계를 표시함에 족할 정도로 동일·유사성 있으므로 245조 2항 '소유자로 등기한 자의 '등기'에 해당 O [96다8888]", "취득시효"],
  ["060.②", "★ 무효인 중복등기에 터 잡은 소유권이전등기에 관해서도 등기부 취득시효가 성립할 수 있다.", false, "▸ 245조 2항에서 말하는 등기는 부동산등기법 15조 1항 1부동산 1등기기록 원칙에 위배되지 않는 등기 → 선등기가 원인무효 아닌 경우에 중복보존등기나 그에 터잡은 등기로는 등기부취득시효 × [96다12511]", "취득시효"],
  ["060.③", "무권리자의 처분행위로 인한 소유권이전등기에 관하여 등기부 취득시효가 성립한 경우, 그로 인하여 소유권을 상실한 원래의 권리자는 부동산을 처분한 무권리자를 상대로 매매대금 상당의 부당이득반환을 청구할 수 있다.", false, "▸ 원인 없이 타인 소유 부동산에 소보등 마친 무권리자가 제3자에게 매도하고 소이등 마쳐도 특별한 사정 없는 한 소보등·소이등 모두 무효 → 나아가 제3자 등기부 취득시효 완성하여 원소유자 소유권 소급 상실하여 '손해'입은 경우라 해도 무권리자가 받은 매매대금은 원소유자에게 부당이득반환 × ∴ 원소유자 소유권 상실은 245조 2항에 따른 물권변동 효과일 뿐 무권리자·제3자 체결한 매매계약의 효력과는 직접 관계 없고 무권리자가 대금 받아 이익 있어도 '이로 인하여' 원소유자 손해 생긴 것도 아님 [2019다272275]", "취득시효"],
  ["060.④", "★ 등기부 취득시효가 완성되어 소유권을 취득한 후 그 부동산에 관한 시효완성자 명의의 등기가 적법한 원인 없이 말소된 경우, 그 시효완성자는 등기부 취득시효로 취득한 소유권을 상실한다.", false, "▸ 등기부취득시효 완성된 경우 별도로 이전등기청구권 발생 × → 등기부취득시효 완성 후 점유자 명의의 등기가 원인 없이 말소되거나 다른 사람 앞으로 등기가 된 경우 등기부취득시효 완성 원인으로 소유권이전등기청구 → 소유권에 기하여 방해배제청구 O [99다25785] ∴ 이미 소유자, 등기는 존속요건 ×", "취득시효"],
  ["061.ㄴ", "등기부취득시효에 관한 민법 제245조 제2항의 규정에 의하여 소유권을 취득하는 자는 10년간 반드시 그의 명의로 등기되어 있어야 하는 것은 아니고 앞 사람의 등기까지 아울러 그 기간동안 부동산의 소유자로 등기되어 있으면 된다고 할 것이다.", true, "▸ 등기부취득시효로 소유권 취득하는 자는 10년간 반드시 자신의 명의로 등기되어 있어야 하는 것은 × → 앞 사람 등기까지 아울러 그 기간 동안 부동산의 소유자로 등기되어 있으면 O [87다카2176] → 등기의 승계 O", "취득시효"],
  ["061.ㄹ", "★ 민법 제247조 제2항은 '소멸시효의 중단에 관한 규정은 점유로 인한 부동산소유권의 시효취득기간에 준용한다.'고 규정하고, 민법 제168조 제2호는 소멸시효 중단사유로 '압류 또는 가압류, 가처분'을 규정하고 있다. 따라서 취득시효기간의 완성 전에 부동산에 압류 조치가 이루어진 경우에는 취득시효의 중단사유가 될 수 있다.", false, "▸ 247조 2항은 소멸시효 중단규정을 점유취득시효에 준용하고, 168조 2호는 소멸시효 중단사유로 '압류·가압류·가처분' 규정 → 압류·가압류는 점유취득시효 중단사유 × ∴ 취득시효기간 완성 전에 부동산에 압류·가압류 조치 이뤄져도 종래 점유상태 계속 파괴된 것은 ×, 압류·가압류는 금전채권의 강제집행·보전 수단일 뿐 [2018다296878]", "취득시효"],
  // 공유·합유·총유,
  ["062.ㄴ", "★ 매도인에게 소유권이 유보된 자재가 매수인(수급인)과 제3자(도급인) 사이에 이루어진 도급계약의 이행으로 제3자(도급인) 소유 건물의 건축에 사용되어 부합된 경우, 제3자(도급인)는 소유권유보 사실에 대하여 선의·무과실이라도 매도인의 보상청구에 대해 이를 거부할 수 없다.", false, "▸ 261조 보상청구권이 인정되려면 261조 자체의 요건 외에 부당이득반환의 요건도 모두 충족되어야 → 매도인에게 소유권 유보된 자재가 제3자와 매수인 사이 도급계약 이행으로 제3자 소유 건물에 부합된 경우, 제3자가 도급계약에 제공된 자재의 소유권 유보 사실에 관하여 선의·무과실이라면, 선의취득 법리 유추적용하여 제3자가 자재 귀속 이익을 보유할 법률상 원인 O → 매도인은 제3자(도급인)를 상대로 보상청구 × [2009다15602]", "공유·합유·총유"],
  ["063.②", "甲과 乙은 각 1/2의 지분으로 X 건물을 공유하고 있다. X 건물은 丙 소유의 Y 토지 위에 건축되어 있다.§★ 甲이 X 건물을 배타적으로 사용하더라도 乙은 甲에게 X 건물의 인도를 청구할 수 없다.", true, "▸ 소수지분권자가 협의 없이 공유물 전부·일부를 독점적 점유할 경우 다른 소수지분권자는 공유물 인도청구 × [2018다287522]", "공유·합유·총유"],
  ["063.③", "甲과 乙은 각 1/2의 지분으로 X 건물을 공유하고 있다. X 건물은 丙 소유의 Y 토지 위에 건축되어 있다.§X 건물이 Y 토지 위에 무단으로 건축된 경우, 丙은 X 건물을 단독으로 점유하고 있는 甲을 상대로 甲의 지분 범위 내에서 X 건물의 철거를 청구할 수 있지만, X 건물에서 퇴거할 것을 청구할 수는 없다.", true, "▸ 건물소유자가 건물 소유 통해 타인 소유 토지 점유하더라도 토지소유자로서는 건물철거와 대지인도 청구할 뿐 자기 소유 건물 점유하는 자에 대해 퇴거청구 × → 건물 공유자에 대해서도 마찬가지 적용 ∴ 공유지분권은 소유권의 분량적 일부지만 독립된 소유권과 같은 성질 가지므로 공유자 중 1인이 공유물을 독점적 점유·사용·수익하더라도 제3자의 무단점유와는 다르고 지분 넘는 부분을 타인 점유로 볼 수는 × [2021다276256]", "공유·합유·총유"],
  ["063.④", "甲과 乙은 각 1/2의 지분으로 X 건물을 공유하고 있다. X 건물은 丙 소유의 Y 토지 위에 건축되어 있다.§甲과 乙이 X 건물을 일주일씩 교대로 사용하기로 하는 약정을 하였다면, 특별한 사정이 없는 한 그 약정은 乙의 지분을 양도받은 특정승계인 丁에게 승계된다.", true, "▸ 공유자간 '사용·관리' 특약은 공유지분의 특정승계인에게 당연승계 O, 다만 특약 변경할 사정 있으면 과반수자가 변경 가능 → 공유지 위 건물 소유하고 있는 공유자로부터 그 지분을 특정승계한 자에 대하여 뒤늦게 의도적으로 과반수 지분을 취득하여 철거 청구 ×, 특약 승계 O ∴ 특약을 변경할 만한 사정 × [2005다1827]", "공유·합유·총유"],
  ["064.ㄱ", "★ 구분소유적 공유관계에 있는 토지의 특정부분을 구분소유하는 자는 그 부분에 대하여 신탁적으로 지분등기를 가지고 있는 자를 상대로 그 부분에 대한 명의신탁 해지를 원인으로 한 지분이전등기절차의 이행을 구할 수 있으나, 그 토지 전체에 대한 공유물분할청구의 소를 제기할 수는 없다.", true, "▸ 구분소유적 공유관계에서는 공유물분할청구 × ∴ 공유지분권 없으므로 → '명의신탁 해지' 원인 지분이전등기청구 O [88다카10517]", "공유·합유·총유"],
  ["064.ㄴ", "★ 공유자 간의 공유물에 대한 사용·수익·관리에 관한 특약은 공유자의 특정승계인에 대하여도 당연히 승계되나, 공유지분권의 본질적 부분을 침해한다고 볼 수 있는 경우에는 특별한 사정이 없는 한 그러하지 아니하다.", true, "▸ 기간 정하지 않고 무상으로 공유토지 전체 사용하게 하는 특약은 다른 공유자 지분의 특정승계인이 안 경우에만 효력 승계 ∴ 나머지 공유자들의 사용·수익권능 영구 포기로 공유지분권의 본질 침해 [2009다54294]", "공유·합유·총유"],
  ["064.ㄷ", "★ 구분소유적 공유관계에 있는 토지에 대하여 공유자 이외의 제3자에 의한 방해가 있는 경우, 공유자 중 1인은 자기의 구분소유 부분뿐 아니라 전체토지에 대하여 위 방해의 배제를 구할 수 있다.", true, "▸ 제3자의 방해행위가 있는 경우는 자기의 구분소유 부분뿐 아니라 전체토지에 대하여 공유물 보존행위로서 그 배제 구할 수 O ∴ 외부관계에는 1필지 전체에 공유관계 성립, 공유자로서의 권리 주장 O [93다42986]", "공유·합유·총유"],
  ["065.①", "★ 甲과 乙이 각 1/2의 지분으로 공유하고 있는 X토지 중 일부를 甲이 배타적으로 점유하고 있는 경우, 乙은 甲에게 공유물의 보존행위로서 방해배제를 청구할 수 있다.", true, "▸ 소수지분권자가 협의 없이 공유물 전부·일부를 독점적 점유할 경우 다른 소수지분권자는 공유물 인도청구 × ∴ ① 공유자(원고)와 공유자(피고)의 이해충돌 하여 보존행위 ×, ② 인도 판결·집행결과인 원고 단독 점유·사용·수익할 상태는 인도 전 위법 상태와 마찬가지, ③ '지분권'에 기한 방해배제청구권으로 충분히 위법상태 시정 가능\n일부 공유자의 공유물 독점적 점유는 다른 공유자 지분권에 기초한 사용·수익권 침해하는 것 → 공유자 각자는 자신의 지분권 행사를 방해하는 행위에 대해 214조 방해배제청구권 행사 O ∴ 지분권은 공유자 개개인에게 귀속되는 것 → 이유 中 : 지분권에 기한 공유물 방해배제청구 구체적 모습으로, 무단 건축·식재한 건물·수목의 철거·수거청구 O, 공유 토지에 대한 출입·통행의 방해금지청구 O [2018다287522, 5월 판결]", "공유·합유·총유"],
  ["065.②", "★ X토지의 2/3 지분을 보유한 공유자 甲이 1/3 지분권자인 乙과 협의하지 않고 X토지를 丙에게 임대한 경우, 乙은 丙에게 임료의 1/3을 부당이득으로 반환할 것을 청구할 수 없다.", true, "▸ 과반수지분권자의 공유물 임대 : 임대차는 적법·유효 O → 다른 공유자는 임대인·임차인에 대하여 인도청구 ×, ⓐ 임대한 공유자에 대해 자기 지분 비율 부당이득·손해배상 O, ⓑ 임차인에 대해 부당이득·손해배상 ×\n▸ 과반수지분권자는 협의 없이도 공유물의 특정 부분을 배타적 사용·수익 O(∴ 사용·수익 방법 결정 = '관리') → 다만 이 경우 그 특정 부분이 자기 지분비율 상당 면적 범위 내라고 하여도 과반수지분권자는 사용·수익하지 않는 다른 공유자에 대하여는 지분 상응하는 부당이득반환 O ∴ 공유자는 공유물 전부를 지분 비율로 사용·수익할 수 있다는 263조 [88다카33855]", "공유·합유·총유"],
  ["065.⑤", "★ 乙과 함께 각 1/2 지분으로 X토지를 공유하는 甲이 乙에게 자신의 공유지분을 포기한다는 의사표시를 하였으나, 그에 따른 지분이전등기가 마쳐지기 전에 甲이 사망하여 상속인인 丙이 단독상속하는 한편, 乙의 1/2 지분에 대한 강제경매절차가 진행되어 丁이 지분을 취득하였다면, 丁은 甲의 상속인 丙에게 甲의 종전 1/2 지분에 관한 지분이전등기절차의 이행을 구할 수 있다.", false, "▸ 267조의 공유지분의 포기는 법률행위(상대방 있는 단독행위)이므로, 부동산 공유자의 지분 포기 의사표시가 다른 공유자에 도달만으로 물권변동 효력 ×, 다른 공유자는 귀속될 공유지분에 관한 소유권이전등기청구권 취득 O, 이후 186조에 의해 등기해야 공유지분 포기에 따른 물권변동 효력 O [2015다52978]", "공유·합유·총유"],
  ["066.①", "甲, 乙, 丙은 X 토지를 공유하고 있으며, 각각의 지분비율은 4:2:1이다.§★ 甲은 乙 및 丙과의 협의 없이 X의 특정한 부분을 자신이 배타적으로 사용, 수익할 것을 결정할 수 있다.", true, "▸ 과반수지분권자는 협의 없이도 공유물의 특정 부분을 배타적 사용·수익 O(∴ 사용·수익 방법 결정 = '관리') [88다카33855]", "공유·합유·총유"],
  ["066.④", "甲, 乙, 丙은 X 토지를 공유하고 있으며, 각각의 지분비율은 4:2:1이다.§★ 甲이 단독으로 丁과 X에 대한 대지조성공사계약을 체결하면서 공사비용은 자신이 지급하기로 약정한 경우에도, 乙과 丙은 丁에 대한 관계에서 지분에 상응하는 공사비를 지급할 의무를 부담한다.", false, "▸ 과반수 지분권자는 단독으로 관리행위 O, 그 관리비용은 공유자들이 내부적으로 각 지분 비율로 부담 → 과반수지분권자가 관리행위인 공사계약을 체결하면서 자신이 공사비 정산하기로 약정했다면 그만이 공사비 직접 부담 ∴ 266조는 내부관계 부담만 정할 뿐 → 다만 내부적으로는 다른 공유자에게 공사비 상환청구 O [90다20220] → 수급인은 다른 공유자들에게 266조로 공사비 청구 ×", "공유·합유·총유"],
  ["SS6.①", "공유자 2인이 각 1/2의 지분비율로 부동산을 공유하고 있는 경우 공유자 1인은 다른 공유자와의 협의 없이 공유물의 특정 부분을 배타적으로 사용할 수 없다.", true, "▸ 소수지분권자가 자기 지분 비율 상당 면적 범위 내라고 해도 특정 부분의 배타적 사용·수익 × → 지분 상응하는 부당이득반환 O [2000다13948]\n'소수가 배타적 사용·수익할 수 없다', '소수가 배타적 사용하더라도 다른 소수가 인도를 구할 수는 없다' 모두 옳은 지문이므로 유의", "공유·합유·총유"],
  ["SS6.②", "총유물에 관한 사원의 권리와 의무는 사원의 지위에 수반하고 사원의 지위득실은 지분의 양도를 통하여 이루어진다.", false, "▸ 제277조(총유물에 관한 권리의무의 특성) 총유물에 관한 사원의 권리의무는 사원의 지위를 취득상실함으로써 취득상실된다.", "공유·합유·총유"],
  ["SS6.③", "공유자 2인이 각 1/2의 지분비율로 부동산을 공유하고 있는 경우 공유자 1인은 공유물 전부를 지분의 비율로 사용, 수익할 수 있다.", true, "▸ 제263조(공유지분의 처분과 공유물의 사용, 수익) 공유자는 그 지분을 처분할 수 있고 공유물 전부를 지분의 비율로 사용, 수익할 수 있다.", "공유·합유·총유"],
  ["SS6.④", "공유물의 변경은 공유자 지분의 과반수로써 결정하는 공유물의 관리와 달리 공유자 전원의 동의가 있어야 할 수 있다.", true, "▸ 제264조(공유물의 처분, 변경) 공유자는 다른 공유자의 동의없이 공유물을 처분하거나 변경하지 못한다.", "공유·합유·총유"],
  ["SS7.ㄱ", "甲, 乙, 丙이 X 토지를 공유하고 있다(지분은 각 1/5, 1/5, 3/5씩).§丁이 X 토지에 대해 점유취득시효를 완성한 후 시효완성을 이유로 한 이전등기 전에 甲이 戊에게 그 지분을 양도하여 이전등기한 경우, 戊는 취득시효를 완성한 점유자 丁을 상대로 토지의 인도를 청구할 수 있다.", false, "▸ 취득시효 완성된 후 취득시효 완성 당시의 공유자 일부로부터 소수 지분을 취득한 사람은 나머지 지분에 관하여 취득시효 완성하여 소유권이전등기만 마치면 과반수지분권자가 될 지위에 있는 점유자에 대하여 인도청구 × [2000다33638]", "공유·합유·총유"],
  ["SS7.ㄷ", "甲, 乙, 丙이 X 토지를 공유하고 있다(지분은 각 1/5, 1/5, 3/5씩).§甲, 乙, 丙이 공동으로 X 토지를 丁에게 임대한 경우, 丁의 차임연체액이 2기의 차임액에 달하는 때에도 甲은 단독으로 임대차계약을 해지할 수 없다.", true, "▸ 공유물을 임대 행위 및 임대차 '해지' 행위는 공유물 관리행위 O → 상임법 10조 4항 갱신거절의 통지행위는 실질적 임대차계약 해지이므로 공유자 지분의 과반수로 결정해야 [2010다37905] → 甲은 해지 결정도 단독으로 못하고, 제547조를 고려하면 결정된 해지 의사표시도 단독으로 할 수 없음", "공유·합유·총유"],
  ["SS7.ㄹ", "甲, 乙, 丙이 X 토지를 공유하고 있다(지분은 각 1/5, 1/5, 3/5씩).§★ 甲이 X 토지의 특정부분을 배타적으로 점유·사용한 경우, 그 특정부분의 면적이 甲의 지분비율에 상당하는 면적범위 내에 해당하는 때에는 X 토지를 전혀 사용·수익하지 않고 있는 乙에 대하여 그 지분에 상응하는 부당이득반환의무가 없다.", false, "▸ 소수지분권자가 자기 지분 비율 상당 면적 범위 내라고 해도 특정 부분의 배타적 사용·수익 × → 지분 상응하는 부당이득반환 O [2000다13948]", "공유·합유·총유"],
  ["SS8.④", "甲, 乙, 丙이 각 5/9, 2/9, 2/9의 지분으로 X 토지를 공유하고 있다.§丁이 무단으로 X 토지에 대한 소유권이전등기를 마치자 乙이 자신의 지분침해를 이유로 진정명의회복을 위한 이전등기를 구하여 2/9의 지분을 회복한 경우, 乙은 보존행위로서 丁에게 甲과 丙의 지분의 말소등기절차의 이행을 구할 수 없다.", true, "▸ 공유자 1인은 제3자의 원인무효 소유권이전등기에 공유물 보존행위로서 등기 '전부' 말소청구 O → 그러나 원인무효 등기가 특정 공유자 지분에만 마쳐진 경우는 다른 공유자가 보존행위로 말소청구 × ∴ 다른 공유자의 지분권을 대외적 주장함은 보존행위 ×, 자기 지분 범위 초과 부분에 마쳐진 등기 말소 구할 수 × → 공유물 원인무효 등기가 자기 지분 침해해야 보존행위로 말소 O [2023다273206]\n→ 乙이 이미 자기 지분 회복을 마쳤으므로 자기 지분에 대한 방해는 제거되었고, 이 상태에서 乙이 다른 공유자 甲, 丙의 지분에 관해 말소나 진명소이등 구할 수 ×", "공유·합유·총유"],
  ["067.①", "甲, 乙, 丙이 각 3/7, 2/7, 2/7의 지분으로 X토지를 공유하고 있는 경우의 법률관계에 대한 설명으로 옳은 것은?§★ 乙과 丙이 협의하여 X토지를 丁에게 임대한 경우, 甲은 임차인 丁에 대하여 차임 상당액 중 자신의 지분에 상응하는 비율의 금액을 부당이득으로서 반환청구할 수 있다.", false, "▸ 과반수 지분 공유자로부터 다시 특정 부분의 사용·수익 허락받은 제3자는 소수지분권자에 대해 점유로 인한 법률상 원인 없는 이득 얻는 것은 × ∴ 다수지분권자의 공유물관리권에 터잡은 적법한 점유 [2002다9738] → 乙·丙이 협의하면 과반수지분권자", "공유·합유·총유"],
  ["067.②", "甲, 乙, 丙이 각 3/7, 2/7, 2/7의 지분으로 X토지를 공유하고 있는 경우의 법률관계에 대한 설명으로 옳은 것은?§★ 乙이 현물분할의 방법으로 공유물의 분할을 재판상 청구한 경우에는 법원은 대금분할의 방법으로 공유물 분할을 명할 수 없다.", false, "▸ 분할의 방법은 당사자가 구하는 방법에 구애받지 않고 법원의 재량에 따라 합리적 분할 [2014다233428]", "공유·합유·총유"],
  ["068.①", "★ 甲이 소유한 X토지 위에 乙, 丙, 丁이 권원 없이 Y건물을 지어 공동으로 소유하고 있는 경우, 甲이 乙을 제외하고 丙, 丁을 상대로 하여 Y건물의 철거를 청구하는 소를 제기한 것은 적법하다.", true, "▸ 공유건물 철거 청구는 불가분채무 O, 필수적 공동소송 × → 건물공유자 1인에 대해 철거 소송 O → 지분 한도 내에서 전체 건물 철거 주문 [80다756]", "공유·합유·총유"],
  ["068.②", "공유토지의 일부에 대하여 취득시효완성을 원인으로 공유자들을 상대로 그 시효취득부분에 대한 소유권이전등기절차의 이행을 청구하는 소송은 필수적 공동소송이 아니다.", true, "▸ 필수적 공동소송 : 공유물 전체 소유관계 확인청구 [94다35008], 공유물분할청구 [2003다44615], 공동상속인이 다른 공동상속인 상대로 어떤 재산이 상속재산임의 확인 구하는 청구 [2006다40980], 공유 토지 경계 확정 청구 [2000다24207]", "공유·합유·총유"],
  ["068.③", "★ 甲, 乙, 丙이 각 3분의 1 지분으로 공유하고 있는 X토지의 일부에 乙이 소나무를 심어 그 부분을 독점적으로 점유하고 있다면, 甲은 보존행위로서 단독으로 乙을 상대로 소나무의 수거 및 토지의 인도를 청구할 수 있다.", false, "▸ 소수지분권자가 협의 없이 공유물 전부·일부를 독점적 점유할 경우 다른 소수지분권자는 공유물 인도청구 × → 그러나 자신의 지분권에 기해 무단신축 건물의 철거청구 O [2018다287522] → 甲은 단독으로 소나무 수거청구 O, 토지 인도청구 ×", "공유·합유·총유"],
  ["068.④", "★ 집합건물에서 전유부분 면적 비율에 상응하는 적정 대지지분을 가진 구분소유자는 그 대지 전부를 용도에 따라 사용·수익할 수 있는 적법한 권원을 가지므로, 구분소유자 아닌 대지 공유자는 그 대지 공유지분권에 기초하여 적정 대지지분을 가진 구분소유자를 상대로는 대지의 사용·수익에 따른 부당이득반환을 청구할 수 없다.", true, "▸ 공유토지 일부 배타적 점유 공유자는 지분 비율 관계없이 다른 공유자에 부당이득반환의무 × ∴ 공유자는 공유물 전부를 지분 비율 사용·수익(263조) → 그러나 집합건물에서 구분소유자 아닌 대지 공유자는 공유지분권에 기초하여 적정 대지지분을 가진 구분소유자에 대해 대지 사용·수익 부당이득반환청구 × [2017다257067]", "공유·합유·총유"],
  ["069.①", "★ 공유물분할청구권도 채권자대위권의 목적이 될 수 있지만, 채권자가 자신의 금전채권을 보전하기 위하여 채무자를 대위하여 부동산에 관한 공유물분할청구권을 행사하는 것은 극히 예외적인 경우가 아니라면 보전의 필요성을 인정할 수 없다.", true, "▸ 공유물분할청구권은 일신전속권 아니고 피대위권리 O → 그러나 금전채권 보전 위한 공유물분할청구권 대위행사는 보전 필요성 × ∴ 책임재산 보전과 직접 관련 ×, 현실적 이행 유효·적절 확보 필요 ×, 부당한 간섭 → 극히 예외적으로만 인정 [2018다879]", "공유·합유·총유"],
  ["069.②", "★ 부동산의 일부 공유지분에 관하여 저당권이 설정된 후 부동산이 분할된 경우, 그 저당권은 분할된 각 부동산 위에 종전의 지분비율대로 존속하고 분할된 각 부동산은 저당권의 공동담보가 된다.", true, "▸ 공유자 1인 지분 위에 설정된 근저당권 등 담보물권은 공유물분할이 된 뒤에도 분할된 각 부동산 위에 종전 지분비율대로 존속 O, 분할된 각 부동산은 공동담보가 됨 → 근저당권 설정자인 공유자 앞으로 분할된 부분에 당연히 집중되지 × [88다카24868, 2011다74932]", "공유·합유·총유"],
  ["070.①", "★ 공유물의 소수지분권자가 다른 공유자와 협의 없이 공유물의 전부 또는 일부를 독점적으로 점유·사용하고 있는 경우 다른 소수지분권자는 공유물의 보존행위로서 그 인도를 청구할 수는 없고, 다만 자신의 지분권에 기초하여 공유물에 대한 방해상태를 제거하거나 공동 점유를 방해하는 행위의 금지 등을 청구할 수 있다고 보아야 한다.", true, "▸ 소수지분권자가 협의 없이 공유물 전부·일부를 독점적 점유할 경우 다른 소수지분권자는 공유물 인도청구 ×, 그러나 자신의 지분권에 기해 무단신축 건물의 철거청구 O, 공동점유 방해금지청구 O [2018다287522]", "공유·합유·총유"],
  ["070.②", "★ 부동산 공유자의 공유지분 포기의 의사표시가 다른 공유자에게 도달하더라도 이로써 곧바로 공유지분 포기에 따른 물권변동의 효력이 발생하는 것은 아니고, 다른 공유자는 자신에게 귀속될 공유지분에 관하여 소유권이전등기청구권을 취득하며, 이후 민법 제186조에 의하여 등기를 하여야 공유지분 포기에 따른 물권변동의 효력이 발생한다.", true, "▸ 267조의 공유지분의 포기는 법률행위(상대방 있는 단독행위)이므로, 부동산 공유자의 지분 포기 의사표시가 다른 공유자에 도달만으로 물권변동 효력 ×, 다른 공유자는 귀속될 공유지분에 관한 소유권이전등기청구권 취득 O, 이후 186조에 의해 등기해야 공유지분 포기에 따른 물권변동 효력 O [2015다52978]", "공유·합유·총유"],
  ["070.③", "★ 공유 부동산에 관하여 제3자 명의로 원인무효의 소유권이전등기가 경료되어 있는 경우, 공유자의 한 사람이 공유물의 보존행위로서 그 공유물의 일부 지분에 관하여 재판상 청구를 하였으면 그로 인한 시효중단의 효력은 그 공유자와 그 청구한 소송물에 한하여 발생한다.", true, "▸ 공유자 1인의 공유물 점유자에 대한 재판상 청구는 그 공유자의 지분만큼 취득시효 중단 O, 나머지 공유자 지분 부분 중단 × [79다639] → 보존행위임에도 취득시효 중단은 개별적 효과인 점을 유의, 169조가 적용된 것으로 보임(私見)", "공유·합유·총유"],
  ["071.①", "X 토지는 甲이 3/5 지분, 乙이 1/5 지분, 丙이 1/5 지분으로 공유하고 있다.§★ 乙이 甲·丙과 협의하지 않고 X 토지 전부를 독점적으로 점유하는 경우, 丙은 乙에게 공유물의 보존행위로서 X 토지의 인도를 구할 수 있다.", false, "▸ 소수지분권자가 협의 없이 공유물 전부·일부를 독점적 점유할 경우 다른 소수지분권자는 공유물 인도청구 × [2018다287522] → 지문에서 丙이 아닌 甲이 인도를 구하는 것으로 바꾸면? 甲은 인도를 구할 수 있으나 최근 대법원(2022다253243 판결)은 이것도 '관리행위'라고 하였으므로, '보존행위로서'라는 표현 부분이 이 지문을 충분히 틀린 지문으로 볼 여지가 있고(私見), 다만 이 부분을 논점화하는 것 자체의 적절성이 의문임", "공유·합유·총유"],
  ["071.②", "X 토지는 甲이 3/5 지분, 乙이 1/5 지분, 丙이 1/5 지분으로 공유하고 있다.§乙이 甲·丙과 협의하지 않고 X 토지 전부를 독점적으로 점유하는 경우, 丙은 乙에게 자신의 지분권에 기초하여 공유물에 대한 방해 상태의 제거 또는 공동 점유를 방해하는 행위의 금지를 청구할 수 있다.", true, "▸ 소수지분권자가 협의 없이 공유물 전부·일부를 독점적 점유할 경우 다른 소수지분권자는 공유물 인도청구 ×, 그러나 자신의 지분권에 기해 무단신축 건물의 철거청구 O, 공동점유 방해금지청구 O [2018다287522]", "공유·합유·총유"],
  ["071.⑤", "X 토지는 甲이 3/5 지분, 乙이 1/5 지분, 丙이 1/5 지분으로 공유하고 있다.§★ 甲이 자신의 공유지분에 관하여 丁에게 저당권을 설정해 주었고, 이후 乙의 공유물분할청구로 X 토지가 현물분할되었다면, 丁의 저당권은 甲의 단독소유가 된 분할 부분에 한하여 존속한다.", false, "▸ 공유자 1인 지분 위에 설정된 근저당권 등 담보물권은 공유물분할이 된 뒤에도 분할된 각 부동산 위에 종전 지분비율대로 존속 O, 분할된 각 부동산은 공동담보가 됨 [88다카24868]", "공유·합유·총유"],
  ["072.ㄹ", "★ 과반수 지분의 공유자는 그 공유토지의 특정된 한 부분을 배타적으로 사용 및 수익할 수 있지만, 그로 인하여 특정부분의 사용 및 수익을 전혀 하지 못하여 손해를 입은 소수지분권자에 대하여 그 지분에 상응하는 임료 상당의 부당이득을 반환할 의무가 있으므로 그 과반수 지분의 공유자로부터 공유물의 특정부분의 사용 및 수익을 허락받은 제3자도 소수지분권자에 대하여 그러한 부당이득반환의무를 부담하게 된다.", false, "▸ 과반수지분권자는 협의 없이도 공유물의 특정 부분을 배타적 사용·수익 O(∴ 사용·수익 방법 결정 = '관리') → 다만 이 경우 그 특정 부분이 자기 지분비율 상당 면적 범위 내라고 하여도 과반수지분권자는 사용·수익하지 않는 다른 공유자에 대하여는 지분 상응하는 부당이득반환 O ∴ 공유자는 공유물 전부를 지분 비율로 사용·수익할 수 있다는 263조 [88다카33855]\n▸ 과반수 지분 공유자로부터 다시 특정 부분의 사용·수익 허락받은 제3자는 소수지분권자에 대해 점유로 인한 법률상 원인 없는 이득 얻는 것은 × ∴ 다수지분권자의 공유물관리권에 터잡은 적법한 점유 [2002다9738]", "공유·합유·총유"],
  ["073.ㅁ", "甲, 乙, 丙이 X토지를 4:3:3의 비율로 공유하고 있다.§★ 丙에 대하여 1억 원의 채권을 가진 己는, 丙의 채무불이행시에 丙의 지분에 대한 강제집행을 통하여 채권만족을 얻을 수 있는 것 외에도, 원칙적으로 丙의 공유물분할청구권을 대위행사할 수 있다.", false, "▸ 공유물분할청구권은 일신전속권 아니고 피대위권리 O → 그러나 금전채권 보전 위한 부동산 공유물분할청구권 대위행사는 보전 필요성 × ∴ 책임재산 보전과 직접 관련 ×, 현실적 이행 유효·적절 확보 필요 ×, 부당한 간섭 → 극히 예외적으로만 인정 → 채무자 지분이 다른 지분과 함께 공동근저당권 목적이고 피담보채권이 채무자 지분 초과하여 채무자 지분만 경매하면 남을 가망 없어 경매 취소(민집법 102조), 공유물분할 방법으로 전부 경매하면 368조 1항 의해 채무자 지분에서 피담보채권 분담액 변제하고 남을 가망 있더라도 마찬가지 [2018다879]", "공유·합유·총유"],
  ["074.③", "★ 공유자가 다른 공유자의 지분권을 대외적으로 주장하는 것은 공유물의 멸실 내지 훼손을 방지하기 위한 것이므로 공유물의 보존행위에 속한다.", false, "▸ 공유자 자신의 지분 범위 초과 부분에 대하여 등기말소 구할 수 × ∴ 다른 공유자의 지분권을 대외적 주장함은 보존행위 × [2009다67429] → 1/3 지분권자 A가 다른 1/3 지분권자 B의 지분등기에 제3자의 원인무효 등기가 있다면서 말소를 구할 수는 없다고 한 사례", "공유·합유·총유"],
  ["075.②", "조합체가 매수한 부동산에 대해 조합원 중 특정인의 단독 명의로 소유권이전등기가 마쳐졌더라도 조합체가 해산되는 경우에는 그 부동산이 조합재산임을 전제로 청산이 이루어져야 한다.", false, "▸ 조합원들이 공동사업 위해 매수한 부동산에 합유등기 아닌 조합원 1인 명의의 소유권이전등기 → 조합체가 조합원에게 명의신탁한 것 → 물권변동 무효라면 매도인에게, 유효라면 명의수탁자에게 각 소유권 귀속 → 조합재산은 소이등청구권 또는 부당이득반환채권 O, 신탁부동산 자체 × [2017다246180]", "공유·합유·총유"],
  ["075.③", "법원은 이혼하는 부부 중 일방이 제3자와 합유하고 있는 재산에 대해 직접 그 재산의 분할을 명할 수는 없으나, 그 재산에 대한 합유지분의 가액을 산정하여 재산분할의 대상으로 삼을 수 있다.", true, "▸ [가족] 일방과 제3자와의 합유재산은 직접 분할 명할 수 없으나, 그 지분의 가액 산정하거나 다른 재산 분할에 참작하는 방법으로 분할 대상 포함시켜야 [2009므2840]", "공유·합유·총유"],
  ["075.④", "★ 조합체가 매수한 부동산에 대해 합유등기 대신 각 조합원 명의로 각 지분에 관한 공유등기가 마쳐진 경우, 그 부동산의 매수인이 조합체라는 사실을 매도인이 알지 못했더라도 그 부동산은 조합원들의 공유이고, 조합체의 합유재산이 아니다.", false, "▸ 조합체가 부동산을 조합재산으로 취득했으나 합유등기 아닌 조합원들 명의로 공유등기를 했다면 조합체가 조합원들에게 각 지분에 관하여 명의신탁한 것 O [2000다30622] → 그 부동산의 매수인이 조합체라는 사실을 매도인이 알지 못했더라면 선의 게명산 O → 조합원들 명의 등기 유효, 그 부동산은 조합원들의 공유 O, 조합체의 합유재산 ×", "공유·합유·총유"],
  ["075.⑤", "■보충 조합원 중 자신이 소유한 부동산을 출자하기로 약정하고 그 부동산을 인도한 자는 그 부동산에 대한 합유등기가 마쳐지기 전까지는 조합체는 물론 제3자에 대해서도 그 부동산에 대한 소유물 반환청구권을 행사할 수 있다.", false, "▸ 부동산 소유자가 동업계약(조합계약)에 의해 부동산 소유권을 투자하기로 했으나 아직 조합원 등기로 합유로 등기되지 않은 경우 → 그와 조합 사이 채권적 권리의무 있어 조합에 대하여 소유권이전의무 또는 사용을 인용할 의무 있으나, 조합원 아닌 제3자에 대하여는 여전히 소유자로서 소유권 행사 O [2000다30622] → 매우 당연한 판례", "공유·합유·총유"],
  ["076.②", "★ 합유자 중 1인이 무단으로 합유 재산에 관하여 자신의 단독 소유로 소유권보존등기를 한 경우에는 그 소유권보존등기가 실질관계에 부합하지 않는 원인무효의 등기이므로, 다른 합유자는 등기명의인인 합유자를 상대로 소유권보존등기의 말소를 청구할 수 있다.", true, "▸ 합유재산을 합유자 1인 단독소유로 소유권보존등기 한 경우, 다른 합유자는 그 원인무효 등기의 말소청구 O → 새로이 합유의 소유권보존등기 신청 O [2016다6309]", "공유·합유·총유"],
  ["077.ㄱ", "★ 부동산의 합유자 중 일부가 사망한 경우, 합유자 사이에 달리 약정하지 않은 한 합유자의 상속인은 합유자로서의 지위를 승계한다.", false, "▸ 부동산 합유자 중 일부가 사망한 경우 합유자 사이에 특별한 약정이 없는 한 사망한 합유자의 상속인은 합유자로서의 지위 승계 × → 잔존 합유자 2인 이상일 경우는 잔존 합유자의 합유로, 잔존 합유자가 1인인 경우는 잔존 합유자 단독소유로 각 귀속 [93다39225]", "공유·합유·총유"],
  ["077.ㄴ", "민법상 조합인 공동수급체가 경쟁입찰에 참가하였다가 다른 경쟁업체가 낙찰자로 선정된 경우, 그 공동수급체의 구성원 중 1인이 그 낙찰자 선정이 무효임을 주장하며 무효확인의 소를 제기하는 것은 합유재산의 보존행위에 해당한다.", true, "▸ 민법상 조합인 공동수급체가 경쟁입찰 참가했다가 다른 경쟁업체가 낙찰자로 선정된 경우 그 낙찰자선정 무효확인소송은 공동수급체의 구성원 1인 제기 O ∴ 공동수급체가 경쟁입찰 관련하여 갖는 법적 지위·이익 침해 우려 현상 유지로서 합유재산의 보존행위 [2011다80449]", "공유·합유·총유"],
  ["078.①", "★ 2인 조합에서 조합원 1인이 탈퇴하면 조합원의 합유에 속하였던 부동산은 남은 조합원의 단독 소유에 속하게 되지만, 잔존 조합원의 단독 소유로 하는 내용의 등기를 하여야 비로소 소유권 변동의 효력이 발생한다.", true, "▸ 2인에서 1인 임의탈퇴 O → 조합관계 종료 O → 조합해산 ×, 청산 × → 합유재산이 단독소유 되고 탈퇴자·잔존자 사이 계산 O [86다카2484] → 부동산인 경우 단독소유 등기를 해야 소유권변동 효력 O [2008다2807]", "공유·합유·총유"],
  ["079.⑤", "★ 甲이 乙의 丙에 대한 채무를 담보하기 위하여 丙과 보증계약을 체결하면서 사원총회의 결의를 거치지 아니하였다면, 그 보증계약은 A에게 효력이 없다.", false, "▸ 275조, 276조 1항의 '총유물의 관리·처분'은 총유물 그 자체에 관한 이용·개량행위나 법률적·사실적 처분행위를 의미하는 것 → 비법인사단의 타인 금전채무 보증행위는 총유물 그 자체 관리·처분 아닌 단순한 채무부담행위에 불과하여 총유물의 관리·처분행위 × →", "공유·합유·총유"],
  ["080.②", "★ 종중 소유의 재산은 그 관리 및 처분에 관하여 먼저 종중 규약에 정하는 바가 있으면 이에 따라야 하고, 그 점에 관한 규약이 없으면 종중총회의 결의에 의하여야 하므로 종중 대표자에 의한 종중 재산의 처분이라고 하더라도 그러한 절차를 거치지 아니한 채 한 행위는 무효이다.", true, "▸ 제275조(물건의 총유) ① 법인이 아닌 사단의 사원이 집합체로서 물건을 소유할 때에는 총유로 한다. ② 총유에 관하여는 사단의 정관 기타 계약에 의하는 외에 다음 2조의 규정에 의한다.\n제276조(총유물의 관리, 처분과 사용, 수익) ① 총유물의 관리 및 처분은 사원총회의 결의에 의한다.\n▸ 종중(교회) 소유 재산은 종중원(교인)의 총유 → 종중(교회) 재산 관리·처분은 먼저 종중(교회) 규약의 정함에 따라야 → 규약 없으면 종중(교인) 총회 결의에 의하여야(276조) → 대표자에 의한 재산 처분이더라도 사원총회 결의 거치지 않으면 무효 → 126조 표현대리 적용 × [2000다22881]", "공유·합유·총유"],
  ["080.③", "★ ■보충 종중 토지 매각대금의 분배는 정관 기타 규약에 달리 정함이 없는 한 종중총회의 결의에 의하여만 할 수 있고, 이러한 분배결의가 없으면 종원이 종중에 대하여 직접 분배청구를 할 수 없다.", true, "▸ 총유물인 종중 토지 매각대금의 분배는 정관 기타 규약에 달리 정함이 없는 한 종중총회의 결의에 의하여만 처분 → 분배결의가 없으면 종원이 종중에 대해 직접 분배청구 × → 매각대금 분배에 관한 종중총회 결의가 무효라면 무효확인 등을 승소판결 받은 후 새로운 종중총회에서 공정한 내용으로 다시 결의하도록 해야 → 새로운 총회 결의 없이 곧바로 종중을 상대로 스스로 공정 주장하는 분배금 지급 구할 수 × [2007다42310]", "공유·합유·총유"],
  ["081.④", "★ 비법인사단이 타인 간의 금전채무를 보증하는 행위는 총유물의 관리·처분행위에 해당하지 않으므로, 사원총회의 결의를 거치지 않았더라도 그것만으로 그 보증계약이 무효가 되는 것은 아니다.", true, "▸ 275조, 276조 1항의 '총유물의 관리·처분'은 총유물 그 자체에 관한 이용·개량행위나 법률적·사실적 처분행위를 의미하는 것 → 비법인사단의 타인 금전채무 보증행위는 총유물 그 자체 관리·처분 아닌 단순한 채무부담행위에 불과하여 총유물의 관리·처분행위 × → 이때 임원회의 결의 등 거치도록 한 규약은 대표권 제한 규정 O → 거래 상대방이 대표권 제한 및 위반 사실을 알았거나 알 수 있었을 때 거래행위 무효 → 상대방 악의·과실은 비법인사단 측 입증책임 [2004다60072]", "공유·합유·총유"],
  ["081.⑤", "★ 종중 소유 재산의 보존행위로서 소를 제기하는 경우, 종중결의를 거쳐 종중 명의로 하거나 그 구성원 전원이 당사자가 되어 필수적 공동소송의 형태를 취하여야 한다.", true, "▸ 총유는 공유·합유의 '보존행위 각자' 규정 × → 총유가 단체성 강하고 개인 지분권 부정되기 때문 → 총유재산에 관한 소송은 ① 비법인사단이 그 명의로 사원총회 결의 거쳐서, ② 구성원 전원이 당사자가 되어 필수적 공동소송 형태로 할 수 있을 뿐 → 사단의 '구성원'은 소송 당사자 × → 설령 ⓐ 대표자라거나 ⓑ 사원총회 결의 거쳤다거나 ⓒ 보존행위라 해도 × [2004다44971]", "공유·합유·총유"],
  ["SS9.ㄱ", "비법인사단 甲의 대표 乙은 사원총회결의 없이 甲을 대표하여 甲의 X 토지를 丙에게 5억 원에 매도하였다. 甲의 정관에는 재산의 관리 및 처분에 관한 규정이 없다.§★ X 토지의 매매계약과 관련하여 사원총회결의가 없었다는 사정을 丙이 알지 못하였고 이를 알지 못하는데 과실이 없었다면, 甲과 丙 간의 매매계약은 유효하다.", false, "▸ 종중(교회) 소유 재산은 종중원(교인)의 총유 → 종중(교회) 재산 관리·처분은 먼저 종중(교회) 규약의 정함에 따라야 → 규약 없으면 종중(교인) 총회 결의에 의하여야(276조) → 대표자에 의한 재산 처분이더라도 사원총회 결의 거치지 않으면 무효 → 126조 표현대리 적용 × [2000다22881]", "공유·합유·총유"],
  ["SS9.ㄴ", "비법인사단 甲의 대표 乙은 사원총회결의 없이 甲을 대표하여 甲의 X 토지를 丙에게 5억 원에 매도하였다. 甲의 정관에는 재산의 관리 및 처분에 관한 규정이 없다.§★ 丙 앞으로 X 토지에 관한 소유권이전등기가 마쳐진 후 甲이 丙을 상대로 그 소유권이전등기 말소등기절차의 이행을 구하는 소를 제기하는 것이므로, 별도로 소 제기에 관한 사원총회결의를 거칠 필요가 없다.", false, "▸ [민소] 비법인사단 대표자가 민법 276조 사원총회 결의 없이 총유물 관련 소송행위하면 특별수권 결여 → 민소법 451조 1항 3호 재심사유 O, 제척기간 적용 O(457조는 ×) ∴ 3호 중 대리권 흠결은 아니므로 [98다46600]", "공유·합유·총유"],
  ["SS9.ㄹ", "비법인사단 甲의 대표 乙은 사원총회결의 없이 甲을 대표하여 甲의 X 토지를 丙에게 5억 원에 매도하였다. 甲의 정관에는 재산의 관리 및 처분에 관한 규정이 없다.§★ 사안과 달리 X 토지에 관한 매매계약이 사원총회결의에 따라 이루어진 경우, 甲이 매매계약에 따라 丙에게 부담하는 채무에 대하여 乙이 소멸시효 중단의 효력이 있는 승인을 할 때에는 특별한 사정이 없는 한 별도로 그에 대한 사원총회의 결의를 거칠 필요가 없다.", true, "▸ 총유물에 대한 매매계약 체결하는 행위는 총유물의 처분행위 O → 매매계약 체결에 사원총회결의가 있었다면 그 매매계약상 채무의 승인에 대한 결의 포함 O → 매매계약으로 부담하는 채무의 승인(소멸시효 중단사유)은 총유물 관리·처분행위 × → 사원총회 결의 거칠 필요 × [2009다64383] → 비법인사단 대표자가 소유권이전등기 해주려고 매수인과 함께 법무사 사무실 방문한 행위는 소유권이전등기청구권의 승인 O, 중단 O", "공유·합유·총유"],
  // 명의신탁,
  ["082.②", "甲은 2020. 2. 10. 乙과 乙 소유의 X 부동산에 관하여 매매계약을 체결하고 2020. 3. 10. 乙에게 매매대금 전액을 지급함과 동시에 소유권이전등기는 甲과 그의 친구 丙 사이의 명의신탁약정에 따라 乙로부터 바로 丙 앞으로 마쳤다.§甲이 A와 사이에 X 부동산에 관하여 매매계약을 체결하고 이에 기하여 丙에서 A 앞으로 바로 마쳐 준 소유권이전등기는 특별한 사정이 없는 한 실체관계에 부합하는 등기로서 유효하다.", true, "▸ 오로지 신탁자와 물권 취득 계약 맺고 단지 등기명의만 수탁자로부터 마친 외관 가진 자는 실명법 4조 3항 '제3자' × → 그러나 실체관계 부합 등기로서 유효하다는 주장 O 3자간 등기명의신탁에서 신탁자와 제3자가 부동산 처분 약정 맺고 수탁자로부터 등기 마친 제3자는 실체관계 부합하는 유효한 등기 O ∴ 3자간에서는 부동산이 매도인 소유 복귀하고 매매계약은 유효하여 신탁자가 매도인에 대해 소이등청구권 보전하기 위해 매도인을 대위하여 수탁자에 대해 무효등기말소 구할 수 있으므로 [2002다48771, 2022다228933]", "명의신탁"],
  ["082.③", "甲은 2020. 2. 10. 乙과 乙 소유의 X 부동산에 관하여 매매계약을 체결하고 2020. 3. 10. 乙에게 매매대금 전액을 지급함과 동시에 소유권이전등기는 甲과 그의 친구 丙 사이의 명의신탁약정에 따라 乙로부터 바로 丙 앞으로 마쳤다.§丙에 대한 금전채권자 B가 자신의 금전채권을 피보전권리로 하여 X 부동산에 대하여 가압류를 신청하여 가압류등기가 마쳐진 경우 B의 가압류는 유효하다.", true, "▸ 실명법 4조 3항의 '제3자'에는 소유권·저당권 등 물권 취득자뿐 아니라 압류·가압류채권자도 포함 O → 명의신탁약정으로 형성된 외관을 토대로 다시 명의신탁 이뤄지는 연속된 명의신탁관계의 최후 명의수탁자가 물권자임을 기초로 그와 사이에 직접 새로운 이해관계 맺은 사람도 포함 O [2019다272725]", "명의신탁"],
  ["082.④", "甲은 2020. 2. 10. 乙과 乙 소유의 X 부동산에 관하여 매매계약을 체결하고 2020. 3. 10. 乙에게 매매대금 전액을 지급함과 동시에 소유권이전등기는 甲과 그의 친구 丙 사이의 명의신탁약정에 따라 乙로부터 바로 丙 앞으로 마쳤다.§★ 丙이 임의로 甲과 丙 사이의 약정 사실을 알고 있는 C와 X 부동산에 관하여 매매계약을 체결하고 대금을 지급받음과 동시에 C에게 소유권이전등기를 마쳐 준 경우 丙은 甲에게 「민법」제750조에 따른 손해배상책임을 질 수 있다.", true, "▸ 3자간 등기명의신탁에서 매도인으로부터 등기 받은 수탁자가 부동산을 임의로 처분하면 형사상 횡령죄로 처벌되지 않더라도 민법상 750조 불법행위 O, 명의신탁자의 채권(소유권이전등기청구권) 침해하는 제3자 채권침해 O ∴ 2014도6992 전합판결 있으나 민사책임과 형사책임은 지도이념·증명책임 등 서로 다른 원리 적용, 형사상 범죄 아니어도 민사상 불법행위는 별개, 제3자 소유권 취득하여(실명법 4조 3항) 매도인의 소유권이전등기의무 불능, 수탁자가 신탁자 채권 침해 사정 알면서 위법하게 처분 [2020다208997]", "명의신탁"],
  ["082.⑤", "甲은 2020. 2. 10. 乙과 乙 소유의 X 부동산에 관하여 매매계약을 체결하고 2020. 3. 10. 乙에게 매매대금 전액을 지급함과 동시에 소유권이전등기는 甲과 그의 친구 丙 사이의 명의신탁약정에 따라 乙로부터 바로 丙 앞으로 마쳤다.§★ 丙이 임의로 자신의 채권자 D를 위하여 X 부동산에 관하여 D 명의의 근저당권을 설정해 준 경우 丙은 근저당권의 피담보채무액 상당의 이익을 얻었고 그로 인하여 乙은 소유권을 침해당한 손실을 입었으므로, 丙은 乙에 대하여 부당이득반환의무를 부담한다.", false, "▸ 3자간 등기명의신탁에서 수탁자가 제3자에게 근저당권 설정해준 경우 수탁자는 제3자에게 근저당권 설정해줌으로써 피담보채무액만큼 교환가치가 제한된 소유권만을 취득하는 손해 O, 매도인은 매매대금 수령하여 매매 목적 달성했으면서도 근저당권 설정된 상태의 소유권을 이전함에 대해 손해배상책임 없어 실질적 손실 × → 수탁자는 신탁자에게 근저당권 피담보채무액 상당 부당이득반환의무 O [2018다284233] → 수탁자 丙이 매도인 乙이 아닌 신탁자 甲에 대하여 부이반의무 부담", "명의신탁"],
  ["083.②", "甲은 2019. 6. 1. A로부터 그 소유의 X부동산을 매수하고 매매대금을 모두 지급하였으며, 乙과 명의신탁약정을 체결하고 A에게 부탁하여 그 소유권이전등기를 乙에게로 이전하게 하였다.§★ 甲은 乙을 상대로 부당이득반환을 원인으로 하는 소유권이전등기를 구할 수 있다.", false, "▸ 신탁자는 수탁자에 대해 부당이득반환으로 소유권이전등기청구 × ∴ 신탁자는 매도인에 대해 여전히 소유권이전등기청구권 있으므로 손해 없고, 수탁자는 현재 소유자도 아님 [2008다55290]", "명의신탁"],
  ["083.③", "甲은 2019. 6. 1. A로부터 그 소유의 X부동산을 매수하고 매매대금을 모두 지급하였으며, 乙과 명의신탁약정을 체결하고 A에게 부탁하여 그 소유권이전등기를 乙에게로 이전하게 하였다.§★ 乙이 丙에게 X부동산을 매도하고 소유권이전등기를 마쳐준 경우 丙은 그 소유권을 취득할 수 없다.", false, "▸ 부동산 실권리자명의 등기에 관한 법률 제4조(명의신탁약정의 효력) ③ 제1항 및 제2항의 무효는 제3자에게 대항하지 못한다.\n▸ 丙은 부동산실명법 4조 3항의 제3자에 해당하여 소유권 취득", "명의신탁"],
  ["084.ㄱ", "甲은 2010. 2.경 친구 乙과 '甲이 매수하고자 하는 X 토지의 소유명의만을 乙 앞으로 해 두되, 세금 등은 모두 甲이 부담한다'고 약정하였다. 그 후 甲은 丙과 丙 소유인 X 토지를 甲이 매수하는 내용의 매매계약을 체결하고, 丙에게 등기는 乙에게 이전하여 줄 것을 부탁하였고 丙이 이를 승낙하여 乙 명의의 소유권이전등기가 경료되었다. 다음 중 옳은 것을 모두 고른 것은?§★ 乙이 돈이 필요하게 되어 丁에게 위와 같은 사정을 설명하고 X 토지에 저당권을 설정하여 줄 테니 돈을 빌려달라고 부탁하여 丁으로부터 돈을 차용하고 X 토지에 저당권을 설정한 경우, 그 저당권설정등기는 무효의 등기이다.", false, "▸ 부동산 실권리자명의의 등기에 관한 법률 제4조(명의신탁약정의 효력) ③ 제1항 및 제2항의 무효는 제3자에게 대항하지 못한다.\n▸ 실명법 4조 3항의 '제3자'는 명의수탁자가 물권자임을 기초로 그와의 사이에 새로운 이해관계 맺은 사람 [2002다48771] → 실명법 4조 3항의 제3자는 적극가담이 아닌 한 선악 불문하고 보호", "명의신탁"],
  ["085.ㄹ", "2022. 10. 5. 甲이 乙 소유의 X부동산을 매수하는 계약을 체결하면서, 乙에게 매매대금 전액을 지급하고 그 등기는 丙과의 명의신탁약정에 기하여 乙로부터 丙 앞으로 하였다.§丙이 丁과 X에 관한 대물변제약정을 맺은 후, 丁과 戊 사이의 명의신탁약정에 따라 戊 앞으로 소유권이전등기를 한 경우, 戊가 소유자임을 기초로 하여 근저당권을 설정 받은 자는 근저당권의 유효를 주장할 수 있다.", true, "▸ 실명법 4조 3항의 '제3자'에는 명의신탁약정으로 형성된 외관을 토대로 다시 명의신탁 이뤄지는 연속된 명의신탁관계의 최후 명의수탁자가 물권자임을 기초로 그와 사이에 직접 새로운 이해관계 맺은 사람도 포함 O [2019다272725] → A가 B에게 제1명의신탁약정 → C는 B와 제1근저당권설정 및 대물변제약정 → D는 C와의 제2명의신탁약정을 하고 B로부터 소이등 이어받음 → E는 D가 물권자임을 기초로 D로부터 직접 제2근저당권 설정받음 → E는 A에게 제2근저당권설정등기의 유효 주장 O", "명의신탁"],
  ["086.ㄱ", "★ 양자간 등기명의신탁에서 명의수탁자가 신탁부동산을 처분하여 제3취득자가 유효하게 소유권을 취득하고 이로써 명의신탁자가 신탁부동산에 대한 소유권을 상실한 후 명의수탁자가 우연히 신탁부동산의 소유권을 다시 취득하였다면, 명의신탁자는 신탁부동산에 대하여 물권적 청구권을 행사하여 소유권을 다시 찾아올 수 있다.", false, "▸ 수탁자가 제3자에게 처분한 후에 우연히 수탁자가 다시 취득하여도 신탁자는 등기말소·진명소이등 × ∴ 신탁자가 실명법 4조 3항에 의해 소유권을 상실한 사실은 변함없어 물권적 청구권 존재 자체 × [2010다89814]", "명의신탁"],
  ["086.ㄴ", "3자간 등기명의신탁에서 명의수탁자가 제3자에게 소유권이전등기를 해준 경우, 명의수탁자가 무자력 상태라면 명의수탁자의 일반채권자들에 대한 관계에서 사해행위가 된다.", false, "▸ 3자간 명의신탁에서 수탁자 명의의 소유권이전등기는 무효, 부동산은 그 소유 아니므로 채무자 일반재산 × → 제3자와 매매계약 체결, 소이등 마쳐줘도 사해행위 × [2008다41635]", "명의신탁"],
  ["086.ㄷ", "★ 3자간 등기명의신탁에서 명의신탁자와 매도인 사이의 매매계약이 유효하므로 명의신탁자는 매도인에게 매매계약에 근거한 소유권이전등기를 청구할 수 있고, 이를 보존하기 위하여 매도인을 대위하여 명의수탁자에게 소유권이전등기의 말소를 청구할 수 있다.", true, "▸ 3자간 명의신탁에서 신탁자는 매도인에 대한 매매 원인 소유권이전등기청구권을 보전하기 위해 매도인을 대위하여 수탁자에게 무효인 등기 말소청구 O ∴ 실명법에 의해 소유권은 매도인 복귀, 매매계약은 여전히 유효 [2001다61654] → 이어 매도인 상대로 소유권이전등기청구 O", "명의신탁"],
  ["086.ㄹ", "★ 3자간 등기명의신탁에서 명의수탁자 명의의 부동산이 강제수용되는 경우, 명의수탁자는 지급받은 강제수용보상금을 부당이득으로 명의신탁자에게 반환할 의무가 없다.", false, "▸ 3자간 등기명의신탁에서 수탁자의 임의처분·강제수용·협의취득 등('처분행위 등')으로 제3자 명의의 소유권이전등기 마쳐지면 제3자 소유권 취득(실명법 4조 3항) → 매도인의 소유권이전 불능으로 신탁자는 소유권 이전받을 수 없는 한편 수탁자는 처분대금·보상금 취득하므로 수탁자는 이를 신탁자에게 부당이득으로 반환할 의무 부담한다는 판례는 유지되어야 [2018다284233]", "명의신탁"],
  ["087.②", "甲은 乙 소유의 시가 1억 5,000만 원인 X 토지를 매수하고자 동창인 丙과 명의신탁약정을 체결하고서, 매도인 乙과 사이에서는 자신이 당사자로서 매매계약 체결 후 매매대금 1억 원을 모두 지급하고, 다만 그 이전등기 명의에 관해서는 丙에게로 이전해달라고 하여 乙이 丙 명의로 소유권이전등기를 마쳐주었다. 이후 丙은 명의신탁 사실을 아는 丁에게서 8,000만 원을 차용하면서 X 토지에 丁 명의의 채권최고액 8,000만 원의 근저당권을 설정해 주었다.§甲과 乙 사이의 매매계약은 유효하므로, 甲은 乙에게 매매계약에 기한 소유권이전등기를 청구할 수 있고, 그 소유권이전등기청구권을 보전하기 위하여 乙을 대위하여 丙에게 진정명의 회복을 원인으로 한 소유권이전등기를 청구할 수 있다.", true, "▸ 3자간 등기명의신탁에서 수탁자의 임의처분·강제수용·협의취득 등('처분행위 등')으로 제3자 명의의 소유권이전등기 마쳐지면 제3자 소유권 취득(실명법 4조 3항) → 매도인의 소유권이전 불능으로 신탁자는 소유권 이전받을 수 없는 한편 수탁자는 처분대금·보상금 취득하므로 수탁자는 이를 신탁자에게 부당이득으로 반환할 의무 부담한다는 판례는 유지되어야\n수탁자가 제3자에게 근저당권 설정해준 경우도 마찬가지 → 매도인의 소유권이전은 불능은 아니므로 신탁자는 매도인을 대위하여 진정명의회복 원인 소이등 등을 통해 매도인으로부터 소유권이전 O → 신탁자는 피담보채무액만큼 교환가치가 제한된 소유권만만 취득하는 손해 O, 신탁자는 피담보채무액 상당 이익 O, 수탁자는 피담보채무액만큼 교환가치가 제한된 소유권만을 취득하는 손해 O, 매도인은 매매대금 수령하여 매매 목적 달성했으면서도 근저당권 설정된 상태의 소유권을 이전함에 대해 손해배상책임 없어 실질적 손실 × → 수탁자는 신탁자에게 근저당권 피담보채무액 상당 부당이득반환의무 O [2018다284233]", "명의신탁"],
  ["087.③", "甲은 乙 소유의 시가 1억 5,000만 원인 X 토지를 매수하고자 동창인 丙과 명의신탁약정을 체결하고서, 매도인 乙과 사이에서는 자신이 당사자로서 매매계약 체결 후 매매대금 1억 원을 모두 지급하고, 다만 그 이전등기 명의에 관해서는 丙에게로 이전해달라고 하여 乙이 丙 명의로 소유권이전등기를 마쳐주었다. 이후 丙은 명의신탁 사실을 아는 丁에게서 8,000만 원을 차용하면서 X 토지에 丁 명의의 채권최고액 8,000만 원의 근저당권을 설정해 주었다.§★ 丙이 이후 X 토지의 수용절차가 진행되자 丁의 피담보채권을 변제하고 근저당등기를 말소한 후 X 토지 시가 상당의 수용보상금을 수령하고 X 토지의 소유권이 국가에 귀속되었다면 甲은 직접 丙을 상대로 그 수령한 수용보상금에 대해 부당이득으로서 반환청구를 할 수 있다.", true, "▸ 수탁자가 제3자에게 처분한 후에 우연히 수탁자가 다시 취득하여도 신탁자는 등기말소·진명소이등 × ∴ 신탁자가 실명법 4조 3항에 의해 소유권을 상실한 사실은 변함없어 물권적 청구권 존재 자체 × [2018다284233, 2010다89814]", "명의신탁"],
  ["087.④", "甲은 乙 소유의 시가 1억 5,000만 원인 X 토지를 매수하고자 동창인 丙과 명의신탁약정을 체결하고서, 매도인 乙과 사이에서는 자신이 당사자로서 매매계약 체결 후 매매대금 1억 원을 모두 지급하고, 다만 그 이전등기 명의에 관해서는 丙에게로 이전해달라고 하여 乙이 丙 명의로 소유권이전등기를 마쳐주었다. 이후 丙은 명의신탁 사실을 아는 丁에게서 8,000만 원을 차용하면서 X 토지에 丁 명의의 채권최고액 8,000만 원의 근저당권을 설정해 주었다.§甲은 乙과 丙을 순차로 대위하여 악의의 丁을 상대로 근저당등기의 말소를 구할 수 있다.", false, "▸ 부동산 실권리자명의의 등기에 관한 법률 제4조(명의신탁약정의 효력) ③ 제1항 및 제2항의 무효는 제3자에게 대항하지 못한다.\n▸ 실명법 4조 3항의 제3자는 선악을 불문함", "명의신탁"],
  ["087.⑤", "甲은 乙 소유의 시가 1억 5,000만 원인 X 토지를 매수하고자 동창인 丙과 명의신탁약정을 체결하고서, 매도인 乙과 사이에서는 자신이 당사자로서 매매계약 체결 후 매매대금 1억 원을 모두 지급하고, 다만 그 이전등기 명의에 관해서는 丙에게로 이전해달라고 하여 乙이 丙 명의로 소유권이전등기를 마쳐주었다. 이후 丙은 명의신탁 사실을 아는 丁에게서 8,000만 원을 차용하면서 X 토지에 丁 명의의 채권최고액 8,000만 원의 근저당권을 설정해 주었다.§★ 甲은 乙에 대해 X 토지의 피담보채무액만큼 교환가치가 제한된 소유권만을 취득할 수밖에 없는 손해에 대해 부당이득반환을 구할 수 있다.", true, "▸ 위 087.② 해설 참조 [2018다284233]", "명의신탁"],
  ["088.②", "甲은 2019. 9. 丙으로부터 그 소유의 부동산을 매수하고 매매대금을 모두 지급하였다. 다만, 甲은 친구 乙과 명의신탁약정을 하였기에 그에 따라 X부동산에 관하여 丙으로부터 乙에게로 소유권이전등기가 마쳐졌다.§★ 甲은 丙을 대위하여 乙명의로 된 소유권이전등기의 말소를 청구할 수 있다.", true, "▸ 3자간 명의신탁에서 신탁자는 매도인에 대한 매매 원인 소유권이전등기청구권을 보전하기 위해 매도인을 대위하여 수탁자에게 무효인 등기 말소청구 O ∴ 실명법에 의해 소유권은 매도인 복귀, 매매계약은 여전히 유효 [2001다61654]", "명의신탁"],
  ["088.③", "甲은 2019. 9. 丙으로부터 그 소유의 부동산을 매수하고 매매대금을 모두 지급하였다. 다만, 甲은 친구 乙과 명의신탁약정을 하였기에 그에 따라 X부동산에 관하여 丙으로부터 乙에게로 소유권이전등기가 마쳐졌다.§★ 甲은 丙에 대하여 매매를 원인으로 한 소유권이전등기를 청구할 수 있다.", true, "▸ 3자간 명의신탁에서 신탁자는 매도인에 대한 매매 원인 소유권이전등기청구권을 보전하기 위해 매도인을 대위하여 수탁자에게 무효인 등기 말소청구 O ∴ 실명법에 의해 소유권은 매도인 복귀, 매매계약은 여전히 유효 [2001다61654] → 이어 매도인 상대로 소유권이전등기청구 O", "명의신탁"],
  ["089.ㄴ", "甲과 乙이 체결한 명의신탁약정에 따라(탈법 목적 등은 없었음), 甲이 丙과의 매매계약을 기초로 매매대금을 지급한 후 부동산 X를 양도받으면서 乙명의로 소유권이전등기가 경료된 경우.§★ 乙이 甲에게 소유권이전등기를 경료해 준 경우, 甲은 유효하게 소유권을 취득한다.", true, "▸ 3자간 등기명의신탁에서 수탁자가 신탁자에게 바로 등기 마쳐주면 실체관계 부합 유효 O ∴ 매매 유효하여 대위하여 말소 가능 [2004다6764]", "명의신탁"],
  ["090.①", "「부동산 실권리자명의의 등기에 관한 법률」이 적용되는 명의신탁에 관한 설명 중 옳은 것은?§3자 간 등기명의신탁에서 명의수탁자가 명의신탁된 부동산을 임의처분하여 제3자가 그 소유권을 취득한 경우, 매도인의 소유권이전등기의무가 이행불능이 되어 발생하는 매도인과 명의신탁자 사이의 법률관계와 명의수탁자가 매도인의 소유권을 침해하여 발생하는 명의수탁자와 매도인 사이의 법률관계를 각각 구분하여 개별적으로 이해관계를 조정하면 부당이득반환 제도의 취지에 배치될 수 있다.", true, "▸ [2018다284233] 이유 中 판단 부분", "명의신탁"],
  ["090.②", "「부동산 실권리자명의의 등기에 관한 법률」이 적용되는 명의신탁에 관한 설명 중 옳은 것은?§★ 3자 간 등기명의신탁에서 명의신탁자가 매도인을 대위하지 않고 직접 명의수탁자를 상대로 부당이득반환을 원인으로 한 소유권이전등기를 청구한 경우, 이에 따라 마쳐진 명의신탁자 명의의 소유권이전등기는 무효이다.", true, "▸ 신탁자는 수탁자에 대해 부당이득반환으로 소유권이전등기청구 × ∴ 신탁자는 매도인에 대해 여전히 소유권이전등기청구권 있으므로 손해 없고, 수탁자는 현재 소유자도 아님 [2008다55290] → 그러나 수탁자가 신탁자에게 바로 등기 마쳐주면 실체관계 부합 유효 O ∴ 매매 유효하여 대위하여 말소 가능 [2004다6764]", "명의신탁"],
  ["090.③", "「부동산 실권리자명의의 등기에 관한 법률」이 적용되는 명의신탁에 관한 설명 중 옳은 것은?§계약명의신탁에서 매도인이 명의신탁약정에 대하여 알지 못했던 경우, 명의수탁자가 명의신탁자에 대한 매수자금 반환에 갈음하여 명의신탁된 부동산 자체를 양도하기로 합의하고 그에 기하여 명의신탁자가 지정하는 제3자 앞으로 소유권이전등기를 마쳐 주었다면 그 제3자 명의의 소유권이전등기는 유효이다.", false, "▸ 선의의 계약명의신탁에서, 매수자금반환채권(유효하게 존재함)에 대한 대물변제약정을 통하여 신탁자가 등기를 받으면 유효하나(실명법 위반 등 무효 사유가 없음, 2014다30483 판결 참조), 그러한 대물변제약정을 실현하는 과정에서 신탁자가 다시 지정하는 제3자 앞으로 소유권이전등기를 마치게 되면 이는 또 다른 명의신탁이므로(일종의 3자간 명의신탁으로 볼 수 있음), 지문의 제3자(새로운 수탁자) 명의의 등기는 무효임(2006다73102 판결 참조), 최초로 등장했고 난이도가 매우 높은 지문임.", "명의신탁"],
  ["090.④", "「부동산 실권리자명의의 등기에 관한 법률」이 적용되는 명의신탁에 관한 설명 중 옳은 것은?§계약명의신탁에서 매도인이 명의수탁자와 매매계약을 체결할 때는 명의신탁약정에 대하여 알지 못하였으나 명의수탁자 명의로 소유권이전등기를 마쳐 줄 때는 이를 알게 된 경우, 매도인과 명의수탁자 간 매매계약은 소급적으로 무효가 된다.", false, "▸ 계약명의신탁에서 매도인의 선악의는 매매계약 체결 당시를 기준으로 판단해야 → 매매계약 체결 이후 매도인이 명의신탁약정 사실 알게 되었다고 하더라도 매매계약이나 등기가 소급하여 무효로 되지 × ∴ 매도인 선택으로 효력 좌우되는 것은 부당 [2017다257715]", "명의신탁"],
  ["090.⑤", "「부동산 실권리자명의의 등기에 관한 법률」이 적용되는 명의신탁에 관한 설명 중 옳은 것은?§계약명의신탁에서 매도인이 명의신탁약정에 대하여 알고 있었던 경우, 매도인과 명의수탁자가 체결한 매매계약은 원시적으로 무효이고 해당 부동산의 소유권은 매도인에게 그대로 남아 있게 되므로 특별한 사정이 없는 한 명의신탁자는 매도인에게 소유권이전등기를 청구할 수 있다.", false, "▸ 상대방 악의 계약명의신탁의 경우 매매계약은 원시적 무효 → 매도인은 수탁자 상대로 등기말소청구 O, 수탁자는 매도인 상대 매매대금 부당이득반환청구 O [통판]\n신탁자는 계약을 체결한 매수인이 아니므로 매도인에게 권리 ×, 수탁자에게 제공한 매수자금 O ∴ 신탁자는 애초부터 소유권 취득할 수 없었으므로 [2002다66922]", "명의신탁"],
  ["091.ㄱ", "甲과 그 친구 乙은 2019. 2. 1. 丙 소유의 X건물을 乙이 매수하여 乙 명의로 등기하기로 하는 명의신탁약정을 체결하였다. 乙은 2019. 2. 10. 丙과 매매계약을 체결한 다음, 甲으로부터 제공받은 매매대금을 丙에게 지급하고, 2019. 4. 10. X건물에 관하여 자신의 명의로 소유권이전등기를 마쳤다. 이에 관한 설명 중 옳지 않은 것을 모두 고른 것은?§★ 丙이 甲과 乙 사이의 명의신탁약정을 안 경우, 乙이 X건물을 丁에게 매도하고 소유권이전등기를 마쳐주었다면 丁은 선의, 악의를 불문하고 유효하게 소유권을 취득할 수 있다.", true, "▸ 실명법 4조 3항의 '제3자'는 명의수탁자가 물권자임을 기초로 그와의 사이에 새로운 이해관계 맺은 사람 [2002다48771] → 실명법 4조 3항의 제3자는 적극가담이 아닌 한 선악 불문하고 보호", "명의신탁"],
  ["091.ㄴ", "甲과 그 친구 乙은 2019. 2. 1. 丙 소유의 X건물을 乙이 매수하여 乙 명의로 등기하기로 하는 명의신탁약정을 체결하였다. 乙은 2019. 2. 10. 丙과 매매계약을 체결한 다음, 甲으로부터 제공받은 매매대금을 丙에게 지급하고, 2019. 4. 10. X건물에 관하여 자신의 명의로 소유권이전등기를 마쳤다. 이에 관한 설명 중 옳지 않은 것을 모두 고른 것은?§★ 丙이 甲과 乙 사이의 명의신탁약정을 안 경우, 乙이 X건물을 丁에게 매도하고 소유권이전등기를 넘겨주었다면 乙의 X건물 처분행위는 丙에 대한 관계에서 불법행위를 구성하므로 丙은 乙에게 X건물의 처분 당시의 시가 상당액을 손해배상으로 청구할 수 있다.", false, "▸ 상대방 악의 계약명의신탁에서, 수탁자 명의 등기 무효, 부동산의 소유권은 매도인에게 그대로 남아 있음 → 수탁자가 부동산을 제3자에게 처분하면 매도인의 소유권 침해행위로서 불법행위가 될 것으로 보이나, 결국 매도인에게 '손해'가 없어 불법행위 손해배상청구 × ∴ 수탁자로부터 대금 수령한 소유자는 동시이행관계인 수탁자의 소유명의 회복이 불가능하여 신의칙상 매매대금 반환 거절 가능, 계약관계가 없는 신탁자로부터 소유권이전등기청구도 받지 않으므로 [2010다95185]", "명의신탁"],
  ["091.ㄷ", "甲과 그 친구 乙은 2019. 2. 1. 丙 소유의 X건물을 乙이 매수하여 乙 명의로 등기하기로 하는 명의신탁약정을 체결하였다. 乙은 2019. 2. 10. 丙과 매매계약을 체결한 다음, 甲으로부터 제공받은 매매대금을 丙에게 지급하고, 2019. 4. 10. X건물에 관하여 자신의 명의로 소유권이전등기를 마쳤다. 이에 관한 설명 중 옳지 않은 것을 모두 고른 것은?§★ 丙이 甲과 乙 사이의 명의신탁약정을 알지 못한 경우, 乙이 무자력 상태에서 甲으로부터 수령한 매수자금을 반환하기 위하여 X건물을 甲에게 양도하였다면, 이는 乙의 다른 채권자들에 대한 관계에서 사해행위가 된다.", true, "▸ 상대방 선의 계약명의신탁에서, 무자력의 수탁자가 신탁된 부동산을 신탁자나 그가 지정하는 자에게 양도하는 행위는 사해행위 O ∴ 명의신탁약정의 무효에도 불구하고 실명법 4조 2항 단서에 의해 수탁자가 완전한 소유권 취득하여 수탁자의 책임재산 O, 신탁자는 수탁자의 금전채권자 중 한 명에 불과 [2007다74874]", "명의신탁"],
  ["092.③", "甲과 乙은 2013. 10. 17. 甲의 자금으로 丙 소유의 토지를 매수하여 乙 명의로 등기하기로 하는 명의신탁약정을 하고, 乙이 丙과 매매계약을 체결한 후 丙에게 매매대금을 지급하고 乙 명의로 소유권이전등기를 경료하였다. 다음 설명 중 옳은 것은?§★ 丙이 甲과 乙 사이의 명의신탁약정이 있다는 사실을 알지 못한 경우, 甲은 乙을 상대로 乙에게 지급한 매수자금 상당의 부당이득반환을 청구할 수 있다.", true, "▸ 실명법 이후 상대방 선의의 계약명의신탁에서, 명의신탁약정 무효로 신탁자가 입은 손해는 부동산 자체 ×, 수탁자에게 제공한 매수자금 O ∴ 신탁자는 애초부터 소유권 취득할 수 없었으므로 [2002다66922]", "명의신탁"],
  ["SS10.ㄱ", "★ 명의신탁자가 명의신탁약정과는 별개의 적법한 원인에 기하여 명의수탁자에 대하여 소유권이전등기청구권을 가지게 되었다 하더라도, 이를 보전하기 위하여 자신의 명의가 아닌 제3자 명의로 가등기를 마친 경우 위 가등기는 명의신탁자와 그 제3자 사이의 명의신탁약정에 기하여 마쳐진 것으로서 효력이 없다.", true, "▸ 명의신탁 이후 신탁자와 수탁자가 무효인 명의신탁약정을 전제로 신탁자의 수탁자에 대한 소유권이전등기청구권 확보 위해 부동산에 신탁자의 가등기 마치고 향후 요구하면 본등기 마쳐주기로 약정했으면 가등기 및 약정 모두 무효 → 나아가 신탁자·수탁자가 위 무효인 명의신탁약정을 함과 아울러 그 약정을 전제로 신탁자의 수탁자에 대한 소유권이전등기청구권을 확보하기 위해 명의신탁 부동산에 신탁자 명의 가등기 마치고 향후 신탁자가 요구하면 본등기 마쳐 주기로 약정했더라도, 이러한 약정은 무효이고 그 가등기는 원인무효 [2014다63315]", "명의신탁"],
  ["SS10.ㄴ", "★ 부동산 실권리자명의의 등기에 관한 법률 시행 전에 명의신탁자와 명의수탁자가 이른바 계약명의신탁약정을 맺고 명의수탁자가 당사자가 되어 명의신탁약정이 있다는 사실을 알지 못하는 소유자와 부동산에 관한 매매계약을 체결한 후 그 매매계약에 따라 당해 부동산의 소유권이전등기를 수탁자 명의로 마쳤으나 위 법률 제11조에서 정한 유예기간이 경과하기까지 명의신탁자가 그 명의로 당해 부동산을 등기이전하는 데 법률상 장애가 있었던 경우에는, 명의수탁자는 명의신탁자에게 그로부터 제공받은 매수자금을 부당이득으로 반환하여야 한다.", true, "▸ 실명법 시행 전 상대방 선의의 계약명의신탁에서 유예기간이 경과한 경우라고 하더라도, 유예기간 경과 전에도 신탁자의 등기이전에 법률상 장애가 있었다면 신탁자는 소유권 취득할 수 없었으므로 소이등 부당이득반환이 아닌 제공한 매수자금의 부당이득반환 청구로 해야 [2007다74690]", "명의신탁"],
  ["SS10.ㄷ", "★ 양자간 등기명의신탁에서 명의수탁자가 신탁부동산을 처분하여 제3취득자가 유효하게 소유권을 취득하고 이로써 명의신탁자가 신탁부동산에 대한 소유권을 상실한 경우, 명의신탁자는 명의수탁자를 상대로 등기말소의무의 이행불능을 이유로 민법 제390조에 따른 손해배상을 청구할 수 없다.", true, "▸ 수탁자가 제3자에게 처분한 후에 우연히 수탁자가 다시 취득하여도 신탁자는 등기말소·진명소이등 × ∴ 신탁자가 실명법 4조 3항에 의해 소유권을 상실한 사실은 변함없어 물권적 청구권 존재 자체 × [2010다89814]\n소유자가 소유권에 기하여 등기명의인 상대로 등기말소나 진정명의회복 구하는 권리는 물권적 청구권으로서 방해배제청구권(214조) → 소유자가 그 후에 소유권 상실하면, 말소의무자에게 물권적청구권 실현 불능을 이행불능으로 390조 손해배상청구 × [2010다28604]\n▸ 위 두 판례를 결합한 지문으로 볼 수 있음", "명의신탁"],
  ["SS10.ㄹ", "종중 소유 부동산을 조세포탈 등의 목적 없이 유효하게 종원에게 명의신탁한 경우, 명의수탁자가 사망하면 위임 법리에 따라 명의신탁 관계는 종료한다.", false, "▸ 실명법 8조 2호 부부간 명의신탁 일단 유효하면 그 후 배우자 일방 사망으로 부부관계 해소되더라도 명의신탁약정은 사망한 배우자의 다른 상속인과의 관계에서도 여전히 유효 존속 O [2011다99498] / 명의수탁자가 사망하면 그 명의신탁관계는 그 재산상속인과의 사이에 존속 O [80다2809]", "명의신탁"],
  ["093.ㄷ", "甲은 2023. 2. 1. 자신의 동생인 乙과 명의신탁약정을 체결하였고, 乙은 甲이 제공한 매수자금으로 丙으로부터 丙 소유의 X 토지를 매수하여 2023. 2. 3. 乙 명의의 소유권이전등기를 마쳤다. 매매계약 체결 당시 丙은 甲과 乙 사이의 명의신탁약정에 관해서는 알지 못하였다. 현재 甲은 X 토지를 점유하고 있다.§★ 甲은 乙에 대한 매수자금 상당의 부당이득반환청구권을 피담보채권으로 하여 X 토지에 관하여 유치권을 행사할 수 있다.", false, "▸ 계약명의신탁에서 명의신탁자가 수탁자에 대하여 가지는 매수대금 상당의 부당이득반환청구권은 부동산 자체로부터 발생한 채권 × [2008다34828]", "명의신탁"],
  ["093.ㄹ", "甲은 2023. 2. 1. 자신의 동생인 乙과 명의신탁약정을 체결하였고, 乙은 甲이 제공한 매수자금으로 丙으로부터 丙 소유의 X 토지를 매수하여 2023. 2. 3. 乙 명의의 소유권이전등기를 마쳤다. 매매계약 체결 당시 丙은 甲과 乙 사이의 명의신탁약정에 관해서는 알지 못하였다. 현재 甲은 X 토지를 점유하고 있다.§★ 甲은 20년간 X 토지를 평온, 공연하게 점유함으로써 X 토지의 소유자를 상대로 점유취득시효 완성으로 인한 소유권이전등기를 청구할 수 있다.", false, "▸ 계약명의신탁에서 신탁자는 특별한 사정 없는 한 매도인의 선악의를 불문하고 타주점유로서 자주점유 추정 ×, 취득시효 × ∴ 실명법 4조 1, 2항 따라 매도인 선의면 수탁자 소유권 취득하고 악의면 매도인에게 소유권 남게 되며 그에게 소이등청구 ×, 신탁자는 소유권 가질 수 없고 매매당사자 아니라서 소이등청구 못하는 것 잘 알고 있으므로 소유권 취득 원인인 법률요건 없이 이를 잘 알면서 타인 부동산 점유 [2019다249428]", "명의신탁"],
  ["094.②", "■보충 상호명의신탁의 경우, 그 토지가 분할되면 분할된 각 토지에 상호명의신탁관계가 그대로 존속되고, 분할된 토지의 한쪽 토지에 대한 상호명의신탁관계가 소멸되어도 나머지 분할토지에 관한 명의신탁관계가 소멸하지는 않는다.", true, "▸ 상호명의신탁에서 토지 분할되면 각 토지에 종전 토지의 공유등기 전사되어 상호명의신탁관계 그대로 존속 → 분할된 토지의 한 쪽 토지에 대한 등기가 중복등기로서 말소됨으로써 그 토지에 관한 상호명의신탁관계가 소멸되었다고 하여도 나머지 분할토지에 관한 명의신탁관계가 당연 소멸되는 것은 아님 [92다42460]", "명의신탁"],
  ["094.④", "★ 「부동산 실권리자명의의 등기에 관한 법률」에 의해 무효인 계약명의신탁의 경우, 명의신탁자가 명의신탁약정에 따라 부동산을 점유한다면 특별한 사정이 없는 한 명의신탁자는 소유의 의사로 점유하는 것으로 추정된다.", false, "▸ 계약명의신탁에서 신탁자는 특별한 사정 없는 한 매도인의 선악의를 불문하고 타주점유로서 자주점유 추정 ×, 취득시효 × [2019다249428]", "명의신탁"],
  ["095.ㄱ", "★ 계약명의신탁에서 명의수탁자가 자신의 완전한 소유권취득을 전제로 사후적으로 명의신탁자와의 사이에 명의신탁부동산의 매수자금반환의무의 이행에 갈음하여 명의신탁된 부동산 자체를 양도하기로 합의한 경우, 그 약정은 특별한 사정이 없는 한 유효이다.", true, "▸ 상대방 선의의 계약명의신탁에서, 당사자들이 명의신탁약정이 유효함(=신탁자가 내부적 소유권 보유함)을 전제로 장차 신탁자 앞으로 소유권이전등기 이전하거나 처분대가 지급하는 약정했다면 무효 → 그러나 수탁자가 완전한 소유권 취득함을 전제로 사후적으로 신탁자와 매수자금반환의무 이행에 갈음하여 명의신탁된 부동산 자체 양도하기로 합의하고 소유권이전등기해주면 약정 및 등기 유효 O ∴ 새로운 소유권이전 원인인 대물급부약정에 기한 것 [2014다30483]", "명의신탁"],
  ["096.②", "甲은 부동산 경매절차에서 丙 소유의 X건물을 취득하기 위하여 친구 乙과 명의신탁약정을 맺고 2019. 10. 5. 乙명의로 매각허가결정을 받아 甲 자신의 비용을 들여 乙로 하여금 매각대금을 완납하게 하였다. 그 후 X건물은 乙명의로 소유권이 이전되었다. 이에 관한 설명으로 옳은 것은?§★ 甲의 채권자는 자신의 채권을 보전하기 위하여 X건물을 가압류 할 수 있다.", false, "▸ 신탁자는 수탁자에 부당이득반환채권만 있고, 부동산은 신탁자 책임재산 × [2011다89903] → 수탁자 乙의 소유이므로 甲의 채권자는 가압류 ×", "명의신탁"],
  // 지상권·법정지상권,
  ["097.①", "甲은 乙에 대한 대출금 채권의 담보를 위하여 乙 소유 X 토지에 저당권과 아울러 지료 없는 지상권을 취득하면서 乙로 하여금 그 토지를 계속하여 점유·사용하게 하였다.§★ 乙이 건물 신축이 가능한 나대지였던 X 토지에 용벽을 설치하고 도로를 개설한 경우, 甲은 乙에게 X 토지에 대한 임료 상당 부당이득반환을 청구할 수 없다.", true, "▸ 토지에 저당권과 지상권을 함께 취득한 경우 지상권은 담보가치 하락시키는 침해행위 배제하여 저당부동산의 담보가치 확보함에 목적 있으므로, 만일 제3자가 건물축조행위 하면 지상권자로서 중지요구 O → 그러나 무단점유자에 대해 지상권 자체 침해 이유로 임료 상당 손해배상 × → 한편 피담보채권이 변제·시효소멸 되면 이러한 지상권은 부종하여 소멸 O [2003마1753, 2006다586, 2011다6342]", "지상권·법정지상권"],
  ["097.③", "甲은 乙에 대한 대출금 채권의 담보를 위하여 乙 소유 X 토지에 저당권과 아울러 지료 없는 지상권을 취득하면서 乙로 하여금 그 토지를 계속하여 점유·사용하게 하였다.§★ 乙이 丙에게 X 토지에 대한 무상 사용을 승낙하고 이에 따라 丙이 X 토지에 단풍나무를 심은 경우, 이 단풍나무는 X 토지에 부합되지 않는다.", true, "▸ 지상권설정등기 마친 토지에 관하여 토지소유자로부터 토지 이용 권리 취득하여도 지상권존속하는 한 256조 단서의 '권원' × ∴ 토지 사용·수익권은 지상권자에게 있으므로 → 그러나 금융기관이 대출채권 담보 위하여 토지에 저당권과 함께 지료 없는 지상권 취득하며 채무자의 사용·수익권을 배제하지 않은 경우에는 토지소유자로부터 토지 이용 권리 취득하면 256조 단서의 권원 O ∴ 토지소유자는 담보가치 하락만 아니면 사용·수익권 O [2015다69907] → 지료 없는 지상권 설정해준 토지소유자와 사용대차 계약 체결한 사용차주는 권원 O → 그가 토지에 식재한 나무는 부합되지 않고 사용차주의 소유", "지상권·법정지상권"],
  ["097.④", "甲은 乙에 대한 대출금 채권의 담보를 위하여 乙 소유 X 토지에 저당권과 아울러 지료 없는 지상권을 취득하면서 乙로 하여금 그 토지를 계속하여 점유·사용하게 하였다.§★ X 토지에 대한 甲 명의의 저당권의 피담보채무가 소멸시효 완성으로 인해 소멸한 경우, X 토지에 대한 甲 명의의 지상권도 이에 부종하여 소멸하므로 乙에게는 甲 명의의 지상권의 피담보채무의 부존재에 대한 확인을 구할 이익이 인정된다.", false, "▸ [민소] 담보지상권이라 하더라도 피담보채무 범위 확인의 이익 × ∴ 지상권은 용익물권으로서 피담보채무 개념 ×, 담보지상권도 담보권 존속과 지상권 존속이 연계되어 있을 뿐 피담보채무 × [2015다65042]", "지상권·법정지상권"],
  ["097.⑤", "甲은 乙에 대한 대출금 채권의 담보를 위하여 乙 소유 X 토지에 저당권과 아울러 지료 없는 지상권을 취득하면서 乙로 하여금 그 토지를 계속하여 점유·사용하게 하였다.§X 토지에 甲 명의의 저당권과 지상권이 설정될 당시 X 토지에 乙 소유 Y 건물이 신축되어 있었던 경우, 甲의 위 저당권에 기한 임의경매 신청에 따라 X 토지가 경매되어 丁이 매각대금을 완납하면 Y 건물을 위한 법정지상권이 성립한다.", true, "▸ 지상건물이 있는 토지에 저당권과 지상권을 함께 설정해준 경우에 저당권 실행으로 지상권 소멸되면 366조 법정지상권 O [91다23462]", "지상권·법정지상권"],
  ["098.①", "★ 금융기관이 대출금채권의 담보를 위해 토지에 저당권과 함께 지료없는 지상권을 설정하면서 채무자 등의 사용, 수익권을 배제하지 않은 경우 지상권자는 특별한 사정이 없는 한 해당 토지의 무단점유자에 대하여 지상권 침해를 이유로 한 임료상당의 손해배상청구를 할 수 없다.", true, "▸ [2003마1753, 2006다586]", "지상권·법정지상권"],
  ["098.④", "★ 지상권설정자가 2년분의 지료가 연체된 지상권의 소멸을 청구하지 않고 있는 동안 지상권자로부터 연체된 지료의 일부를 지급받고 이를 이의없이 수령하여 연체된 지료가 2년 미만으로 된 경우, 지상권설정자는 종전에 지상권자가 2년분의 지료를 연체하였다는 사유를 들어 지상권 소멸을 청구할 수 없다.", true, "▸ 2년 이상 지료 연체했으나 설정자가 소멸청구 없이 연체지료 일부를 이의 없이 수령하여 연체액 2년 미만으로 되면 소멸청구 × = 법정지상권 [2012다102384] → 임대차에서 2기분 혹은 3기분 차임 연체와 해지도 마찬가지 법리", "지상권·법정지상권"],
  ["099.②", "★ 채권자가 채무자의 토지에 대하여 저당권을 취득하면서 담보목적의 지상권을 함께 설정받은 경우에 저당권이 변제 등으로 소멸하더라도 지상권의 존속기간이 남아있으면 그 지상권은 존속한다.", false, "▸ 토지에 저당권과 지상권을 함께 취득한 경우 지상권은 담보가치 하락시키는 침해행위 배제하여 저당부동산의 담보가치 확보함에 목적 → 피담보채권이 변제되면 이러한 지상권은 부종하여 소멸 O [2011다6342]", "지상권·법정지상권"],
  ["100.ㄱ", "★ 甲이 그 소유 X 토지에 관하여 乙 명의로 저당권을 설정한 후 乙의 동의를 얻어 X 토지에 Y 건물을 신축하였다. 저당권이 실행되어 丙이 X 토지의 소유권을 취득한 경우, 甲은 「민법」제366조의 법정지상권을 취득한다.", false, "▸ 건물 없는 토지에 저당권 설정 당시 근저당권자가 토지소유자의 건물 건축에 동의했더라도 366조 법정지상권 × ∴ 공시할 수 없기에 경락인이 알 수 없어 법률관계 매우 불명확 [2003다26051]", "지상권·법정지상권"],
  ["100.ㄴ", "★ 甲이 乙 소유 X 토지 위에 소유하고 있는 Y 건물을 甲의 채권자 丙이 가압류한 후 乙이 Y 건물의 소유권을 취득하였다. 위 가압류에 기한 본압류 및 강제경매절차가 진행되어 丁이 Y 건물의 소유권을 취득한 경우 丁은 관습상의 법정지상권을 취득한다.", false, "▸ 관습상 법정지상권은 원시적 동일인 소유일 필요는 없고 소유권이 변동될 당시에 동일인 소유일 것 → 그러나 '강제경매'에서 소유자 동일성 기준 시점은 '압류 효력 발생시(=강제경매개시결정 기입등기시)' O, 매각대금 완납시 × ∴ 압류 효력 발생 후 경매목적물 소유권 취득한 자는 대금완납되면 직권말소되어 매각대금 완납시 소유자 무의미 → 경매개시결정 이전의 가압류가 본압류로 이행된 경우는 '가압류 효력 발생시' 기준 ∴ 가압류 당시 본집행 효력 [2010다52140]", "지상권·법정지상권"],
  ["100.ㄷ", "★ 甲이 그 소유 X 토지에 관하여 乙의 채권을 담보하기 위하여 乙 명의로 가등기를 마쳐 준 다음 X 토지 위에 Y 건물을 신축하였다. 그 후 乙이 위 가등기에 기한 본등기를 마친 경우, 甲은 관습상의 법정지상권을 취득하지 못한다.", true, "▸ 담보가등기 마친 나대지에 대지소유자가 건물 신축한 후 본등기 되면 × ∴ 담보가등기 마친 자의 이익 크게 해치므로 [94다5458]", "지상권·법정지상권"],
  ["100.ㄹ", "★ X 토지와 Y 건물을 甲과 乙이 각 2분의 1 지분씩 공유하던 중 甲이 Y 건물의 공유지분을 丙에게 증여한 경우, 丙은 관습상의 법정지상권을 취득한다.", false, "▸ 토지·지상 건물 모두 각 공유인데 토지·건물공유자 중 1인이 건물 지분만 타에 증여하여 토지와 건물의 소유자 달라진 경우, 건물 지분 양수인이 건물 소유 위한 관습상 법정지상권 × ∴ 토지공유자 1인으로 하여금 다른 공유자 의사 기하지 않고 자기 지분 제외한 다른 공유자의 지분까지 지상권설정 처분행위 허용하는 셈 [2018다218601]", "지상권·법정지상권"],
  ["101.①", "★ 토지 또는 그 지상 건물의 소유권이 강제경매로 인하여 매수인에게 이전되는 경우, 매각대금의 완납 시를 기준으로 토지와 지상건물이 동일인에게 속하였는지에 따라 관습상 법정지상권의 성립 여부를 가려야 한다.", false, "▸ 강제경매에서 소유자 동일성 기준 시점은 압류 효력 발생시(=강제경매개시결정 기입등기시) O, 매각대금 완납시 × ∴ 압류 효력 발생 후 경매목적물 소유권 취득한 자는 대금완납되면 직권말소되어 매각대금 완납시 소유자 무의미 [2010다52140]", "지상권·법정지상권"],
  ["101.②", "★ 건물의 소유를 위한 법정지상권을 취득한 사람으로부터 경매에 의하여 건물의 소유권을 이전받은 매수인은 특별한 사정이 없는 한 위 법정지상권을 취득한다.", true, "▸ 358조는 저당부동산에 종된 권리에도 유추적용 O → 건물에 대한 저당권의 효력은 그 건물 소유 목적으로 하는 지상권에도 미침 → 건물 저당권 실행되어 경락인이 건물 소유권 취득하면 그 건물 소유 위한 지상권도 187조에 의해 등기 없이 당연히 경락인이 취득 O [92다527]", "지상권·법정지상권"],
  ["101.③", "★ 건물공유자 중 1인이 그 건물의 부지인 토지를 단독으로 소유하면서 그 토지에 관하여만 저당권을 설정하였다가 저당권의 실행에 의한 경매로 제3자가 토지의 소유권을 취득한 경우, 건물공유자들은 토지 전부에 관하여 법정지상권을 취득한다.", true, "▸ 건물공유자 1인이 부지를 단독으로 소유하면서 토지에 관하여만 저당권 설정했다가 그 경매로 토지 소유자 달라진 경우, 건물공유자들은 토지 전부에 관해 366조 법정지상권 취득 O ∴ 토지소유자는 자기뿐만 아니라 다른 건물공유자들을 위하여도 토지 이용 인정하고 있었고, 저당권자로서도 저당권 설정 당시 법정지상권 부담 예상하여 불측의 손해 아니며, 건물 철거로 인한 사회경제적 손실 방지 공익상 필요성 [2010다67159] → 건물 공유 사건에서는 관법지, 366 법지 모두 인정 O", "지상권·법정지상권"],
  ["101.④", "★ 미등기건물이 그 대지와 함께 매도되었는데 매수인에게 위 대지에 관하여만 소유권이전등기가 마쳐진 경우, 매도인에게 관습상 법정지상권이 인정되지 않는다.", true, "▸ 미등기건물을 대지와 함께 매도한 사람이 매수인에게 대지만 등기해주고 건물은 매도인의 소유로 남아있어 형식적으로 대지와 건물의 소유자가 달라졌더라도 매도인에게 관습상 법정지상권 × ∴ 관습상 법정지상권의 취지에 비추어 토지 점유·사용에 당사자 사이 약정 있다고 보이거나 토지 소유자가 건물 처분권까지 함께 취득한 경우는 인정할 까닭 × [2002다9660]", "지상권·법정지상권"],
  ["102.ㄱ", "★ X토지와 그 지상 Y건물의 소유자인 甲이 X토지와 Y건물에 관하여 乙에게 공동저당권을 설정해 준 다음 Y건물을 헐고 Z건물을 신축한 후 Z건물에 관하여 X토지와 동일한 순위의 공동저당권을 설정해준 경우, 저당권의 실행으로 丙이 X토지의 소유권을 취득하면, 甲은 Z건물을 위한 법정지상권을 취득할 수 없다.", false, "▸ 토지·건물 공동저당 설정 후 건물 철거되고 신축한 건물에 공동저당권 설정 × → 신축건물 법정지상권 × ∴ 공동저당권자의 궁극적인 나대지의 교환가치 실현 기대 어긋나 불측의 손해(토지 교환가치에서 제외된 법정지상권 상당의 가치는 법정지상권 성립하는 건물 교환가치에서 되찾을 수 있었음) → 일괄매각청구 O → 토지 안분할 금액은 나대지 평가 [98다43601] → 설문은 공동저당권자에게 신축건물인 Z건물에 관하여 동순위의 공동저당권을 설정해줬으므로, 판례의 반대해석상 甲은 Z건물을 위한 법정지상권 취득 O (본 판례 사안은 366 법지의 모든 요건을 갖추었음에도 공동저당권자의 담보 가치 보호를 위해 예외적으로 부정한 사안이었음)", "지상권·법정지상권"],
  ["102.ㄴ", "★ X토지와 그 지상 Y건물의 소유자인 甲이 X토지와 Y건물을 乙에게 매도하고 각 소유권이전등기를 마쳐주었는데, 그 후 甲의 채권자 丙에 의하여 Y건물에 관한 매매계약만 사해행위취소소송을 통하여 취소되고 그에 따라 Y건물에 마쳐져 있던 乙 명의의 등기가 말소된 경우, 甲은 Y건물의 존립을 위한 관습법상 법정지상권을 취득한다.", false, "▸ 토지와 지상건물이 함께 양도되었다가 채권자취소권 행사로 건물 양도만 취소되어 수익자 명의의 등기가 말소되었더라도 (채무자는) 관습상 법정지상권 × ∴ 동일인 소유 토지·건물이 '매매 등으로 소유자 다르게 된 경우' ×, 사해행위 취소는 채권자·수익자 사이 상대적 효력일 뿐 채무자가 직접 권리 취득 × [2012다73158]", "지상권·법정지상권"],
  ["SS11.ㄱ", "대지와 그 지상건물의 소유자인 甲이 乙에게 지상건물을 매도하고 소유권이전등기를 경료해 주었다. 그 뒤 乙이 그 채권자 A 은행을 위하여 위 지상건물에 저당권 설정등기를 경료해 주었고, 나중에 저당권이 실행되어 丙이 매각결정을 받고 매각대금을 완납하였다. 그 뒤 丙이 丁에게 건물을 매도하고 소유권이전등기를 경료해 주었다.§★ 乙은 관습상 법정지상권을 취득하였다.", true, "▸ ㄱ, ㄴ, ㄹ, ㅁ 해설 : 甲이 토지·건물 소유하다가, 乙이 건물만 매수하면서 관법지 성립 → 丙이 저당권 실행 경매에서 건물 대금 완납했을 때 관법지 당연승계취득 → 丁이 건물 매수하면서 관법지 양도받았으나 등기 없어 아직 취득 못함", "지상권·법정지상권"],
  ["SS11.ㄴ", "대지와 그 지상건물의 소유자인 甲이 乙에게 지상건물을 매도하고 소유권이전등기를 경료해 주었다. 그 뒤 乙이 그 채권자 A 은행을 위하여 위 지상건물에 저당권 설정등기를 경료해 주었고, 나중에 저당권이 실행되어 丙이 매각결정을 받고 매각대금을 완납하였다. 그 뒤 丙이 丁에게 건물을 매도하고 소유권이전등기를 경료해 주었다.§★ 丙은 관습상 법정지상권을 취득하였다.", true, "▸ 위 SS11.ㄱ 해설 참조 [84다카1578]", "지상권·법정지상권"],
  ["SS11.ㄹ", "대지와 그 지상건물의 소유자인 甲이 乙에게 지상건물을 매도하고 소유권이전등기를 경료해 주었다. 그 뒤 乙이 그 채권자 A 은행을 위하여 위 지상건물에 저당권 설정등기를 경료해 주었고, 나중에 저당권이 실행되어 丙이 매각결정을 받고 매각대금을 완납하였다. 그 뒤 丙이 丁에게 건물을 매도하고 소유권이전등기를 경료해 주었다.§丙이 丁에게 건물을 양도하였을 때, 특별한 사정이 없는 한 관습상 법정지상권도 양도한 것으로 볼 수 있다.", true, "▸ 법정지상권을 취득한 건물소유자가 지상권설정등기 없이 건물 양도한 경우 특별한 사정 없는 한 건물과 함께 지상권도 양도하는 채권적 계약 O, 매도인은 지상권설정등기 하여 건물양수인에게 이전등기해줄 의무 O → 건물양수인은 건물양도인을 대위하여 토지소유자에 대해 건물소유자였던 최초 법정지상권자에게로 법정지상권설정등기 청구 O → 대지소유자는 법정지상권 있는 건물 양수인에 대해 건물철거·대지인도 구할 수 × ∴ 지상권 부담 용인하고 설정등기해줄 의무 있는 자가 권리자를 상대로 한 청구라 신의성실원칙상 불허 [87다카279]", "지상권·법정지상권"],
  ["SS11.ㅁ", "대지와 그 지상건물의 소유자인 甲이 乙에게 지상건물을 매도하고 소유권이전등기를 경료해 주었다. 그 뒤 乙이 그 채권자 A 은행을 위하여 위 지상건물에 저당권 설정등기를 경료해 주었고, 나중에 저당권이 실행되어 丙이 매각결정을 받고 매각대금을 완납하였다. 그 뒤 丙이 丁에게 건물을 매도하고 소유권이전등기를 경료해 주었다.§★ 丁은 건물 소유권 취득과 동시에 관습상 법정지상권을 취득하였다.", false, "▸ 위 SS11.ㄱ 해설 참조 — 법정지상권을 취득한 건물소유자가 지상권설정등기 없이 건물 양도한 경우, 건물양수인은 법정지상권 '취득할 지위'를 취득하지만 아직 법정지상권 설정등기를 받지 못했으므로 법정지상권을 취득한 것은 아님 [87다카279]", "지상권·법정지상권"],
  ["SS12.ㄱ", "★ 동일인의 소유에 속하는 토지 및 그 지상 건물에 관하여 공동저당권이 설정된 후 그 지상 건물이 철거되고 새로 건물이 신축된 경우에는 그 신축건물의 소유자가 토지의 소유자와 동일하고 토지의 저당권자에게 신축건물에 관하여 토지의 저당권과 동일한 순위의 공동저당권을 설정해 주는 등 특별한 사정이 없는 한 저당물의 경매로 인하여 토지와 그 신축건물이 다른 소유자에 속하게 되더라도 그 신축건물을 위한 법정지상권은 성립하지 않는다.", true, "▸ 토지·건물 공동저당 설정 후 건물 철거되고 신축한 건물에 공동저당권 설정 × → 신축건물 법정지상권 × ∴ 공동저당권자의 궁극적인 나대지의 교환가치 실현 기대 어긋나 불측의 손해 → 다만 신축건물의 소유자가 토지의 소유자와 동일하고 토지의 저당권자에게 신축건물에 관하여 토지의 저당권과 동일한 순위의 공동저당권을 설정해 주는 등 특별한 사정이 있다면 법정지상권 성립 O [98다43601]", "지상권·법정지상권"],
  ["SS13.ㄱ", "甲은 X 토지와 그 토지 위 Y 건물의 소유자이다. 2013. 5. 1. 乙은 X 토지에 대한 저당권을 설정하였고, 2013. 7. 1. 丙이 X 토지와 Y 건물을 모두 매수하고 이전등기를 마쳤다. 乙이 X 토지에 대한 저당권을 실행하여 경매가 개시되었고 그 경매절차에서 丁이 2014. 1. 5. X 토지를 매수하였다. 2013. 12. 1. 甲의 채권자 戊가 甲과 丙 사이의 Y 건물의 매매를 사해행위로 취소하고 등기의 말소를 구하는 소를 제기하여 승소하였고 그 무렵 판결은 확정되었다. 2024. 2. 5. 丙의 Y 건물에 대한 이전등기가 말소되었고, 戊가 Y 건물에 대한 강제경매를 신청하여 2024. 5. 1. K 은행이 Y 건물의 소유권을 취득하였다.§★ 2024. 2. 5. 甲은 X 토지에 대한 관습법상 법정지상권을 취득한다.", false, "▸ 토지와 지상건물이 함께 양도되었다가 채권자취소권 행사로 건물 양도만 취소되어 수익자 명의의 등기가 말소되었더라도 (채무자는) 관습상 법정지상권 × ∴ 동일인 소유 토지·건물이 '매매 등으로 소유자 다르게 된 경우' ×, 사해행위 취소는 채권자·수익자 사이 상대적 효력일 뿐 채무자가 직접 권리 취득 × [2012다73158]", "지상권·법정지상권"],
  ["SS13.ㄴ", "甲은 X 토지와 그 토지 위 Y 건물의 소유자이다. 2013. 5. 1. 乙은 X 토지에 대한 저당권을 설정하였고, 2013. 7. 1. 丙이 X 토지와 Y 건물을 모두 매수하고 이전등기를 마쳤다. 乙이 X 토지에 대한 저당권을 실행하여 경매가 개시되었고 그 경매절차에서 丁이 2014. 1. 5. X 토지를 매수하였다. 2013. 12. 1. 甲의 채권자 戊가 甲과 丙 사이의 Y 건물의 매매를 사해행위로 취소하고 등기의 말소를 구하는 소를 제기하여 승소하였고 그 무렵 판결은 확정되었다. 2024. 2. 5. 丙의 Y 건물에 대한 이전등기가 말소되었고, 戊가 Y 건물에 대한 강제경매를 신청하여 2024. 5. 1. K 은행이 Y 건물의 소유권을 취득하였다.§★ 丙은 K 은행에게 등기부취득시효에 기하여 Y 건물의 소유권을 주장할 수 있다.", false, "▸ 사해행위취소 판결 전후 10년 동안 '수익자'가 등기 보유한 채 부동산을 점유하여도 등기부취득시효 기초인 점유 × ∴ 사해행위취소 효과는 채권자·수익자 사이 상대적으로 생길 뿐 부동산은 여전히 수익자의 소유, 부동산에 적법·유효 등기로 소유권 취득한 사람의 점유는 사실상태 권리관계 보호 필요 ×, 입증곤란 구제 필요 × [2013다206313] → 사안에서 수익자 丙이 13. 7. 1.부터 Y건물의 소유자이다가 24. 2. 5. 그 등기가 사해행위취소로 말소되었어도 대외적으로는 계속 소유자이므로, 丙은 계속하여 자기 소유인 Y건물을 점유하는 것 → 시효취득 불가능", "지상권·법정지상권"],
  ["SS13.ㄷ", "甲은 X 토지와 그 토지 위 Y 건물의 소유자이다. 2013. 5. 1. 乙은 X 토지에 대한 저당권을 설정하였고, 2013. 7. 1. 丙이 X 토지와 Y 건물을 모두 매수하고 이전등기를 마쳤다. 乙이 X 토지에 대한 저당권을 실행하여 경매가 개시되었고 그 경매절차에서 丁이 2014. 1. 5. X 토지를 매수하였다. 2013. 12. 1. 甲의 채권자 戊가 甲과 丙 사이의 Y 건물의 매매를 사해행위로 취소하고 등기의 말소를 구하는 소를 제기하여 승소하였고 그 무렵 판결은 확정되었다. 2024. 2. 5. 丙의 Y 건물에 대한 이전등기가 말소되었고, 戊가 Y 건물에 대한 강제경매를 신청하여 2024. 5. 1. K 은행이 Y 건물의 소유권을 취득하였다.§★ 丁은 K 은행에게 X 토지의 인도 및 Y 건물의 철거를 청구할 수 있다.", false, "▸ 사해행위에서의 수익자가 건물 소유자로서 366조 법정지상권 취득한 후에 채무자와 수익자 사이 건물양도행위가 채권자취소권 행사로 취소되어 수익자 등기가 말소된 다음 건물의 경매절차 진행되면 그 경락인은 법정지상권을 당연 승계취득 O [2012다73158]", "지상권·법정지상권"],
  ["103.③", "건물의 소유자가 관습상의 법정지상권을 취득하는 경우는?§★ 토지와 지상 건물이 함께 양도되었다가 채권자취소권의 행사에 따라 그 중 건물에 관하여만 양도가 취소되고 수익자와 전득자 명의의 소유권 이전등기가 말소된 경우", false, "▸ 설문에서 '건물의 소유자'의 법정지상권 취득 여부를 물었는데, 이 경우 상대적 효력을 고려하면 여전히 '수익자'가 건물의 소유자인 것이고, 그는 당연히 법정지상권을 취득할 여지조차 없음, 그런데 해당 사안의 판결은 '채무자'에게 등기가 회복되었으나 그럼에도 채무자는 상대적 효력에 비추어 그 건물의 소유권을 취득한 것이 아니어서 법정지상권을 취득할 수 없다는 취지이므로, 결국 설문은 다소 부자연스러움\n▸ 토지와 지상건물이 함께 양도되었다가 채권자취소권 행사로 건물 양도만 취소되어 수익자 명의의 등기가 말소되었더라도 (채무자는) 관습상 법정지상권 × ∴ 동일인 소유 토지·건물이 '매매 등으로 소유자 다르게 된 경우' ×, 사해행위 취소는 채권자·수익자 사이 상대적 효력일 뿐 채무자가 직접 권리 취득 × [2012다73158]", "지상권·법정지상권"],
  ["103.④", "건물의 소유자가 관습상의 법정지상권을 취득하는 경우는?§★ 타인의 토지에 건물을 소유하고 있던 중 건물 소유자의 채권자가 건물을 가압류하였고, 이후 토지의 소유자가 건물의 소유권을 취득하였는데, 위 건물에 대한 가압류에 기한 강제경매절차가 진행되어 경락인이 매각대금을 완납한 경우", false, "▸ 강제경매에서 소유자 동일성 기준 시점은 압류 효력 발생시(=강제경매개시결정 기입등기시) O, 매각대금 완납시 × ∴ 압류 효력 발생 후 경매목적물 소유권 취득한 자는 대금완납되면 직권말소되어 매각대금 완납시 소유자 무의미 → 경매개시결정 이전의 가압류가 본압류로 이행된 경우는 가압류 효력 발생시 기준 ∴ 가압류 당시 토지와 건물 소유자 달랐으므로 그 후 강제경매해서 혹은 완납 당시 동일인 소유였다 하더라도 관법지 × [2010다52140] → 지문에서 토지 소유자가 건물 소유권을 취득해서 결국 소유자 동일성을 갖추진 했으나 건물 가압류 시를 기준으로 하면 소유자가 동일하지 않음", "지상권·법정지상권"],
  ["104.①", "★ 토지와 그 지상 건물이 동일인 소유였는데, 그 소유자가 토지와 그 지상 건물을 함께 타인에게 매도하고, 그중 토지에 관해서만 소유권이전등기를 마친 경우, 그 지상 건물에 관한 관습상 법정지상권을 인정할 필요가 없다.", true, "▸ 미등기건물을 대지와 함께 매도한 사람이 매수인에게 대지만 등기해주고 건물은 매도인의 소유로 남아있어 형식적으로 대지와 건물의 소유자가 달라졌더라도 매도인에게 관습상 법정지상권 × ∴ 관습상 법정지상권의 취지에 비추어 토지 점유·사용에 당사자 사이 약정 있다고 보이거나 토지 소유자가 건물 처분권까지 함께 취득한 경우는 인정할 까닭 × [2002다9660] → 지문이 미등기건물은 아니지만 토지와 지상건물을 매도하면서 대지만 등기를 마친 점에서 동일함", "지상권·법정지상권"],
  ["104.③", "★ 강제경매의 목적이 된 토지나 건물의 소유권이 강제경매로 인하여 그 절차상 매수인에게 이전된 경우, 원칙적으로 그 압류의 효력이 발생하는 때를 기준으로 토지와 그 지상 건물이 동일인에 속하였는지에 따라 관습상 법정지상권 성립 여부를 판단하여야 한다.", true, "▸ 강제경매에서 소유자 동일성 기준 시점은 압류 효력 발생시(=강제경매개시결정 기입등기시) O, 매각대금 완납시 × [2010다52140]", "지상권·법정지상권"],
  ["105.②", "★ 유효하게 명의신탁된 토지 위에 수탁자가 건물을 지어 소유하고 있다가 그 명의신탁이 해지되더라도 수탁자가 신탁자에 대하여 관습상의 법정지상권을 취득할 수 없다.", true, "▸ 유효한 명의신탁이 된 토지 상에 '수탁자'가 건물을 신축한 후 명의신탁 해지로 신탁자 명의의 가등기에 기한 본등기가 된 경우 × ∴ 대내적 관계에서 신탁자 소유인 대지이므로 소유자 동일 × [86다카62]", "지상권·법정지상권"],
  ["105.③", "★ 구분소유적 공유에서 공유자 甲이 배타적인 점유부분에 건물을 신축하여 소유하던 중 강제경매에 의해 다른 공유자 乙이 甲의 대지지분을 취득한 경우, 건물소유자 甲은 관습상의 법정지상권을 취득하지 못한다.", false, "▸ 구분소유적 공유관계에서 자기 몫의 대지 위에 건물 신축했다가 그의 대지 지분 강제경매되면 건물 소유자는 관습상 법정지상권 O ∴ 등기부상은 공유지만, '내부관계'에 있어서 동일인 소유 O [89다카24094]", "지상권·법정지상권"],
  ["105.④", "★ 토지의 공유자 중의 1인이 공유토지 위에 건물을 소유하고 있다가 토지지분만을 매각한 경우, 건물의 소유를 위한 관습상의 법정지상권이 성립될 수 없다.", true, "▸ '토지' 공유자의 1인이 지분 과반수 동의로 건물 신축 후 대지에 대한 자기 지분을 매도하거나 공유지 경매분할로 소유자 달라진 경우 × ∴ 토지공유자 1인이 다른 공유자 지분에 지상권설정의 처분행위 허용하는 셈 [92다55756] → 소위 토지공유 사안은 원칙적으로 법정지상권 부정(예외 있음)", "지상권·법정지상권"],
  ["106.ㄷ", "★ 甲이 乙 소유의 X 토지 위에 Y 건물을 소유하고 있던 중 甲의 채권자 丙이 Y 건물을 가압류하였고 이후 乙이 Y 건물의 소유권을 취득하였다. 위 가압류에 기한 본압류 및 강제경매절차가 진행되어 丁이 Y 건물에 대한 매각대금을 완납하였다. 이 경우 丁은 Y 건물의 소유를 위하여 X 토지에 대한 관습상의 법정지상권을 취득하지 못한다.", true, "▸ 강제경매에서 소유자 동일성 기준 시점은 압류 효력 발생시(=강제경매개시결정 기입등기시) O, 매각대금 완납시 × ∴ 압류 효력 발생 후 경매목적물 소유권 취득한 자는 대금완납되면 직권말소되어 매각대금 완납시 소유자 무의미 → 경매개시결정 이전의 가압류가 본압류로 이행된 경우는 가압류 효력 발생시 기준 ∴ 가압류 당시 본집행 효력 [2010다52140] → 가압류 당시 토지와 건물 소유자 달랐으므로 관법지 ×", "지상권·법정지상권"],
  ["107.ㄱ", "甲은 乙로부터 금전을 차용하면서 乙에게 甲 소유인 X 토지에 저당권을 설정해 주었고, Y는 X 토지 위에 있는 건물이다.§★ X 토지에 저당권이 설정된 당시 甲에 의하여 건축 중이던 Y 건물의 규모·종류가 외형상 예상할 수 있는 정도까지 건축이 진전되었고, 그 후 그 저당권의 실행을 위한 경매절차에서 매수인이 매각대금을 다 낼 때까지 독립된 부동산으로서 건물의 요건을 갖추었다면 Y 건물을 위한 법정지상권이 성립한다.", true, "▸ 토지에 저당권 설정 당시 건물로 독립된 부동산으로 볼 정도에 이르지 않았더라도 저당권설정 당시 건물의 규모·종류가 외형상 예상될 정도까지 진전되었고, 그 후 경락대금 완납시까지 최소한의 지붕·기둥·주벽 갖추면 법정지상권 O [2003다29043]", "지상권·법정지상권"],
  ["107.ㄴ", "甲은 乙로부터 금전을 차용하면서 乙에게 甲 소유인 X 토지에 저당권을 설정해 주었고, Y는 X 토지 위에 있는 건물이다.§甲이 X 토지와 미등기인 Y 건물을 함께 매수하면서 X 토지에 관해서만 소유권이전등기를 넘겨받았는데, X 토지에 대하여 乙에게 저당권을 설정하고 그 저당권의 실행으로 X 토지가 丙의 소유가 되었다면, Y 건물을 위한 법정지상권이 성립한다.", false, "▸ 미등기건물을 대지와 함께 매수한 사람이 대지만 등기한 상태에서 대지에 저당권 설정했다가 저당권 실행되어 경락된 경우 366조 법정지상권 × ∴ 저당권 설정 당시에 대지와 건물 소유자 동일 × [2002다9660]", "지상권·법정지상권"],
  ["107.ㄷ", "甲은 乙로부터 금전을 차용하면서 乙에게 甲 소유인 X 토지에 저당권을 설정해 주었고, Y는 X 토지 위에 있는 건물이다.§★ 乙의 저당권 실행에 따른 경매로 인하여 X 토지의 소유권이 丙에게 이전되고 그 후 甲이 자기 소유인 Y 건물을 丁에게 양도하면서 자신이 취득한 법정지상권을 양도한 경우, 丁이 이 지상권에 대한 등기를 하지 않았다고 하더라도 丙은 丁을 상대로 소유권에 기하여 Y 건물의 철거를 구할 수는 없다.", true, "▸ 법정지상권 취득한 건물소유자가 지상권설정등기 없이 건물 양도한 경우 특별한 사정 없는 한 건물과 함께 지상권도 양도하는 채권적 계약 O, 매도인은 지상권설정등기 하여 건물양수인에게 이전등기해줄 의무 O → 건물양수인은 건물양도인을 대위하여 토지소유자에 대해 건물소유자였던 최초 법정지상권자에게로 법정지상권설정등기 청구 O → 대지소유자는 법정지상권 있는 건물 양수인에 대해 건물철거·대지인도 구할 수 × ∴ 지상권 부담 용인하고 설정등기해줄 의무 있는 자가 권리자를 상대로 한 청구라 신의성실원칙상 불허 [87다카279]", "지상권·법정지상권"],
  ["108.ㄱ", "★ 甲과 A가 X토지에 관한 근저당권설정계약을 체결하면서 법정지상권의 성립을 배제하기로 하는 특약을 한 경우 甲은 丙에 대하여 법정지상권을 주장할 수 없다.", false, "▸ 저당권설정 당사자간 특약으로 저당목적물인 토지에 대해 법정지상권 배제약정 해도 무효 ∴ 366조는 가치권과 이용권의 조절 위한 공익상 이유로 지상권 설정 강제하는 것 [87다카1564] → 366조는 강행규정", "지상권·법정지상권"],
  ["108.ㄷ", "★ Y건물에 대한 강제경매절차에서 戊가 Y건물을 매수하고 매각대금을 납입하여 소유권을 취득하면 특별한 사정이 없는 한 법정지상권도 함께 취득한다.", true, "▸ 건물소유를 위해 법정지상권을 취득한 자로부터 경매에 의해 건물 소유권을 이전받은 경락인은 경락 후 건물을 철거한다는 등의 매각조건에서 경매되는 경우 등 특별한 사정이 없는 한 건물의 경락취득과 함께 위 지상권도 당연히 취득 O [84다카1578]", "지상권·법정지상권"],
  ["109.ㄷ", "★ 甲과 乙이 X토지 전체에 관하여 근저당권을 설정한 후 甲이 (A) 부분 지상에 건물을 건축하여 소유하던 중 위 근저당권이 실행되어 戊가 X 토지의 소유권을 취득한 경우 甲은 법정지상권을 주장할 수 없다.", true, "▸ 구분소유적 공유관계에서 자기 몫의 대지 위에 건물 신축했다가 대지지분이나 대지 전체에 설정된 저당권이 실행된 경우 건물을 위한 366조 법정지상권 O ∴ 내부관계에서는 소유자 동일 O [2004다13533] → 그러나 설문의 경우 나대지인 X토지에 근저당권이 설정된 '후'에 甲이 건물을 신축하였으므로 366조의 '저당권설정 당시 건물 존재' 요건이 탈락하여 甲은 366조 법정지상권을 주장할 수 ×", "지상권·법정지상권"],
  ["110.②", "★ 甲이 2011. 4. 1. Y건물을 丁에게 양도한 경우에 丁은 2012. 4. 1. X토지에 대해서 민법 제366조의 법정지상권을 취득한다.", true, "▸ 저당권 설정 당시 동일인 소유였다가 그 후 낙찰 전에 건물이 제3자에게 양도되어 낙찰 당시에는 소유자 동일성 없어지더라도 O ∴ 366조의 공익성, 저당권자로서는 부담 예상 [99다52602]", "지상권·법정지상권"],
  ["111.②", "★ 丙은 Y건물의 소유를 위한 법정지상권을 그에 관한 등기 없이도 취득한다.", true, "▸ ①②③④⑤ 관련 : 설문에서 乙에게 Y건물의 소유권이전등기 마쳐졌을 때 乙은 관습상 법정지상권 취득 O → 丙이 Y건물의 강제경매 매각대금 완납했을 때 丙은 관법지 당연승계취득 O → 丁이 Y건물 소이등 마쳤더라도 丁은 관법지 '취득할' 지위, Y건물을 다시 매수하여 등기 마치지 않은 채 사용·수익하고 있는 戊도 관법지 '취득할' 지위\n▸ 법정지상권을 가진 건물소유자로부터 건물을 양수한 자는 지상권등기 없이 지상권 취득할 수 없으나, 채권자대위 법리로 건물양도인·대지소유자에 대하여 차례로 지상권설정등기·이전등기 청구할 수 있으므로 토지소유자의 그에 대한 건물철거청구는 신의칙상 불허 [84다카1131] → ③번에 관한 판례", "지상권·법정지상권"],
  ["111.③", "★ 丁은 법정지상권을 취득한다.", false, "▸ 위 111.② 해설 참조 — 丁은 관법지 '취득할 지위'를 취득하지만 아직 법정지상권 설정등기를 받지 못했으므로 법정지상권을 취득한 것은 아님", "지상권·법정지상권"],
  ["111.⑤", "★ 戊는 Y건물의 철거 및 X토지의 인도를 할 필요가 없으나, X토지의 사용·수익으로 인한 이익은 부당이득으로 반환하여야 한다.", true, "▸ ①②③④⑤ 관련 : 위 111.② 해설 참조\n▸ 법정지상권을 가진 건물소유자로부터 건물을 양수한 자는 지상권등기 없이 지상권 취득할 수 없으나, 채권자대위 법리로 건물양도인·대지소유자에 대하여 차례로 지상권설정등기·이전등기 청구할 수 있으므로 토지소유자의 그에 대한 건물철거청구는 신의칙상 불허 [84다카1131]\n▸ 丁이 X토지 부당이득반환해야 하는 근거 판례 : 2개\n법정지상권 있는 건물양수인이 법정지상권 취득할 지위로서 건물철거 거부할 수 있다고 하더라도 대지 점유사용으로 얻은 실질적 이득은 대지소유자에게 손해 끼치는 한에서는 부당이득반환의무 O [94다61144]\n타인 소유 토지 위에 권한 없이 미등기 건물 원시취득 하여 소유하는 자는, 그 건물의 사실상 처분권 가지는 양수인이 따로 존재하는 경우에도, 특별한 사정 없는 한 법률상 원인 없이 토지 차임 상당 이익 얻고 이로 인해 타인에게 동액 상당 손해 주는 것 ∴ 그 자체로써 건물 부지 점유하는 것 O [2009다76522]\n▸ 戊가 X토지 부당이득반환해야 하는 근거 판례 : 2개(⑤번에 관한 판례)", "지상권·법정지상권"],
  ["112.ㄱ", "분묘에 관한 설명 중 옳은 것을 모두 고른 것은? (「장사 등에 관한 법률」은 고려하지 말 것)§★ 분묘의 수호·관리권자가 사망하여 그 직계비속들이 공동상속인이 되었고 이들 사이에 분묘의 수호·관리권 승계에 관한 협의가 없다면, 특별한 사정이 없는 한 그 직계비속들 중 최근친의 연장자가 이를 승계한다고 보는 것이 관습법의 내용에 부합한다.", false, "▸ [상속] 제1008조의3 '제사주재자'는 공동상속인들 사이 협의 이뤄지지 않은 경우는 특별한 사정이 없는 한 '직계비속' 중 성별·적서 불문하고 '최근친 연장자'가 우선하는 것이 '조리'에 부합 [2018다248626]\n→ 위 판결은 민법 제1조(민사에 관하여 법률에 규정이 없으면 관습법에 의하고 관습법이 없으면 조리에 의한다)에 비추어, 과거 대법원은 적장자가 우선적으로 제사상속인이 되는 관습에 기초하였으나, 이후 2008년 전원합의체 판결에서 종래 관습은 개인의 존엄과 평등을 기초로 한 변화된 가족제도에 부합하지 않아 더 이상관습법으로서의 효력 유지할 수 없기에 제사주재자 결정방법을 민법의 일반원리와 '조리'에 의해 정해야 한다고 보았고, 그 후 다시 '조리'를 기준으로 하여 위 판결로 변경된 것이므로, 더 이상 '관습법'은 기준이 될 수 없는 것", "지상권·법정지상권"],
  ["112.ㄴ", "분묘에 관한 설명 중 옳은 것을 모두 고른 것은? (「장사 등에 관한 법률」은 고려하지 말 것)§토지 소유자의 승낙에 의해 분묘기지권이 성립하는 경우, 분묘기지권의 성립 당시 토지 소유자와 분묘의 수호·관리권자가 지료 지급의무의 존부나 범위 등에 관하여 약정을 하였더라도 그 약정의 효력은 그 분묘기지를 포함하는 토지에 관한 임의경매절차에서 이를 매수한 자에게는 미치지 않는다.", false, "▸ 분묘 기지가 분묘 수호·관리권자 아닌 타인 소유인 경우에 그 소유자가 관리권자에게 분묘 설치 승낙한 때는 분묘기지권 설정한 것 → 승낙에 의한 분묘기지권은 성립 당시 토지소유자와 분묘 수호·관리자가 지료 존부·범위 등에 관해 약정했다면 약정은 분묘기지 승계인에 대하여도 효력 O [2017다271834]", "지상권·법정지상권"],
  ["112.ㄷ", "분묘에 관한 설명 중 옳은 것을 모두 고른 것은? (「장사 등에 관한 법률」은 고려하지 말 것)§■보충 분묘기지권은 분묘를 수호하고 봉제사하는 목적을 달성하는 데 필요한 범위 내에서 타인 소유의 토지를 사용할 수 있고 제3자는 물론 토지 소유자의 방해도 배제할 수 있는 관습상의 물권이다.", true, "▸ 이유 中 : 분묘기지권은 분묘 수호하고 봉제사하는 목적 달성하는 데 필요한 범위 내에서 타인 소유 토지를 사용할 수 있고 토지소유자나 제3자의 방해를 배제할 수 있는 관습상의 물권 [2013다17292] → 정답결정력은 없었음", "지상권·법정지상권"],
  ["112.ㄹ", "분묘에 관한 설명 중 옳은 것을 모두 고른 것은? (「장사 등에 관한 법률」은 고려하지 말 것)§분묘의 수호·관리권자가 타인의 토지에 그 토지 소유자의 승낙 없이 분묘를 무단으로 설치한 경우에도 분묘기지권을 시효로 취득할 수 있다.", true, "▸ 타인 토지에 승낙 얻지 않고 분묘 설치한 자도 20년간 평온·공연하게 분묘의 기지를 점유하면 시효로 지상권에 유사한 물권(분묘기지권) 취득 O → 등기 없이 제3자에게 대항할 수 있는 것이 관습 O [4290민상539]", "지상권·법정지상권"],
  ["SS14.ㄱ", "甲은 자기 소유 X 토지 위에 분묘를 설치한 후 X 토지의 소유권이 경매로 乙에게 이전되면서 분묘기지권을 취득하였다.§乙이 분묘기지에 관한 지료를 청구하면, 특별한 사정이 없는 한 甲은 乙이 청구한 날부터의 지료를 乙에게 지급하여야 한다.", false, "▸ 자기 소유 토지에 분묘 설치한 사람이 토지 양도하며 분묘 이장 특약을 하지 않음으로써 분묘기지권 취득(양도형 분묘기지권) → 특별한 사정 없는 한 분묘기지권자는 분묘기지권 '성립한 때'부터 토지소유자에게 지료지급의무 O [2020다295892]", "지상권·법정지상권"],
  ["SS14.ㄴ", "甲은 자기 소유 X 토지 위에 분묘를 설치한 후 X 토지의 소유권이 경매로 乙에게 이전되면서 분묘기지권을 취득하였다.§분묘기지권의 효력이 미치는 지역의 범위 내라면, 甲은 그 범위 내에서 분묘기지권 취득 이후 사망한 다른 사람의 합장을 위하여 쌍분 형태의 분묘를 설치할 수 있다.", false, "▸ 분묘기지권 미치는 범위는 분묘를 수호·봉사하기 위해 필요한 범위에 한정, 이미 분묘기지권 미치는 범위 내이더라도 새로운 분묘 설치 × [2001다28367]", "지상권·법정지상권"],
  ["SS14.ㄷ", "甲은 자기 소유 X 토지 위에 분묘를 설치한 후 X 토지의 소유권이 경매로 乙에게 이전되면서 분묘기지권을 취득하였다.§甲의 분묘기지권의 존속기간은 지상권에 관한 규정에 따르므로 특별한 사정이 없는 한 5년이다.", false, "▸ 분묘기지권 존속기간은 민법의 지상권 규정 ×, 당사자 사이 약정이 없는 한, 권리자가 분묘의 수호·봉사 계속하고 분묘가 존속하는 동안 존속 O [81다1220]", "지상권·법정지상권"],
  ["SS14.ㄹ", "甲은 자기 소유 X 토지 위에 분묘를 설치한 후 X 토지의 소유권이 경매로 乙에게 이전되면서 분묘기지권을 취득하였다.§★ 甲이 乙에게 분묘기지권을 포기하는 의사표시를 한 경우, 甲이 점유를 포기하지 않더라도 분묘기지권은 소멸한다.", true, "▸ 분묘기지권은 권리자가 의무자에 대해 권리 포기 의사표시만으로 소멸 O, 점유까지 포기해야만 소멸하는 것은 × [92다14762]", "지상권·법정지상권"],
  ["기타02", "甲은 그 소유 토지에 관하여 A에게 지상권설정등기를 마쳐 주었다. 그 후 乙은 위 토지에 무단으로 건물을 건립하였다. 이 건물은 아직 소유권보존등기가 마쳐지지 않은 상태이다.§★ 甲은 乙을 상대로 불법점유로 인한 차임상당의 손해배상을 구할 수 있다.", false, "▸ 토지에 지상권 설정해도 소유자는 불법점유자에 대해 물권적청구권 O → 그러나 지상권 존속하는 한 토지소유자는 불법점유자에게 차임 상당 손해배상청구 × [74다1150]", "지상권·법정지상권"],
  // 지역권·전세권,
  ["113.ㄱ", "지역권에 관한 설명 중 옳은 것을 모두 고른 것은?§통행지역권을 시효취득한 경우, 특별한 사정이 없는 한 요역지 소유자는 도로 설치 및 사용으로 인해 승역지 소유자가 입은 손해를 보상할 의무가 없다.", false, "▸ 종전에 승역지 사용이 무상이었다는 특별한 사정이 없는 한, 통행지역권을 시효취득 한 요역지 소유자는 주위토지통행권과 마찬가지로 승역지에 대한 도로 설치 및 사용으로 인한 승역지 소유자의 손해 보상하여야 ∴ 도로 설치 의한 사용을 근거로 영구적 통행지역권 인정되는 사정, 주위토지통행권과의 유사성 [2012다17479]", "지역권·전세권"],
  ["113.ㄴ", "지역권에 관한 설명 중 옳은 것을 모두 고른 것은?§■보충 요역지의 불법점유자는 통행지역권의 시효취득을 주장할 수 없다.", true, "▸ 토지의 불법점유자는 토지소유권 상린관계로서 위요지 통행권 주장 ×, 통행지역권의 시효취득 주장 × ∴ 위요지통행권·통행지역권은 인접 토지 상호이용 조절 기한 권리로서 토지 소유자·지상권자·전세권자 등 토지사용권 가진 자에게 인정되는 권리 [76다1694]", "지역권·전세권"],
  ["113.ㄷ", "지역권에 관한 설명 중 옳은 것을 모두 고른 것은?§■보충 지역권의 취득시효가 완성된 후 등기를 하기 전에 승역지의 소유자가 변경된 경우, 소유권을 취득한 제3자에 대하여는 지역권의 시효취득을 주장할 수 없다.", true, "▸ 취득시효로 등기 하지 않은 자가 소유자로부터 소유권등기 넘겨 받은 제3자에 대해 취득시효 주장 못하는 법리는 통행지역권의 취득시효에서도 마찬가지 ∴ 제294조가 제245조 준용 [2012다17479] → 완성 후 취득자 법리는 지역권 취득시효도 동일", "지역권·전세권"],
  ["113.ㄹ", "지역권에 관한 설명 중 옳은 것을 모두 고른 것은?§요역지 소유자가 타인 소유인 승역지 위에 새로 통로를 설치하고 그 통로를 사용하는 상태가 민법상 부동산 취득시효 기간 동안 계속된 경우, 요역지 소유자는 통행지역권을 시효취득한다.", true, "▸ 통행지역권을 시효취득하려면 요역지 소유자가 통로를 개설하여야 [95다1088]\n제294조(지역권취득기간) 지역권은 계속되고 표현된 것에 한하여 제245조의 규정을 준용한다.", "지역권·전세권"],
  ["114.ㄱ", "甲은 자기 소유 X 건물에 乙 앞으로 전세권을 설정해 주었다.§★ 乙이 자신의 채권자 丙을 위하여 전세권 위에 저당권을 설정해 준 후 甲이 乙에게 변제기를 정하지 않고 금전을 대여한 경우, 전세권의 존속기간 만료 후 丙이 물상대위에 의하여 乙의 전세금반환채권을 압류하였다면 甲은 대여금채권과 전세금반환채권의 상계로써 丙에게 대항할 수 있다.", false, "▸ 전세금반환채권에 물상대위권을 행사하는 전세권저당권자에 대하여, 전세권설정자는 315조 전세권자에 대한 손해배상채권 '외'의 채권으로는 상계로 대항 × [2006다29372] → 315조 손해배상채권만큼은 물상대위권을 행사하는 자에 대하여도 상계 혹은 공제(충당)로 대항할 수 있다는 취지", "지역권·전세권"],
  ["114.ㄴ", "甲은 자기 소유 X 건물에 乙 앞으로 전세권을 설정해 주었다.§★ 乙이 자신의 채권자 丙을 위하여 전세권 위에 저당권을 설정해 준 경우, 전세권의 존속기간 만료 후 乙의 일반채권자 丁이 전세금반환채권을 가압류한 다음, 丙이 물상대위에 의하여 乙의 전세금반환채권에 대하여 압류 및 전부명령을 받았다면 丙은 甲에 대하여 전세금의 지급을 구할 수 없다.", false, "▸ 전세권저당권자(물상대위권자)가 우선권 있는 채권에 기하여 압류 및 전부명령을 받은 경우 형식상 압류 경합되더라도 전부명령은 유효 [2008다65396]", "지역권·전세권"],
  ["114.ㄷ", "甲은 자기 소유 X 건물에 乙 앞으로 전세권을 설정해 주었다.§★ 乙의 전세권은 임대차계약에 따른 임대차보증금반환채권을 담보할 목적으로 설정되었다. 乙이 이러한 사정을 알고 있는 자신의 채권자 丙을 위하여 전세권 위에 저당권을 설정해 준 경우, 甲은 물상대위권을 행사하는 丙에 대하여 임대차계약에 따른 연체차임 공제 주장으로 대항할 수 있다.", true, "▸ 임대차계약 따른 임대차보증금반환채권을 담보할 목적으로 임대인과 임차인 사이 합의로 마친 임차인 명의의 전세권설정'등기'는 유효 O\n이때 임대인과 임차인이 그 임대차보증금반환채권 담보 목적 전세권설정등기 마치기 위해 전세권설정'계약'체결했다면 임대차보증금에서 연체차임 등을 공제하고 남은 돈을 전세금으로 하는 것이 합치된 의사 → 그러나 전세권설정계약은 외관상 '차임' 약정이 없고 연체차임 공제가 없어 임대인·임차인의 진의와 불일치 부분 존재하고 그 범위에서 전세권설정'계약'은 통정허위표시 무효 → 다만 선의 제3자에게는 무효 주장 × → 전세권저당권자가 물상대위권 행사로 전세금반환채권에 압류 및 추심·전부명령 받아 추심금·전부금 구할 경우, 전세권저당권자가 저당권 설정 당시 전세권설정등기가 임대차보증금반환채권 담보 목적인 것을 알았다면, 제3채무자인 전세권설정자는 연체차임 등 공제로 대항 O ∴ 전세권설정계약이 임대차계약과 양립불가 범위에서 무효라 주장 O [2018다268538]", "지역권·전세권"],
  ["114.ㄹ", "甲은 자기 소유 X 건물에 乙 앞으로 전세권을 설정해 주었다.§★ 존속기간이 만료한 후 乙이 전세권과 함께 전세금반환채권을 양도하고 양수인 戊 앞으로 부기등기를 한 경우, 戊와 전세금반환채권의 압류·전부 채권자 사이의 우열은 부기등기시점과 압류시점의 선후에 따라 정해진다.", false, "▸ 존속기간 경과로 용익물권적 권능 소멸, 담보물권적 권능만 남은 전세권은 피담보채권인 전세금반환채권과 함께 양도 O → 그러나 450조 2항 확정일자 갖추지 않으면 전세금반환채권의 압류·전부채권자 등 제3자에게 채권양도로 대항 × → 전세기간 만료 후 전세권양도계약 및 전세권이전 부기등기 이뤄진 것만으로는 전세금반환채권 양도에 확정일자 통지·승낙 × [2003다35659]", "지역권·전세권"],
  ["115.②", "★ 甲은 전세권 존속 중이라도, 장래에 그 전세권이 소멸하여 전세금반환채권이 발생하는 것을 조건으로 그 장래의 조건부 채권을 양도할 수 있다.", true, "▸ 전세권 존속 중에 전세금반환채권만 분리하여 확정적 양도 × → 다만 전세권 소멸하는 경우 전세금반환채권 발생을 조건으로 그 장래의 조건부 채권 양도는 O [2001다69122]", "지역권·전세권"],
  ["115.⑤", "★ 甲의 전세권이 X 건물의 일부에 설정된 경우에, 전세권의 목적인 부분이 구조상 또는 이용상 독립성이 없어 독립한 소유권의 객체로 분할할 수 없고 따라서 그 부분만의 경매신청이 불가능하다면, 甲은 X 건물 전부에 대하여 경매신청을 할 수 있다.", false, "▸ 일부 전세권자는 부동산 전부 경매청구권 × → 분할 불가능하여 일부 경매신청 자체가 불가능한 경우라 하여도 마찬가지로 전부 경매청구권 × [2001마212]", "지역권·전세권"],
  ["116.①", "★ 甲이 통정허위표시에 해당하여 무효인 건물 전세권설정계약에 기한 전세권부 채권을 가압류한 경우, 가압류등기를 마칠 당시 전세권의 존속기간이 만료되었으나 전세권설정등기가 말소되지 않은 상태였고 전세권 갱신에 관한 등기가 불필요한 전세권 명의자가 건물을 여전히 점유·사용하고 있었다면, 甲은 위 허위표시를 기초로 새로이 법률상 이해관계를 가진 제3자에 해당한다.", true, "▸ [2009다35743]\n▸ 임대차보증금반환채권 담보나 금융기관 자금융통 목적으로 실제로는 전세권설정계약 없음에도 전세권설정등기하면 전세권설정계약은 허위표시로서 무효 → ① 전세권저당권자 [2006다58912], 전세권부채권을 가압류한 자 [2009다35743], 전세권근저당부 채권을 가압류한 자 [2012다49292] → 모두 제3자 O", "지역권·전세권"],
  ["116.②", "★ 전세기간 만료 후 전세권을 전세금반환채권과 함께 양도하면서 전세권 이전의 부기등기를 마쳤으나 확정일자 있는 증서에 의한 채권양도절차를 거치지 않은 경우, 채권양수인은 전세금반환채권의 압류·전부 채권자에게 대항할 수 없다.", true, "▸ [2003다35659] → 담보물권(저당권·전세권) 이전의 '부기등기'는 채권양도의 확정일자 ×", "지역권·전세권"],
  ["116.④", "★ 건물에 대하여 전세권을 설정하여 준 건물 소유자가 대지의 지상권자로서 지료 지급을 지체하여 대지 소유자의 지상권소멸청구에 의하여 지상권이 소멸하고 건물 철거 및 대지인도를 명하는 판결이 확정된 경우, 대지 소유자는 건물 전세권자에게 건물에서의 퇴거를 청구할 수 없다.", false, "▸ 지상권 가지는 건물소유자가 2년 이상 지료 연체로 지상권 소멸하는 경우는 304조 2항 소멸하게 하는 행위로 볼 수 × ∴ 소멸하게 하는 행위라 함은 포기, 기간단축 등 전세권설정자의 임의적 행위 의미 [2010다43801]", "지역권·전세권"],
  ["117.②", "★ 甲은 존속기간의 경과로 인해 본래의 용익물권적 권능이 소멸하고 담보물권적 권능만 남은 전세권에 대해서는 그 피담보채권인 전세금반환채권과 함께 제3자에게 이를 양도할 수 있다.", true, "▸ 전세권설정등기 마친 전세권은 성질상 용익물권적 성격과 담보물권적 성격 겸비 → 전세권 존속기간 만료되면 용익물권적 권능은 당연 소멸, 전세금반환채권 담보하는 담보물권적 권능 범위 내 전세금 반환시까지 전세권설정등기 효력 존속 → 담보물권적 권능만 남은 전세권은 피담보채권인 전세금반환채권과 함께 제3자에게 양도 O [2003다35659]", "지역권·전세권"],
  ["117.③", "★ 전세권이 성립한 후 건물의 소유권이 乙로부터 丙에게 이전된 경우, 전세권은 甲과 丙 사이에서 계속 동일한 내용으로 존속하게 된다고 보아야 할 것이고, 丙은 전세권의 내용에 따른 권리의무의 직접적인 당사자가 되어 전세권이 소멸하는 때에 甲에 대하여 전세권설정자의 지위에서 전세금반환의무를 부담하게 된다.", true, "▸ 전세권 성립 후 전세목적물 소유권 이전되면 전세권설정자는 신 소유자로서, 전세권은 전세권자와 신 소유자 사이 계속 동일한 내용으로 존속하고, 신 소유자는 권리의무 직접적 당사자로서 전세권 소멸시에 전세금반환의무 부담 O (구 소유자는 지위 상실, 전세금반환의무 면함) [99다15122] = 대항력 갖춘 임대차", "지역권·전세권"],
  ["118.⑤", "★ 토지와 건물의 소유자가 건물에 전세권을 설정하였으나 그 토지가 경매절차에서 제3자에게 매각되어 건물소유자가 법정지상권을 취득한 후 건물이 다시 타인에게 양도되었다면, 건물의 양수인이 토지 소유자와의 관계에서 법정지상권을 취득할 지위를 포기하더라도 그 포기의 효력은 전세권자에게 미치지 않는다.", true, "▸ 토지 및 건물의 소유자가 건물에 전세권 설정해준 후 토지가 타인에게 경락되면 305조 1항 법정지상권 취득 → 다시 건물을 타인에게 양도하면 건물양수인은 ⓐ 법정지상권 취득할 지위 O, ⓑ 전세권설정자의 지위 승계 O → 전세권자의 동의 없이 건물양수인이 토지소유자와 임대차계약 체결 등으로 법정지상권 취득할 지위 소멸시켰더라도 이로써 건물양수인·토지소유자는 전세권자에 대항 × ∴ 304조 등에 비추어 [2006다14684]", "지역권·전세권"],
  ["SS15.①", "★ 타인의 토지에 있는 건물에 전세권을 설정한 때에는 전세권의 효력은 그 건물 소유를 목적으로 한 토지임차권에도 미친다.", true, "▸ 제304조(건물의 전세권, 지상권, 임차권에 대한 효력) ①타인의 토지에 있는 건물에 전세권을 설정한 때에는 전세권의 효력은 그 건물의 소유를 목적으로 한 지상권 또는 임차권에 미친다.", "지역권·전세권"],
  ["SS15.②", "★ 전세권의 목적물이 양도되어 소유권이전등기가 된 경우, 전세권이 소멸하는 때에 양수인은 전세권자에 대하여 전세금 반환의무를 부담한다.", true, "▸ 전세권 성립 후 전세목적물 소유권 이전되면 전세권설정자는 신 소유자로서, 전세권은 전세권자와 신 소유자 사이 계속 동일한 내용으로 존속하고, 신 소유자는 권리의무 직접적 당사자로서 전세권 소멸시에 전세금반환의무 부담 O [99다15122]", "지역권·전세권"],
  ["SS15.⑤", "■보충 임대인과 임차인이 임대차계약을 체결하면서 임대차보증금을 전세금으로 하는 전세권설정등기를 경료한 경우 특약이 없는 한 임대차보증금 반환의무는 제317조에 따라 전세권설정등기의 말소의무와도 동시이행관계이다.", false, "▸ 임대차계약 체결하면서 임대차보증금을 전세금으로 전세권설정등기 경료 → 다른 약정 없는 한 임대차보증금 반환의무는 제317조에 따라 전세권설정등기의 말소의무와도 동시이행관계 ∴ 임대차보증금은 전세금 성질 겸하므로 [2010다95062]\n→ 해당 판례는 '보증금반환'이 '인도'뿐 아니라 '전세권등기말소'와도 동시이행 관계라는 것을 강조한 것인데, 출제된 지문은 '보증금반환'이 '전세권등기말소'보다 선이행이 아니라는 취지의 지문이므로 유의할 것(단순히 보증금 '담보 목적'의 전세권등기였다면 약간의 논란이 있을 수 있으나, 지문에 '담보 목적'이라는 표현이 없음)", "지역권·전세권"],
  ["119.①", "임대차계약에 따른 임대차보증금채권을 담보할 목적으로 임차인 명의로 전세권설정등기를 마친 경우, 이 전세권설정등기는 특별한 사정이 없는 한 유효한 등기이다.", true, "▸ 임대차계약 따른 임대차보증금반환채권을 담보할 목적으로 임대인과 임차인 사이 합의로 마친 임차인 명의의 전세권설정'등기'는 유효 O ∴ 전세금 지급은 이미 지급한 임대차보증금으로 대신, 장차 목적물 사용·수익 완전 배제 아님 [2018다268538]", "지역권·전세권"],
  ["119.②", "★ 전세권설정계약의 당사자가 전세권의 사용·수익 권능을 배제하고 채권담보만을 위하여 전세권을 설정하였다면 이 전세권설정등기는 무효이다.", true, "▸ 전세권 설정의 동기·경위·목적, 채권 발생원인과 목적물의 관계, 전세권자의 사용·수익 여부와 가능성, 당사자의 진정한 의사 등에 비추어, 전세권설정계약 당사자가 전세권의 핵심인 사용·수익 권능 배제하고 채권담보만 위해 전세권 설정했다면 전세권설정등기 무효 ∴ 법률(303조 1항 참조)이 정하지 않은 새로운 내용의 전세권 창설하여 물권법정주의(185조)와 물권법의 강행법규성 위반 [2018다40235]", "지역권·전세권"],
  ["120.⑤", "★ 건물의 일부에 전세권이 설정되어 있는 경우, 전세권자는 그 건물 전부에 대하여 후순위권리자 기타 채권자에 우선하여 변제를 받을 수 있지만, 그 건물 전부에 대하여 경매를 청구할 수는 없다.", true, "▸ 일부 전세권자는 부동산 전부 경매청구권 × → 분할 불가능하여 일부 경매신청 자체가 불가능한 경우라 하여도 마찬가지로 전부 경매청구권 × [2001마212]", "지역권·전세권"],
  ["121.ㄱ", "★ 전세권자는 목적물의 현상을 유지하고 그 통상의 관리에 속한 수선을 스스로 하여야 한다.", true, "▸ 제309조(전세권자의 유지, 수선의무) 전세권자는 목적물의 현상을 유지하고 그 통상의 관리에 속한 수선을 하여야 한다.", "지역권·전세권"],
  ["122.①", "★ 전세권설정계약의 당사자가 주로 채권담보 목적으로 전세권을 설정하고 설정과 동시에 목적물을 인도하지 않는다고 하더라도, 장차 전세권자가 목적물을 사용·수익하는 것을 배제하지 않는다면, 그 전세권의 효력이 부정되지 않는다.", true, "▸ 공사대금채권 등 주로 채권담보 목적으로 전세권을 설정했고, 설정과 동시에 목적물을 인도하지 않은 경우라 하더라도, 장차 전세권자의 목적물 사용·수익함을 완전히 배제하는 것이 아니라면, 전세권 유효 O ∴ 전세권은 용익물권성·담보물권성을 겸비하고 있는 점, 인도는 전세권의 성립요건이 아닌 점 [94다18508]", "지역권·전세권"],
  ["122.③", "★ 전세권에 대하여 저당권이 설정된 상태에서 전세권이 기간만료로 소멸된 경우, 전세권설정자는 전세금반환채권에 대한 제3자의 압류 등이 없는 한 전세권자에 대하여만 전세금반환의무를 부담한다.", true, "▸ 전세권저당권이 설정된 경우에도 전세권이 기간만료로 소멸되면 전세권설정자는 제3자의 압류 등이 없는 한 전세권자에 대하여만 전세금반환의무를 부담 O ∴ 물상대위는 위와 같이 행사를 해야 인정, 전세권 저당권의 설정은 소유자 의사와 무관 [98다31301]", "지역권·전세권"],
  ["122.④", "★ 임대차계약에 따른 임대차보증금반환채권을 담보할 목적에서 임차인 명의로 전세권설정등기를 마치기 위하여 임대인과 임차인이 전세권설정계약을 체결한 경우, 그 전세권설정계약은 임대차계약과 양립할 수 없는 범위에서 통정허위표시에 해당하여 무효이다.", true, "▸ 임대차계약 체결하면서 임대차보증금을 전세금으로 전세권설정등기 마치기 위해 임대인과 임차인이 전세권설정계약을 체결한 경우, 그 전세권설정계약은 임대차계약과 양립불가 범위에서 통정허위표시에 해당하여 무효 [2018다268538]", "지역권·전세권"],
  ["123.③", "★ 저당권의 목적이 된 전세권의 존속기간이 만료되었다면 전세권의 용익물권적 권능은 소멸하지만 담보물권적 권능은 남아있기에 전세권 자체에 대하여 여전히 저당권을 실행할 수 있다.", false, "▸ 전세권이 기간만료로 종료하면 말소등기 없이 당연히 소멸 → 저당권자는 더이상 소유자에게 저당권 주장 ×, 전세권 자체에 대한 저당권 실행 × → 다만 저당권의 목적물인 전세권에 갈음하여 존속하는 전세금반환채권에 대하여 압류 및 추심명령·전부명령 받거나 제3자가 전세금반환채권에 대하여 실시한 강제집행절차에서 배당요구 하는 등 방법으로 권리 행사하여(370조, 342조, 민집법 273조) 비로소 전세금 지급 구할 수 O [98다31301]", "지역권·전세권"],
  ["123.④", "★ 전세권자는 전세권설정자가 전세금의 반환을 지체한 때에 목적부동산의 경매를 청구할 수 있는데 이러한 경매청구가 가능하려면 전세권설정자에게 전세목적물을 현실적으로 인도하여야 한다.", false, "▸ 전세권자가 전세목적물에 경매를 청구하려면 전세권설정자에 대하여 목적물 인도 및 전세권등기말소의무의 이행·이행제공을 완료하여 전세권설정자를 이행지체에 빠뜨려야 ∴ 인도의무 및 등기말소의무와 전세금반환의무가 서로 동시이행관계 [77마90]", "지역권·전세권"],
  ["124.ㄴ", "★ 乙이 자신의 전세권 위에 丙 앞으로 저당권을 설정해 주었다면, 그 후 丙이 물상대위를 위하여 전세금반환채권에 대하여 압류할 당시 甲의 乙에 대한 반대채권이 전세금반환채권과 상계적상에 있거나 아니면 반대채권이 전세금반환채권보다도 변제기가 먼저 도래하거나 적어도 동시에 도달하는 경우에 한하여, 甲은 상계로써 대항할 수 있다.", false, "▸ 전세권 목적 저당권 설정되고 전세권 존속기간 만료되면 전세권저당권자는 더 이상 전세권 자체에 대한 저당권 실행 ×, 물상대위권 행사로 전세금지급 구할 수 O → 전세권설정자가 전세권자에 대해 상계적성 있는 반채권 있더라도 물상대위권 행사하는 전세권저당권자에게 상계로 대항 × ∴ 종전 저당권의 우선변제권 효력이 전세금반환채권에 존속 → 단, 전세권저당권이 설정된 때 이미 전세권설정자가 반대채권 가지고 있고 반대채권 변제기가 장래 발생할 전세금반환채권 변제기와 동시에 또는 보다 먼저 도래한다면 상계 O ∴ 전세권설정자의 상계에 대한 합리적 기대 이익 O [2013다91672] → 압류할 당시가 아닌 전세권저당권 설정 당시를 기준으로 반대채권의 취득을 판단하고, 나아가 변제기도 먼저 또는 동시에 도달하여야 하며, 여기에는 498조가 적용되지 않음", "지역권·전세권"],
  ["125.③", "★ 전세금의 지급은 전세권 성립의 요소이지만, 전세금이 반드시 현실적으로 수수되지 않더라도 기존의 채권으로 그 지급에 갈음할 수 있다.", true, "▸ ②·③ 지문 관련 : 임대차보증금 담보할 목적으로 임대인·임차인·제3자의 합의로 제3자 명의의 전세권설정등기 유효 O ∴ 전세금은 현실 수수 아닌 기존채권 갈음 O [94다18508]", "지역권·전세권"],
  ["125.④", "★ 전세권의 존속기간은 10년을 넘지 못하며, 당사자가 약정한 기간이 10년을 넘는 때에는 10년으로 단축된다.", true, "▸ 제312조(전세권의 존속기간) ① 전세권의 존속기간은 10년을 넘지 못한다. 당사자의 약정기간이 10년을 넘는 때에는 이를 10년으로 단축한다.", "지역권·전세권"],
  ["126.③", "★ X 토지와 그 지상의 Y 건물의 소유자인 甲이 2013. 2. 1. 乙과 Y 건물에 관하여 전세권설정계약을 체결하고(전세기간 2018. 1. 31.까지) 乙 명의의 전세권설정등기를 마쳤다. 그 후 X 토지에 대한 강제경매절차에서 丙이 X 토지를 매수하고 2014. 2. 1. 매각대금을 완납하였고, 甲이 Y 건물을 丁에게 매도하여 2015. 10. 1. 소유권이전등기를 마쳐주었다.§★ 丙이 2015. 10. 1. X 토지에 관하여 丁과 임대차계약을 체결한 후 2017. 1. 10. 丁의 차임연체를 이유로 위 임대차계약을 해지한 경우, 丙은 乙에게 Y건물에서의 퇴거를 청구할 수 있다.", false, "▸ 토지 및 건물의 소유자가 건물에 전세권 설정해준 후 토지가 타인에게 경락되면 305조 1항 법정지상권 취득 → 다시 건물을 타인에게 양도하면 건물양수인은 ⓐ 법정지상권 취득할 지위 O, ⓑ 전세권설정자의 지위 승계 O → 전세권자의 동의 없이 건물양수인이 토지소유자와 임대차계약 체결 등으로 법정지상권 취득할 지위 소멸시켰더라도 이로써 건물양수인·토지소유자는 전세권자에 대항 × ∴ 304조 등에 비추어 [2006다14684]", "지역권·전세권"],
  // 유치권,
  ["127.ㄱ", "甲은 乙과 乙 소유 X 주택에 대한 공사도급계약을 체결하고 공사대금은 완공과 동시에 일괄지급받기로 했다. 甲이 공사를 완성했는데도 乙은 공사대금을 지급하지 않은 채 X 주택의 인도를 청구하였고, 甲은 적법한 유치권을 행사하면서 X 주택에 거주하고 있다. X 주택의 부지인 Y 토지는 丁의 소유이다.§★ 甲이 X 주택에 관하여 유익비를 지출한 경우, 甲은 X 주택의 가액 증가가 현존한 경우에 한해 乙의 선택에 따라 그 지출한 금액이나 증가액의 상환을 乙에게 청구할 수 있다.", true, "▸ 제325조(유치권자의 상환청구권) ① 유치권자가 유치물에 관하여 필요비를 지출한 때에는 소유자에게 그 상환을 청구할 수 있다. ② 유치권자가 유치물에 관하여 유익비를 지출한 때에는 그 가액의 증가가 현존한 경우에 한하여 소유자의 선택에 좇아 그 지출한 금액이나 증가액의 상환을 청구할 수 있다. 그러나 법원은 소유자의 청구에 의하여 상당한 상환기간을 허여할 수 있다.", "유치권"],
  ["127.ㄴ", "甲은 乙과 乙 소유 X 주택에 대한 공사도급계약을 체결하고 공사대금은 완공과 동시에 일괄지급받기로 했다. 甲이 공사를 완성했는데도 乙은 공사대금을 지급하지 않은 채 X 주택의 인도를 청구하였고, 甲은 적법한 유치권을 행사하면서 X 주택에 거주하고 있다. X 주택의 부지인 Y 토지는 丁의 소유이다.§甲은 丁에 대해 X 주택에 거주한 기간 동안 Y 토지의 사용·수익으로 인해 발생한 차임 상당 부당이득반환의무를 부담하지 않는다.", true, "▸ 건물소유자와 토지소유자 사이 토지임대차계약 종료되었다면 건물소유자는 그 부지 불법점유자로서 부지 차임 상당 부당이득반환의무 O, 건물임차인(건물점유자)은 토지소유자들에게 부당이득반환 × [94다27809] → 이른바 '비점유설'", "유치권"],
  ["127.ㄷ", "甲은 乙과 乙 소유 X 주택에 대한 공사도급계약을 체결하고 공사대금은 완공과 동시에 일괄지급받기로 했다. 甲이 공사를 완성했는데도 乙은 공사대금을 지급하지 않은 채 X 주택의 인도를 청구하였고, 甲은 적법한 유치권을 행사하면서 X 주택에 거주하고 있다. X 주택의 부지인 Y 토지는 丁의 소유이다.§甲의 유치권에 의한 X 주택 경매절차에서 매각이 이루어진 경우, 乙의 채권자 B가 신청한 X 주택 경매절차에서 매각이 이루어진 경우와 마찬가지로 甲의 유치권은 소멸하지 않는다.", false, "▸ 유치권은 원칙적으로 성립시기 관계없이 경매로 소멸하지 않음(민집법 91조 5항)\n그러나 유치권에 의한 경매도 강제경매나 담보권실행 경매와 마찬가지로 부동산 위 부담 소멸을 법정매각조건으로 실시(소멸주의), 일반채권자의 배당요구 허용, 유치권자는 일반채권자와 동일한 순위로 배당 ∴ 민집법 91조 2·3항, 268조 강제경매·임의경매 소멸주의의 원칙, 322조 1항 경매청구권 규정은 유치권 의한 경매도 채권자·채무자 존재 전제로 채권 실현·만족 위한 경매 상정, 인수주의의 취할 경우 절차·범위 규정 없어 경락인 법적 지위 매우 불안정 → 단, 집행법원은 이해관계 살펴 위 법정매각조건과 달리 매각조건 변경결정으로 경락인 인수하도록 할 수도 O [2010마1059]", "유치권"],
  ["127.ㄹ", "甲은 乙과 乙 소유 X 주택에 대한 공사도급계약을 체결하고 공사대금은 완공과 동시에 일괄지급받기로 했다. 甲이 공사를 완성했는데도 乙은 공사대금을 지급하지 않은 채 X 주택의 인도를 청구하였고, 甲은 적법한 유치권을 행사하면서 X 주택에 거주하고 있다. X 주택의 부지인 Y 토지는 丁의 소유이다.§乙의 채권자 B가 신청한 경매절차에서 丙이 X 주택을 매수한 경우, 甲의 채권자 A가 '甲이 X 주택을 丙으로부터 지급받을 권리'에 대하여 압류 및 추심명령을 신청하는 것은 허용된다.", false, "▸ 민사집행법 제91조 제5항에서 경락인이 유치권자에게 피담보채권을 '변제할 책임'이 있다는 것은 부동산 상 부담 승계 취지 → 인적 채무 인수 × → 유치권자는 피담보채권의 변제 있기까지 경락인에 대해 인도 거절할 뿐 피담보채권 변제청구 × [95다8713]\n→ 그렇다면 지문에서 유치권자 甲에 대하여 경락인 丙이 '공사대금채무'를 부담하는 것은 아니므로, '甲이 丙으로부터 지급받을 권리'는 일종의 권능일 뿐 독립적으로 처분하거나 환가할 수 있는 채권이 아니고, 그렇다면 갑의 채권자가 이를 압류 할 수는 없음(위 판결의 이유 참조)", "유치권"],
  ["128.ㄱ", "★ 유치권자가 채권 전부의 변제를 받을 때까지 유치물 전부에 대하여 그 권리를 행사할 수 있다는 유치권의 불가분성은 그 목적물이 분할 가능하거나 수 개의 물건인 경우에도 적용된다.", true, "▸ 유치권의 불가분성(321조)은 목적물 분할 가능하거나 수 개 물건에도 적용 O, 상사유치권에도 적용 O, 1개 채권을 피담보채권으로 여러 필지 토지에 유치권 취득하고 일부 필지 토지 선관주의의무 위반하면 그 토지만 324조 유치권 소멸·근저당권 O ∴ 유치권 불가분성은 담보력 강화 취지, 선관주의 위반에 비례하여 소멸(이익균형) [2018다301350]", "유치권"],
  ["128.ㄴ", "★ 하나의 채권을 피담보채권으로 하여 여러 필지의 토지에 유치권을 취득한 유치권자가 그중 일부 필지의 토지에 대하여 선량한 관리자의 주의의무를 위반한 경우, 특별한 사정이 없는 한 위반행위가 있었던 필지의 토지에 대하여만 유치권 소멸청구가 가능하다.", true, "▸ 위 128.ㄱ 해설 참조 [2018다301350]", "유치권"],
  ["128.ㄷ", "★ 물건의 점유를 침탈당한 자가 본권인 유치권 소멸에 따른 손해배상청구권을 행사하는 경우 점유를 침탈당한 날부터 1년 내에 이를 행사하여야 한다.", false, "▸ 204조 3항의 제척기간 1년은 출소기간 → 본권 침해로 인한 손해배상청구권 행사에는 적용 × → 점유 침탈로 유치권 소멸당한 자의 손해배상청구권은 침탈당한 날부터 1년 내에 행사할 필요 × [2021다213866]", "유치권"],
  ["128.ㄹ", "★ 근저당권이 설정된 채무자 소유의 부동산의 경매절차에서 유치권이 주장되지 아니하였고, 부동산이 매각되어 매수인에게 소유권이 이전됨으로써 근저당권이 소멸하였는데, 이후 자신이 압류 전부터 유치권이 있다고 주장하는 사람이 있는 경우, 채권자인 근저당권자는 유치권 부존재 확인을 구할 법률상 이익이 있다.", true, "▸ [민소] 소유자도 위 근저당권자와 같은 근거로 유치권부존재확인 O → 경매절차에서 유치권 주장되었으나 소유부동산·담보목적물 매각되어 소유권·근저당권이 상실·소멸된 경우 소유자·근저당권자는 유치권부존재 확인의 이익 × 경매절차에서 유치권 주장되지 않은 경우 → 채권자인 근저당권자는 매각으로 근저당권 소멸되더라도 유치권부존재 확인의 이익 O ∴ 유치권 존재를 알지 못한 매수인으로부터 민법 575조, 578조 1, 2항에 의한 담보책임 추급당할 우려 있어 법률상 지위 불안정 → 그러나 채무자 아닌 소유자는 담보책임 부담하지 않으므로 유치권부존재 확인의 이익 × [2019다247385]", "유치권"],
  ["128.ㅁ", "★ 유치권 배제 특약이 있는 경우 다른 법정요건이 모두 충족되더라도 유치권은 발생하지 않으나, 유치물을 경매절차에서 매수한 자는 위 특약의 당사자가 아니므로 위 약정의 효력을 주장할 수 없다.", false, "▸ 유치권 포기 특약 유효 ∴ 법정담보물권이지만 채권자 이익보호 위한 담보수단 불과 → 사전포기 하면 다른 법정요건 충족해도 불발생 O → 유치권 포기·소멸 사실은 제3자도 주장 O [2014다52087]", "유치권"],
  ["129.①", "★ 丙이 2022. 6. 1.부터 X 주택을 점유하고 있다가 2022. 7. 1.위 공사대금채권을 피담보채권으로 하는 유치권을 취득하였다면 丙은 丁에게 유치권을 주장할 수 있다.", true, "▸ 22. 4. 1. 근저당권 설정 → 22. 6. 1. 점유이전 → 22. 7. 1. 채권취득(완공) → 22. 11. 1. 근저당권 실행(경매개시결정)\n▸ 압류 효력 발생 전에 유치권 취득했다면, 설령 저당권설정 후 유치권 취득했고 저당권실행 경매라 하여도 경락인에게 민사유치권으로 대항 O [2008다70763]", "유치권"],
  ["129.②", "★ 丙이 공사를 마쳤음에도 甲으로부터 공사대금을 지급받지 못한 상태에서 X 주택이 근저당권의 실행에 의해서 압류된 후에 甲이 丙에게 X 주택의 점유를 이전해 주어 丙이 유치권을 취득하였다면 丙은 丁에게 유치권을 주장할 수 없다.", true, "▸ 강제경매개시결정 기입등기가 마쳐져 압류 효력 발생한 이후에 채무자가 위 부동산에 관한 공사대금채권자에게 '점유 이전'함으로써 유치권을 취득하게 한 경우, 공사대금채권자는 유치권을 내세워 경매절차 매수인에게 대항 × ∴ 이러한 '점유이전'은 목적물의 교환가치 감소시킬 우려 있는 처분행위로써 민집법 92조 1항, 83조 4항 압류의 처분금지효에 저촉 [2005다22688]", "유치권"],
  ["129.④", "★ 丙이 丁에게 유치권 항변을 할 수 있는 경우에 丙이 스스로 X 주택에 거주하면서 이를 사용하더라도 특별한 사정이 없는 한 丁은 丙에게 유치권의 소멸을 청구할 수 없다.", true, "▸ 유치권자가 스스로 유치물인 주택에 거주하며 사용하는 것은 유치물의 보존에 도움이 되므로 유치물의 보존에 필요한 사용 O → 다만 차임 상당 부당이득반환의무 O [2009다40684]", "유치권"],
  ["130.①", "★ 유치권의 행사는 피담보채권의 소멸시효의 진행에 영향을 미치지 않는다.", true, "▸ 제326조(피담보채권의 소멸시효) 유치권의 행사는 채권의 소멸시효의 진행에 영향을 미치지 아니한다.", "유치권"],
  ["130.④", "★ 채무자 甲 소유의 건물에 강제경매개시결정의 기입등기가 마쳐져 압류의 효력이 발생한 후에 甲이 건물에 관한 공사대금 채권자 乙에게 건물의 점유를 이전한 경우, 乙은 유치권으로 경매절차의 매수인에게 대항할 수 없다.", true, "▸ 강제경매개시결정 기입등기가 마쳐져 압류 효력 발생한 이후에 채무자가 위 부동산에 관한 공사대금채권자에게 '점유 이전'함으로써 유치권을 취득하게 한 경우, 공사대금채권자는 유치권을 내세워 경매절차 매수인에게 대항 × [2005다22688]", "유치권"],
  ["130.⑤", "★ 채무자 甲 소유의 건물에 관하여 증축공사를 도급받은 수급인 乙이 경매개시결정의 기입등기가 마쳐지기 전에 甲으로부터 건물의 점유를 이전받았고 위 기입등기가 마쳐져 압류의 효력이 발생한 후에 공사를 완공하여 공사대금채권을 취득한 경우, 乙은 유치권으로 경매절차의 매수인에게 대항할 수 없다.", true, "▸ 채무자 소유 부동산에 경매개시결정 기입등기가 마쳐져 압류 효력이 발생한 후에 유치권을 취득한 경우는 그로써 경매절차 매수인에게 대항 × → 수급인이 채무자로부터 미리 점유 이전받더라도 경매개시결정 기입등기로 압류 효력이 발생한 후에 공사 '완공'하여 공사대금 '채권 취득'함으로써 유치권 성립했으므로 이로써 경매절차 매수인에게 유치권을 내세워 대항 × [2011다55214]", "유치권"],
  ["131.④", "★ 乙이 甲의 승낙을 받아 Y건물을 D에게 임대한 후 위 임대차가 D의 차임 연체를 이유로 적법하게 해지되었으나 D가 Y건물을 반환하지 않은 채 계속 점유하고 있는 경우, 乙의 유치권은 소멸한다.", false, "▸ 점유매개관계 이루는 임대차계약 종료 이후에도 직접점유자가 목적물을 점유한 채 반환하지 않고 있다면 간접점유자의 점유매개관계 존속 ∴ 간접점유자의 반환청구권 소멸하지 않았음 → 간접점유자 임대인의 유치권 O [2019다205329]", "유치권"],
  ["132.ㄱ", "★ 건물신축 도급계약에서 수급인이 완성한 신축 건물에 하자가 있고 하자 및 손해에 상응하는 금액이 공사잔대금액 이상이어서 도급인이 하자보수에 갈음한 손해배상청구권에 기하여 수급인의 공사잔대금채권 전부에 대하여 동시이행의 항변을 한 경우, 수급인은 위 손해배상채무에 관한 이행의 제공을 하지 아니한 이상 공사잔대금채권에 기한 유치권을 행사할 수 없다.", true, "▸ 수급인이 완공한 신축건물에 하자가 있고 하자 및 손해에 상응하는 금액이 공사잔대금액 이상이어서 도급인이 수급인에 대한 하자보수청구권 혹은 하자보수 갈음한 손해배상청구권으로 수급인의 공사잔대금채권 전부에 대해 동시이행 항변을 한 경우 → 수급인은 공사잔대금채권으로 유치권 × ∴ 공사잔대금채권의 '변제기'가 도래하지 않은 경우와 마찬가지이기 때문 [2013다30653] → 동이형 존재를 변제기 미도래로 취급한 것은 이례적", "유치권"],
  ["132.ㄴ", "★ 자재업자가 공사수급인과의 계약으로 시멘트를 공급하였고 이것이 공사수급인에 의해 건물신축공사에 사용됨으로써 부합된 경우, 시멘트대금채권은 신축된 건물 자체에 관하여 생긴 채권이라고 할 수 있다.", false, "▸ 甲이 건물 신축공사 수급인 乙과 체결한 건축자재공급계약에 따라 시멘트·모래 공급 → 시멘트·모레가 아파트에 부합 → 甲은 아파트에 유치권 × ∴ 건축자재대금채권은 매매계약에 따른 매매대금채권에 불과, 건물 자체에 관하여 생긴 채권 × [2011다96208]", "유치권"],
  ["132.ㄷ", "★ 유치권의 피담보채권의 소멸시효기간이 확정판결 등에 의하여 10년으로 연장된 경우에도 유치권의 목적물을 매수하여 소유권을 취득한 자는 그 피담보채권의 소멸시효기간이 연장된 효과를 부정하고 종전의 단기소멸시효기간을 원용할 수 있다.", false, "▸ 유치권 있는 부동산의 매수인은 직접수익자로서 소멸시효 완성을 원용할 수 있는 지위 O → 유치권의 피담보채권의 소멸시효기간이 확정판결에 의해 10년으로 연장된 경우 매수인은 소멸시효기간 연장 효과를 부정할 수 × ∴ 매수인은 별개 독립된 채무 ×, 단지 채무자의 채무를 변제할 책임 부담 [2009다39530]", "유치권"],
  ["133.②", "★ 다세대주택 전체의 창호 공사를 완성한 수급인이 위 공사 전부에 대하여 일률적으로 지급하기로 한 공사대금 잔액을 변제받기 위하여 위 다세대주택 중 한 세대를 점유하여 유치권을 행사하는 경우, 그 유치권은 위 한 세대에 대하여 시행한 공사대금만이 아니라 위 다세대주택 전체에 대하여 시행한 공사대금 잔액 전부에 대한 채권을 피담보채권으로 하여 성립한다.", true, "▸ [2005다16942] → 담보물권의 불가분성\n제321조(유치권의 불가분성) 유치권자는 채권전부의 변제를 받을 때까지 유치물 전부에 대하여 그 권리를 행사할 수 있다.", "유치권"],
