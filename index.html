  ["SS민소5.ㄱ", "사립고등학교 학생이 학교생활기록부에 기재된 징계내역에 관하여 학교법인을 상대로 위 징계의 무효확인을 구하는 소를 제기하였다가 학교를 졸업한 경우 그 징계에 대한 무효확인을 구할 법률상 이익이 없다.", false, "▸ 과거 법률관계도 현재의 권리나 법률상 지위에 영향 미치고 그에 대한 위협·불안 제거하기 위해 법률관계 확인판결을 받는 것이 유효·적절 수단이면 확인의 이익 O → 고등학교 재학 중 정학 2일 징계에 불복하여 징계 무효 확인 구하는 소 제기하여 소송 중 학교 졸업 → 징계 자체는 과거의 법률관계지만 징계 무효 확인 구하는 소 확인의 이익 O ∵ 학교생활기록부 기재사항 밀접 관련된 현재의 권리나 법률상 지위에 대한 위협·불안 제거해 그 법률관계 확인판결 받는 것이 유효·적절한 수단 O, 생기부 기재 징계 내역은 준영구적 보존, 교육받을 권리, 공무담임권, 직업 선택 등 여러 방면에 상당한 영향 [2022다207547]", "공통소의이익"],
  ["SS민소5.ㄴ", "근저당권의 주등기 자체는 유효한 것을 전제로 이와는 별도로 근저당권이전의 부기등기에 하여 무효사유가 있다는 이유로 부기등기만의 효력을 다투는 경우에는 그 부기등기의 말소를 소구할 필요가 있으므로 예외적으로 소의 이익이 있다.", true, "▸ 근저당권의 이전원인만이 무효, 취소·해제된 경우, 즉 주등기 자체는 유효함을 전제로 이와 별도로 부기등기에 하여 무효사유 있다면, 기등기의 말소청구도 소의 이익 O [2002다15412]", "공통소의이익"],
  ["6_009.ㄴ", "甲 소유의 X 토지에 설정된 乙 명의의 가등기의 등기원인이 실효된 상태에서 丙이 매매에 따른 소유권이전등기를 마쳤는데, 그 후에 乙이 甲과 무효등기의 유용을 합의하여 가등기에 기한 본등기를 마치면서 丙의 등기가 직권으로 말소되었다면, 丙은 말소회복등기가 되기 전이라도 乙을 상대로 乙 명의의 소유권이전등기의 말소를 구할 수 있다.", true, "▸ 가등기에 기한 소유권이전의 본등기가 경료됨으로써 등기공무원이 직권으로 가등기 후에 경료된 제3자의 등기를 말소한 경우 그 후에 그 가등기에 기한 본등기가 원인무효 등의 사유로 말소된 때에는 결국 그 제3자의 등기는 말소하지 아니할 것을 말소한 결과가 되므로 등기공무원은 직권으로 그 말소등기의 회복등기를 하여야 하는 것이고, 따라서 그 회복등기를 소구할 이익이 없다. [95다6878]\n직권 말소된 등기의 회복등기청구 X ∵ 직권 말소되었다면 그 회복도 직권으로\n㉠ 직권 말소된 중간처분등기가 소유권이전등기 등이면 물권적 청구권의 행사로서 직접 가등기 및 본등기의 말소청구 O (회복등기청구는 불가능하므로)\n㉡ 직권 말소된 중간처분등기가 가압류등기 등이라면 채권자대위 등의 방법으로 가등기 등의 말소를 구하는 방법 강구 (그러나 채권자대위의 요건은 갖춰야)", "공통소의이익"],
  ["6_009.ㄷ", "★ 甲 소유의 X 토지에 설정된 乙 명의의 가등기의 등기원인이 실효된 상태에서 甲의 채권자인 丙의 신청으로 X 토지에 관하여 강제경매개시결정에 따른 기입등기가 마쳐졌는데, 그 후에 乙이 甲과 무효등기의 유용을 합의하여 가등기에 기한 본등기를 마치면서 그 기입등기가 직권으로 말소되었다. 이때 丙은 강제경매개시결정 기입등기의 말소회복등기에 관하여 乙을 상대로 등기상 이해관계 있는 제3자로서 승낙의 의사표시를 구할 수 있다.", true, "▸ 강제경매개시결정 기입등기 회복등기청구 소의 이익 X ∵ 강제경매개시결정 기입등기는 등기공무원에게 신청 X, 법원 촉탁에 의해 기입, 법원 촉탁에 의해 말소된 경우 회복등기도 법원 촉탁으로 → 경매신청채권자는 기입등기 말소 당시 부동산에 소유권이전등기 마쳤던 자를 상대로 '법원 촉탁에 의한 기입등기 회복절차'에 대한 승낙청구 O ∵ 기입등기 회복 촉탁에 등기상 이해관계 있는 제3자 O [2015다253573]", "공통소의이익"],
  ["6_010.①", "★ 확정판결에 의한 채권의 소멸시효기간인 10년의 경과가 임박한 경우에는 그 시효중단을 위한 소는 소의 이익이 있다.", true, "▸ 확정된 승소판결 받은 자가 동일한 청구 소 제기하면 권리보호이익 없으나, 예외적으로 소멸시효기간 10년 경과 임박하면 시효중단 위한 재소는 소의 이익 O ∵ 다른 중단사유 압류·가압류·승인도 1회 제한 없음, 파산·회생 면책제도와의 균형 → 이 경우 후소법원은 그 확정된 권리의 요건 구비 다시 심리할 수 X ∵ 전소 승소 확정판결 내용에 저촉 금지 [2018다22008]", "공통소의이익"],
  ["6_011.⑤", "甲은 乙을 상대로 X 토지에 관한 매매계약 해제에 따른 매매대금반환청구의 소(이하 '전소')를 제기하여 청구인용판결을 선고받고 그 판결이 확정된 후 다시 乙을 상대로 전소와 동일한 청구의 소(이하 '후소')를 제기하였다.§★ 후소 제1심법원이 소의 이익이 없다는 이유로 소각하 판결을 선고하고 이에 대해 甲이 항소를 한 경우, 항소심 법원의 심리 결과 소의 이익은 인정되나 甲의 채권은 소멸시효가 완성되었다고 인정되는 경우, 항소심 법원은 항소기각판결을 선고하여야 한다.", true, "▸ 소각하판결에 원고만 항소 → 소는 적법, 청구는 이유없는 경우\n1) 청구기각설 [다수설, 지방판결] : 불변금은 '본안판결'로 부여한 지위에 관한 것\n2) 환송설 : 심급이익 고려하여 제1심판결 취소하고 환송해야\n3) 절충설 : 본안심리 정도나 동의 여부 고려하여 청구기각 또는 환송\n4) 항소기각설 [판례] : 청구기각이 소각하보다 불리하므로 불변금 적용, 부적법 각하한 원심판결을 파기하더라도 확정판결 기판력 저촉되어 어차피 청구기각 될 운명이었다면 상고기각해야 ∵ 불이익변경금지 원칙 [95다9945]", "공통소의이익"],
  ["6_012.②", "★ 손해배상채무의 부존재확인을 구하는 본소에 대하여 그 채무의 이행을 구하는 반소가 제기된 경우에는 본소청구에 대한 확인의 이익이 소멸한다.", false, "▸ 원고 채무부존재확인 ⇨ 피고 이행청구 '반소' : 후에 제기한 반소로 인하여 본소가 확인의 이익이 소멸 X, 본소 적법 O ∵ 소송요건 갖추어 적법하게 제기된 본소가 상대방이 제기한 반소로 인하여 부적법하게 될 수는 X [99다17401]", "공통소의이익"],
  ["6_013.②", "★ 채권이 압류되면 제3채무자는 채무자에게 지급이 금지되므로, 채무자가 제3채무자를 상대로 채무이행을 구하는 소는 소의 이익이 인정되지 않는다.", false, "▸ 채권에 대한 가압류·가처분·압류가 있더라도 채무자의 제3채무자에 대한 이행청구 인용 O, 법원은 가압류 이유로 배척할 수 X ∵ 집행권원 취득 필요, 집행단계 저지 가능, 가압류취소 후 소 제기 불편, 시효중단 필요 [2001다59033] → 소의 이익도 인정되고, 금전채권의 경우 이유 있으면 청구 전부인용", "공통소의이익"],
  ["6_013.③", "★ 가등기가 채권담보의 목적으로 경료된 것임을 채권자가 다투는 경우, 채무자가 채무변제를 선이행 조건으로 하여 가등기 말소를 구하는 소는 소의 이익이 인정된다.", true, "▸ 채권자가 ① 피담보채무의 액수를 다투거나, ② (가등기담보·양도담보에서) 등기가 담보목적이 아니라고 다투는 경우 → (말소)의무자인 채권자의 태도에 비추어 장래 채무자가 채무를 변제하더라도 등기말소에 선뜻 협력할 것을 기대할 수 없으므로 미리 청구할 필요 O → 피담보채무의 변제를 선이행 조건으로 등기말소청구 O [92다15376]", "공통소의이익"],
  ["6_014.ㄱ", "★ 채무자가 피담보채무 전액을 변제하였음을 이유로 저당권설정등기의 말소등기절차이행을 청구하였지만 피담보채무의 범위에 관한 견해 차이로 피담보채무가 남아있는 경우, 채무자의 청구 중에는 확정된 잔존채무의 변제를 조건으로 그 등기의 말소를 구한다는 취지까지 포함되어 있는 것으로 해석할 여지가 있으나 저당권설정등기의 말소를 미리 청구할 필요가 있다고까지 볼 수는 없다.", false, "▸ 채권자가 ① 피담보채무의 액수를 다투거나, ② (가등기담보·양도담보에서) 등기가 담보목적이 아니라고 다투는 경우 → (말소)의무자인 채권자의 태도에 비추어 장래 채무자가 채무를 변제하더라도 등기말소에 선뜻 협력할 것을 기대할 수 없으므로 미리 청구할 필요 O → 피담보채무의 변제를 선이행 조건으로 등기말소청구 O [92다15376]", "공통소의이익"],
  ["기타민소P6_01", "★ 승소확정판결을 선고받은 상태에서 강제집행이 가능함에도 강제집행에 이르지 않은 채 10년의 소멸시효기간이 임박하여 시효중단을 목적으로 동일 당사자가 동일한 소를 제기하는 경우, 소의 이익이 있다.", true, "▸ 확정된 승소판결 받은 자가 동일한 청구 소 제기하면 권리보호이익 없으나, 예외적으로 소멸시효기간 10년 경과 임박하면 시효중단 위한 재소는 소의 이익 O ∵ 다른 중단사유 압류·가압류·승인도 1회 제한 없음, 파산·회생 면책제도와의 균형 → 이 경우 후소법원은 그 확정된 권리의 요건 구비 다시 심리할 수 X ∵ 전소 승소 확정판결 내용에 저촉 금지 [2018다22008]", "공통소의이익"],
  // 확인의소,

  ["6_015.③", "★ 부동산 경매절차에서 유치권이 주장되지 아니한 경우에는, 담보목적물이 매각되어 그 소유권이 이전됨으로써 근저당권이 소멸하였더라도 채권자인 근저당권자는 유치권을 주장하는 자를 상대로 유치권 부존재확인을 구할 법률상 이익이 있다.", true, "▸ 소유자·근저당권자는 소유물·담보물에 대한 유치권부존재확인 O → 경매절차에서 유치권 주장되었으나 소유부동산·담보목적물 매각되어 소유권·근저당권이 상실·소멸된 경우 소유자·근저당권자는 유치권부존재 확인의 이익 X → 그러나 경매절차에서 유치권 주장되지 않은 경우는 채권자인 근저당권자는 매각으로 근저당권 소멸되었더라도 유치권부존재 확인의 이익 O ∵ 유치권 존재를 보나, 이는 못한 매각절차 공정성·신뢰를 현저히 훼손하거나 민사집행제도 운영에 심각한 지장 줄 우려 때문에 처분행위로 봄이 타당하다는 취지 [2019다247385]", "확인의소"],
  ["6_015.⑤", "★ 부동산에 가압류등기가 경료되어 있을 뿐 현실적인 매각절차가 이루어지지 않고 있는 상황에서는 위 부동산에 대한 채무자의 점유가 제3자에게 이전됨으로 인하여 제3자가 위 부동산에 대하여 유치권을 취득하게 된다고 하더라도 이를 '가압류 채권자에게 대항할 수 없는 처분행위'로 볼 수는 없다.", true, "▸ [민법] 부동산에서 처분금지효에서 말하는 '처분행위'란 당해 부동산 양도, 용익물권·담보물권 설정행위 O, 점유이전 같은 사실행위는 X → 부동산에 '가압류'등기만 경료되고 현실 매각절차 이뤄지지 않은 상황에서는 채무자의 점유이전으로 제3자가 유치권 취득하게 되어도 '처분행위'라 할 수 X → 경매절차 매수인에게 유치권으로 대항 O → 당원 판례는 경매개시결정 기입등기로 '압류' 효력 생긴 이후에 점유이전으로 유치권 취득하게 하는 것을 처분행위로 보아 신뢰를 현저히 훼손하거나 민사집행제도 운영에 심각한 지장 줄 우려 때문에 처분행위로 봄이 타당하다는 취지 [2009다19246]", "확인의소"],
  ["6_017.①", "주식회사의 주주는 회사의 재산관계에 대하여 구체적 또는 법률상의 이해관계가 없으므로 제3자를 상대로 주식회사와 제3자 사이에 체결된 영업양도계약의 무효 확인을 구할 수 없다.", false, "▸ 주주는 회사 경영에 이해관계 O, 회사 영업에 간접적 영향 미칠 수 있을 뿐 → 주주는 회사 재산관계에 법률상 이해관계 X, 주주가 직접 제3자와의 거래관계 개입하여 회사가 체결한 계약(영업양도 계약 포함)의 무효확인 구할 이익 X\n회사가 제3자와 체결한 계약이 주주 자신의 권리나 법적 지위 구체적 침해하거나 직접적 영향 미친다면 계약 무효확인 O, 그러나 그 계약으로 회사 변제자력 감소되어 그 결과 채권의 전부·일부 만족될 수 없을 뿐인 때에는 무효확인 X [2018다228462]", "확인의소"],
  ["6_017.②", "주식회사의 채권자는 회사가 제3자와 체결한 계약이 자신의 권리나 법적 지위를 구체적으로 침해하거나 이에 직접적으로 영향을 미치는 경우에는 그 계약의 무효 확인을 구할 수 있으나, 그 계약으로 인하여 회사의 변제 자력이 감소되어 그 결과 채권의 전부나 일부가 만족될 수 없게 될 뿐인 때에는 직접 그 계약의 무효 확인을 구할 이익이 없다.", true, "▸ 위 해설 참조", "확인의소"],
  ["6_017.③", "처분금지가처분등기는 법원의 가처분결정에 의하여 그 가처분집행의 방법으로 이루어지는데, 잘못된 사실관계에 기하여 행하여진 처분금지가처분등기에 의하여 법률상 이익에 현존하는 불안이나 위험이 있는 토지소유자는 이를 들어 처분금지가처분등기의 말소등기절차의 이행을 구하는 소를 제기할 이익이 있다.", false, "▸ 가압류등기 말소청구 X, 가처분등기 말소청구 X → 존재할 수 없는 소송 ∵ 결정 및 촉탁에 따라 직권으로 마친 등기로서 그 말소 역시 직권으로 해야 함\n▸ 법원의 가처분결정에 기하여 가처분집행의 방법으로 이뤄진 처분금지가처분등기는 집행법원의 가처분결정의 취소나 집행취소의 방법으로 말소해야 → 처분금지가처분등기의 말소를 소구할 수 X [80다1872]", "확인의소"],
  ["6_017.⑤", "주주총회에서 乙이 감사로 선임되었는데 甲회사가 감사 임용계약의 체결을 거부하자 乙이 甲회사를 상대로 제기한 감사 지위 확인의 소에서 원고승소 취지의 파기환송판결 당시에는 乙의 임기가 남아 있었는데 환송 후 원심 계속 중 임기가 만료되어 후임 감사가 선임된 경우, 乙의 감사 지위 확인청구는 과거의 법률관계에 대한 확인을 구하는 것이 되었더라도, 법원은 乙에게 과거에 일정 기간 동안 감사 지위에 있었음에 대한 확인을 구할 이익이 있는지를 석명하고 이에 관한 의견진술 또는 청구취지변경의 기회를 주어야 한다.", true, "▸ … 과거의 법률관계라 할지라도 현재의 권리 또는 법률상 지위에 영향 미치고 이에 대한 위협·불안을 제거하기 위해 그 법률관계에 확인판결 받는 것이 유효적절한 수단이라 인정될 때에는 확인을 구할 이익이 있으므로 … [2018다249148]", "확인의소"],
  ["6_018.ㄴ", "X 토지에 관하여 甲 명의의 소유권보존등기와 乙 명의의 소유권이전등기가 순차로 마쳐졌고, 丙은 X 토지의 사정명의인 A의 유일한 상속인이다. 丙이 甲과 乙을 상대로 소유권보존등기 및 소유권이전등기의 말소등기청구를 하였다.§■보충 丙이 甲과 乙을 상대로 승소확정판결을 받더라도 甲과 乙 명의의 등기를 말소한 후 丙 앞으로 소유권보존등기를 신청하기 위해서는 국가를 상대로 하여 X 토지에 관한 소유권확인의 판결을 받아야 한다.", false, "▸ 이미 제3자 명의의 소유권보존등기 있다면 위 등기명의자를 상대로 하여 보존등기말소 내지 소유권확인판결을 받기만 하면 그 판결에 기하여 소유권보존등기를 마칠 수 있으므로 소유권보존등기를 위한 목적으로 별도로 국가 상대로 소유권확인 구할 이익 X [92다24899]", "확인의소"],
  ["6_019.ㄱ", "★ 영수증의 진정여부를 확인하는 소는 사실관계의 확인을 구하는 것이나 소의 이익이 있다.", false, "▸ 영수증, 세금계산서, 대차대조표, 회계결산보고서, 조합원입금일람표, 당사자본인신문조서 → 보고문서에 불과, 증서 진부 확인 소송 X → 각하 [2005다29290 등]", "확인의소"],
  ["6_019.ㄷ", "소유권보존등기가 되었던 종전 건물의 소유자가 이를 헐어 내고 건물을 신축한 경우, 그 소유자가 새 건물의 소유권보존등기를 하기 위하여 필요하다면 종전 건물에 대한 소유권보존등기의 말소를 청구할 소의 이익이 있다.", true, "▸ 동일인이 구 건물 멸실등기 및 다시 신축하는 건물의 소유권보존등기 해야 할 경우는 구 건물에 있는 원인무효등기 말소 청구할 실익 O [91다39184]", "확인의소"],
  ["6_019.ㄹ", "미등기 토지의 소유자가 그 토지에 관하여 소유권보존등기를 하고자 할 경우, 해당 토지의 토지대장이 작성되어 있지 않다면 국가를 상대로 토지소유권존재확인의 소를 제기할 확인의 이익이 있다.", true, "▸ 국가를 상대로 한 토지 소유권확인청구는 ① 미등기 토지로서 대장상에 등록명의자 없거나 등록명의자가 누구인지 알 수 없을 경우, ② 국가가 등기·등록된 제3자의 소유를 부인하면서 계속 국가 소유 주장하는 등 특별한 사정 있는 경우 한하여 확인의 이익 O [95다14817]", "확인의소"],
  ["6_020.①", "제3자를 위한 계약에서 낙약자가 요약자의 이행청구에 응하지 아니하면 특별한 사정이 없는 한 요약자는 낙약자에 대하여 제3자에게 급부를 이행할 것을 소로써 구할 이익이 있다.", true, "▸ 제3자를 위한 계약에서 요약자는 낙약자에 대해 제3자에게 급부 이행할 것을 요구할 수 있는 권리 있으므로, 낙약자가 요약자의 청구에 응하지 않을 경우 요약자는 낙약자를 상대로 제3자에게 급부 이행할 것을 소로 구할 이익 O [2018다259565]", "확인의소"],
  ["6_020.③", "보험계약의 당사자 사이에 계약상 채무의 존부나 범위에 관하여 다툼이 있는 경우 그로 인한 법적 불안을 제거하기 위하여 보험회사는 먼저 보험수익자를 상대로 소극적 확인의 소를 제기할 확인의 이익이 있다.", true, "▸ 보험계약 당사자 사이에 계약상 채무 존부·범위에 다툼 있는 경우 그로 인한 법적 불안 제거하기 위해 보험회사는 먼저 보험수익자를 상대로 소극적 확인의 소 제기할 확인의 이익 O [2018다257958]", "확인의소"],
  ["6_020.④", "■보충 상대적 불확지 변제공탁의 피공탁자 중 1인을 채무자로 하여 그의 공탁물출급청구권에 대하여 채권압류 및 추심명령을 받은 추심채권자가 자기의 이름으로 다른 피공탁자를 상대로 공탁물출급청구권이 추심채권자의 채무자에게 있음의 확인을 구하는 것은 확인의 이익이 없다.", false, "▸ 민법 487조 후단 따른 상대적 불확지 변제공탁의 피공탁자 중 1인을 채무자로 하여 그의 공탁물출급청구권에 채권압류 및 추심명령 받은 추심채권자는 자기 이름으로 다른 피공탁자를 상대로 공탁물출급청구권이 추심채권자의 채무자에게 있음을 확인 구할 확인의 이익 O [2011다55405]", "확인의소"],
  ["6_020.⑤", "동일한 피압류채권에 대하여 각 압류 및 전부명령을 받은 두 채권자 甲, 乙 중 甲이 乙을 상대로 제3채무자의 乙에 대한 전부금채무 부존재확인을 구하는 소는 확인의 이익이 없다.", true, "▸ 서로 채권자라 주장할 때 적극적으로 자기 채권 확인 구해야, 소극적으로 상대방 채권 부존재 확인 X → 전부명령 받은 양 당사자 중 한쪽이 상대방에 대해 제3채무자의 그에 대한 전부금채무 부존재확인 구하는 소는 확인의 이익 X [2003다49092]", "확인의소"],
  ["6_021.④", "★ 부동산 근저당권자에 대한 채권자취소소송의 계속 중 사해행위인 근저당설정계약에 기해 설정된 근저당설정등기가 경매절차상 매각으로 인하여 말소된 경우 채권자는 원상회복을 위하여 사해행위인 근저당권설정계약의 취소를 구할 소의 이익이 없다.", false, "▸ 사해행위취소소송 계속 중 사해행위인 근저당권설정계약에 기한 경매 진행되어 근저당권등기 말소되었더라도 사해행위취소 소의 이익 O ∵ 수익자(근저당권자)가 배당받는 것은 민법 406조 취지 위반, 부당한 이득 보유시키지 않도록 → 배당금 지급받지 못했다면 원상회복 방법은 수익자가 취득한 배당금도 및 통지 하도록 [97다8687] / 배당금 받았다면 가액배상청구 O [2003다6200] / 경매대금으로 근저당권자(수익자)에게 변제하여 근저당권설정등기 말소된 경우도 소의 이익 O [2012다65058]", "확인의소"],
  ["6_022.③", "★ 서면으로 증명될 법률관계에 대하여 당사자 간에 다툼이 없거나 법률관계가 소멸되면 확인의 이익이 없다.", true, "▸ 서면으로 증명되어야 할 법률관계에 대하여 당사자 간 다툼 없거나 법률관계가 소멸되면 확인의 이익 없음", "확인의소"],
  ["6_022.④", "★ 어느 서면에 의하여 증명되어야 할 법률관계를 둘러싸고 이미 소가 제기되어 있는 경우에 그와 별도로 그 서면에 대한 진정여부를 확인하는 소를 제기할 확인의 이익이 없다.", true, "▸ 서면으로 증명돼야 할 법률관계를 둘러싼 소가 이미 제기되었다면 확인의 이익 X → 이유 中 : 그러나 증서진부 확인의 소가 제기된 후에 법률관계를 둘러싼 소가 제기되었다고 하더라도 증서진부 확인의 소가 부적법하게 되지는 X [2005다29290]", "확인의소"],
  // 형성의소,
  ["6_023.①", "★ 사해행위가 취소되더라도 원상회복청구의 소에서 패소할 것이 예상되는 사정이 있다면 사해행위취소의 소는 소의 이익이 인정되지 않는다.", false, "▸ 원상회복청구 패소 예상된다고 사해행위취소소송 소의 이익 부정되지 않음 ∵ 사해행위취소와 원상회복은 서로 소송물 다른 별개 소송, 별개 제기될 수 있고 전자 승소해도 후자 패소 가능, 사해행위취소 효력은 407조 모든 채권자 이익을 위해 미치고 그것이 소의 목적 [2011다60421, 2011다37001]", "형성의소"],
  ["6_023.②", "사해행위취소의 소 제기 당시에 소의 이익이 있었다면 그 소송 도중(변론종결 전)에 사해행위가 해제 또는 해지되어 당초 원상회복을 구하고자 했던 재산이 채무자에게 복귀되었더라도 소의 이익이 흠결된 것으로 볼 수는 없다.", false, "▸ 사해행위 및 원상회복 구하는 소송 계속 중 그 사해행위가 해제·해지되고 재산이 채무자에게 복귀된 경우 권리보호이익 X ∵ 이미 목적 실현 [2007다85157]", "형성의소"],
  ["6_023.③", "어느 한 채권자가 사해행위취소 및 원상회복청구를 하여 승소판결을 받고 그 판결이 확정되어 원상회복을 마친 후 다른 채권자가 동일한 사해행위에 관하여 사해행위취소의 소(후소)를 제기하더라도 후소에서 소의 이익이 없다고 볼 수 없다.", false, "▸ 채권자취소 및 원상회복청구 승소판결 확정되었더라도 그 후 제기된 다른 채권자의 동일한 청구는 권리보호이익 O → 그러나 그 확정판결에 기하여 재산이나 가액 회복 마친 경우는 중첩되는 범위 내에서 권리보호이익 X [2003다19558]", "형성의소"],
  ["6_023.⑤", "근저당권설정계약이 사해행위에 해당하더라도 채무자(소유자)가 당해 부동산을 매각하여 그 대금으로 근저당권자(수익자)에게 피담보보채무를 변제함으로써 근저당권설정등기가 말소되었다면 채권자가 근저당권설정계약의 취소를 구하는 사해행위취소의 소는 소의 이익이 인정될 수 없다.", false, "▸ 경매 진행 중인 부동산을 매각(임의한가)하여 그 대금으로 근저당권자(수익자)에게 변제하여 근저당권설정등기 말소된 경우도 소의 이익 O [2012다65058]", "형성의소"],
  ["6_024.①", "甲, 乙, 丙은 X 토지에 대하여 각 1/3 지분을 공동으로 소유하고 있다. 甲이 乙과 丙을 상대로 공유물 분할 청구의 소를 제기하였다.§★ 공유물분할청구의 소는 공유자 甲이 다른 공유자 乙과 丙 전부를 공동피고로 하여야 하는 필수적 공동소송이다.", true, "▸ 공유물분할청구는 공유자 전원이 당사자 되어야 하는 고유필수적 공동소송 [통판]", "형성의소"],
  // 소의제기,
  ["SS민소6.ㄴ", "■보충 소액사건심판법을 적용하는 소액사건의 경우 법원은 소장·준비서면, 그 밖의 소송기록에 의하여 청구가 이유 없음이 명백한 경우에는 변론 없이 청구를 기각할 수 있다.", true, "소액사건심판법 제9조(심리절차상의 특칙) ① 법원은 소장·준비서면, 그 밖의 소송기록에 의하여 청구가 이유 없음이 명백한 경우에는 변론 없이 청구를 기각할 수 있다.", "소의제기"],
  ["6_025.①", "甲이 乙을 상대로 2억 원의 지급을 구하는 대여금 청구의 소를 제기하였다.§甲이 납부한 인지액이 「민사소송 등 인지법」에서 정한 금액에 미달하는 경우 법원은 소장의 접수를 보류할 수 있다.", true, "제248조(소제기의 방식) ② 법원은 소장에 붙이거나 납부한 인지액이 「민사소송 등 인지법」 제13조제2항 각 호에서 정한 금액에 미달하는 경우 소장의 접수를 보류할 수 있다.", "소의제기"],
  ["6_025.②", "★ 甲이 제출한 소장이 법원에 접수되면 소장이 제출된 때에 소가 제기된 것으로 본다.", true, "제248조(소제기의 방식) ③ 법원에 제출한 소장이 접수되면 소장이 제출된 때에 소가 제기된 것으로 본다. [시행일 2023.10.19]\n▸ 작년 '로소정'에 있는 내용이고 수업시간에 언급하였으나 '로소정 더 베이직' 편집상 조문 누락되었으니 반드시 보충할 것", "소의제기"],
  ["6_025.⑤", "★ 乙은 자신이 준비서면에 적지 아니한 사실을 甲이 변론기일에 출석한 경우에도 주장하지 못한다.", false, "제276조(준비서면에 적지 아니한 효과) 준비서면에 적지 아니한 사실은 상대방이 출석하지 아니한 때에는 변론에서 주장하지 못한다.\n▸ 상대방(甲)이 출석한 경우에는 적지 않은 사실도 변론에서 주장할 수 있음", "소의제기"],
  ["6_026.①", "★ 원고가 소권을 남용하여 청구가 이유 없음이 명백한 소를 반복적으로 제기한 경우에는 법원은 결정으로 500만 원 이하의 과태료에 처한다.", true, "제219조의2(소권 남용에 대한 제재) 원고가 소권(항소권을 포함한다)을 남용하여 청구가 이유 없음이 명백한 소를 반복적으로 제기한 경우에는 법원은 결정으로 500만원 이하의 과태료에 처한다. [시행일 2023.10.19]\n▸ 작년 '로소정'에 있으나 '로소정 더 베이직' 편집상 조문 누락되었으니 반드시 보충", "소의제기"],
  ["6_026.②", "원고가 상한을 표시하지 않고 일정액을 초과하는 채무의 부존재의 확인을 청구하는 사건에 있어서 일정액을 초과하는 채무의 존재가 인정되는 경우에는, 특단의 사정이 없는 한, 법원은 그 청구의 전부를 기각할 것이 아니라 존재하는 채무부분에 대하여 일부패소의 판결을 하여야 한다.", true, "▸ 상한 표시 없고 일정액 초과 채무 부존재 확인 청구하는 사건에서 일정액 초과 채무 존재 인정될 경우, 특단의 사정이 없는 한, 법원은 청구 전부 기각 X, 존재하는 채무부분에 대해 일부패소 판결 O [93다9422]", "소의제기"],
  ["6_026.③", "★ 소장에 필수적 기재사항이 적혀져 있지 않거나 소장에 인지를 붙이지 않은 경우 재판장은 상당한 기간을 정하고, 그 기간 이내에 흠을 보정하도록 명하여야 하며, 재판장은 법원사무관등으로 하여금 위 보정명령을 하게 할 수도 있는데, 원고가 위 기간 이내에 흠을 보정하지 아니한 때에는 재판장은 명령으로 소장을 각하하여야 한다.", true, "제254조(소장의 심사) ① 재판장은 소장이 제249조제1항의 규정에 어긋나거나 소장에 법률의 규정에 따른 인지를 붙이지 아니한 경우에는 상당한 기간을 정하고, 그 기간 이내에 흠을 보정하도록 명하여야 한다. 재판장은 법원사무관등으로 하여금 위 보정명령을 하게 할 수 있다. ② 원고가 제1항의 기간 이내에 흠을 보정하지 아니한 때에는 재판장은 명령으로 소장을 각하하여야 한다.", "소의제기"],
  ["6_027.④", "★ 소장에 일응 대표자의 표시가 되어 있는 이상 설령 그 표시에 잘못이 있다고 하더라도 재판장이 이를 정정 표시하라는 보정명령을 하고 그에 대한 불응을 이유로 소장을 각하하는 것은 허용되지 않으며, 이러한 경우에는 법원이 오로지 판결로써 소를 각하할 수 있을 뿐이다.", true, "▸ 소장에 일응 대표자 표시 있는 이상 표시가 잘못되어 표시정정의 보정명령을 하였으나 불응하는 경우에도 소장각하명령 X, 소각하판결 O [2013마1273] → 대표자 표시 기재가 아예 없는 경우에 소장각하명령", "소의제기"],
  ["6_028.④", "甲 종중(대표자 A)은 乙을 상대로 X 건물에 대한 건물인도청구의 소를 제기하였다.§★ 법원은 乙이 청구의 원인이 된 사실을 모두 자백하는 취지의 답변서를 제출하고 따로 항변을 하지 아니한 때에도, 甲종중의 적법한 대표자가 A인지에 대해 의심스러운 경우 무변론으로 원고 승소판결을 선고할 수 없다.", true, "제257조(변론 없이 하는 판결) ① 법원은 피고가 제256조 제1항의 답변서를 제출하지 아니한 때에는 청구의 원인이 된 사실을 자백한 것으로 보고 변론 없이 판결할 수 있다. 다만, 직권으로 조사할 사항이 있거나 판결이 선고되기까지 피고가 원고의 청구를 다투는 취지의 답변서를 제출한 경우에는 그러하지 아니하다.\n▸ 지문의 경우 종중의 대표권에 의심이 간다면 직권조사사항이 있으므로 무변론판결 X\n무변론판결 할 수 없는 경우 : ① 공시송달로 소장 송달(256조 1항 단서), ② 직권조사사항 존재(257조 1항 단서), ③ 판결선고기일까지 다투는 답변서 제출(257조 1항 단서), ④ 원고 주장 자체로 이유 없는 경우, 자백간주 불허 사건, 형식적 형성의 소", "소의제기"],
  ["6_029.ㄷ", "★ 총유재산의 보존행위로서 소를 제기하는 경우, 법인 아닌 사단이 그 명의로 사원총회의 결의를 거치거나 또는 그 구성원 전원이 당사자가 되어 필수적 공동소송의 형태로 할 수 있을 뿐이고, 그 사단의 대표자는 사원총회의 결의를 거쳤다 하더라도 혼자서 그 소송의 원고가 될 수 없다.", true, "▸ 총유는 공유·합유의 '보존행위 각자' 규정 X ∵ 총유가 단체성 강하고 개인 지분권 부정되기 때문 → 총유재산에 관한 소송은 ① 비법인사단이 그 명의로 사원총회 결의를 거쳐서, ② 구성원 전원이 당사자가 되어 필수적 공동소송 형태로 할 수 있을 뿐 → 사단의 '구성원'은 소송 당사자 X, 설령 ⓐ 대표자라거나 ⓑ 사원총회 결을 거쳤다거나 ⓒ 보존행위라 해도 X [2004다44971]", "소의제기"],
  ["6_030.ㄱ", "甲은 乙을 채무자, 丙 주식회사를 제3채무자로 하여 乙의 丙에 대한 임금채권에 대하여 채권압류 및 추심명령을 받은 후 이를 근거로 丙을 상대로 추심금청구의 소를 제기하였다. 제1심 법원은 소장부본을 비롯한 소송서류를 丙의 본점 소재지로 송달하였고, 乙이 丙의 사무원으로서 위 소송서류를 수령한 후 丙의 대표이사에게 전달하지 아니하였다.§★ 위 사건의 소송서류 송달은 보충송달로서 적법하다.", false, "▸ 본인과 수령대리인 사이 당해 소송에 관하여 이해가 대립·상반된다면 보충송달 X ∵ 본인에게 전달 합리적 기대 X, 쌍방대리금지 위반 [2014다54366] → 임금채권에 대한 압류·추심명령, 추심금청구 소장부본, 판결정본을 모두 제3채무자인 회사 대신 채무자가 회사의 '사무원'으로서 송달받으면 보충송달 효력 X ∵ 이해대립", "소의제기"],
  ["6_030.ㄴ", "甲은 乙을 채무자, 丙 주식회사를 제3채무자로 하여 乙의 丙에 대한 임금채권에 대하여 채권압류 및 추심명령을 받은 후 이를 근거로 丙을 상대로 추심금청구의 소를 제기하였다. 제1심 법원은 소장부본을 비롯한 소송서류를 丙의 본점 소재지로 송달하였고, 乙이 丙의 사무원으로서 위 소송서류를 수령한 후 丙의 대표이사에게 전달하지 아니하였다.§제1심법원의 무변론판결은 적법하다.", false, "▸ 위에서 본 바와 같이 부적법한 송달이므로 무변론판결 X", "소의제기"],
  ["6_030.ㄷ", "甲은 乙을 채무자, 丙 주식회사를 제3채무자로 하여 乙의 丙에 대한 임금채권에 대하여 채권압류 및 추심명령을 받은 후 이를 근거로 丙을 상대로 추심금청구의 소를 제기하였다. 제1심 법원은 소장부본을 비롯한 소송서류를 丙의 본점 소재지로 송달하였고, 乙이 丙의 사무원으로서 위 소송서류를 수령한 후 丙의 대표이사에게 전달하지 아니하였다.§丙의 대표이사가 위 제1심판결정본 송달일로부터 한 달이 지난 시점에 이 사건 제1심 기록을 열람하고 그로부터 2주 이내에 추완항소를 제기하였다면, 그 추완항소는 적법하다.", true, "▸ 소장 부본 및 제1심 판결정본이 피고 회사의 종전 본점 소재지에서 수령권한 없는 사람들에게 송달 → 피고 회사가 기록 열람·복사 신청 후 무변론판결 알았고, 그로부터 2주 경과 후 항소제기 적법 O ∵ 제1심 판결정본 부적법 송달로서 이는 판결 송달 전 항소 O [2018다239899]", "소의제기"],
  ["6_031.ㄱ", "★ 피고가 소장의 부본을 송달받은 날부터 30일 이내에 청구의 원인이 된 사실을 모두 자백하는 취지의 답변서를 제출하고 판결이 선고될 때까지 따로 항변을 하지 아니한 경우, 변론 없이 판결할 수 없다.", false, "제257조(변론 없이 하는 판결) ② 피고가 청구의 원인이 된 사실을 모두 자백하는 취지의 답변서를 제출하고 따로 항변을 하지 아니한 때에는 제1항의 규정을 준용한다.\n▸ 모두 자백하는 답변서 제출 + 항변 X → 무변론판결 O", "소의제기"],
  ["6_031.ㄷ", "★ 피고가 공시송달의 방법에 따라 소장의 부본을 송달받은 경우에는 피고가 소장의 부본을 송달받은 날부터 30일 이내에 답변서를 제출하지 않았다는 이유로 변론 없이 판결할 수 없다.", true, "제256조(답변서의 제출의무) ① 피고가 원고의 청구를 다투는 경우에는 소장의 부본을 송달받은 날부터 30일 이내에 답변서를 제출하여야 한다. 다만, 피고가 공시송달의 방법에 따라 소장의 부본을 송달받은 경우에는 그러하지 아니하다.", "소의제기"],
  ["6_031.ㄹ", "★ 피고가 소장의 부본을 송달받은 날부터 30일 이내에 답변서를 제출하지 않았다면 판결이 선고될 때까지 피고가 원고의 청구를 다투는 취지의 답변서를 제출하였더라도 변론 없이 판결할 수 있다.", false, "제257조(변론 없이 하는 판결) ① 법원은 피고가 제256조 제1항의 답변서를 제출하지 아니한 때에는 청구의 원인이 된 사실을 자백한 것으로 보고 변론 없이 판결할 수 있다. 다만, 직권으로 조사할 사항이 있거나 판결이 선고되기까지 피고가 원고의 청구를 다투는 취지의 답변서를 제출한 경우에는 그러하지 아니하다.", "소의제기"],
  // 중복소송,
  ["6_032.①", "■보충 동일한 교통사고 피해자 甲, 乙 중 甲이 그 가해자인 피보험자 丙을 대위하여 보험자 A회사를 상대로 제기한 자신의 손해 부분에 관한 보험금청구소송의 계속 중 乙이 丙을 대위하여 자신의 손해 부분에 관하여 위 A회사를 상대로 별도로 제기한 보험금청구의 소는 중복된 소제기에 해당하지 않는다.", true, "▸ 동일한 교통사고의 여러 피해자 중 1인이 피보험자를 대위하여 보험자를 상대로 자신의 손해부분에 관한 보험금청구를 하는 중 다른 피해자가 피보험자를 대위하여 자신의 손해 부분에 관한 별도의 보험금을 청구하는 것은 중복소송 X [91다41187] → 소송물이 달라 중첩 부분이 없으므로 당연", "중복소송"],
  ["6_032.②", "★ 채권자대위소송(전소)이 법원에 계속 중일 때 같은 채무자의 다른 채권자가 동일한 소송물에 대하여 채권자대위권에 기한 소(후소)를 제기하였다 하더라도 후소의 변론종결시까지 전소가 취하되거나 각하되면 후소는 중복된 소제기에 해당하지 않는다.", true, "▸ 전소가 소송요건 흠으로 부적법해도 후소 변론종결시까지 전소가 각하·취하 등으로 소송계속 소멸하지 않는 한 후소는 중복소송금지 위배로 각하 [97다45532]", "중복소송"],
  ["6_032.③", "★ 채권자 甲에 의한 사해행위취소소송의 계속 중 다른 채권자 乙이 동일한 사해행위에 대하여 사해행위취소의 소를 제기한 경우에는 중복된 소제기에 해당하지 않는다.", true, "▸ 사해행위취소소송 계속 중에 '다른' 채권자가 동일한 사해행위의 취소 구하는 것은 중복소송 X ∵ 각 채권자 고유의 권리 [2003다19558]", "중복소송"],
  ["6_032.④", "★ 채권자가 채무인수자를 상대로 제기한 채무이행청구소송(전소)과 채무인수자가 채권자를 상대로 제기한 원래 채무자의 채권자에 대한 채무부존재확인소송(후소)은 그 청구취지와 청구원인이 서로 다르므로 전소의 소송계속 중 후소가 제기되더라도 중복된 소제기에 해당하지 않는다.", true, "▸ 채권자가 인수인을 상대로 제기한 이행청구소송 계속 중 인수인이 채권자를 상대로 원래 채무자의 채무부존재확인소송 제기하면 청구취지·청구원인 서로 다르므로 중복소송 X, 그러나 확인의 이익 X → 중복소송이라면 '각하'한 원심의 결론은 결과적으로 옳아 상고기각 [2001다22246]", "중복소송"],
  ["6_032.⑤", "중복된 소제기임에도 불구하고 이를 간과하여 진행된 소송절차에서 성립된 화해는 당연무효이다.", false, "▸ 중복소송 간과판결 : 상소 O, 재심 X(확정되면 다툴 수 없음) → 다만, 중복소송을 간과한 판결이 확정된 후 서로 모순·저촉된다면 '뒤에 확정'된 판결에 제10호 재심사유 O [96다32706] → 그러나 이는 '확정의 선후'에 의하며, 소송계속의 기준인 전소·후소 개념과는 별개\n▸ 중복제소금지 원칙에 위배되어 제기된 소에 대한 판결이나 그 소송절차에서 이루어진 화해라도 확정된 경우에는 당연무효 아님 [94다59028]", "중복소송"],
  ["6_033.①", "★ 각 채권자가 동일한 사해행위에 관하여 동시 또는 이시에 그 취소 및 원상회복청구의 소를 제기한 경우, 이들 소에 관해서는 중복된 소 제기 금지의 원칙은 문제되지 않는다.", true, "▸ 사해행위취소소송 계속 중에 '다른' 채권자가 동일한 사해행위의 취소 구하는 것은 중복소송 X ∵ 각 채권자 고유의 권리 [2003다19558]", "중복소송"],
  ["6_033.②", "★ 채권자대위소송이 이미 법원에 계속되어 있을 때 같은 채무자의 다른 채권자가 동일한 소송물에 대하여 채권자대위권에 기한 소를 제기한 경우, 채무자가 선행하는 대위소송의 존재를 안 경우에 한하여 나중에 계속된 소송은 중복된 소 제기 금지의 원칙에 위배된다.", false, "▸ 채권자대위소송이 이미 법원에 계속 중인데 같은 채무자의 다른 채권자가 동일한 소송물에 대해 대위소송을 제기하면 후소는 중복소송금지 원칙 위배되어 부적법 [93다53092] → 판례는 ① 대위소송⇨채무자소송, ② 채무자소송⇨대위소송, ③ 대위소송⇨대위소송 모두 중복소송을 인정하고 있고(②의 경우에는 당사자적격 흠결이기도 함), 이때 채무자의 대위소송에 대한 인식 여부는 묻지 않음", "중복소송"],
  ["6_034.ㄷ", "A 명의로 1943. 6. 1. 소유권보존등기가 적법·유효하게 마쳐진 X 부동산에 대하여 甲이 등기관계서류를 위조하여 1979. 3. 5. 甲 명의로 소유권이전등기를 마쳤다. 그 후 X 부동산에 대하여 乙이 1980. 2. 7. 乙 명의로 소유권보존등기를 마쳤고, 이에 터잡아 丙이 1981. 5. 4. 丙 명의로 소유권이전등기를 마쳤다. 甲은 소유권에 기하여 乙, 丙을 상대로 위 각 소유권이전등기말소청구의 소를 제기하였다.§★ 등기부취득시효의 완성을 위한 등기는 원인무효의 등기라도 무방하므로, 丙이 취득시효의 완성을 위한 다른 요건을 모두 갖추었다면 丙명의의 소유권이전등기는 특별한 사정이 없는 한 실체관계에 부합하여 유효하다.", false, "▸ [민법] 245조 2항에서 말하는 등기는 부동산등기법 15조 1항 1부동산 1등기기록 원칙에 위배되지 않는 등기 → 선등기가 원인무효 아닌 경우에 중복보존등기나 그에 터잡은 등기로는 등기부취득시효 X [96다12511]", "중복소송"],
  ["6_034.ㄹ", "★ 甲의 채권자가 甲을 대위하여 乙, 丙을 상대로 제기한 소(전소) 계속 중 甲이 乙, 丙을 상대로 동일한 청구를 하는 소(후소)를 제기한 경우, 전소가 소송요건을 명백히 흠결하여 부적법하다면 후소는 적법한 것이 된다.", false, "▸ 전소가 소송요건 흠으로 부적법해도 후소 변론종결시까지 전소가 각하·취하 등으로 소송계속 소멸하지 않는 한 후소는 중복소송금지 위배로 각하 [97다45532]", "중복소송"],
  ["6_035.ㄴ", "★ A소가 제기되어 그 소송계속 중 A소와 당사자 및 소송물이 동일한 B소가 제기되고 양 소에 대한 판결이 선고되어 확정된 경우, 양 판결의 내용이 서로 모순·저촉될 때에는 뒤에 확정된 판결은 무효가 된다.", false, "▸ 중복소송을 간과한 판결이 확정된 후 서로 모순·저촉된다면 '뒤에 확정'된 판결에 제10호 재심사유 O [96다32706] → 그러나 이는 '확정의 선후'에 의하며, 중복소송의 소송계속 기준 전소·후소 개념과는 별개 → 지문처럼 뒤에 확정된 판결이 '무효'가 되는 것은 아니고 재심사유가 있는 것임", "중복소송"],
  ["SS민소7.②", "★ 당사자와 소송물이 동일한 소가 시간을 달리하여 제기된 경우 전소가 후소의 변론종결 시까지 취하·각하 등에 의하여 소송계속이 소멸되면 후소는 중복제소금지에 위반되지 않는다.", true, "▸ 전소가 소송요건 흠으로 부적법해도 후소 변론종결시까지 전소가 각하·취하 등으로 소송계속 소멸하지 않는 한 후소는 중복소송금지 위배로 각하 [97다45532] → 반대해석으로 지문 출제", "중복소송"],
  ["SS민소7.③", "★ 당사자와 소송물이 동일한 소가 시간을 달리하여 제기된 경우 전소와 후소의 판별기준은 소장이 피고에게 송달된 때의 선후에 의할 것인데, 만약 소제기에 앞서 가압류, 가처분 등의 보전절차가 미리 경료되어 있다면 이를 기준으로 전소인지 후소인지의 여부를 가려야 한다.", false, "▸ 중복소송에서 전소·후소 판별기준은 소송계속 발생 시기, 즉 소장 부본이 피고에게 송달된 때의 선후로 → 소제기에 앞서 가압류·가처분 등 보전절차 선행 여부는 기준 X [94다12517]", "중복소송"],
  ["SS민소7.⑤", "★ 중복제소금지의 원칙에 위배되어 제기된 소에 대한 판결이나 그 소송절차에서 이루어진 화해가 확정되더라도 그 판결이나 화해는 당연무효이다.", false, "▸ 중복제소금지 원칙에 위배되어 제기된 소에 대한 판결이나 그 소송절차에서 이루어진 화해라도 확정된 경우에는 당연무효 아님 [94다59028]", "중복소송"],
  ["6_036.ㄴ", "★ 甲의 乙에 대한 취득시효완성을 원인으로 한 X 토지에 관한 소유권 확인청구소송 계속 중에 甲이 다시 매매에 의한 소유권 취득을 주장하면서 乙을 상대로 X 토지의 소유권확인의 소를 제기한 경우 후소는 중복된 소제기이다.", true, "▸ 특정토지에 대한 소유권확인 본안판결 확정되면 그 변론종결 전에 확인원인이 되는 다른 사실이 있었다라도 확정판결의 기판력은 거기까지도 미치는 것 O [84다카2132]\n판례는 구이론의 입장이지만, 확인소송, 부당이득반환청구, 등기말소청구에 있어서 각각 소유권취득의 원인사실, 법률상 원인 결여가 된 사유, 등기 원인무효가 된 사유 등이 달라도 1개의 소송물로 보는 기본적 입장 → 소유권확인을 구하면서 그 취득원인만 다르다면 동일한 소송물이므로 중복소송 O", "중복소송"],
  ["6_037.①", "X부동산에 관하여 甲이 乙을 상대로 소유권존재확인의 소를 제기한 뒤 乙이 동일한 부동산에 관하여 甲을 상대로 소유권존재확인의 소를 제기한 경우, 후소는 중복된 소제기에 해당하지 않는다.", true, "▸ 기판력 작용국면 모순관계는 중복소송에서 확대시도 논의에서 중복소송으로 보자는 견해 있으나 통설·판례는 이를 부정하고 동일관계만 중복소송으로 봄", "중복소송"],
  ["6_037.②", "★ 채권자 甲이 채무자 乙을 대위하여 제3채무자 丙을 상대로 대여금청구의 소를 제기하였는데, 채무자 乙이 甲의 대위소송이 계속 중임을 알지 못한 상태에서 乙의 다른 채권자 丁이 乙을 대위하여 丙을 상대로 동일한 대여금의 지급을 구하는 소를 제기한 경우, 후소는 중복된 소제기에 해당하지 않는다.", false, "▸ 대위소송 계속 중 채무자가 소 제기할 경우 채무자 인식 불문하고 중복소송 ∵ 당사자는 다르나 실질상 동일소송 [94다29256]", "중복소송"],
  ["6_037.④", "★ 원고의 대여금반환청구소송에서 상계 항변을 제출한 피고가 그 소송계속 중에 자동채권과 동일한 채권에 기하여 반소나 별도의 소를 제기하여도 중복된 소제기에 해당하지 않는다.", true, "▸ 상계항변 제출 당시 이미 자동채권에 기한 소송 계속 중인 경우, 이부·이송·변론병합 시도로 판결 모순·저촉 방지, 소송경제 도모함이 바람직하나, 별소로 계속 중인 채권을 자동채권으로 상계항변할 수 있고, 마찬가지로 먼저 제기된 소송에서 상계항변 제출한 다음 그 소송계속 중 자동채권과 동일한 채권에 기한 소송을 별소·반소로 제기 가능 O [2021다275741]", "중복소송"],
  ["6_037.⑤", "일부청구임을 명시하지 않은 채 제기된 소의 계속 중에 나머지 청구를 별도의 소로 제기하는 경우, 후소는 중복된 소제기에 해당한다.", true, "▸ 일부청구 명시하지 않았다면 잔부청구는 중복소송 → 설령 명시했더라도 사실심 계속 중이므로 청구취지 확장으로 용이하게 할 수 있으므로 별소는 소권남용으로서 부적법 [95다46319] → 명시한 경우 중복소송이 아니라는 지문은 빈출", "중복소송"],
  ["6_038.⑤", "★ 명시적 일부청구를 하는 소가 계속 중이라면 잔부청구는 청구취지의 변경으로 가능하므로 잔부청구에 대한 별도의 소를 제기하는 것은 중복제소에 해당한다.", false, "▸ 일부청구와 중복소송 : 명시적 일부청구 계속 중 별소 잔부청구는 중복 X\n전소에서 일부만 특정하여 청구하고 별도 청구하겠다는 취지 명시적 유보한 경우, 전소 소송물은 그 일부에 한정되므로, 전소 계속 중 잔부를 별소로 제기해도 중복소송 X [84다552]\n그러나 명시적 일부청구라 해도 '사실심' 계속 중인 경우는 청구취지 확장이 용이하므로 별소로 잔부청구 하는 것은 소권남용 → 각하 [95다46319]", "중복소송"],
  // 소멸시효기간준수,
  ["6_039.⑤", "★ 乙에 대한 대여금채권자 甲이 2019. 7. 9. 乙을 상대로 지급명령을 신청하였고, 법원의 지급명령에 대하여 乙이 2019. 9. 10. 이의신청을 함으로써 사건이 소송으로 이행된 경우에는 위 지급명령에 의한 소멸시효 중단의 효력이 2019. 9. 10. 발생한다.", false, "▸ 지급명령 신청도 소제기와 마찬가지로 시효중단효가 있고, 지급명령 신청시에 중단됨", "소멸시효기간준수"],
  ["6_040.②", "★ 甲이 乙을 상대로 채권자대위권에 기하여 대여금청구를 하다가 당해 피대위채권 자체를 양수하여 양수금청구로 소를 교환적으로 변경하였다 하더라도 당초 채권자 대위소송으로 인한 시효중단의 효력은 소멸하지 않는다.", true, "▸ 대위소송 중 원고가 피대위채권 자체를 양수하여 양수금청구로 교환적 변경해도 당초 대위소송 제기로 인한 시효중단효 유지 ∵ 양 청구는 동일한 소송물의 권리의무 특정승계, 시효중단효는 특정승계인에게 미침, 소송참가·소송인수는 최초 소제기시 소급하여 시효중단효 생김, 권리 위에 잠자는 자 아님 [2010다17284]", "소멸시효기간준수"],
  ["6_041.①", "★ 청구의 대상으로 삼은 채권 중 일부만을 청구한 경우에도 그 취지로 보아 채권 전부에 관하여 판결을 구하는 것으로 해석되는 경우에는 그 동일성의 범위 내에서 그 전부에 관하여 시효중단의 효력이 발생한다.", true, "▸ 손해배상 일부청구 소장에 장차 신체감정결과에 따라 청구금액 확장할 것을 전제로 우선 일부를 청구한다는 뜻이라면 일부만 판결 구하는 취지 아님 → 분명하여 소제기 시효중단 효력은 소장에 주장한 손해배상채권의 동일성 범위 내의 채권 전부에 O [92다29924]", "소멸시효기간준수"],
  ["6_041.②", "★ 소장에서 청구의 대상으로 삼은 채권 중 일부만을 청구하면서 소송의 진행경과에 따라 장차 청구금액을 확장할 뜻을 표시하였으나 당해 소송이 종료될 때까지 실제로 청구금액을 확장하지 않은 경우에는 나머지 부분에 대하여는 재판상 청구로 인한 시효중단의 효력이 발생하지 아니한다.", true, "▸ 하나의 채권 중 일부만 판결 구함을 명백히 하면 소제기 의한 소멸시효 중단 효력은 일부에만 발생 → 소송경과에 따라 장차 청구금액 확장할 뜻 표시하고 당해 소송 종료될 때까지 실제로 청구금액 확장하면 소제기 당시부터 채권 전부에 시효중단 효력 O → 그러나 소송 종료될 때까지 실제로 청구금액 확장하지 않으면 나머지 중단 X → 다만 종료 시로부터 6월 내에 민법 174조 조치 취함으로써 중단 O ∵ 청구 의사는 있었으므로 당해 소송 계속인 동안 나머지 부분도 최고에 의해 권리행사 상태 지속된 것 O [2019다223723]", "소멸시효기간준수"],
  ["6_042.ㄹ", "★ 소장에서 명시적으로 채권 중 일부만을 청구하면서 소송 진행경과에 따라 장차 청구금액을 확장할 뜻을 표시하였으나 당해 소송이 종료될 때까지 실제로 청구금액을 확장하지 않은 경우, 나머지 부분에 대하여는 재판상 청구로 인한 시효중단의 효력이 발생하지 아니하므로, 채권자가 당해 소송이 종료된 때부터 6개월 내에 나머지 부분에 관하여 소를 제기하더라도 나머지 부분에 대한 소멸시효는 중단되지 아니한다.", false, "▸ 소송 종료될 때까지 실제로 청구금액 확장하지 않으면 나머지 중단 X → 다만 종료 시로부터 6월 내에 민법 174조 조치 취함으로써 중단 O ∵ 청구 의사는 있었으므로 당해 소송 계속인 동안 나머지 부분도 최고에 의해 권리행사 상태 지속된 것 O [2019다223723]", "소멸시효기간준수"],
  // 처분권주의,
  ["6_043.①", "★ 원고가 매매를 원인으로 한 소유권이전등기청구를 하였는데, 법원이 양도담보약정을 원인으로 소유권이전등기를 명하는 판결을 하는 것은 처분권주의에 위배되지 않는다.", false, "▸ 매매 소이등 청구했더니 원고가 주장하지 않은 양도담보 소이등 원인으로 승소 → 주문상 전부승소로 보이나 동일 청구 X, 실질적 인용 X, 처분권주의 위반 → 원고 상소이익 O [91다40696] → 구이론에 따른 상소이익", "처분권주의"],
  ["6_044.ㄷ", "甲은 2015. 10. 7. 乙에 대한 3,000만 원의 차용금채무를 피담보채무로 하여 乙에게 甲 소유의 X 부동산을 목적물로 하는 근저당권설정등기를 해주었다. 그 후 甲은 乙에게 2,000만 원을 변제하여 잔존채무가 1,000만 원이라고 주장하고 있는데, 乙은 甲의 잔존채무가 2,000만 원이라고 하면서 다투고 있다. 甲은 乙을 상대로 잔존채무가 1,000만 원임을 주장하며 채무부존재확인의 소를 제기하였다.§★ 만일 乙이 위 소송 계속 중에 잔존채무 2,000만 원의 지급을 구하는 반소를 제기한다면, 甲이 제기한 채무부존재확인의 본소는 확인의 이익이 소멸하여 부적법하게 된다.", false, "▸ 원고 채무부존재확인 ⇨ 피고 이행청구 '반소' : 후에 제기한 반소로 인하여 본소가 확인의 이익이 소멸 X, 본소 적법 O ∵ 소송요건 갖추어 적법하게 제기된 본소가 상대방이 제기한 반소로 인하여 부적법하게 될 수는 X [99다17401]", "처분권주의"],
  ["6_045.①", "★ 유권대리에 관한 주장 가운데 무권대리에 속하는 표현대리의 주장이 포함되어 있다고 볼 수 없고, 별도로 표현대리에 관한 주장이 있어야 법원은 표현대리의 성립여부를 심리판단 할 수 있다.", true, "▸ 유권대리 주장 속에 무권대리에 속하는 표현대리 주장 포함 X ∵ 표현대리 성립된다고 무권대리 성질 유권대리로 전환 X, 양자 주요사실 다름 [83다카1489]", "처분권주의"],
  ["6_045.②", "★ 건물의 소유를 목적으로 한 토지임대차에서 임대인이 임차인을 상대로 기간만료를 이유로 그 토지에 현존하는 건물철거 및 토지인도청구의 소를 제기하였다. 위 소송에서 피고가 건물매수청구권을 적법하게 행사하여 원고가 건물에 관한 소유권이전등기절차의 이행 및 건물인도를 구하는 내용으로 청구취지변경을 하였더라도, 법원은 피고가 동시이행항변을 하지 않는 한 건물매매대금을 지급받음과 상환으로 소유권이전등기절차의 이행 및 건물인도를 명하는 판결을 내릴 수 없다.", true, "▸ 건매청을 행사한 경우 원고가 건물 소이등·인도로 청구취지변경을 하지 않으면 건물 소이등·인도를 명하는 판결을 할 수 없다는 판례(처분권주의)가 중요 → 그러나 본 지문은 원고가 청구취지변경을 했기 때문에 그 판례를 출제한 것은 아니고, 건매청이 아니라 통상적인 매매에서도 피고가 동시이행항변을 하지 않으면 상환이행판결을 할 수 없다는 점(변론주의)을 출제한 문제임", "처분권주의"],
  ["SS민소8.ㄱ", "공유물분할의 소에 대해 법원은 공유물분할을 청구하는 자가 구하는 방법에 구애받지 아니하고 재량에 따라 공유관계나 그 객체인 물건의 제반 상황에 따라 공유자의 지분 비율에 따른 합리적인 분할을 할 수 있다.", true, "▸ 분할의 방법은 당사자가 구하는 방법에 구애받지 않고 법원의 재량에 따라 합리적 분할 [2014다233428]", "처분권주의"],
  ["SS민소8.ㄷ", "채권자가 소로써 채무자가 건물에서 퇴거할 것을 구하고 있는데 법원이 채무자의 건물 인도를 명하는 것은 처분권주의에 반하지 아니한다.", false, "▸ 건물 '인도'는 건물에 대한 현실적·사실적 지배 완전히 이전하는 것, 그 집행은 집행관이 채무자로부터 물건 점유를 빼앗아 채권자에게 인도하는 방법으로 → 건물에서의 '퇴거'는 건물에 대한 채무자의 점유를 해제하는 것일 뿐 더 나아가 채권자에게 점유를 이전할 것까지 의미하지 않음 → 채권자가 소로써 건물에서 퇴거할 것 구하고 있는데 법원이 채무자의 건물 인도 명하는 것은 처분권주의의 위반으로 불허 [2024다213157]", "처분권주의"],
  ["SS민소8.ㄹ", "★ 금전채무불이행의 경우에 발생하는 원본채권과 지연손해금채권은 별개의 소송물이나, 불이익변경에 해당하는지 여부는 원금과 지연손해금을 합산한 전체 금액을 기준으로 판단하여야 한다.", false, "▸ 금전채무불이행에서 법정 지연손해금채권은 원본채권의 일부가 아닌 전혀 별개의 채권, 별개 소송물 → 불이익변경 해당 여부는 각 소송물별로 원금과 지연손해금 부분을 각각 따로 비교·판단하여야 → 별개 소송물을 합산한 전체 금액을 기준으로 판단해서는 X [2009다12399]", "처분권주의"],
  ["6_046.ㄱ", "★ 甲이 乙을 상대로 상해를 입었음을 원인으로 손해배상금 8,000만 원(적극적 손해 3,000만 원, 소극적 손해 3,000만 원, 위자료 2,000만 원)을 청구한 경우, 법원이 손해배상금 6,000만원(적극적 손해 4,000만 원, 소극적 손해 1,000만 원, 위자료 1,000만 원)을 인용하는 것은 허용된다.", false, "▸ 생명·신체에 대한 불법행위로 인하여 입게 된 적극적 손해, 소극적 손해, 정신적 손해는 서로 소송물을 달리하고 그 소송물 범위에 관하여 항쟁함이 타당한지 여부는 각 손해마다 따로 판단하여야 [2022다200768]\n→ 손해 3분설에 따라 적극적 손해가 초과 인용되면 총액이 적어도 처분권주의 위반", "처분권주의"],
  ["6_046.ㄴ", "★ 채권자 甲이 채무자 乙 및 제3채무자 丙을 상대로 이들의 채무가 부진정연대채무의 관계에 있음을 전제로 공동하여 1억 원을 지급할 것을 청구하였는데, 법원이 피고 乙은 3,000만 원, 피고 丙은 2,000만 원의 개별적인 지급책임을 인정한 것은 처분권주의를 위배한 것이다.", true, "▸ 2개의 채무가 부진정연대채무 관계임을 전제로 연대하여(또는 공동하여) 지급할 것을 구했음에도 둘에게 개별적 지급책임 인정하면 처분권주의 위반 [2012다89832]\n→ 주문의 분할채무의 금액을 합산해도 전체 부진정연대채무보다 미달함에도 처분권주의의 위반을 인정한 판례로서 이유에 설시되어 유의해야 할 판례로 설명하던 것인데, 처음으로 출제되었음", "처분권주의"],
  ["6_047.②", "甲이 고속도로를 자신의 승용차로 운행하던 중에 도로에 방치된 철판을 튕겨 오르게 하여 뒤에 오던 乙의 차량을 충격하게 하였다. 乙은 2024. 5. 16. 甲의 보험사인 丙과 고속도로를 설치하고 보존·관리하는 丁을 상대로 손해배상청구의 소를 제기하려 한다.§乙이 丙과 丁을 공동피고로 하여 손해배상청구하면서, 청구취지에서 '피고들은 공동하여 원고에게 3억 원을 지급하라'고 기재하였다면, 이 소는 합의부 관할에 속한다.", false, "▸ 소가는 합산의 원칙(27조 1항) → 예외적 흡수의 예시로 경제적 이익 동일·중복(민인규 20조) : 선택적·예비적 병합의 경우 → 다만, 단순병합·통상공동소송이더라도 연대채무자들(사안의 부진정연대채무자들 포함), 주채무자·보증인, 집행불능 대비 대상청구의 경우에는 성질상 경제적 이익이 공통되므로 예외적으로 흡수함\n지문에서 丙, 丁에 대한 청구를 합산하지 않아 소가는 3억 원이고, 소가가 5억 원을 초과하지 않으면 단독판사 관할\n(다만 설문은 '자동차 운행'과 관련된 손해배상이므로 설령 5억 원을 초과하여도 어차피 단독 관할일 수 있고, 그렇다면 출제에 고려되지 않은 것일 수 있음)", "처분권주의"],
  ["6_047.③", "乙이 丙과 丁을 공동피고로 하여 손해배상청구하면서, 청구취지에서 '피고들은 원고에게 각 3억 원을 지급하라'고 기재한 뒤 부진정연대채무관계에 관하여 달리 주장하지 않았더라도 법원은 공동피고의 부진정연대책임을 인정할 수 있다.", false, "▸ 부진정연대채무 관계에 관한 아무런 주장이 없었음에도 乙 회사와 丙에게 연대하여(또는 공동하여) 손해배상금을 지급하라고 한 판결은 처분권주의, 변론주의 위반한 위법 [2011다61646]", "처분권주의"],
  ["6_048.①", "★ 원고가 수인의 피고를 상대로 연대하여 금전을 지급할 것을 청구한 경우, 법원이 각 피고의 개별적 지급책임을 인정하여도 처분권주의의 위반이라고 할 수 없다.", false, "▸ 피고들이 부진정연대채임이 있음을 전제로 (공동하여) 2,500만원의 지급을 구했는데 법원이 피고1은 620만원, 피고2는 600만원을 각 개별적 지급책임 인정한 경우, 처분권주의 위반 [2012다89832]", "처분권주의"],
  ["6_048.②", "이자금 청구에서 법원이 원고가 특정한 기간을 넘는 기간을 인정하여 이자를 산정하여 인정하더라도 원고가 청구한 이자금액을 초과하지 않는 한 처분권주의에 위반한 판결로 볼 수 없다.", false, "▸ 원금·이자·지연손해금 : 별개 소송물로서 각각 따로 평가 → 원금·이율·기간 어느 것이든 원고 주장 기준 넘으면 처분권주의 위반", "처분권주의"],
  ["6_048.③", "공유물분할청구의 소는 형식적 형성의 소로서 처분권주의가 적용되지 않으므로 법원은 분할을 구하는 공유자에게 지분비율을 조정하는 방법으로 공유관계를 유지하도록 판결할 수 있다.", false, "▸ 분할의 방법은 당사자가 구하는 방법에 구애받지 않고 법원의 재량에 따라 합리적 분할 → 현물분할에서 분할청구자의 지분한도 안에서 현물분할하고 분할 원하지 않는 나머지 공유자들은 공유로 남는 방법 허용 O → 그러나 분할청구자가 이런 방식 현물분할 청구하더라도, 상대방들이 공유로 남기 원하지 않는다면 위와 같이 공유로 남기는 현물분할 X [2014다233428]", "처분권주의"],
  ["6_049.③", "★ 원고의 금전청구에 대하여 피고가 원고에 대한 반대채권으로 상계한다고 주장하였다가 이를 철회한 경우에 법원이 피고가 주장하는 반대채권이 성립하지 않는다고 판단하여 상계항변을 배척하여도 처분권주의 위반이 아니다.", false, "▸ 피고가 상계항변 철회한 것을 간과하고 법원이 상계항변을 판단하여 배척한 판결은 처분권주의 위배 [2011다23323] → 항변에 대한 것은 처분권주의가 아닌 변론주의의 문제인데, 상계항변은 예외적으로 기판력이 발생하므로 피고의 항변이지만 이에 대한 잘못된 판단은 '처분권주의' 위반이 됨(私見)", "처분권주의"],
  ["6_050.②", "★ 원고가 소장에서 X토지를 피고로부터 매수하였다고 주장하고 있으나 원고가 위 매매 당시 10세였고 원고가 신청한 증인이 '원고의 조부가 원고를 대리하여 위 토지를 매수하였다'는 사실을 증명하고 있다면 법원은 원고의 조부가 원고의 대리인으로서 X토지를 매수하였다고 인정할 수 있다.", true, "▸ 원고가 피고와의 계약이 제3자 丙을 통해 체결되었다며 丙을 증인신청하고 증명 → 대리사실의 '간접적 주장' O [87다카982, 94다24626]", "처분권주의"],
  ["6_050.④", "★ 의사표시가 강박에 의한 것이어서 당연무효라는 주장 속에는 '강박을 이유로 취소한다'라는 주장이 당연히 포함되어 있다고 볼 수 없다.", true, "▸ 강박에 의해 무효라는 주장 속에는 강박에 의한 취소 주장은 포함되지 X [95다40038]", "처분권주의"],
  // 변론주의,
  ["6_051.ㄴ", "★ 본래의 소멸시효 기산일과 당사자가 주장하는 기산일이 서로 다른 경우에 법원은 당사자가 주장하는 기산일을 기준으로 소멸시효를 계산하여야 한다.", true, "▸ ㄴ·ㄷ·ㄹ 지문 관련 : 소멸시효는 피고의 항변사유이고 변론주의(사실의 주장책임)가 적용됨 → 기산점은 주요사실로서 변론주의 적용되고, 소멸시효기간은 간접사실로서 당사자 주장에 구애되지 않음(상세 해설은 민법 교재 참조)", "변론주의"],
  ["6_051.ㄷ", "★ 위 사건을 심리한 결과 甲의 대여금은 乙의 영업을 위한 것이 아닌 개인적인 대여금이라고 법원이 판단하였을 경우에도 그 소멸시효기간을 乙의 주장과 달리 판단할 수 없다.", false, "▸ 소멸시효기간은 간접사실로서 당사자 주장에 구애되지 않음", "변론주의"],
  ["6_051.ㄹ", "★ 乙이 소멸시효 완성 주장을 하지 않은 경우에 법원이 증거조사결과와 甲의 채권이 소멸시효 완성으로 인하여 소멸하였다는 심증을 형성하더라도 이를 이유로 청구기각의 판결을 선고할 수 없다.", true, "▸ 소멸시효는 피고의 항변사유이고 변론주의(사실의 주장책임)가 적용됨 → 乙이 항변 안 하면 법원은 직권으로 소멸시효 완성 인정 불가", "변론주의"],
  ["6_052.ㄱ", "★ 주요사실에 대하여 당사자가 주장하지 않은 사실을 인정하여 판단하는 것은 변론주의에 위배되지만, 변론을 전체적으로 관찰하여 당사자가 간접적으로 주장한 것으로 볼 수 있는 경우에는 주요사실의 주장이 있는 것으로 보아야 한다.", true, "▸ 간접적 주장 이론(=준별의 완화) [통판] : 변론을 전체적으로 관찰하여, 감정서나 서증을 이익으로 원용한 경우, 증거신청(서증제출·증인신청)과 함께 증명취지 진술한 경우에는 간접적 주장 인정 O → 다만 소송행위에 비추어 주요사실의 주장이 당연히 예상될 것, 상대방의 방어권 행사에 지장 초래 없을 것, 변론 전체의 취지를 고려할 것 등의 제한이 필요함", "변론주의"],
  ["6_053.②", "★ 부동산의 시효취득에 관하여 자주점유인지 여부를 가리는 기준이 되는 점유의 권원은 간접사실에 불과하므로 법원으로서는 이에 관한 당사자의 주장에 구속되지 아니하고 소송자료에 의하여 판단할 수 있다.", true, "▸ 취득시효 완성 후 제3자 앞으로 소유권이전등기 됨으로써 취득시효환원 원인 소유권이전등기의무가 이행불능이라는 점은 직권조사사항 X [92다41498] → '이행불능의 성부'는 법률적 사항이어서 자백의 대상이 될 수는 없으나, 이행불능이라는 주장이나 항변 자체는 당사자가 주장을 해야 법원이 판단할 수 있음", "변론주의"],
  ["6_054.①", "★ 원고가 X 토지를 피고로부터 매수하였다고 주장하였으나, 증인신문을 신청하여 제3자가 원고를 대리하여 피고로부터 위 토지를 매수하였다는 사실을 입증하고 있다면 법원이 대리행위에 관한 간접적인 진술이 있었다고 보는 것은 변론주의에 위배되지 않는다.", true, "▸ 원고가 피고와의 계약이 제3자 丙을 통해 체결되었다며 丙을 증인신청하고 증명 → 대리사실의 '간접적 주장' O [87다카982, 94다24626]", "변론주의"],
  ["SS민소9.①", "★ 법원은 변론에서 당사자의 주요사실에 관한 주장이 없으면 그 사실을 인정할 수가 없는 것이나, 그 주장은 반드시 주장책임을 지는 당사자가 진술하여야 하는 것은 아니다.", true, "▸ 원고와 피고 사이에는 주장공통 원칙 적용 O : 주요사실은 반드시 주장책임을 지는 당사자가 진술해야만 하는 것은 아니고, 어느 당사자든 변론에서 주장하면 주장한 것", "변론주의"],
  ["SS민소9.⑤", "■보충 당사자가 등기부취득시효를 주장한 것임이 분명한 경우에도 법원은 점유취득시효의 주장이 함께 포함되어 있는 것인지를 석명하여야 한다.", false, "▸ 등기부취득시효의 주장임이 분명한 경우, 법원이 점유취득시효의 주장이 함께 포함되어 있는 것인지 여부를 석명할 의무는 X [96다49902]", "변론주의"],
  ["6_055.②", "피담보채무의 부존재를 이유로 하는 근저당권말소등기청구의 소에서 피담보채무가 소멸하였다는 사실은 원고가 주장·증명하여야 한다.", true, "▸ 법률요건분류설에 따를 때 권리근거규정은 원고(채권자)가, 권리장애·소멸·저지규정은 피고(채무자)가 각 주장·증명해야 하는데, 채무자인 원고가 피담보채무의 부존재를 이유로 근저당권말소등기청구를 구할 경우 그 채무의 '소멸' 사실은 채무자인 원고가 주장·증명해야 (등기의 추정력 관점에서도 원고가 증명해야 함)", "변론주의"],
  ["6_055.③", "법률행위가 신의성실 원칙에 반하여 강행규정 위반이라는 것은 당사자의 주장이 없어도 법원이 직권으로 판단할 수 있다.", true, "▸ 판례는 신의칙 위반, 강행규정 위반 여부에 관하여 직권조사사항으로 봄", "변론주의"],
  ["6_056.①", "甲이 취득시효를 주장하며 乙을 상대로 소를 제기한 경우, 乙이 응소행위를 하였다고 하여 바로 시효중단의 효과가 발생하는 것은 아니고, 乙이 응소행위로서 시효가 중단되었다고 주장을 하여야 한다.", true, "▸ 소멸시효·취득시효의 중단 사실은 변론주의 적용을 받음", "변론주의"],
  ["6_056.②", "■보충 채무가 이행불능인 사실은 법률상 사항이므로 피고가 이행불능 사실을 주장하지 않더라도 법원은 이행불능을 이유로 원고의 청구를 배척할 수 있다.", false, "▸ 취득시효 완성 후 제3자 앞으로 소유권이전등기 됨으로써 취득시효환원 원인 소유권이전등기의무가 이행불능이라는 점은 직권조사사항 X [92다41498] → '이행불능의 성부'는 법률적 사항이어서 자백의 대상이 될 수는 없으나, 이행불능이라는 주장이나 항변 자체는 당사자가 주장을 해야 법원이 판단할 수 있음", "변론주의"],
  ["6_056.④", "★ 인신사고로 인한 손해배상 사건에서 손해배상액을 산정하는 기초가 되는 피해자의 기대여명은 변론주의가 적용되는 주요사실이다.", true, "▸ 인신사고에서 손해배상액 산정 기초가 되는 피해자의 기대여명도 주요사실이므로 재판상 자백 O → 법원은 당사자 자백과 배치되는 사실 인정할 수 X [2016다41869]", "변론주의"],
  ["6_057.④", "★ 재판상의 자백을 진실에 부합되지 않고 착오에 기인한다는 이유로 취소할 경우, 진실에 부합하지 않는다는 사실에 대한 증명은 간접사실에 의하여도 가능하다.", true, "▸ 288조 단서의 '반진실'은 추인할 수 있는 간접사실의 증명에 의해서도 가능 [2000다23013]\n제288조(불요증사실) 법원에서 당사자가 자백한 사실과 현저한 사실은 증명을 필요로 하지 아니한다. 다만, 진실에 어긋나는 자백은 그것이 착오로 말미암은 것임을 증명한 때에는 취소할 수 있다.", "변론주의"],
  ["기타민소P6_03", "★ 당사자 본인신문에서의 진술은 소송상 당사자의 주장과 같이 취급할 수 없다.", true, "▸ 당사자 본인신문에서 당사자 진술은 '증거자료'에 불과, 소송상 당사자 '주장'과 같이 취급 X ∵ 증거자료에 나타난 사실을 소송상 주장사실과 같이 볼 수는 없음 [81다262] → 사실자료와 증거자료의 준별", "변론주의"],
  // 석명권,
  ["6_058.①", "★ 토지에 대한 임대차계약 종료 시 임대인이 임차인을 상대로 지상물(건물) 철거 및 그 부지의 인도를 청구한 데 대하여 임차인이 지상물매수청구권을 행사하여 그 청구권이 인정되는 경우, 임대인의 위 청구에는 건물매수대금 지급과 동시에 건물 인도를 구하는 청구가 포함되어 있다고 볼 수 없다.", true, "▸ 토지임대인의 토지인도 및 건물철거 청구에는 임차인이 건물매수청구권을 행사한 경우 매매대금지급과 상환으로 건물인도 청구 포함 X → 청구변경이 없는 한 기각 → 다만, 법원으로서는 매매대금지급과 상환으로 건물인도 청구할 의사 있는지 적극적 석명의무 有 ∵ 분쟁의 1회적 해결 [94다34265]", "석명권"],
  ["6_059.②", "★ 당사자가 어떠한 법률효과를 주장하면서 미처 깨닫지 못하고 그 요건사실 일부를 빠뜨린 경우에는 법원은 그 누락사실을 지적하고 당사자가 이 점에 관하여 변론을 하지 아니하는 취지가 무엇인지를 밝혀 당사자에게 그에 대한 변론을 할 기회를 주어야 할 의무가 있다.", true, "▸ [2002다60207]\n제136조(석명권·구문권 등) ④ 법원은 당사자가 간과하였음이 분명하다고 인정되는 법률상 사항에 관하여 당사자에게 의견을 진술할 기회를 주어야 한다.", "석명권"],
  ["6_059.③", "■보충 부동산에 관한 매매계약의 해제로 인한 원상회복의무가 이행불능이 되어 이행불능 당시 가액의 반환채권이 인정되는 경우, 이행불능 당시의 당해 부동산의 가액에 관한 원고의 주장·증명이 미흡하다면 법원은 적극적으로 석명권을 행사하여 증명을 촉구하여야 한다.", true, "▸ 부동산 매매계약 해제로 인한 원상회복의무가 이행불능되어 이행불능 당시 가액의 반환채권 인정되는 경우, 그 가액에 관한 원고 주장·증명이 미흡하면 법원은 적극적으로 석명권을 행사하여 증명을 촉구해야 함 [96다47913]", "석명권"],
  ["6_059.⑤", "★ 당사자가 구 청구를 취하한다는 명백한 표시 없이 새로운 청구로 변경하는 등으로 그 청구변경의 형태가 불분명한 경우, 법원은 청구변경의 취지가 교환적인지 추가적인지 또는 선택적인지에 관하여 석명할 의무가 있다.", true, "▸ 청구의 변경형태 불분명하면 석명의무 O, 의견진술 기회 부여해야 → 특히 항소심에서의 교환적 변경은 재소금지 효력 있으므로 법적관점지적의무 O [2002다41435]", "석명권"],
  // 주장항변,
  ["6_060.③", "피고는 제1심에서 상대방의 동의 없이 상계항변을 철회할 수 있다.", true, "▸ 소송상 상계항변은 예비적 항변이므로, 상대방의 동의 없이 제1심에서 철회 가능 O [2021다275741]", "주장항변"],
  ["6_061.①", "★ 소송상 방어방법으로서의 상계항변은 수동채권의 존재가 확정되는 것을 전제로 행하여지는 일종의 예비적 항변이다.", true, "▸ 소송상 상계는 예비적 항변이므로 확정적 효과 발생하지 않고 수동채권 존재 등 실질적 판단 이뤄진 경우에 비로소 실체법상 상계 효과 발생 [2013다95964]", "주장항변"],
  ["6_061.②", "★ 위 소송 진행 중 열린 조정 기일에서 甲과 乙 사이에 '乙은 甲에게 2억 원을 지급한다. 甲은 나머지 청구를 포기한다.'라는 내용의 조정이 성립하여 조서에 기재되더라도 위 상계항변의 사법상 효과는 발생하지 않는다.", true, "▸ '상계'항변 했으나 '조정 성립'되어 수동채권 존재에 관한 법원 실질적 판단 이뤄지지 않은 경우는 상계항변의 사법상 효과도 발생 X ∵ 상계는 예비적 항변 [2011다3329]", "주장항변"],
  ["6_061.④", "★ 법원이 甲의 乙에 대한 채권의 존재를 인정하면서 乙의 상계항변을 받아들여 甲의 청구를 기각하는 판결을 하였다면 甲과 乙은 이 판결에 대하여 모두 상소의 이익이 있다.", true, "▸ 상소이익 : ① 형식적 불복설 [통판], ② 실질적 불복설, ③ 절충설\n상계항변 받아들여 원고 청구 기각하면 원고는 당연히 상소이익 O, 피고도 상소이익 O\n피고 상계항변 인정되어 승소한 피고가 소구채권의 부존재를 주장하며 상소 O [2002다34666]", "주장항변"],
  ["6_061.⑤", "★ 乙이 상계항변으로 제출한 5억 원의 대여금 채권을 원인으로 甲에 대하여 이미 별소를 제기하여 소송계속 중이라고 하더라도 이러한 소송상 상계항변은 허용된다.", true, "▸ (별소선행 사안) 상계항변을 제출할 당시 이미 자동채권에 기한 소송이 계속 중인 경우, 이부·이송·변론병합 시도로 판결 모순·저촉 방지, 소송경제 도모함이 바람직하나, 별소로 계속 중인 채권을 자동채권으로 상계항변 O [2000다4050]\n(상계항변선행 사안) 마찬가지로 먼저 제기된 소송에서 상계항변 제출한 다음 그 소송계속 중 자동채권과 동일한 채권에 기한 소송을 별소·반소로 제기 가능 O [2021다275741]", "주장항변"],
  // 소송상형성권,
  ["6_062.①", "★ 제1심 법원이 원고가 청구한 채권의 발생을 인정한 후 피고의 상계항변을 받아들여 원고의 청구를 전부 기각하였는데 원고만 항소한 경우, 항소법원이 원고가 청구한 채권의 발생이 인정되지 않는다는 이유로 원고의 청구를 기각하는 것은 허용되지 않는다.", true, "▸ 제1심이 원고 소구채권 및 피고 상계항변 모두 인정하여 기각판결 내린 경우\n① 원고만 항소 → 항소심 '원고 소구채권 부존재' 판단 → '그것을 이유로 삼아' 청구기각해서는 X\n② 피고만 항소 → 항소심 '피고 반대채권 부존재' 판단 → '그것을 이유로 삼아' 항소기각해서는 X\n→ 양자 모두 제1심과 동일한 이유로(=소구채권+반대채권 모두 존재하는 것으로) 항소기각 O ∵ 불이익변경금지 원칙 [2010다67258, 94다18911]", "소송상형성권"],
  ["SS민소10.ㄴ", "甲은 乙로부터 X토지를 대금 5,000만 원에 매수하면서 당일 계약금 500만 원을 지급하고, 중도금 2,000만 원은 열흘 뒤에 지급하기로 약정하였다. 甲은 약정한 날짜에 乙에게 중도금 2,000만 원을 이행 제공하였으나 乙이 그 수령을 거절하여 이를 변제 공탁하였고, 이후 乙을 상대로 乙이 잔금수령을 거절하고 계약을 위반하였다는 이유로 계약금반환청구의 소(전소)를 제기하였다. 전소 계속 중 甲과 乙은 소송 외에서 소취하합의를 하였고 그에 따라 甲은 전소를 취하하였다. 그 후 X토지의 가격이 오르자 甲은 다시 乙을 상대로 위 매매계약에 기한 소유권이전등기청구의 소(후소)를 제기하였고, 乙은 이미 계약이 해제되었다고 항변하였다.§甲이 전소를 취하함으로써 해제권 행사의 사법상 효과도 소멸하므로 후소 법원은 청구인용판결을 하여야 한다.", false, "▸ ㄱ, ㄴ 해설 : 소 제기로 '해제권' 행사했다가 소취하 했어도 해제권은 형성권이므로 행사의 효력에 영향 없음 [80다916] → 소송상 형성권 행사에 관한 신병존설", "소송상형성권"],
  ["SS민소10.ㄷ", "甲은 乙로부터 X토지를 대금 5,000만 원에 매수하면서 당일 계약금 500만 원을 지급하고, 중도금 2,000만 원은 열흘 뒤에 지급하기로 약정하였다. 甲은 약정한 날짜에 乙에게 중도금 2,000만 원을 이행 제공하였으나 乙이 그 수령을 거절하여 이를 변제 공탁하였고, 이후 乙을 상대로 乙이 잔금수령을 거절하고 계약을 위반하였다는 이유로 계약금반환청구의 소(전소)를 제기하였다. 전소 계속 중 甲과 乙은 소송 외에서 소취하합의를 하였고 그에 따라 甲은 전소를 취하하였다. 그 후 X토지의 가격이 오르자 甲은 다시 乙을 상대로 위 매매계약에 기한 소유권이전등기청구의 소(후소)를 제기하였고, 乙은 이미 계약이 해제되었다고 항변하였다.§만일 甲이 전소 제기 전에 이미 해제권을 행사하였고 전소에서 그 사법상 효과를 주장하는 경우라면, 甲이 전소를 취하하더라도 해제권 행사의 사법상 효과는 그대로 존속하므로 후소 법원은 청구기각판결을 하여야 한다.", true, "▸ 소송상 형성권 행사의 논의 상황을 고려할 때, '재판 외'에서 이미 해제권을 행사했다면 취하 여부 불문하고 견해 대립 여지 없이 당연히 해제의 효과가 존속할 것임", "소송상형성권"],
  ["6_063.③", "★ 소송상 방어방법으로서 상계항변이 있었는데 소송절차 진행 중 조정이 성립되어 수동채권의 존재에 관한 법원의 실질적인 판단이 이루어지지 아니한 경우에도 그 소송절차에서 행하여진 소송상 상계항변의 사법상 효과는 발생한다.", false, "▸ '상계'항변 했으나 '조정 성립'되어 수동채권 존재에 관한 법원 실질적 판단 이뤄지지 않은 경우는 상계항변의 사법상 효과도 발생 X ∵ 상계는 예비적 항변 [2011다3329]", "소송상형성권"],
  ["6_064.④", "★ 원고가 피고에 대한 계약해제의 의사표시를 소장·준비서면에 기재하여 행사한 후에, 소가 취하·각하되더라도 그 효과가 소급적으로 소멸하지는 않는다.", true, "▸ 소제기로 '해제권' 행사했다가 소 취하했어도 해제권은 형성권이므로 행사의 효력 有, 영향 無 [80다916]", "소송상형성권"],
  // 소송상합의,
  ["6_065.①", "★ 소취하합의의 의사표시 역시 민법 제109조에 따라 법률행위의 내용의 중요 부분에 착오가 있는 때에는 취소할 수 있다.", true, "▸ 소취하합의 의사표시도 민법 109조 법률행위 내용 중요부분 착오 있다면 착오 취소 O → 취소하려는 자가 법률행위 내용에 착오 있고 착오가 없었더라면 의사표시 않았을 것이라는 점을 증명해야 [2020다227523]", "소송상합의"],
  // 불출석기일기간,
  ["6_066.①", "★ 변론기일에 한쪽 당사자가 불출석한 경우에 법원의 재량으로 출석한 당사자만으로 변론을 진행할 때에는 반드시 불출석한 당사자가 그때까지 제출한 소장·답변서, 그 밖의 준비서면에 적혀 있는 사항을 진술한 것으로 보아야 한다.", true, "▸ 148조 1항은 변론기일에 한쪽 당사자 불출석한 경우에 변론을 진행하느냐 기일을 연기하느냐는 법원의 재량이지만 출석한 당사자만으로 변론 진행하기로 결정한 경우에는 불출석한 당사자의 서면에 적힌 사항을 반드시 진술간주 해야 한다는 것 [2008다2890]", "불출석기일기간"],
  ["6_066.③", "★ 양쪽 당사자가 2회에 걸쳐 변론기일에 출석하지 아니하거나 출석하더라도 변론을 하지 아니한 때에는 법원은 당사자의 기일지정신청에 의하여 기일을 지정하여야 할 것이나, 법원이 두 번째 불출석 기일에 직권으로 신기일을 지정한 때에는 당사자의 기일지정신청에 의한 기일지정이 있는 경우와 마찬가지로 보아야 한다.", true, "▸ 268조 2항 규정 의하면 당사자 쌍방이 2회 불출석한 경우 법원이 두 번째 불출석의 기일에 직권으로 신기일을 지정했다면 당사자 기일지정신청에 의한 기일지정 있는 경우와 마찬가지로 보아야 [93다56442]", "불출석기일기간"],
  ["6_066.④", "★ 양쪽 당사자가 변론준비기일에 1회, 변론기일에 1회 불출석하면 변론준비기일의 불출석 효과는 변론기일에 승계된다.", false, "▸ 양쪽이 변론준비기일에 1회, 변론기일에 2회 불출석인 경우 소 취하간주 X ∵ 변론준비기일은 직접주의·공개주의 후퇴하여 변론기일과 일체성 X, 취하간주는 당사자에게 불리한 제도 → 변론준비기일 불출석의 효과는 변론기일에 승계 X [2004다69581] → 이 경우 총 2회 불출석이므로 법원은 기일지정신청 기다렸어야\n지문의 경우 총 1회 쌍불이므로 법원은 반드시 기일지정해야", "불출석기일기간"],
  ["6_066.⑤", "★ 변론기일의 송달절차가 적법하지 아니한 이상 비록 그 송달이 유효하고 그 변론기일에 양쪽 당사자가 출석하지 아니하였더라도 그에 따른 양쪽 당사자 불출석의 효과는 발생하지 않는다.", true, "▸ 양쪽 불출석 취하간주의 불출석은 '적법한' 절차 송달 받고도 출석 않는 것 → 송달장소 알 수 없는 경우 아님 명백함에도 재판장이 공시송달 명한 경우라면 공시송달 유효하나 적법 X → 양쪽 불출석 효과 발생 X[96므1380]", "불출석기일기간"],
  ["6_067.ㄴ", "★ 변론준비기일은 변론이 효율적이고 집중적으로 실시될 수 있도록 당사자의 주장과 증거를 정리하기 위한 것으로서 그 이후에 진행되는 변론기일과 일체성이 있으므로, 변론준비기일에서의 양 쪽 당사자 불출석의 효과는 변론기일에 승계된다.", false, "▸ 양쪽이 변론준비기일에 1회, 변론기일에 2회 불출석인 경우 소 취하간주 X ∵ 변론준비기일은 직접주의·공개주의 후퇴하여 변론기일과 일체성 X, 취하간주는 당사자에게 불리한 제도 → 변론준비기일 불출석의 효과는 변론기일에 승계 X [2004다69581]", "불출석기일기간"],
  ["6_068.⑤", "★ 제1심에서 당사자 쌍방이 변론기일에 결석하여 법원이 새로운 기일을 정하고 그것을 당사자 쌍방에게 통지하였지만 그 새로운 기일에도 쌍방 모두 결석한 후 1월 이내에 당사자의 기일지정신청이 없으면, 소를 취한 것으로 본다.", true, "제268조(양 쪽 당사자가 출석하지 아니한 경우) ① 양 쪽 당사자가 변론기일에 출석하지 아니하거나 출석하였다 하더라도 변론하지 아니한 때에는 재판장은 다시 변론기일을 정하여 양 쪽 당사자에게 통지하여야 한다. ② 제1항의 새 변론기일 또는 그 뒤에 열린 변론기일에 양 쪽 당사자가 출석하지 아니하거나 출석하였다 하더라도 변론하지 아니한 때에는 1월 이내에 기일지정신청을 하지 아니하면 소를 취한 것으로 본다.", "불출석기일기간"],
  ["SS민소11.②", "항소심에서도 양쪽 당사자가 변론기일에 2회 불출석하고 기일지정신청에 따라 새로 지정된 변론기일에 또 불출석한 때에는 소를 취한 것으로 본다.", false, "제268조(양 쪽 당사자가 출석하지 아니한 경우) ④ 상소심의 소송절차에는 제1항 내지 제3항의 규정을 준용한다. 다만, 상소심에서는 상소를 취한 것으로 본다.\n▸ 항소심에서는 '항소' 취하 간주임에 유의할 것", "불출석기일기간"],
  ["SS민소11.③", "파기환송 전 1회, 환송 후 1회와 같이 환송판결의 전후를 통하여 변론기일에 양쪽 당사자의 불출석이 2회 있었더라도 일단 항소심을 이탈하여 상고심에 계속되었던 것이므로 소의 취가가 있는 것으로 볼 수 없다.", true, "▸ 2, 3회의 불출석은 같은 심급 및 '같은 종류' 기일일 것 → 환송전 ≠ 환송후, 변론준비기일 ≠ 변론기일", "불출석기일기간"],
  ["6_069.④", "甲은 乙에게 甲 소유의 X 토지를 임대하였고, 乙은 X 토지 위에 Y 건물을 소유하고 있다. 甲은 乙을 상대로 임대차계약기간이 만료하였음을 이유로 Y 건물의 철거 및 X 토지의 인도를 구하는 소를 제기하였다.§★ 乙이 甲의 청구원인사실을 다투는 취지의 답변서를 제출하고 변론기일에 출석하지 아니한 경우 법원은 변론기일에 출석한 甲에게 변론을 명하여야 한다.", false, "제148조(한 쪽 당사자가 출석하지 아니한 경우) ① 원고 또는 피고가 변론기일에 출석하지 아니하거나, 출석하고서도 본안에 관하여 변론하지 아니한 때에는 그가 제출한 소장·답변서, 그 밖의 준비서면에 적혀 있는 사항을 진술한 것으로 보고 출석한 상대방에게 변론을 명할 수 있다.\n▸ '명할 수 있는' 것이므로 '명하여야' 한다고 서술하면 틀린 지문임", "불출석기일기간"],
  ["6_070.ㄱ", "★ 원고가 피고의 주소를 허위로 기재하여 피고가 아닌 원고에게 소장부본이 송달되어 자백간주에 의한 원고승소판결이 선고되고 판결정본 역시 위와 같은 방법으로 송달된 것으로 처리되었다면, 판결정본은 피고에게 적법하게 송달되었다고 할 수 없으므로 그 판결은 형식적으로 확정되었다고 할 수 없어 소송행위의 추후보완 문제는 발생하지 않는다.", true, "▸ 원고가 피고 주소 거짓으로 기재하여 판결정본을 원고 측 스스로 수령하는 경우 송달 무효, 항소기간 진행 X → 소송행위 추완 X → 항소가 판결정본 송달 전에 제기된 것으로서 적법 [97다10345] → 항소 O (다만 당사자가 추완 항소로 제기하면 통상의 항소로 선해 O)", "불출석기일기간"],
  ["6_070.ㄹ", "★ 소장부본이 적법하게 송달되어 소송이 진행되던 중 통상의 방법으로 소송서류를 송달할 수 없게 되어 판결정본을 공시송달의 방법으로 송달한 경우에 당사자가 소송의 진행상황을 조사하지 않아 항소기간이 경과하였다면 항소의 추후보완사유가 되지 않는다.", true, "▸ 소송진행 도중에 공시송달로 된 경우에는 '책임질 수 없는 사유' X, 추완항소 X ∵ 소송당사자로서 소송진행 상황을 조사할 의무 O [2012다44730]", "불출석기일기간"],
  ["6_071.①", "★ 불변기간에 대하여, 법원은 그 기간을 늘이거나 줄일 수는 없으나, 주소 또는 거소가 멀리 떨어진 곳에 있는 사람을 위하여 부가기간을 정할 수는 있다.", true, "제172조(기간의 신축, 부가기간) ① 법원은 법정기간 또는 법원이 정한 기간을 늘이거나 줄일 수 있다. 다만, 불변기간은 그러하지 아니하다. ② 법원은 불변기간에 대하여 주소 또는 거소가 멀리 떨어진 곳에 있는 사람을 위하여 부가기간을 정할 수 있다.", "불출석기일기간"],
  ["6_071.④", "■보충 기일은 기일통지서 또는 출석요구서를 송달하여 통지하는데, 다만 그 사건으로 출석한 사람에게는 기일을 직접 고지하면 된다.", true, "제167조(기일의 통지) ① 기일은 기일통지서 또는 출석요구서를 송달하여 통지한다. 다만, 그 사건으로 출석한 사람에게는 기일을 직접 고지하면 된다.", "불출석기일기간"],
  ["6_071.⑤", "★ 당사자가 변론기일 통지서를 송달받은 바 없는 경우 그 당사자가 변론기일에 임의출석하여 그 변론기일을 통지받지 못한 것에 대해 즉시 이의를 제기하지 않고 변론을 하였다 하더라도 법원의 기일통지는 헌법상 재판청구권과 관련된 것으로서 임의로 처분할 수 없으므로 그 흠이 치유되지 않는다.", false, "▸ 보조참가인에게 기일통지서·출석요구서 송달하지 않아 변론 기회 부여 없이 채 행해진 기일 진행은 위법 → 다만 송달받지 못한 보조참가인이 변론기일에 직접 출석하여 변론할 기회 가졌고, 기일통지서 송달받지 못한 점에 이의하지 않았다면 기일통지 하지 않은 절차 진행상 흠은 치유 O [2006다75641], 당사자인 경우도 동일 [82므14]", "불출석기일기간"],
  ["6_072.①", "양 당사자가 조정기일에 출석하였으나 조정이 불성립으로 종결된 후, 피신청인이 주소가 변경되었음에도 주소변경신고를 하지 않은 상태에서 조정이 소송으로 이행되어 공시송달로 소송이 진행된 경우, 피신청인에게 소송의 진행상황을 조사할 의무가 있으므로, 피신청인이 상소제기의 불변기간을 지키지 못하였다면 이는 당사자가 책임질 수 없는 사유로 말미암은 것에 해당하지 않는다.", false, "▸ 조정 불성립으로 종결된 후 피신청인 주소 변경되었음에도 조정법원에 주소변경신고 하지 않은 상태에서 민사조정법에 따라 조정이 소송으로 이행 → 통상 방법으로 변론기일통지서 등 소송서류 송달할 수 없게 되어 발송송달·공시송달하였다면 '책임질 수 없는 사유' O ∵ 처음부터 소장 부본 적법 송달된 경우와 다름, 소송 진행상황 조사 의무 없음 [2015다213322]", "불출석기일기간"],
  ["6_072.②", "★ 피고가 소송계속 중 교도소에 수감되었음에도 법원이 판결정본을 교도소장에게 송달하지 않고 피고 주소지로 공시송달을 한 것은 공시송달의 요건을 갖추지 못한 하자가 있으나 재판장의 명령에 따라 공시송달을 한 이상 송달의 효력은 있고, 다만 피고는 과실 없이 제1심판결의 송달을 알지 못하여 책임질 수 없는 사유로 항소기간을 준수할 수 없었던 때에 해당하므로 그 사유가 없어진 후 2주일 내에 추완항소를 할 수 있다.", true, "▸ 당사자가 소송 계속 중 수감된 경우 법원이 판결정본을 제182조에 따라 교도소장 등에게 송달하지 않고 당사자 주소 등에 공시송달했다면 공시송달 하자 있더라도 재판장 명령이므로 송달 유효 O → 수감된 당사자는 185조 송달장소 변경 신고의무 없어 과실 없이 판결 송달 알지 못하여 '책임 질 수 없는 사유' O [2019다220618]", "불출석기일기간"],
  ["6_072.④", "★ 소장부본과 판결정본 등이 공시송달의 방법에 의하여 송달된 경우, 당사자는 책임질 수 없는 사유가 없어진 날부터 2주 이내에 게을리 한 소송행위를 보완할 수 있는데, 여기서 사유가 없어진 날이라고 함은 당사자나 소송대리인이 단순히 판결이 있었던 사실을 안 때가 아니고 나아가 그 판결이 공시송달의 방법으로 송달된 사실을 안 때를 가리키는 것으로서, 당사자나 소송대리인이 사건기록의 열람을 하거나 또는 새로이 판결정본을 영수한 때에 비로소 판결이 공시송달의 방법으로 송달된 사실을 알게 되었다고 보아야 한다.", true, "▸ 공시송달로 진행된 경우 제173조 제1항의 '사유가 없어진 날'은 당사자나 소송대리인이 단순히 판결이 있었던 사실을 안 때 X → 그 판결이 공시송달 방법으로 송달된 사실을 안 때 O [94다24299]", "불출석기일기간"],
  ["6_072.⑤", "■보충 판결의 선고 및 송달 사실을 알지 못하여 자신이 책임질 수 없는 사유로 말미암아 불변기간인 상소기간을 지키지 못하게 되었다는 사정은 상소를 추후보완하고자 하는 당사자 측에서 주장·증명하여야 한다.", true, "▸ 판결 선고·송달 사실 알지 못하여 책임질 수 없는 사유로 불변기간인 상소기간 지키지 못했다는 사정은 추완상소하는 당사자 측에서 주장·증명하여야 [2019다244980]", "불출석기일기간"],
  ["6_073.①", "★ 첫 변론기일 또는 첫 변론준비기일을 바꾸는 것은 현저한 사유가 있고 당사자들이 합의한 경우에만 이를 허가한다.", false, "제165조(기일의 지정과 변경) ② 첫 변론기일 또는 첫 변론준비기일을 바꾸는 것은 현저한 사유가 없는 경우라도 당사자들이 합의하면 이를 허가한다.", "불출석기일기간"],
  ["6_073.②", "★ 당사자와 그 소송대리인의 변론기일 출석 여부는 변론조서의 기재에 의하여만 증명할 수 있는 것은 아니나, 그 출석 여부에 관한 변론조서의 기재는 다른 특별한 사정이 없는 한 그 내용이 진실한 것이라는 점에 관한 강한 증명력을 갖는다.", false, "제158조(조서의 증명력) 변론방식에 관한 규정이 지켜졌다는 것은 조서로만 증명할 수 있다.\n▸ 변론기일 출석 여부 등 변론방식 준수 문제는 오로지 변론조서 기재로만 증명할 수 있음이 원칙", "불출석기일기간"],
  // 송달,
  ["6_074.①", "★ 당사자가 소송계속 중 수감된 경우에 법원이 판결정본을 교도소장 등에게 송달하지 않고서 당사자 주소 등에 재판장의 명령에 따라 공시송달의 방법으로 송달하였다면, 이는 공시송달의 요건을 갖추지 못한 하자가 있는 것으로서 무효이다.", false, "▸ 소송 계속 중 수감된 당사자에 대해 법원이 판결정본을 제182조에 따라 교도소장 등에게 송달하지 않고 당사자 주소 등에 '공시송달' → 공시송달 요건 하자 O, 그러나 재판장 명령에 따른 공시송달이므로 송달 유효 O → 수감된 당사자는 제185조 송달장소 변경 신고의무 없어 과실 없이 판결 송달 알지 못하여 '책임 질 수 없는 사유' O [2019다220618]", "송달"],
  ["6_074.②", "★ 공시송달의 방법으로 기일통지서를 송달받은 당사자가 답변서나 준비서면 등을 제출하지 않은 채 당해 변론기일에 출석하지 않은 경우에는 상대방의 주장사실을 자백한 것으로 간주되지 않는다.", true, "제150조(자백간주) ③ 당사자가 변론기일에 출석하지 아니하는 경우에는 제1항의 규정을 준용한다. 다만, 공시송달의 방법으로 기일통지서를 송달받은 당사자가 출석하지 아니한 경우에는 그러하지 아니하다.", "송달"],
  ["6_074.③", "★ 동일한 당사자를 위하여 수인의 소송대리인이 소송을 수행하는 경우에 법원은 판결정본을 수인의 소송대리인에게 각각 송달하여야 하지만, 이 경우 당사자에 대한 판결정본 송달의 효력은 소송대리인 중 1인에게 최초로 송달되었을 때 발생하고 항소기간 역시 소송대리인 중 1인에게 최초로 판결정본이 송달되었을 때부터 기산된다.", true, "▸ 여러 사람이 공동대리권 행사시 1인에게 송달 가능한 180조는 여러 명의 '소송대리인'에게는 적용 여지 X ∵ 93조 각자대리 원칙 → 법원은 판결정본을 각각의 소송대리인에게 송달하여야 → 다만 소송대리인 중 1인에게 최초로 판결정본 송달 시에 당사자에 대한 판결정본 송달의 효력 발생, 그때부터 항소기간 기산 [2011마1335]", "송달"],
  ["6_074.④", "★ 우편송달은 본인에 대한 교부송달은 물론 보충송달이나 유치송달도 불가능한 경우이거나 당사자 등이 송달장소의 변경신고의무를 이행하지 아니하고 기록에 현출된 자료만으로는 달리 송달장소를 알 수 없는 경우에 허용된다.", true, "▸ ① 보충송달·유치송달도 불가능한 경우(제187조), ② 당사자 등이 송달장소변경신고의무 불이행하여 송달장소 알 수 없는 경우(제185조 제2항) → 위 2가지 경우에 한하여, 대법원 규칙이 정하는 '등기우편' 방식에 의해 발송하고 (규칙 제51조), 이때는 발송한 때에 송달된 것으로 간주(제189조, 발신주의)", "송달"],
  ["6_075.②", "★ 법인의 대표자가 사망하고 달리 법인을 대표할 자도 정하여지지 아니하였기 때문에 법인에 대하여 송달을 할 수 없는 경우 공시송달도 할 수 없다.", true, "▸ 법인에 대한 송달은 대표자에게 하여야(64조, 179조) → 법인의 대표자가 사망하고 새로 대표자 정해지지 않은 상태에서는 법인에 대하여 송달할 수 X → 공시송달도 무효 [91다9985]", "송달"],
  ["6_076.⑤", "★ 「민사소송법」 제187조에 정한 우편송달은 같은 법 제186조에 따른 보충송달, 유치송달 등이 불가능할 것을 요건으로 하는바, 일단 위 요건이 구비되어 우편송달이 이루어진 이상 그 이후에 송달할 서류는 위 요건의 구비 여부를 불문하고 위 조문에 정한 우편송달을 할 수 있다.", false, "▸ 우편송달은 해당 서류에 한하며 그에 이은 별개 서류는 따로 요건 구비해야 우편송달 가능 [89마939] → 우편송달의 일회성", "송달"],
  ["6_077.④", "★ 재판장은 직권으로 법원사무관등의 공시송달처분을 취소할 수 없다.", false, "제194조(공시송달의 요건) ④ 재판장은 직권으로 또는 신청에 따라 법원사무관등의 공시송달처분을 취소할 수 있다.", "송달"],
  ["6_078.④", "★ 당사자·법정대리인 또는 소송대리인이 송달받을 장소를 바꾸고도 그러한 취지의 신고를 하지 아니하고 달리 송달할 장소를 알 수 없는 경우, 그 사람에게 송달할 서류는 종전에 송달받던 장소에 등기우편으로 발송할 수 있다.", true, "제185조(송달장소변경의 신고의무) ① 당사자·법정대리인 또는 소송대리인이 송달받을 장소를 바꿀 때에는 바로 그 취지를 법원에 신고하여야 한다. ② 제1항의 신고를 하지 아니한 사람에게 송달할 서류는 달리 송달할 장소를 알 수 없는 경우 종전에 송달받던 장소에 대법원규칙이 정하는 방법으로 발송할 수 있다.\n민사소송규칙 제51조(발송의 방법) 법 제185조 제2항과 법 제187조의 규정에 따른 서류의 발송은 등기우편으로 한다.", "송달"],
  ["6_079.②", "★ 소송서류는 특별한 규정이 없는 한 원본으로 송달하여야 하며, 소송대리인이 있는 경우에도 당사자 본인에 한 송달은 유효하다.", false, "제178조(교부송달의 원칙) ① 송달은 특별한 규정이 없으면 송달받을 사람에게 서류의 등본 또는 부본을 교부하여야 한다.\n▸ 소송대리인이 있는 경우 당사자 본인에 송달해도 유효 O [70마325]", "송달"],
  ["6_079.③", "★ 송달의 방법은 교부송달이 원칙이고, 우편송달의 경우 발송 시에 송달된 것으로 본다.", true, "제178조(교부송달의 원칙) ① 송달은 특별한 규정이 없으면 송달받을 사람에게 서류의 등본 또는 부본을 교부하여야 한다.\n제189조(발신주의) 제185조 제2항 또는 제187조의 규정에 따라 서류를 발송한 경우에는 발송한 때에 송달된 것으로 본다.", "송달"],
  ["SS민소12.①", "이혼소송에서 '원고와 피고는 이혼한다'는 내용의 화해권고결정이 내려졌고 원고와 피고의 성년 자녀이자 동거인인 甲이 원고와 피고를 대신하여 화해권고결정정본을 송달받은 경우, 甲이 원고와 피고의 허락을 받았다는 등의 특별한 사정이 없는 한 그러한 보충송달은 무효이다.", true, "▸ 동일한 수령대행인이 이해 대립 소송당사자 쌍방을 대신하여 소송서류를 동시에 수령한다면, 원고나 피고 중 한 명과도 이해관계 상충 없이 중립적 지위 있기 쉽지 않으므로 소송당사자 쌍방 모두에게 제대로 전달 합리적 기대 X → 민법 제124조 쌍방대리금지 원칙도 위반 → 소송당사자 허락 등 특별한 사정 없는 한, 동일한 수령대행인이 소송당사자 쌍방 소송서류 동시 송달받을 수 O, 보충송달 무효 [2020므11658]", "송달"],
  ["SS민소12.②", "소송서류가 당사자와 소송대리인에게 모두 송달되었다면 당사자 또는 그 소송대리인 중 먼저 도달한 것을 기준으로 송달의 효력을 따져야 한다.", true, "▸ 당사자가 등록사용자 아니거나 전산정보처리시스템 이용 민사소송 등 진행 동의한 바 없다면, 소송대리인 선임했어도 소송서류를 본인에게 우편 송달하여도 위법 아님 → 소송서류가 당사자와 소송대리인에게 모두 송달되었다면 당사자 또는 그 소송대리인 중 먼저 도달한 것을 기준으로 송달 효력 따져야 [2024다236211]", "송달"],
  ["SS민소13.①", "甲은 乙을 상대로 부당이득반환 청구의 소를 제기하였다. 제1심법원은 乙이 미성년자임을 간과한 채 乙에 대한 송달을 실시한 후 송달불능을 이유로 공시송달로 변론을 진행하였다. 제1심법원은 甲의 청구를 인용하는 판결을 하였고, 판결정본 역시 乙에 대한 공시송달의 방법으로 송달되었다. 乙은 제1심판결 존재 및 내용을 안 날로부터 14일이 경과한 후에 추완항소를 제기하였다. 항소심법원은 직권으로 乙의 추완항소를 각하하였다.§제1심법원의 乙에 대한 판결정본의 공시송달은 적법하다.", false, "▸ ①②③④⑤ 해설 : 미성년자 단독으로 한, 미성년자에 대한 소송행위는 무효(제55조) → 판결정본이 미성년자에게만 송달되면, 소송무능력 이유로 소 각하한 판결이라는 등 특별한 사정 없는 한, 송달 부적법·무효 → 상소기간 진행 X, 이의권 포기·상실 X → 소송능력 존재, 상소기간 준수 여부는 소송요건, 직권조사사항 [2020다8586]", "송달"],
  ["SS민소13.②", "甲은 乙을 상대로 부당이득반환 청구의 소를 제기하였다. 제1심법원은 乙이 미성년자임을 간과한 채 乙에 대한 송달을 실시한 후 송달불능을 이유로 공시송달로 변론을 진행하였다. 제1심법원은 甲의 청구를 인용하는 판결을 하였고, 판결정본 역시 乙에 대한 공시송달의 방법으로 송달되었다. 乙은 제1심판결 존재 및 내용을 안 날로부터 14일이 경과한 후에 추완항소를 제기하였다. 항소심법원은 직권으로 乙의 추완항소를 각하하였다.§제1심법원의 乙에 대한 판결정본의 공시송달은 부적법하나 효력은 있다.", false, "▸ 위 해설 참조 → 송달 부적법·무효", "송달"],
  ["SS민소13.③", "甲은 乙을 상대로 부당이득반환 청구의 소를 제기하였다. 제1심법원은 乙이 미성년자임을 간과한 채 乙에 대한 송달을 실시한 후 송달불능을 이유로 공시송달로 변론을 진행하였다. 제1심법원은 甲의 청구를 인용하는 판결을 하였고, 판결정본 역시 乙에 대한 공시송달의 방법으로 송달되었다. 乙은 제1심판결 존재 및 내용을 안 날로부터 14일이 경과한 후에 추완항소를 제기하였다. 항소심법원은 직권으로 乙의 추완항소를 각하하였다.§상고기간의 준수 여부는 직권조사사항이 아니므로 항소심법원이 직권으로 乙의 추완항소를 각하한 것은 위법하다.", false, "▸ 위 해설 참조 → 소송능력 존재, 상소기간 준수 여부는 소송요건, 직권조사사항", "송달"],
  ["SS민소13.④", "甲은 乙을 상대로 부당이득반환 청구의 소를 제기하였다. 제1심법원은 乙이 미성년자임을 간과한 채 乙에 대한 송달을 실시한 후 송달불능을 이유로 공시송달로 변론을 진행하였다. 제1심법원은 甲의 청구를 인용하는 판결을 하였고, 판결정본 역시 乙에 대한 공시송달의 방법으로 송달되었다. 乙은 제1심판결 존재 및 내용을 안 날로부터 14일이 경과한 후에 추완항소를 제기하였다. 항소심법원은 직권으로 乙의 추완항소를 각하하였다.§소송능력의 존재는 직권조사사항이 아니므로 항소심법원이 직권으로 乙의 추완항소를 각하한 것은 위법하다.", false, "▸ 위 해설 참조 → 소송능력 존재, 상소기간 준수 여부는 소송요건, 직권조사사항", "송달"],
  ["SS민소13.⑤", "제1심판결에 대한 항소기간은 진행하지 않는다.", true, "▸ 위 해설 참조 → 송달 부적법·무효 → 상소기간 진행 X", "송달"],
  ["6_080.ㄱ", "★ 여러 사람이 공동으로 대리권을 행사하는 경우의 송달은 그 가운데 한 사람에게 하면 되므로, 당사자에게 여러 소송대리인이 있는 때에는 법원은 판결정본을 송달함에 있어 그 중 1명의 소송대리인에게 송달하면 된다.", false, "▸ 여러 사람이 공동대리권 행사시 1인에게 송달 가능한 180조는 여러 명의 '소송대리인'에게는 적용 여지 X ∵ 93조 각자대리 원칙 → 법원은 판결정본을 각각의 소송대리인에게 송달하여야 [2011마1335]", "송달"],
  ["6_080.ㄴ", "소송당사자가 법인인 경우 그 대표자에게 소장 등을 송달하여야 하고, 그 송달은 법인 대표자의 주소, 거소, 영업소 또는 사무소에서 함이 원칙인데, 여기서 '영업소 또는 사무소'라 함은 당해 법인의 영업소 또는 사무소를 말하므로, 그 대표자가 겸임하고 있는 별도의 법인격을 가진 다른 법인의 영업소 또는 사무소는 이에 해당하지 않는다.", true, "▸ 법인에게로 소장 등 서류는 그 대표자에게 송달하여야, 그 송달은 법인 대표자의 주소, 거소, 영업소·사무소에서 함이 원칙 → '영업소 또는 사무소'는 당해 법인의 영업소·사무소 의미 O, 그 대표자가 겸임하고 있는 별도 법인격 가진 다른 법인의 영업소·사무소는 X, 이는 그 대표자의 근무처에 불과 [2000다60197]", "송달"],
  ["6_080.ㄷ", "★ 원고가 소권을 남용하여 청구가 이유 없음이 명백한 소를 반복적으로 제기한 것에 대하여 법원이 변론 없이 판결로 소를 각하하는 경우라 하더라도 재판장은 직권으로 피고에 대하여 공시송달을 명할 수는 없다.", false, "제194조(공시송달의 요건) ④ 원고가 소권(항소권을 포함한다)을 남용하여 청구가 이유 없음이 명백한 소를 반복적으로 제기한 것에 대하여 법원이 변론 없이 판결로 소를 각하하는 경우에는 재판장은 직권으로 피고에 대하여 공시송달을 명할 수 있다. [시행일 2023.10.19]", "송달"],
  ["6_080.ㄹ", "★ 교도소에 수감된 사람에게 할 송달을 교도소장에게 하지 아니하고 수감되기 전의 종전 주·거소에 하였다면 부적법하여 무효이고, 법원이 당사자의 수감 사실을 모른 채 종전 주·거소에 송달하였다고 하여도 마찬가지로 송달의 효력은 발생하지 않는다.", true, "▸ 제182조에 비추어 수감된 당사자에 대한 송달을 교도소장 등에게 하지 않고 당사자의 종전 주소·거소로 하면 부적법한 송달로서 무효, 이는 법원이 당사자가 수감된 사실을 몰랐거나 수감된 당사자가 송달 대상 서류 내용을 알았더라도 마찬가지 [2021다53]", "송달"],
  ["6_081.ㄱ", "당사자가 다른 소송의 재판절차에서 송달받은 준비서면 등에 당해 사건의 제1심 판결문과 확정증명원 등이 첨부된 경우에는 그 시점에 제1심 판결의 존재 및 공시송달의 방법으로 송달된 사실까지 알았다고 볼 것이지만, 다른 소송에서 선임된 소송대리인이 그 재판절차에서 위와 같은 준비서면 등을 송달받았다는 사정만으로 이를 당사자가 직접 송달받은 경우와 동일하게 볼 수는 없다.", true, "▸ 추완항소에 있어서, 다른 소송 재판절차에서 송달받은 준비서면 등에 당해 사건 1심 판결문과 확정증명원 등이 첨부된 경우는 그 시점에 1심판결 존재 및 공시송달 사실까지 안 것 O → 그러나 다른 소송에서 선임된 소송대리인이 재판절차에서 위와 같은 준비서면 등을 송달받았다는 사정만으로 당사자가 직접 송달받은 경우와 동일하게 볼 수는 X ∵ '당사자 책임질 수 없는 사유'에서 당사자는 본인, 당해 사건 소송대리인, 그 보조인 O, 다른 사건의 소송대리인 X [2021다305796, 2022다231038]", "송달"],
  ["6_081.ㄴ", "★ 같은 소송절차에서 같은 당사자에 대해서 계속적으로 이루어지는 공시송달은 실시한 날로부터 각 2주가 지나야 효력이 생긴다.", false, "제196조(공시송달의 효력발생) ① 첫 공시송달은 제195조의 규정에 따라 실시한 날부터 2주가 지나야 효력이 생긴다. 다만, 같은 당사자에게 하는 그 뒤의 공시송달은 실시한 다음 날부터 효력이 생긴다.", "송달"],
  ["6_081.ㄷ", "원고가 소권을 남용하여 청구가 이유 없음이 명백한 소를 반복적으로 제기한 것에 대하여 법원이 변론 없이 판결로 소를 각하하는 경우에는 재판장은 직권으로 피고에 대하여 공시송달을 명할 수 있다.", true, "제194조(공시송달의 요건) ④ 원고가 소권(항소권을 포함한다)을 남용하여 청구가 이유 없음이 명백한 소를 반복적으로 제기한 것에 대하여 법원이 변론 없이 판결로 소를 각하하는 경우에는 재판장은 직권으로 피고에 대하여 공시송달을 명할 수 있다. [시행일 2023.10.19]", "송달"],
  ["6_082.①", "★ 소송당사자나 대리인이 정당한 사유 없이 송달장소에서 소송서류의 수령을 거부하는 경우, 법원은 바로 우편송달을 실시할 수 있다.", false, "제186조(보충송달·유치송달) ③ 서류를 송달받을 사람 또는 제1항의 규정에 의하여 서류를 넘겨받을 사람이 정당한 사유 없이 송달받기를 거부하는 때에는 송달할 장소에 서류를 놓아둘 수 있다.\n제187조(우편송달) 제186조의 규정에 따라 송달할 수 없는 때에는 법원사무관등은 서류를 등기우편 등 대법원규칙이 정하는 방법으로 발송할 수 있다.\n▸ 유치송달 먼저 → 유치송달 불가능할 때 우편송달", "송달"],

  ["6_089.①", "甲은 乙을 상대로 불법행위에 기한 손해배상청구소송을 제기하였다. 甲이 소송계속 중 사망하였는데, 甲에게는 상속인으로 丙과 丁이 있었으나 법원은 丁의 존재를 알지 못하였다. 甲에게는 변호사 A가 소송대리를 하고 있었기 때문에 소송은 중단되지 않았다.§★ 甲이 사망하였으므로 소송절차가 중단되는 것이 원칙이나, 소송대리인 A가 있으므로 소송절차는 중단되지 않는다.", true, "제238조(소송대리인이 있는 경우의 제외) 소송대리인이 있는 경우에는 제233조 제1항, 제234조 내지 제237조의 규정을 적용하지 아니한다.", "중단수계"],
  ["6_089.②", "甲은 乙을 상대로 불법행위에 기한 손해배상청구소송을 제기하였다. 甲이 소송계속 중 사망하였는데, 甲에게는 상속인으로 丙과 丁이 있었으나 법원은 丁의 존재를 알지 못하였다. 甲에게는 변호사 A가 소송대리를 하고 있었기 때문에 소송은 중단되지 않았다.§★ 甲의 사망 후 원고는 상속인인 A, B, C가 되고 甲에 의해 선임된 소송대리인 丙은 상속인들 모두의 대리인이 된다.", true, "▸ 소송계속 중 당사자 사망해도 소송대리인이 있으면 소송절차 중단되지 않고 소송대리권도 소멸하지 않음 → 망인의 소송대리인은 상속인들로부터 새로 수권 받을 필요 없이 법률상 당연히 상속인들의 소송대리인 O, 상속인들 모두를 위하여 소송 수행 O, 그 판결은 상속인들 모두에게 효력 O, 수계하지 않은 상속인에게도 판결의 효력 O [2007다22859]", "중단수계"],
  ["6_089.③", "甲은 乙을 상대로 불법행위에 기한 손해배상청구소송을 제기하였다. 甲이 소송계속 중 사망하였는데, 甲에게는 상속인으로 丙과 丁이 있었으나 법원은 丁의 존재를 알지 못하였다. 甲에게는 변호사 A가 소송대리를 하고 있었기 때문에 소송은 중단되지 않았다.§★ 상소제기의 특별수권을 받은 변호사 A가 판결의 송달을 받은 후 유일한 상속인으로 알고 있는 丙에게만 판결정본을 전달하여 丙이 상소를 제기하였으나 丁은 판결의 존재를 알지 못하여 상소제기기간을 도과한 경우 丁과 상대방 사이의 판결은 상소제기기간의 도과 시에 확정된다.", true, "▸ [91마342] → 소송대리인 A에게 특별수권 있어서 판결 정본 송달 시부터 상소기간은 진행되는데, 소송대리인 A가 아니라 상속인 丙이 스스로 상소를 제기했으므로 丁에 대해서는 상소제기가 되지 않아 丁은 계속 중단된 상태이므로 판결 확정되지 않음\n지문: 상소제기의 특별수권을 받은 변호사 A가 판결의 송달을 받고 유일한 상속인으로 알고 있는 丙에게만 판결정본을 전달하여 丙은 상소를 제기하였으나 丁은 판결의 존재를 알지 못하여 상소제기기간을 도과한 경우 → 여기서 丙 '혼자' 상소를 제기한 것이므로 丁에 대해서 상소가 제기되지 않은 것 → 丁은 계속 중단된 상태로 판결 확정 안 됨 (O지문)", "중단수계"],
  ["6_089.④", "甲은 乙을 상대로 불법행위에 기한 손해배상청구소송을 제기하였다. 甲이 소송계속 중 사망하였는데, 甲에게는 상속인으로 丙과 丁이 있었으나 법원은 丁의 존재를 알지 못하였다. 甲에게는 변호사 A가 소송대리를 하고 있었기 때문에 소송은 중단되지 않았다.§★ 상소제기의 특별수권을 받지 않은 변호사 A가 판결의 송달을 받은 경우에는 송달과 동시에 절차가 중단되므로 이 상태에서는 판결은 확정되지 않는다.", true, "▸ 소송대리인 A에게 특별수권이 없어 판결 송달 받아도 상소기간은 진행하지 않으므로, 수계한 丙만 상소를 제기한 경우 丁에 대해서는 상소기가 제기된 것은 아니지만 丁은 계속 중단된 상태이므로 판결 확정되지 않음", "중단수계"],
  ["6_089.⑤", "★ 상소제기의 특별수권을 받지 않은 변호사 A가 판결의 송달을 받고 유일한 상속인으로 알고 있는 丙에게만 판결정본을 전달하여 丙은 상소를 제기하였으나 丁은 상소를 제기하지 않는 경우 丁과 상대방 사이에 판결은 확정되지 않는다.", true, "▸ 소송대리인 A에게 특별수권이 없어 판결 송달 받아도 상소기간 진행하지 않으므로, 수계한 丙만 상소를 제기한 경우 丁에 대해서는 상소가 제기된 것은 아니지만 丁은 계속 중단된 상태이므로 판결 확정되지 않음", "중단수계"],
  ["6_090.③", "甲이 乙에 대한 대여금반환청구소송을 제기하여 소송계속 중 사망하였다. 甲에게는 사망 당시 상속인으로 丙과 丁이 있었으나 법원은 丁의 존재를 알지 못하였다. 甲에게는 변호사 A가 소송대리리를 하고 있었기 때문에 소송은 중단되지 않았다.§★ 상소제기의 특별수권을 받은 변호사 A가 판결의 송달을 받은 후 유일한 상속인으로 알고 있는 丙에게만 판결정본을 전달하여 丙이 상소를 제기하였으나 丁은 판결의 존재를 알지 못하여 상소제기기간을 도과한 경우 丁과 상대방 사이의 판결은 상소제기기간의 도과 시에 확정된다.", true, "▸ [91마342] → 소송대리인 A에게 특별수권 있어서 판결 정본 송달 시부터 상소기간은 진행되는데, 소송대리인 A가 아니라 상속인 丙이 스스로 상소를 제기했으므로 丁에 대해서는 상소제기가 되지 않은 상태에서 상소기간이 도과하면 丁과 상대방 사이의 판결은 확정됨 (O지문)", "중단수계"],
  ["6_090.④", "甲이 乙에 대한 대여금반환청구소송을 제기하여 소송계속 중 사망하였다. 甲에게는 사망 당시 상속인으로 丙과 丁이 있었으나 법원은 丁의 존재를 알지 못하였다. 甲에게는 변호사 A가 소송대리리를 하고 있었기 때문에 소송은 중단되지 않았다.§★ 상소제기의 특별수권을 받지 않은 변호사 A가 판결의 송달을 받은 경우에는 송달 시부터 소송절차가 중단되고 이 상태에서는 판결은 확정되지 않는다.", true, "▸ 소송대리인 A에게 특별수권이 없어 판결 송달 받도록 상소기간은 진행하지 않으므로, 판결 확정되지 않음", "중단수계"],
  // 증거재판상자백,
  ["6_091.ㄴ", "★ 변제자(채무자)와 변제수령자(채권자)는 변제로 소멸한 채무에 관한 보증인 등 이해관계 있는 제3자의 이익을 해하지 않는 이상 이미 급부를 마친 뒤에도 기존의 충당방법을 배제하고 제공된 급부를 어느 채무에 어떤 방법으로 다시 충당할 것인가를 약정할 수 있다.", true, "▸ [민법] 변제자(채무자)와 변제수령자(채권자)는 변제로 소멸한 채무에 관한 보증인 등 이해관계 있는 제3자의 이익을 해하지 않는 이상 이미 급부를 마친 뒤에도 기존 충당방법 배제하고 제공된 급부를 어느 채무에 어떤 방법으로 다시 충당할 것인지 약정 O [2012다118044, 2023다299789]", "증거재판상자백"],
  ["6_091.ㄹ", "★ 법정변제충당 순서의 기준이 되는 이행기나 변제이익에 관한 사항은 법률상 효과여서 그에 관한 진술이 비록 그 진술자에게 불리하더라도 이를 자백이라고 볼 수 없다.", false, "▸ 법정변제충당 순서 정함에 기준이 되는 이행기·변제이익 관련 구체적 사실은 자백 대상 O, 법정변제충당의 순서 자체는 자백 X ∵ 법률 규정 적용에 의해 정해지는 법률상 효과 [98다6763]", "증거재판상자백"],
  ["6_092.①", "★ 법정변제충당의 순서를 정하는 기준이 되는 이행기나 변제이익에 관한 사항은 물론 법정변제충당의 순서 자체에 관한 사항도 자백의 대상이 될 수 있다.", false, "▸ 법정변제충당 순서 정함에 기준이 되는 이행기·변제이익 관련 구체적 사실은 자백 대상 O, 법정변제충당의 순서 자체는 자백 X ∵ 법률 규정 적용에 의해 정해지는 법률상 효과 [98다6763]", "증거재판상자백"],
  ["6_092.②", "★ 당사자 일방이 한 진술에 잘못된 계산이나 기타 표현상의 잘못이 있고, 그 잘못이 분명한 경우에는 상대방이 이를 원용하더라도 자백이 성립하지 않는다.", true, "▸ 잘못된 계산·기재 등 표현상 잘못이 분명한 경우 상대방이 원용한다고 하여 선행자백 성립할 수는 X ∵ 쌍방 주장 일치 X [2018다229564]", "증거재판상자백"],
  ["6_092.③", "★ 당사자 일방이 자진하여 자기에게 불리한 사실상 진술을 한 후 그 상대방이 이를 원용함으로써 그 사실에 관한 당사자 쌍방의 주장이 일치하기 전에는 위 당사자 일방의 불리한 진술은 자백으로서의 효력이 생기지 않는다.", true, "▸ 재판상 자백의 일종인 선행자백은 일방이 자기에게 불리한 사실상 진술을 자진하여 한 후 상대방이 원용함으로써 주장 일치해야 → 원용 전에는 '자인진술'로서 선행자백 X → 상대방 원용 전에 자인진술 철회 자유 O [92다5546]", "증거재판상자백"],
  ["6_092.④", "★ 종중이 당사자인 사건에서 그 종중의 대표자에게 적법한 대표권이 있는지 여부는 자백의 대상이 될 수 없다.", true, "▸ 종중이 당사자인 사건에서 종중 대표자에게 적법한 대표권 존부는 소송요건에 관한 것으로서 직권조사사항이고 자백의 대상 X [2000다42908]", "증거재판상자백"],
  ["6_092.⑤", "甲이 乙을 상대로 제기한 A 토지에 관한 소유권이전등기말소청구 소송에서 乙이 A 토지의 소유권이전등기가 아무런 원인 없이 이루어졌다는 甲의 주장사실을 인정함으로써 자백이 성립된 후, 甲이 새로이 명의신탁 사실을 주장하며 명의신탁해지를 원인으로 한 소유권이전등기를 구하는 것으로 청구취지 및 청구원인을 교환적으로 변경함으로써 원래의 주장사실을 철회하였다면, 乙은 위 등기가 원인 없이 이루어진 것이 아니라는 주장을 할 수 있다.", true, "▸ 소유권이전등기말소청구 사건에서 원인무효 사실에 대한 피고의 자백 성립한 후, 원고가 청구취지·청구원인을 '원인무효' 말소등기청구에서 '명의신탁해지' 소유권이전등기청구로 교환적 변경 → 피고 자백 소멸 ∵ 자백의 대상 없어짐 → 그 후 피고가 자백 내용과 배치되는 주장(=묵시적 철회) → 원고가 원인무효 주장을 예비적 청구원인으로 추가해도 자백 효력 부활 X [95다10204]", "증거재판상자백"],
  ["6_093.②", "★ 재판상 자백을 취소하려면 당사자는 그 자백이 진실에 어긋난다는 것 외에 착오로 말미암은 것임을 아울러 증명하여야 하며, 진실에 어긋난다는 것이 증명되었다고 하여 착오로 말미암은 것으로 추정되지는 않는다.", true, "▸ 자백을 취소하는 당사자는 자백이 진실에 반한다는 것 외에 착오로 인한 것임을 아울러 증명해야 → 진실에 반하는 것이 증명되었다고 하여 착오 사실이 추정되지는 X [94다22897]", "증거재판상자백"],
  ["6_094.④", "★ 상대방에게 송달된 준비서면에 자백에 해당하는 내용이 기재되어 있는 경우, 그것이 변론기일에서 진술 또는 진술간주 되어야 재판상 자백이 성립한다.", true, "▸ 법원에 제출하여 상대방에게 송달된 답변서·준비서면에 자백 해당하는 내용 기재되어 있어도 변론기일·준비기일에서 진술·진술간주 되어야 재판상 자백 성립 O [2014다229870]", "증거재판상자백"],
  ["6_095.③", "甲은 乙에게 매매계약에 기한 매매대금 청구의 소를 제기하면서 매매계약서를 그 증거로 제출하였다. 乙은 제1회 변론기일에서 甲이 주장하는 매매계약 체결사실과 매매계약서의 진정성립을 인정하였다. 그 후 乙은 매매계약 체결사실을 다투고자 한다.§★ 乙의 위 자백이 진실에 어긋난다는 사실이 증명된 경우라면 변론 전체의 취지에 의하여 그 자백이 착오로 인한 것이라는 점을 법원이 인정할 수 있다.", true, "▸ 반진실 사실 증명되면, 법원이 '변론 전체 취지'로 착오 인정 가능 O [2004다13533]\n그러나 착오가 '추정'되는 것은 아니라는 판례와 구별", "증거재판상자백"],
  ["6_096.ㄱ", "★ 불요증사실로서 법원에 현저한 사실은 판결을 하여야 할 법원의 법관이 직무상 경험으로 그 사실의 존재에 관하여 명확한 기억을 하고 있는 사실뿐만 아니라, 기록 등을 조사하여 곧바로 그 내용을 알 수 있는 사실도 포함한다.", true, "▸ 법원에 현저한 사실은 법관이 '직무상' 경험으로 알고 있는 사실, 명확한 기억 혹은 조사로 곧바로 알 수 있는 사실을 포함 O [94다20051]", "증거재판상자백"],
  ["6_096.ㄷ", "★ 원고가 주장한 사실에 대해서 자백간주가 되었다면, 피고는 그 뒤 변론종결시까지 그 사실을 다투더라도 자백간주의 효과를 번복할 수 없다.", false, "▸ 자백간주는 자백과 달리 당사자에 대한 구속력 X → 자백간주 성립 이후 다시 다투어 효과 번복 O\n제1심에서 자백간주 된 사항을 항소심에서 다투어도 실기 각하 아닌 한 효과 번복 가능 O [2004다21305]", "증거재판상자백"],
  ["6_096.ㄹ", "★ 당사자가 주장하지 않았음에도, 법원이 당해 법원의 다른 판결에서 인정한 사실관계를 법원에 현저한 사실로 인정한 것은 변론주의를 위반한 것이다.", true, "▸ 다른 확정판결의 이유 구성하는 사실관계(유력한 증거)는 현저한 사실 X → 당사자 주장 없이 현저한 사실 인정은 위법 [2009다69531]", "증거재판상자백"],
  ["SS민소14.ㄱ", "★ 자기에게 불리한 사실을 먼저 진술한 당사자도 그 후 상대방의 원용이 있기 전에는 자인한 진술을 철회하고 이와 모순되는 진술을 자유로이 할 수 있다.", true, "▸ 재판상 자백의 일종인 선행자백은 일방이 자기에게 불리한 사실상 진술을 자진하여 한 후 상대방이 원용함으로써 주장 일치해야 → 원용 전에는 '자인진술'로서 선행자백 X → 상대방 원용 전에 자인진술 철회 자유 O [92다5546]", "증거재판상자백"],
  ["SS민소14.ㄷ", "★ 소송물의 전제문제가 되는 권리관계나 법률효과를 인정하는 진술은 권리자백으로서 법원을 기속하지 않으며, 상대방의 동의 없이 자유로이 철회할 수 있다.", true, "▸ 재판상 자백은 구체적 사실을 대상으로 → 법률효과 등 권리자백은 자백 X → 철회 자유", "증거재판상자백"],
  ["SS민소14.ㄹ", "★ 소유권이전등기말소청구소송에서 피고가 등기원인이 무효라는 원고의 주장사실을 자백하였는데, 원고가 청구취지 및 청구원인을 명의신탁해지에 기한 소유권이전등기청구로 교환적으로 변경함으로써 원래의 주장사실을 철회한 경우, 피고의 자백의 효력도 소멸한다.", true, "▸ 소유권이전등기말소청구 사건에서 원인무효 사실에 대한 피고의 자백 성립한 후, 원고가 교환적 변경 → 피고 자백 소멸 ∵ 자백의 대상 없어짐 [95다10204]", "증거재판상자백"],
  ["SS민소15.ㄴ", "법원에 현저한 사실은 법관이 직무상 경험으로 알고 있는 사실뿐만 아니라 기록상 법관이 알 수 있는 사실도 포함되지만, 다른 사건의 기록에서 알 수 있는 사실은 특별한 사정이 없는 한 법원에 현저한 사실로 볼 수 없다.", true, "▸ 다른 확정판결의 이유 구성하는 사실관계(유력한 증거)는 현저한 사실 X → 당사자 주장 없이 현저한 사실 인정은 위법 [2009다69531]", "증거재판상자백"],
  ["SS민소15.ㄷ", "★ 손해배상 사건에서 직종별 임금실태보고서 및 한국직업사전의 기재내용은 법원에 현저한 사실이므로 당사자가 자료를 제출하지 않아도 이를 기초로 피해자의 일실수입을 산정할 수 있다.", true, "▸ 일실수입 산정할 때 직종별임금실태조사보고서, 한국직업사전의 각 존재 및 기재 내용은 현저한 사실 O [94다20051]", "증거재판상자백"],
  ["6_097.②", "★ 이행불능에 관한 주장은 법률적 효과에 관한 진술을 한 것에 불과하고 사실에 관한 진술을 한 것이라고는 볼 수 없으므로 그 진술은 자유로이 철회할 수 있고 법원도 이에 구속되지 않는다.", true, "▸ 이행불능에 관한 주장은 법률적 효과에 관한 진술을 한 것에 불과하고 사실에 관한 진술을 한 것이라고는 볼 수 없으므로 그 진술은 자유로이 철회할 수 있고 법원도 이에 구속되지 않는 권리자백에 해당함 [90다7104]", "증거재판상자백"],
  ["6_097.③", "★ 소유권에 기한 이전등기말소청구소송에 있어서 피고가 원고 주장의 소유권을 인정하는 진술은 소유권의 내용을 이루는 사실에 관한 재판상 자백에 해당한다.", true, "▸ 소유권에 기한 말소청구소송에서 원고의 '소유권' 인정은 자백 O ∵ 선결적 법률관계도 그 '내용을 이루는 사실'에 대해서는 자백 O [87다카749]", "증거재판상자백"],
  ["6_098.③", "★ 법원은 다른 증거방법이 없는 경우에도 당사자신문만으로 요증사실을 인정할 수 있다.", true, "제367조(당사자신문) 법원은 직권으로 또는 당사자의 신청에 따라 당사자 본인을 신문할 수 있다. 이 경우 당사자에게 선서를 하게 하여야 한다.\n▸ 당사자신문의 보충성은 2002년 개정으로 폐지되었음", "증거재판상자백"],
  ["6_098.⑤", "★ 변론의 방식에 관한 규정이 지켜졌다는 것은 오로지 조서의 기재에 의해서만 증명할 수 있다.", true, "제158조(조서의 증명력) 변론방식에 관한 규정이 지켜졌다는 것은 조서로만 증명할 수 있다.", "증거재판상자백"],
  ["6_099.④", "노동능력상실비율은 피해자의 여러 요건과 경험법칙에 비추어 법관이 규범적으로 결정하여야 하므로 자백의 대상이 아니다.", false, "▸ 일실수익의 산정기초가 되는 월수입, 가동연한, 공제월생계비, 노동능력상실률은 모두 주요사실 O → 자백 대상 O", "증거재판상자백"],
  // 증거조사,
  ["6_100.①", "★ 당사자신문에서 당사자가 정당한 사유 없이 출석하지 아니하거나 선서 또는 진술을 거부한 때에는 법원은 신문사항에 관한 상대방의 주장을 진실한 것으로 인정할 수 있다.", true, "제367조(당사자신문) 법원은 직권으로 또는 당사자의 신청에 따라 당사자 본인을 신문할 수 있다. 이 경우 당사자에게 선서를 하게 하여야 한다.\n제369조(출석·선서·진술의 의무) 당사자가 정당한 사유 없이 출석하지 아니하거나 선서 또는 진술을 거부한 때에는 법원은 신문사항에 관한 상대방의 주장을 진실한 것으로 인정할 수 있다.", "증거조사"],
  ["6_100.②", "★ 증인이나 당사자 본인에 대한 주신문에서는 원칙적으로 유도신문을 하여서는 안 되지만, 반대신문에서 필요한 때에는 유도신문을 할 수 있다.", true, "민사소송규칙 제91조(주신문) ② 주신문에서는 유도신문을 하여서는 아니된다. 다만, 다음 각호 가운데 어느 하나에 해당하는 경우에는 그러하지 아니하다.\n민사소송규칙 제92조(반대신문) ② 반대신문에서 필요한 때에는 유도신문을 할 수 있다.", "증거조사"],
  ["6_100.③", "★ 문서의 진정성립에 관한 자백의 취소는 주요사실에 관한 자백의 취소와 동일하게 처리되어야 하므로 문서의 진정성립을 인정한 당사자는 자유롭게 이를 철회할 수 없고, 이는 문서에 찍힌 인영의 진정함을 인정하였다가 나중에 이를 철회하는 경우에도 마찬가지이다.", true, "▸ 문서의 성립에 관한 자백은 보조사실에 관한 자백이지만 그 취소는 다른 간접사실에 관한 자백 취소와 달리 주요사실의 자백취소와 동일하게 처리해야 → 문서의 진정성립을 인정한 당사자는 자유롭게 철회 X [88다카3083]", "증거조사"],
  ["6_101.②", "★ 당사자 또는 제3자가 문서제출명령에 따르지 아니한 때에는 법원은 그 문서의 성질, 내용, 성립의 진정 등에 관한 상대방의 주장을 진실한 것으로 인정할 수 있다.", false, "제351조(제3자가 문서를 제출하지 아니한 때의 제재) 제3자가 제347조 제1항·제2항 및 제4항의 규정에 의한 명령에 따르지 아니한 때에는 제318조의 규정을 준용한다.\n제349조(당사자가 문서를 제출하지 아니한 때의 효과) 당사자가 제347조 제1항·제2항 및 제4항의 규정에 의한 명령에 따르지 아니한 때에는 법원은 문서의 기재에 대한 상대방의 주장을 진실한 것으로 인정할 수 있다.\n▸ '제3자'가 문서제출명령 따르지 않을 때 과태료 처분을 할 수 있으나(351조, 318조, 311조), 문서 기재에 관한 상대방 주장을 진실한 것으로 인정할 수 있는 규정(349조)은 준용하지 않으므로 적용 X", "증거조사"],
  ["6_102.⑤", "★ 법원은 다른 증거방법에 의하여 심증을 얻지 못한 경우에 한하여 직권 또는 당사자의 신청에 따라 당사자 본인을 신문할 수 있다.", false, "제367조(당사자신문) 법원은 직권으로 또는 당사자의 신청에 따라 당사자 본인을 신문할 수 있다. 이 경우 당사자에게 선서를 하게 하여야 한다.\n▸ 당사자신문의 보충성은 2002년 개정으로 폐지되었음", "증거조사"],
  ["6_103.ㄴ", "피고와 제3자 사이에 있었던 민사소송의 확정판결의 존재를 넘어서 그 판결의 이유를 구성하는 사실관계들까지 법원에 현저한 사실로 볼 수는 없다.", true, "▸ 피고와 제3자 사이 있었던 민사소송 확정판결의 존재를 넘어서 그 판결 이유를 구성하는 사실관계들까지 법원에 현저한 사실 X ∵ 특별한 사정 없는 한 유력한 증거지만 다른 증거에 비추어 채용하기 어려우면 합리적 이유 설시하여 배척하는 법리의 전제 [2019다222140]", "증거조사"],
  ["6_103.ㄷ", "법원에 현저한 사실이라 함은 법관이 개인적 경험으로 알고 있는 사실로서 그 사실의 존재에 관하여 명확한 기억을 하고 있거나 또는 기록 등을 조사하여 곧바로 그 내용을 알 수 있는 사실을 말한다.", false, "▸ 법원에 현저한 사실은 법관이 '직무상' 경험으로 알고 있는 사실, 명확한 기억 혹은 조사로 곧바로 알 수 있는 사실을 포함 O [94다20051] → '개인적' 경험이 아님", "증거조사"],
  ["6_103.ㄹ", "★ 당사자 일방이 증명을 방해하는 행위를 하였더라도 법원은 이를 하나의 자료로 삼아 자유로운 심증에 따라 방해자 측에게 불리한 평가를 할 수 있을 뿐이며, 증명책임이 전환되거나 곧바로 상대방의 주장 사실이 증명되었다고 보아야 하는 것은 아니다.", true, "▸ [98다9915] → 자유심증설", "증거조사"],
  ["6_103.ㅂ", "★ 음성·영상자료에 해당하는 동영상 파일은 문서제출명령의 대상이 될 수 있지만 문서제출명령의 대상은 될 수 없다.", false, "▸ 344조 1항 1호, 374조 → '동영상 파일'은 검증 O, 문서제출명령 X → '사진'은 형태·내용 등 종합하여 감정·서증·검증 방법 중 가장 적절한 증거조사 방법으로 O, 사진에 관한 구체적 심리 없이 곧바로 문서제출명령 내리면 X [2009마2105]", "증거조사"],
  ["6_104.ㄱ", "증언을 거부하는 이유는 소명하여야 한다.", true, "제316조(거부이유의 소명) 증언을 거부하는 이유는 소명하여야 한다.", "증거조사"],
  ["6_104.ㄷ", "증인은 따로따로 신문하여야 하므로 신문하지 아니한 증인이 법정안에 있을 때에는 법정에서 나가도록 반드시 명하여야 한다.", false, "제328조(격리신문과 그 예외) ① 증인은 따로따로 신문하여야 한다. ② 신문하지 아니한 증인이 법정 안에 있을 때에는 법정에서 나가도록 명하여야 한다. 다만, 필요하다고 인정한 때에는 신문할 증인을 법정안에 머물게 할 수 있다.\n▸ '반드시'가 아니라 예외(필요하다고 인정하면 머물게 할 수 있음)가 있음", "증거조사"],
  ["6_104.ㄹ", "재판장은 필요하다고 인정한 때에 증인 서로의 대질이나 당사자와 증인의 대질을 명할 수 있으나, 당사자 서로의 대질은 명할 수 없다.", false, "제329조(대질신문) 재판장은 필요하다고 인정한 때에는 증인 서로의 대질을 명할 수 있다.\n제368조(대질) 재판장은 필요하다고 인정한 때에 당사자 서로의 대질 또는 당사자와 증인의 대질을 명할 수 있다.", "증거조사"],
  ["6_104.ㅁ", "■보충 재판장은 증인으로 하여금 선서서를 소리내어 읽고 기명날인 또는 서명하게 하며, 증인이 선서서를 읽지 못하거나 기명날인 또는 서명하지 못하는 경우에는 참여한 법원사무관등이나 그 밖의 법원공무원으로 하여금 이를 대신하게 한다.", true, "제321조(선서의 방식) ③ 재판장은 증인으로 하여금 선서서를 소리내어 읽고 기명날인 또는 서명하게 하며, 증인이 선서서를 읽지 못하거나 기명날인 또는 서명하지 못하는 경우에는 참여한 법원사무관등이나 그 밖의 법원공무원으로 하여금 이를 대신하게 한다.", "증거조사"],
  ["6_104.ㅂ", "재판장은 언제든지 신문할 수 있으나, 합의부원은 신문할 수 없다.", false, "제327조(증인신문의 방식) ③ 재판장은 제1항과 제2항의 규정에 불구하고 언제든지 신문할 수 있다. ⑥ 합의부원은 재판장에게 알리고 신문할 수 있다.", "증거조사"],
  ["6_105.ㄱ", "■보충 증인이 법정에서 당사자와 대면하여 진술하면 심리적 부담으로 정신의 평온을 현저하게 잃을 우려가 있는 경우, 법원은 당사자의 의견을 들 필요 없이 직권으로 비디오 등 중계장치에 의한 증인신문 실시 여부를 결정한다.", false, "제327조의2(비디오 등 중계장치에 의한 증인신문) ① 법원은 다음 각 호의 어느 하나에 해당하는 사람을 증인으로 신문하는 경우 상당하다고 인정하는 때에는 당사자의 의견을 들어 비디오 등 중계장치에 의한 증인신문 실시 여부를 결정한다.\n▸ 당사자의 의견을 들어야 함", "증거조사"],
  ["6_105.ㄷ", "선서한 당사자가 거짓 진술을 한 경우 과태료를 부과할 수는 있으나, 위증죄로는 처벌받지 아니한다.", true, "▸ 당사자신문 : 출석·선서·진술의무(369조) 위반하면 상대방 주장 진실로 인정 O, 그러나 과태료·구인·감치는 X / 허위 진술하여도 형사법상 위증죄 X, 과태료 O\n제370조(거짓 진술에 대한 제재) ① 선서한 당사자가 거짓 진술을 한 때에는 법원은 결정으로 500만원 이하의 과태료에 처한다.", "증거조사"],
  ["6_106.①", "★ 선서하지 아니한 감정인에 의한 감정결과는 증거능력이 없으므로, 이를 사실인정의 자료로 삼을 수 없다.", true, "▸ 선서 하지 않은 감정인의 감정결과는 증거능력 X, 사실인정의 자료 X → 그러나 그 감정 결과 기재한 서면을 당사자가 서증으로 제출하고 법원이 합리적으로 인정하면 사실인정 자료 될 수 O [2005다77848]", "증거조사"],
  // 서증,
  ["6_107.①", "문서제출의 신청에 관한 결정에 대하여는 즉시항고를 할 수 없다.", false, "제348조(불복신청) 문서제출의 신청에 관한 결정에 대하여는 즉시항고를 할 수 있다.", "서증"],
  ["6_107.②", "★ 제3자에 대하여 문서제출을 명하는 경우 법원은 제3자 또는 그가 지정하는 자를 심문하여야 한다.", true, "제347조(제출신청의 허가여부에 대한 재판) ③ 제3자에 대하여 문서의 제출을 명하는 경우에는 제3자 또는 그가 지정하는 자를 심문하여야 한다.", "서증"],
  ["6_107.③", "★ ■보충 음성·영상자료에 해당하는 동영상 파일은 검증 목적물 제출 명령의 대상이 될 수 있지만 문서제출명령의 대상은 될 수 없다.", true, "▸ 344조 1항 1호, 374조 → '동영상 파일'은 검증 O, 문서제출명령 X → '사진'은 형태·내용 등 종합하여 감정·서증·검증 방법 중 가장 적절한 증거조사 방법으로 O, 사진에 관한 구체적 심리 없이 곧바로 문서제출명령 내리면 X [2009마2105]", "서증"],
  ["6_107.④", "★ 당사자가 적법한 문서제출명령에 따르지 아니한 때에는 법원은 문서의 기재에 대한 상대방의 주장을 진실한 것으로 인정할 수 있다.", true, "제349조(당사자가 문서를 제출하지 아니한 때의 효과) 당사자가 제347조 제1항·제2항 및 제4항의 규정에 의한 명령에 따르지 아니한 때에는 법원은 문서의 기재에 대한 상대방의 주장을 진실한 것으로 인정할 수 있다.", "서증"],
  ["6_108.①", "한쪽 당사자가 위조서류라는 취지로 서류를 제출한 것이지 거기에 기재된 사상이나 내용을 증거로 하려는 것이 아니어서 서증으로 제출한 것이 아님이 분명함에도 상대방이 그 서류의 진정성립을 인정하면, 법원은 그 진정성립에 다툼이 없다고 판단하고 그 기재에 의하여 상대방의 주장사실을 인정할 수 있다.", false, "▸ 일방 당사자가 증거서류 제출한 취지로 서류가 위조된 사실 입증하기 위한 것일 뿐 거기에 기재된 내용을 증거로 하려는 것이 아니어서 서증으로 제출한 것이 아님을 알 수 있는데도 상대방이 그 서류의 진정성립 인정했다는 이유로 진정성립에 다툼 없다고 판단하고 그 기재에 의해 상대방 당사자 주장사실 인정한 원심판결은 위법 [92다12919]", "서증"],
  ["6_108.②", "★ 처분문서는 그 진정성립이 인정되는 이상 반증이 없으면 그 기재내용대로 그 의사표시의 존재 및 내용을 인정하여야 하지만, 적절한 반증이 있으면 그 기재내용의 일부를 달리 인정할 수 있다.", true, "▸ 처분문서 진정성립 인정되는 이상 법원은 반증 없는 한 문서 기재 내용에 따른 의사표시 존재·내용 인정해야 → 합리적 이유설시 없이 배척 X → 처분문서라 할지라도 기재 내용과 다른 명시적·묵시적 약정 있는 사실 인정되면 기재 내용과 다른 사실 인정할 수 O [2005다34643]", "서증"],
  ["6_108.③", "★ 문서에 찍힌 인영이 그 명의인의 인장에 의하여 현출된 인영임이 인정되는 경우에는 특별한 사정이 없는 한 그 인영의 진정성립이 추정되고, 아울러 그 문서 전체의 진정성립까지 추정되는 것이므로, 문서가 위조된 것임을 주장하는 자는 적극적으로 위 인영이 명의인의 의사에 반하여 날인된 것임을 증명할 필요가 있다.", true, "▸ 사문서에 날인된 작성명의인의 인영이 그의 인에 의해 현출된 것이라면 특별한 사정이 없는 한 그 인영의 진정성립(즉, 날인행위가 작성 명의인의 의사에 기한 것임)이 사실상 추정 O → 인영의 진정성립 추정되면 358조에 의해 문서 전체의 진정성립 추정 O → 그러나 날인행위가 작성 명의인 이외의 자에 의해 이뤄진 것임이 밝혀지거나 작성 명의인의 의사에 반하여 날인 혹은 의사에 기하지 않은 이뤄진 것임이 밝혀진 경우에는 깨짐 → 인영의 진정성립 다투는 자가 반증을 들어 인영의 진정성립에 관해 법원으로 하여금 의심 품게 할 사정 입증하면 진정성립 추정 깸 ∵ 인영의 진정성립 추정은 사실상 추정 [94다41324, 2009다38049]", "서증"],
  ["6_109.②", "甲은 '乙이 丙의 甲에 대한 1억 원의 대여금 채무를 연대보증한다.'는 취지가 기재된 보증서를 증거로 제출하면서 乙에 대하여 위 1억 원의 보증금 지급을 구하는 소를 제기하였다.§★ 보증서에 乙의 날인만 되어 있고 내용이 백지로 된 문서를 교부받아 제3자가 후일 그 백지 부분을 보충한 것임이 밝혀지더라도 乙의 날인이 진정한 이상 그 문서의 진정성립이 추정된다.", false, "▸ 백지문서인 공란 부분이 사후적으로 '보충'된 사실 밝혀지면 문서제출자가 백지 부분이 정당한 권한에 기해 보충된 것임에 대해 증명책임 O [2011다100923] → 진정성립 추정은 깨짐", "서증"],
  ["6_109.③", "★ 보증서에 날인된 인영이 乙의 인장에 의하여 현출된 것이라면 그 문서 전체의 진정성립이 추정되고, 그 문서가 乙의 의사에 반하여 작성된 것이라는 점은 이를 주장하는 자가 적극적으로 증명하여야 한다.", true, "▸ 사문서에 날인된 작성명의인의 인영이 그의 인에 의해 현출된 것이라면 특별한 사정이 없는 한 그 인영의 진정성립(즉, 날인행위가 작성 명의인의 의사에 기한 것임)이 사실상 추정 O → 인영의 진정성립 추정되면 358조에 의해 문서 전체의 진정성립 추정 O [94다41324, 2009다38049]", "서증"],
  ["6_109.④", "★ 보증서에 乙이 아닌 자가 날인한 것이 밝혀진 경우에는, 甲이 그 날인 행위가 乙로부터 위임받은 정당한 권원에 의한 것이라는 사실까지 증명할 책임을 부담한다.", true, "▸ 날인행위가 작성명의인 이외 '제3자'에 의한 것임이 밝혀져서 사실상 추정이 깨지면 문서제출자가 날인행위가 작성명의인으로부터 위임받은 정당한 권한에 의한 것임에 대해 증명책임 O [93다4151]", "서증"],
  ["6_109.⑤", "★ 乙이 보증서상의 인영이 자신의 인감도장에 의한 인영과 동일하다고 진술한 후에 스스로 그 진술을 철회하기 위해서는 재판상 자백의 취소요건을 갖추어야 한다.", true, "▸ 문서의 성립에 관한 자백은 보조사실에 관한 자백이지만 그 취소는 다른 간접사실에 관한 자백 취소와 달리 주요사실의 자백취소와 동일하게 처리해야 → 문서의 진정성립을 인정한 당사자는 자유롭게 철회 X [88다카3083]", "서증"],
  ["6_110.③", "★ 甲과 乙 사이의 계약서에 乙의 인장을 날인한 사람이 乙이 아니라 丙이라는 점에 대해서는 甲과 乙 사이에 다툼이 없는데, 乙은 자신이 丙에게 위 계약을 체결할 권한을 수여한 사실이 없다고 주장할 경우 위 계약서를 서증으로 제출한 甲은 丙이 乙로부터 권한을 위임받아 그 정당한 권원에 의해 乙의 인장을 날인하였음을 증명하여야 한다.", true, "▸ 날인행위가 작성명의인 이외 '제3자'에 의한 것임이 밝혀져서 사실상 추정이 깨지면 문서제출자가 날인행위가 작성명의인으로부터 위임받은 정당한 권한에 의한 것임에 대해 증명책임 O [93다4151]", "서증"],
  ["6_111.⑤", "★ 법원은 차용증의 기재내용과 다른 명시적, 묵시적 약정사실이 인정될 경우에 그 기재내용과 다른 사실을 인정할 수 있다.", true, "▸ 처분문서라 할지라도 기재 내용과 다른 명시적·묵시적 약정 있는 사실 인정되면 기재 내용과 다른 사실 인정할 수 O [2005다34643]", "서증"],

  ["SS민소16.③", "★ ■보충 乙이 고의로 진실에 어긋나게 문서의 진정을 다툰 것이라면, 법원은 결정으로 乙에게 200만원 이하의 과태료를 부과할 수 있다.", true, "제363조(문서성립의 부인에 대한 제재) ①당사자 또는 그 대리인이 고의나 중대한 과실로 진실에 어긋나게 문서의 진정을 다툰 때에는 법원은 결정으로 200만원 이하의 과태료에 처한다.", "서증"],

  ["SS민소P7.①", "甲은 乙에게 대여금 1억 원을 청구하여 1심에서 6천만 원이 인용되었다. 甲이 4천만 원 패소부분에 대하여 항소한 후 항소심 소송 계속 중 乙은 甲에게 6천만 원을 지급할 의사가 있음을 밝혔다.§乙이 채무를 이행하기로 하여 甲이 소를 취하하였음에도 乙이 채무를 이행하지 않는 경우, 甲은 다시 동일한 내용의 소를 제기할 수는 없다.", false, "▸ 피고가 전소 취하 전제조건인 약정 지키지 않아 약정 해제·실효되는 사정변경 발생했다면 소송물이 동일하더라도 소제기를 필요로 하는 사정이 달라 권리보호의 이익 다르므로 재소금지 위반 X [93다22074]", "취하"],
  ["SS민소P7.③", "★ 甲은 乙의 동의 없이 항소를 취할 수 있고 이 경우 제1심 판결은 그대로 확정된다.", true, "▸ 제393조 제2항이 소취하 규정 중 제266조 제2항을 준용하지 않음 → 항소 취하는 소 취하와 달리 상대방 동의의 불요\n제266조(소의 취하) ② 소의 취하는 상대방이 본안에 관하여 준비서면을 제출하거나 변론준비기일에서 진술하거나 변론을 한 뒤에는 상대방의 동의를 받아야 효력을 가진다.\n제393조(항소의 취하) ② 항소의 취하에는 제266조 제3항 내지 제5항 및 제267조 제1항의 규정을 준용한다.", "취하"],
  ["7_004.②", "★ 소송 진행 중에 원고가 청구금액을 감축하였으나 그 의사가 분명하지 않은 경우 법원은 이를 청구의 일부포기로 보아야 한다.", false, "▸ 청구의 감축은 일부 취하 O, 일부 포기 X [93누9460]", "취하"],
  ["7_004.③", "★ 소취하의 특별수권이 있는 원고의 소송대리인인 변호사로부터 소송대리인 사임신고서 제출을 지시받은 사무원이 착오로 소취하서를 법원에 제출한 후 원고가 소취하의 효력을 다투면서 기일지정신청을 한 경우, 법원은 변론기일을 열어 소송종료선언을 하여야 한다.", true, "▸ 원고들 일부의 소취하를 해야 하는데 소송대리인의 사무원이 착오로 원고들 전원의 소를 취하 → 취하 무효 아님, 철회 불가 ∵ 소송행위는 표시주의, 사무원은 소송대리인의 표시기관 [97다6124]\n지문에서 소취하는 취소할 수 없고 효력 발생했으므로 기일지정신청이 이유 없어 소송종료선언을 해야", "취하"],
  ["7_005.ㄱ", "★ 소의 취하를 서면이 아닌 말로 하는 경우 상대방이 출석한 변론기일에서만 할 수 있다.", false, "제266조(소의 취하) ③ 소의 취하는 서면으로 하여야 한다. 다만, 변론 또는 변론준비기일에서 말로 할 수 있다.", "취하"],
  ["7_005.ㄷ", "★ 당사자 쌍방이 2회에 걸쳐 변론기일에 출석하지 아니하고 법원이 직권으로 신기일을 지정한 때에는 그와 같이 직권으로 정한 기일 또는 그 후의 기일에 당사자 쌍방이 출석하지 아니하거나 출석하더라도 변론하지 아니한 때에는 소의 취하가 있는 것으로 보아야 한다.", true, "▸ 268조 2항 규정 의하면 당사자 쌍방이 2회 불출석한 경우 법원이 두 번째 불출석의 기일에 직권으로 신기일을 지정했다면 당사자 기일지정신청에 의한 기일지정 있는 경우와 마찬가지로 보아야 [93다56442]", "취하"],
  ["7_006.①", "★ 소 취하의 서면이 법원에 적법하게 제출되었다면 그 서면이 상대방에게 송달되기 전·후를 묻지 않고 원고는 이를 임의로 철회할 수 없다.", true, "▸ 적법한 소 취하 서면이 제출된 이상 서면이 상대방에게 송달되기 전·후를 묻지 않고 원고는 임의로 철회할 수 X ∵ 소취하는 원고의 법원에 대한 소송행위 [97다6124]", "취하"],
  ["7_007.⑤", "★ 독립당사자참가 소송에 있어서 원고가 본소를 취하하는 경우에는 피고의 동의 외에 참가인의 동의도 필요하다.", false, "▸ 독립당사자참가 소송에 있어 원고의 본소 취하에는 피고의 동의 외에 참가인의 동의도 필요 [72마787]", "취하"],
  // 재소금지,
  ["7_008.①", "집합건물인 A 아파트의 구분소유자인 甲이 A 아파트의 공용 부분을 정당한 권원 없이 배타적으로 점유·사용하자, 다른 구분소유자인 乙이 甲을 상대로 해당 부분에 관하여 乙의 지분에 상응하는 차임 상당 부당이득반환청구의 소를 제기하였다. A 아파트에는 관리단 丙이 있다.§위 부당이득반환청구의 소를 乙이 단독으로 제기한 것은 적법하다.", true, "▸ 공유물에 대한 제3자의 부당이득에 관한 공유자들의 부당이득반환청구권은 분할채권으로서, 필수적 공동소송이 아니므로 개별 공유자가 소 제기 O", "재소금지"],
  ["7_008.②", "乙이 위 소송에서 판결을 받고 그 판결이 확정되었다면, 특별한 사정이 없는 한 그 판결의 효력은 丙에게 미친다.", true, "▸ ②, ③ 지문 관련 : 관리단이 집합건물의 공용부분·대지를 정당한 권원 없이 점유·사용하는 사람에 대해 부당이득반환청구소송 하는 것은 구분소유자 공유지분권을 구분소유자 공동이익을 위하여 행사하는 것 → 구분소유자가 각각 부당이득반환청구소송 하는 것과 동일 내용 → 관리단이 받은 확정판결의 효력은 구분소유자에게 미치고(제218조 제3항), 구분소유자가 받은 확정판결도 관리단에게 미침 [2021다239301]", "재소금지"],
  ["7_008.③", "위 소송에 앞서 丙이 먼저 甲을 상대로 차임 상당 부당이득반환청구의 소를 제기하여 판결이 확정되었다면, 그 판결의 효력은 乙에게 미친다.", true, "▸ 위 해설 참조", "재소금지"],
  ["7_008.④", "위 소송 제1심에서 乙이 청구기각 판결을 받은 후 항소심에 이르러 소를 취하였다면, 그 후 丙이 甲을 상대로 별소로 부당이득반환청구를 하는 것은 특별한 사정이 없는 한 재소금지 규정에 위반된다.", false, "▸ 구분소유자가 부당이득반환청구 소 제기하다가 본안 종국판결 선고 후 소 취하했더라도 관리단은 부당이득반환청구 소 제기 O ∵ 관리단의 부당이득반환청구소송은 구분소유자들의 공동이익을 위한 것으로서 새로운 권리보호이익 O [2021다239301]", "재소금지"],
  ["SS민소P7b.ㄴ", "★ 甲이 乙을 상대로 면직처분무효확인의 소(전소)를 제기하였다가 제1심에서 패소판결을 선고받고 항소심에서 소를 취한 후, 甲이 다시 乙을 상대로 위 면직처분이 무효임을 전제로 불법행위에 기한 손해배상청구의 소(후소)를 제기한 경우, 후소는 재소금지원칙에 반한다.", true, "▸ 면직처분무효확인 ⇨ 급여채권이행청구 : 재소금지 O ∵ 국가 노력 헛수고로 만든 자에 대한 제재 및 농락 사태 방지 취지인 재소금지는 기판력·중복소송금지에서 '동일한 소'와 반드시 같이 풀이할 필요 X [88다카18023] → 재소금지는 '선결관계'에도 적용 O", "재소금지"],
  ["SS민소P7b.ㄷ", "★ 乙이 丙에 대하여 가지는 금전채권에 대하여, 乙의 채권자 甲이 압류 및 추심명령을 받은 뒤 丙을 상대로 추심소송(전소)을 제기하였다가 청구인용판결을 받았으나 항소심에서 소를 취하하였는데, 그 후 乙의 다른 채권자 丁이 압류 및 추심명령을 받은 뒤에 丙을 상대로 추심소송(후소)을 제기한 경우, 후소는 재소금지원칙에 반하지 않는다.", true, "▸ 甲회사의 乙에 대한 정산금채권에 甲회사의 채권자 丙이 압류·추심명령 받아 乙 상대로 추심금청구 소 제기 후 항소심에서 취하 → 甲회사의 다른 채권자 丁이 위 정산금채권에 다시 압류·추심명령 받은 뒤에 丙을 상대로 추심소송(후소)을 제기하면 재소금지 위반 아님 ∵ 丁은 선행 추심소송과 별도로 자신의 甲회사에 대한 채권 집행 위해 소 제기하여 새로운 권리보호이익 O, 丙의 취하가 패소 회피 목적이거나 丁 소제기가 소송남용 의도 있다고 보기 어려운 점 [2018다259213]", "재소금지"],
  ["SS민소P7b.ㄹ", "★ 본안에 대한 종국판결이 있은 뒤에 화해권고결정에 '원고는 소를 취하하고, 피고는 이에 동의한다.'는 화해조항이 있고, 이러한 화해권고결정에 대하여 양 당사자가 이의하지 않아 확정되어 소송이 종료된 경우에는 화해권고결정 확정으로 인해 재판상 화해의 효력이 발생하므로 재소금지의 규정을 적용할 수 없다.", false, "▸ 화해권고결정에 '원고는 소 취하, 피고는 동의' 화해조항 있고, 이러한 화해권고결정에 이의 없어 확정되면 이는 소 취하의 소송상 합의로서 소 취하와 마찬가지로 재소금지 규정 적용 O [2018다230229]", "재소금지"],
  ["SS민소P7b.ㅁ", "★ 재소금지는 동일한 당사자 사이에 같은 소송물에 관하여 다시 소를 제기하지 못하게 하여 실체상의 권리 소멸의 효과를 가져온다.", false, "▸ 재소금지의 효과로 실체상 권리 소멸하지는 X [2022다266874]", "재소금지"],
  ["7_009.ㄱ", "甲은 乙과의 사이에 X토지에 관하여 명의신탁약정을 하고 乙 앞으로 매매를 원인으로 소유권이전등기를 마쳐 주었다. 그 후 甲은 위 등기가 명의신탁약정에 의한 것으로 무효라고 주장하며 乙을 상대로 소유권이전등기말소청구의 소(이하 '전소'라 한다)를 제기하였다. 甲은 전소의 제1심과 항소심에서 모두 승소하였는데, 상고심 계속 중 소를 취하하였다. 이후 甲이 재차 乙을 상대로 X토지에 관한 소유권이전등기의 말소를 구하는 소(이하 '후소'라 한다)를 제기하자, 乙은 甲의 후소가 재소금지 원칙에 위반된다고 항변하였다. 이에 甲은 乙이 X토지를 제3자에게 처분하지는 않았지만 전소 제기시부터 줄곧 X토지의 반환을 거부함으로써 甲의 소유권을 침해했다고 주장하며, X토지 가액 상당의 손해배상을 구하는 것으로 청구를 교환적으로 변경하였다.§甲이 청구를 교환적으로 변경하지 않았다면, 새로운 권리보호의 이익이 없는 甲의 후소는 재소금지 원칙에 위반되어 각하될 운명이었다.", true, "제267조(소취하의 효과) ② 본안에 대한 종국판결이 있은 뒤에 소를 취한 사람은 같은 소를 제기하지 못한다.\n▸ 당사자 동일, 소송물 동일, 권리보호이익 동일, 전소 본안판결 선고 후 취했을 것이라는 요건을 갖춘 것으로 보임(다만 새로운 권리보호이익이 있는지는 설문에 불명확)", "재소금지"],
  ["7_009.ㄴ", "★ 재소금지의 효과로 인하여 甲이 더 이상 소송을 통해 乙 명의의 소유권이전등기의 말소를 강제할 수 없게 되었더라도 실체법상의 권리인 甲의 소유권이 소멸하는 것은 아니다.", true, "▸ 甲이 乙 앞으로 마쳐준 소유권이전등기가 명의신탁 의한 것이라 무효라며 乙을 상대로 말소청구 소 제기, 제1심·항소심 모두 승소, 상고심 계속 중 소 취하 → 그 후 말소 거부하는 乙을 상대로 재차 말소청구 소 제기했다가 상대방이 '재소금지' 항변하자 부동산 가액 상당 손해배상으로 청구변경 → 기각∵ 차액설에 의해 부동산 교환가치 전액이 손해가 되려면 乙의 행위로 부동산 멸실되거나 甲이 소유권 상실해야, 양자 간 명의신탁은 실명법에 따라 여전히 신탁자 甲이 소유권 보유하여 乙 앞으로 마친 소유권등기로 甲이 손해 X, 재소금지의 효과로 실체상 권리 소멸하지는 X [2022다266874]", "재소금지"],
  ["7_010.④", "★ 채권자 甲이 채무자 乙을 대위하여 제3채무자 丙에게 소유권이전등기청구의 소를 제기하였다가 항소심에서 소를 취하하였는데, 소송고지를 통해 대위소송의 제기사실을 알고 있는 乙이 丙을 상대로 동일한 소를 제기한 경우, 乙의 소유권이전등기청구의 소는 재소금지에 해당되어 각하되어야 한다.", true, "▸ 채권자대위소송의 본안에 관한 종국판결 후에 취한한 경우, 채무자가 대위소송 계속 사실 '안 이상' 재소금지 효력 O [93다20177]", "재소금지"],
  ["7_011.②", "★ 甲이 乙을 대위하여 丙을 상대로 A 채무의 이행을 구하는 대위소송을 제기하였고 乙은 그 대위소송 제기사실을 알지 못하였는데, 甲이 본안에 관한 종국판결을 선고받고 그 항소심에서 소를 취한 후, 乙이 丙을 상대로 A 채무의 이행을 구하는 소를 제기한 경우", true, "▸ [적법] 채권자대위소송의 본안에 관한 종국판결 후에 취한한 경우, 채무자가 대위소송 계속 사실 '안 이상' 재소금지 효력 O [93다20177] → 지문은 채무자가 몰랐으므로 재소금지가 아님", "재소금지"],
  ["7_012.ㄴ", "★ 원고가 본안에 대한 종국판결 선고 후 소를 취하하였는데, 피고가 소취하의 전제조건인 약정을 이행하지 않아 약정이 해제 내지 실효된 후 원고가 동일한 소를 다시 제기한 경우", true, "▸ [재소금지 위배 아님] 종국판결 후 소 취했다가 피고가 취하의 전제조건인 약정을 위반하여 약정이 해제·실효되는 사정변경 생겼다면 재소금지 X [2000다46399] → 취하의 전제조건 약정 불이행의 경우에는 재소를 할 새로운 권리보호이익 O", "재소금지"],

  ["7_014.②", "■보충 증권관련집단소송에서 청구의 포기는 법원의 허가를 받지 아니하면 그 효력이 없다.", true, "증권관련 집단소송법 제35조(소 취하, 화해 또는 청구 포기의 제한) ① 증권관련집단소송의 경우 소의 취하, 소송상의 화해 또는 청구의 포기는 법원의 허가를 받지 아니하면 그 효력이 없다.", "포기인낙"],

  // 재판상화해,

  ["7_015.③", "■보충 소액사건심판절차에서의 이행권고결정은 이의기간 내에 이의신청을 하지 않거나, 이의신청에 대한 각하결정이 확정되거나, 이의신청이 취하된 경우, 확정판결과 같은 효력을 가진다.", true, "소액사건심판법 제5조의7(이행권고결정의 효력) ① 이행권고결정은 다음 각 호의 어느 하나에 해당하면 확정판결과 같은 효력을 가진다. 1. 피고가 제5조의4제1항 본문의 기간 내에 이의신청을 하지 아니한 경우 2. 이의신청에 대한 각하결정이 확정된 경우 3. 이의신청이 취하된 경우", "재판상화해"],
  ["7_015.⑤", "지급명령에 대하여 이의신청이 없거나, 이의신청을 취하하거나, 각하결정이 확정된 때에는 지급명령은 확정판결과 같은 효력이 있으므로 기판력과 집행력을 가진다.", false, "▸ 확정된 지급명령은 집행력만 있음", "재판상화해"],

  ["7_016.②", "★ 화해조서에 '이 사건 화해는 이 사건 부동산의 실제 소유자의 이의제기가 있을 경우에는 무효로 한다.'라는 실효조항을 둔 경우, 그 조건이 성취되면 화해의 효력은 소멸한다.", true, "▸ 제3자 이의 있으면 화해 효력 실효시키는 해제조건부(실효조건부) 화해 O [88다카2332]", "재판상화해"],
  ["7_016.③", "★ '재심대상판결 및 제1심 판결을 각 취소한다.'라는 취지의 조정조항은 당연무효이다.", true, "▸ '재심대상판결을 취소한다'는 조정·화해는 당연무효 [2010다97846]", "재판상화해"],

  ["7_016.⑤", "소송에서 다투어지는 법률관계의 존부에 관하여 동일한 당사자 사이의 전소에서 확정된 화해권고결정이 있었던 경우 당사자의 이에 반하는 주장은 인정되지 아니한다.", true, "제231조(화해권고결정의 효력) 화해권고결정은 다음 각호 가운데 어느 하나에 해당하면 재판상 화해와 같은 효력을 가진다.\n▸ 소송상 화해에 관한 통설·판례는 소송행위설 및 무제한기판력설", "재판상화해"],
