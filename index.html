  ["SS민소P7c.ㄱ", "★ 착오가 화해 당사자의 자격이나 화해의 목적인 분쟁 이외의 사항에 관한 것인 때에는 화해계약을 취소할 수 있다.", true, "민법 제733조(화해의 효력과 착오) 화해계약은 착오를 이유로 하여 취소하지 못한다. 그러나 화해당사자의 자격 또는 화해의 목적인 분쟁이외의 사항에 착오가 있는 때에는 그러하지 아니하다.", "재판상화해"],
  ["SS민소P7c.ㄴ", "★ 동일한 채권에 대해 복수의 채권자들이 압류·추심명령을 받은 경우 어느 한 채권자가 제기한 추심금소송에서 확정된 화해권고결정의 기판력은 그 화해권고결정의 확정일 이전에 압류·추심명령을 받았던 다른 추심채권자에게도 미친다.", false, "▸ 동일한 채권에 대한 복수 채권자들이 압류·추심명령 받은 경우 어느 채권자가 제기한 추심금소송의 확정판결 기판력은 그 변론종결 전에 압류·추심명령 받았던 다른 추심채권자에게 미치지 X ∵ 추심금소송 소송물이 피압류채권 존부로 동일하더라도 소송당사자 다름, 기판력 주관적 범위는 신분·회사관계소송처럼 특별규정 제외하면 당사자·변종후승계인·목적물소지인·권리귀속주체에 한정(218조 3항, 민사집행법 249조 3, 4항(제3채무자 신청 따른 참가명령 받은 채권자는 참가 없더라도 재판 효력 미침)은 참가명령을 받지 않은 채권자에게는 추심금소송 확정판결 효력이 미치지 않음을 전제 → 이는 추심금소송에서 화해권고결정 확정된 경우도 마찬가지(다른 추심채권자에 기판력 X) [2016다35390]", "재판상화해"],
  ["SS민소P7c.ㄹ", "★ 착오나 사기, 강박 등 재판상화해에 취소사유가 있었다면, 준재심에 의하지 않더라도 화해조서의 효력을 부정할 수 있다.", false, "▸ 소송상 화해는 소송행위로서 사법상 화해와 달리 사기나 착오를 이유로 취소할 수 X [78다1094] → 통설·판례는 소송행위설 및 무제한기판력설", "재판상화해"],
  ["SS민소P7c.ㅁ", "동일한 당사자 사이에 전소에서 확정된 화해권고결정이 있는 경우, 후소에서 당사자는 이에 반하는 주장을 할 수 없고 법원도 이에 저촉되는 판단을 할 수 없다.", true, "▸ 소송상 화해에 관한 통설·판례는 소송행위설 및 무제한기판력설", "재판상화해"],
  ["7_018.ㄴ", "재판상 화해는 확정판결과 동일한 효력이 있고 창설적 효력을 가지는 것이어서 화해가 이루어지면 당사자가 다투어 사실이 없었던 사항은 물론 화해의 전제로서 서로 양해하고 있는 사항에 관하여도 그러한 효력이 생긴다.", false, "▸ 제소전 화해의 창설적 효력은 당사자 간에 다투어졌던 권리관계에만 O, 당사자가 다투어 사실이 없었던 사항은 물론 화해의 전제로서 서로 양해하고 있는 사항에는 X\n'甲(임차인)은 임대차기간 만료일에 乙(임대인)로부터 임대차보증금을 반환받음과 동시에 점포를 乙 등에게 인도한다.'는 내용의 제소전 화해하면 임차인의 '갱신요구권'은 화해 당시 분쟁 대상으로 삼지 않은 사항이어서 화해의 창설적 효력 미치지 X, 갱신요구권 행사 O [2019다299058]", "재판상화해"],
  ["7_018.ㄷ", "★ 조정이나 재판상 화해의 대상인 권리관계는 사적 이익에 관한 것으로서, 당사자가 자유롭게 처분할 수 있는 것이어야 하므로, 성질상 당사자가 임의로 처분할 수 없는 사항을 대상으로 한 조정이나 재판상 화해는 허용될 수 없다.", true, "▸ 조정이나 재판상 화해의 대상인 권리관계는 사적 이익에 관한 것으로서 당사자가 자유롭게 처분할 수 있는 것이어야 → 성질상 당사자가 임의로 처분할 수 없는 사항을 대상으로 한 조정이나 재판상 화해는 허용될 수 X → '재심대상판결을 취소한다'는 화해는 당연무효 [2010다97846]", "재판상화해"],
  ["7_018.ㄹ", "★ 소송상의 화해는 소송행위로서 사기나 착오를 이유로 취소할 수 없다.", true, "▸ 소송상 화해는 소송행위로서 사법상 화해와 달리 사기나 착오를 이유로 취소할 수 X [78다1094] → 통설·판례는 소송행위설 및 무제한기판력설", "재판상화해"],
  ["7_018.ㅂ", "화해권고결정은 그 심급에서 판결이 선고되어도 효력이 유지된다.", false, "제232조(이의신청에 의한 소송복귀 등) ② 화해권고결정은 그 심급에서 판결이 선고된 때에는 그 효력을 잃는다.", "재판상화해"],
  ["7_018.ㅅ", "화해권고결정에 대한 이의신청권은 그 신청전까지 포기할 수 있다.", true, "제229조(이의신청권의 포기) ① 이의신청권은 그 신청전까지 포기할 수 있다.", "재판상화해"],
  // 기판력서설작용국면,
  ["7_019.①", "★ 甲의 乙에 대한 배당이의의 소에서 청구기각판결을 받은 甲이 그 판결이 확정된 후 乙에 대하여 위 판결에 의하여 확정된 배당액이 부당이득이라는 이유로 그 반환을 구하는 소를 제기한 경우, 후소 법원은 전소 확정판결의 판단과 다른 판단을 할 수 없다.", true, "▸ 배당이의의 소 패소판결 확정받은 자가 상대방에 대해 그 배당액이 부당이득이라며 반환 구하는 소 제기하면 전소에게 판단된 배당수령권 존부가 부당이득반환청구권 성부를 판단함에 선결문제되므로 당사자는 다른 주장 X, 법원도 다른 판단 X [99다3501] → 선결관계로서 기판력 미침", "기판력서설작용국면"],
  ["7_019.②", "★ 甲의 乙에 대한 가등기에 기한 본등기절차의 이행을 구하는 소에서 청구인용판결이 확정된 후 乙이 甲을 상대로 위 가등기만의 말소를 청구하는 것은 전소 확정판결의 기판력에 저촉되지 않는다.", true, "▸ 가등기에 기한 소이등(본등기) 명한 확정판결 기판력은 가등기의 말소청구에 미치지 X ∵ 전소 소송물과 동일하지 않더라도 전소에서 확정된 법률관계와 모순되는 정반대 사항을 소송물로 삼으면 기판력 O, 그러나 기판력은 소송물로 주장된 법률관계의 존부 판단의 결론에만 미치고, 그 전제가 되는 법률관계 X → 전소 판결 기판력은 소송물인 소이등청구권의 존부에만 O, 가등기의 효력 유무 판단에는 기판력 X → 만일 가등기에 기한 소이등의 말소를 구했다면 기판력 미쳤을 것 [93다52488]", "기판력서설작용국면"],
  ["7_019.③", "★ X 토지의 매수인 甲이 매도인 A를 대위하여 乙을 상대로 X 토지에 관한 乙 명의의 소유권이전등기가 원인무효임을 이유로 그 말소등기절차의 이행을 구하는 소(전소)를 제기하여 청구인용판결이 확정되었는데, 그 소송의 사실심 변론 종결 후 乙로부터 X 토지를 매수하여 소유권이전등기를 마친 丙이 甲을 상대로 X 토지의 인도 및 차임 상당 부당이득반환청구의 소(후소)를 제기한 경우, 丙은 변론 종결 뒤의 승계인에 해당하여 전소 확정판결의 기판력이 후소에 미친다.", false, "▸ 甲이 乙을 상대로 건물 소이등 말소청구 승소확정 → 변론종결 후 乙로부터 건물 매수하여 등기한 丙이 甲을 상대로 건물인도 및 차임 상당 부당이득반환청구 소 제기해도 전소 기판력 미치지 X ∵ 전소 소송물은 건물 '말소등기청구권' 존부이며 '건물 소유권' 존부는 그 전제가 될 뿐, 말소등기청구권 존부 판단이 인도 등 청구의 선결문제 X, 그와 모순관계 X → 동일·선결·모순관계로 기판력 미치는 객관적 범위 해당하지 않음, 전소 변론종결 후 당사자로부터 계쟁물 승계한 자가 후소 제기해도 기판력 미치지 X [2013다53939]", "기판력서설작용국면"],
  ["7_019.④", "★ 甲이 부동산 소유자 乙을 상대로 소유권이전등기청구의 소를 제기하여 받은 승소확정판결에 기하여 소유권이전등기를 마친 경우, 乙에 대한 다른 소유권이전등기청구권자 丙이 乙을 대위하여 甲 명의의 소유권이전등기가 원인무효임을 내세워 그 등기의 말소를 구하는 것은 전소 확정판결의 기판력에 저촉된다.", true, "▸ 제3자가 소유자를 상대로 소유권이전등기 확정판결 받아 소유권이전등기 경료한 경우, 종전의 소유권이전등기청구권 가지는 자는 확정판결이 당연무효 혹은 재심의 소로 취소되지 않는 한, 소유자에 대한 소유권이전등기청구권을 보전하기 위하여 소유자를 대위하여 제3자 명의의 소유권이전등기가 원인무효라며 말소 구하는 것은 확정판결의 기판력 저촉, 나아가 그 제3자 소유권이전등기 이후 그 등기를 바탕으로 마친 소유권이전등기의 말소 구하는 것도 확정판결 기판력 저촉 [96다8666]", "기판력서설작용국면"],
  ["7_019.⑤", "★ 甲이 乙을 상대로 제기한 소유권이전등기청구의 소에서 청구인용판결이 확정되어 그에 따른 甲 명의의 소유권이전등기가 마쳐진 후 乙이 위 등기가 원인무효임을 주장하며 甲을 상대로 소유권 확인의 소를 제기하는 것은 전소 확정판결의 기판력에 저촉되지 않는다.", true, "▸ 확정판결의 기판력은 소송물로 주장된 법률관계 존부 판단의 결론 그 자체에만 O, 그 전제인 법률관계 존부에는 미치지 X → 소이등말소 인용판결 확정되어도 패소 당사자가 소유권확인 구할 수 O ∵ 기판력은 소송물이었던 말소등기청구권의 존부에만, 그 전제가 되는 소유권 자체 존부에는 X [95다37988]", "기판력서설작용국면"],
  ["7_020.④", "★ 부동산에 대한 소유권확인 및 소유권보존등기 말소를 구하는 소(전소)의 기판력은 동일한 부동산에 대한 취득시효 완성을 원인으로 소유권이전등기를 구하는 소(후소)에 미치지 아니한다.", true, "▸ A가 B 상대로 소유권확인 및 B의 소보등 말소 승소확정 → B가 A 상대로 위 판결확정 전 취득시효 완성 원인 소이등 구하면 기판력 저촉 X ∵ 전소 소송물(소유권 자체 확인 및 B 명의 소보등의 말소청구권 존부), B가 전소에서 별개의 등기청구권 취득원인 항변 내세울 의무 없음, 등기 말소되어도 취시 소이등청구권 소멸되지 않음 [94다35039]", "기판력서설작용국면"],
  ["7_021.①", "★ 소유권이전등기말소청구 소송에서 청구기각의 판결을 선고받아 확정되었다면 그 기판력은 그 후 동일한 부동산에 관하여 동일한 당사자 간에 제기된 진정명의회복을 원인으로 한 소유권이전등기청구 소송에도 미친다.", true, "▸ 진정명의회복을 원인으로 한 소유권이전등기청구권과 무효등기의 말소청구권은 모두 진정한 소유자의 등기명의의 회복을 위한 실질적 목적이 동일하고, 모두 소유권에 기한 방해배제청구권(214조)으로서 그 법적 근거와 성질이 동일하므로, 각 이전등기·말소등기의 형식은 달라도 소송물은 실질상 동일 O [99다37894]", "기판력서설작용국면"],
  ["7_021.②", "★ 채권자가 먼저 부당이득반환청구의 소를 제기하였다면 특별한 사정이 없는 한 손해 전부에 대하여 승소판결을 얻을 수 있었을 것임에도 손해배상청구의 소를 먼저 제기하는 바람에 과실상계 등의 법리에 따라 그 승소액이 당초 청구 금액의 일부로 제한된 판결이 확정된 경우, 위 손해배상청구의 소에서 일부 청구기각된 부분에 대한 부당이득반환청구는 인용될 수 있다.", true, "▸ ∵ 부당이득반환청구권과 불법행위 손해배상청구권은 서로 실체법상 별개 청구권, 각 청구권 기초하여 이행 구하는 소는 소송법적으로 소송물 다름 [2013다45457] → 판례의 구이론", "기판력서설작용국면"],
  ["7_021.⑤", "★ 기판력 있는 전소 판결과 저촉되는 후소 판결이 그대로 확정된 경우에도 재심의 소에 의하여 후소 판결이 취소될 때까지 전소 판결과 후소 판결은 저촉되는 상태 그대로 기판력을 갖는다.", true, "▸ 기판력 있는 전소판결과 저촉되는 후소판결이 확정된다고 전소판결 기판력이 실효·복멸되지 X, 재심으로 후소판결이 취소될 때까지 전소판결과 후소판결은 저촉된 상태 그대로 기판력 O → 저촉되는 후소판결 확정이 변론종결 후 새로운 사정은 X → 당사자 사이 전소 기판력 계속 미침 [96다32706]", "기판력서설작용국면"],
  ["7_022.①", "★ 토지 소유권에 기한 물권적 청구권을 원인으로 하는 가등기말소청구소송에서 청구기각된 확정판결로 인하여 토지 소유자가 갖는 토지 소유권의 내용이나 토지 소유권에 기초한 물권적 청구권의 실체적인 내용이 변경, 소멸되는 것은 아니다.", true, "▸ 토지 소유권에 기한 가등기말소청구의 청구기각 확정판결의 변론종결 후 토지 소유자로부터 근저당권 취득한 제3자는 '변론종결 후 승계인' X, 그가 근저당권에 기해 같은 가등기의 말소청구를 하는 후소에 기판력 미치지 않음 [2019다261381]", "기판력서설작용국면"],
  ["7_022.②", "물건을 점유하는 자를 상대로 하여 물건의 인도를 명하는 판결이 확정되더라도 그 판결의 기판력이 이들 물건에 대한 불법점유를 원인으로 한 손해배상청구 소송에는 미치지 않는다.", true, "▸ 물건 점유자를 상대로 한 인도판결 확정되면 점유자는 더 이상 인도청구권 존부 다툴 수 X → 그러나 판결 효력이 실체적 법률관계 영향 미치지 X, 인도판결의 효력으로 점유자에게 상대방에 대한 인도할 실체적 의무 생기는 것 X, 정당한 점유권원 소멸하여 그때부터 물건에 대한 점유가 위법하게 되는 것도 X, 인도판결의 기판력이 물건에 대한 불법점유 원인 손해배상청구 소송에 미치지 X [2014다46778]", "기판력서설작용국면"],
  ["7_022.③", "■보충 예비적 반소의 원인채권이 별개의 다른 사건에서 상계항변으로 제출되어 그 항변을 인용하는 판결이 이미 확정되었다면, 그 예비적 반소는 소의 이익이 없어 부적법하다.", true, "▸ 상계항변은 제216조 제2항에 따라 확정판결과 같은 기판력 발생하므로 그 항변을 인정하는 인용 판결이 확정되었다면 이는 승소확정판결과 동일하여 동일한 후소(반소)를 제기할 경우 모순금지설에 따라 각하해야 함(기각설이 있으나 판례는 각하설)\n관련판례 : [2010다30966]", "기판력서설작용국면"],
  ["7_022.④", "계쟁 부동산에 관한 피고 명의의 소유권이전등기가 원인무효라는 이유로 그 등기의 말소를 구하는 소를 제기하였다가 패소 확정된 원고는 다시 동일한 피고를 상대로 계쟁 부동산이 원고의 소유라는 확인을 구할 법률상 이익이 있다.", true, "▸ 후소 소송물(소유권)이 전소 소송물(소유권에 기한 물권적 청구권)의 선결적 법률관계로서 (소위 '역선결관계'라 칭했던 구조) 기판력 미치지 않음(제216조 제1항)", "기판력서설작용국면"],
  ["7_022.⑤", "★ 매매계약의 무효를 원인으로 한 매매대금반환청구에 대한 인낙조서의 기판력은 매매계약의 유효를 전제로 매수인이 제기하는 소유권이전등기청구에 미친다.", false, "▸ 소유권이전등기가 원인무효라며 말소 인용한 확정판결의 기판력은 그 패소 당사자가 전혀 다른 청구원인에 기해 상대방에 대해 소유권이전등기청구 하는 판결에 미치지 않음 ∵ 전소 기판력은 소송물이었던 말소등기청구권의 존부이고 기판력은 소송물로 주장된 법률관계의 존부 판단 그 자체에만 [93다43491]", "기판력서설작용국면"],
  ["7_023.ㄱ", "★ 대여금청구의 소에서 승소확정판결을 받은 원고가 판결 확정 후 10년이 다가오자 소멸시효의 완성을 막기 위해 전소 판결로 확정된 채권의 시효를 중단시키기 위한 재판상의 청구가 있다는 점에 대하여만 확인을 구하는 후소를 제기하는 경우", false, "▸ 시효중단사유로서 재판상 청구는 이행·확인 청구 모두 O → 이미 승소 확정판결 받은 채권자가 판결상 채권의 시효중단 위해 후소 제기하는 경우도 동일 → '재판상의 청구'가 있다는 점만 확인 구하는 '새로운 방식의 확인소송' 허용 O, 채권자는 두 가지 형태의 소송 중 선택 가능 O ∵ 시효중단을 위한 이행소송의 다양한 문제점 보완 [2015다232316]", "기판력서설작용국면"],
  ["7_023.ㄴ", "★ 소유권확인청구소송에서 패소확정된 원고가 소유권에 기하여 피고 명의의 소유권이전등기의 말소등기청구의 소를 제기하는 경우", true, "▸ 확정된 전소의 기판력 있는 법률관계가 후소의 소송물 자체가 아니어도 후소의 선결문제가 되면 전소 확정판결의 판단은 후소의 선결문제로서 기판력 작용 O → 소유권확인청구 판결 확정 후 다시 동일 피고 상대로 소유권에 기한 물권적 청구권 소송 제기하면 전소 확정판결에서의 소유권 존부 판단에 구속 O, 당사자도 다른 주장 X, 법원도 다른 판단 X [98다18155] → 전형적인 선결관계 : 소유권확인 ⇨ 소물청", "기판력서설작용국면"],
  ["7_023.ㄷ", "★ 제소전 화해에 의하여 소유권이전등기를 넘겨준 자가 원인무효를 주장하면서 그 말소등기절차의 이행을 구하는 소를 제기하는 경우", true, "▸ [2002다44014] → 제소전 화해조서도 기판력 O", "기판력서설작용국면"],
  ["7_023.ㄹ", "★ 매매계약의 무효 또는 해제를 원인으로 한 매매대금반환청구에 대해 인낙조서가 작성된 후 전소의 원고가 동일한 매매계약에 기한 소유권이전등기청구의 소를 제기한 경우", false, "▸ 매매계약 무효·해제 원인 매매대금반환청구 인낙조서의 기판력은 소유권이전등기청구권의 후소에 미치지 않음 X ∵ 전소 기판력은 매매대금반환청구권의 존부에 관하여만 발생, 그 전제가 되는 선결적 법률관계인 매매계약의 무효·해제에는 발생 X, 전소에서 확정된 법률관계와 정반대로 모순되는 사항을 소송물로 해야 기판력, 기판력 발생 없는 전소와 후소의 소송물의 각 전제인 법률관계가 매매계약 유효·무효로 서로 모순된다고 하여 기판력 미치지 X [2004다55698]", "기판력서설작용국면"],
  // 기판력시적범위,
  ["7_024.ㄴ", "★ 채권자가 채무자를 상대로 제기한 소송에서 채무자가 사실심 변론종결 전에 채권자에 대하여 상계적상에 있는 채권을 가지고 있었음에도 상계의 의사표시를 하지 않아 채권자 승소판결이 확정된 경우, 그 후 채무자가 채권자에 대하여 상계의 의사표시를 한 사실은 위 확정판결에 대한 청구이의의 사유에 해당한다.", true, "▸ 확정판결 변론종결 전에 상계적상 채권 있었고 그 존재를 알았더라도 변론종결 후에 상계 O, 청구이의 O, 민집법 44조 2항 '청구이의의 원인이 변론종결 이후 생긴 것' O ∵ 상계는 쌍방 채무가 상계적상에 있다고 바로 채무소멸 효력 생기는 것 아니고 상계 의사표시 있어야 비로소 효력 생기므로 [66다780] → 상계는 출혈적 항변, 상계권은 독립된 권리일 뿐 소구채권 하자 주장 아님 → 표준시 뒤 형성권 행사를 새로운 사유로 보는 경우", "기판력시적범위"],
  ["7_024.ㄷ", "★ 건물의 소유를 목적으로 하는 토지 임대차에서 임대인이 임차인을 상대로 토지 인도 및 건물철거의 소를 제기하였는데 임차인이 임대인에 대하여 건물매수청구권을 행사할 수 있었음에도 행사하지 아니하여 건물철거를 명하는 내용의 판결이 확정된 경우, 임차인은 그 확정판결에 의하여 건물철거가 집행되지 않았다 하더라도 건물에 대하여 임대인에게 건물매수청구권을 행사하여 별소로써 건물 매매대금의 지급을 청구할 수 없다.", false, "▸ 건물 소유 목적 토지임대차에서 임차인이 건물매수청구권 행사할 수 있음에도 행사하지 않아 토지인도·건물철거소송이 임차인 패소로 확정되더라도, 건물철거 집행되지 않은 이상 임차인은 건물매수청구권을 행사하면서 청구이의 O, 별소로 건물 매매대금지급청구 O [95다42195] → 사회·경제적 효용, 건매청은 독립된 권리일 뿐 소구채권 하자 주장 아님 → 표준시 뒤 형성권 행사를 새로운 사유로 보는 경우", "기판력시적범위"],
  ["7_024.ㄹ", "★ 백지어음의 소지인이 어음금청구소송의 사실심 변론종결일까지 그 백지 부분을 보충하지 아니하여 소지인의 패소판결이 확정된 경우, 그 후 소지인이 그 백지 부분을 보충하여 위 소송의 피고를 상대로 다시 동일한 어음금청구의 소를 제기하는 것은 특별한 사정이 없는 한 위 확정판결의 기판력에 저촉된다.", true, "▸ 어음소지인이 백지를 보충하지 않아 어음요건 흠결로 패소확정 후 백지보충권 행사하여 다시 어음금청구 X, 전소에서 어음요건 흠결 몰랐어도 X [2008다59230]", "기판력시적범위"],
  ["SS민소P8.③", "★ 전소의 사실심 변론종결 전에 존재한 공격방어방법을 당사자가 알지 못하여 전소에서 주장하지 못한 경우라면, 이는 알고서도 이를 주장하지 않은 경우와 구별하여야 하므로, 당사자는 전소 사실심 변론종결 이후에 위 공격방어방법을 들어 후소를 제기할 수 있다.", false, "▸ 전소에서 당사자의 귀책사유 없이 제출하지 못한 경우에도 차단되는지 여부\n1) 판단효력설[통판] : 변론종결 전에 주장할 수 있었던 공방이라면 제출하지 않은 당사자의 고의·악의·과실을 불문하고 일률적으로 차단 O\n2) 제출책임효력설 : 당사자의 귀책사유로 제출하지 못한 경우에만 차단된다는 견해", "기판력시적범위"],
  ["SS민소P8.⑤", "X토지의 소유자 甲이 무단점유자 乙을 상대로 부당이득반환청구의 소를 제기하여 장래이행판결을 받고 확정된 경우, 위 소송의 변론종결 후에 X토지의 소유권을 취득한 丙이 乙을 상대로 자신의 소유권 취득일 이후의 부당이득반환청구의 소를 제기하더라도 기판력에 저촉되지 않는다.", true, "▸ 전소판결 소송물이 채권적 청구권인 부당이득반환청구권이면 원고가 전소 변론종결 뒤에 토지 소유권 취득한 사정만으로 기판력 미치는 변론 종결 뒤 승계인 X → 나아가 자신이 토지 소유권 취득한 이후의 부당이득반환을 구하는 원고로서는 전소판결 소송의 소송물을 양수한 변론 종결 뒤 승계인도 X ∵ 소송물인 부당이득반환청구권은 토지 소유를 요건으로 하므로 토지 소유권 이전 뒤에는 더 이상 발생하지 않아 그 양도도 불능 [2021다206349]", "기판력시적범위"],
  ["7_025.④", "甲은 A에 대하여 1억 원의 대여금채권이 있다. A의 상속인으로는 아들 乙이 있다. A가 사망한 이후 3개월 이내에 乙은 한정승인신고를 하였다.§★ 甲이 乙을 상대로 A의 상속채무의 이행을 구하는 소를 제기하자 乙이 한정승인 심판을 받았음에도 불구하고 소송절차에서 한정승인의 항변을 하지 아니하여 유보 없는 판결이 선고되고 확정되었다. 甲이 乙의 고유재산에 대하여 집행을 한 경우 乙은 변론종결 전의 한정승인을 강제집행단계에서 뒤늦게 주장하여 청구이의의 방법으로 강제집행을 거부할 수 없다.", false, "▸ 상속인이 한정승인을 하고도 변론종결시까지 주장하지 아니하여 책임 범위 유보 없는 판결확정 되어도 그 후 한정승인 사실 내세워 청구이의 O ∵ 한정승인의 책임제한은 상속채무 존재·범위 확정과 무관하고 집행대상만 한정, 전소에서 한정승인 주장 않으면 책임 범위는 현실적 심판대상 X, 주문은 물론 이유에서도 판단되지 X → 기판력 X [2006다23138, 2008다79876]", "기판력시적범위"],
  ["7_026.②", "★ 불법행위의 피해자가 일부청구임을 명시하여 그 손해의 일부만을 청구한 경우 그 일부청구에 대한 판결의 기판력은 잔부청구에 미치지 아니하는 것이고, 그 경우 일부청구임을 명시하는 방법으로 반드시 전체 손해액을 특정할 필요는 없다.", true, "▸ 일부청구 명시하면 그 기판력은 잔부청구에 미치지 X → 이때 명시 방법으로 반드시 전체 액수 특정 불필요, 잔부청구와 구별하여 심리 범위 특정할 수 있을 정도 표시하여 전체 손해의 일부로서 우선청구하고 있는 것임을 밝히면 족함 [86다카536]", "기판력시적범위"],
  // 기판력객관적범위,
  ["7_027.②", "甲은 乙에 대하여 매매대금의 지급을 구하는 소를 제기하였다(이를 '제1소송'이라 함). 이 소송 도중에 乙은 甲에게 대여금의 반환을 구하는 별소를 제기하였다(이를 '제2소송'이라 함). 이후 제1소송의 기일에서 乙은 주위적으로 소멸시효가 완성되었다고 항변하면서, 예비적으로 제2소송의 대여금채권을 자동채권으로 하는 상계항변을 하였다.§★ 제1소송에서 예비적 항변이 받아들여져 청구기각의 판결이 선고된 경우에 甲에게는 항소의 이익이 있지만 乙에게는 항소의 이익이 없다.", false, "▸ 피고 상계항변 인정되어 승소한 경우 피고도 상소이익 O\n피고 상계항변 인정되어 승소한 피고가 소구채권의 부존재를 주장하며 상소 O [2002다34666]\n'원고 소구채권 자체를 부정한 청구기각 판결'과 '소구채권 존재 인정하나 상계항변 인정한 청구기각 판결'은 216조에 따라 기판력 범위 다르고, 후자 판결에 대해 피고는 상소 이익 O\n∵ 상계항변은 수동채권 존재가 확정을 전제로 하는 예비적 항변, 소송상 상계 의사표시로 확정적 효과 발생은 X, 당해 소송에서 수동채권 존재 등 상계에 관한 법원의 실질적 판단 이뤄진 경우에 비로소 실체법상 상계 효과 발생 [2016다46338]", "기판력객관적범위"],
  ["7_028.①", "매수인 甲과 매도인 乙이 2015. 10. 10. X 부동산에 대해 매매계약을 체결한 후, 甲은 乙을 상대로 위 매매계약에 기하여 X 부동산에 관한 소유권이전등기청구의 소를 제기하였다. 이 소송에서 乙은 동시이행 항변으로 甲으로부터 5,000만 원의 지급을 받으면 이전등기를 하겠다고 주장하였지만, 법원은 '乙은 甲으로부터 3,000만 원을 지급받음과 동시에 甲에게 X 부동산에 관하여 2015. 10. 10. 매매를 원인으로 한 소유권이전등기절차를 이행하라.'는 판결을 선고하였다.§★ 위 판결 확정 후 乙이 丙에게 X 부동산을 매도하고 丙 앞으로 소유권이전등기를 마쳐 주었다면, 위 판결의 기판력은 丙에게도 미친다.", false, "▸ 기판력의 주관적 범위로서 변론종결 후 승계인(218조 1항) : 소송물 자체 승계인, 소송물이 물권적 청구권인 경우의 계쟁물 승계인 포함하는 적격승계설[통판] → '계쟁물 양도'의 경우 소송물이 채권적 청구권인 소유권이전등기청구권일 때는 전소 변론종결 후에 전소 피고인 채무자로부터 소유권이전등기 경료받은 자는 전소 기판력 미치는 변론종결 후 제3자 X [92다25151]", "기판력객관적범위"],
  ["7_028.④", "★ 위 소송에서 甲은 乙에 대한 2,000만 원의 대여금채권을 자동채권으로 하여 乙이 동시이행 항변으로 주장한 채권에 대해 상계 재항변을 하였고, 법원이 판결이유 중에 상계 재항변을 받아들여 동시이행 항변을 배척하는 판단을 하였다면, 2,000만원의 대여금채권이 존재한다는 판단에도 기판력이 발생한다.", false, "▸ 상계 주장의 대상인 수동채권이 소구채권이 아닌 동시이행항변권에 행사된 채권이라면 상계 주장에 기판력 X ∵ 216조 1항과 달리 동이항으로 행사된 채권의 존부·범위에 기판력이 생기는 부당한 결과 → 계약해제로 인한 매도인의 인도청구에 매수인이 해제로 인한 중도금반환채권으로 동이항을 하자 매도인이 점유사용료채권으로 상계재항변 → 상계 주장에 기판력 X [2004다17207]", "기판력객관적범위"],
  ["7_028.⑤", "★ 위 판결 선고 후 甲만이 항소를 제기한 경우, 항소심 법원은 乙의 동시이행 항변을 모두 받아들여 '乙은 甲으로부터 5,000만 원을 지급받음과 동시에 甲에게 X 부동산에 관하여 2015. 10. 10. 매매를 원인으로 한 소유권이전등기절차를 이행하라.'는 판결을 할 수 있다.", false, "▸ 제1심 상환이행판결에 원고가 항소한 경우, 반대급부에 기판력 생기지 않더라도, 반대급부 증액하여 원고 불리하게 변경되면 X ∵ 항소심은 당사자의 불복신청 범위 내에서만 제1심판결 당부 판단, 불복당사자의 불이익으로 변경하면 X(불이익변경금지) [2004다8197]", "기판력객관적범위"],
  ["7_029.④", "★ 확정판결이 있는 전소의 소송물이 후소의 선결문제로 되는 경우 후소 법원은 전소의 소송물인 권리관계의 존부에 관하여 전소 판결과 다른 취지의 판단을 할 수 있다.", false, "▸ 확정된 전소의 기판력 있는 법률관계가 후소의 소송물 자체가 아니어도 후소의 선결문제가 되면 전소 확정판결의 판단은 후소의 선결문제로서 기판력 작용 O → 소유권확인청구 판결 확정 후 다시 동일 피고 상대로 소유권에 기한 물권적 청구권 소송 제기하면 전소 확정판결에서의 소유권 존부 판단에 구속 O [98다18155]", "기판력객관적범위"],
  ["7_029.⑤", "★ 당사자가 확정된 승소판결이 있는 소송물에 대해 예외적으로 시효중단을 위하여 신소를 제기할 수 있는 경우라면, 후소법원은 그 확정된 권리를 주장할 수 있는 모든 요건이 구비되어 있는지를 심리할 수 있다.", false, "▸ 확정된 승소판결 받은 자가 동일한 청구 소 제기하면 권리보호이익 없으나, 예외적으로 소멸시효기간 10년 경과 임박하면 시효중단 위한 재소는 소의 이익 O → 이 경우 후소법원은 그 확정된 권리의 요건 구비 다시 심리할 수 X ∵ 전소 승소 확정판결 내용에 저촉 금지 [2018다22008]", "기판력객관적범위"],
  // 기판력주관적범위,
  ["7_030.②", "★ 소유권확인을 구하는 전소에서 패소확정판결을 받은 원고는 전소의 사실심 변론종결 전에 주장할 수 있었던 소유권 귀속의 원인이 되는 다른 사유를 당사자와 청구취지가 동일한 후소에서 주장할 수 없다.", true, "▸ 소유권확인청구는 그 원인이 달라져도 동일한 소송물", "기판력주관적범위"],
  ["7_030.③", "★ 채권자가 채무자를 대위하여 제3채무자를 상대로 소를 제기하였으나 피보전채권이 존재하지 않는다는 이유로 소각하 판결을 받아 확정된 경우, 그 판결의 기판력은 채권자가 채무자를 상대로 피보전채권의 이행을 구하는 후소에 미친다.", false, "▸ 대위소송에서 피보전채권 없어 각하판결 확정된 경우, 채권자가 채무자를 상대로 피보전채권의 이행 구하는 소송에 기판력 X ∵ 대위소송 기판력의 의미는 대위소송의 소송물인 피대위권리의 존부에 관하여 대위소송의 사실을 알았던 채무자에게도 미친다는 의미 → 대위소송의 소송요건인 피보전채권 존부에 관해 대위소송 당사자도 아닌 채무자에게 기판력 X [2011다108095] → 대위소송(각하확정) ⇨ 채권자소송 : 기판력 X", "기판력주관적범위"],
  ["SS민소P9.ㄱ", "소유권이전등기말소청구소송의 피고가 변론종결 전에 당해 부동산의 소유권을 타인에게 이전한 사실이 인정되더라도 전소 변론종결시까지 그 승계사실을 진술하지 아니하였다면 그 타인은 변론종결후 승계인으로 추정된다.", false, "▸ 제218조 2항은 변론종결 전의 승계를 주장하는 자에게 그 입증책임이 있다는 뜻을 규정한 것이므로 대위소송의 변론종결 이전에 대위의 원인이 된 토지에 관한 양도계약이 해약된 사실을 인정한 이상 변론종결시까지 당사자들의 승계진술이 없어도 당연히 변론종결 전의 권리의 승계의 경우에 해당한다. [77다92]\n제218조(기판력의 주관적 범위) ② 제1항의 경우에 당사자가 변론을 종결할 때(변론 없이 한 판결의 경우에는 판결을 선고할 때)까지 승계사실을 진술하지 아니한 때에는 변론을 종결한 뒤(변론 없이 한 판결의 경우에는 판결을 선고한 뒤)에 승계한 것으로 추정한다.", "기판력주관적범위"],
  ["SS민소P9.ㄴ", "★ 채권양수인이 확정판결의 기판력이 미치는 변론종결 후의 승계인에 해당하는지는 대항요건이 갖추어진 때를 기준으로 판단하여야 한다.", true, "▸ 채권양수인이 ① '소송계속 중' 승계인이라며 참가신청 한 경우 소송 계속 중 이뤄졌는지 여부, ② 218조 1항 확정판결 효력 미치는 '변론종결 후' 승계인 해당하는지 여부 → 채권양도 합의 시점 X, 채권양도 통지·승낙 대항요건 갖춘 시점 기준 O ∵ 대항요건 갖추지 않으면 채권양수인은 채무자와 아무런 법률관계 X, 권리주장 X [2020다210747]", "기판력주관적범위"],
  ["SS민소P9.ㄷ", "★ 토지 소유권에 기한 가등기말소청구소송에서 청구기각된 확정판결의 기판력은 위 소송의 변론종결 후에 원고로부터 근저당권을 취득한 제3자가 근저당권에 기하여 같은 가등기에 대한 말소청구를 하는 경우에는 미치지 않는다.", true, "▸ 토지 소유권에 기한 가등기말소청구의 청구기각 확정판결의 변론종결 후 토지 소유자로부터 근저당권 취득한 제3자는 '변론종결 후 승계인' X, 그가 근저당권에 기해 같은 가등기의 말소청구를 하는 후소에 기판력 미치지 않음 [2019다261381]", "기판력주관적범위"],
  ["SS민소P9.ㄹ", "★ 채무자가 상속포기를 하였으나 채권자가 제기한 소송에서 사실심 변론종결 시까지 이를 주장하지 않은 경우, 채권자의 승소판결 확정 후 청구이의의 소를 제기하여 강제집행을 배제할 수 있다.", false, "▸ 상속인이 한정승인을 하고도 변론종결시까지 주장하지 아니하여 책임 범위 유보 없는 판결확정 되어도 그 후 한정승인 사실 내세워 청구이의 O ∵ 기판력 X [2006다23138]\n그러나 설문은 한정승인이 아닌 '상속포기' → 상속포기는 소급효 있어 처음부터 상속인이 아닌 것으로 보는 점에서 한정승인의 경우와 다르게 볼 여지 있음 → 상속포기를 하고도 변론종결 전 주장하지 않았다면 기판력으로 차단된다는 것이 통설(한정승인과의 차이)\n[참고] [2006다23138] 판결은 한정승인 사안이고, 상속포기에 동일 법리 적용되지 않을 수 있음", "기판력주관적범위"],
  ["SS민소P9.ㅁ", "판결에 표시된 채무자 이외의 자가 판결에 표시된 채무자의 포괄승계인이거나 그 판결상의 채무 자체를 특정하여 승계하지 아니하는 한, 판결에 표시된 채무자에 대한 판결의 기판력 및 집행력의 범위를 그 채무자 이외의 자에게 확장하여 승계집행문을 부여할 수 없다.", true, "▸ 승계집행문 부여하려면 변론종결 후 승계인에 해당해야 하므로 [2012다111630]", "기판력주관적범위"],
  ["SS민소P9c.ㄷ", "★ 만약 乙이 2024. 4. 7. 丙을 상대로 불법행위로 인한 손해배상청구의 소를 제기하여 패소의 본안판결을 받았고 이 판결이 2025. 9. 7. 확정되었다면, 甲의 대위소송은 각하된다.", true, "▸ 채권자대위소송과 기판력\n① 대위소송 ⇨ 채무자소송 : 채무자가 알았을 경우에만 기판력 → 절차보장설 [통판]\n② 채무자소송 ⇨ 대위소송 : 기판력 or 당사자적격 흠결(채무자 권리 행사)\n③ A 대위소송 ⇨ D 대위소송 : '채무자'가 알았을 경우에만 기판력\n→ 위 ②의 경우 채무자 전소 패소확정 → 후소는 기각(기판력) + 각하(적격) → 각하 ∵ 소송요건 심리 선순위성", "기판력주관적범위"],
  ["기타민소P7_04", "★ 매매를 원인으로 한 소유권이전등기청구소송에서 패소확정판결을 받은 피고로부터 매매목적물의 소유권을 취득한 자", false, "▸ 기판력의 주관적 범위로서 변론종결 후 승계인(218조 1항) : 소송물 자체 승계인, 소송물이 물권적 청구권인 경우의 계쟁물 승계인 포함하는 적격승계설 [통판] → '계쟁물 양도'의 경우 소송물이 채권적 청구권인 소유권이전등기청구권일 때는 전소 변론종결 후에 전소 피고인 채무자로부터 소유권이전등기 경료받은 자는 전소 기판력 미치는 변론종결 후 제3자 X [92다25151]", "기판력주관적범위"],
  // 판결,
  ["7_031.①", "★ 원고가 피고의 주소를 허위로 기재함으로써 소장부본 및 원고승소 판결정본이 공시송달의 방법으로 송달된 경우, 피고는 항소기간 도과 후 추후보완 항소 또는 재심의 소를 제기하여 구제받을 수 있다.", true, "▸ 판결정본이 공시송달 되었다면 주소 허위나 요건 미비 있더라도 송달은 유효하여 항소기간 도과하고 판결은 형식적 확정 O [94다27922] → 11호, 추후보완항소", "판결"],
  ["7_031.②", "★ 원고가 피고의 주소를 허위로 기재함으로써 그 주소로 소장부본 및 무변론 원고 승소 판결정본이 보내져 피고가 아닌 제3자가 수령하여 송달된 것으로 처리된 경우, 피고는 항소를 제기하여 구제받을 수 있다.", true, "▸ 원고가 피고 주소 거짓으로 기재하여 판결정본을 원고 측 스스로 수령하는 경우 송달 무효, 항소기간 진행 X → 소송행위 추완 X → 항소가 판결정본 송달 전에 제기된 것으로서 적법 [97다10345] → 항소 O (다만 당사자가 추완 항소로 제기하면 통상의 항소로 선해 O)", "판결"],
  ["7_031.③", "편취된 확정판결에 기한 강제집행이 불법행위로 되는 것은 당사자의 절차적 기본권이 근본적으로 침해된 상태에서 판결이 선고되었거나 확정판결에 재심사유가 존재하는 등 확정판결의 효력을 존중하는 것이 정의에 반함이 명백하여 이를 묵과할 수 없는 경우로 한정하여야 한다.", true, "▸ 확정판결에 기한 강제집행이 불법행위로 되려면 당사자 절차적 기본권이 근본적 침해된 상태에서 판결 선고됐거나 재심사유 존재하는 등 확정판결 존중하는 것이 정의에 반함이 명백하여 이를 묵과할 수 없는 경우로 한정해야 [95다21808]", "판결"],
  ["7_031.④", "★ 대여금 중 일부를 변제받고도 이를 속이고 대여금 전액에 대하여 소를 제기하여 승소 확정판결을 받은 후 강제집행에 의하여 판결금을 수령한 채권자에 대하여, 채무자는 재심절차 등을 거치지 아니하고도 그 일부 변제금 상당액이 법률상 원인 없는 이득에 해당한다는 이유로 부당이득반환을 구할 수 있다.", false, "▸ 편취판결 의한 강제집행이 이뤄진 경우 재심으로 확정판결 취소되지 않는 한 부당이득 X [94다41430]", "판결"],
  ["7_031.⑤", "편취된 확정판결에 기한 강제집행이 권리남용에 해당한다면, 그 판결의 피고(집행채무자)는 청구이의의 소로써 그 집행의 배제를 구할 수 있다.", true, "▸ 확정판결에 의한 권리라 하더라도 신의에 좇아 성실히 행사되어야 하고, 판결에 기한 집행이 권리남용이 되는 경우는 허용 X → 집행채무자는 청구이의의 소로 그 집행 배제 구할 수 O [99다32899]", "판결"],
  ["7_032.ㄴ", "★ 甲이 乙을 상대로 소유권에 기하여 제기한 A 토지의 인도청구 소송에서 제1심 법원이 甲의 청구를 기각하자 甲은 항소심에서 임료 상당의 부당이득반환청구를 추가하였는데, 항소심 법원이 판결이유에서 甲의 A 토지 인도청구와 부당이득반환청구가 모두 이유 없다고 판단하면서도 '甲의 항소를 기각한다.'라는 것만 판결주문에 표시한 경우, 甲이 부당이득반환청구 부분에 대하여 한 상고는 적법하다.", false, "▸ 항소심에서 새로운 청구 추가된 경우, 제1심이 기존 청구 배척하며 '청구기각' 판결했는데 항소심이 기존 청구 및 항소심에서 추가된 청구 모두 배척하려면 단순히 '항소기각' 주문 표시만으로는 X, 이와 함께 항소심에서 추가된 청구에 대해 '청구기각' 주문 표시해야 ∵ 항소심은 추가된 청구에 대해 실질적으로 제1심으로서 재판해야 [2004다24083]\n제1심에서 저작재산권침해 손배 일부 인용하자 쌍방 항소 → 원고는 저작인격권침해로 인한 손해배상을 '예비적'으로 추 → 항소심이 저작재산권침해 손배 추가 인용하며 원고 패소 부분 취소, 원고 나머지 항소 및 피고 항소의 각 기각 주문표시 → 원심은 추가된 청구에 기각 주문 있어야 (∵ 당사자는 예비적으로 병합했어도 단순병합 성질 그대로) → 재판누락, 원심 계속 중 → 상고 부적법 [2007다354]", "판결"],
  ["7_033.①", "★ 구체적인 사건의 판결선고 전에 당사자 쌍방이 서면에 의하여 미리 상소하지 않기로 하는 합의가 유효하게 성립하였다면, 그 판결은 선고와 동시에 확정된다.", true, "▸ 구체적 사건 소송계속 중 소송당사자 쌍방이 판결 선고 전에 미리 상소하지 않기로 합의하면 판결은 선고와 동시에 확정 → 반드시 명확한 취지 표현된 서면에 의해야 ∵ 상소권 사전포기는 중대한 소송법상의 효과 발생 [2000다17803]", "판결"],
  ["7_033.②", "★ 원고의 대여금청구와 매매대금청구를 모두 인용한 제1심 판결 중 일부에 대해서만 피고가 항소한 경우, 항소하지 않은 나머지 부분도 확정이 차단되고 항소심으로 이심은 되지만, 피고가 변론종결 시까지 항소취지를 확장하지 않는 한 그 나머지 부분은 항소심의 심판대상이 되지 않는다.", true, "▸ 제1심판결이 단순병합인데 일부만 항소한 경우 → 나머지 청구도 이심 및 확정차단(상소불가분의 원칙), 그러나 항소심 변론종결 시까지 부대항소 등 항소취지 확장하지 않는 한 나머지 청구 부분은 항소심 심판대상 X(불이익변경금지의 원칙) [94다44644]\n제415조(항소를 받아들이는 범위) 제1심 판결은 그 불복의 한도안에서 바꿀 수 있다. 다만, 상계에 관한 주장을 인정한 때에는 그러하지 아니하다.", "판결"],
  ["7_034.③", "★ X 토지의 인도청구에 소유권이전등기말소청구가 단순병합된 소에서 X 토지의 인도청구에 대하여만 판단하고 소유권이전등기말소청구에 대한 재판을 누락한 판결이 확정된 경우, 소유권이전등기말소청구 부분에 대한 상소는 허용되지 않는다.", true, "▸ 일부판결 불허 : 선택적·예비적 병합, 예비적·선택적 공동소송, 본소와 반소가 동일 목적 형성청구나 동일 법률관계인 경우, 필수적 공동소송, 독립당사자참가소송 → 일부에 대한 판단 없다면 '재판누락' → 추가판결\n단순병합, 통상 공동소송 → 일부에 대한 판단 없다면 '일부판결' 허용\n인도청구에 소이등말소청구가 단순병합된 소에서 인도청구에 대하여만 판단하고 소이등말소청구에 대한 재판 누락한 판결 확정 → 소이등말소청구 부분에 대한 상소는 허용되지 않음", "판결"],
  ["7_035.ㄷ", "■보충 이혼소송 중 일방당사자가 사망하였음에도 법원이 이를 알지 못하고 이혼판결을 선고한 경우, 이 판결은 당연무효라고는 할 수 없다.", false, "▸ 이혼소송과 재산분할청구가 병합된 경우, 이혼소송 수계 X, 당연종료 O ∵ 이혼청구권은 일신전속적 → 재산분할청구도 동시 종료 O ∵ 이혼성립 전제로 한 권리로서 유지할 이익 X [94므246] → 판결이유에서 '그러므로 원심피고의 사망을 간과하고 한 원심판결은 당연무효이므로 이를 파기하고'라고 설시한 부분을 지문으로 출제한 것으로 보이나, '파기'는 '유효하나 위법'인 판결을 대상으로 하는 점(무효인 판결은 파기할 수 없고 상고 각하함), 통상 소송계속 중 사망을 간과한 판결을 무효로 보지 않는 점 등을 고려할 때, 대법원이 원심판결을 '당연무효'로 부정확하게 표현한 것을 객관식 지문으로 출제하는 것의 적절성에 의문이 있음(私見)", "판결"],
  ["7_035.ㄹ", "★ 원고의 청구에 대해 피고가 본소청구의 인용을 조건으로 하는 예비적 반소를 제기하였는데, 법원이 원고의 청구를 기각하면서 피고의 예비적 반소에 대해서도 판결하였다면 예비적 반소부분에 대한 판결은 무효이다.", true, "▸ 본소청구 배척하면 예비적 반소는 심판대상 X, 제1심이 판단하여도 효력 없음 [2006다19061] → 본소와 예비적 반소를 모두 각한한 사안에서 예비적 반소 부분에 대한 판결이 무의미하여 효력이 없다고 한 사안인(수업시간에 따로 설명한 부분)", "판결"],
  ["7_035.ㅁ", "무효인 판결을 대상으로 재심청구를 하는 것은 허용되지 않는다.", true, "▸ 무효인 판결에 대해서는 상소·재심 등 불복 X", "판결"],
  ["7_036.①", "■보충 판결상 당사자의 주소가 잘못된 경우라도 주민등록표 등으로 동일인임을 소명할 수 있으면 판결의 경정신청을 기각할 수 있다.", true, "▸ 판결에 표시된 등기의무자의 주소와 등기부 주소가 다르더라도 주민등록표 등에 의해 동일인임을 소명할 수 있다면 등기부상 주소 표시가 없다는 이유로 한 판결경정신청은 기각 [87그4]", "판결"],
  ["7_036.②", "판결이유를 토대로 볼 때 판결 내용의 오류 또는 판단누락이 분명하면 판결경정을 할 수 있다.", false, "▸ 판결경정(제211조) : 잘못된 계산·기재·표현상 잘못 분명한 경우 법원 스스로 결정으로 정정·보충하여 스스로 고치는 것 → 판단잘못·판단누락은 판결경정 X\n판결 내용의 오류나 판단누락은 판결경정사유 X [67주4]", "판결"],
  ["7_037.ㄷ", "★ 甲이 乙을 상대로 소를 제기하면서 乙의 주소를 알면서도 丙의 주소를 기재하여 丙이 송달을 받아 乙의 불출석으로 인한 자백간주를 이유로 甲의 승소판결이 선고되고 丙이 판결정본을 수령한 경우, 乙은 재심을 청구할 수 있다.", false, "▸ 원고가 피고 주소 거짓으로 기재하여 판결정본을 원고 측 스스로 수령하는 경우 송달 무효, 항소기간 진행 X → 소송행위 추완 X → 항소가 판결정본 송달 전에 제기된 것으로서 적법 [97다10345] → 항소 O, 재심 X, 추완항소 X(다만 추완항소 제기하면 항소로 선해)", "판결"],
  ["7_038.②", "★ 甲이 乙을 상대로 S 토지의 소유권존재확인의 소를 제기하면서, 乙의 주소를 자신의 지인인 丙의 주소로 허위기재하여 丙이 소송서류를 받아 자백간주를 이유로 판결이 선고된 경우, 丙이 판결정본을 수령한 날로부터 2주가 경과되어도 乙은 상소를 제기할 수 있다.", true, "▸ 원고가 피고 주소 거짓으로 기재하여 판결정본을 원고 측 스스로 수령하는 경우 송달 무효, 항소기간 진행 X → 소송행위 추완 X → 항소가 판결정본 송달 전에 제기된 것으로서 적법 [97다10345] → 항소 O, 재심 X, 추완항소 X(다만 추완항소 제기하면 항소로 선해)", "판결"],
  ["7_039.④", "★ 원고가 소장에 피고의 주소를 허위로 기재하여 송달불능을 이유로 재판장으로부터 공시송달 명령을 받아(소송지연을 피하기 위해 필요한 경우) 소송절차가 진행된 결과 원고승소 판결이 선고된 경우, 항소기간이 도과하면 그 판결에 기판력이 발생한다.", true, "▸ 판결정본이 공시송달 되었다면 주소 허위나 요건 미비 있더라도 송달은 유효하여 항소기간 도과하고 판결은 형식적 확정 O [94다27922] → 11호, 추후보완상소", "판결"],
  // 청구의병합,
  ["8_001.①", "★ 원고가 논리적으로 전혀 관계가 없어 순수하게 단순병합으로 구하여야 할 수 개의 청구를 선택적 또는 예비적으로 병합하여 청구하였는데, 제1심법원이 그중 하나의 청구에 대하여만 심리·판단하여 이를 인용하고 나머지 청구에 대한 심리·판단을 모두 생략하는 내용의 판결을 하여 피고만이 이에 대하여 항소한 경우, 위 수 개의 청구는 모두 항소심으로 이심된다.", false, "▸ 논리적 관계 없어 단순병합으로 구할 여러 청구를 선택적 병합 청구하는 것은 부적법 불허 → 법원은 소송지휘권 행사하여 단순병합으로 보정하게 조치 위하여야 → 법원이 조치 없이 본안판결 하며 하나만 심리·판단 인용하고 나머지는 심리·판단 생략하는 판결 → 이에 피고만 항소하면, 제1심법원이 심리·판단 인용한 청구만이 항소심 이심, 심리·판단 않은 나머지 청구는 여전히 제1심에 남아 있음 [2006다5550]", "청구의병합"],
  ["8_001.②", "★ 원고가 실질적으로 선택적 병합 관계에 있는 두 청구에 관하여 주위적·예비적으로 순위를 붙여 청구하였고, 그에 대하여 제1심법원이 주위적 청구를 기각하고 예비적 청구만을 인용하는 판결을 선고하여 피고만이 항소한 경우, 항소심으로서는 두 청구 모두를 심판의 대상으로 삼아 판단하여야 한다.", true, "▸ 부진정 예비적 병합(실질적 선택적 병합 성질인데 당사자가 순위 붙여 청구)에서 제1심이 주위 기각, 예비 인용 → 피고만이 항소 → 항소심은 두 청구 모두 심판대상으로(=선택적 병합, ≠예비적 병합) ∵ 병합의 판단은 당사자 의사 아닌 병합청구 성질 기준으로 [2013다96868]", "청구의병합"],
  ["8_001.③", "★ 서로 양립할 수 없는 수 개의 청구가 주위적·예비적으로 병합된 경우, 주위적 청구를 먼저 판단하지 않고 예비적 청구만을 인용하거나, 주위적 청구만을 배척하고 예비적 청구에 대하여 판단하지 않는 것은 법률상 허용되지 아니한다.", true, "▸ 주위적 청구 먼저 판단 없고 예비적 청구만 인용하거나 주위적 청구 배척하고 예비적 청구 판단하지 않는 등의 일부판결은 불허 ∵ 수 개 청구가 하나의 소송절차에 불가분적 결합되어 있는 예비적 병합의 성질에 반하므로 → 그러한 판결에 상소 제기되면 판단 누락된 예비적 청구 부분도 상소심에 이심, 이는 부진정 예비적 병합도 마찬가지 [2020다292411]", "청구의병합"],
  ["8_001.④", "★ 수 개의 청구를 단순병합한 소가 제기되었는데, 제1심법원이 그중 하나의 청구를 인용하고 나머지 청구는 기각하는 판결을 선고하였고, 이에 대하여 피고만이 위 인용된 청구에 대하여 항소한 경우, 위 수 개의 청구 모두가 항소심으로 이심되지만 피고가 불복한 청구만이 항소심의 심판 대상이 된다.", true, "▸ 제1심판결이 단순병합인데 일부만 항소한 경우 → 나머지 청구도 이심 및 확정차단(상소불가분의 원칙), 그러나 항소심 변론종결 시까지 부대항소 등 항소취지 확장하지 않는 한 나머지 청구 부분은 항소심 심판대상 X(불이익변경금지의 원칙) [94다44644]", "청구의병합"],
  ["8_002.②", "★ 논리적으로 전혀 관계없는 수개의 청구를 선택적 또는 예비적으로 병합하여 청구하였는데 법원이 어떠한 보정도 명하지 않고 본안판결을 하면서 그중 하나의 청구에 대해서만 판단하여 인용하고 나머지 청구를 판단하지 아니하였다면, 피고의 항소에 따라 이심되는 청구는 제1심에서 심리·판단하여 인용된 청구에 국한된다.", true, "▸ 단순(성질) ⇨ 선택·예비(청구) : 부적법 → 보정해야 → 법원 간과하여 청구 1개 인용하면서 다른 청구 판단 안 하면 → 재판누락·추가판결 문제 O (판단누락 X) → 항소된 경우도 누락된 청구는 제1심에 잔존 상태 [2006다5550]", "청구의병합"],
  ["8_002.③", "주위적 청구가 전부 인용되지 않을 경우에는 주위적 청구에서 인용되지 아니한 금액 범위 내에서의 예비적 청구에 대해서도 판단하여 주기를 바라는 취지로 성질상 선택적 관계에 있는 양 청구를 불가분적으로 결합하여 제소할 수 있다.", true, "▸ 합리적 필요성 있는 '부진정 예비적 병합'에서 법원이 주위적 청구 일부 인용한 것이 예비적 청구보다 '금액 적다면' 기각된 주위적 청구 수액 범위의 예비적 청구 판단 구하는 취지인지 당사자에게 석명해야 ∵ 주위 일부 기각되면 예비도 판단해주길 바라는 불가분적 결합 제소도 가능하므로 [2002다23598]", "청구의병합"],
  ["8_002.④", "★ 채권자가 본래적 급부청구에 이를 대신할 전보배상을 부가하여 대상청구를 병합하여 소구한 경우, 이는 본래의 급부청구권이 현존함을 전제로 하여 이것이 판결확정 전에 이행불능이 되거나 또는 판결확정 후에 집행불능이 되는 경우에 대비하여 전보배상을 미리 청구하는 것이므로 양자의 병합은 현재의 급부청구와 장래의 급부청구의 단순병합에 속하는 것으로 허용된다.", true, "▸ 본래적 급부청구에 이를 대신할 전보배상 부가하여 대상청구 병합 소구 → 판결확정 전 이행불능 또는 판결확정 후 집행불능 되는 경우 대비하여 전보배상을 미리 청구한 것 → 현재 급부청구와 장래 급부청구의 단순병합 O → 이를 예비적으로 병합했더라도 주위 인용 이유로 예비 판단 생략할 수 X [2011다30666]", "청구의병합"],
  ["8_002.⑤", "★ 항소심 법원은 선택적으로 병합된 수개의 청구 중 제1심에서 심판되지 아니한 청구를 임의로 선택하여 심판할 수 있으며 심리 결과 그 청구가 이유 있다고 인정하는 경우, 그 결론이 제1심판결의 주문과 동일하여도 제1심판결을 취소한 다음 새로이 이 청구를 인용하는 주문을 선고하여야 한다.", true, "▸ 선택적 병합에서 항소심은 제1심 판결과 상관없이 자유롭게 선택하여 인용할 수 O → 제1심과 다른 청구 인용할 경우는 결론적으로 금액 동일해도 항소기각 X → 제1심판결 취소 및 청구인용 새 주문 선고해야 [92다7023]", "청구의병합"],
  ["8_003.②", "매수인인 甲은 매도인인 乙을 상대로 하여 주위적으로 매매계약이 유효하다고 주장하면서 매매를 원인으로 한 소유권이전등기절차의 이행을, 예비적으로 위 매매계약이 무효인 경우 이미 지급한 매매대금의 반환을 구하는 소를 제기하였다.§★ 제1심 법원이 甲의 소유권이전등기청구를 인용하였고, 乙이 그 패소 부분에 대하여 항소하자 항소심 법원이 乙의 항소를 받아들여 위 소유권이전등기청구를 전부 배척하는 경우, 항소심 법원은 제1심 법원이 판단하지 않았던 매매대금반환 청구에 관하여 반드시 심판을 하여야 한다.", true, "▸ 예비적 병합에서 제1심이 주위적 청구 인용, 예비적 청구 불판단 → 피고만 항소 → 항소심이 피고 항소 받아들여 주위적 청구 기각할 경우에는 예비적 청구 반드시 판단해야 (병합과 항소심 필기그림 중 3번 그림)\n1심은 주위적 청구 일부 인용, 예비적 청구 모두 기각 → 피고가 항소 → 항소심은 피고 항소 받아들여 제1심판결 취소, 그에 해당하는 주위적 청구 기각 → 항소심은 기각하는 주위적 청구 부분과 관련된 예비적 청구를 심판대상으로 삼아 판단하여야 [98다22253]", "청구의병합"],
  ["8_003.③", "★ 제1심 법원이 소유권이전등기청구를 기각하면서 매매대금반환청구에 대하여 판단하지 아니하는 판결을 한 경우, 甲이 그 판결에 대하여 항소하더라도 매매대금반환청구는 항소심으로 이심(移審)되지 않고 제1심 법원에 계속된다.", false, "▸ 주위적 청구 배척하며 예비적 청구 판단 않은 판결에 상소 제기되면 누락된 예비적 청구도 이심 O, 재판누락 X, 원심 계속 중 X [98다22253]\n일부판결 불허 : 선택적·예비적 병합, 예비적·선택적 공동소송, 본소와 반소가 동일 목적 형성청구나 동일 법률관계인 경우, 필수적 공동소송, 독립당사자참가소송 → 일부에 대한 판단 없다면 '재판누락' → 추가판결", "청구의병합"],
  ["8_003.⑤", "★ 제1심 법원이 소유권이전등기청구를 기각하고 매매대금반환청구를 인용하자 乙만이 그 패소 부분에 대하여 항소한 후 乙이 항소심에서 소유권이전등기청구를 인낙한 경우, 매매대금반환청구는 심판 없이 종결된다.", true, "▸ 예비적 병합에서 제1심 법원이 주위적 청구 기각, 예비적 청구 인용 → 피고만 항소 → 주위적 청구도 항소심 이심되나, 항소심 심판범위는 피고의 불복신청 범위인 예비적 청구 인용의 당부에 한정, 원고의 부대항소가 없는 한 주위적 청구는 심판대상 X [94다31624] → 상소불가분, 불이익변경금지 (병합과 항소심 필기그림 중 4번 그림)\n하지만 이 경우 항소심에서 피고가 주위적 청구 인낙하면 예비적 청구 부분 심판 없이 종결됨 [92다12032]", "청구의병합"],
  ["8_004.⑤", "★ 선택적 병합에서 원고 패소판결을 하면서 병합된 청구 중 어느 하나를 판단하지 않은 경우, 판단되지 않은 청구부분은 재판의 누락으로서 제1심 법원에 그대로 계속되어 있다고 볼 것이다.", false, "▸ 제1심법원이 선택적 병합 중 하나 기각하고, 나머지는 아무런 판단 X → 위법 → 원고가 제1심판결에 항소하면 전부 이심, 판단하지 않은 청구는 재판누락 X, 제1심법원에 남아있지 X [96다99] → 판단누락", "청구의병합"],
  ["SS민소P8b.①", "★ 법원이 이혼 판결을 선고하면서 미성년인 자녀에 대한 친권자 및 양육자를 정하지 아니하였다면 재판의 누락이다.", true, "▸ 재판상 이혼에서 당사자 청구 없었더라도 법원이 직권으로 친권자·양육자 정해야 → 정하지 않았다면 재판누락 [2013므2397] → 처분권주의의 예외", "청구의병합"],
  ["SS민소P8b.②", "★ 예비적 청구만 분리하여 심리하거나 일부 판결을 할 수 없으며, 피고도 예비적 청구에 관하여만 인낙을 할 수 없다.", true, "▸ 예비적 병합에서 피고가 예비적 청구만 인낙 X, 조서 기재 무효 [94다62017]", "청구의병합"],
  ["SS민소P8b.④", "★ 선택적으로 병합된 수개의 청구를 모두 기각하거나 소를 각한 항소심판결에 대하여 원고가 상고한 경우, 상고법원이 선택적 청구 중 어느 하나의 청구에 관한 상고가 이유 있다고 인정할 때에는 원심판결을 전부 파기환송하여야 한다.", true, "▸ 선택적 병합에서 모두 기각한 항소심판결에 대해 원고 상고하고 상고심법원이 일부라도 상고이유 있다고 인정할 때에는 원심판결을 전부 파기환송해야 [92다46226]", "청구의병합"],
  ["SS민소P8b.⑤", "★ 원고의 주위적 청구원인이 이유 있다고 인정한 다음에 피고의 일부 항변을 받아들여 그 부분에 한한 원고의 청구를 기각하는 경우, 특별한 사정이 없는 한 예비적 청구원인이 이유 있는지에 관하여 판단할 필요는 없다.", true, "▸ 주위적 청구 일부 인용할 경우, 주위적 청구 일부를 특정하여 그 부분 인용을 해제조건으로 '그 부분에만' 예비적 청구 했다는 특별한 사정이 없는 한, 주위적 청구의 일부가 기각된다고 하여 그 부분의 예비적 청구 판단할 필요 X [99다53742]", "청구의병합"],
  ["SS민소P8c.①", "★ 재심의 소에서는 확정판결의 취소와 본소청구의 기각을 구하는 이외의 새로운 청구를 병합할 수 없다.", true, "▸ 원고의 허위 주소 소제기 승소확정판결에 피고가 재심 제기하면서 확정판결 취소 및 그 본소청구 기각 구하는 것 외에 동시에 새로운 청구 병합할 수 X [71다8]", "청구의병합"],
  ["SS민소P8c.②", "★ 병합의 형태가 선택적 병합인지 예비적 병합인지는 당사자의 의사가 아닌 병합청구의 성질을 기준으로 판단하여야 한다.", true, "▸ 선택적인지 예비적인지는 병합청구의 성질(=양립가능성 여부)을 기준으로 결정 O → 당사자 의사(주위적·예비적 순서 부여)로 결정 X [2013다96868]", "청구의병합"],
  ["SS민소P8c.⑤", "논리적으로 양립할 수 있는 수 개의 청구라고 하더라도 수 개의 청구 사이에 논리적 관계가 밀접하고 심판의 순위를 붙여 청구를 할 합리적 필요성이 있다고 인정되는 경우, 이른바 부진정 예비적 병합 청구의 소도 허용된다.", true, "▸ 논리적으로 양립 가능한 청구들이더라도 심판 순위 붙여 청구할 합리적 필요성이 인정되면 부진정 예비적 병합 허용 O [2020다292411]", "청구의병합"],
  ["SS민소P8d.①", "★ 등기의 원인무효를 이유로 한 말소등기청구소송에서 등기원인의 무효를 뒷받침하는 개개의 사유는 별개의 청구원인을 구성하므로 그 사유가 여러 개인 경우 청구의 병합에 해당한다.", false, "▸ 등기 말소청구권의 소송물의 동일성 식별 표준이 되는 청구원인, 즉 말소등기청구권의 발생원인은 등기원인 무효로 국한되고, 등기원인 무효를 뒷받침하는 개개 사유는 독립된 공격방어방법에 불과 [82다카148]", "청구의병합"],
  ["SS민소P8d.②", "■보충 이혼 및 재산분할청구를 하면서 부부간의 명의신탁해지를 원인으로 한 소유권이전등기청구를 병합할 수 있다.", false, "▸ 가사소송법 제2조 제1항 소정의 나류 가사소송사건과 마류 가사비송사건은 통상의 민사사건과는 다른 종류의 소송절차 → 원칙적으로 위 가사사건에 관한 소송에서 통상의 민사사건에 속하는 청구(명의신탁 해지 원인 소이등청구)를 병합할 수 X\n제253조(소의 객관적 병합) 여러 개의 청구는 같은 종류의 소송절차에 따르는 경우에만 하나의 소로 제기할 수 있다.", "청구의병합"],
  ["SS민소P8d.③", "★ 제1심법원이 주위적 청구는 기각하고 예비적 청구만을 인용하는 판결을 선고한 데 대하여 피고만이 항소한 경우, 항소제기에 의한 이심의 효력은 주위적 청구 부분에는 미치지 않는다.", false, "▸ 예비적 병합에서 제1심 법원이 주위적 청구 기각, 예비적 청구 인용 → 피고만 항소 → 주위적 청구도 항소심 이심되나, 항소심 심판범위는 피고의 불복신청 범위인 예비적 청구 인용의 당부에 한정 [94다31624] → 상소불가분, 불이익변경금지", "청구의병합"],
  ["8_005.ㄱ", "보험회사 甲은, 乙이 적정입원일수를 초과하여 입원한 기간에 관한 보험금 4천만 원을 수령하였음을 이유로, 乙을 상대로 불법행위를 원인으로 한 손해배상청구와 부당이득반환청구를 선택적으로 구하였다.§판례에 따르면 불법행위를 원인으로 한 손해배상청구와 부당이득반환청구는 양립할 수 없으므로 甲은 소제기 당시부터 예비적 병합 형태로 소를 제기하였어야 한다.", false, "▸ 제1심에서 선택적 병합 중 1개 인용되고 피고가 항소한 경우, 원고가 항소심에서 병합 형태 변경하여 제1심에서 심판되지 않은 청구를 주위적으로, 인용된 청구를 예비적으로 구함에 따라 항소심이 주위적 청구를 먼저 심리하여 이유 있다고 인정했다면, 비록 결론이 제1심판결의 주문과 동일하여도 항소기각 X, 새로이 청구 인용 주문 선고해야 [2018다229625] → 합리적 이유 있는 예비적 병합으로 보았다는 평가가 다수\n불법행위 손해배상과 부당이득반환은 양립 가능하여 원래 성질은 선택적 병합이 타당하므로 지문은 틀림", "청구의병합"],
  ["8_006.②", "★ 등기원인이 무효임을 이유로 소유권이전등기의 말소를 구하는 청구를 하면서 그 등기가 명의신탁에 따라 이루어진 것이지만 그 신탁이 해지되었음을 이유로 소유권이전등기를 구하는 청구를 병합하면 이는 적법한 선택적 병합이다.", false, "▸ 등기원인이 무효인지 명의신탁으로서 유효이므로 해지할 것인지는 양립 불가능하므로 예비적 병합\n예비적(양립불능 성질) ⇨ 선택적(무순 청구) : 부적법법 [81다카1120]", "청구의병합"],
  ["8_006.③", "★ 실질적으로 선택적 병합 관계에 있는 두 청구를 당사자가 주위적·예비적으로 순위를 붙여 청구하였고 그에 대하여 제1심법원이 주위적 청구를 기각하고 예비적 청구만 인용하는 판결을 선고하여 피고만 항소를 제기한 경우, 항소심은 두 청구를 선택적 병합관계로서 심판하여야 한다.", true, "▸ 부진정 예비적 병합(실질적 선택적 병합 성질인데 당사자가 순위 붙여 청구)에서 제1심이 주위 기각, 예비 인용 → 피고만이 항소 → 항소심은 두 청구 모두 심판대상으로(=선택적 병합, ≠예비적 병합) ∵ 병합의 판단은 당사자 의사 아닌 병합청구 성질 기준으로 [2013다96868] → 부진정 예비적 병합으로서의 합리적 필요성 부정된 사안", "청구의병합"],
  ["8_007.①", "★ 원고의 주위적 청구를 전부 인용한 제1심판결에 대하여 피고가 항소하자 항소심이 제1심판결을 취소하고 원고의 주위적 청구를 기각하는 경우, 항소심은 예비적 청구에 대하여도 심판하여야 한다.", true, "▸ 主 인용, 豫 판단 불요 → 피고 항소 → 이심 전부, 심판대상 전부(不變禁 X)\n主 기각, 豫 인용 → 피고 항소 → 이심 전부, 심판대상 불복만(不變禁)\n예비적 병합에서 주위적 청구 인용할 때 예비적 청구 심판 X → 피고 항소하면 예비도 이심 O, 항소심 심판 범위에 포함됨 (不變禁 없음) → 항소심은 피고 항소 받아들여 제1심판결 취소, 그에 해당하는 주위적 청구 기각 → 항소심은 기각하는 주위적 청구 부분과 관련된 예비적 청구를 심판대상으로 삼아 판단하여야 [98다22253]", "청구의병합"],
  ["8_008.ㄴ", "피고의 사기행위로 인한 재산상 손해배상청구와 피고의 강제추행으로 인한 정신적 손해배상청구를 심판순서를 붙여 주위적·예비적 청구로 하여 병합할 수 있다.", false, "▸ 두 청구는 논리적 관련성이 없는 '단순병합'이므로 거기에 심판 순서를 붙이는 병합은 허용될 수 없음 (합리적 필요성 여부로 판단하는 '부진정 예비적 병합'은 일반적으로는 단순병합이 아닌 '선택적 병합'에 대하여 심판순서 붙일 경우를 말함)", "청구의병합"],
  ["8_008.ㄹ", "★ 부진정 예비적 병합의 경우, 주위적 청구만을 배척하고 예비적 청구에 대하여 판단하지 않은 판결에 대한 상고가 제기되면 판단되지 않은 예비적 청구 부분도 상소심으로 이심이 되고, 그 부분이 재판의 누락에 해당하여 원심에 계속 중이라고 볼 것은 아니다.", true, "▸ 예비적 병합에서 주위 배척, 예비 불판단 → 상소하면 판단누락된 예비도 이심 O, 원심 계속 중 X → 이러한 법리는 부진정 예비적 병합도 동일 [2020다292411]", "청구의병합"],
  ["8_009.③", "★ 주위적으로 무조건적인 소유권이전등기 절차의 이행을 청구하고, 예비적으로 금전 지급과 상환으로 소유권이전등기 절차의 이행을 청구하는 경우 위 예비적 청구는 소송상의 예비적 청구로 볼 수 없다.", true, "▸ 양적 일부감축이나 질적 일부감축(무조건청구·상환이행청구)하여 하는 청구는 주위적 청구에 흡수되는 것일 뿐 예비적 청구 X [2016다225353]", "청구의병합"],
  ["8_009.④", "★ 수개의 청구가 제1심에서 선택적으로 병합되고 그 중 어느 한 개의 청구에 대한 인용판결이 선고되어 피고가 항소를 제기한 경우, 심리한 결과 제1심에서 판단하지 않은 다른 청구가 이유 있다고 인정되고 그 결론이 제1심판결의 주문과 동일한 경우 법원은 피고의 항소를 기각하여야 한다.", false, "▸ 선택적 병합에서 항소심은 제1심 판결과 상관없이 자유롭게 선택하여 인용할 수 O → 제1심과 다른 청구 인용할 경우는 결론적으로 금액 동일해도 항소기각 X → 제1심판결 취소 및 청구인용 새 주문 선고해야 [92다7023]", "청구의병합"],
  ["8_010.①", "매도인인 원고가 매수인인 피고를 상대로 매매계약의 유효를 이유로 매매대금지급을 구하면서, 매매계약이 무효로 되는 경우에 대비하여 인도한 목적물의 반환을 구하는 내용으로 양 청구를 선택적으로 병합하는 것도 허용된다.", false, "▸ ① 단순병합 : 모든 청구 심판해야 / 관련성無 / 분리이 / 일부판결, 재판누락, 추가판결 문제 O\n② 선택적 병합 : 하나 인용시 다른 심판 불요(하나 인용을 해제조건으로 다른 하나의 심판을 구함) / 관련성 有 : 양립가능, 순서無 / 분리不可 / 판단누락, 상소 문제\n③ 예비적 병합 : 주위 인용시 예비 심판 불요(주위 인용을 해제조건으로 예비 심판을 구함) / 관련성 有 : 양립不可, 순서有 / 분리不可 / 판단누락, 상소 문제\n선택적인지 예비적인지는 병합청구의 성질(=양립가능성 여부)을 기준으로 결정 O → 당사자 의사(주위적·예비적 순서 부여)로 결정 X [2013다96868]\n논리적으로 양립 불능한 성질의 청구들을 선택적으로 병합하면 부적법 [81다카1120]", "청구의병합"],
  ["8_011.①", "★ 논리적으로 양립할 수 없는 수개의 청구가 선택적으로 병합된 경우 이들 청구는 동일 소송절차 내에서 동시에 심판될 수 없다.", true, "▸ 선택적인지 예비적인지는 병합청구의 성질(=양립가능성 여부)을 기준으로 결정 O → 당사자 의사(주위적·예비적 순서 부여)로 결정 X [2013다96868]\n논리적으로 양립 불능한 성질의 청구들을 선택적으로 병합하면 부적법 [81다카1120]", "청구의병합"],
  ["8_011.②", "★ 채권자가 본래적 급부청구에 이를 대신할 전보배상을 부가하여 대상청구를 예비적으로 병합하여 소구한 경우에는 본래의 급부청구가 인용되면 예비적 청구에 대한 판단을 생략할 수 있다.", false, "▸ 본래적 급부청구에 이를 대신할 전보배상 부가하여 대상청구 병합 소구 → 판결확정 전 이행불능 또는 판결확정 후 집행불능 되는 경우 대비하여 전보배상을 미리 청구한 것 → 현재 급부청구와 장래 급부청구의 단순병합 O → 이를 예비적으로 병합했더라도 주위 인용 이유로 예비 판단 생략할 수 X [2011다30666]", "청구의병합"],
  ["8_012.②", "★ 원고가 주위적으로 임대차 계약의 권리금 상당의 손해배상을 구하고, 예비적으로 같은 계약의 임대차보증금 상당의 손해배상을 구하는 내용으로 청구를 병합한 경우 법원이 권리금상당 손해배상청구 중 일부만을 인용하고 나머지 청구에 대한 심리·판단을 모두 생략하는 내용의 판결을 할 수 있다.", false, "▸ 주위적으로 권리금 상당 손해배상, 예비적으로 임대차보증금 상당 손해배상을 구했는데 단순보정조치 없이 권리금 일부 인용하고 나머지 청구 판단 생략하면, 임대차보증금 상당 손해배상 부분 판결 생략한 법원은 재판누락으로 위법함 [2009다10898] → 임대차보증금 상당 손해배상 부분은 제1심에 남아있음\n단순병합으로 청구할 것을 선택적·예비적 병합으로 청구하면 부적법, 보정해야 → 법원이 간과하고 청구 1개 인용하면서 다른 청구 판단 안 하면 재판누락 O, 추가판결 O → 항소된 경우도 누락된 청구는 제1심에 잔존 상태 [2006다5550]", "청구의병합"],
  ["8_013.②", "★ 논리적으로 양립할 수 있는 수 개의 청구라 하더라도 당사자가 심판의 순위를 붙여 청구를 할 합리적 필요성이 있는 경우에는 당사자가 붙인 순위에 따라서 당사자가 먼저 구하는 청구를 심리하여 이유가 없으면, 다음 청구를 심리하여야 한다.", true, "▸ 주위적 청구와 예비적 청구가 양립 가능한 경우에도 심판 순위 붙여 청구할 합리적 필요성 있다면 허용 O, 당사자 부여한 순서 준수(=예비적 병합) → 단, 법원이 주위적 청구 일부 인용한 것이 예비적 청구보다 '금액 적다면' 기각된 주위적 청구 수액 범위의 예비적 청구 판단 구하는 취지인지 당사자에게 석명해야 ∵ 주위 일부 기각되면 예비도 판단해주길 바라는 불가분적 결합 제소도 가능하므로 [2002다17633, 2002다23598]", "청구의병합"],
  ["8_013.③", "★ 병합되는 청구가 논리적으로 관계가 없더라도 양립하지 않으면 예비적 병합의 방법으로 청구할 수 있다.", false, "▸ 단순병합으로 청구할 것을 예비적 병합으로 청구하면 부적법, 보정해야 [2006다5550]\n▸ 청구 사이에 논리적 관계가 없으면 양립불능 여부 상관없이 예비적 병합이 될 수 X", "청구의병합"],
  ["8_013.⑤", "★ 선택적으로 병합된 청구를 모두 기각할 때, 판결 이유에서는 병합된 청구 중 하나만을 선택하여 이유 없다는 판단을 하면 된다.", false, "▸ 선택적 병합에서 하나의 청구를 기각하면 다른 청구를 반드시 판단해야 판단누락을 면할 수 있음", "청구의병합"],
  // 청구의변경,
  ["8_014.ㄴ", "★ 제1심 법원이 대여금반환청구는 기각하고 부당이득반환청구를 인용하는 판결을 한 데 대하여 乙만이 항소한 경우, 대여금반환청구는 이심은 되지만 항소심의 심판 대상이 아니다.", true, "▸ 예비적 병합에서 제1심 법원이 주위적 청구 기각, 예비적 청구 인용 → 피고만 항소 → 주위적 청구도 항소심 이심되나, 항소심 심판범위는 피고의 불복신청 범위인 예비적 청구 인용의 당부에 한정 [94다31624] → 상소불가분, 불이익변경금지", "청구의변경"],
  ["8_015.ㄱ", "★ 사해행위의 취소를 구하면서 피보전채권을 추가하거나 교환하는 것은 소의 변경에 해당한다.", false, "▸ 사해행위취소소송 계속 중에 '동일한' 채권자가 피보전채권만 달리하여 동일한 사해행위취소소송 제기하면 중복소송 O ∵ 사해행위취소에서 피보전채권의 추가·변경은 공격방법 변경에 불과, 소송물 자체 변경 X [2010다80503] → 제척기간에 있어서는 유리한 결론", "청구의변경"],
  ["8_016.①", "★ 피고만이 항소한 항소심에서 원고가 청구취지를 확장한 경우에는 그에 의하여 피고에게 불리하게 되는 한도 내에서 부대항소를 한 취지로 보아 항소법원이 제1심 판결의 인용금액을 초과하여 원고의 청구를 인용하더라도 불이익변경금지의 원칙에 반하는 것은 아니다.", true, "▸ 피고만이 항소한 항소심에서 원고가 청구취지를 확장하면 피고에게 불리하게 되는 한도 내에서 부대항소를 한 취지로 보아 제1심 인용금액을 초과하여 원고 청구 인용하더라도 불이익변경금지 원칙에 반하지 않음 [91다21688]", "청구의변경"],
  ["8_016.③", "★ 제1심 법원에서 교환적 변경을 간과하여 신청구에 대하여는 아무런 판단도 하지 아니한 채 구청구만을 판단한 경우, 이는 취하되어 재판의 대상이 아닌 것에 대하여 판단한 것이어서 그 판결에 대하여 항소법원은 제1심 판결을 취소하고 구청구에 대하여는 소송종료선언을 하여야 하며, 신청구는 판단누락으로 항소심으로 이심되기에 항소심은 신청구에 대하여 판단하여야 한다.", false, "▸ 항소심에서 교환적 변경 있었음에도 항소심이 간과하고 구청구만 판단 → 상고심은 원심판결 파기, 구청구에 소송종료선언, 신청구는 재판누락 상태로 항소심에 계속되어 있는 상태 [2002다56987] → 지문처럼 제1심과 항소심의 관계도 마찬가지", "청구의변경"],
  ["SS민소P8e.①", "매매 또는 취득시효 완성을 원인으로 하는 소유권이전등기청구소송에서 그 대상을 1필지 토지의 일부에서 전부로 확장하는 경우, 이는 소의 추가적 변경에 해당한다.", true, "▸ 소유권이전등기 구하면서 등기청구권 발생원인을 매매로 했다가 취득시효 완성을 선택적으로 추가하는 것은 단순한 공격방법 차이 X, 별개 청구 추가 O → 소의 추가적 변경 O [96다50520] → 판례의 구이론", "청구의변경"],
  ["SS민소P8e.②", "항소심에서 제1심에서의 청구취지와 청구원인의 진술을 철회하고 새로운 청구취지와 청구원인을 진술한 경우, 이는 청구의 교환적 변경에 해당한다.", true, "▸ [참고판례] [68다1798]", "청구의변경"],
  ["SS민소P8e.③", "항소심에서 청구의 교환적 변경이 적법하게 이루어진 경우, 항소심법원은 사실상 제1심으로서 새로운 청구의 당부를 판단하여야 한다.", true, "▸ 항소심에서 청구의 교환적 변경이 적법하게 이루어진 경우, 항소심법원은 사실상 제1심으로서 새로운 청구의 당부를 판단하여야 함 [2017다21411]", "청구의변경"],
  ["SS민소P8e.④", "★ 불법행위로 인한 손해배상청구소송의 항소심에서 원고가 청구원인을 변경하여 대위변제로 인한 구상금청구를 추가적으로 병합한 경우, 항소심법원이 위 대위변제로 인한 구상금청구에 대하여 아무런 판단을 하지 아니하고 원고의 청구를 모두 기각하면 잘못이다.", true, "▸ 항소심에서 새로운 청구 추가된 경우, 제1심이 기존 청구 배척하며 '청구기각' 판결했는데 항소심이 기존 청구 및 항소심에서 추가된 청구 모두 배척하려면 단순히 '항소기각' 주문 표시만으로는 X, 이와 함께 항소심에서 추가된 청구에 대해 '청구기각' 주문 표시해야 ∵ 항소심은 추가된 청구에 대해 실질적으로 제1심으로서 재판해야 [2004다24083]", "청구의변경"],
  ["SS민소P8e.⑤", "★ 소가 교환적으로 변경된 후 신청구에 대하여는 아무런 판단도 하지 아니한 채 구청구만을 판단한 경우, 신청구에 대하여는 판단누락이 된다.", false, "▸ 항소심에서 교환적 변경 있었음에도 항소심이 간과하고 구청구만 판단 → 상고심은 원심판결 파기, 구청구에 소송종료선언, 신청구는 재판누락 상태로 항소심에 계속되어 있는 상태 [2002다56987]", "청구의변경"],
  ["8_017.④", "★ 원고가 5,000만 원의 대여금을 청구하자 피고가 본안에 관하여 응소하여 다투던 중 원고가 청구금액을 3,000만 원으로 감축하려고 하는 경우, 피고의 동의를 받아야 한다.", true, "▸ 청구의 감축은 일부 취하 O, 일부 포기 X → 소취하에 대한 피고의 동의나 거절은 묵시적으로도 무방 [93누9460]", "청구의변경"],
  ["8_018.①", "★ 동일 부동산에 대하여 소유권이전등기를 구하면서 그 등기청구권의 발생원인을 처음에는 매매로 하였다가 후에 취득시효의 완성을 선택적으로 추가하는 것도 청구의 추가적 변경에 해당한다.", true, "▸ 소유권이전등기 구하면서 등기청구권 발생원인을 매매로 했다가 취득시효 완성을 선택적으로 추가하는 것은 단순한 공격방법 차이 X, 별개 청구 추가 O → 소의 추가적 변경 O [96다50520] → 판례의 구이론", "청구의변경"],
  ["8_018.③", "★ 청구의 변경에 대하여 상대방이 지체 없이 이의하지 아니하고 변경된 청구에 관하여 본안의 변론을 한 때에는 상대방은 더 이상 그 청구 변경의 적법 여부에 대하여 다투지 못한다.", true, "▸ 청구기초 변경되었으나 피고가 지체 없이 이의진술하지 않고 변경된 청구에 관해 본안의 변론을 하면 이의권 상실 O, 다시 이의 제기 X [81다546] → 다만 소송절차 현저히 지연시키는 공익적 요건 흠결인 경우에는 이의권 상실되지 않음을 주의", "청구의변경"],
  ["8_018.④", "★ 항소심뿐만 아니라 상고심에서도 청구를 변경할 수 있다.", false, "제262조(청구의 변경) ① 원고는 청구의 기초가 바뀌지 아니하는 한도 안에서 변론을 종결할 때(변론 없이 한 판결의 경우에는 판결을 선고할 때)까지 청구의 취지 또는 원인을 바꿀 수 있다. 다만, 소송절차를 현저히 지연시키는 경우에는 그러하지 아니하다.", "청구의변경"],
  ["8_018.⑤", "청구취지와 청구원인의 변경은 반드시 서면에 의하여야 한다.", false, "제262조(청구의 변경) ② 청구취지의 변경은 서면으로 신청하여야 한다.", "청구의변경"],
  ["8_019.①", "★ 피고가 청구의 변경에 동의하거나 이의 없이 응소하더라도 '청구 기초의 동일성' 요건을 갖추지 않았다면 청구의 변경은 허용되지 아니한다.", false, "▸ 청구기초 변경되었으나 피고가 지체 없이 이의진술하지 않고 변경된 청구에 관해 본안의 변론을 하면 이의권 상실 O, 다시 이의 제기 X [81다546]", "청구의변경"],
  ["8_019.②", "■보충 구 청구를 취한한다는 명백한 표시 없이 원고가 교환적 변경을 한 경우에 신청구가 부적법하여 법원의 판단을 받을 수 없다 하더라도, 그 교환적 변경은 당사자의 의사에 의한 것이므로 적법하다.", false, "▸ 구청구를 취한한다는 명백한 표시 없이 신청구 한 경우에 신청구 부적법하여 법원의 판단받을 수 없는 청구라면 구청구가 취하되는 소위 교환적 변경으로 볼 수는 X [73다1449]", "청구의변경"],
  ["8_019.③", "★ 당사자가 구 청구를 취한한다는 명백한 의사표시 없이 신 청구로 변경하는 등으로 그 변경 형태가 불분명할 경우 사실심 법원은 청구변경의 취지가 무엇인지에 관하여 석명할 의무가 있다.", true, "▸ 변경형태 불분명하면 석명의무 O, 의견진술 기회 부여해야 → 특히 항소심에서의 교환적 변경은 재소금지 효력 있으므로 법적관점지적의무 O [2002다41435]", "청구의변경"],
  ["8_019.④", "★ 항소심뿐만 아니라 상고심에서도 청구를 변경할 수 있다.", false, "제262조(청구의 변경) ① 원고는 청구의 기초가 바뀌지 아니하는 한도 안에서 변론을 종결할 때까지 청구의 취지 또는 원인을 바꿀 수 있다.", "청구의변경"],

  ["8_021.④", "★ 피고가 원고의 본소 청구가 인용될 것을 조건으로 예비적 반소를 제기하였는데, 제1심 법원이 소의 이익이 없음을 이유로 원고의 본소와 피고의 예비적 반소를 모두 각하하자, 이에 대하여 원고만이 본소 각하 부분에 대하여 항소한 경우, 항소심 법원이 원고의 항소를 받아들여 원고의 본소 청구를 인용하는 이상 피고의 예비적 반소 청구도 심판 대상으로 삼아 이를 판단하여야 한다.", true, "▸ 본소 및 예비적 반소 모두 각하 → 원고만 항소 → 피고가 항소하지 않은 예비적 반소도 항소심 심판대상 O, 특히 본소 인용하는 경우 [2006다19061]", "반소중간확인의소"],

  ["SS민소P8f.④", "★ 본소가 부적법하다 하여 각하된 경우, 원고의 동의가 있어야만 반소취하의 효력이 발생한다.", true, "▸ 본소가 부적법하다 하여 각하된 경우, 피고는 원고 동의가 있어야만 반소취하의 효력이 발생함 [84다카298]", "반소중간확인의소"],
  ["SS민소P8f.⑤", "★ ■보충 가집행선고에 따라 지급한 지급물의 반환신청은 성질상 예비적 반소라 할 수 있으므로 그 이유로 주장하는 사실관계에 대하여 당사자 사이에 다툼이 없어 사실심리를 요하지 아니하는 경우에는 상고심에서도 허용된다.", true, "▸ 가지급물 반환신청은 가집행에 의해 집행 당한 채무자가 별소 제기 비용·시간 절약하고 본안 심리 절차 이용하여 신청 심리 받는 간이한 길 터놓은 제도, 본안판결 취소·변경을 조건으로 하는 예비적 반소 O [2011다25145]\n가집행선고부 항소심 판결이 대법원에서 파기환송된 경우 대법원에서 파기됨으로써 비로소 가집행선고 실효된 것이나, 이런 경우는 환송 후 항소심 법원에 대하여도 환송 전 항소심 판결에 기한 가지급물의 반환 신청 O ∵ 상고심에서는 원칙적으로 가지급물반환 신청 불허되는 점(단, 가지급물반환 신청이유로 주장하는 사실관계에 당사자간 다툼 없어 사실심리 요하지 않는 경우는 상고심에서도 허용) [95다38127]", "반소중간확인의소"],
  ["8_022.①", "甲의 乙에 대한 점유권에 기한 점유회수의 본소에 대하여 乙이 甲의 본소청구 인용에 대비하여 본권에 기한 인도를 구하는 예비적 반소를 제기한 경우, 甲의 점유권을 乙이 침탈한 사실, 乙에게 본권이 있는 사실이 인정된다면 법원은 본소청구와 예비적 반소청구를 모두 인용하여야 한다.", true, "▸ 점유회수청구에 대해 점유침탈자가 점유물에 대한 본권 있다는 주장으로 배척할 수 X ∵ 208조 → 점유권에 기한 본소에 본권자가 본소청구 인용 대비하여 본권에 기한 '예비적 반소' 제기 → 양 청구 모두 이유 있으면, 법원은 본소 및 예비적 반소 모두 인용해야 [2019다202795]", "반소중간확인의소"],
  ["8_022.③", "★ 반소를 제기하려면 본소 소송이 계속 중이어야 하지만, 반소 제기 후 본소가 취하·각하되거나 청구 포기·인낙 등으로 본소의 소송계속이 소멸하여도 예비적 반소가 아닌 한 반소의 존속에는 영향이 없다.", true, "▸ [69다446] → 예비적 반소와 구별", "반소중간확인의소"],
  ["8_023.③", "상대방이 이의를 제기하지 않고 반소의 본안에 관하여 변론한 때에는 반소제기에 동의한 것으로 보는데, 항소심에서 피고가 반소장을 진술한 데 대하여 원고가 '반소기각 답변'을 한 것만으로도 반소제기에 동의한 것으로 볼 수 있다.", false, "▸ 항소심에서 피고의 반소에 대해 원고가 '반소기각 답변'을 한 것만으로 제412조 제2항 '이의없이 반소의 본안에 관하여 변론을 한 때'는 X [91다1783]", "반소중간확인의소"],
  ["8_023.④", "항소심에서도 반소청구의 기초가 바뀌지 아니하고 소송절차를 현저히 지연시키는 경우가 아니라면 반소원고는 반소피고의 동의 없이도 예비적 반소청구를 추가할 수 있다.", true, "▸ 항소심에서도 청구변경의 요건만 갖춘다면 반소청구의 (단순이든 선택적이든 예비적이든) 추가적 변경 가능 (관련판례 : [68다1094])", "반소중간확인의소"],
  ["8_023.⑤", "★ 피고가 본소에 대한 추후보완항소를 하면서 항소심에서 비로소 반소를 제기한 경우에 추후보완항소가 부적법 각하되면 반소도 소멸한다.", true, "▸ 피고가 추완항소 하며 그 항소심에서 반소 제기했는데 추완항소 부적법하면 반소도 소멸 [2003다16962]", "반소중간확인의소"],
  ["8_024.④", "본소의 청구나 방어방법과 상호관련성이 없이 제기된 반소라도 원고가 이에 대하여 이의하지 않고 반소의 본안에 관하여 변론을 하였다면 반소는 적법하다.", true, "▸ 반소의 '상호관련성' 요건은 사익적 요건으로서 이의권 상실로 치유 O", "반소중간확인의소"],
  ["8_025.①", "★ 피고가 원고 외의 제3자를 반소피고로 추가하는 반소는 허용되지 않는다. 다만 피고가 제기하려는 반소가 필수적 공동소송인 경우, 민사소송법상 필수적 공동소송인 추가의 요건을 갖춘다면 예외적으로 허용될 수 있다.", true, "▸ 피고가 반소 제기하며 원고 이외 제3자를 반소피고로 추가할 수는 없지만, 반소가 필수적 공동소송인 경우는 필공 추가 요건 갖추면 허용 [2014다235042]", "반소중간확인의소"],
  ["8_026.④", "★ 상대방의 심급의 이익을 해할 우려가 없는 경우 또는 상대방의 동의를 받은 경우 항소심에서 반소를 제기할 수 있는바, '상대방의 심급의 이익을 해할 우려가 없는 경우'라 함은 반소청구의 기초를 이루는 실질적인 쟁점이 제1심에서 본소의 청구원인 또는 방어방법과 관련하여 충분히 심리되어 상대방에게 제1심에서의 심급의 이익을 잃게 할 염려가 없는 경우를 말한다.", true, "제412조(반소의 제기) ① 반소는 상대방의 심급의 이익을 해할 우려가 없는 경우 또는 상대방의 동의를 받은 경우에 제기할 수 있다.", "반소중간확인의소"],

  ["8_027.③", "A 주식회사의 주주인 甲과 乙이 A 주식회사를 상대로 주주총회결의의 부존재 또는 무효 확인을 구하는 소송은 필수적 공동소송에 해당한다.", true, "▸ [상법] [2020다284977]", "공동소송"],

  ["8_027.⑤", "주채무자 甲과 연대보증인 乙이 공동원고가 되어 채권자 丙을 상대로 각 차용금 채무 및 연대보증채무의 부존재 확인을 구하는 소를 제기하였는데 丙이 甲의 청구를 인낙하고 이를 조서에 기재한 경우, 법원은 위 청구인낙을 이유로 乙의 청구를 인용하여야 한다.", false, "▸ 청구의 인낙은 피고가 원고 주장 승인하는 관념의 표시에 불과한 소송상 행위로서 조서에 기재하면 확정판결과 동일한 소송 종료 효력 → 실체법상 채권·채무 발생·소멸의 원인이 되는 법률행위 X → 연대보증인과 주채무자가 함께 채권자 상대로 채무 부존재확인소송 제기 → 채권자(피고)가 주채무자의 청구만 인낙, 연대보증인의 청구는 다툼 → 연대보증인은 부종성을 들어 '인낙으로 주채무 소멸되었으니 연대보증채무도 함께 소멸하였다.'는 주장 X ∵ 인낙은 실체법상 효과 X [2020다271919]", "공동소송"],
  ["8_028.ㄱ", "★ 甲, 乙, 丙의 합유로 소유권이전등기가 된 부동산에 관하여 甲, 乙, 丙을 상대로 명의신탁 해지를 원인으로 한 소유권이전등기절차의 이행을 구하는 소", true, "▸ 합유로 등기된 부동산에 명의신탁 해지 원인으로 소유권이전등기 구할 경우 고필공 O → 원고가 합유자 중 1인이어도 마찬가지 [2014다73794]", "공동소송"],
  ["8_028.ㄴ", "★ 토지 공유자 甲, 乙, 丙이 인접 토지의 소유자인 丁을 상대로 제기하는 경계의 확정을 구하는 소", true, "▸ 토지 경계확정 구하는 소는 고유필수적 공동소송 ∵ 토지의 경계는 토지소유권의 범위·한계 정하는 중요한 사항으로서 인접토지 소유자 전원 사이에서 합일적으로 확정될 필요 [2000다24207]", "공동소송"],
  ["8_028.ㄷ", "★ 동업자 甲, 乙이 동업 이외의 특정 목적을 위하여 각자가 분담하여 출연한 돈을 공동명의로 예치해 두고 그 목적을 달성하기 전에는 甲이나 乙 혼자서는 인출할 수 없도록 감시하려는 목적으로 공동명의로 예금을 개설한 경우, 甲과 乙이 은행을 상대로 하는 예금반환청구의 소", false, "▸ 공동명의의 예금이 동업자금이면 합유 → 예금반환청구는 필수적 공동소송 / 동업 이외 특정 목적 위해 공동명의 예치하여 목적 달성 전에는 단독 인출 못하도록 감시할 목적이면 예금채권이 분량적 분할되어 각 예금채권자들에게 공동 귀속, 관리처분권도 각자 귀속, 공동반환특약에 따라 은행에 대하여는 모두가 지급청구해야 하지만 필수적 공동소송 X, 통상공동소송 O [93다31825]", "공동소송"],
  ["8_028.ㄹ", "★ 공동상속인 甲, 乙, 丙 중 甲과 乙이 원고가 되어 丙을 상대로 어떤 재산이 상속재산인지의 확인을 구하는 소", true, "▸ 공동상속인이 다른 공동상속인 상대로 상속재산확인청구 ∵ 상속재산 여부 결론 서로 달라지면 상속재산 분할 어려움 → 원고 일부의 소 취하 X, 피고 일부에 대한 소 취하 X [2006다40980]", "공동소송"],
  ["8_028.ㅁ", "★ 공유물의 소유자인 甲, 乙, 丙을 피고로 공유물의 철거를 구하는 소", false, "▸ 공유자 1인 상대로 건물철거청구 O, 필공 X (불가분채무, 건물전체 지분한도)", "공동소송"],
  ["8_029.③", "★ 타인 소유의 토지 위에 설치되어 있는 공유건물을 철거할 의무가 있는 공유자들을 상대로 그 건물의 철거를 구하는 소는 고유필수적 공동소송이다.", false, "▸ 공유물에 관한 소송은 원칙적 통공 → 공유자 1인 상대로 건물철거청구 O, 필공 X (불가분채무, 건물전체 지분한도)\n▸ 공동상속인들의 건물철거의무는 성질상 불가분채무로서 각자 그 지분의 한도 내에서 건물전체에 대한 철거의무 [80다756]", "공동소송"],
  ["8_029.⑤", "★ 공유물분할의 소송절차에서 공유자 사이에 공유토지에 관한 현물분할 협의가 성립하여 그 합의사항을 조서에 기재함으로써 조정이 성립하였더라도 그 즉시 공유관계가 소멸하고 각 공유자에게 그 협의에 따른 새로운 법률관계가 창설되는 것은 아니다.", true, "▸ 공유물분할의 소송·조정절차에서 공유자 사이 현물분할 협의 성립하여 합의사항을 조서에 기재하고 조정 성립했더라도 재판에 의한 공유물분할처럼 즉시 공유관계 소멸 X, 새로운 법률관계 창설 X → 이전등기 마쳐야 소유권 취득 [2011두1917]", "공동소송"],
  ["8_030.①", "★ 예비적 공동소송에서 법원은 모든 공동소송인에 관한 청구에 대하여 판결을 하여야 하고, 그중 일부 공동소송인에 대하여만 판결을 하거나, 남겨진 자를 위하여 추가판결을 하는 것은 허용되지 않는다.", true, "▸ 주관적·예비적 공동소송은 동일한 법률관계에 관하여 모든 공동소송인이 서로간 다툼을 하나의 소송절차로 한꺼번에 모순 없이 해결하는 소송형태, 모든 공동소송인에 대한 청구에 관하여 판결을 해야(70조 2항) → 일부 공동소송인에 대하여만 판결 혹은 남겨진 자를 위하여 추가판결 하는 것은 불허 → 주위적 피고 중 1인에 관한 청구 부분도 확정차단·이심 및 심판대상 O [2009다43355]", "공동소송"],
  ["8_030.②", "예비적 공동소송에서 패소한 주위적 공동소송인과 예비적 공동소송인 중 어느 한 사람이 상소를 제기하면 다른 공동소송인에 관한 청구 부분도 확정이 차단되고, 상소심은 주위적·예비적 공동소송인들 및 그 상대방 당사자 사이의 결론의 합일확정의 필요성을 고려하여 그 심판의 범위를 판단하여야 한다.", true, "▸ 예비적·선택적 공동소송인 가운데 어느 1인에 대한 상소가 이유 있어 원심판결이 취소·파기되는 경우 상소 이유 없는 다른 1인 청구부분도 함께 취소·파기해야 ∵ 합일확정 필요 [2008다88207]", "공동소송"],
  ["8_030.③", "★ 예비적 공동소송에서 공동소송인 중 일부가 소를 취하하거나 일부 공동소송인에 대한 소를 취하할 수 있고, 이 경우 소를 취하하지 않은 나머지 공동소송인에 관한 청구 부분도 심판대상이 되지 아니한다.", false, "▸ 예비적·선택적 공동소송인 일부가 소 취하 혹은 일부에 대한 소 취하가 된 경우, 나머지 공동소송인 청구 부분은 여전히 심판대상 ∵ 예선공은 필공 준용하면서 취하(포기·인낙, 화해)는 예외 인정(70조 1항 단서) [2015다242429]", "공동소송"],
  ["8_030.④", "★ 예비적 공동소송에서 화해권고결정에 대하여 일부 공동소송인이 이의하지 않았다면, 원칙적으로 그 공동소송인에 대한 관계에서는 위 결정이 분리확정될 수 있다.", true, "▸ 조정갈음결정·화해권고결정에 예비적 피고만 이의하면 원고와 주위적 피고 사이의 청구는 원칙적 분리확정 ∵ 70조 1항 단서가 취하·포기·인낙·화해는 각자 할 수 있고 조정갈음결정·화해권고결정 확정되면 재판상 화해와 효력 동일 → 다만 결정에서 분리확정 불허 또는 형평에 반하는 경우는 분리확정 불허 [2014다75202]", "공동소송"],
  ["8_030.⑤", "★ 아파트 입주자대표회의 구성원 개인을 피고로 삼아 제기한 동대지위 부존재확인의 소에서 위 구성원 개인과 아파트 입주자대표회의의 중에 누가 피고적격을 가지는지에 관한 법률적 평가에 따라 어느 한쪽에 대한 청구는 부적법하고 다른 쪽에 대한 청구만이 적법하게 될 수 있는 경우, 원고는 아파트 입주자대표회의를 예비적 피고로 추가할 수 있다.", true, "▸ 동일한 사실관계에 법률적 평가 달리하여 어느 한쪽에 법률효과 인정되면 다른 쪽 부정됨으로써 두 청구가 모두 인정될 수 없는 관계 [2007마515] → 대표지위부존재확인에서 개인을 피고로 소송계속 중 입주자대표회의를 예비적 피고로 추가 O ∵ 피고적격 법적 평가에 따라 한쪽만 적법", "공동소송"],
  ["8_031.①", "★ 고유필수적 공동소송인인 피고 甲, 乙, 丙 중 甲이 소송계속 중 사망하였으나 甲에게 소송대리인 A가 있어 소송절차 중단의 효과가 발생하지 아니하였다고 하더라도, 그 소송에 관한 판결이 A에게 송달되면 A에게 상소제기에 관한 특별한 권한이 없는 한 그 송달과 동시에 甲, 乙, 丙 전원에 대하여 중단 효과가 발생한다.", true, "제67조(필수적 공동소송에 대한 특별규정) ③ 제1항의 공동소송에서 공동소송인 가운데 한 사람에게 소송절차를 중단 또는 중지하여야 할 이유가 있는 경우에는 그 중단 또는 중지는 모두에게 효력이 미친다.\n▸ 소송계속 중 당사자 사망한 경우 소송대리인이 있으면 소송절차가 중단되지 않지만, 심급 대리 원칙상 그 판결정본이 소송대리인에게 송달된 때 소송절차 중단 [94다23500] → 특별수권 없는 경우", "공동소송"],
  ["8_031.②", "★ 법인 아닌 사단이 총유재산에 관한 소를 제기하는 경우 사원총회의 결의를 거쳐 그 이름으로 하거나 그 구성원 전원이 당사자가 되어 필수적 공동소송의 형태로 할 수 있다.", true, "▸ 비법인사단의 재산 관련 소송은 비법인사단이 그 명의 혹은 구성원 전원이 당사자가 되어 필수적 공동소송 형태로 하여야 → '구성원'은 ⓐ 대표자라거나 ⓑ 사원총회 결을 거쳤다거나 ⓒ 보존행위라 해도 소 제기 X [2004다44971]", "공동소송"],
