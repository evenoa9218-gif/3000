// ── Firebase REST API 헬퍼 (SDK 없이 fetch로 직접 사용) ──
const FB_URL = "https://project-1720248149706690221-default-rtdb.asia-southeast1.firebasedatabase.app";

const fb = {
  // 값 읽기
  get: async (path) => {
    try {
      const r = await fetch(`${FB_URL}/${path}.json`);
      if (!r.ok) return null;
      return await r.json();
    } catch { return null; }
  },
  // 값 쓰기 (PUT: 덮어쓰기)
  set: async (path, data) => {
    try {
      await fetch(`${FB_URL}/${path}.json`, {
        method: 'PUT',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(data)
      });
    } catch {}
  },
  // 값 병합 (PATCH: 부분 업데이트)
  update: async (path, data) => {
    try {
      await fetch(`${FB_URL}/${path}.json`, {
        method: 'PATCH',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(data)
      });
    } catch {}
  },
  // 전체 목록 읽기
  list: async (path) => {
    try {
      const r = await fetch(`${FB_URL}/${path}.json`);
      if (!r.ok) return {};
      const data = await r.json();
      return data || {};
    } catch { return {}; }
  }
};

// ── Firebase 경로 정의 ──────────────────────────────

};

// safeId: Firebase 키에서 금지 문자 변환
function toSafeId(id) { return id.replace(/[.#$\[\]]/g, '_'); }

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

// window.storage — GitHub Pages에서는 localStorage로 폴백
window.storage = window.storage || (() => {
  const PREFIX = 'qhub_';
  return {
    get: async (key) => {
      try {
        const v = localStorage.getItem(PREFIX + key);
        return v !== null ? { key, value: v } : null;
      } catch { return null; }
    },
    set: async (key, value) => {
      try {
        localStorage.setItem(PREFIX + key, value);
        return { key, value };
      } catch { return null; }
    },
    delete: async (key) => {
      try { localStorage.removeItem(PREFIX + key); return { key, deleted: true }; } catch { return null; }
    },
    list: async (prefix) => {
      try {
        const keys = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith(PREFIX + (prefix||''))) {
            keys.push(k.slice(PREFIX.length));
          }
        }
        return { keys };
      } catch { return { keys: [] }; }
    }
  };
})();

","채권의목적"],[10,"최고이자율을 초과하여 지급된 이자는 「이자제한법」 제2조 제4항에 따라 원본에 충당되고, 이와 같이 충당하여 원본이 소멸하고도 남아 있는 초과 지급액은 부당이득으로서 그 반환을 청구할 수 있을 뿐, 이를 「이자제한법」 위반 행위로 인한 손해라고 볼 수 없다.",false,"▸ 위 지문 ① 해설 참조 [AI해설] 초과 지급 이자가 원본 충당 후 남은 초과 지급액은 부당이득반환청구권의 대상이면서 동시에 750조 불법행위로 인한 '손해'이기도 함 → 두 청구권은 별개로 병존. '손해라고 볼 수 없다'는 지문은 틀림 [2020다230239]","채권의목적"],[11,"금전소비대차에서 지연손해금에 관한 약정 없이 이자에 관한 약정만이 있는 경우 특별한 사정이 없는 한 금전반환채무의 이행지체로 인한 지연손해금도 그 약정이율에 의하기로 하였다고 보는 것이 당사자의 의사에 부합하지만, 그 약정이율이 법정이율보다 낮은 경우에는 법정이율에 의한 지연손해금을 청구할 수 있다.",true,"▸ 397조 1항 단서는 약정이율이 법정이율 이상인 경우만 적용. 법정이율보다 낮은 경우는 본문으로 돌아가 법정이율로 지연손해금 산정 [2009다85342]","채권의목적"],[12,"계약 당사자 쌍방이 합의에 의하여 계약을 해제할 경우에는 당사자 사이에 별도의 약정이 없는 이상 합의해제로 인하여 반환할 금전에 그 받은 날로부터의 이자를 더하여 반환할 의무가 없다.",true,"▸ 합의해제는 법정해제와 달리 548조 2항 X, 반환할 금전에 받은 날부터 이자 가산 X [95다16011]","채권의목적"],[13,"이자 또는 지연손해금 채권은 원본채권과 별개의 채권이기는 하나 원본의 존재를 전제로 그에 대응하여 발생하는 권리이므로, 원본채권의 소멸시효 완성의 효력은 그 시효완성 전에 이미 발생한 이자 및 지연손해금 채권에도 미친다.",true,"▸ 원본채권 시효 소멸하면 이자채권도 시효 소멸 O [2006다2940]","채권의목적"],[14,"금전채무 이행에 불확정한 기한이 있는 경우에 채무자가 그 기한이 도래함을 알지 못하였다면 이행지체로 인한 지연손해금 지급의무가 발생하지 않는다.",true,"[조문] 제387조(이행기와 이행지체) ① 채무이행의 확정한 기한이 있는 경우에는 채무자는 기한이 도래한 때로부터 지체책임이 있다. 채무이행의 불확정한 기한이 있는 경우에는 채무자는 기한이 도래함을 안 때로부터 지체책임이 있다.","채권의목적"],[15,"「민법」 제378조에서 \"채권액이 다른 나라 통화로 지정된 때에는 채무자는 지급할 때에 있어서의 이행지의 환금시가에 의하여 우리나라 통화로 변제할 수 있다.\"고 규정하였음에도 채권자 또한 우리나라 통화로 변제받을 수 있는 대용권을 행사할 수 있다.",true,"▸ 채권자가 대용권을 행사할 경우, 재판에서 채무자가 현실로 이행할 때에 가장 가까운 사실심 변론종결시 O [90다2147]","채권의목적"],[16,"금전채무 불이행에 관한 특칙을 규정한 「민법」 제397조는 그 이행지체가 있으면 지연손해금 부분만큼의 손해가 있는 것으로 의제하려는 데에 그 취지가 있지만, 채권자가 금전채무의 불이행을 원인으로 손해배상을 구할 때에는 지연손해금 상당의 손해가 발생하였다는 취지의 주장을 하여야 한다.",true,"▸ 금전채무불이행의 손해배상에서 채권자는 손해 증명 요하지 않으나 손해가 발생했다는 주장은 하여야 [99다49644]","채권의목적"],[17,"채무자가 금전채무에 관하여 채권자를 상대로 채무부존재확인소송을 제기하였고 사실심의 심리 결과 채무의 존재가 인정되어 이에 대한 확인판결을 선고할 경우, 그 지연손해금 산정에 대하여 「소송촉진등에관한특례법」 제3조의 법정이율을 적용할 수 있다.",false,"▸ [민소] 금전채무에 관하여 채무자가 채권자를 상대로 채무부존재확인소송을 제기하였을 뿐 채권자의 이행소송이 없는 경우, 채무 일부 인정되어 확인판결을 선고하더라도 이는 금전채무의 전부·일부 이행 명하는 판결 선고 아니므로, 지연손해금 산정에 대해 소송촉진법 제3조 법정이율을 적용할 수 없다. [2018다276768]","채권의목적"],[18,"종류채권의 목적물이 특정되기 전에 멸실된 경우 채무자는 같은 종류의 다른 물건을 급부할 의무가 있지만, 목적물이 특정된 후에 멸실된 경우에는 같은 종류의 다른 물건을 급부할 의무가 없다.",true,"▸ 특정 이전 멸실 → 채무자는 조달의무 O","채권의목적"],[19,"甲이 乙로부터 1리터 용량의 페인트 10통을 구매하기로 하는 계약을 체결한 경우, 페인트의 품질에 관하여 甲과 乙 사이에 합의가 없다면 乙은 甲에게 중등 품질을 인도하여야 한다.",true,"[조문] 제375조(종류채권) ① 채권의 목적을 종류로만 지정한 경우에 법률행위의 성질이나 당사자의 의사에 의하여 품질을 정할 수 없는 때에는 채무자는 중등품질의 물건으로 이행하여야 한다.","채권의목적"],[20,"채권액이 다른 나라 통화로 지정된 때에는 채무자는 지급할 때에 있어서의 이행지의 환금시가에 의하여 우리나라 통화로 변제할 수 있다.",true,"▸ 변제기 X, 현실로 이행할 때 O [90다2147] [조문] 제378조(동전) 채권액이 다른 나라 통화로 지정된 때에는 채무자는 지급할 때에 있어서의 이행지의 환금시가에 의하여 우리나라 통화로 변제할 수 있다.","채권의목적"],[21,"채권의 목적으로 선택할 수 개의 행위 중에 선택권이 없는 자의 과실로 이행불능이 된 것이 있다면, 채권의 목적은 잔존한 것에 존재한다.",false,"[조문] 제385조(불능으로 인한 선택채권의 특정) ① 채권의 목적으로 선택할 수 개의 행위중에 처음부터 불능한 것이나 또는 후에 이행불능하게 된 것이 있으면 채권의 목적은 잔존한 것에 존재한다. ② 선택권없는 당사자의 과실로 인하여 이행불능이 된 때에는 전항의 규정을 적용하지 아니한다.","채권의목적"],[22,"채권자가 고의 또는 과실로 이자제한법상 최고이자율을 초과하여 채무자로부터 받은 이자가 전부 원본에 충당된 경우, 채권자에게 민법 제750조에 따른 불법행위 책임은 성립하지 않는다.",true,"▸ 위 지문 ① 해설 참조 [AI해설] 초과 지급 이자가 전부 원본에 충당된 경우 채무자에게 남은 손해가 없으므로 750조 불법행위 책임 성립하지 않음. 손해가 없으면 불법행위 책임도 없음 [2020다230239]","채권의목적"],[23,"乙이 甲에게 사과 10상자를 주문하여 甲이 약정된 날짜에 乙의 주소지로 이를 배달하였으나 乙이 아무런 사전 연락 없이 외출하여 사과를 인도하지 못하고 되돌아오던 중 甲의 경과실로 사과가 훼손되었다면, 甲은 훼손된 상태 그대로 사과를 乙에게 인도하면 된다.",true,"▸ 고의나 중과실로 훼손되었다면? 그렇더라도 지문은 옳은 지문임. 乙의 주소지로 배달한 순간 특정물이 되었고, 특정물은 제462조에 따라 이행기의 현상대로만 이행하면 족하기 때문임. 다만 경과실이나 중과실 이상이냐에 따라 甲이 이행불능 책임을 지는 여부(제401조) 및 사과대금 지급청구 가부(제538조 제1항 제2문에 관한 통설의 해석)만 달라지는 것임 [조문] 제462조(특정물의 현상인도) 특정물의 인도가 채권의 목적인 때에는 채무자는 이행기의 현상대로 그 물건을 인도하여야 한다.","채권의목적"],[24,"甲이 乙이 소유하고 있는 물건 A와 B 중 어느 하나를 매수하기로 하고 그 선택을 甲이 하기로 한 경우, 甲의 과실로 A가 멸실되었더라도 甲은 여전히 B의 인도를 청구할 수 있다.",true,"▸ 선택권자의 과실에 의한 불능이므로 제385조 제1항 적용. 급부 목적물은 잔존하는 B로 특정됨. 甲은 B에 대한 인도를 구할 수 있음(A의 멸실에 대한 손해배상책임은 별개 문제임)","채권의목적"],[25,"甲이 乙이 소유하고 있는 물건 A와 B 중 어느 하나를 매수하기로 하고 그 선택을 甲이 하기로 한 경우, 甲은 乙의 동의가 있더라도 甲 자신이 매매목적물로 A를 선택한 것을 철회할 수 없다.",false,"▸ 선택권 있는 자(甲)는 상대방(乙)의 동의 있으면 선택을 철회할 수 있음","채권의목적"],[26,"금전채무의 이행지체로 인하여 발생하는 지연손해금은 해금률을 그대로 적용 [2011다50509]","채무불이행"],[47,"甲이 2022. 7. 1. 대학 동창 乙에게 1억 원을 이율 월 1%(매월 말일 지급), 지연이율 연 20%, 변제기 2023. 6. 30.로 정하여 대여하였고, 乙의 친구 丙은 1억 2,000만 원 한도 내에서 이를 보증하였으나 변제기가 지나도록 乙과 丙은 아무런 변제도 하고 있지 않다.§원금 1억 원에 대한 지연손해금채무는 금전채무의 이행지체로 인한 손해배상채무로서 이행기의 정함이 없는 채무에 해당하므로 甲이 2023. 7. 1.부터 2023. 9. 30.까지로 기간을 산정해 확정한 지연손해금 채권에 대해 이행청구를 하는 경우 乙은 그 지연손해금 채무에 대하여도 지체책임을 부담한다.",true,"▸ 지연손해금은 금전채무 이행지체 따른 손해배상으로 기한 없는 채무 → 확정된 지연손해금을 채권자가 이행청구 하면 채무자 지체책임. 이행판결 확정된 지연손해금도 채권자 이행청구로 지체책임 ∵ 판결로 권리 실체적 내용 바뀌지 않으므로 [2018다259213, 2021다232331]","채무불이행"],[48,"甲이 2022. 7. 1. 대학 동창 乙에게 1억 원을 이율 월 1%(매월 말일 지급), 지연이율 연 20%, 변제기 2023. 6. 30.로 정하여 대여하였고, 乙의 친구 丙은 1억 2,000만 원 한도 내에서 이를 보증하였으나 변제기가 지나도록 乙과 丙은 아무런 변제도 하고 있지 않다.§丙의 보증채무는 乙의 주채무와는 별개의 채무이기 때문에 보증채무 자체의 이행지체로 인한 지연손해금은 보증 한도액과는 별도로 부담하여야 하고, 다른 약정이 없는 이상 민법에서 정한 법정이율인 연 5%의 법정지연손해금율에 의한다.",true,"▸ 보증채무는 주채무와 별개 채무 → 보증채무 자체의 이행지체로 인한 지연손해금은 보증 한도액과 별도로 부담 O → 보증채무 연체이율의 특별한 약정 있으면 약정에 따라, 특별한 약정 없으면 거래행위 성질에 따라 상법·민법 법정이율 적용. 주채무에 약정 연체이율 당연 적용은 X [2001다29803, 97다1433]","채무불이행"],[49,"채권의 가압류가 있는 경우에 그 채권의 이행기가 도래하여도 제3채무자는 이행지체책임을 지지 않는다.",false,"▸ 채권 가압류가 있어도 이행기 도래하면 제3채무자 지체책임 O ∵ 가압류는 제3채무자에 대해 지급금지할 뿐 채무 그 자체 면하게 하는 것 X → 제3채무자는 487조 공탁으로 지체책임 면할 수 있음 ∵ 이중변제 위험. 채권 가압류되면 '채권자가 변제를 받을 수 없는 때' O → 공탁금출급청구권에 가압류 존재 [93다951] ### 이행불능","채무불이행"],[50,"매매목적물의 수용으로 인하여 매도인의 소유권이전등기의무가 이행불능되었다면, 그로부터 상당한 기간이 지난 뒤에야 수용으로 인한 보상금청구의 방법과 절차가 마련되었더라도 대상청구권의 소멸시효는 이행불능 시부터 진행한다.",false,"▸ 대상청구권은 매수인이 대상청구권을 행사할 수 있는 시점인 매도인의 소유권이전등기의무 이행불능 시점부터 소멸시효 진행 → 수용뿐 아니라 이중매매와 같이 채무자 귀책사유로 발생한 대상청구권도 마찬가지 [2018다248244]. 그러나 권리 행사 가능해야 → 수용 이후 상당 기간 지나 보상금 지급 구할 방법·절차 마련되었다면 그때부터 진행 [99다23901]","채무불이행"],[51,"甲이 乙을 상대로 사해행위취소 및 원물반환으로 근저당권설정등기의 말소를 청구하여 승소판결이 확정되었는데, 그 후 해당 부동산이 경매에서 제3자에게 매각됨으로써 위 확정판결에 기한 乙의 근저당권설정등기 말소의무가 이행불능되었다. 이 경우 甲은 대상청구권을 행사하여 乙이 위 근저당권에 기하여 지급받은 배당금의 반환을 청구할 수 있다.",true,"▸ 사해행위취소 및 근저당권등기말소 승소 확정되었으나 임의경매 진행으로 경락되어 근저당권등기말소의무가 이행불능으로 된 경우에 대상청구권 행사로서 수익자가 받은 배당금 반환청구 O [2010다71431]","채무불이행"],[52,"매매에 따른 소유권이전등기 전에 매매목적물  계약의 해제로 인한 원상회복청구권에 대하여도 손해배상에서의 과실상계에 준하여 권리의 내용을 제한할 수 있다.",false,"▸ [2013다34143] [AI해설] 해제로 인한 원상회복청구권은 부당이득반환청구권의 성질을 가지므로, 해제자에게 해제 원인인 채무불이행에 귀책 있더라도 과실상계 준용 불가 → 원상회복청구권에 과실상계를 준용하여 권리 내용 제한하는 것은 허용되지 않음 [2013다34143]","손해배상"],[75,"ㄴ. 사용자가 피용자의 고의에 의한 불법행위로 인하여 사용자책임을 부담하는 경우에, 피해자에게 그 손해의 발생과 확대에 기여한 과실이 있다면 사용자책임의 범위를 정함에 있어서 이러한 피해자의 과실을 고려하여 그 책임을 제한할 수 있다.",true,"▸ 피해자 부주의 이용한 고의 불법행위 가해자의 과실상계 주장 불허는 신의칙 반하기 때문 → 중개보조원이 피해자 부주의를 이용하여 고의 불법행위 한 경우, 중개보조원을 고용했을 뿐 불법행위 가담하지 않은 중개업자에게 책임 묻는 피해자에게 과실 있다면 법원은 직권 과실상계로 참작 [2011다21143]","손해배상"],[76,"ㄷ. 甲이 의사 乙을 상대로 의료과오를 이유로 7,000만 원의 지급을 구하는 소를 제기하면서 일부청구임을 명시하였으며, 법원은 전체 손해액이 1억 원이고 甲의 과실비율이 40%임을 인정한 경우, 지연손해금을 논외로 할 때 법원으로서는 피해자의 청구 중 4,200만 원을 인용하여야 한다.",false,"▸ 손해 전액에서 과실비율 감액하고 그 잔액이 청구액을 초과할 경우는 청구 전액을 / 잔액이 청구액을 초과 않을 경우는 잔액을 각 인용하는 것이 일부청구 당사자의 의사 [75다819] → 외측설에 따라, 지문의 경우 1억 원의 40%로서 청구액을 초과하지 않는 잔액 6,000만 원을 인용해야 함(4,200만 원은 안분설에 따른 결론)","손해배상"],[77,"ㄹ. 채권자 甲이 채무자 乙을 상대로 채무불이행으로 인한 손해배상을 청구한 사건에서 손해액이 100만 원, 甲의 과실비율이 30%, 乙이 채무를 이행하였더라면 甲이 지출하였을 비용이 20만 원인 경우, 乙이 甲에게 배상하여야 할 금액은 50만 원이 된다.",true,"▸ 과실상계 먼저 하고 손익상계 ㄱ → ㅅ [80다3277] 100만 원에서 먼저 30% 과실상계 하면 70만 원, 다음으로 20만 원 손익상계 하면 최종 50만 원이 올바른 정답으로서 옳은 지문. 이와 달리 손익상계 먼저 하고 과실상계하면 56만 원이 틀린 지문으로 출제될 수 있음","손해배상"],[78,"ㄱ. 불법행위로 영업용 선박, 자동차, 건물 등의 물건이 멸실된 경우에 그 물건의 교환가격 상당액의 배상 이외에 그 물건을 대체할 다른 물건의 제조 또는 구입시까지의 기간 동안 그 멸실된 물건을 사용·수익하지 못하여 입은 손해의 배상을 별도로 구할 수는 없다.",false,"▸ 휴업손해는 통상손해 O. 영업용 물건이 멸실되면 '대체 물건 마련'에, 일부 손괴되면 '수리'에 각 합리적으로 필요한 기간 동안 영업을 계속했다면 얻을 수 있었던 이익 [2001다82507] → 멸실된 물건의 교환가치 외에 별도로 휴업손해를 배상하여야","손해배상"],[79,"ㄷ. 매매계약의 이행불능으로 인한 전보배상책임의 범위는 이행불능 당시의 매매목적물의 시가이고, 이행불능 당시의 시가가 계약 당시의 시가보다 현저하게 상승되었다 할지라도 이행불능 당시 시가가 통상손해이다.",true,"▸ 매도인의 소유권이전등기의무 이행불능으로 매수인이 입는 손해액은 원칙적으로 이행불능 당시 시가 상당액 O. 그 이후 목적물 가격 취등하여도 그로 인한 손해는 특별손해이므로 매도인이 '이행불능 당시' 그러한 특수한 사정을 알았거나 알 수 있었을 때에 한하여 손해배상 O [94다61359]","손해배상"],[80,"ㅁ. 부동산을 매수하고 소유권이전등기까지 넘겨받았지만, 진정한 소유자가 제기한 등기말소청구소송에서 매도인과 매수인 앞으로 된 소유권이전등기의 말소를 명한 판결이 확정됨으로써 매도인의 소유권이전의무가 이행불능된 경우, 그 손해배상액 산정의 기준시점은 위 판결이 확정된 때이다.",true,"▸ 매도인 및 매수인의 소유권이전등기 말소의무가 원소유자의 말소등기절차이행 청구소송에서 확정되었다면, 매도인의 이행불능으로 인한 손해배상액의 산정은 그 패소확정시 기준 O, 등기말소시 X [80다417]","손해배상"],[81,"피해자의 부주의를 이용하여 고의로 불법행위를 저지른 자가 피해자의 부주의를 이유로 자신의 책임을 감하여 달라고 주장하는 것은 허용되지 않으며, 이는 고의의 불법행위가 영득행위에 해당하지 않아 가해자가 불법행위로 인한 이익을 최종적으로 보유하지 않은 경우에도 마찬가지이다.",false,"▸ 피해자 부주의 이용한 고의 불법행위자의 과실상계 불허되는 이유는 고의 불법행위가 영득행위 해당하는 경우 가해자로 하여금 불법행위로 인한 이익 최종적 보유하게 하여 공평·신의칙 반하는 결과 때문 → 고의 불법행위도 이러한 결과 초래되지 않는다면 과실상계나 공평 원칙에 기한 책임제한 가능 O [2006다16758]","손해배상"],[82,"ㄱ. 매매계약에 따른 소유권이전의무의 이행불능으로 인한 손해배상채권은 불능이 된 때로부터 소멸시효가 진행하며, 특별한 사정이 없는 한 불능 당시의 목적물 시가를 기준으로 손해액을 정한다.",true,"[AI해설] 이행불능으로 인한 손해배상채권의 소멸시효는 이행불능 시점부터 진행. 손해액은 특별한 사정 없는 한 이행불능 당시 목적물 시가 기준 산정 → 이와 달리 그 이후 시가 상승분은 특별손해로서 매도인이 이행불능 당시 그 사정을 알았거나 알 수 있었을 때에 한하여 배상 O (위 [79] 참조)","손해배상"],[83,"불법행위로 인하여 피해자에게 손해가 발생하고 그 손해발생으로 이득이 생긴 경우에 손해배상액을 산정함에 있어 법원은 먼저 손익상계를 한 다음에 과실상계를 하여야 한다.",false,"▸ 과실상계 먼저 하고 손익상계 ㄱ → ㅅ [80다3277] ### 4. 손해배상액의 예정","손해배상"],[84,"ㄱ. 금전채무의 불이행에 대하여 손해배상액을 예정한 경우, 감액 요건인 '부당성'은 계약의 목적과 내용, 손해배상액을 예정한 동기, 채무액에 대한 예정액의 비율, 예상 손해액의 크기, 당시의 거래관행 등뿐만 아니라, 통상적인 연체금리도 고려하여 판단하여야 한다.",true,"▸ 지문 ㄱ, ㄴ 관련: 부당성은 채권자·채무자 지위, 계약 목적·내용, 손해배상액 예정한 동기·경위 등 모든 사정 참작하여 일반 사회관념상 예정액 지급이 경제적 약자인 채무자에게 부당한 압박 공정성 잃는 결과 초래하는 경우에 인정 → 기록상 실제 (예상) 손해액 알 수 있다면 대비해 볼 필요 O, 단지 예정액 자체가 크다거나 해제 시까지 단기라고 감액해서는 X → 배상액 예정이 없더라도 채무자가 받을 수 있던 금액보다 적은 금액으로 감액하면 X → 사실심의 전권 사항 O, 다만 형평의 원칙에 비추어 현저히 불합리하면 불허 [2017다8876, 2022다227619]","손해배상"],[85,"ㄴ. 손해배상 예정액의 감액 사유에 대한 사실인정이나 그 비율을 정하는 것은 원칙적으로 사실심의 전권에 속하는 사항이지만, 손해배상액의 예정이 없더라도 채무자가 당연히 지급의무를 부담하여 채권자가 받을 수 있던 금액보다 적은 금액으로 감액하는 것은 감액의 한계를 벗어나는 것이다.",true,"▸ 지문 ㄱ, ㄴ 관련: 부당성은 채권자·채무자 지위, 계약 목적·내용, 손해배상액 예정한 동기·경위 등 모든 사정 참작하여 일반 사회관념상 예정액 지급이 경제적 약자인 채무자에게 부당한 압박 공정성 잃는 결과 초래하는 경우에 인정 → 기록상 실제 (예상) 손해액 알 수 있다면 대비해 볼 필요 O, 단지 예정액 자체가 크다거나 해제 시까지 단기라고 감액해서는 X → 배상액 예정이 없더라도 채무자가 받을 수 있던 금액보다 적은 금액으로 감액하면 X → 사실심의 전권 사항 O, 다만 형평의 원칙에 비추어 현저히 불합리하면 불허 [2017다8876, 2022다227619]","손해배상"],[86,"ㄷ. 도급계약에서 손해배상액의 예정으로서 지체상금을 계약 총액에 지체상금률을 곱하여 산출하기로 정한 경우, 지체상금의 과다 여부는 지체상금률 그 자체가 과다한지를 기준으로 판단한다.",false,"▸ 손해배상의 예정에 해당하는 지체상금의 과다 여부는 지체상금 '총액'을 기준으로 판단 ∵ 문언상 예정한 손해배상액 총액을 의미 [95다11436] → '지체상금률' 자체는 과다하지 않더라도 지체일수 증가로 지체상금 총액 증가한 경우 총액 기준으로 감액 O","손해배상"],[87,"ㄹ. 수급인의 하자보수의무 불이행 시 도급인에게 귀속하는 것으로 약정된 하자보수보증금은 특별한 사정이 없는 한 손해배상액의 예정으로 볼 것이므로, 도급인은 수급인의 하자보수의무 불이행을 이유로 하자보수보증금의 몰취 외에 그 실손해액을 증명하여 수급인으로부터 그 초과액 상당의 손해배상을 받을 수는 없다.",false,"▸ '하자보수보증금'은 특성상 실손해가 이를 초과한다면 입증하여 그 외 따로 손해배상 받을 수 있는 '특수한 손해배상액의 예정' [2000다17810]","손해배상"],[88,"손해배상의 예정이 있는 경우, 채무불이행으로 인한 손해의 발생 및 확대에 채권자에게도 과실이 있다면 「민법」 제398조 제2항에 따라 손해배상 예정액을 감액할 수는 있을지언정 채권자의 과실을 들어 과실상계를 할 수는 없다.",true,"▸ [72다108] [AI해설] 손해배상의 예정이 있는 경우 과실상계는 적용 불가. 단, 채권자 과실이 있다면 398조 2항의 '부당히 과다' 요건 충족 여부 판단 시 이를 고려하여 감액하는 것은 허용 [72다108]","손해배상"],[89,"채무불이행에 있어 채무자의 귀책사유를 묻지 아니한다는 약정이 없는 한 채무자는 자신의 귀책사유가 없음을 증명함으로써 손해배상의 예정액의 지급책임을 면할 수 있다.",true,"▸ 귀책사유 필요설 [통판]: 채무자의 귀책사유를 불문한다는 약정이 없는 한, 채무자는 귀책사유 없음을 주장·입증하여 예정배상액의 지급책임 면할 수 O. 무과실책임 약정의 존재는 엄격하게 해석 [2006다9408]","손해배상"],[90,"채무불이행에 관한 위약금 약정이 손해배상액의 예정과 위약벌의 성격을 함께 가지는 경우 특별한 사정이 없는 한 법원은 직권으로 위약금 전체 금액을 기준으로 감액할 수 있다.",true,"▸ 乙이 지급의무 위반하면 甲에 대한 채권을 포기하기로 하는 위약금 약정 → 甲은 채권포기 주장 외에 따로 손해배상 구하기 어렵고, 약정금 지급 강제 및 의무위반 제재 수단이기도 하면, 위약금약정은 손해배상액 예정 O → 법원은 당사자 주장 없더라도 직권으로 398조 2항 감액 O, 채권 전액 포기가 부당하게 과다하다면 감액 O [2017다275270]","손해배상"],[91,"채무의 내용인 급부가 실현되기 위하여 채권자의 수령이 필요한 경우에 채무자가 채무의 내용에 따른 이행제공을 하였는데도 채권자가 이행을 받지 않은 때에는, 채무자는 채권자지체를 이유로 일반적인 채무불이행책임과 마찬가지로 손해배상이나 계약 해제를 주장할 수 있다.",false,"▸ 400조 채권자지체 성립에 채권자 귀책사유 필요 X → 채권자지체 효과는 원칙적으로 민법 규정 따른 401조, 402조, 403조, 538조 1항만 인정, 채무불이행 같은 손해배상 X, 해제 X → 그러나 계약 당사자가 채권수령의무·협력의무를 명시적·묵시적 약정했거나 구체적 사안에서 신의칙상 그러한 채권자 의무 인정될 특별한 사정 있다면, 의무위반에 따른 채권자 책임 O → 채권자의 수령의무·협력의무 불이행으로 계약 목적 달성 불능하면 채무자는 해제 O [2019다293036]","손해배상"],[92,"ㄴ. 채권자가 연대보증인들에 대하여 그 보증채무의 이행을 구하고 있다면 과실상계의 법리는 적용될 여지가 없다.",true,"▸ [96다8468, 95다49141] → 보증채무 이행은 본래 급부 청구이므로 과실상계 적용할 여지 없음","손해배상"],[93,"ㄱ. 법원은 채무자가 과실상계 항변을 한 경우에 한하여 채권자의 과실을 참작하여 손해액을 정할 수 있고, 그 비율은 사실심의 전권사항이다.",false,"▸ 피해자에게 과실 인정되면 배상의무자가 주장하지 않더라도 법원은 손해배상 책임·금액 정함에 있어 이를 직권으로 참작하여야 [96다30113] 과실상계 비율 자체는 사실심 전권사항 O","손해배상"],[94,"ㄴ. 부동산의 등기청구권을 보전하기 위한 처분금지가처분이 부당하게 집행되어 채무자가 부동산을 처분할 기회를 상실하는 불이익을 입었다면, 채무자는 그 불이익이 당해 부동산을 보유하면서 얻는 점용이익을 초과하였는지와 무관하게 손해를 입었다고 볼 수 있다.",false,"▸ 부동산의 등기청구권을 보전하기 위한 처분금지가처분 부당 집행 → 처분금지의 상대적 효력이어서 그 집행 후에도 채무자는 당해 부동산 사용·수익하면서 여전히 처분 가능 → 가처분의 존재로 처분기회 상실했거나 그 대가를 제때 지급받지 못하는 불이익 있었더라도, 부동산의 점용이익 초과하지 않는 한 손해 발생 X → 설사 점용이익 초과 불이익으로 손해 발생했더라도 특별손해로서 가처분채권자가 알았거나 알 수 있었을 때 한하여 배상책임 [98다21366]","손해배상"],[95,"ㄴ. 위약벌 약정에 대해서는 민법 제398조 제2항을 유추적용하여 그 액을 감액할 수는 없지만, 위약벌 약정의 대상이 된 채무의 강제에 의하여 얻어지는 채권자의 이익에 비하여 약정된 벌이 과도하게 무거울 때에는 그 일부 또는 전부가 공서양속에 반하여 무효가 될 수 있다.",true,"▸ 위약금이 위약벌(=실손해 배상과는 별도로 받는 제재금)로 되려면 특별한 사정 주장·입증해야 하고, 위약벌의 경우 398조 2항의 감액 X → 다만 과도하게 무거운 경우는 103조 공서양속에 반하여 무효일 여지 O [92다46905]","손해배상"],[96,"ㄷ. 채무불이행에 관하여 손해배상액을 예정한 경우에 채권자는 통상의 손해만이 아니라 특별한 사정으로 인한 손해에 관해서도 예정된 배상액만을 청구할 수 있고, 특별한 사정이 없는 한 손해배상의 예정액을 초과한 배상액을 청구할 수 없다.",true,"▸ 특별손해 포함설 [86다카2375]","손해배상"],[97,"ㄹ. 건물건축공사에 관한 도급계약에서 수급인이 건축공사를 지체하여 약정기한까지 건물을 완성하여 인도하지 않은 경우, 건물에 대한 임료 상당액을 통상의 손해로 배상하여야 한다.",true,"▸ 인도의무의 이행지체를 이유로 한 손해배상은 일반적으로 그 물건의 사용 수익 이익, 즉 그 물건의 차임 상당액이 통상 손해 O → 건물신축 도급계약에서 수급인의 건물 완성 및 인도의무 지체도 마찬가지 [94다44774]","손해배상"],[98,"위약금 약정은 민법 제398조 제4항에 따라 손해배상액의 예정으로 추정된다.",true,"[조문] 제398조(배상액의 예정) ① 당사자는 채무불이행에 관한 손해배상액을 예정할 수 있다. ② 손해배상의 예정액이 부당히 과다한 경우에는 법원은 적당히 감액할 수 있다. ③ 손해배상액의 예정은 이행의 청구나 계약의 해제에 영향을 미치지 아니한다. ④ 위약금의 약정은 손해배상액의 예정으로 추정한다.","손해배상"],[99,"위약벌 약정은 민법 제398조 제2항의 손해배상 예정액의 감액 규정을 유추적용하여 법원이 감액할 수 있다.",false,"▸ 위약벌은 398조 2항 유추적용으로 감액 X, 현재 판례 유지 ∵ 위약벌(이행 확보)과 손배예정(증명곤란 해결, 분쟁 방지, 이행 확보)은 성질·기능 본질적으로 다름. 398조 4항 문언상 손배예정과 구별되는 것 존재 전제. 위약벌 약정 사적 자치 존중하여 법원 개입 최소화. 103조 위반 무효로 통제 가능 [2018다248855]","손해배상"],[100,"위약벌 약정과 손해배상액의 예정인 위약금 약정은 하나의 계약에서 병행하여 존재할 수 있다.",true,"▸ 위약금 약정이 손해배상액 예정인지 위약벌인지는, 계약서 내용, 체결 경위, 목적 등 종합하여 구체적·개별적 판단해야 → 손해배상액 예정 추정되지만(398조 4항), 하나의 계약에 채무불이행 손해배상에 관해 손해배상액 예정 조항 따로 있거나 실손해 배상 전제로 조항 있고 별도로 위약금 조항 있다면 위약벌로 보아야 ∵ 손해배상액 예정으로 해석하면 이중배상 [2018다248855]","손해배상"],[101,"위약벌 약정이 있더라도 별도로 채무불이행으로 인해 실제 발생한 손해에 대해 배상을 청구할 수 있다.",true,"▸ 위약벌은 손해배상과 별개이며, 위 판례도 마찬가지의 취지임","손해배상"],[102,"쌍무계약에서 채권자의 수령거절 의사가 확고한 경우, 채권자 위험부담주의에 관한 민법 제538조 제1항에서의 수령지체의 성립을 위해서는 채무자의 구두제공조차 요구되지 않는다.",false,"▸ 채권자지체(400조) 성립 위하여 변제제공(460조) 있어야 하는데 채권자의 수령거절 의사가 확고한 이른바 ‘영구적 불수령’의 경우 구두 제공조차 필요 없으나 이는 그로써 채무불이행을 면한다는 것에 불과하고(461조), 538조 1항 2문 ‘수령지체’ 중 쌍방 책임 없는 불능을 이유로 채무자가 반대급부를 청구하기 위해서는 현실제공이나 구두제공이 있었어야 [2001다79013]","채권자지체"],[103,"甲이 미등기 건물을 매수하였으나 소유권이전등기를 하지 못한 경우, 甲은 위 건물의 소유권을 원시취득한 매도인 乙을 대위하여 불법점유자 丙을 상대로 직접 자신에게 위 건물을 인도할 것을 청구할 수 있다.",true,"▸ [79다1928] [AI해설] 미등기 건물 매수인은 채권적 청구권만 있어 소유자인 매도인을 대위하여 불법점유자에 대해 직접 자신에게 인도청구 O → 금전지급·물건인도는 직접청구 허용되는 유형에 해당 [79다1928]","채권자대위권"],[104,"甲이 乙에 대한 금전채권을 보전하기 위하여 乙의 丙에 대한 금전채권을 대위행사하면서 직접 자신에게 이행하도록 청구하여 승소판결이 확정된 경우, 乙의 丙에 대한 금전채권이 변제 등으로 소멸하기 전이라면 乙의 일반채권자인 丁은 乙의 丙에 대한 금전채권을 압류할 수 있다.",true,"▸ 대위소송에서 제3채무자로부터 직접 대위채권자에게 금전지급 판결 확정되더라도 변제 등으로 소멸되기 전에는 채무자의 다른 채권자가 (가)압류 O ∵ 채권자는 채무자를 대위하여 피대위채권(집행채권)에 대한 변제를 수령할 뿐이며 자신의 채권에 대한 변제로서 수령하는 것 X [2015다236547]","채권자대위권"],[105,"乙이 丙에게 채권의 양도를 구할 수 있는 권리를 가지고 있고 甲이 乙의 丙에 대한 위 권리를 대위행사하는 경우, 甲은 丙에 대하여 직접 자신에게 채권양도 절차를 이행하도록 청구할 수 있다.",false,"▸ 채무자가 제3채무자에게 채권양도 구할 권리 있고 채권자가 이를 대위행사할 경우는 금전지급·물건인도나 등기말소 등과 같은 직접청구의 예외 X, 채권자는 제3채무자에 대해 ‘채무자에게’ 채권양도절차 이행하도록 청구해야 O, 직접 ‘자신에게’ 채권양도 이행할 것 청구 X ∵ 채무자에게 이행하면 채무자에게 채권이 귀속되어 별도 급부수령 불필요, 채권자에게 양도하면 채권이 이전되어 대위행사 효과가 채무자 아닌 채권자에게 귀속 [2023다301682]","채권자대위권"],[106,"X 부동산의 최종 매수인 甲이 중간 매수인 乙에 대한 소유권이전등기청구권을 보전하기 위해 乙을 대위하여 매도인 丙을 상대로 X 부동산에 대한 처분금지가처분을 받았고 乙이 위 대위 사실을 알게 된 경우, 이후 甲이 乙을 대위하여 丙을 상대로 소유권이전등기절차의 이행을 구하더라도, 丙은 乙에게 X 부동산에 관하여 소유권이전등기를 마쳐 준 사실로 甲에 대하여 대항할 수 없다.",false,"▸ 가처분신청의 대위사실을 안 경우도 피대위권리 처분이 금지되지만(2006다85921 판결), 소유권이전등기를 받는 ‘변제수령’은 제405조 제2항의 ‘처분’이 아니므로 대항 O (한편 처분금지가처분은 채무자 이외의 제3자에 대한 처분을 금지하는 것일 뿐이므로 채무자에게로 처분하는 것은 가처분의 효력에도 저촉되지 않음)","채권자대위권"],[107,"甲은 乙에 대하여 변제기가 도래한 2억 원의 대여금채권(A 채권)을 가지고 있고, 채무초과 상태인 乙은 丙에 대하여 변제기가 도래한 2억 원의 대여금채권(B 채권)을 가지고 있으며, 乙은 그 소유의 X 부동산을 丁에게 증여하였다.§  수익자가 원고가 되어 채무자를 상대로 제기한 부동산 소유권이전등기 소송에서 자백간주 확정판결을 받아 수익자 앞으로 소유권이전등기를 마친 경우, 위 확정판결을 통해 마쳐진 소유권이전등기가 사해행위 취소로 인한 원상회복으로써 말소된다고 하더라도, 그것이 확정판결의 효력에 반하거나 모순되는 것이라고는 할 수 없다.",true,"▸ [민소] 무자력인 채무자가 수익자와 합의하여 수익자가 제기한 소송에서 자백하여 패소판결 혹은 그러한 취지 화해권고결정을 받아 확정시키고 수익자 앞으로 등기 경료 → 일련의 행위 실질적 원인인 이전합의가 사해행위 → 수익자 앞으로 확정판결 통해 마쳐진 소유권이전등기에 대해 채권자가 사해행위취소 및 원상회복으로 말소등기 청구해도 전소 확정판결 기판력 저촉 X ∵ 사해행위취소판결은 수익자가 채권자에 대해 그로 인한 원상회복 의무 부담할 뿐, 채권자와 채무자 사이에서 취소로 인한 법률관계 형성 X (상대적 효력) [2016다204783]","채권자취소권"],[157,"甲은 乙에 대하여 1억 원의 금전채권을 가지고 있었는데, 乙은 자기의 유일한 재산인 X부동산을 丙에게 매도하고 소유권이전등기까지 마쳐주었고, 그 후 X부동산에 관하여 A가 저당권을 취득하였다. 甲이 丙을 상대로 사해행위취소 및 원상회복을 구하는 소를 제기한 경우§甲이 원상회복의 방법으로 가액배상 대신 丙을 상대로 丙 명의의 소유권이전등기의 말소를 구하거나, 乙 앞으로 직접 소유권이전등기절차를 이행할 것을 구할 수는 없다.",false,"▸ 채권자 스스로 위험·불이익 감수하면서 원물반환 O → 이 경우 수익자 등기의 말소 혹은 채무자 앞 직접 소유권이전등기 O [2000다57139]","채권자취소권"],[158,"甲은 乙에 대하여 1억 원의 금전채권을 가지고 있었는데, 乙은 자기의 유일한 재산인 X부동산을 丙에게 매도하고 소유권이전등기까지 마쳐주었고, 그 후 X부동산에 관하여 A가 저당권을 취득하였다. 甲이 丙을 상대로 사해행위취소 및 원상회복을 구하는 소를 제기한 경우§甲이 일단 사해행위취소 및 원상회복으로서 丙 명의의 등기의 말소를 청구하여 승소판결이 확정되었다면, 어떠한 사유로 丙명의의 등기를 말소하는 것이 불가능하게 되었다고 하더라도 다시 丙을 상대로 원상회복청구권을 행사하여 가액배상을 청구하거나 원물반환으로서 乙 앞으로 직접 소유권이전등기절차를 이행할 것을 청구할 수는 없다.",true,"▸ 채권자가 일단 사해행위취소 및 원물반환 청구 승소확정된 경우라면, 그 후 어떤 사유로 원물반환 목적 달성 불가능해도 다시 원상회복으로 가액배상 청구 X → 각하 ∵ 권리보호이익 X, 원물반환과 가액배상 중의 선택은 사실심 변론종결시에 둘 중 하나로 확정 [2004다54978]","채권자취소권"],[159,"사해행위의 목적물인 부동산에 관하여 우선변제권 있는 임차인이 있는 경우에는 부동산 가액 중 임차보증금 해당 부분은 일반 채권자의 공동담보에 제공되었다고 볼 수 없으므로, 임대차계약의 체결시기와 상관없이 그 임차보증금 반환채권액은 가액반환의 범위에서 공제되어야 한다.",false,"▸ 사해행위 ‘이전’에 임대차계약 체결되었고 임차보증금 우선변제권 있다면 이처럼 임차보증금액 공제 O → 그러나 사해행위 ‘이후’ 채무자가 부동산 임대했다면 공제 X ∵ 부동산 가액 중 임차보증금 해당 부분도 공동담보였음 [2018다215756]","채권자취소권"],[160,"채무자 소유의 유일한 재산인 부동산에 관한 매매예약완결권이 제척기간 경과가 임박하여 소멸할 예정인 상태에서, 채무자가 제척기간을 연장하기 위하여 새로 매매예약을 하는 행위는 기존에 부담하는 채무 외에 추가로 채무를 부담하는 것이 아니므로 사해행위에 해당하지 아니한다.",false,"▸ 위 [146] 해설 참조 [AI해설] 유일한 재산에 관하여 매매예약의 예약완결권 제척기간 경과 임박하자 제척기간 연장 위한 새로운 매매예약 → 사해행위 O ∵ 채무자가 부담하지 않아도 될 채무를 새롭게 부담하게 되므로 [2017다247190]","채권자취소권"],[161,"채무초과상태에 있는 채무자가 상속을 포기하는 것은 사해행위취소의 대상이 되지 않고, 유증을 포기하는 것도 직접적으로 채무자의 일반재산을 감소시키지 아니하므로 사해행위취소의 대상이 되지 아니한다.",true,"▸ 가족법상 행위는 사해행위 X → 상속의 승인·포기 X (∵ 순수한 재산적 행위는 X, 인정하면 법률관계 복잡, 재산 현재보다 악화는 아님), 유증의 포기 X (∵ 1074조는 유언자 사망 후 언제든 유증의 승인·포기 자유롭고 소급효 인정, 재산 현재보다 악화는 아님) [2011다29307, 2018다260855]","채권자취소권"],[162,"신축건물의 도급인이 「민법」 제666조가 정한 수급인의 저당권설정청구권의 행사에 따라 공사대금채무의 담보로 그 건물에 저당권을 설정하는 행위는 특별한 사정이 없는 한 사해행위에 해당하지 아니하고, 수급인으로부터 공사대금채권을 양수받은 자의 저당권설정청구에 의하여 신축건물의 도급인이 그 건물에 저당권을 설정하는 행위 역시 다른 특별한 사정이 없는 한 사해행위에 해당하지 아니한다.",true,"▸ [2015다19827]","채권자취소권"],[163,"수인의 채권자 중 1인이 채무자의 재산처분 행위의 취소를 구하는 사해행위 취소의 소를 제기하였는데 그 소송 계속 중 다른 채권자가 채무자의 동일한 재산처분 행위의 취소를 구하는 사해행위 취소의 소를 제기하더라도, 이는 중복제소에 해당하지 않는다.",true,"▸ [민소] 여러 채권자가 동시·이시에 사해행위취소 구해도 중복제소 X, 한 채권자가 승소판결 확정되었어도 그 후 다른 채권자의 동일한 청구는 권리보호이익 有 ∵ 채권자취소권 요건 갖춘 각 채권자는 ‘고유의 권리’로서 사해행위취소·원상회복 구할 수 있으므로 → 이미 원상회복까지 마친 경우 비로소 중첩 범위에 권리보호이익 無 (=채무자·수익자 사이에 사해행위가 ‘해제’되어 원상회복 마친 경우도 마찬가지) [2005다51457]","채권자취소권"],[164,"甲에 대하여 대여금채무를 부담하고 있는 乙이 그의 유일한 소유 재산인 부동산을 그의 아들인 丙에게 매도하고, 그 후 丙은 이를 다시 丁에게 매도한 후 각 소유권이전등기가 경료되었다.§甲은 丙 및 丁을 상대로 사해행위 취소 및 원상회복을 구함에 있어 사해행위의 취소만을 먼저 청구한 다음 원상회복을 나중에 청구할 수도 있는데, 이 경우 사해행위 취소청구가 「민법」 제406조 제2항에 정하여진 기간 안에 제기되었다면 원상회복의 청구는 그 기간이 지난 뒤에도 할 수 있다.",true,"▸ 사해행위 취소만을 먼저 기간 내 제기하였다면 원상회복은 기간 경과하여 제기해도 적법 O [2001다14108]","채권자취소권"],[165,"乙 은행은 甲과 丙 사이의 위 매매계약이 통정허위표시로서 무효인 경우라도 채권자취소권을 행사하여 위 계약의 취소를 구할 수 있다.",true,"▸ 통정허위표시로서 무효인 법률행위도 채권자취소 O [97다50985]","채권자취소권"],[166,"甲과 그 배우자인 乙이 X아파트를 각 1/2 지분씩 공동소유하고 있었는데, 甲과 乙은 위 각 지분에 관하여 근저당권자 丙 앞으로 채무자 甲으로 된 근저당권설정등기를 마쳐주었다. 이후 甲이 乙에게 자신의 X아파트 지분을 증여하고 乙 앞으로 지분소유권이전등기를 마치자, 甲의 채권자 丁이 甲과 乙 사이에 체결된 X아파트 지분에 관한 증여계약이 사해행위에 해당한다고 주장하면서 乙을 상대로 증여계약의 취소와 원상회복 청구를 하였다. 甲과 乙 사이의 증여계약은 사해행위에 해당한다.§丁은 원상회복 청구로서 乙을 상대로 甲 지분의 이전등기말소를 청구할 수도 있고, 乙로 하여금 甲 앞으로 직접 지분소유권의 이전등기절차를 이행할 것을 청구할 수도 있다.",true,"▸ 말소등기와 진명소이등은 소송물이 동일하며, 실제로 99다53704 판결은 수익자에 대하여 말소청구나 진명소이등청구 모두 가능하다고 판시하였음(로민정 정변멘트)","채권자취소권"],[167,"甲과 그 배우자인 乙이 X아파트를 각 1/2 지분씩 공동소유하고 있었는데, 甲과 乙은 위 각 지분에 관하여 근저당권자 丙 앞으로 채무자 甲으로 된 근저당권설정등기를 마 한 채권자취소소송에서 1인의 집행포기는 상대적 효력이 있을 뿐임","채권자취소권"],[204,"채무자 甲이 저당권이 설정된 X 주택을 채권자를 해할 목적으로 乙에게 매도하고, 乙은 X주택을 丙에게 임대하여 인도한 후 乙이 그 피담보채무를 변제하여 저당권을 말소한 경우, 사해행위취소로 인한 乙의 가액반환의 액수는 사실심 변론종결시점의 X 건물의 가액에서 乙의 변제액과 丙의 우선변제권 있는 임차보증금채권액을 공제하여 산정해야 한다.",true,"▸ 사해행위 이전에 임대차계약 체결되었고 임차보증금 우선변제권 있다면 이처럼 임차보증금액 공제 O, 그러나 사해행위 이후 채무자가 부동산 임대했다면 공제 X ∵ 부동산 가액 중 임차보증금 해당 부분도 공동담보였음 [2018다215756]","채권자취소권"],[205,"채무자의 수익자에 대한 채권양도가 사해행위로 취소되고 그에 따른 원상회복으로서 제3채무자에게 채권양도가 취소되었다는 통지가 이루어진 경우, 채권자는 채무자를 대위하여 제3채무자를 상대로 위 채권의 이행을 청구할 수 없다.",true,"▸ 채권양도가 사해행위로 취소되는 경우 수익자가 제3채무자에게서 아직 채권을 추심하지 않았다면 원상회복은 수익자가 제3채무자에게 채권양도가 취소되었다는 통지를 하도록 청구 O, 이 경우 통지 이루어진 후에도 채권자는 채무자를 대위하여 제3채무자에 대하여 지급청구 X ∵ 채권자와 수익자 관계에서 채권이 채무자 책임재산으로 취급될 뿐, 채무자가 직접 채권을 취득하여 권리자로 되는 것은 X [2021다2743]","채권자취소권"],[206,"채권자의 채권이 사해행위 이전에 성립한 이상 사해행위 이후에 채권이 양도되었다고 하더라도 그 양수인은 채권자취소권을 행사할 수 있다.",true,"▸ 사해행위 이전에 성립된 채권이 사해행위 이후에 채권양도 있거나 대항요건 갖추더라도 채권자취소권의 피보전채권 O [2004다5822]","채권자취소권"],[207,"채무자가 소멸시효 완성 후에 한 소멸시효이익의 포기행위는 원래부터 존재하였던 채무를 승인한 것에 불과하여 채무자가 부담하지 않아도 되는 채무를 새롭게 부담하는 행위가 아니므로 사해행위취소의 소를 제기할 수 없다.",false,"▸ 위 [192] 해설 참조 [AI해설] 소멸시효 이익 포기행위는 결과적으로 채무자가 부담하지 않아도 되는 채무를 새로이 부담한 것이어서 사해행위취소 대상 O [2012마712]","채권자취소권"],[208,"사해행위취소의 소에서 수익자가 가액배상을 할 경우, 수익자 자신도 채무자에 대한 채권자 중의 1인이라는 이유로 취소채권자에게 상계를 주장하여 자기채권에 해당하는 안분액의 지급을 거절할 수 없다.",true,"▸ 수익자가 가액배상을 할 때 자신도 채무자에 대한 채권자라면서 채무자에 대한 반대채권으로 상계 X [99다63183]","채권자취소권"],[209,"甲과 乙은 甲 소유의 X 토지를 乙이 매수하는 계약을 체결하면서 매매대금은 X 토지의 인도 및 소유권이전등기의 경료와 동시에 지급하기로 약정하였다. 丙은 위 매매계약에 따른 乙의 甲에 대한 매매대금 지급채무를 연대보증하였다.§甲은 丁에게 乙에 대한 매매대금채권을 양도하면서 위 계약 내용 및 X 토지에 관하여 아직 소유권이전등기를 마쳐 주지 아니한 사실을 설명하였고, 같은 날 乙은 채권양도에 대하여 이의를 보류하지 않는 승낙을 하였다. 이후 丁이 乙에게 양수금의 지급을 청구할 경우 乙은 甲으로부터 소유권이전등기의무의 이행제공이 없었음을 이유로 丁의 청구를 거절할 수 없다.",false,"▸ 이의를 보류하지 않은 승낙(제451조 제1항) : 항변권 상실 = 양도인에게 대항할 수 있는 사유로써 양수인에게 대항 X (≠451조 2항 통지 → 항변 O = 동일성)","채권양도"],[210,"甲과 乙은 甲 소유의 X 토지를 乙이 매수하는 계약을 체결하면서 매매대금은 X 토지의 인도 및 소유권이전등기의 경료와 동시에 지급하기로 약정하였다. 丙은 위 매매계약에 따른 乙의 甲에 대한 매매대금 지급채무를 연대보증하였다.§甲이 丁에게 乙에 대한 매매대금채권을 양도하고 확정일자 있는 증서 인수 효력 X [98다33765]","채무인수"],[248,"중첩적 채무인수는 채권자와 채무인수인과의 합의가 있는 이상 채무자의 의사에 반하여서도 이루어질 수 있다.",true,"▸ [87다카1836] → 채권자·인수인 사이 계약은 ‘보증’ 성질 → 이해관계 없는 제3자가 채무자의 의사에 반하여 병존적 채무인수 O","채무인수"],[249,"인수채무가 원래 5년의 상사시효의 적용을 받던 채무라면 면책적 채무인수 후에도 그 소멸시효의 기간은 여전히 5년의 상사시효의 적용을 받는다.",true,"▸ 면책적 채무인수는 채무의 동일성 유지하면서 종래의 채무자로부터 제3자인 인수인에게 이전하는 것 → 원래 채무가 5년 상사시효 적용 받았다면 면책적 채무인수로 채무자 지위가 교체되었더라도 소멸시효기간은 여전히 5년 상사시효 적용 O → 면책적 채무인수와 동시에 이뤄진 소멸시효 중단사유, 즉 채무승인에 따라 소멸시효기간은 채무인수일로부터 새로이 진행 [99다12376]","채무인수"],[250,"계약인수에 의하여 계약당사자의 지위가 제3자에게 이전되는 경우 계약상 지위를 전제로 한 권리관계뿐만 아니라 불법행위에 기한 손해배상청구권도 별도의 채권양도절차 없이 제3자에게 그대로 이전된다.",false,"▸ 계약인수는 계약당사자 지위 승계, 계약에서 생기는 채권·채무, 해제권 등 포괄적 권리의 무 양도, 양도인은 계약관계 탈퇴, 특별한 사정 없는 한 잔류당사자와 양도인 사이 계약관계 X, 채권채무 소멸 → 채권양도에서 채무자 보호 위한 대항요건은 계약인수에서는 별도 요구 X, 상법상 영업양도 수반 계약인수도 마찬가지 甲주식회사·乙주식회사 사이 영업양도계약 체결하며 근로자(丙 등)에 대한 사용자의 모든 권리의무 이전, 丙도 乙회사와 동일조건 근로계약(종전 근로기간 소급 작성) → 영업양도 전 甲이 丙회사 업무 관련 고객 돈 횡령한 경우, 甲회사의 丙에 대한 손해배상채권도 乙회사가 승계취득 O ∵ 잔류당사자 丙이 영업양도 인식하고 근로계약 인수 승낙, 인수인 乙회사에 사용자 지위뿐 아니라 근로계약 기초로 이미 발생한 손해배상채권도 이전, 대항요건 불필요 [2020다245958]","채무인수"],[251,"매수인이 매매목적물에 관한 근저당권의 피담보채무를 인수하는 것으로 매매대금의 지급에 갈음하기로 약정한 경우 특별한 사정이 없는 한 매수인이 매매대금에서 그 채무액을 공제한 나머지를 지급함으로써 잔금지급의무를 다하였다고 볼 것이고, 매수인이 피담보채무인 대출금채무의 이자를 일부 지급하지 않았다는 사정만으로 매매계약을 해제할 수는 없다.",true,"▸ 매수인은 현실적으로 당장 변제할 의무 X, 매매대금에서 채무액 공제한 나머지를 지급함으로써 잔금지급의무 다한 것 O, 인수인이 인수채무를 현실적 변제 않았다는 사정만으로 매도인은 매매계약 해제 X [93다19108]","채무인수"],[252,"전채무자의 채무에 관하여 담보를 제공한 제3자가 있는 경우에, 제3자가 면책적 채무인수에 동의하지 않았다면 그 담보는 채무인수로 인하여 소멸한다.",true,"[조문] 제459조(채무인수와 보증, 담보의 소멸) 전채무자의 채무에 대한 보증이나 제3자가 제공한 담보는 채무인수로 인하여 소멸한다. 그러나 보증인이나 제삼자가 채무인수에 동의한 경우에는 그러하지 아니하다.","채무인수"],[253,"| 23.06모-17 금전소비대차계약으로 인한 채무에 관하여 제3자가 채무자를 위하여 어음이나 수표를 발행하는 것은 특별한 사정이 없는 한 중첩적 채무인수에 해당한다.",true,"▸ 금전소비대차계약 채무에 관하여 제3자가 채무자를 위하여 어음·수표 발행함은 특별한 사정 없는 한 동일 채무 중첩적 인수 O [97다52493]","변제"],[254,"민법 제459조 단서는 보증인이나 제3자가 채무인수에 동의한 경우에는 전채무자의 채무에 대한 보증이나 제3자가 제공한 담보는 채무인수로 인하여 소멸하지 아니하는 것으로 규정하고 있으므로, 위 조항에 규정된 채무인수에 대한 동의는 인수인을 위하여 새로운 담보를 설정하도록 하는 의사표시를 의미하는 것이다.",false,"▸ 물상보증인이 채무의 인수인이 되었다면 459조의 동의 O → 그러나 이는 당초 채무자가 부담하여 물상보증인이 인수한 채무만 O, 인수 후 물상보증인이 새로 부담하게 된 채무는 X [98다40657, 2000다56204] [조문] 제459조(채무인수와 보증, 담보의 소멸) 전채무자의 채무에 대한 보증이나 제3자가 제공한 담보는 채무인수로 인하여 소멸한다. 그러나 보증인이나 제삼자가 채무인수에 동의한 경우에는 그러하지 아니하다.","변제"],[255,"면책적 채무인수의 경우, 종래의 채무자는 채무관계에서 탈퇴하여 면책되고 채무인수로 종래의 채무가 소멸하므로 저당권의 부종성으로 인하여 당연히 위 소멸한 채무를 담보하는 저당권도 소멸한다.",false,"▸ 면책적 채무인수로 ‘제3자’가 제공한 인적·물적 담보가 소멸할 뿐 채무자가 제공한 담보는 소멸되지 않으므로, 면책적 채무인수만으로 채무 소멸과 부종성으로 인해 담보가 소멸한다는 논리는 틀림 (참고판례: 96다27476 판결)","변제"],[256,"물상보증인이 채무인수에 동의함으로써 소멸하지 않는 담보는 당연히 기존의 담보와 동일한 내용을 갖는다.",true,"▸ 물상보증인의 채무인수에 관한 동의는 채무인수인을 위해 새로운 담보 설정하겠다는 의사표시가 아니라 기존의 담보를 채무인수인을 위해 계속 유지하겠다는 의사표시 → 동의로 유지되는 담보는 기존 담보와 동일한 내용 [2000다56204]","변제"],[257,"물상보증인이 저당권의 채무자의 계약상 지위를 인수한 것이 아니라, 다만 그 채무만을 면책적으로 인수하고 이를 원인으로 하여 근저당권 변경의 부기등기가 경료된 경우, 특별한 사정이 없는 한 채무를 인수한 물상보증인이 다른 원인으로 근저당권자에 대하여 부담하게 된 새로운 채무까지 담보하는 것으로 볼 수는 없다.",false,"▸ 물상보증인이 면책적 인수를 하고 근저당권 변경의 부기등기 경료되면 이는 당초 채무자가 근저당권자에 대해 부담하고 있던 것으로서 물상보증인이 인수한 채무만을 대상으로 하는 것 → 그 후 채무 인수한 물상보증인이 다른 원인으로 근저당권자에 대하여 부담하게 된 새로운 채무까지 담보하는 것은 X [98다40657]","변제"],[258,"甲이 乙에 대해 부담하는 채무를 乙과 丙의 합의에 따라 丙이 중첩적으로 인수하는 경우, 그 채무인수에 대하여 甲이 동의하지 않더라도 중첩적 채무인수의 효력에는 아무런 영향이 없다.",true,"▸ 채권자·인수인 사이 계약은 ‘보증’ 성질 → 이해관계 없는 제3자가 채무자의 의사에 반하여 병존적 채무인수 O","변제"],[259,"乙이 甲 소유의 토지를 매수하면서, 甲과 乙 사이에 중도금 및 잔금을 乙이 甲의 채권자 丙에게 직접 지급하기로 하여 丙으로 하여금 그 채권을 취득하게 할 의사로 약정한 경우, 그 약정은 제3자를 위한 계약으로서 중첩적 채무인수에 해당한다.",true,"▸ 채무자·인수인 사이의 병존적 채무인수는 제3자를 위한 계약 O → 구별기준: 제3자에게 직접 채권을 취득하게 할 의사가 있는지 여부","변제"],[260,"병존적 채무인수에서 인수인이 채무자의 부탁 없이 채권자와의 계약으로 채무를 인수하는 것은 매우 드문 일이므로, 채무자와 인수인은 통상 주관적 공동관계가 있는 연대채무관계에 있고, 인수인이 채무자의 부탁을 받지 아니하여 주관적 공동관계가 없는 경우에는 부진정연대관계에 있는 것으로 보아야 한다.",true,"▸ 중첩적 채무인수가 채무자의 부탁 없이 채권자와의 계약으로 채무를 인수하는 것은 매우 드문 일이므로, 원칙적으로 주관적 공동관계가 있는 연대채무 / 부탁이 없어 주관적 공동관계 없다면 부진정연대채무 [2009다32409]","변제"],[261,"甲은 乙로부터 乙 소유의 X 건물을 10억 원에 매수하는 매매계약을 체결하면서 위 매매대금 중 4억 원은 이미 X 건물에 설정되어 있던 乙의 근저당권부 차용금채무 4억 원을 甲이 인수하는 것으로 하고, 나머지 6억 원은 X 건물의 소유권이전등기서류와 상환으로 지급하기로 약정하였다.§甲이 위 근저당권부 차용금채무 4억 원의 변제를 불이행하여 乙이 대신 변제한 경우, 甲의 구상채무 이행의무와 乙의 소유권이전등기 이행의무는 동시이행관계에 있지 않다.",false,"▸ 부동산매매계약·이행인수계약이 함께 이뤄진 경우, ⓐ 매수인의 인수채무불이행으로 말미암아 또는 ⓑ 임의로, 매도인이 인수채무를 대신 변제했다면, 그로 인한 ⓐ 손해배상채무 또는 ⓑ 구상채무는 인수채무의 변형(=매매대금지급채무에 갈음한 것의 변형)이므로 매도인의 소유권이전등기의무와 동시이행 O → 인수인이 인수채무 변제 게을리 하여 경매가 시작되고 매도인이 경매 막고자 변제했다면 매도인은 손해배상채권 취득 O, 이를 들어 매매 해제 O [92다23193]","변제"],[262,"채무인수에 있어서 면책적 인수인지 중첩적 인수인지 분명하지 아니한 때에는 특별한 사정이 없는 한 중첩적 채무인수로 보아야 한다.",true,"▸ [2002다36228]","변제"],[263,"계약인수에서는 개별 채권양도에서 채무자 보호를 위하여 요구되는 대항요건은 별도로 요구되지 않고, 이러한 법리는 「상법」상 영업양도에 수반된 계약인수에 대해서도 마찬가지로 적용된다.",true,"▸ 위 [250] 해설 참조 [AI해설] 계약인수는 계약당사자 지위 승계로 계약에서 생기는 채권·채무, 해제권 등 포괄적 권리의무가 양도되므로, 채권양도에서 채무자 보호 위한 대항요건은 계약인수에서 별도 요구 X. 상법상 영업양도 수반 계약인수도 마찬가지 [2020다245958]","변제"],[264,"| 25변시-13 「표시·광고의 공정화에 관한 법률」상 허위·과장광고의 불법행위를 원인으로 하는 손해배상청구권을 가지고 있던 아파트 수분양자가 수분양자의 지위를 제3자에게 양도하면, 양수인은 특별한 사정이 없는 한 별도의 채권양도 절차 없이도 위 손해배상청구권을 행사할 수 있다.",true,"▸ 구 표시·광고의 공정화에 관한 법률상 허위·과장광고로 인한 손해배상청구권은 불법행위 손해배상청구권 성격 → 계약상 지위 양도로 계약당사자 지위가 제3자에게 이전될 경우, 계약상 지위 전제로 한 권리관계만 이전, 불법행위 기한 손해배상청구권은 별도 채권양도 절차 없이 제3자에게 당연히 이전되지 X → 다만 허위·과장광고 그대로 믿고 광고로 높아진 가격에 수분양자 지위 양수하는 등 양수인이 수분양자 지위 양도받으면서 허위·과장광고로 인한 손해 입었다는 등의 특별한 사정 있어야 양수인이 손해배상청구권 행사 가능 [2012다15336]","변제"],[265,"매도인의 매수인에 대한 매매대금 채권이 압류된 이후 매도인의 지위를 이전하는 계약인수가 이루어진 경우, 매도인과 매수인 사이의 계약관계는 소멸하더라도 인수인은 위 압류에 의하여 권리가 제한된 상태의 매매대금 채권을 이전받게 된다.",true,"▸ 채권 압류는 지급금지 명하지만 채권 발생원인인 법률관계에 대한 처분까지 구속 X → 계약인수 O, 양도인 탈퇴하지만 양도인이 계약관계로 가지던 권리의무 동일성 유지한 채 양수인에 승계, 양수인은 압류로 권리 제한된 상태의 채권 이전받음 → 제3채무자는 계약인수 내세워 압류채권자에게 대항 X [2012다41359]","변제"],[266,"매수인의 잔대금 지급의무와 매도인의 소유권이전등기의무가 동시이행의 관계에 있는 경우, 매수인이 잔대금 지급기일까지 그 대금을 지급하지 못하면 그 계약이 자동으로 해제된다는 취지의 약정이 있다면, 특별한 사정이 없는 한 매도인의 이행제공 없이도 매수인의 대금 미지급으로 계약은 자동해제된다.",false,"▸ 잔금을 기일에 지급하지 못하면 자동해제된다는 약정이 있더라도, 매도인이 잔금지급기일에 소유권이전등기 필요 서류 이행제공을 하여 매수인을 이행지체에 빠지게 하였을 때 비로소 자동해제 O [88다카28891]","변제"],[267,"채권자가 변제를 수령하지 않을 의사가 명백하여 수령거절의사를 반복할 가능성이 보이지 않는 경우, 채무자는 구두의 변제제공을 하지 않더라도 채권자에게 이행지체책임을 지지 않는다.",true,"▸ 460조는 수령거절의 번의가능성을 고려하여 구두제공을 규정한 취지, 변제를 수령하지 않을 의사가 명백하여 번의가능성 그 명령이 C에게 송달되었으나, C는 이를 간과하고 B에게 12억 원을 지급하였다. B는 수령한 12억 원을 그대로 A에게 전달하면서 대여금채무와 약속어음금채무 중 어느 채무에 충당하는지에 대해 지정하지 않았다.§민법 제472조에서 ‘채권자가 이익을 받은’ 경우란 변제수령자가 채권자에게 변제로 받은 급부를 전달한 경우는 물론이고, 변제수령자가 변제로 받은 급부를 가지고 채권자의 자신에 대한 채무의 변제에 충당하거나 채권자의 제3자에 대한 채무를 대신 변제함으로써 채권자의 기존 채무를 소멸시키는 등 채권자에게 실질적인 이익이 생긴 경우를 포함한다.",true,"▸ 472조 권한 없는 자에 대한 변제에서 ‘이익을 받은 경우’란 ⓐ 수령자가 채권자에게 변제로 전달, ⓑ 채권자가 사후추인, ⓒ 수령자가 채권자의 자신·제3자에 대한 채무ⓐ에 충당·변제하여 기존 채무 소멸시킨 경우 포함 O, 그러나 수령자가 자신의 채권자에 대한 채무 변제한 경우는 X ∵ 채권자에게 실질적 이익 X [2017다278729]","변제"],[274,"A는 B에 대하여 15억 원의 대여금채권과 15억 원의 약속어음금채권을 각각 가지고 있다. A가 위 약속어음에 대한 공정증서에 기초하여 B의 C에 대한 물품대금채권 중 15억 원에 관해 채권압류명령을 받아 그 명령이 C에게 송달되었으나, C는 이를 간과하고 B에게 12억 원을 지급하였다. B는 수령한 12억 원을 그대로 A에게 전달하면서 대여금채무와 약속어음금채무 중 어느 채무에 충당하는지에 대해 지정하지 않았다.§변제수령자가 변제로 받은 급부를 가지고 자신이나 제3자의 채권자에 대한 채무를 변제한 때에는 채권자에게 실질적인 이익이 생긴 경우로서 민법 제472조에 의한 변제의 효력이 인정된다.",false,"▸ 위 [273] 해설 참조 [AI해설] 수령자가 자신의 채권자에 대한 채무를 변제한 경우는 채권자에게 실질적 이익 X → 472조 변제 효력 불인정 [2017다278729]","변제"],[275,"A는 B에 대하여 15억 원의 대여금채권과 15억 원의 약속어음금채권을 각각 가지고 있다. A가 위 약속어음에 대한 공정증서에 기초하여 B의 C에 대한 물품대금채권 중 15억 원에 관해 채권압류명령을 받아 그 명령이 C에게 송달되었으나, C는 이를 간과하고 B에게 12억 원을 지급하였다. B는 수령한 12억 원을 그대로 A에게 전달하면서 대여금채무와 약속어음금채무 중 어느 채무에 충당하는지에 대해 지정하지 않았다.§A가 12억 원을 수령하면서 이를 대여금채권에 변제충당한다고 B에게 통보하였다면, A가 B로부터 12억 원을 그대로 전달받아 실질적인 이익을 얻었으므로, B의 변제는 민법 제472조에 따라 12억 원의 범위에서 그 효력이 있다.",false,"▸ 위 사안은 A가 B에 대한 채권ⓐ를 집행채권으로 B의 C에 대한 물품대금채권에 압류 및 전부명령 → C는 이를 간과한 채 B에게 물품대금채권을 변제함 → B는 C로부터 수령한 변제금을 충당 지정 없이 A에게 전달 → A는 C에 대한 전부소송에서 전부명령 무효(압류 경합)로 인해 패소 후 다시 자신이 받은 압류명령에 기초하여 추심명령 받고 C에 대해 추심금청구 → A 승소, C는 472조 주장 X ∵ B가 C로부터 받은 돈을 A에게 전달한 것으로 보이나 A의 지정으로 채권ⓐ에 충당되었으므로 이는 B가 자신의 채권자에 대한 다른 채무 변제한 것일 뿐임, 전부명령이 민집법 229조 5항으로 무효이더라도 압류명령은 유효하므로 C가 압류명령 받은 후 압류채무자 B에게 변제하여 스스로 이중지급 위험 감수해야","변제"],[276,"채권자와 채무자 사이에 미리 채권자가 적당하다고 인정하는 순서와 방법에 의하여 충당하기로 하는 내용의 변제충당에 관한 약정이 있다면, 변제수령권자인 채권자가 위 약정에 터 잡아 변제충당을 한 이상 변제자에 대한 의사표시와 관계없이 충당의 효력이 있다.",true,"▸ 미리 채권자·채무자 사이에 ‘채권자가 적당하다고 인정하는 순서·방법에 의하여 충당하기로’ 약정했다면, 변제수령권자 스스로 정한 순서·방법으로 변제충당 O → 이 경우 채무자가 변제하면서 지정충당 X [98다27517]","변제"],[277,"비용, 이자, 원본에 대한 변제충당에 있어 당사자 사이에 특별한 합의가 없는 한 비용, 이자, 원본의 순서로 충당하여야 하고 채무자는 물론 채권자라도 위 법정순서와 다르게 일방적으로 충당의 순서를 지정할 수는 없으나, 상대방의 이의제기가 없어 묵시적인 합의가 있다고 볼 경우에는 그러하지 아니하다.",true,"▸ 합의 없는 상태에서 비·이·원 법정 순서와 다르게 당사자가 일방적 지정함에 대하여 상대방이 지체없이 이의 아니했다면 묵시적 합의의 충당 O [2002다12871]","변제"],[278,"변제에 관한 증명책임은 채무자에게 있으므로, 특정 채무의 변제로서 급부를 하였다는 채무자의 주장에 대하여 채권자가 이를 수령한 사실을 인정하면서도 다른 채무의 변제에 충당하였다고 다투는 경우에는 특정 채무에 변제충당하기로 하는 합의나 지정 또는 특정 채무가 법정충당의 우선순위에 있었다는 사실을 채무자가 주장·증명해야 한다.",false,"▸ ‘변제’의 증명책임은 채무자, 채무자가 객관적으로 특정채무 내용에 적합한 급부 했다면 특별한 사정 없는 한 그 채무 변제로 인정 여러 채무 내용 적합하나 채무 전부 소멸시키기 부족한 경우 ‘변제충당’ 문제됨 → 채무자가 그중 특정채무 변제로서 급부했다고 주장함에 대해, 채권자가 수령한 사실 인정하면서 다른 채무 변제에 ‘충당’했다고 주장할 경우, 채권자는 ① 다른 채권 존재 사실, ② 다른 채권에 변제충당 합의, 지정, 법정충당 우선순위 있었던 사실 주장·증명해야 [2024다258921]","변제"],[279,"비용, 이자, 원본에 대한 변제충당에 있어서는 지정변제충당이 허용되지 않으므로 한쪽 당사자의 일방적인 지정에 대하여 상대방이 지체없이 이의를 제기하지 않았더라도 반드시 법정충당의 순서에 따라 충당이 이루어져야 한다.",false,"▸ 위 [277] 해설 참조 [AI해설] 합의 없는 상태에서 비·이·원 법정 순서와 다르게 당사자가 일방적 지정함에 대하여 상대방이 지체없이 이의 아니했다면 묵시적 합의의 충당 O [2002다12871]","변제"],[280,"근저당권에 의하여 담보된 피담보채무가 여러 차례에 걸쳐 대여받은 채무들로 이루어져 있는 경우 수 개의 채무라고 보아야 하고, 담보권 실행을 위한 경매에서 배당금이 수 개의 피담보채무 전부를 소멸시키기에 부족한 경우 변제충당을 합의에 의하여 지정변제충당은 허용될 수 없고 합의에 의한 변제충당은 허용된다.",false,"▸ 경매에서는 합의충당 X → 획일적으로 가장 공평 타당한 477조 법정충당 O [95다55504]","변제"],[281,"변제자가 주채무자이고 연대보증약정이 있는 경우로서 다른 조건이 동일하다면, 연대보증기간 내의 채무와 연대보증기간 종료 후의 채무 사이의 변제이익은 같다.",true,"▸ 보증기간 중 채무와 보증기간 종료 후 채무는 변제이익 차이 없으므로 주채무자 변제액은 변제기 먼저 도래한 채무부터 법정충당 [99다26481, 2019다207141]","변제"],[282,"주채무자 이외의 자가 변제자인 경우로서 다른 조건이 동일하다면, 변제자가 발행 또는 배서한 어음에 의하여 담보되는 채무가 그렇지 않은 채무보다 변제이익이 더 많다.",true,"▸ [99다22281]","변제"],[283,"변제자가 주채무자인 경우로서 다른 조건이 동일하다면, 담보로 주채무자 자신이 발행 또는 배서한 어음에 의하여 담보되는 채무가 그렇지 않은 채무보다 변제이익이 더 많다.",true,"▸ 지문 ④⑤ : 제3자가 담보로 발행 or 배서한 약속어음 교부된 채무와 다른 채무 사이에 변제이익 차이 없고 동일 → 그러나 변제하는 자가 발행 or 배서한 어음으로 담보되는 채무는 다른 채무보다 변제이익 많음 [99다22281]","변제"],[284,"담보권 실행을 위한 경매에서 배당금이 담보권자가 가지는 수 개의 피담보채권 전부를 소멸시키기에 부족한 경우에는 채권자와 채무자 사이에 변제충당에 관한 합의가 있었다고 하더라도 그 합의충당은 허용될 수 없고, 획일적으로 민법 제477조 및 제479조에 따른 법정변제충당의 방법에 따라 충당하여야 한다.",true,"▸ 합의가 있었더라도 합의충당이 허용될 수 없으며, 획일적으로 가장 공평타당한 충당방법인 민법 477조 및 479조 규정에 의한 법정변제충당 방법에 따라야 [2000다51339]","변제"],[285,"변제충당에 관한 규정은 임의규정이므로 채권자와 채무자 사이의 합의에 따라 비용, 이자, 원본의 순서와 다르게 충당할 수도 있고, 이는 임의경매절차에서 배당금이 담보권자가 가지는 수 개의 피담보채권 전부를 소멸시키기에 부족한 경우에도 마찬가지이다.",false,"▸ 위 [284] 해설 참조 [AI해설] 경매에서는 합의충당 X → 획일적으로 가장 공평 타당한 477조 법정충당 O [95다55504, 2000다51339]","변제"],[286,"甲은 乙에 대한 3억 원의 대여금 채권을 담보하기 위하여, 乙 소유의 X 토지, 丙 소유의 Y 토지, 丁 소유의 Z 토지에 각각 저당권을 취득하였고 戊와는 보증계약을 체결하였다. (이자·지연손해금·집행비용은 불고려, 각 지문 독립적)§丙이 乙의 채무를 면책적으로 인수한 경우, 丙은 특별한 사정이 없는 한 乙에 대하여 구상권을 가진다.",false,"▸ 물상보증인의 구상권 취득요건에 면책적 채무인수는 포함 X ∵ 채무소멸 X → 물상보증인이 면책적 채무인수 해도 구상권 X [2017다274703]","변제자대위"],[287,"甲은 乙에 대한 3억 원의 대여금 채권을 담보하기 위하여, 乙 소유의 X 토지, 丙 소유의 Y 토지, 丁 소유의 Z 토지에 각각 저당권을 취득하였고 戊와는 보증계약을 체결하였다. (이자·지연손해금·집행비용은 불고려, 각 지문 독립적)§A가 乙로부터 X 토지를 취득한 후에 戊가 甲에게 3억 원을 변제한 경우, 戊는 X 토지에 설정된 위 저당권에 관하여 대위의 부기등기를 하지 않더라도 A에 대하여 甲을 대위할 수 있다.",true,"▸ 지문 ㄴ, ㄷ 관련: 제3취득자가 목적부동산 권리 취득한 ‘후’ 채무 변제한 보증인은 대위 부기등기 없이도 대위 O ∵ 482조 2항 1호는 제3취득자를 예측 불허 손해로부터 보호, 보증인 변제 전 권리 취득한 제3취득자는 등기부상 저당권 존재 알고 권리 취득하여 불측 손해 염려 X [2019다222041]","변제자대위"],[288,"甲은 乙에 대한 3억 원의 대여금 채권을 담보하기 위하여, 乙 소유의 X 토지, 丙 소유의 Y 토지, 丁 소유의 Z 토지에 각각 저당권을 취득하였고 戊와는 보증계약을 체결하였다. (이자·지연손해금·집행비용은 불고려, 각 지문 독립적)§乙로부터 X 토지를 취득한 A가 X 토지에 설정된 위 저당권의 실행으로 소유권을 잃은 경우, A는 丙, 丁에 대하여 甲을 대위할 수 없다.",false,"▸ 482조 2항에 ‘물상보증인’과 ‘제3취득자’ 상호간 변제자대위에 관하여 규정 無, 물상보증인이 채무 변제나 담보권 실행으로 소유권 잃은 때에는 보증인과 마찬가지로 제3취득자에 대하여 구상권 범위 내 채권자를 대위 O, 그러나 제3취득자는 채무 변제나 담보권 실행으로 소유권 잃더라도 물상보증인에 대하여 채권자를 대위 X ∵ 370조·341조는 물상보증인에게 보증인의 구상권 준용 인정, 482조 2항 5호는 보증인·물상보증인을 인원수 비례로 대위하게 하여 우열 X, 만일 물상보증인·제3취득자 상호간 각 부동산 가액 비례로 대위하게 하면 우연한 사정으로 뜻밖의 손해·이익을 주어 부당, 482조 2항 1, 2호 [2011다50233]","변제자대위"],[289,"채무를 변제할 정당한 이익이 있는 자가 채무를 대위변제한 경우에 통상 채무자에 대하여 구상권을 가짐과 동시에 변제자의 법정대위에 관한 「민법」 제481조에 의하여 당연히 채권자를 대위하나, 위 구상권과 변제자대위권은 별개의 권리이므로, 대위변제자와 채무자 사이에 구상금에 관한 지연손해금 약정이 있더라도 이 약정은 변제자대위권을 행사하는 경우에는 적용될 수 없다.",true,"▸ 물상보증인(연대채무자 1인)이 채무자(다른 연대채무자)를 위해 변제한 경우 구상권을 가짐과 동시에 는 임대차계약 종료로, 후자는 상임법의 권리금 회 수기회 보호의무 위반으로 발생 (2018다242727].","동시이행의항변권"],[14,"원고가 단순이행청구를 함에 대하여 피고가 동시이행의 항변권을 행사하지 않더라도 법원은 직권으로 상환이행판결을 할 수 있다.",false,"[민소] 변론주의 一 피고가 항변으로 주장해야 一 인정되면 상환이행판결(일부승소).","동시이행의항변권"],[15,"甲과 乙이 甲 소유 X토지에 관하여 매매계약을 체결한 상황에서, 甲의 채권자 丙이 甲의 乙에 대한 매매대금 잔금채권에 대해 압류 및 추심 명령을 얻은 후 乙이 甲에게 소유권이전등기를 청구한 경우, 甲은 乙의 잔금 미지급을 이유로 동시이행 항 변권을행사할 수 있다.",true,"[집행] 압류 및 추심명령 있는 경우. 추심채무자는 제3채무자에 대해 피압류채권에 기한 동시이행항변권을 상실하지 않음 ? 추심채권자에게 채무자의 제 3 채무자에 대한 채권의 추 심권능만 부여하고 그 채권이 추심채권자에게 이전 • 귀속되는 것은 X [2000다73490] 一 최근 판례가 변경된 대법원 2025. 10. 23. 선고 2021다252977 전원합의체 판결과 상관없이 여전히옳은지문.","동시이행의항변권"],[16,"채무의 이행확보를 위하여 어음을 발행한 경우, 채무의 이행과 어음의 반환.",true,"채무 이행확보를 위하여 어음을 발행한 경우 채무 이행과 어음 반환은 동시이행관계 O [92다8712] 一 단. 이 경우 원인채무 이행기 도래하면 어음반환으로 항변하지 않는 한 원 칙적으로 지체책임 진다는 93 다 11203 판결과 구별할 것.","동시이행의항변권"],[17,"동시이행의 관계에 있는 쌍방의 채무 중 어느 한 채무가 이행불능이 됨으로 인하여 발생한 손해배상채무는 여전히 다른 채무와 동시이행관계에 있다.",true,"채권양도 · 채무인수. 이행불능으로 인한 손해배상채무로 변경. 급부 불능으로 인한 대상청 구권 발생 一 동일성 있으므로 여전히 동시이행 0.","동시이행의항변권"],[18,"임대차 종료 후 임차인의 임차목적물 인도의무와 임대인의 연체임료 기타 손해배상금을 공제하고 남은 임차보증금 반환의무와는 동시이행관계에 있으므로, 임차인이 동시이행항변권에 기하여 임치목적물을 점유하고 사용·수익한 경우 그 점유· 사용으로 인한 이익에 대하여 부당이 득반환의무가 인정되지 않는다.",false,"임차인이 동시이행 항변권에 기하여 임차목적물을 점유 人돋; •수익한 경우 불법점유로 인 한 손해배상청구 X 一 그러나 사용·수익으로 인하여 실질적으로 얻은 이익 있으면 부당이득반환 O [98 다 15545].","동시이행의항변권"],[19,"근저당권 실행을 위한 경매가 무효로 되어 근저당권자인 채권자가 채무자를 대위하여 경매절차의 매수인에 대한 소유권이전등기 말소청구권을 행사하는 경우, 매수인이 부담하는 소유권이전등기 말소의 무와 위 근저당권자가 매수인에 대하여 부 담하는 배당금 반환채무는 서로 이행의 상대방을 달리하는 것으로서 동시이행관계 에있지 않다.",true,"임의경매 무효인 경우 채권자( ＝근저당권자)가 채무자를 대위하여 경락인에게 하는 소유권이전등기 말소청구와 경락인이 배당금을 수령한 채권자(＝근저당권자)에게 하는 배당금반 환청구는 동시이행 X ·: 서로 이행의 상대방 다름 [2006다24049].","동시이행의항변권"],[20,"주택임대차보호법상의 임차권등기명령에 의하여 임차권이 등기된 경우 임대인의 임대차보증금반환의무와 임차인의 임차권등기말소의무는 동시이행관계에 있다.",false,"임차권등기명령에 의한 등기는 이미 이행지체에 빠진 임대인에 대한 것으로서 보증금반환의 무가 임차권등기 말소의무보다 선이행의무 [2005다4529] 一 동시이행관계가 아님을 주의.","동시이행의항변권"],[21,"채무를 담보하기 위하여 어음이 발행된 경우 채권자가 원인채권을 행사함에 있어서 채무자는 원칙적으로 어음과 상환으로 지급하겠다는 항변으로 채권자에게 대 항할 수 있다.",true,"원인채권과 어음채권 병존할 경우. 채권자가 원인채권 행사하면 채무자는 원칙적으로 어음 상환 항변 0 一 그러나 이러한 거절은 이중지급 위험 면할 목적. 원인채권 이행청구권과 어음반환청구권 사이 536조 쌍무계약상 채권채무관계나 유사한 대가관계는 X 一 어음상 권리 시효소멸로 이중지급 위험 없고 채무자가 다른 어음상 채무자에 대해 권리 행사할 수 도 없는 경우. 채권자의 원인채권 행사에 채무자 어음상환 동이항 X [2009다69692].","동시이행의항변권"],[22,"부동산매매계약에서 매수인의 소유권이전등기청구권을 보전하기 위하여 매수인 명의로 가등기가 마쳐진 경우, 계약이 해제되면 매수인의 가등기말소의무와 매도인의 매매대금반환의무는동시이행의 관계에 있다.",true,"분양계약해제된 경우 계약이행 일환으로 마쳐진 매수인 명의 가등기말소의무와 매도인의 계약금반환의무는 원상회복의무로서 동시이행관계 O [89 다카 19412].","동시이행의항변권"],[23,"상환이행판결에 의하여 강제집행을 하는 경우, 원고가 해야 하는 반대급부의 이행제공은 원칙적으로 집행문 부여의 요건이다.",false,"동시이행판결의 반대의무 이행 • 이행제공은 집행개시 요건으로서 채권자의 증명방법에 제한 없음 一 법원은 반대의무 내용을 명확하게 특정해야 [2020다290804].","동시이행의항변권"],[24,"채권자의 영수증교부의무는 채무자의 변제와동시이행관계에 있다. 제474조(영수증청구권) 변제자는 변제를 받는 자에게 영수증을 청구할 수 있다.",true,"채무자 • 제3자가 전부를 변제한 때 채무자 • 제3자는 채권자에게 채권증서 반환청구 0 (475조) 一 채권증서 반환은 영수증 교부의무와 달리 변제와 동시이행관계 X [2003다22042].","동시이행의항변권"],[25,"도급인 甲, 수급인 乙, 하수급인 丙 사이에 甲에 대한 乙의 공사대금채권을 丙에게 양도하기로 합의하여 공사대금채권이 丙에게 귀속된 이후에 乙에 대하여 도 급계약상의 지체상금채권이 甲에게 발생한 경우, 공사대금채권과 지체상금채권 사이.",false,"지체상금채권과 공사대금채권은 특별한 사정 없는 한 동시이행 X [2013다81224] 一 따라서 甲이 채권양도 통지를 받은 후에 乙에 대한 지체상금채권이 생긴 경우에는. 丙의 甲에 대한 양수금청구(혹은 하도급법상 직접지급청구)에 대하여 甲이 지체상금채권을 가지고 상계 불허(동이항 관계에 따른 예외 주장 X ).","동시이행의항변권"],[26,"동시이행관계에 있는 쌍방 채무 중 어느 한 채무가 이행불능이 됨으로 인하여 발생한 손해배상채무도 여전히 다른 채무와 동시이행의 관계에 있다.",true,"[ 97다30066].","동시이행의항변권"],[27,"매수인이 선이행의무인 중도금지급채무를 이행하지 않은 상태에서 잔대금 지급 기일이 도래한 경우, 다른 특별한 사정이 없는 한, 매수인의 중도금 지급과 매도인의 소유권이전등기서류의 제공은동시이행관계에 있다.",true,"매수인이 선이행의무인 중도금을 이행하지 않았더라도 계약해제되지 않은 상태에서 잔금 과 동시이행관계인 매도인의 등기서류 제공 없이 잔금기일 도과되면 매수인의 중도금 및 잔금 지급과 매도인의 소유권이전등기 서류 제공은 동시이행관계 0 一 그때부터는 매수인은 중도금에 이행지체 책임 X [91다6368].","동시이행의항변권"],[28,"도급인이 수급인의 하수급인에 대한 공사대금채무를 인수한 경우, 도급인은 하수급인의 공사대금청구에 대하여 수급인의 하수급인에 대한 하자보수청구권으로 동시이행의 항변을 할 수 있다.",true,"[2007다31914].","동시이행의항변권"],[29,"매매계약에 따른 소유권이전의무와 잔금지급의무가 동시이행의 관계에 있다면 어느 일방의 채무에 관한 이행의 제공이 있기 이전에는 소멸시효가 진행하지 않는 다.",false,"매매에 동시이행항변권 있더라도 이행기 되면 소멸시효 진행 0 (90다9797).","동시이행의항변권"],[30,"제537조(채무자위험부담주의) 쌍무계약의 당사자 일방의 채무가 당사자 쌍방의 책임 없는 사 유로 이행할 수 없게 된 때에는 채무자는 상대방의 이행을 청구하지 못한다 제538조(채권XR 책사유로 인한 이행불능) ® 쌍무계약의 당사자 일방의 채무가 채권자의 책임있는 사유로 이행할 수 없게 된 때에는 채 무자는 상대방의 이행을 청구할 수 있다. 채권자의 수령지체 중에 당사자 쌍방의 책임 없는 사유로 이행할 수 없게 된 때에도 같다 @ 전항의 경우에 채무자는 자기의 채무를 면함으로써 이익을 얻은 때에는 이룰 채권자에게 상환하여야한다.",true,"기계의 채권자가 수령지체 하다가 쌍방 귀책 없이 멸실된 것인지 문제되므로 538조의 문 제 一 다만 영구적 불수령 상태를 두고 ‘수령지체 중’이라고 볼 수 있는지 혹은 최소한 구 두제공 필요한지 문제됨 一 채권자지체(400조) 성립 위하여 변제제공(460조) 있어야 하는 데 채권자의 수령거절 의사가 확고한 이른바 ‘영구적 불수령의 경우 구두 제공조차 필요 없으나 이는 그로써 채무불이행을 면한다는 것에 불과하고(461조). 538조 1항 2문 ‘수령지 체 중 쌍방 책임 없는 불능을 이유로 채무자가 반대급부를 청구하기 위해서는 현실제공이 나 구두제공이 있었어야 [2001다79013) 一 구두제공조차 없었다면 ‘수 령지체 중’으로 볼 수 없고 결국 537조가 적용됨.","동시이행의항변권"],[31,"위험부담에 관한 민법 제537조와 제538조는 임의규정이므로 당사자의 특약으로 달 리 정할 수 있다.",true,"민법 규정 중 강행규정과 제103조 공서양속 규정과 같이 사회성이 강한 일부 규정을 제외 하고는, 나머지 모든 규정은 임의규정으로서 특약으로 배제할 수 있음.","동시이행의항변권"],[32,"종류물매매라고 하더라도 특정된 이후에는 급부의 위험은 채권자인 매수인이 부담한다.",true,"종류물은 특정 전에는 채무자가 물건(급부)의 위험을 부담하고(조달의무)， 특정 후에는 채 권자가 부담함(불능이 되면 채권 • 채무 소멸).","동시이행의항변권"],[33,"동산 소유권유보부매매에 있어서 인도에 의하여 위험이 이전된다는 입장에 따르면, 매수인이 인도받은 후 대금 완납 전에 쌍방의 귀책사유 없이 목적물이 멸실된 경우 매수인은 매도인에게 다른 동산의 인도를 청구할 수 없으므로 매매 잔대금 또한 지 급할 필요가 없다.",false,"위 견해에 따르면 인도로 매수인에게 소유권이 이전되지는 않지만 물건의 위험은 이전되 어 멸실되면 매수인은 다른 동산의 인도를 구할 수 없고, 그러나 이와 별개로 매수인은 매 매진금은지급해야함.","동시이행의항변권"],[34,"매매계약에서 매수인의 이행거절의 의사가 확고하면 매도인의 구두의 제공 없이 도 매수인의 채권자지체는 성립할 수 있고, 이 경우 매도인의 귀책사유 없이 소유권이전등기의무를 이행할 수 없게 되더라도 매수인은 대금지급의무를 부담한다.",false,"채권자지체(400조) 성립 위하여 변제제공(460조) 있어야 하는데 채권자의 수렁거절 의사가 확고한 이른바 ‘영구적 불수령의 경우 구두 제공조차 필요 없으나 이는 그로써 채무불.","동시이행의항변권"],[35,"甲이 乙에 대한 급부에 갈음하여 乙의 지시에 따라 乙의 채권자인 丙에게 급부를 한 경우. 甲과 乙 사이의 법률관계가 무효이더라도 甲은 丙에 대하여 부당이득반환 청구를할수 없다.",true,"丙에 대한 반환청구를 긍정하면 자기 책임으로 체결된 계약 위험을 제3자에게 전가하여 계약법 원리 위반 제3자가 상대방에 대해 가지는 항변권 침해 一 이 경우 丙이 급부 수 렁 당시 甲 • 乙 사이 원인관계에 무효 등 홈이 있음을 알고 있었다고 하더라도 마찬가지 [2006다46278].","동시이행의항변권"],[36,"연 * L. 제 3사를 위한 계약의 체결 원인이 된 요약자와 제3자 사이의 법률관계의 효력은 요약자와 낙약자 사이의 법률관계의 성립이나 효력에 영향을 미친다.",false,"제3자를 위한 계약의 체결 원인인 요약자와 수악자 사이의 법률관계(이른바 ‘대가관계’)의 효력은 제3자를 위한 계약 자체는 물론 그에 기한 요약자와 낙약자 사이의 법률관계(이른 바 ‘기본관계’)의 성립이나 효력에 영향 미치지 X, 一 대가관계에 관한 항변을 가지고, ‘낙약자가 수익자에게' 혹은 ‘요약자가 낙약자에게’ 대항 X [2003다49771 ].","동시이행의항변권"],[37,"요약자의 채무불이행으로 인하여 낙약자가 계약을 해제한 경우에는 낙약자는 제3자에 대하여 계약의 해제로 인한 원상회복을 청구할 수 있다.",false,"제3자를 위한 계약에서 낙약자와 요약자 사이 법률관계(기본관계遷} 이루는 계약이 무효이 거나 해제된 경우 낙약자가 이미 제3자에게 급부한 것에 관하여서는 요약자를 상대로 원 상회복청구나 부당이득반환청구를 해야 0 ·: 계약관계의 청산은 계약당사자인 낙약자와 요약자 사이에 이루어져야, 계약상으I 위험을 제3자에게 전가시키면 X [2005다7566] 이 유 중 : 제3자를 위한 계약에서의 제3자는 548조 1항 단서 제3자에 해당 X, 그렇다고 계 약해제로 인한 원상회복의무 부담 X. 낙약자가 미지급급부에 대해 지급 거절할 수 있으나 (542조)， 이는 이미 지급한 급부의 원상회복고는: 다른 문제.","동시이행의항변권"],[38,"甲이 약정기 일 내에 체육관이 완성되지 아니 하여 도급 계약을 해제 하는 경우, 丙의 동의를 받을 필요가 없다.",true,"제3자를 위한 계 약에서 낙약자의 귀책사유로 인한 이행불능 • 이행지체가 있을 때 요약자는 제3자의 동의 없이 계약당사자로서 계약을 해제 O [69 다 1410].","해제"],[39,"제3자를 위한 계약에서 수익자가 낙약자에 대해 금전채권인 수익권을 취 득한 뒤, 낙약자와 요약자 사이의 기본계약이 해제된 경우 수익자는 「 민법 」 제548조 제1항 단서의 제3자이 므로 낙약자에 대하여 수 익권을 행사할 수 있다.",false,"이 유 중 : 제3자를 위한 계약에서의 제3자는 548조 1항 단서 제3자에 해 당 X, 그 렇 다고 계약해제로 인 한 원상회복의무 부담 X 낙약자가 미지급급부에 대해 지급 거 절할 수 있으나( 542조)， 이는 이미 지급한 급부의 원상회 복고는 다른 문제 [2005다7566].","제3자를위한계약"],[40,"낙약자가 요약자에게 동산을 납품하는 계약을 체결하면서 제3자를 수익자로 지정하 였고, 그에 따라 수익자가 위 동산을 인도받았는데(수익자와 요약자 간 대가관계에 서는 요약자가 수익자에게 위 동산을 공급하는 계약을 체결하였다) 낙약자와 요약자 사이의 계약이 요약자의 채무불이행을 이유로 해제된 경우 수익자는 「 민법」 제548조 제1항 단서의 제3자이므로 여전히 위 동산 소유권을 보유한다.",true,"제3자를 위 한 계 약에서 낙약자 · 요약자 사이 법률관계(기본관계 )에 기초하여 수익자가 요약자와 원인관계( 대가관계) 맺음으로써 해제 전에 새로운 이해관계 갖고 그에 따라 등기 • 인도 등 완전 한 권리 취득했다면 수익자는 548조 1항 단서의 제3자 O [2018다244976] 一 제3자를 위 한 계약의 ‘수익자’는 원칙 적으로 해제에서 보호되는 ‘제3자’ 아니지만 기본 관계 (함포납품계약)를 ‘기초로’ 대가관계 (현물변상계약) 맺고 함포 인도받아(간접점유) 소유 권 취득한 수익자는 함포납품계약해제에 보호되는 548조 1항 단서 제3자 0 一 지문에서 수익자가 인도를 갖춘 것은 드러나 있으나. 가장 핵심인 ‘ 대가관계가 기본관 계에 기초하여 ’ 성립 했 다는 부분이 없어 다소 아쉬운 지문임(私見).","제3자를위한계약"],[41,"甲이 乙에게 부동산을 매도하여 乙에 게 소유권이전등기가 된 후 乙의 채권자 A가 위 부동산에 가압류등기를 한 경우, 그 가압류등기 전에 甲이 乙에 대한 위 부동산 소유권이전등기 말소청구권 보전을 위해 처분금지가처 분을 경료하였고, 乙을 상대로 매매계약해제를 주장하며 소유권이전등기 말소소송을 제기하여 승소확정판결을 받았다면, A의 가압류등기는 선행가처분등기에 반히는· 동기로서 말소 될 수밖에 없으므로 A는 위 해 제에 서의 보호받는 제3자가 아니 다.",true,"부동산 가압류를 한 가압류채권자도 548조 1항 단서 제3자 0 一 그러나 가압류에 앞서 전 소유자( 매도인)가 말소청구권 보전을 위 한 처분금지가처분등기를 마친 E悟} 매매 해제로 인 한 말소청구가 승소 확정되었다면(상환이행판결 포함), 위 가압류채권자는 548조 1항 단서 제3자 X ·: 가압류 말소될 운영 [2003다33004].","해제"],[42,"채무불이행 대 상이 된 채무가 해제권 행사 시 점에 소멸시효가 완성된 경우에도, 소멸시효완성 전에 이미 법정해제권이 발생하였다면 그 법정 해 제권을 행사할 수 있다.",false,"채무불이행 해제 의사표시 당시 이미 채무불이행 대상 원채권이 시효소멸 했 다면 소멸시.","해제"],[43,"甲과 丙 사이의 계약이 취소 되어 丙의 甲에 대한 채권이 소멸 하였 더라도, 乙 이이러한 사정을 들어 수익의 의사표시를 한 丙에게 1천만원의 지 급을 거 절할 수 없다.",true,"제3자를 위한 계약의 체결 원인인 요약자와 수익자 사이의 법률관계(이른바 ‘대가관계’)의 효력은 제3자를 위한 계약 자체는 물론 그에 가한 요약자와 낙약자 사이의 법률관계(이른 바 ‘ 기본관계 ’)의 성립아나 효력에 영향 미치지 X. 一 대가관계에 관한 항변을 가지고. ‘낙약자가 수익자에게 ' 혹은 '요약자가 낙약자에게 ’ 대항 X [2003다49771 ].","제3자를위한계약"],[44,"제3자를 위 한 계약 당시 수익자는 현존하지 않아도 되 므로 성립 중의 법인을 위한 계약도 유효하다.",true,"재단법인의 설립준비 중 제3자가 그 설립자에 대 하여 장차 설립될 동 법인에 설립을 조건으로 무상 재산출연을 약정하거나 동 법인을 수익자로 제3자를 위한 재산출연에 관한 계 약을 했을 경우, 동 법인은 전자는 설립과 동시에, 후자는 설립 후 수익의 의사표시에 의해 동 재산상 권리 취득 O [4292 민상773].","제3자를위한계약"],[45,"수익자는 제3자를 위한 계약의 당사자가 아니 므로 낙약자에 대하여 채무불이행을 원인으로 한 손해배상을 직접 청구할 수는 없다.",false,"수익의 의사표시를 한 수익자는 요약자가 계약을 해제한 경우에 낙약자에게 하자로 인한 손해 배 상청구 O [92다41559].","제3자를위한계약"],[46,"제3자를 위 한 유상 • 쌍무계약의 경우, 요약자는 낙약자의 귀책사유로 인한 이행불능이 있을 때 채무불이행을 이유로 제3자의 동의 없이 계 약을 해제 할 수 있다.",true,"제3자를 위한 계약에서 낙약자의 귀책사유로 인한 이행불능 • 이행지체가 있을 때 요약자는 제3자의 동의 없이 계약당사자로서 계약을 해제 O [69 다 1410].","제3자를위한계약"],[47,"甲과 乙의 매매계약이 해제된다면 丙은 선의 여부를 불문하고 더 이상 乙에게 1억 원의 지급을 청구할 수 없다.",true,"수익자는 매매계약에 관하여 ‘ 새로운' 법률상 이해관계를 맺은 자가 아니므로 의사표시나 해제 규정에서 보호되는 ‘제3자’가 아님.","해제"],[48,"대가관계의 흠결은 계약의 효력에 영향을 미치지 않는다.",true,"제3자를 위한 계약의 체결 원인인 요약자와 수익자 사이의 법률관계(이른바 ‘ 대가관계 ’)의 효력은 제3자를 위한 계약 자체는 물론 그에 기한 요약자와 낙약자 사아의 법률관계(이른 바 ‘기본관계 ’)의 성립이나 효력에 영향 미치지 X 一 대가관계에 관한 항변을 가지고, 낙약자가 수익자에게’ 혹은 '요약자가 낙약자에게’ 대항 X [2003다49771 ].","제3자를위한계약"],[49,"이 2023. 5. 1. 까지 甲에게 중도금을 지 급하지 못하였다 면 특별한 사정이 없는 한 별 도의 최고나 해제의 의사표시 없이 도 위 계 약은 해제되 고, 乙은 지급한 계약 금의 반환을 청구할 수 없다.",true,"중도금을 기일에 지급 못하면 자동해제된다는 약정은 그대로 O [88 다카132].","해제"],[50,"위 계 약이 제 스스조 제1항에 따 라 해 제되 었 다고 하더라도 甲과 乙이 계약이 여 전히 유효함을 전 제로 논의를 계 속하면서 甲이 해 제에 따른 법률효과를; 주장하지 아니 한 채 계약 내 용에 따른이 행을 촉구하였다 면 특별한 사정이 없는 한 甲과 乙 사이에서는 해제된 계 약을 부활시 키 기로 히는· 합의가 있었 다고 봄이 상당하다.",true,"자동해제 약정하고 일방 채무불이행 하면 별도 최고나 해제 의사표시 없이 불이행 자체로 써 자동해제 0 一 그러나 당사자들이 계약 여전히 유효 전제로 논의 계속. 해제 법률효과 주장 않은 채 계약 내용 이행 촉구. 온전한 이행 못 받은 상대방이 이의 없이 급부 중 일부 수령 一 특별한 사정 없는 한 계약당사자들 사이 자동해제약정 효력 상실시키고 자동해제 된 계약 부활시키는 합의 O [2019다216817].","해제"],[51,"이 위 제스스조 제2항에 따라 위 계 약을 해제하고 甲에 게 지급한 금전의 반환 및 그이 자의 지급을 청구하였는 데 甲이 그 이행을 지체한 경우, 특별한 사정이 없는 한 그에 따른 지 연손해금은 연 10%의 비율로 계산하여야 한다.",true,"부당이득반환성질을 가지고 이행지체책임이 아니므로 쌍방 동시이행관계 상관없이 연 5% 법정이자 가산하여야, 이는 ‘약정해제권 ’ 행사의 경우도 마찬가지 [2000다9123] 一 원 상회복 금전 이율 약정 있다면 약정이율 적용 一 원상회복의무는 기한의 정함이 없는 채무 로서 이행청구 받은 E臣놉날부터 지연손해금 별도 발생 一 원상회복의무 약정이율을 원상회복의무의 지연손해금에 적용 0, 다만 법정이율보다 낮다면 적용 못하고 법정이율 적용.","해제"],[52,"만일 甲과 乙이 위 계약서 조항과는 무관하게 계약을 해제하기로 합의 하 면서 그 합의해제로 인하여 반환할 금전에 가산할이 자에 관하여는 별도로 약정한 바가 없다면, 乙이 지급한 금전에 대 하여는 그 지급일로부터 연 10%의이 율을 적용하여 반 환하여야 한다.",false,"합의해제에서는 반환할 금전에 받은 날부터 이자가산 X [95 다 16011 ] 一 548조 2항 X.","해제"],[53,"채권자가 채무불이행을이 유로 계 약을 해제하는 경우 특별한 사정이 없는 한 해제 된 계약의 내용에 포함된 손해배상액의 예 정도 소급적으로 소멸한다.",false,"채권자가 채무불이행 이유로 계약해제 • 해지해도 원칙적으로 손해배상액 예정은 실효도1 지 X 특별한 사정 없는 한 전보배상도 손해배상 예정에 따라 배상액 결정해야 ': 398조 1 • 3항. 551조 문언 • 내용. 계약당사자 일반적 의사 一 다만 계약 유지를 전제로 정한 약정 이라는 등 특별한 사정이 있다면 해제 • 해지로 실효 [2019다292736].","해제"],[54,"원래의 계약에 있는 위약금에 관한 약정은 그것이 계약 내용이나 당사자의 의사표 시 등에 비 추 어 합의해 제에도 적용된다고 볼 만한 특별한 사정이 없는 한 합의해제의 경우에까지 적용되지는 않는다. 己 계약이 합의에 따라 해제된 경우에는 상대방에게 손해배상을 하기로 특약하거나 손해배상청 구를 유보하는 의사표시를 하는 등 다른 사정이 없는 한 채무불이행으로 인한 손해배상을 청구할 수 없다.",true,"己 지문 : 계약이 합의해제, 합의해지된 경우 채무불이행 손해배상 X 一 손해 배 상하 기로 특약했거나 의사표시 유보했다면 이를 주장하는 자가 증명하여 손해배상청구 0 一 특약 등의 여부는 합의해제 • 해지 당시 기준으로 판단해야. 원래의 계약에 있는 위약금 • 손해배상약정은 특별한 사정 없는 한 합의해제 • 해지에 적용 X [2020다285048, 2017다220416].","해제"],[55,"위 매매계약에서 다른 약정 없이 ‘乙이 잔대금을 지급하지 아니한 상태로 지급 기일을 경과하면 매매계약 자체가 자동적으로 해제된다’는 취지의 약정이 있는 경 우에는 甲이 자신의 채무에 대한 이행제 공을 통하여 乙을 이행지체에 빠뜨리지 않 더라도 잔대금 지급기일의 경 과만으로 위 매매계약은 자동 해제된 것으로 볼 수 있다.",false,"잔금을 기일에 지급하지 못하면 자동해제된다는 약정이 있더라도. 매도인이 잔금지급기일에 소유권이전등기 필요 서류 이행제공을 하여 매수인을 이행지체에 빠지게 하였을 때 비로소 자동해제 O [88 다카28891 ].","해제"],[56,"매매계약체결 시 甲과 乙이 매매대 금의 지급 방법 및 매매 토지에 관한 기 존의 임대차관계 승계 등에 관해 특약을 하였는데. 甲의 계 속된 특약사항의 이행 촉구가 있었음에도 乙이 특약의 존재를 부정하면서이를 이행하지 않을 의사를 분명히 표시 하였다면, 甲은 자기 채 무의 이행 제 공이 없더라도 그 매매계약을 해제 할 수 있다.",true,"매매계약체결하면서 매매대금 지급방법 및 매매 토지에 관한 기존 임대차관계 승계 등에.","해제"],[57,"매매계약체결 당시 X 토지가 丙 소유이고 甲이 丙에 대하여 가지는 소유권이전등 기청구권이 가압류되어 있거나 처분금지가처분이 되어 있는데 甲이 그 가압류 또는 가처분 집행을 모두 해제할 수 없는 무자력의 상태에 있다고 인정되는 경우, 乙은 甲의 소유권이전등기의무가 이행불능임을 이유로 매매계약을 해제할 수 있다.",true,"매매목적물에 가등기 가압류 • 가처분만으로는 이행불능 X 一 그러나 매도인이 변제자력 없거나 강제집행으로 소유권 잃은 경우는 이행불능 O [91다8104, 99 다 11045, 2000다47361 ].","해제"],[58,"매매계약에 있어서 매수인이 중도금을 약정한 일자에 지급하지 아니하면 그 계 약을 무효로 한다고 하는 특약이 있는 경우, 매수인이 약정한 대로 중도금을 지급 하지 아니하면 매도인의 해제의 의사표시를 요하지 않고 계약은 위 약정 일자에 자 동적으로해제된다.",true,"중도금을 기일에 지급 못하면 자동해제된다는 약정은 그대로 O [88 다카 132].","해제"],[59,"甲이 乙에게 X 부동산을 인도하고 소유권이전등기를 마쳐 주었지만 乙이 甲에게 잔금을 지급하지 못하던 중, 甲과 乙은 합의하여 계약을 해제하였다. 합의해제 후 乙이 丙에게 X 부동산을 매도하고 소유권이전등기까지 마쳐 주었다면, 丙은 합의해제 사실을 알았더라도 「민법」 제548조 제1항 단서의 제3자에 해당한다.",false,"합의해제 후’에 원상회복등기 이뤄지기 ‘전 양립되지 않은 법률관계를 가진 ‘선의’ 제3자 보호 0, 제3자의 악의는 계약해제 주장자가 입증책임 [2005다6341 ).","해제"],[60,"의 채권자丁이 乙의 甲에 대한 X 부동산의 소유권이전등기청구권을가압류한이 후에도 甲은 乙의 채무불이행을 이유로 매매계약을 해제 할 수 있지만, 계약이 해 제되기 전에 丁이 가압류에 이어 위 소유권이전등기청구권을 압류한 경우에 는 압류 채권자로서 「민법」 제548조 제1항 단서의 제3자에 해당한다.",false,"계약상 채권’을 양수한 자나 가압류 • 압류한 자 X [99다51685).","해제"],[61,"회복을 청구하였다 만약 乙이 해제의 의사표시를 할 당시 이미 乙의 甲에 대한 소 유권이전등기청구권의 소멸시효가 완성된 상태라면 위 이행불능 시점이 소유권이전등기청구권의 시효완성 전이라고 하더라도 乙의 해제권과 원상회복청구권은 원 칙적으로 인정될 수 없다.",true,"채무불이행 해제 의사표시 당시 이미 채무불이행 대상 원채권이 시효소멸 했다면 소열시효 주장이 신의칙에 반하여 불허되는 등 특별한 사정 없는 한, 채무불이행 시점이 원채권의 시효완성 전인지 후인지 불문, 채권자는 채무불이행 이유로 해제권 •원상회복청구권 X ·: 법정해제권은 채무불이행의 구제수단이어서 본래 채무 이행불능 이유로 계약해제하려 면 그 이행불능 대상인 본래 채무는 유효하게 존속해야, 167조 소멸시효의 소급효 [2019다204593].","해제"],[62,"이 매매대 금을 지급한 후 甲의 귀책사유로 소유권이전등기의무가 이행불능되었 고, 乙이 1 주일 후 甲의 채무불이행을 이유로 계약을 해제한 경우, 그 계약의 해제로 인한 원상회복청구권의 소멸시효는 해제권 발생 시부터 진행한다.",false,"해제로 인한 원상회복청구권의 소멸시효 기산점은 계약해제시 0 (=원상회복청구권 발생 시) 해제권 발생시 X [2009다63267] ·: 원상회복청구권 행사 가능 시점.","해제"],[63,"甲의 매매대금반환의무와 乙의 소유권이전등기말소의무가 동시이 행관계에 있는 지 여부와 관계없이 甲은 이미 지급받은 매매대금에 이자를 더하여 반환해야 한다.",true,"부당이득반환 성질 가지고 이행지체책임이 아니므로 쌍방 동시이행관계 있는지 상관없이 연 5% 법정이자 가산하여야. 이는 ‘약정해제권 ' 행사의 경우도 마찬가지 (2000다9123].","해제"],[64,"매도인으로부터 매매 목적물의 소유권을 이전받은 매수인이 매도인의 계약해제 이전에 제3자에게 목적물을 처분하여 계약해제에 따른 원물반환이 불기능~하계 된 경우, 매수인이 원상회복의무로서 반환하여야 하는 목적물의 가액은 특별한 사정이 없는 한 그 처분 당시의 대가 또는 그 시가 상당액이다.",false,"매도인으로부터 목적물 소유권이전받은 매수인이 매도인의 해제 전 제3자에게 목적물 처 분하여 해제 원물반환 불가능하면 ‘가액배상’ 一 처분 당시 목적물의 (대가 또는) 시가 상당 액과 처분으로 얻은 이익의 이득일부터의 법정이자를 가산한 금액 [2013다14675].","해제"],[65,"해제자가 계약해제의 원인이 된 채무불이행에 관하여 그 원인의 일부를 제 공하였다면 신의칙 또는 공평의 원칙에 기하여 일반적으로 손해배상에 있어서의 과실상계에 준하여 계약의 해제로 인한 원상회복청구권의 내용이 제한될 수 있다.",false,"[2013다34143].","해제"],[66,"외관상 부수적 채무라도 그 불이행으로 인하여 채권자가 계약의 목적을 달성할 수 없는 경우라면 해제가 가능하다.",true,"부수적 채무의 불이행은 계약 목적 달성할 수 없거나 특약이 존재하는 경우를 제외하고는 해제 X ex. 분묘이장. 시사회. 전대차와 근저당권설정.","해제"],[67,"채무불이행을 이유로 계약을 해제하거나 해지하고 손해배상을 청구하는 경우, 이행이익의 배상을 구하는 것이 원칙 이다. 그러나 채권자는 그 대신에 계약이 이행 되리라고 믿고 지출한 비용의 배 상을 채무불이행으로 인한 손해라고 볼 수 있는 한 도에서 청구할 수도 있다.",true,"채무불이행 이유로 계약해제와 아울러 손해배상 청구할 경우 계약이행으로 인하여 채권자가 얻을 이익(＝이행이익)의 배상 구함이 원착 그러나 그에 갈음하여 그 계약이 이행되 리라 믿고 채권자가 지출한 비용(＝신뢰이익)의 배상 구할 수도 0 一 신뢰이익 중 통상의 지출 비용은 통상손해 초과하여 지출된 비용은 특별손해로 상대방이 알았거나 알 수 있었을 경우만 배상, 신뢰이익은 이행이익 범위 초과 X [2002다2539].","해제"],[68,"아파트 수분양자가 분양자로부터 열쇠를 교부받아 임차인을 입주케 하고 임차인이 주택임대차보호법상 대항력을 갖춘 후, 수분양자가 분양계약상 아파트 입주를 위하여 요구되는 의무를 다하지 못해 분양계 약이 해제되어 수분양자가 주택의 소유권을 취득하지 못하였다고 하더라도, 임차인은 아파트 소유자인 분양자에 대하여 임차권 으로대항할 수 있다.",true,"주택의 소유자가 아니더라도 적법한 임대권한 있으면 「주택임대차보호법」상의 임대차 0 一 주택 인도 받은 미등기 매수인은 사용 · 수익할 수 있는 지위에서 적법하게 임대할 수 0 一 이러한 매수인으로부터 해제 전에 주택 임차하고 인도 • 주민등록 마쳐 「주택임대차보호법」 3조 1항 대항요건 갖존 임차인은 548조 1항 단서 제3자 0 一 매매계약해제되어도 매도인에 대하여 임차권으로 대항 O [2007다38908] 一 지문은 본 판례의 사실관계임.","해제"],[69,"부동산매매계약에 따른 채무이행으로 이미 소유권이전등기가 경료된 후 그 매매 계약이 합의해제되었다면, 합의해제에 따른 매도인의 원상회복청구권인 소유권이전등기 말소청구권은 소멸시효의 대상이다.",false,"부동산 매매계약의 합의해제로 소유권은 당연히 매도인에게 복귀, 매도인의 원상회복청구권은 소유권에 기한 물권적 청구권으로서 소멸시효 X [80다2968].","해제"],[70,"합의해지의 효력은 그 합의의 내 용에 의하여 결정되고 민법 제548조 제2항의 규 정은 적용되지 아니하므로, 당사자 사이에 약정이 없는 이상 합의해지로 인하여 반 환할 금전에 그 받은 날로부터의 이지를 가산하여야 할 의무가 있는 것은 아니다.",true,"합의해제는 법정해제와 달리 548조 2항 X 반환할 금전에 받은 날부터 이자 가산 X [95 다 16011 ] 一 지문처럽 합의 ‘해지’라고 하여 달리 볼 것이 아님.","해제"],[71,"당사자 일방에 의한 계약해제 시 반환할 금전에 가산할 이자에 관하여 계약당사자 사이에 약정이 있는 경우 특별한 사정이 없는 한 이행지체로 인한 지연 손해 금도 그 약정이율에 의하기로 하였다고 보는 것이 당사자의 의사에 부합한다.",true,"해제 원상회복의무로 반환할 금전에 가산하는 이자는 부당이득반환 성질 0, 이행지체책임 아니므로 쌍방 동시이행관계 상관없이 연 5% 법정이자 가산하여야 一 가산하는 이자에 대한 약정이율 있다면 약정이율 적용 一 원상회복의무 이행지체 이후 지연손해금에 대 해서도 약정이율 적용 0, 법정이율보다 낮은 경우는 법정이율 적용 0, 지연손해금률에 대해 별도 약정 있다면 법정이율보다 낮더라도 적용 O [2011다50509].","해제"],[72,"해제계약이 행해진 경우 해제된 계약의 목적물에 관하여 그 전에 물권 이나 대항력 있는 권리를 취득한 제3자는 해제의 소급효로부 터 보호된다.",true,"계약의 합의해제에 있어서도 548조 1항 단서 제3자의 권리 해할 수 없으나 완전한 권리 취득해야 [79다932].","해제"],[73,"채무불이행을 이유로 채권자가 계약해제권을 행사하는 경우 그는 이와 더불어 이행이익의 배상은 청구할 수 있지만, 신뢰이익의 배상을 청구할 수는 없다.",false,"채무불이행 이유로 계약해제와 아울러 손해배상 청구할 경우 계약이행으로 인하여 채권자가 얻을 이익(＝이행이익)의 배상 구함이 원칙, 그러나 그에 갈음하여 그 계약이 이행되 리라 믿고 채권자가 지출한 비용(＝신뢰이익)의 배상 구할 수도 0 一 신로1 이익 중 통상의 지출 비용은 통상손해. 초과하여 지출된 비용은 특별손해로 상대방이 알았거나 알 수 있었을 경우만 배상. 신뢰이익은 이행이익 범위 초과 X [2002다2539 〕.","해제"],[74,"CD * 합의해제가 행해진 경우에도 그로 인한 원상회복 등기가 행해지기 전에 해당 물 건에 관하여 대항력 있는 권리를 취득한 선의의 제3자는 해제의 소급효로부터 보호 된다.",true,"합의해제 후’에 원상회복등기 이뤄지기 ‘전’ 양립되지 않은 법률관계를 가진 선의’의 제3자보호 0, 제3자의 악의는 계약해제 주장자가 입증책임 [2005다6341].","해제"],[75,"부동산매수인의 채권자가 매수인 명의로 소유권이전등기가 된 부동산을 가압류 한 후 부동산매매계약이 해제된 경우, 그 가압류채권자는 민법 제548조 제1항 단서의 제3자에 해당한다.",true,"부동산 가압류를 한 가압류채권자도 548조 1항 단서 제3자 O [99다40937].","해제"],[76,"X토지가 토지거래허가구역으로 지정된 구역안의 토지인 경우, 위 매매계약이 체 결된 후 계약금만 수수한 상태에서 당사자가 토지거래허가신청을 하여 관할관청 으로부터 그 허가를 받았더라도 甲은 계약금의 배액을 상환하여 매매계약을 해제할 수있다.",true,"[2008다62427].","해제"],[77,"甲이 소유권이전등기를 해주지 않은 상태에서 乙에게 X토지의 사용을 승낙하여 乙이 그 지상에 Y 건물을 신축한 후 이를 丙에게 매도하고 그 후 甲이 乙로부터 매매대금을 지급받지 못하여 X토지에 대한 매매계약을 해제한 경우, 丙은 위 계약해제 로부터 보호받을 수 있는 제3자에 해당하지 않는다.",true,"[ 90 다카 16761 ] 一 다만 甲이 토지 사용을 승낙한이 상 丙은 신의칙에 의해 보호될 여지는 O IO 서T.","해제"],[78,"계약이 합의해제된 경우, 별도의 약정이 없는 한 합의해제로 인하여 반환해야 할 금전에 법정이자를 가산해야 하는 것은 아니다.",true,"합의해제에 서는 합의 내용 의해 결정되고 여기에는 해제에 관한 548조 2항 적용 X 약정이 없는 이상 반환할 금전에 이자 가산 X [95 다 16011 ].","해제"],[79,"매매계약이 합의해제 되었더라도 특별한 사정이 없는 한 甲 또는 乙은 상대방에 대하여 채무불이행을 원인으로 한 손해배상을 청구할 수 있다.",false,"합의해제 시에 는 채무불이행으로 인한 손해배상 청구 X [ 86 다카 1147] 一 551조 X.","해제"],[80,"자녀가 없는 고령의 A가 조카 B 에게 자신을 부양해 줄 것을 대가로 토지를 증여 하고 소유권이전등기를 해주었는데, B가 위 부양의무를 불 이행한 경우, A는 B의 채무불이행을 이유로 증여 계약을 해제하고 B 에게 준 토지를 다시 반환받을 수 있다.",true,"556조 1항 2호의 ‘부양의무’는 제974조 직계혈족 •그 배우자 • 생계 같이 하는 친족 간의 부 양의무 가리킴 一 친족 아닌 당사자 사이 약정 부양의무는 X 一 556조 2항 제척기간 적용 X, 558조 이행완료 무영향 적용 X 一 원상회복 O [95다43358].","해제"],[81,"부담부증여에서 증여자의 증여 이행이 완료되지 않은 경우, 수증자가 부담의 이행을 완료하였더라도, 각 당사자는 원칙적으로 서면에 의하지 않은 증여임을 이유로 증 여계약을 임의로 해제할 수 있다.",false,"561 조는 부담부증여에 본절 규정 외에 쌍무계약 규정 적용 一 부담부증여도 비서면이라 면 각 당사자 555조 해제 0 一 그러나 증여자가 증여 마이행아더라도 수증자가 부담 이행 완료했다면, 실질적으로 부담 없는 증여라는 등 특별한 사정 없는 한, 각 당사자는 비서 면 해제 X ·: 부담부증여는 쌍무계약 준용되고(561조) 부담 한도 담보책임 등 부담 없는 증여와 구별 555조 비서면 해제에 적용되는 558조 ’ 이미 이행한 부분에 이행한 부담도 포함되므로 부담 이행했는데 555조로 해제하연 증 여자가 부담 이행이익만 보유하여 부당 (2021다299976] ® 증여계약 후 아직 계약에 따른 이행이 완료되기 전에 수증자의 증여자에 대한 범죄 행위가 있고, 그 범죄행위가 수증자와 증여자 사이의 신뢰관계를 중대하게 침해하여 수증자에게 증여의 효과를 그대로 유지함이 사회통념상 허용되지 않을 정도라 면, 설령 수증자가 아직 형사처벌을 받지 않았더라도 증여자는 증여계약을 해제할 수있다.","해제"],[82,"561 조는 부담부증여에 본절 규정 외에 쌍무계약 규정 적용 一 부담부증여도 비서면이라 면 각 당사자 555조 해제 0 一 그러나 증여자가 증여 마이행아더라도 수증자가 부담 이행 완료했다면, 실질적으로 부담 없는 증여라는 등 특별한 사정 없는 한, 각 당사자는 비서 면 해제 X ·: 부담부증여는 쌍무계약 준용되고(561조) 부담 한도 담보책임 등 부담 없는 증여와 구별 555조 비서면 해제에 적용되는 558조 ’ 이미 이행한 부분에 이행한 부담도 포함되므로 부담 이행했는데 555조로 해제하연 증 여자가 부담 이행이익만 보유하여 부당 (2021다299976] ® 증여계약 후 아직 계약에 따른 이행이 완료되기 전에 수증자의 증여자에 대한 범죄 행위가 있고, 그 범죄행위가 수증자와 증여자 사이의 신뢰관계를 중대하게 침해하여 수증자에게 증여의 효과를 그대로 유지함이 사회통념상 허용되지 않을 정도라 면, 설령 수증자가 아직 형사처벌을 받지 않았더라도 증여자는 증여계약을 해제할 수있다.",true,"윤리적 요청을 고려한 556조 1항 1 호의 범죄행위’는 수증자가 감사의 마음을 가져야 함에도 증여자가 배은망덕하다고 느낄 정도로 둘 사이 신뢰관계 중 대 하게 침해하여 증여 효과 유지함이 사회통념상 허용되지 않을 정도의 범죄 의미 一 범죄행위의 동기 • 경위, 피해 정 도 침해 법익 유형 친밀도 등 종합적 고려해야 一 범죄행위로 수증자가 반드시 형사처벌.","해제"],[83,"서면에 의한 증여란, 증여의사가 문서를 통하여 확실히 알 수 있는 정도로 서 면에 나타낸 증여를 말하는 것이 므로 그 서면에 증여의사가 표시되었다고 하더라도 서면의 형식이 매매계약서로 작성되어 있다면 민법 제555조에서 말하는· 서면에 해 당하지 않는다.",false,"서면 자체는 매매 계약서 • 매도층서로 되어 있더라도 증여의사표시한 것이면 555조의 ‘서 면’ O [91다6160].","해제"],[84,"약정에 따라 부양의무를 부담하는 증여계약에서 수증자가 부양의무를 이행하지 않은 경우 그 해제권은 해제원인 있음을 안 날로부터 6월이 경과하면 소멸한다.",false,"556조 1항 일로부터 10년 [96다47494].","증여"],[93,"2 E! 23.06모 - 25 甲은 자신이 소유하는 X 토지에 대해서 乙과 매매계약을 체결하면서 乙이 甲에게 계약금으로 1억 원을 지급하기로 합의하였다 ® 乙이 아직 계약금을 지급하지도 않았다면 甲과 乙은 매매계약을 임의로 해제할 수 있다.",false,"계약성립 후 일방이 임의로 해제 X 다만 주된 계약과 더불어 계약금계약을 한 경우 565조 1항 임의 해제 0 一 계약금계약은 금전 기타 유가물 교부 요건으로 一 단지 ‘계약금 지급하기로 약정만 한 단계’에서는 아직 계약금 효력 X, 565조 해제권리 X (2007다73611) ® 乙이 甲에게 계약금지 급의 무를 이행하지 않는 경우, 甲은 계약금의 지급을 최고하고 상당한 기간이 경과하면 계약금계약을 해제 할 수 있다.","증여"],[94,"계약성립 후 일방이 임의로 해제 X 다만 주된 계약과 더불어 계약금계약을 한 경우 565조 1항 임의 해제 0 一 계약금계약은 금전 기타 유가물 교부 요건으로 一 단지 ‘계약금 지급하기로 약정만 한 단계’에서는 아직 계약금 효력 X, 565조 해제권리 X (2007다73611) ® 乙이 甲에게 계약금지 급의 무를 이행하지 않는 경우, 甲은 계약금의 지급을 최고하고 상당한 기간이 경과하면 계약금계약을 해제 할 수 있다.",true,"당사자가 계약금 일부만 지급하고 잔액은 나중에 지급하기로 약정한 경우, 나머지 계약금 잔금을 지급하지 않으면 상대방은 계약금 지급의무 이행청구 0, 채무불이행 이유로 계약 금약정 해제 0 (만일 계약금약정 없었다면 주계약체결하지 않았을 사정 있으면 주계약도 해제 0 ) 一 그러나 계약금 잔금을 지급하지 않는 한 계약금계약성립 X 임의로 주계약해제 X (2007다73611 ).","증여"],[95,"이 甲에게 계약금의 일부만을 지급한 경우에 甲은 실 제 지급받은 계약금의 배 액을 상환하여도 매매계약을 해제할 수는 없다.",true,"[2014다231378].","매매일반효력"],[96,"甲과 乙이 계약금 상당액을 위약금으로 약정하였다면, 계약금이 지급되지 않 아 계약금계약이 성립하지 않았더라도 甲의 채무불이행에 의해서 매매계약이 해제 되는 경우에 甲은 乙에게 1억 원을 지급하여야 한다.",true,"계약금 상당액을 위약금(손해배상액 예정)으로 약정했다면 계약금계약의 불성립으로 인하여 해약금해제가 불가능한 경우라 해도 그와 별개인 손해배상액 예정까지 불성립하는 것은 아니므로, 당사자는 채무불이행을 한 상대방에 대하여 계약금 상당액을 손해배상액 예 정으로요구할 수 있음 위 [2014다231378] 판결에서 대법원은 제 1, 2 심이 ‘ 계약금계약과 손해배상액 예정은 법적 성격이 다르므로 당사자가 손해배상액을 계약금 상당액으로 예정했다면 설령 계약금계약이 불성립했다고 하더라도 손해배상액 예정까지 불성립하는 것은 아니라고 판단'한 것을 옳 다고인정함.","매매일반효력"],[97,"이 계약금 1억 원을 지급한 경우에 특별한 사정이 없다면 이행기 전에이 행에 착수하더라도 甲과 乙은 더 이상 계약금의 배액을 지급하거나 계약금을 포기하고 계약을해제할 수 없다.",true,"이행기 전 착수 금지 특약 없는 이상. 이행기 전 이행에 착수 0 一 이행기 전 이행 착수 있어도 해약금해제 X (2004다11599].","매매일반효력"],[98,"계약금을 수수하면서 ‘교부자가 채무불이행시 수령자는 계약금을 몰수하고 수령자가 채무불이행시 교부자에게 배액 상환’이라는 위약금 약정이 있는 경우, 해 약금 해제 를할 수 없다.",false,"매매당사자 사이 수수된 계약금에 대하여 매수인 위약시 몰취하고, 매도인 위약시 배액상 환하는 악장 있는 경우 그 계약금은 398조 손해배상액의 예정의 성질뿐 아니라 565조 해 약금의 성질도 겸유한 것 [91다2151].","매매일반효력"],[99,"계약금이 교부되고 계약당사자 일방이 이행에 착수한 경우, 계약당사자는 해약금 해제를 하지 못하는 데, 이때 이행의 착수는 단순히이 행의 준 비만으로는 부족하나 반드시 계약 내용에 들어맞는 이행제공의 정도까지이 르 러야 하는 것은 아니다.",true,"이행의 착수’는 객관적으로 외부에서 인식 할 수 있는 정도로 채무의 이행행위의 일부를 하 거나 이행을 위해 필요한 전제행위를 하는 경우 0, 단순히 이행의 준비만으로는 부족, 계약 내용에 들어맞는 이행제공의 정도까지 이를 필요는 X [2007다72274] 一 기존 로민정 서술 ‘이행에 필요한 전제행위’도 포함되는 점으로 판단.","매매일반효력"],[100,"중도금 일부 지급에 갈음하여 매도인에게 제3자에 대한 대여 금채권을 양도하기로 약정하고 그 자리에 제3자가 참석하였다고 하더라도이 행의 착수가 있었다고 볼 수는 없다.",false,"중도금 일부의 지급에 갈음하여 제3자에 대한 채권양도하기로 약정하고 당시 제3자도 참 석하여 통지도 이뤄졌다면 매수인 이행 착수 O [2005다39594].","매매일반효력"],[101,"매매계약이 있은 후에도 인 도하지 않은 목적물로부 터 발생한 과실은 특별한 사 정이 없는 한 매도인에게 속하지만, 목적물을 인 도하기 전에 매수인이 매매대 금오 완납한 경우에는 그이 후의 과실수취권은 매수인에게 귀속된다.",true,"[2004다8210].","매매일반효력"],[102,"매매계약체결 후 시가 상승이 예상되자 매도인이 증액 요청을 하였고 매수인이 이에 확답하지 않은 상태에서 중도금을 이행기 전에 제공한 경우, 매도인은 계약을 해제할 수 없다.",true,"이 행기 전 착수 금지 특약 없는 이상, 이행기 전 이행에 착수 0 一 이행기 전 이행 착수 있어도 해약금해제 X [2004다11599] — 시가 상승 예 상되 자 매도인이 구두로 구체적 금 액 제시 없이 매매대금 증액 요청하자 매수인이 확답하지 않은 채이 행기 전에 중도금 제 공한사안.","매매일반효력"],[103,"甲이 매매 계약의 이행에 착수한 바가 없 더라도 乙이 중도금을 지 급한 후라 면 乙은 해 약금(민 법 제565조) 에의 하여 매매계약을 해제 할 수 없다.",true,"일방은 상대방에만 국한되지 X 一 매수인이 중도금 지급한 이후는 매도인뿐 아니라 매수인도 해약금해제 X [99다62074].","매매일반효력"],[104,"이 X 건물의 소유권이 甲에게 속하지 아니 함을 알지 못한 것이 乙의 과실 에의 한 경우. 법원은 甲이 배 상할 손해 액을 산정할 때이를 참작하여야 한다.",true,"타인 물건 매매에서 매수인이 물건의 소유권이 매도인에게 속하지 않음을 알지 못한 것에 고의에 기인하면 매도인의 배상액 산정에 참작해야 [71다218] 一 위 판결은 23년 모의에도 출제되었고, 하자담보책임이 무고塩!책임이더라도 공평의 원 칙상 하자 발생 •확대에 가공한 매수인의 잘못을 참작해야 한다는 94다23920 판결과도 궈| 를 같이 하므로 일단 익혀둬야 하나, 私見으로는 위 판결이 70 년대 판례로서 이론적 정합 성이 부족하다고 생각됨(다행인 것인지 기 지문은 정답결정력이 없었음)． 측, 매도인의 담 보책임에서 손해는 ‘타인 권리를 이전해주지 못함으로서 발생하는 것인데. 만약 매수인이 ‘ 타인 권리 이전 불능이라는 결과에 기여한 고의이 있다면 참작해야 하겠지만 단순히 매매계약체결 당시 ‘ 타인 권리’라는 점을 알지 못한 것에 고의이 있다고 하여 그러한 이전이 불가능하게 된 것에 기여를 인정하기는 어려울 것이기 때문입 게다가 ‘타인 권리 매메를 기본적으로 유효로 보는 우리 민법의 태도(제569조)에 비추어 더욱 그러함 이는 ‘고의 •과실(주의의무위반)’과 ‘ 악의 고의(알 수 있었음)’의 혼동에서 오는 문제로 보임(물론 때로는 ‘알 수 있었기’ 때문에 ‘주의의무위반’ 이 인정되는 경우가 있으나. 이 경우는 그렇게 보기 어려움).","매매일반효력"],[105,"은 타인 권리의 매매로 인한 담보책임까지 예상하여 손해배상액을 예정한 것이라고 볼 수없다.",true,"매도인 담보책임에서의 손해배상에 대해서도 배상액 예정 O [76 다 1699] 一 매매당사자가 모두 타인 소유인 사실 모르고 계약한 사안.","매매일반효력"],[106,"甲이 X 건물의 소유권을 취득하여 乙에게 이전해야 할 의무가 甲의 귀책사유로 이행불능이 된 경우. 乙은 甲에 대하여 타인 권리의 매매로 인한 담보책임으로 손해배상을 청구할 수 있을 뿐만 아니라 일반적인 채무불이행으로서 계약을 해제하고 손해배상을 청구할 수 있다. 이때 위 담보책임으로 인한 손해배상의 범위는 이행 불능 당시를 기 준으로 한 이행이익 상당이다.",true,"타인 권리 매매에서 매도인의 권리이전의무가 매도인 귀책사유로 불능이되었다면 (악의) 매수인이 매도인 담보책임으로 손해 배 상청구 못해도(570조 단서) 채무불이행 일반 규정 (546조 390조)으로 해제 0, 손해배상 O [93다37328] 타인 권리 매매에서 권리이전할 수 없게 된 때 매도인은 선의의 매수인에게 불능 당시 시 가를 표준으로 그 계약이 완전히 이행된 것과 동일한 경제적 이익을 배상할 의무 있음 [66 다 2618].","매매일반효력"],[107,"근. 甲이 乙에게 X 건물의 소유권을 이전 할 수 없게 된 것이 오직 乙의 귀책사유에 의한 경우에도 甲은 타인 권리의 매매로 인한 담보책임을 부담한다.",false,"타인 권리의 이전불능이 오직 매수인의 귀책사유에 의한 경우는 매도인이 타인권리매매 담보책임 X [79다564].","매매일반효력"],[108,"상법 제69조(매수인의 목적물의 검사와 하X 遷지의무) ® 상인간의 매매에 있어서 매수인이 목적물을 수령한 때에는 지체없이 이를 검사하여야 하며 하자 또는 수량의 부족을 발견한 경 우에는 측시 매도인에게 그 통지를 발송하지 아니하면 이로 인한 계약해제, 대금감액 또는 손해배상을 청구하지 못한다 매매의 목적물에 측시 발견할 수 없는 하자가 있는 경우에 매수인이 6 월내에이를 발견한 때에도 같다.",true,"[상법] [93다7174].","매매일반효력"],[109,"매매 목적물에 하자가 있는 경우, 매수인은 하자담보책임의 제척기간이 지났다고 하 더라도 그러한 하자 있는 물건의 인도가 불완전이행에 해당하면 매도인에 대해 채무불이행에 따른 손해배상책임을 물을 수 있다.",true,"매매 목적물에 하자 있으면 매수인의 하자담보책임과 채무불이행책임은 별개 권원 경합적 인정 0 一 하자보수 비용이 하자담보책임 • 채무불이행책임에서의 ‘손해’ 一 폐기물처리 비용에 대해 매수인은 390조 채무불이행 혹은 580조 1항 하자담보책임으로 손해배상 청구 O [2017다202050].","매매일반효력"],[110,"발견하여 지체없이이를 통지하지 아니하면 매수인은 과실의 유무를 불문하고 매도인에게 하자담보책임을 물을 수 없다.",true,"[상법] [98 다 1584].","매매일반효력"],[111,"경락인이 강제경매절차를 통하여 부동산을 매 수하였으나 강제경매의 집행권원이 된 약속어음공정증서가 위 조 된 것이어서 경매 부동산에 대한 소유권을 취득하지 못하게 된 경우, 경락인은 경매채권자에게 「민법」 제578조 제2항에 의한 담보책임 으물을 수 있다.",false,"578조 경매 담보책임은 매매와 마찬가지로 경매절차는 유효하게 이뤄졌으나 경매 목적 권 리의 하자가 있는 경우 인정되는 것이고. 경매절차 자체가 무효인 경우는 담보책임 인정 여지 X [91다21640] - 강제집행의 집행권원인 약속어음공정증서 위조로무효인 경우.","매매일반효력"],[112,"하자담보에 기한 손해배상청구권은 원칙적으로 10년의 소멸시효에 걸리고 매수인이 매매 목적물을 인도받은 때부터 소멸 시 효가 진행한다.",true,"제척기간 규정 있어도 소멸시효 규정 배제 X, 매매 토지 지하 폐기물 매립된 경우 582조 하자담보책임 언 날 6개월 제척기간 규정 있으나 인도받은 때로부터 10년 지나면 담보책임 손해배상청구권 소멸시효완성(162조 1항) [2011다10266].","매매일반효력"],[113,"토지의 매매에 있어 목적물을 등기부상 평수에 따라 특정한 경우라도 당사자가 그 지정된 구획을 전체로서 평가하였고 평수에 의한 계산이 대상토지를 특정하고 그 대 금을 결정하기 위한 방편에 불과하였다면, 그 매매는 「민법」 제574조에서 규정 하는 ‘수량을 지정한 매메라고 할 수 없다.",true,"574조 ‘수량지정 매메는 당사자가 매매 목적물이 일정 수량을 가지는 것에 주안을 두고 대금도 그 수량 기준으로 결정해야, 토지 매매 목적물을 등기부 평수로 특정했어도 대상 특정 및 대금 결정 방편인 경우 수량지정매매 X [92다56674].","매매일반효력"],[114,"매매 목적물의 하자가 경미하여 수선 등의 방법으로도 계약의 목적을 달성하는 데 별다른 지장이 없는 반면 매도인에게 하자 없는 물건의 급부의무를 지우면 다른 구제방법에 비 하여 지나치게 큰 불이익이 매도인에게 발생되는 경우에 는 매수인의 완전물급부청구권 행사를 제한할 수 있다.",true,"하자담보의무 이행이 오히려 공평의 원칙 반하면 완전물급부청구권 X [2012다72582] 一 BMW 자동차 운행 5일 만에 계기판 속도계 작동 안 한 경우 간단한 수리 가능함에도 신차 교환요구 X.","매매일반효력"],[115,"인에게 배 상을 청구할 수 있는 손해에는 매수인이 얻을 수 있었던 이익의 상실은 포 함되지 않는다.",false,"타인 권리 매매에서 권리 이전할 수 없게 된 때 매도인은 선의의 매수인에게 불능 당시 시 가를 표준으로 그 계약이 완전히 이행된 것과 동일한 경제적 이익을 배상할 의무 O [66 다 2618] 一 타인권리 매매는 이행이익설.","매매일반효력"],[116,"甲이 2012. 4. 2. 丙을 상대로 2010. 12. 27. 부터 X 토지의 인도 완료일까지 그 시용으로 얻은 부당이득의 반환을 구하는 소를 제기한 경우, 丙은 2012. 4. 2. 부터 악의의 점유자로 본 다.",false,"설문 자체에서 甲이 이미 丙을 상대로 소유권이전등기 말소를 구하는 소를 제기했으므로. 말소소송 제기일 2011. 9. 1. 무럽으로서 그 소장 부본 송달일부터 丙은 악의 점유자로 간 주되어 O t 소유자는 점유자를 상대로 물건반환 및 권원 없는 사용이익 반환 구하면서 물건반환 인용 될 것을 전제로 소송이 계속된 때 이후 기간 사용이익 반환 청구 O [2016다220044] 一 197조 2 항의 문언에 불구하고 소장 부본 송달일부터 악의로 간주.","매매일반효력"],[117,"丁 * 피담보채권이 변제된 저당권설정등기를 기초로 경매개시결정이 내 려지면 해당 경매절차 자체가 무효이 므로, 매수인은 경매 목적물인 부동산의 소유권을 취득할 수 없고` 경매 절 차에서 배 당받은 채 권자에게 자신이 지급한 매 각대 금에 관하여 부당이 득반환을청구할 수 있다.",true,"임의경매 무효인 경우 경락인은 배당금 수령 채권자(＝근저당권자)에 대하여 배당금의 부당이득반환청구 O [2006다24049] 민집법 267조(매수인의 부동산 취득은 담보권 소멸로 영향받지 않는다논근 ‘경 매개시 후’ 담 보권 소멸했음에도 경매 진행되어 매각된 경우에만 적용(예외적 공신력)， 종래 판례 유지 0._. 유효한 담보권에 기해 일단 경매개시되면 국가에게 처분권, 애초 담보권 소멸했다면 경 매개시 위법 공신력 없는 등기제도와 조화 [2018다205209].","매매일반효력"],[118,"물상보증인이 제공한 담보물이 타인 소유로 밝혀져 물상보증인의 등기와 경매절차 상 매 수안의 등기가 모두 원인무효 등기로 말소된 경우, 위 매수인은 경 매와 매도인의 담보책임에 관한 「민법」 제578조 제1항에 따라 채무자에게 담보책임을 물을 수 있다.",false,"578조 1항 채무자’ 에는 임의경매에서 물상보증인도 포함 0 一 경락인이 담보책임으로 해제권 행사하면 물상보증인은 경락인에 대하여 원상회복의무 부담 [87 다카2641 ] 一 물상 보증인설(채무자가 아니라 물상보증인이 담보책임을 부담함).","매도인의담보책임"],[119,"X토지의 일부가 1서의 소유임을 乙이 알고 있었을 경우, 甲이 해당 부분을 丙으로부 터 취득하여 乙에게 이전할수 없더라도, 乙은 대금의 감액을 청구할수 없다.",false,"일부 타인권리 매매에서 대금감액청구권은 매수인의 선악의 불문함.","매도인의담보책임"],[120,"지의 일부가 丙의 소유여서 甲이이를 乙에게 이전할 수 없는 경우, 乙이 잔존 토지만을 매수하지는 않았을 것으로 인정된다면 선의의 乙은 계약전부를 해제 할 수있다.",true,"위 해설 참조.","매도인의담보책임"],[121,"지의 면적이 1,000m㎡을 전제로 매매대 금을 1억 원 ( 1 m² 당 10만 원)으로 하여 계약을 체 결하였으나 실측 결과 900m' 인 경우, 선의인 乙은 대 금의 감액 및 손해배 상을청구할 수 있다.",true,"부동산매 매에서 실제면적이 계약면적에 미달할 경우. 수량지정 매매에 해당할 때 한하여 574조 572조 대금감액청구는 별론 매 매계약이 그 미달부분만큼 일부무효라며 부당이득반환청구 X 미달 부분 원시적 불능 이유로 535조 계약체결상 고의에 따른 책임 청구 X [99다47396].","매도인의담보책임"],[122,"취득할 수 없게 되더라도 乙은 계약을 해제 할 수 없다.",true,"매수인이 매매목적물에 관한 근저당권 피담보채무의 인수로 매매대금 지급에 갈음하는 약 ㎡을 한 경우(＝이행인수)에는 매수인이 매도인에 대하여 576조 1항 담보책임을 면제’ 해 주었거나 ‘포기'한 것 o. 576조 담보책임 X [2002다11151l.","매도인의담보책임"],[123,"甲이 乙에게 토지 2,000m2를 3억 원에 매도하였는데, 그 중 300m2가 제3자인 丙의 소유에 속하기 때 문에 甲이 위 300 귬 부분에 대한 소유권을 매수인에게 이전할 수 없는 경우, 乙은 위 300 面 부분이 丙의 소유인 사실을 알고 있었는지 여부와 관 계없이 매매계약 전부를 해제 할 수 있다.",false,"일부 타인권리 매매에서 ‘해제권 ’은 선의 매수인만 행사 가능(* 전부 타인권리 매매).","매도인의담보책임"],[124,"민법 제571조 제1항은 선의의 매도인이 매매의 목적인 권리의 전부를 이전 할 수 없는 경우에 적용될 뿐 매매의 목적인 권리의 일부를이 전할 수 없는 경우에는 적용 될 수 없고, 수 개의 권리를 일괄하여 매매의 목적으로 정하였으나 그 중 일부의 권 리를 이전 할 수 없는 경우에도 마찬가지다.",true,"571조 선의 매도인 해제 특칙은 ‘전부’ 타인권리 매매에만 적용 0, 일부 타인권리 매매에는 X [2002다33557].","매도인의담보책임"],[125,"ID 매매계약을 체결함에 있어서 토지의 면적을 기초로 평당 가액에 면적을 곱 하여 대 금을 산정하였는데 그 토지의 일부가 매매계약 당시에 이미 도로부지로 편 입되어 있었고 매수인이 그와 같은 사실을 알지 못한 채 매매계약을 체결한 것이라 면, 매수인은 매도인에 대하여 그 토지 중 도로부지로 편입된 부분의 비율로 대 금의 감액을 청구할 수 있다.",true,"매매계약체결함에 토지 면적을 기 초로 평수에 따라 대금 산정했는데 토지 일부가 매매계약 당시 이미 도로 부지로 편입되어 있다면 선의 매수인은 제574조에 따라 매도인에 대해 도로 부지 편입 부분의 비율로 대금감액청구 O [92다30580〕.","매도인의담보책임"],[126,"부동산을 매 수하고 소유권이전등기까지 넘겨받았 지만 진정한 소유자가 제기한 등 기말소청구소송에서 매도인과 매수인 앞으로 된 소유권이전등기의 말소를 명한 판결이 확정됨으로써 매도인의 소유권이 전의 무가 이행불능된 경우, 그 손해배 상액 산 정의 기 준시 점은 위 판결이 선고된 때이다.",false,"원소유자가 매도인 상대로 제기한 소유권이전등기 말소등기소송이 매도인의 패소로 확정 된 경우. 매도인의 선의의 매수인에 대한 담보책임의 손해배상액은 패소 확정시의 목적물 시가를 표준으로 산정 [80다3122].","매도인의담보책임"],[127,"타인의 물건 매매에 있어서, 매수인이 그 물건의 소유권이 매도인에 게 속하지 아니 함을 알지 못한 것이 매수인의 과실에 기인한 경우에 는 매도인의 배 상액을 산 정함에 있 어 서 이를 참작하여야 한다.",true,"타인 물건 매매에서 매수인이 물건의 소유권이 매도인에게 속하지 않음을 알지 못한 것에 고의에 기인하면 매도인의 배상액 산정에 참작해야 [71다218] ® 매매의 목적물의 하자로 인한 담보책임에 있 어 서 그 하자의 존부는 매매계약성립 시를 기준으로 판단한다.","매도인의담보책임"],[128,"타인 물건 매매에서 매수인이 물건의 소유권이 매도인에게 속하지 않음을 알지 못한 것에 고의에 기인하면 매도인의 배상액 산정에 참작해야 [71다218] ® 매매의 목적물의 하자로 인한 담보책임에 있 어 서 그 하자의 존부는 매매계약성립 시를 기준으로 판단한다.",true,"하자란 매매 목적물이 거래 통념상 기대되는 객관적 성질 · 성능 결여하거나 당사자가 예 정 • 보증한 성질 결여 한 경우 一 매매 토지에 건축허가 받을 수 없는 법률적 제한 • 장애는 매매목적물의 하자이며. 하자 존부는 매매계약성립시를 기준으로 판단해야 [98 다 18506].","매도인의담보책임"],[129,"甲이 乙에게 하자담보책임을 근거로 완전물급부청구권을 행사하는 것은 공평의 원칙상허용될 수 없다.",true,"하자담보의무 이행이 오히려 공평의 원칙 반하면 완전물급부청구권 X [2012다72582] 一 BMW 자동차 운행 5일 만에 계기판 속도계 작동 안 한 경우 간단한 수리 가능함에도 신차 교환요구 X.","매도인의담보책임"],[130,"매도인의 하자담보책 임에 기한 매수인의 손해배상청구권의 제 척 기 간은 특별 한 사정이 없는 한 소멸시효 규정의 적용을 배제 하지 않는다.",true,"제척기간 규정 있어도 소멸시효 규정 배제 X, 매매 토지 지하 폐기물 매 립된 경우 582조 하자담보책임 ‘안 날 6개월 제척기간 규정 있으나 인도받은 때로부터 10년 지나면 담보책임 손해배상청구권 소멸시효완성 (162조 1항) [2011다10266].","매도인의담보책임"],[131,"X 토지에 관한 임대차계약이 종료 되기 전에 甲이 Y 건물을 미 등기 무 허가 상태로 A에게 매도하였다면, A 가 乙의 동의를 얻 어 X 토 지의 임차인이 되 었 다고 하더라 도 특별한 사정이 없는 한 A는 乙을 상대로 Y 건물에 대한 매 수청구권을 행 사할 수 없다.",false,"종전 임차인으로부터 미등기 무허가건물을 매수하여 점유하고 있는 ‘임차인’은 임대인에 대하여 지상물매수청구 0 ·: 지상물매수청구권 제도 취지상 행정관청 허가받은 적법한 건물 아니어도 0, 건물을 점유하는 미등기 매수인은 점유 중인 건물에 대하여 법률상 · 사 실상 처분권 O [2013다48364].","매도인의담보책임"],[132,"설문과 달 리 乙이 아 닌, 乙로부터 X 토지의 관 리를 위 탁받은 B 가 계약 당사자로 서 甲과 임대차계약을 체결한 경우라고 하더라도, X 토 지에 관한 임대차계약이 종료 되기 전에 乙이 B로부 터 임대인의 지 위를 승계하였다면, 甲은 乙을 상 대로 Y 건 물에 대한 매 수청구권을 행 사할 수 있다.",true,"토지 소유자 아닌 제3자가 토지 임대행위 한 경우, 적법 한 대리 혹은 무권 대리 추인 있다 면 토지 소유자가 지 상물매수청구 상대 방 0 一 그러 나 제3자가 당사자로서 토지 임대 했 다면 토지 소유자가 임대인 지위 승계하는 등의 특별한 사정이 없는 한 임대인이 아닌 토.","매도인의담보책임"],[133,"甲이 乙울 상대로 제 1 심에서 Y 건물에 대한 매 수청구권을 행 사하였다가 乙의 동 의를 얻 어 철 회 한 후 항소심에서 다시이를 행 사하더 라도이 는 허용된다.",true,"[민소] 건물 매수청구권은 행사에 특정 방식 요하지 않아 재판 외에서 행사할 수도 있고. 행사 시기도 제한 없으므로. 임차인이 제 1 심에서 건물매 수청구권을 행사했다가 철회한 후 항소심에서 다시 행사해도 허용 O [2001다42080].","민법상의임대차"],[134,"터 甲의 乙을 상대로 한 매 수청구 대 상인 Y 건물의 매수 가격에 관하여 甲과 乙 사이에 의사 합치가이루어지지 않았다면, 법원은 매 수청구권 행사 당시 Y 건물 시가를 매 매대 금으로 하는 매매계약이 성립하였음을 인정할 수 있을 뿐, 인정된 시가를 임의로 증감하여 직권으로 매 매대금을 정할 수 없다.",true,"지상물매수청구 대상 건물의 매수가격에 당사자 의사합치 없었다면 법원은 여러 사정 종 합하여 매수청구권 행사 당시 건물 시가를 매매대금으로 매매계약성립 인정할 수 있을 뿐 법원이 해당 시가를 임의로 증 감하여 직권으로 매매대금 결정 x •.• 지상물매수청구권은 형성권. 행사로써 곧바로 행사 당시 시가를 대금으로 매매계약체결된 것 같은 효과 발 생하므로 [2023다309020].","민법상의임대차"],[135,"종전 토지 임차인으로부터 미등기 무허가건물을 매 수하여 점유하고 있는 현재의 토지 임차인은 소유자로서의 등기명의가 없더라도 특별한 사정이 없는 한 임대인에 대 하여 지상물매 수청구권을 행사할 수 있다.",true,"종전 임차인으로부터 미등기 무허가건물을 매수하여 점유하고 있는 ‘임차인 ’은 임대인에 대하여 지상물매수청구 0 ·: 지상물매수청구권 제도 취지상 행정관청 허가받은 적법한 건물 아니어도 0, 건물을 점유하는 미등기 매수인은 점유 중인 건물에 대하여 법률상 • 사 실상 처분권 O [2013다48364].","민법상의임대차"],[136,"토지 임차인의 지상물 매 수청구권은 임대 차기간이 만료된 경우뿐만 아니 라, 기 간의 정함이 없는 임대 차에서 임대인에 의한 해 지통고에 의하여 그 임차권이 소멸된 경우에 도인정된다.",true,"기간 약정 없는 토지임대차에서 임대인 해지통고 했다면 임차인은 계약갱신을 청구할 필 요 없이 곧바로 건물매 수청구권 O [94 다 51178].","민법상의임대차"],[137,"토지 소유자가 아닌 제3자가 임대 차계약의 당사자로서 토지를 임대한 경우, 토지 소유자가 임대인의 지위를 승계하였다는 등의 특별한 사정이 없는 한, 임대인이 아닌 토지 소유자가 직접 지상물 매 수청구권의 상대방이 될 수는 없다.",true,"토지 소유자 아닌 제3자가 토지 임대행위 한 경우. 적법한 대리 혹은 무권대리 추인 있다 면 토지 소유자가 지상물매수청구 상대방 o. 그러나 제3자가 당사자로서 토지 임대했다 먼 토지 소유자가 임대인 지위 승계하는 등의 특별한 사정이 없는 한 임대인이 아닌 토지 소유자에 대하여 지상물매 수청구권 X ·: 지상물매수청구권은 임차권 소멸 당시 토지소유.","민법상의임대차"],[138,"임차인 소유 건물이 임대차 대상 토지 외에 임차인 또는 제3자 소유의 토지 위에 걸쳐서 건립 되어 있는 경우, 임차지에서 있는 건물 부분 중 구분소유의 객체가 될 수 있는 부분에 한하여 임차인은 지상물매수청구를 할 수 있다.",true,"임차인 소유 건물이 임대 토지 외에 임차인 • 제3자 소유 토지 위에 걸쳐서 건립된 경우. 임 차지 상 건물 중 구분소유 객체 될 수 있는 부분에 한하여 매수청구권 허용 [93다42634] ·: 임대인 매수 후에 철거의무 • 손해배상의무 생겨 강요할 수 없고. 면적비율로 공유하더 라도공유에따른제약.","민법상의임대차"],[139,"丙이 甲의 동의를 얻어 기존의 출입문을 제거하고 유리 출입문과 새시를 부속물 로서 설치한 경우, 甲과 丙 사이의 건물임대차계약이 丙의 차임지급채무불이행으로 인하여 해지되었다면, 丙의 甲에 대한 부속물매수청구는 허용되지 않는다.",true,"임차인의 채무불이행으로 해지된 경우는 부속물매수청구 X [88 다카7245].","민법상의임대차"],[140,"토지 임차인의 지상물매 수청구권은 매 수청 구의 대상이 되는 건물에 근저당권이 설정 되어 있는 경우에는 인정 되지 않는다.",false,"643조 건물매수청구권의 매 수가격은 여러 사정을 종합적 고려하여 청구권 행사 당시 건물 현존 상태로 평가된 시가 상당액 一 건물에 근저당권설정된 경우도 채권최고액 E| 담보 채무액 공제 X 다만 근저당권 말소 않는다면 토지소유자는 588조에 의해 말소될 때까지 채권최고액 상당 대금 지급 거절 O [2007다4356].","민법상의임대차"],[141,"만약 임대 차계약체결 후 乙이 사업 자금이 필요하여 2020. 4. 1. 丙에게 X 토지를 매도하고 다음 날 X 토지에 관하여 丙 앞으로 소유권이전등기를 마 쳤 다 면, 甲은 임대차기간 만료 후 丙이 甲에게 Y 건물을 철거하고 X 토지를 인 도할 것을 요구하더라도 丙을 상대로 지상물매 수청구권을 행사할 수 있다.",true,"643조 지상물매수청구권은 국민경제, 임차인보호의 취지로서 원칙적으로 임차권 소멸 당 시 토지 소유권 가진 임대인을 상대로 0, 임대인이 제3자에게 토지 앙도 등 토지 소유권이전된 경우는 임대인 지위 승 계되거나 임차인이 토지 소유자에게 임차권 대항할 수 있다 면 새로운 토지 소유자 상대로 지상물매수청구권 O [2014다72449] 一 甲이 Y건물 소유권보존등기로 쟈로지 임대차에 대항력 발생했으므로 그 후 廷료지 소유 권을 취득한 丙은 임대인 지위를 승계하게 됨.","민법상의임대차"],[142,"만약 임대차기간 만료 전인 2020. 5. 1. 甲이 丁에게 Y 건물을 양도하고 다음 날 丁 앞으로 소유권이전등기를 마쳐주었는 데 이에 관하여 乙로부 터 별도의 동의를 받지 않았다 면, 위 임대차기간 만료 후 乙이 Y 건물의 철거 및 X 토지 인도를 요구한 경우 丁은 원칙적으로 乙을 상대로 지 상물매 수청구권을 행 사할 수 있다.",false,"건물 소유 목적 토지임차인이 건물에 저당권설정하였다가 저당권 실행된 경우 358조에 의하여 경락인이 건물 소유권과 함께 건물 소유 목적 토지 임차권도 취득 一 이 경우에도 629조 적용 토지임대인에 대한 관계에 서는 그의 동의가 없는 한 경락인은 임차권 취득을 대항 X 一 622조 1항은 건물 소유 목적 토지임차인이 건물에 등기한 때 토지의 권리를 취득한 제3자에 대해 임대차 효력 주장하는 규정일 뿐, 임차인으로부터 건물 소유권과 함 께 건물 소유 목적 토지임차권을 취득한 사람이 토지임대인에 대한 관계에서 동의 없는 임차권 양도를 대항 규정 X [92다24950, 95다29345).","민법상의임대차"],[143,"매수청구의 대 상이 되는 건물에 근저당권이 설정되어 있는 경우, 그 건물의 매 수가격은 매 수청구권 행사 당시 건물이 현존하는 대 로의 상태에서 평가된 시가 상 당액에서 근저당권의 채권최고액이나 피담보채무액을 공제한 금액 이다.",false,"643조 건물매수청구권의 매수가격은 여러 사정을 종합적 고려하여 청구권 행사 당시 건물 현존 상태로 평가된 시가 상당액 一 건물에 근저당권설정된 경우도 채권최고액 • 피담보 채무액 공제 X 다만 근저당권 말소 않는다면 토지소유자는 588조에 의해 말소될 때까지 채권최고액 상당 대금 지급 거절 O [2007다4356].","민법상의임대차"],[144,"토지의 임대인이 임차인에 대하여 토지인도 및 건물철거청구 소송을 제기하여 청구인용의 확정판결을 선고받았으나 건물철거를 집행하지 않은 경우, 임차인은 전 소에서 건물매 수청구권을 행사하지 않았더라도 별소로이를 행사하여 임대인에 대 하여 건물 매매대 금의 지급을 구할 수 있다.",true,"[민소] 토지 임대인의 토지인도 및 건물철거청구 소송에서 임차인의 패소판결 확정된이 후에도, 그에 기해 건물철거 집행되지 아니한 이상, 임차인은 건물매수청구권 행사 0, 별 소· 반소로 임대인에 대하여 건물매매대금 지급청구 O [95다42195].","민법상의임대차"],[145,"임차인이 임차목적물에 지 출한 각종 유익비의 상환청구권을 미리 포기하기로 한 특약은 강행법규위반으로 효력이 발생하지 않는다.",false,"비용상환청구권은 임의규정이므로 포기특약 유효.","민법상의임대차"],[146,"임대인의 수선의무 면제특약에 면제되는 수선의무의 범위를 명시하지 않은 경우, 특별한 사정이 없는 한 대파손의 수리, 건물의 주요 구성부분의 대수선, 기본적 설 비 교체 등 대규모의 수선은 여전히 임대인이 수선의무를 부담한다.",true,"특약으로 임대인 수선의무 면제 0 一 그러나 특별한 사정이 없는 한 통상 파손 등 소규모 수선만 면제되고. 대파손, 건물 주요 구성부분. 기본설비 교체와 같은 대규모 수선은 면제 되지 X [2009다96984, 94다34692].","민법상의임대차"],[147,"질적이 득이 없 더라도 임차인이 자신의 시 설물을 반출하지 아니하였다면 임차인의 부당이 득반환의무는 성립한다.",false,"부당이득의 이득은 실질적 이익을 의미하므로 임대차계약이 소멸된 이후 임차인이 임차건 물을 계속 점유했으나 본래의 임대차계약상 목적에 따라 사용
