산매 매로 안한 소유권이전등기청구권의 양도는 특별한 사정이 없는 한 통상의 채권양도와 달리 양도인의 채무자에 대한 통지만으로는 채무자에 대한 대 항력이 생기지 않으며 반드시 채무자의 동의나 승낙을 받아야 대 항력이 생긴다.",true,"매매로 인한 소유권이전등기청구권은 그 성질상 양도가 제한되고 양도에 채무자의 동의 • 승낙 요하며 양도통지만으로 채무자에게 대항 X → 매매 소유권이전등기청구권은 이행과 정에 신뢰관계가 따르므로 [2000 다51216].","채권양도"],[205,"라도, 특별한 사정이 없는 한 채권양수 인은 보증인에 대하여 보증채무의 이행을 구 할 수 있다.",true,"주채무자에 대하여 채권양도통지 등 대항요건 갖추면 보증인에게 효력 0 (측, 보증인에 대하여 따로 통지할 필요 없음) [75 다 1100].","채권양도"],[206,"당사자 사이에 양도금지의 특약이 있는 채권이더라도 전부명령에 의하여 전부되는 데에는 지장이 없고, 전부채권자로부터 다시 그 채권을 양수한 자가 그 특약의 존재를 알았다고 하더라도 채무자는 위 특약을 근거로 그 채권양도의무효를 주장 하수 없다.",true,"당사자 사이 앙도금지특약 있더라도 전부명령 0, 집행채권자의 선악의 불문, 전부채권자로부터 다시 양수한 자가 악의라하여도 채권양도 유효 [2001 다3771].","채권양도"],[207,"채권양도의 통지는 그 양도 인이 채권이 양도되였다는 사실을 채무자에게 알리는 행위에 불과하므로, 그것 만으로 도급계 약에 관하여「민법」 제667조 내지 제671조에 규정된 하자담보책임의 제척기간 준수에 필요한 권리의 행사에 해당한다고 할 수 없다.",true,"채권양도 통지는 제척기간 준수에 필요한 권리행사 X [2010 다28840].","채권양도"],[208,"선순위의 근저당권부채권을 양도하였으나 아직 대항요건을 갖추지 못한 경우, 후순위근저당권자는 대항요건을 갖추지 못하였음을 이유로 그 채권양도의 효력을 부인할 수 없다.",true,"(j) 대항요건 못 갖춘 채권양수인, @ 채권양도 해제되었으나 해제통지 못 갖춘 양도인 등이 선순위저당권자일 경우에 그 후순위저당권자는 채권양도 대항요건을 갖추지 않은 겅 우 대항할 수 없는 제3자’에 포함되지 X → 후순위 저당권자는 선순위 저당권자가 채권앙도 대항요건 갖추지 못했다 며 배당이의 X [2004 다29279, 2011 다 109357].","채권양도"],[209,"채권자가 채무자의제 3채무자에 대한 채권을 가압류한 후에도 채무자는 제 3채무지를 상대로 그 이행의 소를 제기 할 수 있다.",true,"채권에 가압류 있어도 현실 추심만 금지할 뿐 채무자는 제 3 채무자를 상대로 이행청구소송 0, 법원도 가압류 이유로 배척 X → 인용 T 집행권원 취득 필요, 집행단계에서 저지 가능 가압류 취소 후 다시 소제기 불편 시효중단 필요 [2001 다59033].","채권양도"],[210,"금지 특약으로써 대항할 수 있고, 제 3자의 악의 내지 중과실은 채권양도금지 특약으로 양수인에게 대항하려는 자가 이를 주장 • 증명하여야 한다.",true,"채권양도금지특약에 반하여 채권양도 이뤄진 경우, 양수인이 앙도금지특약의 존재를 알았 거나 중과실로 알지 못한 경우는 채권양도 무효, 중고玲! 없이 알지 못했다면 채권양도 유효 → 양수인의 악의나 중과실에 대한 입증책임은 채무자 부담 → 채무자는 487조 후단 채권자 불확지 변제공탁. [2000 다55904].","채권양도"],[211,"당사자의 의사표시에 의한 채권양도금지 특약이 있는 경우 악의의 양수인으로부터 다시 선의로 양수한 전독자는 그 채권을 유효하게 취득하나, 선의의 양수인으로부터 다시 채권을 양수한 악의의 전독지는 그 채권을 유효하게 취득하지 못한다.",false,"조 2항 단서는 전득자 포함 O, 악의 양수인으로부터 선의로 양수한 전득자 0, 선의 양수인으로부터 악의로 양수한 전득자. [2012 다 118020].","채권양도"],[212,"채권 양도에서 채무자가 이의를 보류하지 않고 승낙을한 경우에도 양수인이 악의 또는 중과실의 경우에 해당한다면 채무자는 승낙 당시까지 양도인에 대하여 생긴 사유로 양수인에게 대항할 수 있다.",true,"이의 보류 없는 승낙을 하였더라도 양수인이 악의나 중고玲陀l 경우라면 채무자는 승낙 당 시까지 양도안에 대해 생긴 사유로 양수인에게 대항. [99 다 18039].","채권양도"],[213,"田 채무자가 제 3채무자에 대한 채권을 특정 채권자에게 양도하였다가 그 채권양 도가 사해행위라는 이유로 취소판결이 확정되었으나, 그 채권자가 당해 채권에 대하여 채권압류 및 추심명령도 받아 둔 경우에는, 당해 채권에 대한 제 3 채무자의 혼 합공탁에 따른 배당절차에서 그 채권자가 사해행위의 수익자인 당해 채권의 양수인의 자격으로는 배당받을 수 없으나, 압류 및 추심명령을 받은 채권자의 지위에서 배 당받는것은가능하다.",true,"채무자가 채권을 특정 채권자에게 앙도한 채권양도가 사해행위로 취소판결 확정됐으나 앙 수인이 양수받은 채권에 압류 및 추심명령도 받아둔 상태 → 당해 채권에 대한 제 3채무자의 혼합공탁에 따른 배당절차에서 사해행위 수익자인 당해 채권의 양수인 자격으로는 배당 X. 그러나 압류 및 추심명령 받은 채권자 지위에서 배당. [2011 다 107818].","채권양도"],[214,"택지 분양계약의 채권자와 채무자 사이에, 택지분양권이 전전양도되는 경우를 예상하여 그에 대한 채권양도의 승낙을 할 이익을 미리 포 기하여 승낙없이 택지분양권의 양도를 채무자에게 대항할 수 있게하는 내용으로 체 결한 특약은 효력이 있다.",true,"채권양도승낙은 미리 포기 O.","채권양도"],[215,"채무자가 양도되는 채권의 성립 이나 소멸에 영향을 미 치는 사정에 관하여 채권 양수인에게 알리지 않았다고 하더라도 특별한 사정이 없는 한 불법행위는 성립하지 않는다.",true,"채무자가 이의無보류 승낙 할 때 채권 성립 • 소멸 사정을 양수인에 알려줄 신의칙상 의무 X 설명 없었어도 불법행위 X → 앙수인 자신 책임 [2014 다49241l.","채권양도"],[216,"근, 甲과 乙은 甲의 乙 에 대한 대여금채권의 양도를 금지하기로 특약을 맺었는데, 甲이 K은행에 채권을 양도해도 된다는 乙의 승낙을 받은 후 위 대여금채권을 K은행에게 양도하고이 사실을 乙 에게 확정일 자 있는 증서에 의해 통지한 후 甲이 위 채권을 W은행에게 양도한 경우, 甲과 K은행이 채권 양도 계약을 합의해지 하고 그 사실을 乙 에게 통지 하였다면 W은행은 위 채권을 유효하게 취득한다.",false,"양도인이 지명채권을 제 1 양수인에게 앙도하고 확정일자 있는 증서로 대항요건 갖춘 ‘후’ 양도인이 동일한 채권을 제 2양수인에게 양도해도 제 2양수인은 채권 취득 X → 지명채권 양도는 준물권행위 처분행위, 유효하려면 양도인 처분권한 있어야 하는데 제 1 양수인이 확 정일자까지 적법하게 갖춤으로써 양도인은 채권 처분권한 상실 [2015 다46119] → 여기에 채권양도금지 특약 후 승낙을 받아 양도한 것만 추가한 지문임.","채권양도"],[217,"채권의 양수인이 채권에 양도금지특약이 있다는 사실을 알았더라도 채무자가 그 양도에 대하여 사후에 승낙을한 경우, 다른 약정이 없는 한 채권양도는 그 양도 당 시로 소급하여 유효하게 된다.",false,"악의 중고玲!의 채권양수인에 대해 채무자가 사후승낙하면 무효인 채권양도행위가 추인되어 승낙 시부터 유효 0, 소급효 X [2009 다47685] → 139조 무효행위의 추인은 소급효 없기때문.","채권양도"],[218,"지 명채권의 양도통지를한 후 양도 계약이 해제된 경우에 채권양도안이 해제를 이유로 다시 원 래의 채무자에 대하여 양도채권으로 대항하려면, 채권양도인이 채권양수인의 동의를 받거나 채권양수 인이 채무자에게 그 해제의 사실을 통 지하여야 한다.",true,"조 1항은 채권양도가 해제 • 합의해제로 소급해서 무효로 되는 경우도 유추적용 0 → 통지 후 해제 • 합의해제된 경우 양도인이 해제 이유로 채무자에게 대항하려면 양수인의 동 의를 받아 통지를 철회하거나 양수인이 채무자에게 해제 사실 통지하여야 [2011 다 17953].","채권양도"],[219,"채권양도 후 대항요건이 구 비되기 전에 채권양도인은 채무자의제 3 채무자에 대한 채권을 가압류할 수 있다.",true,"채권양도 후 대항요건 구비 전의 양도인은 채무자의 제3 채무자에 대한 채권에 대하여 채권가압류 0, 배당받은 것은 유효 0 → 대항요건 구비 전의 양도인은 채무자에 대한 관계에서 여전히 채권자 지위. [2016 다8589).","채권양도"],[220,"가 B 에게 양수금을 청구하는 경우, B는 양도금지특약의 존재 및 이에 대한 C의 악의를 증명하여 책임을 면할 수 있다.",true,"[2000 다55904].","채권양도"],[221,"_ * A의 채권자 乙이 A의 대여금채권에 대해 전부명령을 받아 B 에게 전부금을 청구하는 경우, B는 양도금지특약의 존재 및 乙의 악의를 증명하여 책임을 면할 수 있다.",false,"[2001 다3771l.","채권양도"],[222,"가 양도금지특약의 존재 및 C의 악의를 증명한 때에도, C로부터 위 대 여금채권을 양수하여 대항요건을 갖춘 D는 선의 이며 중과실이 없으면 양수금을 지급받을 수 있다.",true,"[2012 다 118020].","채권양도"],[223,"채권양도인은 채권양도 후라도 그 대항요 건을 갖추기 전이면 채무자를 상대로 시효 중단의 효력이 있는 재판상 청구를 할 수 있다. ® * 채권양수인은 채권양수 후 그 대항요 건을 갖추지 못한 상태 라도 채무자를 상대로 시효중단의 효력이 있는 재 판상 청구를 할 수 있다.",true,"지문 관련 : 채권양도 대항요건을 갖추기 전이먼 채무자에 대한 관계에서 채권자는 앙도안이므로 앙도안의 재판상 청구는 당연히 시효중단 효력이 있고, ‘양수인’의 재판상 청구가 문제되지만 판례는 양수인의 경우도 권리행사로 인정 0 관련판례: [2008두20109].","채권양도"],[224,"지문 관련 : 채권양도 대항요건을 갖추기 전이먼 채무자에 대한 관계에서 채권자는 앙도안이므로 앙도안의 재판상 청구는 당연히 시효중단 효력이 있고, ‘양수인’의 재판상 청구가 문제되지만 판례는 양수인의 경우도 권리행사로 인정 0 관련판례: [2008두20109].",true,"채권양도 대항요건 갖추지 못한 상태에서 양수인의 재판상 청구 O •.• 동일성은 대항요 건과 무관, 149조 조건부권리의 처분 •보존 등, 권리 위에 잠잔다고 할 수 없음 [ 2005 다 41818] @ €!], 乙이 甲으로부터 丙에 대한 채권을 양수한다음 그 대항요 건을 갖추지 못한 상태에서 丙의 丁 에 대한 채권을 가압류하여 그 가압류에 기해 배 당절 차에서 배당을 받은 경우 乙 에 대한 배 당은 유효하다. ( X ).","채권양도"],[225,"甲이 丙에 대한 채권을 乙 에게 양도한다음 그 대항요건이 갖추 어지기 전에 丙의 丁에 대한 채권을 가압류하여 그 가압류에 기해 배당절차에서 배당을 받은 경우 甲에 대한 배당은 유효하다.",true,"지문 관련 : 채권양도 대항요건을 갖추기 전이면, 채무자에 대한 관계에서 채권자는 ‘양도인이고 ‘양수인’은 아님 관련판례 : [ 2008두20109 ].","채권양도"],[226,"지문 관련 : 채권양도 대항요건을 갖추기 전이면, 채무자에 대한 관계에서 채권자는 ‘양도인이고 ‘양수인’은 아님 관련판례 : [ 2008두20109 ].",true,"채권양도 후 대항요건 구비 전의 ‘양도인’은 채무자의제 3 채무자에 대한 채권에 대하여 채권가압류 O, 배당받은 것은 유효. [2016 다8589] → 위 판결은 대항요건 구바 전의 ‘양 수안은 채권 가압류를 할 수 없고 배당받을 수 없다고 판시함.","채권양도"],[227,"채권양도가 다른 채무의 담보 조로 이루어진 경우, 채무자는 그 피담보채무가 변제로 소멸되었다는 이유로 양수금 청구를 거절할수 없다.",true,"채권양도가 다른 채무 담보 조로 이뤄진 경우 그 채무 변제돼도 채무자는 이를 이유로 양 수금청구 거절 X → 채무 변제나 소멸 여부는 양도인 • 양수인 간의 문제일 뿐 채무자는 양수인에게 변제해야 [ 99 다23093].","채권양도"],[228,"채무자는 양도통지를 받은이 후에 양도인에 대하여 생긴 사유로 양수인에게 대항할 수 없으므로, 양도통지 후 채권자와의 계약이 합의해제되었더라도 이를 양수인에게 주장할수 없다.",false,"계약상 채권의 앙수인은 548조 1항 단서 제3자 X, 해제 효고問 반하여 자신의 권리 주장 X → 새로운 이해관계 뿐 아니라 등기 • 인도 등 완전한 권리를 취득해야 보호 [2000 다 22850, 95 다49882] → 매매계약 합의해제 사안으로서, 본 판례를 두고 채권양수인은 법정 해제뿐 아니라 ‘합의해제’의 경우에도 보호될 수 없다는 견해(다수설)를 수업시간에 소개하 는데, 최초로 이러한 견해에 입각한 지문이 등장했으며, 이에 따르면이 쟁점에 관하여 ‘채권양수인’은 업류채권자’와 동일한 지위가 됨.","채권양도"],[229,"□. * 임대인이 임대차보증금반환채권의 양도에 대하여 이의 보류 없이 승낙한 경우 임대인은 위 채권이 이미 타인에게 양도되었다거나 연체차임에 의하여 공제된다는 등의 사유로 양수인에게 대항할 수 없다.",false,"이의 보류 없는 승낙을한 채무자도 채권이 타인에게 양도된 사살, ＇임대차보증금의 속성 상 공제하는 사살로는 양수인에게 대항할 수 있음.","채권양도"],[230,"이의 보류 없는 승낙을한 채무자도 채권이 타인에게 양도된 사살, ＇임대차보증금의 속성 상 공제하는 사살로는 양수인에게 대항할 수 있음.",true,"조 1항 ‘양도인에게 대항할 수 있는 사유’란 채권의 성립 • 존속 • 행사를 저지 • 배척하는 사유를 말할 뿐, 채권의 귀속(＝이미 타인에게 양도된 사실臣즌 X → 채권 귀속 우열은 오 로지 확정일자 있는 통지 승낙의 유무와 선후로써만 결정 [93 다35551] → 이의無보류승낙(＝단순승낙)은 채권의 귀속 우열에 아무 영향 X.","채권양도"],[231,"조 1항 ‘양도인에게 대항할 수 있는 사유’란 채권의 성립 • 존속 • 행사를 저지 • 배척하는 사유를 말할 뿐, 채권의 귀속(＝이미 타인에게 양도된 사실臣즌 X → 채권 귀속 우열은 오 로지 확정일자 있는 통지 승낙의 유무와 선후로써만 결정 [93 다35551] → 이의無보류승낙(＝단순승낙)은 채권의 귀속 우열에 아무 영향 X.",true,"임대차보증금반환채권을 앙도함에 임대인이 단순승낙 했어도 인도시까지 생긴 연체차입 임차인의 원상복구비용 상당의 손해배상액 등 임차인의 모든 채무 공제 0 → 임대차보증 금의 속성 [ 2002 다52657].","채권양도"],[232,"저당권부채권의 양수인은 저당권이전의 부기등기를 마치 고 저당권실행의 요건을 갖추고 있어도 채권양도의 대항요건을 갖추고 있지 않다면 저당권 실행을 위한 경매신청을 할 수 없고, 양수채권의 변제를 받을 수도 없다. ( X ) ® * 근저당권부 채권을 양수한 채권자가 저당권 이전의 부기등기는 경료하였으나 채권양도의 대항요건을 갖추지 않은 경우, 그보다 후순위의 저당권자에 대하여 채권 양도로써 대항할 수 없다.",false,"지문 관련 : 담보채권을 근저당과 함께 앙수한 자가 채권양도 대항요건 X. 저당권이전 부기등기 0 → 경매신청 0 → 다만 채무자는 측시항고나 이의 가능 0 → 이런 절차로 실효되지 않는 한 경매절차 적법 → 후순위저당권자는 채권양도 대항요건 홈결의 경우 대항할 수 없는 채무자 이외의 ‘제3자’에 포함되지 X → 이상은 근저당권부채권의 양도통지 후 채권양도계약 해제되었으나 양수인의 해제 통지 없이 양도인이 경매신청한 경우도 마찬가지 [2011 다 109357].","채권양도"],[233,"채권양도 당시 이미 채권자의 채무자에 대한 채권이 가압류되어 있던 중 그가 압류채권자가 본안소송에서 승소하여 위 채권의 집행권원을 취득한 경우, 양도인의 양도행위는 무효가 된다.",true,"가압류된 채권도 양도에 아무 제한 無. 다만 가압류된 채권을 양수받은 양수인은 가압류로 권리 제한된 상태의 채권을 앙수 → 가압류 채권자가 본안승소 등 집행권원 취득하면 가압 류로 제한된 상태의 채권양도는 무효로 확정됨 T 채권가압류의 처분금지효력은 집행권원을 얻는 등 피보전권리의 존재 확정을 조건으로 발생 = 이는 채권양도 받았으나 확정일자 있는 통지 • 승낙 대항요건 갖추지 않은 사이 앙도된 채권이 가압류된 경우도 동일 [2001 다 59033].","채권양도"],[234,"甲이 乙 에 대한 채권을 丙에게 양도하고 확정일자부 증서에 의한 통지가 乙 에게 도달한 후, 甲이 위 채권을 다시 丁에게 양도하자 乙이 丁 에 대하여 이의를 유보하 지 않고 승낙한 경우, 乙은 丁 에게 채무를 이행해야 한다.",false,"조 1항 양도인에게 대항할 수 있는 사유’ 란 채권의 성립 • 존속 • 행사를 저 지 • 배 척하는 사유를 말할 뿐, 채권의 귀속(=이미 타인에게 앙도된 사실)g X → 채권 귀속 우열은 오 로지 확정일자 있는 통지 • 승낙의 유무와 선후로써만 결정 [93 다35551 ] → 이의無보류승낙(＝ 단순승낙)은 채권의 귀속 • 우열에 아무 영향 X.","채권양도"],[235,"甲이 乙로부터 X토지에 관한 임대차보증금반환채무를 인수하는 한편 그 채무액을 매매대금에서 공제하기로 약정한 경우, 그 인수는 특별한 사정이 없는이 상 이행인수로 보아야 하고, 면책적 채무인수로 보기 위해서는 이에 대한 丙의 승낙이 있어야한다.",true,"부동산 매수인이 매매목적물의 근저당권 피담보채무, 가압류채무, 임대차보증금반환채무를 인수하는 한편 그 채무액을 매매대금에서 공제하기로 약정한 경우, 특별한 약정이 없는 이상 이행인수 0, 면책적 채무인수 X [92 다23193].","채권양도"],[236,"乙과 丙 사이에 면책적 채무인수에 관한 약정이 있었던 경우, 甲이 승낙을 거절 하였다면 그이 후에는 다시 승낙하여도 특별한 사정이 없는 한 甲에 대하여 면책적 채무 인수로서의 효력이 생기지 않는다.",true,"채권자가 승낙 거절한 후 다시 승낙해도 채무인수 효력 X [98 다33765].","채권양도"],[237,"중첩적 채무인수는 채권자와 채무인수인과의 합의가 있는 이상 채무자의 의사에 반하여서도 이루어 질 수 있다.",true,"[87 다카 1836] → 채권자 • 인수인 사이 계약은 ‘보증’ 성질 → 이해관계 없는 제3자가 채무 자의 의사에 반하여 병존적 채무인수 O.","채권양도"],[238,"인수채무가 원 래 5년의 상사시 효의 적용을 받던 채무라면 면책적 채무인수 후에도 그 소멸시효의 기간은 여전히 5년의 상사시효의 적용을 받는다.",true,"면책적 채무인수는 채무의 동일성 유지하면서 종래의 채무자로부터 제 3 자인 인수인에게 이전하는 것 → 원래 채무가 5년 상사시효 적용 받았다면 면책적 채무인수로 채무자 지위가 교체되었더라도 소멸시효기간은 여전히 5년 상사시효 적용 0 → 면책적 채무인수와.","채권양도"],[239,"계약인수에 의하여 계약당사자의 지위가 제 3자에게 이전되는 경우 계약상 지위를 전제로한 권리관계뿐만 아니 라 불법행위에 기한 손해배상청구권도 별도의 채권 양도절차 없이 제 3자에게 그대로 이전된다.",false,"계약인수는 계약당사자 지위 승계, 계약에서 생기는 채권 • 채무, 해제권 등 포괄적 권리의무 앙도, 양도인은 계약관계 탈퇴 특별한 사정 없는 한 잔류당사자와 양도인 사이 계약관 계 X 채권채무 소멸 → 채권양도에서 채무자 보호 위한 대항요건은 계약인수에서는 별도 요구 X, 상법상 영업앙도 수반 계약인수도 마찬가지 甲주식회사 乙주식회사 사이 영업양도계약 체결하며 근로자(丙 등)에 대한 사용자의 모든 권리의무 이전 丙도 乙회사와 동일조건 근로계약(종전 근로기간 소급 작성) → 영업양도 전 丙이 甲회사 업무 관련 고객 돈 횡령한 경우, 甲회사의 丙에 대한 손해배상채권도 乙회 사가 승계취득 O, _. 잔류당사자 丙이 영업앙도 인식하고 근로계약 인수 승낙, 인수인 乙 회사에 사용자 지위뿐 아니라 근로계약 기초로 이미 발생한 손해배상채권도 이전, 대항요건 불필요 [2020 다245958].","채무인수"],[240,"매수인이 매매 목적물에 관한 근저당권의 피담보채무를 인수하는 것으로 매매대 금의 지급에 갈음하기로 약정한 경우 특별한 사정이 없는 한 매수인이 매매대 금에서 그 채무액을 공제한 나머지를 지급함으로써 잔금지급의무를 다하였다고 볼 것 이고, 매수인이 피담보채무인 대 출금 채무의 이자를 일부 지급하지 않았다는 사정만으로 매매계 약을 해제할 수는 없다.",true,"매수인은 현실적으로 당장 변제할 의무 X 매매 대금에서 채무액 공제한나 머 지를 지급함으로써 잔금지급의무 다한 것 O 인수인이 인수채무를 현실적 변제 않았다는 사정만으로 매도인은 매매계약 해제 X [93 다 19108].","채무인수"],[241,"!:\" 23.06모 - 17 I c. E티 금전소비대차계약으로 인한 채무에 관하여 제 3자가 채무지를 위하여 어 음 이나 수표를 발행하는 것은 특별한 사정이 없는 한 중첩적 채무인수에 해당한다.",true,"금전소비대차계약 채무에 관하여 제 3 자가 채무자를 위하여 어음 • 수표 발행함은 특별한 사정 없는 한 동일 채무 중첩적 인수. [97 다52493].","채무인수"],[242,"口. 면책적 채무인수의 경우, 종래의 채무자는 채무관계에서 탈퇴하여 면책되고 채무인 수로 종래의 채무가 소멸하므로 저당권의 부종성으로 인하여 당연히 위 소멸한 채무를 담보하는 저당권도 소멸한다.",false,"면책적 채무인수로 ‘제3자’가 제공한 인적 • 물적 담보가 소멸할 뿐 채무자가 제공한 담보는 소멸되지 않으므로 면책적 채무인수만으로 채무 소멸과 부종성으로 인해 담보가 소멸한다는 논리는 틀림 (참고판례 : 96 다27476 판결).","채무인수"],[243,"물상보증인이 채무인수에 동의함으로써 소멸하지 않는 담보는 당연히 기존의 담 보와 동일한 내용을 갖는다.",true,"물상보증인의 채무인수에 관한 동의는 채무인수인을 위해 새로운 담보 설정하겠다는 의사 표시가 아니라 기존의 담보를 채무인수인을 위해 계속 유지하겠다는 의사표시 → 동의로 유지되는 담보는 기존 담보와 동일한 내용 [2000 다56204].","채무인수"],[244,"물상보증 인이 저당권의 채무자의 계약상 지위를 인수한 것이 아니라, 다만 그 채무만을 면책적으로 인수하고 이를 원인으로하여 근저당권 변경의 부기등기가 경 료된 경우, 특별한 사정이 없는 한 채무를 인수한 물상보증인이 다른 원인으로 근저당권자에 대하여 부담하게된 새로운 채무까지 담보하는 것으로 볼 수는 없다.",true,"울상보증인이 면책적 인수를 하고 근저당권 변경의 부기등기 경료되면 이는 당초 채무자가 근저당권자에 대해 부담하고 있던 것으로서 물상보증인이 인수한 채무만을 대상으로하는 것 → 그 후 채무 인수한 물상보증인이 다른 원인으로 근저당권자에 대하여 부담하게된 새로운 채무까지 담보하는 것은 X [98 다40657].","채무인수"],[245,"甲이 乙에 대해 부담하는 채무를 乙과 丙의 합의에 따라 丙이 중첩적으로 인수하는 경우, 그 채무인수에 대하여 甲이 동의하지 않더라도 중첩적 채무인수의 효력에는 아무런 영향이 없다.",true,"채권자 • 인수인 사이 계약은 ‘보증’ 성질 → 이해관계 없는 제3자가 채무자의 의사에 반하여 병존적채무인수 O.","채무인수"],[246,"권자 丙에게 직접 지급하기로하여 丙으로 하여금 그 채권을 취득하게 할 의사로 약 정한 경우, 그 약정은 제 3지를 위한 계 약으로서 중첩적 채무인수에 해당한다.",true,"채무자 • 인수인 사이의 병존적 채무인수는 제 3자를 위한 계약 0 → 구별가준 : 제3자에게 직접 채권을 취득하게 할 의사가 있는지 여부.","채무인수"],[247,"병존적 채무인수에서 인수인이 채무자의 부탁 없이 채권자와의 계약으로 채무를 인수하는 것은 매우 드문 일이므로, 채무자와 인수인은 통상 주관적 공동관계가 있는 연대채무관계에 있고, 인수인이 채무자의 부탁을 받지 아니하여 주관적 공동관 계가 없는 경우에는 부진정연대 관계에 있는 것으로 보아야 한다.",true,"중첩적 채무인수가 채무자의 부탁 없이 채권자와의 계약으로 채무를 인수하는 것은 매우 드문 일이므로, 원칙적으로 주관적 공동관계가 있는 연대채무 / 부탁이 없어 주관적 공동 관계 없다연 부진정연대채무 [2009 다32409].","채무인수"],[248,"己 * 甲이 위 근저당권부 치용 금채무 4억 원의 변제를 불이행하여 乙이 대신 변제한 경우, 甲의 구상재무 이행의무와 乙의 소유권이전등기 이행의무는 동시이행관계에 있지 않다.",false,"부동산매매계약 • 이행인수계약이 함께 이뤄진 경우. ® 매수인의 인수채무불이행으로 말미 암아 또는 @ 임의로, 매도인이 인수채무를 대신 변제했다면 그로 인한 ® 손해배상채무 또는 @ 구상채무는 인수채무의 변형( =매매대금지급채무에 갈음한 것의 변형)이므로 매도인의 소유권이전등기의무와 동시이행 0 → 인수인이 인수채무 변제 게을리하여 경매가 개시되고 매도인이 경매 막고자 변제했다면 매도인은 손해배상채권 취득 0, 이를 들어 매매 해제. [92 다23193].","채무인수"],[249,". ® * 채무인수에 있어서 면책적 인수인지 중첩적 인수인지 분명하지 아니한 때에는 특별한 사정이 없는 한 중첩적 채무인수로 보아야 한다.",true,"[2002 다36228].","채무인수"],[250,"계약인수에서는 개별 채권양도에서 채무자 보호를 위하여 요구되는 대항요건은 별도로 요구되지 않고, 이러한 법리는「상법./ol- 영업양도에 수반된 계약인수에 대해 서도 마찬가지로 적용된다.",true,"계약인수는 계약당사자 지위 승계, 계약에서 생기는 채권 채무, 해제권 등 포괄적 권리의무 앙도, 양도인은 계약관계 탈퇴, 특별한 사정 없는 한 잔류당사자와 양도인 사이 계약관 계 X 채권채무 소멸 → 계약인수는 당사자 3인 관여 있어야 효력 발생(통상 앙도안 양수인 전류당사자 합의 삼면계약, 2인 합의가 선행하면 나머지 동의 •승낙 있어야 효력 발생), 개별 채권양도는 양도인 • 양수인 2인 관여로 효력 발생 → 채권양도에서 채무자 보호 위한 대항요건은 계약인수에서는 별도 요구 X, 상법상 영업양도 수반 계약인수도 마찬가지 [2020 다245958].","채무인수"],[251,"티|「표시 광고의 공정화에 관한 법 률잖 허위과장광고의 불 법행위를 원인으로하는 손해배상청구권을 가지고 있던 아파트 수분양자가 수분양자의 지위를 제 3자에게 양도하면 양수인은 특별한 사정이 없는 한 별도의 채권양도 절 차 없이도 위 손해배상청구권을 행사할 수 있다.",false,"구 표시 •광고의 공정화에 관한 법률상 허위 •고臣t광고로 인한 손해배상청구권은 불법행위 손해배상청구권 성격 → 계약상 지위 양도로 계약당사자 지위가 제3자에게 이전될 경우, 계약상 지위 전제로한 권리관계만 이전, 불법행위 기한 손해배상청구권은 별도 채권양도 절차 없이 제3자에게 당연히 이전되지 X → 다만 허위 •고臣!광고 그대로 믿고 광고로 높 아진 가격에 수분양자 지위 양수하는 등 양수인이 수분양자 지위 양도받으면서 허위 •고臣! 광고로 인한 손해 입었다는 등의 특별한 사정 있어야 양수인이 손해배상청구권 행사 가능 [2012 다 15336] → 정답결정력 없었던 지문.","채무인수"],[252,"매도인의 매수인에 대한 매매대금 채권이 압류된 이후 매도인의 지위를 이전하는 계약인수가 이루어진 경우, 매도인과 매수인 사이의 계약관계는 소멸하더라도 인수 인은 위 압류에 의하여 권리가 제한된 상태의 매매대금 채권을 이전받게 된다.",true,"채권 압류는 지급금지 명하지만 채권 발생원인인 법률관계에 대한 처분까지 구속 X → 계 약인수 O, 양도인 탈퇴하지만 양도인이 계약관계로 가지던 권리의무 동일성 유지한 채 앙 수인에 승계, 양수인은 압류로 권리 제한된 상태의 채권 이전받음 → 제3채무자는 계약인수 내세워 압류채권자에게 대항 X [2012 다41359].","채무인수"],[253,"매수인의 잔대금 지급의무와 매도인의 소유권이전등기의무가 동시이행의 관계에 있는 경우, 매수인이 잔대금 지급기일까지 그 대 금을 지급하지 못하면 그 계약이 자동적으로 해제된다는 취지의 약정이 있다면, 특별한 사정이 없는 한 매도인의 이행제공 없이도 매수인의 대금 미지급으로 계약은 자동해제된다.",false,"잔금을 기일에 지급하지 못하면 자동해제된다는 약정이 있더라도, 매도인이 잔금지급기일에 소유권이전등기 필요 서류 이행제공을하여 매수인을 이행지체에 빠지게 하였을 때 비로소 자동해제. [88 다카28891 ].","채무인수"],[254,"채권자가 변제를 수령하지 않을 의사가 명백하여 수령거절의사를 번복할 가능성이 보이지 않는 경우, 채무지는 구두의 변제제공을 하지 않더라도 채권자에게 이행지체책임을 지지 않는다.",true,"조는 수령거절의 번의가능성을 고려하여 구두제공을 규정한 취지, 변제를 수령하지 않을 의사가 명백하여 번의가능성 없다면 구두제공도 불멀요 → 채무자는 채무불이행 책임 X [76 다2218].","채무인수"],[255,"채무의 변제는 원칙적으로 채무자뿐만 아니라 제 3자도 할 수 있고, 채무의 성질상 반드시 변제자 본인의 행위에 의해서만 가능한 것이 아닌 이상 제 3자를 이행보조자 내지 이행대행자로 사용하여 대위변제할 수도 있다.",true,"[99 다 13515].","채무인수"],[256,"이해관계 없는 제 3자는 채무자의 의사에 반하여 변제하지 못하는데, 여기서의 이해 관계는 법률상 이해관계를 가리킨다.",true,"[2008 마 109].","채무인수"],[257,"부동산의 매수인은 법률상 이해관계가 있는 제 3자가 아니므로, 권리실현에 장애가 되는 부동산에 대한 담보권 등의 권리를 소멸시키기 위한다는 이유로 매도인의 반 대의사에도 불구하고 매도인의 채무를 대신 변제할 수 없다.",false,"매도인이 제3자에게 먼저 양도담보로 소유권이전등가 마쳐주면 매수인은 변제할 법률상이 해관계 또는 정당한 이익 0 → 피담보채무 변제하고 애도인을 대위하여 말소등기청구. [71 다 1888].","채무인수"],[258,"하는 소유권이전청구권가등기가 설정되어 있는데, 그 부동산에 대하여 먼저 경매가 실행되어 공동저당권자가 매각대금 전액을 배당받고 채무의 일부가 남은 경우, 그 가등기권리자는 재무 잔액의 변제에 관하여 이해관계 있는 제 3자에 해당하지 않는다.",true,"공동저당에서 물상보증인 소유 후순위담보권자는 공동저당권자가 물보 소유물에서 배당 받고 남은 채무를 채무자 의사에 反하여 대위변제할 이해관계 X → 물상보증인이 대위취득한 채무자 소유 부동산에 대한 공동저당권자의 저당권을 후순위담보권자가 물상대위할 수 있으므로 집행 받거나 권리 잃을 지위 없음 [2008 마 109].","채무인수"],[259,"채권담보 목적의 가등기가되어 있는 부동산을 시효취득하여 소유권이전등기 청구권을 취득한 자가 그 등기를 하지 못하던 중에 채권자가 가등기담보 등에 관한 법률상요구되는 청산절치를 거치지 아니하고 기등 기에 기하여 본등기를 하였다면, 시효완성자는 부동산 소유자에 대한 소유권이전등기청구권을 보전하기 위하여 소 유자를 대위하여 그의 채권자에게 채무를 변제할 법률상 권한이 있어 이해관계 있 는제 3자에 해당한다.",true,"[90 다 17774] → 위 ®과 동일한 법리.","채무인수"],[260,"口. A가 12억 원을 수령하면서 이를 대여금채권에 변제충당한다고 B 에게 통보하였다 면. A가 B로부터 12억 원을 그 대로 전달받아 실질적인 이익을 얻었으므로, B의 변제는 민법 제472조에 따라 12억 원의 범위에서 그 효력이 있다.",false,"조 권한 없는 자에 대한 변제에서 ‘이익을 받은 경우’란 ® 수령자가 채권자에게 전달 @ 채권자가 사후추인. © 수령자가 채권자의 자신 저 |3자에 대한 채무에 충당 • 변제하여 기존 채무 소멸시킨 경우 포함 0, 그러나 수령자가 자신의 채권자에 대한 채무 변제한 경 우는 X → 채권자에게 실질적 이익 X [2017 다278729] 위 사안은 A가 B 에 대한 채권®를 집행채권으로 B의 C 에 대한 물품대금채권에 압류 및 전부명령 → C는 이를 간과한 채 B 에게 물품대금채권을 변제함 → B는 C로부터 수령한 변제금을 충당 지정 없이 A에게 변제, A는 수령 당시 B 에 대한다른 채권@에 충당 지정함 → A는 C 에 대한 전부금소송에서 전부명령 무효(압류 경합)로 인해 패소 후 다시 자신이 받은 압류명령에 기초하여 추심명령 받고 C 에 대해 추심금청구 → A 승소, C는 472조 주장 X → B가 C로부터 받은 돈을 A에게 전달한 것으로 보이나 A의 지정으로 채권@에 충 당되었으므로 이는 B가 자신의 채권자에 대한다른 채무 변제한 것일 뿐임, 전부명령이 민 집법 229조 5 항으로 무효이더라도 압류명령은 유효하므로 C가 압류명령 받은 후 압류채무자 B 에게 변제하여 스스로 이중지급 위험 감수해야 L : C가 B 에게 지급한 돈이 A에게 전달되었다고 하려면 이는 C가 A에게 직접 지급했어야 할 추심금으로서의 ‘물품대금채권의 전달이어야 하는데 사안은 그렇게 볼 여지가 없어 이를추심금 12억 원의 변재로볼수는없음.","변제"],[261,"채권자와 채무자 사이에 미리 채권자가 적당하다고 인정하는 순서와 방법에의하여 충당하기로하는 내용의 변제충당에 관한 약정이 있다면, 변제수령권자인 채권자가 위 약정에 터 잡아 변제충당을한 이상 변제자에 대한 의사표시와 관계없이 충당의 효력이 있다.",true,"미리 채권자 • 채무자 사이에 채권자가 적당하다고 인정하는 순서 • 방법에 의하여 충당하 기로 약정했다면 변제수령권자 스스로 정한 순서 • 방법으로 변제충당 0 →이 경우 채무 자가 변제하면서 지정충당 X [98 다27517].","변제"],[262,"비 용, 이자, 원본에 대한 변제충당에 있어 당사자 사이에 특별한 합의가 없는 한 비 용, 이자, 원본의 순서로 충당하여야 하고 채무자는 물론 채권자라도 위 법정순 서와 다르 게 일방적으로 충당의 순서를 지정할 수는 없으나 상대방의 이의제기가 없어 묵시적인 합의가 있다고 불 경우에는 그러하지 아니하다.",true,"합의 없는 상태에서 비 •이 • 원 법정 순서와 다르게 당사자가 일방적 지정함에 대하여 상대방이 지체없이 이의 아니했다면 묵시적 합의 충당. [2002 다 12871 ].","변제"],[263,"변제 자가 주채무자이고 연대 보증약정이 있는 경우로서 다른 조건이 동일 하다면, 연대 보증기간 내의 채무와 연대 보증기간 종료 후의 채무 사이의 변제이 익은 같다.",true,"보증기간 중 채무와 보증기간 종료 후 채무는 변제이익 차이 없으므로 주채무자 변제액은 변제기 먼저 도래한 채무부터 법정충당 [99 다26481, 2019 다207141].","변제"],[264,"주채무자 이외의 자가 변제 자인 경우로서 다른 조건이 동일하다 면, 변제자가 발 행 또는 배 서한 어음에 의하여 담보되는 채무가 그렇지 않은 채무보다 변제이 익이 더 많다.",true,"[99 다22281 ].","변제"],[265,"변제 자가 주채무자인 경우로서 다른 조건이 동일하다면, 담보로 주채무자 자신이 발행 또는 배 서한 어 음에의하여 담보 되는 채무가 그렇지 않은 채무보다 변제이 익이 더 많다.",true,"지문 @® : 제3 자가 담보로 발행 or 배서한 약속어음 교부된 채무와 다른 채무 사이에 변제이익 차이 없고 동일 → 그러나 변제하는 자가 발행 or 배서한 어음으로 담보되는 채무 는 다른 채무보다 변제이익 많음 [99 다22281 ].","변제"],[266,"담보권 실행을 위한 경매에서 배당금이 담보권자가 가지는 수 개의 피담보채권 전부를 소멸 시 키 기에 부족한 경우에는 채권자와 채무자 사이에 변제충당에 관한 합 의가 있었다고 하더라도 그 합의 충당은 허용될 수 없고, 획일적으로 민법 제477조 및 제479조에 따른 법 정변제충당의 방법에 따라 충당하여야 한다.",true,"합의가 있었더라도 합의충당이 허용될 수 없으며, 획일적으로 가장 공평타당한 충당방법인 민법 477조 및 479조 규정에 의한 법정변제충당 방법에 따라야 [2000 다51339].","변제"],[267,"변제에 관한 증명책임은 채무자에게 있으므로, 특정 채무의 변제로서 급부를 하였다는 채무자의 주장에 대하여 채권자가 이를 수령한 사실을 인정하면서도 다른 채무의 변제에 충당하였다고 다투는 경우에는 특정 채무에 변제충당하기로하는 합의나 지정 또는 특정 채무가 법정충당의 우선순위에 있었다는 사실을 채무자가 주장 증명해야한다.",false,"‘변재의 증명책임 있는 채무자는 채권자에게 ® 급부한 점. @ 급부가 특정채무의 변제로 서 이뤄졌다는 점 증명해야 → 채무자가 객관적으로 특정채무 내용에 적합한 급부 했다면 특별한 사정 없는 한 고 채무 변제로 인정 여러 채무 부담하는 채무자의 급부가 동시에 여 러 채무 내용 적합하나 채무 전부 소멸시키가 부족한 경우 변제충당 문제됨 → 채무자가 그중 특정채무 변재로서 급부했다고 주장함에 대해 채권자가 수령한 사실 인정하면서다 른 채무 변제에 ‘충당했다고 주장할 경우, 채권자는 ® 다른 채권 존재 人冷L @ 다른 채권에 변제충당 합의, 지정, 법정충당 우선순위 있었던 사실 주장 증명해야 [2024 다258921].","변제"],[268,"비용, 이자, 원본에 대한 변제충당에 있어서는 지정변제충당이 허용되지 않으므로 한쪽 당사자의 일방적인 지정에 대하여 상대방이 지체없이 이의를 제기하지 않 았더라도 반드시 법정충당의 순서에 따라 충당이 이루어져야 한다.",false,"합의 없는 상태에서 비 · OI 원 법정 순서와 다르게 당사자가 일방적 지정함에 대하여 상대방이 지체없이 이의 아니했다면 목시적 합의 충당. [2002 다 12871].","변제"],[269,"근저당권에 의하여 담보된 피담보채무가 여러 차례에 걸쳐 대여받은 채무들로 이루어져 있는 경우 수개의 채무라고 보아야 하고, 담보권 실행을 위한 경매에서 배당금이 수개의 피담보채무 전부를 소멸시키기에 부족한 경우 변제충당을 함에 있어 지정변제충당은 허용될 수 없으나 합의에 의한 변제충당은 허용된다.",false,"경매에서는 합의충당 X → 획일적으로 가장 공평 타당한 477조 법정충당 0[95 다55504].","변제"],[270,"乙의 위 3, 000만 원 지급 시, 乙이 별다른 말없이 돈을 교부하였고 甲도 말없이 수령하였다면, 법원은 甲의 청구를 일부 인용(乙에게 1, 300만 원 및 이에 대한 2023. 6. 5. 이후의 지연손해금의 지급을 명함)하는 판결을 선고해야한다.",true,"합의나 지정이 없으므로 乙이 3, 000만 지급한 23. 6. 4. 당시 1 차 대여금은 원금 2억, 부대 채권 2, 000만(20 개월 X 100만). 2 차 대여금은 원금 2, 000만 부대채권 300만(15 개월 X 20만)이므로 각 부대채권 합계액 2, 300만에 우선 충당, 그 후 남은 700만이 2 차 대여금 원금 2, 000만에 충당(모두 변제기 도래하여 변제이악 높은 고이율 2 차 대여) → 법원은 2차 대 여금 청구에 대해 잔여 원금 1, 300만 원 및 이에 대한 23. 6. 5.부터의 지연손해금 인용.","변제"],[271,"乙의 위 3, 000만 원 지급 시 乙이 계 2차 대여’의 원리금에 지정하여 변제한다는 의사를 표시하였으나 甲이 이에 대하여 즉시 이의를 제기한 경우, 법원은 甲의 청구를 일부 인용(일부인용의 범위는 위 기과 동일)하는 판결을 선고하여야 한다.",false,"출제된 정답을 수정하여 ‘틀란 지문으로 변경함(私見). 2021년 2020 다261776 판결 이후 는 ‘ 지정충당을 출제하려면 과거 용어를 지양해야 함에도(답이 달라짐) 본 24년 모의사험 지문은 과거 용어를 사용하여 판례를 적용하면 출제 오류임(私見) 아래 판례를 고려한다면, 사례나 지문에서 제 2 차 대여금에 지정하면서 ‘충당’을 지정했다 거나 ‘우선’ 또는 먼저’ 충당할 것을 지정했다는 표현 없이 단순히 위 지문처럼 ‘지정하여.","변제"],[272,"변재했다는 표현만을 쓰는한, 이는 ‘충당’이나 ‘지정충당의 문제가 아닌 단순한 채무를 지정한 변제’의 문제로 보1-0卜 함(실제 22년 변호사시험은 이러한 私見의 법리를 기반으로 출제되었음 본 지문은 이를 간과한 채 위 판례 선고 전 19년 변시의 용어 사용을 그대로 답습하고 있음)． 수정하고 보면 22년 변시와 동일 법리이므로 총 두 번 출제된 것으로 보아 중복별 표를하였음 이처럼 최신판례 법리를 따르면 乙이 23. 6. 4. 지급한 3, 000만은 오로지 2차 대여에만 충 당되어야 하고, 여기에 甲이 이의를 제기할 수 없으며, 2 차 대여금 원리금 2, 300만 전체에 충당되고 남게된 700만도 다른 의사표시가 없는 한 1 차 대여금에 충당될 수 없음, 그렇다 면 甲의 2차 대여금 청구는 위 기과 같은 일부인용이 아니라 전부 기각 판결이 내려져야 함 그럼에도 출제자는, 위 지문의 표현으로 ‘지정충당이 이뤄진다는 전제하에(甲의 이의가 효 력이 없는 것은 동일). 앙 채권의 부대채권 합계 2, 300만을 먼저 소멸시킨 후 2 차 대여금의 원금은 오로지 700만이 소멸하는 것으로 출제한 것으로 보임.",true,"동일 당사자 사이에 수 개의 채권관계가 성립되어 있는 경우, 채무자가 특정채무 지정하여 변제하면 그 변제액수가 지정한 특정채무 액수를 초과하더라도, 초과액수 상당의 채권이 부당이득관계에 따라 다른 채권에 대한 상계의 자동채권이 될 수 있음은 별론, 당사자 사 이에 다른 채권 변제에 충당 공제 대상으로 삼는 합의가 있는 등 특별한 사정이 없는 한, 초과액수가 다른 채권의 변제에 당연 충당 X, 공제 X [2020 다261776).","변제"],[273,"乙의 위 3, 000만 원 지급 시 乙이 별 다른 말없이 돈을 교부하였고 甲도 말없이 수령하였는데 위 설문의 사실관계와 달리 ‘제 1 차 대여’의 이자율이 월 O, 5%가 아니 라 월 1 % 인 경우라면, 법원은 甲의 청구를 일부인용하는 판결을 선고해야 하나 그 범위는위 기과다르다.",true,"합의나 지정이 없으므로 각 부 대채권 합계액 2, 300만에 우선 충당되는 부분은 위 기 지문과 동일하나, 그 후 남은 700만이 1차 대여금 원금 2억에 우선 충당되는 점만 다름(모두 변제기 도래, 변제이익 동일 변제기 먼저 도래한 제 1 차 대여금 우선) → 법원은 2차 대여금 청구에 원금 2, 000만 원 및 이에 대한 23. 6. 5.부터의 지연손해금 인용.","변제"],[274,"戶 甲이 乙 에게 2020. 1. 31. 1, 000만 원을 변제한 경우, 법정변제충당의 순서는 고 이율의이 자로 변제이 익이 많은 B 차용금의 원본이 A 치용군陸] 원본보다 우선한다.",false,"변제일인 20. 1. 31. 현재 A 차용금은 변제기 도래. B 차용금은 변제기 미도래이므로 변제 이익 (2호)까지 검토할 필요 없이 A 차용금에 우선 충당됨 (1호).","변제"],[275,"변제충당에 관한 규정은 임의규정이므로 채권자와 채무자 사이의 합의에 따라 비 용, 이자, 원본의 순서와 다르 게 충당할 수도 있고,이는 임의 경매절차에서 배당금이 담보권자가 가지는 수 개의 피담보 채권 전부를 소멸 시 키기에 부족한 경우에도 마찬가지이다.",false,"경매에서는 합의 충당 X → 획 일 적으로 가장 공평 타당한 477조 법정충당. [95 다 55504].","변제"],[276,"변제자가 보증인인 경우 그 보증채무는 변제자 자신의 채무에 비하여 변제의이 익이 적으며, 변제자가 주채무자인 경우 보증인이 있는 채무는 보증인이 없는 채무에 비하여 변제의 이익이 적다.",false,"보증인으로서 부담하는 보증채무( 연대보증채무 포함)는 변제자 자신의 채무에 비하여 변제 이익이 적음 [99 다68652] → 지문 전단은 0 보증인이 있는 채무와 없는 채무, 울상보증인 제공 물적 담보가 있는 채무와 없는 채무는 변제이익 차이가 없고 동일 함[2013 다8250] → 지문 후단은 X.","변제"],[277,"채무자가 이행기가 도래한 수 개의 채무를 변제할 경우 그 법정충당의 순서는, 변제이익이 가장 큰 채무의 비용, 이자, 원본의 순서로 충당한 뒤, 그 다음으로 변제 이익이 큰 채무의 비용, 이자, 원본의 순서로 충당하는 방식에 의한다.",false,"변제충당의 순서는 합의충당 → 비용 • 이자 • 원본충당 → 지정충당 → 법정충당 )|頂이고, 법 정충당의 변제이익 다과 기 준보다 비용 • 이자 • 원본의 순서가 먼저임.","변제"],[278,"변제충당의 지정이나 합의가 있었다는 점은 이를 주장하는 자에게 주장 및 증명책 임이 있으나 법정충당의 우선순위에 있 게 되는 사정에 관하여는 법원이 직권으로 조사하여야 한다.",false,"조 4호의 안분 비례 법정충 당과 달리 그 법률효과 이상으로 자신에게 유리한 합의충당 또는 지정충당 또는 우선적 법정충당으로 특정 채무에 전액 변제충당 되었다고 주장하는 자는 이를 주장 • 증명 할 책임 부담 → 주장자가 합의, 지정, 우선적 법정충당 부분 증명 못하면 각 채무액 안분 비례 법정충당 T 법정충당 순위 동일하면 477조 4호 적용 [2007 다 77712, 2021 다247937].","변제"],[279,"丙이 乙의 채무를 면책적으로 인수한 경우, 丙은 특별한 사정이 없는 한 乙 에 대하여 구상권을 가진다.",false,"물상보증인의 구상권 취득요건에 면책적 채무인수는 포함 X → 채무소멸 X → 물상보증 인이 면책적 채무인수 해도 구상권 X [2017 다274703].","변제"],[280,"A가 乙로부터 X 토지를 취득한 후에 戊가 甲 에게 3억 원을 변제한 경우, 戊는 X 토지에 설정된 위 저당권에 관하여 대위의 부기 등기를 하지 않더라도 A 에 대하여 甲을 대위 할 수 있다.",true,"지문 L, C::: 관련 : 제3 취득자가 목적부동산 권리 취득한 ‘후’ 채무 변제한 보증인은 대위 부기등기 없이도 대위 0 → 482조 2항 1호는 제 3 취득자를 예측 불허 손해로부터 보호, 보증인 변제 전 권리 취득한 제 3 자는 등기부상 저당권 존재 알고 권리 취득하여 불측 손해 염려 X [2019 다 222041 ].","변제"],[281,"乙로부터 X 토 지를 취득한 A가 X 토 지에 설정된 위 저당권의 실행 으로소유권을 잃은 경우, A는 丙, 丁 에 대하여 甲을 대위 할 수 없다.",true,"조 2 항에 물상보증안과 ‘제3 취득자’ 상호간 변제자대위에 관하여 규정 無. 물상보증 인이 채무 변제나 담보권 실행으로 소유권 잃은 때에는 보증인과 마찬가지로 제 3 취득자에 대하여 구상권 범위 내 채권자를 대위 O, 그러나 제 3 취득자는 채무 변제나 담보권 실행으로 소유권 잃더라도 물상보증인에 대하여 채권자를 대위 X → 370조 · 341조는 물상보층 인에게 보증인의 구상권 준용 인정, 482조 2항 5호는 보증인 물상보증인을 인원수 비례로 대위하게하여 우열 X, 만일 물상보증인 제 3 취득자 상호간 각 부동산 가액 비례로 대위하게하면 우연한 사정으로 뜻밖의 손해 0| 익을 주어 부당. 482조 2항 1. 2호 [2011 다 50233].","변제"],[282,"己 丙이 甲 에게 3억 원을 변제한 후 Z 토 지에 설정된 위 저당권에 관하여 대위의 부기 등기를 하지 않고 있는 동안에 A가 丁으로부터 Z 토지를 취득한 경우, 丙은 Z 토지에 설정된 위 저당권에 관하여 대위의 부기등기를 하지 않더라도 A에 대하여 甲을 대위할수 있다.",false,"공동저당에서 자기 소유 부동산이 먼저 경매된 물상보증인이 다른 부동산에 미리 대위의 부기등기를 하지 않은 사이에 제 3 취득자가 부동산을 취득하면 482조 2항 5호 단서가 적 용되어 대위 X [90 다카 10305] → 위 판결은 편의상 채무자 소유 및 물보 소유 사안으로 설명되지만 실제 사안은 ‘물보 1 소유 및 물보2 소유 사안으로서. ‘울보 소유물이 경매되어 물보가 나머지 목적물에 변제자대위를 하기 위해서는 제3 취득자의 등장 전에 부기등기를 해야 한다는 법리 ’는 그 나머지 목적물이 채무자 소유물이든 물상보증인 소유물이든 달라 질 것이 아님(다만 전자는 채무자에 대한 변제자대위, 후자는 법정대위자 상호간의 변제자 대위인차이일뿐).","변제"],[283,"甲은 2020. 8. 11. 乙과 대출계약을 체결하면서 乙에 대한 채권을 담보하기 위하여 乙 소유의 X 토지에 채권최고액 12억 원의 근저당권을 설정하였고, 丙과 丁이 乙의 부탁을 받아 甲과 연대보증계약을 체결하였다 甲은 乙이 위 채무를 변제하지 않자 2023. 1. 23. X 토지에 관하여 위 근저당권에 기한 임의경매를 신청하였고, 경매신청 시 甲의 乙에 대한 채권액은 12억 원이었다 경매절차 진행 중 丙은 4억 원, 丁은 2억 원을 각 甲에게 변제하였고, 그에 따라 甲 으로부터 근저당권 일부의 이전등기를 받았다 甲은 경매신청 후 2023. 5. 12. 乙에게 3억 원을 추가로 대여하였고, 경매절차에서 戊가 X 토지를 9억 원에 매수하여 2023. 8. 18. 그 대금을 완납하였다 위 경매절차에서 甲 丙. 丁에게 각 배당될 금액의 조합으로 옳은 것은? （이자 와 지연손해금, 집행비용은 고려하지 않음, 다툼이 있는 경우 판례에 의함) 빠 정답 : 갑 6억 원, 丙 2억 원, 丁 1억 원.",true,"근저당권자 스스로 경 매신청하면 경매신청 시에 피담보채무 원본 확정되므로 사안에서 甲이 경매를 신청한 후 추가 대출한 3억 원은 X 토지의 근저당권으로 배당받을 수 없고, 결 국 甲은 12억 원을 배당받을 수 있음, 한편 丙 • 丁은 연대보층인으로서 각 4억 원. 2억 원 씩 변제 했으 니 변제자로서 일부대위 가능, 그러나 일부대위자와 채권자 사이 관계에 대하여 통설 • 판례는 채권자우선설 → 결론적으로 甲 은 12억 원 중 변제받은 6억 원을 제외한 [6억] 원을 우선배당받고, 경매대금에서 남는 3억 원(= 9억 —6억)은 丙. 丁이 변제한 금 액에 비례하여 각 [2억] 원. [1억] 원으로 배당받음 ※ 적용된 판례 원문은 다른 문제의 해설 참조.","변제"],[284,"채무를 변제할 정당한 이익이 있는 자가 채무를 대위변제한 경우에 통상 채무자에 대하여 구상권을 가짐과 동시에 변제자의 법정대위에 관한「민법」 제481조에의하여 당연히 채권자를 대위하나, 위 구상권과 변제자대위권은 별개의 권리이므로, 대위변제자와 채무자 사이에 구상금에 관한 지연손해금 약정이 있더라도이 약정은 변제 자대위권을 행사하는 경우에는 적용될 수 없다.",true,"물상보증인(연대채무자 1인)이 채무자(다른 연대채무자)를 위해 변제한 경우 구상권을가 짐과 동시에 당연히 채권자를 대우1 → 구상권과 변제자대위권은 원본 • 변제기 • 이자 • 지연 손해금 유무 등에 있어 내용이 다른 별개의 권리, 행사자 선택의 자유 [97 다 1556. 2013 다 214970] → 대위변제자와 채무자 사이에 구상금에 관한 지연손해금 약정이 있더라도 구상 금이 아닌 변제자대위 권 행사할 경우에는 적용되지 X [2005 다32418].","변제"],[285,"변제할 정당한 이익이 있는 자가 채무자를 위하여 근저당권의 피담보채무의 일부를 대위변제한 경우에 대위변제지는 피담보채무의 일부 대위변제를 원인으로한 근저당권 일부이전의 부기등기의 경료 여부와 관계없이 변제한 가액의 범위 내에서 종 래 채권자가 가지고 있던 채권 및 담보에 관한 권리를 법률상 당연히 취득하게 되는 것이므로, 이러한 경우에 대위 변제자는 위 채권자보다 우선하여 배 당받는다.",false,"근저당권’의 피담보채권 확정 전( = 거래관계 종료 전)에 그 채권의 일부를 앙도 • 대위변제한 경우 근저당권이 양수인 • 대위변제자에게 이전 할 여지 X → 그러나 피담보채권 확정.","변제"],[286,"□. * 채무자 소유 부동산과 물상보증인 소유 부동산에 공동근저 당권을 설정한 채권자가 채무자 소유 부동산에 대한 담보를 상실 하게 하거나 감소하게한 경우, 공동근저 당권자는 물상보증인 소유 부동산에 관한 경매절 차에서 물상보증 인이 담보 상실 내지 감소로 인한 면 책을 주장할 수 있는 한도에서, 물상보증인 소유 부동산의 후순 위 근저 당권자에 우선하여 배 당받을 수 없다.",true,"채무자 및 물상보층인 각 소유 부동산의 공동근저당권자가 채무자 소유 부동산 담보를 상실 • 감소케하면, 물상보증인은 그로 인해 상환받을 수 없는 한도에서 면책 0 → 물상보증인의 변제자대위 기대권은 485조로 보호 →이 경우 물보 소유 부동산 경매절차에서, 공 동근저당권자는 위 물보의 면책 주장 한도에서 물보 소유 부동산의 후순위 근저당권자에 우선하여 배당 X [2017 다 292756].","변제"],[287,"丙이 보증채무를 모두 변제하였다, 丙이 X 토지상의 근저당권에 관하여 자신의 명의로 부기등기를 경료하지 않고 있는 사이에 乙은 다시 丁으로부터 금원을 차용 하고 丁 에게 제 2순위 근저 당권을 설정하여 주었다. X 토지가 경 매되는 경우 丙이 변제사실을 증명하여 배 당요구하면 丙은 丁보다 우선하여 배 당받을 수 있다.",true,"저당 부동산에 대하여 후순위 저당권을 취득한 제 3 자는 제3 취득자 X → 보증인은 미리 대위 부기등기 없었어도 후순위 저당권자에 대하여 대위 0, 후순위 저당권자도 보증인에 대하여 대위 0 → 저당부동산에 소유권 • 지상권 • 전세권을 취득한 제3 취득자는 364조, 367조 등 이익보호 규정 있으므로 482조 2항 1, 2호가 제3 취득자보다 보증인을 보호한 취 지였는대 후순위 저당권을 취득한 자는 이익 보호 규정 無 [2012 다48855] 다만 예외적으로 선순위 저당권등기 ‘불법 말소 후 새로 저당권 취득한 자는 제3 취득자에 포함시키는 해석을 하였음 [2011 다30666].","변제"],[288,"물상보증인 소유 부동산과 채무자 소유 부동산에 공동저당이 설정된 경우, 물상보증인이 저당권의 실행으로 그 소유권을 잃은 때에는 채무자로부터 담보부동산을 취득한 제 3자에 대하여 구상권의 범위 내에서 위 각 부동산의 가액에 비례하여 채권 자를 대위할 수 있다.",false,"물상보증인이 채무 변제나 담보권 실행으로 소유권 잃은 때에는 보증인과 마찬가지로 제 3 취득자에 대하여 구상권 범위 내 채권자를 대위 O, 그러나 제 3 취득자는 채무 변제나 담보 권 실행으로 소유권 잃더라도 물상보증인에 대하여 채권자를 대위 X → 370조 · 341조는.","변제"],[289,"변제 자가 주채무자인 경우 보증인이 있는 채무와 보증인이 없는 채무 사이에 변제이익은 같으며, 변제자가 채무자인 경우 물상보증인이 제공한 물적 담보가 있는 채무와 그러한 담보가 없는 채무 사이에도 변제이 익의 차이는 없다.",true,"보증인이 있는 채무와 없는 채무, 물상보증인 제공 물적 담보가 있는 채무와 없는 채무는 변제이익 차이가 없고 동일함 [2013 다8250].","변제"],[290,"乙의 甲 에 대한 금전채무를 담보하기 위 해 乙의 부동산과 丙의 부동산에 甲 명의의 공동저당권을 설정하였고이후 丙의 부동산에 丁 명의의 소유권이전등기청구권 가등기가 설정된 경우, 丙의 부동산에 경매가 실행되어 배 당이 이루어 졌으나 乙의 채무 일부가 여 전히 남아 있는 상 태라면 丁은 乙의의 사에 반하여 乙의 甲 에 대한 채무 잔액을 대위변제 할 수 있다.",false,"공동저당에서 물상보증인 소유 후순위담보권자는 공동저당권자가 물보 소유물에서 배당 받고 남은 채무를 채무자 의사에 反하여 대위변제할 이해관계 X •.• 물상보증인이 대위취득한 채무자 소유 부동산에 대한 공동저당권자의 저당권을 후순위담보권자가 울상대위 할 수 있으므로 집행 받거나 권리 잃을 지위 없음 [2008 마 109] → 해당 사안에서 후순위담보 권자가 소유권이전청구권 가등기를 마친 자였음.","변제"],[291,"乙의 甲 에 대한 금전채무를 담보하기 위해 乙의 부동산과 丙의 부동산에 甲 명의의 누적적 근저당권을 설정하였고 丙의 부동산에 경매가 실행되어 甲이 그 매각 대 금에서 변제를 받은 경우, 丙은 甲의 乙의 부동산에 관한 근저당권을 대위 취득하여 행사할 수 있다.",true,"개 기본계약에서 발생하는 동일한 채권을 담보하기 위해 여러 부동산에 근저당권 설정하 면서, 각 근저당권 채권최고액 합한 금액을 우선변제받기 위해 ‘공동근저당권’ 형식 아닌 ‘개별 근저당권’ 형식 취하면 누적적 담보 0, 368조 X → 동시 • 이시배당 선택 0, 최고 액 범위에서 피담보채권 전부 • 일부 우선변제 받은 E梧戶괴담보채권 소멸 할 때까지 나머지 근저당권 실행하여 그 근저당권의 최고액 범위에서 다시 반복하여 우선변제 0 → 채무자 물상보증인 각 소유 부동산에 누적적 근저당권 설정받고 물보 소유 부동산 먼저 겅매되어 변제받은 경우, 물상보증인은 채무자에 대해 구상권 취득 및 변제자대위권으로 종래 채권자 보유하던 채무자 소유 부동산에 관한 근저당권 대위취득 행사. [2014 다51756].","변제"],[292,"근, 수급인이 공사대 금의 지급에 갈음하여 도급인과 수급인이 완공한 건물을 대 물변제 받기로 약정한 경우, 도급인이 수급인에게 공사대 금을 지급하였 더 라도 수급인은 위 대 물변제계약에 기하여 그 건물에 대한 소유권이전등기를 청구할 수 있다.",false,"대물변제는 ‘이행을 해야 ‘성립하는 요물계약 → 대물변제 성립 전에 본래 급부 내용대로 이행하는 변재했다면 채무 소멸 대물변제 불성립 → 대물변제 이행청구 X.","변제"],[293,"대위변제의 정당한 이익을 갖는 자가 있다는 사정만으로 채권자가 자신의 채권 이나 담보권을 성실히 행사하여야 할의무를 부담한다고 할 수는 없으므로, 특단의 사정이 없는 한 채권자가 자신의 채권 이나 담보권을 행사하지 않거나 포기하였다고하여 이를 불법행위에 해당한다고 할 수는 없다.",true,"담보권 행사는 채권자의 선택이므로, 법정대위자가 있다고 하더라도 채권자가 자신의 채권 이나 담보권을 성실히 행사할 의무 X 채권 • 담보권의 불행사 • 포가가 485조 면책이 적용 되는 것은 별론으로 해도 불법행위는 X [2001 다42677].","변제"],[294,"근저당권의 피담보채권의 일부를 대위변제한 경우, 피담보채권이 확정되기 전이라면 대위 변제 자는 채권자를 대위 할 수 없다.",true,"근저당권’의 피담보채권 확정 전( ＝ 거래관계 종료 전)에 그 채권의 일부를 양도 대위변제한 경우 근저당권이 양수인 • 대위변제자에게 이전할 여지 X → 고러나 피담보채권 확정 되면 최고액 초과하지 않는 한 근저당권’이나 ‘ 경락대금에 대한 권리’ 중 그 ‘ 피담보채권액을 담보하고 남는 부분은 저당권의 일부이전 부기등가의 경료 여부와 관계없이 대위변제 자에게 법률상 당연히 이전. [2001 다53929] → 확정되어야 이전하고 그 경우에도 일부 대위변제자보다 채권자가 우선변제권 있음.","변제"],[295,"보증 인이 채무자 소유 부동산에 설정된 선순 위저당권의 피담보채권을 대위변제한 경우, 대위의 부기 등기가 없다면 저당부동산의 후순 위저당권자에게 변제자대위 를주장할수 없다.",false,"저당 부동산에 대하여 후순위 저당권을 취득한 제3자는 제 3 취득자 X → 보증인은 미리 대위 부기등기 없었어도 후순위 저당권자에 대하여 대위 0, 후순위 저당권자도 보증인에 대하여 대위 0 → 저당부동산에 소유권 • 지상권 • 전세권을 취득한 제3취득자는 364조, 367조 등 이익보호 규정 있으므로 482조 2항 1, 2호가 제 3 취득자보다 보층인을 보호한 취 지였는대 후순위 저당권을 취득한 자는 이익 보호 규정 無 [2012 다48855].","변제"],[296,"공동저당의 목적인 물상보증인 소유의 부동산에 후순 위로 담보가등기를 설정 받은 자는 그 부동산에 대하여 먼저 경매가 실 행되어 공동저당권자가 매각대금 전액을 배당받았으나 채무의 일 부가 남아 있다면 채무자의 의사에 반하여 채무 잔액을 대위변제 할 수 있다.",false,"공동저당에서 물상보증인 소유 후순위담보권자는 공동저당권자가 물보 소유물에서 배당받고 남은 채무를 채무자 의사에 反하여 대위변제 할 이해관계 X, 단지 사실상 이해관계에 불과함 ? 물상보증인이 대위취득한 채무자 소유 부동산에 대한 공동저당권자의 저당권을 후순위담보권자가 물상대위 할 수 있으므로 집행 받거나 권리 잃을 지위 없음 [2008 마 109).","변제"],[297,"채무자와 물상보증인 소유 부동산이 공동담보로 제공된 경우, 채무자로부터 담보부동산을 취득한 제 3자가 채무를 변제하였다면 물상보증 인에 대하여 담보부동산의 가액에 비례하여 채권자를 대위 할 수 있다.",false,"己 지문 관련 : 482조 2항에 물상보증안과 제3 취득자 상호간 변제자대위에 관하여 규정 無 물상보증인이 채무 변제나 담보권 실행으로 소유권 잃은 때에는 보증인과 마찬 가지로 제 3 취득자에 대하여 구상권 범위 내 채권자를 대위 0, 그러나 제3 취득자는 채무 변제나 담보권 실행으로 소유권 잃더라도 물상보증인에 대하여 채권자를 대위 X → 370조 · 341조는 물상보증인에게 보증인의 구상권 준용 인정, 482조 2항 5호는 보증인 물상 보증인을 인원수 비례로 대위하게하여 우열 X, 만일 물상보증인 • 제3 취득자 상호간 각 부동산 가액 비례로 대위하게하면 우연한 사정으로 뜻밖의 손해 • 이익을 주어 부당 482조 2항 1, 2호 [ 2011 다50233).","변제"],[298,"변제공탁의 요건 중 ‘ 변제자가 과실 없이 채권자를 알 수 없는 경우’라 함은 객관적으로 채권자 또는 변제수령권자가 존재하고 있으나 채무자가 선량한 관리자의 주의를 다하여도 채권자가 누구인지를 알 수 없는 경우를 말한다.",true,"[2000 다55904].","변제"],[299,"변제공탁의 목적인 채무는 현존하는 확정 채무일 필요는 없으므로 장래의 채무나 불 확정채무도 변제공탁의 목적이 될 수 있다.",false,"변제공탁의 목적 채무는 현존하는 확정채무여야 → 장래 채무나 불확정채무는 원칙적 변제공탁 X 각 채권자의 채권이 모두 동일한 채권일 필요는 없음 [2014 다207245] → 공탁은 ‘ 전액을 공탁해야 효력이 있다는 점을 생각하면 당연함.","변제"],[300,"채권자의 태 도로 보아 채무자가 설사 채무의 이행제공을 하였더라도 그 수령을 거 절하였을 것이 명백한 경우에는 채무자는 이행의 제공을 하지 않고 바로 변제공탁 할 수 있다.",true,"[93 다42276] → 위 경우는 구두제공 조차 필요 없이 채무불이행 면하고 공탁 가능.","변제"],[301,"변제공탁이 적법한 경우에는 채권자가 공탁물 출급 청구를 하였는지와 관계없이 공 탁을한 때에 변제의 효력이 발생한다. ® 공탁물 출급청구권과 공탁물 회수청구권은 서로 독립한 별개의 청구권이므로 공탁 물 출급청구권에 대한 압류는 공탁물 회수청구권에 대하여 영향을 미치지 않는다.",true,"지문 : 변제공탁 적법하면 채권자 출급 여부 관계없이 공탁한 때 변제 효력 발생 그러나 제 3자(피공탁자 포함)가 공탁자에 대해 가지는 별도 채권의 집행권원으로써 공탁 자의 공탁물 회수청구권에 대해 압류 • 추심명령 받아 그 집행으로 공탁물 회수하면 채권 소멸 효력은 소급하여 없어짐 → 부적법 변제공탁으로 변제 효력 발생 않았더라도 피공탁 자는 수락하여 출급청구하는 대신 공탁자에 대한다른 채권에 기해 공탁자의 회수청구권에 압류 • 추심명령 받아 그 집행으로 공탁물 회수 0 → 출급청구권에 대한 압류는 회수청 구권에 아무런 영향 X → 공탁물 ‘출급청구권’과 ‘회수청구권’은 서로 독립한 별개 청구권 [2018 마5697].","변제"],[302,"공동불법행위자 중 1 인이 피해자로부터 손해배상채무를 면제받았더라도 다른 공동불법행위자는 피해자에 대한 채무 전부를 이행하여야 한다.",true,"공동불법행위자 1인의 구상권 행사에 대해 다른 공동불법행위자는 자기의 채무가 면제되었음을 이유로 거절할 수 X → 연대채무 채무면제419조는 공동불법행위자 상호간 부진 정연대채무에 적용 X 효력 미치지 X [79 다 1107].","변제"],[303,"이 2:1 인데 甲이 A로부터 1억 5 천만 원의 범위에서 채무를 면제받은 경우, 乙의 A 에 대한 채무 액은 2억 5 천만 원으로 감소한다.",true,"채권자가 연대채무자 중 1인의 채무를 일부’ 면제한 경우도 특별한 사정이 없는 한 면제된 부담부분에 한하여 419조 먼제의 절대적 효력 0 → 피면제자의 잔존 채무액이 부담부 분을 초과한다면 다른 연대채무자는 채무 전액 부담해야 •. • 피면제자의 부담부분 감소 없으므로 / 피면제자의 잔존 채무액이 부담부분보다 적다면 그 차액(= 부담부분 잔존 채무액) 범위에서 면제의 절대적 효력 발생하여 다른 연대채무자의 채무가 차액만큼 감소. [2019 다216435] → 설문에서 甲 乙의 부담부분은 2억, 1억인데. A가 甲의 채무 3억 중 1.5억을 면제해주연 甲의 부담부분 2억 중에서 O, 5억이 소멸하여 1.5억이 남는 것이므로 乙의 채무액은 甲의 소멸된 부담부분(＝ 부담부분 잔존 채무액)인 O, 5억 소멸하여 2.5억이 남게 됨.","대물변제"],[304,"지명채권 양수인이 ‘양도되는 채권의 채무자’인 때에는 채권양도에 따른 처분행위 시 채권과 채무가 동일한 주체에 귀 속한 때에 해당하므로 채권이 혼동에 의하여 소멸한다.",true,"지명채권 양수인이 ‘양도되는 채권의 채무자 여서 507조 본문에 따라 채권이 혼동으로 소멸한 후’ 에 채권 압류 등이 송달되면 압류 등은 무효, 이때 압류채권자는 450조 2항 제 3 자 X → 450조 2 항의제 3 자 대항요건은 앙도된 채권이 존속하는 동안에 앙립할 수 없는 제3자 있어야 적용, 존재 않는 채권에 대한 압류 등은 무효, 채권양도는 대항요건 갖추지 못해도 양수인에게 채권 이전 채권양도에 따른 처분행위 시 혼동으로 소멸한 것 [2019 다 272855] 근 C. 항의 채권양도 당시 확정일자 있는 증서에 의한 대항요건을 갖추지 못한 경우, 그 후 그 채권에 관해 이루어진 가압류 결정을 송달받은 제 3채무자(지명채권 양수인)는 가압류채권자에게 혼동으로 대항하지 못한다. ( X ).","대물변제"],[305,"변제공탁의 효력이 발생하기 위해서는 채무 전부에 대한 변제의 제공 및 채무전 액에 대한 공탁이 있어야 하지만, 채무 일부에 대한 공탁이 있는 경우 채권자가 공 탁금을 채권의 일부에 충당한다는 유보의 의사표시를 하고 이를 수령한 때에는 그 공탁금은 채권의 일부의 변제에 충당된다.",true,"일부공탁 X → 전부무효 O, 채무 일부소멸 효과도 없음 [2005 다37208] → 그러나 금액 다툼 있는 채권에 대하여 채무자가 전액임을 밝히고 공탁했는데 채권자가 일부로서 수령 한다는 명시 • 묵시적 유보 의사표시 없이 수령했다면 전부공탁 효력 0, 채무 전부소멸. [83 다카88] → 채권자가 일부에 충당한다는 유보 의사표시하고 수령했다면 채무 일부 변제충당(채무 일부소멸) [2008 다51359].","대물변제"],[306,"甲이 乙 에 대한 공사대금채권의 일부를 丙 에게 양도하고 통지한 후 丙이 乙 에게 양수금의 지급을 청구하자 乙이 甲에 대한 하자보수에 갈음한 손해배상채권으로써 상계를 주장하였다.",true,"채권양도 동일성, 451조 2 항을 고려하면 채무자의 양도인에 대한 자동채권의 발생 기초 원인이 앙도 전에 이미 성립하여 존재하고, 자동채권과 수동채권이 서로 동시이행 관계에 있는 경우에는, 양도통지가 채무자에게 도달하여 대항요건이 갖춰진 후에 자동채권이 발생했더라도 채무자는 동시이행항변권을 주장할 수 있고 따라서 상계로 대항. [2014 다 80945] - 도급계약의 공사대금채권의 양도통지 후에 도급인에게 하자로 인한 손해배상 청구권 발생한 경우임에도 도급인(채우자活? 양수인에 대하여 상계 0 → 667조 3항.","대물변제"],[307,"丙이 乙의 甲에 대한 공사대금 채권에 대하여 2023. 4. 1. 압류 및 전부명 령을 받고 그 다음 날 甲, 乙 에게 위 압류 및 전부명령이 모두 송달되어 확정된 경우, 甲이 위 압류 및 전부명령을 송달받기 전에 乙에 대한 대여금 채권을 가지고 있었고 그 대여금 채권의 변제기가 2023. 8. 1.이라면 甲은 乙에 대한 대여금 채권을 자동 채권으로하여 丙의 전부금 채권과 상계할 수 있다.",true,"(가)압류명령 받은 제3채무자가 압류채무자에 대한 반대채권을 가지고 있는 경우 상계로써 (가)압류채권자에게 대항하려면 ® (가)압류 효력 발생 당시에 양 채권이 상계적상 있거나. ® 당시 자동채권이 변제기에 이르지 않았다면 수동채권(피압류채권)의 변제기와 동시에 또는 보다 먼저 변제기에 도달하는 경우여야 [2011 다45521 ] → 소위 변제기 선도래설로서, 사안에서 甲의 채권은 乙의 채권에 대한 압류 송달 당시 (23. 4. 2. ）에 고 변제기 (23. 8. 1.)가 도래하지 않았으나 그것이 압류된 乙의 채권의 변제기 (23. 9. 1. 완공시)보다 더 먼저이므로 甲은 丙과 상계 0 ® 乙이 2023. 10. 1. 丙에게 甲에 대한 공사대금 채권을 양도하고 2023. 11. 1. 甲에게 확정일자 있는 증서에 의한 양도통지가 도달한 경우, 丙이 양수금 채권으로 甲의 丙에 대한 2023. 9. 1.이 변제기인 대여금 채권과 상계한다면 그 상계적상일은 2023. 11. 1. 이다.","대물변제"],[308,"乙이 2023. 4. 1. 丙에게 甲 에 대한 공사대금 채권을 양도하고 그 다음 날 甲 에게 확정일 자 있는 증서에 의한 양도통지가 도달한다음, 乙의 채권자 丁이 2023. 5. 1. 乙의 甲 에 대한 공사대금 채권에 대하여 압류명령을 받은 경우, 그 후 乙의 다른 채권자인 戊가 제기한 사해행위취소소송에 의하여 위 채권양도가 취소 되었다면 위 압 류명령은 장래에 乙에게 원상회복될 공사대금 채권에 대한 것으로서 유효하다.",false,"압류 및 추심명령 당시 피압류채권이 이미 대항요건 갖춰 앙도되어 고 명령이 무효로 되었다면 그 후 사해행위취소소송에서 채권양도계약이 취소되어 채권이 원채권자에게 복귀하였더라도 이미 무효로된 압류 및 추심명령이 다시 유효로 될 수는 X._. 사해행위취소의 상대효 및 비소급효 [2019 다235702. 2022 다247521 ] → 丁이 받은 압류명령은 丙에 대한 채권양도의 확정일자 있는 통지 도달일 (23. 4. 2. )보다 늦게 송달(23. 5. 1. ）되어 무효이고, 그 후 위 채권양도의 사해행위취소 여부는 그러한 압류명령 무효사실에 영향을줄수 없음.","상계"],[309,"丁 전부명령이 甲 에게 송달된 때에 소급하여 전부된 채권 부분과 전부되지 않은 채권 부분에 대하여 丁과 乙 에게 분할채권이 성립하게 된다.",true,"가분적인 금전채권의 일부에 대한 전부영령이 확정되면 특별한 사정이 없는 한 전부명령이 제3 채무자에 송달된 때에 소급하여 전부된 채권 부분과 전부되지 않은 채권 부분에 대하여 각기 독립한 분할채권이 성립 [ 2007 다35152].","상계"],[310,"타 * 丁의 전부금청구에 대하여 甲이 乙 에 대한 구상금채권으로 상계 항 변을하는 경우, 자동채권인 甲의 乙 에 대한 구상금채권은 丁의 압류 명 령이 甲에게 송달된 후 발생한 것이므로 甲은 위 구상금채권에의한 상계로 丁 에게 대항할 수 없다.",false,"위 지문 亡. 해설 참조.","상계"],[311,"임대인은 임대차 존속 중 차 임 채권의 소멸시효가 완성된 경우 이를 자동채권으로 삼아 임 대차보증금 반환채무와 상계 할 수 없으나,「민법」 제495조의 유추적용에 의하여 그 연체 차 임을 임 대차보증금에서 공제 할 수는 있다.",true,"임대차보증금반환채무는 임대차계약 종료된 때 이행기 도달 → 임대차 존속 중 차임채권 소멸시효완성된 경우, 시효완성 전 임대인이 보층금반환채권의 기한이익 실제로 포기 했다는 등 특별한 사정 없는 한 상계적상 X → 임대인은 495조 의한 상계 X → 그러나 495조 유추적용 의한 공제 0 → 임대인 신뢰 임차인 묵시 의사 [2016 다211309].","상계"],[312,"(:E’ 근로자의 경제생활 안정을 해 할 염려가 없는 등 특별한 사정이 있어 시용 자가 초과 지 급된 임금의 부당이득반환청구권으로 근로자의 임 금채권과 상계 할 수 있는 경우에도, 이러한 사용자의 상계는 임 금채권의 2분의 1을 초과하는 부분에 관하여 만 허용된다.",true,"민사집행법 246조 1항 4호는 근로자의 임금채권 등의 1/2 금액은 압류금지채권으로 정하고, 민법 497조는 압류금지채권의 채무자의 상계를 금지 → 사용자가 계산 착오 등으로 초과 지급한 임금 상당 부당이득반환채권을 자동채권으로 근로자의 임금채권을 상계하는 것도 1/2 초과 부분만 허용 [2007 다90760].","상계"],[313,"채권양수 인이 양수채권을 자동채권으로하여 채무자가 양수 인에 대해 가지고 있 던 기 존 채권과 상계한 경우, 채권 양도 전에 이미 양 채권의 변제기가 도래하였다 고 하더 라도 상계의 효력은 변제 기가 아니라 채권 양도의 대항요 건이 갖추 어진 시점 으로소급한다.",true,"채권양수인이 앙수채권을 자동채권으로 채무자가 채권양수인에 대해 가진 기존 채권과 상계한 경우, 상계적상일은 채권양도 전에 0| 미 도래한 양 채권의 변제기 X, 채권양도 대항 요건 갖춘 시점 0 → 493조 2항 ‘각 채무가 상계할 수 있는 때에 비추어 상계적상은 자동 채권과 수동채권이 상호 대립하는 때에 비로소 발생, 채권양수인은 채권양도 대항요건이 갖춰진 때 비로소 자동채권 행사 가능 (2022 다200089].","상계"],[314,"己 * 임대인이 임 차인에 대해 갖고 있던 대여금채권의 소멸시효가 임대차 존속 중 완성 되었다면 임대인은 위 채권을 자동채권으로하여 임차 인의 임대인에 대한 유 익 비 상환채권과 상계 할 수 없다.",true,"유익바상환채권은 임대차계약 종료한 때 비로소 발생 → 임대차 존속 중 임대인 구상금.","상계"],[315,"甲의 乙 에 대한 고의의 행위가 불 법행위를 구성함과 동시에 채무불 이행을 구성하는 경우, 甲이 위 채무불이행으로 인한 손해배상채권을 수동채권으로하여 甲의 乙 에 대한 대여금채권과 상계를하는 것은 허용된다.",false,"조는고의 불법행위에 적용, 고의 채무불이행에는 적용 X. 그러나고의 행위가불법행위 및 채무불이행을 구성하여 앙 손해배상채권이 경합한 경우는 고의 채무불이행으로 인한 손해배상채권을 수동채권으로 해도 유추적용 0, 채무자의 상계 X → 손해배상채권이 현실적 만족 받아야하는 취지 동일 (2014 다 19783].","상계"],[316,"부진정연대채무자 甲과 乙 중 甲이 자신의 채권자에 대한 반대채권으로 상계한 경우, 상계로 인한 채무소멸의 효력은 소멸한 채무 전액에 관하여 乙 에게도 미친다.",true,"부진정연대채무자 중 1인이 채권자에 대한 반대채권으로 상계한 경우 채무소멸 효력은다 른 부진정연대채무자에게 미치는 절대효. ’ 변제 • 대물변제 • 공탁과 동일하게 채권은 현실 적 만족 얻어 목적 달성 → 다른 채무자의 악의 여부 불문. 1인이 ‘상계계약한 경우도 마찬 가지 (2008 다97218].","상계"],[317,"매도인이나 수급인의 담보책임을 기초로한 손해배상채권의 제척기간이 지난 경 우에도 제척기간이 지나기 전 상대방의 채권과 상계할 수 있었다면 매수인이나도 급인은 위 손해배 상채권을 자동채권으로 해서 상대방의 채권과 상계 할 수 있다.",true,"매도인 • 수급인의 담보책임 기초한 매수인 • 도급인의 손해배상채권이 제척기간 지난 경우도 495조 유추적용 0 → 매수인 • 도급인은 제척기간 경과 전에 상대방 채권과 상계할 수 있었다면 제척기간 경과 후에도 상계 0 → 당사자들이 채권 • 채무 정산을 기대한 신뢰보호 필요는 소멸시효와 동일 [2018 다255648].","상계"],[318,"가분적인 금전채권의 일부에 대한 전부명령이 확정되면 특별한 사정이 없는 한 전부된 채권 부분과 전부되지 않은 채권 부분에 대하여 각기 독립한 분할채권이 성립하게 되므로, 그 채권에 대하여 압류채무자에 대한 반대채권으로 상계하고자하는 제 3 채무자로서는 각 분할채권 액의 채권 총액에 대한 비율에 따라 상계하여야 한다.",false,"채권의 일부양도 있으면 각 분할된 부분에 독립한 분할채권 성립 → 채무자는 양도인에 대한 반대채권으로 양도인을 비롯한 각 분할채권자 누구든 상대방으로 삼아 상계 0 → 분 할채권자인 양수인이 대항요건을 갖추었다고 하더라도 다른 부분에 먼저 상계 혹은 비율에 따라 상계되어야 한다는 이의 X [2000 다50596] → 채권 일부에 대한 전부명령이 내려 진 경우도 마찬가지 [2007 다35152] → 다만 채권양도와 상계, 지급금지명령과 상계라는 쟁점의 요건은 모두 갖춘 것을 전제로 함.","상계"],[319,"제 3채무자의 채무자에 대한 자동채권이 수동채권인 피압류채권과 동시 이행의 관계에 있는 경우에는, 압류명령이 제 3 채무자에게 송달되어 압류의 효력이 생긴 후에 자동채권이 발생하였다고 하더라도, 제 3채무지는 그 채권에 의한 상계로 압류채권자에게 대항할 수 있다.",true,"제3채무자의 압류채무자에 대한 자동채권이 수동채권(피압류채권)과 서로 동시이행 관계 면 가압류명령 송달 이후 생긴 자동채권이어도 제3채무자는 동시이행 항변 0 → 그 상계로써 압류채권자에게 대항 0 →이 경우 자동채권 발생의 기초 원인은 수동채권 가압류 전에 이미 성립 • 존재하고 있었으므로, 그 자동채권은 498조의 ‘지급금지명령을 받은 후에 취득한 채권’에 해당하지 X [2000 다43819].","상계"],[320,"유치권이 인정되는 아파트를 경매로 매수한 자는 아파트 일부를 점유 • 사용하고 있는 유치권자에 대한 임료 상당의 부당이득금 반환채권을 자동채권으로하여 유치 권자가 종전 소유자에 대하여 가지는 유익비상환채권을 상계할 수 있다.",false,"유치권자가 있는 아파트의 경락인은 유치권자에 대한 차임 상당 부당이득반환채권을 자동 채권으로 하고 유치권자의 종전 소유자에 대한 유익비상환채권(피담보채권漏: 수동채권으로하여 상계 X → 수동채권으로 상대방의 상계자에 대한 채권이 아닌 제3자에 대한 채권을 허용하면 상대방이 제 3 자로부터 현실급부 받을 이익 침해, 상계자만 독점 만족을 주 어 부당 [2010 다 101394].","상계"],[321,"고의로 인한 불법행위나 중과실로 인한 불법행위 모두 피해자에게 현실의 변제를 받을 수 있도록 할 필요성은 동일하므로, 고의의 불법행위로 인한 손해배상재권에 대한 상계금지는 중과실의 불법행위로 인한 손해배상채권의 경우에도 적용할 수 있다.",false,"조 고의 불법행위자의 상계금지가 보복적 불법행위 유발금지, 사회적 정의관념의 제도 적 취지를 가지는 점을 고려할 때 중고玲! 불법행위까지 유추 • 확대 적용 X → 중고塩! 불법행위자는 상계. [93 다52808].","상계"],[322,"도급인의 지체상금채권과수급인의 공사대금채권은서로동시이행 관계에 있으므 로, 현실적으로 이행하여야 할 필요가 있는 경우가 아닌한 상계가 가능하다.",false,"지체상금채권과 공사대금채권은 특별한 사정 없는 한 동시이행 X [2013 다81224] → 따라서 甲이 채권양도 통지를 받은 후에 乙에 대한 지체상금채권이 생긴 경우에는, 丙의 甲에 대한 앙수금청구(혹은 하도급법상 직접지급청구)에 대하여 甲이 지체상금채권을 가지고 상계 불허(동이항 관계에 따른 예외 주장 X ).","상계"],[323,"임대인으로서는 임대차계약이 존속 중이더라도 임대차보증금반환채무에 관한 기한의 이익을 포기하고 임차인에 대한 차임채권 또는 목적물의 멸실 훼손으로 인한 손해배상채권을 자동채권으로 하고 임차인의 임대차보증금반환채권을 수동재권 으로하여 상계 할 수 있다.",true,"임대차보증금반환채무는 임대차계약 종료시점에 이행기 도달 임대인은 임대차계약 존속 중 그 기한이익 포기하고 차임채권 등과 상계. [2015 다252501 ].","상계"],[324,"상대방의 기망행위로 소비대차계약을 체결한 채권자가 계약상 채권에 기하여 대 여금 및 이자 등의 지급을 청구한 경우에도 불법행위로 인한 손해배상을 청구한 경 우와 마찬가지로 민법 제496조가 유추적용되어 상대방은 상계로 채권자에게 대항 할수 없다.",false,"상대방 기망으로 소비대차계약 체결한 자가 불법행위 손해배상청구 하지 않고 계약상 채권 따른 대여금 • 이자 지급 구하면 496조 유추적용 X._. 계약상 채권은 기망행위 아닌 쌍 방 계약 기초 발생 권리로서 급부이행이 지향하는 경제적 이익이 불법행위 손해배상채권과 달라 양자 경합 X, 496조 취지(보복적 불법행위 지양, 피해자 현실 변제받도록, 고의 불법행위자 제재로 발생 억지, 사회적 정의 관념)， 실질적 고의 불법행위 채권과 마찬가지로 볼 수 X [2024 다204696].","상계"],[325,"공제도 복수 채권 • 채무의 상호 정산을 내용으로하는 채권소멸 원인이라는 점에서 상계와 유사하므로, 원칙적으로 상계적상, 상계 금지나 제한, 상계의 기판력 등 상계에 관한 법률 규정이 유추적용된다.",false,"복수 채권 채무 상호 정산을 내용으로하는 채권소멸 원인이라는 점에서 ‘공제’와 ‘상계’ 는 유사 → 그러나 공제는 상계적상, 상계금지 저 I 한 상계 기판력 등 상계 법률 규정이 원 칙적으로 적용되지 않는 점, 임대차관계 등 특정 법률관계에서는 일정 사유가 발생하면 원 칙적 공제 의사표시 없이도 당연히 공제 이뤄진다고 보는 점 등에서 상계와 구별 제3자에 우선하여 채권 실질적 만족 얻게하는 점에서 상계보다 강한 담보적 효력 → 공제 •상계 요건 설정, 시점, 의사표시 요부 등은 자유롭게 약정. [2024 다227699].","상계"],[326,"甲의 기망행위로 소비대차계약을 체결한 乙이 계약상 채권에 따른 대여금의 지급을 구하는 경우, 甲은 위 대여금채권을 수동채권으로한 상계로 乙에게 대항하지 못한다.",false,"상대방 기망으로 소비대차계약 체 결한 자가 불법행위 손해배상청구 하지 않고 계약상 채권 따른 대여금 • 이자 지급 구하면 496조 유추적용 X [2024 다204696].","상계"],[327,"상속채권자가 피상속인에 대하여는 채권을 보유하면서 상속인에 대하여는 채무를 부담하는 경우, 상속채권자가 상속이 개시된 후 피상속인에 대한 채권을 자동채권 으로하여 상속인에 대한 채무에 대하여 상계하였더라도 이후 상속인이 한정승인을하면 상계는 소급하여 효력을 상실한다.",true,"상속채권자가 상속인에 대해 채무 부담하는데 상속 개시되면 상계 적상 0 → 한정승인 하 면 상속개시된 때부터 상속재산과 고유재산분리되 므로( 1031조) 상속채권자의 피상속인에 대한 채권과 상속인에 대한 채무 사이 상계는 제 3 자의 상계로서 상계 X → 상계 후 한정 승인 있으면 상계는 소급하여 효력 상실, 자동채권 및 수동채권 부활 [2022 다254154].","상계"],[328,"亡,「국세징수법点} 압류채권자가 채무자의제 3채무자에 대한 채권을 압류한 경우, 그 피압류채권에 대하여 이중압류 등이 없다면, 위 압류채권자는 피압류채권을 지동치] 권으로하여 제 3 채무자의 위 압류채권자에 대한 채권과상계할수 있다.",false,"국세징수법에 의한 채권압류 후 압류채권자는 피압류채권을 자동채권으로 제3채무자의 압 류채권자에 대한 채권과 상계 X 이중압류 배분요구 등 없더라도 마찬가지 : 법률규정 등 특 별한 사정 없는 한 자동채권은 상계자가 상대방에 대해 가지는 채권이어야(제3자가 상대방에 대해 가지는 채권은 X ). 압류채권자는 추심권 취득할 뿐 피압류채권이 압류채권 자에게 이전 귀속되지 않으므로 이는 압류채권자가 제3채무자에 대해 가지는 채권 X, 상계적상 X [2022 다218271].","상계"],[329,"공사도급계 약에서 선급금을 지급한 후 계약의 해지 등의 사유로 수급 인이 도중에 선급금을 반환하여야 할 사유가 발생하였다면, 특별한 사정이 없는 한 그 때까 지의 기성고에 해당하는 공사대금 중 미지급액은 선급금으로 당연충당된다.",true,"공사도급계약에서 수수되는 ‘ 선급금은 수급인 자금사정 고려하여 도급인이 장차 지급할 공사대금 미리 지급하는 것 → 전체 공사에 대한 공사대금 0, 구체적 기성고 공사대금 X → 해제해지로 도중에 선급금 반환하게 되면 특별한 사정 없는 한 별도 상계 의사표시 없이 선급금이 그때까지 기성고 해당 마지급 공사대금에 충당 0, 도급인은 나머지 공사대금 있다면 그 금액만 지급의무 부담 [2016 다267067] → 당연충당.","상계"],[330,"고의의 불법행위가 동시에 부당이득 원인을 구성하여 손실자가 이득자에게 부당이득반환청구권을 행사한 경우, 이득자는 손실자에 대한 채권을 자동채권으로하여 위 부당이득반환채권과 상계 할 수 있다.",false,"부당이득의 원인이 고의 불법행위에 기인, 불법행위로 인한 손해배상채권과 부당이득반환 채권이 경합한 경우, 피해자가 부당이득반환채권만 청구한 경우에도 496조 유추적용 0, 수익자(가해자)의 상계 X.: 청구의 실질적 이유는 고의 불법행위, 손해배상채권이 현실 적 만족 받아야 한다는 취지 동일 [2001 다52506].","상계"],[331,"채권이 물품 매매대금 채권 이고 2023. 7. 10. 까지 乙이 물품인도채무의 이행 또는 이행의 제공을 하지 않은 상태인 경우, 2023. 7. 10. 甲은 상계할 수 있으나 乙 은상계할 수 없다.",true,"채권은 동시이행항변권이 붙어 있으므로 그 채권자 乙이 자동채권으로는 상계 불허, 그 러나 그 채무자 甲이 동이항 포기하고 B 채권을 수동채권으로 상계함은 허용.","상계"],[332,"甲 에 대한 채권자 丙이 A 채권에 대하여 압류 및 전부명령을 받아 그 명령이 2023. 7. 3. 甲과 乙에게 송달되고 7. 10. 확정되었다면, 2023. 7. 12. 乙은 B 채권 으 가지고 丙 에게 전부된 A 채권과의 상계를 주장할 수 있다.",true,"압류명령 받은 제3채무자가 압류채무자에 대한 반대채권 가지고 있는 경우 상계로써 압류 채권자에게 대항하려면. ® 압류 효력 발생 당시에 양 채권이 상계적상 있거나. @ 당시 자 동채권이 변제기에 이르지 않았다면 수동채권(피압류채권)의 변제기와 동시에 또는 먼저 변제기에 도달하는 경우여야 [2011 다45521 ] → 변제기 선도래설 丙의 압류 및 전부명령이 23. 7. 3. 乙에게 송달될 당시 乙은 B 채권을 가지고 있었을뿐 아니라 변제기까지 도래한 상계적상 상태였으므로 乙은 상계로 丙에게 대항 O.","상계"],[333,"甲이 2023. 4. 6. 丁 에게 A 채권을 양도하고 같은 날 乙 에게 채권양도를 통지한 경우, 乙은 2023. 6. 9. B 채권에 의한 상계로써 丁 에게 대항할 수 없다.",false,"채무자가 통지를 받은 당시 이미 상계할 수 있는 원인이 있었던 경우는 아직 상계적상에 있지 않더라도 그 후 상계적상에 이르면 채무자는 양수인에 대하여 상계로 대항. [2017 다222962] → 제451조 제2항 채권양도와 상계’에 대한 해석은 통지 도달 당시 자동채권 변제기 도래는 불필요하고 발생만하면 충분하므로, 23. 4. 6. 통지 도달 당시 B 채권의 변제기 (23. 4. 7. 片三 도래하지 않아도 무방하고 B 채권이 성립하여 존재하기만 하연 충분(다 만 설문상 B 채권의 성립일을 알 수는 없고 그 전일 것으로 추정).","상계"],[334,"채권양수인이 양수채권을 자동채권으로하여 그 양수채권의 채무자가 채권 양수 인에 대해 가지고 있던 기존 채권과 상계하는 경우, 채권양도 전에 이미 양 채권의 변제기가 도래하였다면 상계의 효력은 변제기로 소급한다.",false,"채권양수인이 앙수채권을 자동채권으로 채무자가 채권양수인에 대해 가진 기존 채권과 상계한 경우, 상계적상일은 채권양도 전에 이미 도래한 양 채권의 변제가 X, 채권양도 대항 요건 갖춘 시점 O, 493조 2항 ‘각 채무가 상계할 수 있는 때에 비추어 상계적상은 자동 채권과 수동채권이 상호 대립하는 때에 비로소 발생, 채권양수인은 채권양도 대항요건이 갖춰진 때 비로소 자동채권 행사 가능 [2022 다200089].","상계"],[335,"동시이행 관계에 있는 자동채권과 수동채권이라고 해도 서로 현실적으로 이행하여야 할 필요가 없는 경우라면 특별한 사정이 없는 한 상계가 허용된다.",true,"자동채권과 수동채권이 동시이행관계에 있더라도 서로 현실적으로 이행할 필요 없는 경우.","상계"],[336,"상계 적상의 시점 이전에 수동채권에 대하여 이자나 지연손해금이 발생한 경우, 상계 적 상 시점까지 수동채권의 이자나 지연손해 금을 계산한다음 자동채권으로써 먼저 수동채권의 이자나 지연손해 금을 소각하고 잔액을 가지 고 원본을 소각하여야 한다.",true,"상계적상 시점까지 수동채권의 약정이자 지연손해금 계산하여 자동채권으로써 먼저 수동 채권의 약정이자 • 지연손해금 소각하고 잔액으로 원본 소각 [2005 다8125].","상계"],[337,"가 2021. 5. 1. C에 대한 5천 만 원의 대여금채권( 변제기 2019. 12. 1. )을 자동채권으로하여 C의 양수금채권과 상계한 경우, 양수금 채권은 2020. 1. 1. 에 소급하여 5천 만 원의 범 위에서 소멸한다.",false,"전술한 2022 다 200089 판결에 따라 B가 C 에 대해 가지던 채권(변제기 19. 12. 1. ）과 C가 양수받은 채권(변제기 20. 1. 1.)의 각 변제기보다 채권양도 통지도 달일 (21. 1. 1.)이 더 늦은 경우에는 채권양도 통지 도달일이 상계적상일이므로 21. 1. 1. 로 소급하여 소멸 하는것임.","상계"],[338,"가 2021. 5. 1. C에 대한 5천 만 원의 대여금채권(변제기 2019. 12. 1. )을 자동채권 으로하여 C의 양수금채권과 상계한 경우, A의 채권자 甲의 신청 에의한 A의 대여금채권에 관한 압류 및 전부명 령이 2021. 10. 1. A와 B 에게 도달하였다면, B는 C 에 대한상계로써 甲 에게 대항할수 없다.",false,"甲의 대여금채권에 대한 압류 및 전부명령이 21. 10. 1. 8 에게 송달되었으므로, (5) C 에 대한 채권양도 통지가 확정일자 있는 경우라면 압류 자체가 무효, © 확정일자 없는 경우라 면 C 보다 甲이 우선하겠으나 B가 (확정일자 없더라도) 양도 통지 받은 후 이미 21. 5. 1. C 와 상계한 이상 그보다 늦게 압류 송달시킨 甲에게 상계로 대항 가능.","상계"],[339,"가 2021. 5. 1. A 에 대한 매매대 금채권을 자동채권으로하여 A의 대여금재권과 상계하였다 면 B의 C에 대한 양수금 채무액은 2 천만 원이 다.",true,"의 매매대금채권은 19. 3. 1. 이전에 발생한 채권으로서 양도통지 도달일 21. 1. 1.보다 앞서므로 2017 다222962 판결에 따라 B는 매매대금채권을 자동채권으로 C 에게 양도된 A의 대여금채권과 상계 가능(지문에 ‘A의 대여금채권과 상계하였다면이라는 표현은 다소 혼동할 수 있으나 당연히 대여금채권의 양수인 C 에 대하여 상계 의사표시를 하였다는의 U| 임).","상계"],[340,"의 매매대금채권은 19. 3. 1. 이전에 발생한 채권으로서 양도통지 도달일 21. 1. 1.보다 앞서므로 2017 다222962 판결에 따라 B는 매매대금채권을 자동채권으로 C 에게 양도된 A의 대여금채권과 상계 가능(지문에 ‘A의 대여금채권과 상계하였다면이라는 표현은 다소 혼동할 수 있으나 당연히 대여금채권의 양수인 C 에 대하여 상계 의사표시를 하였다는의 U| 임).",true,"한편 본 문제는 채무자 B가 양수인 C의 양수금채권(A가 B 에 대하여 가지던 채권)과 상계 할 때 @ A에 대한 매매대금채권을 자동채권으로하는 경우(양도인에 대한 채권, 채권양도.","상계"],[341,"己 * A의 채권자 甲의 신청에 의한 압류 및 전부명령이 2020. 10. 1. A와 B에게 도달하여 그 즈음 확정되었다면, B는 A의 채권양도에 대해 이의를 보류하지 않은 승낙 을 하였더라도 C의 양수금청구에 대해 전부명령이 확정된 사실로써 대항할 수 있다.",true,"조 1항 ‘양도인에게 대항할 수 있는 사유’란 채권의 성립 존속 행사를 저지 배척하는 사유를 말할 뿐, 채권의 귀속(＝이미 타인에게 앙도된 사실)은 X._. 채권 귀속 우열은 오 로지 확정일자 있는 통지 승낙의 유무와 선후로써만 결정 [93 다35551] → 이의無보류승낙( = 단순승낙)은 채권의 귀속 우열에 아무 영향 X.","상계"],[342,"고의에 의한 불법행위가 동시에 채무불 이행에 해당하여 불 법행위로 인한 손해배상채권과 채무불이행으로 인한 손해배상채권이 경합하는 경우, 채무자는 고의의 채무불이행으로 인한 손해배상채권을 수동채권으로한 상계로써 채권자에게 대항할 수 있다.",false,"조는 고의 불법행위에 적용, 고의 채무불이행에는 적용 X 그러나 고의 행위가 불법행위 및 채무불이행을 구성하여 앙 손해배상채권이 경합한 경우는 고의 채무불이행으로 인한 손해배상채권을 수동채권으로 해도 유추적용 0, 채무자의 상계 X → 손해배상채권이 현실적 만족 받아야하는 취지 동일 [2014다 19783].","상계"],[343,"여러 개의 자동채권이 있고 수동채권의 원리금이 자동채권의 원리금 합계에 미치지 못하는 경우에는 우선 자동채권의 채권자가 상계의 대 상이 되는 자동채권을 지정할 수 있고, 다음으로 자동채권의 채무자가 이를 지정할 수 있으며, 양 당사자가 모두 지정하지 아니한 때에는 법정변제충당의 방법으로 상계충당이 이루어진다.",true,"자동채권이 여러 개 이고 수동채권 원리금이 자동채권 원 리 금 합계에 못 미 칠 경우, 우선 자 동채권의 채권자( ＝상계자, 채무자’)가 상계 대상인 자동채권을 지정 → 다음으로 자동채권의 채무자(＝피상계자, ‘채권자’)가 지정 → 모두 지정하지 않으면 법정충당 [2011 다24814].","상계"],[344,"수탁보증인이 주채무자에 대하여 가지는 민법 제442조의 사전구상권에는 민법 제443조의 담보제공청구권이 항변권으로 부착되어 있으므로, 특별한 사정이 없는 한 이를 자동채권으로하는 상계는 허용되지 않는다.",true,"수탁보증인은 442조 사전구상권을 자동채권으로 상계 X → 사전구상권에는 주채무자의 443조 면책청구권이 항변권으로 부착 [ 2001 다81245].","상계"],[345,"己 * 甲이 乙을 피고로 대여금채권 1천 만 원의 승소확정판결을 받은 후, 乙이 이미 그 변론종결 이전부터 甲에게 갖고 있던 금전채권을 가지고 상계하는 경우.",true,"[민소] 확정판결 변론종결 전에 상계 적 상 채권 있었고 그 존재를 알았더라도 변론종결 후.","상계"],[346,"고의의 불 법행위로 인한 피해자는 가해자에 대한 손해배상채권과 가해자의 자신에 대한 대여금 채권을 상계할 수 있다.",true,"제496조의 취지가 고의 불법행위 피해자가 현실 변제 받도록, 불법행위 유발 방지 → 가해 자가 수동채권으로하는 상계 금지(그 채무자는 상계 대항 X ), 그러나 피해자가 이를 자동 채권으로 상계하는 것은 허용.","상계"],[347,"피용자의 고의의 불법행위로 인하여 사용자책임이 성립하는 경우, 사용지는 피 해자의 시용자에 대한 손해배상채권을 수동채권으로하여 상계할 수 있다.",false,"피용자의 고의 불법행위로 인하여 사용자책임 성립하는 경우 사용자에게도 496조 적용 O, 人梧종자도 상계 X → 756조 人땅자책임은 대체적 책임, 단서의 문언상 사용자의 과실은 직접 가해행위 아닌 선임 • 감독 관련 고玲! [2004 다63019].","상계"],[348,"채권의 일부양도가 이루어진 경우, 그 분할된 채권에 대하여 양도인에 대한 반 대재권으로 상계하고자하는 채무자는 양도인을 비롯한 각 분할채권자 중 어느 누 구라도 상계의 상대방으로 지정하여 상계할 수 있다.",true,"채권의 일부양도 있으면 각 분할된 부분에 독립한 분할채권 성립 → 채무자는 양도인에 대한 반대채권으로 양도인을 비롯한 각 분할채권자 누구든 상대방으로 삼아 상계 0 → 분 할채권자인 양수인이 대항요건을 갖추었다고 하더라도 다른 부분에 먼저 상계 혹은 비율에 따라 상계되어야 한다는 이의 X [2000 다50596].","상계"],[349,"건물 공유자들의 그 건물 무단 점유자에 대한 차임 상당 부당이득반환청구권은 특별한 사정이 없는한성질상불가분채권이다.",false,"단독으로 공유물 침해에 대한 부당이득 •손해배상 X → 자기 지분 비율 범위 내에서. [70 다 171l → 공유자들의 분할채권.","상계"],[350,"금전채권의 불가분채권자들 중 1 인을 집행채무자로한 압류 및 전부명령이 이루어진 경우 그 집행채무자인 불가분채권자의 채권은 전부채권자에게 이전되더라도 다른 불가분채권자는 그 불가분채권의 채무자에게 불가분채권 전부의 이행을 청구 할 수 있다.",true,"불가분채권자 중 1 인을 집행채무자로 압류 전부명령 있어도 다른 불가분채권자는 모든 채권자 위해 불가분채권 전부의 이행청구 0, 채무자도 모든 채권자 위해 다른 불가분채권 지에게 전부를 이행 0, 이는 금전채권 일부에만 압류 전부명령 내려져도 마찬가지 0 → 전부명령으로 집행채무자인 불가분채권자의 채권은 전부채권자에게 이전되나 다른 불가 분채권자에게는 효력 X [2021 다264253].","상계"],[351,"타인 소유 대지 위에 권원 없이 세워진 건물의 소유자를 상속한 공동상속인들의 건물철거의무는 다른 공동상속인의 지분에 관하여도 철거의무를 부담하는 불가분 채무이므로,이 경우 공동상속인들을 상대로한 건물철거소송은 필수적 공동소송이 다.",false,"공동성속인들의 건물철거의무는 각자 그 지분의 한도 내에서 건물 전체에 대한 철거의무 [80 다756] → 지문에서 ‘ 다른 공동상속인의 지분에 관하여도 철거의무를 부담한다는 부분이 틀리고(공유자 1인은 자기 지분 한도에서만 의무를 부당함). 불가분채무라는 부분은 옳 으나, 필수적 공동소송이라는 부분도 틀린 부분임.","상계"],[352,"丙은 甲만을상대로 계약금 전부의 반환을 청구할 수 있다.",true,"불가분채무자가 변제 기타 자기 출재로 공동면책 얻으면 다른 불가분채무자의 부담부분에 대해 구상권 행사 0,이 때 부담부분은 균등 추정 원칙 이나 특약 있거나 수익 비율이 다르 면 그에 따라 부담부분 결정 ? 411조. 425조 1항 424조, 연대채무자 사이에 관한 2012 다97420 판결 [2020 다208195].","상계"],[353,"제411조(불가분채무와 준용규정) 수인이 불가분채무를 부담한 경우에는 제413조 내지 제415조 제422조 제424조 내지 제427조 및 전조의 규정을 준용한다 제420조(혼동의 절대적 효력) 어느 연대채무자와 채권자간에 혼동이 있는 때에는 그 채무자의 부담부분에 한하여 다른 연대채무자도 의무를 먼한다.",true,"불가분채무는 제424조, 제425조 등 연대채무의 규정들을 준용하지만 혼동에 관한 제420조는 준용 X → 지문에서 불가분채무자 1인 甲이 채권자 丙을 단독상속하면 혼동이 일 어나고, 이제 채권자의 지위가된 甲은 乙에게 계약금의 반환을 구할 수 있는데, 이때 불가 분채무자 중 1인 甲의 혼동이 다른 불가분채무자인 乙에게 영향을 줄 수 없으므로(절대효 준용 X ), 결국 甲은 乙에 대해 5, 000만 원 전액을 청구 O.","상계"],[354,"甲이 丙에게 계약금 전부를 반환한 경우, 甲과 乙 사이의 계약금 분배비율이 공유 지분비율과 다르다면, 甲은 乙을 상대로 그 분 배비율에 따른 부담부분에 대하여 구상권을행사할 수 있다.",true,"기 해설 참조.","상계"],[355,"공동상속 인들의 건물철거 의무는 그 성질상 불가분재무라고 할 것 이고, 각자 그 지분의 한도 내에서 건물 전 체에 대한 철거의무를 진다.",true,"공동상속인들의 건물철거의무는 각자 그 지분의 한도 내에서 건물 전체에 대한 철거의무를 부담하는 불가분채무 [80 다756].","상계"],[356,"제 6 장 수인의 채권자와 채무자 / 서론, 분할채권관계, 불가분채권관 계 • 89.",true,"수인이 공동으로 법률상 원인 없이 타인 재산을 사용한 경우 부당이득반환채무는 불가분 채무 [80 다2587].","분할·불가분채권관계"],[357,"건물의 공유자가 공동으로 건물을 임대하고 보증금을 수령한 경우, 특별한 사정이 없는 한 그 임대는 각자 공유지분을 임대한 것이 아니고 임대목적물을 다수의 당 사자로서 공동으로 임대한 것이고 그 보증금 반환채무는 성질상 불가분채무에 해당 된다.",true,"건물공유자가 공동임대하고 보증금 수령한 경우 보증금반환채무는 불가분채무 T 각자 공 유지분을 임대한 것이 아니고 임대목적물을 다수의 당사자로서 공동으로 임대한 것 [98 다 43137].","분할·불가분채권관계"],[358,"주택을 공유하고 있는 공동임대인 甲, 乙이 임차인丙 에 대하여 부담하는임차 보증금반환채무.",true,"[불가분채무] 건물공유자가 공동임대하고 보증금 수령한 경우 보증금반환채무는 불가분채무 ? 각자 공유지분을 임대한 것이 아니고 임대목적물을 다수의 당사자로서 공동으로 임 대한 것 [98 다43137].","분할·불가분채권관계"],[359,"연대채무자 중 1 인이 채무 일부를 면제받는 경우에 그 연대채무자가 지급해야 할 잔존 채무액이 부담부분을 초과하는 경우 다른 연대채무자는 채무 전액을 부담 하여야한다.",true,"채권자가 연대채무자 중 1인의 채무를 일부’ 면제한 경우도 특별한 사정이 없는 한 면제된 부담부분에 한하여 419조 면제의 절대적 효력 0 → 피면제자의 잔존 채무액이 부담부 분을 초과한다면 다른 연대채무자는 채무 전액 부담해야 •.• 피면제자의 부담부분 감소 없으므로 / 피면제자의 잔존 채무액이 부담부분보다 적다면 그 차액(= 부담부분 잔존 채무액) 범위에서 면제의 절대적 효력 발생하여 다른 연대채무자의 채무가 차액만큼 감소. [2019 다216435].","분할·불가분채권관계"],[360,"채권자가 연대채무자 중 1 인의 소유 부동산에 대하여 경매신청을 하고 그로부터 6 개월 내에 다른 연대채무자를 상대로 재판상 청구를 하였다면, 경매신청 시로부터 그 다른 연대채무자에 대한 채권의 소멸시효가 중단되고 중단된 시효는 위 경매절 차 종료 시로부터 새로 진행된다.",false,"\" 연대채무자 A 소유 부동산에 ‘경매신창 후 6월 내 연대채무자 B 에 대하여 재판상 청구하 먼 A 소유 부동산 경매신청시에 B의 채무에도 시효중단 효력 0 → 416조. 174조 [2001.","분할·불가분채권관계"],[361,". 공동불법행위자 중 1 인에 대하여 구상의무를 부담하는 다른 공동불법행위자가 수인인 경우에는 특별한 사정이 없는이 상 그들의 구상권자에 대한 채무는 각자의 부담부분에 따른 분할채무로 봄이 상당하지만, 구상권자인 공동불법행위자 측에 과실이 없는 경우, 즉 내 부적인 부담부분이 전혀 없는 경우에는 그에 대한 수인의 구 상의무 사이의 관계를 부진정연대 관계로 보아야 한다.",true,"[2003 다24147].","분할·불가분채권관계"],[362,"가 300만 원을 변제하였다면 B, C에게 각 100만 원을 청구할 수 있고, B가 450만 원을 변제하였다면 B는 A, C 에게 각 150만 원을 청구할 수 있는데,이 경우 A는이 마 300만 원을 변제하였다는 이유로 B의 구상청구를 거절할 수 있다.",false,"연 대채무 관계이므로 A가 300만원을 변제했다면 B, C 에게 각 100만원씩을 구상할 수 있고, C가 450만원을 변제했다면 A, B 에게 각 150만원을 청구할 수 있으므로,이 상태에서 C가 A에게 150만원의 구상을 요구할 경우 A는 100만원에 대해서는 상계나 공제를 이유로 거절할 수 있지만 50만원의 구상에는 응해야 하므로 단순히 거절할 수 있는 것은 아님 이상은 A, C 모두 사전 • 사후통지를한 것을 전제로 함.","연대채무"],[363,"부진정연대채무관계에 있는 채무자들 중 1 인에 대하여 이행의 청구를 하더라도 그효력은다른채무자에게 미치지 않는다.",true,"(95 다42027] → 부진정연대채무에서는 변제 • 대물변제 • 공탁 • 상계 이외에는 모두 상대효.","연대채무"],[364,"서 설 - @m · ® * 주채무자에 대한 확정판결에 의하여「민법」 제163조 각 호의 단기 소멸시효에 해당하는 주채무의 소멸시효기간이 10년으로 연장된 상태에서 주채무를 보증하였더 라도, 특별한 사정이 없는 한 보증채무의 소멸시효기간은 이와 별개로 보증채무의 성질에 따라 결정된다.",true,"보증채무는 주채무와 별개 독립한 채무이므로 소멸시효기간은 채무 성질에 따라 각 별개로 결정 → 단기 3년 물품대금채권이 판결 확정되어 10년 연장(제165조)된 상태에서 연대 보증을한 경우, 보증채무에 단기시효 적용될 여지는 X, 보증인에 대한 채권이 민사라면.","연대채무"],[365,"다른 사람이 발행하는 약속어음에 명시적으로 어음보증을하는 사람은 그 어음보증으로 인한 어 음상의 채무만을 부담하는 것이 원칙이다.",true,"[상법] 다른 사람이 발행한 약속어음에 배서인이된 사람은 배서행위로 인한 어음법상 채무만 부담하는 것이 원칙 → 다만 채권자에 대해 자기가 약속어음 발행의 원인이된 민사 상의 채무까지 보층하겠다는 뜻으로 배서를한 경우에 한하여 발행인의 채권자에 대한 민 人岭j 채무에 관한 보증책임 부담 [87 다카 1105).","연대채무"],[366,"여러 공동불법행위자 중 1 인의 신원보증인이 피보증인의 손해배상채무를 변제한 경우, 피보증 인이 아닌 다른 공동불법행위자에 대하여는 그 부담부분에 한하여 구상권을 행사할 수 있다.",true,"공동불법행위자 1인 위한 보증인이 손해배상채무 변제한 경우, 그 보증인은 피보증인 아닌 다른 공동불법행위자에 대하여 고 부담부분에 한하여 구상 0, 다만 다른 공동불법행위자 부담부분 없으면 구상 부당이득반환청구 X [95 다47176).","연대채무"],[367,"계 속적 채권관계에서 발생하는 주계약상의 불확정 채무에 대하여 보증한 경우, 보증 채무는 보증계약의 종료 시점과 관계 없이 주계약상의 채무가 확정된 때에 이와 함 께 확정 된다.",false,"계속적 채권관계인 주계약상 불확정 채무 보증한 경우, 주채무자오는: 거래기간 연장되었으나 보증인과 보증기간(3년) 연장되지 않아 보증계약관계 종료되면 보증채무 확정 → 보증 인은 그 당시 주계약상 채무만 책임, 그 후의 채무는 책임 X [99 다26481).","연대채무"],[368,"주채권과 분리하여 보증채권만 양도하기로하는 약정은 효력이 없다.",true,"주채권과 분리하여 보증채권만 앙도하는 약정은 무효 •.• 주채권과 보증인에 대한 채권의 귀속주체 달리하면 보증인 항변권 침해 등 부종성에 반함 인정할 실익도 없음 [2002 다 21509).","연대채무"],[369,"丁 甲, 乙, 丙이 공동의 불 법행위로 丁 에게 9, 000만 원의 부진정연대채무를 부담하고 있고 과실 비율은 균등하다,이 경우 甲의 보증인 戊가 6, 000만 원을 변제하였다 면 戊는 乙과 丙에 대해 각 2, 000만 원의 구상권을 취득한다.",false,"공동불법행위자 1인 위한 보증인이 손해배상채무 변제한 경우, 그 보증인은 피보증인 아닌 다른 공동불법행위자에 대하여 그 부담부분에 한하여 구상 O, 다만 다른 공동불법행위자 부담부분 없으면 구상 • 부당이득반환청구 X [95 다47176] → 설문에서 戊는 피보증인 甲의 부담부분 3, 000만원보다 3, 000만원 초과하여 변제했으므로 乙 • 丙에게 각 1, 500만원 씩구상권취득.","연대채무"],[370,"주채무자인 甲의 부탁을 받은 乙은 채권자 丙에 대해 주재무금액 5, 000만 원에 관한 보증을 하였다이후 주채무의 변제기한인 2022. 8. 31.이 도래하고 甲이 변제를 하지 않아 2022. 9. 30. 자로 약정이자 1, 000만 원, 지연손해금 50만 원이 발생하게 되면 2022. 9. 30. 乙은 甲에게 6, 050만 원의 사전구상금 액을 청구할 수 있다.",true,"사전구상권 범위는 주채무 원금, 사전구상 응할 때까지 이미 발생한 이자 및 지연손해금.","연대채무"],[371,"甲은 주채무자, 戊는 채권자인 상황에서 乙, 丙, 丁이 戊 에 대해 주재무금액 9, 000만 원에 관한 연대보증을 하였고 그 비율이 균등하다,이 경우 丙이 3, 000만 원을 변제한 후 丁이 6, 000만 원을 변제하였다면 丁은 다른 연대보증인 중 乙 에 대해서 만 3, 000만 원의 구상권을 취득한다.",true,"연대보증인은 분별의 이익 없으나, 연대보증인들 상호 내부관계는 주채무에 대한 출재 분 담의 일정 부담부분 O, 특약 없으면 평등 비율 → 연보 1인이 자기 부담부분 초과 변제하 면 다른 연보에게 구상, 그러나 연보 중 이미 자기 부담부분 변제한 사람에게는 구상 X [2007 다70155] → 설문에서 丙은 이미 자기 부담부분 3, 000만원을 전액 변제한 사람이므로 丁이 자기 부담부분 초과하여 변제한 부분이 있더라도 丙에게는 구상할 수 없고 乙 에 대해서만구상권有.","보증채무"],[372,"보증채무를 부담하는 내용의 지급보증서에서 보증금액을 정하여 두었다고 하더 라도 보증채무는 주채무와는 별개의 채무이기 때문에 보증채무 자체의 이행지체로 인한 지연손해금은 지급보증의 한도액과는 별도로 부담하여야 한다.",true,"보증채무는 주채무와 별개 채무 → 보증채무 자체의 이행지체로 인한 지연손해금은 보증 한도액과 별도로 부담 0 → 보증채무 연체이율의 특별한 약정 있으면 약정에 따라, 특별한 약정 없으면 거래행위 성질에 따라 상법 • 민법 법정이율 적용, 주채무에 약정 연체이율 당연 적용은 X [2001 다29803, 97 다 1433].","보증채무"],[373,"보증계약 체결 후 채권자가 보증인의 승낙 없이 주채무자에 대하여 변제기를 연 장하여 주었다면 보증인의 책임을 가중하는 것이라고 할 수 있으므로, 보증채무에 대하여는 그 효력이미치지 않는다.",false,"주채무 변제기 연장은 보증인에게 효력 0 → 보증인 책임 가중 아님 [95 다49141 ].","보증채무"],[374,"己 * 주채무에 대한 소멸시효가 완성되어 보증채무가 소멸된 상태에서 보증인이 보증 채무를 이행하거나 승안한 경우, 주채무의 시효소멸에도 불구하고 보증채무를 이행 하겠다는 의사를 표시한 경우 등과 같이 부종성을 부정하여야 할 다른 특별한 사정이 없는 한 보증인은 여전히 주채무의 시효소멸을 이유로 보증채무의 소멸을 주장 할 수 있다.",true,"보증채무 시효 중단되었더라도 주채무 소멸시효완성하면 주채무 당연 소멸하고 부종성에 따라 보증채무 역시 당연 소멸 0 → 주채무 소멸시효가 완성되어 보증채무 소멸된 상태에서 보증인아 보증채무 이행 • 승인하였더라도 주채무자가 아닌 보증인의 행위로 주채무 소멸시효 이익 포기 효과 X, 주채무 시효소멸에도 불구하고 보증채무 이행하겠다는 의사표시 등 부종성 부정할 특별한 사정이 없는 한 보증인은 여전히 주채무 시효소멸 이유로 보증채무 소멸 주장. [ 2010 다51192 ].","보증채무"],[375,"丙이 2020. 4. 30. 乙에게 차용원리금 중 1억 원을 변제하였다면, 丙은 丁올 상대로 구상을 청구할 수 있다. ( X ) L. 丙과 丁이 2020. 4. 30. 乙에게 차용 원 리 금 중 각 1억 6, 000만 원과 1억 1, 200만 원을 변제하였다면 丙은 丁을 상대로 구상을 청구할 수 없다.",false,"해설 : 연대보증인은 분별의 이익 없으나, 연대보증인들 상호 내부관계는 주채무에 대한 출재 분담의 일정 부담부분 0, 특약 없으면 평등 비율 → 연보 1인이 자기 부담부분 초과 변제하면 다른 연보에게 구상, 그러나 연보 중 이미 자기 부담부분 변제한 사람에게 는 구상 X [2007 다70155).","보증채무"],[376,"丙이 2024. 4. 30. 乙 에게 치용이자 중 600만 원을 변제하였다 하더 라도, 丙은 甲의 이자채무가 시효로 소멸하였음을 이유로 나머지 이자에 대한 보증채무의 소멸 을주장할 수 있다.",true,"2024. 4. 30은 甲의 모든 이자채무가 3년 단기시효로 소멸하였고, 이자 시효완성 후 보증인 丙이 이자 일부를 변제했더라도 시효이익 포기로 볼 수 없음(최근 판례 변경이 있었던 대법원 2025. 7. 24. 선고 2023 다240299 전원합의체 판결에 따르면 채무자의 이러한 행위가 시효이익 포기 자체에 해당하기 어렵고, 설령 판례 변경 전이라고 하더라도 보층인의 행위로 이미 시효소멸한 주채무의 시효이익을 포기할 수는 없었기 때문) → 전원합의체 판례 변경과 상관없이 옳은 지문 [변경 전 판례 참고] 보증채무 시효 중단되었더라도 주채무 소멸시효완성하면 주채무 당연 소멸하고 부종성에 따라 보증채무 역시 당연 소멸 0 → 주채무 소멸시효가 완성되어 보증채무 소멸된 상태에서 \"보증인이 보증채무 이행 •승인하였더라도 주채무자가 아닌 보증인의 행위로 주채무 소멸시효 이익 포기 효과 X, 주채무 시효소열에도 불구하고 보증채무 이행하겠다는 의사표시 등 부종성 부정할 특별한 사정이 없는 한, 보증인은 여전히 주 채무 시효소멸 이유로 보증채무 소멸 주장 0 \" [2010 다51192).","보증채무"],[377,"己 丙이 변제기 전인 2019. 10. 31. 주채무자 甲 에게 통지하지 않고 乙에게 차용원금 1억 원을 변제하였다면, 출재에 보증인의 과실이 존재하므로 丙은 甲에 대하여 만법 제441조에 따른 사후구상권을 취득할 수 없다.",false,"보증인이 사전통지를 하지 않은 경우, ‘주채무자가 이중변제’를 했을 때 445조 1항에 의해 그에게 구상할 수 없을 뿐이지, 사후구상권 자체가 없어지는 것이 아님.","보증채무"],[378,"채권에 의한 상계로 가압류채권자 己 에게 대항할 수 있다.",false,"가압류 시점인 20. 5. 31. 은 주채무 변제기 20. 4. 30. 이후라 수탁보증인 丙의 사전구상권은 발생, 그러나 丙이 주채무의 면책행위를하여 사전구상권의 담보제공청구 항변권을 소멸시킨 것은 20. 7. 31. 이고, 이시점이 가압류된 채권의 변제기 20. 6. 30.보다 늦으므로, 결국 丙은 사전구상권에 의한 상계로 가압류채권자 己에게 대항 X.","보증채무"],[379,"가압류 시점인 20. 5. 31. 은 주채무 변제기 20. 4. 30. 이후라 수탁보증인 丙의 사전구상권은 발생, 그러나 丙이 주채무의 면 /* 로그인 */
.login-wrap{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-box{width:100%;max-width:380px;}
.login-header{text-align:center;margin-bottom:28px;}
.login-logo{font-size:11px;color:var(--tx3);letter-spacing:2px;margin-bottom:8px;}
.login-title{font-family:'Noto Serif KR',serif;font-size:24px;font-weight:700;color:var(--gold);margin-bottom:6px;}
.login-desc{font-size:12px;color:var(--tx3);line-height:1.6;}
.login-card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:24px;}
.login-label{font-size:12px;color:var(--tx2);margin-bottom:8px;}
.login-input{width:100%;font-family:'Pretendard',sans-serif;font-size:14px;padding:11px 14px;border:1px solid var(--bd);border-radius:10px;outline:none;background:var(--sf2);color:var(--tx);margin-bottom:10px;transition:border-color .15s;}
.login-input:focus{border-color:var(--gold);}
.login-btn{width:100%;padding:13px;background:var(--gold);color:#0d1117;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;transition:all .12s;}
.login-btn:hover{background:var(--gold2);}
.login-hint{font-size:11px;color:var(--tx3);text-align:center;margin-top:10px;}

/* 허브 모듈 그리드 */
.hub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:20px;}
.module-card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:20px;cursor:pointer;transition:all .15s;position:relative;overflow:hidden;}
.module-card.active:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.4);}
.module-card.soon{opacity:.55;cursor:not-allowed;}
.module-card.soon:hover{transform:none;}
.module-accent{position:absolute;top:0;left:0;right:0;height:3px;border-radius:14px 14px 0 0;}
.module-icon{font-size:24px;margin-bottom:10px;}
.module-name{font-family:'Noto Serif KR',serif;font-size:16px;font-weight:700;color:var(--tx);margin-bottom:3px;}
.module-sub{font-size:11px;color:var(--tx3);margin-bottom:12px;}
.module-stats{display:flex;gap:8px;font-size:11px;font-family:'IBM Plex Mono',monospace;flex-wrap:wrap;}
.module-stat{padding:2px 8px;border-radius:8px;background:var(--sf2);border:1px solid var(--bd2);color:var(--tx3);}
.module-stat.ok{color:var(--ok);border-color:rgba(63,185,80,.2);}
.module-stat.er{color:var(--er);border-color:rgba(248,81,73,.2);}
.module-stat.gold{color:var(--gold);border-color:rgba(212,168,83,.2);}
.soon-badge{position:absolute;top:12px;right:12px;font-size:10px;padding:2px 8px;border-radius:8px;background:var(--sf2);border:1px solid var(--bd);color:var(--tx3);}
.module-bar{height:3px;background:var(--bd);border-radius:2px;overflow:hidden;margin-top:10px;}
.module-bar-fill{height:100%;border-radius:2px;transition:width .3s;}

/* 퀴즈 설정 */
.pill-row{display:flex;gap:7px;flex-wrap:wrap;}
.pill{padding:7px 16px;border-radius:20px;border:1px solid var(--bd);background:var(--sf2);color:var(--tx2);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px;}
.pill:hover{border-color:var(--gold);color:var(--gold);}
.pill.act{background:var(--gold);border-color:var(--gold);color:#0d1117;}
.pill.blue{border-color:rgba(88,166,255,.35);color:var(--blue);}
.pill.blue.act{background:rgba(88,166,255,.15);border-color:var(--blue);color:var(--blue);}
.pill.red{border-color:rgba(248,81,73,.35);color:var(--er);}
.pill.red.act{background:rgba(248,81,73,.12);border-color:var(--er);}
.pill.purple{border-color:rgba(188,140,255,.35);color:var(--purple);}
.pill.purple.act{background:rgba(188,140,255,.12);border-color:var(--purple);color:var(--purple);}
.cnt-badge{font-size:10px;opacity:.75;font-family:'IBM Plex Mono',monospace;}
.wrong-badge{font-size:10px;background:rgba(248,81,73,.15);color:var(--er);padding:1px 5px;border-radius:8px;border:1px solid rgba(248,81,73,.3);}
.topic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:8px;margin-top:12px;}
.tc{background:var(--sf2);border:1px solid var(--bd2);border-radius:8px;padding:12px 13px;cursor:pointer;transition:all .15s;}
.tc:hover{border-color:var(--gold);}
.tc.act{border-color:var(--gold);background:rgba(212,168,83,.1);}
.tc-icon{font-size:16px;margin-bottom:4px;}
.tc-name{font-size:12px;font-weight:600;color:var(--tx);margin-bottom:2px;}
.tc-cnt{font-size:10px;color:var(--tx3);font-family:'IBM Plex Mono',monospace;}
.tc-wc{font-size:10px;color:var(--er);margin-top:2px;}
.start-row{margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.start-btn{padding:11px 28px;background:var(--gold);color:#0d1117;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;transition:all .12s;}
.start-btn:hover{background:var(--gold2);}
.start-btn:disabled{opacity:.4;cursor:not-allowed;}
.start-hint{font-size:12px;color:var(--tx3);}
.clear-link{font-size:12px;color:var(--blue);cursor:pointer;text-decoration:underline;text-underline-offset:2px;}

/* 진행 */
.prog-wrap{margin-bottom:18px;}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;}
.prog-label{font-size:11px;color:var(--tx3);font-family:'IBM Plex Mono',monospace;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.prog-num{font-size:20px;font-weight:700;font-family:'IBM Plex Mono',monospace;}
.prog-num span{font-size:12px;color:var(--tx3);font-weight:400;}
.prog-bar{height:3px;background:var(--bd);border-radius:2px;overflow:hidden;}
.prog-fill{height:100%;border-radius:2px;transition:width .3s;}
.prog-stats{display:flex;gap:14px;margin-top:6px;}
.ps{font-size:11px;color:var(--tx3);}
.ps strong{font-family:'IBM Plex Mono',monospace;}
.ps.ok strong{color:var(--ok);}
.ps.er strong{color:var(--er);}
.ps.mk strong{color:var(--purple);}

/* 퀴즈 카드 */
.qcard{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:24px 20px;margin-bottom:14px;}
.qcard-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.qcard-no{font-size:11px;color:var(--tx3);font-family:'IBM Plex Mono',monospace;}
.qcard-topic{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--sf2);border:1px solid var(--bd2);color:var(--tx3);}
.question{font-family:'Noto Serif KR',serif;font-size:15.5px;line-height:1.9;color:var(--tx);word-break:keep-all;}
.reveal{margin-top:18px;padding:14px 16px;border-radius:8px;animation:fi .2s ease;}
.reveal.ok{background:var(--ok-bg);border:1px solid rgba(63,185,80,.3);}
.reveal.er{background:var(--er-bg);border:1px solid rgba(248,81,73,.3);}
.rv-label{font-size:18px;font-weight:700;display:flex;align-items:center;gap:7px;margin-bottom:6px;}
.reveal.ok .rv-label{color:var(--ok);}
.reveal.er .rv-label{color:var(--er);}
.rv-verdict{font-size:12px;font-weight:600;opacity:.8;}
.rv-exp{font-size:13px;line-height:1.7;color:var(--tx2);margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.06);word-break:keep-all;}
.rv-toggle{font-size:12px;color:var(--blue);cursor:pointer;margin-top:5px;display:inline-block;text-decoration:underline;text-underline-offset:2px;}
.mark-btn{display:inline-flex;align-items:center;gap:5px;margin-top:10px;padding:6px 12px;border-radius:20px;border:1px solid rgba(188,140,255,.4);background:transparent;color:var(--purple);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;}
.mark-btn:hover,.mark-btn.marked{background:rgba(188,140,255,.15);border-color:var(--purple);}
.ox-row{display:flex;gap:10px;margin-top:16px;}
.ox{flex:1;padding:14px;border-radius:10px;border:2px solid transparent;font-size:26px;font-weight:700;cursor:pointer;transition:all .12s;background:var(--sf2);}
.ox.o{border-color:rgba(63,185,80,.3);color:var(--ok);}
.ox.o:not(:disabled):hover{background:var(--ok-bg);border-color:var(--ok);transform:translateY(-2px);}
.ox.x{border-color:rgba(248,81,73,.3);color:var(--er);}
.ox.x:not(:disabled):hover{background:var(--er-bg);border-color:var(--er);transform:translateY(-2px);}
.ox:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.ox.sel-o{background:var(--ok-bg);border-color:var(--ok);}
.ox.sel-x{background:var(--er-bg);border-color:var(--er);}
.next-btn{width:100%;padding:13px;background:var(--gold);color:#0d1117;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;margin-top:10px;transition:all .12s;}
.next-btn:hover{background:var(--gold2);}
.back-btn{padding:6px 14px;border-radius:16px;border:1px solid var(--bd);background:var(--sf2);color:var(--tx3);font-size:12px;cursor:pointer;margin-bottom:14px;}
.back-btn:hover{color:var(--blue);border-color:var(--blue);}

/* 완료 */
.done-card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:36px 20px;text-align:center;}
.done-icon{font-size:44px;margin-bottom:14px;}
.done-title{font-family:'Noto Serif KR',serif;font-size:21px;font-weight:700;color:var(--gold);margin-bottom:6px;}
.done-sub{font-size:13px;color:var(--tx2);margin-bottom:22px;}
.done-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:22px;}
.ds{background:var(--sf2);border:1px solid var(--bd);border-radius:8px;padding:12px 6px;}
.ds-n{font-size:20px;font-weight:700;font-family:'IBM Plex Mono',monospace;margin-bottom:3px;}
.ds-l{font-size:10px;color:var(--tx3);}
.ds.c .ds-n{color:var(--ok);}
.ds.w .ds-n{color:var(--er);}
.ds.r .ds-n{color:var(--gold);}
.ds.m .ds-n{color:var(--purple);}
.act-row{display:flex;gap:8px;flex-wrap:wrap;}
.act-btn{flex:1;min-width:90px;padding:11px;border-radius:8px;border:1px solid var(--bd);background:var(--sf2);color:var(--tx);font-size:13px;font-weight:600;cursor:pointer;transition:all .12s;}
.act-btn:hover{border-color:var(--gold);color:var(--gold);}
.act-btn.pri{background:var(--gold);border-color:var(--gold);color:#0d1117;}
.act-btn.pri:hover{background:var(--gold2);}

/* 오답 아카이브 */
.arch-filter-row{display:flex;gap:6px;margin-bottom:12px;}
.arch-filter{padding:4px 12px;border-radius:14px;border:1px solid var(--bd);background:transparent;color:var(--tx3);font-size:12px;cursor:pointer;transition:all .12s;}
.arch-filter.act{border-color:var(--gold);color:var(--gold);background:rgba(212,168,83,.08);}
.arch-filter.purple.act{border-color:var(--purple);color:var(--purple);background:rgba(188,140,255,.08);}
.retry-btn{width:100%;padding:10px;background:rgba(248,81,73,.1);border:1px solid rgba(248,81,73,.3);border-radius:7px;color:var(--er);font-size:13px;font-weight:600;cursor:pointer;margin-bottom:10px;transition:all .12s;}
.retry-btn:hover{background:rgba(248,81,73,.2);}
.retry-btn.mk{background:rgba(188,140,255,.1);border-color:rgba(188,140,255,.3);color:var(--purple);}
.retry-btn.mk:hover{background:rgba(188,140,255,.2);}
.arch-item{background:var(--sf);border:1px solid var(--bd2);border-left:3px solid var(--er);border-radius:7px;padding:12px 14px;margin-bottom:7px;cursor:pointer;transition:all .12s;}
.arch-item:hover{background:var(--sf2);}
.arch-item.exp{border-left-color:var(--gold);}
.arch-item.mk-item{border-left-color:var(--purple);}
.arch-q{font-size:13px;line-height:1.6;color:var(--tx);font-family:'Noto Serif KR',serif;word-break:keep-all;}
.arch-ans{font-size:11px;color:var(--tx3);margin-top:5px;font-family:'IBM Plex Mono',monospace;}
.arch-tag{font-size:10px;color:var(--tx3);background:var(--sf2);border:1px solid var(--bd2);border-radius:8px;padding:1px 6px;display:inline-block;margin-top:4px;margin-right:4px;}
.arch-tag.mk{border-color:rgba(188,140,255,.3);color:var(--purple);background:rgba(188,140,255,.08);}
.arch-exp{font-size:12px;color:var(--tx2);margin-top:7px;padding-top:7px;border-top:1px solid var(--bd2);line-height:1.65;display:none;word-break:keep-all;}
.arch-item.exp .arch-exp{display:block;}

/* 관리자 */
.admin-user-card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.admin-uid{font-size:14px;font-weight:700;color:var(--gold);min-width:100px;}
.admin-stats{display:flex;gap:10px;font-size:12px;flex:1;flex-wrap:wrap;}
.admin-stat{color:var(--tx3);}
.admin-stat b{font-family:'IBM Plex Mono',monospace;}
.admin-stat.ok b{color:var(--ok);}
.admin-stat.er b{color:var(--er);}
.admin-stat.gold b{color:var(--gold);}
.rst-btn{font-size:11px;color:var(--tx3);cursor:pointer;text-decoration:underline;background:none;border:none;padding:0;}
.rst-btn:hover{color:var(--er);}

@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
/* 인라인 편집 */
.edit-btn{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:12px;border:1px solid var(--bd);background:transparent;color:var(--tx3);font-size:11px;cursor:pointer;transition:all .15s;margin-left:auto;}
.edit-btn:hover{border-color:var(--blue);color:var(--blue);}
.edit-btn.edited{border-color:rgba(88,166,255,.3);color:var(--blue);background:rgba(88,166,255,.08);}
.edit-panel{margin-top:14px;padding:14px 16px;background:var(--sf2);border:1px solid var(--bd);border-radius:10px;animation:fi .15s ease;}
.edit-panel-title{font-size:11px;color:var(--tx3);margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;}
.edit-textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-family:'Noto Serif KR',serif;font-size:14px;line-height:1.75;padding:10px 12px;resize:vertical;outline:none;transition:border-color .15s;}
.edit-textarea:focus{border-color:var(--blue);}
.edit-textarea.exp{font-size:12px;font-family:'Pretendard',sans-serif;color:var(--tx2);}
.edit-row{display:flex;gap:8px;margin-top:10px;align-items:center;}
.edit-save{padding:8px 18px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;transition:all .12s;}
.edit-save:hover{opacity:.85;}
.edit-cancel{padding:8px 14px;background:transparent;border:1px solid var(--bd);color:var(--tx3);border-radius:8px;font-size:13px;cursor:pointer;}
.edit-cancel:hover{color:var(--tx);}
.edit-reset{font-size:11px;color:var(--er);cursor:pointer;text-decoration:underline;background:none;border:none;padding:0;margin-left:auto;}
.edit-hint{font-size:11px;color:var(--tx3);margin-top:6px;}
/* 관리자 - 수정 내역 */
.admin-edit-item{background:var(--sf);border:1px solid var(--bd2);border-left:3px solid var(--blue);border-radius:8px;padding:12px 14px;margin-bottom:8px;}
