 해제는 손해배상을 해줘야 하므로 도급인의 의사 다름, 수급인은 채무불이행 없으므로 해제 무효라 믿고 일 계속했다가 673조 해제되면 불측 손해 [2022다246757) 一 위 두 판례의 차이점 비교를 강조했는데 실제 두 지문을 나란히 출제하였음.","도급"],[190,"수임인이 위임사무를 처리하는 과정에서 선관주의의무를 위반한 사실이 있더라도, 그 후 수임인이 위임사무 처리를 위해 비용을 지출하였고, 해당 비용의 지출 과정에서 수임인이 선량한 관리자로서의 주의를 다했다면, 수임인은 선행 선관주의의무 위반과 상당인과관계 있는 비용 증가에 대하여 손해배상의무를 부담하는 것은 별론으로 하고 위임인에 대하여 필요비의 상환을 청구할 수 있다.",true,"수임인이 위임사무 처리 고陸에서 선관주의의무 위반한 사실이 있더라도. 이후 수임인이 선량한 관리자 주의 다하여 위임사무 처리 위한 비용 지출했다면. 선행 선관주의 위반으로 인한 비용 증가 손해배상의무 부담은 별론, 위임인에 대하여 688조 1항의 필요비 상환 청구 0 一 상환 청구 가능한 필요비는 수임인이 선관주의 다하여 필요하다고 판단하여 지출한 비용 0, 위임인에게 실익 발생 여부나 위임인의 목적 달성 여부는 불문 [2004다69420, 2023다294470).","도급"],[191,"도급계약에서 정한 일의 완성 이전에 계약이 해제되었다면, 원칙적으로 수급인은 도급인에게 약정에 따른 보수를 청구할 수 없다.",true,"도급계약에서 보수는 완성물 인도와 동시에 지급해야, 인도 요하지 않는 경우 완성 후 지 체없이 지급해야 一 도급인은 완성물 인도제공이나 완성 있을 때까지 보수지급 거절 0 一 일의 완성 전에 계약해제된 경우는 수급인 보수청구 X 다만 수급인 일부 미완성 부분 있더라도 해제 이유로 전부 원상회복함이 신의칙 등에 비 추 어 공평 • 타당하지 않은 특별한 경우는 예외적으로 완성된 부분에 수급인의 보수청구권 인정 O [2022다289174).","도급"],[192,"은 甲으로부터 공사대 금을 전부 지급받을 때까지 Y 건물에 대한 유치 권을 행 사할 수 있다.",false,"수급인의 재료와 노력으로 건축된 건물에 대해 수급인은 유치권 x •.• 수급인이 원시취득 하여 소유, 유치권은 타물권인 점 [91 다 14116] 다만 도급계약에서는 수급안이 자기 노력 • 재료를 들여 건물 완성해도 도급인과 수급인 사이 도급인 명의로 건축허가 받아 소유권보존등기를 하기로 한 경우, 완성된 건물의 소유권을 도급인에게 귀속시키는 묵시적 합의 0, 완성된 건물 소유권은 원시적으로 도급인 귀속 [91다25505] 一 설문은 특별한 약정 없어 수급인 소유권 취득 0 一 유치권 X.","도급"],[193,"丁은 乙이 그 자재에 대한 소유권유보 사실을 알고 있는 경우에도 乙에게 부당이 득에 관한규정에 의하여 보상청구를 할수 없다.",false,"261조 보상청구권이 인정 되려면 261조 자체의 요건 외에 부당이 득반환의 요건도 모두 충 족되어야 一 매도인에게 소유권 유보된 자재가 제3자와 매수인 사이 도급계약 이행으로 제3자 소유 건물에 부합된 경우, 제3자가 도급계약에 제공된 자재의 소유권 유보 사실에 관하여 선의 · 무고의이라면, 선의취득 법리 유추적용하여 제3자가 자재 귀속 이익을 보유 할 법률상 원인 0 一 매도인은 제3자(도급인)를 상대로 보상청구 X [2009다15602] 一 乙이 알고 있었다면 丁은 乙에 대해 보상청구 0.","도급"],[194,"CE’ 예 정된 공정을 완료하고 건물이 완성되었으므로 비 록 하자가 있다 하더라도 공사는 완료된 것이므로 乙 회사의 甲에 대한 공사대 금청구권은 발생한다.",true,"건물 신축공사 ‘ 미완상과 ‘ 하자’ 구별 기준은 공사가 도중 중단되어 예정된 최후 공정을 종 료하지 못한 경우는 ‘ 미완성’. 당초 예정된 최후 공정까지 일 단 종료하고 주요 구조 부분이 약정대로 시공되어 사회 통념 상 건물로서 완성되고 다만 불완전하여 보수해야 할 경우는 ‘ 완상되었으나 ‘하자’ 있는 경우 [97다44768].","도급"],[195,"만약 건물에 발생한 하자가 甲의 지시에 기인한 것임이 증명된다면, 甲은 乙 회 사에 대 하여 민법 제667조에 따른 담보책임은 물론 민법 제390조에 따른 채무불이 행책임도 물을 수 없다.",false,"도급계약에 따른 완성물에 하자가 있는 경우, 수급인의 하자담보책임과 채무불이행책임이 별개 권원으로 경합적 인정 一 669조(도급인 제공 재료나 도급인 지시에 가인한 경우 수급인 면 책논 하자담보책임에만 적용되고, 채무불이행책임에 적용 X [2019다268252].","도급"],[196,"공사도급계약에서 하자보수보증금이 손해 배 상의 예 정에 해당하는 경우 실손해 액의 증명이 있다고 하더라도 수급인으로부터 그 초과액 상당의 손해 배 상을 받을 수 없다.",false,"하자보수보증금은 특성상 실손해가 이를 초과한다면 입증하여 그 외 따로 손해배상 받을 수 있는 ‘특수한 손해배상액의 예정 (2000다1781 O].","도급"],[197,"공사도급계약의 도급인이 될 자가 수급인 선정을 위한 입찰절차를 거쳐 낙찰 자를 결정한 경우 입찰을 실 시 한 자와 낙찰자 사이에는 도급계 약의 본계약체결의 무를 내용으로 하는 예 약관계가 성립된다.",true,"도급계약의 도급인 될 자가 수급인 선정 위해 입찰절차 거쳐 낙찰자 결정하면 입찰 실시자 와 낙찰자 사이에 도급계약의 본계약체결의무를 내용으로 하는 예약의 계약관계 성립 0 一 일방이 정당한 이유 없이 본계약체결 거절하면 예약채무불이행 손해배상 O [2011다41659].","도급"],[198,"도급계약에 따라 완성된 목적물에 하자가 있는 경우 수급인의 하자담보책임과 채무불이행책임은 별개의 권원에 의하여 경합적으로 인정되며, 이는 도급인이 하자 보수비용을 하자보수에 갈음하여 손해 배 상으로 구하는 경우에도 마찬가지이다.",true,"도급계약의 완성물에 하자 있는 경우, 수급인의 하자담보책임과 채무불이행책임은 별개 권 원에 의해 경합적 인정 0 一 도급인은 하자보수비용을 667조 2항 하자담보책임으로도, 390조 채무불이행으로도 구할 수 O [2020다201156].","도급"],[199,"건물을 완성하지는 못하였지만 사회통념상 독립한 건물아라고 볼 수 있는 상태에서 건축주의 사정으로 공사가 중단된 후 다른 사람이 그 미완성의 건물을 인도받 아 나머지 공시를 마치고 완성한 경우 특별한 사정이 없는 한 그 완성건물의 원시취 득자는 자기의 비용과 노력을 들인 원래의 건축주이다.",true,"건축주 사정으로 건축공사 중단되었던 미완성 건물을 인도받아 나머지 공사 마치고 완공 한 경우 一 중단 시점에 이미 사회통념상 독립한 건물(최소한의 기둥, 지붕, 주벽)이라면 원래의 건축주가 원시취득 [2000다16350] 건물신축 공사 진행 중 독립한 건물 요건 갖추지 못한 단계에서 중지된 것을 제3자가 이어 받아 진행함으로써 건물 소유권 원시취득 一 애초 신축 중 건물에 대한 소유권 상실한 사 람은 261조, 257조, 259조 준용하여 건물의 원시취득자에 대하여 부당이득 규정에 기하여 보상청구 O [2009다83933].","도급"],[200,"수급인이 도급인에게 건물의 인도를 위한이 행의 제공을 하지 않으면 도급인이 동시이행의 항변을 하지 않더라도 공사대 금채무에 대한 도급인의 이행지체책임이 발 생하지 않는다.",true,"동시이행항변권의 존존재효.","도급"],[201,"수급인의 채무불이행으로 계약이 해제되더라도 수급인은 해제시점까지 총공사 비에 기성고 비율을 적용한 금액을 도급인에게 청구할 수 있다.",true,"건축도급계약에서 미완성부분 있더라도 공사가 상당 정도 진척되어 고 원상회복이 중대한 사회 • 경제적 손실 초래하고 완성된 부분이 도급인에게 이익이 되는 경우, 수급인의 채무불이행을 이유로 도급인이 도급계약해제해도 마완성부분만 도급계약 실효 一 수급인은 해제한 때 상태로 도급인에게 인도, 도급인은 완성부분 상당한 보수, 즉 약정총공사비에 중단 당시 기성고비율 곱한 금액 지급해야 0, 실제 지출한 비용 X (93다25080].","도급"],[202,"제작물공급계약에서 보수의 지급시기에 관하여 당사자 사이의 특약이나 관습이 없으면 도급인은 완성된 목적물을 인도받은 때에 지급하여야 한다.",true,"제작물공급계약에서 보수 지금시기에 특약이나 관습 없으면 완성된 목적물 인도받음과 동 시에 보수 지급함이 원칙 一 인도는 단순한 점유 이전만 의미하지 X 도급인이 목적물 검 사한 후 계약내용대로 완성되었음을 명시적 • 묵시적 시인하는 것까지 포함하는의 미 O [2004다21862].","도급"],[203,"도급인이 하자보수에 갈음한 손해배상채권에 기하여 수급인의 공사대금채권 전 부에 대하여 동시이행의 항변을 할 수 있는 때에는. 수급인은 위 손해배상에 관한 이행의 제 공을 하지 아니한 이상 공사 대 금채권에 기한 유치권을 행사할 수 없다.",true,"수급인이 완공한 신축건물에 하자가 있고 하자 및 손해에 상응하는 금액이 공사잔대 금액 이상이어서 도급인이 수급인에 대한 하자보수청구권 혹은 하자보수 갈음한 손해 배 상채권으로 수급인의 공사잔대금채권 전부에 대해 동시이행 항변을 한 경우 一 수급인은 공사잔 대금채권으로 유치권 X ·: 공사잔대금채권의 변제기’가 도래하지 않은 경우와 마찬가지 [2013다30653].","도급"],[204,"수급인이 도급계약에 따른 의무를 제대로 이행하지 못함으로 말미암아 도급인의 신체 또는 재산에 손해가 발생한 경우 하자확대손해로 인한 수급인의 손해배상채무는 도급인의 공사대금채무와 동시이행관계에 있다.",true,"하자확대손해로 인한 수급인의 (채무불이행) 손해배상채무도 공사대 금채무와 동시이행 0 ·: 비 록 쌍무계약관계 고유의 대가관계는 없더라도이 행상 견련성 인정할 사정 있다면 동시이행 항변권 인정, 667조 3 항에서 536조 준용으로 하자 손해 배 상채권이 동시이행관계 인 점 [2004다37676].","도급"],[205,"제668조(동전 도급인의 해제권) 도급인이 완성된 목적물의 하자로 인하여 계약의 목적을 달 성할 수 없는 때에는 계약을 해제할 수 있다 그러나 건물 기타 토지의 공작물에 대하여는 그 러하지아니하다.",true,"건물 기타 공작물은 ‘완공’ 이후에는 어떠한 하자가 있든 ‘해제 ’는 불허됨.","도급"],[206,"의 甲에 대한 저당권설정청구권의 소멸시효 기간은 3년 이다.",true,"666조 저당권설정청구권의 소멸시효기간은 3년.: 공사대금채권 및 공사에 부수되는 채 권은 163조 3호 3년 단기시효. 666조는 공사대금채권을 담보하기 위한 채 권적 청구권으 로서 공사에 부수되는 채권 [2014다211978].","도급"],[207,"의 甲에 대한 공사대 금채권이 양도되는 경우 특별한 사정이 없는 한 乙의 甲에 대한 저당권설정청구권도 이에 수반하여이 전된다.",true,"공사대 금채권양도되면 저당권설정청구권도 수반하여 함께 이전 0 ·: 저당권설정청구권은 공사대금채권에 부수한 권리 一 수급인으로부터 공사대금채권 앙수한 자의 저당권설정 청구로 도급인의 저당권설정행위는 사해행위 X [2015다19827].","도급"],[208,"민법상의 위임계약은 본질상 당사자는 언제든지 이를 해지할 수 있으나, 다만 상대방이 불리한 시기에 해지한 때에는 해지가 부득이한 사유에 의한 것이 아닌 한 그로 인한 손해를 배상하여야 하고, 그 배상의 범위는 위임이 해지되었다는 사실로부터 생기는 손해이다.",false,"689조 2 항의 손해는 해지로 생긴 손해 X 적당한 시기에 해지되었더라면 입지 않았을 손해 O [90 다 18968).","도급"],[209,"己 당사자가 위임계약을 체결하면서 민법 제689조에 규정된 바와 다른 내용으로 해지 사유 및 절차 등을 정하였다면, 민법 제689조가 위 약정과는 별개 독립적으로 적용 된다고 볼 만한 특별한 사정이 없는 한. 위 약정에서 정한 해지사유 및 절차에 의하지 않고는 계약을 해지할 수 없다.",true,"위임의 689조 1 • 2항(상호해지자유. 손해배상)은 임의규정 一 당사자 약정으로 위 규정 배 제 0 一 약정하면 해지의 사유 • 절차. 손해배상책임은 약정에 따르게 되고. 위임계약 자유 롭게 해지할 수 X [2017다53265].","도급"],[210,"156 • PART 2 채권각론.",true,"착오송금의 경우 부당이득반환은 수취인을 상대로 0, 수취은행을 상대로 X ·: 송금의뢰 인과 수취인 사이 계좌이체 원인 존부 불문하고 이체와 동시에 수취인과 수취은행 사이 계 좌이체 금액 상당의 예금계약이 성립하고. 수취인은 수취은행에 대하여 위 금액 상당 예금 채권 취득 一 수취은행은 이익 X [2007다51239].","도급"],[211,"계 좌이체가 된 경 우에는 예 금원장에 입금 기 록이 된 때에 예 금이 된다고 예 금 거 래기 본약관에 정 하여져 있더라도, 송금의뢰인이 계좌이체의 원인인 법률관계가 존재 하지 아니 함에도 착오로 수취 인의 예 금구좌에 계 좌이체를 한 경우, 수취 인이 수 취은행에 대 하여 위 금액 상당의 예 금채 권을 취득하는 것은 아니다.",false,"착오송금의 경우 부당이득반환은 수취인을 상대로 0, 수취은행을 상대로 X ·: 송금의뢰 인과 수취인 사이 계좌이체 원인 존부 불문하고 이체와 동시에 수취인과 수취은행 사이 계 좌이체 금액 상당의 예금계약이 성립하고. 수취인은 수취은행에 대하여 위 금액 상당 예금 채권 취득 一 수취은행은 이익 X [2007다51239].","도급"],[212,"조합계약의 제 결 당사자는 「민법」이 정한 조합의 해산 사유와는 다른 사유를 추가할 수 있으나 청산에 관한 규정과 그 내용을 달 리하는 특약은 효 력이 없다.",false,"조합의 해산 · 청산 절차는 강행규정 X (특약으로 달리 정할 수 0 ) [84 다카 1921l ·: 어차 피 조합원 개인책임 부담 조합채권자 보호 위한 것 X ® 「 민법쇼01- 조합의 성질을 가지는 공동수급체의 구성원 지 위는 원칙적으로 회 사의 분 할합병으로 인 한 포괄승 계의 대 상이 되지 않는다.","도급"],[213,"조합의 해산 · 청산 절차는 강행규정 X (특약으로 달리 정할 수 0 ) [84 다카 1921l ·: 어차 피 조합원 개인책임 부담 조합채권자 보호 위한 것 X ® 「 민법쇼01- 조합의 성질을 가지는 공동수급체의 구성원 지 위는 원칙적으로 회 사의 분 할합병으로 인 한 포괄승 계의 대 상이 되지 않는다.",true,"[상법 ] 공동수급체는 민법상 조합 성질 공동수급체 구성원 사이에 구성원 지위 제3자 양도 가능 약정 않은 이상. 공동수급체의 구성원 지위는 상속 X 다른 구성원들 동의가 없으면 이전 불허되는 귀속상 일신전속적 권리의무 0, 회사 분할합병으로 인한 포괄승계 대상 X [2010다44002].","도급"],[214,"조합 당사자 간 불화·대립으로 신뢰관계가 파괴되어 조합업무의 원만한 운영을 기대할 수 없다는 사정은 조합계약의 해지 사유가 될 수 있다.",false,"제720조 조합 해산사유인 ‘부득이한 사유에는 경제계 사정변경. 조합 재산상태 악화 등으로 조합 목적달성 현저히 곤란하게 된 경우 외에 조합원 사이 반목·불화 · 대립으로 신뢰 관계 파괴되어 조합의 원만한 공동운영 기대할 수 없게 된 경우 포함 0, 신뢰관계 파괴에 책임 있는 당사자도 조합 해산청구권 O [92다21098].","도급"],[215,"조합에서 조합원이 탈퇴하는 경우, 탈퇴자와 잔존자 사이의 탈퇴로 인한 지분계 산에 있어서는 조합 내부의 손익분배비율이 아니라 실 제 출자한 자산가액비율에의 하여야 하는 것이 원칙이다.",false,"조합에서 조합원이 탈퇴하는 경우, 탈퇴자와 잔존자 사이의 탈퇴로 인한 계 산은 특별한 사 정이 없는 한 719조 1항 2 항에 따라 ‘탈퇴 당시의 조합재산상테를 기준으로 평가한 조합 재산 중 탈퇴자의 지분에 해당하는 금액을 금전으로 반환해야 一 조합원 지분비율은, 조합 청산에서 실제 출자한 자산가액 비율로 하는 것과 달리, 조합 내부 손익분배 비율 기준으로 계산해야 [2022다285523, 2022다285530].","기타전형계약"],[216,"丁 조합원의 임의 탈퇴는 조합계약에 관한 일종의 해지로서 다른 조합원에 대한 의사표시로써 하여야 하는데, 그 의사표시는 묵시적으로도 할 수 있다.",true,"[2015다30206].","기타전형계약"],[217,"이 탈퇴함으로써 조합관계가 종료되고 그 결과 조합은 당연히 해산 또는 청산 된다.",false,"2 인에서 1인 임의탈퇴 0 一 조합관계 종료 0 一 조합해산 x. 청산 X 一 합유재산이 단 독소유 되고 탈퇴자 • 잔존자 사이 계산 O [86 다카2484〕.","기타전형계약"],[218,"甲과 乙의 합유에 속한 조합재산은 乙의 탈퇴 후 甲의 단독소유에 속한다.",true,"위 지문 L. 해설참조.","기타전형계약"],[219,"己 * 乙은 甲에 대해 탈퇴로 인한 조합재산의 계산을 요구할 수 있으며 그 계산은 乙의 탈퇴 당시의 조합재산 상태에 의하여야 한다.",true,"탈퇴자는 탈퇴 당시의 조합재산 계산 결과 조합 재산상태가 적자 아닌 경우에 지분 환급 0 一 탈퇴자는 별도 약정 없는 한 지분 환급을 주장하는 사람에게 조합재산 상태 증명책임 O [2019다207851 ].","기타전형계약"],[220,"0. 乙의 지분을 계산할 때 지분을 계산하는 방법에 관해서 별도 약정이 있다는 등 특별 한사정이 없는한조합재산의 상태를증명할책임은 甲에게 있다.",false,"위 지문 근. 해설 참조.","기타전형계약"],[221,"조합에서 조합원이 탈퇴하는 경우, 탈퇴자에게는 조합재산 중 탈퇴자의 지분에 해 당하는 금액을 금전으로 반환한다.",true,"7, L 지문 해설 : 조합에서 조합원이 탈퇴하는 경우, 탈퇴자와 잔존자 사이의 탈퇴로 인 한 계산은 특별한 사정이 없는 한 719조 1항 2 항에 따라 ‘탈퇴 당시의 조합재산상태를 기 준으로 평가한 조합재산 증 탈퇴자의 지분에 해당하는 금액을 금전으로 반환해야 [2022다285523, 2022다285530].","기타전형계약"],[222,"조합의 구성원들 사이에 내부적인 법률관계를 규율하기 위한 약정이 있는 경우 한쪽 당사자가 그 약정에 따른 의무를 이행하지 않아 다른 상대방에게 손해가 발 생하였다면 그 상대방에게 채무불이행에 기한 손해배상책임이 인정된다.",true,"조합계약도 계약자유 원칙 적용 0, 구성원들은 자유로운 의사에 따라 조합계약 내용 정할 수 0 一 조합 구성원들 사이 내부적 법률관계 규율 위한 약정 있는 경우 그들 사이 권리 • 의무는 원칙적으로 그 약정에 따라 一 한쪽 당사자가 약정에 따른 의무 이행하지 않아 상 대방이 도급인에 대한 의무 이행하기 위해 손해 발생했다면 상대방에게 채무불이행 손해배상책임 O [2021다284035].","기타전형계약"],[223,"의 채권자 丙이 乙에 대한 대여 금채권으로써 乙을 집행채무자로 하여 조합의 채권에 대 하여 강제집행을 하는 경우, 甲은 보존행위로서 제3자 이의의 소를 제기 하여 그 강제집행의 불허를 구할 수 있다.",true,"조합의 채권은 조합원 전원에게 합유적 귀속, 조합원 1인이 임의로 조합의 채무자에 대해 출자지분 비율에 따른 급부청구 X 一 조합원 중 1인의 채권자가 그 조합원 개인을 집행 채무자로 조합의 채권에 대해 강제집행하면 다른 조합원으로서는 보존행위로서 단독으로 제3자이의 소 제기 O [97다4401).","기타전형계약"],[224,"이 조합에서 탈퇴하는 경우, 특별한 사정이 없는 한 조합채 권자는 甲에게 조합채무 전부의 이행을 청구할 수 있다.",true,"조합채무는 조합원들이 합유적으로 부담하는 채무, 2인 조합에서 1인 탈퇴하면 조합관계 종료 0, 조합 해산 X, 합유인 조합재산은 남은 조합원에게 귀속 0 一 조합채권자는 잔존 조합원에 대해 조합채무 전부 이행 청구 O [99 다 1284).","기타전형계약"],[225,"0 * 조합채무는 조합원들이 조합재산에 의하여 합유적으로 부담하는 채무이고 2인으로 이루어진 조합관계에 있어 그 중 1 인이 탈퇴하면 탈퇴자와의 사이에 조합관계는 종료된다 할 것 이나, 특별 한 사정이 없는 한 조합은 해산되지 아니하고 조합원 들의 합유에 속한 조합재산은 남은 조합원에게 귀 속하게 되므로이 경우 조합채권 자는 잔존 조합원에게 그 조합채무 전부에 대한 이행을 청구할 수 있다.",true,"2 인에서 1인 임의탈퇴 0 一 조합관계 종 rue,"경매 신청 당시 피담보채권 이미 소멸되어 무효인 근저당권에 기초하여 임의경매절차 개 시, 매수인 매 각대금 완납 一 경매절차 무효, 경락인 소유권 취득 X 一 경락인은 배당금 수령한 채권자 상대로 배당받은 금액에 부당이득반환 청구 O 피압류채권 존재하지 않는다면 압류명령과 전부명령 무효 一 집행채권 변제로 소멸되는.","사무관리"],[239,"수 익 자가 취 득한 것이 성 질 상계속 적으로 반복하여 거래되는 물품으로 서 곧 바로 판매되어 환가될 수 있는 금 전과 유사한 대체 물 인 경우에는, 이를 취 득한 자가 소 비하였는가 여 부를 불문하고이 득이 현존하는 것으로 추정한다.",true,"부당이득으로 취득한 것이 성질상 계속적 반복하여 거래되는 물품으로서 곧바로 판매되어 환가될 수 있는 금전과 유사한 대체물이라면 현존 추정됨 [2007다20440].","부당이득"],[240,"법정지상권이 있는 건 물의 양수인으로서 장차 법정지상권을 취 득할 지위에 있어 대지 소유자의 건물 철 거나 대지 인도 청구를 거부할 수 있는 자라 하더라도, 그 대 지를 점유·사용함으로 인하여 얻은 이 득은 부당이득으로서 대지 소유자에게 반환 할 의무가있다.",true,"법정지상권 있는 건물양수인이 법정지상권 취득할 지위로서 건물철거 거부할 수 있다고 하더라도 대지 점거사용으로 얻은 실질적이 득은 대 지소유자에 게 손해 끼치는 한에 서는 부당이득반환의무 O [94다61144].","부당이득"],[241,"24.08!i! - 24 ® 저당권자와 같이 배 당받을 권리 있는 채권자가 자신이 배당받을 몫을 받지 못하고 그로 인해 권리 없는 다른 채권자가 그 몫을 배당받은 경우. 배당이의 여부 또는 배 당표의 확정 여 부와 관계없이 배당받을 수 있었던 채권자가 배당금을 수 령한 다른 채권지를 상대로 부당이 득반환청구를 할 수 있다.",true,"배 당받을 권리 있는 채권자(선순위 권리 자)가 자신이 배 당받을 몫을 받지 못하고 그로 인 해 권리 없는 다른 채권자(후순위 권리 자)가 그 몫을 배 당받는 경우. 배 당이의 여 부. 배당 표 확정 여부와 관계없이 배 당받을 수 있었던 채권자가 배 당금 수령한 다른 채권자를 상대로 부당이득반환 o •.• 실체법 질서에 부합. 현실적 필요성( 배 당이의 소의 한계. 채권자취소소송 가액반환 문제점 보완) 一 종래 대 법원 판례 유지 [2014다206983].","부당이득"],[242,"집행력 있는 정본을 가진 채권자는 배당요구의 종 기까지 배당요구를 하지 않았 다고 하더라도, 자신이 배 당에서 제외되는 것으로 배당표가 작성됨으로써 비로소 배당을 받게 된다른 채권지를 상대로 부당이 득반환청구를 할 수 있다.",false,"배당요구채권자가 배당요구 하지 않았다면 배당받을 수 없고 배당실시 이후 배당받은 자에게 부당이득반환청구 X [2001다7070인.","부당이득"],[243,"구분소유자 중 일부가 정당한 권원 없이 집합건물의 복도, 계단 등과 같은 공용 부분을 배타적으로 점유·시용훈1-으로써 이익을 얻고 그로 인하여 다른 구분소유자 들이 해당 공용부분을 사용할 수 없게 되었다 하더라도, 해당 공용부분이 구조상이를 별개 용도로 시용 하거나 다른 목적으로 임대할 수 있는 대상이 아니라면 부당이 득반환의무가 인정되지 아니 한다.",false,"구분소유자 중 일부가 정당한 권원 없이 집합건물의 복도 • 계단 등 ‘공용부분’ 배타적 점유 · 사용함으로써 이익 얻고 그로 인해 다른 구분소유자들이 사용할 수 없게 되면 부당이득반환의무 0 一 구조상 별개 용도 人돋;하거나 다른 목적 임대할 수 없는 공용부분이 어도 마찬가지 一 제3자가 공용부분을 권원 없이 배타적 점유 •사용할 경우도 마찬가지 [2017다220744] 一 2020년 전원합의체로 위와 같이 판례변경.","부당이득"],[244,"유효한 도급계약에 기하여 수급인 丙이 도급인 乙로부터 甲 소유의 물건을 인도 받아 수리한 결과 그 물건의 가치가 증가한 경우 丙은 甲을 상대로 직접 증가액 상 당의 민법 제203조에 의한 비용상환이 나 제741조에 의한 부당이득반환을 청구할 수없다.",true,"[99다66564].","부당이득"],[245,"수익자가 법률상 원인 없이이 득한 재신을 처분함으로 인하여 원물반환이 불가 능한 경우 반환하여야 할 가액은 특별한 사정이 없는 한 가액반환 당시의 시 가를 기 준으로 할 것이 아니라 처분 당시의 대가를 기준으로 하여야 한다.",true,"수익자가 원물을 처분한 경우 가액반환은 처분당시의 대가의 가액이고, 고 후 가격 앙등분은 이득 X [94다25551 ].","부당이득"],[246,"급부부당이 득의 경우 법률상 원인이 없다는 점에 대한 증 명책임은 부당이 득반환을 주장하는 사람에게 있고, 침해부당이 득의 경우에는 부당이득반환청구의 상대방이 스스로 그 이익을 보유할 정당한 권원이 있다는 점을 증명하여야 한다.",true,"일방이 자신의 의사로 일정한 급부를 한 E돋臼금부가 법률상 원인 없음을 이유로 반환청구 하는 이른바 급부부당이득의 경우. 법률상 원인 없음에 대한 증명책임은 부당이득반환 주 장자 / 타인 재산권 등을 침해하여 이익 얻었음을 이유로 부당이득반환 구하는 이른바 침 해부당이득의 경우. 청구 상대방이 이익 보유할 정당한 권원 있음을 증명하여야 [2017다37324].","부당이득"],[247,"제141조(취소의 효과) 취소된 법률행위는 처음부터 무효인 것으로 본다 다만 제한능력자는 그 행위로 인하여 받은 이익이 현존하는 한도에서 상환할 책임이 있다.",true,"141조 단서는 제한능력자 보호 취지로 부당이득반환 범위인 748조의 특칙, 의사무능력자에게 유추적용 0, 다만 금전상 이익은 현존 추정 一 의사무능력자가 자기 소유 부동산에 저당권 설 정해주고 금융기관으로부터 대출받아 제3자에게 대여했다면 대출로 받은 이익이 제3자에 대한 대여금채권 또는 부당이득반환채권 형태로 현존 一 금융기관은 대 출약정 무효에 따른 부당이득으로 대출금 자체의 반환을 구할 수는 X. 현존이익인 위 채권양도를 구할 수 O [2008다58367].","부당이득"],[248,"은 민법 제746조에서 말하는 이익에는 해당하지 아니하므로. 그 부동산의 소유자는 위 등기의 말소를 청구할 수 있다.",true,"103조 위반한 도박채무의 담보로 근저당권을 설정했다면 불법원인급여 X 一 말소청구 0 ·: 종국적 X, 불법원인급여의 이익은 종국적이어야, 종속적이면 X, 이익 향수 위해 경매 신청의 별도 조치 취해야 하므로 (93다55234].","부당이득"],[249,"매도인에게 소유권이 유보된 채 매수인에게 인도된 건축자재가, 매매대금이 모 두 지급되지 않은 상태에서 매수인과 제3자 사이에 체결된 도급계약의 이행에 따라 제3자 소유의 신축전물에 부합된 경우, 매도인은 제3자가 소유권 유보에 관하여 과실 없이 알지 못하였더라도 그에게 부당이 득의 반환을 청구할수 있다.",false,"261조 보상청구권이 인정되려면 261조 자체의 요건 외에 부당이득반환의 요건도 모두 충 족되어야 一 매도인에게 소유권 유보된 자재가 제3자와 매수인 사이 도급계약 이행으로 제3자 소유 건물에 부합된 경우, 제3자가 도급계약에 제공된 자재의 소유권 유보 사실에 관하여 선의·무고의이라면 선의취득 법리 유추적용하여 제3자가 자재 귀속 이익을 보유 할 법률상 원인 0 一 매도인은 제3자를 상대로 보상청구 X [2009다15602].","부당이득"],[250,"타인 소유의 토지 위에 권원 없이 건물을 소유하고 있는 자는 그 건물을 실제로 사용, 수익하고 있지 아니하더라도 특별한 사정이 없는 한 법률상 원인 없이 타인의 재산으로 인하여 토지의 차임에 상당하는 이익을 얻고 이로 인하여 타인에게 동 일한 금액 상당의 손해를 주고 있다고 보아야 한다.",true,"타인 소유 토지 위에 권한 없이 건물 소유하는 자는 그 자체로써 법률상 원인 없이 타인 재산으로 ‘토지 ’ 차임 상당 이익 얻고 이로 인해 타인에게 동액 상당 손해 주는 것 [98 다 2389] 一 건물에서 영업 안 했어도 실질이익 0, 부당이득 0.","부당이득"],[251,"채무자가 횡령한 금전으로 자신의 채권자에 대한 채무를 변제하는 경우, 채권자가 그 변제를 수령함에 있어 악의 또는 중대한 과실이 있다면 채권자의 금전 취득은 피해자에 대한 관계에 있어서 법률상 원인을 결여한 것으로 된다.",true,"채무자가 피해자로부터 횡령한 금전으로 채권자에게 변제한 경우 一 피해자의 손실과 채 권자 이득 사이 인고民P11 있음은 명백 一 채권자가 변제를 수링함에 있어 횡령사실에 악의 • 중과실 있다면 채 권자 금전 취득이 피해자에 대한 관계에서 법률상 원인 결여, 단순히 경과실이 면 변제 유효하고 법률상 원인 결여 X [ 2003다8862 ].","부당이득"],[252,"임차인이 임대인의 동의를 받지 않고 제3자에게 임차권을 전대하여 임치목쵸l 물을 사용 ·수익하게 하였다는 이유로 임대차계약이 적법하게 해지되었다면, 소유자 인 임대인은 여전히 그 목적물을 사용·수익하는 전차인에 대해 부당이 득반환청구 를할 수 있다.",true,"무단전대의 경우 임대인이 해지하거나 임대차 적법 종료하지 않는 한 임대차계약이 존속 하는 한도 내에서는 제3자에게 불법정유 이유로 차임 상당 손해배상청구 X 부당이득반환 X._. 여전히 임차인에 대해 차임청구권 보유하므로 [2006다10323] 그러나 임대차계약 종료 이후에는 임차물 소유자 임대인은 제3자에 대해 차임 상당 손해배상청구 0, 부당이득반환청구 O [2022다296165].","부당이득"],[253,"근저당권부 채권의 질권자 A에게 근저당목적물인 부동산에 대한 경매절차에서 배 당이 이루어졌는데, 근저당권자 B의 근저당권 피담보채무자 C 에 대한 채권이 100만 원임에도 불구하고, 150만 원으로 잘못 알고 A에게 150만 원이 배당되었다면 (A 의 질권설정자 겸 근저당권자 B 에 대한 채권은 200만 원) ， 초과 배당된 50만 원에 관하여 A가 아니라 B가이를 정당하게 배당받을 권리가 있는 배당채권자에게 부당이득으로 반환해야 한다.",true,"부당한 배당에 대한 부당이득반환의무 부담하는 자는 실체법적으로 법률상 원인없이이득 얻은 사람을 의미, 경매절차에서 현실적으로 배당금을 수령한 사람과 언제나 일치하여야 하는것은 X 질권설정자의 채무자에 대한 근저당권부채권 범위 초과하여, 질권자의 질권설정자에 대한 피담보채권 범위 내에서, 질권자에게 배당금이 직접 지급됨으로써 질권자가 피담보채 권의 만족 얻으면 실체법상 배당으로 법률상 원인 없는 이득 얻은 자는 질권자 X, 질권 설정자 0 ·: 질권자는 실체법적 법률상 원인에 기해 배당금 수령, 질권설정자는 근저당 권부채권이라는 법률상 원인 범위 초과하여 질권자에게 배당금 지급되게 함으로써 자신의 질권자에 대한 피담보채무 소멸하는 이익 O [2023다315155].","부당이득"],[254,"양도담보 목적물인 동산이 타인의 토지 위에 무단으로 설치된 경우, 토지소유자에 대한 부당이 득반환의무는 특별한 사정이 없는 한 양도담보권자가 아니라 양도담 보설정자가부담한다.",true,"앙도담보 설정자가 채권 담보 위하여 그 소유 동산을 채권자에게 양도한 경우, 반대 특약이 없는 한 양도담보 설정자가 동산의 사용 •수익 권 0 一 양도담보 동산이 특정 토지 위에 설치되어 토지 점유 · 사용이 문제된 경우 원칙적으로 양도담보설정자가토지를 점유 · 사 용하여 부당이득 한 것 O [2018다201429].","부당이득"],[255,"도하여 등기를 이전한 경우, 명의신탁자는 명의수탁자를 상대로 제3자로부터 받은 매매대 금을 부당이 득으로 반환할 것을 청구할 수 있다.",true,"실명법 시행 전 3자간 등기영의신탁·등기가 유예기간 경과로 무효가 되어도 신탁자는 수 탁자에 대해 부당이득반환 소이등청구 X ·: 신탁자는 매도인에 대해 여전히 매매 소이등 청구권 보유하여 손해 없음, 소유권이 매도인에게 복귀했는데 무효 등기의 수탁자에게 이전등기청구 X [2008다55290].","부당이득"],[256,"임차인이 임대인의 동의를 받지 않고 제3자에게 임차권을 양도하여 임차물을 사용 수익하게 한 경우, 임대인은 임대차계약이 적법하게 종료되 지 않는 한 제3자에 게 차임 상당의 부당이득반환을 청구할 수 .","부당이득"],[263,"의사의 설명의무위반에 대 한증명책임은특별한사정이 없는한환자측에 있다.",false,"위 지문 해설 참조.","부당이득"],[264,"의사의 설명의무는 의료행위가 행 해 질 때까지 적절한 시 간적 여 유를 두고 이행되어 야한다.",true,"의사의 설명의무는 의료행위 행해질 때까지 적절한 시간적 여유 두고 이행되어야 一 의사가 환자의 의사결정에 충분한 시간 주지 않고 설명한 E悟; 곧바로 의료행위 Lf{)|가면 환자의 선택할 기회 침해 0 ·: 환자가 의료행위 응할지 합리적 결정하려면 의료행위의 필요 성 • 위험성 등을 환자 스스로 숙고하고 필요하면 가족 등과 상의하고 결정 할 시간적 여유 주어져야 [2021다265010〕.","부당이득"],[265,"틱 환자가 미 성년자로의 사결정능력이 있다 하더라도 자신의 신 체에 위험을 가하는의 료행위에 관한 자기결정권까지 가진다고 보기는 어려우므로 원칙적으로의 사는 미 성 년자인 환자에 대해 서는 의료행위에 관하여 설명할 의무를 부담하지 아니 한다.",false,"환자가 미성년자라도 의사결정 능력 있는 이상 자신 신체에 위험 가하는 의료행위에 자기 결정권 0, 의사는 미성년자 환자에 설명의무 부담 0 一 그러나 의사가 미성년자 환자의 친권자 • 법정대리인에게 의료행위 설명했다면 그를 통해 전달됨으로써 미성년자 환자에 설명의무 이행 0 一 다만 친권자 등에게 설명해도 전달되지 않아 의료행위 결정 • 시행에 미성년자 의사 배제될 것 명백하거나 미성년 환자가 의료행위에 적극적 거부의사 보이는 등 특별한 사정 있다면 친권자 등에 대한 설명만으로 설명의무 다한 것 X, 미성년 환자에 게 직접 설명해야 [2020다218925).","부당이득"],[266,"甲이 위법하게 乙의 점유를 침탈하여 乙의 유치권이 소멸한 경우. 乙이 甲에게 불법행위로 인한 손해배상 청구를 하려면 점유를 침탈당한 날부터 1년이 내에 손해 배 상을 구하는 소를 제기해야 한다.",false,"204조 3 항의 제척기간 1년은 출소기간 一 본권 침해로 인한 손해배상청구권 행사에는 적용 X 一 점유 침탈로 유치권 소멸당한 자의 손해배상청구권은 침탈당한 날부터 1년 내에 행사할 필요 X [2021다213866].","부당이득"],[267,"일반 공중의 통행에 공용된 도로의 소유자 아닌 甲이 乙의 통행을 방해하여 불법행 위가 성립한 경우, 乙은 甲에게 손해배상 청구를 할 수 있으나 장래에 생길 방해를 예 방하기 위하여 통행방해 행위 금지를 청구할 수는 없다.",false,"불특정 다수인 일반 공중 통행에 공용된 도로. 측 ‘공로’를 통행하려는 자는 그 도로에 관해 다른 사람 권리 등 침해하는 등 특별한 사정 없는 한. 일상생활상 필요한 범위 내에서 다른 사람들과 같은 방법으로 도로 통행 할 자유 0 一 제3자가 특정인에 대하여만 도로 통행 방 해함으로써 일상생활 지장 받게 하여 통행 자유 침해하면 민법상 불법행위 0 一 침해받 온 자는 방해배제나 장래 방해예방 위해 통행 방해행위금지 소구 O [2020다229239 ].","부당이득"],[268,"태에서 영업 양도에 수반하는 근로계약의 인수가이루 어지고 위 근로자도 이에 대해 동의 하 더라도 불법행위로 인 한 손해배 상채 권을 인수 대상에 포함하기로 하는 특약이 없는 한이 채권은 영업양수인에게 이 전되지 않는다.",false,"계약인수는 계약당사자 지위 승계. 계약에서 생기는 채권 • 채무. 해제권 등 포괄적 권리의무 앙도. 앙도인은 계약관계 탈퇴 특별한 사정 없는 한 잔류당사자와 앙도인 사이 계약관 계 X 채권채무 소멸 一 계약인수는 당사자 3인 관여 있어야 효력 발생(통상 양도인 • 양수인 • 잔류당사자 합의 삼면계약, 2인 합의가 선행하면 나머지 동의 • 승낙 있어야 효력 발생). 개별 채권앙도는 앙도인 • 앙수인 2인 관여로 효력 발생 一 채권양도에서 채무자 보호 위한 대 항요건은 계약인수에서는 별도 요구 x. 상법상 영업양도 수반 계약인수도 마찬가지 甲주식회사 • 乙주식회사 사이 영업양도계약체결 하며 근로자(丙 등)에 대한 사용자의 모든 8971].","일반불법행위"],[289,"甲이 자기 소유인 B 아파트를 乙에게 매도하고 매매대금을 전부 지급받은 후 乙의 승낙 없이 임의로 B 아파트에 관하여 제3자에게 근저당권설정등기를 경료하였다면, 특별한 사정이 없는 한 乙은 甲의 불법행위로 인하여 그 피담보채무 상당의 손해를 입었다고 할 수는 있으나 곧바로 매매대금 상당액의 손해를 입었다고 할 수는없다.",true,"[97다4760].","일반불법행위"],[290,"甲 회사가 인터넷 사이트를 이용한 광고시스템 프로그램을 인터넷 사용자들에게 제공하여 이를 설치한 인터넷 시용 지들이 乙 회사가 운영하는 인터넷 포털사이 트를 방문하면 그 화면에 乙 회사가 제공하는 광고 대신 甲 회사의 광고가 대체 또는 삽입된 형태로 나타나게 한 경우, 그러한 甲 회사의 행위는 부정한 경쟁행위 로서 민법상 불법행위에 해당될 수 있다.",true,"[2008마1541 ].","일반불법행위"],[291,"터 * 甲이 일반인들의 통행에 제공되어 온 도로에 토지관리소를 축조하고 개폐식 차 단기를 설치한 다음 자동차 운전자들에게 행선지 및 방문목적 등올 확인한 후 차단 기를 열어 통행할 수 있게 하면서 乙을 포함하는 특정인들이 운행하는 지동 차에 대 하여 통행을 금지한 경우, 乙은 甲의 행위가 민법상 불법행위에 해당함을 이유로 甲을 상대로 통행방해 행위의 금지를 소구할 수 있다.",true,"불특정 다수인 일반 공중 통행에 공용된 도로, 측 ‘공로를 통행하려는 자는 그 도로에 관해 다른 사람 권리 등 침해하는 등 특별한 사정 없는 한, 일상생활상 필요한 범위 내에서 다른 사람들과 같은 방법으로 도로 통행할 자유 0 一 제3자가 특정인에 대 하여만 도로 통행 방 해함으로써 일상생활 지장받게 하여 통행의 자유 침해하면 민법상 불법행위 0 一 침해받은 자는 방해배제나 장래 방해예방 위해 통행방해행위금지 소구 O [2020다229239〕.","일반불법행위"],[292,"불법행위 당시 기간을 정한 계약에 따라 근무하고 있는 피해자의 일실수익 중 그 계 약기간 이후의 것에 대하여는 특별한 사정이 없는 한 일용노동 임금을 기초로 산정 하여야한다.",false,"피해자가 근무하던 회사가 사고 후 폐업 一 피해자의 사망 때문에 회사가 도산되었다는 등 특별한 사정 없는 한 피해자가 페업 이후 정년시까지 계속 근무할 수 있는 것을 전제로 일 실수입 산정하면 X 一 피해자의 연령 • 경력 •전업가능성 등에 비추어 장차 피해자가 종사 가능해 보이는 직업과 그 소득을 조사 심리해야 一 폐업 이후 일실수입을 단순히 일반노동 임금으로 X [97다5367].","일반불법행위"],[293,"불법행 위의 성립요건으로서 위법성은 문제가 되는 행위마다 개별적 • 상대적으로 판단하는 것이 아니고, 관련 행위 전체를 일체로 보아 판단하여 결정 해야 한다.",false,"750조의 ‘ 위법행위’는 법률 위반 한정되지 않고 전체 법질서 관점에서 사회통념 상 위법 도 포함 0 一 관련 행위 전체보다 문제된 행위마다 개별적 • 상대적으로 판단해야 一 소 유권 비롯한 절대권 침해뿐 아니라 법률상 보호가치 있는 이익 침해도 포함 O [2019다268061].","일반불법행위"],[294,"부당한 보전처분으로 인한 손해배상책임이 성립하기 위해서는 일반적인 불법행위의 성립에 있어서 필요한 고의 또는 과실 이외에 오로지 채 무자에게 고통을 주려고 보전처분을 하였다는 점까지 필요한 것은 아니다.",true,"가압류 • 가처분 집행 후에 본안소송 패소한 경우 보전처분 집행으로 인하여 채무자가 입은 손해에 대하여는 집행채권자의 고의 • 과실 추정 O [92다8453].","일반불법행위"],[295,"태양반사광으로 인하여 생 활방해가 발생하는지를 판단하는 때에는 건물이 위 치한 지역의 ‘국토의 계획 및이 용에 관한 법률'상 용도뿐만 아니라 태양반시굉 침해를 일으키고 있는 건물이 존재하는 해당 지역의 구체적인 이용 현황도 고려하여 야한다.",true,"[2016다33202].","일반불법행위"],[296,"법정대위를 할 자는, 채권자가 고의나 과실로 담보를 상실하게 하거나 감소하게 한 때에 원칙적으로 민법 제485조에 따라 면책을 주장할 수 있을 뿐이지만, 채권자가 제3자에 대하여 자신의 담보권을 성실하게 보존 • 행사하여야 할 의무를 부담하는 특별한 사정이 인정 되는 경우에 는 채권자의 담보권의 포기 행위가 불법행 위에 해당 할 수 있다.",true,"채권 • 담보권의 불행사 • 포기가 485조 면책이 적용되는 것은 별론으로 해도 불법행위는 아 니지만 채권자가 제3자에 대해 담보권 성실 보존 • 행사 의무 부담하는 특별한 사정 있다 면 담보권 포기 행위가 예외적 불법행위 0 물상보증인 甲 채무자 乙 그 공유토지에 공동근저당권자 丙 一 甲 지분 먼저 경매개시되 어 경락인 완납 一 丙이 乙 지분의 근저당권등기 말소해줌 一 위 경매 배당절차에서 丙의 신고채권액 전부 배당받는 배당표 작성 一 丙은 甲에 대해 자신의 담보권 성실 보존 • 행사 할 의무 부담함에도 곧 변제자대위 대상이 될 채무자 지분의 근저당권설정등기 말소해준.","일반불법행위"],[297,"친권자나 법정대리인에게 설명하더라도 마성년자에게 전달되 지 않아 의료행위 결 정 과 시 행에 미 성년자의 의사(意思)가 배제 될 것이 명백한 경우, 의 사는 친 권자나 법정 대리 인에 대한 설명 만으로 설명의무를 다하였다고 볼 수 없다.",true,"의사가 미성년자 환자의 친권자나 법정대리인에게 의료행위 설명했다면 그를 통하여 미성 년자 환자에게 전달됨으로써 미성년자 환자에 대한 설명의무 이행 0 ·: 미성년자 환자는 친권자 등의 보호 아래 병원 방문하여 의사 설명 듣고 의료행위 선택 • 승낙 상황이 많고. 정신적 • 신체적 미성숙하여 이런 방식이 미성년자 복리 위해 더 바람직 一 다만 친권자 등에게 설명하여도 전달되지 않아 의료행위 결정 • 시행에 미성년자 의사가 배제될 것 명백하거나 미성년자 환자가 의료행위에 적극적 거부의사 보이는 등 특별한 사정 있다면 친권자 등에 대한 설영만으로 설명의무 X. 미성년자 환자에게 직접 설명해야. 나이나 이해 정도에 맞추어 설명해야 [2020다218925].","일반불법행위"],[298,"피용자의 가해행위가 사용자의 사업과 시간적 • 장소적으로 근접하고 가해행위의 동 기가 업무처리와 관련되 어 있다 면 사무집행관련성이 인정된다.",true,"피용자가 고의로 타인에게 가해행위(호텔 종업원의 손님 상해행위)를 한 경우. 행위가 피용자 사무집행 자체는 아니더라도 사용자 사업과 시간적 • 장소적 근접하고, 피용자 사무의 전부 • 일부 수행과정에서 이뤄지거나 가해행위의 동기가 업무처리와 관련되면 외형적 • 객 관적으로 사무집행 관련성 O [99다47297].","일반불법행위"],[299,"사용자가 손해를 배상한 경우에 사용자의 피용자에 대한 구상권의 범위는 신의칙상 상당하다고 인정되는 범위로 제 한된다.",true,"피용자의 업무집 행으로 행한 불법행위로 인해 人돋;자가 직접 손해 입거나 사용자책임 부 담한 결과로 손해 입은 경우. 사용자는 공평 분담 견지에서 신의칙상 상당한 한도 내에서 만 피용자에 대해 구상권 행사 一 사업의 성격 • 규모. 사업시설 상황. 피용자 업무내용 • 근 로조건 • 근무태도. 가해행위 상황 등 제반사정 고려 [86 다카 1045].","일반불법행위"],[300,"피용자가 제3자와 공동으로(과실 비율 5 :5) 피해자에게 손해를 가하고 사용자가 그 피해자에게 손해 전부를 배 상하였다면 사용자는 위 제3자에 대하여 자신이 피해 자에게 지 급한 배상액 전부를 구상할 수 있다.",false,"피용자와 제3자가 공동불법행위로 피해자에게 손해를 가한 경우 피용자와 제3자는 공동불법행위자로서 부진정연대관계 一 사용자의 손해배상책임은 피용자의 배상책임에 대한 대 체적 책임이어서 사용자도 제3자와 부진정연대관계 一 사용자가 피용자와 제3자의 책임비율에서 피용자 부담부분 초과하여 피해자에게 배상했다면 사용자는 제3자에 대해 제3자의 부담부분에 한하여 구상권 행사 O [91다33070].","일반불법행위"],[301,"피용자의 사무가 외형상 객관적으로 사무집행에 해당하는 경우에도 function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ── CSS ─────────────────────────────────────────── */
const CSS = `
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0d1117;--sf:#161b22;--sf2:#1c2333;--bd:#30363d;--bd2:#21262d;
  --gold:#d4a853;--gold2:#f0c96e;--tx:#e6edf3;--tx2:#8b949e;--tx3:#6e7681;
  --ok:#3fb950;--er:#f85149;--ok-bg:#0d2316;--er-bg:#2d1217;
  --blue:#58a6ff;--purple:#bc8cff;
}
html,body{background:var(--bg);color:var(--tx);font-family:'Pretendard',system-ui,sans-serif;}
.app{min-height:100vh;display:flex;flex-direction:column;}

/* 헤더 */
.hdr{padding:14px 20px;border-bottom:1px solid var(--bd2);background:var(--sf);display:flex;align-items:center;justify-content:space-between;gap:12px;}
.hdr-left{display:flex;flex-direction:column;}
.hdr-title{font-family:'Noto Serif KR',serif;font-size:17px;font-weight:700;color:var(--gold);}
.hdr-sub{font-size:11px;color:var(--tx3);font-family:'IBM Plex Mono',monospace;margin-top:1px;}
.hdr-user{display:flex;align-items:center;gap:8px;}
.uid-badge{font-size:12px;color:var(--tx2);background:var(--sf2);border:1px solid var(--bd);border-radius:14px;padding:4px 12px;}
.logout-btn{font-size:11px;color:var(--tx3);background:none;border:none;cursor:pointer;padding:4px 8px;border-radius:8px;}
.logout-btn:hover{color:var(--er);}

/* 탭 */
.tabs{display:flex;gap:2px;padding:10px 14px 0;border-bottom:1px solid var(--bd2);background:var(--sf);overflow-x:auto;}
.tab{padding:7px 14px;font-size:13px;font-weight:500;color:var(--tx3);cursor:pointer;border-radius:6px 6px 0 0;border:1px solid transparent;border-bottom:none;white-space:nowrap;background:transparent;transition:all .15s;}
.tab:hover{color:var(--tx2);}
.tab.act{color:var(--gold);background:var(--bg);border-color:var(--bd);border-bottom-color:var(--bg);margin-bottom:-1px;}

/* 메인 */
.main{flex:1;padding:20px 16px;max-width:860px;margin:0 auto;width:100%;}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:14px;}
.card-title{font-size:12px;font-weight:700;color:var(--tx3);margin-bottom:14px;text-transform:uppercase;letter-spacing:.6px;}

/* 로그인 */
.login-wrap{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-box{width:100%;max-width:380px;}
.login-header{text-align:center;margin-bottom:28px;}
.login-logo{font-size:11px;color:var(--tx3);letter-spacing:2px;margin-bottom:8px;}
.login-title{font-family:'Noto Serif KR',serif;font-size:24px;font-weight:700;color:var(--gold);margin-bottom:6px;}
.login-desc{font-size:12px;color:var(--tx3);line-height:1.6;}
.login-card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:24px;}
.login-label{font-size:12px;color:var(--tx2);margin-bottom:8px;}
.login-input{width:100%;font-family:'Pretendard',sans-serif;font-size:14px;padding:11px 14px;border:1px solid var(--bd);border-radius:10px;outline:none;background:var(--sf2);color:var(--tx);margin-bottom:10px;transition:border-color .15s;}
.login-input:focus{border-color:var(--gold);}
.login-btn{width:100%;padding:13px;background:var(--gold);color:#0d1117;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;transition:all .12s;}
.login-btn:hover{background:var(--gold2);}

/* 허브 모듈 그리드 */
.hub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:20px;}
.module-card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:20px;cursor:pointer;transition:all .15s;position:relative;overflow:hidden;}

.module-card.soon{opacity:.55;cursor:not-allowed;}

.module-accent{position:absolute;top:0;left:0;right:0;height:3px;border-radius:14px 14px 0 0;}
.module-icon{font-size:24px;margin-bottom:10px;}
.module-name{font-family:'Noto Serif KR',serif;font-size:16px;font-weight:700;color:var(--tx);margin-bottom:3px;}
.module-sub{font-size:11px;color:var(--tx3);margin-bottom:12px;}
.module-stats{display:flex;gap:8px;font-size:11px;font-family:'IBM Plex Mono',monospace;flex-wrap:wrap;}

.soon-badge{position:absolute;top:12px;right:12px;font-size:10px;padding:2px 8px;border-radius:8px;background:var(--sf2);border:1px solid var(--bd);color:var(--tx3);}
.module-bar{height:3px;background:var(--bd);border-radius:2px;overflow:hidden;margin-top:10px;}
.module-bar-fill{height:100%;border-radius:2px;transition:width .3s;}

/* 퀴즈 설정 */
.pill-row{display:flex;gap:7px;flex-wrap:wrap;}
.pill{padding:7px 16px;border-radius:20px;border:1px solid var(--bd);background:var(--sf2);color:var(--tx2);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px;}
.pill:hover{border-color:var(--gold);color:var(--gold);}
.pill.act{background:var(--gold);border-color:var(--gold);color:#0d1117;}

.pill.blue.act{background:rgba(88,166,255,.15);border-color:var(--blue);color:var(--blue);}

.pill.purple.act{background:rgba(188,140,255,.12);border-color:var(--purple);color:var(--purple);}

.tc-icon{font-size:16px;margin-bottom:4px;}
.tc-name{font-size:12px;font-weight:600;color:var(--tx);margin-bottom:2px;}
.tc-cnt{font-size:10px;color:var(--tx3);font-family:'IBM Plex Mono',monospace;}
.tc-wc{font-size:10px;color:var(--er);margin-top:2px;}
.start-row{margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.start-btn{padding:11px 28px;background:var(--gold);color:#0d1117;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;transition:all .12s;}
.start-btn:hover{background:var(--gold2);}
.start-btn:disabled{opacity:.4;cursor:not-allowed;}
.start-hint{font-size:12px;color:var(--tx3);}
.clear-link{font-size:12px;color:var(--blue);cursor:pointer;text-decoration:underline;text-underline-offset:2px;}

/* 진행 */
.prog-wrap{margin-bottom:18px;}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;}

.prog-num{font-size:20px;font-weight:700;font-family:'IBM Plex Mono',monospace;}
.prog-num span{font-size:12px;color:var(--tx3);font-weight:400;}
.prog-bar{height:3px;background:var(--bd);border-radius:2px;overflow:hidden;}

.ps{font-size:11px;color:var(--tx3);}
.ps strong{font-family:'IBM Plex Mono',monospace;}
.ps.ok strong{color:var(--ok);}
.ps.er strong{color:var(--er);}
.ps.mk strong{color:var(--purple);}

/* 퀴즈 카드 */
.qcard{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:24px 20px;margin-bottom:14px;}

.qcard-no{font-size:11px;color:var(--tx3);font-family:'IBM Plex Mono',monospace;}

.rv-toggle{font-size:12px;color:var(--blue);cursor:pointer;margin-top:5px;display:inline-block;text-decoration:underline;text-underline-offset:2px;}
.mark-btn{display:inline-flex;align-items:center;gap:5px;margin-top:10px;padding:6px 12px;border-radius:20px;border:1px solid rgba(188,140,255,.4);background:transparent;color:var(--purple);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;}
.mark-btn:hover,.mark-btn.marked{background:rgba(188,140,255,.15);border-color:var(--purple);}
.ox-row{display:flex;gap:10px;margin-top:16px;}

.ox.x{border-color:rgba(248,81,73,.3);color:var(--er);}

.ox.sel-x{background:var(--er-bg);border-color:var(--er);}
.next-btn{width:100%;padding:13px;background:var(--gold);color:#0d1117;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;margin-top:10px;transition:all .12s;}

// ── 헬퍼 ─────────────────────────────────────────────
const TOPIC_ICONS = {
  "계약의종류·성립":"📝","동시이행의항변권":"⚖","위험부담":"⚠",
  "제3자를위한계약":"🤝","해제":"🔓","증여":"🎁","매매일반효력":"🏷",
  "매도인의담보책임":"🛡","민법상의임대차":"🏠","주택임대차보호법":"🏡",
  "상가건물임대차보호법":"🏢","도급":"🔨","기타전형계약":"📋",
  "사무관리":"📂","부당이득":"💸","일반불법행위":"⚡","특수불법행위":"🚗",
  "채권의목적":"⚖","채무불이행":"⚡","손해배상":"💰","채권자지체":"⏰","채권자대위권":"🔗","채권자취소권":"✂","채권양도":"📤","채무인수":"📥","변제":"✅","대물변제":"🔄","상계":"↔","분할·불가분채권관계":"🔀","연대채무":"👥","보증채무":"🛡"};

// ── 메인 앱 ───────────────────────────────────────────
function App() {
  // ── 로그인/세션 상태
  const [uid,    setUid]    = useState(null);     // 현재 사용자 ID
  const [isAdmin,setIsAdmin]= useState(false);

  // ── 화면 상태
  const [screen, setScreen] = useState("hub");    // hub | quiz | archive | admin
  const [activeModule, setActiveModule] = useState(null); // 현재 선택된 모듈

  // ── 퀴즈 설정
  const [cfgRound,  setCfgRound]  = useState(1);
  const [cfgMode,   setCfgMode]   = useState("all");
  const [cfgTopics, setCfgTopics] = useState([]);

  // ── 퀴즈 진행
  const [inQuiz,   setInQuiz]   = useState(false);
  const [queue,    setQueue]    = useState([]);
  const [qidx,     setQidx]     = useState(0);
  const [answered, setAnswered] = useState(null);
  const [userAns,  setUserAns]  = useState(null);
  const [showExp,  setShowExp]  = useState(false);
  const [sessCor,  setSessCor]  = useState(0);
  const [sessErr,  setSessErr]  = useState(0);
  const [sessMark, setSessMark] = useState(0);
  const [done,     setDone]     = useState(false);
  const [label,    setLabel]    = useState("");

  // ── 스토리지 (모듈별 회독별)
  const [wrongMap,  setWrongMap]  = useState({});
  const [markedMap, setMarkedMap] = useState({});
  const [progMap,   setProgMap]   = useState({});

  // ── 문항 수정
  const [userEdits, setUserEdits]   = useState({});  // {qId: {question?, explanation?}}
  const [editOpen,  setEditOpen]    = useState(false);
  const [editDraft, setEditDraft]   = useState({q:"", e:""});

  // ── 아카이브
  const [archExp,    setArchExp]    = useState({});
  const [archFilter, setArchFilter] = useState("wrong");

  // ── 관리자
  const [adminUsers, setAdminUsers] = useState([]);

  // ── 초기화: 로컬스토리지에서 마지막 uid 복원
  useEffect(() => {
    const saved = localStorage.getItem("hub_last_uid") || "";
    if (saved) tryLogin(saved, true);
  }, []);

  // ── 스토리지 저장 헬퍼
  const sw = async (key, val) => { try { await window.storage.set(key, JSON.stringify(val)); } catch {} };
  const gr = async (key, fallback) => { try { const r = await window.storage.get(key); return r ? JSON.parse(r.value) : fallback; } catch { return fallback; } };

  // ── 로그인
  async function tryLogin(id, silent=false) {
    if (!id.trim()) return;
    const isAdm = id === ADMIN_ID;
    setUid(id);
    setIsAdmin(isAdm);
    localStorage.setItem("hub_last_uid", id);

    // 유저 Firebase 등록 + 마지막 접속 시각 기록
    if (!isAdm) {
      const safeId = id.replace(/[.#$\[\]]/g, '_'); // Firebase 키 안전 변환
      await fb.update(`users/${safeId}`, {
        id: id,
        lastSeen: Date.now(),
        lastDate: new Date().toLocaleDateString('ko-KR')
      });
      // localStorage에도 유저 목록 유지 (fallback)
      const list = await gr(K_USERS, []);
      if (!list.includes(id)) await sw(K_USERS, [...list, id]);
      await sw(K_UTIME(id), Date.now());
    }

    // 첫 번째 활성 모듈 설정
    const firstMod = MODULE_REGISTRY.find(m => m.status === "active");
    if (firstMod) setActiveModule(firstMod.id);

    setScreen("hub");
  }

  // ── 모듈 스토리지 로드
  async function loadModuleData(mid) {
    if (!uid) return;
    const sid = toSafeId(uid);
    const wm = {}, mm = {}, pm = {}, awm = {}, amm = {};

    for (const r of ROUNDS) {
      // Firebase 우선, 없으면 localStorage 폴백
      const fbW = await fb.get(fbPath.wrong(sid,mid,r));
      wm[r] = new Set(fbW || await gr(K_WRONG(uid,mid,r), []));

      const fbM = await fb.get(fbPath.marked(sid,mid,r));
      mm[r] = new Set(fbM || await gr(K_MARKED(uid,mid,r), []));

      const fbP = await fb.get(fbPath.prog(sid,mid,r));
      const lsP = await gr(K_PROG(uid,mid,r), {answered:[],correct:[],wrong:[]});
      const p   = fbP || lsP;
      pm[r] = { answered:new Set(p.answered||[]), correct:new Set(p.correct||[]), wrong:new Set(p.wrong||[]) };

      const fbAW = await fb.get(fbPath.awWrong(sid,mid,r));
      awm[r] = new Set(fbAW || await gr(K_AW_WRONG(uid,mid,r), []));

      const fbAM = await fb.get(fbPath.awMark(sid,mid,r));
      amm[r] = new Set(fbAM || await gr(K_AW_MARK(uid,mid,r), []));
    }

    setWrongMap(wm); setMarkedMap(mm); setProgMap(pm);
    setAwWrongMap(awm); setAwMarkMap(amm);

    // 아카이브 회독
    const fbAR = await fb.get(fbPath.archRound(sid,mid));
    const arVal = fbAR ?? await gr(K_AW_ROUND(uid,mid), 1);
    setArchRound(arVal);

    // 세션
    const fbSess = await fb.get(fbPath.session(sid,mid));
    const lsSess = await gr(K_SESSION(uid,mid), null);
    setSavedSession(fbSess || lsSess);

    // 수정본 (공유)
    const edits = await gr(K_EDITS(mid), {});
    setUserEdits(edits);
  }

  useEffect(() => { if (uid && activeModule) loadModuleData(activeModule); }, [uid, activeModule]);

  // 수정본 저장 (공유: 모든 유저에게 적용)
  const saveEdit = async (qid, q, e) => {
    const next = {...userEdits};
    if (q === null) {
      delete next[qid];
    } else {
      next[qid] = { ...(next[qid]||{}), question: q, explanation: e };
    }
    setUserEdits(next);
    await window.storage.set(K_EDITS(activeModule), JSON.stringify(next));
  };

  // 현재 문항에 수정본 적용
  const applyEdit = (q) => {
    if (!q) return q;
    const ed = userEdits[q.id];
    if (!ed) return q;
    return { ...q, question: ed.question ?? q.question, explanation: ed.explanation ?? q.explanation };
  };

  // 이중 저장: Firebase(공유) + localStorage(빠른 읽기)
  const _fbsw = (path, data) => { fb.set(path, data); }; // fire-and-forget

  const saveWrong = (r,s) => {
    const arr = [...s];
    sw(K_WRONG(uid,activeModule,r), arr);
    _fbsw(fbPath.wrong(toSafeId(uid),activeModule,r), arr);
  };
  const saveMarked = (r,s) => {
    const arr = [...s];
    sw(K_MARKED(uid,activeModule,r), arr);
    _fbsw(fbPath.marked(toSafeId(uid),activeModule,r), arr);
  };
  const saveProg = (r,p) => {
    const obj = {answered:[...p.answered],correct:[...p.correct],wrong:[...p.wrong]};
    sw(K_PROG(uid,activeModule,r), obj);
    _fbsw(fbPath.prog(toSafeId(uid),activeModule,r), obj);
  };
  const saveAwWrong = (r,s) => {
    const arr = [...s];
    sw(K_AW_WRONG(uid,activeModule,r), arr);
    _fbsw(fbPath.awWrong(toSafeId(uid),activeModule,r), arr);
  };
  const saveAwMark = (r,s) => {
    const arr = [...s];
    sw(K_AW_MARK(uid,activeModule,r), arr);
    _fbsw(fbPath.awMark(toSafeId(uid),activeModule,r), arr);
  };
  const saveArchRound = (r) => {
    sw(K_AW_ROUND(uid,activeModule), r);
    _fbsw(fbPath.archRound(toSafeId(uid),activeModule), r);
  };
  const saveSession = (sess) => {
    sw(K_SESSION(uid,activeModule), sess || null);
    _fbsw(fbPath.session(toSafeId(uid),activeModule), sess || null);
  };

  // ── 퀴즈 시작
  function launchQuiz(round, mode, topics, resumeData=null) {
    const mod = MODULE_REGISTRY.find(m => m.id === activeModule);
    if (!mod) return;
    const all = mod.getData();
    let pool, lbl;

    // 아카이브 전용 회독(aw_*): archRound 기준
    if (mode === "aw_wrong") {
      const r = archRound;
      pool = all.filter(q => (awWrongMap[r]||new Set()).has(q.id));
      if (!pool.length) return;
      lbl = `아카이브 ${r}회독 · 오답 (${pool.length}문제)`;
    } else if (mode === "aw_mark") {
      const r = archRound;
      pool = all.filter(q => (awMarkMap[r]||new Set()).has(q.id));
      if (!pool.length) return;
      lbl = `아카이브 ${r}회독 · 헷갈림 (${pool.length}문제)`;
    } else if (mode === "aw_all") {
      const r = archRound;
      const wids = awWrongMap[r]||new Set(), mids = awMarkMap[r]||new Set();
      pool = all.filter(q => wids.has(q.id)||mids.has(q.id));
      if (!pool.length) return;
      lbl = `아카이브 ${r}회독 · 전체 (${pool.length}문제)`;
    } else if (mode === "wrong") {
      pool = all.filter(q => (wrongMap[round]||new Set()).has(q.id));
      if (!pool.length) return;
      lbl = `${round}회독 오답 (${pool.length}문제)`;
    } else if (mode === "marked") {
      pool = all.filter(q => (markedMap[round]||new Set()).has(q.id));
      if (!pool.length) return;
      lbl = `${round}회독 헷갈림 (${pool.length}문제)`;
    } else if (mode === "rnd100") {
      pool = shuffle([...all]).slice(0, 100);
      lbl = `${round}회독 무작위 100문제`;
    } else if (mode === "topic") {
      pool = topics.length > 0 ? all.filter(q => topics.includes(q.topic)) : [...all];
      lbl = `${round}회독 · ${topics.length > 0 ? topics.map(t=>mod.topics.find(x=>x.key===t)?.label||t).join(', ') : '전체'} (${pool.length}문제)`;
    } else {
      pool = [...all];
      lbl = `${round}회독 전체 ${all.length}문제`;
    }

    // 이어풀기: resumeData가 있으면 복원, 없으면 섞어서 시작
    let finalQueue, startIdx;
    if (resumeData && resumeData.mode === mode && resumeData.round === round) {
      // 저장된 큐 순서 복원 (ID 배열로 저장 → 실제 문제 객체로 매핑)
      const qMap = Object.fromEntries(all.map(q=>[q.id, q]));
      const restored = (resumeData.queueIds||[]).map(id=>qMap[id]).filter(Boolean);
      if (restored.length > 0) {
        finalQueue = restored;
        startIdx = resumeData.qidx || 0;
        lbl = resumeData.label || lbl;
      } else {
        finalQueue = shuffle(pool);
        startIdx = 0;
      }
    } else {
      finalQueue = shuffle(pool);
      startIdx = 0;
    }

    // 세션 저장
    const sessData = {
      mode, round, topics,
      queueIds: finalQueue.map(q=>q.id),
      qidx: startIdx,
      label: lbl,
      module: activeModule,
    };
    saveSession(sessData);
    setSavedSession(sessData);

    setQueue(finalQueue);
    setQidx(startIdx); setAnswered(null); setUserAns(null); setShowExp(false);
    setSessCor(0); setSessErr(0); setSessMark(0);
    setDone(false); setLabel(lbl); setInQuiz(true); setScreen("quiz");
  }

  function exitQuiz() {
    // 종료 시 현재 위치 저장 (qidx 갱신된 상태 유지 → 이어풀기용)
    setInQuiz(false); setDone(false); setScreen("quiz");
  }

  function handleAnswer(choice) {
    if (answered !== null) return;
    const cur = queue[qidx];
    const correct = choice === cur.answer;
    setUserAns(choice); setAnswered(correct ? "ok" : "er"); setShowExp(false);
    const r = cfgRound;
    const np = {
      answered: new Set([...(progMap[r]?.answered||[]), cur.id]),
      correct:  new Set([...(progMap[r]?.correct||[])]),
      wrong:    new Set([...(progMap[r]?.wrong||[])])
    };
    const nw = new Set(wrongMap[r]||[]);
    if (correct) { np.correct.add(cur.id); setSessCor(p=>p+1); }
    else { np.wrong.add(cur.id); nw.add(cur.id); setSessErr(p=>p+1); }
    setProgMap(pm=>({...pm,[r]:np}));
    setWrongMap(wm=>({...wm,[r]:nw}));
    saveProg(r,np); saveWrong(r,nw);

    // 아카이브 회독용 오답 추가 (메인 오답은 아카이브 현재 회독에도 자동 적재)
    if (!correct) {
      const ar = archRound;
      const nawm = new Set(awWrongMap[ar]||[]);
      nawm.add(cur.id);
      setAwWrongMap(m=>({...m,[ar]:nawm}));
      saveAwWrong(ar, nawm);
    }
  }

  function toggleMark() {
    const cur = queue[qidx]; const r = cfgRound;
    const nm = new Set(markedMap[r]||[]);
    if (nm.has(cur.id)) { nm.delete(cur.id); setSessMark(p=>Math.max(0,p-1)); }
    else { nm.add(cur.id); setSessMark(p=>p+1); }
    setMarkedMap(mm=>({...mm,[r]:nm}));
    saveMarked(r,nm);

    // 아카이브 회독용 헷갈림도 동기화
    const ar = archRound;
    const namm = new Set(awMarkMap[ar]||[]);
    if (nm.has(cur.id)) namm.add(cur.id); else namm.delete(cur.id);
    setAwMarkMap(m=>({...m,[ar]:namm}));
    saveAwMark(ar, namm);
  }

  function handleNext() {
    if (qidx+1 >= queue.length) {
      setDone(true);
      saveSession(null); // 완료 시 세션 삭제
      setSavedSession(null);
    } else {
      const nextIdx = qidx+1;
      setQidx(nextIdx);
      setAnswered(null); setUserAns(null); setShowExp(false);
      // 세션 qidx 갱신
      if (savedSession) {
        const updated = {...savedSession, qidx: nextIdx};
        setSavedSession(updated);
        saveSession(updated);
      }
    }
  }

  async function resetModule() {
    if (!confirm(`${activeModule} 모듈 전체 기록을 초기화하시겠습니까?`)) return;
    for (const r of ROUNDS) {
      const np = {answered:new Set(),correct:new Set(),wrong:new Set()};
      setProgMap(pm=>({...pm,[r]:np}));
      setWrongMap(wm=>({...wm,[r]:new Set()}));
      setMarkedMap(mm=>({...mm,[r]:new Set()}));
      saveProg(r,np); saveWrong(r,new Set()); saveMarked(r,new Set());
    }
  }

  // ── 헬퍼
  const getMod   = () => MODULE_REGISTRY.find(m => m.id === activeModule);
  const getAll   = () => getMod()?.getData() || [];
  const wCnt     = r => (wrongMap[r]||new Set()).size;
  const mCnt     = r => (markedMap[r]||new Set()).size;
  const awCnt    = r => (awWrongMap[r]||new Set()).size;
  const amCnt    = r => (awMarkMap[r]||new Set()).size;
  const awTotal  = r => { const w=awWrongMap[r]||new Set(), m=awMarkMap[r]||new Set(); return new Set([...w,...m]).size; };
  const tCnt     = k => getAll().filter(q=>q.topic===k).length;
  const tWrong   = (r,k) => getAll().filter(q=>q.topic===k&&(wrongMap[r]||new Set()).has(q.id)).length;
  const TOTAL    = getAll().length;
  const getProg  = r => { const p=progMap[r]||{answered:new Set()}; return { ans:p.answered.size, pct:Math.round(p.answered.size/Math.max(TOTAL,1)*100) }; };
  const canStart = cfgMode !== "topic" || cfgTopics.length > 0;
  const startCnt = cfgMode==="all" ? TOTAL : cfgMode==="rnd100" ? 100 : cfgMode==="topic" ? getAll().filter(q=>cfgTopics.includes(q.topic)).length : cfgMode==="wrong" ? wCnt(cfgRound) : mCnt(cfgRound);
  const cur      = applyEdit(queue[qidx]);
  const curMark  = cur && (markedMap[cfgRound]||new Set()).has(cur.id);

  // 아카이브 표시
  const archItems = r => {
    const wids = wrongMap[r]||new Set(), mids = markedMap[r]||new Set();
    if (archFilter==="wrong")  return getAll().filter(q=>wids.has(q.id));
    if (archFilter==="marked") return getAll().filter(q=>mids.has(q.id)&&!wids.has(q.id));
    return getAll().filter(q=>wids.has(q.id)||mids.has(q.id));
  };

  // 관리자 유저 목록 로드
  async function loadAdminUsers() {
    // Firebase에서 전체 유저 + 완전한 학습 통계 조회
    const fbAll = await fb.list('users');
    if (!fbAll) { setAdminUsers([]); return; }

    const users = [];
    for (const [safeId, userData] of Object.entries(fbAll)) {
      const info = userData?.info || {};
      const id = info.id || safeId;
      if (!id || id === ADMIN_ID) continue;

      const stats = userData?.stats || {};
      let total_ans=0, total_cor=0, total_wrg=0;
      const modStats = [];

      for (const mod of MODULE_REGISTRY.filter(m=>m.status==="active")) {
        const modData = stats[mod.id] || {};
        let m_ans=0, m_cor=0, m_wrg=0;
        for (const r of ROUNDS) {
          const p = modData[`prog_${r}`] || {};
          m_ans += (p.answered||[]).length;
          m_cor += (p.correct||[]).length;
          m_wrg += (p.wrong||[]).length;
        }
        total_ans+=m_ans; total_cor+=m_cor; total_wrg+=m_wrg;
        if (m_ans>0) modStats.push({mod:mod.label, ans:m_ans, cor:m_cor, wrg:m_wrg,
          pct: m_ans>0?Math.round(m_cor/m_ans*100):0});
      }
      users.push({ id, last:info.lastSeen||0, lastDate:info.lastDate||'', ans:total_ans, cor:total_cor, wrg:total_wrg, modStats });
    }
    users.sort((a,b)=>(b.last||0)-(a.last||0));
    setAdminUsers(users);
  }

  async function adminSearchUser(searchId) {
    if (!searchId.trim()) return;
    const id = searchId.trim();
    const safeId = toSafeId(id);

    // Firebase에서 완전한 데이터 조회
    const userData = await fb.get(`users/${safeId}`);
    if (!userData) { setAdminResult({id, notFound:true}); return; }

    const info  = userData.info  || {};
    const stats = userData.stats || {};
    let total_ans=0, total_cor=0, total_wrg=0;
    const modStats = [];

    for (const mod of MODULE_REGISTRY.filter(m=>m.status==="active")) {
      const modData = stats[mod.id] || {};
      let m_ans=0, m_cor=0, m_wrg=0, m_wrg_cnt=0, m_mk_cnt=0;
      for (const r of ROUNDS) {
        const p = modData[`prog_${r}`] || {};
        m_ans += (p.answered||[]).length;
        m_cor += (p.correct||[]).length;
        m_wrg += (p.wrong||[]).length;
        m_wrg_cnt += (modData[`wrong_${r}`]||[]).length;
        m_mk_cnt  += (modData[`marked_${r}`]||[]).length;
      }
      total_ans+=m_ans; total_cor+=m_cor; total_wrg+=m_wrg;
      if (m_ans>0) modStats.push({mod:mod.label, ans:m_ans, cor:m_cor, wrg:m_wrg,
        pct:m_ans>0?Math.round(m_cor/m_ans*100):0, wrongCnt:m_wrg_cnt, markCnt:m_mk_cnt});
    }

    if (!info.lastSeen && total_ans===0) { setAdminResult({id, notFound:true}); return; }
    setAdminResult({id, last:info.lastSeen||0, lastDate:info.lastDate||'', ans:total_ans, cor:total_cor, wrg:total_wrg, modStats});
  }

                    <>
                      {archFilter!=="marked"&&wCnt(r)>0&&<button className="retry-btn" onClick={()=>{setCfgRound(r);launchQuiz(r,"wrong",[]);}}>↺ {r}회독 오답 {wCnt(r)}문제 다시 풀기</button>}
                      {archFilter!=="wrong"&&mCnt(r)>0&&<button className="retry-btn mk" onClick={()=>{setCfgRound(r);launchQuiz(r,"marked",[]);}}>↺ {r}회독 헷갈리는 문제 {mCnt(r)}문제 다시 풀기</button>}
                      {items.map(q=>{
                        const k=`${r}-${q.id}`;
                        const isW=wids.has(q.id), isMk=mids.has(q.id);
                        return (
                          <div key={q.id} className={`arch-item ${archExp[k]?"exp":""} ${isMk&&!isW?"mk-item":""}`}
                            onClick={()=>setArchExp(p=>({...p,[k]:!p[k]}))}>
                            <div className="arch-q">No.{q.id} {q.question}</div>
                            <div className="arch-ans">정답: {q.answer?"○ 옳은 지문":"× 틀린 지문"}</div>
                            <span className="arch-tag">{TOPIC_ICONS[q.topic]||"📌"} {getMod()?.topics.find(t=>t.key===q.topic)?.label||q.topic}</span>
                            {isW&&<span className="arch-tag">오답</span>}
                            {isMk&&<span className="arch-tag mk">🔖 헷갈림</span>}
                            <div className="arch-exp">{q.explanation}</div>
                          </div>
                        );
                      })}
                    </>
                  ) : (
                    <div style={{fontSize:13,color:"var(--tx3)",padding:"6px 0 14px",textAlign:"center"}}>
                      {archFilter==="wrong"?"오답 없음":archFilter==="marked"?"헷갈림 표시 없음":"기록 없음"} ✓
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}

        {/* ════ 관리자 ════ */}
        {screen==="admin" && isAdmin && (
          <div className="su">
            {/* 유저 현황 */}
            <div className="card">
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
                <div className="card-title" style={{marginBottom:0}}>👥 접속 유저 현황</div>
                <button className="act-btn" style={{flex:"none",padding:"6px 14px",fontSize:12}} onClick={loadAdminUsers}>🔄 새로고침</button>
                <span style={{fontSize:11,color:"var(--tx3)",marginLeft:"auto"}}>총 {adminUsers.length}명</span>
              </div>
              <div className="admin-note">
                ⚠️ 같은 기기/브라우저에서 접속한 유저만 자동 표시됩니다. 다른 기기 유저는 아래 ID 검색으로 조회하세요.
              </div>
              {/* ID 직접 검색 */}
              <div className="admin-search">
                <input placeholder="유저 ID 직접 입력..." value={adminSearch}
                  onChange={e=>setAdminSearch(e.target.value)}
                  onKeyDown={e=>e.key==="Enter"&&adminSearchUser(adminSearch)}/>
                <button onClick={()=>adminSearchUser(adminSearch)}>조회</button>
              </div>
              {adminResult && (
                <div style={{background:adminResult.notFound?"var(--er-bg)":"var(--sf2)",border:`1px solid ${adminResult.notFound?"rgba(248,81,73,.3)":"var(--bd)"}`,borderRadius:10,padding:"12px 16px",marginBottom:12}}>
                  {adminResult.notFound ? (
                    <div style={{color:"var(--er)",fontSize:13}}>유저 '{adminResult.id}'의 기록이 없습니다.</div>
                  ) : (
                    <>
                      <div style={{fontWeight:700,color:"var(--gold)",marginBottom:8}}>👤 {adminResult.id}</div>
                      <div style={{display:"flex",gap:12,fontSize:12,flexWrap:"wrap"}}>
                        <span style={{color:"var(--tx3)"}}>시도 <b style={{color:"var(--tx)",fontFamily:"'IBM Plex Mono',monospace"}}>{adminResult.ans}</b></span>
                        <span style={{color:"var(--ok)"}}>정답 <b style={{fontFamily:"'IBM Plex Mono',monospace"}}>{adminResult.cor}</b></span>
                        <span style={{color:"var(--er)"}}>오답 <b style={{fontFamily:"'IBM Plex Mono',monospace"}}>{adminResult.wrg}</b></span>
                        <span style={{color:"var(--gold)"}}>정답률 <b style={{fontFamily:"'IBM Plex Mono',monospace"}}>{adminResult.ans>0?Math.round(adminResult.cor/adminResult.ans*100)+"%":"-"}</b></span>
                        {(adminResult.lastDate||adminResult.last>0)&&<span style={{color:"var(--tx3)"}}>마지막 접속: <b>{adminResult.lastDate||new Date(adminResult.last).toLocaleDateString("ko-KR")}</b></span>}
                      </div>
                      {adminResult.modStats?.map(m=>(
                        <div key={m.mod} style={{fontSize:11,background:"var(--bg)",border:"1px solid var(--bd2)",borderRadius:6,padding:"5px 10px",marginTop:5,color:"var(--tx3)"}}>
                          <b style={{color:"var(--tx)"}}>{m.mod}</b> ·
                          시도 <b style={{color:"var(--tx)"}}>{m.ans}</b> ·
                          정답 <b style={{color:"var(--ok)"}}>{m.cor}</b> ·
                          오답 <b style={{color:"var(--er)"}}>{m.wrg}</b> ·
                          정답률 <b style={{color:"var(--gold)"}}>{m.pct}%</b>
                          {m.wrongCnt>0&&<> · 오답뱅크 <b style={{color:"var(--er)"}}>{m.wrongCnt}</b></>}
                          {m.markCnt>0&&<> · 헷갈림 <b style={{color:"var(--purple)"}}>{m.markCnt}</b></>}
                        </div>
                      ))}
                    </>
                  )}
                </div>
              )}
              {adminUsers.length === 0 ? (
                <div style={{textAlign:"center",padding:"20px",color:"var(--tx3)"}}>같은 기기에서 접속한 유저가 없습니다.</div>
              ) : adminUsers.map(u=>(
                <div key={u.id} className="admin-user-card" style={{flexDirection:"column",alignItems:"flex-start"}}>
                  <div style={{display:"flex",alignItems:"center",gap:10,width:"100%",flexWrap:"wrap"}}>
                    <span className="admin-uid">👤 {u.id}</span>
                    <div className="admin-stats" style={{flex:1}}>
                      <span className="admin-stat">시도 <b>{u.ans}</b></span>
                      <span className="admin-stat ok">정답 <b>{u.cor}</b></span>
                      <span className="admin-stat er">오답 <b>{u.wrg}</b></span>
                      <span className="admin-stat gold">정답률 <b>{u.ans>0?Math.round(u.cor/u.ans*100)+"%" :"-"}</b></span>
                      {(u.lastDate||u.last>0)&&<span className="admin-stat">접속일 <b>{u.lastDate||new Date(u.last).toLocaleDateString("ko-KR")}</b></span>}
                    </div>
                  </div>
                  {u.modStats && u.modStats.length > 0 && (
                    <div style={{display:"flex",gap:8,marginTop:6,flexWrap:"wrap",width:"100%"}}>
                      {u.modStats.map(m=>(
                        <div key={m.mod} style={{fontSize:11,background:"var(--bg)",border:"1px solid var(--bd2)",borderRadius:6,padding:"4px 10px",color:"var(--tx3)"}}>
                          <b style={{color:"var(--tx)"}}>{m.mod}</b> · 시도 {m.ans} · 정답률 {m.pct}%
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              ))}
            </div>

            {/* 수정 내역 */}
            <AdminEdits gr={gr} sw={sw} modules={MODULE_REGISTRY} />
          </div>
        )}

      </div>
    </div>
    </>
  );
}


/* ── 관리자: 수정 내역 컴포넌트 ─────────────────────────── */
function AdminEdits({ gr, sw, modules }) {
  const [editsByMod, setEditsByMod] = useState({});
  const [loading, setLoading] = useState(true);

  useEffect(() => { loadEdits(); }, []);

  async function loadEdits() {
    setLoading(true);
    const result = {};
    for (const mod of modules.filter(m=>m.status==="active")) {
      try {
        const key = `hub_edits_${mod.id}`;
        const r = await window.storage.get(key);
        if (r && r.value) {
          const edits = JSON.parse(r.value);
          const ids = Object.keys(edits);
          if (ids.length > 0) {
            const all = mod.getData();
            result[mod.id] = ids.map(id => ({
              id: Number(id),
              orig: all.find(q=>q.id===Number(id)),
              ed: edits[id]
            }));
          }
        }
      } catch {}
    }
    setEditsByMod(result);
    setLoading(false);
  }

  async function revertEdit(modId, qid) {
    if (!confirm("이 수정을 원본으로 복원하시겠습니까?")) return;
    try {
      const key = `hub_edits_${modId}`;
      const r = await window.storage.get(key);
      if (!r) return;
      const edits = JSON.parse(r.value);
      delete edits[qid];
      await window.storage.set(key, JSON.stringify(edits));
      loadEdits();
    } catch {}
  }

  const totalEdits = Object.values(editsByMod).reduce((s,a)=>s+a.length,0);

  return (
    <div className="card">
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
        <div className="card-title" style={{marginBottom:0}}>✏️ 수정된 문항 ({totalEdits}건)</div>
        <button className="act-btn" style={{flex:"none",padding:"6px 14px",fontSize:12}} onClick={loadEdits}>🔄 새로고침</button>
      </div>
      {loading ? (
        <div style={{textAlign:"center",padding:20,color:"var(--tx3)"}}>불러오는 중...</div>
      ) : totalEdits === 0 ? (
        <div style={{textAlign:"center",padding:20,color:"var(--tx3)"}}>수정된 문항이 없습니다.</div>
      ) : Object.entries(editsByMod).map(([modId, items])=>(
        <div key={modId} style={{marginBottom:16}}>
          <div style={{fontSize:12,color:"var(--blue)",fontWeight:700,marginBottom:8}}>{modId} ({items.length}건)</div>
          {items.map(({id,orig,ed})=>(
            <div key={id} className="admin-edit-item">
              <div className="admin-edit-id">No.{id}</div>
              {ed.question && <div className="admin-edit-q">{ed.question}</div>}
              {orig && ed.question && <div className="admin-edit-orig">원본: {orig.question}</div>}
              {ed.explanation && ed.explanation !== (orig?.explanation||"") && (
                <div className="admin-edit-exp">해설: {ed.explanation}</div>
              )}
              <div style={{marginTop:8}}>
                <button className="edit-reset" onClick={()=>revertEdit(modId,id)}>원본으로 복원</button>
              </div>
            </div>
          ))}
        </div>
      ))}
    </div>
  );
}


/* ── 로그인 화면 컴포넌트 ─────────────────────────────── */
function LoginScreen({ onLogin }) {
  const [uid, setUid]   = useState(localStorage.getItem("hub_last_uid")||"");

  const handleLogin = () => {
    const id = uid.trim();
    if (!id) return;
    if (!/^[a-zA-Z0-9가-힣_-]{1,20}$/.test(id)) { alert("아이디는 20자 이내 한글/영문/숫자/_-만 가능합니다."); return; }
    onLogin(id);
  };

  return (
    <div className="login-wrap">
      <div className="login-box">
        <div className="login-header">
          <div className="login-logo">📚 3000제 퀴즈 허브</div>
          <div className="login-title">민법 채권법 전범위</div>
          <div className="login-desc">아이디를 입력하면 어느 기기에서든<br/>학습 기록이 이어집니다.</div>
        </div>
        <div className="login-card">
          <div className="login-label">아이디</div>
          <input className="login-input" value={uid} placeholder="한글/영문/숫자 20자 이내"
            onChange={e=>setUid(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&handleLogin()} autoFocus />
          <button className="login-btn" onClick={handleLogin}>시작하기 →</button>
          <div className="login-hint">아이디가 곧 계정입니다. 같은 아이디로 다른 기기에서도 이어서 풀 수 있습니다.</div>
        </div>
      </div>
    </div>
  );
}

root.render(React.createElement(App));
