function CircleTimer({ timeLeft, total = 20 }) {
  const r = 13, circ = +(2 * Math.PI * r).toFixed(2);
  const offset = +(circ * (1 - timeLeft / total)).toFixed(2);
  const color = timeLeft <= 5 ? '#f87171' : timeLeft <= 10 ? '#fbbf24' : 'var(--gold)';
  return (
    <svg width="34" height="34" viewBox="0 0 34 34">
      <circle cx="17" cy="17" r={r} fill="none" stroke="rgba(255,255,255,.09)" strokeWidth="3"/>
      <circle cx="17" cy="17" r={r} fill="none" stroke={color} strokeWidth="3"
        strokeDasharray={circ} strokeDashoffset={offset}
        strokeLinecap="round"
        style={{transform:'rotate(-90deg)',transformOrigin:'17px 17px',
          transition:'stroke-dashoffset 0.9s linear, stroke 0.3s'}}/>
    </svg>
  );
}


function LoginScreen({ onLogin }) {
  const FB_BASE = "https://project-1720248149706690221-default-rtdb.asia-southeast1.firebasedatabase.app";

  const [step, setStep]       = React.useState("id");   // id | pin_new | pin_check
  const [uid,  setUid]        = React.useState(localStorage.getItem("hub_last_uid")||"");
  const [pin,  setPin]        = React.useState(["","","",""])
  const [status, setStatus]   = React.useState({msg:"", type:"info"});
  const [loading, setLoading] = React.useState(false);
  const pinRefs = [React.useRef(), React.useRef(), React.useRef(), React.useRef()];

  // Firebase 단순 fetch
  const fbGet = async (path) => {
    try {
      const r = await fetch(`${FB_BASE}/${path}.json`);
      return r.ok ? await r.json() : null;
    } catch { return null; }
  };
  const fbSet = async (path, data) => {
    try {
      await fetch(`${FB_BASE}/${path}.json`, {
        method:'PUT', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(data)
      });
    } catch {}
  };

  const toSafe = id => id.replace(/[.#$\[\]]/g,'_');

  // PIN 입력 핸들러
  const handlePinInput = (i, val) => {
    if (!/^[0-9]?$/.test(val)) return;
    const next = [...pin];
    next[i] = val;
    setPin(next);
    if (val && i < 3) pinRefs[i+1].current?.focus();
  };
  const handlePinKey = (i, e) => {
    if (e.key === "Backspace" && !pin[i] && i > 0) {
      pinRefs[i-1].current?.focus();
    }
    if (e.key === "Enter") handlePinSubmit();
  };
  const pinFull = pin.join("");

  // 1단계: 아이디 확인
  const handleUnifiedLogin = async () => {
    const id = uid.trim();
    if (!id) { setStatus({msg:"아이디를 입력해주세요.", type:"er"}); return; }
    if (!/^[a-zA-Z0-9가-힣_-]{1,20}$/.test(id)) {
      setStatus({msg:"20자 이내 한글/영문/숫자/_-만 가능합니다.", type:"er"}); return;
    }
    if (pinFull.length !== 4) { setStatus({msg:"PIN 4자리를 모두 입력해주세요.", type:"er"}); return; }

    setLoading(true);
    setStatus({msg:"확인 중...", type:"info"});
    const safeId = toSafe(id);

    const existing = await fbGet(`users/${safeId}/info`);

    if (existing && existing.pin) {
      // 기존 유저 — PIN 대조
      if (existing.pin !== pinFull) {
        setLoading(false);
        setStatus({msg:"PIN이 올바르지 않습니다.", type:"er"});
        setPin(["","","",""]);
        setTimeout(()=>pinRefs[0].current?.focus(), 50);
        return;
      }
      // PIN 일치 — 접속시간 갱신 후 로그인
      await fbSet(`users/${safeId}/info`, {
        ...existing,
        lastSeen: Date.now(),
        lastDate: new Date().toLocaleDateString('ko-KR')
      });
      setStatus({msg:"로그인 성공!", type:"ok"});
      setLoading(false);
      setTimeout(()=>onLogin(id), 300);
    } else {
      // 신규 유저 — PIN 저장 후 로그인
      await fbSet(`users/${safeId}/info`, {
        id, pin: pinFull,
        lastSeen: Date.now(),
        lastDate: new Date().toLocaleDateString('ko-KR')
      });
      setStatus({msg:"계정 생성 완료!", type:"ok"});
      setLoading(false);
      setTimeout(()=>onLogin(id), 500);
    }
  };

  const handleIdNext = async () => {

    const id = uid.trim();
    if (!id) return;
    if (!/^[a-zA-Z0-9가-힣_-]{1,20}$/.test(id)) {
      setStatus({msg:"20자 이내 한글/영문/숫자/_-만 가능합니다.", type:"er"}); return;
    }

    setLoading(true);
    setStatus({msg:"확인 중...", type:"info"});
    const safeId = toSafe(id);
    const existing = await fbGet(`users/${safeId}/info`);
    setLoading(false);

    if (existing && existing.pin) {
      // 기존 유저 → PIN 확인
      setPin(["","","",""]);
      setStep("pin_check");
      setStatus({msg:"등록된 PIN을 입력해주세요.", type:"info"});
      setTimeout(()=>pinRefs[0].current?.focus(), 100);
    } else {
      // 신규 유저 → PIN 등록
      setPin(["","","",""]);
      setStep("pin_new");
      setStatus({msg:"사용할 4자리 PIN을 설정해주세요.", type:"info"});
      setTimeout(()=>pinRefs[0].current?.focus(), 100);
    }
  };

  // 2단계: PIN 제출
  const handlePinSubmit = async () => {
    if (pinFull.length !== 4) {
      setStatus({msg:"4자리를 모두 입력해주세요.", type:"er"}); return;
    }
    const id = uid.trim();
    const safeId = toSafe(id);
    setLoading(true);

    if (step === "pin_new") {
      // 신규: PIN 저장 후 로그인
      await fbSet(`users/${safeId}/info`, {
        id, pin: pinFull,
        lastSeen: Date.now(),
        lastDate: new Date().toLocaleDateString('ko-KR')
      });
      setStatus({msg:"PIN 설정 완료!", type:"ok"});
      setLoading(false);
      setTimeout(()=>onLogin(id), 500);
    } else {
      // 기존: PIN 검증
      const existing = await fbGet(`users/${safeId}/info`);
      const correctPin = existing?.pin;
      if (correctPin === pinFull) {
        // 접속시간 갱신
        if (existing) {
          await fbSet(`users/${safeId}/info`, {
            ...existing,
            lastSeen: Date.now(),
            lastDate: new Date().toLocaleDateString('ko-KR')
          });
        }
        setStatus({msg:"로그인 성공!", type:"ok"});
        setLoading(false);
        setTimeout(()=>onLogin(id), 300);
      } else {
        setStatus({msg:"PIN이 일치하지 않습니다.", type:"er"});
        setPin(["","","",""]);
        setLoading(false);
        setTimeout(()=>pinRefs[0].current?.focus(), 50);
      }
    }
  };

  const bgVideos = ["bg_a.mp4","bg_b.mp4","bg_c.mp4","bg_d.mp4"];
  const [bgSrc] = React.useState(() => bgVideos[Math.floor(Math.random() * bgVideos.length)]);

  return (
    <React.Fragment>
      {/* 비디오 배경 */}

      {/* 로그인 폼 */}
      <div className="login-wrap">
        <div className="login-box">
          <div className="login-header">
            <div className="login-logo">⚖︎ OX Quiz</div>
            <div className="login-title">형사법 선택형 기출 최신빈출지문</div>
          </div>
          <div className="login-card">
            {/* 아이디 입력 */}
            <div className="login-label">아이디</div>
            <input className="login-input" value={uid}
              placeholder="한글/영문/숫자 20자 이내"
              onChange={e=>{ setUid(e.target.value); setStatus({msg:"",type:"info"}); }}
              onKeyDown={e=>{ if(e.key==="Enter") pinRefs[0].current?.focus(); }}
              autoFocus />

            {/* PIN 입력 */}
            <div className="login-label" style={{marginTop:4}}>
              PIN {step==="pin_new" ? <span style={{color:"rgba(180,205,240,.6)",fontWeight:400}}>(신규 — 4자리 숫자 설정)</span> : ""}
            </div>
            <div className="pin-row" style={{marginTop:4}}>
              {[0,1,2,3].map(i=>(
                <input key={i} ref={pinRefs[i]}
                  className="pin-digit" type="password"
                  maxLength={1} value={pin[i]}
                  onChange={e=>handlePinInput(i, e.target.value)}
                  onKeyDown={e=>handlePinKey(i,e)} />
              ))}
            </div>
            <div className={`pin-status ${status.type}`} style={{color: status.type==="ok"?"rgba(120,200,120,.9)":status.type==="er"?"rgba(255,100,100,.9)":"rgba(180,205,240,.5)"}}>{status.msg}</div>
            <button className="login-btn" onClick={handleUnifiedLogin} disabled={loading}>
              {loading ? "처리 중..." : "로그인"}
            </button>

            <div className="login-hint" style={{marginTop:14}}>
              아이디 + PIN으로 어느 기기에서든 학습 기록이 이어집니다.<br/>
              처음 사용하는 아이디는 자동으로 계정이 생성됩니다.
            </div>
          </div>
        </div>
      </div>
    </React.Fragment>
  );
}


function AdminFeedbacks({ loadAllFeedbacks }) {
  const [data, setData] = React.useState({});
  const [loading, setLoading] = React.useState(false);
  const [filter, setFilter] = React.useState("전체");

  async function load() {
    setLoading(true);
    const d = await loadAllFeedbacks();
    setData(d);
    setLoading(false);
  }
  React.useEffect(()=>{ load(); }, []);

  const allItems = Object.values(data).flat();
  const filtered = filter==="전체" ? allItems : allItems.filter(f=>f.type===filter);
  const total = allItems.length;

  return (
    <div className="card" style={{marginTop:16}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
        <div className="card-title" style={{marginBottom:0}}>💬 피드백 목록 ({total}건)</div>
        <button className="act-btn" style={{flex:"none",padding:"6px 14px",fontSize:12}} onClick={load}>🔄 새로고침</button>
      </div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:14}}>
        {["전체","오류 제보","정답 이의","해설 보완","기능 요청","기타"].map(t=>(
          <button key={t}
            style={{padding:"4px 12px",borderRadius:14,border:"1px solid var(--bd)",
              background:filter===t?"var(--gold)":"var(--sf2)",
              color:filter===t?"#0d1117":"var(--tx3)",
              fontSize:11,cursor:"pointer",fontWeight:filter===t?700:400}}
            onClick={()=>setFilter(t)}>{t}</button>
        ))}
      </div>
      {loading ? (
        <div style={{textAlign:"center",padding:20,color:"var(--tx3)"}}>불러오는 중...</div>
      ) : filtered.length===0 ? (
        <div style={{textAlign:"center",padding:20,color:"var(--tx3)"}}>피드백이 없습니다.</div>
      ) : filtered.map((f,i)=>(
        <div key={i} className="fb-admin-item">
          <div className="fb-admin-meta">
            <span className="fb-admin-no">No.{f.qid}</span>
            <span className="fb-admin-type">{f.type}</span>
            <span className="fb-admin-uid">👤 {f.uid}</span>
            <span className="fb-admin-date">{f.date}</span>
          </div>
          <div className="fb-admin-q">{(f.mid||"")} · 문항 {f.qid}</div>
          <div className="fb-admin-body">{f.text}</div>
        </div>
      ))}
    </div>
  );
}
