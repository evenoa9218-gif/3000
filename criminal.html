const CSS = `
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#1c1018;--sf:#241420;--sf2:#2c1a28;--bd:#4e2038;--bd2:#3a1a2c;
  --gold:#d4788a;--gold2:#e89aaa;--gf:#8c3050;--tx:#f8dce4;--tx2:#b88090;--tx3:#7a4858;
  --purple:#c89aff;--ok:#4ade80;--er:#f87171;--er-bg:rgba(248,113,113,.08);
  --ok:#4ade80;--er:#f87171;--ok-bg:rgba(74,222,128,.08);--er-bg:rgba(248,113,113,.08);
  --blue:#d4788a;--purple:#c89aff;--muted:#7a4858;
}

/* ── 라이트 테마 ───────────────────────────────────── */
html.light {
  --bg:#fdf0f3;--sf:#ffffff;--sf2:#fae4e8;--bd:#e8b0bc;--bd2:#f2ccd4;
  --gold:#a02e48;--gold2:#b83858;--gf:#882840;--tx:#280e18;--tx2:#6a3040;--tx3:#8a5060;
  --purple:#6a35a0;--ok:#16a34a;--er:#dc2626;--er-bg:rgba(220,38,38,.08);
}
html.light body { background:var(--bg); color:var(--tx); }
html.light .hdr-title{color:#ffffff;}
html.light .hdr-sub{color:var(--gold2);font-weight:600;}
html.light .logout-btn{color:#b8d8f5;}
html.light .uid-badge{color:#d0ecfa;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);}
html.light .module-card{background:#ffffff;box-shadow:none;border-color:#c0d8ec;}
html.light .module-card.civ-proc{background:#e6f3fc;border:1px solid rgba(36,100,160,.12);}

/* ── 테마 토글 버튼 ────────────────────────────────── */
.theme-toggle {
  display:flex;align-items:center;justify-content:center;
  width:32px;height:32px;border-radius:8px;cursor:pointer;
  background:var(--sf2);border:1px solid var(--bd);
  font-size:15px;transition:background .15s,border .15s;
  flex-shrink:0;
}
.theme-toggle:hover{background:var(--bd);border-color:var(--tx3);}

/* ── 허브 노티스 ───────────────────────────────────── */
.hub-notice {
  display:flex;align-items:flex-start;gap:8px;
  background:var(--sf2);border:1px solid var(--bd);border-radius:10px;
  padding:11px 14px;margin-bottom:14px;font-size:12px;
  color:var(--tx2);line-height:1.6;
}
.hub-notice-icon{font-size:14px;flex-shrink:0;margin-top:1px;}

/* ── 피드백 ───────────────────────────────────────────── */
.fb-btn{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;border:1px solid var(--bd);background:transparent;color:var(--tx3);font-size:11px;cursor:pointer;transition:all .15s;}
.fb-btn:hover{border-color:var(--gold);color:var(--gold);}
.fb-float-btn{position:fixed;bottom:18px;right:18px;z-index:900;display:flex;align-items:center;gap:5px;padding:7px 14px;border-radius:20px;border:1px solid var(--bd);background:var(--sf);color:var(--tx3);font-size:12px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25);transition:all .15s;}
.fb-float-btn:hover{border-color:var(--gold);color:var(--gold);box-shadow:0 3px 12px rgba(212,168,83,.2);}
.fb-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
.fb-modal{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:24px;width:100%;max-width:480px;max-height:80vh;overflow-y:auto;}
.fb-modal-title{font-size:15px;font-weight:700;color:var(--tx);margin-bottom:4px;}
.fb-modal-sub{font-size:12px;color:var(--tx3);margin-bottom:16px;}
.fb-qref{background:var(--sf2);border:1px solid var(--bd2);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--tx2);margin-bottom:14px;line-height:1.6;}
.fb-select-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.fb-type{padding:5px 12px;border-radius:16px;border:1px solid var(--bd);background:var(--sf2);color:var(--tx3);font-size:12px;cursor:pointer;transition:all .15s;}
.fb-type:hover{border-color:var(--gold);color:var(--gold);}
.fb-type.sel{background:var(--gf);border-color:var(--gf);color:#fff;font-weight:700;}
.fb-textarea{width:100%;box-sizing:border-box;background:var(--sf2);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-size:13px;font-family:'Pretendard',sans-serif;padding:10px 12px;resize:vertical;outline:none;line-height:1.6;}
.fb-textarea:focus{border-color:var(--gold);}
.fb-row{display:flex;gap:8px;margin-top:12px;justify-content:flex-end;}
.fb-submit{padding:9px 20px;background:var(--gf);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;}
.fb-submit:hover{background:var(--gold);}
.fb-cancel{padding:9px 14px;background:transparent;border:1px solid var(--bd);color:var(--tx3);border-radius:8px;font-size:13px;cursor:pointer;}
.fb-cancel:hover{border-color:var(--tx);color:var(--tx);}
.edit-btn{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;border:1px solid var(--bd);background:transparent;color:var(--tx3);font-size:11px;cursor:pointer;transition:all .15s;margin-right:4px;}
.edit-btn:hover{border-color:var(--blue);color:var(--blue);}
.edited-badge{font-size:9px;font-weight:700;color:var(--gold);background:rgba(106,171,200,.15);border:1px solid rgba(106,171,200,.3);border-radius:6px;padding:1px 5px;margin-left:5px;vertical-align:middle;}
/* 피드백 목록 (퀴즈 카드 하단) */
.fb-list{margin-top:12px;border-top:1px solid var(--bd2);padding-top:10px;}
.fb-item{background:var(--sf2);border:1px solid var(--bd2);border-radius:8px;padding:9px 12px;margin-bottom:7px;font-size:12px;}
.fb-item-head{display:flex;align-items:center;gap:6px;margin-bottom:4px;}
.fb-item-type{font-size:10px;font-weight:700;padding:2px 7px;border-radius:8px;background:rgba(212,168,83,.15);color:var(--gold);}
.fb-item-uid{font-size:11px;color:var(--tx3);}
.fb-item-date{font-size:10px;color:var(--tx3);margin-left:auto;}
.fb-item-body{color:var(--tx2);line-height:1.6;}
/* 관리자 피드백 목록 */
.fb-admin-item{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;margin-bottom:10px;}
.fb-admin-meta{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;}
.fb-admin-no{font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--blue);}
.fb-admin-type{font-size:11px;font-weight:700;color:var(--gold);}
.fb-admin-uid{font-size:11px;color:var(--tx3);}
.fb-admin-date{font-size:10px;color:var(--tx3);margin-left:auto;}
.fb-admin-q{font-size:12px;color:var(--tx2);margin-bottom:6px;padding:7px 10px;background:var(--sf2);border-radius:6px;line-height:1.5;}
.fb-admin-body{font-size:13px;color:var(--tx);line-height:1.6;}

/* ── PIN 입력 ─────────────────────────────────────── */
.pin-row{display:flex;gap:10px;justify-content:center;margin:16px 0;}
.pin-digit{width:52px;height:60px;border:2px solid var(--bd);border-radius:12px;
  background:var(--sf2);color:var(--tx);font-size:24px;font-weight:700;
  text-align:center;font-family:'IBM Plex Mono',monospace;outline:none;
  transition:border .15s;}
.pin-digit:focus{border-color:var(--gold);}
.pin-status{font-size:12px;text-align:center;min-height:18px;margin-bottom:8px;}
.pin-status.ok{color:var(--gold2);}
.pin-status.er{color:var(--er);}
.pin-status.info{color:var(--tx3);}
.login-step{font-size:11px;color:var(--tx3);text-align:center;margin-bottom:14px;letter-spacing:.05em;}
html,body{background:var(--bg);color:var(--tx);font-family:'Pretendard',system-ui,sans-serif;}
.app{min-height:100vh;display:flex;flex-direction:column;}

/* 헤더 */
.hdr{padding:16px 24px;border-bottom:1px solid var(--bd2);background:rgba(18,6,14,0.95);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:100;}
.hdr-left{display:flex;flex-direction:column;}
.hdr-title{font-family:'Noto Serif KR',serif;font-size:22px;font-weight:700;color:var(--tx);}
.hdr-sub{font-family:'Noto Serif KR',serif;font-size:13px;color:var(--gold);margin-top:3px;font-weight:600;letter-spacing:.01em;}
.hdr-user{display:flex;align-items:center;gap:8px;}
.uid-badge{font-size:12px;color:var(--tx2);background:var(--sf2);border:1px solid var(--bd);border-radius:14px;padding:4px 12px;}
.logout-btn{font-size:11px;color:var(--tx2);background:none;border:none;cursor:pointer;padding:4px 8px;border-radius:8px;}
.logout-btn:hover{color:var(--er);}

/* 탭 */
.tabs{display:flex;gap:2px;padding:10px 14px 0;border-bottom:1px solid var(--bd2);background:var(--sf);overflow-x:auto;}
.tab{padding:8px 16px;font-size:13px;font-weight:500;color:var(--tx3);cursor:pointer;border-radius:8px 8px 0 0;border:1px solid transparent;border-bottom:none;white-space:nowrap;background:transparent;transition:all .15s;}
.tab:hover{color:var(--tx2);}
.tab.act{color:var(--gold);background:var(--bg);border-color:var(--bd);border-bottom-color:var(--bg);margin-bottom:-1px;font-weight:700;}

/* 메인 */
.main{flex:1;padding:20px 16px;max-width:860px;margin:0 auto;width:100%;}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:22px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.18);}
.card-title{font-size:11px;font-weight:700;color:var(--tx3);margin-bottom:16px;text-transform:uppercase;letter-spacing:.8px;}

/* 로그인 - 비디오 배경 + 글래스모피즘 */
.login-scene{position:fixed;inset:0;z-index:0;overflow:hidden;}
.login-scene video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.login-scene::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(4,12,28,.25) 0%,rgba(8,20,45,.2) 50%,rgba(2,8,20,.3) 100%);}
.login-wrap{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-box{width:100%;max-width:400px;}
.login-header{text-align:center;margin-bottom:24px;}
.login-logo{font-family:'Noto Serif KR',serif;font-size:33px;font-weight:900;color:#fff;margin-bottom:6px;letter-spacing:-.3px;text-shadow:0 0 18px rgba(120,180,255,.7),0 2px 8px rgba(0,0,0,.9);}
.login-title{font-family:'Noto Serif KR',serif;font-size:19px;color:#fff;font-weight:600;margin-bottom:4px;letter-spacing:.06em;text-shadow:0 0 12px rgba(100,160,255,.6),0 1px 6px rgba(0,0,0,.9);}
.login-desc{font-size:13px;color:rgba(230,240,255,.95);line-height:1.6;text-shadow:0 1px 6px rgba(0,0,0,.9),0 0 8px rgba(0,0,0,.8);}
.login-card{
  background:transparent;
  border:2px solid rgba(255,255,255,.75);
  border-radius:22px;
  padding:30px 28px;
  box-shadow:0 0 18px rgba(140,190,255,.3), 0 0 40px rgba(100,160,255,.15), inset 0 0 18px rgba(140,190,255,.06);
}
.login-label{font-size:13px;color:#fff;margin-bottom:6px;letter-spacing:.03em;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.9);}
.login-input{
  width:100%;box-sizing:border-box;
  font-family:'Pretendard',sans-serif;font-size:15px;
  padding:11px 15px;
  border:1px solid rgba(255,255,255,.55);
  border-radius:12px;outline:none;
  background:rgba(255,255,255,.1);
  color:#fff;margin-bottom:10px;transition:all .18s;
  box-shadow:0 0 8px rgba(180,210,255,.2);
}
.login-input::placeholder{color:rgba(200,220,255,.55);}
.login-input:focus{border-color:rgba(130,190,255,.9);background:rgba(255,255,255,.15);box-shadow:0 0 0 3px rgba(100,160,255,.15),0 0 12px rgba(130,190,255,.35);}
.pin-digit{
  width:52px;height:58px;
  border:1px solid rgba(255,255,255,.55);border-radius:12px;
  background:rgba(255,255,255,.1);
  color:#fff;font-size:22px;font-weight:700;
  text-align:center;font-family:'IBM Plex Mono',monospace;outline:none;
  transition:border .15s, box-shadow .15s;
  box-shadow:0 0 8px rgba(180,210,255,.2);
}
.pin-digit:focus{border-color:rgba(130,190,255,.9);box-shadow:0 0 0 3px rgba(100,160,255,.15),0 0 12px rgba(130,190,255,.35);}
.login-btn{
  width:100%;padding:13px;
  background:rgba(100,160,255,.35);
  color:#fff;border:1px solid rgba(140,190,255,.7);border-radius:12px;
  font-size:14px;font-weight:700;cursor:pointer;
  transition:all .18s;
  box-shadow:0 0 12px rgba(100,160,255,.4),0 4px 16px rgba(60,120,255,.25);
  letter-spacing:.04em;
}
.login-btn:hover{background:rgba(100,160,255,.5);border-color:rgba(180,220,255,.85);transform:translateY(-1px);box-shadow:0 0 18px rgba(100,160,255,.55),0 8px 24px rgba(60,120,255,.3);}
.login-btn:active{transform:translateY(0);box-shadow:0 0 8px rgba(100,160,255,.3);}
.login-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.login-hint{font-size:12px;color:rgba(230,240,255,.9);text-align:center;margin-top:10px;line-height:1.6;text-shadow:0 1px 5px rgba(0,0,0,.9);word-break:keep-all;}

/* 허브 모듈 그리드 */
.hub-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px;}
@media(max-width:700px){.hub-grid{grid-template-columns:repeat(2,1fr);}}

/* ── 모바일 전용 (세로 폰) ──────────────────────────── */
@media(max-width:480px){
  .question{font-size:14px;line-height:1.85;}
  .rv-exp{font-size:13.5px;}
  .edit-btn{white-space:nowrap;font-size:10px;padding:2px 7px;gap:3px;margin-right:3px;}
  .fb-btn{white-space:nowrap;font-size:10px;padding:2px 7px;gap:3px;}
  .star-badge{white-space:nowrap;font-size:9px;padding:1px 5px;gap:2px;}
  .qcard-topic{white-space:nowrap;font-size:10px;padding:1px 6px;}
  .qcard-meta{gap:4px;}
  .ox{font-size:34px;padding:14px 16px;}
  .prog-label{font-size:11px;}
  .prog-num{font-size:18px;}
  .qcard{padding:14px 12px;}
}

.module-prog-text{font-size:11px;color:var(--muted);margin-top:3px;}
.module-card.civ-proc{background:rgba(122,184,216,.1);border:1px solid rgba(122,184,216,.22);}
.module-card.civ-proc .module-accent{display:none;}
.module-card.civ-proc .soon-badge{background:rgba(121,192,255,.15);color:#79c0ff;border:1px solid rgba(121,192,255,.25);}
.module-card{background:var(--sf);border:1px solid var(--bd);border-radius:4px;padding:22px 20px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.18);}
.module-card.active:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(46,98,130,.2);}
.module-card.soon{opacity:.55;cursor:not-allowed;}
.module-card.soon:hover{transform:none;}
.module-accent{display:none;}
.module-icon{font-size:40px;margin-bottom:14px;color:var(--gold);line-height:1;}
.module-name{font-family:'Noto Serif KR',serif;font-size:15px;font-weight:700;color:var(--tx);margin-bottom:3px;}
.module-sub{font-size:11px;color:var(--tx3);margin-bottom:12px;}
.module-stats{display:flex;gap:8px;font-size:11px;font-family:'IBM Plex Mono',monospace;flex-wrap:wrap;}
.module-stat{padding:2px 8px;border-radius:8px;background:var(--sf2);border:1px solid var(--bd2);color:var(--tx3);}
.module-stat.ok{color:var(--ok);border-color:rgba(63,185,80,.2);}
.module-stat.er{color:var(--er);border-color:rgba(248,81,73,.2);}
.module-stat.gold{color:var(--gold);border-color:rgba(212,168,83,.2);}
.soon-badge{position:absolute;top:12px;right:12px;font-size:10px;padding:2px 8px;border-radius:8px;background:var(--sf2);border:1px solid var(--bd);color:var(--tx3);}
.module-bar{height:3px;background:var(--bd);border-radius:2px;overflow:hidden;margin-top:10px;}
.module-bar-fill{height:100%;border-radius:2px;transition:width .3s;}

/* 퀴즈 설정 */
.pill-row{display:flex;gap:7px;flex-wrap:wrap;}
.pill{padding:7px 18px;border-radius:24px;border:1px solid var(--bd);background:var(--sf2);color:var(--tx2);font-size:13px;font-weight:600;cursor:pointer;transition:all .18s;display:flex;align-items:center;gap:5px;}
.pill:hover{border-color:var(--gold);color:var(--gold);}
.pill.act{background:var(--gf);border-color:var(--gf);color:#fff;}
.pill.blue{border-color:rgba(88,166,255,.35);color:var(--blue);}
.pill.blue.act{background:rgba(88,166,255,.15);border-color:var(--blue);color:var(--blue);}
.pill.red{border-color:rgba(248,81,73,.35);color:var(--er);}
.pill.red.act{background:rgba(248,81,73,.12);border-color:var(--er);}
.pill.purple{border-color:rgba(188,140,255,.35);color:var(--purple);}
.pill.purple.act{background:rgba(188,140,255,.12);border-color:var(--purple);color:var(--purple);}
.cnt-badge{font-size:10px;opacity:.75;font-family:'IBM Plex Mono',monospace;}
.star-badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;color:#fff;background:linear-gradient(135deg,#f59e0b,#d97706);border-radius:6px;padding:2px 7px;margin-right:6px;letter-spacing:.3px;}
.pill.star{border-color:#f59e0b;color:#f59e0b;}
.pill.star.act{background:#f59e0b;color:#0d1117;}
.wrong-badge{font-size:10px;background:rgba(248,81,73,.15);color:var(--er);padding:1px 5px;border-radius:8px;border:1px solid rgba(248,81,73,.3);}
.topic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:8px;margin-top:12px;}
.tc{background:var(--sf2);border:1px solid var(--bd2);border-radius:8px;padding:12px 13px;cursor:pointer;transition:all .15s;}
.tc:hover{border-color:#4a9edd;}
.tc.act{border:2px solid #4a9edd;background:rgba(74,158,221,.1);}
.tc-icon{font-size:16px;margin-bottom:4px;}
.tc-name{font-size:12px;font-weight:600;color:var(--tx);margin-bottom:2px;}
.tc-cnt{font-size:10px;color:var(--tx3);font-family:'IBM Plex Mono',monospace;}
.tc-wc{font-size:10px;color:var(--er);margin-top:2px;}
.tc-prog-wrap{margin-top:6px;display:flex;align-items:center;gap:6px;}
.tc-prog-bar-bg{flex:1;height:4px;background:var(--bd2);border-radius:2px;overflow:hidden;}
.tc-prog-bar-fill{height:100%;border-radius:2px;background:var(--gf);transition:width .3s;}
.tc-prog-pct{font-size:10px;color:var(--tx3);font-family:'IBM Plex Mono',monospace;min-width:30px;text-align:right;}
.tc.done-tc{border-color:var(--gold)!important;background:rgba(212,168,83,.12)!important;}
.tc.done-tc .tc-prog-bar-fill{background:#4caf50;}
.tc.done-tc .tc-prog-pct{color:#4caf50;font-weight:700;}
.start-row{margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.start-btn{padding:12px 30px;background:var(--gf);color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;transition:all .15s;}
.start-btn:hover{background:var(--gold);}
.start-btn:disabled{opacity:.4;cursor:not-allowed;}
.start-hint{font-size:12px;color:var(--tx3);}
.clear-link{font-size:12px;color:var(--blue);cursor:pointer;text-decoration:underline;text-underline-offset:2px;}

/* 진행 */
.prog-wrap{margin-bottom:18px;}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;}
.prog-label{font-size:11px;color:var(--tx3);font-family:'IBM Plex Mono',monospace;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.prog-num{font-size:20px;font-weight:700;font-family:'IBM Plex Mono',monospace;}
.prog-num span{font-size:12px;color:var(--tx3);font-weight:400;}
.prog-bar{height:3px;background:var(--bd);border-radius:2px;overflow:hidden;}
.prog-fill{height:100%;border-radius:2px;transition:width .3s;}
.prog-stats{display:flex;gap:14px;margin-top:6px;}
.ps{font-size:11px;color:var(--tx3);}
.ps strong{font-family:'IBM Plex Mono',monospace;}
.ps.ok strong{color:var(--ok);}
.ps.er strong{color:var(--er);}
.ps.mk strong{color:var(--purple);}

/* 퀴즈 카드 */
.qcard{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:26px 22px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.18);}
.qcard-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.qcard-no{font-size:11px;color:var(--tx3);font-family:'IBM Plex Mono',monospace;}
.qcard-topic{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--sf2);border:1px solid var(--bd2);color:var(--tx3);}
.question{font-family:'Noto Serif KR',serif;font-size:16px;line-height:2.0;color:var(--tx);word-break:keep-all;}
.reveal{margin-top:18px;padding:14px 16px;border-radius:8px;animation:fi .2s ease;}
.reveal.ok{background:var(--ok-bg);border:1px solid rgba(63,185,80,.3);}
.reveal.er{background:var(--er-bg);border:1px solid rgba(248,81,73,.3);}
.rv-label{font-size:18px;font-weight:700;display:flex;align-items:center;gap:7px;margin-bottom:6px;}
.reveal.ok .rv-label{color:var(--ok);}
.reveal.er .rv-label{color:var(--er);}
.rv-verdict{font-size:12px;font-weight:600;opacity:.8;}
.rv-exp{font-size:14.5px;line-height:1.75;color:var(--tx2);margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.06);word-break:keep-all;text-align:justify;}
.rv-toggle{font-size:12px;color:var(--blue);cursor:pointer;margin-top:5px;display:inline-block;text-decoration:underline;text-underline-offset:2px;}
.mark-btn{display:inline-flex;align-items:center;gap:5px;margin-top:10px;padding:6px 12px;border-radius:20px;border:1px solid rgba(188,140,255,.4);background:transparent;color:var(--purple);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;}
.mark-btn:hover,.mark-btn.marked{background:rgba(188,140,255,.15);border-color:var(--purple);}
.ox-row{display:flex;gap:10px;margin-top:16px;}
.ox{flex:1;padding:16px;border-radius:14px;border:2px solid transparent;font-size:28px;font-weight:700;cursor:pointer;transition:all .15s cubic-bezier(.2,.8,.2,1);background:var(--sf2);}
.ox.o{border-color:rgba(63,185,80,.3);color:var(--ok);}
.ox.o:not(:disabled):hover{background:var(--ok-bg);border-color:var(--ok);transform:translateY(-2px);}
.ox.x{border-color:rgba(248,81,73,.3);color:var(--er);}
.ox.x:not(:disabled):hover{background:var(--er-bg);border-color:var(--er);transform:translateY(-2px);}
.ox:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.ox.sel-o{background:var(--ok-bg);border-color:var(--ok);}
.ox.sel-x{background:var(--er-bg);border-color:var(--er);}
.next-btn{width:100%;padding:14px;background:var(--gf);color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;margin-top:10px;transition:all .15s;letter-spacing:.2px;}
.next-btn:hover{background:var(--gold);transform:translateY(-1px);box-shadow:0 6px 20px rgba(58,122,174,.2);}
.back-btn{padding:6px 14px;border-radius:16px;border:1px solid var(--bd);background:var(--sf2);color:var(--tx3);font-size:12px;cursor:pointer;margin-bottom:14px;}
.back-btn:hover{color:var(--blue);border-color:var(--blue);}

/* 완료 */
.done-card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:36px 20px;text-align:center;}
.done-icon{font-size:44px;margin-bottom:14px;}
.done-title{font-family:'Noto Serif KR',serif;font-size:21px;font-weight:700;color:var(--gold);margin-bottom:6px;}
.done-sub{font-size:13px;color:var(--tx2);margin-bottom:22px;}
.done-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:22px;}
.ds{background:var(--sf2);border:1px solid var(--bd);border-radius:8px;padding:12px 6px;}
.ds-n{font-size:20px;font-weight:700;font-family:'IBM Plex Mono',monospace;margin-bottom:3px;}
.ds-l{font-size:10px;color:var(--tx3);}
.ds.c .ds-n{color:var(--ok);}
.ds.w .ds-n{color:var(--er);}
.ds.r .ds-n{color:var(--gold);}
.ds.m .ds-n{color:var(--purple);}
.act-row{display:flex;gap:8px;flex-wrap:wrap;}
.act-btn{flex:1;min-width:90px;padding:11px;border-radius:8px;border:1px solid var(--bd);background:var(--sf2);color:var(--tx);font-size:13px;font-weight:600;cursor:pointer;transition:all .12s;}
.act-btn:hover{border-color:var(--gold);color:var(--gold);}
.act-btn.pri{background:var(--gold);border-color:var(--gold);color:#0d1117;}
.act-btn.pri:hover{background:var(--gold2);}

/* 오답 아카이브 */
.arch-filter-row{display:flex;gap:6px;margin-bottom:12px;}
.arch-filter{padding:4px 12px;border-radius:14px;border:1px solid var(--bd);background:transparent;color:var(--tx3);font-size:12px;cursor:pointer;transition:all .12s;}
.arch-filter.act{border-color:var(--gold);color:var(--gold);background:rgba(212,168,83,.08);}
.arch-filter.purple.act{border-color:var(--purple);color:var(--purple);background:rgba(188,140,255,.08);}
.retry-btn{width:100%;padding:10px;background:rgba(248,81,73,.1);border:1px solid rgba(248,81,73,.3);border-radius:7px;color:var(--er);font-size:13px;font-weight:600;cursor:pointer;margin-bottom:10px;transition:all .12s;}
.retry-btn:hover{background:rgba(248,81,73,.2);}
.retry-btn.mk{background:rgba(188,140,255,.1);border-color:rgba(188,140,255,.3);color:var(--purple);}
.retry-btn.mk:hover{background:rgba(188,140,255,.2);}
.arch-item{background:var(--sf);border:1px solid var(--bd2);border-left:3px solid var(--er);border-radius:7px;padding:12px 14px;margin-bottom:7px;cursor:pointer;transition:all .12s;}
.arch-item:hover{background:var(--sf2);}
.arch-item.exp{border-left-color:var(--gold);}
.arch-item.mk-item{border-left-color:var(--purple);}
.arch-q{font-size:13px;line-height:1.6;color:var(--tx);font-family:'Noto Serif KR',serif;word-break:keep-all;}
.arch-ans{font-size:11px;color:var(--tx3);margin-top:5px;font-family:'IBM Plex Mono',monospace;}
.arch-tag{font-size:10px;color:var(--tx3);background:var(--sf2);border:1px solid var(--bd2);border-radius:8px;padding:1px 6px;display:inline-block;margin-top:4px;margin-right:4px;}
.arch-tag.mk{border-color:rgba(188,140,255,.3);color:var(--purple);background:rgba(188,140,255,.08);}
.arch-exp{font-size:14px;color:var(--tx2);margin-top:7px;padding-top:7px;border-top:1px solid var(--bd2);line-height:1.65;display:none;word-break:keep-all;text-align:justify;}
.arch-item.exp .arch-exp{display:block;}

/* 관리자 */
.admin-user-card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.admin-uid{font-size:14px;font-weight:700;color:var(--gold);min-width:100px;}
.admin-stats{display:flex;gap:10px;font-size:12px;flex:1;flex-wrap:wrap;}
.admin-stat{color:var(--tx3);}
.admin-stat b{font-family:'IBM Plex Mono',monospace;}
.admin-stat.ok b{color:var(--ok);}

.admin-stat.gold b{color:var(--gold);}

// ── 헬퍼 ─────────────────────────────────────────────
const TOPIC_ICONS = {}

// ── 메인 앱 ───────────────────────────────────────────
function App() {
  // ── 로그인/세션 상태
  const [uid,    setUid]    = useState(null);     // 현재 사용자 ID
  const [bgSrc] = useState(() => {
    const vids=["bg_a.mp4","bg_b.mp4","bg_c.mp4","bg_d.mp4"];
    let s=sessionStorage.getItem("ox_bg");
    if(!s){s=vids[Math.floor(Math.random()*vids.length)];sessionStorage.setItem("ox_bg",s);}
    return s;
  });
  const bgVideoRef = useRef(null);
  useEffect(() => {
    const v = bgVideoRef.current;
    if (v) { v.muted = true; v.play().catch(() => {}); }
  }, []);
  const [isAdmin,setIsAdmin]= useState(false);

  // ── 화면 상태
  const [screen, setScreen] = useState("hub");    // hub | quiz | archive | admin
  const [activeModule, setActiveModule] = useState(null); // 현재 선택된 모듈

  // ── 퀴즈 설정
  const [cfgRound,  setCfgRound]  = useState(1);
  const [cfgMode,   setCfgMode]   = useState("all");
  const [cfgTopics, setCfgTopics] = useState([]);

  // ── 퀴즈 진행
  const [inQuiz,   setInQuiz]   = useState(false);
  const [queue,    setQueue]    = useState([]);
  const [qidx,     setQidx]     = useState(0);
  const [answered, setAnswered] = useState(null);
  const [userAns,  setUserAns]  = useState(null);
  const [showExp,  setShowExp]  = useState(false);
  const [sessCor,  setSessCor]  = useState(0);
  const [sessErr,  setSessErr]  = useState(0);
  const [sessMark, setSessMark] = useState(0);
  const [done,     setDone]     = useState(false);
  const [label,    setLabel]    = useState("");
  const [timerLeft, setTimerLeft] = useState(20);
  const timerRef  = React.useRef(null);
  const qidxRef   = React.useRef(0);
  const queueRef  = React.useRef([]);

  // ── 스토리지 (모듈별 회독별)
  const [hubStats,  setHubStats]  = useState({});  // {modId: {wc, mc, pct}}
  const [wrongMap,  setWrongMap]  = useState({});
  const [markedMap, setMarkedMap] = useState({});
  const [progMap,   setProgMap]   = useState({});

  // ── 아카이브
  const [archExp,     setArchExp]     = useState({});
  const [archFilter,  setArchFilter]  = useState("wrong");

  // ── 피드백
  const [fbOpen,    setFbOpen]    = useState(false);
  const [fbType,    setFbType]    = useState("오류 제보");
  const [fbText,    setFbText]    = useState("");
  const [fbList,    setFbList]    = useState([]);  // 현재 문항 피드백
  const [fbLoading, setFbLoading] = useState(false);
  const [archRound,   setArchRound]   = useState(1);
  const [awWrongMap,  setAwWrongMap]  = useState({});
  const [awMarkMap,   setAwMarkMap]   = useState({});

  // ── 문항 수정본 (공유)
  const [userEdits, setUserEdits] = useState({});

  // ── 이어풀기 세션
  const [savedSession, setSavedSession] = useState(null);

  // ── 관리자
  const [adminUsers,  setAdminUsers]  = useState([]);
  const [adminSearch, setAdminSearch] = useState("");
  const [adminResult, setAdminResult] = useState(null);
  const [adminFbs,    setAdminFbs]    = useState(null);  // null=미로드, {}=로드완료
  const [adminFbLoad, setAdminFbLoad] = useState(false);
  const [editOpen,    setEditOpen]    = useState(false);
  const [editTarget,  setEditTarget]  = useState(null);
  const [editQ,       setEditQ]       = useState('');
  const [editE,       setEditE]       = useState('');
  const [adminEdits,  setAdminEdits]  = useState(null);
  const [adminEditLoad,setAdminEditLoad]=useState(false);

  // ── 테마 (dark / light)
  const [theme, setTheme] = React.useState(() => {
    try { return localStorage.getItem('quiz_theme') || 'light'; } catch { return 'light'; }
  });
  React.useEffect(() => {
    document.documentElement.classList.toggle('light', theme === 'light');
    try { localStorage.setItem('quiz_theme', theme); } catch {}
  }, [theme]);

  // ── 초기화: 로컬스토리지에서 마지막 uid 복원
  useEffect(() => {
    const saved = localStorage.getItem("hub_last_uid") || "";
    if (saved) tryLogin(saved, true);
  }, []);

  // ── 스토리지 저장 헬퍼
  const sw = async (key, val) => { try { await window.storage.set(key, JSON.stringify(val)); } catch {} };
  const gr = async (key, fallback) => { try { const r = await window.storage.get(key); return r ? JSON.parse(r.value) : fallback; } catch { return fallback; } };

  // ── 로그인
  async function tryLogin(id, silent=false) {
    if (!id.trim()) return;
    const isAdm = id === ADMIN_ID;
    setUid(id);
    setIsAdmin(isAdm);
    localStorage.setItem("hub_last_uid", id);

    // 접속 시각 갱신 (PIN 로그인에서 이미 info 설정됨, 여기서는 lastSeen만 갱신)
    if (!isAdm) {
      const safeId = id.replace(/[.#$\[\]]/g, '_');
      try {
        const existing = await fb.get(`users/${safeId}/info`);
        await fb.set(`users/${safeId}/info`, {
          ...(existing || { id }),
          lastSeen: Date.now(),
          lastDate: new Date().toLocaleDateString('ko-KR')
        });
      } catch {}
      await sw(K_UTIME(id), Date.now());
    }

    // 첫 번째 활성 모듈 설정
    const firstMod = MODULE_REGISTRY.find(m => m.status === "active");
    if (firstMod) setActiveModule(firstMod.id);

    if (sessionStorage.getItem("ox_skip_subject")) {
      sessionStorage.removeItem("ox_skip_subject");
      setScreen("hub");
    } else {
      setScreen("subject");
    }
    loadHubStats(id);
  }

  // ── 모듈 스토리지 로드
  async function loadHubStats(userId) {
    if (!userId) return;
    const sid = toSafeId(userId);
    const stats = {};
    for (const mod of MODULE_REGISTRY.filter(m=>m.status==="active")) {
      const allWrong = new Set(), allMarked = new Set();
      let answered=0, total=mod.count||0;
      for (const r of ROUNDS) {
        const fbW = await fb.get(fbPath.wrong(sid,mod.id,r));
        const w = fbW || await gr(K_WRONG(userId,mod.id,r), []);
        w.forEach(id=>allWrong.add(id));
        const fbM = await fb.get(fbPath.marked(sid,mod.id,r));
        const m2 = fbM || await gr(K_MARKED(userId,mod.id,r), []);
        m2.forEach(id=>allMarked.add(id));
      }
      // 진행률: 1회독 기준
      const fbP = await fb.get(fbPath.prog(sid,mod.id,1));
      const lsP = await gr(K_PROG(userId,mod.id,1), {answered:[]});
      const p = fbP || lsP;
      answered = (p.answered||[]).length;
      const pct = total ? Math.round(answered/total*100) : 0;
      stats[mod.id] = {wc: allWrong.size, mc: allMarked.size, answered, pct};
    }
    setHubStats(stats);
  }

  async function loadModuleData(mid) {
    if (!uid) return;
    const sid = toSafeId(uid);
    const wm = {}, mm = {}, pm = {}, awm = {}, amm = {};

    for (const r of ROUNDS) {
      // Firebase 우선, 없으면 localStorage 폴백
      const fbW = await fb.get(fbPath.wrong(sid,mid,r));
      wm[r] = new Set(fbW || await gr(K_WRONG(uid,mid,r), []));

      const fbM = await fb.get(fbPath.marked(sid,mid,r));
      mm[r] = new Set(fbM || await gr(K_MARKED(uid,mid,r), []));

      const fbP = await fb.get(fbPath.prog(sid,mid,r));
      const lsP = await gr(K_PROG(uid,mid,r), {answered:[],correct:[],wrong:[]});
      const p   = fbP || lsP;
      pm[r] = { answered:new Set(p.answered||[]), correct:new Set(p.correct||[]), wrong:new Set(p.wrong||[]) };

      const fbAW = await fb.get(fbPath.awWrong(sid,mid,r));
      awm[r] = new Set(fbAW || await gr(K_AW_WRONG(uid,mid,r), []));

      const fbAM = await fb.get(fbPath.awMark(sid,mid,r));
      amm[r] = new Set(fbAM || await gr(K_AW_MARK(uid,mid,r), []));
    }

    setWrongMap(wm); setMarkedMap(mm); setProgMap(pm);
    setAwWrongMap(awm); setAwMarkMap(amm);

    // 아카이브 회독
    const fbAR = await fb.get(fbPath.archRound(sid,mid));
    const arVal = fbAR ?? await gr(K_AW_ROUND(uid,mid), 1);
    setArchRound(arVal);

    // 세션
    const fbSess = await fb.get(fbPath.session(sid,mid));
    const lsSess = await gr(K_SESSION(uid,mid), null);
    setSavedSession(fbSess || lsSess);

    // 수정본 (Firebase 공유)
    const fbEdits = await fb.list(`edits/${mid}`);
    const edits = {};
    for (const ed of Object.values(fbEdits||{})) {
      if (ed?.qid) edits[ed.qid] = {question:ed.question, explanation:ed.explanation};
    }
    setUserEdits(edits);
  }

  useEffect(() => { if (uid && activeModule) loadModuleData(activeModule); }, [uid, activeModule]);

  // 수정본 저장 (공유: 모든 유저에게 적용)
  const saveEdit = async (qid, q, e) => {
    const next = {...userEdits};
    if (q === null) {
      delete next[qid];
    } else {
      next[qid] = { ...(next[qid]||{}), question: q, explanation: e };
    }
    setUserEdits(next);
    await window.storage.set(K_EDITS(activeModule), JSON.stringify(next));
  };

  // 현재 문항에 수정본 적용
  const applyEdit = (q) => {
    if (!q) return q;
    const ed = userEdits[q.id];
    if (!ed) return q;
    return { ...q, question: ed.question ?? q.question, explanation: ed.explanation ?? q.explanation };
  };

  // 이중 저장: Firebase(공유) + localStorage(빠른 읽기)
  const _fbsw = (path, data) => { fb.set(path, data); }; // fire-and-forget

  const saveWrong = (r,s) => {
    const arr = [...s];
    sw(K_WRONG(uid,activeModule,r), arr);
    _fbsw(fbPath.wrong(toSafeId(uid),activeModule,r), arr);
  };
  const saveMarked = (r,s) => {
    const arr = [...s];
    sw(K_MARKED(uid,activeModule,r), arr);
    _fbsw(fbPath.marked(toSafeId(uid),activeModule,r), arr);
  };
  const saveProg = (r,p) => {
    const obj = {answered:[...p.answered],correct:[...p.correct],wrong:[...p.wrong]};
    sw(K_PROG(uid,activeModule,r), obj);
    _fbsw(fbPath.prog(toSafeId(uid),activeModule,r), obj);
  };
  const saveAwWrong = (r,s) => {
    const arr = [...s];
    sw(K_AW_WRONG(uid,activeModule,r), arr);
    _fbsw(fbPath.awWrong(toSafeId(uid),activeModule,r), arr);
  };
  const saveAwMark = (r,s) => {
    const arr = [...s];
    sw(K_AW_MARK(uid,activeModule,r), arr);
    _fbsw(fbPath.awMark(toSafeId(uid),activeModule,r), arr);
  };
  const saveArchRound = (r) => {
    sw(K_AW_ROUND(uid,activeModule), r);
    _fbsw(fbPath.archRound(toSafeId(uid),activeModule), r);
  };
  const saveSession = (sess) => {
    sw(K_SESSION(uid,activeModule), sess || null);
    _fbsw(fbPath.session(toSafeId(uid),activeModule), sess || null);
  };

  // ── 퀴즈 시작
  function launchQuiz(round, mode, topics, resumeData=null, forceNew=false) {
    const mod = MODULE_REGISTRY.find(m => m.id === activeModule);
    if (!mod) return;
    const all = mod.getData();
    let pool, lbl;

    // 아카이브 전용 회독(aw_*): archRound 기준
    if (mode === "aw_wrong") {
      const r = archRound;
      pool = all.filter(q => (awWrongMap[r]||new Set()).has(q.id));
      if (!pool.length) return;
      lbl = `아카이브 ${r}회독 · 오답 (${pool.length}문제)`;
    } else if (mode === "aw_mark") {
      const r = archRound;
      pool = all.filter(q => (awMarkMap[r]||new Set()).has(q.id));
      if (!pool.length) return;
      lbl = `아카이브 ${r}회독 · 헷갈림 (${pool.length}문제)`;
    } else if (mode === "aw_all") {
      const r = archRound;
      const wids = awWrongMap[r]||new Set(), mids = awMarkMap[r]||new Set();
      pool = all.filter(q => wids.has(q.id)||mids.has(q.id));
      if (!pool.length) return;
      lbl = `아카이브 ${r}회독 · 전체 (${pool.length}문제)`;
    } else if (mode === "wrong+marked") {
      const wids = wrongMap[round]||new Set(), mids = markedMap[round]||new Set();
      pool = all.filter(q => wids.has(q.id) || mids.has(q.id));
      if (!pool.length) return;
      lbl = `${round}회독 오답+헷갈림 (${pool.length}문제)`;
    } else if (mode === "rnd100") {
      pool = shuffle([...all]).slice(0, 100);
      lbl = `${round}회독 무작위 100문제`;
    } else if (mode === "star") {
      pool = all.filter(q => q.star);
      if (!pool.length) return;
      lbl = `${round}회독 · ⭐ 중요문제 (${pool.length}문제)`;
    } else if (mode === "topic") {
      pool = topics.length > 0 ? all.filter(q => topics.some(t => t === "15V" ? String(q.id).startsWith("15V") : q.topic === t)) : [...all];
      lbl = `${round}회독 · ${topics.length > 0 ? topics.map(t=>mod.topics.find(x=>x.key===t)?.label||t).join(', ') : '전체'} (${pool.length}문제)`;
    } else {
      pool = [...all];
      lbl = `${round}회독 전체 ${all.length}문제`;
    }

    // 이어풀기: resumeData가 있으면 복원, 없으면 섞어서 시작
    let finalQueue, startIdx;
    // forceNew=false이고 resumeData 없으면 savedSession 자동 사용
    const effectiveResume = forceNew ? null : (resumeData || savedSession);
    const topicsMatch = mode !== "topic" || (
      effectiveResume &&
      [...(effectiveResume.topics||[])].sort().join(",") === [...topics].sort().join(",")
    );
    if (effectiveResume && effectiveResume.mode === mode && effectiveResume.round === round
      && effectiveResume.module === activeModule && topicsMatch) {
      // 저장된 큐 순서 복원 (ID 배열로 저장 → 실제 문제 객체로 매핑)
      const qMap = Object.fromEntries(all.map(q=>[q.id, q]));
      const restored = (effectiveResume.queueIds||[]).map(id=>qMap[id]).filter(Boolean);
      if (restored.length > 0) {
        finalQueue = restored;
        startIdx = effectiveResume.qidx || 0;
        lbl = effectiveResume.label || lbl;
      } else {
        finalQueue = shuffle(pool);
        startIdx = 0;
      }
    } else {
      finalQueue = shuffle(pool);
      startIdx = 0;
    }

    // 세션 저장
    const sessData = {
      mode, round, topics,
      queueIds: finalQueue.map(q=>q.id),
      qidx: startIdx,
      label: lbl,
      module: activeModule,
    };
    saveSession(sessData);
    setSavedSession(sessData);

    setQueue(finalQueue);
    setQidx(startIdx); setAnswered(null); setUserAns(null); setShowExp(false);
    setFbList([]); setFbOpen(false);
    setSessCor(0); setSessErr(0); setSessMark(0);
    setDone(false); setLabel(lbl); setInQuiz(true); setScreen("quiz");
  }

  function exitQuiz() {
    // 종료 시 현재 위치 저장 (qidx 갱신된 상태 유지 → 이어풀기용)
    setInQuiz(false); setDone(false); setScreen("quiz");
  }

  function handleAnswer(choice) {
    if (answered !== null) return;
    const cur = queue[qidx];
    const correct = choice === cur.answer;
    setUserAns(choice); setAnswered(correct ? "ok" : "er"); setShowExp(false);
    const r = cfgRound;
    const np = {
      answered: new Set([...(progMap[r]?.answered||[]), cur.id]),
      correct:  new Set([...(progMap[r]?.correct||[])]),
      wrong:    new Set([...(progMap[r]?.wrong||[])])
    };
    const nw = new Set(wrongMap[r]||[]);
    if (correct) { np.correct.add(cur.id); setSessCor(p=>p+1); }
    else { np.wrong.add(cur.id); nw.add(cur.id); setSessErr(p=>p+1); }
    setProgMap(pm=>({...pm,[r]:np}));
    setWrongMap(wm=>({...wm,[r]:nw}));
    saveProg(r,np); saveWrong(r,nw);

    // 아카이브 회독용 오답 추가 (메인 오답은 아카이브 현재 회독에도 자동 적재)
    if (!correct) {
      const ar = archRound;
      const nawm = new Set(awWrongMap[ar]||[]);
      nawm.add(cur.id);
      setAwWrongMap(m=>({...m,[ar]:nawm}));
      saveAwWrong(ar, nawm);
    }
  }

  function toggleMark() {
    const cur = queue[qidx]; const r = cfgRound;
    const nm = new Set(markedMap[r]||[]);
    if (nm.has(cur.id)) { nm.delete(cur.id); setSessMark(p=>Math.max(0,p-1)); }
    else { nm.add(cur.id); setSessMark(p=>p+1); }
    setMarkedMap(mm=>({...mm,[r]:nm}));
    saveMarked(r,nm);

    // 아카이브 회독용 헷갈림도 동기화
    const ar = archRound;
    const namm = new Set(awMarkMap[ar]||[]);
    if (nm.has(cur.id)) namm.add(cur.id); else namm.delete(cur.id);
    setAwMarkMap(m=>({...m,[ar]:namm}));
    saveAwMark(ar, namm);
  }

  function handleNext() {
    if (qidx+1 >= queue.length) {
      setDone(true);
      saveSession(null); // 완료 시 세션 삭제
      setSavedSession(null);
    } else {
      const nextIdx = qidx+1;
      setQidx(nextIdx);
      setAnswered(null); setUserAns(null); setShowExp(false);
      setFbList([]); setFbOpen(false);
      // 세션 qidx 갱신
      if (savedSession) {
        const updated = {...savedSession, qidx: nextIdx};
        setSavedSession(updated);
        saveSession(updated);
      }
    }
  }

  // ── rnd100 타이머: qidx·inQuiz 변화 시 리셋 ──────────────
  useEffect(() => { qidxRef.current = qidx; }, [qidx]);
  useEffect(() => { queueRef.current = queue; }, [queue]);

  useEffect(() => {
    if (cfgMode !== "rnd100" || !inQuiz || done) {
      clearInterval(timerRef.current); return;
    }
    clearInterval(timerRef.current);
    setTimerLeft(20);
    timerRef.current = setInterval(() => {
      setTimerLeft(t => { if (t <= 1) { clearInterval(timerRef.current); return 0; } return t - 1; });
    }, 1000);
    return () => clearInterval(timerRef.current);
  }, [qidx, inQuiz, cfgMode, done]);

  // 답변 시 타이머 정지
  useEffect(() => { if (answered !== null) clearInterval(timerRef.current); }, [answered]);

  // 시간 초과 처리
  useEffect(() => {
    if (timerLeft !== 0 || cfgMode !== "rnd100" || answered !== null || !inQuiz || done) return;
    const cur = queue[qidx];
    if (!cur) return;
    // 오답 강제 처리
    setAnswered("er"); setUserAns(null); setShowExp(false);
    setSessErr(p => p + 1);
    const r = cfgRound;
    const np = {
      answered: new Set([...(progMap[r]?.answered||[]), cur.id]),
      correct:  new Set([...(progMap[r]?.correct ||[])]),
      wrong:    new Set([...(progMap[r]?.wrong   ||[])])
    };
    np.wrong.add(cur.id);
    const nw = new Set(wrongMap[r]||[]); nw.add(cur.id);
    setProgMap(pm=>({...pm,[r]:np})); setWrongMap(wm=>({...wm,[r]:nw}));
    saveProg(r,np); saveWrong(r,nw);
    const ar = archRound;
    const nawm = new Set(awWrongMap[ar]||[]); nawm.add(cur.id);
    setAwWrongMap(m=>({...m,[ar]:nawm})); saveAwWrong(ar,nawm);
    // 1.3초 후 자동 다음 문제
    setTimeout(() => {
      const nextIdx = qidxRef.current + 1;
      if (nextIdx >= queueRef.current.length) {
        setDone(true); saveSession(null); setSavedSession(null);
      } else {
        setQidx(nextIdx); setAnswered(null); setUserAns(null);
        setShowExp(false); setFbList([]); setFbOpen(false);
      }
    }, 1300);
  }, [timerLeft]); // eslint-disable-line


  async function resetModule() {
    if (!confirm(`${activeModule} 모듈 전체 기록을 초기화하시겠습니까?`)) return;
    for (const r of ROUNDS) {
      const np = {answered:new Set(),correct:new Set(),wrong:new Set()};
      setProgMap(pm=>({...pm,[r]:np}));
      setWrongMap(wm=>({...wm,[r]:new Set()}));
      setMarkedMap(mm=>({...mm,[r]:new Set()}));
      saveProg(r,np); saveWrong(r,new Set()); saveMarked(r,new Set());
    }
  }

  // ── 헬퍼
  const getMod   = () => MODULE_REGISTRY.find(m => m.id === activeModule);
  const getAll   = () => getMod()?.getData() || [];
  const wCnt     = r => (wrongMap[r]||new Set()).size;
  const mCnt     = r => (markedMap[r]||new Set()).size;
  const wmCnt    = r => new Set([...(wrongMap[r]||new Set()), ...(markedMap[r]||new Set())]).size;
  const awCnt    = r => (awWrongMap[r]||new Set()).size;
  const amCnt    = r => (awMarkMap[r]||new Set()).size;
  const awTotal  = r => { const w=awWrongMap[r]||new Set(), m=awMarkMap[r]||new Set(); return new Set([...w,...m]).size; };
  const tCnt     = k => getAll().filter(q=> k==="15V" ? String(q.id).startsWith("15V") : q.topic===k).length;
  const tWrong   = (r,k) => getAll().filter(q=>(k==="15V" ? String(q.id).startsWith("15V") : q.topic===k)&&(wrongMap[r]||new Set()).has(q.id)).length;
  const tProg    = (r,k) => { const all=getAll().filter(q=> k==="15V" ? String(q.id).startsWith("15V") : q.topic===k); const ans=(progMap[r]?.answered||new Set()); const done=all.filter(q=>ans.has(q.id)).length; return {done, total:all.length, pct:all.length?Math.round(done/all.length*100):0}; };
  const TOTAL    = getAll().length;
  const getProg  = r => { const p=progMap[r]||{answered:new Set()}; return { ans:p.answered.size, pct:Math.round(p.answered.size/Math.max(TOTAL,1)*100) }; };
  const canStart = cfgMode !== "topic" || cfgTopics.length > 0;
  // 이어풀기 세션이 현재 설정과 매칭되는지 확인
  const hasResume = savedSession && savedSession.round===cfgRound && savedSession.mode===cfgMode
    && savedSession.module===activeModule
    && (cfgMode!=="topic" || (savedSession.topics||[]).join(",")===[...cfgTopics].sort().join(","))
    && (savedSession.qidx||0) > 0
    && (savedSession.queueIds||[]).length > (savedSession.qidx||0);
  const startCnt = cfgMode==="all" ? TOTAL : cfgMode==="rnd100" ? 100 : cfgMode==="topic" ? getAll().filter(q=>cfgTopics.includes(q.topic)).length : cfgMode==="wrong+marked" ? wmCnt(cfgRound) : 0;
  const cur      = applyEdit(queue[qidx]);
  const curMark  = cur && (markedMap[cfgRound]||new Set()).has(cur.id);

  // 아카이브 표시
  const archItems = r => {
    const wids = wrongMap[r]||new Set(), mids = markedMap[r]||new Set();
    if (archFilter==="wrong")  return getAll().filter(q=>wids.has(q.id));
    if (archFilter==="marked") return getAll().filter(q=>mids.has(q.id)&&!wids.has(q.id));
    return getAll().filter(q=>wids.has(q.id)||mids.has(q.id));
  };

    } catch { return {}; }
  }


  async function loadAdminUsers() {
    // Firebase에서 전체 유저 + 완전한 학습 통계 조회
    const fbAll = await fb.list('users');
    if (!fbAll) { setAdminUsers([]); return; }

    const users = [];
    for (const [safeId, userData] of Object.entries(fbAll)) {
      if (!userData || typeof userData !== 'object') continue;
      // info 서브키 있는 경우(신규)와 없는 경우(구버전) 모두 지원
      const info = userData.info || {};
      const id = info.id || userData.id || safeId;
      if (!id || id === ADMIN_ID) continue;
      const lastSeen = info.lastSeen || userData.lastSeen || 0;
      const lastDate = info.lastDate || userData.lastDate || '';

      const stats = userData?.stats || {};
      let total_ans=0, total_cor=0, total_wrg=0;
      const modStats = [];

      for (const mod of MODULE_REGISTRY.filter(m=>m.status==="active")) {
        const modData = stats[mod.id] || {};
        let m_ans=0, m_cor=0, m_wrg=0;
        for (const r of ROUNDS) {
          const p = modData[`prog_${r}`] || {};
          m_ans += (p.answered||[]).length;
          m_cor += (p.correct||[]).length;
          m_wrg += (p.wrong||[]).length;
        }
        total_ans+=m_ans; total_cor+=m_cor; total_wrg+=m_wrg;
        if (m_ans>0) modStats.push({mod:mod.label, ans:m_ans, cor:m_cor, wrg:m_wrg,
          pct: m_ans>0?Math.round(m_cor/m_ans*100):0});
      }
      users.push({ id, last:lastSeen, lastDate, ans:total_ans, cor:total_cor, wrg:total_wrg, modStats });
    }
    users.sort((a,b)=>(b.last||0)-(a.last||0));
    setAdminUsers(users);
  }

  async function adminSearchUser(searchId) {
    if (!searchId.trim()) return;
    const id = searchId.trim();
    const safeId = toSafeId(id);

    // Firebase에서 완전한 데이터 조회
    const userData = await fb.get(`users/${safeId}`);
    if (!userData) { setAdminResult({id, notFound:true}); return; }

    // info 서브키 있는 경우(신규)와 없는 경우(구버전) 모두 지원
    const info  = userData.info  || {};
    const stats = userData.stats || {};
    const lastSeen_ = info.lastSeen || userData.lastSeen || 0;
    const lastDate_ = info.lastDate || userData.lastDate || '';
    let total_ans=0, total_cor=0, total_wrg=0;
    const modStats = [];

    for (const mod of MODULE_REGISTRY.filter(m=>m.status==="active")) {
      const modData = stats[mod.id] || {};
      let m_ans=0, m_cor=0, m_wrg=0, m_wrg_cnt=0, m_mk_cnt=0;
      for (const r of ROUNDS) {
        const p = modData[`prog_${r}`] || {};
        m_ans += (p.answered||[]).length;
        m_cor += (p.correct||[]).length;
        m_wrg += (p.wrong||[]).length;
        m_wrg_cnt += (modData[`wrong_${r}`]||[]).length;
        m_mk_cnt  += (modData[`marked_${r}`]||[]).length;
      }
      total_ans+=m_ans; total_cor+=m_cor; total_wrg+=m_wrg;
      if (m_ans>0) modStats.push({mod:mod.label, ans:m_ans, cor:m_cor, wrg:m_wrg,
        pct:m_ans>0?Math.round(m_cor/m_ans*100):0, wrongCnt:m_wrg_cnt, markCnt:m_mk_cnt});
    }

    if (!lastSeen_ && total_ans===0) { setAdminResult({id, notFound:true}); return; }
    setAdminResult({id, last:lastSeen_, lastDate:lastDate_, ans:total_ans, cor:total_cor, wrg:total_wrg, modStats});
  }

  function renderExp(exp) {
    if (!exp) return null;
    const boxStyle = {
      background:'var(--sf2)', border:'1px solid var(--bd2)',
      borderLeft:'3px solid var(--blue)', borderRadius:6,
      padding:'6px 10px', margin:'4px 0', fontSize:14,
      color:'var(--tx2)', fontFamily:"'Noto Sans KR', sans-serif", lineHeight:1.6
    };
    // ▸ 앞 또는 \n[AI해설] 앞에서 분리
    const segs = exp.split(/(?=▸)|\n(?=\[AI해설\])/).filter(s => s.trim());
    return segs.map((seg, si) => {
      const t = seg.trim();
      // [AI해설] 섹션
      if (t.startsWith('[AI해설]')) {
        return (
          <div key={si} style={{marginTop:10,paddingTop:8,borderTop:'1px dashed rgba(255,255,255,.1)',fontSize:14,color:'var(--tx3)',lineHeight:1.7}}>
            <span style={{display:'inline-block',background:'rgba(82,167,254,.15)',color:'var(--blue)',borderRadius:4,padding:'1px 6px',fontSize:10,fontWeight:700,marginRight:6}}>AI해설</span>
            {t.slice('[AI해설]'.length).trim()}
          </div>
        );
      }
      // [조문] 전체 섹션 → 박스
      if (t.startsWith('[조문]')) {
        return <div key={si} style={{...boxStyle, marginBottom: si < segs.length-1 ? 6 : 0}}>{t.slice('[조문]'.length).trim()}</div>;
      }
      // 일반 ▸ 섹션 — 인라인 제NNN조 / [법조문] / [조문] 박스 처리
      const parts = seg.split(/(제\d+조[^가-힣\n]{5,150}[가-힣]|\[법조문\][^\n]+|\[조문\][^\n]+)/g);
      const nextIsAI = segs[si+1]?.trim().startsWith('[AI해설]');
      return (
        <div key={si} style={{marginBottom: si < segs.length-1 && !nextIsAI ? 10 : 0}}>
          {parts.map((p, pi) => {
            const pt = p.trim();
            if (/^제\d+조/.test(pt) || /^\[법조문\]/.test(pt)) return <div key={pi} style={boxStyle}>{p}</div>;
            if (/^\[조문\]/.test(pt)) return <div key={pi} style={boxStyle}>{p.replace(/^\[조문\]\s*/,'')}</div>;
            return <span key={pi} style={{whiteSpace:'pre-wrap'}}>{p}</span>;
          })}
        </div>
      );
    });
  }

function CircleTimer({ timeLeft, total = 20 }) {
  const r = 13, circ = +(2 * Math.PI * r).toFixed(2);
  const offset = +(circ * (1 - timeLeft / total)).toFixed(2);
  const color = timeLeft <= 5 ? '#f87171' : timeLeft <= 10 ? '#fbbf24' : 'var(--gold)';
  return (
    <svg width="34" height="34" viewBox="0 0 34 34">
      <circle cx="17" cy="17" r={r} fill="none" stroke="rgba(255,255,255,.09)" strokeWidth="3"/>
      <circle cx="17" cy="17" r={r} fill="none" stroke={color} strokeWidth="3"
        strokeDasharray={circ} strokeDashoffset={offset}
        strokeLinecap="round"
        style={{transform:'rotate(-90deg)',transformOrigin:'17px 17px',
          transition:'stroke-dashoffset 0.9s linear, stroke 0.3s'}}/>
    </svg>
  );
}


function LoginScreen({ onLogin }) {
  const FB_BASE = "https://project-1720248149706690221-default-rtdb.asia-southeast1.firebasedatabase.app";

  const [step, setStep]       = React.useState("id");   // id | pin_new | pin_check
  const [uid,  setUid]        = React.useState(localStorage.getItem("hub_last_uid")||"");
  const [pin,  setPin]        = React.useState(["","","",""])
  const [status, setStatus]   = React.useState({msg:"", type:"info"});
  const [loading, setLoading] = React.useState(false);
  const pinRefs = [React.useRef(), React.useRef(), React.useRef(), React.useRef()];

  // Firebase 단순 fetch
  const fbGet = async (path) => {
    try {
      const r = await fetch(`${FB_BASE}/${path}.json`);
      return r.ok ? await r.json() : null;
    } catch { return null; }
  };
  const fbSet = async (path, data) => {
    try {
      await fetch(`${FB_BASE}/${path}.json`, {
        method:'PUT', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(data)
      });
    } catch {}
  };

  const toSafe = id => id.replace(/[.#$\[\]]/g,'_');

  // PIN 입력 핸들러
  const handlePinInput = (i, val) => {
    if (!/^[0-9]?$/.test(val)) return;
    const next = [...pin];
    next[i] = val;
    setPin(next);
    if (val && i < 3) pinRefs[i+1].current?.focus();
  };
  const handlePinKey = (i, e) => {
    if (e.key === "Backspace" && !pin[i] && i > 0) {
      pinRefs[i-1].current?.focus();
    }
    if (e.key === "Enter") handlePinSubmit();
  };
  const pinFull = pin.join("");

  // 1단계: 아이디 확인
  const handleUnifiedLogin = async () => {
    const id = uid.trim();
    if (!id) { setStatus({msg:"아이디를 입력해주세요.", type:"er"}); return; }
    if (!/^[a-zA-Z0-9가-힣_-]{1,20}$/.test(id)) {
      setStatus({msg:"20자 이내 한글/영문/숫자/_-만 가능합니다.", type:"er"}); return;
    }
    if (pinFull.length !== 4) { setStatus({msg:"PIN 4자리를 모두 입력해주세요.", type:"er"}); return; }

    setLoading(true);
    setStatus({msg:"확인 중...", type:"info"});
    const safeId = toSafe(id);

    const existing = await fbGet(`users/${safeId}/info`);

    if (existing && existing.pin) {
      // 기존 유저 — PIN 대조
      if (existing.pin !== pinFull) {
        setLoading(false);
        setStatus({msg:"PIN이 올바르지 않습니다.", type:"er"});
        setPin(["","","",""]);
        setTimeout(()=>pinRefs[0].current?.focus(), 50);
        return;
      }
      // PIN 일치 — 접속시간 갱신 후 로그인
      await fbSet(`users/${safeId}/info`, {
        ...existing,
        lastSeen: Date.now(),
        lastDate: new Date().toLocaleDateString('ko-KR')
      });
      setStatus({msg:"로그인 성공!", type:"ok"});
      setLoading(false);
      setTimeout(()=>onLogin(id), 300);
    } else {
      // 신규 유저 — PIN 저장 후 로그인
      await fbSet(`users/${safeId}/info`, {
        id, pin: pinFull,
        lastSeen: Date.now(),
        lastDate: new Date().toLocaleDateString('ko-KR')
      });
      setStatus({msg:"계정 생성 완료!", type:"ok"});
      setLoading(false);
      setTimeout(()=>onLogin(id), 500);
    }
  };

  const handleIdNext = async () => {

    const id = uid.trim();
    if (!id) return;
    if (!/^[a-zA-Z0-9가-힣_-]{1,20}$/.test(id)) {
      setStatus({msg:"20자 이내 한글/영문/숫자/_-만 가능합니다.", type:"er"}); return;
    }

    setLoading(true);
    setStatus({msg:"확인 중...", type:"info"});
    const safeId = toSafe(id);
    const existing = await fbGet(`users/${safeId}/info`);
    setLoading(false);

    if (existing && existing.pin) {
      // 기존 유저 → PIN 확인
      setPin(["","","",""]);
      setStep("pin_check");
      setStatus({msg:"등록된 PIN을 입력해주세요.", type:"info"});
      setTimeout(()=>pinRefs[0].current?.focus(), 100);
    } else {
      // 신규 유저 → PIN 등록
      setPin(["","","",""]);
      setStep("pin_new");
      setStatus({msg:"사용할 4자리 PIN을 설정해주세요.", type:"info"});
      setTimeout(()=>pinRefs[0].current?.focus(), 100);
    }
  };

  // 2단계: PIN 제출
  const handlePinSubmit = async () => {
    if (pinFull.length !== 4) {
      setStatus({msg:"4자리를 모두 입력해주세요.", type:"er"}); return;
    }
    const id = uid.trim();
    const safeId = toSafe(id);
    setLoading(true);

    if (step === "pin_new") {
      // 신규: PIN 저장 후 로그인
      await fbSet(`users/${safeId}/info`, {
        id, pin: pinFull,
        lastSeen: Date.now(),
        lastDate: new Date().toLocaleDateString('ko-KR')
      });
      setStatus({msg:"PIN 설정 완료!", type:"ok"});
      setLoading(false);
      setTimeout(()=>onLogin(id), 500);
    } else {
      // 기존: PIN 검증
      const existing = await fbGet(`users/${safeId}/info`);
      const correctPin = existing?.pin;
      if (correctPin === pinFull) {
        // 접속시간 갱신
        if (existing) {
          await fbSet(`users/${safeId}/info`, {
            ...existing,
            lastSeen: Date.now(),
            lastDate: new Date().toLocaleDateString('ko-KR')
          });
        }
        setStatus({msg:"로그인 성공!", type:"ok"});
        setLoading(false);
        setTimeout(()=>onLogin(id), 300);
      } else {
        setStatus({msg:"PIN이 일치하지 않습니다.", type:"er"});
        setPin(["","","",""]);
        setLoading(false);
        setTimeout(()=>pinRefs[0].current?.focus(), 50);
      }
    }
  };

  const bgVideos = ["bg_a.mp4","bg_b.mp4","bg_c.mp4","bg_d.mp4"];
  const [bgSrc] = React.useState(() => bgVideos[Math.floor(Math.random() * bgVideos.length)]);

  return (
    <React.Fragment>
      {/* 비디오 배경 */}

      {/* 로그인 폼 */}
      <div className="login-wrap">
        <div className="login-box">
          <div className="login-header">
            <div className="login-logo">⚖︎ OX Quiz</div>
            <div className="login-title">형사법 선택형 기출 최신빈출지문</div>
          </div>
          <div className="login-card">
            {/* 아이디 입력 */}
            <div className="login-label">아이디</div>
            <input className="login-input" value={uid}
              placeholder="한글/영문/숫자 20자 이내"
              onChange={e=>{ setUid(e.target.value); setStatus({msg:"",type:"info"}); }}
              onKeyDown={e=>{ if(e.key==="Enter") pinRefs[0].current?.focus(); }}
              autoFocus />

            {/* PIN 입력 */}
            <div className="login-label" style={{marginTop:4}}>
              PIN {step==="pin_new" ? <span style={{color:"rgba(180,205,240,.6)",fontWeight:400}}>(신규 — 4자리 숫자 설정)</span> : ""}
            </div>
            <div className="pin-row" style={{marginTop:4}}>
              {[0,1,2,3].map(i=>(
                <input key={i} ref={pinRefs[i]}
                  className="pin-digit" type="password"
                  maxLength={1} value={pin[i]}
                  onChange={e=>handlePinInput(i, e.target.value)}
                  onKeyDown={e=>handlePinKey(i,e)} />
              ))}
            </div>
            <div className={`pin-status ${status.type}`} style={{color: status.type==="ok"?"rgba(120,200,120,.9)":status.type==="er"?"rgba(255,100,100,.9)":"rgba(180,205,240,.5)"}}>{status.msg}</div>
            <button className="login-btn" onClick={handleUnifiedLogin} disabled={loading}>
              {loading ? "처리 중..." : "로그인"}
            </button>

            <div className="login-hint" style={{marginTop:14}}>
              아이디 + PIN으로 어느 기기에서든 학습 기록이 이어집니다.<br/>
              처음 사용하는 아이디는 자동으로 계정이 생성됩니다.
            </div>
          </div>
        </div>
      </div>
    </React.Fragment>
  );
}

      </div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:14}}>
        {["전체","오류 제보","정답 이의","해설 보완","기능 요청","기타"].map(t=>(
          <button key={t}
            style={{padding:"4px 12px",borderRadius:14,border:"1px solid var(--bd)",
              background:filter===t?"var(--gold)":"var(--sf2)",
              color:filter===t?"#0d1117":"var(--tx3)",
              fontSize:11,cursor:"pointer",fontWeight:filter===t?700:400}}
            onClick={()=>setFilter(t)}>{t}</button>
        ))}
      </div>
      {loading ? (
        <div style={{textAlign:"center",padding:20,color:"var(--tx3)"}}>불러오는 중...</div>
      ) : filtered.length===0 ? (
        <div style={{textAlign:"center",padding:20,color:"var(--tx3)"}}>피드백이 없습니다.</div>
      ) : filtered.map((f,i)=>(
        <div key={i} className="fb-admin-item">
          <div className="fb-admin-meta">
            <span className="fb-admin-no">No.{f.qid}</span>
            <span className="fb-admin-type">{f.type}</span>
            <span className="fb-admin-uid">👤 {f.uid}</span>
            <span className="fb-admin-date">{f.date}</span>
          </div>
          <div className="fb-admin-q">{(f.mid||"")} · 문항 {f.qid}</div>
          <div className="fb-admin-body">{f.text}</div>
        </div>
      ))}
    </div>
  );
}

// 앱 마운트
const container = document.getElementById('root');
const root = ReactDOM.createRoot(container);
root.render(React.createElement(App));
</script>
</body>
</html>
