["1026", "★ 가정법원이나 지방법원 소년부가 소년보호처분을 함에 있어서도 자백의 보강법칙이 적용된다.", false, "▸ 형사소송절차가 아닌 소년보호사건에 있어서는 비행사실의 일부에 관하여 자백이외의 다른 증거가 없다 하더라도 법령적용의 착오나 소송절차의 법령위반이 있다고 할 수 없다. [82모36]", "증거동의탄핵증명력"],
["1027", "★ 실체적 경합범의 경우에는 각 범죄사실에 관하여 자백에 대한 보강증거가 있어야 한다.", true, "▸ 실체적 경합범은 실질적으로 수죄이므로 각 범죄사실에 관하여 자백에 대한 보강증거가 있어야 한다. [2007도10937]", "증거동의탄핵증명력"],
["1028", "★ 전문증거는 전문법칙의 예외에 해당하는지 여부에 관계없이 보강증거가 될 수 있다.", false, "▸ 보강증거는 ① 증거능력이 인정되어야 하고, ② 자백과는 독립된 증거이어야 한다. 증거능력이 없는 전문증거는 보강증거가 될 수 없다.", "증거동의탄핵증명력"],
["1029", "★ 자백에 대한 보강증거는 범죄사실의 전부 또는 중요 부분을 인정할 수 있는 정도가 되지 않더라도, 피고인의 자백이 가공적인 것이 아닌 진실한 것임을 인정할 수 있는 정도만 되면 충분하지만, 직접증거가 아닌 간접증거나 정황증거는 보강증거가 될 수 없다.", false, "▸ 자백에 대한 보강증거는 범죄사실의 전부 또는 중요 부분을 인정할 수 있는 정도가 되지 않더라도 자백이 진실한 것임을 인정할 수 있는 정도만 되면 충분하다. 또한 직접증거가 아닌 간접증거나 정황증거도 보강증거가 될 수 있다. [2017도20247]", "증거동의탄핵증명력"],
["1030", "★ 피고인이 다세대주택의 여러 세대에서 7건의 절도행위를 한 것으로 기소되었는데 그 중 4건은 범행 장소인 구체적 호수가 특정되지 않은 사안에서, 위 4건에 관한 피고인 자백의 진실성이 인정되는 경우라면, 피고인의 집에서 압수한 위 4건의 각 피해품에 대한 압수조서와 압수물 사진은 위 자백에 대한 보강증거가 된다.", true, "▸ [AI해설] 자백의 진실성이 인정되는 경우 피해품의 압수조서와 압수물 사진은 보강증거가 된다. [2008도2343]", "증거동의탄핵증명력"],
["1031", "★ 2021. 10. 19. 채취한 소변에 대한 검사결과 메스암페타민 성분이 검출된 경우, 위 소변검사결과는 2021. 10. 17. 메스암페타민을 투약하였다는 자백에 대한 보강증거가 될 수는 있지만, 각 투약행위에 대한 자백의 보강증거는 별개의 것이어야 하므로, 같은 달 13. 메스암페타민을 투약하였다는 자백에 대한 보강증거는 될 수 없다.", false, "▸ 위 소변검사결과는 2021. 10. 17. 자백에 대한 보강증거가 될 수 있음은 물론 같은 달 13. 메스암페타민을 투약하였다는 자백에 대한 보강증거도 될 수 있다. [2001도1897]", "증거동의탄핵증명력"],
["1032", "★ 「국가보안법」상 회합죄를 피고인이 자백하는 경우, 회합 당시 상대방으로부터 받았다는 명함의 현존은 보강증거로 될 수 있다.", true, "▸ 국가보안법상 회합죄를 피고인이 자백하는 경우, 회합 당시 상대방으로부터 받았다는 명함의 현존은 보강증거로 될 수 있다. [90도741]", "증거동의탄핵증명력"],
["1033", "★ 공소장에 기재된 대마 흡연일자로부터 한 달 후 피고인의 주거지에서 압수된 대마잎은 비록 피고인의 자백이 구체적이고 그 진실성이 인정된다고 하더라도 피고인의 자백에 대한 보강증거가 될 수 없다.", false, "▸ 기소된 대마 흡연일자로부터 한 달 후 피고인의 주거지에서 압수된 대마잎이 피고인의 자백에 대한 보강증거가 된다. [2007도5845]", "증거동의탄핵증명력"],
["1034", "★ 약 3개월에 걸쳐 8회의 도박을 하였다는 혐의로 검사가 피고인에 대해 상습도박죄로 기소한 경우, 총 8회의 도박 중 3회의 도박사실에 대해서는 피고인의 자백 외 보강증거가 없는 경우에도 법원은 소위 진실성담보설에 입각하여 8회의 도박행위 전부에 대하여 유죄판결을 할 수 있다.", false, "▸ 피고인의 습벽을 범죄구성요건으로 하며 포괄일죄인 상습범에 있어서도 이를 구성하는 각 행위에 관하여 개별적으로 보강증거가 요구된다. [95도1794]", "증거동의탄핵증명력"],
["1035", "★ 2017. 2. 18. 01:35경 자동차를 타고 온 甲으로부터 필로폰을 건네받은 후 甲이 위 차량을 운전해 갔다고 한 乙의 진술과 2017. 2. 20. 甲으로부터 채취한 소변에서 나온 필로폰 양성 반응 결과는, 甲이 2017. 2. 18. 02:00경의 필로폰 투약으로 정상적으로 운전하지 못할 우려가 있는 상태에서 운전하였다는 자백을 보강하는 증거가 되기에 충분하다.", true, "▸ [AI해설] 乙의 진술과 소변 양성 반응 결과는 甲의 필로폰 투약 후 음주운전 자백을 보강하는 증거가 된다. [2010도11272]", "증거동의탄핵증명력"],
["1036", "★ 甲은 야간에 건축자재 등을 훔칠 생각으로 주택 신축공사 현장에 있는 컨테이너 박스 앞에 놓여 있던 노루발못뽑이를 이용하여 컨테이너 박스의 출입문의 시정장치를 부순 혐의로 기소되었다. 노루발못뽑이와 손괴된 쇠창살의 모습이 촬영되어 수사보고서에 첨부된 현장 사진은 「형법」제331조 제1항(야간손괴침입절도)의 죄에 관한 甲의 자백에 대한 보강증거로 인정될 수 있다.", true, "▸ [AI해설] 노루발못뽑이와 손괴된 쇠창살 현장 사진은 야간손괴침입절도죄에 관한 자백의 보강증거로 인정될 수 있다. [2011도8015]", "증거동의탄핵증명력"],
["1037", "★ 피고인 甲은 피고인 乙로부터 뇌물을 수수하였다는 공소사실로, 피고인 乙은 피고인 甲에게 뇌물을 공여하였다는 공소사실로 기소되어 공동피고인으로 재판을 받고 있다. 甲이 법정에서 乙로부터 뇌물을 수수한 사실을 부인하면서 공소사실 기재 일시경에 乙을 만났던 사실과 공무에 관한 청탁을 받은 사실만을 시인하였다면 이것만으로는 乙의 자백에 대한 보강증거가 될 수 없다.", false, "▸ 뇌물공여의 상대방인 공무원이 뇌물을 수수한 사실을 부인하면서도 그 일시경에 뇌물공여자를 만났던 사실 및 공무에 관한 청탁을 받기도 한 사실자체는 시인하였다면, 이는 뇌물을 공여하였다는 뇌물공여자의 자백에 대한 보강증거가 될 수 있다. [94도999]", "증거동의탄핵증명력"],
["1038", "★ 피고인이 공판정에서 공소사실에 대하여 자백을 하였다면 검사가 작성한 피고인에 대한 피의자신문조서를 자백의 보강증거로 사용할 수 있다.", false, "▸ 피고인의 법정진술과 검찰 피의자신문조서의 진술기재는 피고인의 법정 및 검찰에서의 자백으로서 제310조에서 규정하는 자백의 개념에 포함되어 그 자백만으로는 유죄의 증거로 삼을 수 없다. [2007도10937]", "증거동의탄핵증명력"],
["1039", "★ 甲이 특수(합동)절도 범행을 자백하고, 甲이 범행을 자인하는 것을 들었다는 피고인 아닌 제3자의 진술이 있다면, 이는 「형사소송법」제310조의 피고인 자백에 포함되지 아니하므로 甲의 자백에 대한 보강증거가 될 수 있다.", false, "▸ 피고인이 범행을 자인하는 것을 들었다는 피고인 아닌 자의 진술내용은 형소법 제310조의 피고인의 자백에는 포함되지 아니하나, 그 진술내용은 실질적으로 피고인의 자백과 동일시될 수 있어 피고인의 자백에 대한 보강증거로 볼 수 없다. [2007도10937]", "증거동의탄핵증명력"],
["1040", "★ 피고인 甲은 뇌물수수 공소사실로, 피고인 乙은 뇌물공여 공소사실로 기소되어 공범인 공동피고인으로 재판을 받고 있다. 乙이 자신의 사업과 관련하여 그때그때의 수입과 지출을 기재해 놓은 금전출납부가 적법하게 압수되어 증거로 제출된 경우, 금전출납부에 甲에 대한 뇌물공여로 지출된 금액의 기재가 있는 경우에 乙의 자백에 대한 보강증거가 될 수 있다.", true, "▸ [AI해설] 피고인이 뇌물자금과 기타 자금을 구별하지 않고 지출 내역을 계속적·기계적으로 기입한 수첩의 기재는 자백이 아니므로, 증거능력이 있는 한 피고인의 금전출납을 증명할 수 있는 별개의 증거로서 자백의 보강증거가 될 수 있다. [94도2865]", "증거동의탄핵증명력"],
["1041", "★ 공범인 공동피고인의 자백에 대하여는 별도의 보강증거가 필요하지 않다.", true, "▸ 피고인의 자백에 공범인 공동피고인의 진술은 포함되지 아니한다(제310조). 따라서 공범인 공동피고인의 자백에는 보강증거가 필요하지 않다. [90도1939]", "증거동의탄핵증명력"],
["1042", "★ 형사소송법 제310조의 피고인의 자백에는 공범인 공동피고인의 자백이 포함되지 아니하므로 그 진술은 피고인에 대한 범죄사실을 인정하는 데 있어서 보강증거로 사용할 수 있다.", true, "▸ 공범인 공동피고인의 진술은 제310조의 피고인의 자백에 포함되지 않으므로 피고인의 범죄사실에 대한 보강증거로 사용할 수 있다. [90도1939]", "증거동의탄핵증명력"],
["1043", "★ 남편을 살해하도록 교사한 甲과 살인을 범한 乙이 공동피고인으로 병합심리 되는 경우, 甲과 乙이 모두 공소사실을 자백하나 달리 자백을 뒷받침할 다른 증거가 없다면, 법원은 甲과 乙에게 무죄를 선고하여야 한다.", false, "▸ 공동피고인의 자백은 독립한 증거능력이 있다(85도691). 공범인 공동피고인들의 각 진술은 상호간에 서로 보강증거가 될 수 있으므로(90도1939), 서로의 자백이 보강증거가 되어 유죄판결이 가능하다.", "증거동의탄핵증명력"],
["1044", "★ 甲, 乙, 丙이 공모하여 타인의 재물을 편취한 범죄사실로 기소된 사건에서, 피고인 甲과 공동피고인 乙이 범죄사실을 자백하고 공동피고인 丙은 범죄사실을 부인하는 경우, 乙의 자백을 甲의 자백에 대한 보강증거로 사용할 수 없다.", false, "▸ 공동피고인 중의 한 사람이 자백하였고 피고인 역시 자백했다면 다른 공동피고인 중의 한 사람이 부인한다 하여도, 위 공동피고인 중의 한 사람의 자백은 피고인의 자백에 대한 보강증거가 된다. [68도43]", "증거동의탄핵증명력"],
["1045", "★ 공판기일의 소송절차에 관하여는 수소법원의 재판장이 아니라 참여한 법원사무관 등이 공판조서를 작성한다.", true, "▸ 제51조 제1항에 따라 공판기일의 소송절차에 관하여는 법원사무관등이 공판조서를 작성한다.", "증거동의탄핵증명력"],
["1046", "★ 공판조서에 기재된 것은 그 조서만으로 증명하고, 명백한 오기의 경우를 제외하고는 다른 자료에 의한 반증이 허용되지 않는다.", true, "▸ 공판조서의 기재가 명백한 오기인 경우를 제외하고는 공판기일의 소송절차로서 공판조서에 기재된 것은 조서만으로써 증명하여야 하고 그 증명력은 절대적이다. [2012도2496]", "증거동의탄핵증명력"],
["1047", "★ 검사 제출의 증거에 관하여 동의 또는 진정성립 여부 등에 관한 피고인의 의견이 증거목록에 기재된 경우에는 그 증거목록의 기재는 공판조서의 일부로서 명백한 오기가 아닌 이상 절대적인 증명력을 가지게 된다.", true, "▸ 검사 제출 증거에 관한 피고인의 의견이 증거목록에 기재된 경우 그 기재는 공판조서의 일부로서 절대적 증명력을 가진다. [2012도2496]", "증거동의탄핵증명력"],
["1048", "★ 피고인이 공소사실을 부인하는 경우 검사가 작성한 피의자신문조서 중 공소사실을 인정하는 취지의 진술 부분은 그 내용을 인정하지 않았다고 보아야 한다.", true, "▸ 피고인이 공판기일에서 공소사실을 부인하는 경우 검사가 작성한 피의자신문조서 중 공소사실을 인정하는 취지의 진술 부분은 그 내용을 인정하지 않았다고 보아야 한다(제312조 제1항). [2023도2102]", "증거동의탄핵증명력"],
["1049", "★ 법원이 공소장변경허가신청서 부본을 피고인에게 송달하였음에도 공판조서에 법원이 그 허가 여부를 결정한 절차가 기재되지 않은 경우, 공판조서에 기재되지 않은 소송절차의 존재가 공판조서에 기재된 다른 내용이나 공판조서 이외의 자료로 증명될 수 있으나, 이는 엄격한 증명의 대상이 된다.", false, "▸ 공판조서에 기재되지 않은 소송절차의 존재는 공판조서에 기재된 다른 내용이나 공판조서 이외의 자료로 증명될 수 있고, 이는 소송법적 사실이므로 자유로운 증명의 대상이다(엄격한 증명 아님). [2023도3038]", "증거동의탄핵증명력"],
["1050", "★ 당해 공판기일에 열석하지 아니한 판사가 재판장으로서 서명날인한 공판조서라도 공판기일에 있어서의 소송절차를 증명할 공판조서로서 증명력이 있다.", false, "▸ 당해 공판기일에 열석하지 아니한 판사가 재판장으로서 서명날인한 공판조서는 적식의 공판조서라고 할 수 없어 소송법상 무효이므로 공판기일에 있어서의 소송절차를 증명할 공판조서로서의 증명력이 없다. [82도2940]", "증거동의탄핵증명력"],
["1051", "★ 동일한 사항에 관하여 두 개의 서로 다른 내용이 기재된 공판조서가 병존할 때에 두 공판조서의 증명력에는 우열이 없으므로 어느 쪽 공판조서의 기재를 진실한 것으로 볼 것인지는 법관의 자유로운 심증에 따를 수밖에 없다.", true, "▸ [AI해설] 동일한 사항에 관하여 두 개의 서로 다른 내용이 기재된 공판조서가 병존하는 경우, 두 공판조서의 증명력에는 우열이 없으므로 어느 쪽 기재를 진실한 것으로 볼 것인지는 법관의 자유로운 심증에 따를 수밖에 없다. [86도1646]", "증거동의탄핵증명력"],
["1052", "★ 피고인이 공판조서에 대해 열람 또는 등사를 청구하였는데 법원이 불응하여 피고인의 열람 또는 등사청구권이 침해된 경우, 그 공판조서를 유죄의 증거로 할 수 없으나 그 공판조서에 기재된 증인의 진술은 다른 절차적 위법이 없는 이상 증거로 할 수 있다.", false, "▸ 피고인의 공판조서에 대한 열람·등사청구에 법원이 불응하여 피고인의 열람 또는 등사청구권이 침해된 경우에는 그 공판조서를 유죄의 증거로 할 수 없을 뿐만 아니라, 공판조서에 기재된 증인의 진술도 증거로 할 수 없다. [2003도3282]", "증거동의탄핵증명력"],
["1053", "★ 피고인이 차회 공판기일 전 등 원하는 시기에 공판조서를 열람·등사하지 못하였다 하더라도 그 변론종결 이전에 이를 열람·등사한 경우에는 그 열람·등사가 늦어짐으로 인하여 피고인의 방어권 행사에 지장이 있었다는 등의 특별한 사정이 없는 한, 피고인의 공판조서의 열람·등사청구권이 침해되었다고 볼 수 없어 그 공판조서를 유죄의 증거로 할 수 있다.", true, "▸ 변론종결 이전에 열람·등사한 경우, 방어권 행사에 지장이 있었다는 등의 특별한 사정이 없는 한, 공판조서의 열람·등사청구권이 침해되었다고 볼 수 없어 유죄의 증거로 할 수 있다. [2007도3906]", "증거동의탄핵증명력"],
["1054", "★ 헌법재판소가 형벌에 관한 법률조항에 대하여 위헌결정을 선고한 경우 그 조항은 소급하여 효력을 상실하므로, 법원은 당해 조항이 적용되어 공소가 제기된 피고사건에 대하여 「형사소송법」제325조 전단에 따라 무죄를 선고하여야 한다.", true, "▸ 위헌결정이 선고된 형벌조항은 소급하여 효력을 상실하므로, 법원은 당해 조항이 적용되어 공소가 제기된 피고사건에 대하여 제325조 전단에 따라 무죄를 선고하여야 한다. [2008도7562]", "재판상소"],
["1055", "★ 원심판결 선고 후 헌법재판소가 원심판결 대상인 법률조항에 대하여 헌법불합치결정을 선고하면서 개정시한을 정하여 입법개선을 촉구하였는데도 그 시한까지 법률 개정이 이루어지지 않은 경우, 위 법률조항은 소급하여 효력을 상실하므로 이를 적용하여 공소가 제기된 피고사건에 대하여는 무죄를 선고하여야 한다.", true, "▸ 헌법불합치결정도 위헌결정에 해당하므로 개정시한까지 입법개선이 이루어지지 않은 경우 그 법률조항은 소급하여 효력을 상실하고, 법원은 제325조 전단에 따라 무죄를 선고하여야 한다. [2008도7562]", "재판상소"],
["1056", "★ 종전 합헌결정일 이전의 범죄행위에 대하여 재심개시결정이 확정되었는데 그 범죄행위에 적용될 법률조항이 위헌결정으로 종전 합헌결정일의 다음 날로 소급하여 효력을 상실하였다면, 범죄행위 당시 유효한 법률이 그 이후 폐지된 경우와 마찬가지이므로 법원은 면소판결을 선고하여야 한다.", true, "▸ [AI해설] 재심에서 종전 합헌결정일의 다음 날로 소급하여 위헌결정된 경우, 범죄행위 당시 유효한 법률이 이후 폐지된 경우와 마찬가지로 면소판결을 선고하여야 한다. [2019도15167]", "재판상소"],
["1057", "★ 교통사고처리특례법 위반사건에서 소송조건이 결여되어 실체심판을 하지 못하고 형식재판을 한 때에는 피고인에게 과실이 없다는 점이 증명되었다 하더라도 바로 교특법 위반에 대해 무죄를 선고할 것이 아니라, 제327조 제2호의 규정에 소송조건의 흠결을 이유로 공소기각 판결을 선고해야 한다.", true, "▸ 소송조건이 결여되어 실체심판을 하지 못하는 경우에는 원칙적으로 공소기각 판결을 선고하여야 한다. [2004도4693]", "재판상소"],
["1058", "★ 교통사고처리특례법 위반사건에서 사건의 실체에 관한 심리가 이미 완료된 때에는 피고인의 이익을 위하여 무죄판결을 선고하여도 위법이라고 볼 수 없다.", true, "▸ 사건의 실체에 관한 심리가 이미 완료되고, 달리 피고인이 죄를 범하였다고 인정되지 않는 경우, 피고인의 이익을 위하여 예외적으로 무죄판결을 선고하여도 위법이라고 볼 수는 없다. [2012도11431]", "재판상소"],
["1059", "★ 피고인에 대하여 재판권이 없는 경우에는 공소기각 판결을 선고하여야 한다.", true, "▸ 제327조 제4호에 따라 피고인에 대하여 재판권이 없는 경우에는 공소기각 판결을 선고하여야 한다.", "재판상소"],
["1060", "★ 제1심에서 유죄를 선고받은 乙이 항소심 재판 중 사망한 경우 법원은 乙에 대하여 형면제판결을 하여야 한다.", false, "▸ 제328조 제1항 제2호에 따라 피고인이 사망한 경우에는 공소기각의 결정을 하여야 한다.", "재판상소"],
["1061", "★ 부정수표단속법위반 사건에서 수표가 그 제시기일에 제시되지 아니한 사실이 공소사실 자체에 의하여 명백한 경우에는 공소기각 판결을 한다.", false, "▸ 부정수표단속법위반 사건에 있어서 수표가 그 제시기일에 제시되지 아니한 사실이 공소사실 자체에 의하여 명백하다면 이 공소사실에는 '범죄가 될만한 사실이 포함되지 아니하는 때'에 해당하므로 형소법 제328조 제1항 제4호에 의하여 공소기각의 '결정'을 하여야 한다. [73도2173]", "재판상소"],
["1062", "★ 검사가 甲을 피해자 乙에 대한 재물손괴죄로 기소하였는데, 甲이 공판과정에서 피해자 乙의 승낙이 있었다는 사실을 진술한 때에는 법원은 甲에게 유죄판결을 선고하면서 이에 대한 판단을 명시하여야 한다.", true, "▸ 피해자의 승낙은 위법성조각사유로서 법률상 범죄의 성립을 조각하는 이유에 해당하므로 이에 대한 사실의 진술이 있을 때에는 이에 대한 판단을 명시하여야 한다(제323조 제2항). [97도87]", "재판상소"],
["1063", "★ 乙이 폭행죄로 기소되어 공판절차에서 범행 당시 술에 만취하였기 때문에 전혀 기억이 없다고 범의를 부인함과 동시에 심신상실 상태에 있었다고 주장한다면, 법원이 乙에 대해 유죄판결을 함에 있어서는 그에 대한 판단을 명시하여야 한다.", true, "▸ 범행 당시 심신상실 상태에 있었다는 주장은 형소법 제323조 제2항에 규정된 범죄의 성립을 조각하거나 형의 감면의 이유가 되는 사실의 진술에 해당하므로 법원은 이에 대한 판단을 명시하여야 한다. [84도1387]", "재판상소"],
["1064", "★ 준강간죄의 공소사실로 공소제기된 피고인이 공판절차에서 자신의 행위가 불능미수에 해당한다고 주장한 경우, 법원은 피고인에 대한 유죄판결을 함에 있어 「형사소송법」제323조 제2항에 따라 이에 대한 판단을 명시하여야 한다.", false, "▸ 제323조 제2항의 '형의 가중, 감면의 이유되는 사실'이란 형의 필요적 가중, 감면의 이유되는 사실을 말하고 형의 감면이 법원의 재량에 맡겨진 경우, 즉 임의적 감면 사유는 이에 해당하지 않는다. 불능미수는 임의적 감면 사유이므로 이에 해당하지 않아 판단 명시 의무가 없다. [2017도14769]", "재판상소"],
["1065", "★ 유죄판결의 판결이유에는 범죄사실, 증거의 요지와 법령의 적용을 명시하여야 하므로, 유죄판결을 선고하면서 판결이유에 이 중 어느 하나를 전부 누락한 경우에는 「형사소송법」제383조 제1호에 정한 판결에 영향을 미친 법률위반으로 파기사유가 된다.", true, "▸ 유죄판결을 선고하면서 판결이유에 범죄사실, 증거의 요지, 법령의 적용 중 어느 하나를 전부 누락한 경우에는 제383조 제1호에 정한 상대적 상고이유가 된다. [2017도744]", "재판상소"],
["1066", "★ 이미 선고된 판결의 내용을 실질적으로 변경하는 재판서 경정은 허용되지 않으므로, 유죄 범죄사실의 일부를 삭제하고 이유무죄 판단을 추가한 판결서의 경정결정은 위법하다.", true, "▸ 이미 선고된 판결의 내용을 실질적으로 변경하는 재판서 경정은 허용되지 않는다. 유죄 범죄사실의 일부를 삭제하고 이유무죄 판단을 추가한 판결서의 경정결정은 위법하다. [2017도18536]", "재판상소"],
["1067", "★ 공판정에서 재판의 선고는 재판서에 의하여야 하므로 선고된 형과 판결원본에 기재된 형이 다른 경우에는 검사는 판결원본에 기재된 형을 집행하여야 한다.", false, "▸ 판결은 그 선고에 의하여 효력을 발생하고 판결원본의 기재에 의하여 효력을 발생하는 것이 아니므로 양자의 형이 다른 경우에는 검사는 선고된 형을 집행하여야 한다. [81모8]", "재판상소"],
["1068", "★ 헌법 제13조 제1항이 규정하고 있는 이중처벌금지의 원칙 내지 일사부재리의 원칙에서의 '처벌'에는 범죄에 대한 국가의 형벌권 실행으로서의 과벌 이외에도 국가가 행하는 일체의 제재나 불이익 처분이 모두 포함된다.", false, "▸ 헌법 제13조 제1항의 '처벌'이란 원칙적으로 범죄에 대한 국가의 형벌권 실행으로서의 과벌을 의미하고, 국가가 행하는 일체의 제재나 불이익처분이 모두 여기에 포함되는 것은 아니다. [2016도5423]", "재판상소"],
["1069", "★ 일사부재리의 효력은 재판이 확정된 때에 발생하는 것이므로 검사가 사기 혐의사실에 대하여 무혐의 결정을 하였다가 다시 공소를 제기하였더라도 일사부재리의 원칙에 위배된 것이라고는 할 수 없다.", true, "▸ 일사부재리의 효력은 재판이 확정된 때에 발생하는 것이므로 검사의 무혐의 결정은 재판의 확정이 아니어서 일사부재리의 원칙이 적용되지 않는다. [84도1545]", "재판상소"],
["1070", "★ 공소기각과 관할위반의 형식재판에 대하여는 일사부재리의 효력이 인정되지 아니한다.", true, "▸ 공소기각과 관할위반의 형식재판에 대하여는 일사부재리의 효력이 인정되지 아니하므로, 공소시효는 공소기각 또는 관할위반의 재판이 확정된 때로부터 다시 진행한다.", "재판상소"],
["1071", "★ 소송조건이 결여되어 실체심판을 하지 못하고 형식재판을 한 때라도 일사부재리의 효력이 발생하는 경우가 있다.", true, "▸ 면소판결이 확정되면 일사부재리 효력이 발생한다. 면소판결은 형식재판이지만 확정 시 일사부재리 효력이 인정된다.", "재판상소"],
["1072", "★ 외국에서 유죄판결을 받고 그 판결이 확정된 다음 우리나라에서 동일한 사건으로 다시 공소가 제기된 경우에는 면소판결을 한다.", false, "▸ 외국판결은 우리나라에서는 기판력이 없으므로 일사부재리의 원칙이 적용될 수 없다. [83도2366]", "재판상소"],
["1073", "★ 「소년법」제32조의 보호처분의 심리가 결정된 사건은 확정판결에 준하는 효력이 인정되므로, 이와 동일한 사건에 관하여 다시 공소제기가 된 경우 「형사소송법」제326조 제1호에 의하여 면소판결을 선고하여야 한다.", true, "▸ 소년법 제53조에 의하면 같은 법 제32조의 보호처분의 심리가 결정된 사건은 공소를 제기하거나 소년부에 송치할 수 없다고 하여 확정판결에 준하는 효력을 인정하고 있으므로, 동일한 사건에 관하여 다시 공소제기가 된 경우 제326조 제1호에 의하여 면소판결을 선고하여야 한다.", "재판상소"],
["1074", "★ 「가정폭력범죄의 처벌 등에 관한 특례법」에 따른 보호처분의 결정이 확정되고 그 결정을 이행하거나 집행에 따름으로써 그 보호처분이 취소되지 않은 사건과 동일한 사건에 대하여 다시 공소제기가 된 경우 「형사소송법」제327조 제2호에 의하여 공소기각판결을 선고하여야 한다.", true, "▸ 가정폭력행위자에 대한 보호처분은 면소사유가 아니라 공소기각 판결(제327조 제2호) 사유에 해당한다. [2016도5423]", "재판상소"],
["1075", "★ 경찰서장이 범칙행위에 대하여 통고처분을 한 이상, 통고처분에서 정한 범칙금 납부기간까지는 원칙적으로 경찰서장은 즉결심판을 청구할 수 없고, 검사도 동일한 범칙행위에 대하여 공소를 제기할 수 없다.", true, "▸ 경찰서장이 통고처분을 한 이상, 범칙자의 절차적 지위를 보장하기 위하여 통고처분에서 정한 범칙금 납부기간까지는 원칙적으로 경찰서장은 즉결심판을 청구할 수 없고, 검사도 동일한 범칙행위에 대하여 공소를 제기할 수 없다. [2020도15194]", "재판상소"],
["1076", "★ 일사부재리의 효력이 미치는 객관적 범위는 공소사실과 단일하고 동일한 관계에 있는 모든 사실에 미치므로, 그 물적 범위는 현실적 심판대상인 사실에 한정되지 아니한다.", true, "▸ 일사부재리의 효력이 미치는 객관적 범위는 공소사실과 동일성이 있는 잠재적 심판대상에도 미치므로, 현실적 심판대상인 사실에 한정되지 아니한다.", "재판상소"],
["1077", "★ 한 개의 행위가 여러 개의 죄에 해당하는 상상적 경합 관계에 있는 경우에는 그 중 일죄에 대한 확정판결의 기판력은 다른 죄에 미치지 않는다.", false, "▸ 상상적 경합 관계의 경우에는 그 중 1죄에 대한 확정판결의 기판력은 다른 죄에 대하여도 미친다. [2017도11687]", "재판상소"],
["1078", "★ 동일 죄명에 해당하는 여러 개의 행위를 단일하고 계속된 범의 아래 일정 기간 계속하여 행하고 그 피해법익도 동일하여 포괄일죄의 관계에 있는 범행의 일부에 관하여 약식명령이 확정된 경우, 그 약식명령의 발령 시를 기준으로 하여 그 전의 포괄일죄의 일부에 해당하는 범행뿐만 아니라 그와 상상적 경합관계에 있는 다른 죄에도 약식명령의 기판력이 미친다.", true, "▸ 포괄일죄의 일부에 약식명령이 확정된 경우 약식명령의 발령 시를 기준으로 그 전의 범행뿐만 아니라 그와 상상적 경합관계에 있는 다른 죄에도 기판력이 미친다. [2020도3705]", "재판상소"],
["1079", "★ 과실로 교통사고를 발생시켰다는 「교통사고처리특례법」위반의 공소사실과 고의로 교통사고를 낸 뒤 보험금을 청구하여 수령하거나 미수에 그쳤다는 사기 및 사기미수의 공소사실은 동일성이 인정되지 않기 때문에, 전자에 관한 확정판결의 기판력이 후자에 미치지 않는다.", true, "▸ 교특법 위반(과실)과 사기(고의)는 공소사실의 동일성이 인정되지 않으므로, 전자에 관한 확정판결의 기판력이 후자에 미치지 않는다. [2009도14263]", "재판상소"],
["1080", "★ 판결의 확정력은 사실심리의 가능성이 있는 최후의 시점인 판결선고시를 기준으로 하여 그때까지 행하여진 행위에 대하여만 미친다.", true, "▸ 판결의 확정력은 사실심리의 가능성이 있는 최후의 시점인 판결선고시를 기준으로 하여 그때까지 행하여진 행위에 대하여만 미친다.", "재판상소"],
["1081", "★ 제1심 판결에 대하여 항소가 제기된 경우 판결의 확정력이 미치는 시간적 한계는 항소심 판결선고시라고 보는 것이 상당하고, 항소이유서를 제출하지 아니하여 결정으로 항소기각이 되는 경우에는 항소기각결정시가 그 기준 시점이 된다.", true, "▸ [AI해설] 항소심 판결선고시가 기판력의 시적 기준이며, 항소이유서 미제출로 결정으로 항소기각이 되는 경우에는 항소기각결정시가 기준이 된다. [93도836]", "재판상소"],
["1082", "★ 약식명령의 기판력의 시적 범위는 약식명령 송달시를 기준으로 한다.", false, "▸ 약식명령의 기판력의 시적 범위는 약식명령 '발령시'를 기준으로 한다. [2020도3705]", "재판상소"],
["1083", "★ 甲이 동일 습벽에 의한 상습도박죄로 2023. 12. 29. 벌금 500만 원의 약식명령을 발령받아 甲에게 2024. 1. 15. 위 약식명령이 송달되고 2024. 1. 23. 확정된 경우, 위 확정된 약식명령의 기판력이 2024. 1. 2.경의 도박 범행에 미친다.", false, "▸ 약식명령 발령일(2023. 12. 29.) 이후의 범죄이므로 기판력이 미치지 않는다. [2020도3705]", "재판상소"],
["1084", "★ 乙이 2023. 1. 1.부터 2023. 6. 30.까지 신고 없이 분식점을 운영하였다는 취지의 식품위생법위반죄로 벌금 100만 원의 약식명령이 2023. 8. 16. 발령되고 2023. 10. 1. 확정되었다. 乙은 2023. 9. 1.부터 2023. 9. 30.까지 같은 장소에서 신고 없이 동일한 분식점을 운영하였다는 취지의 식품위생법위반죄로 공소가 제기되었다면, 「형사소송법」제326조에 따라 면소판결이 선고되어야 한다.", false, "▸ 약식명령 발령일(2023. 8. 16.) 후의 범죄이므로 기판력이 미치지 않는다. 따라서 면소판결이 아니라 실체 심리를 해야 한다. [2020도3705]", "재판상소"],
["1085", "★ 상습범의 일부에 대하여 유죄판결이 확정된 경우 기판력이 그 사실심판결 선고 전에 저질러진 나머지 범죄에 미치기 위해서는 그 확정판결에서 당해 피고인이 상습범으로 기소되어 처단되었을 것이 필요하고, 상습범이 아닌 기본 구성요건의 범죄로 처단되는 데 그친 경우에는 기판력이 미치지 아니한다.", true, "▸ 이러한 법리가 적용되기 위해서는 전의 확정판결에서 당해 피고인이 상습범으로 기소되어 처단되었을 것을 필요로 하고, 상습범이 아닌 기본 구성요건의 범죄로 처단되는 데 그친 경우에는 기판력이 미치지 않는다. [2001도3206 전합]", "재판상소"],
["1086", "★ 甲은 2023. 4. 10. 상습절도죄로 벌금 500만 원을 선고받아 2023. 4. 18. 그 판결이 확정되었다. 甲이 2023. 11. 10. 다시 기소된 경우, 위 범죄사실과 사이에 동일한 습벽에 의하여 범행을 저질렀다는 점이 인정된다면, 「형사소송법」제326조 제1호의 면소판결이 선고되어야 한다.", true, "▸ 확정판결에서 상습범으로 기소되어 처단된 경우이므로, 동일한 습벽에 의한 사실심판결 선고 전의 나머지 범행에는 기판력이 미쳐 면소판결을 선고하여야 한다. [2001도3206 전합]", "재판상소"],
["1087", "★ 甲은 2023. 5. 10. 절도죄(단순)로 징역 6월을 선고받아 2023. 5. 18. 그 판결이 확정되었다. 甲이 2023. 11. 10. 상습절도죄로 기소된 경우, 위 범죄사실과 사이에 동일한 습벽에 의하여 범행을 저질렀다는 점이 인정되더라도, 「형사소송법」제326조 제1호의 면소판결을 선고할 수 없다.", true, "▸ 확정판결에서 상습범이 아닌 기본 구성요건의 범죄(단순절도)로 처단된 경우에는 기판력이 미치지 않는다. [2001도3206 전합]", "재판상소"],
["1088", "★ 검사가 포괄일죄인 상습사기죄로 기소한 사안에서 검사는 위 공소사실들 중 일부만을 철회하는 내용의 공소장변경신청을 할 수 없고, 이 경우 공소사실 전체에 대한 공소취소로 보아야 한다.", false, "▸ 포괄일죄의 공소사실 중 일부를 소추대상에서 철회하는 방법으로는 공소취소가 아닌 공소장변경의 방식에 의할 수 있다. [99도2744]", "재판상소"],
["1089", "★ 검사가 약식명령 발령일 이후의 범죄사실로 범행일자를 변경하는 공소장변경허가신청을 한 경우, 약식명령 발령일 이후의 범죄이므로 공소제기된 범죄사실과 실체적 경합범의 관계에 있는 별개의 범죄가 되어 법원은 공소장변경을 허가할 수 없다.", true, "▸ 포괄일죄 관계인 범행의 일부에 대한 약식명령이 확정된 경우, 약식명령 발령일 이후의 범죄사실은 공소제기된 범죄사실과 실체적 경합범의 관계에 있는 별개의 범죄가 되므로 법원은 공소장변경을 허가할 수 없다. [2016도21342]", "재판상소"],
["1090", "★ 약식명령이나 즉결심판에 대한 정식재판의 청구는 상소에 해당하지 않는다.", true, "▸ 약식명령이나 즉결심판에 대한 정식재판의 청구는 심급을 달리하는 것이 아니므로 상소에 해당하지 않는다.", "재판상소"],
["1091", "★ 제1심 법원에서 피고인에게 살인죄의 유죄를 인정하였다. 피고인이 항소하려는 경우 항소장을 제1심 법원에 제출하여야 한다.", true, "▸ 항소를 함에는 항소장을 원심법원에 제출하여야 한다(제359조).", "재판상소"],
["1092", "★ 피고인이 2023. 8. 8. 수요일에 징역 3년, 집행유예 5년을 선고받았다면, 피고인은 8월 15일은 공휴일이므로 공휴일이 아닌 8월 16일까지 원심법원에 항소장을 제출하면 된다.", true, "▸ 초일을 산입하지 않고 선고일부터 7일 이내인 2023. 8. 15.까지 항소장을 제출해야 하지만, 기간의 말일이 공휴일이므로 그 다음날인 2023. 8. 16.까지 제출하면 된다(제343조 제2항, 제358조).", "재판상소"],
["1093", "★ 상소의 제기로 피고사건에 대한 소송계속이 원심법원에서 상소법원으로 넘어가는 이심의 효력이 발생하는 시기는 상소를 제기한 때이다.", true, "▸ 항소법원의 소송계속은 제1심판결에 대한 '항소에 의하여 사건이 이심된 때'로부터 그 법원의 판결에 대하여 '상고가 제기되거나 그 판결이 확정되는 때'까지 유지된다(85모12, 상소제기기준설).", "재판상소"],
["1094", "★ 변호인은 피고인의 상소권이 소멸된 후에는 상소를 제기할 수 없다.", true, "▸ 변호인에게 고유의 상소권을 인정한 것이 아니고 피고인의 상소권을 대리하여 행사하게 한 것에 불과하므로, 변호인은 피고인의 상소권이 소멸된 후에는 상소를 제기할 수 없다. [98도253]", "재판상소"],
["1095", "★ 항소심 선고 후 피고인이 상고포기를 하기 위해서는 이를 서면으로 하여야 하지만, 공판정에서는 구술로써 할 수 있다.", true, "▸ 상소의 포기 또는 취하는 서면으로 하여야 한다. 단, 공판정에서는 구술로써 할 수 있다(제352조 제1항).", "재판상소"],
["1096", "★ 상소의 포기는 원심법원에 하고 상소의 취하는 상소법원에 하여야 하지만, 소송기록이 상소법원에 송부되지 아니한 때에는 상소의 취하도 원심법원에 할 수 있다.", true, "▸ 제353조에 따라 상소의 포기는 원심법원에, 상소의 취하는 상소법원에 하지만, 소송기록이 아직 상소법원에 송부되지 않은 경우 취하도 원심법원에 할 수 있다.", "재판상소"],
["1097", "★ 사형이나 무기징역이 선고된 판결에 대하여 피고인 또는 상소권의 대리행사자는 상소의 포기를 할 수 없다.", true, "▸ 피고인 또는 제341조에 규정한 자는 사형 또는 무기징역이나 무기금고가 선고된 판결에 대하여는 상소의 포기를 할 수 없다(제349조).", "재판상소"],
["1098", "★ 변호인은 피고인의 동의를 얻어 상소를 취하할 수 있으므로 변호인의 상소 취하에 피고인의 동의가 없다면 상소 취하의 효력은 발생하지 아니한다.", true, "▸ 변호인은 피고인의 동의를 얻어 상소를 취하할 수 있으므로(제351조, 제341조), 변호인의 상소취하에 피고인의 동의가 없다면 상소취하의 효력은 발생하지 아니한다. [2015도7821]", "재판상소"],
["1099", "★ 변호인이 상소취하를 할 때 원칙적으로 피고인은 이에 동의하는 취지의 서면을 제출하여야 하나 공판정에서 구술로써 동의를 할 수 있고, 변호인의 항소취하 진술에 대하여 피고인이 아무런 의견도 진술하지 아니하더라도 변호인의 항소취하는 유효하다.", false, "▸ 상소취하에 대한 피고인의 구술동의는 '명시적'으로 이루어져야만 한다. 피고인이 아무런 의견도 진술하지 않으면 명시적 동의가 없으므로 변호인의 항소취하는 유효하지 않다. [2015도7821]", "재판상소"],
["1100", "★ 미성년자인 피고인이 법정대리인의 동의를 얻지 않고 한 상소의 포기 또는 취하는 효력이 없다.", true, "▸ 법정대리인이 있는 피고인이 상소의 포기 또는 취하를 함에는 법정대리인의 동의를 얻어야 한다. 단, 법정대리인의 사망 기타 사유로 인하여 그 동의를 얻을 수 없는 때에는 예외로 한다(제350조).", "재판상소"],
["1101", "★ 미성년자인 피고인이 항소취하서를 제출하였고 법정대리인인 어머니도 항소취하에 동의하는 취지의 서면을 제출하였으나 법정대리인인 아버지의 동의가 없었던 경우, 피고인의 항소취하는 효력이 없다.", true, "▸ 법정대리인인 피고인 아버지의 동의가 없었으므로 항소취하는 효력이 없다. [2019도4221]", "재판상소"],
["1102", "★ 상소권을 포기한 후 상소제기기간이 도과한 다음에 상소포기의 효력을 다투는 한편, 자기 또는 대리인이 책임질 수 없는 사유로 인하여 상소제기기간 내에 상소를 하지 못하였다고 주장하는 사람은 상소권회복청구가 인용된 다음에야 상소를 제기할 수 있다.", false, "▸ 상소를 제기함과 '동시에' 상소권회복청구를 할 수 있다. [2003모451]", "재판상소"],
["1103", "★ 피고인이 소재변경사실을 법원에 신고하지 아니한 상황에서 잘못된 공시송달에 터잡아 피고인의 진술 없이 공판이 진행되고 피고인이 출석하지 않은 기일에 판결이 선고된 경우에는, 피고인은 자기 또는 대리인이 책임질 수 없는 사유로 상소 제기기간 내에 상소를 하지 못한 것으로 봄이 타당하다.", true, "▸ 허용되지 않는 잘못된 공시송달에 터 잡아 판결이 선고된 경우, 피고인이 소재변경 신고를 하지 않았더라도 피고인은 자기 또는 대리인이 책임질 수 없는 사유로 상소 제기기간 내에 상소를 하지 못한 것으로 봄이 타당하다. [2022모439]", "재판상소"],
["1104", "★ 피고인을 대리하여 법원결정 정본을 수령한 교도소장이 1주일이 지난 뒤에 그 사실을 피고인에게 알림으로써 피고인이 소정기간 내에 항고장을 제출할 수 없었던 경우는 피고인이 상소권을 회복할 수 있는 사유에 해당한다.", true, "▸ 교도소장이 정본 수령 후 1주일 뒤에야 피고인에게 알린 경우는 상소권 회복 사유에 해당한다. [91모32]", "재판상소"],
["1105", "★ 피고인이 판결 선고 당시 법정이 소란하여 판결의 내용을 잘못 알아들었기 때문에 상소하지 못한 경우는 피고인이 상소권을 회복할 수 있는 사유에 해당한다.", false, "▸ 법정이 소란하여 판결 주문을 알아들을 수 없어서 항소제기 기간 내 항소를 하지 못한 것이라면, 그 사유만으로는 제345조의 자기 또는 대리인이 책임질 수 없는 사유에 해당한다고 볼 수 없다. [87모19]", "재판상소"],
["1106", "★ 피고인이 단순히 질병으로 입원하거나 기거불능하였기 때문에 상소제기기간 내에 상소를 하지 못한 경우는 피고인이 상소권을 회복할 수 있는 사유에 해당한다.", false, "▸ 상소권자 또는 대리인이 단순히 질병으로 입원하거나 기거불능하였기 때문에 상소제기기간 내에 상소하지 못하였다는 것은 상소권회복 사유에 해당하지 아니한다. [86모46]", "재판상소"],
["1107", "★ 제1심판결에 대하여 검사의 항소에 의한 항소심판결이 선고된 후 제1심판결에 대한 피고인의 항소권 회복청구는 적법하지 않다.", true, "▸ [AI해설] 제1심판결에 대하여 검사의 항소에 의한 항소심판결이 선고된 후에는 제1심판결에 대한 피고인의 항소권 회복청구는 적법하지 않다. [2023모350]", "재판상소"],
["1108", "★ 상소권회복의 청구가 있으면 법원은 청구의 허부에 관한 결정을 할 때까지 재판의 집행을 정지하는 결정을 할 수 있다.", true, "▸ 제348조 제1항에 따라 상소권회복의 청구가 있으면 법원은 청구의 허부에 관한 결정을 할 때까지 재판의 집행을 정지하는 결정을 할 수 있다.", "재판상소"],
["1109", "★ 피고인의 상소는 불이익한 원재판을 시정하여 이익된 재판을 구하기 위한 것이어서 재판이 자기에게 불이익하지 않으면 이에 대한 상소권을 가질 수 없으므로, 피고인에게 가장 유리한 판결인 무죄판결에 대한 피고인의 상고는 부적법하다.", true, "▸ 피고인에게 가장 유리한 판결인 무죄판결에 대한 피고인의 상고는 부적법하다. [2020도11186]", "재판상소"],
["1110", "★ 형의 면제판결은 유죄판결의 일종이므로 피고인에게 불이익한 재판에 해당하고 이에 대하여 피고인이 무죄를 주장하여 상소할 수 있다.", true, "▸ 형의 면제판결은 유죄판결의 일종이므로 피고인에게 불이익한 재판에 해당하고, 이에 대하여 피고인이 무죄를 주장하여 상소할 수 있다.", "재판상소"],
["1111", "★ 피고인이 누범에 해당하는 전과가 있음에도 불구하고 누범가중을 하지 아니한 것은 위법하다고 주장하여 상소하는 경우, 구체적인 사안에 따라 피고인에게 상소이익이 인정될 수도 있다.", false, "▸ 피고인으로서 누범가중을 하지 않은 위법을 주장하는 것은 자기에게 불이익을 주장하는 것이 되므로 이는 적법한 상고이유가 될 수 없다. [94도1591]", "재판상소"],
["1112", "★ 공소기각의 판결이 선고된 피고인은 무죄판결의 확정으로 인한 기판력의 확보와 형사보상 등을 받을 수 있는 상소의 이익이 있으므로 무죄를 주장하여 상소할 수 있다.", false, "▸ 공소기각판결은 피고인이 유죄판결의 위협으로부터 벗어나는 것이므로 피고인에게 불이익한 판결이 아니어서 피고인은 상소권이 없다. [2007도6793]", "재판상소"],
["1113", "★ 피고인은 면소판결에 대하여 무죄의 실체판결을 구하는 상소를 할 수 없는 것이 원칙이다.", true, "▸ 피고인은 면소판결에 대하여 무죄판결인 실체판결이 선고되어야 한다고 주장하면서 상고할 수 없는 것이 원칙이다. [2010도5986 전합]", "재판상소"],
["1114", "★ 형벌에 관한 법령이 재심판결 당시 폐지되었다면 설사 그 폐지가 당초부터 헌법에 위배되어 효력이 없는 법령에 대한 것이었더라도 무죄판결을 구하는 취지로 면소판결에 대하여 상고하는 것은 허용되지 않는다.", false, "▸ 당초부터 헌법에 위배되어 효력이 없는 법령에 대한 폐지라면 제325조 전단의 무죄사유에 해당하는 것이어서 무죄판결을 선고하여야 하므로, 이러한 경우에는 면소판결에 대하여 상고가 가능하다. [2010도5986 전합]", "재판상소"],
["1115", "★ 제1심에 대하여 피고인은 항소하지 않고 검사만 항소하여 그 항소가 기각된 경우, 항소심 판결은 피고인에게 불이익한 판결이 아니므로 피고인은 그 판결에 대하여 상고할 수 없다.", true, "▸ 피고인은 항소하지 않고 검사만 항소하여 그 항소가 기각된 판결은 피고인에게 불이익한 판결이 아니므로 피고인은 그 판결에 대하여 상고할 수 없다. [89도2166]", "재판상소"],
["1116", "★ 검사는 공익의 대표자로서 법령의 정당한 적용을 청구할 임무가 있으므로 피고인에게 불이익한 상소 뿐 아니라 피고인의 이익을 위한 상소도 할 수 있다.", true, "▸ 검사는 공익의 대표자로서 피고인에게 불이익한 재판에 대하여 그것이 위법일 때에는 재판의 주문에 관하여 상소로써 불복할 수 있다. 또한 피고인에게 이익이 되는 상소도 할 수 있다.", "재판상소"],
["1117", "★ 검사는 공익의 대표자로서 반대당사자에게 불이익한 재판에 대하여도 그것이 위법일 때에는 위법을 시정하기 위하여 상소로써 불복할 수 있지만, 불복은 재판의 주문에 관한 것이어야 하고 재판의 이유만을 다투기 위하여 상소하는 것은 허용되지 않는다.", true, "▸ 검사는 이유만을 다투기 위하여 상소하는 것은 허용되지 않는다. [2022도3784]", "재판상소"],
["1118", "★ 항소장에 경합범으로서 2개의 형이 선고된 죄 중 일죄에 대한 형만을 기재하였다면, 항소이유서에서 그 나머지 일죄에 대하여 항소이유를 개진한 경우라고 하더라도 항소의 범위는 항소장에 기재된 범위로 한정된다.", false, "▸ 항소이유서에서 나머지 일죄에 대하여도 항소이유를 개진한 경우에는 판결 전부에 대한 항소로 봄이 상당하다(전부상소 원칙). [2004도3515]", "재판상소"],
["1119", "★ 경합범 중 일부는 유죄가 선고되고 일부는 무죄가 선고된 경우, 검사만 항소하면서 무죄부분에 관하여는 항소이유를 기재하고 유죄부분에 관하여는 항소이유를 기재하지 않은 때에는 항소범위를 '전부'로 표시하더라도 일부상소라고 본다.", false, "▸ 이러한 경우 제1심판결 전부가 이심되어 심판대상이 된다. [2014도342]", "재판상소"],
["1120", "★ 형법 제37조 전단 경합범 관계에 있는 공소사실 중 일부에 대하여 유죄, 나머지 부분에 대하여 무죄를 선고한 판결에 대하여 검사만이 항소하면서 항소장의 항소범위란에 '재판의 일부에 대하여만 항소한다'는 기재가 없는 경우에는 판결전부에 대하여 항소한 것으로 보아야 한다.", true, "▸ [AI해설] 항소범위에 관한 기재가 없는 경우에는 판결전부에 대하여 항소한 것으로 보아야 한다. [91도1937]", "재판상소"],
["1121", "★ 공범인 공동피고인의 일부가 재판의 전부에 대하여 상소하는 경우는 일부상소에 해당하지 않는다.", true, "▸ 일부상소는 재판의 '객관적 범위'의 일부에 대한 것이다. 어떤 피고인이 재판의 전부에 대해 상소한다면 전부상소에 해당한다.", "재판상소"],
["1122", "★ 경합범 전부에 대하여 무죄가 선고되거나 하나의 형이 선고된 경우에도 경합범 중 일부만을 특정하여 상소하였다면 그 부분만이 상소심의 심판대상이 된다.", false, "▸ 경합범 전부에 대하여 유죄로 하나의 형이 선고된 경우 상소불가분 원칙이 적용되어 전부가 심판대상이 된다.", "재판상소"],
["1123", "★ 확정판결 전의 공소사실과 확정판결 후의 공소사실에 대하여 따로 유죄를 선고하여 두 개의 형을 정한 제1심판결에 대하여 피고인만이 확정판결 전의 유죄판결 부분에 대하여 항소한 경우, 피고인과 검사가 항소하지 아니한 확정판결 후의 유죄판결 부분은 항소기간이 지남으로써 확정되어 항소심이 심리·판단하여야 할 범위는 확정판결 전의 유죄판결 부분에 한정된다.", true, "▸ 확정판결 후의 유죄판결 부분은 피고인과 검사 모두 항소하지 않아 항소기간이 지남으로써 확정되고, 항소심의 심리 범위는 확정판결 전의 유죄판결 부분에 한정된다. [2016도18553]", "재판상소"],
["1124", "★ 경합범 중 일부에 대하여 무죄, 일부에 대하여 유죄를 선고한 항소심판결에 대하여 검사만이 무죄 부분에 대하여 상고를 제기한 경우, 상고심에서 이를 파기할 때에는 무죄 부분만을 파기하여야 한다.", true, "▸ 피고인과 검사가 상고하지 아니한 유죄판결 부분은 상고기간이 지남으로써 확정되어 상고심에 계속된 사건은 무죄판결 부분뿐이므로, 상고심에서 이를 파기할 때에는 무죄 부분만을 파기할 수밖에 없다. [91도1402]", "재판상소"],
["1125", "★ 대법원이 무죄판결의 죄에 대해서만 파기하고 원심법원에 환송한 경우에 환송 후의 원심법원은 무죄 부분에 대해서만 심리하여야 한다.", true, "▸ 상고심이 무죄부분만 파기하였으므로 환송 후의 원심법원도 무죄 부분에 대해서만 심리하여야 한다. [91도1402]", "재판상소"],
["1126", "★ 甲이 경합범으로 기소되어 乙죄에 대하여는 무죄, 丙죄에 대하여는 유죄로 징역 2년이 선고된 항소심판결에 대하여 검사가 상고하여 대법원이 乙죄도 유죄라고 인정한다면, 乙·丙죄에는 1개의 형이 선고되어야 하므로 대법원은 乙·丙죄 전부에 대하여 파기 환송하여야 한다.", true, "▸ 경합범 관계에 있어 하나의 형이 선고되어야 하는 경우 일부를 파기할 때 나머지 부분도 함께 파기될 수밖에 없다. [91도1402]", "재판상소"],
["1127", "★ 위 사례에서 환송받은 법원은 乙죄 부분을 유죄로 판단하더라도 불이익변경금지원칙에 따라 형을 선고하지 않는다는 주문을 선고하여야 한다.", true, "▸ 피고인만이 항소하여 불이익변경금지원칙이 적용되는 이상, 환송 후 원심은 乙죄를 유죄로 판단하더라도 이미 확정된 丙죄에 대한 형보다 무거운 형을 선고할 수 없으므로, 형을 선고하지 아니한다는 주문을 선고하여야 한다. [91도1402]", "재판상소"],
["1128", "★ 유죄부분에 대하여는 피고인이 상고하고 무죄부분에 대하여는 검사가 상고한 경우 항소심판결 전부의 확정이 차단되어 상고심에 이심된다. 따라서 유죄부분에 대한 피고인의 상고가 이유 없더라도 무죄부분에 대한 검사의 상고가 이유 있는 때에는 항소심이 유죄로 인정한 죄와 무죄로 인정한 죄가 형법 제37조 전단의 경합범 관계에 있다면 항소심판결의 유죄부분도 무죄부분과 함께 파기되어야 한다.", true, "▸ 유죄부분과 무죄부분이 제37조 전단의 경합범 관계에 있는 경우, 무죄부분에 대한 검사 상고가 이유 있을 때 유죄부분도 함께 파기되어야 한다. [2000도2123]", "재판상소"],
["1129", "★ 실체적 경합관계에 있는 횡령 및 도박의 점에 대하여 항소심이 모두 유죄를 인정하여 하나의 형을 선고하였는데, 甲의 상고로 계속된 상고심에서 원심판결 중 횡령죄 부분을 파기하는 경우에 이와 경합범 관계에 있어 하나의 형이 선고된 도박죄 부분도 함께 파기의 대상이 된다.", true, "▸ 경합범 관계에 있어 하나의 형이 선고된 경우 그 일부를 파기하면 나머지 부분도 함께 파기될 수밖에 없다. [2017도21716]", "재판상소"],
["1130", "★ 포괄일죄의 일부만이 유죄로 인정된 경우 그 유죄 부분에 대하여 피고인만이 항소하였을 뿐이라면, 유죄 이외의 부분도 항소심에 이심되기는 하나 그 부분은 항소심의 심판대상이 되지 않는다.", true, "▸ 포괄일죄 중 일부만 유죄로 선고되고 피고인만 유죄부분에 대하여 항소한 경우, 무죄부분도 상소불가분의 원칙으로 항소심에 이심되기는 하나 그 부분은 심판대상이 되지 않는다. [90도2820]", "재판상소"],
["1131", "★ 상상적 경합관계에 있는 죄들 중 일부에 대해 무죄가 선고되어 검사만 무죄부분만 상고한 경우, 무죄부분의 유무죄 여하에 따라 처단할 죄목과 양형이 다르므로 상고심은 유죄부분도 함께 심판대상으로 하여야 한다.", true, "▸ 상상적 경합관계에 있는 공소사실 중 일부 유죄, 나머지 무죄의 판결에 대하여 검사만이 무죄부분에 대한 상소를 하고 피고인은 상소하지 아니하더라도 상소불가분의 원칙상 유죄부분도 상소심에 이전되어 심판대상이 된다. [86도1629, 2004도7488]", "재판상소"],
["1132", "★ 검사가 피고인에 대하여 甲·乙에 대한 각각의 사기죄로 공소제기하여 제1심 법원은 이를 모두 유죄로 인정하였는데 피고인만이 항소하였다. 甲·乙에 대한 각각의 사기죄가 포괄일죄의 관계에 있는 경우, 항소심에서 일부에 대해 무죄가 선고되어 검사만 무죄 부분에 대하여 상고하였다면 유죄부분도 함께 상고심에 이심되어 상고심의 심판대상이 된다.", true, "▸ 포괄일죄(상상적 경합)의 관계에 있는 공소사실 중 일부 유죄, 나머지 무죄의 판결에 대하여 검사만이 무죄부분에 대한 상소를 한 경우에도 상소불가분의 원칙상 유죄부분도 상소심에 이전되어 그 심판대상이 된다. [86도1629, 2004도7488]", "재판상소"],
["1133", "★ 상상적 경합관계에 있는 수죄에 대해 모두 무죄가 선고되었고, 검사가 전부에 대하여 상고하였으나 그중 일부에 대하여는 상고이유로 삼지 않았다고 하더라도 상고심은 그 무죄부분까지 나아가 판단하여야 한다.", false, "▸ 상고이유로 삼지 아니한 무죄 부분은 이미 당사자 간의 공격방어의 대상으로부터 벗어나 사실상 심판대상에서 이탈하게 되므로, 상고심으로서도 그 무죄 부분에까지 나아가 판단할 수 없다. [2008도8922]", "재판상소"],
["1134", "★ 항소심이 사실 1과 사실 2에 대하여 경합범으로 판단하여 사실 1에 대하여는 무죄를, 사실 2에 대하여는 유죄를 선고하였는데, 검사만이 사실 1에 대하여만 상고한 경우, 대법원이 두 사실을 상상적 경합으로 판단하더라도 사실 2에 대해서는 심판할 수 없다.", false, "▸ 원심이 두 개의 죄를 경합범으로 보고 한 죄는 유죄, 다른 한 죄는 무죄를 각 선고하자 검사가 무죄부분만에 대하여 불복상고 하였다고 하더라도 위 두 죄가 상상적 경합관계에 있다면 유죄부분도 상고심의 심판대상이 된다. [80도384]", "재판상소"],
["1135", "★ 항소심이 사실 적시에 의한 명예훼손 부분만을 유죄로 인정하고 나머지 허위사실 적시에 의한 명예훼손 부분을 무죄로 인정한 후, 피고인만이 유죄 부분에 대하여 상고하더라도 위 무죄 부분도 상고심의 심판대상이 된다.", false, "▸ 피고인만이 유죄 부분에 대하여 항소하고 검사는 무죄 부분에 대하여 항소하지 아니하였다면, 비록 죄 전부가 항소심에 이심되었다고 하더라도, 무죄 부분은 심판대상이 되지 않는다. [2008도4740]", "재판상소"],
["1136", "★ 검사는 甲을 특정경제범죄가중처벌등에관한법률위반(알선수재)죄로 기소하였고 제1심 법원은 甲의 유죄를 인정하고 징역 및 추징을 선고하였다. 甲이 추징에 관한 부분만을 불복대상으로 삼아 항소를 제기하였더라도 항소심의 심리 범위는 본안에 관한 판단부분에까지 미친다.", true, "▸ 피고사건의 주문과 몰수·추징에 관한 주문은 상소불가분의 원칙이 적용되므로, 몰수·추징에 관한 부분만을 불복대상으로 삼아 상소가 제기되었다 하더라도 그 전부가 상소심으로 이심된다. [2008도5596]", "재판상소"],
["1137", "★ 위치추적 전자장치의 부착명령은 법원이 형의 집행을 유예하면서 보호관찰부 집행유예와 서로 불가분의 관계에 있으므로 독립하여 상소의 대상이 될 수 없다.", true, "▸ 위치추적 전자장치의 부착명령은 보호관찰부 집행유예와 서로 불가분의 관계에 있어 독립하여 상소의 대상이 될 수 없다. [2011도14257]", "재판상소"],
["1138", "★ 주위적·예비적 공소, 택일적 공소인 경우 일부에 대한 상소제기의 효력은 나머지 공소에 대하여도 미치는 것이고, 검사만 무죄 부분만 상소한 경우와 피고인만 유죄부분만 항소한 경우 모두 전부가 이심되고 전부가 심판대상이 된다.", true, "▸ 주위적·예비적 공소 또는 택일적 공소의 경우 일부에 대한 상소제기의 효력은 나머지 공소에 대하여도 미치고, 어느 경우든 전부가 이심되고 전부가 심판대상이 된다. [2006도1146]", "재판상소"],
["1139", "★ 상고심이 예비적 공소사실에 대한 원심판결이 잘못되었다는 이유로 원심판결을 전부 파기환송하였다면, 환송 후 원심에서 주위적 공소사실 부분도 심리·판단하여야 한다.", true, "▸ 상고심이 예비적 공소사실에 대한 원심판결이 잘못되었다는 이유로 전부 파기환송하면, 환송 후 원심은 주위적 공소사실과 동일체 관계에 있는 예비적 공소사실 부분도 심리·판단하여야 한다. [2023도10718]", "재판상소"],
["1140", "★ 불이익변경금지의 원칙은 피고인이 상소한 사건뿐만 아니라 검사가 피고인을 위하여 상소한 사건에도 적용된다.", true, "▸ 피고인이 항소한 사건과 피고인을 위하여 항소한 사건에 대해서는 원심판결의 형보다 무거운 형을 선고할 수 없다(제368조, 제396조 제2항).", "재판상소"],
["1141", "★ 검사의 항소가 특히 피고인의 이익을 위한 취지라고 볼 수 없다면 항소심에서 중한 형을 선고할 수 있다.", true, "▸ 검사의 항소가 피고인의 이익을 위한 취지라고 볼 수 없다면 불이익변경금지원칙이 적용되지 않으므로 항소심에서 중한 형을 선고할 수 있다. [71도74]", "재판상소"],
["1142", "★ 경합범에 대하여 일부 유죄, 일부 무죄를 선고한 제1심판결에 대하여 피고인과 검사가 항소한 결과 검사의 항소가 받아들여져 제1심판결 전부가 파기됨으로써 양형 전체를 다시 정해야 하는 경우, 불이익변경금지의 원칙이 적용되지 않는다.", true, "▸ 검사의 항소가 받아들여져 제1심판결 전부가 파기됨으로써 양형 전체를 다시 정해야 하는 경우에는 불이익변경금지의 원칙이 적용되지 않는다. [2005도7473]", "재판상소"],
["1143", "★ 검사와 피고인이 모두 항소한 사건에서 검사의 항소가 기각된 경우에도 불이익변경금지의 원칙이 적용된다.", true, "▸ 피고인과 검사 쌍방이 항소하였으나 검사의 항소가 결정으로 기각되는 경우에는 실질적으로 피고인만이 항소한 경우와 같게 되므로 항소심은 불이익변경금지의 원칙에 따라 제1심판결의 형보다 중한 형을 선고하지 못한다. [98도2111]", "재판상소"],
["1144", "★ 피고인만의 상고에 의하여 원심판결을 파기하고 사건을 항소심에 환송한 경우, 환송 전 원심판결과의 관계에서도 불이익변경금지의 원칙이 적용된다.", true, "▸ 피고인만의 상고에 의한 상고심에서 원심판결을 파기하고 사건을 항소심에 환송한 경우 불이익변경금지 원칙은 환송 전 원심판결과의 관계에서도 적용된다. [2021도1282]", "재판상소"],
["1145", "★ 제1심 유죄판결에 대하여 검사의 항소가 없고 피고인만의 항소가 있는 제2심 유죄판결에 대하여 검사상고가 있는 경우에 상고심은 검사의 불복없는 제1심 판결의 형보다 중한 형을 과할 수 없다.", true, "▸ 제1심 판결에 대하여 검사의 불복이 없었으므로, 상고심은 제1심 판결의 형보다 중한 형을 과할 수 없다. [4290형비상1]", "재판상소"],
["1146", "★ 피고인만이 항소한 항소심에서 공소장변경에 의하여 공소사실이 추가·철회·변경된 경우에도 형의 불이익변경은 허용되지 않는다.", true, "▸ 피고인만이 항소한 항소심에서 공소장변경에 의하여 공소사실이 추가·철회·변경된 경우에도 형의 불이익변경은 허용되지 않는다. [2021도1140]", "재판상소"],
["1147", "★ 제1심에서 별개의 사건으로 징역 1년에 집행유예 2년과 추징금 1,000만 원의 선고 및 징역 1년 6월과 추징금 100만 원의 형을 선고받고 항소한 피고인에 대하여 항소심이 사건을 병합 심리한 후 경합범으로 처단하면서 제1심의 각 형량보다 중한 징역 2년과 추징금 1,100만 원을 선고한 것은 불이익변경에 해당되지 않는다.", true, "▸ 항소심이 제1심에서 별개의 사건으로 따로 두 개의 형을 선고받고 항소한 피고인에 대하여 사건을 병합 심리한 후 경합범으로 처단하면서 제1심의 각 형량보다 중한 형을 선고한 것은 불이익변경금지의 원칙에 어긋나지 아니한다. [2001도3448]", "재판상소"],
["1148", "★ 피고인만 항소한 사건에서 제1심 법원이 소송비용의 부담을 명하는 재판을 하지 않았음에도 항소심법원이 제1심의 소송비용에 관하여 피고인에게 부담하도록 재판을 한 경우, 불이익변경금지원칙에 위배된다.", false, "▸ 소송비용의 부담은 형이 아니고 실질적인 의미에서 형에 준하여 평가되어야 할 것도 아니므로 불이익변경금지원칙의 적용이 없다. [2001도872]", "재판상소"],
["1149", "★ 피고인이 약식명령에 불복하여 정식재판을 청구한 사건에서 그 죄명이나 적용법조가 약식명령에 비하여 불이익하게 변경되었다면, 선고한 형이 약식명령과 같은 경우에도 이는 불이익변경금지의 원칙에 위배된 조치이다.", false, "▸ 죄명이나 적용법조가 약식명령의 경우보다 불이익하게 변경되었다고 하더라도 선고한 형이 약식명령과 같거나 약식명령보다 가벼운 경우에는 불이익변경금지의 원칙에 위배된 조치라고 할 수 없다. [2011도14986, 현재 형종상향금지 원칙 적용]", "재판상소"],
["1150", "★ 피고인만 항소한 사건에서 항소심이 제1심보다 법정형이 가벼운 죄를 인정하면서 제1심과 동일한 형을 선고한 경우는 불이익변경금지의 원칙에 위배된다.", false, "▸ 공소장변경이 있어 항소심이 새로운 범죄사실을 유죄로 인정하면서 환송 전 원심에서 정한 선고형과 동일한 형을 선고하였다고 하여 불이익변경금지원칙에 위배된다고 할 수 없다. [2001도192]", "재판상소"],
["1151", "★ 제1심 판결에 대하여 피고인만 항소한 사건에서, 제1심과 항소심의 선고형이 동일한 경우, 제1심에서 일죄로 인정한 것을 항소심에서 검사의 공소장변경신청을 받아들여 경합범으로 선고하더라도 불이익변경금지원칙에 위배되지 아니한다.", true, "▸ [AI해설] 제1심과 항소심의 선고형이 동일한 경우, 일죄→경합범 변경 선고는 불이익변경금지원칙에 위배되지 않는다. [83도3211]", "재판상소"],
["1152", "★ 항소심이 실체적 경합관계에 있는 개별적 범행들을 상상적 경합관계로 보고 판단한 경우, 피고인만 상고를 제기했다고 하더라도 불이익변경금지원칙은 적용되지 않으므로 대법원은 항소심판결을 파기할 수 있다.", false, "▸ 이를 실체적 경합관계로 볼 경우 피고인의 죄수가 증가하여 오히려 불리한 결과가 초래되는데, 피고인만이 상고하여 불이익변경금지 원칙이 적용되는 이상 원심을 파기할 수는 없다. [2022도6993]", "재판상소"],
["1153", "★ 피고인만이 상소한 사건에서 상소심이 원심법원이 인정한 범죄사실의 일부를 무죄로 인정하면서도 피고인에 대하여 원심법원과 동일한 형을 선고하였더라도 불이익변경금지 원칙을 위반한 것은 아니다.", true, "▸ 피고인만이 상소한 사건에서 상소심이 범죄사실의 일부를 무죄로 인정하면서도 원심법원과 동일한 형을 선고하였다고 하여 불이익변경금지 원칙을 위반하였다고 볼 수 없다. [2021도1282]", "재판상소"],
["1154", "★ 불이익변경금지원칙의 적용에 있어 그 선고된 형이 피고인에게 불이익하게 변경되었는지 여부에 관한 판단은 형법상 형의 경중을 기준으로 하되 이를 개별적·형식적으로 고찰할 것이 아니라 주문 전체를 고려하여 피고인에게 실질적으로 불이익한지 아닌지를 보아 판단하여야 한다.", true, "▸ 불이익변경 여부는 개별적·형식적으로 고찰할 것이 아니라 주문 전체를 고려하여 피고인에게 실질적으로 불이익한지 아닌지를 보아 판단하여야 한다. [2005도5822]", "재판상소"],
["1155", "★ 제1심이 뇌물수수죄를 인정하여 피고인에게 징역 1년 6월에 집행유예 3년, 추징을 선고하였는데, 항소심이 제1심이 누락한 필요적 벌금형 병과규정을 적용하여 징역 1년 6월 및 추징을 선고한 데 더하여 벌금을 병과한 것은 불이익변경이다.", true, "▸ 노역장유치 가능성과 그 기간 등을 전체적·실질적으로 고찰할 때 원심이 선고한 형은 제1심이 선고한 형보다 무거워 피고인에게 불이익하다. [2012도7198]", "재판상소"],
["1156", "★ 제1심에서 징역 1년에 처하되 형의 집행을 면제한다는 판결을 선고한 데 대하여 피고인만이 항소한 경우, 항소심이 위 피고인에 대해 징역 8월에 집행유예 2년을 선고하였다면 이는 위법하다.", false, "▸ 형의 집행유예의 판결은 소정 기간이 특별한 사유없이 경과한 때에는 그 형의 선고의 효력이 상실되나, 형의 집행면제는 그 형의 집행만을 면제하는데 불과하여 전자가 후자보다 피고인에게 불이익하다고 할 수 없다. [84도2972]", "재판상소"],
["1157", "★ 甲이 제1심 법원에서 무고죄로 징역 1년 6월, 집행유예 3년의 판결을 선고받아 甲만이 항소한 경우, 항소심 법원이 징역 1년의 실형을 선고하였다면, 「형사소송법」제368조에 정해진 불이익변경금지원칙에 위배된다.", true, "▸ 제1심에서 징역형의 집행유예를 선고한 데 대하여 제2심이 그 징역형의 형기를 단축하여 실형을 선고하는 것도 불이익변경금지원칙에 위배된다. [2016도1131]", "재판상소"],
["1158", "★ 피고인에 대한 벌금형이 제1심보다 감경되었다 하여도 그 벌금형에 대한 노역장유치기간이 제1심보다 더 길어졌다면 전체적으로 보아 형이 불이익하게 변경되었다고 보아야 한다.", false, "▸ 피고인에 대한 벌금형이 제1심보다 감경되었다면 비록 그 벌금형에 대한 노역장유치기간이 제1심보다 더 길어졌다고 하더라도 전체적으로 보아 형이 불이익하게 변경되었다고 할 수는 없다. [2000도3945]", "재판상소"],
["1159", "★ 제1심 판결에 대하여 피고인만 항소한 사건에서, 항소심이 제1심과 동일한 벌금형을 선고하면서 성폭력 치료프로그램 이수명령을 병과한 것은 피고인에게 불이익하게 변경된 것이어서 허용되지 아니한다.", true, "▸ 성폭력 치료프로그램 이수명령은 보안처분이지만 실질적으로는 신체적 자유를 제한하므로, 동일한 벌금형에 이수명령을 추가한 것은 불이익변경금지원칙에 위배된다. [2016도15961]", "재판상소"],
["1160", "★ 제1심 판결에 대하여 피고인만 항소한 사건에서, 제1심에서는 청구되지 않았고 항소심에서 처음 청구된 검사의 전자장치부착명령 청구에 대하여 항소심에서 부착명령을 선고하는 것은 불이익변경금지원칙에 위배되지 아니한다.", true, "▸ 제1심에서는 청구되지 않았고 항소심에서 처음 청구된 검사의 전자장치부착명령 청구에 대하여 항소심에서 부착명령을 선고하는 것은 불이익변경금지원칙에 위배되지 않는다. [2010도9013]", "재판상소"],
["1161", "★ 항소심이 징역 장기 7년, 단기 5년 및 5년 동안의 위치추적 전자장치 부착명령을 선고한 제1심판결을 파기한 후 징역 장기 7년, 단기 5년의 부정기형만 선고하고 전자장치 부착명령 없이 선고한 것은 불이익변경금지원칙에 위배되지 않는다.", true, "▸ [AI해설] 부정기형은 유지하되 전자장치 부착명령을 제외하고 선고한 것은 불이익변경금지원칙에 위배되지 않는다. [2010도7955]", "재판상소"],
["1162", "★ 피고인만이 항소한 경우, 동일 물건에 대하여 제1심판결에서 선고된 추징을 몰수로 변경하는 것은 불이익변경금지원칙에 위반되지 않는다.", true, "▸ 추징과 몰수는 실질적으로 같은 내용의 형벌인데, 동일 물건에 대하여 추징을 몰수로 변경하는 것은 불이익변경금지 원칙에 위반되지 않는다. [2005도5822]", "재판상소"],
["1163", "★ 피고인만 항소한 사건에서, 제1심이 피고인에게 금고 5월의 실형을 선고하였는데, 항소심이 징역 5월, 집행유예 2년, 보호관찰 및 40시간의 수강명령을 선고하였다면 피고인에게 불이익하게 변경된 것이어서 허용되지 아니한다.", false, "▸ 형기의 변경 없이 금고형을 징역형으로 바꾸어 집행유예를 선고하더라도 불이익변경금지 원칙에 위배되지 않는다. 금고를 징역으로 변경하는 것, 실형을 집행유예로 변경하고 보호관찰 및 수강명령을 새로 부과하는 것 모두 불이익변경금지 원칙에 위반되지 않는다. [2013도6608]", "재판상소"],
["1164", "★ 「소년법」제60조(부정기형) 제2항이 적용되는 '소년'이란 심판시에 19세 미만인 사람을 뜻하며, 소년법의 적용을 받으려면 심판시, 즉 사실심판결 선고시에 19세 미만이어야 한다.", true, "▸ 소년법 제60조 제1항에 정한 '소년'은 소년법 제2조에 정한 19세 미만인 자를 의미하는 것으로 이에 해당하는지는 사실심판결 선고 시를 기준으로 판단하여야 하므로, 제1심에서 부정기형을 선고받은 피고인이 항소심 선고 이전에 19세에 도달하는 경우 정기형이 선고되어야 한다. [2020도4140]", "재판상소"],
["1165", "★ 항소심에서 부정기형을 선고받은 피고인이 상고 이후에 19세에 도달하였더라도 항소심의 부정기형 선고가 위법이 되는 것이 아니다.", true, "▸ 상고심에서의 심판대상은 원심판결 당시를 기준으로 하여 그 당부를 심사하는 것이므로, 항소심에서 부정기형을 선고받은 피고인이 상고 이후에 성년이 되었다고 하여 항소심의 부정기형 선고가 위법이 되는 것이 아니다. [97도3421]", "재판상소"],
["1166", "★ 파기환송을 받은 법원은 그 파기이유로 한 사실상 및 법률상의 판단에 기속되는 것이고 그에 따라 판단한 판결에 대하여 다시 상고를 한 경우에 그 상고사건을 재판하는 상고법원도 앞서의 파기이유로 한 판단에 기속되므로 이를 변경하지 못한다.", true, "▸ [AI해설] 파기환송받은 법원은 파기이유가 된 사실상 및 법률상 판단에 기속되고, 그에 따른 판결에 다시 상고가 있는 경우 상고법원도 앞서의 파기이유 판단에 기속된다. [2004도517]", "재판상소"],
["1167", "★ 대법원의 환송판결의 법률상 판단을 변경할 필요가 있다고 인정하는 경우에는 그에 기속되지 아니하고 전원합의체의 법령 해석 변경절차에 따라 이를 변경할 수 있다.", true, "▸ 대법원 전원합의체는 종전에 대법원에서 판시한 법령 등 해석 적용에 관한 의견을 변경할 수 있으므로 파기판결에 기속되지 않는다(법원조직법 제7조 제1항 제3호).", "재판상소"],
["1168", "★ 파기판결의 기속력은 사실관계와 적용법령이 동일함을 전제로 하기 때문에, 파기판결 이후 법령의 변경은 기속력의 배제사유가 된다.", true, "▸ 파기판결의 기속력은 사실관계와 적용법령이 동일함을 전제로 하기 때문에, 파기판결 이후 법령이 변경된 경우에는 파기판결의 기속력이 배제된다. 파기판결 이후 대법원 판례가 변경된 경우에도 기속력이 배제된다는 것이 일반적 견해이다.", "재판상소"],
["1169", "★ 대법원은 A죄가 유죄라고 판단하고, 원심판결을 파기하고 환송하였다. 환송받은 법원은 상고심 판단의 기초가 된 증거관계에 변동이 생기지 않는 한 A죄 부분을 유죄로 판단하여야 한다.", true, "▸ 상고심으로부터 사건을 환송받은 법원은 상고법원이 파기이유로 한 사실상 및 법률상의 판단에 대하여 환송 후의 심리과정에서 새로운 증거가 제시되어 기속적 판단의 기초가 된 증거관계에 변동이 생기지 않는 한 이에 기속된다. [2008도10572]", "재판상소"],
["1170", "★ 파기판결의 기속력은 파기의 직접적 이유가 된 적극적 긍정적 판단에도 발생한다.", false, "▸ 환송판결의 하급심에 대한 기속력은 파기의 이유가 된 원심판결의 사실상 판단이나 법률상 판단이 '위법하다'는 소극적인 면에서만 발생한다. [2017도14322]", "재판상소"],
["1171", "★ 몰수형 부분의 위법을 이유로 원심판결 전부가 파기환송된 후, 환송 후 원심이 주형을 변경한 조치는 환송판결의 기속력에 저촉된다고 볼 수 없다.", true, "▸ [AI해설] 몰수형 부분의 위법을 이유로 전부 파기환송된 후 환송 후 원심이 주형을 변경한 것은 환송판결의 기속력에 저촉되지 않는다. [2003도4781]", "재판상소"],
["1172", "★ 출판물에 의한 명예훼손의 공소사실을 유죄로 인정한 원심 판결이 상고심에서 공소사실이 인정되지 아니한다는 이유로 파기환송된 경우, 환송 후 원심에서 형법 제307조 제2항의 명예훼손죄의 공소사실로 변경되었다면 환송 후 원심은 더 이상 파기환송판결이 한 사실판단에 기속될 필요는 없다.", true, "▸ 파기환송판결의 사실판단의 기속력은 소극적인 부정 판단에만 미치는 것이므로, 환송 후 원심에서 공소사실이 변경되었다면 환송 후 원심은 이에 대하여 새롭게 사실인정을 할 재량권을 가지게 되어 더 이상 파기환송판결이 한 사실판단에 기속될 필요는 없다. [2004도340]", "재판상소"],
["1173", "★ 공판심리 도중에 판사의 경질이 있음에도 불구하고 공판절차를 갱신하지 않고 판결을 한 경우는 항소이유 중 '법률상 그 재판에 관여하지 못할 판사가 그 사건의 심판에 관여한 때'에 해당한다.", false, "▸ 이 경우는 형소법 제361조의5 제8호 '사건의 심리에 관여하지 아니한 판사가 그 사건의 판결에 관여한 때'(절대적 항소이유)에 해당한다.", "재판상소"],
["1174", "★ 양형부당은 원심판결의 선고형이 구체적인 사안의 내용에 비추어 너무 무겁거나 너무 가벼운 경우를 말하고, 양형은 법정형을 기초로 하여 형법 제51조에서 정한 양형의 조건이 되는 사항을 두루 참작하여 합리적이고 적정한 범위 내에서 이루어지는 재량 판단이다.", true, "▸ 양형부당은 원심판결의 선고형이 구체적인 사안의 내용에 비추어 너무 무겁거나 너무 가벼운 경우를 말하며, 양형은 법정형을 기초로 형법 제51조의 양형 조건을 두루 참작하여 합리적이고 적정한 범위 내에서 이루어지는 재량 판단이다. [2015도3260]", "재판상소"],
["1175", "★ 항소심은 제1심과 비교하여 양형의 조건에 변화가 없고 제1심의 양형이 재량의 합리적인 범위를 벗어나지 아니하는 경우에는 항소심 법원은 이를 존중함이 타당하다.", true, "▸ 공판중심주의와 직접주의를 취하고 있는 우리 형소법에서는 양형판단에 관하여도 제1심의 고유한 영역이 존재한다. 항소심의 사후심적 성격 등에 비추어 양형의 조건에 변화가 없고 재량의 합리적인 범위를 벗어나지 않는 경우에는 이를 존중함이 타당하다. [2015도3260]", "재판상소"],
["1176", "★ 항소심이 자신의 양형판단과 일치하지 아니한다고 하여 양형부당을 이유로 제1심판결을 파기하는 것이 바람직하지 아니한 점이 있다고 하더라도 이를 두고 양형심리 및 양형판단이 위법하다고까지 할 수는 없다.", true, "▸ 항소심이 자신의 양형판단과 일치하지 않는다고 하여 제1심판결을 파기하는 것이 바람직하지 않을 수 있지만, 이를 두고 양형심리 및 양형판단 방법이 위법하다고까지 할 수는 없다. [2015도3260]", "재판상소"],
["1177", "★ 항소심이 제1심 증인을 다시 신문하는 등 추가 증거조사를 거쳐 신빙성을 심사한 결과 제1심이 들고 있는 의심과 일부 어긋날 수 있는 사실의 개연성이 드러남으로써 제1심의 판단에 의문이 생기더라도, 제1심이 일으킨 합리적인 의심을 충분히 해소할 수 있을 정도에 이르지 아니한다면 제1심의 판단에 사실오인의 위법이 있다고 단정하여 공소사실을 유죄로 인정하여서는 아니 된다.", true, "▸ 일부 반대되는 사실에 관한 개연성 또는 의문만으로 진술의 신빙성 및 범죄의 증명이 부족하다는 제1심의 판단에 사실오인의 위법이 있다고 단정하여 공소사실을 유죄로 인정하여서는 아니 된다. [2015도11428]", "재판상소"],
["1178", "★ 피고인에게 국선변호인의 조력을 받을 권리를 보장하여야 할 국가의 의무에는 피고인이 국선변호인의 실질적 조력을 받을 수 있도록 할 의무가 포함된다.", true, "▸ [AI해설] 국선변호인의 조력을 받을 권리 보장 의무에는 피고인이 국선변호인의 실질적 조력을 받을 수 있도록 할 의무가 포함된다. [2015도9951]", "재판상소"],
["1179", "★ 필요적 변호사건에서 피고인이 항소이유서 제출기간 이내에 항소이유서를 제출하지 않고 항소장에도 항소이유를 기재하지 않았다고 하더라도 피고인에게 변호인이 없는 때에는 국선변호인을 선정하지 않은 채 결정으로 피고인의 항소를 기각할 수는 없다.", true, "▸ 필요적 변호 사건의 경우 피고인이 항소이유서를 제출하지 않았다고 하더라도, 피고인에게 변호인이 없는 때에는 국선변호인을 선정하지 않은 채 결정으로 피고인의 항소를 기각할 수는 없다. [96모100]", "재판상소"],
["1180", "★ 필요적 변호사건에서 법원이 정당한 이유 없이 국선변호인을 선정하지 않고 있는 사이에 피고인 스스로 사선변호인을 선임하였으나 이미 피고인에 대한 항소이유서 제출기간이 도과해버린 경우, 법원은 사선변호인이 통지를 받은 날로부터 기산하여 소정의 기간 내에 항소이유서를 작성·제출할 수 있는 기회를 주어야 한다.", true, "▸ [AI해설] 법원의 귀책으로 국선변호인을 선정하지 않은 상황에서 사선변호인을 선임한 경우 사선변호인에게 항소이유서 제출 기회를 주어야 한다. [2008도11486]", "재판상소"],
["1181", "★ 국선변호인의 교체가 피고인의 귀책사유에 의하지 아니한 사정으로 이루어진 경우에는 법원은 새로이 선정된 국선변호인에게 소송기록접수통지를 하여야 하고, 그 경우 항소이유서 제출기간은 새로이 선정된 변호인이 소송기록접수통지를 받은 날로부터 20일 이내이다.", true, "▸ [AI해설] 피고인의 귀책 없이 국선변호인이 교체된 경우, 새로운 국선변호인에게 소송기록접수통지를 하여야 하고 통지받은 날로부터 20일 이내가 항소이유서 제출기간이다. [2005모304]", "재판상소"],
["1182", "★ 피고인에게 변호인이 없는 경우 국선변호인에게 소송기록접수통지를 하였는데 그 후 피고인이 사선변호인을 선임함에 따라 항소법원이 국선변호인의 선정을 취소하더라도 사선변호인에게 다시 소송기록접수통지를 할 필요가 없고, 이때 항소이유서 제출기간은 국선변호인 또는 피고인이 소송기록접수통지를 받은 날부터 계산하여야 한다.", true, "▸ 상소법원이 상소인인 피고인에게 소송기록접수통지를 하기 '전에' 변호인의 선임이 있는 때에는 변호인에게도 소송기록접수통지를 하여야 한다. 그 전에 이미 국선변호인이 통지를 받은 경우 사선변호인에게 다시 통지할 필요가 없다. [2015도10651]", "재판상소"],
["1183", "★ 필요적 변호사건의 항소심에서 국선변호인을 선정하고 그에게 소송기록접수통지를 하였으나 국선변호인이 법정기간 내에 항소이유서를 제출하지 아니한 경우, 국선변호인이 항소이유서를 제출하지 아니한 데 대하여 피고인에게 책임을 돌릴 만한 사유가 특별히 밝혀지지 아니한 이상, 항소심 법원은 국선변호인의 선정을 취소하고 새로운 국선변호인을 선정하여 그에게 소송기록접수통지를 함으로써 새로운 국선변호인이 항소이유서를 제출하도록 하는 조치를 취하여야 한다.", true, "▸ [AI해설] 필요적 변호사건에서 국선변호인이 항소이유서를 미제출한 경우, 피고인 귀책이 없다면 새 국선변호인을 선정하여 소송기록접수통지를 해야 한다. [2019도4221]", "재판상소"],
["1184", "★ 소송기록이 항소심 법원에 송부된 후 항소법원이 소송기록접수통지를 하고, 항소인 또는 변호인이 '통지를 받은 날'로부터 20일 이내에 항소법원에 항소이유서를 제출해야 한다.", true, "▸ 제361조의3 제1항에 따라 항소인 또는 변호인이 '통지를 받은 날'로부터 20일 이내에 항소법원에 항소이유서를 제출해야 한다.", "재판상소"],
["1185", "★ 피고인의 항소대리권자인 배우자가 피고인을 위하여 항소한 경우, 그 배우자가 소송기록접수통지를 받고 적법한 기간 내에 항소이유서를 제출하지 아니한 때에는 피고인에게 소송기록접수통지가 이루어지지 않았더라도 항소이유서 제출기간이 지났다는 이유로 항소기각결정을 할 수 있다.", false, "▸ 소송기록접수통지는 항소인인 피고인에게 하여야 하는데(제361조의2), 피고인이 적법한 소송기록접수통지서를 받지 못하였다면 항소이유서 제출기간이 지났다는 이유로 항소기각결정을 하는 것은 위법하다. [2018모642]", "재판상소"],
["1186", "★ 항소인이나 변호인이 항소이유서 제출기간 내에 항소이유서를 제출하지 아니한 때에 법원은 항소를 기각하여야 한다. 단, 직권조사사유가 있거나 항소장에 항소이유의 기재가 있는 때에는 예외이다.", true, "▸ 제361조의4 제1항에 따라 항소인이나 변호인이 소정 기간 내에 항소이유서를 제출하지 아니한 때에는 결정으로 항소를 기각하여야 한다. 단, 직권조사사유가 있거나 항소장에 항소이유의 기재가 있는 때에는 예외이다.", "재판상소"],
["1187", "★ 항소이유서 송달을 규정한 형사소송법 조문은 항소한 소송관계인의 상대방으로 하여금 방어를 준비할 기회를 주기 위한 것이므로 상대방이 항소이유서의 등본을 송달받지 못하여 방어를 준비할 기회를 갖지 못하였다 하더라도 항소한 피고인이 이를 탓할 수는 없다.", true, "▸ [AI해설] 항소이유서 송달 규정은 상대방의 방어 기회 보장을 위한 것이므로 상대방이 등본을 받지 못한 것을 항소인이 탓할 수 없다. [2001도5810]", "재판상소"],
["1188", "★ 항소이유서가 제출되지 않은 경우, 항소심법원은 그 제출기간의 경과를 기다리지 않고 변론을 종결하여 심판할 수 없다.", true, "▸ 항소심의 구조는 피고인 또는 변호인이 법정기간 내에 제출한 항소이유서에 의하여 심판하는 것이고, 항소이유서 제출기간 내에 항소이유서를 추가·변경·철회할 수 있으므로, 그 기간의 경과를 기다리지 않고는 항소사건을 심판할 수 없다.", "재판상소"],
["1189", "★ 피고인 또는 변호인의 항소이유서가 제출되었다면 항소이유서 제출기간이 경과하지 않았더라도 항소사건을 심판할 수 있다.", false, "▸ 항소이유서 제출기간 내에 변론이 종결되었는데 그 후 위 제출기간 내에 항소이유서가 제출되었다면, 특별한 사정이 없는 한 항소심법원으로서는 변론을 재개하여 항소이유의 주장에 대해서도 심리를 해 보아야 한다. [2017도13748]", "재판상소"],
["1190", "★ 법원은 항소이유서에 포함시키지 않은 사항을 항소인이 항소심 재판시 진술하게 되면 그 사항이 판결에 영향을 미친 사유인지와 관계없이 항소이유에 그러한 주장이 포함되어 있다고 보고 항소심의 심판대상으로 삼을 수 있다.", false, "▸ 피고인이나 변호인이 항소이유서에 포함시키지 아니한 사항을 항소심 공판정에서 진술한다 하더라도 그 진술에 포함된 주장과 같은 항소이유가 있다고 볼 수 없다. [98도1234]", "재판상소"],
["1191", "★ 항소이유서에 포함되지 아니한 경우에는 판결에 영향을 미친 사유라 할지라도 항소심 법원은 이를 직권으로 심판할 수 없다.", false, "▸ 판결에 영향을 미친 사유에 한하여 예외적으로 항소이유서에 포함되지 아니하였다 하더라도 직권으로 심판할 수 있다(제364조 제2항).", "재판상소"],
["1192", "★ 피고인이 사실오인을 이유로 항소한 경우에 항소심이 직권으로 양형부당을 이유로 제1심판결을 파기할 수 있다.", true, "▸ 항소법원은 판결에 영향을 미친 사유에 관하여는 항소이유서에 포함되지 아니한 경우에도 직권으로 심판할 수 있으므로, 피고인이 사실오인만을 이유로 항소한 경우에 항소심이 직권으로 양형부당을 이유로 제1심판결을 파기할 수 있다. [90도1021]", "재판상소"],
["1193", "★ 피고인에게 징역형의 집행유예를 선고한 제1심 판결에 대하여 검사만이 양형부당을 이유로 항소한 사안에서 법원이 검사의 항소이유에 대한 판단을 생략한 채 직권으로 제1심 판결을 파기하고 벌금형을 선고한 것은 위법하다.", false, "▸ 항소법원은 검사의 항소이유에 대한 판단에 앞서 직권으로 제1심판결에 양형이 부당하다고 인정할 사유가 있는지 여부를 심판할 수 있고, 그러한 사유가 있는 때에는 제1심판결을 파기하고 제1심의 양형보다 가벼운 형을 정하여 선고할 수 있다. [2008도1092]", "재판상소"],
["1194", "★ 항소인 또는 변호인이 항소이유서에 '원심판결은 도저히 납득할 수 없는 억울한 판결이므로 항소를 한 것입니다.'라고 하여 추상적으로 제1심판결이 부당하다고만 기재함으로써 항소이유를 특정하여 구체적으로 명시하지 아니한 때에는 항소이유서가 법정의 기간 내에 적법하게 제출된 경우라도 항소를 기각할 수 있다.", false, "▸ 이를 항소이유서가 법정의 기간 내에 제출되지 아니한 것과 같이 보아 결정으로 항소를 기각할 수는 없다. 항소심으로서는 이를 사실의 오인이 있거나 양형부당의 위법이 있다는 항소이유를 기재한 것으로 선해하여 그 항소이유에 대하여 심리를 하여야 한다. [2002모265]", "재판상소"],
["1195", "★ 항소심에서 피고인이 불출석한 상태에서 그 진술 없이 판결할 수 있기 위해서는 피고인이 적법한 공판기일 통지를 받고서도 2회 연속 정당한 이유 없이 출정하지 않아야 한다.", true, "▸ 제365조에 따라 피고인이 적법한 공판기일 통지를 받고서도 2회 연속으로 정당한 이유 없이 출정하지 아니하는 경우 피고인의 진술 없이 판결을 할 수 있다.", "재판상소"],
["1196", "★ 피고인이 공판기일 중 제1회·제2회 각 출석, 제3회 불출석, 제4회 출석(변론종결), 제5회 불출석(선고기일)이었다면, 원심이 제5회 공판기일에 바로 항소를 기각하고 선고한 것은 위법하다.", true, "▸ 피고인이 적법한 공판기일 통지를 받고서도 2회 연속으로 정당한 이유 없이 출정하지 않은 경우에 해당하여야 하는데, 제3회만 불출석하고 제4회에 출석하였으므로 2회 연속 불출석에 해당하지 않아 제5회 공판기일에 바로 항소를 기각하고 선고한 것은 위법하다. [2019도5426]", "재판상소"],
["1197", "★ 제1심 법원이 공소사실을 유죄로 인정하여 징역형의 집행유예를 선고하였는데 피고인이 항소하자 항소심이 구두변론 없이 서면심리에 의하여 항소를 기각한 것은 위법하다.", true, "▸ 형사소송에 있어서 특별한 규정이 있는 경우를 제외하고는 판결은 구두변론을 거쳐야 함이 원칙이다. 피고인이 항소한 사건에서 구두변론 없이 서면심리만으로 항소를 기각한 것은 위법하다. [94도2078]", "재판상소"],
["1198", "★ 검사가 공판정에서 구두변론을 통해 항소이유를 주장하지 않았고 피고인도 그에 대한 적절한 방어권을 행사하지 못하는 등 검사의 항소이유가 실질적으로 구두변론 절차를 거쳐 심리되지 않았다고 평가될 경우, 항소심법원이 이러한 검사의 항소이유를 받아들여 피고인에게 불리하게 제1심판결을 변경하는 것은 허용되지 않는다.", true, "▸ 검사의 항소이유가 실질적으로 구두변론 절차를 거쳐 심리되지 않은 경우, 항소심법원이 이러한 항소이유를 받아들여 피고인에게 불리하게 제1심판결을 변경하는 것은 허용되지 않는다. [2015도11696]", "재판상소"],
["1199", "★ 항소심에서 원판결의 당부에 대한 판단은 항소심판결 선고시점이 아니라, 원판결시점을 기준으로 한다.", false, "▸ 항소심은 사후심적 성격이 가미된 속심이므로 원판결의 당부는 항소심판결 선고시점이 기준이 된다.", "재판상소"],
["1200", "★ 변호인이 피고인을 신문하겠다는 의사를 표시하였음에도 변호인에게 일체의 피고인신문을 허용하지 않은 재판장의 조치는 소송절차의 법령위반으로서 상고이유에 해당한다.", true, "▸ 재판장은 피고인 신문의 전부 또는 일부를 제한할 수 있으나 변호인의 피고인신문권에 관한 본질적 권리를 해할 수는 없다. 일체의 신문을 허용하지 않은 것은 소송절차의 법령위반에 해당한다. [2020도10778]", "재판상소"],
["1201", "★ 제1심법원에서 이미 증거능력이 있었던 증거는 항소심에서도 증거능력이 그대로 유지되어 심판의 기초가 될 수 있고, 다시 증거조사를 할 필요가 없으므로, 항소심법원의 재판장은 증거조사절차에 들어가기에 앞서 제1심의 증거관계와 증거조사결과의 요지를 고지할 필요가 없다.", false, "▸ 제1심법원에서 이미 증거능력이 있었던 증거는 항소심에서도 그대로 유지되어 다시 증거조사를 할 필요가 없다. 다만 항소법원의 재판장은 증거조사 절차에 들어가기에 앞서 제1심의 증거관계와 증거조사 결과의 요지를 고지하여야 한다(규칙 제156조의5 제1항). [2004도8313]", "재판상소"],
["1202", "★ 형사소송법 제364조의2에서 정한 '항소한 공동피고인'은 제1심의 공동피고인으로서 자신이 항소한 경우는 물론 그에 대하여 검사만 항소한 경우까지도 포함한다.", true, "▸ 형소법 제364조의2의 '항소한 공동피고인'은 자신이 항소한 경우는 물론 그에 대하여 검사만 항소한 경우까지도 포함한다. [2021도10579]", "재판상소"],
["1203", "★ 검사와 피고인 양쪽이 상소를 제기한 경우, 어느 일방의 상소는 이유 없으나 다른 일방의 상소가 이유 있어 원판결을 파기하고 다시 판결하는 때에는 이유 없는 상소에 대해서는 판결이유 중에서 그 이유가 없다는 점을 적으면 충분하고 주문에서 그 상소를 기각해야 하는 것은 아니다.", true, "▸ 검사와 피고인 양쪽이 상소를 제기한 경우, 이유 없는 상소에 대해서는 주문에서 기각할 필요 없이 판결이유 중에서 이유 없다는 점을 적으면 충분하다. [2019도17995]", "재판상소"],
["1204", "★ 양형이 과중하다는 피고인의 항소이유에 대하여 그 이유없다고만 판시하여 항소를 기각한 항소심의 판단은 위법하다.", false, "▸ 항소심판결은 항소이유에 대한 판단을 기재함으로써 충분하고, 양형이 과중하다는 항소이유에 대하여 그 이유없다고만 판시하여 항소를 기각한 항소심의 판단은 정당하고 위법하지 않다. [82도2642]", "재판상소"],
["1205", "★ 상고심은 항소심에서 심판대상으로 되었던 사항에 한하여 상고이유의 범위 내에서 심판하여야 하므로 항소이유로 주장하거나 항소심이 직권으로 심판대상으로 삼아 판단한 것 이외의 사유를 상고이유로 삼아 다시 상고심의 심판범위로 삼는 것은 상고심의 사후심 구조에 반한다.", true, "▸ 상고심은 사후심으로서, 항소심에서 심판대상으로 되었던 사항에 한하여 상고이유의 범위 내에서 심판하여야 하므로 그 이외의 사유를 상고이유로 삼는 것은 상고심의 사후심 구조에 반한다. [2017도16593-1]", "재판상소"],
["1206", "★ 피고인이 유죄가 인정된 제1심판결에 대하여 항소하지 않거나 양형부당만을 이유로 항소하고 검사는 양형부당만을 이유로 항소하였는데 항소심이 검사의 항소를 받아들여 제1심 판결을 파기하고 그보다 높은 형을 선고한 경우, 피고인은 상고심에서 사실오인이나 법령위반 등 새로운 사유를 상고이유로 내세울 수 없다.", true, "▸ 상고이유 제한에 관한 법리가 그대로 적용된다. 피고인들의 위 상고이유 주장은 항소심에서 심판대상이 되지 아니한 사항이므로 적법한 상고이유가 아니다. [2017도16593-1 전합]", "재판상소"],
["1207", "★ 상고심에서 상고이유가 없다고 하여 파기되지 아니한 부분은 그 판결 선고와 동시에 확정되고 이 부분에 대하여는 피고인은 더 이상 다툴 수 없고, 환송받은 법원으로서도 이와 배치되는 판단을 할 수 없다.", true, "▸ [AI해설] 상고심에서 파기되지 않고 확정된 부분에 대해서는 피고인도 환송받은 법원도 다툴 수 없다. [2018도7575]", "재판상소"],
["1208", "★ 종전 상고심이 피고인들의 상고이유를 받아들여 환송 전 원심판결을 전부 파기환송하면서 피고인들이 상고이유로 삼지 아니한 부분에 대한 상고가 이유 없다는 판단을 따로 한 바 없다면, 이를 환송받은 원심이 그 부분에 대하여 다시 심리·판단하여 그 중 일부를 무죄로 선고할 수 있다.", true, "▸ [AI해설] 상고이유로 삼지 않은 부분에 대해 이유 없다는 판단을 따로 한 바 없다면, 환송받은 원심이 그 부분을 다시 심리·판단하여 일부를 무죄로 선고할 수 있다. [2007도7042]", "재판상소"],
["1209", "★ 원심판결 후에 나타난 사실이나 증거가 상고이유서 등에 첨부되어 있는 경우에는 원칙적으로 이를 소송자료로 사용할 수 있다.", false, "▸ 상고심은 사후심으로서 원심까지의 소송자료만을 기초로 하여야 하므로, 원심판결 후에 나타난 사실이나 증거의 경우 비록 그것이 상고이유서 등에 첨부되어 있다 하더라도 사용할 수 없음이 원칙이다. [2009도4894]", "재판상소"],
["1210", "★ 항소심판결 당시 피고인이 소년이었기 때문에 부정기형이 선고되었다고 하더라도 상고심 중에 피고인이 성년이 되었다면 부정기형을 선고할 수 없으므로 상고심은 항소심판결을 파기하여야 한다.", false, "▸ 상고심의 심판대상은 항소심 판결당시를 기준으로 하여 그 당부를 심사하는 것이므로, 항소심 판결당시 미성년인 피고인에 대한 부정기형의 선고는 피고인이 그 후 상고심 계속중에 성년이 된다 하더라도 위법이 될 수 없다. [85도2500]", "재판상소"],
["1211", "★ 사형·무기 또는 10년 이상의 징역이나 금고를 선고받은 피고인은 항소심의 양형이 심히 가볍다는 이유로 상고할 수 없다.", true, "▸ 제383조 제4호 후단이 정한 양형부당 상고이유는 피고인의 이익을 위한 조항이므로, 피고인에 대하여 사형·무기 또는 10년 이상의 형이 선고된 경우에도 피고인은 자신에게 불이익한 '형이 심히 가볍다'는 이유로 상고할 수 없다. [2021도16719]", "재판상소"],
["1212", "★ 피고인에 대하여 10년 미만의 징역형이 선고된 사건에서 원심의 형량이 너무 무거워서 부당하다는 취지의 주장이나 원심이 정상에 관하여 심리를 제대로 하지 아니하였다는 사유는 적법한 상고이유가 될 수 없다.", true, "▸ 10년 미만의 징역형이 선고된 사건에서는 양형부당을 이유로 한 상고가 허용되지 않는다. [2001도5304]", "재판상소"],
["1213", "★ 사실심 변론종결 후 검사나 피해자 등에 의해 피고인에게 불리한 새로운 양형조건에 관한 자료가 법원에 제출되었다면, 사실심법원으로서는 변론을 재개하여 그 양형자료에 대하여 피고인에게 의견진술 기회를 주는 등 필요한 양형심리절차를 거침으로써 피고인의 방어권을 실질적으로 보장해야 한다.", true, "▸ 사실심 변론종결 후 피고인에게 불리한 새로운 양형자료가 제출되었다면 변론을 재개하여 피고인에게 의견진술 기회를 주는 등 양형심리절차를 거쳐야 한다. [2021도5777]", "재판상소"],
["1214", "★ 상고의 제기가 법률상의 방식에 위반하거나 상고권소멸 후인 것이 명백한 때에는 원심법원은 결정으로 상고를 기각하여야 하고, 이 결정에 대하여는 즉시항고를 할 수 없다.", false, "▸ 상고의 제기가 법률상의 방식에 위반하거나 상고권소멸 후인 것이 명백한 때에는 원심법원은 결정으로 상고를 기각하여야 한다(제376조 제1항). 이 결정에 대하여는 즉시항고를 할 수 있다(동조 제2항).", "재판상소"],
["1215", "★ 상고심에는 변호사 아닌 자를 변호인으로 선임하지 못하며, 변호인이 아니면 피고인을 위하여 변론하지 못한다.", true, "▸ 상고심에는 변호사 아닌 자를 변호인으로 선임하지 못한다(제386조). 상고심에는 변호인 아니면 피고인을 위하여 변론하지 못한다(제387조).", "재판상소"],
["1216", "★ 제1심판결에 대하여 피고인은 비약적 상고를, 검사는 항소를 각각 제기하여 이들이 항소기간 준수 등 항소로서의 적법요건을 모두 갖추었다면, 피고인의 비약적 상고에 상고의 효력이 인정되지 않는 때에도 항소심에서는 제1심판결을 다툴 의사가 없었다고 볼 수 없다면, 피고인의 비약적 상고에 항소로서의 효력이 인정된다.", true, "▸ 피고인이 비약적 상고를 제기하면서 항소로서의 적법요건을 모두 갖추었고, 피고인이 제1심판결을 다툴 의사가 없었다고 볼 만한 특별한 사정이 없다면, 피고인의 비약적 상고에 항소로서의 효력이 인정된다. [2021도17131]", "재판상소"],
["1217", "★ 즉시항고의 제기기간 내와 그 제기가 있는 때에는 재판의 집행은 정지된다.", true, "▸ 제410조에 따라 즉시항고의 제기기간 내와 그 제기가 있는 때에는 재판의 집행은 정지된다.", "재판상소"],
["1218", "★ 법원의 결정은 원칙적으로 항고의 대상이 된다.", true, "▸ 제402조에 따라 법원의 결정에 대하여 불복이 있으면 항고를 할 수 있다.", "재판상소"],
["1219", "★ 대법원의 결정은 최종적인 재판이므로 이에 대하여는 항고로 불복할 수 없다.", true, "▸ 대법원의 결정은 최종적인 재판이므로 이에 대하여는 항고로 불복할 수 없다. [83모34]", "재판상소"],
["1220", "★ 법원의 결정에 대한 일반적인 불복방법인 항고는 즉시항고 외에는 불복기간의 제한 없이 원결정을 취소할 실익이 있는 한 언제든지 제기할 수 있다.", true, "▸ 항고는 즉시항고 외에는 언제든지 할 수 있다. 단, 원심결정을 취소하여도 실익이 없게 된 때에는 예외로 한다(제404조).", "재판상소"],
["1221", "★ 관할이전의 신청을 기각한 결정에 대하여는 즉시항고를 할 수 있다는 규정이 없으므로, 원심결정에 대하여 불복할 수 없다.", true, "▸ 법원의 관할 또는 판결 전의 소송절차에 관한 결정에 대하여는 특히 즉시항고를 할 수 있는 경우 외에는 항고하지 못한다(제403조 제1항). 관할이전의 신청을 기각한 결정에 대하여 즉시항고를 할 수 있다는 규정이 없으므로 불복할 수 없다. [2020모2561]", "재판상소"],
["1222", "★ 위헌제청신청을 기각하는 결정은 판결 전의 소송절차에 관한 결정으로서 그에 대해서는 항고할 수 없다.", true, "▸ 위헌제청신청을 기각하는 결정은 판결 전의 소송절차에 관한 결정이므로 그에 대하여는 특별히 즉시항고를 할 수 있다는 규정이 없는 한 항고할 수 없다. [85모49]", "재판상소"],
["1223", "★ 법원이 제1심법원으로부터 소송기록을 송부받고 항고인에게 소송기록접수통지가 송달된 날에 곧바로 항고인의 즉시항고를 기각한 것은 당사자에게 항고에 관하여 이유서를 제출하거나 의견을 진술하고 유리한 증거를 제출할 기회를 부여하였다고 할 수 없으므로 위법하다.", true, "▸ 제411조에 따라 당사자에게 항고에 관하여 이유서를 제출하거나 의견을 진술하고 유리한 증거를 제출할 기회를 부여하여야 하는데, 통지를 받은 날 곧바로 기각한 것은 이 기회를 부여하였다고 할 수 없어 위법하다. [2007모601]", "재판상소"],
["1224", "★ 항고법원이 제1심법원으로부터 소송기록을 송부받은 당일에 항고를 기각하는 결정을 하면서, 항고인에게 소송기록과 증거물을 송부받았다는 통지를 하지 않은 것은 항고인에게 항고에 관하여 이유서를 제출하거나 의견을 진술하고 유리한 증거를 제출할 기회를 부여하였다고 할 수 없으므로 위법하다.", true, "▸ 소송기록을 송부받은 당일에 항고를 기각하면서 항고인에게 소송기록접수통지를 하지 않은 것은 의견 진술 및 유리한 증거 제출 기회를 부여하지 않은 것으로 위법하다. [2018모1698]", "재판상소"],
["1225", "★ 재판장 또는 수명법관의 재판에 대한 준항고의 청구는 재판의 고지가 있는 날로부터 3일 이내에 하여야 한다.", false, "▸ 재판장 또는 수명법관이 고지한 재판에 대한 준항고의 청구는 재판의 고지있는 날로부터 '7일 이내'에 하여야 한다(제416조 제3항).", "재판상소"],
["1226", "★ 증인에 대하여 과태료를 명한 재판에 관하여 준항고의 청구가 있더라도 재판의 집행이 정지되는 것은 아니다.", false, "▸ 증인, 감정인, 통역인 또는 번역인에 대하여 과태료 또는 비용의 배상을 명한 재판은 전항의 청구기간 내와 청구가 있는 때에는 그 재판의 집행은 정지된다(제416조 제4항).", "재판상소"],
["1227", "★ 수사기관의 압수물의 환부에 관한 처분의 취소를 구하는 준항고는 일종의 항고소송이므로, 준항고로써 달성하고자 하는 목적이 이미 이루어졌거나 시일의 경과 또는 그 밖의 사정으로 인하여 그 이익이 상실된 경우에는 준항고는 그 이익이 없어 부적법하다.", true, "▸ [AI해설] 수사기관의 압수물 환부처분 취소를 구하는 준항고는 항고소송이므로 목적 달성 등으로 이익이 상실되면 부적법하다. [2013모1970]", "재판상소"],
["1228", "★ 검사의 압수에 관한 처분에 대하여 준항고가 허용되나, 검사가 압수·수색영장의 청구 등 강제처분을 위한 조치를 취하지 아니한 것 자체에 대해서는 준항고할 수 없다.", true, "▸ 검사의 압수에 관한 처분에 대하여 준항고가 허용되나, 검사가 압수·수색영장의 청구 등 강제처분을 위한 조치를 취하지 아니한 것 자체에 대해서는 준항고할 수 없다. [2007모82]", "재판상소"],
["1229", "★ 준항고에 관한 결정에 대해서는 항고를 거쳐 대법원에 재항고를 할 수 있다.", false, "▸ 제416조, 제417조의 준항고에 관한 결정에 대하여는 재판에 영향을 미친 헌법, 법률, 명령, 규칙의 위반이 있음을 이유로 하는 때에 한하여 대법원에 '즉시항고'(재항고)를 할 수 있고, 항고를 거칠 필요가 없다(제419조, 제415조). [83모12]", "재판상소"],
["1230", "★ 준항고인이 준항고취지에서 압수·수색 처분을 한 수사기관을 제대로 특정하지 못했다는 이유만으로 준항고를 배척할 것은 아니다.", true, "▸ 압수·수색 처분을 한 수사기관과 준항고취지에 기재된 수사기관이 일치하지 않는 경우 보정을 요구하는 등 절차를 거쳐 이를 일치시킨 다음 심리·판단하여야 하고, 특정하지 못했다는 이유만으로 준항고를 배척할 것은 아니다. [2022모1566]", "재판상소"],
["1231", "★ 판결서가 작성되지 않았거나 작성된 다음 멸실되어 존재하지 않는다면 재심의 대상이 될 수 없다.", false, "▸ 판결서가 작성되지 않았거나 작성된 다음 멸실되어 존재하지 않더라도 판결이 선고되었다면 판결은 성립하여 존재한다고 보아야 하므로 그것이 유죄 확정판결이라면 재심의 대상이 될 수 있다. [2015모2229]", "비상구제특별절차"],
["1232", "★ 재심은 유죄의 확정판결 및 유죄판결에 대한 항소 또는 상고를 기각한 확정판결에 대하여만 허용되며, 면소판결을 대상으로 한 재심청구는 부적법하다.", true, "▸ 재심청구는 유죄의 확정판결에 대하여서만 할 수 있으며, 면소판결을 대상으로 한 재심청구는 부적법하다. [2015모3243]", "비상구제특별절차"],
["1233", "★ 제1심 확정판결에 대한 재심청구사건의 판결이 있은 후에는 항소기각판결에 대하여 다시 재심을 청구할 수 없다.", true, "▸ 제421조 제2항에 따라 제1심 확정판결에 대한 재심청구사건의 판결이 있은 후에는 항소기각판결에 대하여 다시 재심을 청구하지 못한다.", "비상구제특별절차"],
["1234", "★ 항소기각의 확정판결과 그 판결에 의하여 확정된 제1심판결에 대하여 재심의 청구가 있는 경우에 제1심법원이 재심의 판결을 한 때에는 항소법원은 결정으로 재심의 청구를 기각하여야 한다.", true, "▸ 제436조 제1항에 따라 항소기각의 확정판결과 제1심판결에 대하여 재심의 청구가 있는 경우에 제1심법원이 재심의 판결을 한 때에는 항소법원은 결정으로 재심의 청구를 기각하여야 한다.", "비상구제특별절차"],
["1235", "★ 재정신청기각의 결정은 재심의 대상이다.", false, "▸ 재심청구는 유죄의 확정판결에 대하여서만 할 수 있고 결정에 대하여는 재심청구가 허용되지 않는다. 재정신청기각결정에 대하여 재심청구는 부적법하다. [86모38]", "비상구제특별절차"],
["1236", "★ 정식재판청구권회복청구기각결정에 대한 항고기각결정에 대한 재항고기각결정은 유죄의 확정판결이 아님은 물론 이로 인하여 유죄의 판결이 확정되는 것도 아니어서 재심청구의 대상이 되지 아니한다.", true, "▸ 정식재판청구권회복청구기각결정에 대한 재항고기각결정은 유죄의 확정판결이 아니어서 재심청구의 대상이 되지 않는다. [91재도2]", "비상구제특별절차"],
["1237", "★ 공소기각의 판결은 재심의 대상이다.", false, "▸ 제420조, 제421조가 유죄의 확정판결, 유죄 판결에 대한 항소 또는 상고의 기각판결에 대하여만 재심을 청구할 수 있다고 규정하고 있으므로, 공소기각의 판결은 재심의 대상이 되지 않는다. [2003모464]", "비상구제특별절차"],
["1238", "★ 유죄의 확정판결 후 형 선고의 효력을 상실케 하는 특별사면이 있었다면 이미 재심청구의 대상이 존재하지 않아 그 판결을 대상으로 하는 재심청구는 부적법하다.", false, "▸ 특별사면으로 형 선고의 효력이 상실된 유죄의 확정판결도 제420조의 '유죄의 확정판결'에 해당하여 재심청구의 대상이 될 수 있다. [2011도1932]", "비상구제특별절차"],
["1239", "★ 면소판결의 사유 중 '사면이 있은 때'란 일반사면이 있은 때를 말한다.", true, "▸ 면소판결 사유인 형소법 제326조 제2호의 '사면이 있는 때'에서 말하는 '사면'이란 일반사면을 의미할 뿐, 특별사면은 이에 해당하지 않는다. [2011도1932]", "비상구제특별절차"],
["1240", "★ 재심대상판결 확정 후에 형 선고의 효력을 상실케 하는 특별사면이 있었던 경우 재심개시결정이 확정되어 재심심판절차를 진행하는 법원은 그 심급에 따라 다시 심판하여 특별사면을 이유로 면소판결을 선고하여야 한다.", false, "▸ 특별사면은 면소사유에 해당하지 않으므로, 재심심판법원은 실체에 관한 유·무죄 등의 판단을 하여야 하고 특별사면을 이유로 면소판결을 하여서는 아니 된다. 재심심판 결과 유죄인 경우 이익재심·불이익변경금지 원칙에 따라 '피고인에 대하여 형을 선고하지 아니한다'는 주문을 선고한다. [2012도2938]", "비상구제특별절차"],
["1241", "★ 항소심에서 파기된 제1심 판결은 재심의 대상이다.", false, "▸ 항소심에서 파기되어버린 제1심판결에 대해서는 재심을 청구할 수 없는 것이므로, 위 제1심판결을 대상으로 하는 재심청구는 법률상의 방식에 위반하는 것이다. [2003모464]", "비상구제특별절차"],
["1242", "★ 약식명령에 대한 정식재판청구에 따라 유죄의 판결이 확정된 경우의 약식명령은 재심의 대상이다.", false, "▸ 약식명령에 대하여 정식재판 청구가 이루어지고 그 후 진행된 정식재판 절차에서 유죄판결이 선고되어 확정된 경우, 피고인 등은 효력을 잃은 약식명령이 아니라 유죄의 확정판결을 대상으로 재심을 청구하여야 한다. [2011도10626]", "비상구제특별절차"],
["1243", "★ 원판결의 증거된 증언이 나중에 확정판결에 의하여 허위인 것이 증명된 이상, 그 허위증언 부분을 제외하고서도 다른 증거에 의하여 유죄로 인정될 경우에는 재심사유에 해당하지 아니한다.", false, "▸ 원판결의 증거된 증언이 나중에 확정판결에 의하여 허위인 것이 증명된 이상, 그 허위증언 부분을 제외하고서도 다른 증거에 의하여 유죄로 인정될 것인지 여부에 관계없이 제420조 제2호의 재심사유가 있는 것으로 보아야 한다. [95모38]", "비상구제특별절차"],
["1244", "★ 원판결의 증거로 사용된 증언을 한 자가 그 재판 과정에서 자신의 증언과 반대되는 취지로 피고인을 고소하였다가 그 고소가 허위임이 밝혀져 무고죄로 유죄판결을 받은 경우, 이는 재심사유의 하나인 '원판결의 증거된 증언이 확정판결에 의하여 허위인 것이 증명된 때'에 해당한다.", false, "▸ 원판결에서 증거로 사용된 증언을 한 자가 자신의 증언과 반대되는 취지로 피고인을 고소하였다가 그 고소가 허위임이 밝혀져 무고죄로 유죄판결을 받은 경우는 위 재심사유에 포함되지 아니한다. [2003도1080]", "비상구제특별절차"],
["1245", "★ 제420조 제4호의 '원판결의 증거된 재판이라 함'은 원판결의 이유 중에서 증거로 채택되어 죄로 되는 사실을 인정하는 데 인용된 다른 재판을 뜻한다.", true, "▸ 제420조 제4호에서 정한 원판결의 증거된 재판이라 함은 원판결의 이유 중에서 증거로 채택되어 죄로 되는 사실을 인정하는 데 인용된 다른 재판을 뜻한다. [2018도17909]", "비상구제특별절차"],
["1246", "★ 재심사유로서 '원판결이 인정한 죄보다 경한 죄를 인정할 경우'라 함은 원판결에서 인정한 죄와는 별개의 경한 죄를 말하는 것이지, 원판결에서 인정한 죄 자체에는 변함이 없고 다만 양형상의 자료에 변동을 가져올 사유에 불과한 경우를 말하는 것은 아니다.", true, "▸ '원판결이 인정한 죄보다 경한 죄를 인정할 경우'란 원판결의 죄와는 별개의 경한 죄를 말하고, 양형상의 자료에 변동을 가져올 사유에 불과한 경우를 말하는 것은 아니다. [92모31]", "비상구제특별절차"],
["1247", "★ '형의 면제를 인정할 명백한 증거가 새로 발견된 때'에서 '형의 면제'라 함은 형의 필요적 면제뿐만 아니라 임의적 면제도 포함한다.", false, "▸ 형의 면제라 함은 형의 필요적 면제의 경우만을 말하고 임의적 면제는 해당하지 않는다. [84모32]", "비상구제특별절차"],
["1248", "★ '무죄 등 인정할 명백한 증거가 새로 발견된 때'에 해당하는지는 재심 개시 여부를 심사하는 법원이 새로이 발견하여 알게 된 것인지 여부에 따라 결정되어야 한다.", false, "▸ 제420조 제5호가 그 범위를 제한하고 있지 않으므로 그 대상을 법원으로 한정할 것은 아니다. 다만 피고인이 재심을 청구한 경우 확정판결의 소송절차 중에 그러한 증거를 제출하지 못한 데 과실이 있는 경우에는 '새로 발견된 때'에서 제외된다. [2005모472]", "비상구제특별절차"],
["1249", "★ 재심개시 여부 심사 시 새로 발견된 증거만을 독립적·고립적으로 고찰하여 그 증거가치만으로 판단하여야 한다.", false, "▸ 법원으로서는 재심대상이 되는 확정판결을 선고한 법원이 사실인정의 기초로 삼은 증거들 가운데 새로 발견된 증거와 유기적으로 밀접하게 관련되고 모순되는 것들을 함께 고려하여 평가하여야 한다. [2005모472]", "비상구제특별절차"],
["1250", "★ '증거가 새로 발견된 때'에는 형벌에 관한 법령이 당초부터 헌법에 위배되어 법원에서 위헌·무효라고 선언한 때에도 해당한다.", true, "▸ 형벌에 관한 법령이 당초부터 헌법에 위배되어 법원에서 위헌·무효라고 선언한 때에도 제420조 제5호의 재심사유에 해당한다. [2010모363]", "비상구제특별절차"],
["1251", "★ '무죄 등을 인정할 명백한 증거'란 법관의 자유심증에 의하여 그 증거가치가 좌우되는 증거를 말한다.", false, "▸ '명백한 증거'란 법관의 자유심증에 의하여 그 증거가치가 좌우되는 증거가 아니라, 객관적으로 확정판결의 사실인정의 기초가 된 증거보다 경험칙이나 논리칙상 우위에 있다고 보여지는 증거를 의미한다. [99모93]", "비상구제특별절차"],
["1252", "★ 공범자 중 1인에 대하여는 무죄, 다른 1인에 대하여는 유죄의 확정판결이 있는 경우에 무죄확정 판결의 증거자료를 자기의 증거자료로 하지 못하였고 또 새로 발견된 것이 아닌 한 무죄확정판결 자체만으로는 유죄확정 판결에 대한 새로운 증거로서의 재심사유에 해당한다고 할 수 없다.", true, "▸ 공범자 중 1인에 대한 무죄확정판결의 증거자료를 자기의 증거자료로 하지 못하였고 또 새로 발견된 것이 아닌 한 무죄확정판결 자체만으로는 재심사유에 해당하지 않는다. [84모14]", "비상구제특별절차"],
["1253", "★ 수사기관이 영장주의를 배제하는 위헌적 법령에 따라 영장 없는 체포·구금을 한 경우는 제420조 제7호 재심사유에 해당하지 아니한다.", false, "▸ 수사기관이 영장주의를 배제하는 위헌적 법령에 따라 영장 없는 체포·구금을 한 경우에도 불법체포·감금의 직무범죄가 인정되는 경우에 준하는 것으로 보아 제420조 제7호의 재심사유가 있다고 보아야 한다. [2015모3243]", "비상구제특별절차"],
["1254", "★ 형사소송법 제420조 제7호의 재심사유 해당 여부 판단 시 사법경찰관 등이 범한 직무에 관한 죄가 사건의 실체관계에 관계된 것인지 여부나 당해 사법경찰관이 직접 피의자에 대한 조사를 담당하였는지 여부는 고려할 사정이 아니다.", true, "▸ [AI해설] 제420조 제7호 재심사유 판단 시 직무범죄가 사건 실체관계와 관련된 것인지 또는 직접 조사 담당 여부는 고려 사정이 아니다.", "비상구제특별절차"],
["1255", "★ 소촉법 제23조의2 제1항에 따라 진행된 제1심의 불출석 재판에 대하여 검사만 항소하고 항소심도 불출석 재판으로 진행한 후 유죄판결이 확정된 경우, 귀책사유 없이 제1심과 항소심의 공판절차에 출석할 수 없었던 피고인은 항소심 법원에 유죄판결에 대한 재심을 청구할 수 있다.", true, "▸ 소촉법 제23조의2 제1항을 유추 적용하여, 귀책사유 없이 제1심과 항소심의 공판절차에 출석할 수 없었던 피고인은 재심 규정이 정한 기간 내에 '항소심 법원'에 유죄판결에 대한 재심을 청구할 수 있다. [2014도17252 전합]", "비상구제특별절차"],
["1256", "★ 형벌조항에 대하여 헌법재판소의 위헌결정이 있는 경우 헌법재판소법 제47조에 의한 재심은 원칙적인 재심대상판결인 제1심 유죄판결 또는 파기자판한 상급심판결에 대하여 청구하여야 한다.", true, "▸ 헌법재판소법 제47조를 이유로 하는 재심은 원칙적인 재심대상판결인 제1심 유죄판결 또는 파기자판한 상급심판결에 대하여 청구하여야 한다. [2022모509]", "비상구제특별절차"],
["1257", "★ 재심의 청구는 유죄의 선고를 받은 자, 그 법정대리인, 그 배우자, 직계친족 또는 형제자매가 할 수 있으며, 검사는 재심의 청구를 할 수 없다.", false, "▸ 검사, 유죄의 선고를 받은 자, 유죄의 선고를 받은 자의 법정대리인, 유죄의 선고를 받은 자가 사망하거나 심신장애가 있는 경우에는 그 배우자, 직계친족 또는 형제자매는 재심을 청구할 수 있다(제424조). 검사도 재심 청구 가능.", "비상구제특별절차"],
["1258", "★ 재심의 청구는 형의 집행을 종료하거나 형의 집행을 받지 아니하게 된 때에도 할 수 있다.", true, "▸ 제427조에 따라 재심의 청구는 형의 집행을 종료하거나 형의 집행을 받지 아니하게 된 때에도 할 수 있다.", "비상구제특별절차"],

["1260", "★ 군사법원의 판결이 확정된 후 피고인에 대한 재판권이 더 이상 군사법원에 없게 된 경우에 군사법원의 판결에 대한 재심사건의 관할은 원판결을 한 군사법원과 같은 심급의 일반법원에 있다.", true, "▸ [AI해설] 군사법원의 판결 확정 후 재판권이 없게 된 경우 재심 관할은 같은 심급의 일반법원에 있다. [2019모3197]", "비상구제특별절차"],
["1261", "★ 재심청구가 원판결을 한 법원이 아닌 다른 법원에 잘못 제기된 경우에는 재심청구가 법률상의 방식에 위반한 것에 해당하므로, 법원은 결정으로 재심청구를 기각하여야 한다.", false, "▸ 재심청구가 재심관할법원인 항소심법원이 아닌 제1심법원에 잘못 제기된 경우 제1심법원은 그 재심의 소를 부적법하다 하여 각하할 것이 아니라 재심관할법원인 항소심법원에 이송하여야 할 것이다. [2002모344]", "비상구제특별절차"],
["1262", "★ 재심청구인이 재심청구를 취하한 경우에는 동일한 이유로 다시 재심을 청구하지 못한다.", true, "▸ 제429조 제2항에 따라 재심청구인이 재심청구를 취하한 경우에는 동일한 이유로 다시 재심을 청구하지 못한다.", "비상구제특별절차"],
["1263", "★ 재심법원이 재심판결을 선고한 이후에도 재심청구의 취하가 허용된다.", false, "▸ 재심청구인은 형소법 제429조 제1항에 따라 재심청구를 취하할 수 있으나, 재심법원이 재심판결을 선고한 이후에는 재심청구의 취하가 허용되지 않는다. [2023도13707]", "비상구제특별절차"],
["1264", "★ 관할법원에 대응한 검찰청검사는 재심청구에 대한 재판이 있을 때까지 형의 집행을 정지하여야 한다.", false, "▸ 재심의 청구는 형의 집행을 정지하는 효력이 없다. 단 관할법원에 대응한 검찰청검사는 재심청구에 대한 재판이 있을 때까지 형의 집행을 정지'할 수' 있다(제428조).", "비상구제특별절차"],
["1265", "★ 법원이 재심의 청구가 이유 있다고 인정하여 재심개시의 결정을 하는 경우 형의 집행이 당연히 정지된다.", false, "▸ 재심개시결정을 할 때에는 결정으로 형의 집행을 정지'할 수 있다'(제435조 제2항). 당연히 정지되는 것이 아니다.", "비상구제특별절차"],
["1266", "★ 재심청구를 기각하는 법원의 결정이나 법원이 재심개시결정을 한 경우에 대해서는 즉시항고를 할 수 있다.", true, "▸ 제437조에 따라 재심청구 기각결정과 재심개시결정에 대하여는 즉시항고를 할 수 있다.", "비상구제특별절차"],
["1267", "★ 「형사소송법」상 재심개시절차에서는 재심사유가 있는지 여부를 판단할 뿐만 아니라, 재심사유가 재심대상판결에 영향을 미칠 가능성이 있는가의 실체적 사유도 함께 고려하여야 한다.", false, "▸ 재심개시절차와 재심심판절차는 구별되는 것이므로, 재심개시절차에서는 형소법에서 규정하고 있는 재심사유가 있는지 여부만을 판단하여야 하고, 나아가 재심사유가 재심대상판결에 영향을 미칠 가능성이 있는가의 실체적 사유는 고려하여서는 아니 된다. [2008도77]", "비상구제특별절차"],
["1268", "★ 경합범 관계에 있는 수개의 범죄사실을 유죄로 인정하여 한 개의 형을 선고한 불가분의 확정판결 중 일부의 범죄사실에 대하여만 재심청구의 이유가 있는 것으로 인정된 경우에는 판결 전부에 대하여 재심개시의 결정을 하여야 하고, 재심법원은 재심사유가 없는 죄 부분에 대하여는 양형을 위하여 필요한 범위에 한하여만 심리할 수 있을 뿐이다.", true, "▸ 판결 전부에 대하여 재심개시의 결정을 하여야 하지만, 재심사유가 없는 죄 부분에 대하여는 유죄인정을 파기할 수 없고 다만 양형을 위한 범위에 한하여만 심리할 수 있다. [2021도2738]", "비상구제특별절차"],
["1269", "★ 법률상의 방식을 위반한 재심청구라는 이유로 기각결정이 있더라도 청구인이 이를 보정한다면 다시 동일한 이유로 재심청구를 할 수 있다.", true, "▸ 형소법은 재심청구 제기기간에 제한을 두고 있지 않으므로, 법률상의 방식을 위반한 재심청구라는 이유로 기각결정이 있더라도, 청구인이 이를 보정한다면 다시 동일한 이유로 재심청구를 할 수 있다. [2022모509]", "비상구제특별절차"],
["1270", "★ 재심청구를 받은 법원은 필요하다고 인정한 때에는 직권으로 재심청구의 이유에 대한 사실조사를 할 수 있고, 소송당사자는 법원에 대하여 그러한 사실조사를 신청할 권리를 갖는다.", false, "▸ 제431조에 의하여 직권으로 재심청구의 이유에 대한 사실조사를 할 수 있으나, 소송당사자에게 사실조사신청권이 있는 것이 아니다. 당사자가 사실조사신청을 한 경우에도 이는 단지 법원의 직권발동을 촉구하는 의미밖에 없다. [2019모3554]", "비상구제특별절차"],
["1271", "★ 재심개시의 결정이 확정한 사건에 대하여 법원은 그 심급에 따라 다시 심판하는데, 재심사건에서는 재심대상판결의 기초가 된 증거와 재심사건의 심리과정에서 제출된 증거를 모두 종합하여 공소사실이 인정되는지를 새로이 판단하여야 한다.", true, "▸ '다시' 심판한다는 것은 재심대상판결의 당부를 심사하는 것이 아니라 피고사건 자체를 처음부터 새로 심판하는 것이므로, 재심사건에서는 재심대상판결의 기초가 된 증거와 재심사건의 심리과정에서 제출된 증거를 모두 종합하여 새로이 판단하여야 한다. [2014도2946]", "비상구제특별절차"],
["1272", "★ 재심심판절차에서는 재심대상사건에 일반절차로 진행 중인 별개의 형사사건을 병합하여 심리하는 것은 허용되지 않는다.", true, "▸ 재심심판절차에서는 재심대상사건에 일반절차로 진행 중인 별개의 형사사건을 병합하여 심리하는 것은 허용되지 않는다. [2018도20698]", "비상구제특별절차"],
["1273", "★ 재심심판절차에서 검사가 재심대상사건과 별개의 공소사실을 추가하는 내용으로 공소장을 변경하는 것은 허용된다.", false, "▸ 재심심판절차에서는 특별한 사정이 없는 한 검사가 재심대상사건과 별개의 공소사실을 추가하는 내용으로 공소장을 변경하는 것은 허용되지 않는다. [2018도20698]", "비상구제특별절차"],
["1274", "★ 재심청구사건에서도 증거보전절차는 허용된다.", false, "▸ 증거보전절차는 제1심 제1회 공판기일전에 한하여 허용되는 것이므로 재심청구사건에서는 허용되지 아니한다. [84모15]", "비상구제특별절차"],
["1275", "★ 재심이 개시된 사건에서 범죄사실에 대하여 적용하여야 할 법령은 재심판결 당시의 법령이다.", true, "▸ 재심이 개시된 사건에서 범죄사실에 대하여 적용하여야 할 법령은 재심판결 당시의 법령이고, 재심대상판결 당시의 법령이 변경된 경우 법원은 재심판결 당시의 법령을 적용하여야 한다. [2017도12356]", "비상구제특별절차"],
["1276", "★ 재심이 개시된 사건에서 재심대상판결 당시의 법령이 폐지된 경우에는 「형사소송법」제326조 제4호를 적용하여 면소를 선고하는 것이 원칙이다.", true, "▸ 재심사건에서 범죄사실에 대하여 적용하여야 할 법령은 재심판결 당시의 법령이고, 재심대상판결 당시의 법령이 폐지된 경우에는 형소법 제326조 제4호를 적용하여 면소를 선고하는 것이 원칙이다. [2010도5986]", "비상구제특별절차"],
["1277", "★ 재심심판절차에서 사망자를 위하여 재심청구를 하였거나, 유죄의 선고를 받은 자가 재심판결 전에 사망한 경우, 공소기각결정을 할 수 없고 실체판결을 하여야 한다.", true, "▸ 사망자 또는 회복할 수 없는 심신장애인을 위하여 재심의 청구가 있는 때 또는 유죄의 선고를 받은 자가 재심의 판결 전에 사망하거나 회복할 수 없는 심신장애인으로 된 때에는 제328조 제1항 제2호의 규정은 적용하지 아니한다(제438조 제2항). 실체판결을 하여야 한다.", "비상구제특별절차"],
["1278", "★ '재심에는 원판결의 형보다 중한 형을 선고하지 못한다'라는 것은 단순히 원판결보다 무거운 형 선고를 금지하는 데 그치는 것이 아니라, 피고인의 법적 안정성을 해치지 않는 범위 내에서 재심이 이루어져야 한다는 취지이다.", true, "▸ '재심에는 원판결의 형보다 중한 형을 선고하지 못한다'라는 것은 단순히 원판결보다 무거운 형 선고를 금지하는 데 그치지 않고 피고인의 법적 안정성을 해치지 않는 범위 내에서 재심이 이루어져야 한다는 취지이다. [2018도13150]", "비상구제특별절차"],
["1279", "★ 「형사소송법」은 원칙적으로 피고인의 이익을 위해 피고인의 법적 안정성을 해치지 않는 범위 내에서 재심이 이루어지도록 하고 있으며, 예외적으로 실체적 진실발견을 위해 이른바 불이익재심도 허용한다.", false, "▸ 형소법은 유죄의 확정판결과 항소 또는 상고의 기각판결에 대하여 각 그 선고를 받은 자의 이익을 위하여 재심을 청구할 수 있다고 규정함으로써 피고인에게 이익이 되는 이른바 이익재심만을 허용하고 있다. [2018도13150]", "비상구제특별절차"],
["1280", "★ 재심대상사건에서 징역형의 집행유예를 선고하였음에도 재심사건에서 원판결보다 주형을 경하게 하고 집행유예를 없앤 경우 불이익변경금지원칙에 위배된다.", true, "▸ 재심대상사건에서 징역형의 집행유예를 선고하였음에도 재심사건에서 주형을 경하게 하고 집행유예를 없앤 경우는 불이익변경금지원칙에 위배된다. [2016도1131]", "비상구제특별절차"],
["1281", "★ 집행유예기간 도과 후 개시된 재심절차에서 법원이 해당 공소사실에 대하여 벌금형을 선고하더라도 원판결이 선고한 형보다 중하지 않다면 불이익변경금지의 원칙에 위반되지 않는다.", true, "▸ 원판결이 선고한 집행유예가 실효 또는 취소됨이 없이 유예기간이 지난 후에 새로운 형을 정한 재심판결이 선고되는 경우에도, 재심판결의 형이 원판결의 형보다 중하지 않다면 불이익변경금지의 원칙이나 이익재심의 원칙에 반한다고 볼 수 없다. [2015도15782]", "비상구제특별절차"],
["1282", "★ 경합범 관계에 있는 수개의 범죄사실을 유죄로 인정하여 한 개의 형을 선고한 불가분의 확정판결 중 일부의 범죄사실에 대하여만 재심청구의 이유가 있는 것으로 인정된 경우, 재심사유가 없는 죄에 대한 재심법원의 새로운 양형은 이중처벌금지 위반은 아니며 불이익변경금지원칙에 따라 원판결의 형보다 중한 형을 선고하지 못할 뿐이다.", true, "▸ 재심사유 없는 죄에 대한 새로운 양형은 이중처벌금지 위반이 아니고, 다만 불이익변경금지원칙에 따라 원판결의 형보다 중한 형을 선고하지 못할 뿐이다. [2015도15782]", "비상구제특별절차"],
["1283", "★ 유죄의 확정판결 등에 대해 재심개시결정이 확정된 후 재심심판절차가 진행 중이라는 것만으로는 확정판결의 존재 내지 효력을 부정할 수 없다.", true, "▸ 재심개시결정이 확정된 후 재심심판절차가 진행 중이라는 것만으로는 확정판결의 존재 내지 효력을 부정할 수 없다.", "비상구제특별절차"],
["1284", "★ 재심심판절차는 원판결의 당부를 심사하는 종전 소송절차의 후속절차가 아니라 사건 자체를 처음부터 다시 심판하는 완전히 새로운 소송절차로서, 종전의 확정판결은 재심판결이 확정된 때 효력을 상실한다.", true, "▸ 재심심판절차는 완전히 새로운 소송절차이고, 종전의 확정판결은 재심판결이 확정된 때 효력을 상실한다. [2018도13382]", "비상구제특별절차"],
["1285", "★ 유죄의 확정판결을 받은 사람이 그 후 별개의 후행범죄를 저질렀는데 유죄의 확정판결에 대하여 재심이 개시된 경우, 후행범죄와 재심판결이 확정된 선행범죄 사이에는 「형법」제37조 후단에서 정한 경합범이 성립한다.", false, "▸ 재심대상판결 이후 범죄는 선행범죄와 제37조 후단의 경합범 관계에 있지 아니하므로, 재심대상판결 이전 범죄와 재심대상판결 이후 범죄는 형법 제37조 전단의 경합범 관계로 취급할 수 없어 별도로 형을 정하여 선고하여야 한다. [2023도10545]", "비상구제특별절차"],
["1286", "★ 상습범으로 유죄의 확정판결을 받은 사람이 그 후 동일한 습벽에 의해 범행을 저질렀는데 유죄의 확정판결에 대하여 재심이 개시된 경우, 후행범죄가 재심대상판결에 대한 재심판결 선고 전에 저지른 범죄라면 재심판결의 기판력은 후행범죄에 미친다.", false, "▸ 동일한 습벽에 의한 후행범죄가 재심대상판결에 대한 재심판결 선고 전에 저질러진 범죄라 하더라도 재심판결의 기판력이 후행범죄에 미치지 않는다. [2018도20698]", "비상구제특별절차"],
["1287", "★ 재심판결에서 피고인에게 또 다시 집행유예를 선고할 경우, 그 집행유예 기간의 시기는 재심대상판결의 확정일이 아니라 재심판결의 확정일로 보아야 한다.", true, "▸ 재심판결에서 피고인에게 또 다시 집행유예를 선고할 경우 그 집행유예 기간의 시기는 재심대상판결의 확정일이 아니라 '재심판결'의 확정일로 보아야 한다. [2018도13382]", "비상구제특별절차"],
["1288", "★ 재심대상판결을 전제로 누범가중한 판결도 재심판결 확정으로 효력을 상실한다.", true, "▸ 재심판결이 확정됨으로써 재심대상판결은 당연히 효력을 상실하므로, 재심대상판결을 전제로 누범가중한 판결도 더 이상 유지될 수 없어 효력을 상실한다. [2017도4019]", "비상구제특별절차"],
["1289", "★ 비상상고의 공판기일에는 검사와 피고인이 출석해야 한다.", false, "▸ 비상상고 공판기일에는 검사가 출석하여야 하지만, 피고인의 출석은 요건이 아니다(제389조의2).", "비상구제특별절차"],
["1290", "★ 상고기각의 결정이 법령에 위반한 때에는 비상상고를 할 수 있다.", true, "▸ 상고기각의 결정은 공소심판을 확정시키는 효력이 있는 해당사건에 관한 종국적인 재판이므로 그 결정에 대하여 법령위반이 있음을 발견한 때에는 비상상고를 할 수 있다. [62오이]", "비상구제특별절차"],
["1291", "★ 법원이 원판결 선고 전에 피고인이 이미 사망한 사실을 알지 못하여 실체판결에 나아감으로써 법령위반의 결과를 초래하였다 하더라도, 이는 형소법 제441조에 정한 '그 심판이 법령에 위반한 것'에 해당하지 않는다.", true, "▸ 법원이 원판결의 선고 전에 피고인이 이미 사망한 사실을 알지 못하여 실체판결에 나아감으로써 법령위반의 결과를 초래하였다 하더라도, 이는 형소법 제441조에 정한 '그 심판이 법령에 위반한 것'에 해당한다고 볼 수 없다. [2004오2]", "비상구제특별절차"],
["1292", "★ 항소심 법원이 적법한 증거조사의 절차를 거치지 않고 증거능력이 없는 증거를 유죄의 증거로 채택하였다면 법령에 위반한 것으로서 비상상고의 이유가 된다.", true, "▸ 항소심 법원이 적법한 증거조사 절차를 거치지 않고 증거능력 없는 증거를 유죄의 증거로 채택한 것은 비상상고 이유가 된다. [64오2]", "비상구제특별절차"],
["1293", "★ 즉결심판절차에서 허용되는 범위를 넘는 벌금 30만 원의 즉결심판을 선고한 것은 심판이 법령에 위반한 경우에 해당하여 비상상고의 이유가 된다.", true, "▸ 즉결심판에 관한 절차법 제2조에 의하면 즉결심판은 벌금 20만 원을 초과하지 않는 범위 내에서만 가능한데, 이를 초과하는 벌금 30만 원의 즉결심판을 선고한 것은 심판이 법령에 위반한 경우에 해당하여 비상상고의 이유가 된다. [2014오3]", "비상구제특별절차"],
["1294", "★ 피해자에게 환부하여야 할 압수물건을 약식명령으로 몰수한 것은 법령에 위반한 경우에 해당하여 비상상고의 이유가 된다.", true, "▸ 피해자에게 환부하여야 할 압수물건을 약식명령으로 몰수한 것은 비상상고 이유가 된다. [4293비상1]", "비상구제특별절차"],
["1295", "★ 상급심의 파기판결에 의해 효력을 상실한 재판은 비상상고의 대상이 될 수 없다.", true, "▸ 상급심의 파기판결에 의해 효력을 상실한 재판은 비상상고의 대상이 될 수 없다. [2019오1]", "비상구제특별절차"],
["1296", "★ 비상상고에서 원판결을 파기하고 피고사건에 대하여 다시 판결하는 경우에도 그 효력은 피고인에게 미치지 아니한다.", true, "▸ 제447조에 따라 비상상고에서 원판결을 파기하고 피고사건에 대하여 다시 판결을 하는 경우에도 그 효력은 피고인에게 미치지 아니한다.", "비상구제특별절차"],
["1297", "★ 피고인에 대한 처벌불원 의사표시가 있었는데도 제327조 제6호에 의하여 공소기각의 판결을 선고하지 않고 유죄판결을 선고하였다면 제441조에서 정한 법령위반의 사유가 있고, 피고인에게 불이익하므로 파기하고 다시 판결을 해야 한다.", true, "▸ 처벌불원 의사표시가 있었는데도 공소기각 판결을 선고하지 않고 유죄판결을 선고한 것은 비상상고 이유가 되고, 피고인에게 불이익하므로 파기하고 다시 판결을 해야 한다. [2009오1]", "비상구제특별절차"],
["1298", "★ 원심소송절차의 법령위반이 있어 비상상고가 이유 있다고 인정한 때에는 원판결을 파기하지 않고 위반된 절차만을 파기한다.", true, "▸ 원심소송절차가 법령에 위반한 때에는 그 위반된 절차를 파기한다(제446조 제2호). 원판결이 법령에 위반한 때에는 그 위반된 부분을 파기하고, 피고인에게 불이익한 때에는 원판결을 파기하고 다시 판결한다(제446조 제1호).", "비상구제특별절차"],
["1299", "★ 약식명령 청구의 대상은 지방법원의 관할에 속하는 벌금, 과료, 몰수에 처할 수 있는 사건이다.", true, "▸ 제448조 제1항에 따라 약식명령 청구의 대상은 지방법원의 관할에 속하는 벌금, 과료, 몰수에 처할 수 있는 사건이다.", "비상구제특별절차"],
["1300", "★ 약식절차에서도 피고인의 이익을 위하여 무죄나 면소, 공소기각의 재판을 할 수 있다.", true, "▸ 약식절차에서도 피고인의 이익을 위하여 무죄나 면소, 공소기각의 재판을 할 수 있다(제448조 제1항).", "비상구제특별절차"],
["1301", "★ 공문서부정행사죄는 벌금형 이외에 징역형이 규정되어 있으나 벌금이 선택적으로 규정되어 있으므로 검사는 이 범죄 혐의에 대해서 약식명령을 청구할 수 있다.", true, "▸ 법정형에 벌금형이 선택적으로 규정되어 있으면 약식명령 청구가 가능하므로, 징역형과 벌금형이 선택적으로 규정된 공문서부정행사죄도 약식명령 청구 대상이 된다.", "비상구제특별절차"],
["1302", "★ 법정형에 벌금·과료·몰수의 형이 선택적으로 규정되어 있으면, 지방법원합의부의 관할에 속하는 사건이더라도 약식명령청구의 대상이 될 수 있다.", true, "▸ 사물관할의 제한을 받지 않으므로 단독·합의부 관할 사건인지는 약식명령과 관련이 없다(제448조).", "비상구제특별절차"],
["1303", "★ 검사 또는 피고인은 약식명령의 고지를 받은 날로부터 7일 이내에 정식재판의 청구를 할 수 있다.", true, "▸ 제453조에 따라 검사 또는 피고인은 약식명령의 고지를 받은 날로부터 7일 이내에 정식재판의 청구를 할 수 있다.", "비상구제특별절차"],
["1304", "★ 약식명령은 재판서를 피고인에게 송달함으로써 효력이 발생하고, 정식재판 청구기간은 피고인에 대한 약식명령 고지일을 기준으로 하여 기산하여야 한다.", true, "▸ 약식명령은 재판서를 피고인에게 송달함으로써 효력이 발생하고, 변호인이 있는 경우라도 반드시 변호인에게 약식명령 등본을 송달해야 하는 것은 아니므로, 정식재판 청구기간은 피고인에 대한 약식명령 고지일을 기준으로 기산하여야 한다. [2017모1557]", "비상구제특별절차"],
["1305", "★ 기명날인 없는 정식재판청구서를 법원공무원이 보정 없이 접수한 경우 법원은 위 정식재판청구에 대하여 기각결정을 할 수 없다.", false, "▸ 정식재판청구서에 청구인의 기명날인 또는 서명이 없다면 법령상의 방식을 위반한 것으로서 기각하여야 한다. 다만 이러한 법원공무원의 잘못으로 인하여 정식재판청구기간을 넘기게 되었다면 피고인은 '책임질 수 없는 사유'로 청구기간 내에 정식재판을 청구하지 못한 때에 해당하여 정식재판청구권의 회복을 구할 수 있다. [2022모1872]", "비상구제특별절차"],
["1306", "★ 약식명령의 청구가 있는 경우에 그 사건이 약식명령으로 할 수 없거나 약식명령으로 하는 것이 적당하지 아니하다고 인정한 때에는 법원은 공판절차에 의하여 심판하여야 한다.", true, "▸ 제450조에 따라 약식명령으로 할 수 없거나 적당하지 아니하다고 인정한 때에는 공판절차에 의하여 심판하여야 한다.", "비상구제특별절차"],
["1307", "★ 약식명령은 정식재판청구에 의한 판결이 있는 때에는 그 효력을 잃는다.", true, "▸ 제456조에 따라 약식명령은 정식재판청구에 의한 판결이 있는 때에는 그 효력을 잃는다.", "비상구제특별절차"],
["1308", "★ 약식명령청구서에 공소사실을 기재함에 있어 타문서인 고발장에 기재된 범죄사실을 인용한 경우에는 제254조의 '공소사실의 기재'라고는 할 수 없어 그 절차가 법률에 위반하여 무효인 공소제기에 해당한다.", true, "▸ 약식명령청구서에 타문서인 고발장에 기재된 범죄사실을 인용한 경우에는 적법한 공소사실의 기재가 없어 무효인 공소제기에 해당한다. [4288형상212]", "비상구제특별절차"],
["1309", "★ 정식재판절차의 공판기일에 정식재판을 청구한 피고인이 출석하지 아니한 때에는 다시 기일을 정하여야 하고, 피고인이 정당한 사유 없이 다시 정한 기일에 출정하지 아니한 때에는 피고인의 진술 없이 판결을 할 수 있다.", true, "▸ 제458조 제2항, 제365조에 따라 피고인이 불출석한 경우 다시 기일을 정하여야 하고, 재차 불출석 시 진술 없이 판결할 수 있다.", "비상구제특별절차"],
["1310", "★ 피고인만이 벌금 200만 원의 약식명령에 불복하여 정식재판을 청구한 경우, 정식재판을 담당하는 법원은 약식명령보다 중한 벌금 300만 원을 선고할 수 있다.", true, "▸ 형종상향금지 원칙이 적용되므로, 동일한 형종인 벌금형을 선고한다면 벌금을 더 중하게 선고할 수 있다(제457조의2 제1항).", "비상구제특별절차"],
["1311", "★ 「형사소송법」제457조의2 제1항에서 규정하는 형종상향금지 원칙은 피고인만이 정식재판을 청구한 사건과 다른 사건이 병합심리된 후 경합범으로 처단되는 경우에도 정식재판을 청구한 사건에 대하여 그대로 적용되며, 이는 피고인만이 정식재판을 청구해 벌금형이 선고된 제1심판결에 대한 항소사건에서도 마찬가지이다.", true, "▸ 형종상향금지 원칙은 병합심리 후 경합범으로 처단되는 경우에도 적용되고(2020도355), 벌금형이 선고된 제1심판결에 대한 항소사건에서도 마찬가지로 적용된다(2020도1634).", "비상구제특별절차"],
["1312", "★ 피고인이 정식재판을 청구한 제2사건에 대해 항소심에서 제1사건과 병합 후 약식명령의 벌금형보다 중한 종류의 형인 징역형을 선택한 다음 경합범가중 등을 거쳐 하나의 징역형을 선고한 것은 형종상향금지 원칙에 위반되지 아니한다.", false, "▸ 제2사건에 대해 약식명령의 벌금형보다 중한 종류의 형인 징역형을 선택한 다음 경합범가중 등을 거쳐 하나의 징역형을 선고한 것은 형종상향금지 원칙에 위반된다. [2020도355]", "비상구제특별절차"],
["1313", "★ 즉결심판에 대한 정식재판청구가 법령상의 방식에 위반하거나 청구권의 소멸 후인 것이 명백한 때에는 결정으로 기각하여야 하며, 이 결정에 대하여는 즉시항고를 할 수 있다.", true, "▸ 즉결심판에 관한 절차법 제14조 제4항, 형소법 제455조 제1항, 제2항에 따라 정식재판청구를 기각하는 결정에 대해 즉시항고를 할 수 있다.", "비상구제특별절차"],
["1314", "★ 즉결심판절차에서도 자백보강법칙은 적용되므로, 피고인의 자백만 있고 보강증거가 없으면 유죄를 선고할 수 없다.", false, "▸ 즉결심판절차에 있어서는 형소법 제310조(자백보강법칙)의 규정은 적용하지 아니한다(즉결심판에 관한 절차법 제10조). 자백만으로도 유죄 선고가 가능하다.", "비상구제특별절차"],
["1315", "★ 즉결심판절차에서 사법경찰관이 적법한 절차와 방식에 따라 작성한 피의자신문조서는 그 피의자였던 피고인이 내용을 인정하지 않더라도 증거능력이 있고, 자백에 대한 보강증거는 요하지 않으나 자백배제법칙은 여전히 적용된다.", true, "▸ 즉결심판절차에서는 형소법 제310조(자백보강법칙), 제312조 제3항(사법경찰관이 작성한 피의자신문조서의 증거능력) 및 제313조의 규정은 적용하지 아니한다. 자백배제법칙에 대해서는 증거능력의 예외 규정이 없으므로 그대로 적용된다(즉결심판에 관한 절차법 제10조).", "비상구제특별절차"]
