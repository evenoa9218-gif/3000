["536", "★ 예비와 미수는 각각 형법각칙에 처벌규정이 있는 경우에만 처벌할 수 있지만, 구체적인 법정형까지 규정될 필요는 없으므로, 법률에 특정 범죄에 대하여 \"예비·음모는 이를 처벌한다\"라고 규정하여 놓았으나 예비·음모의 형에 관하여 특별한 규정이 없는 경우에는 예비음모를 본범이나 미수범에 준하여 처벌한다고 해석할 수 있다.[변14]", false, "▸ 형법 제28조에 의하면 범죄의 예비 또는 음모는 특별한 죄형규정이 있을 때에 한하여 처벌할 수 있는데, 특정 법률에서 예비·음모·미수를 처벌한다고만 규정하고 그 형에 관한 규정을 두지 않은 경우, 이를 본범이나 미수범에 준하여 처벌하는 것은 죄형법정주의 원칙상 허용될 수 없어 결국 처벌할 수 없다는 것이 판례의 태도이다(78도957).\n\n[제4절 참고 - 예비·음모 조문] 형법 제28조(음모, 예비): 범죄의 음모 또는 예비행위가 실행의 착수에 이르지 아니한 때에는 법률에 특별한 규정이 없는 한 벌하지 아니한다.", "미수론"],
["537", "★ 자신을 죽여달라는 친구의 부탁을 받고 독약을 준비하였다가 이를 버린 경우 촉탁살인죄의 예비죄로 처벌할 수 있다.[변17]", false, "▸ 살인·존속살인(제250조)과 위계등에 의한 촉탁살인등(제253조)은 예비·음모를 처벌하지만, 촉탁·승낙살인 및 자살교사·방조는 예비·음모를 처벌하는 규정이 없다.\n\n[제4절 참고 - 예비·음모 조문] 형법 제28조(음모, 예비): 범죄의 음모 또는 예비행위가 실행의 착수에 이르지 아니한 때에는 법률에 특별한 규정이 없는 한 벌하지 아니한다.", "미수론"],
["538", "법률이 예비행위만을 형사처벌하고 있는 경우, 2인 이상이 범행을 음모하여도 이를 예비죄로 처벌할 수 없다.", true, "▸ 일본으로 밀항하고자 상대방에게 도항비로 일화 100만 엔을 주기로 약속한 바 있었으나 그 후 밀항을 포기하였다면 이는 밀항의 음모에 지나지 않는 것으로 밀항의 예비 정도에는 이르지 아니한 것이다(86도437).\n\n[제4절 참고 - 예비·음모 조문] 형법 제28조(음모, 예비): 범죄의 음모 또는 예비행위가 실행의 착수에 이르지 아니한 때에는 법률에 특별한 규정이 없는 한 벌하지 아니한다.", "미수론"],
["539", "살인의 용도에 공하기 위한 흉기를 준비하였다고 하더라도 그 흉기로 살해할 대상자가 확정되지 아니하였다면 살인예비죄로 다스릴 수 없다.", true, "▸ (4292형상387)\n\n[제4절 참고 - 예비·음모 조문] 형법 제28조(음모, 예비): 범죄의 음모 또는 예비행위가 실행의 착수에 이르지 아니한 때에는 법률에 특별한 규정이 없는 한 벌하지 아니한다.", "미수론"],
["540", "흉기를 휴대하거나 2명 이상이 합동하여 피해자에 대하여 강제추행죄를 저지를 목적으로 예비 또는 음모한 자는 성폭력범죄의처벌등에관한특례법상 특수강제추행죄의 예비 또는 음모로 처벌된다.", true, "▸ 형법은 강간·유사강간, 준강간의 예비·음모만 처벌하고, 강제추행·준강제추행죄의 예비음모는 처벌하지 않는다. 성폭법은 특수강간뿐만 아니라 특수강제추행(특수유사강간 포함)의 예비·음모도 처벌한다(성폭법 제15조의2, 제4조).\n\n[제4절 참고 - 예비·음모 조문] 형법 제28조(음모, 예비): 범죄의 음모 또는 예비행위가 실행의 착수에 이르지 아니한 때에는 법률에 특별한 규정이 없는 한 벌하지 아니한다.", "미수론"],
["541", "인신매매할 목적으로 인신매매 대상자를 매수할 사람과 접촉하였다면, 인신매매죄의 예비음모죄로 처벌할 수 있다.", true, "▸ 인신매매죄는 예비·음모를 처벌한다(형법 제296조, 제289조).\n\n[제4절 참고 - 예비·음모 조문] 형법 제28조(음모, 예비): 범죄의 음모 또는 예비행위가 실행의 착수에 이르지 아니한 때에는 법률에 특별한 규정이 없는 한 벌하지 아니한다.", "미수론"],
["542", "통화를 위조하려고 예비한 자가 실행에 이르기 전에 자수한 때에는 그 형을 감경 또는 면제할 수 있다.", false, "▸ 형법 제207조 제1항 내지 제3항(통화위조·변조)의 죄를 범할 목적으로 예비 또는 음모한 자는 5년 이하의 징역에 처하되, 그 목적한 죄의 실행에 이르기 전에 자수한 때에는 그 형을 반드시 감경 또는 면제한다(제213조, 필요적 감면).\n\n[제4절 참고 - 예비·음모 조문] 형법 제28조(음모, 예비): 범죄의 음모 또는 예비행위가 실행의 착수에 이르지 아니한 때에는 법률에 특별한 규정이 없는 한 벌하지 아니한다.", "미수론"],
["543", "내란목적살인죄를 범할 목적으로 음모하였으나 그 목적한 죄의 실행에 이르기 전에 자수한 자에 대하여는 그 형을 감경 또는 면제한다.", true, "▸ 형법 제87조(내란) 또는 제88조(내란목적살인)의 죄를 범할 목적으로 예비 또는 음모한 자는 3년 이상의 유기징역이나 유기금고에 처하되, 그 목적한 죄의 실행에 이르기 전에 자수한 때에는 그 형을 감경 또는 면제한다(제90조 제1항).\n\n[제4절 참고 - 예비·음모 조문] 형법 제28조(음모, 예비): 범죄의 음모 또는 예비행위가 실행의 착수에 이르지 아니한 때에는 법률에 특별한 규정이 없는 한 벌하지 아니한다.", "미수론"],
["544", "폭력행위처벌법위반(우범자)죄는 대상범죄인 '이 법에 규정된 범죄'의 예비죄로서의 성격을 지니고 있고, 폭력행위처벌법 제7조에서 말하는 '이 법에 규정된 범죄'란 '폭력행위처벌법에 규정된 범죄'만을 의미한다.", true, "▸ (2017도7687)\n\n[제4절 참고 - 예비·음모 조문] 형법 제28조(음모, 예비): 범죄의 음모 또는 예비행위가 실행의 착수에 이르지 아니한 때에는 법률에 특별한 규정이 없는 한 벌하지 아니한다.", "미수론"],
["545", "★ 살인예비죄가 성립하기 위하여 살인죄를 범할 목적 이외에 살인의 준비에 관한 고의가 있어야 하는 것은 아니다.[변21]", false, "▸ 살인예비죄가 성립하기 위해서는 살인죄를 범할 목적 외에도 살인의 준비에 관한 고의가 있어야 하며, 나아가 실행의 착수에는 이르지 않는 살인죄 실현을 위한 준비행위가 있어야 한다는 것이 판례의 태도이다(2009도7150).\n\n[제4절 참고 - 예비·음모 조문] 형법 제28조(음모, 예비): 범죄의 음모 또는 예비행위가 실행의 착수에 이르지 아니한 때에는 법률에 특별한 규정이 없는 한 벌하지 아니한다.", "미수론"],
["546", "과실범에 대한 예비죄는 성립할 수 있지만 과실행위에 의한 예비죄는 성립할 수 없다.", false, "▸ 예비죄는 고의범이므로 예비죄가 성립하기 위해서는 고의가 있어야 한다. 따라서 과실에 의한 예비죄뿐 아니라 과실범에 대한 예비죄도 성립할 수 없다.\n\n[제4절 참고 - 예비·음모 조문] 형법 제28조(음모, 예비): 범죄의 음모 또는 예비행위가 실행의 착수에 이르지 아니한 때에는 법률에 특별한 규정이 없는 한 벌하지 아니한다.", "미수론"],
["547", "★ 살인예비죄가 성립하기 위해서는 살인죄의 실현을 위한 준비행위가 있어야 하는데, 여기서 준비행위는 반드시 객관적으로 보아 살인죄의 실현에 실질적으로 기여할 수 있는 외적 행위임을 요하지 아니하고 단순히 범행의 의사 또는 계획만으로 족하다.[변18]", false, "▸ 살인예비죄의 준비행위는 물적인 것에 한정되지 않고 특별한 정형이 있는 것도 아니지만, 단순히 범행의 의사나 계획만으로는 부족하고 객관적으로 보아 살인죄의 실현에 실질적으로 기여할 수 있는 외적 행위를 필요로 한다는 것이 판례의 태도이다(2009도7150).\n\n[제4절 참고 - 예비·음모 조문] 형법 제28조(음모, 예비): 범죄의 음모 또는 예비행위가 실행의 착수에 이르지 아니한 때에는 법률에 특별한 규정이 없는 한 벌하지 아니한다.", "미수론"],
["548", "★ 甲이 A를 살해하기 위하여 乙을 고용하면서 그에게 대가의 지급을 약속한 경우, 甲에게는 살인예비죄가 성립한다.", true, "▸ 甲이 A를 살해하기 위하여 乙 등을 고용하면서 그들에게 대가의 지급을 약속한 경우, 甲에게는 살인죄의 실현을 위한 준비행위를 하였음을 인정할 수 있어 살인예비죄가 성립한다는 것이 판례의 태도이다(2009도7150).\n\n[제4절 참고 - 예비·음모 조문] 형법 제28조(음모, 예비): 범죄의 음모 또는 예비행위가 실행의 착수에 이르지 아니한 때에는 법률에 특별한 규정이 없는 한 벌하지 아니한다.", "미수론"],
["549", "★ 「형법」상 음모죄의 성립을 위한 범죄실행의 합의가 있다고 하기 위하여는 단순히 범죄결심을 외부에 표시·전달하는 것만으로는 부족하고, 객관적으로 보아 특정한 범죄의 실행을 위한 준비행위라는 것이 명백히 인식되고, 그 합의에 실질적인 위험성이 인정되어야 한다.[변24]", true, "▸ (99도3801)\n\n[제4절 참고 - 예비·음모 조문] 형법 제28조(음모, 예비): 범죄의 음모 또는 예비행위가 실행의 착수에 이르지 아니한 때에는 법률에 특별한 규정이 없는 한 벌하지 아니한다.", "미수론"],
["550", "군인들인 피고인들이 수회에 걸쳐 총을 훔쳐 전역 후 은행이나 현금수송차량을 털어 '한탕 하자'는 말을 나눈 정도만으로는 강도음모를 인정하기에 부족하다.", true, "▸ (99도3801)\n\n[제4절 참고 - 예비·음모 조문] 형법 제28조(음모, 예비): 범죄의 음모 또는 예비행위가 실행의 착수에 이르지 아니한 때에는 법률에 특별한 규정이 없는 한 벌하지 아니한다.", "미수론"],
["551", "★ 살해의 목적으로 수차에 걸쳐 단순한 예비행위를 하거나 또는 공격을 가하였으나 미수에 그치다가 드디어 그 목적을 달성한 경우, 그 예비행위 내지 공격행위가 동일한 의사발동에서 나왔고 그 사이에 범의의 갱신이 없다고 하더라도, 각 행위가 다른 일시·장소에서 행하여졌고 그 방법이 동일하지 않다면, 살인예비 내지 미수죄와 기수죄의 경합죄로 처단하여야 한다.", false, "▸ 살해의 목적으로 수차에 걸쳐 단순한 예비행위를 하거나 공격을 가하였으나 미수에 그치다가 결국 목적을 달성한 경우, 그 예비행위 내지 공격행위가 동일한 의사발동에서 나왔고 그 사이에 범의의 갱신이 없는 한, 각 행위가 같은 일시·장소에서 행해졌든 다른 장소에서 행해졌든, 방법이 동일하든 아니든 관계없이 살해 목적을 달성할 때까지의 행위는 모두 실행행위의 일부로 포괄하여 단순 일죄인 살인기수죄로 처단해야 하고 살인예비 내지 미수죄와 기수죄의 경합범으로 처단할 수 없다(65도695).\n\n[제4절 참고 - 예비·음모 조문] 형법 제28조(음모, 예비): 범죄의 음모 또는 예비행위가 실행의 착수에 이르지 아니한 때에는 법률에 특별한 규정이 없는 한 벌하지 아니한다.", "미수론"],
["552", "형법각칙의 예비죄를 처단하는 규정을 바로 독립된 구성요건 개념에 포함시킬 수는 없다.", true, "▸ 형법각칙의 예비죄를 처단하는 규정을 바로 독립된 구성요건 개념에 포함시킬 수는 없다고 하는 것이 죄형법정주의의 원칙에도 합당한 해석이다(75도1549).\n\n[제4절 참고 - 예비·음모 조문] 형법 제28조(음모, 예비): 범죄의 음모 또는 예비행위가 실행의 착수에 이르지 아니한 때에는 법률에 특별한 규정이 없는 한 벌하지 아니한다.", "미수론"],
["553", "甲은 A가 자신의 집 금고에 보관하고 있는 현금을 강취하기로 마음먹고 乙에게 강도 범행에 필요하다고 말하고 칼을 빌려와 보관하고 있던 중 혼자서는 힘들다고 판단하여 범행을 포기하였다. 타인예비행위는 예비행위에 포함되지 않는다는 견해에 따르면, 乙은 무죄이다.[모25]", true, "▸ 타인예비행위는 예비행위에 포함되지 않는다는 견해에 따르면, 乙은 예비의 공동정범으로 볼 수 없고, 乙에게 타인예비가 성립하지 않으며, 예비의 방조도 성립할 수 없다.\n\n[제4절 참고 - 예비·음모 조문] 형법 제28조(음모, 예비): 범죄의 음모 또는 예비행위가 실행의 착수에 이르지 아니한 때에는 법률에 특별한 규정이 없는 한 벌하지 아니한다.", "미수론"],
["554", "★ 정범이 실행에 착수하지 아니하는 한 예비의 공동정범은 성립할 수 없다.[변17]", false, "▸ 정범이 실행의 착수에 이르지 아니한 예비의 단계에 그친 경우에는 이에 가공하는 행위가 예비의 공동정범이 되는 경우를 제외하고는 이를 종범(방조범)으로 처벌할 수 없다(75도1549).\n\n[제4절 참고 - 예비·음모 조문] 형법 제28조(음모, 예비): 범죄의 음모 또는 예비행위가 실행의 착수에 이르지 아니한 때에는 법률에 특별한 규정이 없는 한 벌하지 아니한다.", "미수론"],
["555", "★ 甲과 乙이 공동하여 강도하기로 공모하고 함께 협박에 사용할 등산용 칼을 구입하였으나 실행의 착수에 이르지 못한 경우, 강도예비죄의 공동정범이 된다.[변12]", true, "▸ 정범이 실행의 착수에 이르지 아니한 예비의 단계에 그친 경우에는 이에 가공하는 행위가 예비의 공동정범이 되는 경우를 제외하고는 이를 종범(방조범)으로 처벌할 수 없다(75도1549).\n\n[제4절 참고 - 예비·음모 조문] 형법 제28조(음모, 예비): 범죄의 음모 또는 예비행위가 실행의 착수에 이르지 아니한 때에는 법률에 특별한 규정이 없는 한 벌하지 아니한다.", "미수론"],
["556", "★ 정범의 강도예비행위를 방조하였으나 정범이 실행의 착수에 이르지 못한 경우 정범은 강도예비죄로 처벌되므로, 방조자는 강도예비죄의 방조범에 해당한다.[변15]", false, "▸ 정범이 실행의 착수에 이르지 아니한 예비의 단계에 그친 경우에는 이에 가공하는 행위가 예비의 공동정범이 되는 경우를 제외하고는 이를 종범(방조범)으로 처벌할 수 없다(75도1549).\n\n[제4절 참고 - 예비·음모 조문] 형법 제28조(음모, 예비): 범죄의 음모 또는 예비행위가 실행의 착수에 이르지 아니한 때에는 법률에 특별한 규정이 없는 한 벌하지 아니한다.", "미수론"],
["557", "★ 甲은 A가 자신의 집 금고에 보관하고 있는 현금을 강취하기로 마음먹고 乙에게 강도 범행에 필요하다고 말하고 칼을 빌려와 보관하고 있던 중 혼자서는 힘들다고 판단하여 범행을 포기하였다. 방조범이 성립하기 위하여 방조행위와 정범의 실행행위 사이에 인과관계가 필요 없다는 견해에 따르면, 乙이 甲에게 칼을 빌려준 이상 乙에게는 방조범이 성립한다.[모25]", false, "▸ 정범이 실행의 착수에 이르지 아니한 예비의 단계에 그친 경우에는 이에 가공하는 행위가 예비의 공동정범이 되는 경우를 제외하고는 이를 종범(방조범)으로 처벌할 수 없다(75도1549).\n\n[제4절 참고 - 예비·음모 조문] 형법 제28조(음모, 예비): 범죄의 음모 또는 예비행위가 실행의 착수에 이르지 아니한 때에는 법률에 특별한 규정이 없는 한 벌하지 아니한다.", "미수론"],
["558", "★ 甲은 강도의 고의를 가지고 가스총을 주머니에 넣은 채 좁은 골목길이 복잡하게 얽혀 있는 동네 길목에서 '표적'을 기다리다가 양심의 가책을 받아 범행을 포기하였더라도 甲에게는 형법 제26조(중지범)가 적용될 수 없다.[변12]", true, "▸ 중지범은 범죄의 실행에 착수한 후 자의로 그 행위를 중지한 때를 말하는 것이고, 실행의 착수가 있기 전인 예비음모의 행위를 처벌하는 경우에 있어서는 중지범의 관념은 이를 인정할 수 없다(91도436).\n\n[제4절 참고 - 예비·음모 조문] 형법 제28조(음모, 예비): 범죄의 음모 또는 예비행위가 실행의 착수에 이르지 아니한 때에는 법률에 특별한 규정이 없는 한 벌하지 아니한다.", "미수론"],
["559", "★ 2인 이상의 자가 범죄실행을 합의하고 그 합의에 실질적인 위험성이 인정되는 경우, 자신의 범의를 스스로 포기함으로써 실행의 착수로 나아가지 아니할 뿐만 아니라 다른 공모자의 범죄실행의 착수까지도 중지시키면, 스스로 포기하여 중지한 자는 예비죄의 중지범, 다른 예비자는 예비죄로 처벌된다.", false, "▸ 중지범은 범죄의 실행에 착수한 후 자의로 그 행위를 중지한 때를 말하는 것이고, 실행의 착수가 있기 전인 예비음모의 행위를 처벌하는 경우에 있어서는 중지범의 관념은 이를 인정할 수 없다(91도436).\n\n[제4절 참고 - 예비·음모 조문] 형법 제28조(음모, 예비): 범죄의 음모 또는 예비행위가 실행의 착수에 이르지 아니한 때에는 법률에 특별한 규정이 없는 한 벌하지 아니한다.", "미수론"],
["560", "★ 甲은 A가 자신의 집 금고에 보관하고 있는 현금을 강취하기로 마음먹고 乙에게 강도 범행에 필요하다고 말하고 칼을 빌려와 보관하고 있던 중 혼자서는 힘들다고 판단하여 범행을 포기하였다. 甲은 강도예비·음모죄의 중지미수로 처벌된다.[모25]", false, "▸ 중지범은 범죄의 실행에 착수한 후 자의로 그 행위를 중지한 때를 말하는 것이고, 실행의 착수가 있기 전인 예비음모의 행위를 처벌하는 경우에 있어서는 중지범의 관념은 이를 인정할 수 없다(91도436).\n\n[제4절 참고 - 예비·음모 조문] 형법 제28조(음모, 예비): 범죄의 음모 또는 예비행위가 실행의 착수에 이르지 아니한 때에는 법률에 특별한 규정이 없는 한 벌하지 아니한다.", "미수론"],
["561", "확장적 정범개념에 의하면 형법이 방조범을 별도로 규정하여 형을 필요적 감경하도록 해놓은 것은 형벌축소사유에 해당한다.", true, "▸ 확장적 정범개념에 의하면 직접·간접으로 구성요건실현에 조건을 제공한 모든 자는 정범이 되므로, 교사·방조범 처벌규정은 형벌축소사유에 해당한다.", "공범론"],
["562", "제한적 정범개념이론에 따르면 구성요건적 행위 이외의 다른 행위에 의하여 결과야기에 가공한 자는 정범이 될 수 없다.", true, "▸ 제한적 정범개념이론은 구성요건적 행위를 스스로 한 자만이 정범이고, 구성요건 이외의 행위로 결과에 조건을 준 자는 정범이 될 수 없다는 이론이다.", "공범론"],
["563", "정범과 공범의 구별 기준 가운데 행위자의 외부적 행위태양을 중시하는 견해에 비해 행위자의 내면적 의도를 중시하는 견해를 취하는 경우, 간접정범과 교사범을 구별하기 어렵다.[변26]", false, "▸ 형식적 객관설은 구성요건적 실행행위의 전부·일부를 직접 수행한 자가 정범이고 그 외의 자는 공범이라는 견해로, 간접정범을 정범으로 인정할 수 없다는 문제가 있다. 실질적 객관설은 행위기여의 위험성 정도에 따라 결과발생에 직접 원인이 된 경우 정범, 단순한 조건에 불과한 경우 공범이라는 견해로, 간접정범과 교사범을 구별할 수 없다는 문제가 있다. 반면 행위자의 주관적 의사를 중시하는 주관설(의사설·이익설)에 의하면 간접정범과 교사범을 구별할 수 있다.", "공범론"],
["564", "★ 甲이 乙에게 A의 주거에 침입할 것을 교사했는데 乙이 A의 승낙을 얻어 정당하게 주거에 들어간 경우 공범종속성설 중 제한적 종속형식에 의하면 甲은 주거침입죄의 교사범이 성립하지 않는다.[변14]", true, "▸ 주거침입죄에서 피해자의 승낙은 구성요건해당성을 조각하는 '양해'에 해당한다(2018도15213). 판례는 제한적 종속형식의 입장이다(2005도3707 참조). 따라서 정범 乙의 행위는 구성요건해당성이 없으므로, 제한적 종속형식과 극단적 종속형식 모두에 의할 때 甲에게 주거침입죄의 교사범이 성립하지 않는다.\n\n[제1절 참고 - 공범종속성 학설 정리] 공범독립성설: 공범의 가벌성은 정범의 실행행위와 무관하게 그 자체로 성립하며, 정범의 실행착수를 요하지 않는다(주관주의). 공범종속성설(통설·판례): 공범의 성립은 정범의 실행행위를 전제로 한다. 그 종속의 정도에 따라 ① 최소한 종속형식(정범이 구성요건에만 해당하면 족함), ② 제한적 종속형식(통설·판례, 정범이 구성요건에 해당하고 위법하면 족하며 책임까지는 불요), ③ 극단적 종속형식(정범이 구성요건에 해당하고 위법하며 책임까지 있어야 함), ④ 초극단적 종속형식(정범에게 처벌조건까지 구비되어야 함)으로 나뉜다. 제한적 종속형식에 의하면 정범에게 책임이 없는 경우(예: 책임무능력자)에도 의사지배가 있으면 간접정범, 의사지배가 없으면 교사·방조범이 성립할 수 있는 반면, 극단적 종속형식에 의하면 정범에게 책임까지 인정되어야 교사·방조범이 성립하므로 책임무능력자를 이용한 경우에는 간접정범만 성립할 수 있다.", "공범론"],
["565", "★ 제한종속형식에 의할 경우 위법성이 조각되는 행위를 교사·방조한 경우에는 공범이 성립될 가능성이 없다.[변17]", true, "▸ 제한종속형식과 극단종속형식 모두 정범이 위법성이 조각되는 경우에는 교사·방조범이 성립할 수 없고, 간접정범만 성립할 수 있다.\n\n[제1절 참고 - 공범종속성 학설 정리] 공범독립성설: 공범의 가벌성은 정범의 실행행위와 무관하게 그 자체로 성립하며, 정범의 실행착수를 요하지 않는다(주관주의). 공범종속성설(통설·판례): 공범의 성립은 정범의 실행행위를 전제로 한다. 그 종속의 정도에 따라 ① 최소한 종속형식(정범이 구성요건에만 해당하면 족함), ② 제한적 종속형식(통설·판례, 정범이 구성요건에 해당하고 위법하면 족하며 책임까지는 불요), ③ 극단적 종속형식(정범이 구성요건에 해당하고 위법하며 책임까지 있어야 함), ④ 초극단적 종속형식(정범에게 처벌조건까지 구비되어야 함)으로 나뉜다. 제한적 종속형식에 의하면 정범에게 책임이 없는 경우(예: 책임무능력자)에도 의사지배가 있으면 간접정범, 의사지배가 없으면 교사·방조범이 성립할 수 있는 반면, 극단적 종속형식에 의하면 정범에게 책임까지 인정되어야 교사·방조범이 성립하므로 책임무능력자를 이용한 경우에는 간접정범만 성립할 수 있다.", "공범론"],
["566", "★ 甲이 형사미성년자인 乙을 교사하여 절도죄를 저지르게 하였을 경우, 제한적 종속형식과 극단적 종속형식 모두 甲에게 절도죄의 교사범이 성립한다.", false, "▸ 극단적 종속형식은 정범에게 책임까지 인정되어야 교사·방조범이 성립할 수 있으므로 책임무능력자를 교사한 경우에는 간접정범만 성립할 수 있다. 반면 제한적 종속형식에 의하면 의사지배가 있으면 간접정범, 의사지배가 없으면 교사·방조범이 성립할 수 있다.\n\n[제1절 참고 - 공범종속성 학설 정리] 공범독립성설: 공범의 가벌성은 정범의 실행행위와 무관하게 그 자체로 성립하며, 정범의 실행착수를 요하지 않는다(주관주의). 공범종속성설(통설·판례): 공범의 성립은 정범의 실행행위를 전제로 한다. 그 종속의 정도에 따라 ① 최소한 종속형식(정범이 구성요건에만 해당하면 족함), ② 제한적 종속형식(통설·판례, 정범이 구성요건에 해당하고 위법하면 족하며 책임까지는 불요), ③ 극단적 종속형식(정범이 구성요건에 해당하고 위법하며 책임까지 있어야 함), ④ 초극단적 종속형식(정범에게 처벌조건까지 구비되어야 함)으로 나뉜다. 제한적 종속형식에 의하면 정범에게 책임이 없는 경우(예: 책임무능력자)에도 의사지배가 있으면 간접정범, 의사지배가 없으면 교사·방조범이 성립할 수 있는 반면, 극단적 종속형식에 의하면 정범에게 책임까지 인정되어야 교사·방조범이 성립하므로 책임무능력자를 이용한 경우에는 간접정범만 성립할 수 있다.", "공범론"],
["567", "공동정범은 공동의사에 의한 기능적 행위지배가 있음에 반하여 종범은 그 행위지배가 없는 점에서 양자가 구별된다.[변18]", true, "▸ 공동정범의 본질은 행위자들이 공동의 의사로 역할을 분담하여 기능적 행위지배를 하고 있는 것임에 반하여, 종범은 그러한 행위지배가 없다는 점에서 양자가 구별된다는 것이 판례의 태도이다(2017도2573).\n\n[제2절 참고 - 공동정범 조문] 형법 제30조(공동정범): 2인 이상이 공동하여 죄를 범한 때에는 각자를 그 죄의 정범으로 처벌한다.", "공범론"],
["568", "상명하복관계에 있는 자들이 범행에 공동가공한 경우, 특수교사·방조범(「형법」 제34조 제2항)이 성립할 수 있으나 공동정범은 인정될 수 없다.[변21]", false, "▸ 상명하복 관계에 있는 자들 사이에 있어서도 범행에 공동가공한 이상 공동정범이 성립하는 데 아무런 지장이 없다는 것이 판례의 태도이다(94도1793).\n\n[제2절 참고 - 공동정범 조문] 형법 제30조(공동정범): 2인 이상이 공동하여 죄를 범한 때에는 각자를 그 죄의 정범으로 처벌한다.", "공범론"],
["569", "★ 공동정범의 성립을 위한 공동가공의 의사는 타인의 범행을 인식하면서도 이를 제지하지 아니하고 용인하는 것만으로는 부족하고, 공동의 의사로 특정한 범죄행위를 하기 위해 일체가 되어 서로 다른 사람의 행위를 이용하여 자기 의사를 실행에 옮기는 것을 내용으로 하는 것이어야 한다.[변24]", true, "▸ 공동가공의 의사란 타인의 범행을 인식하면서도 이를 제지함이 없이 용인하는 것만으로는 부족하고 공동의 의사로 특정한 범죄행위를 하기 위하여 일체가 되어 서로 다른 사람의 행위를 이용하여 자기의 의사를 실행에 옮기는 것을 내용으로 하는 것이어야 한다. 다만 반드시 사전에 치밀한 범행계획의 공모에까지 이를 필요는 없으며, 공범자 각자가 공범자들 사이에 구성요건을 이루거나 구성요건에 본질적으로 관련된 행위를 분담한다는 상호이해가 있으면 충분하다(2020도18285).\n\n[제2절 참고 - 공동정범 조문] 형법 제30조(공동정범): 2인 이상이 공동하여 죄를 범한 때에는 각자를 그 죄의 정범으로 처벌한다.", "공범론"],
["570", "★ 공동정범이 성립하기 위하여 반드시 공범자 간 사전모의가 있어야 하는 것은 아니며, 우연히 만난 자리에서 서로 협력하여 공동의 범의를 실현하려는 의사가 암묵적으로 상통하여 범행에 공동가공하더라도 공동정범은 성립된다.[변21]", true, "▸ (82도1373)\n\n[제2절 참고 - 공동정범 조문] 형법 제30조(공동정범): 2인 이상이 공동하여 죄를 범한 때에는 각자를 그 죄의 정범으로 처벌한다.", "공범론"],
["571", "★ 2인 이상이 범죄에 공동가공하는 공범관계에서 비록 전체의 모의과정이 없더라도 수인 사이에 순차적으로 또는 암묵적으로 상통하여 의사의 결합이 이루어지면 공모관계가 성립한다.[변13]", true, "▸ (2004도1465)\n\n[제2절 참고 - 공동정범 조문] 형법 제30조(공동정범): 2인 이상이 공동하여 죄를 범한 때에는 각자를 그 죄의 정범으로 처벌한다.", "공범론"],
["572", "공동정범이 성립하기 위하여는 반드시 공범자간에 사전 모의가 있어야 하는 것은 아니며, 암묵리에 서로 협력하여 공동의 범의를 실현하려는 의사가 상통하면 공모가 있다할 것이고 공모가 있는 이상 반드시 각 범행의 실행을 분담할 것을 요하지 아니하고, 단순히 망을 보았어도 공범의 책임을 면할 수 없다.", true, "▸ (82도1818)\n\n[제2절 참고 - 공동정범 조문] 형법 제30조(공동정범): 2인 이상이 공동하여 죄를 범한 때에는 각자를 그 죄의 정범으로 처벌한다.", "공범론"],
["573", "'보이스피싱 사기에서 현금수거책의 고의는 해당 보이스피싱 범죄 전체를 모의하지 않았더라도 다른 공범과 순차적으로 또는 암묵적으로 상통함으로써 범죄에 공동가공하여 범죄를 실현하려는 의사가 결합되어 피해자의 현금을 수거한다는 사실을 인식하는 것으로 족하다.[모25]", true, "▸ (2024도10141) [이러한 인식은 미필적인 것으로도 충분하고 전체 보이스피싱 범행 방법이나 내용까지 구체적으로 인식할 것을 요하지는 않는다.]\n\n[제2절 참고 - 공동정범 조문] 형법 제30조(공동정범): 2인 이상이 공동하여 죄를 범한 때에는 각자를 그 죄의 정범으로 처벌한다.", "공범론"],
["574", "공모에 의한 범죄의 공동실행은 모든 공범자가 스스로 범죄의 구성요건을 실현하는 것을 전제로 하지 아니하고, 그 실현행위를 하는 공범자에게 그 행위결정을 강화하도록 협력하는 것으로도 가능하다.", true, "▸ (2020도1264)\n\n[제2절 참고 - 공동정범 조문] 형법 제30조(공동정범): 2인 이상이 공동하여 죄를 범한 때에는 각자를 그 죄의 정범으로 처벌한다.", "공범론"],
["575", "★ 甲이 A녀를 강간하고 있을 때, 乙 스스로 甲의 강간행위에 가담할 의사로 甲이 모르는 사이에 망을 보아준 경우, 乙은 강간죄의 공동정범이 된다.[변12]", false, "▸ 공동정범은 행위자 상호간에 범죄행위를 공동으로 한다는 공동가공의 의사를 가지고 범죄를 공동실행하는 경우에 성립하는 것으로서, 여기에서의 공동가공의 의사는 공동행위자 상호간에 있어야 하며 행위자 일방의 가공의사만으로는 공동정범관계가 성립할 수 없다(84도2118). [편면적 공동정범은 성립하지 않으나 편면적 방조는 성립할 수 있다]\n\n[제2절 참고 - 공동정범 조문] 형법 제30조(공동정범): 2인 이상이 공동하여 죄를 범한 때에는 각자를 그 죄의 정범으로 처벌한다.", "공범론"],
["576", "甲, 乙, 丙이 함께 강도행위를 하던 중 乙이 A에 대한 강간행위를 하였고 丙은 이때 피해자의 머리 등을 잡아주었으나, 甲은 乙과 丙의 강간의 실행의 착수 이후에 이 사실을 알게 되었으나 乙의 강간행위를 도와주지 아니하고 집에서 나왔다면, 甲은 乙의 강간행위에 대한 공동정범의 죄책을 지지 않는다.", true, "▸ 甲이 乙의 강간사실을 알게 된 것은 이미 실행의 착수가 이루어지고 난 다음이었음이 명백하고, 강간사실을 알고 나서도 암묵리에 그것을 용인하여 강간하도록 할 의사로 강간의 실행범인 乙과 강간 피해자의 머리 등을 잡아준 丙과 함께 일체가 되어 그들의 행위를 통하여 자기의 의사를 실행하였다고는 볼 수 없다(88도1114).\n\n[제2절 참고 - 공동정범 조문] 형법 제30조(공동정범): 2인 이상이 공동하여 죄를 범한 때에는 각자를 그 죄의 정범으로 처벌한다.", "공범론"],
["577", "★ 외국인 해적들인 甲, 乙, 丙, 丁은 선박을 강취하여 선원들을 인질로 삼아 석방대가를 요구하기로 공모하고, 공해상에서 운항 중인 한국인 선원이 승선한 선박 ○○호를 강취하였다. 이에 대한민국 해군이 선원의 구조를 위해 ○○호에 접근하자, 甲, 乙, 丙, 丁은 총기를 소지한 채 해군을 살해하여서라도 저지하기로 공모하고, 甲, 乙, 丙은 해군의 보트를 향해서 일제히 조준사격을 하여 해군 3인이 총상을 입었다. 이때 소총을 소지한 丁은 역할 분담에 따라 통신실에서 통신장비를 감시하고 있었기 때문에 외부의 총격전에는 가담하지 않았다. 해군 3인에게 총상을 입힌 행위에 대하여 丁은 해상강도살인미수죄의 공동정범이 인정된다.[변18]", true, "▸ 丁은 해적들 내부의 업무분담에 따라 조타실 내에서 통신장비를 감시하는 역할을 하는 한편 소총을 소지한 채 외부 경계활동에도 가담하였고, 이 부분 범행에 관한 실행행위를 직접 분담하지 않았더라도 이에 대한 본질적 기여를 통하여 해상강도살인행위에 대하여 기능적 행위지배를 한 공모자로 보아야 한다(2011도12927).\n\n[제2절 참고 - 공동정범 조문] 형법 제30조(공동정범): 2인 이상이 공동하여 죄를 범한 때에는 각자를 그 죄의 정범으로 처벌한다.", "공범론"],
["578", "외국인 해적들인 甲, 乙, 丙, 丁은 선박을 강취하여 선원들을 인질로 삼아 석방대가를 요구하였다. 해군의 공격에 더 이상 버티기 힘든 상황이 되자, 두목 甲은 같이 있던 乙, 丙에게 총기를 조타실 밖으로 버리고 선실로 내려가 피신하라고 명령하였다. 乙, 丙은 명령을 따랐고, 실질적으로 해적들의 저항은 종료되었다. 이후 甲은 조타실에서 한국인 선장 A를 살해하려고 총격을 가하여 복부관통상을 가하였으나 A는 사망에 이르지 아니하였다. 선장 A를 살해하려는 행위에 대하여 乙, 丙은 해상강도살인미수죄의 공동정범이 인정되지 않는다.[변18]", true, "▸ 본래 목적 달성이 무산되고 자신들의 생존 여부도 장담할 수 없는 상황에서 보복하기 위해 원인제공자를 살해하는 것까지 공모하였다고 볼 수는 없고, 당시 두목을 제외한 나머지 해적들은 지시에 따라 무기를 버리고 몸을 피하거나 피신함으로써 저항을 포기하였으므로 해적행위에 관한 공모관계는 실질적으로 종료되었고, 나머지 피고인들로서는 두목이 선장에게 총격을 가하여 살해하려 할 것이라는 점까지 예상할 수는 없었다(2011도12927).\n\n[제2절 참고 - 공동정범 조문] 형법 제30조(공동정범): 2인 이상이 공동하여 죄를 범한 때에는 각자를 그 죄의 정범으로 처벌한다.", "공범론"],
["579", "★ 공모자에게 범죄에 대한 본질적 기여를 통한 기능적 행위지배가 인정된다면 공모공동정범으로서의 죄책을 물을 수 있다.[변21]", true, "▸ 형법 제30조의 공동정범은 공동가공의 의사와 그 공동의사에 의한 기능적 행위지배를 통한 범죄실행이라는 주관적·객관적 요건을 충족함으로써 성립하므로, 구성요건행위를 직접 분담하여 실행하지 않은 사람도 위 요건을 충족하면 이른바 공모공동정범으로서의 죄책을 질 수 있다. 다만 그러한 공모자가 공모공동정범으로 인정되려면, 전체 범죄에서 차지하는 지위·역할, 범죄 경과에 대한 지배나 장악력 등을 종합하여 단순한 공모자에 그치는 것이 아니라 범죄에 대한 본질적 기여를 통한 기능적 행위지배가 존재한다고 인정되어야 한다(2017도14322).\n\n[제2절 참고 - 공동정범 조문] 형법 제30조(공동정범): 2인 이상이 공동하여 죄를 범한 때에는 각자를 그 죄의 정범으로 처벌한다.", "공범론"],
["580", "★ 구성요건행위를 직접 분담하여 실행하지 않은 공모자가 공모공동정범으로 인정되기 위해서는 전체 범죄에서 그가 차지하는 지위·역할, 범죄 경과에 대한 지배나 장악력 등을 종합하여 그가 단순한 공모자에 그치는 것이 아니라, 범죄에 대한 본질적 기여를 통한 기능적 행위지배가 존재한다고 인정되어야 한다.[변22]", true, "▸ 형법 제30조의 공동정범은 공동가공의 의사와 그 공동의사에 의한 기능적 행위지배를 통한 범죄실행이라는 주관적·객관적 요건을 충족함으로써 성립하므로, 구성요건행위를 직접 분담하여 실행하지 않은 사람도 위 요건을 충족하면 이른바 공모공동정범으로서의 죄책을 질 수 있다. 다만 그러한 공모자가 공모공동정범으로 인정되려면, 전체 범죄에서 차지하는 지위·역할, 범죄 경과에 대한 지배나 장악력 등을 종합하여 단순한 공모자에 그치는 것이 아니라 범죄에 대한 본질적 기여를 통한 기능적 행위지배가 존재한다고 인정되어야 한다(2017도14322).\n\n[제2절 참고 - 공동정범 조문] 형법 제30조(공동정범): 2인 이상이 공동하여 죄를 범한 때에는 각자를 그 죄의 정범으로 처벌한다.", "공범론"],
["581", "★ 공모자들이 그 공모한 범행을 수행하거나 목적 달성을 위해 나아가는 도중에 부수적인 다른 범죄가 파생되리라고 예상하거나 충분히 예상할 수 있는데도 그 가능성을 외면한 채 이를 방지하기에 족한 합리적 조치를 취하지 않고 공모한 범행에 나아갔다가 결국 그와 같이 예상된 범행들이 발생한 경우, 그 파생적인 범행 하나하나에 대하여 개별적 의사연락이 없었다면 그 범행 전부에 대한 기능적 행위지배가 존재한다고 볼 수 없다.[변21]", false, "▸ 공모공동정범의 경우, 공모자들이 그 공모한 범행을 수행하거나 목적 달성을 위해 나아가는 도중에 부수적인 다른 범죄가 파생되리라고 예상하거나 충분히 예상할 수 있는데도 그러한 가능성을 외면한 채 이를 방지하기에 족한 합리적인 조치를 취하지 아니하고 공모한 범행에 나아갔다가 결국 그와 같이 예상되던 범행들이 발생하였다면, 비록 그 파생적인 범행 하나하나에 대하여 개별적인 의사의 연락이 없었다고 하더라도 당초 공모자들 사이에 그 범행 전부에 대하여 암묵적인 공모는 물론 그에 대한 기능적 행위지배가 존재한다고 보아야 한다(2010도11030).\n\n[제2절 참고 - 공동정범 조문] 형법 제30조(공동정범): 2인 이상이 공동하여 죄를 범한 때에는 각자를 그 죄의 정범으로 처벌한다.", "공범론"],
["582", "법률에 따라 적법한 신고를 마친 집회·시위 과정에서 당초 신고된 범위를 현저히 일탈하거나 법률에 따른 조건을 중대하게 위반하여 도로 교통을 방해함으로써 통행이 불가능하게 하거나 현저하게 곤란하게 된 경우, 참가자 모두 일반교통방해죄의 공모공동정범의 죄책을 부담한다.", false, "▸ 참가자 모두에게 당연히 일반교통방해죄가 성립하는 것은 아니고, 실제로 참가자가 신고 범위를 현저하게 벗어나거나 조건을 중대하게 위반하는 데 가담하여 교통방해를 유발하는 직접적인 행위를 하였거나, 참가자의 참가 경위나 관여 정도 등에 비추어 그 참가자에게 공모공동정범의 죄책을 물을 수 있는 경우라야 일반교통방해죄가 성립한다(2017도16846).\n\n[제2절 참고 - 공동정범 조문] 형법 제30조(공동정범): 2인 이상이 공동하여 죄를 범한 때에는 각자를 그 죄의 정범으로 처벌한다.", "공범론"],
["583", "건설 관련 회사의 유일한 지배자가 회사 대표의 지위에서 장기간에 걸쳐 건설공사 현장소장들의 뇌물공여행위를 보고받고 이를 확인·결재하는 등의 방법으로 위 행위에 관여하였다면, 비록 사전에 구체적인 대상 및 액수를 정하여 뇌물공여를 지시하지 아니하였다고 하더라도 그 핵심적 경과를 계획적으로 조종하거나 촉진하는 등으로 기능적 행위지배를 하였다고 볼 수 있다.", true, "▸ (2010도3544)\n\n[제2절 참고 - 공동정범 조문] 형법 제30조(공동정범): 2인 이상이 공동하여 죄를 범한 때에는 각자를 그 죄의 정범으로 처벌한다.", "공범론"],
["584", "★ 甲이 주도하여 乙, 丙과 절도를 하기로 공모한 후, 甲과 乙이 실행행위에 이르기 전에 망을 보기로 한 丙이 공모관계에서 이탈한 경우, 그 이후의 甲과 乙의 절취행위에 대하여 丙은 공동정범으로서의 책임을 지지 아니하지만, 그 이탈의 표시는 명시적으로 하여야 한다.[변12]", false, "▸ [평균적 일원(단순가담자)] 공모공동정범에 있어서 그 공모자 중의 1인이 다른 공모자가 실행행위에 이르기 전에 그 공모관계에서 이탈한 때에는 그 이후의 다른 공모자의 행위에 관하여 공동정범으로서의 책임은 지지 않고, 그 이탈의 표시는 반드시 명시적임을 요하지 않는다(85도2371). [① 이탈의 의사표시는 묵시적이라도 표시되어야 하지만 반드시 명시적임을 요하지 않고, 다른 공모자의 동의나 승낙을 요하는 것도 아니다. ② 甲은 특수강도, 乙은 강도예비죄만 성립한다.]\n\n[제2절 참고 - 공동정범 조문] 형법 제30조(공동정범): 2인 이상이 공동하여 죄를 범한 때에는 각자를 그 죄의 정범으로 처벌한다.", "공범론"],
["585", "★ 甲의 주도하에 甲과 乙이 사전에 가스총으로 강도를 하기로 모의하고 만나기로 하였는데 乙이 마음을 바꾸어 약속장소에 나타나지 않았다. 이에 甲은 혼자서 약속한 범행장소인 좁은 골목길에서 귀가 중인 피해자에게 다가가 가스총으로 겁을 주어 현금 20만원을 빼앗았다. 甲과 乙은 특수강도죄의 공동정범이 성립한다.[변12]", false, "▸ [평균적 일원(단순가담자)] 공모공동정범에 있어서 그 공모자 중의 1인이 다른 공모자가 실행행위에 이르기 전에 그 공모관계에서 이탈한 때에는 그 이후의 다른 공모자의 행위에 관하여 공동정범으로서의 책임은 지지 않고, 그 이탈의 표시는 반드시 명시적임을 요하지 않는다(85도2371). [① 이탈의 의사표시는 묵시적이라도 표시되어야 하지만 반드시 명시적임을 요하지 않고, 다른 공모자의 동의나 승낙을 요하는 것도 아니다. ② 甲은 특수강도, 乙은 강도예비죄만 성립한다.]\n\n[제2절 참고 - 공동정범 조문] 형법 제30조(공동정범): 2인 이상이 공동하여 죄를 범한 때에는 각자를 그 죄의 정범으로 처벌한다.", "공범론"],
["586", "★ 모의과정을 주도한 甲은 乙, 丙과 함께 지나가는 행인을 대상으로 강도를 하기로 모의한 뒤, 함께 범행 대상을 물색하다가 乙, 丙이 행인 A를 강도 대상으로 지목하고 뒤쫓아가자 甲은 단지 \"어?\"라고만 하고 비대한 체격 때문에 뒤따라가지 못한 채 범행현장에서 200m 정도 떨어진 곳에 앉아 있었다. 乙, 丙은 A를 쫓아가 A를 폭행하고 지갑과 현금 30만 원을 빼앗았다. 甲은 강도죄의 공모관계에서 이탈하였다고 볼 수 없으므로 특수강도죄의 공동정범의 죄책을 진다.[변14]", true, "▸ [주도적 참여자] 공모관계에서의 이탈은 공모자가 공모에 의하여 담당한 기능적 행위지배를 해소하는 것이 필요하므로, 공모에 주도적으로 참여하여 다른 공모자의 실행에 영향을 미친 경우에는 범행을 저지하기 위하여 적극적으로 노력하는 등 실행에 미친 영향력을 제거하지 아니하는 한 공모관계에서 이탈하였다고 할 수 없다. 피고인에게 공동가공의 의사와 공동의사에 기한 기능적 행위지배를 통한 범죄의 실행사실이 인정되므로 강도상해죄의 공모관계에 있고, 다른 공모자가 강도상해죄의 실행에 착수하기까지 범행을 만류하는 등으로 그 공모관계에서 이탈하였다고 볼 수 없으므로 강도상해죄의 공동정범으로서의 죄책을 진다(2008도1274).\n\n[제2절 참고 - 공동정범 조문] 형법 제30조(공동정범): 2인 이상이 공동하여 죄를 범한 때에는 각자를 그 죄의 정범으로 처벌한다.", "공범론"],
["587", "★ 甲이 부녀를 유인하여 성매매를 통해 수익을 얻을 것을 乙과 공모한 후, 乙로 하여금 유인된 A녀(16세)의 성매매 홍보용 나체사진을 찍도록 하고, A가 중도에 약속을 어길 경우 민형사상 책임을 진다는 각서를 작성하도록 하였지만, 자신이 별건으로 체포되어 구치소에 수감 중인 동안 A가 乙의 관리 아래 성매수의 대가로 받은 돈을 A, 乙 및 甲의 처 등이 나누어 사용한 경우라도 甲에게는 공모관계에서의 이탈이 인정된다.[변13]", false, "▸ 공모자가 공모에 주도적으로 참여하여 다른 공모자의 실행에 영향을 미친 때에는 범행을 저지하기 위하여 적극적으로 노력하는 등 실행에 미친 영향력을 제거하지 아니하는 한, 공모자가 구속되었다는 등의 사유만으로 공모관계에서 이탈하였다고 할 수 없다(2010도6924).\n\n[제2절 참고 - 공동정범 조문] 형법 제30조(공동정범): 2인 이상이 공동하여 죄를 범한 때에는 각자를 그 죄의 정범으로 처벌한다.", "공범론"],
["588", "★ 甲은 친구 乙과 丙에게 연락해 날치기를 제안하였다. 이에 乙과 丙은 은행 문밖에서 범행대상을 물색하고, 甲은 날치기를 끝낸 乙과 丙을 태우고 도망치기 위해 은행 앞 차도에 승용차를 세워 두고 대기하기로 했다. 며칠 후 A가 은행에서 현금을 출금하여 나오는 것을 본 乙과 丙은 A의 뒤를 따라가기 시작했다. 甲은 차를 몰고 그 뒤를 따라가던 중 갑자기 처벌이 두려워져 혼자 말없이 도주해 버렸다. 이후 乙과 丙은 A가 손에 든 가방을 그대로 낚아채어 달아났다. 甲은 혼자 도주하였을 뿐 乙과 丙에게 이탈의 의사표시를 한 바 없고, 乙과 丙은 그대로 범죄행위로 나아갔으므로, 甲이 공모관계에서 이탈하였다고 보기 어렵다.[변25]", true, "▸ ① 甲은 묵시적이라도 이탈의 의사표시를 한 적이 없고, 공모에 주도적으로 참여하였는데도 다른 공모자의 실행에 미친 영향력을 제거하지도 못하였으므로 공모관계에서 이탈하였다고 할 수 없다. ② 乙은 평균적 일원에 불과하므로 공모관계 이탈이 인정된다(2010도6924).\n\n[제2절 참고 - 공동정범 조문] 형법 제30조(공동정범): 2인 이상이 공동하여 죄를 범한 때에는 각자를 그 죄의 정범으로 처벌한다.", "공범론"],
["589", "위 사안에서 만약 乙이 실행행위 전에 甲과 丙에게 이탈의 의사표시를 명확히 밝히고 도주하였다면, 이후 벌어진 날치기에 관하여 공동정범으로서 죄책을 지지 않는다.[변25]", true, "▸ ① 甲은 묵시적이라도 이탈의 의사표시를 한 적이 없고, 공모에 주도적으로 참여하였는데도 다른 공모자의 실행에 미친 영향력을 제거하지도 못하였으므로 공모관계에서 이탈하였다고 할 수 없다. ② 乙은 평균적 일원에 불과하므로 공모관계 이탈이 인정된다(2010도6924).\n\n[제2절 참고 - 공동정범 조문] 형법 제30조(공동정범): 2인 이상이 공동하여 죄를 범한 때에는 각자를 그 죄의 정범으로 처벌한다.", "공범론"],
["590", "★ 범죄를 공모한 자가 포괄일죄의 관계에 있는 범행의 일부를 실행한 후 공범관계에서 이탈하였으나 다른 공범자에 의하여 나머지 범행이 이루어진 경우, 그에게 자신이 관여하지 않은 이탈 이후 부분에 대하여 공동정범으로서의 죄책을 부담시킬 수 없다.[모25]", false, "▸ ① 피고인이 포괄일죄의 관계에 있는 범행의 일부를 실행한 후 공범관계에서 이탈하였으나 다른 공범자에 의하여 나머지 범행이 이루어진 경우, 피고인이 관여하지 않은 부분에 대하여도 죄책을 부담한다. ② 피고인은 다른 공범들의 범죄실행을 저지하지 않은 이상, 관여하지 않은 나머지 공범들이 행한 시세조종행위에 대하여도 죄책을 부담한다(2010도9927).\n\n[제2절 참고 - 공동정범 조문] 형법 제30조(공동정범): 2인 이상이 공동하여 죄를 범한 때에는 각자를 그 죄의 정범으로 처벌한다.", "공범론"],
["591", "★ 금융투자회사 직원 甲이 다른 공범들과 특정 주식의 시세조정 주문을 내기로 공모한 후 이를 일부 실행하다가 해고를 당하여 행위를 중단하게 되었으나 다른 공범들이 나머지 시세조정행위를 계속해서 마무리한 경우, 甲이 해고되어 퇴사함으로써 기존의 공모관계에서 이탈하였으므로 다른 공범자에 의하여 실행된 나머지 범행에 대해서는 죄책을 부담하지 않는다.", false, "▸ ① 피고인이 포괄일죄의 관계에 있는 범행의 일부를 실행한 후 공범관계에서 이탈하였으나 다른 공범자에 의하여 나머지 범행이 이루어진 경우, 피고인이 관여하지 않은 부분에 대하여도 죄책을 부담한다. ② 피고인은 다른 공범들의 범죄실행을 저지하지 않은 이상, 관여하지 않은 나머지 공범들이 행한 시세조종행위에 대하여도 죄책을 부담한다(2010도9927).\n\n[제2절 참고 - 공동정범 조문] 형법 제30조(공동정범): 2인 이상이 공동하여 죄를 범한 때에는 각자를 그 죄의 정범으로 처벌한다.", "공범론"],
["592", "공범자가 공갈행위의 실행에 착수한 후 그 범행을 인식하면서 그와 공동의 범의를 가지고 그 후의 공갈행위를 계속하여 재물의 교부나 재산상 이익의 취득에 이른 때에는 공갈죄의 공동정범이 성립한다.", true, "▸ (96도1959)\n\n[제2절 참고 - 공동정범 조문] 형법 제30조(공동정범): 2인 이상이 공동하여 죄를 범한 때에는 각자를 그 죄의 정범으로 처벌한다.", "공범론"],
["593", "★ 공범자의 범인도피행위의 도중에 그 범행을 인식하면서 그와 공동의 범의를 가지고 기왕의 범인도피상태를 이용하여 스스로 범인도피행위를 계속한 자에 대하여는 범인도피죄의 공동정범이 성립한다.", true, "▸ 범인도피죄는 범인을 도피하게 함으로써 기수에 이르지만 범인도피행위가 계속되는 동안에는 범죄행위도 계속되고 행위가 끝날 때 비로소 범죄행위가 종료되므로, 공범자의 범인도피행위 도중에 그 범행을 인식하면서 공동의 범의를 가지고 기왕의 범인도피상태를 이용하여 스스로 범인도피행위를 계속한 자에 대하여는 범인도피죄의 공동정범이 성립한다(95도577).\n\n[제2절 참고 - 공동정범 조문] 형법 제30조(공동정범): 2인 이상이 공동하여 죄를 범한 때에는 각자를 그 죄의 정범으로 처벌한다.", "공범론"],
["594", "★ 포괄일죄의 범행 도중에 공동정범으로 범행에 가담한 자는 비록 그가 그 범행에 가담할 때에 이미 이루어진 종전의 범행을 알았고 이를 적극 이용하여 범죄를 수행하였다 하더라도 그 가담 이후의 범행에 대하여만 공동정범의 책임을 진다.[변13]", true, "▸ 포괄일죄의 범행 도중에 공동정범으로 범행에 가담한 자는 비록 그가 그 범행에 가담할 때에 이미 이루어진 종전의 범행을 알았다 하더라도 그 가담 이후의 범행에 대하여만 공동정범으로 책임을 진다(97도163). [업무상배임죄]\n\n[제2절 참고 - 공동정범 조문] 형법 제30조(공동정범): 2인 이상이 공동하여 죄를 범한 때에는 각자를 그 죄의 정범으로 처벌한다.", "공범론"],
["595", "★ 합동범은 주관적 요건으로서 공모 외에 객관적 요건으로서 현장에서의 실행행위의 분담을 요하나, 이 실행행위의 분담은 반드시 동시에 동일 장소에서 실행행위를 특정하여 분담하는 것만을 뜻하는 것이 아니라 시간적으로나 장소적으로 서로 협동관계에 있다고 볼 수 있으면 충분하다.[변19]", true, "▸ (92도917) [예: 망을 보는 행위도 합동에 해당한다.]", "공범론"],
["596", "甲, 乙은 절도를 공모하고, 甲은 A의 집에 들어가 A 소유의 다이아몬드 반지 1개를 가지고 나오고, 乙은 A의 집 문앞에서 망을 보았다는 공소사실로 기소되었다. 甲에 대해서는 야간주거침입절도죄가 성립하고, 乙에 대해서는 야간주거침입절도죄의 방조범이 성립한다.[변12]", false, "▸ 甲은 창고앞에서 망을 보고 乙은 창고에 침입하여 가죽을 절취한 경우 특수절도죄가 인정된다(88도837). [甲, 乙은 공동의사에 의한 기능적 행위지배가 있어 공동정범에 해당하고, 망을 보는 행위도 합동에 해당하므로 특수절도죄가 성립한다.]", "공범론"],
["597", "★ 甲, 乙, 丙이 사전의 모의에 따라 강간할 목적으로 심야에 인가에서 멀리 떨어져 있어 쉽게 도망할 수 없는 야산으로 피해자 A, B, C를 유인한 다음 곧바로 암묵적인 합의에 따라 각자 마음에 드는 피해자 1명씩만을 데리고 불과 100m 이내의 거리에 있는 곳으로 흩어져 동시 또는 순차적으로 피해자들을 각각 강간하였다면, 甲에게는 A, B, C 모두에 대한 성폭력범죄의 처벌 등에 관한 특례법상의 특수강간죄가 성립한다.[변13]", true, "▸ ① 성폭법 제6조 제1항의 2인 이상이 합동하여 형법 제297조의 죄를 범함으로써 특수강간죄가 성립하기 위하여는 주관적 요건으로서의 공모와 객관적 요건으로서의 실행행위의 분담이 있어야 하고, 그 실행행위는 시간적으로나 장소적으로 협동관계에 있다고 볼 정도에 이르면 된다. ② 각 강간의 실행행위도 시간적으로나 장소적으로 협동관계에 있었다고 보아야 할 것이므로, 피해자 전원에 대한 특수강간죄 등이 성립된다(2004도2870).", "공범론"],
["598", "★ 乙, 丙과 A 회사의 사무실 금고에서 현금을 절취할 것을 공모한 甲이 乙과 丙에게 범행도구를 구입하여 제공해 주었을 뿐만 아니라 乙과 丙이 사무실에서 현금을 절취하는 동안 범행장소가 보이지 않는 멀리 떨어진 곳에서 기다렸다가 절취한 현금을 운반한 경우, 甲은 乙, 丙의 합동절도의 공동정범의 죄책을 진다.[변13]", true, "▸ 3인 이상의 범인이 합동절도의 범행을 공모한 후 적어도 2인 이상의 범인이 범행현장에서 시간적, 장소적으로 협동관계를 이루어 절도의 실행행위를 분담하여 절도범행을 한 경우에, 그 공모에는 참여하였으나 현장에서 절도의 실행행위를 직접 분담하지 아니한 다른 범인에 대하여도 그가 현장에서 절도 범행을 실행한 2인 이상의 범인의 행위를 자기 의사의 수단으로 하여 합동절도의 범행을 하였다고 평가할 수 있는 정범성의 표지를 갖추고 있는 한 공동정범의 일반 이론에 비추어 그 다른 범인에 대하여 합동절도의 공동정범으로 인정할 수 있다(2011도2021).", "공범론"],
["599", "★ 甲은 친구 乙과 丙에게 연락해 날치기를 제안하였다. 이에 乙과 丙은 은행 문밖에서 범행대상을 물색하고, 甲은 날치기를 끝낸 乙과 丙을 태우고 도망치기 위해 은행 앞 차도에 승용차를 세워 두고 대기하기로 했다. 며칠 후 A가 은행에서 현금을 출금하여 나오는 것을 본 乙과 丙은 A의 뒤를 따라가기 시작했다. 甲은 차를 몰고 그 뒤를 따라가던 중 갑자기 처벌이 두려워져 혼자 말없이 도주해 버렸다. A가 좁은 골목길로 들어서자 乙은 입구에서 망을 보았고, 丙은 A가 손에 든 가방을 그대로 낚아채어 달아났다. 甲은 현장에서 날치기 실행행위를 직접 분담하지 않았지만, 乙과 丙의 행위를 자기의사의 수단으로 하여 범행을 하였다고 평가할 수 있으므로, 특수절도죄의 공동정범에 해당한다.[변25]", true, "▸ 3인 이상의 범인이 합동절도의 범행을 공모한 후 적어도 2인 이상의 범인이 범행현장에서 시간적, 장소적으로 협동관계를 이루어 절도의 실행행위를 분담하여 절도범행을 한 경우에, 그 공모에는 참여하였으나 현장에서 절도의 실행행위를 직접 분담하지 아니한 다른 범인에 대하여도 그가 현장에서 절도 범행을 실행한 2인 이상의 범인의 행위를 자기 의사의 수단으로 하여 합동절도의 범행을 하였다고 평가할 수 있는 정범성의 표지를 갖추고 있는 한 공동정범의 일반 이론에 비추어 그 다른 범인에 대하여 합동절도의 공동정범으로 인정할 수 있다(2011도2021).", "공범론"],
["600", "甲, 乙, 丙이 특수강도의 범행을 모의하였으나 甲은 범행의 실행에 가담하지 아니하고, 乙과 丙이 합동하여 강취해 온 장물의 처분을 알선만 한 경우에는 특수강도의 공동정범이 성립할 수 없고, 장물알선죄만 성립한다.", false, "▸ 특수강도의 범행을 모의한 이상 범행의 실행에 가담하지 아니하고, 공모자들이 강취해 온 장물의 처분을 알선만 하였다 하더라도, 특수강도의 공동정범이 된다 할 것이므로 장물알선죄로 의율할 것이 아니다(82도3103).", "공범론"],
["601", "★ 「폭력행위 등 처벌에 관한 법률」 제2조 제2항의 '2인 이상이 공동하여 상해 또는 폭행의 죄를 범한 때'라 함은 수인이 동일 장소에서 동일 기회에 범행을 한 경우이면 족하고, 수인 사이에 범죄에 공동가공하여 이를 공동으로 실현하려는 의사의 결합이 있어야 하는 것은 아니다.[변16]", false, "▸ 폭력행위 등 처벌에 관한 법률 제2조 제2항 제1호의 '2명 이상이 공동하여 폭행의 죄를 범한 때'란 수인 사이에 공범관계가 존재하고, 수인이 동일 장소에서 동일 기회에 상호 다른 자의 범행을 인식하고 이를 이용하여 폭행의 범행을 한 경우임을 요한다(2023도6355).", "공범론"],
["602", "A 건설회사에 근무하는 甲과 乙은 영업비밀을 경쟁업체에 유출하여 판매하기 위해 다른 사원들이 모두 퇴근한 자정 무렵 경비원 몰래 A 회사 건물 안으로 진입하여, 乙이 사무실 출입문 밖에서 망을 보고 있는 사이 甲은 사무실 안으로 들어가 컴퓨터에 저장되어 있는 설계도면 파일을 열어 프린터를 이용하여 출력해 나왔다. 甲과 乙이 A 회사 건물 안으로 들어간 행위는 「폭력행위 등 처벌에 관한 법률」상의 공동주거침입에 해당한다.[변17]", true, "▸ 망을 보는 것도 공동에 해당한다.", "공범론"],
["603", "★ 주점 지배인 甲이 종업원 乙, 丙과 함께 단골손님 A로부터 신용카드를 갈취해 현금을 인출하기로 모의하였고, 甲의 지시를 받은 乙과 丙은 늦은 저녁 한적한 골목길에서 A로부터 신용카드를 갈취하고 비밀번호를 알아내 甲이 일러준 편의점 현금자동지급기에서 300만 원의 예금을 인출하였으며, 이를 甲, 乙, 丙 각자 100만 원씩 분배하였다면, 범죄 장소에 가지 않은 甲에게 폭력행위등처벌등에관한법률위반(공동공갈)의 공동정범은 인정될 여지가 없다.[변23]", false, "▸ 여러 사람이 폭처법 제2조 제1항에 열거된 죄를 범하기로 공모한 다음 그 중 2인 이상이 범행장소에서 범죄를 실행한 경우에는 범행장소에 가지 아니한 자도 폭처법 제2조 제2항에 규정된 죄의 공모공동정범으로 처벌할 수 있다(2007도2590).", "공범론"],
["604", "★ 「폭력행위 등 처벌에 관한 법률」 제2조 제2항에서 '2명 이상이 공동하여' 죄를 범한 때라 함은 수인이 동일한 장소에서 동일한 기회에 상호 다른 사람의 범행을 인식하고 이를 이용하여 범행을 한 경우를 뜻하는 것으로서, 폭행 등의 실행범과의 공모사실은 인정되나 그와 공동하여 범행에 가담하였거나 범행장소에 있었다고 인정되지 아니하는 경우에는 공동하여 죄를 범한 때에 해당하지 아니한다.[변19]", true, "▸ 폭처법 제2조 제2항 제1호의 '2명 이상이 공동하여 폭행의 죄를 범한 때'란 수인 사이에 공범관계가 존재하고, 수인이 동일 장소에서 동일 기회에 상호 다른 자의 범행을 인식하고 이를 이용하여 폭행의 범행을 한 경우임을 요한다. 따라서 폭행 실행범과의 공모사실이 인정되더라도 그와 공동하여 범행에 가담하였거나 범행장소에 있었다고 인정되지 아니하는 경우에는 공동하여 죄를 범한 때에 해당하지 않고, 여러 사람이 공동하여 범행을 공모하였다면 그중 2인 이상이 범행장소에서 실제 범죄의 실행에 이르렀어야 나머지 공모자에게도 공모공동정범이 성립할 수 있을 뿐이다(2023도6355).", "공범론"],
["605", "★ 범행 전날 甲이 '싸워서라도 돈을 받아내라', 乙은 '무조건 고개를 낮추고 싸워', '영상으로 찍을 거니까 너가 이겨야 돼'라는 등의 말을 丙에게 하였고, 범행 당일 甲, 乙 모두 丙과 A와의 싸움 현장에 나가 丙이 직접 A를 폭행하자, 乙은 그 모습을 휴대전화기로 촬영하고, 甲이 이를 옆에서 지켜보았다면, 甲, 乙, 丙 모두 폭력행위등처벌에관한법률위반(공동폭행)죄에 해당한다.", false, "▸ 피고인들 상호 간에 공동으로 피해자를 폭행하자는 공동가공의 의사로 공범관계의 성립에 이르렀다고 볼 수 없을 뿐만 아니라, 甲, 乙은 이 사건 현장에서 丙의 폭행을 인식하고 이를 이용하여 피해자의 신체에 대한 유형력을 행사하는 폭행의 실행행위에 가담한 것이 아니라 단지 丙이 피해자를 폭행하는 모습을 지켜보거나 이를 동영상으로 촬영하였다는 것에 불과하다. 따라서 丙의 단독범행에 의한 폭행과 甲, 乙의 폭행교사 또는 방조로 인한 죄책 유무는 별론으로 하고, 피고인들에게 2명 이상이 공동하여 피해자를 폭행한 경우 성립하는 폭처법위반(공동폭행)죄의 죄책을 물을 수는 없다(2023도6355).", "공범론"],
["606", "대향범은 2인 이상의 대향적 협력에 의하여 성립하는 범죄로서 대향자 쌍방의 불법내용이 같으므로 「형법」상 쌍방을 처벌하는 경우 전부 쌍방의 법정형이 같은데, 다만 대향자 일방만을 처벌하는 경우가 있다.[변15]", false, "▸ 뇌물공여죄와 뇌물수수죄, 배임증재죄와 배임수재죄는 대향자 쌍방을 모두 처벌하지만 법정형이 다르다.", "공범론"],
["607", "甲은 자기의 보호를 받는 15세의 A를 생명 또는 신체에 위험한 업무에 사용할 영업자인 乙에게 인도하고, 乙은 A를 인도받았다. 甲과 乙은 형법 제274조 아동혹사죄의 공동정범이 성립한다.", false, "▸ 자기의 보호 또는 감독을 받는 16세 미만의 자를 그 생명 또는 신체에 위험한 업무에 사용할 영업자 또는 그 종업자에게 인도한 자는 5년 이하의 징역에 처한다. 그 인도를 받은 자도 같다(제274조 아동혹사죄). [乙은 본문, 甲은 단서에 의하여 각각 처벌된다. 필요적 공범인 대향범이므로 대향범 모두에게 처벌규정이 있는 경우이다.]", "공범론"],
["608", "★ 2인 이상 서로 대향된 행위의 존재를 필요로 하는 대향범에 대하여는 공범에 관한 형법총칙 규정이 적용될 수 없다.", true, "▸ ① 2인 이상의 서로 대향된 행위의 존재를 필요로 하는 대향범에 대하여 공범에 관한 형법 총칙 규정이 적용될 수 없다. 이러한 법리는 해당 처벌규정의 구성요건 자체에서 2인 이상의 서로 대향적 행위의 존재를 필요로 하는 필요적 공범인 대향범을 전제로 한다. ② 구성요건상으로는 단독으로 실행할 수 있는 형식으로 되어 있는데 단지 구성요건이 대향범의 형태로 실행되는 경우에는 총칙 규정이 적용된다. ③ 마약거래방지법 제7조 제1항에서 정한 '불법수익 등의 출처 또는 귀속관계를 숨기거나 가장하는 행위'는 처벌규정의 구성요건 자체에서 2인 이상의 서로 대향된 행위의 존재를 필요로 하지 않으므로 형법총칙의 공범 규정이 적용된다(2020도7866).", "공범론"],
["609", "★ 대향범에 대하여 공범에 관한 형법 총칙 규정이 적용될 수 없다는 법리는 필요적 공범인 대향범뿐만 아니라 구성요건상으로는 단독으로 실행할 수 있는 형식으로 되어 있는데 단지 구성요건이 대향범의 형태로 실행되는 경우에도 적용된다.[변24]", false, "▸ ① 2인 이상의 서로 대향된 행위의 존재를 필요로 하는 대향범에 대하여 공범에 관한 형법 총칙 규정이 적용될 수 없다. 이러한 법리는 해당 처벌규정의 구성요건 자체에서 2인 이상의 서로 대향적 행위의 존재를 필요로 하는 필요적 공범인 대향범을 전제로 한다. ② 구성요건상으로는 단독으로 실행할 수 있는 형식으로 되어 있는데 단지 구성요건이 대향범의 형태로 실행되는 경우에는 총칙 규정이 적용된다. ③ 마약거래방지법 제7조 제1항에서 정한 '불법수익 등의 출처 또는 귀속관계를 숨기거나 가장하는 행위'는 처벌규정의 구성요건 자체에서 2인 이상의 서로 대향된 행위의 존재를 필요로 하지 않으므로 형법총칙의 공범 규정이 적용된다(2020도7866).", "공범론"],
["610", "★ 甲은 타인이 부동산을 매수한 사실을 알면서 매수인을 배제하고 이를 취득할 목적으로 매도인 乙과 공모하여 그 부동산을 이중으로 매수한 후 소유권이전등기를 경료하였다. 甲, 乙은 매수인과 매도인으로 2인 이상의 서로 대향된 행위의 존재를 필요로 하는 관계에 있으므로, 甲에게 형법총칙상 공범규정이 적용되지 않는다.", false, "▸ 거래상대방이 배임행위를 교사하거나 배임행위의 전 과정에 관여하는 등 배임행위에 적극 가담함으로써 실행행위자와의 계약이 반사회적 법률행위에 해당하여 무효로 되는 경우 배임죄의 교사범 또는 공동정범이 될 수 있다(2010도7624). [임의적 공범이 대향관계로 실현되는 경우이므로 형법총칙의 공범 규정이 적용된다.]", "공범론"],
["611", "甲은 2025. 4. 2. 03:33경 피해자 A(여, 20세)의 얼굴과 다른 사람의 나체사진을 합성한 음란한 사진을 얻고자 乙에게 A의 사진과 이름, 나이, 주소 등을 제공하고 공연히 전시할 목적으로 합성을 부탁하였다. 乙은 甲의 목적을 알면서도 A의 얼굴이 합성된 음란합성사진 파일을 생성하여 甲에게 전송하였다. 음화제조죄는 대향범이므로 甲에게 음화제조교사죄를 물을 수 없다.[모25]", false, "▸ 음화제조죄는 필요적 공범인 대향범이 아니므로, 총칙의 공범 규정이 적용된다.", "공범론"],
["612", "★ 변호사 사무실 직원 甲이 법원공무원 乙에게 부탁하여 수사 중인 사건의 체포영장 발부자 명단을 누설받은 경우, 乙이 직무상 비밀을 누설한 행위와 甲이 이를 누설받은 행위는 대향범 관계에 있으므로 甲의 행위를 공무상비밀누설교사죄로 처벌할 수 없다.[변15]", true, "▸ 2인 이상 서로 대향된 행위의 존재를 필요로 하는 대향범에 대하여는 공범에 관한 형법총칙 규정이 적용될 수 없는데, 형법 제127조는 공무원 또는 공무원이었던 자가 법령에 의한 직무상 비밀을 누설하는 행위만을 처벌하고 있을 뿐 직무상 비밀을 누설받은 상대방을 처벌하는 규정이 없는 점에 비추어, 직무상 비밀을 누설받은 자에 대하여는 공범에 관한 형법총칙 규정이 적용될 수 없다(2009도3642).", "공범론"],
["613", "★ ○○경찰서 청문감사관으로 재직 중인 甲은 乙의 부탁을 받고, 같은 경찰서 수사과 직원으로부터 乙이 사기 혐의로 고소당한 사건 기록을 건네받아 乙에 대한 구속영장 신청 등 신병처리에 관한 내용이 없는 사실 등을 열람·확인한 후 乙에게 전화하여 '사건 기록에 구속 이야기가 없다. 구속될 일 없으니 걱정하지 말라'고 말해 주었다. 乙의 행위는 공무상비밀누설교사죄에 해당하지 아니한다.[변26]", true, "▸ 2인 이상 서로 대향된 행위의 존재를 필요로 하는 대향범에 대하여는 공범에 관한 형법총칙 규정이 적용될 수 없는데, 형법 제127조는 공무원 또는 공무원이었던 자가 법령에 의한 직무상 비밀을 누설하는 행위만을 처벌하고 있을 뿐 직무상 비밀을 누설받은 상대방을 처벌하는 규정이 없는 점에 비추어, 직무상 비밀을 누설받은 자에 대하여는 공범에 관한 형법총칙 규정이 적용될 수 없다(2009도3642).", "공범론"],
["614", "★ 금품 등의 수수와 같이 2인 이상의 서로 대향된 행위의 존재를 필요로 하는 관계에 있어서는 금품 등을 공여한 자에게 따로 처벌규정이 없는 이상, 금품을 공여한 자의 행위에 대하여만 관여하여 그 공여행위를 교사하거나 방조한 행위는 상대방의 범행에 대하여 공범관계가 성립되지 아니한다.[변22]", true, "▸ 금품 등의 수수와 같이 2인 이상의 서로 대향된 행위의 존재를 필요로 하는 관계에 있어서는 공범이나 방조범에 관한 형법총칙 규정의 적용이 있을 수 없다. 따라서 금품 등을 공여한 자에게 따로 처벌규정이 없는 이상, 그 공여행위는 그와 대향적 행위의 존재를 필요로 하는 상대방의 범행에 대하여 공범관계가 성립되지 아니하고, 오로지 금품 등을 공여한 자의 행위에 대하여만 관여하여 공여행위를 교사하거나 방조한 행위도 상대방의 범행에 대하여 공범관계가 성립되지 아니한다(2013도6969).", "공범론"],
["615", "★ 乙이 농수산물의원산지표시등에관한법률위반으로 단속에 걸리자 이 소식을 들은 부동산업자 丙이 \"담당공무원을 잘 알고 있으니, 나에게 현금으로 500만 원만 주면 잘 해결해주겠다\"라고 하여 乙은 丙에게 500만 원을 이체해주었다. 乙에게는 특정범죄가중처벌등에관한법률위반(알선증재)죄가, 丙에게는 특정범죄가중처벌등에관한법률위반(알선수재)죄가 성립한다.[변22]", false, "▸ ① 특가법은 알선수재만 처벌하고, 알선증재를 처벌하는 규정은 없으므로 乙에게 특가법위반(알선증재)죄가 성립할 수는 없다(이런 범죄는 없음). ② 또한 금품 등의 수수에 관한 필요적 공범이므로 乙에게 특가법위반(알선수재)죄의 공동정범이나 교사·방조범도 성립하지 않는다(2013도6969).", "공범론"],
["616", "매도, 매수와 같이 2인 이상의 서로 대향된 행위의 존재를 필요로 하는 관계에 있어서는 매도인에게 따로 처벌규정이 없는 경우, 매도인의 매도행위는 그와 대향적 행위의 존재를 필요로 하는 상대방의 매수범행에 대해 교사·방조범이 성립할 수 있다.[변17]", false, "▸ 매도, 매수와 같이 2인 이상의 서로 대향된 행위의 존재를 필요로 하는 관계에 있어서는 공범이나 방조범에 관한 형법총칙 규정의 적용이 있을 수 없고, 따라서 매도인에게 따로 처벌규정이 없는 이상 매도인의 매도행위는 그와 대향적 행위의 존재를 필요로 하는 상대방의 매수범행에 대하여 공범이나 방조범관계가 성립되지 아니한다(2001도5158).", "공범론"],
["617", "★ 변호사가 변호사 아닌 자에게 고용되어 법률사무소의 개설·운영에 관여한 경우에는 변호사법위반죄의 공범으로 처벌된다.[변16]", false, "▸ 변호사 아닌 자는 변호사를 고용하고 변호사는 변호사 아닌 자에게 고용된다는 서로 대향적인 행위의 존재가 반드시 필요한데 이를 처벌하는 규정이 없는 이상, 변호사를 변호사 아닌 자의 공범으로서 처벌할 수는 없다(2004도3994).", "공범론"],
["618", "★ 의사가 직접 환자를 진찰하지 않고 처방전을 작성·교부한 경우, 그 행위와 대향범 관계에 있는 '처방전을 교부받은 행위'를 한 자가 의사에게 진찰 없는 처방전 교부를 교사한 사실이 인정되더라도 그에게 형법 총칙상 교사범 규정을 적용할 수 없다.[변18]", true, "▸ (2011도6287)", "공범론"],
["619", "사용자는 쟁의행위 기간 중 그 쟁의행위로 중단된 업무의 수행을 위하여 당해 사업과 관계없는 자를 채용 또는 대체할 수 없고 이를 위반한 자는 처벌되나(노동조합법 제91조, 제43조 제1항), 사용자에게 채용 또는 대체되는 자에 대하여는 처벌 조항이 없는 경우, 쟁의행위 기간 중 사용자에게 채용 또는 대체된 자의 행위에 대하여는 일반적인 형법 총칙상의 공범 규정을 적용하여 공동정범, 교사범 또는 방조범으로 처벌할 수 없다.", true, "▸ (2016도3048)", "공범론"],
["620", "다수인이 집합하여 한 지방의 평온과 안전을 위험하게 할 정도로 유형력을 행사하는 데에 참여하여 이들과 함께 손괴행위를 하였다. 가담자들을 처벌함에 있어서 형법총칙상 공범규정이 적용된다.", false, "▸ 소요죄는 필요적 공범인 집합범이다. 따라서 형법총칙이 적용되지 않는다.", "공범론"],
["621", "甲과 乙은 A 회사의 사무실 금고에서 현금을 절취할 것을 공모하고, 甲이 주간에 사무실 문 앞에서 망을 보는 동안 乙은 안으로 들어가 금고에서 현금을 가지고 나왔다. 甲과 乙이 범한 범죄는 전부 형법총칙상 공범규정이 적용되지 않는다.", true, "▸ 합동으로 인한 특수절도죄, 폭처법위반(공동주거침입)죄에 해당하므로, 모두 형법총칙이 적용되지 않는다.", "공범론"],
["622", "공무원 甲의 妻 乙은 평소 강직한 성품의 甲이 뇌물을 받지 않을 것으로 생각하고, 甲에게는 자신이 A에게 빌려준 돈을 받는 것이라고 속이고, 甲으로 하여금 A로부터 뇌물로 돈을 받게 하였다. 乙은 뇌물수수죄의 간접정범으로 처벌된다.", false, "▸ 뇌물수수죄는 공무원 또는 중재인만이 주체로 될 수 있는 진정신분범인데, 乙은 공무원이라는 신분이 없으므로 단독정범이나 간접정범이 될 수 없다.\n\n[제5절 참고 - 간접정범 조문] 형법 제34조 제1항(간접정범): 어느 행위로 인하여 처벌되지 아니하는 자 또는 과실범으로 처벌되는 자를 교사 또는 방조하여 범죄행위의 결과를 발생하게 한 자는 교사 또는 방조의 예에 의하여 처벌한다. 제34조 제2항(특수교사·방조): 자기의 지휘, 감독을 받는 자를 교사 또는 방조하여 전항의 결과를 발생하게 한 자는 교사인 때에는 정범에 정한 형의 장기 또는 다액에 그 2분의 1까지 가중하고 방조인 때에는 정범의 형으로 처벌한다.", "공범론"],
["623", "★ 수표의 발행인이 아닌 자는 「부정수표 단속법」 제4조가 정한 허위신고죄의 주체가 될 수 없으나, 허위신고의 고의 없는 발행인을 이용하여 간접정범의 형태로 허위신고죄를 범할 수 있다.[변18]", false, "▸ 부정수표 단속법 제4조가 '수표금액의 지급 또는 거래정지처분을 면할 목적'을 요건으로 하고, 수표금액의 지급책임을 부담하는 자 또는 거래정지처분을 당하는 자는 발행인에 국한되는 점에 비추어 볼 때, 그와 같은 발행인이 아닌 자는 부정수표 단속법 제4조 위반죄의 주체가 될 수 없고 거짓 신고의 고의 없는 발행인을 이용하여 간접정범의 형태로 그 죄를 범할 수 없다(2013도13804).\n\n[제5절 참고 - 간접정범 조문] 형법 제34조 제1항(간접정범): 어느 행위로 인하여 처벌되지 아니하는 자 또는 과실범으로 처벌되는 자를 교사 또는 방조하여 범죄행위의 결과를 발생하게 한 자는 교사 또는 방조의 예에 의하여 처벌한다. 제34조 제2항(특수교사·방조): 자기의 지휘, 감독을 받는 자를 교사 또는 방조하여 전항의 결과를 발생하게 한 자는 교사인 때에는 정범에 정한 형의 장기 또는 다액에 그 2분의 1까지 가중하고 방조인 때에는 정범의 형으로 처벌한다.", "공범론"],
["624", "농업협동조합법 제50조 제2항 소정의 호별방문죄는 '임원이 되고자 하는 자'라는 신분자가 스스로 호별방문을 한 경우만을 처벌하는 것으로 보아야 하고, 비록 신분자가 비신분자와 통모하였거나 신분자가 비신분자를 시켜 방문케 하였다고 하더라도 비신분자만이 호별방문을 한 경우에는 신분자는 물론 비신분자도 본죄로 처벌할 수는 없다.", true, "▸ (2003도889)\n\n[제5절 참고 - 간접정범 조문] 형법 제34조 제1항(간접정범): 어느 행위로 인하여 처벌되지 아니하는 자 또는 과실범으로 처벌되는 자를 교사 또는 방조하여 범죄행위의 결과를 발생하게 한 자는 교사 또는 방조의 예에 의하여 처벌한다. 제34조 제2항(특수교사·방조): 자기의 지휘, 감독을 받는 자를 교사 또는 방조하여 전항의 결과를 발생하게 한 자는 교사인 때에는 정범에 정한 형의 장기 또는 다액에 그 2분의 1까지 가중하고 방조인 때에는 정범의 형으로 처벌한다.", "공범론"],
["625", "甲의 의사지배에 의하여 乙이 자살을 시도하게 한 경우, 형법은 자살행위를 처벌하는 규정을 두고 있지 않기 때문에 乙은 자살미수로 처벌되지 않고, 甲도 乙이 처벌되지 않는 이상 살인미수죄의 간접정범으로 처벌되지 않는다.", false, "▸ 피고인이 7세, 3세 남짓된 어린 자식들에 대하여 함께 죽자고 권유하여 물속에 따라 들어오게 하여 결국 익사하게 하였다면 비록 피해자들을 물속에 직접 밀어서 빠뜨리지는 않았다고 하더라도 자살의 의미를 이해할 능력이 없고 피고인의 말이라면 무엇이나 복종하는 어린 자식들을 권유하여 익사하게 한 이상 살인죄의 범의는 있었음이 분명하다(86도2395). [甲은 '의사지배'에 의하여 乙이 자살을 시도하게 하였으므로 살인미수죄의 간접정범으로 처벌된다.]\n\n[제5절 참고 - 간접정범 조문] 형법 제34조 제1항(간접정범): 어느 행위로 인하여 처벌되지 아니하는 자 또는 과실범으로 처벌되는 자를 교사 또는 방조하여 범죄행위의 결과를 발생하게 한 자는 교사 또는 방조의 예에 의하여 처벌한다. 제34조 제2항(특수교사·방조): 자기의 지휘, 감독을 받는 자를 교사 또는 방조하여 전항의 결과를 발생하게 한 자는 교사인 때에는 정범에 정한 형의 장기 또는 다액에 그 2분의 1까지 가중하고 방조인 때에는 정범의 형으로 처벌한다.", "공범론"],
["626", "★ 甲이 소송상의 주장이 사실과 다름이 객관적으로 명백하거나 증거가 조작되어 있다는 정을 인식하지 못하는 제3자를 이용하여 그로 하여금 소송의 당사자가 되게 하여 법원을 기망하였다면 甲에게 간접정범의 형태에 의한 소송사기죄가 성립한다.[변23]", true, "▸ 자기에게 유리한 판결을 얻기 위하여 소송상의 주장이 사실과 다름이 객관적으로 명백하거나 증거가 조작되어 있다는 정을 인식하지 못하는 제3자를 이용하여 그로 하여금 소송의 당사자가 되게 하고 법원을 기망하여 소송 상대방의 재물 또는 재산상 이익을 취득하려 하였다면 간접정범의 형태에 의한 소송사기죄가 성립하게 된다(2006도3591). [甲이 A에 대해 보유하고 있는 차용증에 약정이자를 부가하여 위조한 후 그 정을 모르는 B에게 약정이자 2,500만 원을 양도하여, B로 하여금 약정이자 청구 소송을 제기하도록 한 경우, 2,500만 원 중 법정지연손해금 상당의 돈을 제외한 나머지 돈에 관한 甲의 행위는 B를 도구로 이용한 간접정범 형태의 소송사기죄를 구성한다.]\n\n[제5절 참고 - 간접정범 조문] 형법 제34조 제1항(간접정범): 어느 행위로 인하여 처벌되지 아니하는 자 또는 과실범으로 처벌되는 자를 교사 또는 방조하여 범죄행위의 결과를 발생하게 한 자는 교사 또는 방조의 예에 의하여 처벌한다. 제34조 제2항(특수교사·방조): 자기의 지휘, 감독을 받는 자를 교사 또는 방조하여 전항의 결과를 발생하게 한 자는 교사인 때에는 정범에 정한 형의 장기 또는 다액에 그 2분의 1까지 가중하고 방조인 때에는 정범의 형으로 처벌한다.", "공범론"],
["627", "자기에게 유리한 판결을 얻기 위하여 증거를 조작하여 법원에 제출하는 방식으로 법원을 기망하여 승소함으로써 재산상 이익을 취득한 경우, 법원을 피이용자로 한 사기죄의 간접정범이 성립한다.[변26]", false, "▸ 사기죄의 간접정범이 아닌 직접정범이 성립한다(삼각사기).\n\n[제5절 참고 - 간접정범 조문] 형법 제34조 제1항(간접정범): 어느 행위로 인하여 처벌되지 아니하는 자 또는 과실범으로 처벌되는 자를 교사 또는 방조하여 범죄행위의 결과를 발생하게 한 자는 교사 또는 방조의 예에 의하여 처벌한다. 제34조 제2항(특수교사·방조): 자기의 지휘, 감독을 받는 자를 교사 또는 방조하여 전항의 결과를 발생하게 한 자는 교사인 때에는 정범에 정한 형의 장기 또는 다액에 그 2분의 1까지 가중하고 방조인 때에는 정범의 형으로 처벌한다.", "공범론"],
["628", "★ 초과주관적 구성요건인 목적을 가진 사람이 고의는 있으나 목적이 없는 사람을 도구로 이용한 경우에도 간접정범이 성립할 수 있다.[변26]", true, "▸ ① 간접정범은 목적범이거나 신분범일 때 그 목적·신분이 없는 자를 마치 도구나 손발과 같이 이용하여 간접으로 실행한 자를 간접정범으로 처벌하는 것이다(83도515). ② 국헌문란의 목적을 가진 자가 그러한 목적이 없는 자를 이용하여 내란죄를 실행할 수 있다(96도3376). [규범적·사회적 의사지배설(다수설)]\n\n[제5절 참고 - 간접정범 조문] 형법 제34조 제1항(간접정범): 어느 행위로 인하여 처벌되지 아니하는 자 또는 과실범으로 처벌되는 자를 교사 또는 방조하여 범죄행위의 결과를 발생하게 한 자는 교사 또는 방조의 예에 의하여 처벌한다. 제34조 제2항(특수교사·방조): 자기의 지휘, 감독을 받는 자를 교사 또는 방조하여 전항의 결과를 발생하게 한 자는 교사인 때에는 정범에 정한 형의 장기 또는 다액에 그 2분의 1까지 가중하고 방조인 때에는 정범의 형으로 처벌한다.", "공범론"],
["629", "★ 인신 구속에 관한 직무를 행하는 사람이 피해자를 구속하기 위하여 진술조서 등을 허위로 작성한 후 이를 기록에 첨부하여 구속영장을 신청하고, 그 사정을 모르는 검사와 영장전담판사를 기망하여 구속영장을 발부받아 피해자를 구금하였다면 직권남용감금죄의 간접정범이 성립한다.[변26]", true, "▸ 감금죄는 간접정범의 형태로도 행하여질 수 있는 것이므로, 인신구속에 관한 직무를 행하는 자 또는 이를 보조하는 자가 피해자를 구속하기 위하여 진술조서 등을 허위로 작성한 후 이를 기록에 첨부하여 구속영장을 신청하고, 이러한 사정을 모르는 검사와 영장전담판사를 기망하여 구속영장을 발부받은 후 그 영장에 의하여 피해자를 구금하였다면 제124조 제1항의 직권남용감금죄가 성립한다(2003도3945). [① 정당행위로 위법성이 조각되는 검사와 판사를 이용한 간접정범이 성립한다. ② 체포사유 자체는 존재하므로 설령 유출한 수사자료를 회수하기 위해 행해졌다고 하더라도 불법체포·감금죄의 간접정범이 성립하지 않는다.]\n\n[제5절 참고 - 간접정범 조문] 형법 제34조 제1항(간접정범): 어느 행위로 인하여 처벌되지 아니하는 자 또는 과실범으로 처벌되는 자를 교사 또는 방조하여 범죄행위의 결과를 발생하게 한 자는 교사 또는 방조의 예에 의하여 처벌한다. 제34조 제2항(특수교사·방조): 자기의 지휘, 감독을 받는 자를 교사 또는 방조하여 전항의 결과를 발생하게 한 자는 교사인 때에는 정범에 정한 형의 장기 또는 다액에 그 2분의 1까지 가중하고 방조인 때에는 정범의 형으로 처벌한다.", "공범론"],
["630", "검사 甲은 수사관 乙과 함께 피의자 A에 대한 특정경제범죄가중처벌등에관한법률위반(알선수재등) 사건 수사를 진행하면서 A에게 수사자료를 유출하였는데 이 사실이 발각될 위험에 처하자 압수·수색을 통해 해당 자료를 회수한 후 폐기하는 방식으로 수사자료 유출 사실을 은폐하기로 하고, 판사로부터 압수·수색·검증영장과 체포영장을 발부받은 후 검사실에서 체포영장을 집행하여 A를 체포하였다. 체포영장을 청구할 당시 A가 위 죄를 범하였다고 의심할 만한 상당한 이유가 있었던 경우일지라도 甲의 체포는 유출한 수사자료를 회수하기 위해 행해졌으므로, 판사를 기망하여 발부받은 영장에 의해 체포한 간접정범 형태의 불법체포·감금죄가 甲에게 성립한다.[모25]", false, "▸ 감금죄는 간접정범의 형태로도 행하여질 수 있는 것이므로, 인신구속에 관한 직무를 행하는 자 또는 이를 보조하는 자가 피해자를 구속하기 위하여 진술조서 등을 허위로 작성한 후 이를 기록에 첨부하여 구속영장을 신청하고, 이러한 사정을 모르는 검사와 영장전담판사를 기망하여 구속영장을 발부받은 후 그 영장에 의하여 피해자를 구금하였다면 제124조 제1항의 직권남용감금죄가 성립한다(2003도3945). [① 정당행위로 위법성이 조각되는 검사와 판사를 이용한 간접정범이 성립한다. ② 체포사유 자체는 존재하므로 설령 유출한 수사자료를 회수하기 위해 행해졌다고 하더라도 불법체포·감금죄의 간접정범이 성립하지 않는다.]\n\n[제5절 참고 - 간접정범 조문] 형법 제34조 제1항(간접정범): 어느 행위로 인하여 처벌되지 아니하는 자 또는 과실범으로 처벌되는 자를 교사 또는 방조하여 범죄행위의 결과를 발생하게 한 자는 교사 또는 방조의 예에 의하여 처벌한다. 제34조 제2항(특수교사·방조): 자기의 지휘, 감독을 받는 자를 교사 또는 방조하여 전항의 결과를 발생하게 한 자는 교사인 때에는 정범에 정한 형의 장기 또는 다액에 그 2분의 1까지 가중하고 방조인 때에는 정범의 형으로 처벌한다.", "공범론"],
["631", "자기의 지휘, 감독을 받는 자를 방조하여 범죄의 결과를 발생하게 한 자는 정범에 정한 형의 장기 또는 다액에 그 2분의 1까지 가중한 형으로 처벌한다.[변15]", false, "▸ 특수방조는 정범의 형으로 처벌한다(제34조 제2항).\n\n[제5절 참고 - 간접정범 조문] 형법 제34조 제1항(간접정범): 어느 행위로 인하여 처벌되지 아니하는 자 또는 과실범으로 처벌되는 자를 교사 또는 방조하여 범죄행위의 결과를 발생하게 한 자는 교사 또는 방조의 예에 의하여 처벌한다. 제34조 제2항(특수교사·방조): 자기의 지휘, 감독을 받는 자를 교사 또는 방조하여 전항의 결과를 발생하게 한 자는 교사인 때에는 정범에 정한 형의 장기 또는 다액에 그 2분의 1까지 가중하고 방조인 때에는 정범의 형으로 처벌한다.", "공범론"],
["632", "과실에 의한 교사도 가능하다.", false, "▸ 과실로는 범행을 결의하게 할 수 없으므로 과실에 의한 교사는 불가능하다.\n\n[제6절 참고 - 교사범 조문] 형법 제31조(교사범) ① 타인을 교사하여 죄를 범하게 한 자는 죄를 실행한 자와 동일한 형으로 처벌한다. ② 교사를 받은 자가 범죄의 실행을 승낙하고 실행의 착수에 이르지 아니한 때에는 교사자와 피교사자를 음모 또는 예비에 준하여 처벌한다. ③ 교사를 받은 자가 범죄의 실행을 승낙하지 아니한 때에도 교사자에 대하여는 전항과 같다.", "공범론"],
["633", "교사자가 2인 이상일 때에는 공동교사가 성립할 수 있다.", true, "▸ 교사자가 2인 이상인 공동교사도 가능하다.\n\n[제6절 참고 - 교사범 조문] 형법 제31조(교사범) ① 타인을 교사하여 죄를 범하게 한 자는 죄를 실행한 자와 동일한 형으로 처벌한다. ② 교사를 받은 자가 범죄의 실행을 승낙하고 실행의 착수에 이르지 아니한 때에는 교사자와 피교사자를 음모 또는 예비에 준하여 처벌한다. ③ 교사를 받은 자가 범죄의 실행을 승낙하지 아니한 때에도 교사자에 대하여는 전항과 같다.", "공범론"],
["634", "★ 교사행위에 의하여 피교사자가 범죄 실행을 결의하게 되었더라도 피교사자에게 다른 원인이 있어 범죄를 실행한 경우에는 교사범이 성립하지 않는다.[모25]", false, "▸ 교사범의 교사가 정범이 죄를 범한 유일한 조건일 필요는 없으므로, 교사행위에 의하여 정범이 실행을 결의하게 된 이상 비록 정범에게 범죄의 습벽이 있어 그 습벽과 함께 교사행위가 원인이 되어 정범이 범죄를 실행한 경우에도 교사범의 성립에 영향이 없다(91도542). [피고인이 甲, 乙, 丙이 절취하여 온 장물을 상습으로 매수하여 취득하여 오다가, 甲, 乙에게 일제 드라이버 1개를 사주면서 \"丙이 구속되어 도망다니려면 돈도 필요할 텐데 열심히 일을 하라(도둑질을 하라)\"고 말하였다면, 절도의 교사가 있었다고 보아야 한다.]\n\n[제6절 참고 - 교사범 조문] 형법 제31조(교사범) ① 타인을 교사하여 죄를 범하게 한 자는 죄를 실행한 자와 동일한 형으로 처벌한다. ② 교사를 받은 자가 범죄의 실행을 승낙하고 실행의 착수에 이르지 아니한 때에는 교사자와 피교사자를 음모 또는 예비에 준하여 처벌한다. ③ 교사를 받은 자가 범죄의 실행을 승낙하지 아니한 때에도 교사자에 대하여는 전항과 같다.", "공범론"],
["635", "★ 교사자의 교사행위에 의하여 정범이 실행을 결의하게 되었다고 하더라도 정범에게 범죄의 습벽이 있어 교사행위와 함께 그 습벽이 원인이 되어 정범이 범죄를 실행하였다면 교사자에게 교사범이 성립하지 않는다.", false, "▸ 교사범의 교사가 정범이 죄를 범한 유일한 조건일 필요는 없으므로, 교사행위에 의하여 정범이 실행을 결의하게 된 이상 비록 정범에게 범죄의 습벽이 있어 그 습벽과 함께 교사행위가 원인이 되어 정범이 범죄를 실행한 경우에도 교사범의 성립에 영향이 없다(91도542). [피고인이 甲, 乙, 丙이 절취하여 온 장물을 상습으로 매수하여 취득하여 오다가, 甲, 乙에게 일제 드라이버 1개를 사주면서 \"丙이 구속되어 도망다니려면 돈도 필요할 텐데 열심히 일을 하라(도둑질을 하라)\"고 말하였다면, 절도의 교사가 있었다고 보아야 한다.]\n\n[제6절 참고 - 교사범 조문] 형법 제31조(교사범) ① 타인을 교사하여 죄를 범하게 한 자는 죄를 실행한 자와 동일한 형으로 처벌한다. ② 교사를 받은 자가 범죄의 실행을 승낙하고 실행의 착수에 이르지 아니한 때에는 교사자와 피교사자를 음모 또는 예비에 준하여 처벌한다. ③ 교사를 받은 자가 범죄의 실행을 승낙하지 아니한 때에도 교사자에 대하여는 전항과 같다.", "공범론"],
["636", "★ 교사자가 이미 특정한 범죄의 결의를 가지고 있는 사람을 교사하여 그 결의를 강화시켰다면 교사범이 성립할 수 있다.", false, "▸ 피교사자가 이미 범죄의 결의를 가지고 있을 때에는 교사범이 성립할 여지가 없다(91도542). [결의를 강화하여 '방조'가 성립할 수는 있다.]\n\n[제6절 참고 - 교사범 조문] 형법 제31조(교사범) ① 타인을 교사하여 죄를 범하게 한 자는 죄를 실행한 자와 동일한 형으로 처벌한다. ② 교사를 받은 자가 범죄의 실행을 승낙하고 실행의 착수에 이르지 아니한 때에는 교사자와 피교사자를 음모 또는 예비에 준하여 처벌한다. ③ 교사를 받은 자가 범죄의 실행을 승낙하지 아니한 때에도 교사자에 대하여는 전항과 같다.", "공범론"],
["637", "★ 피교사자가 교사자의 교사행위 당시에 일응 범행을 승낙하지 아니한 것으로 보인다면 이후 그 교사행위에 의하여 범행을 결의한 것으로 인정되더라도 교사범이 성립하지 않는다.[모25]", false, "▸ 피교사자가 교사행위 당시에는 일응 범행을 승낙하지 아니한 것으로 보여진다 하더라도 이후 그 교사행위에 의하여 범행을 결의한 것으로 인정되는 이상 교사범의 성립에는 영향이 없다(2012도2744). [甲이 낙태를 권유하였으나, 임신한 乙이 이를 거절하였지만 결국은 甲으로 인하여 낙태를 결의·실행하게 되었다고 볼 수 있는 경우에는 甲의 낙태교사행위와 乙의 낙태결의 사이에 인과관계가 단절되는 것은 아니므로, 甲에게 낙태교사죄가 성립한다.]\n\n[제6절 참고 - 교사범 조문] 형법 제31조(교사범) ① 타인을 교사하여 죄를 범하게 한 자는 죄를 실행한 자와 동일한 형으로 처벌한다. ② 교사를 받은 자가 범죄의 실행을 승낙하고 실행의 착수에 이르지 아니한 때에는 교사자와 피교사자를 음모 또는 예비에 준하여 처벌한다. ③ 교사를 받은 자가 범죄의 실행을 승낙하지 아니한 때에도 교사자에 대하여는 전항과 같다.", "공범론"],
["638", "甲이 X 회사에서 자금을 담당하는 乙에게 자금을 횡령하라고 교사하는 경우 甲은 乙이 업무상 자금을 보관하고 있다는 것을 인식하여야 업무상 횡령죄의 교사의 고의를 인정할 수 있다.", true, "▸ 교사범에게 정범의 신분·목적에 대한 고의도 필요하다.\n\n[제6절 참고 - 교사범 조문] 형법 제31조(교사범) ① 타인을 교사하여 죄를 범하게 한 자는 죄를 실행한 자와 동일한 형으로 처벌한다. ② 교사를 받은 자가 범죄의 실행을 승낙하고 실행의 착수에 이르지 아니한 때에는 교사자와 피교사자를 음모 또는 예비에 준하여 처벌한다. ③ 교사를 받은 자가 범죄의 실행을 승낙하지 아니한 때에도 교사자에 대하여는 전항과 같다.", "공범론"],
["639", "★ 마약범죄 등의 수사에서 수사기관이 신분을 숨긴 채 범죄를 교사한 후 그 실행을 기다려 범인을 체포하고 증거를 수집하는 '함정수사(함정교사)'에 있어서 피교사자의 미수를 의도한 수사기관에게는 정범의 기수 고의가 없기에 피교사자가 행한 범죄의 교사범이 성립하지 않는다.[모25]", true, "▸ ① 피교사자에게는 기수의 고의가 있으므로, 기수범 또는 미수범이 성립한다. ② 교사자가 애초에 피교사자가 미수에 그칠 것을 예상하면서 교사를 하는 미수의 교사는 정범의 실행행위에 대한 기수의 고의가 없으므로 교사범이 성립하지 않는다. 피교사자가 예상과 달리 기수에 이른 경우에도, 교사자는 교사범이 성립하지 않고 단지 과실범만 문제될 뿐이다.\n\n[제6절 참고 - 교사범 조문] 형법 제31조(교사범) ① 타인을 교사하여 죄를 범하게 한 자는 죄를 실행한 자와 동일한 형으로 처벌한다. ② 교사를 받은 자가 범죄의 실행을 승낙하고 실행의 착수에 이르지 아니한 때에는 교사자와 피교사자를 음모 또는 예비에 준하여 처벌한다. ③ 교사를 받은 자가 범죄의 실행을 승낙하지 아니한 때에도 교사자에 대하여는 전항과 같다.", "공범론"],
["640", "마약수사관 甲이 사술로 필로폰을 매수할 의사가 없는 乙로 하여금 필로폰을 매수하도록 하였다면, 乙은 수사기관의 사술에 의해 필로폰을 매수한 것에 불과하므로 필로폰 매수의 범의가 인정되지 않고, 이를 교사한 甲도 乙에게 고의가 인정되지 않는 이상 제한적 종속형식에 의하면 교사범이 성립하지 않는다.[변12]", false, "▸ 乙은 수사기관의 사술에 의한 것이지만 범의가 인정된다(범의유발형 함정수사). 따라서 비록 공소기각 판결(형사소송법 제327조 제2호) 대상이라고 하더라도 범죄는 성립하므로, 甲에게 교사범이 성립한다.\n\n[제6절 참고 - 교사범 조문] 형법 제31조(교사범) ① 타인을 교사하여 죄를 범하게 한 자는 죄를 실행한 자와 동일한 형으로 처벌한다. ② 교사를 받은 자가 범죄의 실행을 승낙하고 실행의 착수에 이르지 아니한 때에는 교사자와 피교사자를 음모 또는 예비에 준하여 처벌한다. ③ 교사를 받은 자가 범죄의 실행을 승낙하지 아니한 때에도 교사자에 대하여는 전항과 같다.", "공범론"],
["641", "★ 甲은 乙에게 칼을 주며 \"A를 반드시 죽여 달라\"라고 당부하였다. 이에 乙은 甲의 당부대로 A의 집으로 향하였으나, 갑자기 마음이 바뀐 甲은 乙이 실행의 착수에 이르기 전 전화로 \"그만두자\"라고 乙을 만류하였다. 그러나 乙은 A를 칼로 찔러 살해하였다. 甲은 乙에게 A를 살해할 것을 교사한 후 乙이 실행의 착수에 이르기 전에 범행을 만류하였으므로, 살인교사의 죄책을 지지 않는다.[변23]", false, "▸ ① 교사는 범죄를 결의하지 않은 피교사자에게 특정범죄를 '결의하게' 하는 것이다. ② 교사범이 그 공범관계로부터 이탈하기 위해서는 피교사자가 범죄의 실행행위에 나아가기 전에, 교사행위를 철회한다는 의사를 표시하고, 교사범에 의하여 형성된 피교사자의 범죄 실행의 '결의를 해소'하는 것이 필요하다. ③ 결의해소는 ⓐ 교사범이 교사행위를 철회한다는 의사를 표시하고 이에 피교사자도 그 의사에 따르기로 하거나, ⓑ 교사범이 명시적으로 교사행위를 철회함과 아울러 피교사자의 범죄 실행을 방지하기 위한 진지한 노력을 다하여 당초 피교사자가 범죄를 결의하게 된 사정을 제거한 경우에 인정된다. ④ 교사 철회가 인정되지 않는 한, 이후 피교사자가 범죄를 저지르면 교사자는 제31조 제1항의 교사범으로서의 죄책을 부담한다(2012도7407).\n\n[제6절 참고 - 교사범 조문] 형법 제31조(교사범) ① 타인을 교사하여 죄를 범하게 한 자는 죄를 실행한 자와 동일한 형으로 처벌한다. ② 교사를 받은 자가 범죄의 실행을 승낙하고 실행의 착수에 이르지 아니한 때에는 교사자와 피교사자를 음모 또는 예비에 준하여 처벌한다. ③ 교사를 받은 자가 범죄의 실행을 승낙하지 아니한 때에도 교사자에 대하여는 전항과 같다.", "공범론"],
["642", "위 사례에서 만약 乙이 살인의 실행행위로 나아가기 전에 甲이 자신이 형성한 乙의 살인 범행결의를 해소하였고 乙의 행위가 새로운 범죄 실행의 결의에 따른 것이라고 하더라도, 이후에 乙이 살인의 실행행위로 나아간 이상 甲은 살인교사범의 죄책을 진다.", false, "▸ ① 교사는 범죄를 결의하지 않은 피교사자에게 특정범죄를 '결의하게' 하는 것이다. ② 교사범이 그 공범관계로부터 이탈하기 위해서는 피교사자가 범죄의 실행행위에 나아가기 전에, 교사행위를 철회한다는 의사를 표시하고, 교사범에 의하여 형성된 피교사자의 범죄 실행의 '결의를 해소'하는 것이 필요하다. ③ 피교사자의 범죄 실행의 결의해소가 인정된 이상 이후 피교사자가 범죄를 저지르더라도 이는 당초의 교사행위에 의한 것이 아니라 새로운 범죄 실행의 결의에 따른 것이므로 교사자는 제31조 제2항에 의한 죄책을 부담함은 별론으로 하고 제31조 제1항에 의한 교사범으로서의 죄책을 부담하지는 않는다(2012도7407).\n\n[제6절 참고 - 교사범 조문] 형법 제31조(교사범) ① 타인을 교사하여 죄를 범하게 한 자는 죄를 실행한 자와 동일한 형으로 처벌한다. ② 교사를 받은 자가 범죄의 실행을 승낙하고 실행의 착수에 이르지 아니한 때에는 교사자와 피교사자를 음모 또는 예비에 준하여 처벌한다. ③ 교사를 받은 자가 범죄의 실행을 승낙하지 아니한 때에도 교사자에 대하여는 전항과 같다.", "공범론"],
["643", "★ 형법은 효과 없는 교사는 교사자를 처벌하지만, 실패한 교사는 교사자를 처벌하지 않는다.", false, "▸ ① '효과 없는 교사'의 경우에는 교사자와 피교사자를 예비·음모에 준하여 처벌하고(제31조 제2항), ② '실패한 교사'의 경우에는 교사자만 예비·음모에 준하여 처벌한다(제31조 제3항).\n\n[제6절 참고 - 교사범 조문] 형법 제31조(교사범) ① 타인을 교사하여 죄를 범하게 한 자는 죄를 실행한 자와 동일한 형으로 처벌한다. ② 교사를 받은 자가 범죄의 실행을 승낙하고 실행의 착수에 이르지 아니한 때에는 교사자와 피교사자를 음모 또는 예비에 준하여 처벌한다. ③ 교사를 받은 자가 범죄의 실행을 승낙하지 아니한 때에도 교사자에 대하여는 전항과 같다.", "공범론"],
["644", "★ 甲이 칼을 들고 강제추행을 하라고 교사하였고 피교사자 乙이 이를 승낙하고도 이후 실행의 착수를 하지 않은 경우 교사자인 甲만 「성폭력범죄의 처벌 등에 관한 특례법」 제15조의2(예비, 음모)에 준하여 처벌된다.[변21]", false, "▸ ① 특수강제추행의 예비·음모는 처벌된다(성폭법 제15조의2, 제4조 제2항). 효과 없는 교사로 교사자와 피교사자 모두 예비·음모에 준하여 처벌된다(제31조 제2항). ② 실패한 교사로 교사자 甲만 처벌된다. ③ 甲도 형법상 강제추행은 예비·음모 처벌규정이 없으므로 처벌되지 않아 甲과 乙 모두 처벌되지 않는다. 실패한 교사이므로 乙은 설령 예비·음모 처벌규정이 존재하더라도 처벌되지 않는다.\n\n[제6절 참고 - 교사범 조문] 형법 제31조(교사범) ① 타인을 교사하여 죄를 범하게 한 자는 죄를 실행한 자와 동일한 형으로 처벌한다. ② 교사를 받은 자가 범죄의 실행을 승낙하고 실행의 착수에 이르지 아니한 때에는 교사자와 피교사자를 음모 또는 예비에 준하여 처벌한다. ③ 교사를 받은 자가 범죄의 실행을 승낙하지 아니한 때에도 교사자에 대하여는 전항과 같다.", "공범론"],
["645", "★ 위 사례에서 만약 피교사자 乙이 이를 승낙하지 않았다면, 甲과 乙 모두 처벌되지 않는다.", false, "▸ ① 특수강제추행의 예비·음모는 처벌된다(성폭법 제15조의2, 제4조 제2항). 효과 없는 교사로 교사자와 피교사자 모두 예비·음모에 준하여 처벌된다(제31조 제2항). ② 실패한 교사로 교사자 甲만 처벌된다. ③ 甲도 형법상 강제추행은 예비·음모 처벌규정이 없으므로 처벌되지 않아 甲과 乙 모두 처벌되지 않는다. 실패한 교사이므로 乙은 설령 예비·음모 처벌규정이 존재하더라도 처벌되지 않는다.\n\n[제6절 참고 - 교사범 조문] 형법 제31조(교사범) ① 타인을 교사하여 죄를 범하게 한 자는 죄를 실행한 자와 동일한 형으로 처벌한다. ② 교사를 받은 자가 범죄의 실행을 승낙하고 실행의 착수에 이르지 아니한 때에는 교사자와 피교사자를 음모 또는 예비에 준하여 처벌한다. ③ 교사를 받은 자가 범죄의 실행을 승낙하지 아니한 때에도 교사자에 대하여는 전항과 같다.", "공범론"],
["646", "★ 만약 甲이 칼을 사용하지 않고 단순한 강제추행을 하라고 교사하였으나 피교사자 乙이 이를 승낙하지 않았다면, 甲과 乙 모두 처벌되지 않는다.", true, "▸ ① 특수강제추행의 예비·음모는 처벌된다(성폭법 제15조의2, 제4조 제2항). 효과 없는 교사로 교사자와 피교사자 모두 예비·음모에 준하여 처벌된다(제31조 제2항). ② 실패한 교사로 교사자 甲만 처벌된다. ③ 甲도 형법상 강제추행은 예비·음모 처벌규정이 없으므로 처벌되지 않아 甲과 乙 모두 처벌되지 않는다. 실패한 교사이므로 乙은 설령 예비·음모 처벌규정이 존재하더라도 처벌되지 않는다.\n\n[제6절 참고 - 교사범 조문] 형법 제31조(교사범) ① 타인을 교사하여 죄를 범하게 한 자는 죄를 실행한 자와 동일한 형으로 처벌한다. ② 교사를 받은 자가 범죄의 실행을 승낙하고 실행의 착수에 이르지 아니한 때에는 교사자와 피교사자를 음모 또는 예비에 준하여 처벌한다. ③ 교사를 받은 자가 범죄의 실행을 승낙하지 아니한 때에도 교사자에 대하여는 전항과 같다.", "공범론"],
["647", "★ 「형법」 제32조 제2항은 \"종범의 형은 정범의 형보다 감경한다\"라고 규정하고 있는데, 여기서 감경한다는 것은 법정형을 정범보다 감경한다는 것이 아니라 선고형을 감경한다는 의미이므로, 종범에 대한 선고형이 정범보다 무거운 것은 위법하다.", false, "▸ 형법 제32조 제2항에서 '감경한다'는 것은 법정형을 정범보다 감경한다는 것이지 선고형을 감경한다는 것이 아니므로, 종범에 대한 선고형이 정범보다 가볍지 않다 하더라도 위법이라 할 수 없다(2015도8408).\n\n[제7절 참고 - 방조범(종범) 조문] 형법 제32조(종범) ① 타인의 범죄를 방조한 자는 종범으로 처벌한다. ② 종범의 형은 정범의 형보다 감경한다.", "공범론"],
["648", "★ 정범에게 범행의 결의를 강화하도록 하는 것과 같은 무형적, 정신적 방조행위는 형법상 방조행위에 해당하지 않는다.", false, "▸ 방조행위는 정범이 범행을 한다는 정을 알면서 실행행위를 용이하게 하는 직·간접의 모든 행위를 가리키는 것으로서 유형적·물질적인 방조뿐만 아니라 정범에게 범행의 결의를 강화하도록 하는 것과 같은 무형적·정신적 방조행위도 포함된다(2022도649).\n\n[제7절 참고 - 방조범(종범) 조문] 형법 제32조(종범) ① 타인의 범죄를 방조한 자는 종범으로 처벌한다. ② 종범의 형은 정범의 형보다 감경한다.", "공범론"],
["649", "근로자나 노동조합에 조력하는 제3자도 헌법 제21조에 따른 표현의 자유나 헌법 제10조에 내재된 일반적 행동의 자유를 가지고 있으므로, 위법한 쟁의행위에 대한 조력행위가 업무방해방조에 해당하는지 판단할 때는 헌법이 보장하는 위와 같은 기본권이 위축되지 않도록 업무방해방조죄의 성립 범위를 신중하게 판단하여야 한다.[모25]", true, "▸ (2017도9835)\n\n[제7절 참고 - 방조범(종범) 조문] 형법 제32조(종범) ① 타인의 범죄를 방조한 자는 종범으로 처벌한다. ② 종범의 형은 정범의 형보다 감경한다.", "공범론"],
["650", "★ 정범의 실행을 용이하게 하는 방조행위는 작위에 의하여서는 물론이고 부작위에 의하여서도 가능하다.[모25]", true, "▸ (95도2551)\n\n[제7절 참고 - 방조범(종범) 조문] 형법 제32조(종범) ① 타인의 범죄를 방조한 자는 종범으로 처벌한다. ② 종범의 형은 정범의 형보다 감경한다.", "공범론"],
["651", "★ 형법상 방조는 작위에 의하여 정범의 실행행위를 용이하게 하는 경우는 물론, 직무상의 의무가 있는 자가 정범의 범죄행위를 인식하면서도 그것을 방지하여야 할 제반조치를 취하지 아니하는 부작위로 인하여 정범의 실행행위를 용이하게 하는 경우에도 성립한다.[변23]", true, "▸ (95도2551)\n\n[제7절 참고 - 방조범(종범) 조문] 형법 제32조(종범) ① 타인의 범죄를 방조한 자는 종범으로 처벌한다. ② 종범의 형은 정범의 형보다 감경한다.", "공범론"],
["652", "은행지점장이 정범인 부하직원들의 범행을 인식하면서도 그들의 은행에 대한 배임행위를 방치하였다면 업무상배임죄의 방조범이 성립한다.", true, "▸ (84도1906)\n\n[제7절 참고 - 방조범(종범) 조문] 형법 제32조(종범) ① 타인의 범죄를 방조한 자는 종범으로 처벌한다. ② 종범의 형은 정범의 형보다 감경한다.", "공범론"],
["653", "자동차운전면허가 없는 자에게 승용차를 제공하여 그로 하여금 무면허운전을 하게 하였다면 이는 도로교통법위반(무면허운전) 범행의 방조행위에 해당한다.", true, "▸ (2000도1914)\n\n[제7절 참고 - 방조범(종범) 조문] 형법 제32조(종범) ① 타인의 범죄를 방조한 자는 종범으로 처벌한다. ② 종범의 형은 정범의 형보다 감경한다.", "공범론"],
["654", "★ 방조범이 성립하기 위하여 방조범과 정범 사이의 의사연락을 요하지는 않는다.[변21]", true, "▸ 편면적 종범에서도 정범의 범죄행위 없이 방조범만이 성립될 수 없다(74도509). [편면적 종범도 가능하다는 취지]\n\n[제7절 참고 - 방조범(종범) 조문] 형법 제32조(종범) ① 타인의 범죄를 방조한 자는 종범으로 처벌한다. ② 종범의 형은 정범의 형보다 감경한다.", "공범론"],
["655", "교사범을 방조한 경우에는 방조범이 성립하지만, 방조범을 교사한 경우에는 교사범이 성립한다.", false, "▸ 방조의 방법에는 제한이 없으므로, ① 방조범에 대한 방조(간접·연쇄방조), ② 교사범에 대한 방조, ③ 방조범에 대한 교사 모두 정범의 실행행위에 영향을 미친 경우 '정범'에 대한 '방조범'이 성립한다. [정범의 실행 착수를 전제]\n\n[제7절 참고 - 방조범(종범) 조문] 형법 제32조(종범) ① 타인의 범죄를 방조한 자는 종범으로 처벌한다. ② 종범의 형은 정범의 형보다 감경한다.", "공범론"],
["656", "방조범을 방조한 경우에는 방조범에 대한 방조범으로 처벌된다.", false, "▸ 방조의 방법에는 제한이 없으므로, ① 방조범에 대한 방조(간접·연쇄방조), ② 교사범에 대한 방조, ③ 방조범에 대한 교사 모두 정범의 실행행위에 영향을 미친 경우 '정범'에 대한 '방조범'이 성립한다. [정범의 실행 착수를 전제]\n\n[제7절 참고 - 방조범(종범) 조문] 형법 제32조(종범) ① 타인의 범죄를 방조한 자는 종범으로 처벌한다. ② 종범의 형은 정범의 형보다 감경한다.", "공범론"],
["657", "★ 「형법」 제31조 제2항과 제3항의 교사의 미수와는 달리, 방조의 미수에 대해서는 「형법」에 처벌을 규정하지 않고 있어서 방조의 미수는 처벌되지 않는다.[모25]", true, "▸ ① 甲과 乙은 효과 없는 교사로 살인예비죄에 준하여 처벌된다. ② 그러나 교사범 甲을 방조한 丙은 정범에 대한 방조가 될 수 있으나, 교사와 달리 방조는 효과 없는 방조를 처벌하는 규정이 없으므로 乙이 실행에 착수하지 않은 이상 丙은 처벌되지 않는다. 또한 乙은 살인예비에 준하여 처벌되는데, 판례에 의하면 예비의 방조도 인정되지 않는다(75도1549).\n\n[제7절 참고 - 방조범(종범) 조문] 형법 제32조(종범) ① 타인의 범죄를 방조한 자는 종범으로 처벌한다. ② 종범의 형은 정범의 형보다 감경한다.", "공범론"],
["658", "★ 甲이 乙에게 A를 살해할 것을 교사하고 乙이 이를 승낙하였으나 실행에 착수하지 않은 경우, 甲과 乙은 처벌되지만, 甲의 교사를 방조한 丙은 처벌되지 않는다.", true, "▸ ① 甲과 乙은 효과 없는 교사로 살인예비죄에 준하여 처벌된다. ② 그러나 교사범 甲을 방조한 丙은 정범에 대한 방조가 될 수 있으나, 교사와 달리 방조는 효과 없는 방조를 처벌하는 규정이 없으므로 乙이 실행에 착수하지 않은 이상 丙은 처벌되지 않는다. 또한 乙은 살인예비에 준하여 처벌되는데, 판례에 의하면 예비의 방조도 인정되지 않는다(75도1549).\n\n[제7절 참고 - 방조범(종범) 조문] 형법 제32조(종범) ① 타인의 범죄를 방조한 자는 종범으로 처벌한다. ② 종범의 형은 정범의 형보다 감경한다.", "공범론"],
["659", "★ 방조범이 성립하려면 방조행위가 정범의 범죄 실현과 밀접한 관련이 있어야 하므로, 정범의 범죄 실현과 밀접한 관련이 없는 행위를 도와준 데 지나지 않는 경우에는 방조범이 성립하지 않는다.[변24]", true, "▸ ① 방조범은 정범에 종속하여 성립하는 범죄이므로 방조행위와 정범의 범죄 실현 사이에는 인과관계가 필요하다. ② 방조범이 성립하려면 방조행위가 정범의 범죄 실현과 밀접한 관련이 있고 정범으로 하여금 구체적 위험을 실현시키거나 범죄결과를 발생시킬 기회를 높이는 등으로 정범의 범죄 실현에 현실적인 기여를 하였다고 평가할 수 있어야 한다. ③ 정범의 범죄 실현과 밀접한 관련이 없는 행위를 도와준 데 지나지 않는 경우에는 방조범이 성립하지 않는다(2017도19025).\n\n[제7절 참고 - 방조범(종범) 조문] 형법 제32조(종범) ① 타인의 범죄를 방조한 자는 종범으로 처벌한다. ② 종범의 형은 정범의 형보다 감경한다.", "공범론"],
["660", "★ 방조범에 있어서 방조행위와 정범의 범죄 실현 사이에 인과관계가 인정되려면 방조행위가 정범의 범죄 실현과 밀접한 관련이 있고 정범으로 하여금 구체적 위험을 실현시키거나 범죄결과를 발생시킬 기회를 높이는 등으로 정범의 범죄 실현에 현실적인 기여를 하였다고 평가할 수 있어야 한다.[변25]", true, "▸ ① 방조범은 정범에 종속하여 성립하는 범죄이므로 방조행위와 정범의 범죄 실현 사이에는 인과관계가 필요하다. ② 방조범이 성립하려면 방조행위가 정범의 범죄 실현과 밀접한 관련이 있고 정범으로 하여금 구체적 위험을 실현시키거나 범죄결과를 발생시킬 기회를 높이는 등으로 정범의 범죄 실현에 현실적인 기여를 하였다고 평가할 수 있어야 한다. ③ 정범의 범죄 실현과 밀접한 관련이 없는 행위를 도와준 데 지나지 않는 경우에는 방조범이 성립하지 않는다(2017도19025).\n\n[제7절 참고 - 방조범(종범) 조문] 형법 제32조(종범) ① 타인의 범죄를 방조한 자는 종범으로 처벌한다. ② 종범의 형은 정범의 형보다 감경한다.", "공범론"],
["661", "★ 인터넷 이용자가 링크 클릭을 통해 저작자의 공중송신권 등을 침해하는 웹페이지에 직접 연결되더라도, 링크를 게시한 행위는 공중송신권 침해행위의 실행 자체를 용이하게 한다고 할 수는 없으므로 공중송신권 침해의 방조행위에 해당하지 않는다.[모25]", false, "▸ ① 정범이 침해 게시물을 서버에서 삭제하는 등으로 게시를 철회하지 않으면 공중송신권 침해의 범죄행위가 종료되지 않았으므로, 그러한 정범의 범죄행위는 방조의 대상이 될 수 있다. ② 저작권 침해물 링크 사이트에서 침해 게시물에 연결되는 링크를 제공하는 경우 등과 같이, 링크 행위자가 정범이 공중송신권을 침해한다는 사실을 충분히 '인식'하면서 그러한 침해 게시물 등에 연결되는 링크를 인터넷 사이트에 영리적·계속적으로 게시하는 등으로 공중의 구성원이 개별적으로 선택한 시간과 장소에서 침해 게시물에 쉽게 접근할 수 있도록 하는 정도의 링크 행위를 한 경우에는 침해 게시물을 공중의 이용에 제공하는 정범의 범죄를 용이하게 하므로 공중송신권 침해의 방조범이 성립한다(2017도19025). [일시적으로 게시한 경우는 해당하지 않음]\n\n[제7절 참고 - 방조범(종범) 조문] 형법 제32조(종범) ① 타인의 범죄를 방조한 자는 종범으로 처벌한다. ② 종범의 형은 정범의 형보다 감경한다.", "공범론"],
["662", "★ 링크 행위자가 정범이 공중송신권을 침해한다는 사실을 충분히 인식하지 못하거나 그러한 침해 게시물 등에 연결되는 링크를 인터넷 사이트에 일시적으로 게시하는 경우에도, 침해 게시물을 공중의 이용에 제공하는 정범의 범죄를 용이하게 하였다고 볼 수 있으므로 공중송신권 침해의 방조범이 성립할 수 있다.", false, "▸ ① 정범이 침해 게시물을 서버에서 삭제하는 등으로 게시를 철회하지 않으면 공중송신권 침해의 범죄행위가 종료되지 않았으므로, 그러한 정범의 범죄행위는 방조의 대상이 될 수 있다. ② 저작권 침해물 링크 사이트에서 침해 게시물에 연결되는 링크를 제공하는 경우 등과 같이, 링크 행위자가 정범이 공중송신권을 침해한다는 사실을 충분히 '인식'하면서 그러한 침해 게시물 등에 연결되는 링크를 인터넷 사이트에 영리적·계속적으로 게시하는 등으로 공중의 구성원이 개별적으로 선택한 시간과 장소에서 침해 게시물에 쉽게 접근할 수 있도록 하는 정도의 링크 행위를 한 경우에는 침해 게시물을 공중의 이용에 제공하는 정범의 범죄를 용이하게 하므로 공중송신권 침해의 방조범이 성립한다(2017도19025). [일시적으로 게시한 경우는 해당하지 않음]\n\n[제7절 참고 - 방조범(종범) 조문] 형법 제32조(종범) ① 타인의 범죄를 방조한 자는 종범으로 처벌한다. ② 종범의 형은 정범의 형보다 감경한다.", "공범론"],
["663", "★ 종범은 정범의 실행행위 중에 이를 방조하는 경우뿐만 아니라, 정범이 실행행위에 나아갔다면 실행의 착수 전에 장래의 실행행위를 예상하고 이를 용이하게 한 경우에도 종범이 성립한다.[변15]", true, "▸ 종범은 정범의 실행행위 중에 이를 방조하는 경우는 물론이고 실행의 착수 전에 장래의 실행행위를 예상하고 이를 용이하게 하는 행위를 하여 방조한 경우에도 정범이 그 실행행위에 나아갔다면 성립한다(96도3377).\n\n[제7절 참고 - 방조범(종범) 조문] 형법 제32조(종범) ① 타인의 범죄를 방조한 자는 종범으로 처벌한다. ② 종범의 형은 정범의 형보다 감경한다.", "공범론"],
["664", "★ 정범의 범죄를 방조하려는 자가 예비단계에서의 방조에 그친 경우, 정범이 실행에 착수하였더라도 방조자를 처벌할 수 없다.[변17]", false, "▸ 종범은 정범의 실행행위 중에 이를 방조하는 경우는 물론이고 실행의 착수 전에 장래의 실행행위를 예상하고 이를 용이하게 하는 행위를 하여 방조한 경우에도 정범이 그 실행행위에 나아갔다면 성립한다(96도3377).\n\n[제7절 참고 - 방조범(종범) 조문] 형법 제32조(종범) ① 타인의 범죄를 방조한 자는 종범으로 처벌한다. ② 종범의 형은 정범의 형보다 감경한다.", "공범론"],
["665", "★ 간호조무사의 무면허 진료행위가 있은 후에 의사가 진료부에 기재하는 행위는 범죄종료 후의 사후행위에 불과하므로 무면허의료행위의 방조에 해당하지 않는다.[변12]", false, "▸ 진료부는 환자의 계속적인 진료에 참고로 공하여지는 진료상황부이므로 간호보조원의 무면허 진료행위가 있은 후에 이를 의사가 진료부에다 기재하는 행위는 정범의 실행행위종료 후의 단순한 사후행위에 불과하다고 볼 수 없고 무면허 의료행위의 방조에 해당한다(82도122).\n\n[제7절 참고 - 방조범(종범) 조문] 형법 제32조(종범) ① 타인의 범죄를 방조한 자는 종범으로 처벌한다. ② 종범의 형은 정범의 형보다 감경한다.", "공범론"],
["666", "★ 방조범은 정범의 실행을 방조한다는 이른바 방조의 고의와 정범의 행위가 구성요건에 해당하는 행위인 점에 대한 정범의 고의가 있어야 한다.[변19]", true, "▸ ① 방조범은 정범의 실행을 방조한다는 이른바 '방조의 고의'와 정범의 행위가 구성요건에 해당하는 행위인 점에 대한 '정범의 고의'가 있어야 한다. ② 정범의 마약류 불법거래 방지에 관한 특례법상 '불법수익 등의 은닉 및 가장' 범행의 방조범 성립에 요구되는 방조의 고의와 정범의 고의에 관하여 보면, 예컨대 마약매수인이 정범인 마약매도인으로부터 마약을 매수하면서 마약매도인의 요구로 차명계좌에 제3자 명의로 마약 매매대금을 입금하면서 그 행위가 정범의 범행 실행을 방조하는 것으로 불법성이 있다는 것을 인식해야 한다는 것을 뜻한다. ③ 방조범에서 요구되는 정범 등의 고의는 정범에 의하여 실현되는 범죄의 구체적 내용을 인식해야 하는 것은 아니고 미필적 인식이나 예견으로 충분하지만, 이는 정범의 범행 등의 불법성에 대한 인식이 필요하다는 점과 모순되지 않는다(2020도7866).\n\n[제7절 참고 - 방조범(종범) 조문] 형법 제32조(종범) ① 타인의 범죄를 방조한 자는 종범으로 처벌한다. ② 종범의 형은 정범의 형보다 감경한다.", "공범론"],
["667", "★ 방조범에서 요구되는 정범의 고의는 정범에 의하여 실현되는 범죄의 미필적 인식이 아니라 구체적 내용을 인식할 것을 요한다.[변23]", false, "▸ ① 방조범은 정범의 실행을 방조한다는 이른바 '방조의 고의'와 정범의 행위가 구성요건에 해당하는 행위인 점에 대한 '정범의 고의'가 있어야 한다. ② 방조범에서 요구되는 정범 등의 고의는 정범에 의하여 실현되는 범죄의 구체적 내용을 인식해야 하는 것은 아니고 미필적 인식이나 예견으로 충분하지만, 이는 정범의 범행 등의 불법성에 대한 인식이 필요하다는 점과 모순되지 않는다(2020도7866).\n\n[제7절 참고 - 방조범(종범) 조문] 형법 제32조(종범) ① 타인의 범죄를 방조한 자는 종범으로 처벌한다. ② 종범의 형은 정범의 형보다 감경한다.", "공범론"],
["668", "★ 방조범에게 요구되는 정범 등의 고의는 정범에 의하여 실현되는 범죄의 구체적 내용을 인식해야 하는 것은 아니고 미필적 인식이나 예견으로 충분하지만, 이는 정범의 범행 등의 불법성에 대한 인식이 필요하다는 점과 모순되지 않는다.[변24]", true, "▸ 방조범에서 요구되는 정범 등의 고의는 정범에 의하여 실현되는 범죄의 구체적 내용을 인식해야 하는 것은 아니고 미필적 인식이나 예견으로 충분하지만, 이는 정범의 범행 등의 불법성에 대한 인식이 필요하다는 점과 모순되지 않는다(2020도7866).\n\n[제7절 참고 - 방조범(종범) 조문] 형법 제32조(종범) ① 타인의 범죄를 방조한 자는 종범으로 처벌한다. ② 종범의 형은 정범의 형보다 감경한다.", "공범론"],
["669", "★ 방조범이 성립하기 위하여 정범이 누구인지를 확실히 알아야 하고, 정범의 실행행위의 일시, 장소, 객체 등에 대하여도 구체적으로 인식하여야 한다.[변21]", false, "▸ 정범에 의하여 실행되는 복제권 침해행위(저작권법위반)에 대한 미필적 고의가 있는 것으로 충분하고 정범의 복제권 침해행위가 실행되는 일시, 장소, 객체 등을 구체적으로 인식할 필요가 없으며, 나아가 정범이 누구인지 확정적으로 인식할 필요도 없다(2005도872).\n\n[제7절 참고 - 방조범(종범) 조문] 형법 제32조(종범) ① 타인의 범죄를 방조한 자는 종범으로 처벌한다. ② 종범의 형은 정범의 형보다 감경한다.", "공범론"],
["670", "과실에 의한 방조행위나 과실범에 대한 방조행위를 방조범으로 처벌할 수 없다.", true, "▸ ① 방조범은 방조의 고의를 요하므로 과실에 의한 방조는 불가능하다. ② 정범도 고의범에 한정되므로 과실범에 대한 방조는 있을 수 없다. 다만 이 경우 간접정범이 성립하고 방조의 예로 처벌될 수는 있다.\n\n[제7절 참고 - 방조범(종범) 조문] 형법 제32조(종범) ① 타인의 범죄를 방조한 자는 종범으로 처벌한다. ② 종범의 형은 정범의 형보다 감경한다.", "공범론"],
["671", "절도를 교사했는데 피교사자가 강간을 실행한 경우, 교사자에게 피교사자의 강간행위에 대한 예견가능성이 있는 때에는 강간교사범의 죄책을 지울 수 있다.[변21]", false, "▸ [본질적 차이] 피교사자가 교사내용과 본질적으로 다른 범죄를 실행한 경우에는 교사자는 실행부분에 대해 교사범이 성립하지 않는다. 다만, 제32조 제2항의 효과 없는 교사로 예비·음모에 준하여 처벌될 수 있다. [강도교사, 강간실행한 경우 강도예비음모] [비본질적 차이] 질적으로 차이가 있더라도 본질적인 차이가 없는 경우에는 교사자는 교사한 범죄에 대한 교사범이 성립한다. [사기교사, 공갈실행한 경우 사기교사죄 성립]", "공범론"],
["672", "甲은 乙에게 A에 대한 강도를 교사하였으나 乙이 강간을 한 경우, 甲에게는 강간죄의 교사범이 아니라 강도죄의 교사범이 성립한다.[변17]", false, "▸ 甲은 강도예비·음모에 준하여 처벌된다. [본질적 차이]", "공범론"],
["673", "★ 상해죄의 공동정범 2인 중 1인이 피해자를 고의로 살해하였다면 나머지 1인은 사망에 대한 예견가능성이 인정되는 경우 상해치사죄의 죄책을 진다.", true, "▸ 여러 사람이 상해의 범의로 범행 중 한 사람이 중한 상해를 가하여 피해자가 사망에 이르게 된 경우 나머지 사람들은 사망의 결과를 예견할 수 없는 때가 아닌 한 상해치사의 죄책을 면할 수 없다(2013도1222). [1인이 살인을 한 경우에도 다른 상해공모자는 예견가능성이 있으면 상해치사죄의 죄책을 진다.]", "공범론"],
["674", "★ 여러 사람이 공동하여 상해의 범의로 범행 중 그중 한 사람이 중한 상해를 가하여 피해자가 사망에 이르게 된 경우 나머지 사람들도 사망의 결과를 예견할 수 있는 때에는 상해치사의 죄책을 진다.[변15]", true, "▸ 여러 사람이 상해의 범의로 범행 중 한 사람이 중한 상해를 가하여 피해자가 사망에 이르게 된 경우 나머지 사람들은 사망의 결과를 예견할 수 없는 때가 아닌 한 상해치사의 죄책을 면할 수 없다(2013도1222). [1인이 살인을 한 경우에도 다른 상해공모자는 예견가능성이 있으면 상해치사죄의 죄책을 진다.]", "공범론"],
["675", "★ 사람이 현존하는 건조물을 방화하는 집단행위의 과정에서 일부 집단원이 고의행위로 상해를 가한 경우에도 다른 집단원에게 그 상해의 결과가 예견가능한 것이었다면, 다른 집단원도 그 결과에 대하여 현존건조물방화치상죄의 책임을 진다.[변23]", true, "▸ 현존건조물방화치상죄와 같은 이른바 부진정결과적가중범은 예견가능한 결과를 예견하지 못한 경우뿐만 아니라 그 결과를 예견하거나 고의가 있는 경우까지도 포함하는 것이므로 사람이 현존하는 건조물을 방화하는 집단행위의 과정에서 일부 집단원이 고의행위로 살상을 가한 경우에도 다른 집단원에게 그 사상의 결과가 예견가능한 것이었다면 다른 집단원도 그 결과에 대하여 현존건조물방화치사상의 책임을 면할 수 없다(96도215).", "공범론"],
["676", "★ 공무집행을 방해하는 집단행위의 과정에서 일부 집단원이 고의로 방화행위를 하여 사상의 결과를 초래한 경우에 다른 집단원이 그 방화행위로 인한 사상의 결과를 예견할 수 있는 상황이었다면 특수공무방해치사상의 죄책을 면할 수 없다.", true, "▸ 부진정결과적가중범인 특수공무방해치사상죄에 있어서 공무집행을 방해하는 집단행위의 과정에서 일부 집단원이 고의로 방화행위를 하여 사상의 결과를 초래한 경우에 다른 집단원이 그 방화행위로 인한 사상의 결과를 예견할 수 있는 상황이었다면 특수공무방해치사상의 죄책을 면할 수 없다(90도765).", "공범론"],
["677", "★ 공무집행을 방해하는 집단행위의 과정에서 일부 집단원이 경찰관이 현존하는 건물에 방화를 하여 상해의 결과를 초래한 경우에 방화에 공모한 바 없는 다른 집단원 甲이 그 방화로 인한 상해의 결과를 예견할 수 있는 상황이었다면, 甲은 현존건조물방화치상의 죄책을 진다.[변26]", false, "▸ 다른 집단원이 그 방화행위 자체에 공모가담한 바 없는 이상 현주건조물방화치사상죄로 의율할 수는 없다(90도765).", "공범론"],
["678", "甲이 乙에게 A의 자동차를 강취할 것을 교사하였으나 乙이 A의 자동차를 절취한 경우 甲은 절도죄의 교사범으로 처벌된다.[변14]", false, "▸ [양적 과소] 피교사자가 교사내용보다 양적으로 적게 실행한 경우에는 실행한 범위 내에서만 교사범의 책임을 진다. 다만, 제32조 제2항의 효과 없는 교사로 예비·음모에 준하여 처벌될 수 있다. [甲은 절도교사죄와 강도예비음모죄의 상상적 경합]", "공범론"],
["679", "甲이 乙에게 절도를 교사하였는데 乙이 강도를 범한 경우, 甲은 절도죄의 교사범으로 처벌된다.", true, "▸ [양적 초과] ① 피교사자가 교사내용보다 양적으로 초과 실행한 경우에는 원칙적으로 교사한 범죄에 대해서만 교사범이 성립하고, 초과 실행부분은 교사범이 성립하지 않는다. [절도교사, 강도실행시 절도교사범 성립] ② 다만, '교사자'에게 중한 결과에 대한 예견가능성이 있으면 결과적 가중범의 교사범이 성립한다. [사안은 양적 초과이므로 甲은 교사한 범죄인 절도죄의 교사범으로 처벌된다.]", "공범론"],
["680", "★ 중한 결과에 대한 과실 내지 예견가능성이 인정되지 않더라도 기본범죄에 대한 교사가 있으면 결과적 가중범에 대한 교사범이 성립한다.", false, "▸ 교사자가 피교사자에 대하여 상해 또는 중상해를 교사하였는데 피교사자가 이를 넘어 살인을 실행한 경우에, 일반적으로 교사자는 상해죄 또는 중상해죄의 죄책을 지게 되는 것이지만 이 경우에 교사자에게 피해자의 사망이라는 결과에 대하여 과실 내지 예견가능성이 있는 때에는 상해치사죄의 죄책을 지울 수 있다(2002도4089). [상해치사죄의 교사범]", "공범론"],
["681", "★ 교사범은 특정범행을 결의하게 하는 것이므로 과실범에 대한 교사범은 성립할 수 없고, 중한 결과에 대한 과실이 있는 결과적 가중범의 교사범도 성립할 수 없다.", false, "▸ 교사자가 피교사자에 대하여 상해 또는 중상해를 교사하였는데 피교사자가 이를 넘어 살인을 실행한 경우에, 일반적으로 교사자는 상해죄 또는 중상해죄의 죄책을 지게 되는 것이지만 이 경우에 교사자에게 피해자의 사망이라는 결과에 대하여 과실 내지 예견가능성이 있는 때에는 상해치사죄의 죄책을 지울 수 있다(2002도4089). [상해치사죄의 교사범]", "공범론"],
["682", "★ 상해를 교사하였는데 피교사자가 이를 넘어 살인을 실행한 경우 교사자는 상해죄에 대한 교사범이 되는 것이고, 다만 이 경우 교사자에게 피해자의 사망이라는 결과에 대하여 과실 내지 예견가능성이 있는 때에는 상해죄의 교사범과 과실치사죄의 상상적 경합범이 된다.[변24]", false, "▸ 교사자가 피교사자에 대하여 상해 또는 중상해를 교사하였는데 피교사자가 이를 넘어 살인을 실행한 경우에, 일반적으로 교사자는 상해죄 또는 중상해죄의 죄책을 지게 되는 것이지만 이 경우에 교사자에게 피해자의 사망이라는 결과에 대하여 과실 내지 예견가능성이 있는 때에는 상해치사죄의 죄책을 지울 수 있다(2002도4089). [상해치사죄의 교사범이지 상상적 경합이 아님]", "공범론"],
["683", "★ 교사자가 피교사자에 대하여 상해를 교사하였는데 피교사자가 살인을 실행한 경우, 교사자에게 피해자의 사망이라는 결과에 대한 예견가능성이 있는 때에는 상해치사죄의 교사범으로서의 죄책을 지울 수 있다.[모25]", true, "▸ 교사자가 피교사자에 대하여 상해 또는 중상해를 교사하였는데 피교사자가 이를 넘어 살인을 실행한 경우에, 일반적으로 교사자는 상해죄 또는 중상해죄의 죄책을 지게 되는 것이지만 이 경우에 교사자에게 피해자의 사망이라는 결과에 대하여 과실 내지 예견가능성이 있는 때에는 상해치사죄의 죄책을 지울 수 있다(2002도4089). [상해치사죄의 교사범]", "공범론"],
["684", "甲이 乙에게 \"A를 정신차릴 정도로 때려주라\"고 교사했는데 乙이 이를 넘어 살인을 실행한 경우, 甲이 사망의 결과를 예견할 수 없었다면 甲에게 상해교사죄가 성립한다.", true, "▸ ① 교사자가 피교사자에게 피해자를 \"정신차릴 정도로 때려주라\"고 교사하였다면 이는 상해에 대한 교사로 봄이 상당하다. ② 교사자가 피교사자에 대하여 상해를 교사하였는데 피교사자가 이를 넘어 살인을 실행한 경우, 일반적으로 교사자는 상해죄에 대한 교사범이 되는 것이고, 다만 이 경우 교사자에게 피해자의 사망이라는 결과에 대하여 과실 내지 예견가능성이 있는 때에는 상해치사죄의 교사범으로서의 죄책을 지울 수 있다. ③ 피고인이 피해자의 사망이라는 결과를 예측하였다거나 또는 피해자의 사망의 결과에 대하여 과실이 있었다고 인정하기 어렵다(97도1075).", "공범론"],
["685", "甲이 丙, 丁 등에게 甲과 사업관계로 다툼이 있었던 A를 혼내 주되, 평생 후회하면서 살도록 허리 아래 부분을 찌르고, 특히 허벅지나 종아리를 찔러 병신을 만들라는 취지로 이야기하면서 차량과 칼 구입비 명목으로 경비 90만 원 정도를 주었고, 乙은 丙, 丁 등에게 연락하여 모이게 하였고, \"甲을 좀 도와주어라\" 등의 말을 하였는데, 丙, 丁 등이 A의 종아리 부위 등을 20여 차례 칼로 찔러 살해하였다면, 甲과 乙은 상해치사죄의 교사범 또는 공동정범이 성립한다.", true, "▸ 甲과 乙은 丙, 丁과 공모관계에 있고, 피해자가 죽을 수도 있다는 점에 대한 '예견가능성'이 있었으므로 상해치사죄의 공동정범이 성립한다(2002도4089).", "공범론"],
["686", "甲이 처음에는 乙이 A를 폭행하려는 것을 제지하였고, 乙이 취중에 남의 자동차를 손괴하고도 상급자에게 무례한 행동을 하는 A를 교육시킨다는 정도로 가볍게 생각하고, 각목을 乙에게 건네주었던 것이고, 그 후에도 乙의 폭행을 제지하려고 노력하였으나, A가 乙의 폭행으로 사망한 경우, 甲에게는 특수폭행치사방조죄가 성립한다.", false, "▸ 甲은 乙의 폭행으로 A가 사망할 것으로 예견할 수 없었으므로 특수폭행'치사'방조의 죄책을 지지 않고, 특수폭행방조의 죄책만을 진다(98도2061).", "공범론"],
["687", "★ 「형법」 제152조 제1항과 제2항은 위증을 한 범인이 형사사건의 피고인 등을 '모해할 목적'을 가지고 있었는가 아니면 그러한 목적이 없었는가 하는 범인의 특수한 상태의 차이에 따라 범인에게 과할 형의 경중을 구별하고 있으므로, 이는 「형법」 제33조 단서 소정의 '신분관계로 인하여 형의 경중이 있는 경우'에 해당한다.[변16]", true, "▸ ① 형법 제33조 소정의 이른바 신분관계라 함은 남녀의 성별, 내·외국인의 구별, 친족관계, 공무원인 자격과 같은 관계뿐만 아니라 널리 일정한 범죄행위에 관련된 범인의 인적관계인 특수한 지위 또는 상태를 지칭하는 것이다. ② 형법 제152조 제1항과 제2항은 범인의 특수한 상태의 차이에 따라 범인에게 과할 형의 경중을 구별하고 있으므로, 모해위증죄의 '모해할 목적'은 바로 제33조 단서 소정의 '신분관계로 인하여 형의 경중이 있는 경우'에 해당한다(93도1002).\n\n[제9절 참고 - 공범과 신분 조문 및 분류] 형법 제33조(공범과 신분) 본문: 신분관계로 인하여 성립될 범죄에 신분 없는 사람이 가담한 경우에는 신분이 없는 사람에게도 제30조부터 제32조까지의 규정을 적용한다. 단서: 다만 신분 때문에 형의 경중이 달라지는 경우에 신분 없는 사람은 무거운 형으로 벌하지 아니한다. [신분의 분류] ① 구성적 신분(진정신분): 신분이 있어야 범죄가 성립하는 경우(예: 수뢰죄의 공무원, 위증죄의 선서한 증인, 횡령·배임죄의 보관자·사무처리자) - 제33조 본문 적용. ② 가감적 신분(부진정신분): 신분에 따라 형의 경중만 달라지는 경우(예: 존속살해죄의 직계비속, 업무상 과실치사상죄의 업무자, 상습도박죄의 상습자) - 통설(구별설)은 본문은 진정신분범 성립·과형에, 단서는 부진정신분범 성립·과형에 적용된다고 보나, 판례(성립·과형 구별설)는 본문이 진정·부진정 신분범의 '성립'에 공통 적용되고 단서는 부진정신분범의 '과형'에만 적용된다고 본다. ③ 소극적 신분: 신분이 있으면 오히려 범죄가 성립하지 않거나 위법성·책임이 조각되는 경우(불구성적 신분, 위법성조각적 신분, 책임조각적 신분) - 제33조가 적용되지 않고 공범종속성 원칙(제한적 종속형식)에 따라 해결한다.", "공범론"],
["688", "★ 공무원이 아닌 甲이 공무원인 남편 乙과 함께 뇌물을 수수한 경우 乙에게 인정되는 범죄와 동일한 범죄의 공동정범, 교사범, 방조범의 성립을 甲에게도 인정할 수 있다.[변12]", true, "▸ 제33조 본문 (뇌물수수죄는 '공무원 등'만 주체로 될 수 있는 진정신분범)\n\n[제9절 참고 - 공범과 신분 조문 및 분류] 형법 제33조(공범과 신분) 본문: 신분관계로 인하여 성립될 범죄에 신분 없는 사람이 가담한 경우에는 신분이 없는 사람에게도 제30조부터 제32조까지의 규정을 적용한다. 단서: 다만 신분 때문에 형의 경중이 달라지는 경우에 신분 없는 사람은 무거운 형으로 벌하지 아니한다. [신분의 분류] ① 구성적 신분(진정신분): 신분이 있어야 범죄가 성립하는 경우(예: 수뢰죄의 공무원, 위증죄의 선서한 증인, 횡령·배임죄의 보관자·사무처리자) - 제33조 본문 적용. ② 가감적 신분(부진정신분): 신분에 따라 형의 경중만 달라지는 경우(예: 존속살해죄의 직계비속, 업무상 과실치사상죄의 업무자, 상습도박죄의 상습자) - 통설(구별설)은 본문은 진정신분범 성립·과형에, 단서는 부진정신분범 성립·과형에 적용된다고 보나, 판례(성립·과형 구별설)는 본문이 진정·부진정 신분범의 '성립'에 공통 적용되고 단서는 부진정신분범의 '과형'에만 적용된다고 본다. ③ 소극적 신분: 신분이 있으면 오히려 범죄가 성립하지 않거나 위법성·책임이 조각되는 경우(불구성적 신분, 위법성조각적 신분, 책임조각적 신분) - 제33조가 적용되지 않고 공범종속성 원칙(제한적 종속형식)에 따라 해결한다.", "공범론"],
["689", "★ 甲은 급하게 돈이 필요하여 그가 소유한 시가 7억 원의 아파트를 丁에게 6억 원에 매도하기로 하고 丁으로부터 계약금과 중도금 합계 1억 5,000만 원을 지급받았다. 그 소식을 들은 乙은 甲에게 \"아파트를 너무 싸게 판 것 같은데, 내 친구 丙이 시세에 따라 매수한다고 하니 丙에게 매도를 하라.\"고 제안하고 수차례 설득한 끝에 甲은 丙에게 위 아파트를 매도하고 소유권이전등기를 마쳐 주었다. 乙은 丁에 대한 관계에서 타인의 사무를 처리하는 자의 지위에 있지 아니하므로 甲의 범행에 적극 가담하였다고 하더라도 배임죄의 공동정범의 죄책을 지지 아니한다.[변25]", false, "▸ 비신분자에게 진정신분범의 공동정범, 교사범 또는 방조범의 성립을 인정할 수 있다(제33조 본문). [乙은 타인의 사무처리자의 지위에 있지는 않지만, 신분자인 甲에게 가담하였으므로 형법 제33조 본문이 적용되어 배임죄의 공동정범이 성립한다.]\n\n[제9절 참고 - 공범과 신분 조문 및 분류] 형법 제33조(공범과 신분) 본문: 신분관계로 인하여 성립될 범죄에 신분 없는 사람이 가담한 경우에는 신분이 없는 사람에게도 제30조부터 제32조까지의 규정을 적용한다. 단서: 다만 신분 때문에 형의 경중이 달라지는 경우에 신분 없는 사람은 무거운 형으로 벌하지 아니한다. [신분의 분류] ① 구성적 신분(진정신분): 신분이 있어야 범죄가 성립하는 경우(예: 수뢰죄의 공무원, 위증죄의 선서한 증인, 횡령·배임죄의 보관자·사무처리자) - 제33조 본문 적용. ② 가감적 신분(부진정신분): 신분에 따라 형의 경중만 달라지는 경우(예: 존속살해죄의 직계비속, 업무상 과실치사상죄의 업무자, 상습도박죄의 상습자) - 통설(구별설)은 본문은 진정신분범 성립·과형에, 단서는 부진정신분범 성립·과형에 적용된다고 보나, 판례(성립·과형 구별설)는 본문이 진정·부진정 신분범의 '성립'에 공통 적용되고 단서는 부진정신분범의 '과형'에만 적용된다고 본다. ③ 소극적 신분: 신분이 있으면 오히려 범죄가 성립하지 않거나 위법성·책임이 조각되는 경우(불구성적 신분, 위법성조각적 신분, 책임조각적 신분) - 제33조가 적용되지 않고 공범종속성 원칙(제한적 종속형식)에 따라 해결한다.", "공범론"],
["690", "★ 甲이 乙을 사주하여 법정에서 선서하고 위증하게 한 경우 甲에게 위증교사죄가 성립한다.[변12]", true, "▸ 제33조 본문 (위증죄는 '선서한 증인'만 주체가 되는 진정신분범)\n\n[제9절 참고 - 공범과 신분 조문 및 분류] 형법 제33조(공범과 신분) 본문: 신분관계로 인하여 성립될 범죄에 신분 없는 사람이 가담한 경우에는 신분이 없는 사람에게도 제30조부터 제32조까지의 규정을 적용한다. 단서: 다만 신분 때문에 형의 경중이 달라지는 경우에 신분 없는 사람은 무거운 형으로 벌하지 아니한다. [신분의 분류] ① 구성적 신분(진정신분): 신분이 있어야 범죄가 성립하는 경우(예: 수뢰죄의 공무원, 위증죄의 선서한 증인, 횡령·배임죄의 보관자·사무처리자) - 제33조 본문 적용. ② 가감적 신분(부진정신분): 신분에 따라 형의 경중만 달라지는 경우(예: 존속살해죄의 직계비속, 업무상 과실치사상죄의 업무자, 상습도박죄의 상습자) - 통설(구별설)은 본문은 진정신분범 성립·과형에, 단서는 부진정신분범 성립·과형에 적용된다고 보나, 판례(성립·과형 구별설)는 본문이 진정·부진정 신분범의 '성립'에 공통 적용되고 단서는 부진정신분범의 '과형'에만 적용된다고 본다. ③ 소극적 신분: 신분이 있으면 오히려 범죄가 성립하지 않거나 위법성·책임이 조각되는 경우(불구성적 신분, 위법성조각적 신분, 책임조각적 신분) - 제33조가 적용되지 않고 공범종속성 원칙(제한적 종속형식)에 따라 해결한다.", "공범론"],
["691", "지방공무원법은 공무원은 노동운동이나 그 밖에 공무 외의 일을 위한 집단행위를 하지 못하도록 규정하고, 이를 위반한 경우 처벌하는 규정을 두고 있다. 지방공무원의 신분을 가지지 아니하는 사람이 지방공무원의 범행에 가공하더라도 공범으로 처벌될 수 없다.", false, "▸ 지방공무원의 신분을 가지지 아니하는 사람도 구 지방공무원법 제58조 제1항을 위반하여 같은 법 제82조에 따라 처벌되는 지방공무원의 범행에 가공한다면 형법 제33조 본문에 의해서 공범으로 처벌받을 수 있다(2010도14409).\n\n[제9절 참고 - 공범과 신분 조문 및 분류] 형법 제33조(공범과 신분) 본문: 신분관계로 인하여 성립될 범죄에 신분 없는 사람이 가담한 경우에는 신분이 없는 사람에게도 제30조부터 제32조까지의 규정을 적용한다. 단서: 다만 신분 때문에 형의 경중이 달라지는 경우에 신분 없는 사람은 무거운 형으로 벌하지 아니한다. [신분의 분류] ① 구성적 신분(진정신분): 신분이 있어야 범죄가 성립하는 경우(예: 수뢰죄의 공무원, 위증죄의 선서한 증인, 횡령·배임죄의 보관자·사무처리자) - 제33조 본문 적용. ② 가감적 신분(부진정신분): 신분에 따라 형의 경중만 달라지는 경우(예: 존속살해죄의 직계비속, 업무상 과실치사상죄의 업무자, 상습도박죄의 상습자) - 통설(구별설)은 본문은 진정신분범 성립·과형에, 단서는 부진정신분범 성립·과형에 적용된다고 보나, 판례(성립·과형 구별설)는 본문이 진정·부진정 신분범의 '성립'에 공통 적용되고 단서는 부진정신분범의 '과형'에만 적용된다고 본다. ③ 소극적 신분: 신분이 있으면 오히려 범죄가 성립하지 않거나 위법성·책임이 조각되는 경우(불구성적 신분, 위법성조각적 신분, 책임조각적 신분) - 제33조가 적용되지 않고 공범종속성 원칙(제한적 종속형식)에 따라 해결한다.", "공범론"],
["692", "아동학대처벌법 제4조는 '동법 제2조 제4호 가목부터 다목까지의 아동학대범죄를 범한 사람이 아동을 사망에 이르게 한 때에는 무기 또는 5년 이상의 징역에 처한다'고 규정하고 있다. 피해아동 A의 친모 甲과 그 남자친구 乙이 A를 지속적으로 학대하여 A를 사망하게 한 경우, 보호자의 신분이 없는 乙은 아동학대처벌법위반(아동학대치사)죄가 성립하지만, 제33조 단서를 적용하여 형법 제259조 제1항의 상해치사죄에서 정한 형으로 처벌된다.", false, "▸ 아동학대처벌법위반(아동학대치사)죄는 제33조 본문의 '신분관계로 인하여 성립될 범죄'에 해당하므로, 보호자의 신분이 없는 남자친구에 대해서도 제33조 본문에 따라 아동학대처벌법위반(아동학대치사)죄의 공동정범이 성립하고 아동학대처벌법 제4조에서 정한 형에 따라 과형이 이루어져야 한다(2021도5000).\n\n[제9절 참고 - 공범과 신분 조문 및 분류] 형법 제33조(공범과 신분) 본문: 신분관계로 인하여 성립될 범죄에 신분 없는 사람이 가담한 경우에는 신분이 없는 사람에게도 제30조부터 제32조까지의 규정을 적용한다. 단서: 다만 신분 때문에 형의 경중이 달라지는 경우에 신분 없는 사람은 무거운 형으로 벌하지 아니한다. [신분의 분류] ① 구성적 신분(진정신분): 신분이 있어야 범죄가 성립하는 경우(예: 수뢰죄의 공무원, 위증죄의 선서한 증인, 횡령·배임죄의 보관자·사무처리자) - 제33조 본문 적용. ② 가감적 신분(부진정신분): 신분에 따라 형의 경중만 달라지는 경우(예: 존속살해죄의 직계비속, 업무상 과실치사상죄의 업무자, 상습도박죄의 상습자) - 통설(구별설)은 본문은 진정신분범 성립·과형에, 단서는 부진정신분범 성립·과형에 적용된다고 보나, 판례(성립·과형 구별설)는 본문이 진정·부진정 신분범의 '성립'에 공통 적용되고 단서는 부진정신분범의 '과형'에만 적용된다고 본다. ③ 소극적 신분: 신분이 있으면 오히려 범죄가 성립하지 않거나 위법성·책임이 조각되는 경우(불구성적 신분, 위법성조각적 신분, 책임조각적 신분) - 제33조가 적용되지 않고 공범종속성 원칙(제한적 종속형식)에 따라 해결한다.", "공범론"],
["693", "구성적 신분을 가진 사람이 구성적 신분을 가지지 않은 사람을 시켜서 진정신분범의 실행행위를 하도록 만든 경우에는 간접정범이 된다.", true, "▸ 목적범이거나 신분범일 때 그 목적·신분이 없는 자를 마치 도구나 손발과 같이 이용하여 간접으로 죄의 구성요소를 실행한 자를 간접정범으로 처벌하는 것이다(83도515). [제33조가 적용되지 않는다.]\n\n[제9절 참고 - 공범과 신분 조문 및 분류] 형법 제33조(공범과 신분) 본문: 신분관계로 인하여 성립될 범죄에 신분 없는 사람이 가담한 경우에는 신분이 없는 사람에게도 제30조부터 제32조까지의 규정을 적용한다. 단서: 다만 신분 때문에 형의 경중이 달라지는 경우에 신분 없는 사람은 무거운 형으로 벌하지 아니한다. [신분의 분류] ① 구성적 신분(진정신분): 신분이 있어야 범죄가 성립하는 경우(예: 수뢰죄의 공무원, 위증죄의 선서한 증인, 횡령·배임죄의 보관자·사무처리자) - 제33조 본문 적용. ② 가감적 신분(부진정신분): 신분에 따라 형의 경중만 달라지는 경우(예: 존속살해죄의 직계비속, 업무상 과실치사상죄의 업무자, 상습도박죄의 상습자) - 통설(구별설)은 본문은 진정신분범 성립·과형에, 단서는 부진정신분범 성립·과형에 적용된다고 보나, 판례(성립·과형 구별설)는 본문이 진정·부진정 신분범의 '성립'에 공통 적용되고 단서는 부진정신분범의 '과형'에만 적용된다고 본다. ③ 소극적 신분: 신분이 있으면 오히려 범죄가 성립하지 않거나 위법성·책임이 조각되는 경우(불구성적 신분, 위법성조각적 신분, 책임조각적 신분) - 제33조가 적용되지 않고 공범종속성 원칙(제한적 종속형식)에 따라 해결한다.", "공범론"],
["694", "★ 부인 甲이 그의 아들 乙과 더불어 남편을 살해한 경우 乙에게 인정되는 범죄와 동일한 범죄의 공동정범, 교사범 또는 방조범의 성립을 甲에게도 인정할 수 있다.[변12]", true, "▸ 처와 자가 남편을 살해한 경우 처에 대해서도 존속살해죄의 공동정범이 성립한다(4294형상284). [판례 성립과형구별설]\n\n[제9절 참고 - 공범과 신분 조문 및 분류] 형법 제33조(공범과 신분) 본문: 신분관계로 인하여 성립될 범죄에 신분 없는 사람이 가담한 경우에는 신분이 없는 사람에게도 제30조부터 제32조까지의 규정을 적용한다. 단서: 다만 신분 때문에 형의 경중이 달라지는 경우에 신분 없는 사람은 무거운 형으로 벌하지 아니한다. [신분의 분류] ① 구성적 신분(진정신분): 신분이 있어야 범죄가 성립하는 경우(예: 수뢰죄의 공무원, 위증죄의 선서한 증인, 횡령·배임죄의 보관자·사무처리자) - 제33조 본문 적용. ② 가감적 신분(부진정신분): 신분에 따라 형의 경중만 달라지는 경우(예: 존속살해죄의 직계비속, 업무상 과실치사상죄의 업무자, 상습도박죄의 상습자) - 통설(구별설)은 본문은 진정신분범 성립·과형에, 단서는 부진정신분범 성립·과형에 적용된다고 보나, 판례(성립·과형 구별설)는 본문이 진정·부진정 신분범의 '성립'에 공통 적용되고 단서는 부진정신분범의 '과형'에만 적용된다고 본다. ③ 소극적 신분: 신분이 있으면 오히려 범죄가 성립하지 않거나 위법성·책임이 조각되는 경우(불구성적 신분, 위법성조각적 신분, 책임조각적 신분) - 제33조가 적용되지 않고 공범종속성 원칙(제한적 종속형식)에 따라 해결한다.", "공범론"],
["695", "★ 본문은 진정신분범, 단서는 부진정신분범에 대하여 적용된다는 견해에 의하면, 부인 甲이 그의 아들 乙과 공동하여 남편을 살해한 경우, 甲과 乙은 존속살해죄가 성립하고 乙은 존속살해죄, 甲은 보통살인죄의 형으로 처벌된다.[변25]", false, "▸ 진정부진정신분범 구별설에 의하면 존속살해죄는 부진정신분범이므로 비신분자인 甲은 단서만 적용되어 존속살해죄가 아닌 단순살인죄가 성립하고 단순살인죄의 형으로 처벌된다.\n\n[제9절 참고 - 공범과 신분 조문 및 분류] 형법 제33조(공범과 신분) 본문: 신분관계로 인하여 성립될 범죄에 신분 없는 사람이 가담한 경우에는 신분이 없는 사람에게도 제30조부터 제32조까지의 규정을 적용한다. 단서: 다만 신분 때문에 형의 경중이 달라지는 경우에 신분 없는 사람은 무거운 형으로 벌하지 아니한다. [신분의 분류] ① 구성적 신분(진정신분): 신분이 있어야 범죄가 성립하는 경우(예: 수뢰죄의 공무원, 위증죄의 선서한 증인, 횡령·배임죄의 보관자·사무처리자) - 제33조 본문 적용. ② 가감적 신분(부진정신분): 신분에 따라 형의 경중만 달라지는 경우(예: 존속살해죄의 직계비속, 업무상 과실치사상죄의 업무자, 상습도박죄의 상습자) - 통설(구별설)은 본문은 진정신분범 성립·과형에, 단서는 부진정신분범 성립·과형에 적용된다고 보나, 판례(성립·과형 구별설)는 본문이 진정·부진정 신분범의 '성립'에 공통 적용되고 단서는 부진정신분범의 '과형'에만 적용된다고 본다. ③ 소극적 신분: 신분이 있으면 오히려 범죄가 성립하지 않거나 위법성·책임이 조각되는 경우(불구성적 신분, 위법성조각적 신분, 책임조각적 신분) - 제33조가 적용되지 않고 공범종속성 원칙(제한적 종속형식)에 따라 해결한다.", "공범론"],
["696", "★ 본문은 진정신분범, 단서는 부진정신분범에 대하여 적용된다는 견해에 의하면, 도박의 습벽이 없는 甲이 상습도박자 乙을 교사하여 도박하게 한 경우, 乙은 상습도박죄, 甲은 단순도박죄의 교사범이 성립하고 각자 그 형으로 처벌된다.[변25]", true, "▸ 진정부진정신분법 구별설에 의하면 비신분자가 부진정신분자에게 가담한 경우이므로 비신분자인 甲은 단순도박죄가 성립하고, 단순도박죄의 형으로 처벌된다.\n\n[제9절 참고 - 공범과 신분 조문 및 분류] 형법 제33조(공범과 신분) 본문: 신분관계로 인하여 성립될 범죄에 신분 없는 사람이 가담한 경우에는 신분이 없는 사람에게도 제30조부터 제32조까지의 규정을 적용한다. 단서: 다만 신분 때문에 형의 경중이 달라지는 경우에 신분 없는 사람은 무거운 형으로 벌하지 아니한다. [신분의 분류] ① 구성적 신분(진정신분): 신분이 있어야 범죄가 성립하는 경우(예: 수뢰죄의 공무원, 위증죄의 선서한 증인, 횡령·배임죄의 보관자·사무처리자) - 제33조 본문 적용. ② 가감적 신분(부진정신분): 신분에 따라 형의 경중만 달라지는 경우(예: 존속살해죄의 직계비속, 업무상 과실치사상죄의 업무자, 상습도박죄의 상습자) - 통설(구별설)은 본문은 진정신분범 성립·과형에, 단서는 부진정신분범 성립·과형에 적용된다고 보나, 판례(성립·과형 구별설)는 본문이 진정·부진정 신분범의 '성립'에 공통 적용되고 단서는 부진정신분범의 '과형'에만 적용된다고 본다. ③ 소극적 신분: 신분이 있으면 오히려 범죄가 성립하지 않거나 위법성·책임이 조각되는 경우(불구성적 신분, 위법성조각적 신분, 책임조각적 신분) - 제33조가 적용되지 않고 공범종속성 원칙(제한적 종속형식)에 따라 해결한다.", "공범론"],
["697", "★ 상습도박자인 甲은 도박의 습벽 없는 乙을 도박에 가담하도록 교사하였고, 이를 승낙한 乙은 丙을 포함한 4명이 참여하고 있는 도박에 가담하였다. 甲에게는 상습도박죄의 교사범이, 乙에게는 단순도박죄의 정범이 성립한다.[변20]", true, "▸ 상습도박죄나 상습도박방조죄에 있어서의 상습성은 행위의 속성이 아니라 '행위자의 속성'으로서 도박을 반복해서 거듭하는 습벽을 말하는 것이다. 도박의 습벽이 있는 자가 타인의 도박을 방조하면 상습도박방조죄에 해당하는 것이다(84도195).\n\n[제9절 참고 - 공범과 신분 조문 및 분류] 형법 제33조(공범과 신분) 본문: 신분관계로 인하여 성립될 범죄에 신분 없는 사람이 가담한 경우에는 신분이 없는 사람에게도 제30조부터 제32조까지의 규정을 적용한다. 단서: 다만 신분 때문에 형의 경중이 달라지는 경우에 신분 없는 사람은 무거운 형으로 벌하지 아니한다. [신분의 분류] ① 구성적 신분(진정신분): 신분이 있어야 범죄가 성립하는 경우(예: 수뢰죄의 공무원, 위증죄의 선서한 증인, 횡령·배임죄의 보관자·사무처리자) - 제33조 본문 적용. ② 가감적 신분(부진정신분): 신분에 따라 형의 경중만 달라지는 경우(예: 존속살해죄의 직계비속, 업무상 과실치사상죄의 업무자, 상습도박죄의 상습자) - 통설(구별설)은 본문은 진정신분범 성립·과형에, 단서는 부진정신분범 성립·과형에 적용된다고 보나, 판례(성립·과형 구별설)는 본문이 진정·부진정 신분범의 '성립'에 공통 적용되고 단서는 부진정신분범의 '과형'에만 적용된다고 본다. ③ 소극적 신분: 신분이 있으면 오히려 범죄가 성립하지 않거나 위법성·책임이 조각되는 경우(불구성적 신분, 위법성조각적 신분, 책임조각적 신분) - 제33조가 적용되지 않고 공범종속성 원칙(제한적 종속형식)에 따라 해결한다.", "공범론"],
["698", "★ 만약 위 사례에서 甲에게 도박의 습벽이 없고, 오히려 乙에게 도박의 습벽이 있다면, 甲은 단순도박죄의 교사범이 성립한다.", false, "▸ 상습도박죄나 상습도박방조죄에 있어서의 상습성은 행위의 속성이 아니라 '행위자의 속성'으로서 도박을 반복해서 거듭하는 습벽을 말하는 것이다. 도박의 습벽이 있는 자가 타인의 도박을 방조하면 상습도박방조죄에 해당하는 것이다(84도195). [甲은 상습도박교사범이 성립하고 단순도박교사범의 형으로 처벌된다.]\n\n[제9절 참고 - 공범과 신분 조문 및 분류] 형법 제33조(공범과 신분) 본문: 신분관계로 인하여 성립될 범죄에 신분 없는 사람이 가담한 경우에는 신분이 없는 사람에게도 제30조부터 제32조까지의 규정을 적용한다. 단서: 다만 신분 때문에 형의 경중이 달라지는 경우에 신분 없는 사람은 무거운 형으로 벌하지 아니한다. [신분의 분류] ① 구성적 신분(진정신분): 신분이 있어야 범죄가 성립하는 경우(예: 수뢰죄의 공무원, 위증죄의 선서한 증인, 횡령·배임죄의 보관자·사무처리자) - 제33조 본문 적용. ② 가감적 신분(부진정신분): 신분에 따라 형의 경중만 달라지는 경우(예: 존속살해죄의 직계비속, 업무상 과실치사상죄의 업무자, 상습도박죄의 상습자) - 통설(구별설)은 본문은 진정신분범 성립·과형에, 단서는 부진정신분범 성립·과형에 적용된다고 보나, 판례(성립·과형 구별설)는 본문이 진정·부진정 신분범의 '성립'에 공통 적용되고 단서는 부진정신분범의 '과형'에만 적용된다고 본다. ③ 소극적 신분: 신분이 있으면 오히려 범죄가 성립하지 않거나 위법성·책임이 조각되는 경우(불구성적 신분, 위법성조각적 신분, 책임조각적 신분) - 제33조가 적용되지 않고 공범종속성 원칙(제한적 종속형식)에 따라 해결한다.", "공범론"],
["699", "★ 도박의 습벽이 있는 자가 도박을 하고 또 도박방조를 하였을 경우 상습도박방조죄와 상습도박죄가 성립하고 두 죄는 실체적 경합관계에 있다.", false, "▸ 도박의 습벽이 있는 자가 도박을 하고 또 도박방조를 하였을 경우 상습도박방조죄는 무거운 상습도박죄에 포괄시켜 1죄로서 처단하여야 한다(84도195).\n\n[제9절 참고 - 공범과 신분 조문 및 분류] 형법 제33조(공범과 신분) 본문: 신분관계로 인하여 성립될 범죄에 신분 없는 사람이 가담한 경우에는 신분이 없는 사람에게도 제30조부터 제32조까지의 규정을 적용한다. 단서: 다만 신분 때문에 형의 경중이 달라지는 경우에 신분 없는 사람은 무거운 형으로 벌하지 아니한다. [신분의 분류] ① 구성적 신분(진정신분): 신분이 있어야 범죄가 성립하는 경우(예: 수뢰죄의 공무원, 위증죄의 선서한 증인, 횡령·배임죄의 보관자·사무처리자) - 제33조 본문 적용. ② 가감적 신분(부진정신분): 신분에 따라 형의 경중만 달라지는 경우(예: 존속살해죄의 직계비속, 업무상 과실치사상죄의 업무자, 상습도박죄의 상습자) - 통설(구별설)은 본문은 진정신분범 성립·과형에, 단서는 부진정신분범 성립·과형에 적용된다고 보나, 판례(성립·과형 구별설)는 본문이 진정·부진정 신분범의 '성립'에 공통 적용되고 단서는 부진정신분범의 '과형'에만 적용된다고 본다. ③ 소극적 신분: 신분이 있으면 오히려 범죄가 성립하지 않거나 위법성·책임이 조각되는 경우(불구성적 신분, 위법성조각적 신분, 책임조각적 신분) - 제33조가 적용되지 않고 공범종속성 원칙(제한적 종속형식)에 따라 해결한다.", "공범론"],
["700", "★ 신분관계로 인하여 형의 경중이 있는 경우에 신분이 있는 자가 신분이 없는 자를 교사하여 죄를 범하게 한 때에는 「형법」 제33조 단서가 「형법」 제31조 제1항에 우선하여 적용된다.[변16]", true, "▸ ① 신분관계로 인하여 형의 경중이 있는 경우에 신분이 있는 자가 신분이 없는 자를 교사하여 죄를 범하게 한 때에는 제33조 단서가 제31조 제1항에 우선하여 적용됨으로써 신분이 있는 교사범이 신분이 없는 정범보다 중하게 처벌된다. ② 피고인이 A를 모해할 목적으로 甲에게 위증을 교사한 이상, 가사 정범인 甲에게 모해의 목적이 없었다고 하더라도, 제33조 단서의 규정에 의하여 피고인을 모해위증교사죄로 처단할 수 있다(93도1002).\n\n[제9절 참고 - 공범과 신분 조문 및 분류] 형법 제33조(공범과 신분) 본문: 신분관계로 인하여 성립될 범죄에 신분 없는 사람이 가담한 경우에는 신분이 없는 사람에게도 제30조부터 제32조까지의 규정을 적용한다. 단서: 다만 신분 때문에 형의 경중이 달라지는 경우에 신분 없는 사람은 무거운 형으로 벌하지 아니한다. [신분의 분류] ① 구성적 신분(진정신분): 신분이 있어야 범죄가 성립하는 경우(예: 수뢰죄의 공무원, 위증죄의 선서한 증인, 횡령·배임죄의 보관자·사무처리자) - 제33조 본문 적용. ② 가감적 신분(부진정신분): 신분에 따라 형의 경중만 달라지는 경우(예: 존속살해죄의 직계비속, 업무상 과실치사상죄의 업무자, 상습도박죄의 상습자) - 통설(구별설)은 본문은 진정신분범 성립·과형에, 단서는 부진정신분범 성립·과형에 적용된다고 보나, 판례(성립·과형 구별설)는 본문이 진정·부진정 신분범의 '성립'에 공통 적용되고 단서는 부진정신분범의 '과형'에만 적용된다고 본다. ③ 소극적 신분: 신분이 있으면 오히려 범죄가 성립하지 않거나 위법성·책임이 조각되는 경우(불구성적 신분, 위법성조각적 신분, 책임조각적 신분) - 제33조가 적용되지 않고 공범종속성 원칙(제한적 종속형식)에 따라 해결한다.", "공범론"],
["701", "★ 모해의 목적을 가지고 모해의 목적을 가지지 않은 사람을 교사하여 위증하게 한 경우, 공범종속성에 따라 모해위증교사죄가 아니라 위증교사죄가 성립한다.[변24]", false, "▸ 피고인이 A를 모해할 목적으로 甲에게 위증을 교사한 이상, 가사 정범인 甲에게 모해의 목적이 없었다고 하더라도, 제33조 단서의 규정에 의하여 피고인을 모해위증교사죄로 처단할 수 있다(93도1002). [증인이라는 구성적 신분의 경우에는 제33조 본문이 적용되고, 모해목적이라는 가감적 신분의 경우에는 신분자가 비신분자에게 가담하였으므로 제33조 본문은 적용되지 않고 단서만 적용된다.]\n\n[제9절 참고 - 공범과 신분 조문 및 분류] 형법 제33조(공범과 신분) 본문: 신분관계로 인하여 성립될 범죄에 신분 없는 사람이 가담한 경우에는 신분이 없는 사람에게도 제30조부터 제32조까지의 규정을 적용한다. 단서: 다만 신분 때문에 형의 경중이 달라지는 경우에 신분 없는 사람은 무거운 형으로 벌하지 아니한다. [신분의 분류] ① 구성적 신분(진정신분): 신분이 있어야 범죄가 성립하는 경우(예: 수뢰죄의 공무원, 위증죄의 선서한 증인, 횡령·배임죄의 보관자·사무처리자) - 제33조 본문 적용. ② 가감적 신분(부진정신분): 신분에 따라 형의 경중만 달라지는 경우(예: 존속살해죄의 직계비속, 업무상 과실치사상죄의 업무자, 상습도박죄의 상습자) - 통설(구별설)은 본문은 진정신분범 성립·과형에, 단서는 부진정신분범 성립·과형에 적용된다고 보나, 판례(성립·과형 구별설)는 본문이 진정·부진정 신분범의 '성립'에 공통 적용되고 단서는 부진정신분범의 '과형'에만 적용된다고 본다. ③ 소극적 신분: 신분이 있으면 오히려 범죄가 성립하지 않거나 위법성·책임이 조각되는 경우(불구성적 신분, 위법성조각적 신분, 책임조각적 신분) - 제33조가 적용되지 않고 공범종속성 원칙(제한적 종속형식)에 따라 해결한다.", "공범론"],
["702", "위증죄는 진정신분범이자 자수범이므로 증인 아닌 비신분자 甲이 모해 목적으로 증인 乙에게 위증을 교사하였더라도 乙에게 모해의 목적이 없다면 甲에게는 단순위증죄의 교사범이 성립한다.[모25]", false, "▸ 피고인이 A를 모해할 목적으로 甲에게 위증을 교사한 이상, 가사 정범인 甲에게 모해의 목적이 없었다고 하더라도, 제33조 단서의 규정에 의하여 피고인을 모해위증교사죄로 처단할 수 있다(93도1002).\n\n[제9절 참고 - 공범과 신분 조문 및 분류] 형법 제33조(공범과 신분) 본문: 신분관계로 인하여 성립될 범죄에 신분 없는 사람이 가담한 경우에는 신분이 없는 사람에게도 제30조부터 제32조까지의 규정을 적용한다. 단서: 다만 신분 때문에 형의 경중이 달라지는 경우에 신분 없는 사람은 무거운 형으로 벌하지 아니한다. [신분의 분류] ① 구성적 신분(진정신분): 신분이 있어야 범죄가 성립하는 경우(예: 수뢰죄의 공무원, 위증죄의 선서한 증인, 횡령·배임죄의 보관자·사무처리자) - 제33조 본문 적용. ② 가감적 신분(부진정신분): 신분에 따라 형의 경중만 달라지는 경우(예: 존속살해죄의 직계비속, 업무상 과실치사상죄의 업무자, 상습도박죄의 상습자) - 통설(구별설)은 본문은 진정신분범 성립·과형에, 단서는 부진정신분범 성립·과형에 적용된다고 보나, 판례(성립·과형 구별설)는 본문이 진정·부진정 신분범의 '성립'에 공통 적용되고 단서는 부진정신분범의 '과형'에만 적용된다고 본다. ③ 소극적 신분: 신분이 있으면 오히려 범죄가 성립하지 않거나 위법성·책임이 조각되는 경우(불구성적 신분, 위법성조각적 신분, 책임조각적 신분) - 제33조가 적용되지 않고 공범종속성 원칙(제한적 종속형식)에 따라 해결한다.", "공범론"],

["704", "甲이 남자친구인 乙에게 甲의 부(父)인 B를 살해하도록 교사한 경우 甲에게 제33조 단서가 제31조 제1항에 우선하여 적용되어 甲이 乙보다 중하게 처벌된다.[변14]", true, "▸ 가중적 신분자인 甲이 비신분자인 乙을 교사한 경우이므로 제33조 단서가 제31조 제1항에 우선하여 적용되어 甲은 존속살해교사죄가 성립한다.\n\n[제9절 참고 - 공범과 신분 조문 및 분류] 형법 제33조(공범과 신분) 본문: 신분관계로 인하여 성립될 범죄에 신분 없는 사람이 가담한 경우에는 신분이 없는 사람에게도 제30조부터 제32조까지의 규정을 적용한다. 단서: 다만 신분 때문에 형의 경중이 달라지는 경우에 신분 없는 사람은 무거운 형으로 벌하지 아니한다. [신분의 분류] ① 구성적 신분(진정신분): 신분이 있어야 범죄가 성립하는 경우(예: 수뢰죄의 공무원, 위증죄의 선서한 증인, 횡령·배임죄의 보관자·사무처리자) - 제33조 본문 적용. ② 가감적 신분(부진정신분): 신분에 따라 형의 경중만 달라지는 경우(예: 존속살해죄의 직계비속, 업무상 과실치사상죄의 업무자, 상습도박죄의 상습자) - 통설(구별설)은 본문은 진정신분범 성립·과형에, 단서는 부진정신분범 성립·과형에 적용된다고 보나, 판례(성립·과형 구별설)는 본문이 진정·부진정 신분범의 '성립'에 공통 적용되고 단서는 부진정신분범의 '과형'에만 적용된다고 본다. ③ 소극적 신분: 신분이 있으면 오히려 범죄가 성립하지 않거나 위법성·책임이 조각되는 경우(불구성적 신분, 위법성조각적 신분, 책임조각적 신분) - 제33조가 적용되지 않고 공범종속성 원칙(제한적 종속형식)에 따라 해결한다.", "공범론"],
["705", "★ 판례에 의하면 업무상 타인의 사무를 처리하는 자가 그러한 신분관계가 없는 자와 공모하여 업무상배임죄를 저질렀다면 그러한 신분관계가 없는 자에 대하여는 「형법」 제33조 단서에 의하여 단순배임죄가 성립한다.[변16]", false, "▸ 업무상의 임무라는 신분관계가 없는 자가 그러한 신분관계 있는 자와 공모하여 업무상배임죄를 저질렀다면, 그러한 신분관계가 없는 공범에 대하여는 형법 제33조 단서에 따라 단순배임죄에서 정한 형으로 처단하여야 한다. 이 경우에는 신분관계 없는 공범에게도 제33조 본문에 따라 일단 신분범인 업무상배임죄가 '성립'하고 다만 과형에서만 무거운 형이 아닌 단순배임죄의 법정형이 적용된다(2018도10047).\n\n[제9절 참고 - 공범과 신분 조문 및 분류] 형법 제33조(공범과 신분) 본문: 신분관계로 인하여 성립될 범죄에 신분 없는 사람이 가담한 경우에는 신분이 없는 사람에게도 제30조부터 제32조까지의 규정을 적용한다. 단서: 다만 신분 때문에 형의 경중이 달라지는 경우에 신분 없는 사람은 무거운 형으로 벌하지 아니한다. [신분의 분류] ① 구성적 신분(진정신분): 신분이 있어야 범죄가 성립하는 경우(예: 수뢰죄의 공무원, 위증죄의 선서한 증인, 횡령·배임죄의 보관자·사무처리자) - 제33조 본문 적용. ② 가감적 신분(부진정신분): 신분에 따라 형의 경중만 달라지는 경우(예: 존속살해죄의 직계비속, 업무상 과실치사상죄의 업무자, 상습도박죄의 상습자) - 통설(구별설)은 본문은 진정신분범 성립·과형에, 단서는 부진정신분범 성립·과형에 적용된다고 보나, 판례(성립·과형 구별설)는 본문이 진정·부진정 신분범의 '성립'에 공통 적용되고 단서는 부진정신분범의 '과형'에만 적용된다고 본다. ③ 소극적 신분: 신분이 있으면 오히려 범죄가 성립하지 않거나 위법성·책임이 조각되는 경우(불구성적 신분, 위법성조각적 신분, 책임조각적 신분) - 제33조가 적용되지 않고 공범종속성 원칙(제한적 종속형식)에 따라 해결한다.", "공범론"],
