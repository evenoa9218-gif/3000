["207", "참고인의 지위는 피의자의 그것과 달리 수사에 대한 협조자로서 당연히 진술을 거부할 수 있기 때문에 검사 또는 사법경찰관이 참고인으로부터 진술을 듣기 전에 참고인에게 진술거부권을 고지할 필요는 없으며, 참고인은 조사 중에도 아무런 제한 없이 조사장소로부터 자유롭게 퇴거할 수 있다.", true, "▸ 참고인 조사는 임의수사이므로 출석의무나 진술의무가 없다. 진술거부권 고지의 대상도 아니고, 언제든지 자유롭게 퇴거할 수 있다.", "수사일반"],
["208", "마약류 투약 혐의의 수사를 위한「형사소송법」제199조 제1항에 따른 임의동행의 경우에도, 동행한 사람을 6시간을 초과하여 경찰관서에 머물게 할 수 없다는「경찰관 직무집행법」제3조 제6항이 적용된다.", false, "▸ 마약류 투약 혐의에 대한 수사를 위한 임의동행은 형소법 제199조 제1항에 따른 임의동행에 해당하므로, 경찰관 직무집행법 제3조 제2항 및 제6항은 적용되지 않는다. [2020도398]", "수사일반"],
["209", "★ 甲은 백화점에서 A의 지갑을 절취하기 위해 A와 부딪치며 양복 상의 주머니에 손을 넣는 순간 발각되어 도주하다가 곧바로 뒤쫓아 온 보안요원 X에게 붙잡혔다. 甲은 X로부터 그 경위를 확인받던 중 체포된 상태를 벗어나기 위해 X의 얼굴을 주먹으로 수차례 때려 전치 4주의 상해를 입히고 도주하였다. 사건이 발생한 지 1시간이 지난 후 X의 신고를 받고 출동한 사법경찰관 P가 인근 버스 정류장에 서있던 甲에게 임의동행을 요청하자, 甲은 영장의 제시를 요구하면서 동행을 거부하였다. 그럼에도 P가 甲을 순찰차에 강제로 태워 파출소로 연행하려 하자 甲은 이를 벗어날 목적으로 P의 복부를 발로 차 전치 2주의 상해를 입혔다. P의 甲에 대한 체포는 적법한 현행범인의 체포라고 볼 수 없다.", true, "▸ 사건 발생 후 1시간이 지난 상황에서 임의동행을 요청하면서 거부하는 甲을 강제로 순찰차에 태워 연행하려 한 것은 적법한 현행범인의 체포가 아니다. [2005도6810]", "수사일반"],
["210", "☆ 위 사례에서 사법경찰관 P가 사후적으로 피의사실의 요지, 체포이유 등을 甲에게 고지하는 등 절차를 밟아 甲을 긴급체포하였고 하더라도 긴급체포는 위법하다.", true, "▸ 사법경찰관이 불법체포로부터 6시간 상당이 경과한 이후에 비로소 피고인에 대하여 긴급체포의 절차를 밟았다고 하더라도 이는 동행의 형식 아래 행해진 불법 체포에 기하여 사후적으로 취해진 것에 불과하므로, 그와 같은 긴급체포 또한 위법하다고 아니할 수 없다. [2005도6810]", "수사일반"],
["211", "☆ 위 사례에서 만약 사법경찰관 P가 사후적으로 피의사실의 요지, 체포이유 등을 甲에게 고지하는 등 절차를 밟아 甲을 긴급체포하였는데, 만일 P가 잠간 경찰서 내의 다른 사무실에 간 사이 甲이 도주하였다면 도주죄로 처벌된다.", false, "▸ 피고인은 불법체포된 자로서 형법 제145조 제1항 소정의 '법률에 의하여 체포 또는 구금된 자'가 아니어서 도주죄의 주체가 될 수 없다. [2005도6810]", "수사일반"],
["212", "★ 피의자가 죄를 범하였다고 의심할 만한 상당한 이유가 있고 정당한 이유없이 출석요구에 응하지 아니하거나 아니할 우려가 있는 때라고 하더라도 명백히 체포의 필요가 인정되지 아니하는 경우에는 지방법원판사는 체포영장청구를 기각하여야 한다.", true, "▸ 체포영장의 청구를 받은 판사는 체포의 사유가 있다고 인정되는 경우에도 피의자의 연령과 경력, 가족관계나 교우관계, 범죄의 경중 및 태양 기타 제반 사정에 비추어 피의자가 도망할 염려가 없고 증거를 인멸할 염려가 없는 등 명백히 체포의 필요가 없다고 인정되는 때에는 체포영장의 청구를 기각하여야 한다(규칙 제96조의2).", "체포구속"],
["213", "체포영장을 집행함에 있어서는 원본을 제시하여야 하므로, 사법경찰관 A가 체포영장을 소지하지 아니하여 영장 원본을 제시할 수 없는 경우에는 급속을 요하는 경우라도 영장을 집행할 수 없다.", false, "▸ 체포영장을 소지하지 아니한 경우에 급속을 요하는 때에는 피고인에 대하여 공소사실의 요지와 영장이 발부되었음을 고하고 집행할 수 있다. 집행을 완료한 후에는 신속히 체포영장을 제시하고 그 사본을 교부하여야 한다(제200조의6, 제85조 제3항).", "체포구속"],
["214", "★ 사법경찰관 A가 체포영장의 제시 및 미란다원칙을 고지하려고 할 때, 만약 체포영장이 발부된 甲이 흉기를 꺼내 폭력으로 대항하여 甲을 실력으로 제압할 수밖에 없는 경우에는 A가 甲을 제압하고 지체 없이 체포영장을 제시하면서 미란다원칙을 고지할 수 있다.", true, "▸ 체포영장의 제시나 고지 등은 체포를 위한 실력행사에 들어가기 이전에 미리 하는 것이 원칙이다. 폭력으로 대항하는 피의자를 실력으로 제압하는 경우에는 제압하는 과정에서 하거나, 여의치 않은 경우에는 일단 제압한 후에 지체 없이 하여야 한다. [2017도10866]", "체포구속"],
["215", "사법경찰관들은 적법하게 甲에 대한 체포영장을 발부받아 다음 날 함께 甲의 주거지 앞에서 甲을 기다리다가 甲을 체포하였다. 그러나 사법경찰관들은 체포 당시 甲에 대한 체포영장을 소지하지는 않았다. 사법경찰관들이 甲의 주거지 앞에서 甲을 기다리다가 체포한 것은 체포영장의 제시 없이 체포할 수 있는 급속을 요하는 때에 해당하므로, 위법한 체포에 해당하지 않는다.", false, "▸ 경찰관이 체포영장이 발부된 다음 날 이를 집행하기 위하여 피고인의 주거지 앞에서 피고인을 기다리다가 체포한 것을 두고 체포영장을 소지할 여유가 없이 피의자를 조우한 경우 등의 급속을 요하는 때에 해당한다고 볼 수는 없다. [2022도10564]", "체포구속"],
["216", "★ 체포영장에 의하여 체포한 피의자를 구속하고자 할 때에는 검사는 체포한 때로부터 48시간 이내에 관할지방법원판사로부터 구속영장을 발부받아야 한다.", false, "▸ 체포영장에 의하여 체포한 피의자를 구속하고자 할 때에는 체포한 때로부터 48시간 이내에 구속영장을 '청구'하여야 한다(제200조의2 제5항). 발부가 아닌 청구이다.", "체포구속"],
["217", "☆ 체포한 피의자를 구속하고자 할 때에는 체포한 때로부터 48시간 이내에 구속영장을 청구하여야 하고, 그 기간 내에 구속영장을 청구하지 아니하는 때에는 즉시 피의자를 석방하여야 한다.", true, "▸ 체포영장에 의한 체포(제200조의2 제5항), 현행범인 체포(제213조의2, 제200조의2 제5항), 긴급체포(제200조의4 제1항, 제2항) 모두 체포한 때로부터 48시간 이내에 구속영장을 청구해야 하고, 미청구 시 즉시 석방해야 한다.", "체포구속"],
["218", "사법경찰관 甲은 정보통신망이용촉진및정보보호등에관한법률위반(음란물유포)의 범죄 혐의를 이유로 발부받은 압수·수색영장에 기하여 피의자 A의 주거지를 수색하는 과정에서 대마가 발견되자, A를 체포하지 않으면 도망하거나 증거를 인멸할 염려가 있어 A를 대마소지로 인한 마약류관리에관한법률위반(대마)죄의 현행범인으로 체포하였다면, 甲이 A를 체포영장 없이 체포한 행위는 적법하다.", true, "▸ 현행범인은 누구든지 영장없이 체포할 수 있다(제212조). 대마는 소지 자체가 범죄이므로 현행범인에 해당한다.", "체포구속"],
["219", "☆ 현행범인으로 규정된 '범죄의 실행의 직후인 자'라고 함은 범죄의 실행행위를 종료한 직후의 범인이라는 것이 체포를 당하는 자의 입장에서 볼 때 명백한 경우를 일컫는 것이다.", false, "▸ 제211조의 '실행하고 난 직후의 사람'이라고 함은, 범죄의 실행행위를 종료한 직후의 범인이라는 것이 '체포하는 자의 입장'에서 볼 때 명백한 경우를 말한다. '체포를 당하는 자의 입장'이 아니다. [2007도1249]", "체포구속"],
["220", "☆ 시간적으로나 장소적으로 보아 체포를 당하는 자가 방금 범죄를 실행한 범인이라는 점에 관한 죄증이 명백히 존재하는 것으로 인정되는 경우에만 '범죄의 실행의 즉후인 자'에 해당하는 현행범인으로 볼 수 있다.", true, "▸ '범죄의 실행행위를 종료한 직후'란 범죄행위를 끝마친 순간 또는 이에 아주 접착된 시간적 단계를 의미하므로, 시간적·장소적으로 보아 체포를 당하는 자가 방금 범죄를 실행한 범인이라는 점에 관한 죄증이 명백히 존재하는 것으로 인정되는 경우에만 현행범인으로 볼 수 있다. [2007도1249]", "체포구속"],
["221", "☆ 신고를 받고 출동한 경찰관이 피의자가 음주운전을 종료한 후 40분 이상이 경과한 시점에서 길가에 앉아 있던 피의자에게서 술 냄새가 난다는 점만을 근거로 피의자를 음주운전의 현행범으로 체포한 것은 위법하다.", true, "▸ 음주운전을 종료한 후 40분 이상이 경과한 시점에서 길가에 앉아 있던 운전자를 술 냄새가 난다는 점만을 근거로 음주운전의 현행범으로 체포한 것은 적법한 공무집행으로 볼 수 없다. [2007도1249]", "체포구속"],
["222", "★ 순찰 중인 사법경찰관 P가 교통사고를 낸 차량이 도주하였다는 무전연락을 받고 주변을 수색하다가 사고시점으로부터 약 10분 후 사고지점과 약 1km 떨어진 도로변에서 범퍼 등의 파손상태로 보아 사고차량으로 인정되는 차량에서 내리는 甲을 발견한 경우 범죄에 사용되었다고 인정함에 충분한 물건을 소지하고 있는 때에 해당하므로, P는 甲을 준현행범인으로서 영장 없이 체포할 수 있다.", true, "▸ 형소법 제211조 제2항 제2호 소정의 '장물이나 범죄에 사용되었다고 인정함에 충분한 흉기 기타의 물건을 소지하고 있는 때'에 해당하므로 준현행범인으로서 영장 없이 체포할 수 있다. [99도4341]", "체포구속"],
["223", "★ 사법경찰관 P가 甲을 영장 없이 현행범으로 체포하기 위해서는 甲에게 도망 또는 증거인멸의 염려가 있어야 하고, 만약 체포 당시 상황을 기초로 판단하였을 때에 이러한 요건을 갖추지 못하였다면 그러한 체포는 위법한 체포에 해당한다.", true, "▸ 현행범인으로 체포하기 위하여는 행위의 가벌성, 범죄의 현행성·시간적 접착성, 범인·범죄의 명백성 이외에 체포의 필요성 즉, 도망 또는 증거인멸의 염려가 있어야 하고, 이러한 요건을 갖추지 못한 현행범인 체포는 위법한 체포에 해당한다. [2011도3682]", "체포구속"],
["224", "검사 또는 사법경찰관은 피의자를 체포하는 경우에는 피의사실의 요지, 체포의 이유와 변호인을 선임할 수 있음을 말하고 변명할 기회를 주어야 한다.", true, "▸ 검사 또는 사법경찰관은 피의자를 체포하는 경우에는 피의사실의 요지, 체포의 이유와 변호인을 선임할 수 있음을 말하고 변명할 기회를 주어야 한다(제200조의5).", "체포구속"],
["225", "★ 사법경찰관이 현행범인을 체포하는 경우에는 반드시 피의사실의 요지, 체포의 이유와 변호인을 선임할 수 있음을 말하고 변명할 기회를 주어야 하며, 이와 같은 고지는 원칙적으로 체포를 위한 실력행사에 들어가기 전에 미리 하여야 하는데, 이는 긴급체포의 경우에도 마찬가지이다.", true, "▸ 검사 또는 사법경찰관리가 현행범인을 체포하거나 인도받은 경우에는 미란다원칙을 고지해야 한다(제213조의2, 제200조의5). 고지는 실력행사 전에 미리 하는 것이 원칙이고, 달아나거나 폭력으로 대항하는 경우 제압 후 지체 없이 하면 된다. 긴급체포의 경우에도 동일하다. [2011도7193, 2008도11226]", "체포구속"],
["226", "☆ 甲은 경찰관 A로부터 불심검문을 받고 운전면허증을 교부하였는데 A가 이를 곧바로 돌려주지 않고 신분조회를 위해 순찰차로 가는 것을 보자 화가 나 인근 주민 여러 명이 있는 가운데 A에게 큰 소리로 욕설을 하였다. 이에 A는「형사소송법」제200조의5에 따라 피의사실의 요지, 체포의 이유, 변호인선임권 등을 고지한 후 甲을 모욕죄의 현행범으로 체포하였다. A가 甲을 체포할 당시 甲은 모욕 범행을 실행 중이거나 실행행위를 종료한 즉후인 자에 해당하므로 현행범인이다.", true, "▸ 甲은 모욕 범행을 실행 중이거나 실행행위를 종료한 즉후인 자에 해당하여 현행범인에는 해당한다. 그러나 체포 필요성이 충족되지 않아 체포는 위법하다. [2011도3682]", "체포구속"],
["227", "☆ 위 사례에서 甲에 대한 체포는 현행범인 체포의 요건을 갖추지 못하여 위법한 체포에 해당한다.", true, "▸ 피고인이 도망하거나 증거를 인멸할 염려가 있다고 보기 어렵고, 모욕 범행은 불심검문에 항의하는 과정에서 저지른 일시적·우발적 행위로서 경미하며, 피해자인 경찰관이 범행현장에서 즉시 범인을 체포할 급박한 사정이 있다고 보기도 어려우므로, 체포는 위법하다. [2011도3682]", "체포구속"],
["228", "☆ 위 사례에서 만약 경찰관 A가 甲을 모욕죄의 현행범으로 체포하려 하자 甲이 이에 반항하는 과정에서 A에게 상해를 가하여, 검사가 甲을 공무집행방해죄와 상해죄로 기소하였다면, 법원은 甲의 행위가 위법한 공무집행에 대한 항의과정에서 발생한 것이므로 두 죄 모두 정당방위를 이유로 무죄를 선고하여야 한다.", false, "▸ 공무집행방해죄는 구성요건해당성이 없고, 상해죄는 정당방위로 위법성이 조각된다. '두 죄 모두 정당방위를 이유로'라는 표현이 잘못되었다. [2011도3682]", "체포구속"],
["229", "교통안전과 위험방지를 위한 필요가 없음에도 주취운전을 하였다고 인정할 만한 상당한 이유가 있다는 이유만으로 이루어지는 음주측정은 이미 행하여진 주취운전이라는 범죄행위에 대한 증거 수집을 위한 수사절차로서의 의미를 가지는 것이므로, 수사상의 강제처분에 관한「형사소송법」상의 절차에 따라야 하고, 이러한 절차를 무시한 채 이루어진 강제연행은 위법한 체포에 해당한다.", true, "▸ [AI해설] 교통안전을 위한 필요 없이 수사 목적으로 이루어지는 음주측정은 수사상 강제처분에 해당하므로 형소법상 절차를 따라야 하고, 이를 무시한 강제연행은 위법한 체포이다. [2004도8404]", "체포구속"],
["230", "사법경찰관이 현행범인을 체포한 후 구속영장을 신청하지 아니하고 석방한 경우에는 즉시 검사에게 보고하여야 하고, 검사는 석방일로부터 30일 이내에 일정한 사항을 법원에 통지하여야 한다.", false, "▸ 현행범인 체포에는 긴급체포에 관한 제200조의4 제4항 및 제6항을 준용하는 규정이 없다. 따라서 이 경우에도 사법경찰관은 검사에게 보고할 의무가 없고, 검사도 법원에 통지할 의무가 없다.", "체포구속"],
["231", "현행범체포에 있어서 체포의 목적을 달성하기 위하여 필요한 범위 내에서 사인이라도 강제력을 행사할 수 있다.", true, "▸ 현행범인은 누구든지 영장 없이 체포할 수 있으므로 사인의 현행범인 체포는 법령에 의한 행위로서 위법성이 조각된다. 적정한 한계를 벗어나는 행위인가 여부는 정당행위의 일반적 요건을 갖추었는지 여부에 따라 결정된다. [98도3029]", "체포구속"],
["232", "외국인 해적들인 甲, 乙, 丙, 丁은 선박을 강취하여 선원들을 인질로 삼아 석방대가를 요구하자, 해군은 甲 등을 총격 종료 직후 현장에서 체포하여 비행기로 부산 김해공항으로 이송하였고, 공항에서 사법경찰관에게 신병을 인도하였다. 해군이 甲 등을 체포한 것은 수사기관이 아닌 이에 의한 현행범인 체포이다.", true, "▸ 청해부대 소속 군인들이 피고인들을 현행범인으로 체포한 것은 검사 등이 아닌 이에 의한 현행범인 체포에 해당한다. [2011도12927]", "체포구속"],
["233", "검사 또는 사법경찰관리 아닌 자가 현행범인을 체포한 때에는 즉시 검사 등에게 인도하여야 하는데, 여기서 '즉시'라고 함은 반드시 체포시점과 시간적으로 밀착된 시점이어야 하는 것은 아니고, '정당한 이유 없이 인도를 지연하거나 체포를 계속하는 등으로 불필요한 지체를 함이 없이'라는 뜻이다.", true, "▸ 사인이 현행범인을 체포한 때에는 즉시 검사 등에게 인도하여야 한다(제213조 제1항). 여기서 '즉시'란 불필요한 지체 없이의 의미이다. [2011도12927]", "체포구속"],
["234", "★ 수사기관이 아닌 甲이 현행범 A를 체포할 때 피의사실의 요지, 체포의 이유와 변호인을 선임할 수 있음을 말하고 변명할 기회를 주어야 할 의무는 없고, A를 인도받은 사법경찰관이 인도받을 때 위 절차를 밟으면 된다.", true, "▸ 검사 또는 사법경찰관리가 현행범인을 '체포'하거나 현행범인을 '인도받은 경우'에는 피의사실의 요지, 체포의 이유와 변호인을 선임할 수 있음을 말하고 변명할 기회를 주어야 한다(제213조의2, 제200조의5).", "체포구속"],
["235", "★ 검사 또는 사법경찰관리가 아닌 이에 의하여 현행범인이 체포된 후 불필요한 지체 없이 검사 등에게 인도된 경우 체포 후 구속영장 청구시한인 48시간의 기산점은 체포시가 아니라 검사 등이 현행범인을 인도받은 때이다.", true, "▸ 검사 등이 아닌 이에 의하여 현행범인이 체포된 후 불필요한 지체 없이 검사 등에게 인도된 경우 위 48시간의 기산점은 체포시가 아니라 검사 등이 현행범인을 인도받은 때이다. [2011도12927]", "체포구속"],
["236", "★ 甲은 주간에 A의 집에 들어가 자전거 1대를 절취하여 가던 중 귀가하던 A에게 2024. 9. 1. 15:00에 체포되었다. 사법경찰관 P는 같은 날 15:30 甲을 지체 없이 인수받았다. 그 후 P는 검사 S에게 구속영장을 신청하였고, S는 법원에 2024. 9. 3. 15:15 영장을 청구하였다. S의 구속영장청구는 현행범이 체포된 때로부터 48시간이 경과한 시점에 이루어진 것으로 법원은 이를 기각하여야 한다.", false, "▸ 기산점은 P가 인도받은 때인 2024.9.1. 15:30이다. 48시간 후는 2024.9.3. 15:30이므로, S가 2024.9.3. 15:15에 청구한 것은 48시간 이내의 적법한 청구이다. 기각사유가 없다. [2011도12927]", "체포구속"],
["237", "사법경찰관 A가 피의자 甲을 절도 혐의로 긴급체포한 후 조사하였으나, 甲의 혐의를 입증할 증거가 부족하다고 판단하여 석방한 경우, A는 甲의 위 절도 범행과 다른 별개의 범죄인 모욕죄 혐의에 관하여는 甲을 긴급체포할 수 없다.", true, "▸ 긴급체포는 법정형이 사형·무기 또는 장기 3년 이상의 징역이나 금고에 해당하는 죄에 대하여만 할 수 있다(제200조의3 제1항). 모욕죄는 1년 이하의 징역이나 금고 또는 200만원 이하의 벌금에 처하는 범죄이므로 긴급체포가 불가능하다.", "체포구속"],
["238", "★ 긴급체포가 요건을 갖추었는지 여부는 사후에 밝혀진 사정을 기초로 판단하여야 하고, 이에 관한 수사주체의 판단에는 상당한 재량의 여지가 있다.", false, "▸ 긴급체포의 요건 충족 여부는 사후에 밝혀진 사정이 아니라 체포 당시의 상황을 기초로 판단하여야 한다. 수사주체의 판단에는 상당한 재량의 여지가 있으나, 경험칙에 비추어 현저히 합리성을 잃은 경우에는 위법한 체포이다. [2000도5701]", "체포구속"],
["239", "☆ A가 필로폰을 투약한다는 제보를 받은 경찰관이 A의 주거지를 방문하였다가, 그곳에서 A를 발견하고 A의 전화번호로 전화를 하여 나오라고 하였으나 응하지 않자 A의 집 문을 강제로 열고 들어가 긴급체포한 경우, 피고인이 마약에 관한 죄를 범하였다고 의심할 만한 상당한 이유가 있었다면, 경찰관이 A의 신원과 주거지 및 전화번호 등을 모두 파악하고 있었고, 당시 마약 투약의 범죄 증거가 급속하게 소멸될 상황도 아니었다고 하더라도, 적법한 체포에 해당한다.", false, "▸ 경찰관이 이미 피고인의 신원과 주거지 및 전화번호 등을 모두 파악하고 있었고, 당시 마약 투약의 범죄 증거가 급속하게 소멸될 상황도 아니었던 점 등의 사정을 감안하면, 미리 체포영장을 받을 시간적 여유가 없었던 경우에 해당하지 않아 긴급체포는 위법하다. [2016도5814]", "체포구속"],
["240", "☆ 수사기관에 자진출석한 참고인에 대한 긴급체포는 언제나 위법하다.", false, "▸ 수사기관에 자진출석한 사람을 긴급체포할 수 있는지에 대하여, 판례는 '언제나 위법'이 아니라 긴급체포 요건을 충족하였는지에 따라 판단하고 있다. [2006도148]", "체포구속"],
["241", "☆ 검사가 참고인조사를 받는 줄 알고 검찰청에 자진출석한 변호사 사무실 사무장을 긴급체포의 요건을 갖추지 못하였음에도 긴급체포하자 변호사가 이를 제지하는 과정에서 검사에게 상해를 가한 경우, 공무집행방해죄가 성립하지 않는다.", true, "▸ 검사나 사법경찰관이 수사기관에 자진출석한 사람을 긴급체포의 요건을 갖추지 못하였음에도 실력으로 체포하려고 하였다면 적법한 공무집행이라고 할 수 없다. 그 변호사가 이를 제지하는 과정에서 검사에게 상해를 가한 것은 정당방위에 해당한다. [2006도148]", "체포구속"],
["242", "도로교통법위반사건에서 기소유예 처분을 받은 甲이 그 후 이 사건에 대해 진정서를 검찰청에 제출함으로써 이루어진 진정사건을 담당한 검사가, 甲에 대한 위 피의사건을 재기한 후 담당검사인 자신의 교체를 요구하고자 부장검사 부속실에서 대기하고 있던 甲을 도로교통법위반죄로 긴급체포하였다면, 이러한 체포는 위법하다.", true, "▸ 수사기관 청사에서 민원 목적으로 대기 중인 사람에 대한 긴급체포는 긴급체포 요건을 충족하지 못한 위법한 체포이다. [2002모81]", "체포구속"],
["243", "A에 대한 사기혐의에 대한 고소사건을 담당하던 경찰관이 A가 회사에도 출근하지 않고 거주지에도 귀가하지 않는 등 소재를 감추자 법원의 압수수색영장에 의한 휴대전화 위치추적 등의 방법으로 A의 소재를 파악하려고 하던 중, 주거지로 귀가하던 A를 발견하고 긴급체포하였다면, 이러한 체포는 적법하다.", true, "▸ [AI해설] 피의자가 소재를 감추며 도주 중인 상황에서 우연히 발견하여 긴급체포한 경우, 미리 체포영장을 받을 시간적 여유가 없었던 경우에 해당하여 적법하다. [2005도7569]", "체포구속"],
["244", "검사가 검사실에서 긴급체포하는 경우에는 피의사실의 요지, 체포이유 등을 고지할 필요가 없다.", false, "▸ 검사 또는 사법경찰관은 피의자를 체포하는 경우에는 피의사실의 요지, 체포의 이유와 변호인을 선임할 수 있음을 말하고 변명할 기회를 주어야 한다(제200조의5). 예외 없이 적용된다.", "체포구속"],
["245", "☆ 사법경찰관이 피의자를 긴급체포하기 위하여 달아나는 피의자를 쫓아가 붙들거나 폭력으로 대항하는 피의자를 실력으로 제압하는 경우에도, 피의사실의 요지, 체포의 이유와 변호인을 선임할 수 있음을 반드시 긴급체포를 위한 실력행사에 들어가기 이전에 미리 고지하여야 한다.", false, "▸ 고지는 긴급체포를 위한 실력행사에 들어가기 이전에 미리 하여야 하는 것이 원칙이나, 달아나는 피의자를 쫓아가 붙들거나 폭력으로 대항하는 피의자를 실력으로 제압하는 경우에는 붙들거나 제압하는 과정에서 하거나, 그것이 여의치 않은 경우에는 일단 붙들거나 제압한 후에 지체없이 하여야 한다. [2008도2794]", "체포구속"],
["246", "검사가 긴급체포한 경우 긴급체포서를 작성할 필요가 없다.", false, "▸ 검사 또는 사법경찰관은 피의자를 긴급체포한 경우에는 즉시 긴급체포서를 작성하여야 한다(제200조의3 제3항).", "체포구속"],
["247", "사법경찰관 A가 피의자 甲을 절도 혐의로 긴급체포한 후 조사하였으나, 甲의 혐의를 입증할 증거가 부족하다고 판단하여 석방한 경우, 그 후 A가 甲의 위 절도 범행과 다른 별개의 범죄인 강간치상 혐의에 관하여 甲을 긴급체포한 경우에는 즉시 검사의 승인을 얻어야 한다.", true, "▸ 사법경찰관이 피의자를 긴급체포한 경우에는 즉시 검사의 승인을 얻어야 한다(제200조의3 제2항). 강간치상죄는 긴급체포 대상 범죄이다.", "체포구속"],
["248", "검사는 긴급체포한 피의자에 대하여 구속영장을 청구하지 아니하고 석방한 경우에는 즉시 긴급체포서의 사본 등을 첨부하여 법원에 통지하고 사후승인을 얻어야 한다.", false, "▸ 석방한 날부터 '30일' 이내에 서면으로 긴급체포서의 사본 등을 첨부하여 법원에 '통지'하여야 하지만, 법원으로부터 사후승인을 얻어야 하는 것은 아니다(제200조의4 제4항).", "체포구속"],
["249", "★ 피의자가 긴급체포되어 조사를 받고 구속영장이 청구되지 않아 석방된 경우 긴급체포 당시의 상황과 경위, 긴급체포 후 조사 과정 등에 특별한 위법이 있다고 볼 수 없더라도 사후에 석방통지가 법에 따라 이루어지지 않았다면 긴급체포에 의한 유치 중에 작성된 피의자신문조서의 증거능력은 부정된다.", false, "▸ 긴급체포 후 조사 과정 등에 위법이 있다고 볼 수 없는 이상, 단지 사후에 석방통지가 법에 따라 이루어지지 않았다는 사정만으로 긴급체포에 의한 유치 중에 작성된 피의자신문조서들의 작성이 소급하여 위법하게 된다고 볼 수 없다. [2011도6035]", "체포구속"],
["250", "검사가 긴급체포한 피의자를 구속하기 위하여 관할지방법원판사에게 구속영장을 청구하였으나 구속영장을 발부받지 못한 때에는 피의자를 즉시 석방하여야 한다.", true, "▸ 구속영장을 청구하지 아니하거나 발부받지 못한 때에는 피의자를 즉시 석방하여야 한다(제200조의4 제2항).", "체포구속"],
["251", "검사의 구속영장 청구 전 피의자 대면조사는 긴급체포의 합당성이나 구속영장 청구에 필요한 사유를 보강하기 위한 목적으로도 할 수 있다.", false, "▸ 검사의 구속영장 청구 전 피의자 대면조사는 긴급체포의 적법성을 의심할 만한 사유가 기록 기타 객관적 자료에 나타나는 예외적인 경우에 한하여 허용될 뿐, 긴급체포의 합당성이나 구속영장 청구에 필요한 사유를 보강하기 위한 목적으로 실시되어서는 아니 된다. [2008도11999]", "체포구속"],
["252", "☆ 위법한 긴급체포에 의한 유치 중에 검사가 작성한 피의자신문조서는 위법하게 수집된 증거로서 특별한 사정이 없는 한 유죄의 증거로 할 수 없다.", true, "▸ 긴급체포의 위법은 영장주의에 위배되는 중대한 것이니 그 체포에 의한 유치 중에 작성된 피의자신문조서는 위법하게 수집된 증거로서 특별한 사정이 없는 한 이를 유죄의 증거로 할 수 없다. [2000도5701]", "체포구속"],
["253", "수사기관이 피의사건과 관련하여 발부받은 구속영장은 명령장이므로 구속영장을 발부받은 후에는 피의자를 구속하지 않거나 구속한 피의자를 석방할 수는 없다.", false, "▸ 법원이 직권으로 발부하는 구속영장은 명령장이고, 수사기관의 청구에 의하여 발부하는 구속영장은 허가장이다(96헌바28). 허가장이므로 반드시 구속해야 하는 것은 아니다.", "체포구속"],
["254", "형사재판 과정에서 범죄사실의 존재를 증명함에 충분한 증거가 없다는 이유로 무죄판결이 확정되었다고 하더라도 그러한 사정만으로 바로 검사의 구속 및 공소제기가 위법하다고 할 수 없고, 검사의 판단이 그 당시의 자료에 비추어 경험칙이나 논리칙상 도저히 합리성을 긍정할 수 없는 정도에 이른 경우에만 위법성을 인정할 수 있다.", true, "▸ [AI해설] 무죄판결 확정만으로 검사의 구속 및 공소제기가 위법하다고 할 수 없고, 당시 자료에 비추어 도저히 합리성을 긍정할 수 없는 정도에 이른 경우에만 위법성을 인정할 수 있다. [2001다23447]", "체포구속"],
["255", "「형사소송법」제70조 제2항에 규정되어 있는 법죄의 중대성, 재범의 위험성, 피해자 및 중요 참고인 등에 대한 위해우려는 독립적인 구속사유이다.", false, "▸ 제70조 제2항은 새로운 '구속사유'를 신설하거나 추가한 것이 아니라, 이러한 '구속사유를 심사할 때 고려해야 할 사항'을 명시한 것이다. [2009헌바8]", "체포구속"],
["256", "☆ 구속영장을 청구받은 지방법원판사는 체포된 피의자에 대하여 지체 없이 피의자를 심문해야 하나, 체포되지 않은 피의자에 대하여는 직권으로 심문여부를 결정한다.", false, "▸ 체포된 피의자에 대하여 지체 없이 심문하여야 한다(제201조의2 제1항). 미체포 피의자에 대해서도 구인한 후 심문하여야 한다. 다만, 피의자가 도망하는 등의 사유로 심문할 수 없는 경우에는 그러하지 아니하다(동조 제2항).", "체포구속"],
["257", "★ 검사가 甲에 대해 구속영장을 청구한 경우 구속영장을 청구받은 판사는 甲을 심문하여야 하고, 심문할 甲에게 변호인이 없는 경우에는 필요적 변호사건이 아니기 때문에 지방법원판사는 甲의 청구가 있는 경우에 한해 변호인을 선정할 수 있다.", false, "▸ 심문할 피의자에게 변호인이 없는 때에는 지방법원판사는 직권으로 변호인을 선정하여야 한다. 필요적 변호사건 여부와 무관하고, 甲의 청구 없이도 직권으로 선정한다(제201조의2 제8항).", "체포구속"],
["258", "★ 구속 전 피의자심문을 받을 甲에게 변호인이 없는 때에는 판사는 직권으로 변호인을 선정하여야 하고, 이 경우 甲에 대한 구속영장 청구가 기각되더라도 변호인의 선정은 제1심까지 효력이 있다.", false, "▸ 심문할 피의자에게 변호인이 없는 때에는 지방법원판사는 직권으로 변호인을 선정하여야 한다. 그러나 피의자에 대한 구속영장 청구가 기각되어 효력이 소멸한 경우를 제외하고는 제1심까지 효력이 있다(제201조의2 제8항). 기각되면 변호인 선정의 효력이 소멸된다.", "체포구속"],
["259", "체포된 피의자에 대한 구속영장을 청구 받은 판사는 피의자가 죄를 범하였다고 의심할 만한 이유가 있는 경우에 구인영장을 발부하여 피의자를 구인한 후 심문하여야 한다.", false, "▸ 체포된 피의자의 경우 체포영장의 효력으로 구인하면 되고, 별도로 구인영장을 발부받을 필요가 없다(제201조의2 제1항).", "체포구속"],
["260", "체포되지 않은 피의자에 대한 구속영장을 청구 받은 판사는 피의자가 죄를 범하였다고 의심할 만한 이유가 있는 경우에 구인영장을 발부하여 피의자를 구인한 후 심문하여야 한다.", true, "▸ 체포되지 않은 피의자에 대하여 구속영장 청구를 받은 판사는 죄를 범하였다고 의심할 만한 이유가 있는 경우에 구인영장을 발부하여 피의자를 구인한 후 심문하여야 한다(제201조의2 제2항).", "체포구속"],
["261", "검사가 사법경찰관이 신청한 영장을 정당한 이유 없이 판사에게 청구하지 아니한 경우 사법경찰관이 관할 고등검찰청에 영장청구 여부에 대한 심의를 신청하기 위해서는「검찰청법」에 따른 항고를 거쳐야 한다.", false, "▸ 검사가 영장을 정당한 이유 없이 청구하지 아니한 경우 사법경찰관은 그 검사 소속의 지방검찰청 소재지를 관할하는 고등검찰청에 영장청구 여부에 대한 심의를 신청할 수 있다(제221조의5 제1항). 검찰청법 항고는 불필요하다.", "체포구속"],
["262", "성폭력범죄의 피해자가 형사절차상 입을 수 있는 피해를 방어하고 법률적 조력을 보장하기 위하여 선임한 변호사는 피의자에 대한 구속 전 피의자심문절차에 출석하여 의견을 진술할 수 없다.", false, "▸ 성폭력범죄 피해자의 변호사는 피의자에 대한 구속 전 피의자심문, 증거보전절차, 공판준비기일 및 공판절차에 출석하여 의견을 진술할 수 있다(성폭법 제27조 제3항).", "체포구속"],
["263", "★ 지방법원판사가 구속영장청구를 기각한 경우에는 검사는 구속영장을 재청구하거나 항고나 준항고를 통해 불복할 수 있다.", false, "▸ 체포영장 또는 구속영장 청구에 대한 지방법원판사의 재판은 항고의 대상인 '법원의 결정'에도, 준항고의 대상인 '재판장 또는 수명법관의 구금 등에 관한 재판'에도 해당하지 아니한다. 검사는 재청구는 가능하나 항고·준항고는 불가하다. [2006모646]", "체포구속"],
["264", "☆ 검사가 구속영장의 청구를 함에 있어서 동일한 범죄사실에 관하여 그 피의자에 대하여 전에 구속영장을 청구하거나 발부받은 사실이 있을 때에는 다시 구속영장을 청구하는 취지 및 이유를 기재하여야 한다.", true, "▸ 동일한 범죄사실에 관하여 그 피의자에 대하여 전에 구속영장을 청구하거나 발부받은 사실이 있을 때에는 다시 구속영장을 청구하는 취지 및 이유를 기재하여야 한다(제201조 제5항). [검사의 영장 재청구가 가능하다는 것을 전제]", "체포구속"],
["265", "「형사소송법」제205조 제1항 소정의 구속기간의 연장을 허가하지 아니하는 지방법원 판사의 결정에 대하여는 항고할 수 없으나 준항고는 가능하다.", false, "▸ 제205조 제1항 소정의 구속기간의 연장을 허가하지 아니하는 지방법원 판사의 결정에 대하여는 항고의 방법으로는 불복할 수 없고, 그 지방법원 판사는 수소법원으로서의 재판장 또는 수명법관도 아니므로 준항고의 대상도 되지 않는다. [97모1]", "체포구속"],
["266", "★ 구속영장에 의하여 구속된 피의자 甲은 검사로부터의 피의자신문을 위한 출석요구를 받았음에도 이에 응하지 않고 있다. 검사는 甲을 검사실로 구인하기 위하여 지방법원 판사로부터 별개의 구인을 위한 영장을 발부받아야 한다.", false, "▸ 구금된 피의자가 수사기관 조사실에 출석을 거부한다면 수사기관은 그 구속영장의 효력에 의하여 피의자를 조사실로 구인할 수 있다. 별개 구인영장은 불필요하다. [2013모160]", "체포구속"],
["267", "☆ 피의자에 대한 구속영장의 집행이 그 발부 시로부터 정당한 사유 없이 시간이 지체되어 이루어졌다고 하더라도, 구속영장이 그 유효기간 내에 집행되었다면 정당한 사유 없이 지체된 기간 동안의 체포 내지 구금 상태가 위법하게 되는 것은 아니다.", false, "▸ 구속영장의 제시와 집행이 정당한 사유 없이 시간이 지체되어 이루어졌다면, 구속영장이 그 유효기간 내에 집행되었다고 하더라도 위 기간 동안의 체포 내지 구금 상태는 위법하다. [2020도16438]", "체포구속"],
["268", "☆ 외국인을 체포·구속하는 경우 지체 없이 외국인에게 영사통보권 등이 있음을 고지하지 않았다면, 그러한 체포나 구속 절차는 국내법과 같은 효력을 가지는「영사관계에 관한 비엔나협약」을 위반한 것으로 위법하다.", true, "▸ 외국인을 체포·구속하는 경우 지체 없이 영사통보권 등이 있음을 고지하지 않으면 비엔나협약 위반이다. 다만, 피고인이 검찰 수사 단계에서 영사관 통보 가능성을 알게 되었음에도 요구하지 않은 경우에는 실질적 불이익이 없어 증거 사용은 가능하다. [2021도17103]", "체포구속"],
["269", "상소제기 후 소송기록이 상소법원에 도달하지 않고 있는 사이에는 피고인을 구속할 필요가 있는 경우에도 기록이 없는 상소법원에서 구속의 요건이나 필요성 여부에 대한 판단을 하여 피고인을 구속하는 것은 실질적으로 불가능하다.", true, "▸ [AI해설] 상소제기 후 소송기록이 상소법원에 도달하기까지는 원심법원이 구속 등을 하도록 규정한 규칙 제57조 제1항이 형소법 제105조 규정에 저촉된다고 보기는 어렵다. [2007모460]", "체포구속"],
["270", "구속사건에 대해서는 법원이 구속기간내에 재판을 하면 되는 것이고 구속만기 25일을 앞두고 제1회 공판이 있었다 하여 헌법에 정한 신속한 재판을 받을 권리를 침해하였다 할 수 없다.", true, "▸ [AI해설] 구속사건에서 구속기간 내에 재판을 하면 되고, 구속만기 25일 전에 제1회 공판이 있었다 하여 신속한 재판을 받을 권리 침해가 아니다. [90도672]", "체포구속"],
["271", "법원이 공판진행 중 피고인에 대한 구속영장을 발부하여 피고인을 구속하였는데, 집행기관이 즉시 공소사실의 요지와 변호인을 선임할 수 있음을 알려주지 않았다면, 그 구속영장은 효력이 없다.", false, "▸ 피고인을 구속한 때에는 즉시 공소사실의 요지와 변호인을 선임할 수 있음을 알려야 한다(제88조). 그러나 제88조는 사후청문절차에 관한 규정으로서 이를 위반하였다 하여 구속영장의 효력에 어떠한 영향을 미치는 것은 아니다. [2000모134]", "체포구속"],
["272", "☆ 이미 변호인을 선정하여 공판절차에서 변명과 증거의 제출을 다하고 그의 변호 아래 판결을 선고받아 피고인의 절차적 권리가 실질적으로 보장되었다고 볼 수 있는 경우에는 법원이 피고인에 대하여 구속영장을 발부할 때 사전에 피고인에 대하여 범죄사실의 요지의 고지 등 사전청문절차의 전부 또는 일부를 거치지 아니한 채 구속영장을 발부하였다는 점만으로 그 발부결정이 위법하다고 볼 것은 아니다.", true, "▸ 이미 변호인을 선정하여 공판절차에서 절차적 권리가 실질적으로 보장된 경우에는 사전청문절차의 전부 또는 일부를 거치지 아니한 채 구속영장을 발부하더라도 이러한 점만으로 발부결정을 위법하다고 볼 것은 아니다. [2015모1032]", "체포구속"],
["273", "★ 구속의 효력은 형사소송법이 정한 방식에 따라 작성된 구속영장에 기재된 범죄사실에만 미치는 것이므로, 구속기간이 만료될 무렵에 종전 구속영장에 기재된 범죄사실과 다른 범죄사실로 피고인을 구속하였다면 피고인에 대한 구속은 위법하다.", false, "▸ 구속의 효력은 원칙적으로 구속영장에 기재된 범죄사실에만 미치는 것이므로, 구속기간이 만료될 무렵에 종전 구속영장에 기재된 범죄사실과 다른 범죄사실로 피고인을 구속하였다는 사정만으로는 피고인에 대한 구속이 위법하다고 할 수 없다. [이중구속 허용취지, 2000모134]", "체포구속"],
["274", "★ 피고인에 대한 1차 구속영장 표지에 그 죄명 중 하나로 무고가 기재되어 있으나 그 구속영장의 범죄사실에는 무고에 관한 기재가 전혀 없는 경우, 1차 구속영장의 효력은 무고의 범죄사실에 대하여는 원칙적으로 미치지 아니하므로, 법원이 피고인에 대하여 무고죄로 2차 구속영장을 발부한 것은 정당하다.", true, "▸ 구속의 효력은 원칙적으로 구속영장에 기재된 범죄사실에만 미치는 것이다. 1차 구속영장의 범죄사실에 무고에 관한 기재가 전혀 없다면 그 효력이 무고의 범죄사실에 미치지 않으므로, 무고죄로 별도의 2차 구속영장을 발부한 것은 정당하다. [2000모134]", "체포구속"],
["275", "횡령혐의로 구속되었으나 사기죄로 기소된 피고인에 대하여, 구속영장에 기재된 횡령죄의 범죄사실과 공소장에 기재된 사기죄의 공소사실의 범행일시와 장소가 같고 범행의 목적물과 그 행위의 내용인 사실도 각각 같다면 사기죄에 대한 영장실질심사를 새롭게 하지 않았다고 하더라도 위법하다고 볼 수는 없다.", true, "▸ 구속영장의 효력은 구속영장에 기재된 범죄사실 및 그 사실의 기초가 되는 사회적 사실관계가 기본적인 점에서 동일한 공소사실에 미친다. [2001모85]", "체포구속"],
["276", "☆ 법원이 구속 피고인에 대하여 집행유예의 판결을 선고하는 경우 구속영장의 효력이 소멸하므로 판결의 확정 전이라도 피고인을 석방하여야 한다.", true, "▸ 무죄, 면소, 형의 면제, 형의 선고유예, 형의 집행유예, 공소기각 또는 벌금이나 과료를 과하는 판결이 '선고된 때'에는 구속영장은 효력을 잃는다(제331조). 확정 전이라도 선고와 동시에 구속영장은 실효된다.", "체포구속"],
["277", "사형 또는 자유형의 판결이 확정되면 그날로부터 형의 집행이 시작되므로 구속영장은 그 효력이 상실된다.", true, "▸ 구속 중인 피고인에 대하여 자유형(실형)의 판결이 '확정'된 때에는 구속영장은 실효된다. 따라서 피고인을 계속 구금하기 위하여는 확정된 유죄 부분에 대한 형집행의 절차를 취하여야 한다. [99초355]", "체포구속"],
["278", "판결내용 자체가 아니고 다만 피고인의 신병확보를 위한 구속 등 소송절차가 법령에 위반된 경우에는, 그로 인하여 피고인의 방어권이나 변호인의 조력을 받을 권리가 본질적으로 침해되고 판결의 정당성마저 인정하기 어렵다고 보이는 정도에 이르지 않는 한, 그것 자체만으로는 판결에 영향을 미친 위법이라고 할 수 없다.", true, "▸ [AI해설] 구속 등 소송절차 위반이 피고인의 방어권 등을 본질적으로 침해하는 정도에 이르지 않는 한 판결에 영향을 미친 위법이라고 할 수 없다. [2018도19034]", "체포구속"],
["279", "☆ 체포된 피의자를 구속영장에 의하여 구속한 경우에 그 구속기간은 피의자를 체포한 날부터 기산한다.", true, "▸ 구속기간은 피의자를 체포 또는 구인한 날부터 기산한다(제203조의2).", "체포구속"],
["280", "사법경찰관 A는 체포영장에 의하여 체포된 甲에게 구속의 필요성이 인정되어 체포된 다음 날 구속영장을 신청하였고, 검사의 구속영장 청구와 지방법원판사가 발부한 구속영장에 의해 甲이 구속된 경우, A는 구속영장에 의해 甲이 구속된 때로부터 10일 이내에 검사에게 甲을 인치하지 아니하면 석방하여야 한다.", false, "▸ 사법경찰관이 피의자를 구속한 때에는 10일 이내에 피의자를 검사에게 인치하지 아니하면 석방하여야 한다(제202조). 구속기간은 피의자를 체포한 날부터 기산한다(제203조의2). A는 甲을 '체포한 날'부터 10일 이내에 甲을 검사에게 인치하여야 한다.", "체포구속"],
["281", "甲의 재판에서 甲의 기피신청에 의하여 소송절차가 정지된 기간은 법원의 피고인 구속기간에 산입되지 않는다.", true, "▸ 제22조, 제298조 제4항, 제306조 제1항 및 제2항의 규정에 의하여 공판절차가 정지된 기간 및 공소제기전의 체포·구인·구금 기간은 구속기간에 산입하지 아니한다(제92조 제3항). [제22조(기피신청과 소송의 정지)]", "체포구속"],
["282", "☆ 피고인에 대한 구속기간에는 공소제기전의 체포기간도 산입한다.", false, "▸ 공소제기전의 체포·구인·구금 기간은 '법원'의 구속기간에 산입하지 아니한다(제92조 제3항).", "체포구속"],
["283", "공판과정에서 구속을 계속할 필요가 있는 때에는 제1심 법원은 결정으로 2개월 단위로 2차에 한하여 구속기간을 갱신할 수 있다.", true, "▸ 구속기간은 2개월로 한다(제92조 제1항). 특히 구속을 계속할 필요가 있는 경우에는 심급마다 2개월 단위로 2차에 한하여 결정으로 갱신할 수 있다. 다만, 상소심은 부득이한 경우에는 3차에 한하여 갱신할 수 있다(동조 제2항).", "체포구속"],
["284", "사법경찰관 P는 2023. 10. 2. 피의자 甲을 절도죄로 체포하면서 피의사실의 요지, 체포이유 등을 고지하였다. P는 검사에게 구속영장을 신청하였고, 검사는 같은 날 17:00 관할 법원에 구속영장청구서 및 수사관계서류를 제출하였다. 관할 법원 영장전담판사는 2023. 10. 3. 10:00 구속전 피의자심문절차를 실시하였고, 같은 날 13:00 구속영장을 발부하면서 수사관계서류를 검찰청에 반환하였다. P의 구속절차가 적법하다면, P는 2023. 10. 13. 24:00까지 甲을 검사에게 인치하여야 한다.", true, "▸ 피의자심문을 하는 경우 법원이 수사관계서류 및 증거물을 접수한 날부터 구속영장을 발부하여 검찰청에 반환한 날까지의 기간은 구속기간에 산입하지 아니한다(제201조의2 제7항). 기산일은 체포일 2023.10.2., 경찰 구속기간 10일인데, 서류를 법원에 접수한 10.2.부터 반환받은 10.3.까지 2일을 공제 → 2023.10.13. 24:00까지 인치해야 한다.", "체포구속"],
["285", "★ 공소제기 후의 피고인은 체포·구속적부심사를 청구할 수 없다.", true, "▸ 체포되거나 구속된 '피의자' 또는 그 변호인, 법정대리인, 배우자, 직계친족, 형제자매나 가족, 동거인 또는 고용주는 관할법원에 체포 또는 구속의 적부심사를 청구할 수 있다(제214조의2 제1항). 공소제기 후 피고인은 청구 자격 없음.", "체포구속"],
["286", "체포영장에 의해 체포된 피의자뿐만 아니라 체포영장에 의하지 아니하고 긴급체포된 피의자도 체포적부심사의 청구권자에 해당한다.", true, "▸ 긴급체포 등 체포영장에 의하지 아니하고 체포된 피의자의 경우에도 그 적부심사를 청구할 권리를 가진다. [97모21]", "체포구속"],
["287", "체포·구속적부심사의 청구를 받은 법원은 청구서가 접수된 때로부터 48시간 이내에 피의자를 심문하고 수사관계서류와 증거물을 조사하여야 한다.", true, "▸ 제214조의2 제4항에 따라 법원은 청구서 접수 후 48시간 이내에 피의자를 심문하고 수사관계서류와 증거물을 조사하여야 한다.", "체포구속"],
["288", "☆ 체포적부심사를 청구한 피의자에게 변호인이 없는 때에는 지체 없이 국선변호인을 선정해야 하나, 심문 없이 적부심사청구에 대해 기각 결정을 하는 경우에는 그러하지 아니하다.", false, "▸ 체포되거나 구속된 피의자에게 변호인이 없는 때에는 제33조를 준용한다(제214조의2 제10항). 심문 없이 기각 결정을 하는 경우에도 예외 없이 국선변호인을 선정하여야 한다.", "체포구속"],
["289", "☆ 甲은 컴퓨터등사용사기죄 등의 혐의로 긴급체포되었고, 甲은 체포적부심사를 청구하였다. 체포적부심사를 청구한 甲에게 법원은 보증금납입을 조건으로 석방을 명할 수 있다.", false, "▸ 현행법상 체포된 피의자에 대하여는 보증금 납입을 조건으로 한 석방이 허용되지 않는다. 보증금납입조건부 석방은 구속적부심사에서만 가능하다. [97모21]", "체포구속"],
["290", "☆ 체포적부심사청구를 받은 법원이 청구가 이유 있다고 인정한 때에는 결정으로 체포된 피의자의 석방을 명하여야 하며, 검사는 이 결정에 대해 항고하지 못한다.", true, "▸ 기각결정과 석방결정에 대해서는 항고할 수 없다(제214조의2 제8항).", "체포구속"],
["291", "수사기관이 청구인들을 각 체포한 후 청구인들 모두를 체포의 법정 시한 가까이 계속 구금하다가 체포시한 종료가 임박한 시점에 이르러서야 석방한 경우, 체포적부심사를 거치지 않고 곧바로 헌법소원을 청구할 수 있다.", false, "▸ 체포에 대하여는 헌법과 형소법이 정한 체포적부심사라는 구제절차가 존재함에도 불구하고, 체포적부심사절차를 거치지 않고 제기된 헌법소원심판청구는 보충성의 원칙에 반하여 부적법하다. [2008헌마628]", "체포구속"],
["292", "피의자를 구속한 사법경찰관은 체포되거나 구속된 피의자와 적부심사청구권자 중에서 피의자가 지정하는 사람에게 적부심사를 청구할 수 있음을 알려야 한다.", true, "▸ 피의자를 체포하거나 구속한 검사 또는 사법경찰관은 체포되거나 구속된 피의자와 제1항에 규정된 사람 중에서 피의자가 지정하는 사람에게 제1항에 따른 적부심사를 청구할 수 있음을 알려야 한다(제214조의2 제2항).", "체포구속"],
["293", "☆ 구속적부심사에서 피의자에게 변호인이 없는 때에는 법원은 직권으로 국선변호인을 선정해야 한다.", true, "▸ 제214조의2 제10항에서 제33조를 준용하므로, 구속적부심사에서 피의자에게 변호인이 없는 때에는 법원은 직권으로 국선변호인을 선정하여야 한다.", "체포구속"],
["294", "검사·변호인·청구인은 구속적부심문기일에 출석하여 의견을 진술할 수 있다.", true, "▸ 제214조의2 제9항에 따라 검사·변호인·청구인은 구속적부심문기일에 출석하여 의견을 진술할 수 있다.", "체포구속"],
["295", "구속적부심사건 피의자의 변호인에게는 수사기록 중 고소장과 피의자신문조서의 열람·등사를 알 권리가 인정된다.", true, "▸ [AI해설] 구속적부심사 피의자의 변호인에게 수사기록 중 고소장과 피의자신문조서의 열람·복사를 알 권리가 인정된다. [2000헌마474]", "체포구속"],
["296", "★ 구속적부심사청구 후 검사가 피의자를 기소한 경우 법원은 구속적부심사청구를 기각하여야 하며 피고인은 수소법원에 보석을 청구할 수 있다.", true, "▸ 심사 청구 후 기소가 이루어진 경우에도 법원은 그 청구를 기각하여야 한다(제214조의2 제4항). 기소 후에는 수소법원에 보석을 청구할 수 있다.", "체포구속"],
["297", "공범 또는 공동피의자의 구속적부심사 순차청구가 수사방해의 목적임이 명백하다고 하더라도 법원은 피의자에 대한 심문 없이 그 청구를 기각할 수는 없다.", false, "▸ 법원은 공범이나 공동피의자의 순차청구가 수사 방해를 목적으로 하고 있음이 명백한 때에는 심문 없이 결정으로 청구를 기각할 수 있다(제214조의2 제3항).", "체포구속"],
["298", "피의자가 보증금납입조건부석방을 허가받기 위해서는 구속적부심사를 청구해야 한다.", false, "▸ 피의자 등이 구속적부심사를 청구하면 법원이 '직권'으로 보증금납입조건부 석방결정을 할 수 있을 뿐이다. 청구서에 보증금납입조건부 석방을 기재하더라도 이는 직권발동촉구의 의미에 불과하다.", "체포구속"],
["299", "체포영장이나 구속영장을 발부한 법관은 구속적부심사에 관여하지 못하지만, 구속적부심사를 담당할 판사가 없는 경우에는 그러하지 아니하다.", true, "▸ 제214조의2 제12항에 따라 체포영장이나 구속영장을 발부한 법관은 구속적부심사에 관여하지 못하나, 그 판사 외에 다른 판사가 없는 경우에는 예외이다.", "체포구속"],
["300", "법원은 구속적부심사에서 구속된 피의자가 죄증을 인멸할 염려가 있다고 믿을만한 충분한 이유가 있는 때에는 보증금납입조건부 피의자석방결정을 할 수 없다.", true, "▸ 제214조의2 제1항 제1호에 따라 피의자가 죄증을 인멸할 염려가 있다고 믿을만한 충분한 이유가 있는 때에는 보증금납입조건부 석방결정을 할 수 없다.", "체포구속"],
["301", "☆ 법원이 구속된 피의자에 대하여 보증금납입을 조건으로 석방결정을 한 때에는 피의자나 검사가 그 취소의 실익이 있다고 하더라도「형사소송법」제402조에 따른 항고를 할 수 없다.", false, "▸ 제214조의2 제8항은 제3항과 제4항의 기각결정 및 석방결정에 대하여 항고하지 못하도록 규정하고 있으나, 제5항(보증금납입조건부 석방결정)에 대하여 항고하지 못한다는 규정은 없다. 보증금납입조건부 석방결정에 대하여는 취소의 실익이 있는 한 제402조에 의하여 항고할 수 있다. [97모21]", "체포구속"],
["302", "구속된 피의자로부터 구속적부심사의 청구를 받은 법원이 보증금납입조건부 피의자석방결정을 내린 경우 보증금이 납입된 후에야 피의자를 석방할 수 있다.", true, "▸ 보증금납입의 조건은 이를 이행한 후가 아니면 석방허가결정을 집행하지 못한다(제100조, 제214조의2 제7항 준용).", "체포구속"],
["303", "보석은 유효한 구속영장을 전제로 구속의 집행을 정지시키는 것에 불과하다.", true, "▸ 구속취소는 구속을 실효시키는 제도이지만, 보석은 구속의 집행만을 정지시키는 제도이다. 보석이 취소되면 당연히 구속영장의 효력이 되살아난다.", "체포구속"],
["304", "피고인이 집행유예 기간 중에 재차 동일한 범죄를 저질러 집행유예가 취소되고 구속되어 있는 상태에서 보석을 청구한 경우, 법원은 피고인에 대하여 보석을 허가할 수 없다.", false, "▸ 집행유예의 기간 중에 있어 집행유예의 결격자라고 하여 보석을 허가할 수 없는 것은 아니다. 해당 사유는 필요적 보석의 예외에 해당하지 않는다. [90모22]", "체포구속"],
["305", "보석을 허가하거나 구속을 취소하는 법원의 결정에 대하여 검사는 즉시항고를 할 수 있다.", false, "▸ 검사는 구속취소 결정에 대해서는 즉시항고를 할 수 있으나(제97조 제4항), 보석 결정에 대해서는 '항고만' 할 수 있다(제403조). [위헌결정 93헌가2]", "체포구속"],
["306", "고등법원의 결정에 대한 재항고는 형사소송법상 즉시항고로 규정되어 있으므로, 고등법원의 보석취소결정에 대하여는 즉시항고가 가지는 집행정지의 효력이 인정된다.", false, "▸ 제415조가 고등법원의 결정에 대한 재항고를 즉시항고로 규정하고 있다고 하여 당연히 즉시항고가 가지는 집행정지의 효력이 인정된다고 볼 수는 없다. 고등법원의 보석취소결정에 대하여는 집행정지의 효력을 인정할 수 없다. [2020모633]", "체포구속"],
["307", "보석보증금몰수결정은 반드시 보석취소결정과 동시에 하여야만 하는 것이 아니라 보석취소결정 후에 별도로 할 수도 있다.", true, "▸ 제103조 제1항에 따라 보석보증금을 몰수하려면 반드시 보석취소와 동시에 하여야만 가능한 것이 아니라 보석취소 후에 별도로 보증금몰수결정을 할 수도 있다. [2000모22]", "체포구속"],
["308", "구속영장의 효력이 소멸한 때에는 보석조건은 즉시 그 효력을 상실한다.", true, "▸ 제104조의2 제1항에 따라 구속영장의 효력이 소멸한 때에는 보석조건은 즉시 그 효력을 상실한다.", "체포구속"],
["309", "구속의 사유가 없거나 소멸된 때에는 법원은 직권 또는 검사, 피고인, 변호인과 제30조 제2항에 규정한 자의 청구에 의하여 결정으로 구속을 취소하여야 한다.", true, "▸ 제93조에 따라 구속의 사유가 없거나 소멸된 때에는 법원은 직권 또는 검사, 피고인, 변호인과 변호인선임권자의 청구에 의하여 결정으로 구속을 취소하여야 한다.", "체포구속"],
["310", "구속취소청구를 불허한 결정에 관여하지 아니한 법관이 항고에 대한 의견서를 첨부하여 항고법원에 송부한 것은 직접심리주의에 반하여 위법하다.", false, "▸ 제1심결정에 관여하지 아니한 법관이 항고에 대한 의견서를 첨부하여 항고법원에 송부한 것은 직접심리주의에 위배되는 위법이 있다고 할 수 없다. [86모10]", "체포구속"],
["311", "이미 구속영장이 실효된 경우라도 피고인이 계속 구금되어 있는 때에는 구속의 취소 결정을 할 수 있다.", false, "▸ 구속취소는 구속영장의 효력이 존속하고 있음을 전제로 하는 것이고, 다른 사유로 이미 구속영장이 실효된 경우에는 피고인이 계속 구금되어 있더라도 제93조에 의한 구속의 취소 결정을 할 수 없다. [99초355]", "체포구속"],
["312", "법원은 상당한 이유가 있는 경우 직권 또는 검사·피고인·변호인과 변호인선임권자의 청구에 의하여 구속의 집행을 정지할 수 있다.", false, "▸ 법원은 상당한 이유가 있는 때에는 결정으로 구속의 집행을 정지할 수 있다(제101조 제2항). 검사나 피고인 등의 청구권은 없고 '직권'만 가능하다.", "체포구속"],
["313", "구속집행정지결정을 할 때에는 급속을 요하는 경우를 제외하고 검사의 의견을 물어야 한다.", true, "▸ 구속집행정지의 결정을 함에는 검사의 의견을 물어야 한다. 다만, 급속을 요하는 경우에는 그러하지 아니하다(제101조 제2항).", "체포구속"],
["314", "상소기간 중 소송기록이 원심법원에 있는 때에는 구속의 집행정지에 대한 결정은 원심법원이 이를 하여야 한다.", true, "▸ 상소기간 중 또는 상소 중의 사건에 관하여 구속기간의 갱신, 구속의 취소, 보석, 구속의 집행정지와 그 정지의 취소에 대한 결정은 소송기록이 원심법원에 있는 때에는 원심법원이 하여야 한다(제105조).", "체포구속"],
["315", "경찰관 甲이 도로를 순찰하던 중 벌금 미납으로 지명수배된 피고인과 조우하게 되어 벌금 미납으로 인한 노역장 유치의 집행을 위하여 구인하려 하였는데, 피고인이 이에 저항하여 甲을 폭행함으로써 경찰관의 공무집행을 방해한 경우, 甲이 피고인을 구인하는 과정에서 형집행장이 발부되어 있는 사실을 고지하지 않았다면 甲의 직무집행은 위법하므로, 피고인에게 공무집행방해죄가 성립하지 않는다.", true, "▸ 사법경찰관리가 벌금 미납으로 인한 지명수배 사실을 고지하였더라도 특별한 사정이 없는 한 이를 형집행장이 발부되어 있는 사실까지 고지한 것으로 볼 수 없으므로, 형집행장이 발부되어 있는 사실을 고지하지 않은 직무집행은 적법한 직무집행에 해당한다고 할 수 없다. [2017도9458]", "체포구속"],
["316", "벌금형에 따르는 노역장유치의 집행을 위하여 형집행장을 발부하여 구인하는 경우에도 구속이유의 고지에 관한「형사소송법」제72조가 준용된다.", false, "▸ 형소법 제475조에서 형집행장의 집행에 관하여 피고인의 구속에 관한 규정을 준용한다고 하는 것은 '피고인의 구속영장의 집행에 관한 규정'을 의미한다. 따라서 구속의 사유(제70조)나 구속이유의 고지(제72조)는 형집행장의 집행에 준용되지 아니한다. [2012도2349]", "체포구속"],
["317", "★ 사법경찰관 P가 피의자 甲을 절도 혐의로 긴급체포한 후 조사하였으나, 甲의 혐의를 입증할 증거가 부족하다고 판단하여 석방한 경우, 추가로 목격자 X의 진술조서를 갖추어 구속영장을 청구하더라도 더 이상 위 절도 혐의로는 법원으로부터 영장을 발부받을 수 없다.", false, "▸ 제200조의4 제3항은 '영장 없이는' 긴급체포 후 석방된 피의자를 동일한 범죄사실에 관하여 체포하지 못한다는 규정이다. 이와 같이 석방된 피의자라도 법원으로부터 구속영장을 발부받아 구속할 수 있다. [2001도4291]", "체포구속"],
["318", "★ 피의자가 긴급체포되었다가 수사기관의 조치로 석방된 경우, 수사기관은 다른 중요한 증거를 발견하지 아니하는 한 동일한 범죄사실에 관하여 법원으로부터 구속영장을 발부받아 구속할 수 없다.", false, "▸ 제200조의4 제3항은 '영장 없이는' 긴급체포 후 석방된 피의자를 동일한 범죄사실에 관하여 체포하지 못한다는 의미이다. 영장 없이 다시 긴급체포할 수는 없으나, 체포·구속영장으로 체포·구속할 수 있다. [2001도4291]", "체포구속"],
["319", "체포·구속적부심사에 의하여 석방된 피의자에 대해 피의자가 도망하거나 범죄의 증거를 인멸하는 경우를 제외하고는 동일한 범죄사실로 재차 체포하거나 구속할 수 없다.", true, "▸ 체포·구속적부심사에 의하여 석방된 피의자에 대해 피의자가 도망하거나 범죄의 증거를 인멸하는 경우를 제외하고는 동일한 범죄사실로 재차 체포하거나 구속할 수 없다(제214조의3 제1항).", "체포구속"],
["320", "☆ 법원의 보증금납입조건부 석방결정에 의하여 석방된 피의자는 새로운 증거가 발견된 경우를 제외하고는 동일한 범죄사실에 대하여 재차 구속하지 못한다.", false, "▸ 보증금납입조건부 석방결정에 따라 석방된 피의자는 ① 도망한 때, ② 도망하거나 범죄의 증거를 인멸할 염려가 있다고 믿을 만한 충분한 이유가 있는 때, ③ 출석요구를 받고 정당한 이유없이 출석하지 아니한 때, ④ 주거의 제한이나 그 밖에 법원이 정한 조건을 위반한 때 중 하나에 해당하는 사유가 있는 경우를 제외하고는 동일한 범죄사실로 재차 체포·구속할 수 없다(제214조의3 제2항). '새로운 증거 발견'은 예외 사유에 해당하지 않는다.", "체포구속"],
["321", "★ 구속되었다가 석방된 피의자 또는 피고인은 다른 중요한 증거가 발견된 경우가 아니면 동일한 범죄사실에 관하여 재차 구속하지 못한다.", true, "▸ 검사 또는 사법경찰관에 의하여 구속되었다가 석방된 자는 다른 중요한 증거를 발견한 경우를 제외하고는 동일한 범죄사실에 관하여 재차 구속하지 못한다(제208조 제1항).", "체포구속"],
["322", "수소법원의 구속에 관하여는 검사 또는 사법경찰관이 피의자를 구속함을 규율하는 제208조의 규정은 적용되지 아니한다. 또한 구속기간의 만료로 피고인에 대한 구속의 효력이 상실된 후 항소법원이 피고인에 대한 판결을 선고하면서 구속하였다고 하여 제208조의 규정에 위배되는 재구속 또는 이중구속이라 할 수 없다.", true, "▸ 제208조는 검사 또는 사법경찰관이 피의자를 구속하는 경우에 관한 규정으로 수소법원의 구속에는 적용되지 않는다. 구속기간 만료 후 항소법원이 새로 구속하더라도 제208조 위반이 아니다. [85모12]", "체포구속"],
["323", "검사 또는 사법경찰관에 의하여 구속되었다가 석방된 자는 다른 중요한 증거를 발견한 경우를 제외하고는 동일한 범죄사실에 관하여 재차 구속하지 못하며, 1개의 목적을 위하여 동시 또는 수단결과의 관계에서 행하여진 행위는 동일한 범죄사실로 간주한다.", true, "▸ 제208조 제1항 및 제2항에 따라 구속되었다가 석방된 자는 다른 중요한 증거 발견 시를 제외하고는 재차 구속할 수 없고, 1개의 목적을 위하여 동시 또는 수단결과의 관계에서 행하여진 행위는 동일한 범죄사실로 간주한다.", "체포구속"],
["324", "피고인이 수사 당시 긴급체포되었다가 사후영장발부 전에 수사기관의 조치로 석방된 후 법원이 발부한 구속영장에 의하여 구속이 이루어진 경우「형사소송법」제208조에 규정된 재구속 제한에 위배되는 위법한 구속이라고 볼 수 없다.", true, "▸ 제208조 소정의 '구속되었다가 석방된 자'라 함은 구속영장에 의하여 구속되었다가 석방된 경우를 말하는 것이지, 긴급체포나 현행범으로 체포되었다가 사후영장발부 전에 석방된 경우는 포함되지 않는다. [2001도4291]", "체포구속"],
["325", "법원이 공판정에서 압수·수색을 할 때에는 영장을 요하지 않으나 공판정 외에서 압수·수색을 할 때에는 영장을 발부하여야 한다.", true, "▸ 공판정 외에서 압수·수색을 함에는 영장을 발부하여 시행하여야 한다(제113조).", "압수수색검증"],
["326", "압수, 수색 또는 검증에 관하여는 조서를 작성하여야 하며 이는 공판기일에 공판정에서의 압수와 검증의 경우에도 그대로 적용되므로 이를 공판조서에 기재하는 것에 그치지 않고 별도의 조서를 작성하여야 한다.", false, "▸ 검증, 압수 또는 수색에 관하여는 조서를 작성하여야 한다(제49조 제1항). 공판조서에는 공판정에서 행한 검증 또는 압수 사항을 기재하여야 한다(제51조 제2항 제10호). 공판정에서 압수 등을 하는 경우 공판조서에 기재하면 된다.", "압수수색검증"],
["327", "헌법상 출판에 대한 사전검열이 금지되므로 출판물의 내용이 형벌법규에 위반하여 범죄를 구성하는 경우라도 출판 직전에 그 출판물을 증거물이나 몰수할 물건으로 압수할 수 없다.", false, "▸ 출판내용에 형벌법규에 저촉되어 범죄를 구성하는 혐의가 있는 경우에 그 증거물 또는 몰수할 물건으로서 압수하는 것은 재판절차라는 사법적 규제와 관련된 것이어서 행정적인 규제로서의 사전검열과 같이 볼 수 없다. [91모1]", "압수수색검증"],
["328", "수사기관의 압수에 대해 불복이 있는 경우 직무집행지의 관할법원에 준항고를 제기할 수 있다.", true, "▸ 검사 또는 사법경찰관의 구금, 압수 또는 압수물의 환부에 관한 처분에 대하여 불복이 있으면 그 직무집행지의 관할법원 또는 검사의 소속검찰청에 대응한 법원에 그 처분의 취소 또는 변경을 청구할 수 있다(제417조).", "압수수색검증"],
["329", "피고인에 대하여 몰수의 선고가 없어 그 압수가 해제된 것으로 간주된다고 하더라도 공범자에 대한 범죄수사를 위하여 여전히 그 물품의 압수가 필요하다거나 공범자에 대한 재판에서 그 물품이 몰수될 가능성이 있다면 검사는 그 압수해제된 물품을 다시 압수할 수도 있다.", true, "▸ 피고인에 대한 몰수 선고 없어 압수가 해제되었더라도, 공범자에 대한 수사·재판을 위해 그 물품의 압수가 필요한 경우 검사는 재압수할 수 있다. [96모34]", "압수수색검증"],
["330", "사법경찰관리는 필요에 의하여 관할구역 외에서 압수·수색영장을 집행할 수 있고 또는 당해 관할구역의 사법경찰관리에게 집행을 촉탁할 수 있다.", true, "▸ 제115조 제2항, 제83조 제2항에 따라 관할구역 외 집행 또는 당해 관할구역 사법경찰관리에게 촉탁이 가능하다.", "압수수색검증"],
["331", "검사는 압수·수색영장의 집행에 관하여 필요한 때에는 사법경찰관리에게 보조를 구할 수 있다.", true, "▸ 제117조에 따라 검사는 압수·수색영장의 집행에 관하여 필요한 때에는 사법경찰관리에게 보조를 구할 수 있다.", "압수수색검증"],
["332", "법원이 압수를 계속할 필요가 없다고 인정되는 압수물은 피고사건 종결 전이라도 결정으로 환부하여야 하고 증거에 공할 압수물은 소유자, 소지자, 보관자 또는 제출인의 청구에 의하여 가환부하여야 한다.", false, "▸ ① 압수를 계속할 필요가 없다고 인정되는 압수물은 피고사건 종결 전이라도 결정으로 환부하여야 한다. ② 증거에 공할 압수물은 소유자, 소지자, 보관자 또는 제출인의 청구에 의하여 가환부할 수 '있다'(제133조 제1항). 청구가 있더라도 가환부는 재량이지 의무가 아니다.", "압수수색검증"],
["333", "「형사소송법」제133조 제1항 후단이 '증거에 공할 압수물'에 대하여 법원의 재량에 의하여 가환부할 수 있도록 규정하고 있는바, '증거에 공할 압수물'에는 증거물로서의 성격과 몰수할 것으로 사료되는 물건으로서의 성격을 가진 압수물은 제외되어 있다고 해석함이 상당하다.", false, "▸ '증거에 공할 압수물'에는 증거물로서의 성격과 몰수할 것으로 사료되는 물건으로서의 성격을 가진 압수물이 포함되어 있다. [97모25]", "압수수색검증"],
["334", "법원이 증거에만 공할 목적으로 압수한 물건으로서 그 소유자 또는 소지자가 계속 사용하여야 할 물건은 사진촬영 기타 원형보존의 조치를 취하고 가환부할 수 있다.", false, "▸ 증거에만 공할 목적으로 압수한 물건으로서 그 소유자 또는 소지자가 계속 사용하여야 할 물건은 사진촬영 기타 원형보존의 조치를 취하고 신속히 가환부하여야 한다(제133조 제2항). 재량이 아니라 의무이다.", "압수수색검증"],
["335", "검사는 증거에 사용할 압수물에 대하여 가환부의 청구가 있는 경우 가환부를 거부할 수 있는 특별한 사정이 없는 한 가환부에 응하여야 한다.", true, "▸ 검사는 사본을 확보한 경우 등 압수를 계속할 필요가 없다고 인정되는 압수물 및 증거에 사용할 압수물에 대하여 공소제기 전이라도 소유자, 소지자, 보관자 또는 제출인의 청구가 있는 때에는 환부 또는 가환부하여야 한다(제218조의2 제1항). [2017모236]", "압수수색검증"],
["336", "甲은 아버지의 예금통장을 절취한 후 현금지급기에서 미리 알고 있던 비밀번호를 입력하여 아버지의 예금계좌에서 자신의 계좌로 500만 원을 이체하였다. 법원은 위 예금통장 절취사실이 유죄로 인정될 경우, 위 예금통장에 대하여 판결로써 피해자에게 환부하는 선고를 하여야 한다.", true, "▸ 압수한 장물로서 피해자에게 환부할 이유가 명백한 것은 판결로써 피해자에게 환부하는 선고를 하여야 한다(제333조 제1항).", "압수수색검증"],
["337", "압수한 서류 또는 물품에 대하여 몰수의 선고가 없는 때에는 압수를 해제한 것으로 간주한다.", true, "▸ 압수한 서류 또는 물품에 대하여 몰수의 선고가 없는 때에는 압수를 해제한 것으로 간주한다(제332조).", "압수수색검증"],
["338", "가환부한 장물에 대하여 별단의 선고가 없는 때에는 환부의 선고가 있는 것으로 간주한다.", true, "▸ 제333조 제3항에 따라 가환부한 장물에 대하여 별단의 선고가 없는 때에는 환부의 선고가 있는 것으로 간주한다.", "압수수색검증"],
["339", "피고인에게 의견을 진술할 기회를 주지 아니한 채 한 가환부결정은 형소법 제135조에 위배하여 위법하고 이 위법은 재판의 결과에 영향을 미쳤다 할 것이다.", true, "▸ 압수물의 가환부결정을 함에는 미리 검사, 피해자, 피고인 또는 변호인에게 통지한 연후에 하도록 형소법 제135조에 규정하고 있다. 피고인에게 의견을 진술할 기회를 주지 아니한 채 한 가환부결정은 제135조에 위배하여 위법하고 이 위법은 재판의 결과에 영향을 미쳤다 할 것이다. [80모3]", "압수수색검증"],
["340", "★ 피압수자인 피의자가 압수물에 대하여 소유권을 포기하였다 하더라도 환부사유가 생기고 피압수자가 환부를 청구하면 검사는 이를 환부하여야 한다.", true, "▸ 피압수자 등 환부를 받을 자가 압수 후 그 소유권을 포기하는 등에 의하여 실체법상의 권리를 상실하더라도 그 때문에 압수물을 환부하여야 하는 수사기관의 의무에 어떠한 영향을 미칠 수 없다. [94모51 전합]", "압수수색검증"],
["341", "★ 환부를 받을 피압수자가 수사기관에 압수물의 환부청구권을 포기한다는 의사표시를 한 경우에는 수사기관의 필요적 환부의무는 면제된다.", false, "▸ 수사기관에 대하여 형소법상의 환부청구권을 포기한다는 의사표시를 하더라도 그 효력이 없어 그에 의하여 수사기관의 필요적 환부의무가 면제된다고 볼 수는 없다. 압수물의 소유권이나 환부청구권을 포기하는 의사표시로 인하여 환부청구권이 소멸하는 것은 아니다. [94모51 전합]", "압수수색검증"],
["342", "외국산 물품을 관세장물의 혐의가 있다고 보아 압수하였다 하더라도 그것이 언제, 누구에 의하여 관세포탈된 물건인지 알 수 없어 기소중지 처분을 한 경우에는 그 압수물은 관세장물이라고 단정할 수 없어 이를 국고에 귀속시킬 수 없을 뿐만 아니라 압수를 더 이상 계속할 필요도 없다.", true, "▸ 관세장물 혐의로 압수하였으나 관세포탈 사실을 특정할 수 없어 기소중지 처분을 한 경우, 그 압수물을 국고에 귀속시킬 수 없고 압수도 계속할 필요가 없다. [94모51]", "압수수색검증"],
["343", "★ 압수수색영장의 사유로 된 범죄 혐의사실과 무관한 별개의 증거를 압수하였다면 원칙적으로 유죄 인정의 증거로 사용할 수 없으나, 압수·수색의 목적이 된 범죄나 이와 관련된 범죄의 경우에는 그 압수·수색의 결과를 유죄의 증거로 사용할 수 있다.", true, "▸ 압수수색영장의 혐의사실과 무관한 별개 증거는 원칙적으로 증거 사용 불가이나, 압수·수색의 목적이 된 범죄나 이와 관련된 범죄에 대해서는 사용 가능하다. [2017도13458]", "압수수색검증"],
["344", "★ 압수·수색영장의 범죄사실과 관계있는 범죄라는 것은 압수·수색영장에 기재한 범죄사실과 객관적 관련성이 있을 뿐 아니라, 압수·수색영장 대상자와 피의자 사이의 인적 관련성이 있는 범죄를 의미한다.", true, "▸ 관계있는 범죄란 객관적 관련성 + 인적 관련성 모두 충족해야 한다. [2017도13458]", "압수수색검증"],
["345", "★ 압수·수색영장 대상자와 피의자 사이의 인적 관련성은 압수·수색영장에 기재된 대상자의 공동정범이나 교사범 등 공범이나 간접정범은 물론 필요적 공범 등에 대한 피고사건에 대해서도 인정된다.", true, "▸ 인적 관련성은 공동정범·교사범·간접정범 등 공범 및 필요적 공범에 대한 피고사건도 포함한다. [2017도13458]", "압수수색검증"],
["346", "★ 압수·수색영장에 기재된 혐의사실과의 객관적 관련성은 압수·수색영장에 기재된 혐의사실 자체 또는 그와 기본적 사실관계가 동일한 범행과 직접 관련되어 있는 경우는 물론 범행 동기와 경위 등을 증명하기 위한 간접증거나 정황증거 등으로 사용될 수 있는 경우에도 인정될 수 있다.", true, "▸ 객관적 관련성은 혐의사실과 직접 관련된 경우뿐 아니라 범행 동기·경위를 증명하는 간접증거나 정황증거로 사용될 수 있는 경우에도 인정된다. [2017도13458]", "압수수색검증"],
["347", "★ 객관적 관련성은 압수·수색영장에 기재된 혐의사실의 내용과 수사의 대상, 수사 경위 등을 종합하여 구체적·개별적 연관관계가 있는 경우에만 인정된다고 보아야 하고, 혐의사실과 단순히 동종 또는 유사 범행이라는 사유만으로 객관적 관련성이 있다고 할 것은 아니다.", true, "▸ 객관적 관련성은 구체적·개별적 연관관계가 있는 경우에만 인정되고, 단순히 동종·유사 범행이라는 이유만으로 인정되지 않는다. [2017도13458]", "압수수색검증"],
["348", "★ 수사기관이 甲의 뇌물수수 범행을 범죄사실로 하여 발부받은 압수수색영장을 집행하는 과정에, 乙과 丙 사이의 甲과 무관한 별개의 뇌물수수에 관한 대화가 녹음된 녹음파일을 발견한 경우, 별도의 압수수색영장을 발부받지 않더라도 위 녹음파일을 乙과 丙에 대한 뇌물수수죄의 증거로 사용할 수 있다.", false, "▸ 압수·수색영장에 기재된 피의자 甲이 녹음파일에 의하여 의심되는 혐의사실과 무관한 이상, 수사기관이 별도의 압수·수색영장을 발부받지 아니한 채 압수한 녹음파일은 영장에 기재된 해당 사건과 관계가 있다고 인정할 수 있는 것에 해당하지 않으므로 증거로 쓸 수 없다. [2013도7101]", "압수수색검증"],
["349", "긴급체포된 자가 소유·소지·보관하는 물건으로서 긴급히 압수할 필요가 있는 때에는 영장 없이 압수할 수 있으며, 이때 현금, 수표 등도 포함될 수 있다.", true, "▸ 제217조 제1항에 따라 긴급체포된 자가 소유·소지·보관하는 물건에 대해 긴급한 필요가 있을 때 영장 없이 압수할 수 있다. [2008도2245]", "압수수색검증"],
["350", "★ 검사는 법원으로부터 변호사법위반 및 사기죄에 관한 압수·수색영장을 발부받아 변호사 사무실에서 컴퓨터 하드디스크를 압수하여 수사기관으로 가지고 왔다. 위 컴퓨터 하드디스크 자체의 반출이 적법하다고 하더라도, 수사기관 사무실에서 범죄 혐의사실 관련성에 대한 구분 없이 임의로 저장된 전자정보를 문서로 출력하거나 파일로 복제하는 행위는 위법한 압수가 된다.", true, "▸ 수사기관 사무실 등으로 반출된 저장매체 또는 복제본에서 혐의사실 관련성에 대한 구분 없이 임의로 저장된 전자정보를 문서로 출력하거나 파일로 복제하는 행위는 원칙적으로 영장주의 원칙에 반하는 위법한 압수가 된다. [2011모1839 전합]", "압수수색검증"],
["351", "★ 사법경찰관이 피의자를 현행범으로 체포하면서 관련성이 없는 증거를 압수하였다면, 사후에 법원으로부터 압수수색영장이 발부되었다거나 피고인이나 변호인이 증거동의하였다고 하여 그 위법성이 치유되는 것도 아니다.", true, "▸ 관련성이 없는 증거를 압수하였으므로 위법수집증거에 해당하고, 사후에 영장이 발부되었다거나 피고인이나 변호인이 증거동의하였다고 하여 그 위법성이 치유되는 것도 아니다. [2016도348]", "압수수색검증"],
["352", "★ 사법경찰관이 피의자를 현행범으로 체포하면서 절도 범행이 의심되는 상황에서 피의자의 차량 문을 열고 내부를 수색하여 절취품으로 의심되는 물건을 압수한 경우, 이는 체포현장에서의 압수·수색으로서 적법하다.", false, "▸ 체포 현장에서의 압수·수색이 적법하려면 피의자의 신체 및 직접 지배하의 장소에 한정되고, 관련성 없는 물건에 대한 압수는 적법하지 않다. [2016도348 참조]", "압수수색검증"],
["353", "일출 전, 일몰 후에는 원칙적으로 압수·수색영장의 집행을 위하여 피의자의 주거에 들어갈 수 없다.", true, "▸ 일출 전, 일몰 후에는 압수·수색영장에 야간집행을 할 수 있는 기재가 없으면 타인의 주거, 간수자 있는 가옥, 건조물, 항공기 또는 선차 내에 들어가지 못한다(제125조).", "압수수색검증"],
["354", "★ 지방법원 판사가 휴대전화에 대한 압수·수색영장청구를 기각한 경우 그 기각결정에 대하여는 준항고로 불복할 수 없지만, 항고의 방법으로는 불복할 수 있다.", false, "▸ ① 지방법원 판사가 한 압수영장 기각 재판에 대하여는 준항고로 불복할 수 없다. ② 항고는 법원이 한 결정을 대상으로 하는 것이므로 지방법원 판사의 재판에 대하여 항고로도 불복할 수 없다. [97모66]", "압수수색검증"],
["355", "압수·수색영장의 집행 과정에서 피압수자의 지위가 참고인에서 피의자로 전환될 수 있는 증거가 발견될 경우 그 증거가 압수·수색영장에 기재된 범죄사실과 객관적으로 관련되어 있다면 이는 압수·수색영장의 집행 범위 내에 있으나, 피압수자의 지위가 참고인에서 피의자로 전환되었으므로 다시 피압수자에 대하여 영장을 발부받고 헌법상 변호인의 조력을 받을 권리를 고지하거나 압수·수색영장에 참여할 의사를 확인하여야 한다.", false, "▸ 피압수자의 지위가 참고인에서 피의자로 전환될 수 있는 증거가 발견된 경우에도, 다시 피압수자에 대하여 영장을 발부받고 변호인 조력권을 고지하거나 압수·수색과정 참여 의사를 확인해야 한다고 보기 어렵다. [2017도13458]", "압수수색검증"],
["356", "★ 수사기관이 압수·수색영장을 제시하고 집행에 착수하여 압수·수색을 실시하고 그 집행을 종료하였다고 하더라도 동일한 장소 또는 목적물에 대하여 다시 압수·수색할 필요가 있는 경우에는 그 영장의 유효기간이 남아 있다면 이를 제시하고 다시 압수·수색할 수 있다.", false, "▸ ① 유효기간은 집행에 착수할 수 있는 종기를 의미할 뿐이다. ② 집행을 종료하면 영장은 목적 달성으로 효력이 상실된다. ③ 동일한 장소에 대해 다시 압수·수색하려면 새로운 압수·수색영장을 발부받아야 한다. [2020도5336]", "압수수색검증"],
["357", "★ 수사기관이 범죄 혐의사실과 관련 있는 정보를 선별하여 압수한 후에도 그와 관련이 없는 나머지 정보를 삭제·폐기·반환하지 아니한 채 그대로 보관하고 있다면 이는 위법하고, 사후에 법원으로부터 압수·수색영장이 발부되었다거나 피고인이나 변호인이 이를 증거로 함에 동의하였다고 하여 그 위법성이 치유된다고 볼 수 없다.", true, "▸ 범죄 혐의사실과 관련 없는 정보를 삭제·폐기·반환하지 않고 보관하는 것은 위법이고, 사후 영장 발부나 증거동의로도 그 위법성은 치유되지 않는다. [2021모1586]", "압수수색검증"],
["358", "★ 법관이 압수수색영장을 발부하면서 '압수할 물건을 특정하기 위하여 기재한 문언'은 엄격하게 해석하여야 하고, 피압수자 등에게 불리한 내용으로 확장 또는 유추해석하는 것은 허용될 수 없다.", true, "▸ 법관이 압수수색영장 발부 시 압수할 물건을 특정하기 위하여 기재한 문언은 엄격하게 해석하여야 하고, 피압수자에게 불리한 확장 또는 유추해석은 허용되지 않는다. [2020도14654]", "압수수색검증"],
["359", "★ 압수·수색영장의 범죄사실과 기본적 사실관계가 동일한 범행 또는 동종·유사의 범행과 관련된다고 의심할만한 상당한 이유가 있는 물건까지 압수하였다면 위법한 압수에 해당한다.", false, "▸ 압수의 대상을 압수수색영장의 범죄사실 자체와 직접적으로 연관된 물건에 한정할 것은 아니고, 기본적 사실관계가 동일한 범행 또는 동종·유사의 범행과 관련된다고 의심할 만한 상당한 이유가 있는 범위 내에서는 압수를 실시할 수 있다. [2018도6252]", "압수수색검증"],
["360", "甲은 아청법위반(성착취물제작·배포등) 범인이 피해자와 대화한 계정의 IP 가입자가 피고인 甲의 모친임을 확인하고, 甲과 함께 거주하는 甲의 남동생 乙를 피의자로 기재하여 압수·수색영장을 발부받았다. 영장 대상자는 '乙', 압수할 물건은 '乙가 소유·소지 또는 보관·관리·사용하는 물건 등'으로 기재되어 있었다. 甲이 출근하여 부재중인 사이 경찰은 乙로부터 해당 페이스북 사용자가 甲이라는 말을 듣고 乙에게 영장을 제시하고 주거지를 수색하여 甲 소유의 휴대전화를 압수하였다. 위 휴대전화 및 그 안의 사진들은 증거능력이 없다.", true, "▸ 영장의 문언상 압수·수색의 상대방은 乙이고, 압수할 물건은 乙가 소유·소지·보관·관리·사용하는 물건에 한정된다. 경찰이 영장에 기재된 문언에 반하여 피고인(甲) 소유의 물건을 압수할 수는 없다. [2020도14654]", "압수수색검증"],
["361", "★ 사법경찰관 甲은 乙의 강도혐의를 수사하면서 압수·수색영장(압수장소: 乙이 임차하여 거주하는 丙 소유의 집, 압수대상물: 위 장소에 보관 중인 물건)을 발부받아 丙에게 영장을 제시한 후 수색하던 중, 마침 乙을 찾아온 乙의 친구 丁이 들고 있던 야구방망이를 압수하였다. 甲이 압수·수색에 착수하면서 관리책임자인 丙에게 영장을 제시한 이후에 丁이 야구방망이를 들고 압수·수색장소에 출현하였으므로 乙이 증거로 함에 부동의하더라도 야구방망이는 증거능력이 있다.", false, "▸ 압수·수색영장에서 압수할 물건을 '압수장소에 보관중인 물건'이라고 기재하고 있는 것을 '압수장소에 현존하는 물건'으로 해석할 수는 없다. 丁이 방문 후 들고 온 야구방망이는 '보관중인 물건'이 아니므로 영장 범위를 벗어난 위법한 압수이다. [2008도763]", "압수수색검증"],
["362", "검사가 甲의 전자우편을 압수·수색하는 과정에서 급속을 요하는 때에는 압수·수색영장을 집행하면서 참여권자에 대한 사전통지를 생략하였다고 하더라도 적법절차 원칙에 위배되지 않는다.", true, "▸ 압수·수색영장을 집행함에는 미리 집행의 일시와 장소를 통지하여야 한다. 단, 참여하지 아니한다는 의사를 명시한 때 또는 급속을 요하는 때에는 예외로 한다(제122조).", "압수수색검증"],
["363", "사법경찰관 甲은 乙에 대한 음란물유포 혐의로 발부받은 압수·수색영장에 의하여 乙의 주거지를 압수·수색을 할 때에는 乙에게 영장을 제시하여야 하지만, 사본을 교부할 필요는 없다.", false, "▸ 압수·수색영장은 처분을 받는 자에게 반드시 제시하여야 하고, 처분을 받는 자가 피의자인 경우에는 그 사본을 교부하여야 한다(제219조, 제118조).", "압수수색검증"],
["364", "★ 압수·수색영장은 처분을 받는 자에게 반드시 제시하여야 하지만, 피처분자가 현장에 없거나 현장에서 그를 발견할 수 없는 경우 등 영장제시가 현실적으로 불가능한 경우에는 영장을 제시하지 않고 압수·수색을 하더라도 위법하다고 볼 수 없다.", true, "▸ 피처분자가 현장에 없거나 현장에서 그를 발견할 수 없는 경우 등 영장제시가 현실적으로 불가능한 경우에는 영장을 제시하지 않고 압수·수색을 하더라도 위법하다고 볼 수 없다. [2014도10978]", "압수수색검증"],
["365", "★ 사법경찰관 甲은 'X 제약회사 대표 乙과 직원 丙이 공모하여 의사 丁에게 리베이트를 제공한 범죄사실'의 압수·수색영장에 근거하여 X회사를 압수·수색하면서 乙에게 영장을 제시하였으나, 현장에 없는 丙에게는 영장을 제시하지 아니하였다면, 丙에 대하여 영장을 제시하지 아니한 채 압수·수색을 하였다는 이유만으로도 당해 압수물의 증거능력은 인정될 수 없다.", false, "▸ 丙이 현장에 없으므로 제시하지 않아도 위법하지 않다. 영장 제시 불가능한 경우에 해당하여 압수물의 증거능력은 인정될 수 있다.", "압수수색검증"],
["366", "★ 정보통신서비스 회사에서 보관 중인 이메일에 대하여 압수·수색영장을 집행하면서 팩스로 영장사본을 송신하였다면, 집행 시에 그 영장의 원본을 제시하지 않더라도 위법하지 않다.", false, "▸ 수사기관이 팩스로 영장 사본을 송신한 사실은 있으나 영장 원본을 제시하지 않았고, 압수조서와 압수물 목록을 작성하여 피압수·수색 당사자에게 교부하였다고 볼 수도 없다면, 위와 같은 방법으로 압수된 각 이메일은 위법수집증거로 증거능력이 없다. [2015도10648]", "압수수색검증"],
["367", "★ 압수·수색영장을 집행하는 수사기관은 피압수자로 하여금 법관이 발부한 영장에 의한 압수·수색이라는 사실을 확인함과 동시에 형소법이 압수·수색영장에 필요적으로 기재하도록 정한 사항이나 그와 일체를 이루는 사항을 충분히 알 수 있도록 압수·수색영장을 제시하여야 한다.", true, "▸ 수사기관은 피압수자가 영장의 내용을 충분히 알 수 있도록 압수·수색영장을 제시하여야 한다. [2019모3526]", "압수수색검증"],
["368", "★ 수사기관이 휴대전화 등을 압수할 당시 압수당한 피의자가 수사관에게 압수·수색영장의 내용을 보여 달라고 요구하였으나 수사관이 영장의 겉표지만 보여 주고 내용은 확인시켜 주지 않았다면, 그 후 변호인이 피의자조사에 참여하면서 영장을 확인하였더라도 압수처분은 위법하다.", true, "▸ 수사기관이 압수처분 당시 피의자로부터 영장 내용의 구체적인 확인을 요구받았음에도 압수·수색영장의 내용을 보여주지 않았던 것으로 보이므로, 그 후 변호인이 확인하였더라도 적법한 압수·수색영장 제시라고 인정하기 어렵다. [2019모3526]", "압수수색검증"],
["369", "★ 압수·수색영장은 현장에서 피압수자가 여러 명일 경우에는 그들 모두에게 개별적으로 영장을 제시하여야 한다.", true, "▸ 압수·수색에 착수하면서 그 장소의 관리책임자에게 영장을 제시하였다고 하더라도, 물건을 소지하고 있는 다른 사람으로부터 이를 압수하고자 하는 때에는 그 사람에게 따로 영장을 제시하여야 한다. [2015도12400]", "압수수색검증"],
["370", "★ 수사기관이 피의자 참여하에 정보저장매체에 기억된 정보 중 키워드 또는 확장자 검색 등을 통해 범죄 혐의사실과 관련 있는 정보를 선별한 다음 정보저장매체와 동일하게 비트열 방식으로 복제하여 생성한 파일을 제출받아 압수한 경우, 수사기관이 수사기관 사무실에서 위와 같이 압수된 이미지 파일을 탐색·복제·출력하는 과정에서도 피의자 등에게 참여의 기회를 보장하여야 한다.", false, "▸ 현장에서 선별 압수(비트열 복제)로 압수·수색 절차가 종료된 것이므로, 수사기관이 사무실에서 이미 압수된 이미지 파일을 탐색·복제·출력하는 과정에서는 피의자 등에게 참여의 기회를 보장할 필요는 없다. [2017도13263]", "압수수색검증"],
["371", "★ 피압수자가 수사기관에 압수·수색영장의 집행에 참여하지 않는다는 의사를 명시하였다면 특별한 사정이 있는 경우를 제외하고는 그 변호인에게 압수·수색영장의 집행에 참여할 기회를 별도로 보장하지 않아도 무방하다.", false, "▸ 변호인의 참여권은 피압수자의 보호를 위하여 변호인에게 주어진 고유권이다. 피압수자가 참여하지 않는다는 의사를 명시하였다고 하더라도, 특별한 사정이 없는 한 그 변호인에게는 미리 집행의 일시와 장소를 통지하는 등으로 참여할 기회를 별도로 보장하여야 한다. [2020도10729]", "압수수색검증"],
["372", "★ 정보저장매체에 대한 압수·수색 과정에서 범위를 정하여 출력·복제하는 방법이 불가능한 예외적인 사정이 인정되어 저장매체를 수사기관 사무실 등으로 옮겨 복제·탐색·출력하는 경우, 변호인의 참여권은 독립된 권리는 아니므로 피압수자가 집행에 참여하지 않는다는 의사를 명시한 경우 변호인에게 그 집행의 일시와 장소를 따로 통지할 필요는 없다.", false, "▸ 변호인의 참여권은 피압수자의 보호를 위하여 변호인에게 주어진 고유권으로서 독립된 권리이다. 피압수자가 참여하지 않는다는 의사를 명시하였다고 하더라도 변호인에게는 집행 일시와 장소를 따로 통지하여 참여 기회를 보장하여야 한다. [2020도10729]", "압수수색검증"],
["373", "★ 수사기관은 압수 직후 현장에서 압수물 목록을 바로 작성하여 교부해야 하는 것이 원칙이고 압수된 전자정보의 상세목록에는 정보의 파일 명세가 특정되어 있어야 하며 수사기관은 이를 출력한 서면을 교부하거나 전자파일 형태로 복사해 주거나 이메일을 전송하는 등의 방식으로도 할 수 있다.", true, "▸ 수사기관은 압수 직후 현장에서 압수물 목록을 작성하여 교부해야 하는 것이 원칙이고, 전자정보 상세목록에는 파일 명세가 특정되어 있어야 하며, 교부 방식은 출력 서면, 전자파일 복사, 이메일 전송 등 다양한 방식이 가능하다. [2017도13263]", "압수수색검증"],
["374", "압수물 목록은 즉시 교부하여야 하는 것은 아니므로, 압수 후 5개월 뒤에 피압수자의 요청에 따라 압수물 목록을 교부하였다고 하더라도, 목록교부는 적법하다.", false, "▸ 압수·수색이 종료된 지 5개월이나 지난 뒤에 압수물 목록을 교부한 행위는 형소법이 정한 바에 따른 압수물 목록 작성·교부에 해당하지 않는다. [2008도763]", "압수수색검증"],
["375", "피의자가 유치장에 입감되어 있는 상태에서 사법경찰관이 사무실에서 사전 영장에 따라 적법하게 압수한 휴대전화를 탐색하다가 영장에 기재된 혐의사실과 관련된 전자정보를 발견하고 이를 복제하여 출력한 다음 수사기록에 편철한 경우, 영장에 의하여 전자정보를 취득하였다고 하더라도 피의자에게 참여권이 보장되지 아니하여 위법한 압수·수색에 해당한다.", true, "▸ 피의자가 유치장에 입감되어 있어 참여권을 보장받지 못한 상태에서 이루어진 전자정보 탐색·복제는 위법한 압수·수색에 해당한다. [2022도2960]", "압수수색검증"],
["376", "★ 수사기관이 성폭력범죄 혐의로 체포하면서 임의제출 받은 휴대전화에서 피의자신문 과정에 피의자와 함께 관련 영상을 탐색하여 피의자가 해당 영상이 언제 어디서 촬영한 것인지 쉽게 알아보고 구체적으로 진술하였다면, 전자정보의 파일 명세가 특정된 압수목록이 교부되지 않았더라도 피의자의 절차상 권리가 실질적으로 침해되었다고 보기 어렵다.", true, "▸ 피의자가 관련 영상을 직접 확인하고 구체적으로 진술하였다면, 비록 파일 명세가 특정된 압수목록이 교부되지 않았더라도 절차상 권리가 실질적으로 침해되었다고 보기 어렵다. [2019도4938]", "압수수색검증"],
["377", "★ 사법경찰관 甲이 피의자 乙을 아동·청소년의성보호에관한법률위반(성착취물제작등)죄의 혐의로 조사하면서 乙의 휴대전화를 임의제출 받았는데 별도의 압수조서는 작성하지 아니하고 피의자신문조서에 압수경위, 압수의 취지를 기재하였다. 甲이 피의자신문조서에 압수의 취지 등을 기재하였을 뿐 압수조서를 작성하지 아니한 행위는 위법하다.", false, "▸ 임의제출 증거물에 대해 피의자신문조서에 압수의 취지 등을 기재한 경우 압수조서를 갈음할 수 있어 압수절차의 적법성 심사·통제 기능에 차이가 없으므로, 이와 같은 사정만으로 압수가 형소법이 정한 압수절차를 지키지 않은 것이어서 위법하다고 볼 것은 아니다. [2020도2550]", "압수수색검증"],
["378", "체포영장을 집행할 때에는 미리 수색영장을 발부받기 어려운 긴급한 사정이 있는지와 상관 없이 영장 없이 타인의 주거에서 피의자를 수색할 수 있다.", false, "▸ 체포영장 또는 구속영장을 집행하는 경우 타인의 주거에서의 피의자 수색은 미리 수색영장을 발부받기 어려운 긴급한 사정이 있는 때에 한하여 가능하다(제216조 제1항 제1호).", "압수수색검증"],
["379", "사법경찰관이 현행범을 체포하는 경우에 필요한 때에는 영장 없이 타인의 주거나 타인이 간수하는 가옥, 건조물, 항공기, 선차 내에서 피의자를 찾기 위하여 수색할 수 있다.", true, "▸ 현행범인 체포와 긴급체포의 경우에는 타인의 주거에서의 피의자 수색에 긴급성 규정이 적용되지 않는다(제216조 제1항 제1호).", "압수수색검증"],
["380", "수사기관이 피고인에 대한 구속영장을 집행하는 경우 구속현장에서 영장없이 압수·수색할 수 있다.", true, "▸ 제216조 제2항, 제1항 제2호에 따라 구속영장 집행 현장에서 영장 없이 압수·수색할 수 있다.", "압수수색검증"],
["381", "★ 사법경찰관 甲은 乙의 丙에 대한 살인 범행 직후 丙의 집에 도착하여 현장에서 乙을 적법하게 체포하고, 乙으로부터 범행에 사용한 식칼을 임의로 제출받아 압수하면서 즉석에서 현장검증을 실시하여 검증조서를 작성하였다. 甲이 실시한 현장검증은 체포현장에서의 검증에 해당하여 영장 없이 할 수 있다.", true, "▸ 제216조 제1항 제2호에 따라 체포현장에서의 검증은 사전 영장 없이 할 수 있을 뿐만 아니라 사후에 검증 영장을 받아야 하는 것도 아니다.", "압수수색검증"],
["382", "수사기관이 적법하게 현행범을 체포할 때 필요한 경우라면 체포에 착수하지 아니한 상태라도 영장없이 체포현장에서 압수·수색·검증을 할 수 있다.", false, "▸ 현행범 체포에 착수하지 아니한 상태에서는 제216조 제1항 제2호, 제212조가 정하는 체포현장에서의 압수·수색 요건을 갖추지 못하였으므로, 영장 없는 압수·수색은 적법한 직무집행으로 볼 수 없다. [2014도16080, 체포착수설]", "압수수색검증"],
["383", "★ 사법경찰관 甲이 특수절도 혐의로 지명수배되어 도피 중인 피의자의 숙소에 정보를 받고 급습하였는데 피의자가 현장에 없는 경우, 그곳에 있는 특수절도 범행의 증거물인 통장, 카드 등을 영장없이 압수할 수 있다.", false, "▸ 현행범 체포에 착수하지 아니한 상태여서 체포현장에서의 압수·수색 요건을 갖추지 못하였으므로, 영장 없는 압수·수색은 적법한 직무집행으로 볼 수 없다. [2014도16080]", "압수수색검증"],
["384", "★ 사법경찰관 甲이 특정경제범죄가중처벌등에관한법률위반(배임)죄로 乙에 대한 체포영장을 발부받은 후 집 앞 주차장에 차량을 주차하고 있는 乙을 발견하고 위 체포영장에 기하여 체포하면서 乙의 차량을 수색한 것은「형사소송법」제216조 제1항 제2호에 따라 적법하다.", true, "▸ 주차장에서 乙을 발견하고 체포하였으므로 乙의 차량을 수색한 것은 체포현장에서의 수색에 해당한다(제216조 제1항 제2호).", "압수수색검증"],
["385", "사법경찰관이 피의자를 체포한 후 피의자를 주거지에 데리고 가 증거물인 통장을 영장없이 압수할 수 있다.", false, "▸ 체포한 장소에서 200m 떨어진 피고인의 집으로 데리고 가서 수색하여 압수한 경우 체포현장에 해당하지 않는다. [2009도14376]", "압수수색검증"],
["386", "★ 사법경찰관 甲이 乙을 도주차량 현행범으로 체포해서 조사 중 위 교통사고와 별건 범죄를 발견하고 그 수사를 위하여 乙의 주거지에 있는 乙 소유의 휴대전화를 긴급히 압수할 필요가 있는 경우 체포한 때부터 24시간 이내라면 영장 없이 압수할 수 있다.", false, "▸ 체포된 현장과 관련성도 없고 체포현장도 아닌 주거지에서의 압수는 위법하다. 24시간 요건(제217조 제1항)은 긴급체포 후 압수에 대한 것이지 체포현장 외 별건 압수에 적용되지 않는다.", "압수수색검증"],
["387", "★ 사법경찰관은 '대포통장' 거래 혐의로 체포영장이 발부된 피의자를 공원에서 체포하면서 피의자 본인의 신체와 그의 직접적인 지배하에 있는 물건은 영장 없이 압수·수색할 수 있으나, 피의자 소유의 차량은 그 범위에 해당하지 않는다.", false, "▸ 체포현장에서의 영장 없는 압수·수색 범위는 피의자의 신체 및 직접 지배하의 장소에 해당하며, 피의자를 체포하면서 해당 차량도 체포현장에서의 압수·수색 대상에 포함될 수 있다(제216조 제1항 제2호).", "압수수색검증"],
["388", "★ 검사 또는 사법경찰관은「형사소송법」제217조 제1항 또는 제216조 제1항 제2호에 따라 압수한 물건을 계속 압수할 필요가 있는 경우 지체 없이 압수·수색영장을 청구하여야 하고, 이 경우 압수·수색영장의 청구는 압수한 때부터 48시간 이내에 하여야 한다.", false, "▸ 제217조 제2항에 따라 영장 청구의 기산점은 '압수한 때'가 아니라 '체포한 때'부터 48시간 이내이다. 발부받지 못한 때에는 압수한 물건을 즉시 반환하여야 한다(제217조 제3항).", "압수수색검증"],
["389", "★ 사법경찰관 甲은 乙을 교통사고와 관련한 현행범으로 체포하면서 영장 없이 사고차량에 설치된 블랙박스를 乙의 의사에 반하여서도 압수할 수 있고, 이를 계속 압수할 필요가 있는 경우에는 검사를 통하여 지체 없이 압수·수색영장을 청구하여야 하고, 압수 후 늦어도 48시간 이내에는 이를 발부받아야 한다.", false, "▸ 체포현장에서 영장 없이 압수할 수 있으나, 계속 압수 필요 시 '체포한 때'부터 48시간 이내에 영장을 청구하여야 한다(압수한 때 기산 ×). 48시간 이내에 발부받아야 하는 것이 아니라 청구하여야 하는 것이다(제217조 제2항).", "압수수색검증"],
["390", "★ 수사관이 압수수색영장에 기재된 혐의사실을 이유로 발부받은 영장을 집행하여 피의자의 주거지를 수색하는 과정에서 대마가 발견되자, 피의자를 마약류관리에관한법률위반(대마)죄의 현행범인으로 체포하면서 이 대마를 압수하였다면, 대마를 압수한 것은 사전영장 없이 압수할 수 있는 경우에 해당한다.", true, "▸ 수색 과정에서 현행범인으로 체포하면서 범행 현장에서 대마를 압수한 것은 제216조 제1항 제2호의 체포현장에서의 압수에 해당하여 사전 영장 없이 압수할 수 있다. [2008도10914]", "압수수색검증"],
["391", "★ 위 사례에서 다음 날 사법경찰관이 체포된 피의자에 대하여 검사에게 구속영장을 신청하지 않고 피의자를 석방하였고, 대마의 압수에 대하여는 사후 압수·수색영장을 받지 아니하였다고 하더라도, 압수한 대마와 그 압수조서의 기재는 위법하게 수집한 증거가 아니므로 대마소지의 점에 관하여 증거로 할 수 있다.", false, "▸ 체포현장에서의 압수에 해당하여 사전 영장 없이 할 수 있으나 사후 지체 없이 압수·수색영장을 받아야 한다. 피의자를 석방하였음에도 사후 압수·수색영장을 발부받지 않은 경우 위법수집증거이다. [2008도10914]", "압수수색검증"],
["392", "사법경찰관이 현행범을 체포하는 경우에 체포현장인 타인의 주거에서 영장 없이 압수·수색을 할 수 있다. 이 경우에 급속을 요하는 경우에도 주거주, 간수자 또는 이에 준하는 자를 참여하게 하여야 한다.", false, "▸ 제216조에 의한 처분을 하는 경우에 급속을 요하는 때에는 제123조 제2항(주거주 등 참여)의 규정에 의함을 요하지 아니한다(제220조). 체포현장·범죄장소 압수수색의 경우 요급처분이 적용된다.", "압수수색검증"],
["393", "★ 범행 중 또는 범행직후의 범죄장소에서 긴급을 요하여 법원판사의 영장을 받을 수 없는 때에는 영장 없이 압수, 수색 또는 검증을 할 수 있고, 이 경우에는 사후에 지체 없이 영장을 받아야 한다.", true, "▸ 제216조 제3항에 따라 범죄장소 압수·수색의 경우 사후에 지체 없이 영장을 받아야 한다.", "압수수색검증"],
["394", "甲이 필로폰을 가지고 있을 것으로 판단한 수사관이 이를 대상으로 하는 압수수색영장을 발부받아 乙의 집에서 이 영장을 제시하고 필로폰을 수색하던 중 컬러복사기로 제작중이던 위조지폐를 발견하고 이를 압수한 경우, 이 위조지폐는 사후에 압수수색영장을 발부받지 않았더라도 통화위조죄의 증거로 사용할 수 있다.", false, "▸ 제작 중이던 위조지폐를 발견하였으므로 乙은 통화위조죄의 현행범이다. 범죄장소로 영장 없이 압수·수색할 수 있으나, 사후 지체없이 영장을 받아야 한다(제216조 제3항). 사후 영장 없이는 증거 사용 불가.", "압수수색검증"],
["395", "★ 사법경찰관은 범행 중 또는 범행 직후의 범죄 장소에서 긴급을 요하여 법원판사의 영장을 받을 수 없는 때에는 영장 없이 범죄장소를 압수, 수색할 수 있다. 이 경우에 압수·수색영장은 48시간 이내에 청구하여야 한다.", false, "▸ 범죄장소 압수수색의 경우 '지체없이' 사후 영장을 발부받아야 한다(제216조 제3항). 체포현장·긴급체포 압수수색과 달리 48시간의 별도 요건이 없다.", "압수수색검증"],
["396", "주취운전을 적발한 후 주취운전자를 체포하지 아니하면서도 영장없이 그 차량열쇠를 압수할 수 있다.", true, "▸ 주취운전이라는 범죄행위로 당해 음주운전자를 구속·체포하지 아니한 경우에도 필요하다면 그 차량열쇠는 범행 중 또는 범행 직후의 범죄장소에서의 압수로서 형소법 제216조 제3항에 의하여 영장 없이 압수할 수 있다. [97다54482]", "압수수색검증"],
["397", "★ 「형사소송법」제217조 제1항은 수사기관이 피의자를 긴급체포한 상황에서 관련 증거의 신속한 확보를 위한 것이므로, 긴급체포된 자가 체포현장이 아닌 장소에서는 긴급체포된 자가 소유·소지 또는 보관하는 물건을 압수할 수 없다.", false, "▸ 긴급체포 후 압수수색 규정(제217조 제1항)은 체포현장이 아닌 장소에서도 긴급체포된 자가 소유·소지 또는 보관하는 물건을 압수할 수 있다. [2017도10309, 체포현장에서 약 210m 떨어진 주거지]", "압수수색검증"],
["398", "★ 사법경찰관은 노래방에서 나오는 甲을 휴대폰 절도혐의로 적법하게 긴급체포하였다면, 甲이 집에 보관하고 있는 절취한 중고 휴대폰을 긴급히 압수할 필요가 있는 경우 체포한 때부터 24시간 이내에 한하여 영장 없이 압수·수색할 수 있고, 이를 계속 압수할 필요가 있는 경우에는 압수한 때부터 48시간 이내에 사후 압수·수색영장을 청구하여야 한다.", false, "▸ ① 긴급체포 후 압수수색은 체포한 때부터 24시간 이내에 한하여 가능하다(O). ② 계속 압수 필요 시 '압수한 때'가 아닌 '체포한 때'부터 48시간 이내에 청구하여야 한다(제217조 제2항).", "압수수색검증"],
["399", "사법경찰관이 피의자를 적법하게 긴급체포한 후 체포현장에서 약 210m 떨어진 피의자의 주거지에서 체포한 때부터 24시간 이내의 야간에 수색하여 범죄혐의와 관련된 물건을 압수한 후 체포한 때부터 48시간 이내에 사후 압수·수색영장을 청구하였고 이후 영장이 발부되었다고 하더라도, 야간에 영장 없이 한 위 물건의 압수는 위법하다.", false, "▸ 긴급체포 후 압수수색에 대해서는 요급처분(제220조)을 준용하는 규정이 없으나, 판례에 비추어 위 경우를 적법하다고 평가된다. 사후 영장이 발부된 경우 적법하다. [2017도10309]", "압수수색검증"],
["400", "★ 사법경찰관 甲이 강도혐의로 乙을 긴급체포하면서 긴급히 압수할 필요가 있다고 판단하여 乙이 소지하고 있는 칼을 영장 없이 압수하였으나, 압수·수색영장을 발부받지 아니하고도 즉시 乙에게 반환하지 아니하였다고 하더라도, 공판과정에서 乙이 증거물인 칼을 증거로 함에 동의하면 이를 유죄 인정의 증거로 사용할 수 있다.", false, "▸ 제217조 제2항, 제3항에 위반하여 압수수색영장을 청구하여 이를 발부받지 아니하고도 즉시 반환하지 아니한 압수물은 유죄 인정의 증거로 사용할 수 없고, 피고인이나 변호인이 증거로 함에 동의하였다고 하더라도 달리 볼 것은 아니다. [2009도11401]", "압수수색검증"],
["401", "위 사례에서 사법경찰관이 사후 압수·수색영장을 발부받지는 않았으나 乙에 대한 구속영장이 발부된 경우에는 위 칼은 乙의 죄를 인정하는 증거로 사용할 수 있다.", false, "▸ 구속영장의 발부와는 무관하게, 제217조 제2항, 제3항에 위반하여 압수수색영장을 발부받지 아니하고도 즉시 반환하지 아니한 압수물은 유죄 인정의 증거로 사용할 수 없다. [2009도11401]", "압수수색검증"],
["402", "★ 사법경찰관이 소유자, 소지자 또는 보관자가 아닌 자로부터 임의로 제출받은 물건을 영장없이 압수한 경우, 그 압수물 및 압수물을 찍은 사진은 피고인이나 변호인이 증거로 함에 동의하였다 하더라도 이를 유죄의 증거로 사용할 수 없다.", true, "▸ 소유자·소지자·보관자가 아닌 자로부터 임의제출받아 압수한 경우 위법수집증거에 해당하고, 압수물을 찍은 사진도 마찬가지로 증거동의해도 증거능력이 없다.", "압수수색검증"],
["403", "★ 사법경찰관 甲은 乙의 丙에 대한 특수상해 혐의에 대한 증거물을 수집하려고 乙의 집을 조사하던 중 乙이 거주하는 집 마당에서 乙 소유의 쇠파이프를 발견한 후 丙에게서 임의로 제출받는 형식으로 쇠파이프를 압수하였고, 그 후 쇠파이프를 찍은 사진과 함께 검사에게 송부하였다. 이 경우 쇠파이프는 위법수집증거로 증거능력이 없으나 그 사진은 최우량증거에 해당하므로 乙이 이를 증거로 함에 동의하면 이를 유죄 인정의 증거로 사용할 수 있다.", false, "▸ 쇠파이프 및 그 사진 모두 증거동의하더라도 증거능력 없다(2009도10092). 위법수집증거의 2차 증거에도 증거능력 부정.", "압수수색검증"],
["404", "★ 교도관이 재소자가 맡긴 비망록을 수사기관에 임의로 제출한 경우, 그 비망록의 사용에 대하여 재소자의 사생활의 비밀 기타 인격적 법익이 침해되는 등 특별한 사정이 없는 한 반드시 그 재소자의 동의를 받아야 하는 것은 아니다.", true, "▸ 교도관으로부터 그가 보관하고 있던 피고인의 비망록을 뇌물수수 등의 증거로 임의로 제출받아 압수한 경우, 피고인의 승낙 및 영장 없이 이루어졌다고 하더라도 적법절차를 위반한 위법이 있다고 할 수 없다. [2008도1097]", "압수수색검증"],
["405", "★ 임의제출물을 압수한 경우 압수물이 실제로 임의제출된 것인지에 관하여 다툼이 있을 때에는 검사가 그 임의성의 의문점을 없애는 증명을 해야 한다.", true, "▸ 수사기관의 우월적 지위에 의하여 임의제출 명목으로 실질적으로 강제적인 압수가 행하여질 수 있으므로, 제출에 임의성이 있다는 점에 관하여는 검사가 합리적 의심을 배제할 수 있을 정도로 증명하여야 한다. [2013도11233, 자유로운 증명에 의함]", "압수수색검증"],
["406", "★ 통상 현행범인 체포현장에서 자신의 죄책을 증명하는 물건을 스스로 제출할 의사가 있다고 해석할 수 없고 현행범인으로 체포된 자에 대하여 형소법 제216조 제1항 제2호에 따라 긴급압수가 가능하므로 임의제출물 압수는 허용되지 않는다.", false, "▸ 현행범 체포현장이나 범죄 현장에서도 소지자 등이 임의로 제출하는 물건은 형소법 제218조에 의하여 영장 없이 압수하는 것이 허용되고, 이 경우 검사나 사법경찰관은 별도로 사후에 영장을 받을 필요가 없다. [2019도13290]", "압수수색검증"],
["407", "★ 현행범인 체포현장에서 피의자가 임의로 제출하는 물건은「형사소송법」제218조에 따라 압수할 수는 없고,「형사소송법」제217조 제2항에 의하여 사후 영장을 발부받아야 하므로, 현행범인 체포를 당한 자가 임의제출한 장부는 그에 대한 사후 영장을 발부받지 아니하는 한 증거능력이 없다.", false, "▸ 현행범 체포현장이나 범죄 현장에서도 소지자 등이 임의로 제출하는 물건은 제218조에 의하여 영장 없이 압수하는 것이 허용되고, 사후에 영장을 받을 필요가 없다. [2019도13290]", "압수수색검증"],
["408", "★ 수사기관이 제출자의 의사를 쉽게 확인할 수 있음에도 이를 확인하지 않은 채 특정 범죄혐의사실과 관련된 전자정보와 그렇지 않은 전자정보가 혼재된 정보저장매체를 임의제출받은 경우, 그 정보저장매체에 저장된 전자정보 전부가 임의제출되어 압수된 것으로 취급할 수는 없다.", true, "▸ 수사기관이 제출자의 의사를 쉽게 확인할 수 있음에도 확인하지 않은 채 혼재된 정보저장매체를 임의제출받은 경우, 전자정보 전부가 임의제출된 것으로 취급할 수 없다. [2016도348 전합]", "압수수색검증"],
["409", "★ 경찰관이 불법촬영 혐의로 甲으로부터 휴대전화를 임의제출 받으면서 휴대전화에 담긴 정보 중 무엇을 제출하는지 甲으로부터 임의제출의 범위를 명확히 확인하지 않았다면 범행 동기와 경위, 수단과 방법, 시간과 장소 등에 관한 간접증거나 정황증거로 사용될 수 있는 정보는 압수의 대상에 포함될 수 없다.", false, "▸ 임의제출자의 구체적인 제출 범위에 관한 의사를 제대로 확인하지 않은 경우에는 임의제출에 따른 압수의 동기가 된 범죄혐의사실과 관련되고 이를 증명할 수 있는 최소한의 가치가 있는 전자정보에 한하여 압수의 대상이 된다. 범행 동기·경위 등을 증명하는 간접증거·정황증거도 포함될 수 있다. [2017도13458]", "압수수색검증"],
["410", "★ 피의자가 소유·관리하는 정보저장매체를 피의자 아닌 피해자 등 제3자가 임의제출하였다 하더라도 임의제출의 동기가 된 범죄혐의사실과 구체적·개별적 연관관계가 있는 전자정보에 한하여 압수의 대상이 되는 것으로 더욱 제한적으로 해석하여야 할 필요는 없다.", false, "▸ 피의자가 소유·관리하는 정보저장매체를 피해자 등 제3자가 임의제출하는 경우에는, 임의제출의 동기가 된 범죄혐의사실과 구체적·개별적 연관관계가 있는 전자정보에 한하여 압수의 대상이 되는 것으로 더욱 제한적으로 해석하여야 한다. [2016도348]", "압수수색검증"],
["411", "★ 임의제출된 정보저장매체에서 압수의 대상이 되는 전자정보의 범위를 넘어서는 전자정보에 대해 수사기관이 영장 없이 압수·수색하여 취득한 증거는 위법수집증거로서 증거능력이 없고, 설령 사후에 압수·수색영장이 발부되었거나 피고인이나 변호인이 이를 증거로 함에 동의하였더라도 그 위법성이 치유되지 않는다.", true, "▸ 임의제출 범위를 초과한 전자정보 압수는 위법수집증거이고, 사후 영장 발부나 증거동의로 위법성이 치유되지 않는다. [2016도348 전합]", "압수수색검증"],
["412", "★ 정보저장매체나 그 복제본을 적법하게 임의제출받은 수사기관이 그 정보저장매체 등을 수사기관 사무실 등으로 옮겨 이를 탐색·복제·출력하는 경우에도 피압수·수색 당사자(피압수자)나 그 변호인에게 참여의 기회를 보장하고 압수된 전자정보의 파일 명세가 특정된 압수목록을 작성·교부하여야 하지만, 탐색과정에서 이와 같은 절차를 준수하지 않은 경우에도 피고인이나 변호인이 이를 증거로 함에 동의하였다면, 증거로 사용할 수 있다.", false, "▸ 사후에 법원으로부터 영장이 발부되었다거나 피고인이나 변호인이 이를 증거로 함에 동의하였다고 하여 위법성이 치유되는 것도 아니다. [2019도11967]", "압수수색검증"],
["413", "★ 전자정보에 대한 압수·수색 절차에 참여하고 상세목록을 교부받았다면 절차적 권리에 관한 실질적 내용이 보장된 것이므로 그 압수·수색 절차는 적법하고, 이를 통해 취득한 전자정보는 증거능력이 인정된다.", true, "▸ 압수·수색 절차에 참여하고 상세목록을 교부받아 절차적 권리의 실질적 내용이 보장된 경우, 그 압수·수색 절차는 적법하고 취득한 전자정보는 증거능력이 인정된다.", "압수수색검증"],
["414", "★ 피해자 등 제3자가 피의자의 소유·관리에 속하는 정보저장매체를 영장에 의하지 않고 임의제출한 경우에는 특별한 사정이 없는 한 실질적 피압수자인 피의자에게 참여를 보장하고 압수한 전자정보 목록을 교부하는 등 피의자의 절차적 권리를 보장하기 위한 적절한 조치가 이루어져야 한다.", true, "▸ 피해자 등 제3자가 피의자의 소유·관리에 속하는 정보저장매체를 임의제출한 경우에는, 실질적 피압수자인 피의자에게 참여 보장, 전자정보 목록 교부 등 절차적 권리 보장을 위한 적절한 조치가 이루어져야 한다. [2016도348]", "압수수색검증"],
["415", "★ 정보저장매체를 임의제출한 피압수자에 더하여 임의제출자 아닌 피의자에게도 참여권이 보장되어야 하는 '피의자의 소유·관리에 속하는 정보저장매체'란, 피의자가 압수·수색 당시 또는 이와 시간적으로 근접한 시기까지 해당 정보저장매체를 현실적으로 지배·관리하면서 전속적인 관리처분권을 보유·행사하고, 달리 이를 자신의 의사에 따라 제3자에게 양도하거나 포기하지 아니한 경우로서, 피의자를 그 전자정보에 대하여 실질적인 피압수자로 평가할 수 있는 경우를 말한다.", true, "▸ '피의자의 소유·관리에 속하는 정보저장매체'의 의미에 관한 정확한 설명이다. [2021도11170]", "압수수색검증"],
["416", "★ 정보저장매체를 임의제출한 피압수자에 더하여 임의제출자 아닌 피의자에게도 참여권이 보장되어야 하는 '피의자의 소유·관리에 속하는 정보저장매체'에 해당하는지 여부는 전자정보에 의해 식별되는 정보주체의 정보자기결정권을 고려할 때 압수·수색 당시 외형적·객관적으로 인식 가능한 사실상의 상태가 아니라 민사법상 권리의 귀속에 따른 법률적·사후적 판단을 기준으로 판단하여야 한다.", false, "▸ 실질적인 피압수자에 해당하는지 여부는 민사법상 권리의 귀속에 따른 법률적·사후적 판단이 아니라 압수·수색 당시 외형적·객관적으로 인식 가능한 사실상의 상태를 기준으로 판단하여야 한다. [2021도11170]", "압수수색검증"],
["417", "★ 증거은닉범 乙이 본범 甲으로부터 은닉을 교사받고 소지·보관 중이던 甲의 정보저장매체를 임의제출하는 경우 증거은닉범행의 피의자이면서 임의제출자인 乙에게만 참여의 기회를 부여하고 甲에게 참여의 기회를 부여하지 않은 것은 위법하다.", false, "▸ 압수·수색 당시 하드디스크를 현실적으로 점유한 사람은 乙이고, 甲은 하드디스크에 관한 전속적인 지배·관리권을 포기하거나 양도한 것으로 볼 수 있으므로, 임의제출자 乙에 더하여 甲에게도 참여권이 보장되어야 한다고 볼 수 없다. [2022도7453]", "압수수색검증"],
["418", "★ 甲이 乙 소유 모텔 객실에 위장형 카메라를 몰래 설치해 불법촬영을 하였는데 이후 수사기관이 乙로부터 임의제출 형식으로 위 카메라를 압수한 경우, 카메라 메모리카드에는 사실상 대부분 압수 대상 전자정보만이 저장되어 있어, 甲에게 참여의 기회를 보장하지 않고 전자정보 압수목록을 작성·교부하지 않았다는 점만으로 곧바로 위 임의제출물의 증거능력을 부정할 수 없다.", true, "▸ 오직 불법촬영을 목적으로 은밀히 설치되어 촬영대상 목표물의 동작이 감지될 때에만 카메라가 작동하는 경우, 별도의 보호 가치 있는 전자정보의 혼재 가능성을 상정하기 어려우므로 통상의 압수절차 외에 별도의 조치가 따로 요구된다고 보기는 어렵다. [2019도7342]", "압수수색검증"],
["419", "★ 전자정보에 대한 압수·수색영장의 집행에 있어서는 원칙적으로 영장발부의 사유로 된 혐의사실과 관련된 부분만을 문서 출력물로 수집하거나 수사기관이 휴대한 저장매체에 해당 파일을 복제하는 방식으로 이루어져야 한다.", true, "▸ 전자정보에 대한 압수·수색영장의 집행은 원칙적으로 관련 부분만을 문서 출력물로 수집하거나 파일을 복제하는 방식으로 이루어져야 한다. [2013도12155]", "압수수색검증"],
["420", "★ 압수·수색영장에 저장매체 자체를 직접 또는 하드카피·이미징 등 형태로 수사기관 사무실 등 외부로 반출하여 해당 파일을 압수·수색할 수 있도록 기재되어 있지 않더라도, 수사기관이 전자정보의 복사·출력이 불가능하거나 현저히 곤란한 부득이한 사정이 있을 때에는 압수목적물인 저장매체 자체를 수사관서로 반출할 수 있다.", false, "▸ 집행이 불가능하거나 현저히 곤란한 부득이한 사정이 있더라도, 저장매체 자체를 반출하려면 ① 영장에 그와 같은 내용이 기재되어 있고 ② 실제 그와 같은 사정이 발생한 때에 한하여 예외적으로 허용된다. [2013도12155]", "압수수색검증"],
["421", "★ 사법경찰관이 압수·수색대상인 甲의 컴퓨터 하드디스크를 수사기관의 사무실로 적법하게 반출하여 그 하드디스크 자체를 탐색하여 혐의사실과 관련된 전자정보를 문서로 출력하거나 파일로 복제하는 일련의 과정은 전체적으로 하나의 영장에 기한 압수·수색의 일환에 해당한다.", true, "▸ 하드디스크 자체를 수사기관 사무실로 적법하게 반출하여 탐색·출력·복제하는 일련의 과정은 전체적으로 하나의 영장에 기한 압수·수색의 일환에 해당한다.", "압수수색검증"],
["422", "★ 정보저장매체나 그 복제본을 임의제출받은 수사기관이 그 정보저장매체 등을 수사기관 사무실 등으로 옮겨 탐색·복제·출력하는 경우 그와 같은 일련의 과정에서 피압수·수색 당사자나 그 변호인에게 참여의 기회를 보장하고 압수된 전자정보의 파일 명세가 특정된 압수목록을 작성·교부하여야 하며 범죄혐의사실과 무관한 전자정보의 임의적인 복제 등을 막기 위한 적절한 조치를 취하는 등 영장주의 원칙과 적법절차를 준수하여야 한다.", true, "▸ 임의제출 후 수사기관 사무실에서 탐색·복제·출력하는 과정에서도 참여 기회 보장, 압수목록 작성·교부, 적절한 조치 등 영장주의 원칙과 적법절차를 준수하여야 한다.", "압수수색검증"],
["423", "★ 사법경찰관이 乙을 현행범으로 체포하는 현장에서 乙로부터 휴대전화를 임의제출받아 적법하게 압수하였다면, 乙로부터 휴대전화를 임의제출받은 이상 사법경찰관이 경찰서에서 휴대전화를 탐색하는 과정에서 乙 또는 그의 변호인의 참여를 요하지 아니한다.", false, "▸ 임의제출받아 압수한 후에도 경찰서에서 탐색하는 과정에서 피압수자 또는 그 변호인에게 참여의 기회를 보장하여야 한다. [2016도348 등]", "압수수색검증"],
["424", "★ 전자정보에 대한 압수·수색영장에 기하여 저장매체 자체를 반출한 후 수사기관이 수사기관 사무실에서 저장매체의 전자정보를 탐색하던 중 영장의 범죄혐의와는 다른 별도의 범죄혐의에 해당하는 증거를 발견하게 되어 이를 압수하려는 경우에는 더 이상의 집행을 중단하고 별도의 범죄혐의에 대한 압수·수색영장을 발부받아야 한다.", true, "▸ 저장매체 탐색 중 영장 범죄혐의와 다른 별도의 범죄혐의 증거를 발견한 경우 집행을 중단하고 별도 압수·수색영장을 발부받아야 한다. [2011모1839]", "압수수색검증"],
["425", "★ 수사기관이 영장 발부의 사유로 된 혐의사실과 무관한 물건을 압수한 후 그 물건을 피압수자 등에게 환부하고 임의제출을 받은 경우 그 물건은 증거로 할 수 없다.", false, "▸ 별개의 증거를 환부하고 후에 임의제출받아 다시 압수하였다면 최초 절차 위반행위와 최종적인 증거수집 사이의 인과관계가 단절되었다고 평가할 수 있으나, 제출에 임의성이 있다는 점을 검사가 합리적 의심을 배제할 수 있을 정도로 증명하여야 한다. 임의성이 증명되면 증거로 사용할 수 있다. [2013도11233]", "압수수색검증"],
["426", "★ 압수·수색의 장소에서 압수할 전자정보를 문서로 출력할 수 있음에도 저장매체 자체를 반출하였다면, 직무집행지의 관할 법원에 수사기관의 압수처분에 대하여 취소 또는 변경을 청구할 수 있다.", true, "▸ 검사 또는 사법경찰관의 압수에 관한 처분에 대하여 불복이 있으면 그 직무집행지의 관할법원 또는 검사의 소속검찰청에 대응한 법원에 그 처분의 취소 또는 변경을 청구할 수 있다(제417조).", "압수수색검증"],
["427", "★ 이메일 계정에 대한 접근권한에 갈음하여 발부받은 압수·수색영장에 따라 이메일 계정 아이디와 비밀번호를 입력하는 등 피의자가 접근하는 통상적인 방법에 따라 원격지의 저장매체에 접속하여 내려받거나 현출된 전자정보를 대상으로 하여 범죄 혐의사실과 관련된 부분에 대하여 압수·수색하는 것은, 사회통념상 타당하다고 인정되는 대물적 강제처분 행위로서 허용되며, 제120조 제1항에서 정한 압수·수색영장의 집행에 필요한 처분에 해당한다.", true, "▸ 이메일 계정에 대한 접근권한에 갈음하여 발부받은 영장에 따라 통상적인 방법으로 원격지 저장매체에 접속하여 범죄 혐의사실과 관련된 부분을 압수·수색하는 것은 허용되고, 영장 집행에 필요한 처분에 해당한다. [2017도9747]", "압수수색검증"],
["428", "★ 압수·수색할 전자정보가 영장에 기재된 수색장소에 있는 컴퓨터에 있지 않고 그 컴퓨터와 정보통신망으로 연결되어 제3자가 관리하는 원격지의 서버에 저장되어 있는 경우, 영장에 기재된 수색장소의 컴퓨터를 이용하여 원격지의 저장매체에 접속하는 것은 피의자가 접근하는 통상적인 방법에 따라 한 것이라도 허용된 집행의 장소적 범위를 벗어난 것으로 위법하다.", false, "▸ 수색장소에 있는 정보처리장치를 이용하여 원격지의 저장매체에 접속하는 것이 영장에서 허용한 집행의 장소적 범위를 확대하는 것이라고 볼 수 없다. 수색에서 압수에 이르는 일련의 과정이 모두 영장에 기재된 장소에서 행해지기 때문이다. [2017도9747]", "압수수색검증"],
["429", "★ 수사기관이 불법촬영 혐의로 압수·수색영장을 발부받아 피의자의 집에서 휴대폰을 압수한 후, 그 저장매체와 연동된 클라우드에 접속하여 그곳에 저장된 불법촬영 영상을 증거로 확보하기 위해서는 압수·수색영장의 압수할 물건에 원격지 서버 저장 전자정보가 포함되어 있어야 한다.", true, "▸ 원격지 서버에 저장된 전자정보를 압수·수색하기 위해서는 영장에 적힌 '압수할 물건'에 별도로 원격지 서버 저장 전자정보가 특정되어 있어야 한다. 정보처리장치 저장 전자정보만 기재된 경우 원격지 서버 저장 전자정보를 압수할 수 없다. [2022도1452]", "압수수색검증"],
["430", "★ 압수·수색영장의 '압수할 물건'에 클라우드에 저장된 전자정보가 기재되어 있지 않더라도, 적법하게 압수한 휴대전화에 클라우드계정이 로그인되어 있었다면 클라우드에 저장된 전자정보를 내려받아 압수하는 것은 적법하다.", false, "▸ 영장에 적힌 '압수할 물건'에 컴퓨터 등 정보처리장치 저장 전자정보만 기재되어 있다면, 이를 이용하여 원격지 서버 저장 전자정보를 압수할 수 없다. [2022도1452]", "압수수색검증"],
["431", "★ 피의자가 휴대전화를 임의제출하면서 휴대전화에 저장된 전자정보가 아닌 클라우드 등 제3자가 관리하는 원격지에 저장되어 있는 전자정보를 수사기관에 제출한다는 의사로 수사기관에게 클라우드 등에 접속하기 위한 아이디와 비밀번호를 임의로 제공하였다면 위 클라우드 등에 저장된 전자정보를 임의제출하는 것으로 볼 수 있다.", true, "▸ 피의자가 클라우드 접속을 위한 아이디와 비밀번호를 임의로 제공하였다면, 클라우드에 저장된 전자정보를 임의제출하는 것으로 볼 수 있다. [2020도14654]", "압수수색검증"],
["432", "★ 범죄 증거를 수집할 목적으로 피의자의 동의 없이 이루어지는 강제채뇨는 피의자에게 신체적 고통이나 장애를 초래하고 수치심이나 굴욕감을 주며 인간으로서의 존엄과 가치를 침해하는 수사방법이므로「형사소송법」제215조에 따라 판사로부터 압수·수색영장을 적법하게 발부받았더라도 허용되지 않는다.", false, "▸ 범죄 수사를 위해 강제채뇨가 부득이하다고 인정되는 경우 최후의 수단으로 적법한 절차에 따라 허용된다. 감정(처분)허가장을 받아 감정에 필요한 처분으로 할 수 있으나, 압수·수색의 방법으로도 가능하다. [2018도6219]", "압수수색검증"],
["433", "수사기관은 음주운전 여부를 조사하는 과정에서 감정처분허가장을 발부받아 감정에 필요한 처분으로서 또는 압수영장을 발부받아 압수로서 운전자의 동의 없이 그 혈액을 취득·보관할 수 있다.", true, "▸ 감정처분허가장을 받아 감정에 필요한 처분으로서 또는 압수영장을 발부받아 압수로서 운전자의 동의 없이 혈액을 취득·보관할 수 있다. [2011도15258]", "압수수색검증"],
["434", "★ 甲(17세)은 혈중알콜농도 0.15%로 술에 취한 상태에서 자동차를 운전하다가 행인 乙를 뒤늦게 발견하고 미처 피하지 못하여 乙에게 전치 4주의 상해를 입히고 丙 소유의 상점 출입문을 들이받아 파손한 후 의식을 잃고 곧바로 사고현장 인근 병원 응급실로 후송되었다. 甲이 후송된 병원 응급실은「형사소송법」제216조 제3항의 범죄장소에 준한다.", true, "▸ 음주운전 중 교통사고를 야기한 피의자가 의식불명인데 범죄의 증적이 현저한 '준현행범'의 요건이 갖추어지고 교통사고 발생 시각으로부터 사회통념상 범행 직후라고 볼 수 있는 시간 내라면, 사고현장으로부터 곧바로 후송된 병원 응급실 등은 제216조 제3항의 '범죄 장소'에 준한다. [2011도15258]", "압수수색검증"],
["435", "★ 음주운전과 관련한 도로교통법 위반죄의 범죄수사를 위하여 사법경찰관이 응급실로 가서 담당의사로 하여금 교통사고를 낸 후 의식을 잃고 곧바로 응급실로 후송된 甲의 혈액을 채취하게 한 후 혈중알콜농도에 관한 감정의뢰회보를 확보한 경우, 사후압수영장은 발부받지 못하였다고 하더라도 감정의뢰회보의 증거능력이 인정된다.", false, "▸ 범죄장소에서 영장 없이 압수·수색 또는 검증을 할 수 있으나, 사후에 지체 없이 압수영장을 받아야 한다. 사후 압수영장을 발부받지 못하면 증거능력이 없다. [2011도15258]", "압수수색검증"],
["436", "★ 위 사례에서 공판 과정에서 피고인이나 변호인이 위 감정의뢰회보에 대해 증거로 함에 동의한 경우 유죄의 증거로 사용할 수 있다.", false, "▸ 사후 압수영장을 발부받지 않은 경우, 피고인이나 변호인이 증거동의하더라도 위법성이 치유되지 않아 유죄의 증거로 사용할 수 없다. [2011도15258]", "압수수색검증"],
["437", "★ 위 사례에서 사법경찰관이 사후에 지체 없이 법원으로부터 감정처분허가장을 받았다면 증거능력이 인정된다.", false, "▸ 범죄장소에서의 영장 없는 압수(제216조 제3항)의 경우 사후에 '압수영장'을 받아야 하고, 감정처분허가장을 받는 것으로는 요건을 충족하지 못한다. [2011도15258]", "압수수색검증"],
["438", "★ 위 사례에서 만약 사법경찰관이 달려온 甲의 법정대리인(부)의 동의를 받아 의료인의 자격이 있는 자로 하여금 甲의 혈액을 채취하도록 하였다면 사후에 압수영장을 발부받았는지 여부와 상관없이 이는 적법한 수사이다.", false, "▸ 피의자에게 의사능력이 있다면 피의자 본인만이 혈액채취에 관한 유효한 동의를 할 수 있고, 피의자에게 의사능력이 없는 경우에도 명문의 규정이 없는 이상 법정대리인이 피의자를 대리하여 동의할 수는 없다. [2013도1228]", "압수수색검증"],
["439", "★ 사법경찰관이 간호사로부터 甲이 치료 목적으로 채취한 혈액 중 일부를 임의제출 받아 영장 없이 압수한 경우, 그 압수절차는 적법절차에 위반된다.", false, "▸ 의료인이 진료 목적으로 이미 채혈되어 있던 혈액을 수사기관에 임의로 제출하였다면 환자의 사생활의 비밀 기타 인격적 법익이 침해되는 등의 특별한 사정이 없는 한 반드시 그 환자의 동의를 받아야 하는 것이 아니다. [98도968]", "압수수색검증"],
["440", "통비법 제16조 제1항 제1호는 '제3조의 규정에 위반하여 공개되지 아니한 타인간의 대화를 녹음 또는 청취하는 것'을 처벌대상으로 규정하고 있으므로, 통비법 제14조 제1항의 금지를 위반하는 행위를 제16조 제1항 제1호의 처벌대상이 된다고 해석하는 것은 죄형법정주의에 위반되어 허용될 수 없다.", false, "▸ 통비법 제14조 제1항의 금지를 위반하는 행위는 통비법과 형소법 또는 군사법원법의 규정에 따른 것이라는 특별한 사정이 없는 한, 제3조 제1항 위반행위에 해당하여 제16조 제1항 제1호의 처벌대상이 된다. [2020도1007]", "압수수색검증"],
["441", "'우당탕'소리는 사람의 목소리가 아니라 사물에서 발생하는 음향이고 '악'소리도 사람의 목소리이기는 하나 그것만으로 상대방에게 의사를 전달하는 말이라고 보기는 어려워 특별한 사정이 없는 한「통신비밀보호법」에서 말하는 타인 간의 '대화'에 해당한다고 볼 수 없다.", true, "▸ 통비법에서 보호하는 타인 간의 '대화'는 원칙적으로 현장에 있는 당사자들이 육성으로 말을 주고받는 의사소통행위를 가리킨다. 사물에서 발생하는 음향이나 단순한 비명소리는 의사소통 행위가 아니므로 '대화'에 해당하지 않는다. [2016도19843]", "압수수색검증"],
["442", "★ 대화에 원래부터 참여하지 않은 제3자가 일반 공중이 알 수 있도록 공개되지 아니한 타인간의 발언을 녹음하거나 전자장치 또는 기계적 수단을 이용하여 청취한 것은 특별한 사정이 없는 한「통신비밀보호법」에 위반된다.", true, "▸ 대화에 원래부터 참여하지 않은 제3자가 공개되지 아니한 타인간의 발언을 녹음하거나 전자장치로 청취하는 행위는 특별한 사정이 없는 한 통신비밀보호법에 위반된다. [2020도1007]", "압수수색검증"],
["443", "甲은 편의점에서 점원 乙를 협박한 후 현금을 강취하여 강도죄로 기소되었는데, 甲은 공판과정에서 일체의 증거에 동의하지 않고 있다. 甲은 범행일 저녁 친구 丙을 만나 '오늘 어떤 놈을 협박해서 돈을 쉽게 벌었다.'라고 하며 자랑하였는데, 丙은 몰래 그 내용을 휴대폰으로 녹음한 후 그 녹음파일을 수사기관에 임의제출하였다. 丙이 제출한 녹음파일은 위법하게 수집된 증거이므로 증거능력이 없다.", false, "▸ ① 사인이 피고인 아닌 사람과의 대화내용을 대화 상대방 몰래 녹음하였다고 하더라도 그것만으로는 위법하게 수집된 증거로서 증거능력이 없다고 할 수 없다(98도3169). ② 대화 당사자 일방이 상대방 모르게 그 대화내용을 녹음한 경우 통비법 제3조 제1항 위반이 되지 아니한다(2002도123).", "압수수색검증"],
["444", "★ 甲, 乙, 丙이 모여서 같이 대화를 나누던 중, 甲이 증거수집 목적으로 자신의 휴대전화 녹음 기능을 사용하여 3명의 대화를 녹음하였다면, 이러한 녹음 행위는「통신비밀보호법」제16조 제1항에 해당하며 위법하다.", false, "▸ 3인 간의 대화에서 그중 한 사람이 그 대화를 녹음하는 경우에 다른 두 사람의 발언은 그 녹음자에 대한 관계에서 통비법 제3조 제1항에서 정한 '타인 간의 대화'라고 할 수 없으므로, 이러한 녹음 행위가 통비법 제16조 제1항에 해당한다고 볼 수 없다. [2013도15616]", "압수수색검증"],
["445", "★ 甲은 乙의 집을 찾아가 자신이 뇌물로 준 1천만 원을 돌려주지 않으면 녹음한 내용을 수사기관과 언론사에 보내겠다고 말하였다. 乙의 배우자 丙은 乙의 사전 언급에 따라 甲과 乙의 대화 내용을 옆방에서 자신의 휴대전화로 甲 모르게 녹음하였다. 丙이 甲과 乙의 대화내용을 휴대전화로 몰래 녹음한 것은 대화 당사자인 乙의 사전 동의에 의한 것이므로, 甲의 공갈죄에 대한 유죄의 증거로 사용할 수 있다.", true, "▸ 대화 당사자인 乙의 사전 동의에 의한 녹음이므로 유죄의 증거로 사용할 수 있다. [2015도1900]", "압수수색검증"],
["446", "★ 검사는 甲과 乙을 함께 丙으로부터 2억 원을 편취하였다는 사기 공소사실로 기소하였다. 만약 甲이 사기범행을 인정하는 취지의 乙·丙 간의 대화내용을 몰래 녹음하였다면, 그 녹음파일은 乙에 대한 유죄의 증거로 사용할 수 있다.", false, "▸ 공개되지 아니한 타인간의 대화를 녹음하거나 전자장치 또는 기계적 수단을 이용하여 청취한 내용은 재판 또는 징계절차에서 증거로 사용할 수 없다(통비법 제14조 제2항, 제4조). 甲은 乙·丙 간의 대화 당사자가 아니므로 위법한 녹음이다.", "압수수색검증"],
["447", "공개되지 아니한 타인간의 대화를 녹음하거나 전자장치 또는 기계적 수단을 이용하여 청취한 내용은 재판 또는 징계절차에서 증거로 사용할 수 없다.", true, "▸ 공개되지 아니한 타인간의 대화를 불법 녹음하거나 청취한 내용은 재판 또는 징계절차에서 증거로 사용할 수 없다(통비법 제14조 제2항, 제4조).", "압수수색검증"],
["448", "★ 甲이 乙에게 전화로 뇌물로 준 돈을 돌려주지 않으면 관련 내용을 수사기관에 보내겠다고 말하였다. 이에 乙이 甲과의 전화상 대화를 휴대전화로 몰래 녹음하였는데, 이러한 행위는 통신비밀보호법상 감청에 해당하여 甲의 뇌물공여죄나 乙의 뇌물수수죄에 대한 유죄의 증거로 사용할 수 없다.", false, "▸ 전기통신의 감청은 제3자가 전기통신의 당사자인 송신인과 수신인의 동의를 받지 않고 전기통신의 내용을 녹음하는 행위만을 말한다. 전화통화 당사자의 일방이 상대방 모르게 통화 내용을 녹음하는 것은 감청에 해당하지 않아 증거로 사용할 수 있다. [2015도1900]", "압수수색검증"],
["449", "★ 수사기관이 구속수감된 자로 하여금 자신의 압수된 휴대전화를 이용하여 피의자와 통화하고 위 범행에 관한 통화 내용을 녹음하게 한 경우, 구속수감된 자가 통화 당사자가 되므로 그 녹음은 피의자에 대한 유죄 인정의 증거로 사용할 수 있다.", false, "▸ 수사기관 스스로가 주체가 되어 구속수감된 자의 동의만을 받고 상대방인 피고인의 동의를 받지 아니한 채 통화 내용을 녹음한 행위는 범죄수사를 위한 통신제한조치의 허가 등을 받지 아니한 불법감청에 해당한다. 피고인과 변호인의 증거동의가 있어도 증거능력이 없다. [2010도9016]", "압수수색검증"],
["450", "★ 인터넷 개인방송의 방송자가 비밀번호를 설정하는 등으로 비공개 조치를 취한 후 방송을 계속 진행하는 경우, 방송자로부터 허가를 받지 못한 제3자의 시청·녹화는 감청에 해당할 수 있다.", true, "▸ 방송자가 비밀번호를 설정하는 등으로 비공개 조치를 취한 후 방송을 진행하는 경우, 허가를 받지 못한 제3자는 인터넷개인방송의 당사자가 아닌 제3자에 해당하고, 이러한 제3자가 비정상적인 방법으로 시청·녹화하는 것은 감청에 해당할 수 있다. [2022도9877]", "압수수색검증"],
["451", "★ 「통신비밀보호법」상 감청은 전기통신이 이루어지고 있는 상황에서 실시간으로 그 전기통신의 내용을 지득·채록하는 경우와 통신의 송·수신을 직접적으로 방해하는 경우를 의미하는 것이지 이미 수신이 완료된 전기통신에 관하여 남아 있는 기록이나 내용을 열어보는 등의 행위는 포함하지 않는다.", true, "▸ 송·수신 중인 이메일은 감청의 대상이지만, 송·수신이 완료된 이메일은 압수·수색·검증의 대상이 된다. [2011도12407]", "압수수색검증"],
["452", "★ 검사 또는 사법경찰관은 수사 또는 형의 집행을 위하여 필요한 경우 전기통신사업자에게 통신사실확인자료의 열람이나 제출을 요청할 수 있는데, 대상범죄의 제한은 없으나 서면으로 관할 지방법원 또는 지원의 허가를 받아야 한다.", true, "▸ 검사 또는 사법경찰관은 수사 또는 형의 집행을 위하여 필요한 경우 전기통신사업자에게 통신사실 확인자료의 열람이나 제출을 요청할 수 있다(통신비밀보호법 제13조 제1항). 이 경우 서면으로 관할 지방법원 또는 지원의 허가를 받아야 한다.", "압수수색검증"],
["453", "★ 「통신비밀보호법」상 통신사실확인자료 제공요청의 목적이 된 범죄와 관련된 범죄란 통신사실확인자료 제공요청허가서에 기재된 혐의사실과 객관적 관련성이 있고 자료제공 요청대상자와 피의자 사이에 인적 관련성이 있는 범죄를 의미한다.", true, "▸ 통신사실확인자료 제공요청의 목적이 된 범죄와 관련된 범죄는 허가서에 기재된 혐의사실과 객관적 관련성 + 자료제공 요청대상자와 피의자 사이의 인적 관련성이 있는 범죄를 의미한다. [2016도13489]", "압수수색검증"],
["454", "★ 통신사실확인자료 제공요청과 관련한 객관적 관련성은 통신사실 확인자료제공요청 허가서에 기재된 혐의사실 자체 또는 그와 기본적 사실관계가 동일한 범행과 직접 관련되어 있어야 하므로, 범행 동기와 경위, 범행 수단 및 방법, 범행 시간과 장소 등을 증명하기 위한 간접증거나 정황증거 등으로 사용될 수 있는 경우에는 인정될 수 없다.", false, "▸ 통신사실확인자료 관련 객관적 관련성은 혐의사실 자체 또는 기본적 사실관계가 동일한 범행과 직접 관련된 경우는 물론, 범행 동기와 경위 등을 증명하기 위한 간접증거나 정황증거로 사용될 수 있는 경우에도 인정될 수 있다. [2016도13489]", "압수수색검증"],
["455", "★ 인터넷 통신망을 통하여 흐르는 전기신호 형태의 패킷(packet)을 중간에 확보하여 그 내용을 지득하는 이른바 '패킷 감청'은 패킷 감청의 특성상 수사목적과 무관한 통신내용이나 제3자의 통신내용도 감청될 우려가 높으므로「통신비밀보호법」제5조 제1항에서 정한 요건을 갖추는 경우에도 허용될 수 없다.", false, "▸ '패킷 감청'도 같은 법 제5조 제1항에서 정한 요건을 갖추는 경우 다른 특별한 사정이 없는 한 허용된다. [2012도7455]", "압수수색검증"],
["456", "★ 수사기관은 통신기관 등에 통신제한조치허가의 사본을 교부하고 집행을 위탁할 수 있지만, 위탁을 받은 통신기관 등이 허가서에 기재된 집행방법 등을 준수하지 아니한 채 취득한 전기통신의 내용 등은 유죄 인정의 증거로 할 수 없다.", true, "▸ 수사기관으로부터 통신제한조치의 집행을 위탁받은 통신기관 등이 허가서에 기재된 사항을 준수하지 아니한 채 통신제한조치를 집행하였다면, 적법한 절차를 따르지 아니하고 수집한 증거에 해당하므로 증거능력이 없다. [2016도8137]", "압수수색검증"],
["457", "★ 수출입물품 통관검사절차에서 이루어지는 물품의 개봉, 시료채취, 성분분석 등의 검사는 수출입물품에 대한 적정한 통관 등을 목적으로 하는 것으로서 사후에 영장을 받아야만 한다.", false, "▸ 수출입물품 통관검사절차에서 이루어지는 물품의 개봉, 시료채취, 성분분석 등의 검사는 수사기관의 강제처분이라고 할 수 없으므로, 세관공무원은 압수·수색영장 없이 이러한 검사를 진행할 수 있다. [2014도8719]", "압수수색검증"],
["458", "★ 수출입물품 통관검사절차에서는 압수수색영장 없이 우편물의 개봉이나 시료채취를 할 수 있지만, 마약류 불법거래 방지를 위한 조치로서 수사기관의 요청으로 특정한 수출입물품을 개봉하여 그 내용물의 점유를 취득하면서 사전이나 사후에 영장을 발부받지 않았다면 이는 위법한 증거수집에 해당한다.", true, "▸ 마약류 불법거래 방지에 관한 특례법 제4조 제1항에 따른 조치로 특정 수출입물품을 개봉하여 내용물의 점유를 취득한 행위는 범죄수사인 압수 또는 수색에 해당하여 사전 또는 사후에 영장을 받아야 한다. [2014도8719]", "압수수색검증"],
["459", "★ 사법경찰관이 甲이 음주운전을 하였다는 상당한 혐의가 있어 甲의 혈중알코올농도를 측정하려고 하는데 甲이 특별한 이유 없이 호흡측정기에 의한 측정에 불응하는 경우 사법경찰관은 혈액채취에 의한 측정방법이 있음을 고지하고 그 선택 여부를 물어야 할 의무가 있다.", false, "▸ 특별한 이유 없이 호흡측정에 불응하는 경우에 곧바로 혈액채취에 의한 측정방법을 고지하고 선택 여부를 물어야 할 의무가 있다고 할 수는 없다. [2014도16051]", "압수수색검증"],
["460", "★ 사법경찰관이 측정 당시의 구체적 상황에 비추어 호흡측정기의 오작동 등으로 인하여 호흡측정 결과에 오류가 있다고 인정할 만한 객관적이고 합리적인 사정이 있는 경우에는 사법경찰관이 운전자에게 혈액채취에 의한 혈중알코올농도 측정을 요구하면 운전자는 이에 응할 의무가 있다.", true, "▸ 호흡측정 당시 구체적 상황에 비추어 오작동 등으로 결과에 오류가 있다고 인정할 만한 객관적이고 합리적인 사정이 있는 경우에는 운전자는 혈액채취에 의한 측정 요구에 응할 의무가 있다. [2014도16051]", "압수수색검증"],
["461", "★ 「형사소송법」제184조에 의한 증거보전은 피의자 또는 피고인이 형사입건이 되기 전에는 청구할 수 없다.", true, "▸ 제184조에 의한 증거보전은 피의자 또는 피고인이 형사입건이 된 이후에만 청구할 수 있다. [79도792]", "수사종결공소"],
["462", "증거보전은 제1회 공판기일 전에 한하여 인정되므로 재심청구사건에서는 증거보전을 청구할 수 없다.", true, "▸ 증거보전은 제1회 공판기일 전에 한하여 인정되므로 재심청구사건에서는 증거보전을 청구할 수 없다. [84모15]", "수사종결공소"],
["463", "증거보전 및 증인신문의 청구를 받은 판사는 증인신문에 관하여 법원 또는 재판장과 동일한 권한이 있다.", true, "▸ 제184조 제2항(증거보전의 청구) 및 제221조의2 제4항(증인신문의 청구)에 따라 청구를 받은 판사는 증인신문에 관하여 법원 또는 재판장과 동일한 권한이 있다.", "수사종결공소"],
["464", "★ 공무원인 甲과 민간사업자인 乙이 뇌물을 주고받았다는 범죄사실로 수사를 받고 있는 경우, 甲과 乙은 필요적 공범관계에 있기 때문에 수사단계에서 甲에 대한 증거를 미리 보전하기 위하여 필요한 경우라도 검사는「형사소송법」제184조에 따라 판사에게 乙을 증인으로 신문할 것을 청구할 수 없다.", false, "▸ 공동피고인과 피고인이 필요적 공범관계에 있다고 하더라도 검사는 수사단계에서 피고인에 대한 증거를 미리 보전하기 위하여 필요한 경우에는 판사에게 공동피고인을 증인으로 신문할 것을 청구할 수 있다. [86도1646]", "수사종결공소"],
["465", "★ 「형사소송법」제184조에 의한 증거보전의 방법으로 피의자를 신문한 내용 가운데 다른 공범에 관한 부분의 진술이 있다 하더라도 그 공범이 그 신문 당시 형사입건이 되어 있지 않았다면 그 공범에 관한 증거보전의 효력도 인정할 수 없다.", true, "▸ 제184조에 의한 증거보전의 방법으로 피의자를 신문한 내용 중 공범에 관한 부분의 진술이 있더라도, 그 공범이 신문 당시 형사입건이 되지 않았다면 그 공범에 관한 증거보전의 효력도 인정할 수 없다. [79도792]", "수사종결공소"],
["466", "★ 검사가 甲을 수뢰죄로 기소하였는데, 甲에 대한 무혐의를 입증해 줄 수 있는 乙가 외국지사로 발령이 나 출국하려고 하는 경우 검사는「형사소송법」제184조에 의하여 판사에게 증거보전을 청구할 수 있다. 이 경우 증거보전청구를 기각하는 결정에 대하여는 즉시항고로써 불복할 수 있다.", false, "▸ 검사는 제184조에 따라 증거보전을 청구할 수 있다. 그러나 증거보전청구를 기각하는 결정에 대하여는 즉시항고로써 불복할 수 없고, 3일 이내에 항고(보통항고)할 수 있다(제184조 제4항). [84모15]", "수사종결공소"],
["467", "★ 증거보전절차에서 이루어진 甲에 대한 증인신문조서 중 당시 피의자였던 피고인 乙이 당사자로 참여하여 자신의 범행사실을 시인하는 전제하에 甲에게 반대신문을 하는 과정에서 乙이 행한 진술기재 부분은, 형사소송법 제184조에 의한 증인신문조서에 해당하므로 형사소송법 제311조에 의하여 증거능력이 인정된다.", false, "▸ 증인신문조서에 피의자였던 피고인이 증인에게 반대신문한 내용이 기재되어 있을 뿐이라도, 반대신문과정에서 피의자가 한 진술에 관한 한 제184조에 의한 증인신문조서가 아니므로, 피의자의 진술기재 부분에 대하여는 제311조에 의한 증거능력을 인정할 수 없다. [84도508]", "수사종결공소"],
["468", "증거보전절차에서 행해지는 증인신문의 경우에도 지방법원판사는 신문의 일시와 장소를 피의자·피고인 및 변호인에게 미리 통지하여야 한다.", true, "▸ 제163조 제1항, 제2항에 따라 증거보전절차에서의 증인신문에도 피의자·피고인 및 변호인에게 미리 통지하여야 한다.", "수사종결공소"],
["469", "★ 판사가「형사소송법」제184조 증거보전절차에 의한 증인신문을 하는 경우에는 검사, 피의자 또는 변호인에게 증인신문의 시일과 장소를 미리 통지하여 참여할 수 있는 기회를 주어야 하나, 참여의 기회를 주지 않았다고 하더라도 피고인과 변호인이 증인신문조서를 증거로 할 수 있음에 동의하여 별다른 이의 없이 적법하게 증거조사를 거친 경우에는 위 증인신문조서는 증거능력이 인정된다.", true, "▸ 판사가 제184조에 의한 증거보전절차로 증인신문을 하면서 참여의 기회를 주지 아니한 경우라도 피고인과 변호인이 증인신문조서를 증거로 할 수 있음에 동의하여 별다른 이의없이 적법하게 증거조사를 거친 경우에는 위 증인신문조서는 증거능력이 부여된다. [86도1646]", "수사종결공소"],
["470", "★ 변호인이 제1심 공판기일에 증거보전절차에 의한 증인신문조서의 증거조사에 관하여 이의신청을 하였다면, 위 증인신문조서는 증거능력이 없고, 그 증인이 후에 법정에서 그 조서의 진정성립을 인정한다 하여 다시 그 증거능력을 취득한다고 볼 수도 없다.", true, "▸ 변호인이 증거조사에 관하여 이의신청을 하였으면 위 증인신문조서는 증거능력이 없고, 이후 법정에서 증인이 진정성립을 인정한다 하여 증거능력을 취득한다고 볼 수 없다. [91도2337]", "수사종결공소"],
["471", "검사, 피고인, 피의자 또는 변호인은 판사의 허가를 얻어 증거보전의 처분에 관한 서류와 증거물을 열람 또는 등사할 수 있다.", true, "▸ 제185조에 따라 검사, 피고인, 피의자 또는 변호인은 판사의 허가를 얻어 증거보전의 처분에 관한 서류와 증거물을 열람 또는 등사할 수 있다.", "수사종결공소"],
["472", "피의자, 피고인 또는 변호인은 증인신문(제221조의2)을 청구할 수 있다.", false, "▸ 검사, 피고인, 피의자 또는 변호인은 증거보전(제184조)을 청구할 수 있으나, 증인신문(제221조의2)은 '검사만' 청구할 수 있다.", "수사종결공소"],
["473", "형사소송법 제221조의2 제2항에 의한 증인신문청구를 하려면 피의사실이 존재하여야 하고, 피의사실은 수사기관이 어떤 자에 대하여 내심으로 혐의를 품고 있는 정도의 상태만으로도 존재한다고 할 수 없고 수사를 개시하는 범죄의 인지 등 수사의 대상으로 삼고 있음을 외부적으로 표현하여야만 비로소 그 존재를 인정할 수 있다.", true, "▸ [AI해설] 피의사실은 수사기관이 내심으로 혐의를 품는 것만으로 부족하고, 고소·고발·자수를 받거나 범죄의 인지 등 수사의 대상으로 삼고 있음을 외부적으로 표현하여야 비로소 존재를 인정할 수 있다. [89도648]", "수사종결공소"],
["474", "검사 또는 사법경찰관에게 임의의 진술을 한 참고인이 공판기일에 전의 진술과 다른 진술을 할 염려가 있고 그의 진술이 범죄의 증명에 없어서는 아니 될 것으로 인정될 경우에도 검사는 제1회 공판기일 전에 한하여 제221조의2에 의한 증인신문의 청구의 절차에 따라 판사에게 그에 대한 증인신문을 청구할 수 있다.", false, "▸ 참고인이 수사단계에서 진술을 하였다면, 제221조의2 제1항의 '출석 또는 진술을 거부한 경우'에 해당하지 않으므로 증인신문의 청구는 할 수 없다. 다만, 이 경우에도 증거보전의 요건을 충족한다면 증거보전에 의한 증인신문은 가능하다.", "수사종결공소"],
["475", "★ 공무원인 甲과 민간사업자인 乙은 뇌물을 주고받았다는 범죄사실로 수사를 받고 있고, 乙은 범죄의 수사에 없어서는 아니될 사실을 안다고 명백히 인정되는데도 검사의 출석요구를 거부하고 있는 경우, 검사는 공소제기 전이라도「형사소송법」제221조의2에 의하여 판사에게 乙에 대한 증인신문을 청구할 수 있으며, 청구를 기각한 결정에 대하여는 즉시항고를 할 수 있다.", false, "▸ 검사는 공소제기 전이라도 제221조의2에 의하여 판사에게 증인신문을 청구할 수 있다. 그러나 증거보전 청구와 달리 증인신문 청구를 기각하는 결정에 대하여는 항고할 수 없다.", "수사종결공소"],
["476", "판사가 제1회 공판기일 전의 증인신문을 실시할 경우에는 피고인, 피의자 또는 변호인에게 신문기일의 장소 및 증인신문에 참여할 수 있다는 취지를 통지하여야 한다.", true, "▸ 제221조의2 제5항, 형사소송규칙 제112조에 따라 판사는 증인신문기일과 장소, 참여할 수 있다는 취지를 피고인·피의자·변호인에게 통지하여야 한다.", "수사종결공소"],
["477", "★ 공무원인 甲의 뇌물수수혐의와 관련하여 검사가「형사소송법」제221조의2에 의하여 판사에게 참고인 乙에 대한 증인신문을 청구한 경우, 이에 따라 판사가 증인신문기일을 정한 때에도 특별히 수사에 지장이 있다고 인정되는 경우, 판사는 甲 또는 변호인에게 그 기일과 장소 및 증인신문에 참여할 수 있다는 취지를 통지하지 않고 증인신문을 할 수 있다.", false, "▸ 제221조의2 제5항, 형사소송규칙 제112조에 예외 규정이 없으므로, 수사에 지장이 있다는 이유로 피의자 등에게 기일과 장소를 통지하지 않고 증인신문을 할 수 없다.", "수사종결공소"],
["478", "형사소송법 제221조의2에 따라 판사가 검사의 청구에 의하여 참고인에 대한 증인신문을 한 때에는 지체 없이 이에 관한 서류를 검사에게 송부하여야 한다.", true, "▸ 제221조의2 제6항에 따라 판사가 검사의 청구에 의하여 참고인에 대한 증인신문을 한 때에는 지체 없이 이에 관한 서류를 검사에게 송부하여야 한다.", "수사종결공소"],
["479", "형사소송법 제221조의2에 따라 피고인, 피의자 또는 변호인은 판사의 허가를 얻어 참고인에 대한 증인신문에 관한 서류와 증거물을 열람 또는 등사할 수 있다.", false, "▸ 증거보전은 서류와 증거물을 열람 또는 등사할 수 있다는 규정이 있으나(제185조), 증인신문의 청구의 경우에는 이에 대한 규정이 없다.", "수사종결공소"],
["480", "피의자, 사건관계인 또는 그 변호인은 검사 또는 사법경찰관이 수사 중인 사건에 관한 본인의 진술이 기재된 부분 및 본인이 제출한 서류의 전부 또는 일부에 대한 열람·복사를 신청할 수 있다.", true, "▸ 검사와 사법경찰관의 상호협력과 일반적 수사준칙에 관한 규정 제69조 제1항에 따라 피의자, 사건관계인 또는 그 변호인은 본인 진술 부분 및 본인 제출 서류에 대한 열람·복사를 신청할 수 있다.", "수사종결공소"],
["481", "검사는 송치사건의 공소제기 여부 결정 또는 공소의 유지에 관하여 필요한 경우에 사법경찰관에게 보완수사를 요구할 수 있다.", true, "▸ 검사는 송치사건의 공소제기 여부 결정 또는 공소의 유지에 관하여 필요한 경우 또는 사법경찰관이 신청한 영장의 청구 여부 결정에 관하여 필요한 경우에 사법경찰관에게 보완수사를 요구할 수 있다(제197조의2 제1항).", "수사종결공소"],
["482", "사법경찰관이 사건에 대하여 불송치 결정을 한 경우, 검사는 사법경찰관이 사건을 송치하지 아니한 것이 위법 또는 부당한 때에는 그 이유를 문서로 명시하여 사법경찰관에게 재수사를 요청할 수 있고, 이 경우 사법경찰관은 사건을 재수사하여야 한다.", true, "▸ 검사는 사법경찰관이 사건을 송치하지 아니한 것이 위법 또는 부당한 때에는 그 이유를 문서로 명시하여 사법경찰관에게 재수사를 요청할 수 있다(제245조의8 제1항). 사법경찰관은 사건을 재수사하여야 한다(동조 제2항).", "수사종결공소"],
["483", "사법경찰관의 불송치결정의 통지를 받은 고소인·고발인·피해자 또는 그 법정대리인은 해당 사법경찰관의 소속 관서를 지휘하는 지방검찰청 검사장에게 이의를 신청할 수 있고, 사법경찰관은 불송치결정에 대하여 고소인 등의 이의신청이 있는 경우에는 검사에게 사건을 송치할 수 있다.", false, "▸ ① 불송치결정의 통지를 받은 사람(고발인을 제외한다)은 해당 사법경찰관의 소속 관서의 장에게 이의를 신청할 수 있다(제245조의7 제1항). ② 사법경찰관은 신청이 있는 때에는 지체 없이 검사에게 사건을 '송치하여야 한다'(임의 아닌 의무). ③ 또한 고발인은 이의신청권이 없다.", "수사종결공소"],
["484", "고소인이 사법경찰관으로부터 고소사건에 대한 불송치 통지를 받을 당시 외국에 거주하고 있는 경우에는 고소인의 법정대리인은 불송치 결정에 대하여 이의신청을 할 수 있다.", false, "▸ 이의신청권자는 불송치결정의 통지를 받은 고소인·피해자 및 그 법정대리인 등이다. 법정대리인이 독자적으로 이의신청 권리를 행사할 수 있는지 여부는 고소인의 의사와 무관하지 않으므로, 고소인이 외국에 있다는 이유만으로 법정대리인이 당연히 이의신청을 할 수 있다고 볼 수 없다.", "수사종결공소"],
["485", "검사는 피의사실이 범죄구성요건에는 해당하지만 위법성조각사유나 책임조각사유 등 법률상 범죄의 성립을 조각하는 사유가 있는 경우에는 혐의없음 처분을 한다.", false, "▸ '죄가 안됨' 불기소처분을 한다(검찰사건사무규칙 제115조 제3항 제3호). 혐의없음 처분은 범죄사실이 인정되지 않는 경우에 해당한다.", "수사종결공소"],
["486", "검사는 피의사실이 인정되는 경우에 반드시 공소를 제기하여야 하는 것이 아니라 피의자의 연령, 피해자에 대한 관계, 범행의 동기 및 수단과 결과 등을 참작하여 소추를 필요로 하지 아니하는 경우에는 기소유예 처분을 할 수 있다.", true, "▸ 검사는 형법 제51조의 사항을 참작하여 공소를 제기하지 아니할 수 있다(제247조).", "수사종결공소"],
["487", "재기수사의 명령이 있는 사건에 관하여 지방검찰청 검사가 다시 불기소처분을 하고자 하는 경우에는 미리 그 명령청의 장의 승인을 얻도록한 검찰사건사무규칙의 규정은 검찰청 내부의 사무처리지침에 불과한 것일 뿐 법규적 효력을 가진 것이 아니다.", true, "▸ 재기수사 명령 후 다시 불기소처분을 위한 승인 규정은 검찰청 내부의 사무처리지침에 불과하고 법규적 효력이 없다. [91헌마42]", "수사종결공소"],
["488", "검사의 불기소처분에 대하여 고발인이 재정신청할 수 있는 범죄에는 제한이 있다.", true, "▸ 「형법」제123조부터 제126조까지의 죄에 대하여는 고발을 한 자만 재정신청을 할 수 있다(제260조 제1항). 고발인은 이 범죄 외에 다른 범죄에 대해서는 재정신청 불가.", "수사종결공소"],
["489", "검사의 불기소처분에 대하여 고소권자의 경우 재정신청을 할 수 있는 대상 범죄에 제한이 없으며, 기소유예 처분에 대해서도 재정신청을 할 수 있다.", true, "▸ 고소권자의 경우 대상 범죄의 제한이 없다(제260조). 기소유예 처분은 공소를 제기하지 아니하는 처분이므로 재정신청의 대상이 된다. [86모58]", "수사종결공소"],
["490", "★ 공소취소에 대해서는 재정신청을 할 수 없다.", true, "▸ 검사로부터 '공소를 제기하지 아니한다는 통지를 받은 때'에 재정신청을 할 수 있다(제260조 제1항). 공소취소는 불기소처분이 아니므로 재정신청을 할 수 없다.", "수사종결공소"],
["491", "★ 재정신청 제기기간이 경과한 후에 재정신청보충서를 제출하면서 원래의 재정신청 대상으로 되어 있지 않은 고발사실을 재정신청의 대상으로 추가한 경우, 추가한 부분에 대한 재정신청은 법률상 방식에 어긋난 것으로서 부적법하다.", true, "▸ 재정신청 제기기간 경과 후 제출한 보충서로 원래 대상에 없던 고발사실을 추가하는 것은 법률상 방식에 어긋나 부적법하다. [97모30]", "수사종결공소"],
["492", "재정신청을 할 수 있는 신청권자는 검찰항고를 기각하는 처분에 대하여 재정신청을 할 수 있으며, 검찰총장에게 재항고를 할 수도 있다.", false, "▸ 재정신청을 할 수 있는 자는 검찰총장에게 재항고를 할 수 없다(검찰청법 제10조).", "수사종결공소"],
["493", "고소권자인 고소인이 검사의 불기소처분에 불복하여 재정신청을 하려면「검찰청법」제10조에 따른 항고를 반드시 거친 후, 그 검사 소속의 지방검찰청 소재지를 관할하는 고등법원에 재정신청서를 제출하여야 한다.", false, "▸ ① 재정신청을 하려면 원칙적으로 검찰청법 제10조에 따른 항고를 거쳐야 하나, 항고를 거치지 않아도 되는 예외가 있다. ② 재정신청서는 고등법원이 아니라 '지방검찰청검사장 또는 지청장'에게 제출하여야 한다(제260조 제3항).", "수사종결공소"],
["494", "★ 교도소에 있는 고소인이 재정신청 제기기간 내에 재정신청서를 교도소장 또는 그 직무를 대리하는 사람에게 제출하였다면, 비록 그 재정신청서가 위의 기간 안에 불기소처분을 한 검사가 소속한 지방검찰청의 검사장 또는 지청장에게 도달하지 아니하였다 하더라도 적법하게 제출된 것으로 본다.", false, "▸ 재정신청 기각결정에 대한 재항고 등에 대한 법정기간의 준수 여부는 도달주의 원칙에 따라 법원에 도달한 시점을 기준으로 판단하여야 하고, 재소자 피고인 특칙은 준용되지 아니한다. [2013모2347]", "수사종결공소"],
["495", "★ 재정신청은 법원의 결정이 있을 때까지 취소할 수 있으며 그 취소의 효력은 다른 공동신청권자에게 미치지 않는다.", true, "▸ 제264조 제2항에 따라 재정신청은 제262조 제2항의 결정이 있을 때까지 취소할 수 있다. 제264조 제3항에 따라 재정신청의 취소는 다른 공동신청권자에게 효력을 미치지 아니한다.", "수사종결공소"],
["496", "★ 공동신청권자 중 1인의 재정신청은 그 전원을 위하여 효력을 발생하고, 그 취소의 경우에도 마찬가지이다.", false, "▸ 공동신청권자 중 1인의 재정신청은 그 전원을 위하여 효력을 발생하나(제264조 제1항), 재정신청의 취소는 다른 공동신청권자에게 효력을 미치지 아니한다(제264조 제3항).", "수사종결공소"],
["497", "재정신청을 취소한 자는 다시 재정신청을 할 수 없다.", true, "▸ 제264조 제2항에 따라 재정신청을 취소한 자는 다시 재정신청을 할 수 없다.", "수사종결공소"],
["498", "재정신청서를 송부받은 법원은 송부받은 날부터 10일 이내에 피의자 및 재정신청인에게 그 사유를 통지하여야 한다.", true, "▸ 제262조 제1항에 따라 재정신청서를 송부받은 법원은 송부받은 날부터 10일 이내에 피의자 및 재정신청인에게 그 사유를 통지하여야 한다.", "수사종결공소"],
["499", "재정신청사건의 심리는 특별한 사정이 없는 한 공개하지 아니한다.", true, "▸ 제262조 제3항에 따라 재정신청사건의 심리는 특별한 사정이 없는 한 공개하지 아니한다.", "수사종결공소"],
["500", "법원은 재정신청사건을 심리함에 있어서 구두변론에 의하지 않고 절차를 진행할 수 있으나, 심리 중에는 증거조사가 허용되지 않는다.", false, "▸ 재정신청 사건은 '항고의 절차에 준하여' 결정하므로, 구두변론을 거치지 아니할 수 있다. 법원은 필요한 때에는 증거를 조사할 수 있다(제262조 제2항, 제37조 제2항, 제3항).", "수사종결공소"],
["501", "재정신청서에 재정신청을 이유 있게 하는 사유가 기재되어 있지 않은 경우에는 법원은 재정신청을 기각하여야 한다.", true, "▸ 제262조 제2항 제1호에 따라 재정신청서에 재정신청을 이유 있게 하는 사유가 기재되어 있지 않은 경우에는 법원은 재정신청을 기각하여야 한다.", "수사종결공소"],
["502", "법원은 재정신청사건을 심리하는 중 재정신청을 한 고소인 또는 고발인 등의 신청이 있으면 재정신청 사건의 증거조사과정에서 작성된 서류가 아니라고 하더라도 관련 서류의 전부 또는 일부를 열람 또는 등사하게 할 수 있다.", false, "▸ 재정신청사건의 심리 중에는 관련 서류 및 증거물을 열람 또는 등사할 수 없다. 다만, 법원은 제262조 제2항 후단의 증거조사과정에서 작성된 서류의 열람 또는 등사를 허가할 수 있다(제262조의2).", "수사종결공소"],
["503", "검사의 공소를 제기하지 아니하는 처분의 당부에 관한 재정신청을 판단하는 법원은 검사의 무혐의 불기소처분이 위법하더라도 기소유예의 불기소처분이 정당하다고 인정되는 경우에는 재정신청을 기각할 수 있다.", true, "▸ 재정신청 법원은 무혐의 처분이 위법하더라도 기소유예 처분이 정당하다고 인정되는 경우에는 재정신청을 기각할 수 있다. [97모30]", "수사종결공소"],
["504", "★ 재정신청에 관한 법원의 기각결정에 대해서는 즉시항고로 불복할 수 있으나, 공소를 제기하는 결정에 대하여는 불복할 수 없다.", true, "▸ ① 재정신청 기각결정에 대하여는 제415조에 따른 즉시항고를 할 수 있고, ② 공소제기 결정에 대하여는 불복할 수 없다(제262조 제4항).", "수사종결공소"],
["505", "★ 재정신청이 있으면 재정결정이 확정될 때까지 공소시효의 진행이 정지된다.", true, "▸ 제262조의4에 따라 재정신청이 있으면 재정결정이 확정될 때까지 공소시효의 진행이 정지된다.", "수사종결공소"],
["506", "★ 재정신청에 대하여 법원의 공소제기 결정이 있게 되면 공소제기가 의제되므로 이는 불고불리의 원칙의 예외라고 할 수 있다.", false, "▸ 공소제기 결정에 따른 재정결정서를 송부받은 관할 지방검찰청 검사장 또는 지청장은 지체 없이 담당 검사를 지정하고 지정받은 검사는 공소를 제기하여야 한다(제262조 제6항). 공소제기 의제가 아니라 검사에게 공소제기를 강제하는 것이므로 불고불리원칙의 예외라고 할 수 없다.", "수사종결공소"],
["507", "★ 법원이 재정신청 대상 사건이 아님에도 이를 간과한 채 공소제기결정을 하였더라도, 그에 따른 공소가 제기되어 본안 사건의 절차가 개시된 후에는 다른 특별한 사정이 없는 한 본안 사건에서 위와 같은 잘못을 다툴 수는 없다.", true, "▸ [AI해설] 법원이 재정신청 대상이 아닌 사건에 공소제기결정을 하여 공소가 제기된 경우, 본안사건 절차가 개시된 후에는 다른 특별한 사정이 없는 한 본안사건에서 이를 다툴 수 없다. [2017도13465]", "수사종결공소"],
["508", "★ 법원이 재정신청서에 재정신청을 이유 있게 하는 사유가 기재되어 있지 않음에도 이를 간과한 채 공소제기결정을 하여 공소가 제기된 경우, 본안사건을 심판하는 법원은 이를 이유로 공소기각의 판결을 하여야 한다.", false, "▸ 법원이 재정신청을 이유 있게 하는 사유가 기재되어 있지 않음에도 간과한 채 공소제기결정을 하여 공소가 제기되어 본안사건의 절차가 개시된 후에는, 다른 특별한 사정이 없는 한 그 본안사건에서 위와 같은 잘못을 다툴 수 없다. [2009도224]", "수사종결공소"],
["509", "★ 법원의 공소제기결정에 의해 공소를 제기한 검사는 공소장변경을 할 수 있으나 공소를 취소할 수 없다.", true, "▸ 법원의 공소제기결정에 의해 공소를 제기한 검사는 공소장변경을 할 수 있으나, 공소를 취소할 수는 없다(제264조의2). [88도2428]", "수사종결공소"],
["510", "★ 재정신청 기각결정이 확정된 사건에 대하여 소추가 금지되는 범위는, 재정신청의 대상이 된 사건뿐만 아니라 공판절차에서와 마찬가지로 기본적인 사실관계가 동일하여 공소사실의 동일성이 인정되는 경우도 포함한다.", true, "▸ 재정신청 기각결정이 확정된 사건에서 소추금지의 범위는 기각결정 대상 사건뿐만 아니라 공소사실의 동일성이 인정되는 범위까지 미친다. [2012도14755]", "수사종결공소"],
["511", "★ 「형사소송법」제262조 제4항 후문의 '다른 중요한 증거'란 재정신청 기각결정의 정당성에 의문이 제기되거나 범죄피해자의 권리구제를 위하여 형사재판절차를 진행할 필요가 있는 정도의 증거가 있는 경우를 말한다.", false, "▸ '다른 중요한 증거'란 재정신청 기각결정 당시에 제출된 증거에 새로 발견된 증거가 추가되어 유죄의 확신을 가지게 될 정도의 증거가 있는 경우를 말한다. 기각결정의 정당성에 의문이 제기될 정도의 증거는 부족하다. [2014도17182]", "수사종결공소"],
