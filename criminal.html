["247", "존속을 살해할 목적으로 현주건조물에 방화하여 사망에 이르게 한 경우에는 법조경합에 의해 존속살인죄는 현주건조물방화치사죄에 흡수된다.", false, "▸ 존속살인죄와 현주건조물방화치사죄는 상상적 경합관계에 있으므로, 법정형이 중한 존속살인죄로 의율함이 타당하다(96도485). [본 판례 이후 존속살해죄 '주형'의 법정형이 현주건조물방화치사죄와 동일하게 개정되었으나 존속살해죄는 자격정지를 병과할 수 있으므로(제256조), 여전히 상상적 경합관계로 보는 것이 타당하다.]\n\n[III. 부진정결과적 가중범 - 인정이유 참고(현주건조물방화치사죄)] A의 집에 방화하여 '과실'로 A가 사망한 경우(A가 없는 줄 알고 방화했는데 A가 있었던 경우): 진정·부진정 어느 해석이든 결론은 현주건조물방화치사죄(제164조 제2항, 사형·무기 또는 7년 이상의 징역)로 동일하다. A의 집에 방화하여 '고의'로 A를 살해한 경우(A가 있는 것을 알고 죽이기 위해 방화한 경우): 진정결과적가중범으로만 해석하면 현주건조물방화죄(제164조 제1항)와 살인죄(제250조 제1항)의 상상적 경합이 되어 더 무거운 살인죄의 형(사형·무기 또는 5년 이상의 징역)으로 처벌되는 데 그치는 반면, 부진정결과적가중범으로 해석하면 현주건조물방화치사죄(사형·무기 또는 7년 이상의 징역)가 성립하여 더 무겁게 처벌된다. 즉 진정결과적가중범으로만 해석하면 고의로 살해한 경우가 과실로 사망하게 한 경우보다 형이 가벼워지는 불균형이 발생하므로, 부진정결과적가중범으로 해석하여 이러한 형의 불균형을 해소한다.\n\n[제4절 참고 - 결과적 가중범 조문 및 유형 정리] 형법 제15조(사실의 착오) ②: 결과 때문에 형이 무거워지는 죄의 경우에 그 결과의 발생을 예견할 수 없었을 때에는 무거운 죄로 벌하지 아니한다. [미수범 처벌규정 존재] 진정결과적가중범: 인질치사상죄, 강도치사상죄, 해상강도치사상죄, 성폭법위반(강간등치사상). 부진정결과적가중범: 현주건조물일수치사상죄. [미수범 처벌규정 부존재(외관상 존재)] 진정결과적가중범: 특수공무집행방해치사죄, 교통방해치사죄, 형법상 강간등치사상죄, 특가법위반(운전자폭행등)치사죄. 부진정결과적가중범: 현주건조물방화치사상죄(제164조 제2항), 특수공무집행방해치상죄(제144조 제2항), 교통방해치상죄(제188조), (존속)중상해죄(제258조), 중유기죄(제271조 제3항·제4항), 중손괴죄(제368조 제2항), 중권리행사방해죄(제336조), 특가법위반(운전자폭행등)치상죄(특가법 제5조의10 제2항).", "구성요건론"],
["248", "부작위범의 경우에도 작위범의 경우와 마찬가지로 위법성조각사유나 책임조각사유가 존재하는 때에는 가벌성이 부정된다.[모25]", true, "▸ 부작위범의 경우에도 작위범의 경우와 마찬가지로 위법성조각사유나 책임조각사유가 존재하는 때에는 가벌성이 부정된다.\n\n[제5절 참고 - 부작위범 조문] 형법 제18조(부작위범): 위험의 발생을 방지할 의무가 있거나 자기의 행위로 인하여 위험발생의 원인을 야기한 자가 그 위험발생을 방지하지 아니한 때에는 그 발생된 결과에 의하여 처벌한다.", "구성요건론"],
["249", "부작위범은 일반적 작위가능성과 개별적 행위가능성이 존재해야 성립한다.", true, "▸ 일반적 행위가능성과 개별적 행위가능성은 모든 부작위범의 공통 요건이다. 진정부작위범과 부진정부작위범 모두 이 요건을 갖추어야 한다.\n\n[제5절 참고 - 부작위범 조문] 형법 제18조(부작위범): 위험의 발생을 방지할 의무가 있거나 자기의 행위로 인하여 위험발생의 원인을 야기한 자가 그 위험발생을 방지하지 아니한 때에는 그 발생된 결과에 의하여 처벌한다.", "구성요건론"],
["250", "진정부작위범과 부진정부작위범 모두 작위의무가 법적으로 인정되더라도 작위의무를 이행하는 것이 사실상 불가능한 상황이었다면, 부작위범이 성립할 수 없다.", true, "▸ 일반적 행위가능성과 개별적 행위가능성은 모든 부작위범의 공통 요건이다. 진정부작위범과 부진정부작위범 모두 이 요건을 갖추어야 한다.\n\n[제5절 참고 - 부작위범 조문] 형법 제18조(부작위범): 위험의 발생을 방지할 의무가 있거나 자기의 행위로 인하여 위험발생의 원인을 야기한 자가 그 위험발생을 방지하지 아니한 때에는 그 발생된 결과에 의하여 처벌한다.", "구성요건론"],
["251", "특정한 행위를 하지 아니하는 부작위가 형법적으로 부작위로서의 의미를 가지기 위해서는, 보호법익의 주체에게 해당 구성요건적 결과발생의 위험이 있는 상황에서 행위자가 구성요건의 실현을 회피하기 위하여 요구되는 행위를 현실적·물리적으로 행할 수 있었음에도 하지 아니하였다고 평가될 수 있어야 한다.", true, "▸ [AI해설] 특정한 행위를 하지 아니하는 부작위가 형법적으로 부작위로서의 의미를 가지려면, 보호법익의 주체에게 구성요건적 결과발생의 위험이 있는 상황에서 행위자가 구성요건의 실현을 회피하기 위해 요구되는 행위를 현실적·물리적으로 행할 수 있었음에도 하지 아니하였다고 평가될 수 있어야 한다는 것이 판례의 태도이다(2015도6809).\n\n[제5절 참고 - 부작위범 조문] 형법 제18조(부작위범): 위험의 발생을 방지할 의무가 있거나 자기의 행위로 인하여 위험발생의 원인을 야기한 자가 그 위험발생을 방지하지 아니한 때에는 그 발생된 결과에 의하여 처벌한다.", "구성요건론"],
["252", "부작위에 의한 현주건조물방화치사죄가 성립하기 위하여는, 부작위자에게 법률상의 소화의무가 인정되는 외에 소화의 가능성 및 용이성이 있어야 한다.", true, "▸ 이 사건 화재가 피고인의 중과실로 발생하였다 하더라도, 부작위에 의한 현주건조물방화치사 및 현주건조물방화치상죄가 성립하기 위하여는, 피고인에게 법률상의 소화의무가 인정되는 외에 소화의 가능성 및 용이성이 있었음에도 피고인이 그 소화의무에 위배하여 이미 발생한 화력을 방치함으로써 소훼의 결과를 발생시켜야 하는 것인데, 이 사건 화재가 피고인의 중대한 과실 있는 선행행위로 발생한 이상 피고인에게 이 사건 화재를 소화할 법률상 의무는 있다 할 것이나, 피고인이 이 사건 화재 발생 사실을 안 상태에서 모텔을 빠져 나오면서도 모텔 주인이나 다른 투숙객들에게 이를 알리지 아니하였다는 사정만으로는 피고인이 이 사건 화재를 용이하게 소화할 수 있었다고 보기 어렵고, 달리 이를 인정할 만한 증거가 없다(2009도12109).\n\n[제5절 참고 - 부작위범 조문] 형법 제18조(부작위범): 위험의 발생을 방지할 의무가 있거나 자기의 행위로 인하여 위험발생의 원인을 야기한 자가 그 위험발생을 방지하지 아니한 때에는 그 발생된 결과에 의하여 처벌한다.", "구성요건론"],
["253", "모텔 방에 투숙 중 담배를 피운 후 담뱃불을 제대로 끄지 않은 중대한 과실로 화재를 일으킨 투숙객에게도 화재를 소화할 의무가 있음에도 모텔 주인이나 다른 투숙객에게 아무 말 없이 도망쳐 나와 다른 투숙객이 사망했다면, 비록 소화하기는 쉽지 않았더라도 부작위에 의한 현주건조물방화치사죄가 성립한다.", false, "▸ 이 사건 화재가 피고인의 중과실로 발생하였다 하더라도, 부작위에 의한 현주건조물방화치사 및 현주건조물방화치상죄가 성립하기 위하여는, 피고인에게 법률상의 소화의무가 인정되는 외에 소화의 가능성 및 용이성이 있었음에도 피고인이 그 소화의무에 위배하여 이미 발생한 화력을 방치함으로써 소훼의 결과를 발생시켜야 하는 것인데, 이 사건 화재가 피고인의 중대한 과실 있는 선행행위로 발생한 이상 피고인에게 이 사건 화재를 소화할 법률상 의무는 있다 할 것이나, 피고인이 이 사건 화재 발생 사실을 안 상태에서 모텔을 빠져 나오면서도 모텔 주인이나 다른 투숙객들에게 이를 알리지 아니하였다는 사정만으로는 피고인이 이 사건 화재를 용이하게 소화할 수 있었다고 보기 어렵고, 달리 이를 인정할 만한 증거가 없다(2009도12109).\n\n[제5절 참고 - 부작위범 조문] 형법 제18조(부작위범): 위험의 발생을 방지할 의무가 있거나 자기의 행위로 인하여 위험발생의 원인을 야기한 자가 그 위험발생을 방지하지 아니한 때에는 그 발생된 결과에 의하여 처벌한다.", "구성요건론"],
["254", "행위자가 자신의 신체적 활동이나 물리적·화학적 작용을 통하여 적극적으로 타인의 법익상황을 악화시킴으로써 결국 타인의 법익을 침해하기에 이르렀더라도 작위에 의하여 악화된 법익상황을 다시 돌이키지 아니한 이상 부작위범이 성립하는 것이 원칙이다.", false, "▸ ① 행위자가 자신의 신체적 활동이나 물리적·화학적 작용을 통하여 적극적으로 타인의 법익상황을 악화시킴으로써 결국 그 타인의 법익을 침해하기에 이르렀다면, 이는 작위에 의한 범죄로 봄이 원칙이고, 작위에 의하여 악화된 법익상황을 다시 되돌이키지 아니한 점에 주목하여 이를 부작위범으로 볼 것은 아니다. ② 의사가 수술 후 치료를 계속하지 않으면 환자가 사망할 수 있음을 알면서도 보호자의 강력한 요청으로 치료를 중단하고 퇴원을 허용하여 보호자의 방치로 환자가 사망한 경우, 담당 전문의와 주치의에게 사망이라는 결과 발생에 대한 정범의 고의는 인정되나 환자의 사망이라는 결과나 그에 이르는 사태의 핵심적 경과를 계획적으로 조종하거나 저지·촉진하는 등으로 지배하고 있었다고 보기는 어려워 공동정범의 객관적 요건인 기능적 행위지배가 흠결되어 있으므로, '작위'에 의한 살인방조죄만 성립한다(2002도995).\n\n[제5절 참고 - 부작위범 조문] 형법 제18조(부작위범): 위험의 발생을 방지할 의무가 있거나 자기의 행위로 인하여 위험발생의 원인을 야기한 자가 그 위험발생을 방지하지 아니한 때에는 그 발생된 결과에 의하여 처벌한다.", "구성요건론"],
["255", "뇌수술을 받고 중환자실에 입원해 있던 환자 A의 처 乙은 치료비에 상당한 부담을 느낀 나머지 A의 치료를 중단시킬 의도로 퇴원을 요구하였고, 주치의 甲이 이런 의도를 알면서도 치료중단 및 퇴원을 허용하는 조치를 취하여 A가 사망에 이른 경우, 甲에게 환자의 사망이라는 결과 발생에 대한 정범의 고의는 인정되나 A의 사망에 이르는 사태의 핵심적 경과를 계획적으로 조종하거나 저지·촉진하는 등으로 지배하고 있었다고 보기는 어려우므로 공동정범의 객관적 요건인 기능적 행위지배가 흠결되어 甲은 살인죄의 공동정범의 죄책을 지지 않는다.", true, "▸ ① 행위자가 자신의 신체적 활동이나 물리적·화학적 작용을 통하여 적극적으로 타인의 법익상황을 악화시킴으로써 결국 그 타인의 법익을 침해하기에 이르렀다면, 이는 작위에 의한 범죄로 봄이 원칙이고, 작위에 의하여 악화된 법익상황을 다시 되돌이키지 아니한 점에 주목하여 이를 부작위범으로 볼 것은 아니다. ② 의사가 수술 후 치료를 계속하지 않으면 환자가 사망할 수 있음을 알면서도 보호자의 강력한 요청으로 치료를 중단하고 퇴원을 허용하여 보호자의 방치로 환자가 사망한 경우, 담당 전문의와 주치의에게 사망이라는 결과 발생에 대한 정범의 고의는 인정되나 환자의 사망이라는 결과나 그에 이르는 사태의 핵심적 경과를 계획적으로 조종하거나 저지·촉진하는 등으로 지배하고 있었다고 보기는 어려워 공동정범의 객관적 요건인 기능적 행위지배가 흠결되어 있으므로, '작위'에 의한 살인방조죄만 성립한다(2002도995).\n\n[제5절 참고 - 부작위범 조문] 형법 제18조(부작위범): 위험의 발생을 방지할 의무가 있거나 자기의 행위로 인하여 위험발생의 원인을 야기한 자가 그 위험발생을 방지하지 아니한 때에는 그 발생된 결과에 의하여 처벌한다.", "구성요건론"],
["256", "보호자의 간청에 따라 담당 의사가 치료를 요하는 환자에 대한 치료를 중단하고 퇴원을 허용함으로써 그 환자가 사망한 경우, 부작위에 의한 살인방조죄가 성립한다.", false, "▸ ① 행위자가 자신의 신체적 활동이나 물리적·화학적 작용을 통하여 적극적으로 타인의 법익상황을 악화시킴으로써 결국 그 타인의 법익을 침해하기에 이르렀다면, 이는 작위에 의한 범죄로 봄이 원칙이다. ② 의사가 수술 후 치료를 계속하지 않으면 환자가 사망할 수 있음을 알면서도 보호자의 강력한 요청으로 치료를 중단하고 퇴원을 허용하여 보호자의 방치로 환자가 사망한 경우, 담당 전문의와 주치의에게 사망이라는 결과 발생에 대한 정범의 고의는 인정되나 기능적 행위지배가 흠결되어 있으므로, '작위'에 의한 살인방조죄만 성립한다(2002도995).\n\n[제5절 참고 - 부작위범 조문] 형법 제18조(부작위범): 위험의 발생을 방지할 의무가 있거나 자기의 행위로 인하여 위험발생의 원인을 야기한 자가 그 위험발생을 방지하지 아니한 때에는 그 발생된 결과에 의하여 처벌한다.", "구성요건론"],
["257", "진정부작위범과 부진정부작위범의 구별과 관련한 학설 중 형식설에 의할 경우, 「형법」상 전시군수계약불이행죄나 다중불해산죄는 진정부작위범이다.", true, "▸ 형식설은 법률이 명문으로 부작위에 의해서만 실현될 수 있도록 규정한 부작위범이고, 작위범으로 규정되어 있으나 부작위에 의해서도 실현될 수 있는 부작위범이 부진정부작위범이라는 견해이다. 형식설에 의하면 전시군수계약불이행죄나 다중불해산죄는 진정부작위범이다.\n\n[제5절 참고 - 부작위범 조문] 형법 제18조(부작위범): 위험의 발생을 방지할 의무가 있거나 자기의 행위로 인하여 위험발생의 원인을 야기한 자가 그 위험발생을 방지하지 아니한 때에는 그 발생된 결과에 의하여 처벌한다.", "구성요건론"],
["258", "어느 행정법규가 \"...시설 및 설비를 갖추고 시장·군수·구청장에게 신고하여야 한다.\"라고 규정하면서 \"...신고를 하지 아니한 자를 처벌한다.\"라고 규정하고 있는 경우, 이 위반죄는 구성요건이 부작위에 의해서만 실현될 수 있는 진정부작위범에 해당한다.", true, "▸ 구 공중위생관리법 제3조 제1항 전단은 '공중위생영업을 하고자 하는 자는 공중위생영업의 종류별로 보건복지부령이 정하는 시설 및 설비를 갖추고 시장·군수·구청장에게 신고하여야 한다'고 규정하고, 같은 법 제20조 제1항 제1호는 '제3조 제1항 전단의 규정에 의한 신고를 하지 아니한 자'를 처벌한다고 규정하고 있는바, 그 규정형식 및 취지에 비추어 신고의무 위반으로 인한 공중위생관리법 위반죄는 구성요건이 부작위에 의하여서만 실현될 수 있는 진정부작위범에 해당한다(2008도89).\n\n[제5절 참고 - 부작위범 조문] 형법 제18조(부작위범): 위험의 발생을 방지할 의무가 있거나 자기의 행위로 인하여 위험발생의 원인을 야기한 자가 그 위험발생을 방지하지 아니한 때에는 그 발생된 결과에 의하여 처벌한다.", "구성요건론"],
["259", "형법상 진정부작위범의 미수범은 처벌할 수 없으나, 부진정부작위범의 미수범은 처벌할 수 있다.", false, "▸ 형법상 진정부작위범인 퇴거불응죄(제319조)에는 미수범(제322조)을 처벌하는 규정이 있다. 부진정부작위범은 결과범이므로 미수범을 처벌할 수 있다(예, 부작위에 의한 살인미수).\n\n[제5절 참고 - 부작위범 조문] 형법 제18조(부작위범): 위험의 발생을 방지할 의무가 있거나 자기의 행위로 인하여 위험발생의 원인을 야기한 자가 그 위험발생을 방지하지 아니한 때에는 그 발생된 결과에 의하여 처벌한다.", "구성요건론"],
["260", "일정 기간 내에 잘못된 상태를 바로잡으라는 행정청의 지시를 이행하지 않았다는 것을 구성요건으로 하는 범죄는 진정부작위범으로서 그 의무이행기간의 경과에 의하여 범행이 기수에 이른 것이다.", true, "▸ (93도1731) [진정부작위범]\n\n[제5절 참고 - 부작위범 조문] 형법 제18조(부작위범): 위험의 발생을 방지할 의무가 있거나 자기의 행위로 인하여 위험발생의 원인을 야기한 자가 그 위험발생을 방지하지 아니한 때에는 그 발생된 결과에 의하여 처벌한다.", "구성요건론"],
["261", "「형법」 제18조의 부작위는 부작위는 법적 기대라는 규범적 가치판단 요소에 의하여 사회적 중요성을 가지는 사람의 행태가 되어 법적 의미에서 작위와 함께 행위의 기본 형태를 이루게 된다.", true, "▸ [AI해설] 형법 제18조의 부작위는 법적 기대라는 규범적 가치판단 요소에 의하여 사회적 중요성을 가지는 사람의 행태가 되어 법적 의미에서 작위와 함께 행위의 기본형태를 이룬다는 것이 판례의 태도이다(2015도6809).\n\n[제5절 참고 - 부작위범 조문] 형법 제18조(부작위범): 위험의 발생을 방지할 의무가 있거나 자기의 행위로 인하여 위험발생의 원인을 야기한 자가 그 위험발생을 방지하지 아니한 때에는 그 발생된 결과에 의하여 처벌한다.", "구성요건론"],
["262", "부작위는 작위에 비해 일반적으로 불법의 정도와 책임이 낮기 때문에 임의적 감경사유로 규정하여 처벌하고 있다.", false, "▸ 형법에는 부진정부작위범의 처벌 정도에 대해 별도로 규정하지 않고 있다. 따라서 작위와 부진정부작위범은 동일하게 처벌된다.\n\n[제5절 참고 - 부작위범 조문] 형법 제18조(부작위범): 위험의 발생을 방지할 의무가 있거나 자기의 행위로 인하여 위험발생의 원인을 야기한 자가 그 위험발생을 방지하지 아니한 때에는 그 발생된 결과에 의하여 처벌한다.", "구성요건론"],
["263", "甲은 물에 빠진 아들 A(5세)를 구할 수 있었음에도 살인의 고의 없이 아들 A를 구하지 못하여 A가 사망하였다면, 甲이 객관적 주의의무를 위반하여 위험을 방지하지 않았다는 점이 인정되는 때에는 부작위에 의한 과실치사죄가 성립할 수 있다.", true, "▸ 부작위에 의한 과실범도 가능하다. [담배꽁초 사건에서 부작위에 의한 실화죄를 인정함(2022도16120).]\n\n[제5절 참고 - 부작위범 조문] 형법 제18조(부작위범): 위험의 발생을 방지할 의무가 있거나 자기의 행위로 인하여 위험발생의 원인을 야기한 자가 그 위험발생을 방지하지 아니한 때에는 그 발생된 결과에 의하여 처벌한다.", "구성요건론"],
["264", "보증인적 지위를 인정할 수 있는 근거에 대해서는 현행 형법에 명문 규정이 없어 학설과 판례에 의해서 인정되고 있다.", false, "▸ 형법 제18조\n\n[제5절 참고 - 부작위범 조문] 형법 제18조(부작위범): 위험의 발생을 방지할 의무가 있거나 자기의 행위로 인하여 위험발생의 원인을 야기한 자가 그 위험발생을 방지하지 아니한 때에는 그 발생된 결과에 의하여 처벌한다.", "구성요건론"],
["265", "작위의무는 법적인 의무이어야 하므로 법령, 법률행위, 선행행위로 인한 경우에는 법적인 작위의무가 인정되나, 기타 신의성실의 원칙이나 사회상규 혹은 조리상 작위의무가 기대되는 경우에는 법적인 작위의무를 인정할 수 없다.", false, "▸ 법령, 법률행위, 선행행위로 인한 경우는 물론이고 기타 신의성실의 원칙이나 사회상규 혹은 조리상 작위의무가 기대되는 경우에도 법적인 작위의무는 있다(95도2551).\n\n[제5절 참고 - 부작위범 조문] 형법 제18조(부작위범): 위험의 발생을 방지할 의무가 있거나 자기의 행위로 인하여 위험발생의 원인을 야기한 자가 그 위험발생을 방지하지 아니한 때에는 그 발생된 결과에 의하여 처벌한다.", "구성요건론"],
["266", "「형법」은 이른바 '착한 사마리아인'에 관한 규정을 두고 있지 않기 때문에 조리에 의한 작위의무가 인정되지 않는다.", false, "▸ 법령, 법률행위, 선행행위로 인한 경우는 물론이고 기타 신의성실의 원칙이나 사회상규 혹은 조리상 작위의무가 기대되는 경우에도 법적인 작위의무는 있다(95도2551).\n\n[제5절 참고 - 부작위범 조문] 형법 제18조(부작위범): 위험의 발생을 방지할 의무가 있거나 자기의 행위로 인하여 위험발생의 원인을 야기한 자가 그 위험발생을 방지하지 아니한 때에는 그 발생된 결과에 의하여 처벌한다.", "구성요건론"],
["267", "甲과 乙은 자신들이 근무하는 A 회사 공장 외벽에 설치된 분리수거장 옆에서 담배를 피우다가 아무 생각 없이 각자 담배꽁초를 분리수거장 쪽에 던지고 자리를 떠났다. 그 이후 분리수거장에 있던 종이박스 등에 불씨가 옮겨붙어 화재가 발생하였고 그로 인해 A 회사 소유의 비료 포대가 전소되었다. 만약 甲이 乙과 함께 담배를 피웠고 각자 버린 담배꽁초로 인하여 화재가 발생할 수 있음을 충분히 예견할 수 있었던 경우, 본인의 담배꽁초 이외에 乙이 던진 담배꽁초에도 불씨가 남아 있는지를 확인하고 이를 제거할 주의의무가 있다.", true, "▸ 근로자는 근로계약에 따른 신의칙상의 부수적 의무로서 사용자의 인적·물적 자원에 손해를 야기하지 않고, 나아가 그에 대한 위험이 발생하였을 경우에는 가능한 범위에서 그 위험을 제거하여야 할 의무가 있다. 따라서 甲과 乙은 각자 자신이 튕겨버린 불씨뿐만 아니라 서로 상대방이 튕겨버린 불씨에서도 화재가 발생하지 않도록 이를 확인한 후 남아 있는 불씨를 완전히 제거하여 화재를 방지하여야 할 작위의무가 있다(부진정부작위범의 보증인 지위)(2022도16120).\n\n[제5절 참고 - 부작위범 조문] 형법 제18조(부작위범): 위험의 발생을 방지할 의무가 있거나 자기의 행위로 인하여 위험발생의 원인을 야기한 자가 그 위험발생을 방지하지 아니한 때에는 그 발생된 결과에 의하여 처벌한다.", "구성요건론"],
["268", "미성년자를 유인하여 포박·감금한 자가 중간에 살해의 고의를 가지고 계속 방치하여 사망케 하였다면 감금 행위자에게도 보증인지위 내지 보증의무가 인정되어 부작위에 의한 살인죄의 성립을 인정하여야 한다.[변14]", true, "▸ 피고인이 미성년자를 유인하여 포박 감금한 후 단지 그 상태를 유지하였을 뿐인데도 피감금자가 사망에 이르게 된 것이라면 피고인의 죄책은 감금치사죄에 해당한다 하겠으나, 나아가서 그 감금상태가 계속된 어느 시점에서 피고인에게 살해의 범의가 생겨 피감금자에 대한 위험발생을 방지함이 없이 포박감금상태에 있던 피감금자를 그대로 방치함으로써 사망케 하였다면 피고인의 부작위는 살인죄의 구성요건적 행위를 충족하는 것이라고 평가하기에 충분하므로 부작위에 의한 살인죄를 구성한다. 자기행위로 인하여 위험발생의 원인을 야기하였음에도 그 위험발생을 방지하지 아니한 피고인의 위와 같은 소위는 살인죄의 구성요건적 행위를 충족하는 부작위였다고 평가하기에 충분하다(82도2024). [선행행위]\n\n[제5절 참고 - 부작위범 조문] 형법 제18조(부작위범): 위험의 발생을 방지할 의무가 있거나 자기의 행위로 인하여 위험발생의 원인을 야기한 자가 그 위험발생을 방지하지 아니한 때에는 그 발생된 결과에 의하여 처벌한다.", "구성요건론"],
["269", "부진정 부작위범의 성립요건과 관련하여 보증인지위와 보증의무의 체계적 지위를 나누는 이분설에 따르면, 부작위 행위자의 보증의무에 관한 착오는 구성요건적 착오에 해당한다.", false, "▸ 이분설에 의하면, 보증인 지위는 구성요건요소이므로 보증인 지위에 대한 착오는 구성요건적 착오(사실의 착오)에 해당하고, 보증인의무는 위법성요소이므로 작위의무에 대한 착오는 형법 제16조의 법률의 착오에 해당한다(아들인지 알았으나 아들을 구할 의무가 없다고 생각한 경우).\n\n[제5절 참고 - 부작위범 조문] 형법 제18조(부작위범): 위험의 발생을 방지할 의무가 있거나 자기의 행위로 인하여 위험발생의 원인을 야기한 자가 그 위험발생을 방지하지 아니한 때에는 그 발생된 결과에 의하여 처벌한다.", "구성요건론"],
["270", "A(5세)의 아버지 甲은 해수욕장에서 자신으로부터 10m 정도 떨어진 곳에서 A가 익사 위기에 처했음을 인식하고도 A가 익사하여도 상관없다고 생각하면서 아무런 조치를 취하지 아니하였고, 결국 A는 사망하였다. 만약 甲이 누군가 익사 위기에 처해 있다고 생각했을 뿐 그 대상이 A임을 인식하지 못하였던 경우, 보증인적 지위는 구성요건요소이지만 보증의무는 위법성요소라고 보는 견해에 따르면, 甲의 부작위는 구성요건에 해당하고 위법하지만 그러한 착오에 정당한 이유가 있는 때에 한하여 법률의 착오로서 책임이 조각된다.[변20]", false, "▸ 이분설에 의하면, 보증인 지위는 구성요건요소이므로 보증인 지위에 대한 착오(대상을 인식하지 못한 경우)는 구성요건적 착오(사실의 착오)에 해당하고, 보증인의무는 위법성요소이므로 작위의무에 대한 착오는 형법 제16조의 법률의 착오에 해당한다(아들인지 알았으나 아들을 구할 의무가 없다고 생각한 경우).\n\n[제5절 참고 - 부작위범 조문] 형법 제18조(부작위범): 위험의 발생을 방지할 의무가 있거나 자기의 행위로 인하여 위험발생의 원인을 야기한 자가 그 위험발생을 방지하지 아니한 때에는 그 발생된 결과에 의하여 처벌한다.", "구성요건론"],
["271", "진정 부작위범과 부진정 부작위범 모두 부작위의 동가치성은 범죄 성립을 위해 필요한 요소이다.", false, "▸ 부작위범의 동가치성은 부진정 부작위범의 특유요건(객관적 구성요건)이다.\n\n[제5절 참고 - 부작위범 조문] 형법 제18조(부작위범): 위험의 발생을 방지할 의무가 있거나 자기의 행위로 인하여 위험발생의 원인을 야기한 자가 그 위험발생을 방지하지 아니한 때에는 그 발생된 결과에 의하여 처벌한다.", "구성요건론"],
["272", "부작위의 동가치성은 형법이 명문으로 요구하고 있는 범죄 성립요건이다.", false, "▸ ① 보증인 지위는 형법 제18조에서 명문으로 규정하고 있으나 동가치성은 명문의 규정이 없다. ② 부진정부작위범의 요건으로 행위태양의 동가치성을 요구하는 것은 부진정부작위범의 형사처벌을 '축소'하는 기능을 한다.\n\n[제5절 참고 - 부작위범 조문] 형법 제18조(부작위범): 위험의 발생을 방지할 의무가 있거나 자기의 행위로 인하여 위험발생의 원인을 야기한 자가 그 위험발생을 방지하지 아니한 때에는 그 발생된 결과에 의하여 처벌한다.", "구성요건론"],
["273", "금지규범 형태의 일반적 구성요건은 작위를 전제하여 이를 금지하는 것임에도 불구하고 부작위를 작위범과 동등하게 처벌하는 것은 죄형법정주의에 반할 위험성을 안고 있으므로, 부진정부작위범의 책임의 한계를 명확히 하기 위해서 '보증인지위'와 '행위 동가치성' 요건을 추가하여 범죄성립 여부를 검토한다.[모25]", true, "▸ ① 보증인 지위는 형법 제18조에서 명문으로 규정하고 있으나 동가치성은 명문의 규정이 없다. ② 부진정부작위범의 요건으로 행위태양의 동가치성을 요구하는 것은 부진정부작위범의 형사처벌을 '축소'하는 기능을 한다.\n\n[제5절 참고 - 부작위범 조문] 형법 제18조(부작위범): 위험의 발생을 방지할 의무가 있거나 자기의 행위로 인하여 위험발생의 원인을 야기한 자가 그 위험발생을 방지하지 아니한 때에는 그 발생된 결과에 의하여 처벌한다.", "구성요건론"],
["274", "부진정부작위범의 요건으로 행위태양의 동가치성을 요구하는 것은 부진정부작위범의 형사처벌을 확장하는 기능을 한다.", false, "▸ ① 보증인 지위는 형법 제18조에서 명문으로 규정하고 있으나 동가치성은 명문의 규정이 없다. ② 부진정부작위범의 요건으로 행위태양의 동가치성을 요구하는 것은 부진정부작위범의 형사처벌을 '축소'하는 기능을 한다.\n\n[제5절 참고 - 부작위범 조문] 형법 제18조(부작위범): 위험의 발생을 방지할 의무가 있거나 자기의 행위로 인하여 위험발생의 원인을 야기한 자가 그 위험발생을 방지하지 아니한 때에는 그 발생된 결과에 의하여 처벌한다.", "구성요건론"],
["275", "★ 법적인 작위의무를 지고 있는 자가 결과발생을 쉽게 방지할 수 있었음에도 불구하고 이를 방관한 채 그 의무를 이행하지 아니한 경우에, 그 부작위가 작위에 의한 법익침해와 동등한 형법적 가치가 있는 것이어서 그 범죄의 실행행위로 평가될 만한 것이라면, 부작위범으로 처벌할 수 있다.[변12]", true, "▸ [AI해설] 법적 작위의무를 지고 있는 자가 결과발생을 쉽게 방지할 수 있었음에도 이를 방관한 채 의무를 이행하지 아니한 경우, 그 부작위가 작위에 의한 법익침해와 동등한 형법적 가치가 있어 범죄의 실행행위로 평가될 만하다면 부작위범으로 처벌할 수 있다는 것이 판례의 태도이다(2009도12109).\n\n[제5절 참고 - 부작위범 조문] 형법 제18조(부작위범): 위험의 발생을 방지할 의무가 있거나 자기의 행위로 인하여 위험발생의 원인을 야기한 자가 그 위험발생을 방지하지 아니한 때에는 그 발생된 결과에 의하여 처벌한다.", "구성요건론"],
["276", "법무사가 아닌 사람이 법무사로 소개되거나 호칭되는 데도 자신이 법무사가 아니라는 사실을 밝히지 않은 채 법무사 행세를 계속하면서 근저당권설정계약서를 작성해 준 경우, 법무사가 아님을 밝힐 계약상 또는 조리상 법적 의무가 있기는 하나, 이는 법무사 명칭을 사칭하는 경우와 동등한 형법적 가치가 있다고 할 수 없으므로 부작위에 의한 법무사법위반죄(법무사명칭사용금지)가 성립하지 않는다.", false, "▸ 피고인은 자신이 법무사가 아님을 밝힐 계약상 또는 조리상의 법적인 작위의무가 있다고 할 것임에도, 이를 밝히지 아니한 채 법무사 행세를 하면서 등기위임장 및 근저당권설정계약서를 작성함으로써 자신이 법무사로 호칭되도록 계속 방치한 것은 작위에 의하여 법무사의 명칭을 사용한 경우와 동등한 형법적 가치가 있는 것으로 볼 수 있다(2007도9354).\n\n[제5절 참고 - 부작위범 조문] 형법 제18조(부작위범): 위험의 발생을 방지할 의무가 있거나 자기의 행위로 인하여 위험발생의 원인을 야기한 자가 그 위험발생을 방지하지 아니한 때에는 그 발생된 결과에 의하여 처벌한다.", "구성요건론"],
["277", "★ 甲이 A와 토지 지상에 창고를 신축하는 데 필요한 형틀공사 계약을 체결한 후 그 공사를 완료하였는데, A가 공사대금을 주지 않는다는 이유로 위 토지에 쌓아 둔 건축자재를 단순히 치우지 않은 경우, 甲의 이러한 행위는 적극적으로 A의 추가 공사 업무를 방해한 행위와 동등한 형법적 가치를 가지는 것으로 평가할 수 있으므로 甲에게는 부작위에 의한 업무방해죄가 성립한다.[변23]", false, "▸ 피고인이 자신의 공사를 위하여 쌓아 두었던 건축자재를 공사 완료 후에 단순히 치우지 않은 행위가 위력으로써 피해자의 추가 공사 업무를 방해하는 업무방해죄의 실행행위로서 피해자의 업무에 대하여 하는 적극적인 방해행위와 동등한 형법적 가치를 가진다고 볼 수 없다(2017도13211).\n\n[제5절 참고 - 부작위범 조문] 형법 제18조(부작위범): 위험의 발생을 방지할 의무가 있거나 자기의 행위로 인하여 위험발생의 원인을 야기한 자가 그 위험발생을 방지하지 아니한 때에는 그 발생된 결과에 의하여 처벌한다.", "구성요건론"],
["278", "★ 부작위에 의한 살인죄가 인정되기 위해서는 행위자에게 침해위협으로부터 법익을 보호해 주어야 할 법적 작위의무가 있어야 하지만 행위자가 그러한 보호적 지위에서 법익침해를 일으키는 사태를 지배하고 있어야 할 필요는 없다.", false, "▸ 살인죄와 같이 일반적으로 작위를 내용으로 하는 범죄를 부작위에 의하여 범하는 이른바 부진정 부작위범의 경우에는 보호법익의 주체가 법익에 대한 침해위협에 대처할 보호능력이 없고, 부작위행위자에게 침해위협으로부터 법익을 보호해 주어야 할 법적 작위의무가 있을 뿐 아니라, 부작위행위자가 그러한 보호적 지위에서 법익침해를 일으키는 사태를 지배하고 있어 작위의무의 이행으로 결과발생을 쉽게 방지할 수 있어야 부작위로 인한 법익침해가 작위에 의한 법익침해와 동등한 형법적 가치가 있는 것으로서 범죄의 실행행위로 평가될 수 있다(2015도6809).\n\n[제5절 참고 - 부작위범 조문] 형법 제18조(부작위범): 위험의 발생을 방지할 의무가 있거나 자기의 행위로 인하여 위험발생의 원인을 야기한 자가 그 위험발생을 방지하지 아니한 때에는 그 발생된 결과에 의하여 처벌한다.", "구성요건론"],
["279", "A(5세)의 아버지 甲은 해수욕장에서 자신으로부터 10m 정도 떨어진 곳에서 A가 익사 위기에 처했음을 인식하고도 A가 익사하여도 상관없다고 생각하면서 아무런 조치를 취하지 아니하였고, 결국 A는 사망하였다. 甲의 부작위를 살인죄의 실행행위로 평가하려면 甲이 A가 처한 사태를 지배하고 있어 구조의무 이행으로 사망의 결과를 쉽게 방지할 수 있어야 한다.[변25]", true, "▸ 살인죄와 같이 일반적으로 작위를 내용으로 하는 범죄를 부작위에 의하여 범하는 이른바 부진정 부작위범의 경우에는 보호법익의 주체가 법익에 대한 침해위협에 대처할 보호능력이 없고, 부작위행위자에게 침해위협으로부터 법익을 보호해 주어야 할 법적 작위의무가 있을 뿐 아니라, 부작위행위자가 그러한 보호적 지위에서 법익침해를 일으키는 사태를 지배하고 있어 작위의무의 이행으로 결과발생을 쉽게 방지할 수 있어야 부작위로 인한 법익침해가 작위에 의한 법익침해와 동등한 형법적 가치가 있는 것으로서 범죄의 실행행위로 평가될 수 있다(2015도6809).\n\n[제5절 참고 - 부작위범 조문] 형법 제18조(부작위범): 위험의 발생을 방지할 의무가 있거나 자기의 행위로 인하여 위험발생의 원인을 야기한 자가 그 위험발생을 방지하지 아니한 때에는 그 발생된 결과에 의하여 처벌한다.", "구성요건론"],
["280", "업무상배임죄는 부작위에 의해서도 성립할 수 있는바, 그러한 부작위를 실행의 착수로 볼 수 있기 위해서는 작위의무가 이행되지 않으면 사무처리의 임무를 부여한 사람이 재산권을 행사할 수 없으리라고 객관적으로 예견되는 등으로 구성요건적 결과 발생의 위험이 구체화한 상황에서 부작위가 이루어져야 한다.", true, "▸ [AI해설] 업무상배임죄는 부작위에 의해서도 성립할 수 있고, 그러한 부작위를 실행의 착수로 볼 수 있으려면 작위의무 불이행 시 사무처리 임무를 부여한 사람이 재산권을 행사할 수 없으리라고 객관적으로 예견되는 등 구성요건적 결과 발생의 위험이 구체화한 상황에서 부작위가 이루어져야 한다는 것이 판례의 태도이다(2020도15529).\n\n[제5절 참고 - 부작위범 조문] 형법 제18조(부작위범): 위험의 발생을 방지할 의무가 있거나 자기의 행위로 인하여 위험발생의 원인을 야기한 자가 그 위험발생을 방지하지 아니한 때에는 그 발생된 결과에 의하여 처벌한다.", "구성요건론"],
["281", "부진정부작위범의 실행착수시기에 대한 견해 중 결과발생의 방지가 가능한 처음 순간에 실행의 착수를 인정하는 견해는 실행의 착수시점을 지나치게 빨리 인정하여 미수의 가벌성을 넓힌다는 비판을 받는다.", true, "▸ 부진정부작위범의 실행의 착수시기에 관한 최초구조가능시설에 대한 비판이다. [① 최초의 구조가능성을 놓친 시점이라는 최초구조가능시설, ② 최후의 구조가능성을 놓친 시점이라는 최후구조가능시설, ③ 부작위가 보호법익에 대한 직접적 위험을 야기하거나 증대시킨 시점으로 보는 절충설]\n\n[제5절 참고 - 부작위범 조문] 형법 제18조(부작위범): 위험의 발생을 방지할 의무가 있거나 자기의 행위로 인하여 위험발생의 원인을 야기한 자가 그 위험발생을 방지하지 아니한 때에는 그 발생된 결과에 의하여 처벌한다.", "구성요건론"],
["282", "A(5세)의 아버지 甲은 해수욕장에서 자신으로부터 10m 정도 떨어진 곳에서 A가 익사 위기에 처했음을 인식하고도 A가 익사하여도 상관없다고 생각하면서 아무런 조치를 취하지 아니하였고, 결국 A는 사망하였다. 甲이 작위의무를 이행하였다면 그 결과가 발생하지 않았을 것이라는 관계가 인정될 경우에 한하여 그 작위를 하지 않은 부작위와 사망의 결과 사이에 인과관계가 인정된다.[변25]", true, "▸ 부작위에 의한 살인에 있어서 작위의무를 이행하였다면 사망의 결과가 발생하지 않았을 것이라는 관계가 인정될 경우, 부작위와 사망의 결과 사이에 인과관계가 인정된다(2015도6809).\n\n[제5절 참고 - 부작위범 조문] 형법 제18조(부작위범): 위험의 발생을 방지할 의무가 있거나 자기의 행위로 인하여 위험발생의 원인을 야기한 자가 그 위험발생을 방지하지 아니한 때에는 그 발생된 결과에 의하여 처벌한다.", "구성요건론"],
["283", "부진정 부작위범의 고의는 반드시 구성요건적 결과 발생에 대한 목적이나 계획적인 범행 의도가 있어야 한다.", false, "▸ 부진정 부작위범의 고의는 반드시 구성요건적 결과발생에 대한 목적이나 계획적인 범행 의도가 있어야 하는 것은 아니고 법익침해의 결과발생을 방지할 법적 작위의무를 가지고 있는 사람이 의무를 이행함으로써 결과발생을 쉽게 방지할 수 있었음을 예견하고도 결과발생을 용인하고 이를 방관한 채 의무를 이행하지 아니한다는 인식을 하면 족하며 이러한 작위의무자의 예견 또는 인식 등은 확정적인 경우는 물론 불확정적인 경우이더라도 미필적 고의로 인정될 수 있다(2015도6809).\n\n[제5절 참고 - 부작위범 조문] 형법 제18조(부작위범): 위험의 발생을 방지할 의무가 있거나 자기의 행위로 인하여 위험발생의 원인을 야기한 자가 그 위험발생을 방지하지 아니한 때에는 그 발생된 결과에 의하여 처벌한다.", "구성요건론"],
["284", "작위의무자가 그 의무를 이행함으로써 결과발생을 쉽게 방지할 수 있었음을 예견하고도 결과발생을 용인하고 이를 방관한 채 그 의무를 이행하지 아니한다는 인식만으로는 부진정 부작위범의 고의가 인정되지 않는다.", false, "▸ 부진정 부작위범의 고의는 법익침해의 결과발생을 방지할 법적 작위의무를 가지고 있는 사람이 의무를 이행함으로써 결과발생을 쉽게 방지할 수 있었음을 예견하고도 결과발생을 용인하고 이를 방관한 채 의무를 이행하지 아니한다는 인식을 하면 족하며, 이러한 예견 또는 인식은 확정적인 경우는 물론 불확정적인 경우이더라도 미필적 고의로 인정될 수 있다(2015도6809).\n\n[제5절 참고 - 부작위범 조문] 형법 제18조(부작위범): 위험의 발생을 방지할 의무가 있거나 자기의 행위로 인하여 위험발생의 원인을 야기한 자가 그 위험발생을 방지하지 아니한 때에는 그 발생된 결과에 의하여 처벌한다.", "구성요건론"],
["285", "A(5세)의 아버지 甲은 해수욕장에서 자신으로부터 10m 정도 떨어진 곳에서 A가 익사 위기에 처했음을 인식하고도 A가 익사하여도 상관없다고 생각하면서 아무런 조치를 취하지 아니하였고, 결국 A는 사망하였다. 甲에게 부작위에 의한 살인죄의 실행의 착수가 인정되기 위해서는 A의 사망 위험이 구체화한 상황에서 부작위가 이루어지고, 부작위 당시 자신이 구조의무 위반행위를 하고 있으며 그로 인하여 A의 사망 위험이 생긴다는 점을 인식해야 한다.", true, "▸ 부진정 부작위범의 고의는 반드시 구성요건적 결과발생에 대한 목적이나 계획적인 범행 의도가 있어야 하는 것은 아니고 법익침해의 결과발생을 방지할 법적 작위의무를 가지고 있는 사람이 의무를 이행함으로써 결과발생을 쉽게 방지할 수 있었음을 예견하고도 결과발생을 용인하고 이를 방관한 채 의무를 이행하지 아니한다는 인식을 하면 족하며 이러한 작위의무자의 예견 또는 인식 등은 확정적인 경우는 물론 불확정적인 경우이더라도 미필적 고의로 인정될 수 있다(2015도6809).\n\n[제5절 참고 - 부작위범 조문] 형법 제18조(부작위범): 위험의 발생을 방지할 의무가 있거나 자기의 행위로 인하여 위험발생의 원인을 야기한 자가 그 위험발생을 방지하지 아니한 때에는 그 발생된 결과에 의하여 처벌한다.", "구성요건론"],
["286", "A(5세)의 아버지 甲은 해수욕장에서 자신으로부터 10m 정도 떨어진 곳에서 A가 익사 위기에 처했음을 인식하고도 A가 익사하여도 상관없다고 생각하면서 아무런 조치를 취하지 아니하였고, 결국 A는 사망하였다. 만약 乙이 해수욕장의 안전요원이고, 甲과 乙이 각자 주의의무를 불이행하여 A가 익사 위기에 처했음을 알지 못하고 그로 인하여 A를 구하지 못하였다면, 甲은 부작위에 의한 과실치사죄, 乙은 부작위에 의한 업무상과실치사죄가 각각 성립할 수 있다.", true, "▸ 실화죄에 있어서 공동의 과실이 경합되어 화재가 발생한 경우 적어도 각 과실이 화재의 발생에 대하여 하나의 조건이 된 이상은 그 공동적 원인을 제공한 사람들은 각자 실화죄의 책임을 면할 수 없다(2022도16120). [甲과 乙은 동시범이므로 제33조 공범과 신분은 적용되지 않는다. 따라서 甲은 부작위에 의한 과실치사죄, 乙은 업무자라는 신분이 있으므로 부작위에 의한 업무상과실치사죄가 각각 성립할 수 있다.]\n\n[제5절 참고 - 부작위범 조문] 형법 제18조(부작위범): 위험의 발생을 방지할 의무가 있거나 자기의 행위로 인하여 위험발생의 원인을 야기한 자가 그 위험발생을 방지하지 아니한 때에는 그 발생된 결과에 의하여 처벌한다.", "구성요건론"],
["287", "부작위범 사이의 공동정범은 다수의 부작위범에게 공통된 의무가 부여되어 있고 그 의무를 공통으로 이행할 수 있을 때에만 성립한다.", true, "▸ 부작위범 사이의 공동정범은 다수의 부작위범에게 공통된 의무가 부여되어 있고 그 의무를 공통으로 이행할 수 있을 때에만 성립한다(2008도89).\n\n[제5절 참고 - 부작위범 조문] 형법 제18조(부작위범): 위험의 발생을 방지할 의무가 있거나 자기의 행위로 인하여 위험발생의 원인을 야기한 자가 그 위험발생을 방지하지 아니한 때에는 그 발생된 결과에 의하여 처벌한다.", "구성요건론"],
["288", "다수의 부작위범에게 공통된 의무가 부여되어 있다면, 그 의무를 공통으로 이행할 수 없을 때에도 부작위범 사이에 공동정범이 성립할 수 있다.", false, "▸ 부작위범 사이의 공동정범은 다수의 부작위범에게 공통된 의무가 부여되어 있고 그 의무를 공통으로 이행할 수 있을 때에만 성립한다(2008도89).\n\n[제5절 참고 - 부작위범 조문] 형법 제18조(부작위범): 위험의 발생을 방지할 의무가 있거나 자기의 행위로 인하여 위험발생의 원인을 야기한 자가 그 위험발생을 방지하지 아니한 때에는 그 발생된 결과에 의하여 처벌한다.", "구성요건론"],
["289", "진정부작위범의 경우 다수의 부작위범에게 부여된 작위의무가 각각 다르더라도 각각의 작위의무에 위반되는 행위를 공동으로 하였다면 부작위범의 공동정범이 성립할 수 있다.", false, "▸ 부작위범 사이의 공동정범은 다수의 부작위범에게 공통된 의무가 부여되어 있고 그 의무를 공통으로 이행할 수 있을 때에만 성립한다(2008도89).\n\n[제5절 참고 - 부작위범 조문] 형법 제18조(부작위범): 위험의 발생을 방지할 의무가 있거나 자기의 행위로 인하여 위험발생의 원인을 야기한 자가 그 위험발생을 방지하지 아니한 때에는 그 발생된 결과에 의하여 처벌한다.", "구성요건론"],
["290", "부작위범을 도구로 이용한 간접정범은 불가능하다.[변19]", false, "▸ 부작위범을 도구로 이용한 간접정범도 가능하다(예, 보증인 지위에 있는 자를 협박하여 작위의무에 나아가지 못하게 하는 경우).\n\n[제5절 참고 - 부작위범 조문] 형법 제18조(부작위범): 위험의 발생을 방지할 의무가 있거나 자기의 행위로 인하여 위험발생의 원인을 야기한 자가 그 위험발생을 방지하지 아니한 때에는 그 발생된 결과에 의하여 처벌한다.", "구성요건론"],
["291", "부작위범에 대한 교사범은 보증인지위에 있는 자로 한정된다.", false, "▸ 부작위범에 대해서도 교사가 가능하다. 또한 교사는 작위에 의한 것이므로 교사범은 보증인 지위에 있는 자로 한정되지 않는다.\n\n[제5절 참고 - 부작위범 조문] 형법 제18조(부작위범): 위험의 발생을 방지할 의무가 있거나 자기의 행위로 인하여 위험발생의 원인을 야기한 자가 그 위험발생을 방지하지 아니한 때에는 그 발생된 결과에 의하여 처벌한다.", "구성요건론"],
["292", "甲이 물에 빠진 아들 A(5세)를 구할 수 있었음에도 살인의 고의로 아무런 조치를 취하지 않아 A가 사망한 경우, 甲에게 아무런 조치를 취하지 말라고 교사한 乙을 처벌하기 위해서는 乙에게도 甲과 별도로 보증인 지위가 요구된다.", false, "▸ 부작위범에 대해서도 교사가 가능하다. 또한 교사는 작위에 의한 것이므로 교사범은 보증인 지위에 있는 자로 한정되지 않는다.\n\n[제5절 참고 - 부작위범 조문] 형법 제18조(부작위범): 위험의 발생을 방지할 의무가 있거나 자기의 행위로 인하여 위험발생의 원인을 야기한 자가 그 위험발생을 방지하지 아니한 때에는 그 발생된 결과에 의하여 처벌한다.", "구성요건론"],
["293", "과실에 의한 교사와 방조는 모두 불가능하지만, 과실범에 대한 교사와 방조는 모두 가능하다.", false, "▸ 교사와 방조는 모두 이중의 고의를 요하므로, ① 과실에 의한 교사와 방조는 불가능하다. ② 과실범에 대한 교사·방조도 불가능하다.\n\n[제5절 참고 - 부작위범 조문] 형법 제18조(부작위범): 위험의 발생을 방지할 의무가 있거나 자기의 행위로 인하여 위험발생의 원인을 야기한 자가 그 위험발생을 방지하지 아니한 때에는 그 발생된 결과에 의하여 처벌한다.", "구성요건론"],
["294", "★ 부작위에 의한 방조범은 보증인적 지위에 있는 자로 한정된다.", true, "▸ 작위에 의한 교사·방조인 경우 보증인적 지위에 있는 자로 한정되지 않는다. 부작위에 의한 교사는 불가능하지만(부작위로는 특정범죄를 결의하게 할 수 없음), 부작위에 의한 방조는 가능하다. 부작위에 의한 방조행위 자체가 부작위이므로 방조범은 보증인적 지위가 있는 자에 한정된다. [형법상 방조행위는 정범의 실행행위를 용이하게 하는 직접·간접의 모든 행위를 가리키는 것으로서 작위에 의한 경우뿐만 아니라 부작위에 의하여도 성립된다(96도1639).]\n\n[제5절 참고 - 부작위범 조문] 형법 제18조(부작위범): 위험의 발생을 방지할 의무가 있거나 자기의 행위로 인하여 위험발생의 원인을 야기한 자가 그 위험발생을 방지하지 아니한 때에는 그 발생된 결과에 의하여 처벌한다.", "구성요건론"],
["295", "인터넷 포털사이트 내 오락채널 총괄팀장이 음란만화들이 지속적으로 게재되고 있다는 사실을 알고도 그 콘텐츠제공업체에 대하여 음란만화의 삭제를 요구하지 않은 경우 부작위범이 성립한다.", true, "▸ [AI해설] 인터넷 포털사이트 오락채널 총괄팀장이 음란만화가 지속적으로 게재되고 있음을 알고도 콘텐츠제공업체에 삭제를 요구하지 않은 경우 부작위범이 성립한다는 것이 판례의 태도이다(2003도4128).\n\n[제5절 참고 - 부작위범 조문] 형법 제18조(부작위범): 위험의 발생을 방지할 의무가 있거나 자기의 행위로 인하여 위험발생의 원인을 야기한 자가 그 위험발생을 방지하지 아니한 때에는 그 발생된 결과에 의하여 처벌한다.", "구성요건론"],
["296", "압류된 골프장시설을 보관하는 회사의 대표이사가 위 압류시설의 사용 및 봉인의 훼손을 방지할 수 있는 적절한 조치 없이 골프장을 개장하게 하여 봉인이 훼손되게 한 경우, 부작위에 의한 공무상표시무효죄가 성립한다.", true, "▸ [AI해설] 압류된 골프장시설을 보관하는 회사의 대표이사가 압류시설의 사용 및 봉인 훼손을 방지할 적절한 조치 없이 골프장을 개장하게 하여 봉인이 훼손된 경우, 부작위에 의한 공무상표시무효죄가 성립한다는 것이 판례의 태도이다(2005도3034).\n\n[제5절 참고 - 부작위범 조문] 형법 제18조(부작위범): 위험의 발생을 방지할 의무가 있거나 자기의 행위로 인하여 위험발생의 원인을 야기한 자가 그 위험발생을 방지하지 아니한 때에는 그 발생된 결과에 의하여 처벌한다.", "구성요건론"],
["297", "판례는 정당방위로서 위법성이 조각되기 위해서 행위자에게 정당방위상황에 대한 인식만 있으면 충분하고 정당방위에 대한 의사까지 필요한 것은 아니라고 본다.", false, "▸ 정당방위·과잉방위나 긴급피난·과잉피난이 성립하기 위하여는 방위의사 또는 피난의사가 있어야 한다(96도3376). [주관적 정당화요소 필요설]", "위법성론"],
["298", "방위행위가 위법성이 조각되기 위해서는 정당방위상황뿐 아니라 행위자에게 방위의사도 인정되어야 하지만, 과잉방위의 경우에는 방위의사를 필요로 하지 아니한다.[변11]", false, "▸ 정당방위·과잉방위나 긴급피난·과잉피난이 성립하기 위하여는 방위의사 또는 피난의사가 있어야 한다(96도3376). [주관적 정당화요소 필요설]", "위법성론"],
["299", "甲은 A의 연인으로 보이는 B가 자신이 흠모하는 A를 껴안으려 하는 것을 보고 분을 참지 못해 해코지를 하려는 의도로 B를 때려 상해를 가하였다. 그러나 실제로 B는 A를 추행하려는 목적으로 껴안으려 했던 것이기에 甲의 행위는 B의 강제추행을 막은 것이었다. 甲의 행위는 상해죄의 구성요건에 해당하나 위법성 인식이 결여되어 있다.[변14]", false, "▸ ① 甲의 행위는 상해죄의 구성요건에 해당한다. 그러나 객관적 정당방위상황이 존재하지만 정당화상황에 대한 인식이 없어 주관적 정당화요소가 결여된 경우이다(우연방위). 위법성을 인식하지 못한 행위가 아니다. ② 우연방위 사례인데, 위 지문은 '위법성조각사유의 전제사실에 대한 착오'의 법적 효과에 관한 판례의 입장이다.", "위법성론"],
["300", "위 사례에서 판례에 따르면 B가 A를 추행하려는 상황이었음을 甲이 몰랐던 것에 '정당한 이유'가 있는 경우라면 위법성이 조각된다.", false, "▸ ① 甲의 행위는 상해죄의 구성요건에 해당한다. 그러나 객관적 정당방위상황이 존재하지만 정당화상황에 대한 인식이 없어 주관적 정당화요소가 결여된 경우이다(우연방위). 위법성을 인식하지 못한 행위가 아니다. ② 우연방위 사례인데, 위 지문은 '위법성조각사유의 전제사실에 대한 착오'의 법적 효과에 관한 판례의 입장이다.", "위법성론"],
["301", "甲은 A의 연인으로 보이는 B가 자신이 흠모하는 A를 껴안으려 하는 것을 보고 분을 참지 못해 해코지를 하려는 의도로 B를 때려 상해를 가하였다. 그러나 실제로 당시 B는 A를 추행하려는 목적으로 껴안으려 했던 것이기에 甲의 행위는 B의 강제추행을 막은 것이었다. 위법성조각을 위해 주관적 정당화요소가 필요하지 않다는 견해에 따르면 甲의 행위는 상해죄의 기수범이 성립한다.[변26]", false, "▸ ① 주관적 정당화요소 불요설 중 무죄설은 객관적 정당화상황이 존재하는 한 결과불법이 없으므로 우연방위는 정당방위에 해당하여 위법성이 조각된다고 본다(甲은 무죄). ② 주관적 정당화요소 필요설 중 불능미수범설은 행위반가치는 인정되지만, 결과반가치가 결여되어 불능미수의 불법구조와 유사하므로 제27조 불능미수 규정을 유추적용해야 한다고 본다. 이 견해에 대해서는 미수범 처벌규정이 없는 경우에는 처벌의 흠결이 발생할 수 있다는 비판이 제기된다. ③ 필요설 중 기수범설은 주관적 정당화요소가 결여된 경우 위법성이 조각되지 않는다고 본다. 이 견해에 대해서는 객관적 정당화사정이 행위자에게 유리하게 작용하지 못한다는 비판이 제기된다.", "위법성론"],
["302", "위 사례에서 甲의 행위를 상해죄의 불능미수로 해결하려는 견해는 법익침해의사는 유지되는 반면에 법질서가 침해되는 결과로 나아가지 않았음을 주된 근거로 한다.[변10]", true, "▸ ① 주관적 정당화요소 불요설 중 무죄설은 객관적 정당화상황이 존재하는 한 결과불법이 없으므로 우연방위는 정당방위에 해당하여 위법성이 조각된다고 본다. ② 주관적 정당화요소 필요설 중 불능미수범설은 행위반가치는 인정되지만, 결과반가치가 결여되어 불능미수의 불법구조와 유사하므로 제27조 불능미수 규정을 유추적용해야 한다고 본다. 이 견해에 대해서는 미수범 처벌규정이 없는 경우에는 처벌의 흠결이 발생할 수 있다는 비판이 제기된다. ③ 필요설 중 기수범설은 주관적 정당화요소가 결여된 경우 위법성이 조각되지 않는다고 본다. 이 견해에 대해서는 객관적 정당화사정이 행위자에게 유리하게 작용하지 못한다는 비판이 제기된다.", "위법성론"],
["303", "위 사례에서 위법성조각사유가 성립하기 위해서는 객관적 요건과 주관적 요건이 모두 충족되어야 한다고 보는 입장에 대해서는 객관적 정당화사정이 행위자에게 유리하게 작용하지 못한다는 비판이 제기된다.", true, "▸ ① 주관적 정당화요소 불요설 중 무죄설은 객관적 정당화상황이 존재하는 한 결과불법이 없으므로 우연방위는 정당방위에 해당하여 위법성이 조각된다고 본다. ② 주관적 정당화요소 필요설 중 불능미수범설은 행위반가치는 인정되지만, 결과반가치가 결여되어 불능미수의 불법구조와 유사하므로 제27조 불능미수 규정을 유추적용해야 한다고 본다. 이 견해에 대해서는 미수범 처벌규정이 없는 경우에는 처벌의 흠결이 발생할 수 있다는 비판이 제기된다. ③ 필요설 중 기수범설은 주관적 정당화요소가 결여된 경우 위법성이 조각되지 않는다고 본다. 이 견해에 대해서는 객관적 정당화사정이 행위자에게 유리하게 작용하지 못한다는 비판이 제기된다.", "위법성론"],
["304", "늦은 밤 어두운 골목길을 걸어 귀가하던 甲은 10여 분간 뒤따라오던 乙 때문에 짜증이 나자 갑자기 뒤돌아서서 상해의 고의로 乙을 주먹과 발로 구타하여 4주간의 치료가 필요한 상해를 가하였다. 乙은 평소 원한관계에 있던 甲을 발견하고는 기습적으로 공격하려고 주머니에 칼을 숨긴 채 기회를 엿보며 뒤따라가고 있었고, 甲이 공격하던 그 순간 칼을 꺼내 甲을 찌르려고 하던 중이었다. 객관적 정당화요소만 충족되면 위법성이 조각된다는 입장이나 주관적 정당화요소까지 충족되어야 위법성이 조각된다는 입장에 의할 때 甲에게는 무죄, 상해죄, 상해죄의 불능미수가 성립할 수 있으나, 과실치상죄와 상해죄의 예비죄는 성립할 수 없다.", true, "▸ ① 객관적 정당화요소만 충족되면 위법성이 조각된다는 입장은 무죄설이다(주관적 정당화요소 불요설). 甲은 무죄에 해당한다. ② 주관적 정당화요소까지 충족되어야 위법성이 조각된다는 입장은 기수범설 또는 불능미수범설이다. 기수범설에 의하면 甲에게는 상해죄가 성립한다. 불능미수범설에 의하면 甲에게는 상해죄의 불능미수가 성립한다. 과실치상죄와 상해죄의 예비죄는 성립할 수 없다.", "위법성론"],
["305", "피해자의 승낙이 객관적으로 존재하는데도 불구하고 행위자가 이를 알지 못하고 행위한 경우에는 위법성조각사유의 전제사실의 착오가 되어 위법성이 조각되지 않는다.", false, "▸ 우연승낙의 문제이지, 위전착의 문제가 아니다.", "위법성론"],
["306", "자연재해나 야생동물에 의한 침해에 대하여는 정당방위를 할 수 없다.", true, "▸ 인간의 의한 침해에 한정된다.\n\n[제2절 참고 - 정당방위 조문] 형법 제21조(정당방위) ① 현재의 부당한 침해로부터 자기 또는 타인의 법익을 방위하기 위하여 한 행위는 상당한 이유가 있는 경우에는 벌하지 아니한다. ② 방위행위가 그 정도를 초과한 경우에는 정황에 따라 그 형을 감경하거나 면제할 수 있다. ③ 제2항의 경우에 야간이나 그 밖의 불안한 상태에서 공포를 느끼거나 경악하거나 흥분하거나 당황하였기 때문에 그 행위를 하였을 때에는 벌하지 아니한다.", "위법성론"],
["307", "정당방위는 현재의 부당한 침해를 방어하기 위한 것이므로 위법하지 않은 정당한 침해에 대한 정당방위는 인정되지 않는다.", true, "▸ 어떠한 행위가 정당방위로 인정되려면 그 행위가 자기 또는 타인의 법익에 대한 현재의 부당한 침해를 방어하기 위한 것으로서 상당성이 있어야 하므로, 위법하지 않은 정당한 침해에 대한 정당방위는 인정되지 아니한다(2006도8750).\n\n[제2절 참고 - 정당방위 조문] 형법 제21조(정당방위) ① 현재의 부당한 침해로부터 자기 또는 타인의 법익을 방위하기 위하여 한 행위는 상당한 이유가 있는 경우에는 벌하지 아니한다. ② 방위행위가 그 정도를 초과한 경우에는 정황에 따라 그 형을 감경하거나 면제할 수 있다. ③ 제2항의 경우에 야간이나 그 밖의 불안한 상태에서 공포를 느끼거나 경악하거나 흥분하거나 당황하였기 때문에 그 행위를 하였을 때에는 벌하지 아니한다.", "위법성론"],
["308", "타인의 법익에 대한 현재의 부당한 침해를 방어하기 위한 행위도 상당한 이유가 있으면 정당방위에 해당된다.", true, "▸ 형법 제21조 제1항\n\n[제2절 참고 - 정당방위 조문] 형법 제21조(정당방위) ① 현재의 부당한 침해로부터 자기 또는 타인의 법익을 방위하기 위하여 한 행위는 상당한 이유가 있는 경우에는 벌하지 아니한다. ② 방위행위가 그 정도를 초과한 경우에는 정황에 따라 그 형을 감경하거나 면제할 수 있다. ③ 제2항의 경우에 야간이나 그 밖의 불안한 상태에서 공포를 느끼거나 경악하거나 흥분하거나 당황하였기 때문에 그 행위를 하였을 때에는 벌하지 아니한다.", "위법성론"],
["309", "甲이 식당에서 칼로 乙을 공격하자, 乙은 식당에 놓여있던 고가의 골동품 도자기를 甲에게 집어 던졌다. 이로 인하여 A소유의 도자기가 깨졌다. 乙은 현재의 부당한 침해를 방어하기 위해 도자기를 甲에게 던졌으므로 도자기를 깬 행위는 정당방위로 위법성이 조각된다.", false, "▸ ① 甲을 상대로 한 특수폭행은 정당방위로 위법성이 조각된다. ② 그러나 A 소유의 도자기를 깬 재물손괴의 경우, 공격자가 아닌 제3자의 법익을 침해하는 행위이므로, 긴급피난으로 위법성이 조각될 수 있어도, 정당방위로 위법성이 조각될 수 없다.\n\n[제2절 참고 - 정당방위 조문] 형법 제21조(정당방위) ① 현재의 부당한 침해로부터 자기 또는 타인의 법익을 방위하기 위하여 한 행위는 상당한 이유가 있는 경우에는 벌하지 아니한다. ② 방위행위가 그 정도를 초과한 경우에는 정황에 따라 그 형을 감경하거나 면제할 수 있다. ③ 제2항의 경우에 야간이나 그 밖의 불안한 상태에서 공포를 느끼거나 경악하거나 흥분하거나 당황하였기 때문에 그 행위를 하였을 때에는 벌하지 아니한다.", "위법성론"],
["310", "이미 발생한 침해가 증대될 위험이 있거나 침해행위가 이미 오랜 동안 지속 및 반복되어 침해행위가 그 후에도 반복하여 계속될 염려가 있다면 현재의 부당한 침해가 있다고 볼 여지가 있다.", true, "▸ (92도2540) [의붓아버지 사건]\n\n[제2절 참고 - 정당방위 조문] 형법 제21조(정당방위) ① 현재의 부당한 침해로부터 자기 또는 타인의 법익을 방위하기 위하여 한 행위는 상당한 이유가 있는 경우에는 벌하지 아니한다. ② 방위행위가 그 정도를 초과한 경우에는 정황에 따라 그 형을 감경하거나 면제할 수 있다. ③ 제2항의 경우에 야간이나 그 밖의 불안한 상태에서 공포를 느끼거나 경악하거나 흥분하거나 당황하였기 때문에 그 행위를 하였을 때에는 벌하지 아니한다.", "위법성론"],
["311", "형법 제21조 제1항의 침해의 현재성이란 침해행위가 형식적으로 기수에 이르렀는지에 따라 결정된다.", false, "▸ 형법 제21조 제1항의 침해의 현재성이란 침해행위가 형식적으로 기수에 이르렀는지에 따라 결정되는 것이 아니라 자기 또는 타인의 법익에 대한 침해상황이 종료되기 전까지를 의미하는 것이므로, 일련의 연속되는 행위로 인해 침해상황이 중단되지 아니하거나 일시 중단되더라도 추가 침해가 곧바로 발생할 객관적인 사유가 있는 경우에는 그중 일부 행위가 범죄의 기수에 이르렀더라도 전체적으로 침해상황이 종료되지 않은 것으로 볼 수 있다(2020도6874).\n\n[제2절 참고 - 정당방위 조문] 형법 제21조(정당방위) ① 현재의 부당한 침해로부터 자기 또는 타인의 법익을 방위하기 위하여 한 행위는 상당한 이유가 있는 경우에는 벌하지 아니한다. ② 방위행위가 그 정도를 초과한 경우에는 정황에 따라 그 형을 감경하거나 면제할 수 있다. ③ 제2항의 경우에 야간이나 그 밖의 불안한 상태에서 공포를 느끼거나 경악하거나 흥분하거나 당황하였기 때문에 그 행위를 하였을 때에는 벌하지 아니한다.", "위법성론"],
["312", "甲은 절도범의 침입에 대비해 저택의 담장에 전기 철조망을 설치하였는데, 금고털이범 乙이 담을 넘다가 감전된 경우, 정당방위의 침해의 현재성이 인정되어 상당한 이유가 있다면 위법성이 조각된다.", true, "▸ 침해의 현재성은 방위행위시가 아니라 '침해행위시'를 기준으로 하므로, 설치 당시에 침해가 없었더라도 절도가 침입하는 경우 침해의 현재성이 인정된다.\n\n[제2절 참고 - 정당방위 조문] 형법 제21조(정당방위) ① 현재의 부당한 침해로부터 자기 또는 타인의 법익을 방위하기 위하여 한 행위는 상당한 이유가 있는 경우에는 벌하지 아니한다. ② 방위행위가 그 정도를 초과한 경우에는 정황에 따라 그 형을 감경하거나 면제할 수 있다. ③ 제2항의 경우에 야간이나 그 밖의 불안한 상태에서 공포를 느끼거나 경악하거나 흥분하거나 당황하였기 때문에 그 행위를 하였을 때에는 벌하지 아니한다.", "위법성론"],
["313", "정당방위의 성립요건으로서의 방어행위는 순수한 수비적 방어뿐만 아니라 적극적 반격을 포함하는 반격방어의 형태도 포함된다.[변11]", true, "▸ 정당방위의 성립요건으로서의 방어행위에는 순수한 수비적 방어뿐 아니라 적극적 반격을 포함하는 반격방어의 형태도 포함된다. 다만 정당방위로 인정되기 위해서는 자기 또는 타인의 법익침해를 방어하기 위한 행위로서 상당한 이유가 있어야 한다(2020도6874).\n\n[제2절 참고 - 정당방위 조문] 형법 제21조(정당방위) ① 현재의 부당한 침해로부터 자기 또는 타인의 법익을 방위하기 위하여 한 행위는 상당한 이유가 있는 경우에는 벌하지 아니한다. ② 방위행위가 그 정도를 초과한 경우에는 정황에 따라 그 형을 감경하거나 면제할 수 있다. ③ 제2항의 경우에 야간이나 그 밖의 불안한 상태에서 공포를 느끼거나 경악하거나 흥분하거나 당황하였기 때문에 그 행위를 하였을 때에는 벌하지 아니한다.", "위법성론"],
["314", "A와 B가 차량 통행 문제로 다투던 중에 A가 차를 몰고 대문 안으로 운전해 들어가려 하자 B가 양팔을 벌리고 제지하였음에도 A가 차를 약 3미터 가량 B의 앞쪽으로 급진시키자, 이때 그 차 운전석 옆에 서 있던 B의 아들 甲이 B를 구하려고 차를 정지시키기 위하여 운전석 옆 창문을 통해 A의 머리카락을 잡아당겨 A의 흉부가 차의 창문틀에 부딪혀 약간의 상처를 입게 하였다면, 甲의 행위는 정당방위에 해당한다.", true, "▸ 父의 생명 신체에 대한 현재의 부당한 침해를 방위하기 위한 행위로서 정당방위에 해당한다(86도1091).\n\n[제2절 참고 - 정당방위 조문] 형법 제21조(정당방위) ① 현재의 부당한 침해로부터 자기 또는 타인의 법익을 방위하기 위하여 한 행위는 상당한 이유가 있는 경우에는 벌하지 아니한다. ② 방위행위가 그 정도를 초과한 경우에는 정황에 따라 그 형을 감경하거나 면제할 수 있다. ③ 제2항의 경우에 야간이나 그 밖의 불안한 상태에서 공포를 느끼거나 경악하거나 흥분하거나 당황하였기 때문에 그 행위를 하였을 때에는 벌하지 아니한다.", "위법성론"],
["315", "가해자의 행위가 피해자의 부당한 공격을 방위하기 위한 것이라기보다는 서로 공격할 의사로 싸우다가 먼저 공격을 받고 이에 대항하여 가해하게 된 경우, 그 가해행위는 방어행위인 동시에 공격행위의 성격을 가지므로 정당방위라고 볼 수 없다.", true, "▸ [AI해설] 가해자의 행위가 피해자의 부당한 공격을 방위하기 위한 것이라기보다는 서로 공격할 의사로 싸우다가 먼저 공격을 받고 이에 대항하여 가해하게 된 경우, 그 가해행위는 방어행위인 동시에 공격행위의 성격을 가지므로 정당방위라고 볼 수 없다는 것이 판례의 태도이다(2000도228).\n\n[제2절 참고 - 정당방위 조문] 형법 제21조(정당방위) ① 현재의 부당한 침해로부터 자기 또는 타인의 법익을 방위하기 위하여 한 행위는 상당한 이유가 있는 경우에는 벌하지 아니한다. ② 방위행위가 그 정도를 초과한 경우에는 정황에 따라 그 형을 감경하거나 면제할 수 있다. ③ 제2항의 경우에 야간이나 그 밖의 불안한 상태에서 공포를 느끼거나 경악하거나 흥분하거나 당황하였기 때문에 그 행위를 하였을 때에는 벌하지 아니한다.", "위법성론"],
["316", "겉으로는 서로 싸움을 하는 것처럼 보이더라도 실제로는 한쪽 당사자가 일방적으로 위법한 공격을 가하고 상대방은 이러한 공격으로부터 자신을 보호하고 이를 벗어나기 위한 저항수단으로서 유형력을 행사한 경우에는, 그 행위가 새로운 적극적 공격이라고 평가되지 아니하는 한, 이는 사회관념상 허용될 수 있는 상당성이 있는 것으로서 위법성이 조각된다.", true, "▸ 위법한 공격으로부터 자신을 보호하고 이를 벗어나기 위한 사회관념상 상당성 있는 방어행위로서 유형력의 행사에 이르렀다고 할 것이어서 위 행위의 위법성이 조각된다고 판단한 원심판결에 법리오해의 위법이 없다(2009도12958).\n\n[제2절 참고 - 정당방위 조문] 형법 제21조(정당방위) ① 현재의 부당한 침해로부터 자기 또는 타인의 법익을 방위하기 위하여 한 행위는 상당한 이유가 있는 경우에는 벌하지 아니한다. ② 방위행위가 그 정도를 초과한 경우에는 정황에 따라 그 형을 감경하거나 면제할 수 있다. ③ 제2항의 경우에 야간이나 그 밖의 불안한 상태에서 공포를 느끼거나 경악하거나 흥분하거나 당황하였기 때문에 그 행위를 하였을 때에는 벌하지 아니한다.", "위법성론"],
["317", "甲은 자신의 아파트로 찾아와 소란을 피우는 친구 乙에게 출입문을 열어주었으나, 乙이 신발을 신은 채 거실로 들어와 함께 온 아들과 합세하여 남편과의 불륜관계를 추궁하며 자신을 구타하자, 그로부터 벗어나기 위해 손을 휘저으며 발버둥을 치는 과정에서 乙에게 상해를 가한 경우 甲의 행위는 위법성이 조각된다.", true, "▸ 위법한 공격으로부터 자신을 보호하고 이를 벗어나기 위한 사회관념상 상당성 있는 방어행위로서 유형력의 행사에 이르렀다고 할 것이어서 위 행위의 위법성이 조각된다고 판단한 원심판결에 법리오해의 위법이 없다(2009도12958).\n\n[제2절 참고 - 정당방위 조문] 형법 제21조(정당방위) ① 현재의 부당한 침해로부터 자기 또는 타인의 법익을 방위하기 위하여 한 행위는 상당한 이유가 있는 경우에는 벌하지 아니한다. ② 방위행위가 그 정도를 초과한 경우에는 정황에 따라 그 형을 감경하거나 면제할 수 있다. ③ 제2항의 경우에 야간이나 그 밖의 불안한 상태에서 공포를 느끼거나 경악하거나 흥분하거나 당황하였기 때문에 그 행위를 하였을 때에는 벌하지 아니한다.", "위법성론"],
["318", "甲은 乙과 말다툼을 하다가 낫을 들고 반항하는 乙로부터 낫을 빼앗아 乙의 가슴, 배, 목 등을 10여 차례 찔러 乙로 하여금 자상으로 사망하게 한 경우, 甲의 행위는 그 정도를 초과한 것으로서 「형법」 제21조 제2항의 과잉방위에 해당한다.", false, "▸ ① 피고인에게는 이 사건 범행 당시 적어도 살인의 미필적 고의는 있었다. ② 피고인의 이 사건 범행행위가 피해자의 피고인에 대한 현재의 부당한 침해를 방위하거나 그러한 침해를 예방하기 위한 행위로 상당한 이유가 있는 경우에 해당한다고 볼 수 없고, 또 피고인의 이 사건 범행행위는 방위행위가 그 정도를 초과한 때에 해당하거나 정도를 초과한 방위행위가 야간 기타 불안스러운 상태하에서 공포, 경악, 흥분 또는 당황으로 인한 때에 해당한다고 볼 수도 없다(2007도1794).\n\n[제2절 참고 - 정당방위 조문] 형법 제21조(정당방위) ① 현재의 부당한 침해로부터 자기 또는 타인의 법익을 방위하기 위하여 한 행위는 상당한 이유가 있는 경우에는 벌하지 아니한다. ② 방위행위가 그 정도를 초과한 경우에는 정황에 따라 그 형을 감경하거나 면제할 수 있다. ③ 제2항의 경우에 야간이나 그 밖의 불안한 상태에서 공포를 느끼거나 경악하거나 흥분하거나 당황하였기 때문에 그 행위를 하였을 때에는 벌하지 아니한다.", "위법성론"],
["319", "甲이 乙로부터 갑자기 뺨을 맞는 등 폭행을 당하여 서로 멱살을 잡고 다투자 주위 사람들이 싸움을 제지하였으나 甲은 맨손으로 공격하는 乙에게 대항하기 위하여 깨어진 병으로 乙을 찌를 듯이 겨누어 협박한 경우, 甲의 행위는 사회통념상 그 정도를 초과하여 상당성이 결여된 것으로서 정당방위에 해당하지 않는다.", true, "▸ 피고인의 행위는 자기의 법익에 대한 현재의 부당한 침해를 방어하기 위한 것이라고 볼 수 있으나, 맨손으로 공격하는 상대방에 대하여 위험한 물건인 깨어진 병을 가지고 대항한다는 것은 사회통념상 그 정도를 초과한 방어행위로서 상당성이 결여된 것이고, 또 주위사람들이 싸움을 제지하였다는 상황에 비추어 야간의 공포나 당황으로 인한 것이었다고 보기도 어렵다(91도80).\n\n[제2절 참고 - 정당방위 조문] 형법 제21조(정당방위) ① 현재의 부당한 침해로부터 자기 또는 타인의 법익을 방위하기 위하여 한 행위는 상당한 이유가 있는 경우에는 벌하지 아니한다. ② 방위행위가 그 정도를 초과한 경우에는 정황에 따라 그 형을 감경하거나 면제할 수 있다. ③ 제2항의 경우에 야간이나 그 밖의 불안한 상태에서 공포를 느끼거나 경악하거나 흥분하거나 당황하였기 때문에 그 행위를 하였을 때에는 벌하지 아니한다.", "위법성론"],
["320", "이혼소송 중인 남편 A가 찾아와 아내 甲의 목에 가위를 겨누면서 이혼하면 죽여 버리겠다고 협박하고 변태적 성행위를 강요하는 데에 격분하여 甲이 사전에 침대 밑에 숨겨 놓았던 칼로 A의 복부를 찔러 그 자리에서 사망에 이르게 한 경우, 甲의 행위는 과잉방위에 해당한다.", false, "▸ 그 행위는 방위행위로서의 한도를 넘어선 것으로 사회통념상 용인될 수 없다는 이유로 정당방위나 과잉방위에 해당하지 않는다(2001도1089).\n\n[제2절 참고 - 정당방위 조문] 형법 제21조(정당방위) ① 현재의 부당한 침해로부터 자기 또는 타인의 법익을 방위하기 위하여 한 행위는 상당한 이유가 있는 경우에는 벌하지 아니한다. ② 방위행위가 그 정도를 초과한 경우에는 정황에 따라 그 형을 감경하거나 면제할 수 있다. ③ 제2항의 경우에 야간이나 그 밖의 불안한 상태에서 공포를 느끼거나 경악하거나 흥분하거나 당황하였기 때문에 그 행위를 하였을 때에는 벌하지 아니한다.", "위법성론"],
["321", "피해자가 술에 만취하여 누나와 말다툼을 하다가 누나의 머리채를 잡고 때렸으며, 당시 누나의 남편이었던 피고인이 이를 목격하고 화가 나서 피해자와 싸우게 되었는데, 그 과정에서 몸무게가 85kg 이상이나 되는 피해자가 62kg의 피고인을 침대 위에 넘어뜨리고 피고인의 가슴 위에 올라타 목 부분을 누르자 호흡이 곤란하게 된 피고인이 안간힘을 쓰면서 허둥대다가 그곳 침대 위에 놓여있던 과도로 피해자에게 상해를 가한 경우 피고인의 행위는 자신의 신체에 대한 현재의 부당한 침해를 방위하기 위한 행위로서 정당방위에 해당한다.", false, "▸ 피고인의 행위는 피해자의 부당한 공격을 방위하기 위한 것이라기보다는 서로 공격할 의사로 싸우다가 먼저 공격을 받고 이에 대항하여 가해하게 된 것이라고 봄이 상당하고, 이와 같은 싸움의 경우 가해행위는 방어행위인 동시에 공격행위의 성격을 가지므로 정당방위 또는 과잉방위행위라고 볼 수 없다(2000도228).\n\n[제2절 참고 - 정당방위 조문] 형법 제21조(정당방위) ① 현재의 부당한 침해로부터 자기 또는 타인의 법익을 방위하기 위하여 한 행위는 상당한 이유가 있는 경우에는 벌하지 아니한다. ② 방위행위가 그 정도를 초과한 경우에는 정황에 따라 그 형을 감경하거나 면제할 수 있다. ③ 제2항의 경우에 야간이나 그 밖의 불안한 상태에서 공포를 느끼거나 경악하거나 흥분하거나 당황하였기 때문에 그 행위를 하였을 때에는 벌하지 아니한다.", "위법성론"],
["322", "공직선거 후보자 합동연설회장에서 후보자 甲이 적시한 연설 내용이 다른 후보자 乙에 대한 명예훼손 또는 후보자비방의 요건에 해당되나 그 위법성이 조각되더라도, 甲의 연설이 乙을 비방하는 내용이므로 甲의 연설 도중에 乙이 마이크를 빼앗고 욕설을 하는 등 물리적으로 甲의 연설을 방해한 행위는 정당방위에 해당한다.", false, "▸ ① 후보자를 비방하는 행위라 하더라도 적시된 사실이 진실에 부합하고 공공의 이익에 관한 때에는 위법성이 조각된다(공직선거법 제251조 단서). ② 공직선거 후보자 합동연설회장에서 후보자 甲이 적시한 연설 내용이 다른 후보자 乙에 대한 명예훼손 또는 후보자비방의 요건에 해당되나 그 위법성이 조각되는 경우, 甲의 연설 도중에 乙이 마이크를 빼앗고 욕설을 하는 등 물리적으로 甲의 연설을 방해한 행위가 甲의 '위법하지 않은 정당한 침해'에 대하여 이루어진 것일 뿐만 아니라 '상당성'을 결여하여 정당방위의 요건을 갖추지 못하였다(2003도3606).\n\n[제2절 참고 - 정당방위 조문] 형법 제21조(정당방위) ① 현재의 부당한 침해로부터 자기 또는 타인의 법익을 방위하기 위하여 한 행위는 상당한 이유가 있는 경우에는 벌하지 아니한다. ② 방위행위가 그 정도를 초과한 경우에는 정황에 따라 그 형을 감경하거나 면제할 수 있다. ③ 제2항의 경우에 야간이나 그 밖의 불안한 상태에서 공포를 느끼거나 경악하거나 흥분하거나 당황하였기 때문에 그 행위를 하였을 때에는 벌하지 아니한다.", "위법성론"],
["323", "★ 행위자의 행위가 긴급피난에 해당하기 위해서는 긴급피난상황에 대한 인식만 있으면 족하며, 위난을 피하고자 하는 의사까지 필요한 것은 아니다.[변24]", false, "▸ 정당방위·과잉방위나 긴급피난·과잉피난이 성립하기 위하여는 방위의사 또는 피난의사가 있어야 한다(96도3376).\n\n[제3절 참고 - 긴급피난 조문] 형법 제22조(긴급피난) ① 자기 또는 타인의 법익에 대한 현재의 위난을 피하기 위한 행위는 상당한 이유가 있는 때에는 벌하지 아니한다. ② 위난을 피하지 못할 책임이 있는 자에 대하여는 전항의 규정을 적용하지 아니한다. ③ 전조 제2항과 제3항의 규정은 본조에 준용한다.", "위법성론"],
["324", "★ 甲이 스스로 야기한 강간범행의 와중에 피해자 A가 甲의 손가락을 깨물며 반항하자 물린 손가락을 비틀어 잡아 뽑다가 A에게 치아결손의 상해를 입힌 경우, 甲의 행위는 법에 의하여 용인되는 피난행위라 할 수 없다.[변22]", true, "▸ [AI해설] 스스로 야기한 강간범행의 와중에 피해자가 손가락을 깨물며 반항하자 물린 손가락을 비틀어 뽑다가 상해를 입힌 경우, 이는 법에 의하여 용인되는 피난행위라 할 수 없다는 것이 판례의 태도이다(94도2781).\n\n[제3절 참고 - 긴급피난 조문] 형법 제22조(긴급피난) ① 자기 또는 타인의 법익에 대한 현재의 위난을 피하기 위한 행위는 상당한 이유가 있는 때에는 벌하지 아니한다. ② 위난을 피하지 못할 책임이 있는 자에 대하여는 전항의 규정을 적용하지 아니한다. ③ 전조 제2항과 제3항의 규정은 본조에 준용한다.", "위법성론"],
["325", "★ 선장이 피조개양식장에 피해를 주지 않기 위해 양식장까지의 거리가 약 30미터가 되도록 선박의 닻줄을 7샤클(175미터)에서 5샤클(125미터)로 감아놓았는데, 태풍을 갑자기 만나게 되면서 선박의 안전을 위하여 어쩔 수 없이 선박의 닻줄을 7샤클로 늘여 놓았다가 피조개양식장을 침범하여 물적 피해를 야기한 경우 긴급피난으로 위법성이 조각된다.[변18]", true, "▸ 비용이 많이 들어 미리 선박을 이동시켜 놓아야 할 책임을 다하지 아니함으로써 긴급한 위난을 당하였다는 점만으로는 긴급피난을 인정하는데 아무런 방해가 되지 아니한다(85도221).\n\n[제3절 참고 - 긴급피난 조문] 형법 제22조(긴급피난) ① 자기 또는 타인의 법익에 대한 현재의 위난을 피하기 위한 행위는 상당한 이유가 있는 때에는 벌하지 아니한다. ② 위난을 피하지 못할 책임이 있는 자에 대하여는 전항의 규정을 적용하지 아니한다. ③ 전조 제2항과 제3항의 규정은 본조에 준용한다.", "위법성론"],
["326", "자신의 진돗개를 물어뜯는 공격을 하였다는 이유로 소지하고 있던 기계톱으로 타인의 개를 내리쳐 등 부분을 절개하여 죽인 경우 긴급피난으로 위법성이 조각된다.", false, "▸ 피난행위의 상당성을 넘은 행위로서 형법 제22조 제1항에서 정한 긴급피난의 요건을 갖춘 행위로 보기 어려울 뿐 아니라, 그 당시 피해견이 피고인을 공격하지도 않았고 피해견이 평소 공격적인 성향을 가지고 있었다고 볼 자료도 없는 이상 제22조 제3항에서 정한 책임조각적 과잉피난에도 해당하지 아니한다(2014도2477).\n\n[제3절 참고 - 긴급피난 조문] 형법 제22조(긴급피난) ① 자기 또는 타인의 법익에 대한 현재의 위난을 피하기 위한 행위는 상당한 이유가 있는 때에는 벌하지 아니한다. ② 위난을 피하지 못할 책임이 있는 자에 대하여는 전항의 규정을 적용하지 아니한다. ③ 전조 제2항과 제3항의 규정은 본조에 준용한다.", "위법성론"],
["327", "아파트 입주자대표회의 회장이 일부 입주민이 가입한 케이블TV 방송의 시험방송 송출로 인하여 위성방송의 수신이 불가능하게 되었다는 다수 입주민들의 민원을 접수한 후 케이블TV 방송에 시험방송 송출을 중단해 달라는 요청도 해 보지 아니한 채 시험방송이 송출된 지 약 1시간 30여 분 만에 곧바로 케이블TV 방송의 방송안테나를 절단하도록 지시한 행위는 긴급피난에 해당하지 않는다.", true, "▸ 당시 피고인이 다수 입주민들의 민원에 따라 입주자대표회의 회장의 자격으로 위성방송 수신을 방해하는 경기동부방송의 시험방송 송출을 중단시키기 위하여 방송안테나를 절단하도록 지시하였다고 할지라도 피고인의 위와 같은 행위를 긴급피난 내지는 정당행위에 해당한다고 볼 수 없다(2005도9396).\n\n[제3절 참고 - 긴급피난 조문] 형법 제22조(긴급피난) ① 자기 또는 타인의 법익에 대한 현재의 위난을 피하기 위한 행위는 상당한 이유가 있는 때에는 벌하지 아니한다. ② 위난을 피하지 못할 책임이 있는 자에 대하여는 전항의 규정을 적용하지 아니한다. ③ 전조 제2항과 제3항의 규정은 본조에 준용한다.", "위법성론"],
["328", "정당 당직자가 국회 외교통상 상임위원회 회의장 앞 복도에서 출입이 봉쇄된 회의장 출입구를 뚫을 목적으로 회의장 출입문 및 집기를 손상하거나 국회 심의를 방해할 목적으로 회의장 내에 물을 분사한 경우 긴급피난으로 위법성이 조각된다.", false, "▸ 피고인들의 행위는 합법적 절차를 외면한 채 곧바로 폭력적 행동으로 나아가 방법이나 수단에 있어서도 상당성의 요건을 갖추지 못하여 정당행위나 긴급피난의 요건을 갖춘 행위로 평가하기 어렵다(2010도13609).\n\n[제3절 참고 - 긴급피난 조문] 형법 제22조(긴급피난) ① 자기 또는 타인의 법익에 대한 현재의 위난을 피하기 위한 행위는 상당한 이유가 있는 때에는 벌하지 아니한다. ② 위난을 피하지 못할 책임이 있는 자에 대하여는 전항의 규정을 적용하지 아니한다. ③ 전조 제2항과 제3항의 규정은 본조에 준용한다.", "위법성론"],
["329", "한미 FTA 비준동의안에 대한 국회 외교통상 상임위원회의 처리 과정에서 위원장이 회의장 점거 등 소란행위가 예상되어 회의장 문을 잠그고, 의자와 소파, 책상 등으로 바리케이드를 치고 출입을 차단하고 비준동의안을 단독으로 상정하려고 하자 다른 정당 당직자들이 출입이 봉쇄된 회의장 출입구를 뚫을 목적으로 회의장 출입문 및 그 안쪽에 쌓여있던 책상 등 집기를 손상한 경우 정당행위에 해당한다.[모25]", false, "▸ 피고인들의 행위는 합법적 절차를 외면한 채 곧바로 폭력적 행동으로 나아가 방법이나 수단에 있어서도 상당성의 요건을 갖추지 못하여 정당행위나 긴급피난의 요건을 갖춘 행위로 평가하기 어렵다(2010도13609).\n\n[제3절 참고 - 긴급피난 조문] 형법 제22조(긴급피난) ① 자기 또는 타인의 법익에 대한 현재의 위난을 피하기 위한 행위는 상당한 이유가 있는 때에는 벌하지 아니한다. ② 위난을 피하지 못할 책임이 있는 자에 대하여는 전항의 규정을 적용하지 아니한다. ③ 전조 제2항과 제3항의 규정은 본조에 준용한다.", "위법성론"],
["330", "부작위의무와 부작위의무를 동시에 이행해야 할 경우에도 의무의 충돌에 해당한다.", false, "▸ 의무의 충돌은 ① 작위의무와 작위의무가 충돌하는 경우, ② 단순한 윤리·종교적 의무가 아니라 모두 법적인 의무인 경우, ③ 어느 하나를 이행하면 다른 의무를 이행할 수 없는 실질적인 충돌에서만 문제된다.\n\n[제3절 참고 - 긴급피난 조문] 형법 제22조(긴급피난) ① 자기 또는 타인의 법익에 대한 현재의 위난을 피하기 위한 행위는 상당한 이유가 있는 때에는 벌하지 아니한다. ② 위난을 피하지 못할 책임이 있는 자에 대하여는 전항의 규정을 적용하지 아니한다. ③ 전조 제2항과 제3항의 규정은 본조에 준용한다.", "위법성론"],
["331", "형법상 자구행위라 함은 법정절차에 의하여 청구권을 보전하기 불능한 경우에 그 청구권의 실행불능 또는 현저한 실행곤란을 피하기 위한 상당한 행위를 말한다.", true, "▸ [AI해설] 형법상 자구행위라 함은 법정절차에 의하여 청구권을 보전하기 불능한 경우에 그 청구권의 실행불능 또는 현저한 실행곤란을 피하기 위한 상당한 행위를 말한다는 것이 판례의 태도이다(2006도4328).\n\n[제4절 참고 - 자구행위 조문] 형법 제23조(자구행위) ① 법률에서 정한 절차에 따라서는 청구권을 보전할 수 없는 경우에 그 청구권의 실행이 불가능해지거나 현저히 곤란해지는 상황을 피하기 위하여 한 행위는 상당한 이유가 있는 때에는 벌하지 아니한다. ② 제1항의 행위가 그 정도를 초과한 경우에는 정황에 따라 그 형을 감경하거나 면제할 수 있다.", "위법성론"],
["332", "긴급피난과 자구행위 요건으로서의 상당한 이유에는 모두 보충성의 원칙이 적용된다.", true, "▸ 모두 상당한 이유를 규정하고 있고, 모두 보충성을 요건으로 한다.\n\n[제4절 참고 - 자구행위 조문] 형법 제23조(자구행위) ① 법률에서 정한 절차에 따라서는 청구권을 보전할 수 없는 경우에 그 청구권의 실행이 불가능해지거나 현저히 곤란해지는 상황을 피하기 위하여 한 행위는 상당한 이유가 있는 때에는 벌하지 아니한다. ② 제1항의 행위가 그 정도를 초과한 경우에는 정황에 따라 그 형을 감경하거나 면제할 수 있다.", "위법성론"],
["333", "자구행위가 그 정도를 초과한 때에는 정황에 따라 형을 감경 또는 면제할 수 있고, 그 정도를 초과하더라도 야간 기타 불안스러운 상태하에서 공포·경악·흥분·당황으로 인한 경우에는 벌하지 아니한다.", false, "▸ ① 과잉방위·과잉피난·과잉자구행위 규정이 있다. ② 야간 등 책임조각적 과잉방위는 정당방위·긴급피난만 있고, 자구행위는 이에 대한 규정이 없다.\n\n[제4절 참고 - 자구행위 조문] 형법 제23조(자구행위) ① 법률에서 정한 절차에 따라서는 청구권을 보전할 수 없는 경우에 그 청구권의 실행이 불가능해지거나 현저히 곤란해지는 상황을 피하기 위하여 한 행위는 상당한 이유가 있는 때에는 벌하지 아니한다. ② 제1항의 행위가 그 정도를 초과한 경우에는 정황에 따라 그 형을 감경하거나 면제할 수 있다.", "위법성론"],
["334", "토지소유권자가 피해자가 운영하는 회사에 대하여 그 토지의 인도 등을 구할 권리가 있다는 이유만으로 회사로 들어가는 진입로를 폐쇄한 것은 자구행위에 해당하지 않는다.", true, "▸ (2006도4328 및 2007도7717)\n\n[제4절 참고 - 자구행위 조문] 형법 제23조(자구행위) ① 법률에서 정한 절차에 따라서는 청구권을 보전할 수 없는 경우에 그 청구권의 실행이 불가능해지거나 현저히 곤란해지는 상황을 피하기 위하여 한 행위는 상당한 이유가 있는 때에는 벌하지 아니한다. ② 제1항의 행위가 그 정도를 초과한 경우에는 정황에 따라 그 형을 감경하거나 면제할 수 있다.", "위법성론"],
["335", "인근 상가의 통행로로 이용되고 있는 토지의 사실상 지배권자가 위 토지에 철주와 철망을 설치하고 포장된 아스팔트를 걷어냄으로써 통행로로 이용하지 못하게 한 행위는 자구행위에 해당하지 않는다.", true, "▸ (2006도4328 및 2007도7717)\n\n[제4절 참고 - 자구행위 조문] 형법 제23조(자구행위) ① 법률에서 정한 절차에 따라서는 청구권을 보전할 수 없는 경우에 그 청구권의 실행이 불가능해지거나 현저히 곤란해지는 상황을 피하기 위하여 한 행위는 상당한 이유가 있는 때에는 벌하지 아니한다. ② 제1항의 행위가 그 정도를 초과한 경우에는 정황에 따라 그 형을 감경하거나 면제할 수 있다.", "위법성론"],
["336", "★ 甲이 A에게 석고를 납품한 대금을 받지 못하고 있던 중 A가 화랑을 폐쇄하고 도주하자, 甲이 야간에 폐쇄된 화랑의 베니아판 문을 미리 준비한 드라이버로 뜯어내고 A의 물건을 몰래 가지고 나온 경우, 이는 자구행위에 해당한다.", false, "▸ 피고인의 강제적 채권추심 내지 이를 목적으로 하는 물품의 취거행위를 형법 제23조 소정의 자구행위라고 볼 수 없다(84도2582).\n\n[제4절 참고 - 자구행위 조문] 형법 제23조(자구행위) ① 법률에서 정한 절차에 따라서는 청구권을 보전할 수 없는 경우에 그 청구권의 실행이 불가능해지거나 현저히 곤란해지는 상황을 피하기 위하여 한 행위는 상당한 이유가 있는 때에는 벌하지 아니한다. ② 제1항의 행위가 그 정도를 초과한 경우에는 정황에 따라 그 형을 감경하거나 면제할 수 있다.", "위법성론"],
["337", "★ 甲은 가구대리점을 운영하는 A에게 가구를 팔았는데 A가 대금을 갚지 않고 부도를 낸 후 도피하자 자신의 물품대금 채권을 다른 채권자들보다 우선적으로 확보할 목적으로 A가 부도를 낸 다음날 새벽에 A의 승낙을 받지 아니한 채 A의 가구점의 시정장치를 쇠톱으로 절단하고 침입하여 시가 1천만원 상당의 가구들을 화물차에 싣고 가 다른 장소에 옮겨 놓은 경우, 자구행위에 해당하므로 위법성이 조각된다.", false, "▸ 채무자인 피해자가 부도를 낸 후 도피하였고 다른 채권자들이 채권확보를 위하여 피해자의 물건들을 취거해 갈 수도 있다는 사정만으로는 피고인들이 법정절차에 의하여 자신들의 피해자에 대한 청구권을 보전하는 것이 불가능한 경우에 해당한다고 볼 수 없을 뿐만 아니라, 또한 피해자 소유의 가구점에 관리종업원이 있음에도 불구하고 위 가구점의 시정장치를 쇠톱으로 절단하고 들어가 가구들을 무단으로 취거한 행위가 피고인들의 피해자에 대한 청구권의 실행불능이나 현저한 실행곤란을 피하기 위한 상당한 이유가 있는 행위라고도 할 수 없다(2005도8081).\n\n[제4절 참고 - 자구행위 조문] 형법 제23조(자구행위) ① 법률에서 정한 절차에 따라서는 청구권을 보전할 수 없는 경우에 그 청구권의 실행이 불가능해지거나 현저히 곤란해지는 상황을 피하기 위하여 한 행위는 상당한 이유가 있는 때에는 벌하지 아니한다. ② 제1항의 행위가 그 정도를 초과한 경우에는 정황에 따라 그 형을 감경하거나 면제할 수 있다.", "위법성론"],
["338", "임대인의 승낙 없이 건물을 전차한 전차인은 비록 불법 침탈 등의 방법에 의하여 건물의 점유를 개시한 것이 아니고 그동안 평온하게 음식점 영업을 하여 왔더라도 그 전대차로써 임대인에게 대항할 수 없기 때문에, 임대인이 그 건물의 열쇠를 새로 만들어 잠근 행위는 업무방해죄의 위법성을 조각하는 자구행위에 해당한다.[변23]", false, "▸ ① 건물의 전차인이 임대인의 승낙 없이 전차하였다고 하더라도 전차인이 불법침탈 등의 방법에 의하여 위 건물의 점유를 개시한 것이 아니고 그동안 평온하게 음식점 등 영업을 하면서 점유를 계속하여 온 이상 위 전차인의 업무를 업무방해죄에 의하여 보호받지 못하는 권리라고 단정할 수 없다. ② 피고인으로서는 마땅히 정당한 소송절차에 의하여 점유를 회복하여야 하고 위력으로 그 권리를 행사할 수 없다고 할 것이므로 피고인이 그 지하층의 열쇠를 새로 만들어 잠그고 A로 하여금 그곳에 설치되어 있는 피해자 소유의 의자, 탁자 등을 들어내게 한 행위는 결코 사회상규에 위배되지 않는 정당한 행위이거나 자구행위에 해당한다고 볼 수 없다(86도1372).\n\n[제4절 참고 - 자구행위 조문] 형법 제23조(자구행위) ① 법률에서 정한 절차에 따라서는 청구권을 보전할 수 없는 경우에 그 청구권의 실행이 불가능해지거나 현저히 곤란해지는 상황을 피하기 위하여 한 행위는 상당한 이유가 있는 때에는 벌하지 아니한다. ② 제1항의 행위가 그 정도를 초과한 경우에는 정황에 따라 그 형을 감경하거나 면제할 수 있다.", "위법성론"],
["339", "피해자의 승낙은 형사불법의 귀속에 관하여 피해자에게 처분권을 부여해 주는 규정으로서, 형법이론적으로 피해자 고려, 형법의 보충성 실현, 형법의 민사화 등의 의미를 갖는다.[변16]", true, "▸ 피해자의 승낙(형법 제24조)은 형사불법의 귀속에 관하여 피해자에게 처분권을 부여해 주는 규정으로서, 형법이론적으로 피해자 고려, 형법의 보충성 실현, 형법의 민사화 등의 의미를 갖는다.\n\n[제5절 참고 - 피해자의 승낙 조문] 형법 제24조(피해자의 승낙): 처분할 수 있는 자의 승낙에 의하여 그 법익을 훼손한 행위는 법률에 특별한 규정이 없는 한 벌하지 아니한다.", "위법성론"],
["340", "위법성조각사유의 근거원리를 '이익형량'과 '이익흠결'로 나누는 견해에 따르면, 긴급피난은 이익형량에, 피해자의 승낙은 이익흠결에 근거한 것으로 볼 수 있다.[변26]", true, "▸ 위법성조각사유의 근거원리를 '이익형량'과 '이익흠결'로 나누는 견해에 따르면, 피해자의 승낙 및 추정적 승낙은 이익흠결에 근거한 것이고, 긴급피난 등 나머지 위법성조각사유는 이익형량에 근거한 것이다(이원설).\n\n[제5절 참고 - 피해자의 승낙 조문] 형법 제24조(피해자의 승낙): 처분할 수 있는 자의 승낙에 의하여 그 법익을 훼손한 행위는 법률에 특별한 규정이 없는 한 벌하지 아니한다.", "위법성론"],
["341", "13세 미만의 소녀가 자신에 대한 간음에 동의하였더라도 간음행위의 위법성이 조각되지 않는다.", true, "▸ 형법 제305조에 규정된 13세미만 부녀에 대한 의제강간, 추행죄는 그 성립에 있어 위계 또는 위력이나 폭행 또는 협박의 방법에 의함을 요하지 아니하며 피해자의 동의가 있었다고 하여도 성립하는 것이다(82도2183).\n\n[제5절 참고 - 피해자의 승낙 조문] 형법 제24조(피해자의 승낙): 처분할 수 있는 자의 승낙에 의하여 그 법익을 훼손한 행위는 법률에 특별한 규정이 없는 한 벌하지 아니한다.", "위법성론"],
["342", "甲(20세)이 乙(15세)의 승낙을 받아 성관계를 하였다고 하더라도 가벌성이 있다.[변26]", true, "▸ ① 13세 미만의 사람에 대하여 간음 또는 추행을 한 자는 제297조, 제297조의2, 제298조, 제301조 또는 제301조의2의 예에 의한다(제305조 제1항). ② 13세 이상 16세 미만의 사람에 대하여 간음 또는 추행을 한 19세 이상의 자는 제297조, 제297조의2, 제298조, 제301조 또는 제301조의2의 예에 의한다(제305조 제2항).\n\n[제5절 참고 - 피해자의 승낙 조문] 형법 제24조(피해자의 승낙): 처분할 수 있는 자의 승낙에 의하여 그 법익을 훼손한 행위는 법률에 특별한 규정이 없는 한 벌하지 아니한다.", "위법성론"],
["343", "A는 동거 중인 甲이 자신의 지갑에서 현금을 꺼내가는 것을 보았으나 이를 만류하지 않았다면 피해자의 승낙에 해당하여 위법성이 조각된다.", false, "▸ 피고인이 동거중인 피해자의 지갑에서 현금을 꺼내가는 것을 피해자가 현장에서 목격하고도 만류하지 아니하였다면 피해자가 이를 허용하는 묵시적 의사가 있었다고 봄이 상당하여 이는 절도죄를 구성하지 않는다(85도1487). [양해]\n\n[제5절 참고 - 피해자의 승낙 조문] 형법 제24조(피해자의 승낙): 처분할 수 있는 자의 승낙에 의하여 그 법익을 훼손한 행위는 법률에 특별한 규정이 없는 한 벌하지 아니한다.", "위법성론"],
["344", "피해자의 승낙은 과실범의 경우에 위법성조각사유가 되지 않는다.", false, "▸ 의사의 업무상과실치상죄에 대하여 피해자의 승낙에 의하여 위법성이 조각될 수 있다(92도2345). [위법성조각사유는 고의범뿐만 아니라 과실범에도 인정된다.]\n\n[제5절 참고 - 피해자의 승낙 조문] 형법 제24조(피해자의 승낙): 처분할 수 있는 자의 승낙에 의하여 그 법익을 훼손한 행위는 법률에 특별한 규정이 없는 한 벌하지 아니한다.", "위법성론"],
["345", "묵시적 승낙이 있는 경우에도 피해자의 승낙에 의해 위법성이 조각될 수 있다.", true, "▸ 계주인 A가 피고인이 계주의 업무를 대행하는데 대하여 이를 승인 내지 묵인한 사실이 인정된다면 피고인의 소위는 이른바 위 A의 승낙이 있었던 것으로서 위법성이 조각되어 업무방해죄가 성립되지 않는다(82도2486).\n\n[제5절 참고 - 피해자의 승낙 조문] 형법 제24조(피해자의 승낙): 처분할 수 있는 자의 승낙에 의하여 그 법익을 훼손한 행위는 법률에 특별한 규정이 없는 한 벌하지 아니한다.", "위법성론"],
["346", "승낙은 법익침해 후에 하여도 유효하며, 승낙 이후에는 자유롭게 철회할 수 없다.[변16]", false, "▸ 위법성조각사유로서의 피해자의 승낙은 언제든지 자유롭게 철회할 수 있다고 할 것이고, 그 철회의 방법에는 아무런 제한이 없다(2010도9962). [사후승낙은 위법성을 조각할 수 없다(일반적 견해).]\n\n[제5절 참고 - 피해자의 승낙 조문] 형법 제24조(피해자의 승낙): 처분할 수 있는 자의 승낙에 의하여 그 법익을 훼손한 행위는 법률에 특별한 규정이 없는 한 벌하지 아니한다.", "위법성론"],
["347", "의사의 진단상 과오로 인해 당연히 설명받았을 내용을 설명받지 못한 경우라도 피해자로부터 수술 승낙을 받은 이상 그 승낙은 수술의 위법성을 조각할 유효한 승낙이라고 볼 수 있다.", false, "▸ 산부인과 전문의 수련과정 2년차인 의사가 피해자의 병명을 자궁근종으로 오진하고 이에 근거하여 의학에 대한 전문지식이 없는 피해자에게 자궁적출술의 불가피성만을 강조하였을 뿐 위와 같은 진단상의 과오가 없었으면 당연히 설명받았을 자궁외 임신에 관한 내용을 설명받지 못한 피해자로부터 수술승낙을 받았다면 위 승낙은 부정확 또는 불충분한 설명을 근거로 이루어진 것으로서 수술의 위법성을 조각할 유효한 승낙이라고 볼 수 없다(92도2345).\n\n[제5절 참고 - 피해자의 승낙 조문] 형법 제24조(피해자의 승낙): 처분할 수 있는 자의 승낙에 의하여 그 법익을 훼손한 행위는 법률에 특별한 규정이 없는 한 벌하지 아니한다.", "위법성론"],
["348", "「형법」 제24조의 규정에 의하여 위법성을 조각하는 피해자의 승낙은 법률상 이를 처분할 수 있는 사람의 승낙이어야 하고, 그 승낙이 윤리적·도덕적으로 사회상규에 반하는 것이 아니어야 한다.", true, "▸ ① 위법성이 조각되는 피해자의 승낙은 그 승낙이 윤리적·도덕적으로 사회상규에 반하는 것이 아니어야 한다(2008도9606). ② 판례는 상해죄뿐만 아니라 폭행치상죄(2010도2745), 폭행치사죄(85도1892)에도 위 법리를 적용하고 있다.\n\n[제5절 참고 - 피해자의 승낙 조문] 형법 제24조(피해자의 승낙): 처분할 수 있는 자의 승낙에 의하여 그 법익을 훼손한 행위는 법률에 특별한 규정이 없는 한 벌하지 아니한다.", "위법성론"],
["349", "피해자의 승낙에 의한 행위가 사회상규에 위배된 때에는 위법하다는 이른바 피해자의 승낙에 대한 '사회상규적·윤리적 한계에 의한 제약'은 판례에 의할 때 상해죄에 대하여만 인정된다.", false, "▸ ① 위법성이 조각되는 피해자의 승낙은 그 승낙이 윤리적·도덕적으로 사회상규에 반하는 것이 아니어야 한다(2008도9606). ② 판례는 상해죄뿐만 아니라 폭행치상죄(2010도2745), 폭행치사죄(85도1892)에도 위 법리를 적용하고 있다.\n\n[제5절 참고 - 피해자의 승낙 조문] 형법 제24조(피해자의 승낙): 처분할 수 있는 자의 승낙에 의하여 그 법익을 훼손한 행위는 법률에 특별한 규정이 없는 한 벌하지 아니한다.", "위법성론"],
["350", "甲과 乙이 교통사고를 가장하여 보험금을 편취할 것을 공모한 후 乙의 승낙을 받은 甲이 乙에게 상해를 가한 경우, 乙의 승낙이 위법한 목적에 이용하기 위한 것이었다고 할지라도 甲의 행위는 상해죄의 위법성이 조각된다.", false, "▸ 피고인이 피해자와 공모하여 교통사고를 가장하여 보험금을 편취할 목적으로 상해를 가하였다면 피해자의 승낙이 있었다고 하더라도 위법한 목적에 이용하기 위한 것이므로 피해자의 승낙에 의하여 위법성이 조각된다고 할 수 없다(2008도9606).\n\n[제5절 참고 - 피해자의 승낙 조문] 형법 제24조(피해자의 승낙): 처분할 수 있는 자의 승낙에 의하여 그 법익을 훼손한 행위는 법률에 특별한 규정이 없는 한 벌하지 아니한다.", "위법성론"],
["351", "甲은 2024. 7. 5.경 A에게 \"보험사기를 치려고 하는데, 나를 때려 주면 돈을 주겠다.\"라고 부탁하여 A가 甲을 때리고 甲은 약속대로 현금을 지불하였다. 한편 A의 행위로 인하여 甲은 다발성 좌상 등의 상해를 입었다. 甲의 요청에 따라 A가 甲을 폭행하였고, 그 과정에서 甲이 다발성 좌상 등의 상해를 입게 된 것이라고 하더라도 그러한 甲의 요청은 윤리적·도덕적으로 사회상규에 어긋나는 것이어서 위법성조각사유인 피해자의 승낙에 해당한다고 하기는 어렵다.", true, "▸ 피고인이 피해자와 공모하여 교통사고를 가장하여 보험금을 편취할 목적으로 상해를 가하였다면 피해자의 승낙이 있었다고 하더라도 위법한 목적에 이용하기 위한 것이므로 피해자의 승낙에 의하여 위법성이 조각된다고 할 수 없다(2008도9606).\n\n[제5절 참고 - 피해자의 승낙 조문] 형법 제24조(피해자의 승낙): 처분할 수 있는 자의 승낙에 의하여 그 법익을 훼손한 행위는 법률에 특별한 규정이 없는 한 벌하지 아니한다.", "위법성론"],
["352", "추정적 승낙이란 피해자의 현실적인 승낙이 없었다고 하더라도 행위 당시의 모든 객관적 사정에 비추어 볼 때 만일 피해자가 행위의 내용을 알았더라면 당연히 승낙하였을 것으로 예견되는 경우를 말한다.", true, "▸ [AI해설] 추정적 승낙이란 피해자의 현실적인 승낙이 없었다고 하더라도 행위 당시의 모든 객관적 사정에 비추어 볼 때 만일 피해자가 행위의 내용을 알았더라면 당연히 승낙하였을 것으로 예견되는 경우를 말한다는 것이 판례의 태도이다(2005도8081).\n\n[제5절 참고 - 피해자의 승낙 조문] 형법 제24조(피해자의 승낙): 처분할 수 있는 자의 승낙에 의하여 그 법익을 훼손한 행위는 법률에 특별한 규정이 없는 한 벌하지 아니한다.", "위법성론"],
["353", "적정한 한계를 벗어나는 현행범인 체포행위는 그 부분에 관한 한 법령에 의한 행위로 될 수 없으나, 적정한 한계를 벗어나는 행위인지 여부는 결국 정당행위의 일반적 요건을 갖추었는지 여부에 따라 결정되어야 할 것이지 그 행위가 소극적인 방어행위인가 적극적인 공격행위인가에 따라 결정되어야 하는 것은 아니다.[모25]", true, "▸ ① 현행범인은 누구든지 영장 없이 체포할 수 있으므로(형사소송법 제212조), 사인의 현행범인 체포는 법령에 의한 행위로서 위법성이 조각된다. ② 적정한 한계를 벗어나는 현행범인 체포행위는 그 부분에 관한 한 법령에 의한 행위로 될 수 없다. ③ 적정한 한계를 벗어나는 행위인가 여부는 결국 정당행위의 일반적 요건을 갖추었는지 여부에 따라 결정되어야 할 것이지 그 행위가 소극적인 방어행위인가 적극적인 공격행위인가에 따라 결정되어야 하는 것은 아니다. ④ 피고인의 차를 손괴하고 도망하려는 피해자를 도망하지 못하게 멱살을 잡고 흔들어 피해자에게 전치 14일의 흉부찰과상을 가한 경우, 정당행위에 해당한다(98도3029).\n\n[제6절 참고 - 정당행위 조문] 형법 제20조(정당행위): 법령에 의한 행위 또는 업무로 인한 행위 기타 사회상규에 위배되지 아니하는 행위는 벌하지 아니한다.", "위법성론"],
["354", "차 주인이 자신의 차를 열쇠 꾸러미로 긁어 손괴하고 도망하려는 자를 도망하지 못하게 멱살을 잡고 흔들어 그에게 전치 14일의 흉부찰과상을 가한 경우 「형법」 제20조의 정당행위에 해당한다.[모25]", true, "▸ ① 현행범인은 누구든지 영장 없이 체포할 수 있으므로(형사소송법 제212조), 사인의 현행범인 체포는 법령에 의한 행위로서 위법성이 조각된다. ② 적정한 한계를 벗어나는 현행범인 체포행위는 그 부분에 관한 한 법령에 의한 행위로 될 수 없다. ③ 적정한 한계를 벗어나는 행위인가 여부는 결국 정당행위의 일반적 요건을 갖추었는지 여부에 따라 결정되어야 할 것이지 그 행위가 소극적인 방어행위인가 적극적인 공격행위인가에 따라 결정되어야 하는 것은 아니다. ④ 피고인의 차를 손괴하고 도망하려는 피해자를 도망하지 못하게 멱살을 잡고 흔들어 피해자에게 전치 14일의 흉부찰과상을 가한 경우, 정당행위에 해당한다(98도3029).\n\n[제6절 참고 - 정당행위 조문] 형법 제20조(정당행위): 법령에 의한 행위 또는 업무로 인한 행위 기타 사회상규에 위배되지 아니하는 행위는 벌하지 아니한다.", "위법성론"],
["355", "사인(私人)의 현행범인 체포는 정당행위로 위법성이 조각되지만, 현행범인을 체포하기 위하여 타인의 주거에 들어가는 행위는 정당행위에 해당하지 않아 주거침입죄의 죄책을 진다.", true, "▸ (사인이) 현행범을 추적하여 그 범인의 父의 집에 들어가서 동인과 시비 끝에 상해를 입힌 경우에 주거침입죄가 성립한다(65도99).\n\n[제6절 참고 - 정당행위 조문] 형법 제20조(정당행위): 법령에 의한 행위 또는 업무로 인한 행위 기타 사회상규에 위배되지 아니하는 행위는 벌하지 아니한다.", "위법성론"],
["356", "A의 갑작스러운 폭행으로 B가 넘어져 상해를 입었는데 A가 아무런 사과 없이 그대로 도주하려고 하자, B와 전혀 관계없는 甲과 乙이 A를 쫓아가 체포하면서 양팔로 A의 목을 감싸안고 다리를 걸어 넘어뜨린 후 무릎과 양팔로 목, 어깨, 머리 등을 눌러 경찰관이 출동할 때까지 꼼짝하지 못하게 하여 3주간의 치료가 필요한 상해를 입혔더라도, 甲과 乙의 행위는 적법한 현행범인 체포행위로서 정당행위에 해당한다.[모25]", true, "▸ 적법한 현행범인 체포행위로서 정당행위에 해당하므로 위법성이 조각된다(2013헌마849).\n\n[제6절 참고 - 정당행위 조문] 형법 제20조(정당행위): 법령에 의한 행위 또는 업무로 인한 행위 기타 사회상규에 위배되지 아니하는 행위는 벌하지 아니한다.", "위법성론"],
["357", "甲은 21:25경 자신의 약혼자를 승용차에 태우고 도로를 진행하고 있었는데, 술에 취하여 인도에서 택시를 기다리고 있던 乙이 甲의 차를 乙의 회사 직원이 타고 가는 차로 오인하고 차도로 나와 甲의 차를 세워 타려고 하였다. 이에 甲이 항의하자 乙은 甲의 바지춤을 잡고 끌어당겨 甲의 바지를 찢어지게 한 다음 甲을 잡아끌고 가려다가 甲과 함께 넘어졌다. 甲은 약혼자의 신고로 출동한 경찰관이 현장에 도착할 때까지 약 3분가량 乙의 양손을 잡아 누르고 있었다. 甲의 행위는 정당행위로서 위법성이 조각된다고 할 수 없다.[변20]", false, "▸ 피고인의 행위는 위 피해자에 대항하여 폭행을 가한 것이라기 보다는 그의 계속되는 부당한 공격으로부터 벗어나거나 이를 방어하기 위하여 한 것으로 보는 것이 상당하고, 사회통념상 허용될 만한 정도의 상당성이 있는 것으로서 위법성이 결여된 행위라고 보아야 할 것이다(99도943).\n\n[제6절 참고 - 정당행위 조문] 형법 제20조(정당행위): 법령에 의한 행위 또는 업무로 인한 행위 기타 사회상규에 위배되지 아니하는 행위는 벌하지 아니한다.", "위법성론"],
["358", "상관의 위법한 명령에 따라 범죄행위를 한 경우에는 상관의 명령에 따랐다고 하여 부하가 한 범죄행위의 위법성이 조각될 수는 없다.[모25]", true, "▸ ① 상관의 '적법'한 직무상 명령에 따른 행위는 정당행위로서 제20조에 의하여 위법성이 조각된다. ② 상관의 '위법'한 명령에 따라 범죄행위를 한 경우에는 부하가 한 범죄행위의 위법성이 조각될 수는 없다(96도3376).\n\n[제6절 참고 - 정당행위 조문] 형법 제20조(정당행위): 법령에 의한 행위 또는 업무로 인한 행위 기타 사회상규에 위배되지 아니하는 행위는 벌하지 아니한다.", "위법성론"],
["359", "상사 계급의 군인이 자신의 잦은 폭력으로 신체에 위해를 느끼고 겁을 먹은 상태에 있던 부대원들에게 청소 불량 등을 이유로 40~50분간 머리박아(속칭 '원산폭격')를 시키거나 양손을 깍지 낀 상태에서 약 2시간 동안 50~60회 정도의 팔굽혀펴기를 하게 한 경우 「형법」 제20조의 정당행위에 해당한다.[모25]", false, "▸ ① 상사 계급의 피고인이 그의 잦은 폭력으로 신체에 위해를 느끼고 겁을 먹은 상태에 있던 부대원들에게 청소 불량 등을 이유로 40분 내지 50분간 머리박아('원산폭격')를 시키거나 양손을 깍지 낀 상태에서 약 2시간 동안 팔굽혀펴기를 50~60회 정도 하게 한 행위가 형법 제324조에서 정한 강요죄에 해당한다. ② 상사 계급의 피고인이 부대원들에게 얼차려를 지시할 당시 얼차려의 결정권자도 아니었고 소속 부대의 얼차려 지침상 허용되는 얼차려도 아니라는 등의 이유로, 피고인의 얼차려 지시 행위를 형법 제20조의 정당행위로 볼 수 없다(2003도4151).\n\n[제6절 참고 - 정당행위 조문] 형법 제20조(정당행위): 법령에 의한 행위 또는 업무로 인한 행위 기타 사회상규에 위배되지 아니하는 행위는 벌하지 아니한다.", "위법성론"],
["360", "민사소송법 제335조에 따른 법원의 감정인 지정결정 또는 같은 법 제341조 제1항에 따른 법원의 감정촉탁을 받은 경우에는 감정평가업자가 아닌 사람이더라도 그 감정사항에 포함된 토지 등의 감정평가를 할 수 있고, 이러한 행위는 법령에 근거한 법원의 적법한 결정이나 촉탁에 따른 것으로 형법 제20조의 정당행위에 해당하여 위법성이 조각된다.", true, "▸ [AI해설] 민사소송법 제335조에 따른 법원의 감정인 지정결정 또는 제341조 제1항에 따른 법원의 감정촉탁을 받은 경우에는 감정평가업자가 아닌 사람이더라도 그 감정사항에 포함된 토지 등의 감정평가를 할 수 있고, 이는 법령에 근거한 법원의 적법한 결정이나 촉탁에 따른 것으로 형법 제20조의 정당행위에 해당하여 위법성이 조각된다는 것이 판례의 태도이다(2017도10634).\n\n[제6절 참고 - 정당행위 조문] 형법 제20조(정당행위): 법령에 의한 행위 또는 업무로 인한 행위 기타 사회상규에 위배되지 아니하는 행위는 벌하지 아니한다.", "위법성론"],
["361", "집행관이 압류영장의 집행을 위하여 채무자의 주거에 들어가는 과정에서 집안으로 들어오지 못하도록 저항하는 채무자와 몸싸움을 하던 중 채무자에게 경미한 상해를 가한 경우는 형법 제20조 정당행위로 위법성이 조각된다.", true, "▸ 적법한 집행을 방해하는 등 저항하므로 이를 배제하고 채무자의 주거에 들어가기 위하여 동인을 떠민 것은 집달관으로서의 정당한 직무범위 내에 속하는 위력의 행사라고 할 것이고, 이로 인하여 상해를 가하였다 하더라도 제20조에 의하여 위법성이 조각된다(93도875).\n\n[제6절 참고 - 정당행위 조문] 형법 제20조(정당행위): 법령에 의한 행위 또는 업무로 인한 행위 기타 사회상규에 위배되지 아니하는 행위는 벌하지 아니한다.", "위법성론"],
["362", "학교의 장과 교원은 학생의 인권을 보호하고 교원의 교육활동을 위하여 필요한 경우에는 법령과 학칙으로 정하는 바에 따라 학생을 지도할 수 있으며, 이에 따른 교원의 정당한 학생생활지도는 「아동복지법」의 아동학대로 보지 아니한다.[모25]", true, "▸ 학교의 장과 교원은 학생의 인권을 보호하고 교원의 교육활동을 위하여 필요한 경우에는 법령과 학칙으로 정하는 바에 따라 학생을 지도할 수 있다(초중등교육법 제20조의2 제1항)(2021도13926).\n\n[제6절 참고 - 정당행위 조문] 형법 제20조(정당행위): 법령에 의한 행위 또는 업무로 인한 행위 기타 사회상규에 위배되지 아니하는 행위는 벌하지 아니한다.", "위법성론"],
["363", "친권자가 스스로의 감정을 이기지 못하고 야구방망이로 때릴 듯이 자녀에게 \"죽여 버린다\"라고 말하여 협박하는 것은 그 자체로 자녀의 인격 성장에 장해를 가져올 우려가 커서 정당행위라고 볼 수 없다.[모25]", true, "▸ 친권자가 자녀를 훈육할 목적이 있었다 하더라도 스스로의 감정을 이기지 못하고 야구방망이로 때릴 듯이 위협하며 살해의 언사로 협박하는 것은 그 자체로 자녀의 인격 성장에 장해를 가져올 우려가 있어 사회상규에 위배되지 아니하는 행위로 볼 수 없다(2001도6468).\n\n[제6절 참고 - 정당행위 조문] 형법 제20조(정당행위): 법령에 의한 행위 또는 업무로 인한 행위 기타 사회상규에 위배되지 아니하는 행위는 벌하지 아니한다.", "위법성론"],
["364", "근로자의 쟁의행위가 정당행위에 해당하는지 판단하는 기준은 적법한 쟁의행위에 통상 수반되는 부수적 행위가 정당행위에 해당하는지 여부를 판단할 때에도 동일하게 적용된다.[모25]", true, "▸ ① 근로자의 쟁의행위가 형법상 정당행위에 해당하려면, 주체가 단체교섭의 주체로 될 수 있는 자이어야 하고, 목적이 근로조건의 향상을 위한 노사 간의 자치적 교섭을 조성하는 데에 있어야 하며, 사용자가 근로자의 근로조건 개선에 관한 구체적인 요구에 대하여 단체교섭을 거부하였을 때 개시하되 특별한 사정이 없는 한 조합원의 찬성결정 등 법령이 규정한 절차를 거쳐야 하고, 수단과 방법이 사용자의 재산권과 조화를 이루어야 함은 물론 폭력의 행사에 해당되지 아니하여야 한다는 조건을 모두 구비하여야 한다. ② 이러한 기준은 쟁의행위의 목적을 알리는 등 적법한 쟁의행위에 통상 수반되는 부수적 행위가 형법상 정당행위에 해당하는지 여부를 판단할 때에도 동일하게 적용된다(2019도10516).\n\n[제6절 참고 - 정당행위 조문] 형법 제20조(정당행위): 법령에 의한 행위 또는 업무로 인한 행위 기타 사회상규에 위배되지 아니하는 행위는 벌하지 아니한다.", "위법성론"],
["365", "조합원들의 생산라인 점거의 범위가 직장 또는 사업장시설의 일부분이고 사용자 측의 출입이나 관리지배를 배제하지 않는 병존적인 점거에 지나지 않는 경우, 조합원들의 생산라인 점거는 정당한 쟁의행위로 볼 수 있다.", true, "▸ ① 직장 또는 사업장시설의 점거는 그 점거의 범위가 직장 또는 사업장시설의 일부분이고 사용자측의 출입이나 관리지배를 배제하지 않는 병존적인 점거에 지나지 않을 때에는 정당한 쟁의행위로 볼 수 있으나, ② 이와 달리 직장 또는 사업장시설을 전면적·배타적으로 점거하여 조합원 이외의 자의 출입을 저지하거나 사용자측의 관리지배를 배제하여 업무의 중단 또는 혼란을 야기케 하는 것과 같은 행위는 이미 정당성의 한계를 벗어난 것이라고 볼 수밖에 없다(2007도5204).\n\n[제6절 참고 - 정당행위 조문] 형법 제20조(정당행위): 법령에 의한 행위 또는 업무로 인한 행위 기타 사회상규에 위배되지 아니하는 행위는 벌하지 아니한다.", "위법성론"],
["366", "근로자들이 집단적으로 근로제공을 거부하여 사용자의 정상적인 업무 운영을 저해하고 손해를 발생하게 한 행위는 당연히 업무방해죄의 위력에 해당되고 노동관계 법령에 따른 정당한 쟁의행위로서 위법성이 조각되는 경우가 아닌 한 업무방해죄로 처벌된다.[변13]", false, "▸ 쟁의행위로서 파업이 언제나 업무방해죄에 해당하는 것으로 볼 것은 아니고, 전후 사정과 경위 등에 비추어 사용자가 예측할 수 없는 시기에 전격적으로 이루어져 사용자의 사업운영에 심대한 혼란 내지 막대한 손해를 초래하는 등으로 사용자의 사업계속에 관한 자유의사가 제압·혼란될 수 있다고 평가할 수 있는 경우에 비로소 집단적 노무제공의 거부가 위력에 해당하여 업무방해죄가 성립한다(2007도5204).\n\n[제6절 참고 - 정당행위 조문] 형법 제20조(정당행위): 법령에 의한 행위 또는 업무로 인한 행위 기타 사회상규에 위배되지 아니하는 행위는 벌하지 아니한다.", "위법성론"],
["367", "도급인은 원칙적으로 수급인 소속 근로자의 사용자가 아니므로, 수급인 소속 근로자의 쟁의행위가 도급인의 사업장에서 일어나 도급인의 형법상 보호되는 법익을 침해한 경우에는 사용자인 수급인에 대한 관계에서 쟁의행위의 정당성을 갖추었다는 사정만으로 사용자가 아닌 도급인에 대한 관계에서까지 법령에 의한 정당한 행위로서 법익침해의 위법성이 조각된다고 볼 수는 없다.", true, "▸ (2015도1927)\n\n[제6절 참고 - 정당행위 조문] 형법 제20조(정당행위): 법령에 의한 행위 또는 업무로 인한 행위 기타 사회상규에 위배되지 아니하는 행위는 벌하지 아니한다.", "위법성론"],
["368", "사용자인 수급인에 대한 정당성을 갖춘 쟁의행위가 도급인의 사업장에서 이루어져 형법상 보호되는 도급인의 법익을 침해한 경우, 그것이 항상 위법하다고 볼 것은 아니고, 법질서 전체의 정신이나 그 배후에 놓여있는 사회윤리 내지 사회통념에 비추어 용인될 수 있는 행위에 해당하는 경우에는 형법 제20조의 '사회상규에 위배되지 아니하는 행위'로서 위법성이 조각된다.", true, "▸ (2015도1927)\n\n[제6절 참고 - 정당행위 조문] 형법 제20조(정당행위): 법령에 의한 행위 또는 업무로 인한 행위 기타 사회상규에 위배되지 아니하는 행위는 벌하지 아니한다.", "위법성론"],
["369", "신문기자인 甲이 A에게 증여세 포탈에 대한 취재를 요구하면서 응하지 않으면 자신이 취재한 내용대로 보도하겠다고 말한 경우, 위 행위가 해악의 고지에 해당하더라도 특별한 사정이 없는 한 기사 작성을 위한 자료를 수집하고 보도하기 위한 것으로 신문기자의 일상적 업무 범위에 속하여 사회상규에 반하지 아니하는 행위로서 위법성이 조각된다.", true, "▸ [AI해설] 신문기자가 취재에 응하지 않으면 취재한 내용대로 보도하겠다고 말한 행위가 해악의 고지에 해당하더라도, 특별한 사정이 없는 한 기사 작성을 위한 자료 수집·보도를 위한 것으로 신문기자의 일상적 업무 범위에 속하여 사회상규에 반하지 아니하는 행위로서 위법성이 조각된다는 것이 판례의 태도이다(2011도639).\n\n[제6절 참고 - 정당행위 조문] 형법 제20조(정당행위): 법령에 의한 행위 또는 업무로 인한 행위 기타 사회상규에 위배되지 아니하는 행위는 벌하지 아니한다.", "위법성론"],
["370", "성직자가 죄지은 자를 능동적으로 고발하지 않는 것에 그치지 아니하고 은신처마련, 도피자금 제공등 범인을 적극적으로 은닉·도피케 하는 행위는 사제의 정당한 직무에 속하는 것이라고 할 수 없어 정당행위로 위법성이 조각되지 않는다.", true, "▸ [AI해설] 성직자가 죄지은 자를 능동적으로 고발하지 않는 데 그치지 않고 은신처 마련, 도피자금 제공 등 범인을 적극적으로 은닉·도피케 하는 행위는 사제의 정당한 직무에 속한다고 할 수 없어 정당행위로 위법성이 조각되지 않는다는 것이 판례의 태도이다(82도3248).\n\n[제6절 참고 - 정당행위 조문] 형법 제20조(정당행위): 법령에 의한 행위 또는 업무로 인한 행위 기타 사회상규에 위배되지 아니하는 행위는 벌하지 아니한다.", "위법성론"],
["371", "「형법」 제20조의 '사회상규에 위배되지 아니하는 행위'는 「형법」 제21조부터 제24조까지의 개별적 위법성조각사유가 인정되지 않고 법령이나 업무로 인한 행위로 포섭되기 어려운 경우 적용되는 일반적 위법성조각사유이다.[모25]", true, "▸ [AI해설] 형법 제20조의 '사회상규에 위배되지 아니하는 행위'는 형법 제21조부터 제24조까지의 개별적 위법성조각사유가 인정되지 않고 법령이나 업무로 인한 행위로 포섭되기 어려운 경우 적용되는 일반적 위법성조각사유라는 것이 판례의 태도이다(2017도2760).\n\n[제6절 참고 - 정당행위 조문] 형법 제20조(정당행위): 법령에 의한 행위 또는 업무로 인한 행위 기타 사회상규에 위배되지 아니하는 행위는 벌하지 아니한다.", "위법성론"],
["372", "형법 제20조가 사회상규에 위배되지 아니하는 행위는 처벌하지 아니한다고 규정한 것은 사회상규 개념을 가장 기본적인 위법성 판단의 기준으로 삼아 이를 명문화한 것이다.", true, "▸ [AI해설] 형법 제20조가 사회상규에 위배되지 아니하는 행위는 처벌하지 아니한다고 규정한 것은 사회상규 개념을 가장 기본적인 위법성 판단의 기준으로 삼아 이를 명문화한 것이라는 것이 판례의 태도이다(82도357).\n\n[제6절 참고 - 정당행위 조문] 형법 제20조(정당행위): 법령에 의한 행위 또는 업무로 인한 행위 기타 사회상규에 위배되지 아니하는 행위는 벌하지 아니한다.", "위법성론"],
["373", "★ 「형법」 제20조의 '사회상규에 위배되지 아니하는 행위'라 함은 국가질서의 존중이라는 인식을 바탕으로 한 국민일반의 건전한 도의적 감정에 반하지 아니한 행위로서, 초법규적인 기준에 의해 평가되어서는 안 된다.", false, "▸ 사회상규에 반하지 않는 행위라 함은 국가질서의 존중이라는 인식을 바탕으로 한 국민일반의 건전한 도의적 감정에 반하지 아니한 행위로서 초법규적인 기준에 의하여 이를 평가할 것이다(83도2224).\n\n[제6절 참고 - 정당행위 조문] 형법 제20조(정당행위): 법령에 의한 행위 또는 업무로 인한 행위 기타 사회상규에 위배되지 아니하는 행위는 벌하지 아니한다.", "위법성론"],
["374", "★ 어떠한 행위가 위법성조각사유로서의 정당행위나 정당방위가 되는지의 여부는 구체적인 경우에 따라 합목적적, 합리적으로 가려야 하고 또 행위의 적법 여부는 국가질서를 벗어나서 이를 가릴 수 없는 것이다.", true, "▸ 어떠한 행위가 위법성조각사유로서의 정당행위나 정당방위가 되는지의 여부는 구체적인 경우에 따라 합목적적, 합리적으로 가려야 하고 또 행위의 적법 여부는 국가질서를 벗어나서 이를 가릴 수 없는 것이다(92도1520).\n\n[제6절 참고 - 정당행위 조문] 형법 제20조(정당행위): 법령에 의한 행위 또는 업무로 인한 행위 기타 사회상규에 위배되지 아니하는 행위는 벌하지 아니한다.", "위법성론"],
["375", "사회상규에 의한 정당행위를 인정하려면, 그 행위의 동기나 목적의 정당성, 행위의 수단이나 방법의 상당성, 보호이익과 침해이익과의 법익균형성, 긴급성, 그 행위 외에 다른 수단이나 방법이 없다는 보충성 등의 요건을 갖추어야 한다.", true, "▸ 사회상규에 의한 정당행위를 인정하려면, ① 행위의 동기나 목적의 정당성, ② 행위의 수단이나 방법의 상당성, ③ 보호이익과 침해이익과의 법익균형성, ④ 긴급성, ⑤ 그 행위 외에 다른 수단이나 방법이 없다는 보충성 등의 요건을 갖추어야 한다(2017도2760).\n\n[제6절 참고 - 정당행위 조문] 형법 제20조(정당행위): 법령에 의한 행위 또는 업무로 인한 행위 기타 사회상규에 위배되지 아니하는 행위는 벌하지 아니한다.", "위법성론"],
["376", "행위의 긴급성과 보충성은 목적의 정당성을 판단할 때 고려요소의 하나로 참작하여야 하고, 이를 넘어 독립적인 요건으로 요구할 것은 아니다.", false, "▸ 행위의 긴급성과 보충성은 수단의 상당성을 판단할 때 고려요소의 하나로 참작하여야 하고 이를 넘어 독립적인 요건으로 요구할 것은 아니다(2017도2760).\n\n[제6절 참고 - 정당행위 조문] 형법 제20조(정당행위): 법령에 의한 행위 또는 업무로 인한 행위 기타 사회상규에 위배되지 아니하는 행위는 벌하지 아니한다.", "위법성론"],
["377", "행위의 긴급성과 보충성은 다른 실효성 있는 적법한 수단이 없는 경우를 의미하고, '일체의 법률적인 적법한 수단이 존재하지 않을 것'을 의미하는 것은 아니다.", true, "▸ 행위의 긴급성과 보충성의 내용 역시 다른 실효성 있는 적법한 수단이 없는 경우를 의미하고 '일체의 법률적인 적법한 수단이 존재하지 않을 것'을 의미하는 것은 아니다(2017도2760).\n\n[제6절 참고 - 정당행위 조문] 형법 제20조(정당행위): 법령에 의한 행위 또는 업무로 인한 행위 기타 사회상규에 위배되지 아니하는 행위는 벌하지 아니한다.", "위법성론"],
["378", "보호이익과 침해이익 사이의 법익균형은 결과의 측면에서 사회상규에 위배되는지를 판단하기 위한 기준이다.", true, "▸ ① 목적의 정당성과 수단의 상당성 요건은 '행위'의 측면에서 사회상규의 판단기준이 된다. ② 보호이익과 침해이익 사이의 법익균형은 '결과'의 측면에서 사회상규에 위배되는지를 판단하기 위한 기준이다(2017도2760).\n\n[제6절 참고 - 정당행위 조문] 형법 제20조(정당행위): 법령에 의한 행위 또는 업무로 인한 행위 기타 사회상규에 위배되지 아니하는 행위는 벌하지 아니한다.", "위법성론"],
["379", "아내가 남편과의 이혼소송 중, 남편이 내연녀의 방에서 간통을 할 것이라는 추측 하에 이혼소송에 사용할 증거를 확보하기 위하여 그 현장사진을 촬영할 목적으로 그 방에 침입한 행위는 「형법」 제20조의 정당행위에 해당한다.[모25]", false, "▸ 간통 현장을 직접 목격하고 그 사진을 촬영하기 위하여 상간자의 주거에 침입한 행위는 사회상규에 위배되지 아니하는 행위에 해당하지 않는다(2003도3000).\n\n[제6절 참고 - 정당행위 조문] 형법 제20조(정당행위): 법령에 의한 행위 또는 업무로 인한 행위 기타 사회상규에 위배되지 아니하는 행위는 벌하지 아니한다.", "위법성론"],
["380", "피고인(34세)이 실내 어린이 놀이터에서 자신의 딸(4세)에게 피해자 A(2세)가 접근하여 갑자기 딸의 눈 쪽을 향해 오른손을 뻗자 A의 얼굴을 왼손으로 밀어 넘어뜨려 폭행한 경우, 피고인의 이러한 행위는 딸에 대한 A의 돌발적인 공격을 막기 위한 본능적이고 소극적인 방어행위라고 평가할 수 있더라도, 30세의 성인이 3세의 유아인 A의 얼굴에 대한 폭행으로 그 침해를 방위하는 것은 그 수단이 상당한 범위를 벗어난 것으로, 이를 정당행위에 해당한다고 보기는 어렵다.", false, "▸ 피고인의 이러한 행위는 피해자의 갑작스런 행동에 놀라서 자신의 어린 딸이 다시 얼굴에 상처를 입지 않도록 보호하기 위한 것으로 딸에 대한 피해자의 돌발적인 공격을 막기 위한 본능적이고 소극적인 방어행위라고 평가할 수 있고, 따라서 이를 사회상규에 위배되는 행위라고 보기는 어렵다고 할 것이다(2012도11204).\n\n[제6절 참고 - 정당행위 조문] 형법 제20조(정당행위): 법령에 의한 행위 또는 업무로 인한 행위 기타 사회상규에 위배되지 아니하는 행위는 벌하지 아니한다.", "위법성론"],
["381", "피해자가 양손으로 피고인의 넥타이를 잡고 늘어져 후경부피하출혈상을 입을 정도로 목이 졸리게 된 피고인이 피해자를 떼어놓기 위하여 왼손으로 자신의 목 부근 넥타이를 잡은 상태에서 오른손으로 피해자의 손을 잡아 비틀면서 서로 밀고 당기고 하였다면, 피고인의 그와 같은 행위는 목이 졸린 상태에서 벗어나기 위한 소극적인 저항행위에 불과하여 형법 제20조 소정의 정당행위에 해당하여 죄가 되지 아니한다.", true, "▸ [AI해설] 목이 졸린 상태에서 벗어나기 위해 상대방의 손을 잡아 비틀며 밀고 당긴 행위는 소극적인 저항행위에 불과하여 형법 제20조 소정의 정당행위에 해당하여 죄가 되지 않는다는 것이 판례의 태도이다(96도979).\n\n[제6절 참고 - 정당행위 조문] 형법 제20조(정당행위): 법령에 의한 행위 또는 업무로 인한 행위 기타 사회상규에 위배되지 아니하는 행위는 벌하지 아니한다.", "위법성론"],
["382", "골프경기를 하던 중 골프공을 쳐서 아무도 예상하지 못한 자신의 등 뒤편으로 보내어 등 뒤에 있던 경기보조원(캐디)에게 상해를 입힌 경우에는 주의의무를 현저히 위반하여 사회적 상당성의 범위를 벗어난 행위로서 과실치상죄가 성립한다.", true, "▸ 운동경기에 참가하는 자가 경기규칙을 준수하는 중에 또는 그 경기의 성격상 당연히 예상되는 정도의 경미한 규칙위반 속에 제3자에게 상해의 결과를 발생시킨 것으로서, 사회적 상당성의 범위를 벗어나지 아니하는 행위라면 과실치상죄가 성립하지 않는다(2008도6940). [다만 사안은 과실치상죄 성립]\n\n[제6절 참고 - 정당행위 조문] 형법 제20조(정당행위): 법령에 의한 행위 또는 업무로 인한 행위 기타 사회상규에 위배되지 아니하는 행위는 벌하지 아니한다.", "위법성론"],
["383", "의료행위에 해당하는 어떠한 시술행위가 무면허로 행하여졌을 때에는 그 시술행위의 위험성 정도, 시술행위로 인한 부작용 내지 위험발생 가능성 등을 종합적으로 고려하여, 법질서 전체의 정신이나 그 배후에 놓여 있는 사회윤리 내지 사회통념에 비추어 용인될 수 있는 행위에 해당한다고 인정되는 경우에만, 사회상규에 위배되지 아니하는 행위로서 위법성이 조각된다.[모25]", true, "▸ [AI해설] 무면허 시술행위는 그 위험성 정도, 부작용 내지 위험발생 가능성 등을 종합적으로 고려하여 법질서 전체의 정신이나 사회윤리·사회통념에 비추어 용인될 수 있는 행위로 인정되는 경우에만 사회상규에 위배되지 않는 행위로서 위법성이 조각된다는 것이 판례의 태도이다(2005도8317).\n\n[제6절 참고 - 정당행위 조문] 형법 제20조(정당행위): 법령에 의한 행위 또는 업무로 인한 행위 기타 사회상규에 위배되지 아니하는 행위는 벌하지 아니한다.", "위법성론"],
["384", "피고인이 한의사 자격이나 이에 관한 면허도 없이 영리를 목적으로 환부에 부항침으로 10회 정도 찌르고 다시 부항을 뜨는 방법으로 치료행위를 하면서 부항침과 부항을 이용하여 체내의 혈액을 밖으로 배출되도록 한 것이라면 이러한 피고인의 시술행위는 사회상규에 위배되지 아니하는 행위로 볼 수 없다.", true, "▸ [AI해설] 한의사 자격 없이 영리 목적으로 부항침으로 환부를 찔러 혈액을 배출시키는 시술행위는 사회상규에 위배되지 아니하는 행위로 볼 수 없다는 것이 판례의 태도이다(2004도3405).\n\n[제6절 참고 - 정당행위 조문] 형법 제20조(정당행위): 법령에 의한 행위 또는 업무로 인한 행위 기타 사회상규에 위배되지 아니하는 행위는 벌하지 아니한다.", "위법성론"],
["385", "간호사인 피고인이 의사가 입회하지 아니한 채 '환자의 사망의 징후를 확인하고, 이를 바탕으로 환자의 유족들에게 사망진단서 등을 작성·발급한 행위'는 무면허의료행위이나 사회상규에 위배되지 않아 위법성이 조각될 수 있다.[모25]", false, "▸ ① 의료법 제17조 제1항은 사망진단서의 작성·교부 주체를 의사 등으로 한정하고 있다. 사망의 진단은 의사 등이 환자의 사망 당시 또는 사후에라도 현장에 입회해서 직접 환자를 대면하여 수행하여야 하는 의료행위이고, 간호사는 의사 등의 개별적 지도·감독이 있더라도 사망의 진단을 할 수 없다. ② 따라서 의사가 간호사인 피고인에게 사망진단서를 작성하여 유족에게 교부하게 한 경우, 간호사는 의료법위반죄의 정범, 의사는 의료법위반죄의 교사범이 성립한다(2017도10007). [정당행위 X]\n\n[제6절 참고 - 정당행위 조문] 형법 제20조(정당행위): 법령에 의한 행위 또는 업무로 인한 행위 기타 사회상규에 위배되지 아니하는 행위는 벌하지 아니한다.", "위법성론"],
["386", "사채업자 甲이 채무자 A에게 채무를 변제하지 않으면 A가 숨기고 싶어하는 과거 행적과 사채를 쓴 사실 등을 남편과 시댁에 알리겠다는 등의 문자메시지를 발송한 경우, 위 행위는 사회통념상 용인되는 범위를 넘지 않는 것이어서 협박죄가 성립하지 않는다.[변23]", false, "▸ 피고인이 정당한 절차와 방법을 통해 그 권리를 행사하지 아니하고 피해자에게 위와 같이 해악을 고지한 것이 사회의 관습이나 윤리관념 등 사회통념에 비추어 용인할 수 있는 정도의 것이라고 볼 수는 없다(2011도2412).\n\n[제6절 참고 - 정당행위 조문] 형법 제20조(정당행위): 법령에 의한 행위 또는 업무로 인한 행위 기타 사회상규에 위배되지 아니하는 행위는 벌하지 아니한다.", "위법성론"],
["387", "차임이나 관리비를 단 1회도 연체한 적이 없는 피해자가 임대차계약의 종료 후 임대료와 관리비를 인상하는 내용의 갱신계약 여부에 관한 의사표시나 명도의무를 지체하고 있다는 이유만으로 그 종료일로부터 16일 만에 피해자의 사무실에 대하여 단전조치를 취한 피고인의 행위는 사회상규에 위배되지 아니하는 정당행위에 해당하지 않는다.", true, "▸ [AI해설] 차임 등을 연체한 적 없는 임차인에 대해 갱신계약이나 명도의무 지체를 이유로 계약종료일로부터 16일 만에 단전조치를 취한 행위는 사회상규에 위배되지 아니하는 정당행위에 해당하지 않는다는 것이 판례의 태도이다(2005도8074).\n\n[제6절 참고 - 정당행위 조문] 형법 제20조(정당행위): 법령에 의한 행위 또는 업무로 인한 행위 기타 사회상규에 위배되지 아니하는 행위는 벌하지 아니한다.", "위법성론"],
["388", "★ 호텔 내 주점의 임대인이 임차인의 차임 연체를 이유로 계약서상 규정에 따라 주점에 대하여 단전·단수를 조치한 경우, 약정 기간이 만료되지 않았고 임대차보증금도 상당한 액수가 남아있는 상태이더라도 계약해지의 의사표시와 경고를 한 후 단전·단수를 하였다면 정당행위로 볼 수 있다.[모25]", false, "▸ 호텔 내 주점의 임대인이 임차인의 차임 연체를 이유로 계약서상 규정에 따라 위 주점에 대하여 단전·단수조치를 취한 경우, ① 약정 기간이 만료되었고 임대차보증금도 차임 연체 등으로 공제되어 이미 남아 있지 않은 상태에서 미리 예고한 후 단전·단수조치를 하였다면 형법 제20조의 정당행위에 해당하지만, ② 약정 기간이 만료되지 않았고 임대차보증금도 상당한 액수가 남아있는 상태에서 계약해지의 의사표시와 경고만을 한 후 단전·단수조치를 하였다면 정당행위로 볼 수 없다(2006도9157).\n\n[제6절 참고 - 정당행위 조문] 형법 제20조(정당행위): 법령에 의한 행위 또는 업무로 인한 행위 기타 사회상규에 위배되지 아니하는 행위는 벌하지 아니한다.", "위법성론"],
["389", "甲이 군무기피의 목적이 있었으나 국군보안사령부의 민간인에 대한 정치사찰을 폭로한다는 명목으로 군무를 이탈한 경우 甲의 행위는 위법성이 조각된다.[변17]", false, "▸ 국군보안사령부의 민간인에 대한 정치사찰을 폭로한다는 명목으로 군무를 이탈한 행위가 정당방위나 정당행위에 해당하지 아니한다(93도766).\n\n[제6절 참고 - 정당행위 조문] 형법 제20조(정당행위): 법령에 의한 행위 또는 업무로 인한 행위 기타 사회상규에 위배되지 아니하는 행위는 벌하지 아니한다.", "위법성론"],
["390", "도의적 책임론은 형사책임의 근거를 행위자의 자유의사에서 찾으며, 가벌성 판단에서 행위보다 행위자에 중점을 두는 주관주의 책임론의 입장이다.", false, "▸ 도의적 책임론은 자유의사에 반한 위법한 의사형성에 책임의 근거가 있다는 견해로 행위자의 개인적 특성을 고려하지 않고 행위만이 문제된다. 객관주의 책임론과 연결된다. 그리고 책임능력은 범죄능력을 의미한다.", "책임론"],
["391", "도의적 책임론은 행위자가 과거에 잘못된 성격을 형성한 성격책임에서 책임의 근거를 찾고 있다.", false, "▸ 도의적 책임론은 자유의사에 반한 위법한 의사형성에 책임의 근거가 있다는 견해로 행위자의 개인적 특성을 고려하지 않고 행위만이 문제된다. 객관주의 책임론과 연결된다. 그리고 책임능력은 범죄능력을 의미한다.", "책임론"],
["392", "사회적 책임론에 따르면, 책임의 근거는 행위자의 반사회적 성격에 있으므로 사회생활을 하고 있는 책임무능력자에 대하여도 사회방위를 위해 보안처분을 가하여야 한다. 이러한 의미에서 책임능력은 형벌능력을 의미한다.", true, "▸ 사회적 책임론은 책임의 근거를 소질과 환경에 의해서 결정된 행위자의 반사회적 성격에 있으며, 책임이란 반사회적 성격에 대하여 가하여지는 사회적 비난이라고 본다.", "책임론"],
["393", "기능적 책임론에 따르면, 책임의 내용은 형벌의 목적, 특히 일반예방의 목적에 따라 결정되어야 하며, 책임은 예방의 필요성을 한계로 하고 예방의 필요성도 책임형벌을 제한함으로써 책임과 예방의 상호제한적 기능을 인정한다.", true, "▸ 기능적 책임론이란 책임의 내용은 형벌의 목적, 특히 일반예방의 목적에 의하여 결정되어야 한다는 책임이론이다. 이 이론은 규범적 책임론과 마찬가지로 책임을 비난가능성이라고 이해하며, 인간의 자유의사를 긍정하는 도의적 책임론과 대비되는 이론이라고 할 수 있다. 기능적 책임론은 형법과 형사정책의 관계를 혼동함으로써 책임주의를 무의미하게 만든다는 비판을 받는다.", "책임론"],
["394", "심리적 책임론에 따르면, 책임의 본질은 결과에 대한 인식과 의사인 고의 또는 결과를 인식하지 못한 과실에 있으며, 범죄 성립의 모든 객관적·외적 요소는 구성요건과 위법성 단계에, 주관적·내적 요소는 책임단계에 배치한다.", true, "▸ 심리적 책임론은 책임의 본질이 위법행위에 대한 심리적 관계인 고의·과실에 있다고 하면서 고의와 과실을 책임형식으로 이해한다.", "책임론"],
["395", "적법행위에 대한 기대가능성이 없으면 책임을 물을 수 없다는 것이 규범적 책임론의 입장이다.", true, "▸ 규범적 책임론에 따르면, 책임의 구성요소는 행위자의 감정세계와 구성요건에 해당하는 결과 사이의 심리적 결합이 아니라 행위자의 적법행위가 요구되었음에도 불구하고 위법행위를 하였다는 환경의 평가에 있으므로, 책임은 구성요건에 해당하는 불법행위에 대한 비난가능성이다(평가적 가치판단).", "책임론"],
["396", "규범적 책임론은 행위자유를 부정하는 결정주의, 예방적 책임론은 행위자유를 긍정하는 비결정주의에 근거를 두고 있다.", false, "▸ ① 예방적 책임론(기능적 책임론)은 책임은 행위자에 대한 비난가능성이라는 규범적 요소 이외에 일반예방·특별예방이라는 형벌의 목적도 함께 고려해야 한다는 견해이다. ② 책임의 근거는 인간의 '자유의사'에 있다는 견해는 도의적 책임론이고(비결정론), 인간의 '자유의사'를 부정하고 인간은 환경과 소질에 의하여 결정된다는 견해는 사회적 책임론이다(결정론).", "책임론"],
["397", "자연인인 이상 연령이나 책임능력의 유무를 불문하고 형사미성년자와 정신병자도 행위의 주체가 될 수 있다.", true, "▸ 자연인은 연령·책임능력 유무와 상관없이 행위의 주체가 된다. 다만, 책임능력이 없으면 책임이 조각될 뿐이다.\n\n[제2절 참고 - 책임능력 조문] 형법 제9조(형사미성년자): 14세 되지 아니한 자의 행위는 벌하지 아니한다. 형법 제10조(심신장애인) ① 심신장애로 인하여 사물을 변별할 능력이 없거나 의사를 결정할 능력이 없는 자의 행위는 벌하지 아니한다. ② 심신장애로 인하여 전항의 능력이 미약한 자의 행위는 형을 감경할 수 있다. ③ 위험의 발생을 예견하고 자의로 심신장애를 야기한 자의 행위에는 전 2항의 규정을 적용하지 아니한다.", "책임론"],
["398", "형법은 제9조에서는 '연령(14세)', 제10조에서는 '심신장애'라는 문언을 통해 심리학적 평가방법을 채택하고 있다.", false, "▸ 형법 제10조는 심리학적 평가방법을 채택하고 있으나, 제9조(형사미성년자)는 생물학적 연령을 기준으로 하고 있으므로 심리학적 평가방법이 아니다.\n\n[제2절 참고 - 책임능력 조문] 형법 제9조(형사미성년자): 14세 되지 아니한 자의 행위는 벌하지 아니한다. 형법 제10조(심신장애인) ① 심신장애로 인하여 사물을 변별할 능력이 없거나 의사를 결정할 능력이 없는 자의 행위는 벌하지 아니한다. ② 심신장애로 인하여 전항의 능력이 미약한 자의 행위는 형을 감경할 수 있다. ③ 위험의 발생을 예견하고 자의로 심신장애를 야기한 자의 행위에는 전 2항의 규정을 적용하지 아니한다.", "책임론"],
["399", "음주 또는 약물로 인한 심신장애 상태에서 공연음란죄를 저지른 자는 「형법」 제10조 제1항 및 제2항을 적용하지 아니할 수 있다.", false, "▸ ① 음주 또는 약물로 인한 심신장애 상태에서 성폭력범죄(제2조 제1항 제1호의 죄는 제외한다)를 범한 때에는 「형법」 제10조 제1항·제2항 및 제11조를 적용하지 아니할 수 있다(성폭법 제20조). ② 공연음란죄, 음행매개죄, 음화반포죄, 음화제조죄는 성폭법상 제20조가 적용되지 않는다. 따라서 형법 제10조 제1항 및 제2항을 적용해야 한다. ③ 특수강간죄는 성폭법상 제20조가 적용되지만, 형법 제10조 제1항 및 제2항을 적용하지 '아니할 수' 있다.\n\n[제2절 참고 - 책임능력 조문] 형법 제9조(형사미성년자): 14세 되지 아니한 자의 행위는 벌하지 아니한다. 형법 제10조(심신장애인) ① 심신장애로 인하여 사물을 변별할 능력이 없거나 의사를 결정할 능력이 없는 자의 행위는 벌하지 아니한다. ② 심신장애로 인하여 전항의 능력이 미약한 자의 행위는 형을 감경할 수 있다. ③ 위험의 발생을 예견하고 자의로 심신장애를 야기한 자의 행위에는 전 2항의 규정을 적용하지 아니한다.", "책임론"],
["400", "음주 또는 약물로 인한 심신장애 상태에서 특수강간죄를 범한 때에는 「형법」 제10조 제1항 및 제2항을 적용하지 아니한다.", false, "▸ ① 음주 또는 약물로 인한 심신장애 상태에서 성폭력범죄(제2조 제1항 제1호의 죄는 제외한다)를 범한 때에는 「형법」 제10조 제1항·제2항 및 제11조를 적용하지 아니할 수 있다(성폭법 제20조). ② 공연음란죄, 음행매개죄, 음화반포죄, 음화제조죄는 성폭법상 제20조가 적용되지 않는다. 따라서 형법 제10조 제1항 및 제2항을 적용해야 한다. ③ 특수강간죄는 성폭법상 제20조가 적용되지만, 형법 제10조 제1항 및 제2항을 적용하지 '아니할 수' 있다.\n\n[제2절 참고 - 책임능력 조문] 형법 제9조(형사미성년자): 14세 되지 아니한 자의 행위는 벌하지 아니한다. 형법 제10조(심신장애인) ① 심신장애로 인하여 사물을 변별할 능력이 없거나 의사를 결정할 능력이 없는 자의 행위는 벌하지 아니한다. ② 심신장애로 인하여 전항의 능력이 미약한 자의 행위는 형을 감경할 수 있다. ③ 위험의 발생을 예견하고 자의로 심신장애를 야기한 자의 행위에는 전 2항의 규정을 적용하지 아니한다.", "책임론"],
["401", "심신장애로 인하여 사물을 변별할 능력이나 의사를 결정할 능력이 미약한 자의 행위는 형을 감경하여야 한다.", false, "▸ 형법이 개정되어 심신미약은 임의적 감경사유이다.\n\n[제2절 참고 - 책임능력 조문] 형법 제9조(형사미성년자): 14세 되지 아니한 자의 행위는 벌하지 아니한다. 형법 제10조(심신장애인) ① 심신장애로 인하여 사물을 변별할 능력이 없거나 의사를 결정할 능력이 없는 자의 행위는 벌하지 아니한다. ② 심신장애로 인하여 전항의 능력이 미약한 자의 행위는 형을 감경할 수 있다. ③ 위험의 발생을 예견하고 자의로 심신장애를 야기한 자의 행위에는 전 2항의 규정을 적용하지 아니한다.", "책임론"],
["402", "심신상실을 이유로 처벌받지 아니하거나 심신미약을 이유로 형벌이 감경될 수 있는 자라 할지라도 금고 이상의 형에 해당하는 죄를 지은 자에 대해서는 치료감호시설에서 치료를 받을 필요가 있고 재범의 위험성이 있는 경우 치료감호의 대상이 된다.[변22]", true, "▸ 치료감호 등에 관한 법률 제2조 제1항 제1호\n\n[제2절 참고 - 책임능력 조문] 형법 제9조(형사미성년자): 14세 되지 아니한 자의 행위는 벌하지 아니한다. 형법 제10조(심신장애인) ① 심신장애로 인하여 사물을 변별할 능력이 없거나 의사를 결정할 능력이 없는 자의 행위는 벌하지 아니한다. ② 심신장애로 인하여 전항의 능력이 미약한 자의 행위는 형을 감경할 수 있다. ③ 위험의 발생을 예견하고 자의로 심신장애를 야기한 자의 행위에는 전 2항의 규정을 적용하지 아니한다.", "책임론"],
["403", "심신상실자는 정신적 또는 신체적 장애로 인하여 사물을 변별할 능력이나 의사결정의 능력이 결여된 자를 말한다.", false, "▸ 형법 제10조에 규정된 심신장애는 정신병 또는 비정상적 정신상태와 같은 정신적 장애가 있는 외에 이와 같은 정신적 장애로 말미암아 사물에 대한 변별능력이나 그에 따른 행위통제능력이 결여 또는 감소되었음을 요한다(2012도12689). [심신(心神)장애는 정신장애를 의미하고, 신체적 장애는 포함되지 않는다.]\n\n[제2절 참고 - 책임능력 조문] 형법 제9조(형사미성년자): 14세 되지 아니한 자의 행위는 벌하지 아니한다. 형법 제10조(심신장애인) ① 심신장애로 인하여 사물을 변별할 능력이 없거나 의사를 결정할 능력이 없는 자의 행위는 벌하지 아니한다. ② 심신장애로 인하여 전항의 능력이 미약한 자의 행위는 형을 감경할 수 있다. ③ 위험의 발생을 예견하고 자의로 심신장애를 야기한 자의 행위에는 전 2항의 규정을 적용하지 아니한다.", "책임론"],
["404", "★ 정신적 장애가 있는 자라고 하여도 범행 당시 정상적인 사물판별능력이나 행위통제능력이 있었다면 「형법」 제10조에 규정된 심신장애에 해당한다고 볼 수 없다.[변25]", true, "▸ 심신장애는 생물학적 요소로서 정신병 또는 비정상적 정신상태와 같은 정신적 장애가 있는 외에 심리학적 요소로서 이와 같은 정신적 장애로 말미암아 사물에 대한 변별능력과 그에 따른 행위통제능력이 결여되거나 감소되었음을 요하므로, 정신적 장애가 있는 자라고 하여도 범행 당시 정상적인 사물변별능력이나 행위통제능력이 있었다면 심신장애로 볼 수 없다(2018도7658).\n\n[제2절 참고 - 책임능력 조문] 형법 제9조(형사미성년자): 14세 되지 아니한 자의 행위는 벌하지 아니한다. 형법 제10조(심신장애인) ① 심신장애로 인하여 사물을 변별할 능력이 없거나 의사를 결정할 능력이 없는 자의 행위는 벌하지 아니한다. ② 심신장애로 인하여 전항의 능력이 미약한 자의 행위는 형을 감경할 수 있다. ③ 위험의 발생을 예견하고 자의로 심신장애를 야기한 자의 행위에는 전 2항의 규정을 적용하지 아니한다.", "책임론"],
["405", "★ 甲은 유치원생인 여자아이 앞에서 공연음란행위를 하였다. 甲에게 생물학적으로 보아 정신병, 정신박약 등과 같은 심신장애가 있는 경우, 또는 심리학적으로 보아 사물에 대한 판별능력과 그에 따른 행위통제능력이 결여되거나 감소된 경우 중에서 어느 하나에 해당하면 「형법」 제10조(심신장애인) 제1항 내지 제2항이 적용된다.[변15]", false, "▸ 심신장애는 생물학적 요소로서 정신병 또는 비정상적 정신상태와 같은 정신적 장애가 있는 외에 심리학적 요소로서 이와 같은 정신적 장애로 말미암아 사물에 대한 변별능력과 그에 따른 행위통제능력이 결여되거나 감소되었음을 요하므로, 정신적 장애가 있는 자라고 하여도 범행 당시 정상적인 사물변별능력이나 행위통제능력이 있었다면 심신장애로 볼 수 없다(2018도7658).\n\n[제2절 참고 - 책임능력 조문] 형법 제9조(형사미성년자): 14세 되지 아니한 자의 행위는 벌하지 아니한다. 형법 제10조(심신장애인) ① 심신장애로 인하여 사물을 변별할 능력이 없거나 의사를 결정할 능력이 없는 자의 행위는 벌하지 아니한다. ② 심신장애로 인하여 전항의 능력이 미약한 자의 행위는 형을 감경할 수 있다. ③ 위험의 발생을 예견하고 자의로 심신장애를 야기한 자의 행위에는 전 2항의 규정을 적용하지 아니한다.", "책임론"],
["406", "반사회적 인격장애 혹은 기타 성격적 결함에 기하여 자신의 충동을 억제하지 못하여 범죄를 저지르는 경우, 특별한 사정이 없는 한 이와 같은 자에 대해서는 자신의 충동을 억제하고 법을 준수하도록 요구할 수 없다.", false, "▸ ① 자신의 절도의 충동을 억제하지 못하는 성격적 결함으로 인하여 절도 범행에 이르게 되었다고 하더라도, 특단의 사정이 없는 한 위와 같은 성격적 결함을 가진 자에 대하여 자신의 충동을 억제하고 법을 준수하도록 요구하는 것이 기대할 수 없는 행위를 요구하는 것이라고는 할 수 없다. ② 원칙적으로 충동조절장애와 같은 성격적 결함은 형의 감면사유인 심신장애에 해당하지 않는다. ③ 다만 성격적 결함이 매우 심각하여 원래의 의미의 정신병을 가진 사람과 동등하다고 평가할 수 있다든지, 또는 다른 심신장애사유와 경합된 경우에는 심신장애를 인정할 여지가 있을 것이다(94도3163).\n\n[제2절 참고 - 책임능력 조문] 형법 제9조(형사미성년자): 14세 되지 아니한 자의 행위는 벌하지 아니한다. 형법 제10조(심신장애인) ① 심신장애로 인하여 사물을 변별할 능력이 없거나 의사를 결정할 능력이 없는 자의 행위는 벌하지 아니한다. ② 심신장애로 인하여 전항의 능력이 미약한 자의 행위는 형을 감경할 수 있다. ③ 위험의 발생을 예견하고 자의로 심신장애를 야기한 자의 행위에는 전 2항의 규정을 적용하지 아니한다.", "책임론"],
["407", "충동조절장애와 같은 성격적 결함은 원칙적으로 「형법」 제10조 제1항 및 제2항이 정한 심신장애에 해당하지 않지만, 그러한 성격적 결함이 매우 심각하여 원래의 의미의 정신병을 가진 사람과 동등하다고 평가할 수 있거나 다른 심신장애사유와 경합된 경우에는 심신장애를 인정할 수 있다.", true, "▸ ① 자신의 절도의 충동을 억제하지 못하는 성격적 결함으로 인하여 절도 범행에 이르게 되었다고 하더라도, 특단의 사정이 없는 한 위와 같은 성격적 결함을 가진 자에 대하여 자신의 충동을 억제하고 법을 준수하도록 요구하는 것이 기대할 수 없는 행위를 요구하는 것이라고는 할 수 없다. ② 원칙적으로 충동조절장애와 같은 성격적 결함은 형의 감면사유인 심신장애에 해당하지 않는다. ③ 다만 성격적 결함이 매우 심각하여 원래의 의미의 정신병을 가진 사람과 동등하다고 평가할 수 있다든지, 또는 다른 심신장애사유와 경합된 경우에는 심신장애를 인정할 여지가 있을 것이다(94도3163).\n\n[제2절 참고 - 책임능력 조문] 형법 제9조(형사미성년자): 14세 되지 아니한 자의 행위는 벌하지 아니한다. 형법 제10조(심신장애인) ① 심신장애로 인하여 사물을 변별할 능력이 없거나 의사를 결정할 능력이 없는 자의 행위는 벌하지 아니한다. ② 심신장애로 인하여 전항의 능력이 미약한 자의 행위는 형을 감경할 수 있다. ③ 위험의 발생을 예견하고 자의로 심신장애를 야기한 자의 행위에는 전 2항의 규정을 적용하지 아니한다.", "책임론"],
["408", "충동조절장애와 같은 성격적 결함은 정신병이 아니기 때문에 그 정도에 상관없이 심신장애에 해당하지 않는다.", false, "▸ ① 자신의 절도의 충동을 억제하지 못하는 성격적 결함으로 인하여 절도 범행에 이르게 되었다고 하더라도, 특단의 사정이 없는 한 위와 같은 성격적 결함을 가진 자에 대하여 자신의 충동을 억제하고 법을 준수하도록 요구하는 것이 기대할 수 없는 행위를 요구하는 것이라고는 할 수 없다. ② 원칙적으로 충동조절장애와 같은 성격적 결함은 형의 감면사유인 심신장애에 해당하지 않는다. ③ 다만 성격적 결함이 매우 심각하여 원래의 의미의 정신병을 가진 사람과 동등하다고 평가할 수 있다든지, 또는 다른 심신장애사유와 경합된 경우에는 심신장애를 인정할 여지가 있을 것이다(94도3163).\n\n[제2절 참고 - 책임능력 조문] 형법 제9조(형사미성년자): 14세 되지 아니한 자의 행위는 벌하지 아니한다. 형법 제10조(심신장애인) ① 심신장애로 인하여 사물을 변별할 능력이 없거나 의사를 결정할 능력이 없는 자의 행위는 벌하지 아니한다. ② 심신장애로 인하여 전항의 능력이 미약한 자의 행위는 형을 감경할 수 있다. ③ 위험의 발생을 예견하고 자의로 심신장애를 야기한 자의 행위에는 전 2항의 규정을 적용하지 아니한다.", "책임론"],
["409", "성주물성애증이 있다는 사정만으로는 심신장애에 해당한다고 볼 수 없으나, 그 증상이 매우 심각하여 원래 의미의 정신병이 있는 사람과 동등하다고 평가할 수 있거나 다른 심신장애사유와 경합된 경우 등에는 심신장애를 인정할 여지가 있다.", true, "▸ ① 성주물성애증이라는 정신질환이 있다고 하더라도 그러한 사정만으로는 절도 범행에 대한 형의 감면사유인 심신장애에 해당한다고 볼 수 없다. ② 다만 그 증상이 매우 심각하여 원래의 의미의 정신병이 있는 사람과 동등하다고 평가할 수 있거나, 다른 심신장애사유와 경합된 경우 등에는 심신장애를 인정할 여지가 있다(2012도12689).\n\n[제2절 참고 - 책임능력 조문] 형법 제9조(형사미성년자): 14세 되지 아니한 자의 행위는 벌하지 아니한다. 형법 제10조(심신장애인) ① 심신장애로 인하여 사물을 변별할 능력이 없거나 의사를 결정할 능력이 없는 자의 행위는 벌하지 아니한다. ② 심신장애로 인하여 전항의 능력이 미약한 자의 행위는 형을 감경할 수 있다. ③ 위험의 발생을 예견하고 자의로 심신장애를 야기한 자의 행위에는 전 2항의 규정을 적용하지 아니한다.", "책임론"],
["410", "사춘기 이전의 소아들을 상대로 한 성행위를 중심으로 성적 흥분을 강하게 일으키는 공상, 성적 충동, 성적 행동이 반복되어 나타나는 소아기호증과 같은 질환이 있다는 사정은 그 자체만으로 형의 감면사유인 심신장애에 해당한다.", false, "▸ ① 소아기호증과 같은 질환이 있다는 사정은 그 자체만으로는 형의 감면사유인 심신장애에 해당하지 아니한다. ② 다만 그 증상이 매우 심각하여 원래의 의미의 정신병이 있는 사람과 동등하다고 평가할 수 있거나, 다른 심신장애사유와 경합된 경우 등에는 심신장애를 인정할 여지가 있다(2006도7900).\n\n[제2절 참고 - 책임능력 조문] 형법 제9조(형사미성년자): 14세 되지 아니한 자의 행위는 벌하지 아니한다. 형법 제10조(심신장애인) ① 심신장애로 인하여 사물을 변별할 능력이 없거나 의사를 결정할 능력이 없는 자의 행위는 벌하지 아니한다. ② 심신장애로 인하여 전항의 능력이 미약한 자의 행위는 형을 감경할 수 있다. ③ 위험의 발생을 예견하고 자의로 심신장애를 야기한 자의 행위에는 전 2항의 규정을 적용하지 아니한다.", "책임론"],
["411", "심신장애의 유무는 사실문제로서 그 판단에 전문감정인의 정신감정결과가 중요한 참고자료가 되기는 하나, 법원이 반드시 그 의견에 구속되는 것은 아니다.", false, "▸ 심신장애의 유무는 법원이 형벌제도의 목적 등에 비추어 판단하여야 할 '법률문제'로서 그 판단에 전문감정인의 정신감정결과가 중요한 참고자료가 되기는 하나, 법원이 반드시 그 의견에 구속되는 것은 아니고, 그러한 감정결과뿐만 아니라 범행의 경위, 수단, 범행 전후의 피고인의 행동 등 기록에 나타난 여러 자료 등을 종합하여 독자적으로 심신장애의 유무를 판단하여야 한다(2018도7658).\n\n[제2절 참고 - 책임능력 조문] 형법 제9조(형사미성년자): 14세 되지 아니한 자의 행위는 벌하지 아니한다. 형법 제10조(심신장애인) ① 심신장애로 인하여 사물을 변별할 능력이 없거나 의사를 결정할 능력이 없는 자의 행위는 벌하지 아니한다. ② 심신장애로 인하여 전항의 능력이 미약한 자의 행위는 형을 감경할 수 있다. ③ 위험의 발생을 예견하고 자의로 심신장애를 야기한 자의 행위에는 전 2항의 규정을 적용하지 아니한다.", "책임론"],
["412", "피고인이 범행을 기억하고 있지 않다는 사실만으로 바로 범행당시 심신상실 상태에 있었다고 단정할 수는 없다.", true, "▸ [AI해설] 피고인이 범행을 기억하고 있지 않다는 사실만으로 바로 범행당시 심신상실 상태에 있었다고 단정할 수는 없다는 것이 판례의 태도이다(85도361).\n\n[제2절 참고 - 책임능력 조문] 형법 제9조(형사미성년자): 14세 되지 아니한 자의 행위는 벌하지 아니한다. 형법 제10조(심신장애인) ① 심신장애로 인하여 사물을 변별할 능력이 없거나 의사를 결정할 능력이 없는 자의 행위는 벌하지 아니한다. ② 심신장애로 인하여 전항의 능력이 미약한 자의 행위는 형을 감경할 수 있다. ③ 위험의 발생을 예견하고 자의로 심신장애를 야기한 자의 행위에는 전 2항의 규정을 적용하지 아니한다.", "책임론"],
["413", "범행당시 정신분열증으로 심신장애의 상태에 있었던 피고인이 피해자를 살해한다는 명확한 의식이 있었고 범행의 경위를 소상하게 기억하고 있다고 하여 범행당시 사물의 변별능력이나 의사결정능력이 결여된 정도가 아니라 미약한 상태에 있었다고 단정할 수는 없는 것이다.", true, "▸ [AI해설] 범행당시 정신분열증으로 심신장애의 상태에 있었던 피고인이 피해자를 살해한다는 명확한 의식이 있었고 범행의 경위를 소상하게 기억하고 있다고 하여 범행당시 사물의 변별능력이나 의사결정능력이 결여된 정도가 아니라 미약한 상태에 있었다고 단정할 수는 없다는 것이 판례의 태도이다(90도1328).\n\n[제2절 참고 - 책임능력 조문] 형법 제9조(형사미성년자): 14세 되지 아니한 자의 행위는 벌하지 아니한다. 형법 제10조(심신장애인) ① 심신장애로 인하여 사물을 변별할 능력이 없거나 의사를 결정할 능력이 없는 자의 행위는 벌하지 아니한다. ② 심신장애로 인하여 전항의 능력이 미약한 자의 행위는 형을 감경할 수 있다. ③ 위험의 발생을 예견하고 자의로 심신장애를 야기한 자의 행위에는 전 2항의 규정을 적용하지 아니한다.", "책임론"],
["414", "정신분열증세와 방화에 대한 억제하기 어려운 충동으로 말미암아 사물을 변별하거나 의사를 결정할 능력이 미약한 상태에서 불과 6일간에 여덟 차례에 걸친 연속된 방화를 감행한 자에 대하여 심신미약을 인정하여 「형법」 제10조 제2항에 따라 처단한 조치는 부당하다.[모25]", false, "▸ 피고인을 심신미약자로 인정하고 형법 제10조 제2항을 적용하여 처단한 조치는 정당하다(83도3007).\n\n[제2절 참고 - 책임능력 조문] 형법 제9조(형사미성년자): 14세 되지 아니한 자의 행위는 벌하지 아니한다. 형법 제10조(심신장애인) ① 심신장애로 인하여 사물을 변별할 능력이 없거나 의사를 결정할 능력이 없는 자의 행위는 벌하지 아니한다. ② 심신장애로 인하여 전항의 능력이 미약한 자의 행위는 형을 감경할 수 있다. ③ 위험의 발생을 예견하고 자의로 심신장애를 야기한 자의 행위에는 전 2항의 규정을 적용하지 아니한다.", "책임론"],
["415", "형법 제10조 제1항 및 제2항 소정의 심신장애의 유무 및 정도를 판단할 때, 반성의 빛 유무, 수사 및 공판정에서의 방어 및 변소의 방법과 태도 등과 같은 범행 이후의 사정을 고려하여서는 아니된다.", false, "▸ 정신분열병의 종류 및 정도, 범행의 동기 및 원인, 범행의 경위 및 수단과 태양, 범행 전후의 피고인의 행동, 증거인멸 공작의 유무, 범행 및 그 전후의 상황에 관한 기억의 유무 및 정도, 반성의 빛 유무, 수사 및 공판정에서의 방어 및 변소의 방법과 태도, 정신병 발병 전의 피고인의 성격과 그 범죄와의 관련성 유무 및 정도 등을 종합하여 법원이 독자적으로 판단할 수 있다(94도581).\n\n[제2절 참고 - 책임능력 조문] 형법 제9조(형사미성년자): 14세 되지 아니한 자의 행위는 벌하지 아니한다. 형법 제10조(심신장애인) ① 심신장애로 인하여 사물을 변별할 능력이 없거나 의사를 결정할 능력이 없는 자의 행위는 벌하지 아니한다. ② 심신장애로 인하여 전항의 능력이 미약한 자의 행위는 형을 감경할 수 있다. ③ 위험의 발생을 예견하고 자의로 심신장애를 야기한 자의 행위에는 전 2항의 규정을 적용하지 아니한다.", "책임론"],
["416", "사물을 변별할 능력 또는 의사를 결정할 능력에 관한 확정된 사실이 심신장애에 해당하는지 여부는 반드시 전문적인 지식을 가진 자의 감정에 의하여서만 결정할 수 있는 것이 아니고 법원이 그 범죄행위의 전후사정이나 목격자의 증언 및 기타 자료를 참작하여 판단할 수 있다.[모25]", true, "▸ [AI해설] 사물을 변별할 능력 또는 의사를 결정할 능력에 관한 확정된 사실이 심신장애에 해당하는지 여부는 반드시 전문적인 지식을 가진 자의 감정에 의하여서만 결정할 수 있는 것이 아니고 법원이 그 범죄행위의 전후사정이나 목격자의 증언 및 기타 자료를 참작하여 판단할 수 있다는 것이 판례의 태도이다(82도1014).\n\n[제2절 참고 - 책임능력 조문] 형법 제9조(형사미성년자): 14세 되지 아니한 자의 행위는 벌하지 아니한다. 형법 제10조(심신장애인) ① 심신장애로 인하여 사물을 변별할 능력이 없거나 의사를 결정할 능력이 없는 자의 행위는 벌하지 아니한다. ② 심신장애로 인하여 전항의 능력이 미약한 자의 행위는 형을 감경할 수 있다. ③ 위험의 발생을 예견하고 자의로 심신장애를 야기한 자의 행위에는 전 2항의 규정을 적용하지 아니한다.", "책임론"],
["417", "음주로 인한 심신장애의 여부는 기록에 나타난 제반자료와 공판정에서의 피고인의 진술등을 종합하여 판단하여도 무방하고 반드시 전문의사에 의한 감정에 의하여야 하는 것은 아니다.", true, "▸ [AI해설] 음주로 인한 심신장애의 여부는 기록에 나타난 제반자료와 공판정에서의 피고인의 진술 등을 종합하여 판단하여도 무방하고 반드시 전문의사에 의한 감정에 의하여야 하는 것은 아니라는 것이 판례의 태도이다(85도1235).\n\n[제2절 참고 - 책임능력 조문] 형법 제9조(형사미성년자): 14세 되지 아니한 자의 행위는 벌하지 아니한다. 형법 제10조(심신장애인) ① 심신장애로 인하여 사물을 변별할 능력이 없거나 의사를 결정할 능력이 없는 자의 행위는 벌하지 아니한다. ② 심신장애로 인하여 전항의 능력이 미약한 자의 행위는 형을 감경할 수 있다. ③ 위험의 발생을 예견하고 자의로 심신장애를 야기한 자의 행위에는 전 2항의 규정을 적용하지 아니한다.", "책임론"],
["418", "정신지체 3급 장애인으로 정신박약과 주의력결핍 과잉행동장애(ADHD)가 있는 피고인이 흉기를 휴대하고 피해자를 강제추행하여 상해를 입혔다고 하여 성폭력범죄의 처벌 등에 관한 특례법 위반(강간등상해)으로 기소되었다면, 소년인 피고인이 이 사건 범행 당시 심신장애의 상태에 있었는지 여부에 대한 감정을 실시하여 그 결과까지 종합해 본 다음 과연 피고인이 이 사건 범행 당시 심신상실 내지 심신미약의 상태에 있었는지 여부를 판단하여야 한다.", true, "▸ [AI해설] 정신지체 및 ADHD가 있는 소년 피고인이 범행 당시 심신장애 상태에 있었는지 여부에 대해서는 감정을 실시하여 그 결과까지 종합하여 심신상실 내지 심신미약 여부를 판단하여야 한다는 것이 판례의 태도이다(2011도4398).\n\n[제2절 참고 - 책임능력 조문] 형법 제9조(형사미성년자): 14세 되지 아니한 자의 행위는 벌하지 아니한다. 형법 제10조(심신장애인) ① 심신장애로 인하여 사물을 변별할 능력이 없거나 의사를 결정할 능력이 없는 자의 행위는 벌하지 아니한다. ② 심신장애로 인하여 전항의 능력이 미약한 자의 행위는 형을 감경할 수 있다. ③ 위험의 발생을 예견하고 자의로 심신장애를 야기한 자의 행위에는 전 2항의 규정을 적용하지 아니한다.", "책임론"],
["419", "★ 원인에 있어서 자유로운 행위의 가벌성의 근거를 원인설정행위 자체에서 찾는 견해는 원인에 있어서 자유로운 행위를 자신을 책임능력 없는 도구로 이용하는 간접정범으로 이해한다.[변14]", true, "▸ 구성요건모델(일치모델)은 원인에 있어서 자유로운 행위의 가벌성의 근거를 원인설정행위 자체에서 찾는 견해로, 이를 자신을 책임능력 없는 도구로 이용하는 간접정범과 유사한 것으로 이해한다. 이 견해는 원인행위시에 실행의 착수를 인정하며, 원인행위시에 책임능력이 있었으므로 이에 대한 책임비난이 가능하다고 본다(행위와 책임의 동시존재 원칙 유지). 다만 실행의 착수시기를 원인행위시로 너무 앞당겨 인정함으로써 구성요건적 행위정형성이 결여되어 죄형법정주의에 반할 위험이 있다는 비판을 받는다.\n\n[제3절 참고 - 원인에 있어서 자유로운 행위 이론 정리] 구성요건모델(일치모델): 책임근거=원인설정행위(간접정범 유사, 자신을 도구로 이용), 실행행위=원인설정행위, 행위·책임 동시존재원칙=유지, 비판=구성요건적 행위정형성이 결여되어 죄형법정주의에 반할 위험. 책임모델(예외모델): 책임근거=원인설정행위와 결과실현행위의 불가분적 관련, 실행행위=결과실현행위, 동시존재원칙=예외, 비판=책임주의에 반할 우려. 반무의식상태설: 책임근거=실행행위, 실행행위=결과실현행위, 동시존재원칙=유지, 비판=대부분의 경우에 행위자의 책임능력이 인정되어 법적 안정성을 해한다.", "책임론"],
