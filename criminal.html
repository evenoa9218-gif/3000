["632", "★ 피고인이 거래처로부터 돈을 수금하여 보관하던 중 횡령하였다는 공소사실과 그 돈의 수금권한이 없는데도 있는 것처럼 가장하고 수금하여 이를 편취하였다는 공소사실은 동일성이 인정되지 않는다.", false, "▸ 피고인이 거래처로부터 돈을 수금하여 보관하던 중 횡령하였다는 사실과 수금권한이 없는데도 있는 것처럼 가장하고 수금하여 편취하였다는 사실은 동일한 기본적 사실에 대한 법률적 평가를 달리한 데 불과하므로 공소장변경은 적법하다. [83도3074, 비양립관계]", "공판심리"],
["633", "★ 피고인이 피해자를 살해하려고 목을 누르는 등 폭행을 가하였으나 미수에 그쳤다는 살인미수의 공소사실에 대하여 예비적으로 피고인이 피해자를 강간하려고 위와 같은 폭행을 가하였으나 미수에 그치고 피해자에게 상해를 입혔다는 강간치상의 공소사실을 추가하는 공소장변경은 공소사실의 동일성을 해친다고 볼 수 없다.", true, "▸ [AI해설] 살인미수 공소사실에 예비적으로 강간치상 공소사실을 추가하는 공소장변경은 공소사실의 동일성을 해친다고 볼 수 없다. [84도660]", "공판심리"],
["634", "★ 포괄일죄인 영업범에서 공소제기의 효력은 공소가 제기된 범죄사실과 동일성이 인정되는 범죄사실의 전체에 미치므로, 공판심리 중에 그 범죄사실과 동일성이 인정되는 범죄사실이 추가로 발견된 경우에 검사는 공소장변경절차에 의하여 그 범죄사실을 공소사실로 추가할 수 있다.", true, "▸ [AI해설] 포괄일죄인 영업범에서 공소제기의 효력은 동일성이 인정되는 범죄사실의 전체에 미치므로, 공판심리 중 추가로 발견된 범죄사실은 공소장변경절차에 의하여 추가할 수 있다. [2016도21342]", "공판심리"],
["635", "★ 포괄일죄에 관한 기존 처벌법규에 대하여 그 표현이나 형량과 관련한 개정을 하는 경우가 아니라 애초에 죄가 되지 아니하던 행위를 구성요건의 신설로 포괄일죄의 처벌대상으로 삼는 경우에는 신설된 포괄일죄 처벌법규가 시행되기 이전의 행위에 대하여는 신설된 법규를 적용하여 처벌할 수 없다.", true, "▸ 애초에 죄가 되지 않던 행위를 구성요건의 신설로 포괄일죄의 처벌대상으로 삼는 경우, 신설된 포괄일죄 처벌법규 시행 이전의 행위에는 신설된 법규를 적용하여 처벌할 수 없다.", "공판심리"],
["636", "★ 상습강제추행죄가 시행되기 이전에 범해진 강제추행행위는 습벽에 의한 것이라도 상습강제추행죄로 처벌할 수 없고, 개정형법의 시행 전에 상습으로 행해진 강제추행죄 등은 상습범이 아닌 수죄의 경합범으로 처벌하여야 한다.", true, "▸ 상습강제추행죄 시행 이전의 습벽에 의한 강제추행행위는 상습강제추행죄로 처벌할 수 없고, 수죄의 경합범으로 처벌하여야 한다.", "공판심리"],
["637", "★ 보이스피싱 사기죄 공소사실에 대해 제1심 판결이 선고된 후 항소심에서 형법 제114조의 범죄단체 조직 및 활동의 공소사실을 추가하는 공소장변경은 허가될 수 있다.", false, "▸ 보이스피싱 사기죄 공소사실과 범죄단체 조직·활동 공소사실은 동일성이 없으므로 공소장변경은 허가될 수 없다. [2020도10814]", "공판심리"],
["638", "★ 공소장이 변경되지 않았더라도 법원은 공소사실의 동일성이 인정되는 범위 내에서 심리의 경과에 비추어 피고인의 방어권 행사에 실질적인 불이익을 초래할 염려가 없다고 인정되는 때에는 직권으로 공소장에 기재된 공소사실과 다른 범죄사실을 인정할 수 있다.", true, "▸ 법원은 공소사실의 동일성이 인정되는 범위 내에서 심리의 경과에 비추어 피고인의 방어권 행사에 실질적인 불이익을 초래할 염려가 없다고 인정되는 때에는, 공소장이 변경되지 않았더라도 직권으로 다른 범죄사실을 인정할 수 있다.", "공판심리"],
["639", "★ 공소장변경절차 없이도 법원이 심리·판단할 수 있는 죄가 한 개가 아니라 여러 개인 경우로서 피고인의 방어권 행사에 실질적인 불이익이 없는 경우에, 법원으로서는 그 중 어느 하나를 임의로 선택하여 심리·판단할 수 있다.", false, "▸ 법원으로서는 그 중 어느 하나를 임의로 선택할 수 있는 것이 아니라 검사에게 공소사실 및 적용법조에 관한 석명을 구하여 공소장을 보완하게 한 다음 이에 따라 심리·판단하여야 한다. [2005도279]", "공판심리"],
["640", "★ 甲이 X건물과 Y건물을 이중매매하였고 검사가 甲의 X, Y건물에 대한 배임행위를 포괄하여 특정경제범죄가중처벌등에관한법률위반(배임)죄로 기소하였는데 법원 심리결과 단순 배임죄의 경합범으로 확인되었다고 하더라도, 법원이 공소장변경 없이 단순 배임죄의 실체적 경합으로 인정하는 것은 허용되지 아니한다.", false, "▸ 실체적 경합범으로 기소된 것을 포괄일죄로, 포괄일죄로 기소된 것을 실체적 경합범으로, 실체적 경합범으로 기소된 것을 상상적 경합범으로 인정하는 것은 공소장변경이 없더라도 직권으로 인정할 수 있다.", "공판심리"],
["641", "★ 피고인의 방어권 행사에 실질적인 불이익을 주는 것이 아니라면 공소장변경 없이 단독범으로 기소된 공소사실을 공동정범으로 인정하거나 공동정범으로 기소된 것을 단독범으로 인정할 수 있다.", true, "▸ 공동정범으로 기소된 공소사실을 공소장변경 없이 단독범으로 인정하거나, 단독범으로 기소된 것을 공동정범으로 인정하더라도 피고인에게 예기치 않은 타격을 주어 방어권 행사에 실질적 불이익을 줄 우려가 없다면 공소장변경이 필요하지 않다. [2018도5909, 2013도10112]", "공판심리"],
["642", "★ 「형법」제34조 제1항의 간접정범은 정범과 동일한 형 또는 그보다 감경된 형으로 처벌되는 점 등에 비추어 볼 때, 정범으로 기소된 피고인에게 법원이 공소장변경 없이 직권으로 위 간접정범 규정을 적용하였더라도 피고인의 방어권 행사에 실질적인 불이익을 초래하였다고 할 수 없다.", true, "▸ 간접정범은 정범과 동일한 형 또는 그보다 감경된 형으로 처벌되는 점 등에 비추어, 공소장 변경 없이 직권으로 간접정범 규정을 적용하였더라도 방어권 행사에 실질적인 불이익을 초래하였다고 할 수 없다. [2016도21075]", "공판심리"],
["643", "★ 검사가 공동정범으로 기소하였으나 법원이 甲에게 방조의 죄책이 인정된다고 판단하여 공소장변경 없이 방조범을 인정하는 경우, 심리과정에서 방조범에 대해 전혀 언급이 없거나 공방이 이뤄지지 않았다 하더라도 이는 甲의 방어권행사에 실질적인 불이익을 초래한 것이 아니므로 위법하지 아니하다.", false, "▸ 관세포탈죄의 공동정범으로 공소가 제기된 사건의 심리과정에서 단 한번도 언급된 바 없는 관세포탈의 방조사실을 법원이 공소장의 변경도 없이 유죄로 인정하는 것은 피고인의 방어권 행사에 실질적인 불이익을 초래할 염려가 있다. [94도1684]", "공판심리"],
["644", "★ 법원은 심리 중 丙의 행위가 특수절도죄(합동)의 공동정범이 아니라 종범에 해당하는 사실을 인정한 경우에 직권으로 이를 종범으로 인정하지 않고 특수절도죄의 공동정범에 대하여 무죄를 선고하는 것은 허용되지 않는다.", false, "▸ 법원은 공소사실의 동일성이 인정되는 범위 내에서 공소가 제기된 범죄사실보다 가벼운 범죄사실이 인정되는 경우 방어에 실질적인 불이익을 주는 것이 아니라면 공소장 변경 없이 직권으로 가벼운 범죄사실을 인정할 수 있다. 그러나 이는 직권인정의 권한이지 의무는 아니므로, 무죄 선고도 허용된다. [2001도4013]", "공판심리"],
["645", "★ 일반법과 특별법의 동일한 구성요건에 모두 해당하는 범죄사실에 대하여 검사가 형이 가벼운 일반법을 적용하여 기소한 경우 법원이 공소장변경 없이 형이 더 무거운 특별법위반의 죄로 처단할 수 없다.", true, "▸ [AI해설] 검사가 형이 가벼운 일반법으로 기소한 경우, 법원이 공소장변경 없이 형이 더 무거운 특별법위반의 죄로 처단할 수 없다. [2016도11880]", "공판심리"],
["646", "★ 미성년자 약취 후 재물을 요구하였으나 취득하지는 못한 자에 대하여 '미성년자 약취 후 재물취득 미수'에 의한 특정범죄 가중처벌 등에 관한 법률 위반죄로 기소된 공소사실에 대하여 공소장변경의 절차 없이도 법원이 직권으로 '미성년자 약취 후 재물요구 기수'에 의한 같은 법 위반죄를 인정할 수 있다.", false, "▸ 법원이 공소장변경 없이 '미성년자 약취 후 재물요구 기수'에 의한 특가법위반죄로 인정하여 미수감경을 배제하는 것은 피고인의 방어권 행사에 실질적인 불이익을 초래한다. [2008도3747]", "공판심리"],
["647", "★ 살인죄의 구성요건은 폭행치사 사실을 포함하므로, 법원은 살인죄가 인정되지 않더라도 공소장 변경 없이 폭행치사죄를 인정할 수 있다.", false, "▸ 살인죄의 공소사실에 대하여 공소장의 변경 없이 폭행치사죄를 인정하는 것은 피고인 방어권 행사에 불이익을 주는 것이므로, 법원은 검사의 공소장변경 없이는 폭행치사죄로 처단할 수 없다. [2001도1091]", "공판심리"],
["648", "★ 법원은 장물보관죄로 공소제기된 사건을 검사의 공소장변경 절차없이 업무상과실장물보관죄로 의율처단할 수 있다.", false, "▸ 장물보관죄로 공소제기된 사건을 검사의 공소장변경 절차없이 업무상과실 장물보관죄로 의율처단할 수는 없다. [83도3334]", "공판심리"],
["649", "★ 관세포탈미수로 인한 특정범죄가중처벌등에관한법률위반(관세)죄로 공소제기된 경우에는 공소장변경 없이 관세포탈예비로 인한 특정범죄가중처벌등에관한법률위반(관세)죄로 인정할 수 없다.", true, "▸ 미수를 예비·음모로 공소장변경없이 직권으로 인정할 수 없다. [82도2939]", "공판심리"],
["650", "★ 변제할 의사와 능력 없이 피해자로부터 금원을 빌린 사실로 기소된 공소사실을 공소장변경 절차 없이 피해자에게 제3자를 소개케 하여 동액의 금원을 차용하고 피해자에게 그에 대한 보증채무를 부담케 하여 재산상의 이익을 취득하였다는 사실로 인정하였다 할지라도 거기에 어떠한 위법이 있다 할 수 없다.", true, "▸ [AI해설] 공소사실의 동일성이 인정되는 범위 내에서 피고인의 방어권에 불이익이 없는 경우 공소장변경 없이 직권으로 유사한 사기 범죄사실을 인정하는 것은 위법이 아니다. [84도312]", "공판심리"],
["651", "甲과 乙이 공모하여 식당에서 현금 10만 원과 신용카드를 절취하고, 乙은 그 동안 망을 보았다는 특수절도 공소사실로 기소되었다. 만약 乙과의 공모 사실이 인정되지 않는다면, 공소장변경이 없더라도 甲에 대하여 단독 절도죄로 유죄를 인정할 수 있다.", true, "▸ 특수절도죄로 공소제기한 사실을 법원이 검사의 공소장변경절차없이 절도죄로 인정하더라도 위법이라 할 수 없다. [73도1256]", "공판심리"],
["652", "★ 강간죄로 기소된 공소사실에 대하여 공소장변경의 절차 없이도 법원이 직권으로 폭행죄만을 인정할 수 있다.", true, "▸ 폭행의 사실은 강간의 공소사실에 포함되어 있고 충분한 심리가 이루어졌으므로, 강간 범행이 인정되지 않는 경우 공소장변경 절차 없이 폭행죄만 인정하더라도 피고인의 방어권 행사에 실질적 불이익을 초래할 염려가 없다.", "공판심리"],
["653", "강도치상죄 공소사실에서 날치기가 반항억압을 목적으로 함이 없이 점유탈취의 과정에서 우연히 가해진 것에 불과한 경우, 법원은 공소장변경이 없어도 절도죄와 폭행치상죄의 실체적 경합범으로 처벌할 수 있다.", true, "▸ [AI해설] 날치기가 반항억압 목적이 없는 경우, 법원은 공소장변경 없이 강도치상죄 공소사실에 대하여 절도죄와 폭행치상죄의 실체적 경합범으로 처벌할 수 있다. [2003도2316]", "공판심리"],
["654", "★ 검사가 甲, 乙을 폭력행위등처벌에관한법률위반(공동공갈)죄로 공소제기하였으나, 법원이 '공동'의 점이 인정되지 않는다고 판단하였다면 공소장변경 없이 형법상 단순공갈죄의 성립을 인정할 수 있다.", true, "▸ 폭처법위반(공동폭행·공동협박)죄로 공소제기된 것을 법원이 2인 이상의 공동 사실이 인정되지 아니할 때에는 공소장 변경절차 없이도 형법상 폭행, 협박에 관하여 심리·판단할 수 있다. [90도2022]", "공판심리"],
["655", "★ 공소사실의 동일성이 인정되는 경우라 하더라도 법원은 허위사실적시 출판물에 의한 명예훼손의 공소사실에 대하여 공소장변경 없이 사실적시 출판물에 의한 명예훼손으로 처벌할 수 없다.", false, "▸ 검사가 허위사실적시 명예훼손죄로 기소하였으나 허위임에 대한 입증이 없는 경우, 법원은 공소장변경 없이 사실적시 명예훼손죄를 직권으로 인정할 수 있다. 다만 직권으로 인정하지 않았다고 하여 위법은 아니다. [2007도1220]", "공판심리"],
["656", "★ 검사가 허위사실적시 명예훼손죄로 기소하였으나, 심리결과 적시한 사실이 허위임에 대한 입증이 없는 경우 법원은 공소장변경 없이 사실적시 명예훼손죄를 인정해야 한다.", false, "▸ 법원은 공소장변경 없이 사실적시 명예훼손죄를 직권으로 인정할 수 있으나, 인정하지 않았다고 하여 위법하다고 할 수 없다. 직권인정 의무는 없다. [2007도1220]", "공판심리"],
["657", "★ 명예훼손으로 공소가 제기되고 제1심 공판절차 진행 중 명예훼손죄의 성립에 필요한 구체적인 사실의 적시가 인정되지 않아 모욕죄만 인정되는 경우라면, 제1심법원은 검사의 공소장변경신청 없이 모욕죄만을 인정하여 유죄판결을 선고할 수 있다.", false, "▸ 명예훼손죄의 공소사실에 대하여 공소장변경 없이 모욕죄로 인정할 수 없다. [70도1859]", "공판심리"],
["658", "★ 비록 사실인정에 변화가 없고 그 사실에 대한 법률적 평가만을 달리하는 경우라도, 배임죄로 기소된 공소사실에 대하여 법원이 공소장변경 없이 횡령죄로 인정하는 것은 구성요건을 달리하는 것이어서 허용되지 않는다.", false, "▸ 횡령죄와 배임죄는 같은 죄질의 재산범죄로서 형벌에서도 경중의 차이가 없고 동일한 범죄사실에 대하여 단지 법률적용만을 달리하는 경우에 해당하므로, 법원은 공소장변경 없이도 배임죄를 횡령죄로, 횡령죄를 배임죄로 처벌할 수 있다. [2013도9481, 99도2651]", "공판심리"],
["659", "甲은 자신의 명의로 자동차 등록을 마치면서 乙캐피탈로부터 3,000만 원을 대출받고 캐피탈 앞으로 저당권을 설정하였다. 그 후 甲은 乙캐피탈의 동의 없이 사채업자 丙에게 1,000만 원을 빌리면서 담보로 위 승용차를 인도하였다. 이에 乙캐피탈이 甲을 고소하자 검사는 甲을 배임죄로 기소하였다. 이 경우 법원은 공소장 변경 없이 甲에 대한 권리행사방해죄를 인정할 수 있다.", false, "▸ 권리행사방해죄와 배임죄는 구성요건과 보호법익이 달라 법원이 공소장 변경 없이 배임죄를 유죄로 인정하는 것은 피고인의 방어권 행사에 실질적인 불이익을 초래할 염려가 있다. [2017도4578]", "공판심리"],
["660", "★ 강간치상죄로 기소한 경우, 법원의 심리결과 치상의 점에 관하여 증명이 없는 때에는 법원은 공소장변경절차를 거쳐야만 강간죄를 인정할 수 있다.", false, "▸ 강간치상죄는 강간죄의 결과적 가중범으로서 강간치상의 공소사실 중에는 강간죄의 공소사실도 포함되어 있으므로, 법원은 공소장변경절차없이 강간죄의 공소사실에 관하여 심리판단할 수 있다. [87도2673]", "공판심리"],
["661", "★ 장물취득의 공소사실에 대해 장물보관의 범죄사실을 인정하는 것은 법적 평가에 차이가 있을 뿐 공소사실의 동일성이 인정되는 범위 내에 있으므로 공소장변경이 필요하지 않다.", true, "▸ 공소제기된 장물취득의 점과 실제로 인정되는 장물보관의 범죄사실 사이에는 법적 평가에 차이가 있을 뿐 공소사실의 동일성이 인정된다. [2003도1366]", "공판심리"],
["662", "★ 공소제기된 장물취득의 점과 실제로 인정되는 장물보관의 범죄사실 사이에 법적 평가에 차이가 있을 뿐 공소사실의 동일성이 인정된다면, 법원은 공소사실의 변경이 없더라도 직권으로 장물보관의 범죄사실을 유죄로 인정하여야 한다.", true, "▸ 법원은 공소사실의 변경이 없더라도 직권으로 장물보관의 범죄사실을 유죄로 인정하여야 한다. 직권으로 인정할 수 있을 뿐만 아니라 직권으로 인정해야 할 의무도 있다. [2003도1366]", "공판심리"],
["663", "★ 준강간죄의 장애미수 범죄사실로 기소되었으나 피고인이 당시 인식한 피해자의 상태에 관하여 충분한 심리가 이루어졌다면, 법원은 준강간죄의 불능미수 범죄사실을 직권으로 인정하였어야 한다.", true, "▸ 준강간죄의 불능미수가 중대한 범죄이고, 준강간죄의 장애미수와 사이에 범죄의 중대성, 죄질, 처벌가치 등 측면에서 별다른 차이가 없어, 공소장이 변경되지 않는다면 적정절차에 의한 신속한 실체적 진실의 발견이라는 형사소송의 목적에 비추어 현저히 정의와 형평에 반하므로 준강간죄의 불능미수 범죄사실을 직권으로 인정하였어야 한다. [2021도9043]", "공판심리"],
["664", "★ 공소취소는 반드시 서면으로 해야 하나, 공소사실의 철회는 서면이나 구술로도 할 수 있다.", false, "▸ 공소취소는 이유를 기재한 서면으로 하여야 한다. 단, 공판정에서는 구술로써 할 수 있다(제255조 제2항). 공소사실 철회(공소장변경)도 공판정에서 구술로 할 수 있다(규칙 제142조 제1항, 제5항). 공소취소도 공판정에서는 구술로 가능하므로 '반드시 서면으로'는 틀렸다.", "공판심리"],
["665", "★ 공소취소는 1심판결선고 전까지 가능하나 재심절차에서는 공소취소를 할 수 없다.", true, "▸ [AI해설] 공소취소는 1심판결선고 전까지 가능하나 재심절차에서는 공소취소를 할 수 없다. [76도3203]", "공판심리"],
["666", "★ 공소장변경의 방식에 의한 공소사실의 철회는 공소사실의 동일성이 인정되는 범위 내의 일부 공소사실에 한하여 가능한 것이므로, 공소장에 기재된 수개의 공소사실이 서로 동일성이 없고 실체적 경합관계에 있는 경우에 그 일부를 소추대상에서 철회하려면 공소장변경의 방식에 의할 것이 아니라 공소의 일부취소절차에 의하여야 한다.", true, "▸ [AI해설] 수개의 공소사실이 실체적 경합관계에 있는 경우 그 일부를 철회하려면 공소장변경 방식이 아니라 공소의 일부취소절차에 의하여야 한다. [91도1438]", "공판심리"],
["667", "★ 실체적 경합관계에 있는 수개의 공소사실의 전부 또는 일부를 철회하는 공소취소를 하고 공소기각결정이 확정된 경우에는 재기소제한이 적용되지 않는다.", false, "▸ 실체적 경합관계에 있는 수개의 공소사실의 전부 또는 일부를 철회하는 공소취소의 경우 재기소 제한이 적용된다(2004도3203).", "공판심리"],
["668", "포괄일죄로 기소된 공소사실 중 일부에 대하여 공소장변경방식으로 이루어지는 공소사실의 일부철회의 경우 형사소송법 제329조의 재기소제한이 적용된다.", false, "▸ 포괄일죄로 기소된 공소사실 중 일부에 대하여 공소장변경의 방식으로 이루어지는 공소사실의 일부 철회의 경우에는 제329조의 규정의 제한이 적용되지 아니한다. [2004도3203]", "공판심리"],
["669", "甲은 2021. 12. 1. 乙의 휴대전화 1대를 절취하였고, 2022. 4. 18. 丙의 지갑 1개를 절취하였고, 2022. 5. 10. 丁의 신용카드 1매를 절취하였다. 이에 대하여 검사는 2024. 1. 5. 甲을 상습절도죄로 기소하였다. 그런데 검사가 공판절차 진행 중 ③ 부분의 공소사실을 철회한 경우, 그 범죄사실에 대한 다른 중요한 증거를 발견한 것이 아니더라도 점유이탈물횡령죄로 다시 공소를 제기할 수 있다.", true, "▸ 포괄일죄로 기소된 공소사실 중 일부에 대하여 공소장변경의 방식으로 이루어지는 공소사실의 일부 철회의 경우에는 제329조의 재기소제한이 적용되지 아니한다. [2004도3203]", "공판심리"],
["670", "★ 공소취소에 의한 공소기각의 결정이 확정된 때에는 공소취소 후 그 범죄사실에 대한 다른 중요한 증거를 발견한 경우에 한하여 다시 공소를 제기할 수 있다.", true, "▸ 제329조에 따라 공소취소에 의한 공소기각의 결정이 확정된 때에는 다른 중요한 증거를 발견한 경우에 한하여 다시 공소를 제기할 수 있다.", "공판심리"],
["671", "★ 검사가 동일한 사건에 대하여 동일한 법원에 다시 공소를 제기한 경우, 수소법원은 공소기각판결을 선고하여야 한다.", true, "▸ 공소가 제기된 사건에 대하여 다시 공소가 제기되었을 때 판결로써 공소기각의 선고를 하여야 한다(제327조 제3호).", "공판심리"],
["672", "甲은 대표이사와의 갈등으로 퇴사한 후 회사 비리를 알리겠다며 각각 3차례에 걸쳐 대표이사에게 협박 메일을 발송하였다. 검사가 甲의 1차 협박 범행을 먼저 기소하고 다시 2, 3차의 협박 범행을 추가로 기소하였는데, 이를 병합하여 심리하는 과정에서 전후에 기소된 각각의 범행이 모두 포괄하여 하나의 협박죄를 구성하는 것으로 밝혀진 경우, 법원이 석명절차나 공소장 변경절차를 거치지 아니하고 전후에 기소된 범죄사실 전부에 대하여 실체판단을 하는 것은 위법하다.", false, "▸ 협박죄의 포괄일죄로 공소장을 변경하는 절차가 없었다거나 석명절차를 거치지 아니하였다 하더라도, 전후에 기소된 범죄사실 전부에 대하여 실체판단을 할 수 있고, 추가기소된 부분에 대하여 공소기각판결을 할 필요는 없다. [2007도2595, 공소장변경의제설]", "공판심리"],
["673", "검사 및 변호인은 공판준비기일에 출석하여야 한다.", false, "▸ 검사 및 변호인에게 공판준비기일에 대한 출석 의무는 없다(제266조의8 제1항). 법원은 필요하다고 인정하는 때에는 피고인을 소환할 수 있으며 피고인은 법원의 소환이 없는 때에도 공판준비기일에 출석할 수 있다.", "공판심리"],
["674", "법원은 공판준비기일이 지정된 사건에 관하여 변호인이 없는 때에는 직권으로 변호인을 선정하여야 한다.", true, "▸ 제266조의8 제1항에 따라 법원은 공판준비기일이 지정된 사건에 관하여 변호인이 없는 때에는 직권으로 변호인을 선정하여야 한다.", "공판심리"],
["675", "법원은 필요하다고 인정하는 때에는 피고인을 소환할 수 있으며, 피고인은 법원의 소환이 없는 때에도 공판준비기일에 출석할 수 있다.", true, "▸ 제266조의8 제5항에 따라 법원은 필요하다고 인정하는 때에는 피고인을 소환할 수 있으며, 피고인은 소환이 없는 때에도 공판준비기일에 출석할 수 있다.", "공판심리"],
["676", "★ 피고인 출석 없이도 공판준비기일을 개정할 수 있기 때문에 법원의 소환없이 공판준비기일에 출석한 피고인에게는 진술거부권을 고지할 의무는 없다.", false, "▸ 피고인의 출석 의무가 없으므로 출석 없이도 공판준비기일을 개정할 수 있다. 그러나 피고인이 출석하면 진술거부권을 고지하여야 한다(제266조의8 제6항).", "공판심리"],
["677", "공판준비기일에 신청되지 못한 증거라도 법원은 직권으로 이를 조사할 수 있다.", true, "▸ 공판준비기일에서 신청하지 못한 증거는 소송을 현저히 지연시키지 아니하는 때 등에 한하여 공판기일에 신청할 수 있으나(제266조의13 제1항), 법원은 직권으로 증거를 조사할 수 있다(동조 제2항).", "공판심리"],
["678", "법원은 검사, 피고인 또는 변호인의 의견을 들어 공판준비기일을 지정할 수 있고, 이 경우 당해 신청에 관한 법원의 결정에 대하여는 불복할 수 없다.", true, "▸ 제266조의7 제1항, 제2항에 따라 법원은 검사, 피고인 또는 변호인의 의견을 들어 공판준비기일을 지정할 수 있고, 그 결정에 대하여는 불복할 수 없다.", "공판심리"],
["679", "법원은 공판준비절차에서 공소사실 또는 적용법조를 명확하게 하는 행위를 할 수 있다.", true, "▸ 제266조의9 제1항 제1호에 따라 법원은 공판준비절차에서 공소사실 또는 적용법조를 명확하게 하는 행위를 할 수 있다.", "공판심리"],
["680", "법원은 공판준비절차에서 공소사실 또는 적용법조의 추가·철회 또는 변경을 허가할 수 없다.", false, "▸ 법원은 공판준비절차에서 공소사실 또는 적용법조의 추가·철회 또는 변경을 허가하는 행위를 할 수 있다(제266조의9 제1항 제2호).", "공판심리"],
["681", "법원은 검사, 피고인 또는 변호인의 신청이 없더라도 공판준비에 필요하다고 인정한 때에는 공판기일 전에 피고인 또는 증인을 신문할 수 있고 검증, 감정 또는 번역을 명할 수 있다.", false, "▸ 법원은 검사, 피고인 또는 변호인의 '신청에 의하여' 공판준비에 필요하다고 인정한 때에는 공판기일 전에 피고인 또는 증인을 신문할 수 있고 검증, 감정 또는 번역을 명할 수 있다(제273조 제1항).", "공판심리"],
["682", "★ 피고인에게 변호인이 있는 경우에도 피고인은 검사에게 공소제기된 사건에 관한 서류 또는 물건의 목록과 공소사실의 인정 또는 양형에 영향을 미칠 수 있는 서류의 열람·등사 또는 서면의 교부를 신청할 수 있다.", false, "▸ 피고인 또는 변호인은 검사에게 관련 서류등의 열람·등사 또는 서면의 교부를 신청할 수 있다. 다만, 피고인에게 변호인이 있는 경우에는 피고인은 열람만을 신청할 수 있다(제266조의3 제1항).", "공판심리"],
["683", "피고인 또는 변호인이 검사에게 열람·등사 또는 교부를 신청할 수 있는 서류 등에는 공소사실의 인정 또는 양형에 영향을 미칠 수 있는 서류 또는 물건만 해당되고, 녹음테이프와 비디오테이프 등 특수매체는 사생활 침해 및 전파가능성이 높기 때문에 포함되지 않는다.", false, "▸ 제266조의3 제1항의 서류등은 도면·사진·녹음테이프·비디오테이프·컴퓨터용 디스크, 그 밖에 정보를 담기 위하여 만들어진 물건으로서 문서가 아닌 특수매체를 포함한다. 다만 특수매체에 대한 등사는 필요 최소한의 범위에 한한다(제266조의3 제6항).", "공판심리"],
["684", "검사는 피고인 또는 변호인의 신청이 있는 경우 서류 등의 목록에 대하여는 열람 또는 등사를 거부할 수 없다.", true, "▸ 검사는 국가안보 등의 사유로 열람·등사를 거부하거나 제한할 수 있으나, 서류등의 목록에 대하여는 열람 또는 등사를 거부할 수 없다(제266조의3 제5항).", "공판심리"],
["685", "검사는 열람·등사 또는 서면의 교부를 거부하거나 그 범위를 제한하는 때에는 14일 이내에 피고인 또는 변호인에게 그 이유를 서면 또는 구두의 방법으로 통지하여야 한다.", false, "▸ 검사는 열람·등사 또는 서면의 교부를 거부하거나 그 범위를 제한하는 때에는 '지체 없이' 그 이유를 '서면으로' 통지하여야 한다(제266조의3 제3항).", "공판심리"],
["686", "피고인 또는 변호인은 검사가 서류 등의 열람·등사 또는 서면의 교부를 거부하거나 그 범위를 제한한 때에는 법원에 그 서류 등의 열람·등사 또는 서면의 교부를 허용하도록 청구할 수 있다.", true, "▸ 제266조의4 제1항에 따라 피고인 또는 변호인은 검사가 열람·등사 또는 서면의 교부를 거부하거나 그 범위를 제한한 때에는 법원에 그 서류 등의 열람·등사 또는 서면의 교부를 허용하도록 청구할 수 있다.", "공판심리"],
["687", "★ 수사서류에 대한 법원의 열람·등사 허용 결정이 있음에도 검사가 열람·등사를 거부하는 경우, 수사서류 각각에 대하여 검사가 열람등사를 거부할 정당한 사유가 있는지를 심사할 필요 없이 거부행위는 그 자체로써 기본권의 침해이다.", true, "▸ 법원의 열람·등사 허용 결정이 있음에도 검사가 열람·등사를 거부하는 경우 수사서류 각각에 대하여 거부할 정당한 사유가 있는지를 심사할 필요 없이 그 거부행위 자체로써 청구인들의 기본권을 침해한다. [2009헌마257]", "공판심리"],
["688", "★ 형사소송법상 검사가 수사서류의 열람·등사에 관한 법원의 허용결정을 지체 없이 이행하지 아니하는 때에는 해당 증인 및 서류 등에 대한 증거신청을 할 수 없도록 규정되어 있으므로, 검사는 그와 같은 불이익을 감수하면 법원의 열람·등사의 결정을 따르지 않아도 위법하지 아니하다.", false, "▸ 제266조의4 제5항은 검사가 그와 같은 불이익을 감수하기만 하면 법원의 결정을 따르지 않을 수도 있다는 의미가 아니다. 검사의 거부행위는 피고인의 열람·등사권을 침해하고, 나아가 피고인의 신속·공정한 재판을 받을 권리 및 변호인의 조력을 받을 권리까지 침해한다. [2009헌마257]", "공판심리"],
["689", "★ 법원의 증거개시에 관한 결정에 대하여는 즉시항고를 할 수 있다.", false, "▸ 법원이 검사에게 수사서류 등의 열람·등사 또는 서면의 교부를 허용할 것을 명한 결정은 판결 전의 소송절차에 관한 결정에 해당하는데, 위 결정에 대하여는 형소법에서 별도로 즉시항고에 관한 규정을 두고 있지 않으므로 제402조에 의한 항고의 방법으로도 불복할 수 없다. [2012모1393]", "공판심리"],
["690", "검사는 피고인 또는 변호인이 공판기일 또는 공판준비절차에서 현장부재·심신상실 또는 심신미약 등 법률상·사실상의 주장을 한 때에는 피고인 또는 변호인에게 그 주장과 관련된 서류 등의 열람·등사 또는 서면의 교부를 요구할 수 있다.", true, "▸ 제266조의11 제1항에 따라 검사는 피고인 또는 변호인이 공판기일 또는 공판준비절차에서 법률상·사실상의 주장을 한 때에는 그 주장과 관련된 서류 등의 열람·등사 또는 서면의 교부를 요구할 수 있다.", "공판심리"],
["691", "제1회 공판기일은 소환장의 송달 후 5일 이상의 유예기간을 두어야 하나, 피고인의 이의가 없는 때에는 유예기간을 두지 아니할 수 있다.", true, "▸ 제1회 공판기일은 소환장의 송달 후 5일 이상의 유예기간을 두어야 한다. 피고인이 이의없는 때에는 그 유예기간을 두지 아니할 수 있다(제269조).", "공판심리"],
["692", "★ 교도소 또는 구치소에 구속된 자에 대한 송달은 그 소장에게 송달하면 구속된 자에게 전달된 여부와 관계없이 효력이 발생한다.", true, "▸ [AI해설] 교도소 또는 구치소에 구속된 자에 대한 송달은 그 소장에게 송달하면 구속된 자에게 전달된 여부와 관계없이 그 효력이 생긴다. [91도3272, 형소법 제65조]", "공판심리"],
["693", "다른 사건으로 신체구속을 당한 자에게는 송달영수인에 관한 규정을 적용하지 않는다.", false, "▸ 제60조 제4항이 규정한 신체구속을 당한 자라 함은 그 사건에서 신체를 구속 당한 자를 가리키는 것이므로, 다른 사건으로 신체구속을 당한 자에게는 그 사건에 관하여 송달받기 위한 신고의무를 면제받을 수 없다. 즉 해당 사건에 관하여 송달영수인에 관한 규정이 적용된다. [76모69]", "공판심리"],
["694", "피고인이 재판권이 미치지 않는 장소에 있는 경우에 공시송달을 할 수 없다.", false, "▸ 피고인이 재판권이 미치지 아니하는 장소에 있는 경우에 다른 방법으로 송달할 수 없는 때에도 공시송달을 할 수 있다(제63조).", "공판심리"],
["695", "★ 법원이 수감 중인 피고인에 대하여 공소장 부본과 피고인소환장 등을 종전 주소지 등으로 송달하거나 공시송달의 방법으로 송달하였다면 이는 위법하다.", true, "▸ [AI해설] 법원이 수감 중인 피고인에 대하여 공소장 부본과 피고인소환장 등을 종전 주소지 등으로 송달하거나 공시송달의 방법으로 송달하였다면 이는 위법하다. [2013도2714]", "공판심리"],
["696", "재판을 받는 자가 구치소에 수용되어 있는 경우에는, 재판을 받는 자가 재판의 내용을 현실적으로 알게 되었는지 여부와 관계없이 재판서 등본이 모사전송의 방법으로 구치소장에게 송부된 때 그 재판이 고지되었다고 보아야 한다.", true, "▸ 재판서 등본을 모사전송의 방법으로 송부하는 것은 재판을 고지하는 '다른 적당한 방법'에 해당한다. 재판을 받는 자가 그 재판의 내용을 알 수 있는 상태에 이른 경우라면 현실적으로 알았는지 여부에 관계없이 그 재판이 고지되었다고 보아야 한다. [2004모208]", "공판심리"],
["697", "최초의 공시송달은 법원게시장에 공시한 날로부터 2주일을 경과하면 그 효력이 생기고, 2회 이후의 공시송달은 5일을 경과하면 그 효력이 있다.", true, "▸ 제64조 제4항에 따라 최초의 공시송달은 2주일, 2회 이후의 공시송달은 5일을 경과하면 효력이 생긴다.", "공판심리"],
["698", "재판장은 피고인의 퇴정을 제지하거나 법정의 질서를 유지하기 위하여 필요한 처분을 할 수 있다.", true, "▸ 제281조 제2항에 따라 재판장은 피고인의 퇴정을 제지하거나 법정의 질서를 유지하기 위하여 필요한 처분을 할 수 있다.", "공판심리"],
["699", "소송에 관한 서류는 공판의 개정 전에는 공익상 필요 기타 상당한 이유가 없으면 공개하지 못한다.", true, "▸ 제47조에 따라 소송에 관한 서류는 공판의 개정 전에는 공익상 필요 기타 상당한 이유가 없으면 공개하지 못한다.", "공판심리"],
["700", "법정의 규모·질서의 유지·심리의 원활한 진행 등을 고려하여 방청을 희망하는 피고인들의 가족·친지 기타 일반 국민에게 미리 방청권을 발행하게 하고 그 소지자에 한하여 방청을 허용하는 등의 방법으로 방청인의 수를 제한하는 조치를 취하는 것이 공개재판주의의 취지에 반하는 것은 아니다.", true, "▸ [AI해설] 방청인의 수를 제한하는 조치를 취하는 것이 공개재판주의의 취지에 반하는 것은 아니다. [90도646]", "공판심리"],
["701", "동일한 피고인에 대하여 2개 이상의 사건이 각각 별도로 공소제기되었을 경우 반드시 병합심리하여 동시에 판결을 선고하여야만 하는 것은 아니다.", true, "▸ [AI해설] 동일한 피고인에 대하여 2개 이상의 사건이 별도로 공소제기된 경우 반드시 병합심리하여 동시에 판결을 선고하여야만 하는 것은 아니다. [83도3013]", "공판심리"],
["702", "검사가 다수인의 집합에 의하여 구성되는 집합범이나 2인 이상이 공동하여 죄를 범하여 공범의 관계에 있는 피고인들에 대하여 여러 개의 사건으로 나누어 공소를 제기한 경우에, 법원이 변론을 병합하지 아니하였다고 하여 형사소송절차에서의 구두변론주의와 직접심리주의에 위반한 것이라고 볼 수 없다.", true, "▸ [AI해설] 공범에 대하여 여러 개의 사건으로 나누어 공소제기한 경우에도, 법원이 변론을 병합하지 않았다고 하여 구두변론주의와 직접심리주의에 위반한 것이라고 볼 수 없다. [90도764]", "공판심리"],
["703", "검사 또는 변호인은 증거조사 종료 후에 순차로 피고인에게 공소사실 및 정상에 관하여 필요한 사항을 신문할 수 있다. 다만, 재판장은 필요하다고 인정하는 때에는 증거조사가 완료되기 전이라도 이를 허가할 수 있다.", true, "▸ 제296조의2 제1항에 따라 검사 또는 변호인은 증거조사 종료 후에 피고인에게 공소사실 및 정상에 관하여 필요한 사항을 신문할 수 있다. 재판장은 필요하다고 인정하는 때에는 증거조사가 완료되기 전이라도 이를 허가할 수 있다.", "공판심리"],
["704", "재판장은 피고인을 신문하는 경우 피고인의 연령·성별·국적 등의 사정을 고려하여 그 심리적 안정의 도모와 원활한 의사소통을 위하여 필요한 경우에는 직권 또는 피고인·법정대리인·검사의 신청에 따라 피고인과 신뢰관계에 있는 자를 동석하게 할 수 있다.", true, "▸ 제276조의2 제1항 제2호에 따라 재판장은 직권 또는 피고인·법정대리인·검사의 신청에 따라 피고인과 신뢰관계에 있는 자를 동석하게 할 수 있다.", "공판심리"],
["705", "★ 최종의견 진술의 기회는 피고인이나 변호인에게 주어지면 되는바, 재판장이 변호인의 최후변론이 끝나자마자 곧바로 선고기일을 지정·고지함으로써 피고인에게 최종의견 진술의 기회를 주지 아니한 채 변론을 종결하고 판결을 선고하였다 하더라도 이는 소송절차의 법령위반에 해당한다고 볼 수는 없다.", false, "▸ 형소법 제303조는 피고인과 변호인 모두에게 최종의견 진술의 기회를 주어야 한다. 피고인이나 변호인에게 최종의견 진술의 기회를 주지 아니한 채 변론을 종결하고 판결을 선고하는 것은 소송절차의 법령위반에 해당한다. [2018도327]", "공판심리"],
["706", "법원이 검사나 피고인에게 주장 및 입증을 위한 충분한 기회를 주었다가 변론을 종결한 이상 다른 특별한 사정이 없는 한 그 후에 이루어진 변론재개신청을 법원이 받아들이지 아니하였다고 하여 이를 위법하다고 할 수는 없다.", true, "▸ 변론종결 후 변론재개신청이 있는 경우에도 종결한 변론을 재개하느냐의 여부는 법원의 재량에 속한다. 주장 및 입증을 위한 충분한 기회를 주었다가 변론을 종결한 이상 그 후 변론재개신청을 받아들이지 않아도 위법하지 않다. [2014도1414]", "공판심리"],
["707", "★ 변론종결 후 선임된 변호인의 변론재개신청을 들어주지 않았다면 이는 심리미진에 해당한다.", false, "▸ 변론종결 후 선임된 변호인의 변론재개신청을 들어주지 아니하였다 하여 심리미진의 위법이 있는 것은 아니다. [86도769]", "공판심리"],
["708", "★ 법원이 적법하게 공판의 심리를 종결하였더라도 피고인이 증인신청을 하면 법원은 공판의 심리를 재개하여 증인신문을 하여야 한다.", false, "▸ 법원이 적법하게 공판의 심리를 종결한 뒤에 이르러 증인신문을 신청하더라도 반드시 공판의 심리를 재개하여 증인신문을 하여야 하는 것이 아니다. [2010도7947]", "공판심리"],
["709", "★ 재판장이 주문을 낭독하여 선고 내용이 외부적으로 표시된 이상 재판서에 기재된 주문과 이유를 잘못 낭독하거나 설명하는 등 실수가 있거나 판결 내용에 잘못이 있음이 발견된 경우와 같이 특별한 사정이 있는 경우에 변경 선고가 허용된다.", true, "▸ 재판장이 일단 주문을 낭독한 이후라도 선고가 종료되기 전까지는 일단 낭독한 주문의 내용을 정정하여 다시 선고할 수 있다. 다만 재판서에 기재된 주문과 이유를 잘못 낭독하거나 판결 내용에 잘못이 있음이 발견된 경우와 같이 특별한 사정이 있는 경우에 변경 선고가 허용된다. [2017도3884]", "공판심리"],
["710", "판결서는 서명날인에 갈음하여 기명날인할 수 없는 재판서이다.", true, "▸ 판결서 기타 대법원규칙이 정하는 재판서를 제외한 재판서에 대하여는 서명날인에 갈음하여 기명날인할 수 있다(제41조 제3항). 기명날인이 불가한 재판서는 판결과 각종 영장(감정유치장 및 감정처분허가장 포함)이다(규칙 제25조의2).", "공판심리"],
["711", "면소의 재판을 할 것이 명백한 사건에 관하여는 공판기일에 피고인의 출석을 요하지 아니한다.", true, "▸ 제277조 제2호에 따라 면소의 재판을 할 것이 명백한 사건에 관하여는 공판기일에 피고인의 출석을 요하지 아니한다.", "공판심리"],
["712", "★ 장기 3년 이하의 징역 또는 금고에 해당하는 사건에서 피고인의 불출석허가신청이 있고 법원이 이를 허가한 사건에는 피고인의 출석을 요하지 않지만, 판결을 선고하는 공판기일에는 출석하여야 한다.", false, "▸ 제277조 제3호에 따라 장기 3년 이하의 징역 또는 금고에 해당하는 사건에서 불출석 허가를 받은 경우에는 판결 선고기일을 포함하여 공판기일에 피고인의 출석을 요하지 않는다.", "공판심리"],
["713", "피고인이 출석하지 아니하면 개정하지 못하는 경우에, 구속된 피고인이 정당한 사유 없이 출석을 거부하고 교도관에 의한 인치가 불가능하거나 현저히 곤란하다고 인정되는 때에는 피고인의 출석 없이 공판절차를 진행할 수 있다.", true, "▸ 제277조의2 제1항에 따라 구속된 피고인이 정당한 사유 없이 출석을 거부하고 교도관에 의한 인치가 불가능하거나 현저히 곤란하다고 인정되는 때에는 피고인의 출석 없이 공판절차를 진행할 수 있다.", "공판심리"],
["714", "★ 제1심 공판절차에서 피고인에 대한 송달불능보고서가 접수된 때부터 6개월이 지나도록 피고인의 소재를 확인할 수 없는 경우에는 대법원규칙으로 정하는 바에 따라 피고인의 진술 없이 재판할 수 있으나, 사형, 무기 또는 장기 10년이 넘는 징역이나 금고에 해당하는 사건의 경우에는 피고인의 진술 없이 재판할 수 없다.", true, "▸ 소송촉진 등에 관한 특례법 제23조에 따라 제1심 공판절차에서 피고인에 대한 송달불능보고서가 접수된 때부터 6개월이 지나도록 소재를 확인할 수 없는 경우 피고인의 진술 없이 재판할 수 있으나, 사형, 무기 또는 장기 10년이 넘는 징역이나 금고에 해당하는 사건에서는 불가하다.", "공판심리"],
["715", "증거신청은 검사가 먼저 이를 한 후 다음에 피고인 또는 변호인이 이를 한다.", true, "▸ 규칙 제133조에 따라 증거신청은 검사가 먼저 이를 한 후 다음에 피고인 또는 변호인이 이를 한다.", "공판심리"],
["716", "검사, 피고인 또는 변호인은 특별한 사정이 없는 한 증거들을 일괄하여 신청하여야 한다.", true, "▸ 규칙 제132조에 따라 검사, 피고인 또는 변호인은 특별한 사정이 없는 한 증거들을 일괄하여 신청하여야 한다.", "공판심리"],
["717", "검사, 피고인 또는 변호인은 증거조사에 관하여 이의신청을 할 수 있고, 법원은 이의신청에 대하여 결정을 하여야 한다.", true, "▸ 제296조에 따라 검사, 피고인 또는 변호인은 증거조사에 관하여 이의신청을 할 수 있고, 법원은 이의신청에 대하여 결정을 하여야 한다.", "공판심리"],
["718", "증거조사에 대한 이의신청은 법령의 위반이 있거나 상당하지 아니함을 이유로 하여 이를 할 수 있다. 그러나 증거신청에 대한 법원의 결정에 대해서는 법령의 위반이 있음을 이유로 하여서만 이의신청을 할 수 있다.", true, "▸ 제296조 제1항의 이의신청(증거조사)은 법령의 위반이 있거나 상당하지 아니함을 이유로 할 수 있다. 다만, 제295조의 규정에 의한 증거결정에 대한 이의신청은 법령의 위반이 있음을 이유로 하여서만 할 수 있다(규칙 제135조의2).", "공판심리"],
["719", "법원은 증거조사에 관한 이의신청이 있을 때마다 즉시 결정하여야 하며, 이 결정에 대해서도 1회에 한하여 다시 이의신청 할 수 있다.", false, "▸ 이의신청에 대한 결정은 이의신청이 있은 후 즉시 하여야 한다(규칙 제138조). 그러나 이의신청에 대한 결정에 의하여 판단이 된 사항에 대하여는 다시 이의신청을 할 수 없다(규칙 제140조).", "공판심리"],
["720", "증거신청의 채택 여부는 법원의 재량으로서 법원이 필요하지 않다고 인정할 때에는 증거를 조사하지 않을 수 있다.", true, "▸ [AI해설] 증거신청의 채택 여부는 법원의 재량으로서 법원이 필요하지 않다고 인정할 때에는 증거를 조사하지 않을 수 있다. [2010도7947]", "공판심리"],
["721", "★ 소재탐지나 구인장 발부가 불가능한 것이 아님에도 불구하고, 불출석 증인에 대하여 소재탐지나 구인장 발부 없이 증인채택 결정을 취소하는 것은 법원의 재량을 벗어나는 것으로서 위법하다.", true, "▸ [AI해설] 불출석 증인에 대해 소재탐지나 구인장 발부가 불가능한 것이 아님에도 불구하고, 소재탐지나 구인장 발부 없이 증인채택 결정을 취소하는 것은 재량을 벗어나 위법하다. [2020도2623]", "공판심리"],
["722", "증거결정에 불복이 있어도 그 결정에 대하여 즉시 이의신청을 할 수 없고, 다만 증거결정에 법령위반이 있는 경우에 한해 이의신청을 하거나 그로 말미암아 사실을 오인하여 판결에 영향을 미친 경우에 상소의 이유로 삼을 수 있다.", true, "▸ [AI해설] 증거결정에 불복이 있어도 즉시 이의신청을 할 수 없고, 법령위반이 있는 경우에 한해 이의신청을 하거나 판결에 영향을 미친 경우 상소의 이유로 삼을 수 있다. [90도646]", "공판심리"],
["723", "법원은 서류 또는 물건이 증거로 제출된 경우에 이에 관한 증거결정을 함에 있어서는 제출한 자로 하여금 그 서류 또는 물건을 상대방에게 제시하게 하여 상대방으로 하여금 그 서류 또는 물건의 증거능력 유무에 관한 의견을 진술하게 하여야 한다. 다만, 간이공판절차에서의 증거능력에 관한 특례에 의하여 증거동의가 있는 것으로 간주되는 경우에는 그러하지 아니하다.", true, "▸ 규칙 제134조 제2항에 따라 증거로 제출된 서류 또는 물건은 상대방에게 제시하여 증거능력 유무에 관한 의견을 진술하게 하여야 한다. 다만, 간이공판절차의 특례에 의하여 증거동의가 있는 것으로 간주되는 경우에는 예외이다.", "공판심리"],
["724", "甲은 점유이탈물횡령죄로 기소되어 법원에서 제1심 재판을 받고 있다. 검사는 법원에 사실조회를 신청하여 위 수표발행전표 등을 확보할 수 있다.", true, "▸ 법원은 직권 또는 검사, 피고인이나 변호인의 신청에 의하여 공무소 또는 공사단체에 조회하여 필요한 사항의 보고 또는 그 보관서류의 송부를 요구할 수 있다(제272조 제1항).", "공판심리"],
["725", "검찰청이 보관하고 있는 불기소처분기록에 포함된 불기소결정서는 변호인의 열람·지정에 의한 공개의 대상이 되지 않는다.", false, "▸ 검찰청이 보관하고 있는 불기소처분기록에 포함된 불기소결정서는 특별한 사정이 없는 한 변호인의 열람·지정에 의한 공개의 대상이 된다. [2012도1284]", "공판심리"],
["726", "검사, 피고인이나 변호인의 신청에 의하여 법원이 공무소 또는 공사단체에 조회를 요구하여 송부 받은 서류는 검사, 피고인 또는 변호인이 공판정에서 개별적으로 지시설명하여 조사하여야 한다.", true, "▸ 제291조 제1항에 따라 법원이 공무소 또는 공사단체에 조회를 요구하여 송부 받은 서류는 공판정에서 개별적으로 지시설명하여 조사하여야 한다.", "공판심리"],
["727", "★ '증거물인 서면'을 조사하기 위해서는 증거서류의 조사방식인 낭독·내용고지 또는 열람의 절차와 증거물의 조사방식인 제시의 절차가 함께 이루어져야 한다.", true, "▸ 본래 증거물이지만 증거서류의 성질도 가지고 있는 '증거물인 서면'을 조사하기 위해서는 증거서류의 조사방식인 낭독·내용고지 또는 열람의 절차와 증거물의 조사방식인 제시의 절차가 함께 이루어져야 한다. [2013도2511, 예: 무고 사건의 고소장]", "공판심리"],
["728", "★ 피고인이나 변호인이 무죄에 관한 자료로 제출한 서증 가운데 유죄임을 뒷받침하는 내용이 있다 하여도 법원은 검사의 원용(동의)이 없는 한 당해 서류의 진정성립 여부 등을 조사하고 아울러 당해 서류에 대한 피고인이나 변호인의 의견과 변명의 기회를 준 다음이 아니면 당해 서증을 유죄인정의 증거로 사용할 수 없다.", true, "▸ 증거공통의 원칙이란 증거의 증명력은 그 제출자나 신청자의 입증취지에 구속되지 않는다는 것이다. 그러나 증거능력이나 조사절차를 불필요하게 할 수 있는 힘은 없으므로, 피고인이나 변호인이 무죄 자료로 제출한 서증을 유죄 증거로 사용하려면 검사의 원용이 있어야 한다. [87도966, 2013도12155]", "공판심리"],
["729", "★ 증거능력이 없어 증거로 채택되지 아니한 증거서류 또는 증거물을 제출받아 일단 제출받은 경우에는 이를 증거신청인에게 반환하여야 한다.", false, "▸ 법원은 증거신청을 기각·각하하거나 증거신청에 대한 결정을 보류하는 경우 증거신청인으로부터 당해 증거서류 또는 증거물을 제출받아서는 아니 된다(규칙 제134조 제4항). 제출받지 않는 것이 원칙이다.", "공판심리"],
["730", "★ 검사가 수사보고서에 첨부하여 제출한 체포 장면이 녹화된 동영상에 대해 증거조사절차 없이 유죄 증거로 채택하는 것은 위법하다.", true, "▸ 녹음·녹화매체 등에 대한 증거조사는 이를 재생하여 청취 또는 시청하는 방법으로 하도록 규정하고 있으므로, 형사소송규칙에서 정한 증거조사절차를 거치지 아니한 채 유죄의 증거로 채택한 것은 잘못이다. [2009도13846]", "공판심리"],
["731", "정당한 사유 없이 소환에 응하지 아니하는 증인에 대하여 법원은 500만 원 이하의 과태료를 부과하여 출석을 간접강제할 수 있지만 직접 구인할 수는 없다.", false, "▸ 법원은 소환에 응하지 아니한 증인에 대하여 소송비용 부담 명령과 500만원 이하의 과태료를 부과할 수 있을 뿐만 아니라(제151조 제1항), 정당한 사유없이 소환에 응하지 아니하는 증인은 구인할 수 있다(제152조).", "공판심리"],
["732", "★ 법원은 감치의 재판을 받은 증인이 감치의 집행 중에 증언을 한 때에는 즉시 감치결정을 취소하고 그 증인을 석방하도록 명하여야 한다.", true, "▸ 제151조 제7항에 따라 법원은 감치의 재판을 받은 증인이 감치의 집행 중에 증언을 한 때에는 즉시 감치결정을 취소하고 그 증인을 석방하도록 명하여야 한다.", "공판심리"],
["733", "증인소환장을 송달받은 乙이 정당한 사유 없이 증인으로 출석하지 아니한 때에는 법원은 결정으로 당해 불출석으로 인한 소송비용을 증인이 부담하도록 명하고 500만 원 이하의 과태료를 부과할 수 있으며, 乙은 이러한 결정에 대해 즉시항고를 할 수 있다.", true, "▸ 소송비용 부담, 과태료와 감치의 결정에 대하여는 즉시항고를 할 수 있다. 다만, 이 경우에는 즉시항고에 집행정지 효력이 인정되지 않는다(제151조 제8항).", "공판심리"],
["734", "증인이 16세 미만일 경우 선서하게 하지 아니하고 신문하여야 한다.", true, "▸ 증인이 16세 미만의 자 또는 선서의 취지를 이해하지 못하는 자에 해당한 때에는 선서하게 하지 아니하고 신문하여야 한다(제159조).", "공판심리"],
["735", "채권자인 甲과 그의 아내 乙은 빚을 갚지 못하고 있는 채무자 丙을 찾아가 함께 심한 폭설을 하였다. 사건현장에 있던 丙의 아들 丁(5세)가 사건을 목격하였고 당시 상황을 이해하고 답변할 수 있다고 하더라도, 丁는 16세 미만의 선서무능력자이므로 그 증언은 증거로 할 수 없다.", false, "▸ 비록 선서무능력자라 하여도 그 증언 내지 진술의 전후 사정으로 보아 의사판단력이 있다고 인정된다면 증언능력이 있다. [84도619]", "공판심리"],
["736", "★ 4세의 선서무능력자가 선서 후 한 증언은 증언능력 유무와 관계없이 증언 자체의 효력이 부정된다.", false, "▸ 선서무능력자에 대하여 선서하게 하고 신문한 경우라 할지라도 그 선서만이 무효가 되고, 그 증언의 효력에 관하여는 영향이 없으며 유효하다. [4290형상23]", "공판심리"],
["737", "甲은 乙에게 술을 훔쳐오라고 하였고, 이에 乙은 편의점에 들어가 양주 1병을 절취하였다. 검사는 공동피고인으로서 乙을 절도죄로, 甲을 절도교사죄로 함께 기소하였다. 乙이 법정에서 甲이 교사하였다고 진술하더라도 증인으로서 진술한 것이 아니면 乙의 법정진술은 증거능력이 없다.", false, "▸ 공범인 공동피고인의 자백은 이에 대한 피고인의 반대신문권이 보장되어 있어 증인으로 신문한 경우와 다를 바 없으므로 독립한 증거능력이 있다. [2006도1944]", "공판심리"],
["738", "★ 피고인 甲은 피고인 乙로부터 뇌물을 수수하였다는 공소사실로, 피고인 乙은 피고인 甲에게 뇌물을 공여하였다는 공소사실로 기소되어 공동피고인으로 재판을 받고 있다. 乙이 피고인신문에서 甲에게 뇌물공여사실을 자백한 진술은 甲의 乙에 대한 반대신문권이 보장되어 있어 甲의 공소사실에 대한 증거로 쓸 수 있지만, 乙이 기억에 반하는 허위의 진술을 하더라도 위증죄가 성립하지 않는다.", true, "▸ 공범인 공동피고인의 자백은 반대신문권이 보장되어 있어 독립한 증거능력이 있다(O). 乙은 피고인 지위에서 신문을 받으므로 선서 없이 신문하고, 따라서 위증죄가 성립하지 않는다(O).", "공판심리"],
["739", "★ 甲과 乙은 모두 체포되어 강도치상죄의 공동정범으로 기소되어 재판을 받고 있다. 乙은 법정에서 甲과 모의한 사실이 있다고 진술하였다. 이와 관련하여 변론의 분리 없이도 乙의 甲의 범죄사실에 대한 증인적격이 인정된다.", false, "▸ 공범인 공동피고인은 당해 소송절차에서는 피고인의 지위에 있으므로 다른 공동피고인의 공소사실에 관하여 증인이 될 수 없다. 소송절차가 분리되어 피고인의 지위에서 벗어나게 되면 다른 공동피고인에 대한 공소사실에 관하여 증인이 될 수 있다. [2012도6848, 2008도3300]", "공판심리"],
["740", "★ 피고인과 별개의 범죄사실로 기소되어 병합심리중인 공동피고인은 피고인의 범죄사실에 관하여는 증인의 지위에 있다 할 것이므로 선서없이 한 공동피고인의 법정진술은 피고인의 범죄사실을 인정하는 증거로 할 수 없다.", true, "▸ 피고인과 별개의 범죄사실로 기소되어 병합심리중인 공동피고인(공범 아닌 공동피고인)은 다른 피고인의 범죄사실에 관하여 증인의 지위에 있으므로, 선서없이 한 법정진술은 다른 피고인의 범죄사실을 인정하는 증거로 할 수 없다. [82도1000]", "공판심리"],
["741", "공동피고인인 절도범 甲과 장물범 乙의 경우, 乙의 피고인신문 과정에서 '甲으로부터 장물인 줄 알고 금반지를 취득하였다'는 답변은 甲에 대한 유죄의 증거가 된다.", false, "▸ 절도범과 장물범은 공범 아닌 공동피고인의 관계이므로, 乙이 피고인 지위에서 한 법정진술은 甲에 대하여 증거능력이 없다. [2005도7601]", "공판심리"],
["742", "위 사례에서 乙에 대한 검사 작성의 피의자신문조서에 대하여 甲은 부동의하고 乙은 진정성립 및 임의성을 인정할 경우, 乙에 대한 검사 작성의 피의자신문조서는 甲에 대한 유죄의 증거가 된다.", false, "▸ 공범 아닌 공동피고인이므로 제312조 제4항이 적용된다. 피고인의 지위에서 진정성립 및 임의성을 인정하였다고 하더라도 위 피의자신문조서는 甲에 대하여 증거능력이 없다. [2005도7601]", "공판심리"],
["743", "甲과 乙이 기소되어 병합심리되는데, 甲이 피고인신문절차에서 '乙이 나를 먼저 때렸다'고 진술한 경우, 이 진술은 乙의 폭행죄에 대하여 증거능력이 있다.", false, "▸ 甲과 乙은 쌍방 폭행으로 기소된 공범 아닌 공동피고인이다. 따라서 甲이 피고인의 지위에서 한 법정진술은 乙에 대하여 증거능력이 없다.", "공판심리"],
["744", "甲과 乙이 쌍방 폭행사건으로 기소되어 공동피고인으로 재판을 받고 있는 경우, 분리 전 甲과 乙은 공범 아닌 공동피고인의 관계에 있으므로 甲은 乙의 피고사건에 관하여 증인적격이 없고, 따라서 甲이 변론이 분리되지 않은 상태에서 증인으로 진술하더라도 甲은 위증죄의 주체가 될 수 없다.", false, "▸ 공범 아닌 공동피고인이므로 변론 분리와 상관 없이 증인적격이 인정된다. 따라서 증인으로서 허위진술을 하면 위증죄의 주체가 될 수 있다.", "공판심리"],
["745", "검사는 특수(합동)절도를 범한 甲과 乙에 대하여 공소를 제기하였다. 그러면서 甲에 대하여는 甲이 단독으로 범한 절도도 경합범으로 함께 기소하였다. 甲의 단독 절도 범죄사실과 관련하여 乙이 피고인신문 과정에서 '甲이 절도를 하는 것을 보았습니다'라고 진술한 경우, 이 진술은 甲의 단독 절도 범죄사실에 대한 증거능력이 있다.", false, "▸ 甲의 단독 절도 범죄사실에 乙은 목격자에 불과하여 공범 관계에 있지 않으므로(공범 아닌 공동피고인), 乙의 피고인 지위에서의 법정진술은 甲에 대하여 증거로 할 수 없다.", "공판심리"],
["746", "甲이 乙을 조수석에 태우고 자동차를 운전하다가 부주의로 사람을 치고 나서 乙을 달래어 乙이 자신이 운전하여 사고를 낸 것으로 경찰에 허위로 자수하였다. 甲과 乙이 해당 범죄로 기소된 상황에서, 乙은 甲과 법률상 혼인하였다가 이혼하였더라도 증언거부권이 있다.", true, "▸ 제148조의 '자기나 친족 관계에 있었던 자'는 과거에 친족이었던 자도 포함하므로, 이혼한 전 배우자의 형사사건에서도 증언을 거부할 수 있다.", "공판심리"],
["747", "누구든지 자기나 친족 관계에 있었던 자 또는 그 법정대리인, 후견감독인에 해당하는 자가 형사소추 또는 공소제기를 당하거나 유죄판결을 받을 사실이 드러날 염려가 있는 증언을 거부할 수 있다.", true, "▸ 제148조에 따라 위 조건에 해당하는 경우 증언을 거부할 수 있다. '친족 관계에 있었던 자'도 포함된다.", "공판심리"],
["748", "법관, 의사, 변호사 등 비밀유지의무가 있는 자는 그 직무에 관하여 알게 된 사실로서 타인의 비밀에 관한 것에 대하여는 그 승낙이 없거나 중대한 공익상 필요가 없는 한 증언을 거부할 수 있다.", true, "▸ 제149조에 따라 변호사, 의사 등 비밀유지의무자는 직무상 알게 된 사실로서 타인의 비밀에 관한 것에 대하여, 그 승낙이 없거나 중대한 공익상 필요가 없는 한 증언을 거부할 수 있다.", "공판심리"],
["749", "★ 증언거부사유가 있음에도 형사사건의 증인이 증언거부권을 고지받지 못함으로 인하여 그 증언거부권을 행사하는 데 사실상 장애가 초래되었다고 볼 수 있는 경우에는 위증죄가 성립하지 않는다.", true, "▸ 증언거부사유가 있음에도 증인이 증언거부권을 고지받지 못함으로 인하여 그 증언거부권을 행사하는 데 사실상 장애가 초래되었다고 볼 수 있는 경우에는 위증죄의 성립을 부정하여야 한다. [2008도942]", "공판심리"],
["750", "甲과 乙이 쌍방 폭행사건으로 기소되어 공동피고인으로 재판을 받으면서 공판기일에 甲은 乙을 때린 적이 없다고 주장하고 있는 상황에서, 법원은 甲을 증인으로 채택하고 증인신문을 하였다. 이때 재판장이 甲에게 증언거부권을 고지하지 아니하였다면, 재판장으로부터 증언거부권을 고지받지 않고 한 甲의 증언은 위증죄가 성립하지 않는다.", true, "▸ 증언거부사유가 있음에도 증언거부권을 고지받지 못함으로 인하여 그 증언거부권을 행사하는 데 사실상 장애가 초래되었다고 볼 수 있는 경우에는 위증죄의 성립을 부정하여야 한다. [2008도942]", "공판심리"],
["751", "★ 도상해 범행을 일관되게 부인하였으나 유죄판결이 확정된 자는, 별건으로 기소된 공범의 형사사건에서 자신의 범행사실을 사실대로 진술할 기대가능성이 없으므로, 자신의 범행을 부인하는 허위의 증언을 하였다고 하더라도 위증죄가 성립하지 않는다.", false, "▸ 이미 유죄의 확정판결을 받은 경우에는 일사부재리의 원칙에 의해 다시 처벌되지 아니하므로, 피고인은 공범의 형사사건에서 그 범행에 대한 증언을 거부할 수 없다. 따라서 기대가능성이 없다고 할 수 없어 위증죄가 성립할 수 있다. [2005도10101]", "공판심리"],
["752", "★ 자신에 대한 유죄판결이 확정된 증인이 공범에 대한 형사사건에서 증언할 당시 앞으로 재심을 청구할 예정이라면 증인에게 「형사소송법」제148조에 의한 증언거부권이 인정된다.", false, "▸ 자신에 대한 유죄판결이 확정된 증인이 공범에 대한 피고사건에서 증언할 당시 앞으로 재심을 청구할 예정이라고 하여도, 이를 이유로 제148조에 의한 증언거부권이 인정되지는 않는다. [2011도11994]", "공판심리"],
["753", "★ 반대신문권의 보장은 형식적·절차적인 것이 아니라 실질적·효과적인 것이어야 하므로, 피고인에게 불리한 증거인 증인이 주신문의 경우와 달리 반대신문에 대하여는 답변을 하지 아니하는 등 진술 내용의 모순이나 불합리를 그 증인신문 과정에서 드러내는 것이 사실상 곤란하였고, 그것이 피고인에게 책임 있는 사유에 기인한 것이 아닌 경우라면, 특별한 사정이 존재하지 아니하는 이상 그 증인의 법정진술은 위법한 증거로서 증거능력을 인정하기 어렵다.", true, "▸ 반대신문권의 보장은 실질적·효과적이어야 하며, 실질적 반대신문기회가 부여되지 아니한 채 이루어진 증인의 법정진술은 위법한 증거로서 증거능력을 인정하기 어렵다. 다만, 피고인의 책문권 포기의 의사는 '명시적'인 것이어야 한다. [2016도17054]", "공판심리"],
["754", "★ 형사소송법 제297조의 규정에 따라 재판장은 증인이 피고인의 면전에서 충분한 진술을 할 수 없다고 인정한 때에는 피고인을 퇴정하게 함으로써 피고인의 직접적인 증인 대면을 제한하고 피고인의 반대신문권을 배제할 수 있다.", false, "▸ 제297조의 규정에 따라 피고인을 퇴정하게 하고 증인신문을 진행함으로써 피고인의 직접적인 증인 대면을 제한할 수 있지만, 이러한 경우에도 피고인의 반대신문권을 배제하는 것은 허용되지 않는다. [2011도15608]", "공판심리"],
["755", "★ 변호인이 없는 피고인을 퇴정케 하고 증인신문을 한 다음 피고인에게 실질적인 반대신문의 기회를 부여하지 않았다면, 다음 공판기일에서 재판장이 증인신문결과를 공판조서에 의하여 고지하여 피고인이 '변경할 점과 이의할 점이 없다'고 진술하더라도 실질적인 반대신문의 기회를 부여받지 못한 하자는 치유되지 않는다.", false, "▸ 다음 공판기일에서 재판장이 증인신문 결과 등을 공판조서에 의하여 고지하였는데 피고인이 '변경할 점과 이의할 점이 없다'고 진술하여 책문권 포기 의사를 명시함으로써 실질적인 반대신문의 기회를 부여받지 못한 하자가 치유되었다. [2009도9344]", "공판심리"],
["756", "★ 「형사소송법」제165조의2 비디오 등 중계장치 등에 의한 증인신문에 있어서 「형사소송규칙」에서 피고인과 증인 사이의 차폐시설 설치만을 규정하고 있으므로 검사, 변호인, 방청인과 증인 사이에 차폐시설 등을 설치하는 방식으로 증인신문을 할 수 없다.", false, "▸ 제165조의2 제3호도 대상을 '피고인 등'이라고 규정하고 있으므로, 법원은 피고인뿐만 아니라 검사, 변호인, 방청인 등에 대하여도 차폐시설 등을 설치하는 방식으로 증인신문을 할 수 있다. [2014도18006]", "공판심리"],
["757", "소송관계인의 참여없이 법정외에서 시행한 증인신문조서에 대하여 공판기일에서 증거조사 자체를 시행하지 아니하였다면 증인신문조서는 증거능력이 있을 수 없다.", true, "▸ 소송관계인의 참여 없이 법정외에서 시행한 증인신문조서에 대하여 공판기일에서 증거조사 자체를 시행하지 아니하였다면 증거능력이 없다.", "공판심리"],
["758", "★ 법정 외에서 증인신문을 실시함에 있어서 피고인에 대하여 통지하지 아니하여 참여기회를 주지 않았다면, 그 후 속개 공판기일에서 피고인과 변호인이 그 증인신문조사에 대하여 별 의견이 없다고 진술하였더라도 그 증인신문조사의 하자는 치유되지 않는다.", false, "▸ 법정외에서 증인신문을 실시하면서 피고인에 대하여 통지하지 아니하여 참여기회를 주지 않은 잘못이 있다고 하더라도, 그 후 속개 공판기일에서 피고인과 변호인이 그 증인신문조사에 대하여 별 의견이 없다고 진술하였다면 그 잘못은 책문권의 포기로 치유된다.", "공판심리"],
["759", "법원이 피고인에게 증인신문의 시일과 장소를 미리 통지함이 없이 증인신문을 시행하였음은 위법하나, 그 후 증인신문결과를 증인신문조서에 의하여 소송관계인에게 고지하였고 피고인이나 변호인이 이의를 하지 않았다면 위의 하자는 책문권의 포기로 치유된다.", true, "▸ [AI해설] 증인신문 시일과 장소를 미리 통지하지 않은 위법이 있더라도, 증인신문결과를 고지하고 피고인이나 변호인이 이의를 하지 않았다면 책문권의 포기로 치유된다. [73도2967]", "공판심리"],
["760", "피고인의 참여신청에도 불구하고 그의 참여 없이 실시된 증인신문은 변호인이 참여하였다고 하더라도 위법하다.", true, "▸ 검사, 피고인 또는 변호인은 증인신문에 참여할 수 있다(제163조 제1항). 피고인의 참여신청에도 불구하고 참여 없이 실시된 증인신문은 변호인이 참여하였다고 하더라도 위법하다. [68도1481]", "공판심리"],
["761", "★ 공판기일에 증인은 출석하였으나 피고인이 정당한 사유 없이 출석하지 아니하여 형소법 제276조의 규정에 의하여 공판기일을 연기할 수밖에 없는 경우, 법원이 이미 출석하여 있는 증인에 대하여 공판기일 외의 신문으로서 증인신문을 하고 다음 공판기일에 그 증인신문조서에 대한 서증조사를 하는 것은 증거조사절차로서 위법하다.", false, "▸ 이미 출석하여 있는 증인에 대하여 공판기일 외의 신문으로서 증인신문을 하고 다음 공판기일에 그 증인신문조서에 대한 서증조사를 하는 것은 증거조사절차로서 적법하다. [2000도...]", "공판심리"],
["762", "법원은 증인이 멀리 떨어진 곳 또는 교통이 불편한 곳에 살고 있거나 건강상태 등 그 밖의 사정으로 말미암아 법정에 직접 출석하기 어렵다고 인정하는 때에는 검사와 피고인 또는 변호인의 의견을 들어 비디오 등 중계장치에 의한 중계시설을 통하여 신문할 수 있다.", true, "▸ 제165조의2 제2항에 따라 법원은 증인이 법정에 직접 출석하기 어렵다고 인정하는 때에는 비디오 등 중계장치에 의한 중계시설을 통하여 신문할 수 있다.", "공판심리"],
["763", "외국인이라도 국어에 통하는 자인 경우에는 통역하게 할 필요가 없으나 대한민국 국민이라도 국어에 통하지 아니하면 통역하게 하여야 한다.", true, "▸ [AI해설] 외국인이라도 국어에 통하면 통역 불요, 대한민국 국민이라도 국어에 통하지 않으면 통역하여야 한다. [2007도9327]", "공판심리"],
["764", "법원은 13세 미만의 피해자를 증인으로 신문하는 경우, 재판에 지장을 초래할 우려가 있는 등 부득이한 경우가 아닌 한 피해자와 신뢰관계에 있는 자를 동석하게 하여야 한다.", true, "▸ 법원은 범죄로 인한 피해자가 13세 미만이거나 신체적 또는 정신적 장애로 사물을 변별하거나 의사를 결정할 능력이 미약한 경우에 재판에 지장을 초래할 우려가 있는 등 부득이한 경우가 아닌 한 피해자와 신뢰관계에 있는 자를 동석하게 하여야 한다(제163조의2 제2항).", "공판심리"],
["765", "법원은 증인의 연령, 직업, 건강상태 기타의 사정을 고려하여 검사, 피고인 또는 변호인의 의견을 묻고 법정 외에 소환하거나 현재지에서 신문할 수 있다.", true, "▸ 제165조에 따라 법원은 증인의 연령, 직업, 건강상태 기타의 사정을 고려하여 법정 외에 소환하거나 현재지에서 신문할 수 있다.", "공판심리"],
["766", "증인신문은 각 증인에 대하여 신문하여야 하고, 신문하지 아니한 증인이 재정한 때에는 퇴정을 명하여야 하지만, 필요한 때에는 증인과 다른 증인 또는 피고인과 대질하게 할 수 있다.", true, "▸ 증인신문은 각 증인에 대하여 개별로 신문하여야 하고, 미신문 증인은 퇴정하여야 하나 필요한 때에는 증인과 다른 증인 또는 피고인과 대질하게 할 수 있다.", "공판심리"],
["767", "주신문에서는 유도신문이 원칙적으로 허용되나 반대신문에서는 유도신문이 허용되지 않는다.", false, "▸ 주신문에서는 원칙적으로 유도신문이 허용되지 않고, 반대신문에서는 필요한 때에는 유도신문을 할 수 있다(규칙 제75조 제2항, 제76조 제2항).", "공판심리"],
["768", "★ 공무원 甲에 대한 허위공문서작성 및 동행사 사건에서, 증인 乙에 대한 증인신문 당시 검사의 주신문에 대하여 乙이 적의 또는 반감을 보이지 않았음에도 검사가 유도신문을 한 경우, 甲이 그 다음 공판기일에 위 증인신문조서에 대해 '변경할 점과 이의할 점이 없다'고 진술하였다면 주신문의 하자가 치유된다.", true, "▸ 피고인이 책문권 포기 의사를 명시함으로써 유도신문에 의하여 이루어진 주신문의 하자가 치유되었다. [2012도2937]", "공판심리"],
["769", "반대신문은 주신문에 나타난 사항과 이에 관련된 사항에 관하여 하며, 이 경우 필요할 때에는 유도신문을 할 수 있다.", true, "▸ 반대신문은 주신문에 나타난 사항과 이에 관련된 사항에 관하여 한다(규칙 제76조 제1항). 반대신문에 있어서 필요할 때에는 유도신문을 할 수 있다(동조 제2항).", "공판심리"],
["770", "★ 반대신문의 기회에 주신문에 나타나지 아니한 새로운 사항에 관하여 신문하고자 할 때에는 재판장의 허가를 받아야 한다.", true, "▸ 반대신문의 기회에 주신문에 나타나지 아니한 새로운 사항에 관하여 신문하고자 할 때에는 재판장의 허가를 받아야 하고(규칙 제76조 제4항), 그 사항에 관하여는 주신문으로 본다(동조 제5항).", "공판심리"],
["771", "★ 甲과 乙과 丙이 공모하여 피해자로부터 금품을 갈취한 공소사실로 기소된 경우, 甲이 사법경찰관이 작성한 乙에 대한 피의자신문조서에 대하여 증거로 함에 동의하지 않은 경우라도 乙이 법정에서 경찰 수사 도중 위 피의자신문조서에 기재된 것과 같은 내용으로 진술하였다는 취지로 증언하였다면 이러한 증언은 甲에 대한 유죄인정의 증거로 사용할 수 있다.", false, "▸ 이러한 증언은 원진술자인 공동피고인이 그 자신에 대한 경찰 작성의 피의자신문조서의 진정성립을 인정하는 취지에 불과하여 조서와 분리하여 독자적인 증거가치를 인정할 것이 아니므로, 조서의 증거능력이 부정되는 이상 위와 같은 증언 역시 유죄 인정의 증거로 쓸 수 없다. [2020도15669]", "공판심리"]

/* ── CSS ─────────────────────────────────────────── */
const CSS = `
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#1c1018;--sf:#241420;--sf2:#2c1a28;--bd:#4e2038;--bd2:#3a1a2c;
  --gold:#d4788a;--gold2:#e89aaa;--gf:#8c3050;--tx:#f8dce4;--tx2:#b88090;--tx3:#7a4858;
  --purple:#c89aff;--ok:#4ade80;--er:#f87171;--er-bg:rgba(248,113,113,.08);
  --ok:#4ade80;--er:#f87171;--ok-bg:rgba(74,222,128,.08);--er-bg:rgba(248,113,113,.08);
  --blue:#d4788a;--purple:#c89aff;--muted:#7a4858;
}

/* ── 라이트 테마 ───────────────────────────────────── */
html.light {
  --bg:#fdf0f3;--sf:#ffffff;--sf2:#fae4e8;--bd:#e8b0bc;--bd2:#f2ccd4;
  --gold:#a02e48;--gold2:#b83858;--gf:#882840;--tx:#280e18;--tx2:#6a3040;--tx3:#8a5060;
  --purple:#6a35a0;--ok:#16a34a;--er:#dc2626;--er-bg:rgba(220,38,38,.08);
}
html.light body { background:var(--bg); color:var(--tx); }
html.light .hdr-title{color:#ffffff;}
html.light .hdr-sub{color:var(--gold2);font-weight:600;}
html.light .logout-btn{color:#b8d8f5;}
html.light .uid-badge{color:#d0ecfa;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);}
html.light .module-card{background:#ffffff;box-shadow:none;border-color:#c0d8ec;}
html.light .module-card.civ-proc{background:#e6f3fc;border:1px solid rgba(36,100,160,.12);}

/* ── 테마 토글 버튼 ────────────────────────────────── */
.theme-toggle {
  display:flex;align-items:center;justify-content:center;
  width:32px;height:32px;border-radius:8px;cursor:pointer;
  background:var(--sf2);border:1px solid var(--bd);
  font-size:15px;transition:background .15s,border .15s;
  flex-shrink:0;
}
.theme-toggle:hover{background:var(--bd);border-color:var(--tx3);}

/* ── 허브 노티스 ───────────────────────────────────── */
.hub-notice {
  display:flex;align-items:flex-start;gap:8px;
  background:var(--sf2);border:1px solid var(--bd);border-radius:10px;
  padding:11px 14px;margin-bottom:14px;font-size:12px;
  color:var(--tx2);line-height:1.6;
}
.hub-notice-icon{font-size:14px;flex-shrink:0;margin-top:1px;}

/* ── 피드백 ───────────────────────────────────────────── */
.fb-btn{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;border:1px solid var(--bd);background:transparent;color:var(--tx3);font-size:11px;cursor:pointer;transition:all .15s;}
.fb-btn:hover{border-color:var(--gold);color:var(--gold);}
.fb-float-btn{position:fixed;bottom:18px;right:18px;z-index:900;display:flex;align-items:center;gap:5px;padding:7px 14px;border-radius:20px;border:1px solid var(--bd);background:var(--sf);color:var(--tx3);font-size:12px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25);transition:all .15s;}
.fb-float-btn:hover{border-color:var(--gold);color:var(--gold);box-shadow:0 3px 12px rgba(212,168,83,.2);}
.fb-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
.fb-modal{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:24px;width:100%;max-width:480px;max-height:80vh;overflow-y:auto;}
.fb-modal-title{font-size:15px;font-weight:700;color:var(--tx);margin-bottom:4px;}
.fb-modal-sub{font-size:12px;color:var(--tx3);margin-bottom:16px;}
.fb-qref{background:var(--sf2);border:1px solid var(--bd2);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--tx2);margin-bottom:14px;line-height:1.6;}
.fb-select-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.fb-type{padding:5px 12px;border-radius:16px;border:1px solid var(--bd);background:var(--sf2);color:var(--tx3);font-size:12px;cursor:pointer;transition:all .15s;}
.fb-type:hover{border-color:var(--gold);color:var(--gold);}
.fb-type.sel{background:var(--gf);border-color:var(--gf);color:#fff;font-weight:700;}
.fb-textarea{width:100%;box-sizing:border-box;background:var(--sf2);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-size:13px;font-family:'Pretendard',sans-serif;padding:10px 12px;resize:vertical;outline:none;line-height:1.6;}
.fb-textarea:focus{border-color:var(--gold);}
.fb-row{display:flex;gap:8px;margin-top:12px;justify-content:flex-end;}
.fb-submit{padding:9px 20px;background:var(--gf);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;}
.fb-submit:hover{background:var(--gold);}
.fb-cancel{padding:9px 14px;background:transparent;border:1px solid var(--bd);color:var(--tx3);border-radius:8px;font-size:13px;cursor:pointer;}
.fb-cancel:hover{border-color:var(--tx);color:var(--tx);}
.edit-btn{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;border:1px solid var(--bd);background:transparent;color:var(--tx3);font-size:11px;cursor:pointer;transition:all .15s;margin-right:4px;}
.edit-btn:hover{border-color:var(--blue);color:var(--blue);}
.edited-badge{font-size:9px;font-weight:700;color:var(--gold);background:rgba(106,171,200,.15);border:1px solid rgba(106,171,200,.3);border-radius:6px;padding:1px 5px;margin-left:5px;vertical-align:middle;}
/* 피드백 목록 (퀴즈 카드 하단) */
.fb-list{margin-top:12px;border-top:1px solid var(--bd2);padding-top:10px;}
.fb-item{background:var(--sf2);border:1px solid var(--bd2);border-radius:8px;padding:9px 12px;margin-bottom:7px;font-size:12px;}
.fb-item-head{display:flex;align-items:center;gap:6px;margin-bottom:4px;}
.fb-item-type{font-size:10px;font-weight:700;padding:2px 7px;border-radius:8px;background:rgba(212,168,83,.15);color:var(--gold);}
.fb-item-uid{font-size:11px;color:var(--tx3);}
.fb-item-date{font-size:10px;color:var(--tx3);margin-left:auto;}
.fb-item-body{color:var(--tx2);line-height:1.6;}
/* 관리자 피드백 목록 */
.fb-admin-item{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;margin-bottom:10px;}
.fb-admin-meta{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;}
.fb-admin-no{font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--blue);}
.fb-admin-type{font-size:11px;font-weight:700;color:var(--gold);}
.fb-admin-uid{font-size:11px;color:var(--tx3);}
.fb-admin-date{font-size:10px;color:var(--tx3);margin-left:auto;}
.fb-admin-q{font-size:12px;color:var(--tx2);margin-bottom:6px;padding:7px 10px;background:var(--sf2);border-radius:6px;line-height:1.5;}
.fb-admin-body{font-size:13px;color:var(--tx);line-height:1.6;}

/* ── PIN 입력 ─────────────────────────────────────── */
.pin-row{display:flex;gap:10px;justify-content:center;margin:16px 0;}
.pin-digit{width:52px;height:60px;border:2px solid var(--bd);border-radius:12px;
  background:var(--sf2);color:var(--tx);font-size:24px;font-weight:700;
  text-align:center;font-family:'IBM Plex Mono',monospace;outline:none;
  transition:border .15s;}
.pin-digit:focus{border-color:var(--gold);}
.pin-status{font-size:12px;text-align:center;min-height:18px;margin-bottom:8px;}
.pin-status.ok{color:var(--gold2);}
.pin-status.er{color:var(--er);}
.pin-status.info{color:var(--tx3);}
.login-step{font-size:11px;color:var(--tx3);text-align:center;margin-bottom:14px;letter-spacing:.05em;}
html,body{background:var(--bg);color:var(--tx);font-family:'Pretendard',system-ui,sans-serif;}
.app{min-height:100vh;display:flex;flex-direction:column;}

/* 헤더 */
.hdr{padding:16px 24px;border-bottom:1px solid var(--bd2);background:rgba(18,6,14,0.95);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:100;}
.hdr-left{display:flex;flex-direction:column;}
.hdr-title{font-family:'Noto Serif KR',serif;font-size:22px;font-weight:700;color:var(--tx);}
.hdr-sub{font-family:'Noto Serif KR',serif;font-size:13px;color:var(--gold);margin-top:3px;font-weight:600;letter-spacing:.01em;}
.hdr-user{display:flex;align-items:center;gap:8px;}
.uid-badge{font-size:12px;color:var(--tx2);background:var(--sf2);border:1px solid var(--bd);border-radius:14px;padding:4px 12px;}
.logout-btn{font-size:11px;color:var(--tx2);background:none;border:none;cursor:pointer;padding:4px 8px;border-radius:8px;}
.logout-btn:hover{color:var(--er);}

/* 탭 */
.tabs{display:flex;gap:2px;padding:10px 14px 0;border-bottom:1px solid var(--bd2);background:var(--sf);overflow-x:auto;}
.tab{padding:8px 16px;font-size:13px;font-weight:500;color:var(--tx3);cursor:pointer;border-radius:8px 8px 0 0;border:1px solid transparent;border-bottom:none;white-space:nowrap;background:transparent;transition:all .15s;}
.tab:hover{color:var(--tx2);}
.tab.act{color:var(--gold);background:var(--bg);border-color:var(--bd);border-bottom-color:var(--bg);margin-bottom:-1px;font-weight:700;}

/* 메인 */
.main{flex:1;padding:20px 16px;max-width:860px;margin:0 auto;width:100%;}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:22px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.18);}
.card-title{font-size:11px;font-weight:700;color:var(--tx3);margin-bottom:16px;text-transform:uppercase;letter-spacing:.8px;}

/* 로그인 - 비디오 배경 + 글래스모피즘 */
.login-scene{position:fixed;inset:0;z-index:0;overflow:hidden;}
.login-scene video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.login-scene::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(4,12,28,.25) 0%,rgba(8,20,45,.2) 50%,rgba(2,8,20,.3) 100%);}
.login-wrap{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-box{width:100%;max-width:400px;}
.login-header{text-align:center;margin-bottom:24px;}
.login-logo{font-family:'Noto Serif KR',serif;font-size:33px;font-weight:900;color:#fff;margin-bottom:6px;letter-spacing:-.3px;text-shadow:0 0 18px rgba(120,180,255,.7),0 2px 8px rgba(0,0,0,.9);}
.login-title{font-family:'Noto Serif KR',serif;font-size:19px;color:#fff;font-weight:600;margin-bottom:4px;letter-spacing:.06em;text-shadow:0 0 12px rgba(100,160,255,.6),0 1px 6px rgba(0,0,0,.9);}
.login-desc{font-size:13px;color:rgba(230,240,255,.95);line-height:1.6;text-shadow:0 1px 6px rgba(0,0,0,.9),0 0 8px rgba(0,0,0,.8);}
.login-card{
  background:transparent;
  border:2px solid rgba(255,255,255,.75);
  border-radius:22px;
  padding:30px 28px;
  box-shadow:0 0 18px rgba(140,190,255,.3), 0 0 40px rgba(100,160,255,.15), inset 0 0 18px rgba(140,190,255,.06);
}
.login-label{font-size:13px;color:#fff;margin-bottom:6px;letter-spacing:.03em;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.9);}
.login-input{
  width:100%;box-sizing:border-box;
  font-family:'Pretendard',sans-serif;font-size:15px;
  padding:11px 15px;
  border:1px solid rgba(255,255,255,.55);
  border-radius:12px;outline:none;
  background:rgba(255,255,255,.1);
  color:#fff;margin-bottom:10px;transition:all .18s;
  box-shadow:0 0 8px rgba(180,210,255,.2);
}
.login-input::placeholder{color:rgba(200,220,255,.55);}
.login-input:focus{border-color:rgba(130,190,255,.9);background:rgba(255,255,255,.15);box-shadow:0 0 0 3px rgba(100,160,255,.15),0 0 12px rgba(130,190,255,.35);}
.pin-digit{
  width:52px;height:58px;
  border:1px solid rgba(255,255,255,.55);border-radius:12px;
  background:rgba(255,255,255,.1);
  color:#fff;font-size:22px;font-weight:700;
  text-align:center;font-family:'IBM Plex Mono',monospace;outline:none;
  transition:border .15s, box-shadow .15s;
  box-shadow:0 0 8px rgba(180,210,255,.2);
}
.pin-digit:focus{border-color:rgba(130,190,255,.9);box-shadow:0 0 0 3px rgba(100,160,255,.15),0 0 12px rgba(130,190,255,.35);}
.login-btn{
  width:100%;padding:13px;
  background:rgba(100,160,255,.35);
  color:#fff;border:1px solid rgba(140,190,255,.7);border-radius:12px;
  font-size:14px;font-weight:700;cursor:pointer;
  transition:all .18s;
  box-shadow:0 0 12px rgba(100,160,255,.4),0 4px 16px rgba(60,120,255,.25);
  letter-spacing:.04em;
}
.login-btn:hover{background:rgba(100,160,255,.5);border-color:rgba(180,220,255,.85);transform:translateY(-1px);box-shadow:0 0 18px rgba(100,160,255,.55),0 8px 24px rgba(60,120,255,.3);}
.login-btn:active{transform:translateY(0);box-shadow:0 0 8px rgba(100,160,255,.3);}
.login-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.login-hint{font-size:12px;color:rgba(230,240,255,.9);text-align:center;margin-top:10px;line-height:1.6;text-shadow:0 1px 5px rgba(0,0,0,.9);word-break:keep-all;}

/* 허브 모듈 그리드 */
.hub-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px;}
@media(max-width:700px){.hub-grid{grid-template-columns:repeat(2,1fr);}}

  .question{font-size:14px;line-height:1.85;}
  .rv-exp{font-size:13.5px;}
  .edit-btn{white-space:nowrap;font-size:10px;padding:2px 7px;gap:3px;margin-right:3px;}
  .fb-btn{white-space:nowrap;font-size:10px;padding:2px 7px;gap:3px;}
  .star-badge{white-space:nowrap;font-size:9px;padding:1px 5px;gap:2px;}
  .qcard-topic{white-space:nowrap;font-size:10px;padding:1px 6px;}
  .qcard-meta{gap:4px;}
  .ox{font-size:34px;padding:14px 16px;}
  .prog-label{font-size:11px;}
  .prog-num{font-size:18px;}
  .qcard{padding:14px 12px;}

.module-prog-text{font-size:11px;color:var(--muted);margin-top:3px;}
.module-card.civ-proc{background:rgba(122,184,216,.1);border:1px solid rgba(122,184,216,.22);}
.module-card.civ-proc .module-accent{display:none;}
.module-card.civ-proc .soon-badge{background:rgba(121,192,255,.15);color:#79c0ff;border:1px solid rgba(121,192,255,.25);}
.module-card{background:var(--sf);border:1px solid var(--bd);border-radius:4px;padding:22px 20px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.18);}
.module-card.active:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(46,98,130,.2);}
.module-card.soon{opacity:.55;cursor:not-allowed;}
.module-card.soon:hover{transform:none;}
.module-accent{display:none;}
.module-icon{font-size:40px;margin-bottom:14px;color:var(--gold);line-height:1;}
.module-name{font-family:'Noto Serif KR',serif;font-size:15px;font-weight:700;color:var(--tx);margin-bottom:3px;}

// ── 헬퍼 ─────────────────────────────────────────────
const TOPIC_ICONS = {}

// ── 메인 앱 ───────────────────────────────────────────
function App() {
  // ── 로그인/세션 상태
  const [uid,    setUid]    = useState(null);     // 현재 사용자 ID
  const [bgSrc] = useState(() => {
    const vids=["bg_a.mp4","bg_b.mp4","bg_c.mp4","bg_d.mp4"];
    let s=sessionStorage.getItem("ox_bg");
    if(!s){s=vids[Math.floor(Math.random()*vids.length)];sessionStorage.setItem("ox_bg",s);}
    return s;
  });
  const bgVideoRef = useRef(null);
  useEffect(() => {
    const v = bgVideoRef.current;
    if (v) { v.muted = true; v.play().catch(() => {}); }
  }, []);
  const [isAdmin,setIsAdmin]= useState(false);

  // ── 화면 상태
  const [screen, setScreen] = useState("hub");    // hub | quiz | archive | admin
  const [activeModule, setActiveModule] = useState(null); // 현재 선택된 모듈

  // ── 퀴즈 설정
  const [cfgRound,  setCfgRound]  = useState(1);
  const [cfgMode,   setCfgMode]   = useState("all");
  const [cfgTopics, setCfgTopics] = useState([]);

  // ── 퀴즈 진행
  const [inQuiz,   setInQuiz]   = useState(false);
  const [queue,    setQueue]    = useState([]);
  const [qidx,     setQidx]     = useState(0);
  const [answered, setAnswered] = useState(null);
  const [userAns,  setUserAns]  = useState(null);
  const [showExp,  setShowExp]  = useState(false);
  const [sessCor,  setSessCor]  = useState(0);
  const [sessErr,  setSessErr]  = useState(0);
  const [sessMark, setSessMark] = useState(0);
  const [done,     setDone]     = useState(false);
  const [label,    setLabel]    = useState("");
  const [timerLeft, setTimerLeft] = useState(20);
  const timerRef  = React.useRef(null);
  const qidxRef   = React.useRef(0);
  const queueRef  = React.useRef([]);

  // ── 스토리지 (모듈별 회독별)
  const [hubStats,  setHubStats]  = useState({});  // {modId: {wc, mc, pct}}
  const [wrongMap,  setWrongMap]  = useState({});
  const [markedMap, setMarkedMap] = useState({});
  const [progMap,   setProgMap]   = useState({});

  // ── 아카이브
  const [archExp,     setArchExp]     = useState({});
  const [archFilter,  setArchFilter]  = useState("wrong");

  // ── 피드백
  const [fbOpen,    setFbOpen]    = useState(false);
  const [fbType,    setFbType]    = useState("오류 제보");
  const [fbText,    setFbText]    = useState("");
  const [fbList,    setFbList]    = useState([]);  // 현재 문항 피드백
  const [fbLoading, setFbLoading] = useState(false);
  const [archRound,   setArchRound]   = useState(1);
  const [awWrongMap,  setAwWrongMap]  = useState({});
  const [awMarkMap,   setAwMarkMap]   = useState({});

  // ── 문항 수정본 (공유)
  const [userEdits, setUserEdits] = useState({});

  // ── 이어풀기 세션
  const [savedSession, setSavedSession] = useState(null);

  // ── 관리자
  const [adminUsers,  setAdminUsers]  = useState([]);
  const [adminSearch, setAdminSearch] = useState("");
  const [adminResult, setAdminResult] = useState(null);
  const [adminFbs,    setAdminFbs]    = useState(null);  // null=미로드, {}=로드완료
  const [adminFbLoad, setAdminFbLoad] = useState(false);
  const [editOpen,    setEditOpen]    = useState(false);
  const [editTarget,  setEditTarget]  = useState(null);
  const [editQ,       setEditQ]       = useState('');
  const [editE,       setEditE]       = useState('');
  const [adminEdits,  setAdminEdits]  = useState(null);
  const [adminEditLoad,setAdminEditLoad]=useState(false);

  // ── 테마 (dark / light)
  const [theme, setTheme] = React.useState(() => {
    try { return localStorage.getItem('quiz_theme') || 'light'; } catch { return 'light'; }
  });
  React.useEffect(() => {
    document.documentElement.classList.toggle('light', theme === 'light');
    try { localStorage.setItem('quiz_theme', theme); } catch {}
  }, [theme]);

  // ── 초기화: 로컬스토리지에서 마지막 uid 복원
  useEffect(() => {
    const saved = localStorage.getItem("hub_last_uid") || "";
    if (saved) tryLogin(saved, true);
  }, []);

  // ── 스토리지 저장 헬퍼
  const sw = async (key, val) => { try { await window.storage.set(key, JSON.stringify(val)); } catch {} };
  const gr = async (key, fallback) => { try { const r = await window.storage.get(key); return r ? JSON.parse(r.value) : fallback; } catch { return fallback; } };

  // ── 로그인
  async function tryLogin(id, silent=false) {
    if (!id.trim()) return;
    const isAdm = id === ADMIN_ID;
    setUid(id);
    setIsAdmin(isAdm);
    localStorage.setItem("hub_last_uid", id);

    // 접속 시각 갱신 (PIN 로그인에서 이미 info 설정됨, 여기서는 lastSeen만 갱신)
    if (!isAdm) {
      const safeId = id.replace(/[.#$\[\]]/g, '_');
      try {
        const existing = await fb.get(`users/${safeId}/info`);
        await fb.set(`users/${safeId}/info`, {
          ...(existing || { id }),
          lastSeen: Date.now(),
          lastDate: new Date().toLocaleDateString('ko-KR')
        });
      } catch {}
      await sw(K_UTIME(id), Date.now());
    }

    // 첫 번째 활성 모듈 설정
    const firstMod = MODULE_REGISTRY.find(m => m.status === "active");
    if (firstMod) setActiveModule(firstMod.id);

    if (sessionStorage.getItem("ox_skip_subject")) {
      sessionStorage.removeItem("ox_skip_subject");
      setScreen("hub");
    } else {
      setScreen("subject");
    }
    loadHubStats(id);
  }

  // ── 모듈 스토리지 로드
  async function loadHubStats(userId) {
    if (!userId) return;
    const sid = toSafeId(userId);
    const stats = {};
    for (const mod of MODULE_REGISTRY.filter(m=>m.status==="active")) {
      const allWrong = new Set(), allMarked = new Set();
      let answered=0, total=mod.count||0;
      for (const r of ROUNDS) {
        const fbW = await fb.get(fbPath.wrong(sid,mod.id,r));
        const w = fbW || await gr(K_WRONG(userId,mod.id,r), []);
        w.forEach(id=>allWrong.add(id));
        const fbM = await fb.get(fbPath.marked(sid,mod.id,r));
        const m2 = fbM || await gr(K_MARKED(userId,mod.id,r), []);
        m2.forEach(id=>allMarked.add(id));
      }
      // 진행률: 1회독 기준
      const fbP = await fb.get(fbPath.prog(sid,mod.id,1));
      const lsP = await gr(K_PROG(userId,mod.id,1), {answered:[]});
      const p = fbP || lsP;
      answered = (p.answered||[]).length;
      const pct = total ? Math.round(answered/total*100) : 0;
      stats[mod.id] = {wc: allWrong.size, mc: allMarked.size, answered, pct};
    }
    setHubStats(stats);
  }

  async function loadModuleData(mid) {
    if (!uid) return;
    const sid = toSafeId(uid);
    const wm = {}, mm = {}, pm = {}, awm = {}, amm = {};

    for (const r of ROUNDS) {
      // Firebase 우선, 없으면 localStorage 폴백
      const fbW = await fb.get(fbPath.wrong(sid,mid,r));
      wm[r] = new Set(fbW || await gr(K_WRONG(uid,mid,r), []));

      const fbM = await fb.get(fbPath.marked(sid,mid,r));
      mm[r] = new Set(fbM || await gr(K_MARKED(uid,mid,r), []));

      const fbP = await fb.get(fbPath.prog(sid,mid,r));
      const lsP = await gr(K_PROG(uid,mid,r), {answered:[],correct:[],wrong:[]});
      const p   = fbP || lsP;
      pm[r] = { answered:new Set(p.answered||[]), correct:new Set(p.correct||[]), wrong:new Set(p.wrong||[]) };

      const fbAW = await fb.get(fbPath.awWrong(sid,mid,r));
      awm[r] = new Set(fbAW || await gr(K_AW_WRONG(uid,mid,r), []));

      const fbAM = await fb.get(fbPath.awMark(sid,mid,r));
      amm[r] = new Set(fbAM || await gr(K_AW_MARK(uid,mid,r), []));
    }

    setWrongMap(wm); setMarkedMap(mm); setProgMap(pm);
    setAwWrongMap(awm); setAwMarkMap(amm);

    // 아카이브 회독
    const fbAR = await fb.get(fbPath.archRound(sid,mid));
    const arVal = fbAR ?? await gr(K_AW_ROUND(uid,mid), 1);
    setArchRound(arVal);

    // 세션
    const fbSess = await fb.get(fbPath.session(sid,mid));
    const lsSess = await gr(K_SESSION(uid,mid), null);
    setSavedSession(fbSess || lsSess);

    // 수정본 (Firebase 공유)
    const fbEdits = await fb.list(`edits/${mid}`);
    const edits = {};
    for (const ed of Object.values(fbEdits||{})) {
      if (ed?.qid) edits[ed.qid] = {question:ed.question, explanation:ed.explanation};
    }
    setUserEdits(edits);
  }

  useEffect(() => { if (uid && activeModule) loadModuleData(activeModule); }, [uid, activeModule]);

  // 수정본 저장 (공유: 모든 유저에게 적용)
  const saveEdit = async (qid, q, e) => {
    const next = {...userEdits};
    if (q === null) {
      delete next[qid];
    } else {
      next[qid] = { ...(next[qid]||{}), question: q, explanation: e };
    }
    setUserEdits(next);
    await window.storage.set(K_EDITS(activeModule), JSON.stringify(next));
  };

  // 현재 문항에 수정본 적용
  const applyEdit = (q) => {
    if (!q) return q;
    const ed = userEdits[q.id];
    if (!ed) return q;
    return { ...q, question: ed.question ?? q.question, explanation: ed.explanation ?? q.explanation };
  };

  // 이중 저장: Firebase(공유) + localStorage(빠른 읽기)
  const _fbsw = (path, data) => { fb.set(path, data); }; // fire-and-forget

  const saveWrong = (r,s) => {
    const arr = [...s];
    sw(K_WRONG(uid,activeModule,r), arr);
    _fbsw(fbPath.wrong(toSafeId(uid),activeModule,r), arr);
  };
  const saveMarked = (r,s) => {
    const arr = [...s];
    sw(K_MARKED(uid,activeModule,r), arr);
    _fbsw(fbPath.marked(toSafeId(uid),activeModule,r), arr);
  };
  const saveProg = (r,p) => {
    const obj = {answered:[...p.answered],correct:[...p.correct],wrong:[...p.wrong]};
    sw(K_PROG(uid,activeModule,r), obj);
    _fbsw(fbPath.prog(toSafeId(uid),activeModule,r), obj);
  };
  const saveAwWrong = (r,s) => {
    const arr = [...s];
    sw(K_AW_WRONG(uid,activeModule,r), arr);
    _fbsw(fbPath.awWrong(toSafeId(uid),activeModule,r), arr);
  };
  const saveAwMark = (r,s) => {
    const arr = [...s];
    sw(K_AW_MARK(uid,activeModule,r), arr);
    _fbsw(fbPath.awMark(toSafeId(uid),activeModule,r), arr);
  };
  const saveArchRound = (r) => {
    sw(K_AW_ROUND(uid,activeModule), r);
    _fbsw(fbPath.archRound(toSafeId(uid),activeModule), r);
  };
  const saveSession = (sess) => {
    sw(K_SESSION(uid,activeModule), sess || null);
    _fbsw(fbPath.session(toSafeId(uid),activeModule), sess || null);
  };

  // ── 퀴즈 시작
  function launchQuiz(round, mode, topics, resumeData=null, forceNew=false) {
    const mod = MODULE_REGISTRY.find(m => m.id === activeModule);
    if (!mod) return;
    const all = mod.getData();
    let pool, lbl;

    // 아카이브 전용 회독(aw_*): archRound 기준
    if (mode === "aw_wrong") {
      const r = archRound;
      pool = all.filter(q => (awWrongMap[r]||new Set()).has(q.id));
      if (!pool.length) return;
      lbl = `아카이브 ${r}회독 · 오답 (${pool.length}문제)`;
    } else if (mode === "aw_mark") {
      const r = archRound;
      pool = all.filter(q => (awMarkMap[r]||new Set()).has(q.id));
      if (!pool.length) return;
      lbl = `아카이브 ${r}회독 · 헷갈림 (${pool.length}문제)`;
    } else if (mode === "aw_all") {
      const r = archRound;
      const wids = awWrongMap[r]||new Set(), mids = awMarkMap[r]||new Set();
      pool = all.filter(q => wids.has(q.id)||mids.has(q.id));
      if (!pool.length) return;
      lbl = `아카이브 ${r}회독 · 전체 (${pool.length}문제)`;
    } else if (mode === "wrong+marked") {
      const wids = wrongMap[round]||new Set(), mids = markedMap[round]||new Set();
      pool = all.filter(q => wids.has(q.id) || mids.has(q.id));
      if (!pool.length) return;
      lbl = `${round}회독 오답+헷갈림 (${pool.length}문제)`;
    } else if (mode === "rnd100") {
      pool = shuffle([...all]).slice(0, 100);
      lbl = `${round}회독 무작위 100문제`;
    } else if (mode === "star") {
      pool = all.filter(q => q.star);
      if (!pool.length) return;
      lbl = `${round}회독 · ⭐ 중요문제 (${pool.length}문제)`;
    } else if (mode === "topic") {
      pool = topics.length > 0 ? all.filter(q => topics.some(t => t === "15V" ? String(q.id).startsWith("15V") : q.topic === t)) : [...all];
      lbl = `${round}회독 · ${topics.length > 0 ? topics.map(t=>mod.topics.find(x=>x.key===t)?.label||t).join(', ') : '전체'} (${pool.length}문제)`;
    } else {
      pool = [...all];
      lbl = `${round}회독 전체 ${all.length}문제`;
    }

    // 이어풀기: resumeData가 있으면 복원, 없으면 섞어서 시작
    let finalQueue, startIdx;
    // forceNew=false이고 resumeData 없으면 savedSession 자동 사용
    const effectiveResume = forceNew ? null : (resumeData || savedSession);
    const topicsMatch = mode !== "topic" || (
      effectiveResume &&
      [...(effectiveResume.topics||[])].sort().join(",") === [...topics].sort().join(",")
    );
    if (effectiveResume && effectiveResume.mode === mode && effectiveResume.round === round
      && effectiveResume.module === activeModule && topicsMatch) {
      // 저장된 큐 순서 복원 (ID 배열로 저장 → 실제 문제 객체로 매핑)
      const qMap = Object.fromEntries(all.map(q=>[q.id, q]));
      const restored = (effectiveResume.queueIds||[]).map(id=>qMap[id]).filter(Boolean);
      if (restored.length > 0) {
        finalQueue = restored;
        startIdx = effectiveResume.qidx || 0;
        lbl = effectiveResume.label || lbl;
      } else {
        finalQueue = shuffle(pool);
        startIdx = 0;
      }
    } else {
      finalQueue = shuffle(pool);
      startIdx = 0;
    }

    // 세션 저장
    const sessData = {
      mode, round, topics,
      queueIds: finalQueue.map(q=>q.id),
      qidx: startIdx,
      label: lbl,
      module: activeModule,
    };
    saveSession(sessData);
    setSavedSession(sessData);

    setQueue(finalQueue);
    setQidx(startIdx); setAnswered(null); setUserAns(null); setShowExp(false);
    setFbList([]); setFbOpen(false);
    setSessCor(0); setSessErr(0); setSessMark(0);
    setDone(false); setLabel(lbl); setInQuiz(true); setScreen("quiz");
  }

  function exitQuiz() {
    // 종료 시 현재 위치 저장 (qidx 갱신된 상태 유지 → 이어풀기용)
    setInQuiz(false); setDone(false); setScreen("quiz");
  }

  function handleAnswer(choice) {
    if (answered !== null) return;
    const cur = queue[qidx];
    const correct = choice === cur.answer;
    setUserAns(choice); setAnswered(correct ? "ok" : "er"); setShowExp(false);
    const r = cfgRound;
    const np = {
      answered: new Set([...(progMap[r]?.answered||[]), cur.id]),
      correct:  new Set([...(progMap[r]?.correct||[])]),
      wrong:    new Set([...(progMap[r]?.wrong||[])])
    };
    const nw = new Set(wrongMap[r]||[]);
    if (correct) { np.correct.add(cur.id); setSessCor(p=>p+1); }
    else { np.wrong.add(cur.id); nw.add(cur.id); setSessErr(p=>p+1); }
    setProgMap(pm=>({...pm,[r]:np}));
    setWrongMap(wm=>({...wm,[r]:nw}));
    saveProg(r,np); saveWrong(r,nw);

    // 아카이브 회독용 오답 추가 (메인 오답은 아카이브 현재 회독에도 자동 적재)
    if (!correct) {
      const ar = archRound;
      const nawm = new Set(awWrongMap[ar]||[]);
      nawm.add(cur.id);
      setAwWrongMap(m=>({...m,[ar]:nawm}));
      saveAwWrong(ar, nawm);
    }
  }

  function toggleMark() {
    const cur = queue[qidx]; const r = cfgRound;
    const nm = new Set(markedMap[r]||[]);
    if (nm.has(cur.id)) { nm.delete(cur.id); setSessMark(p=>Math.max(0,p-1)); }
    else { nm.add(cur.id); setSessMark(p=>p+1); }
    setMarkedMap(mm=>({...mm,[r]:nm}));
    saveMarked(r,nm);

    // 아카이브 회독용 헷갈림도 동기화
    const ar = archRound;
    const namm = new Set(awMarkMap[ar]||[]);
    if (nm.has(cur.id)) namm.add(cur.id); else namm.delete(cur.id);
    setAwMarkMap(m=>({...m,[ar]:namm}));
    saveAwMark(ar, namm);
  }

  function handleNext() {
    if (qidx+1 >= queue.length) {
      setDone(true);
      saveSession(null); // 완료 시 세션 삭제
      setSavedSession(null);
    } else {
      const nextIdx = qidx+1;
      setQidx(nextIdx);
      setAnswered(null); setUserAns(null); setShowExp(false);
      setFbList([]); setFbOpen(false);
      // 세션 qidx 갱신
      if (savedSession) {
        const updated = {...savedSession, qidx: nextIdx};
        setSavedSession(updated);
        saveSession(updated);
      }
    }
  }

  // ── rnd100 타이머: qidx·inQuiz 변화 시 리셋 ──────────────
  useEffect(() => { qidxRef.current = qidx; }, [qidx]);
  useEffect(() => { queueRef.current = queue; }, [queue]);

  useEffect(() => {
    if (cfgMode !== "rnd100" || !inQuiz || done) {
      clearInterval(timerRef.current); return;
    }
    clearInterval(timerRef.current);
    setTimerLeft(20);
    timerRef.current = setInterval(() => {
      setTimerLeft(t => { if (t <= 1) { clearInterval(timerRef.current); return 0; } return t - 1; });
    }, 1000);
    return () => clearInterval(timerRef.current);
  }, [qidx, inQuiz, cfgMode, done]);

  // 답변 시 타이머 정지
  useEffect(() => { if (answered !== null) clearInterval(timerRef.current); }, [answered]);

  // 시간 초과 처리
  useEffect(() => {
    if (timerLeft !== 0 || cfgMode !== "rnd100" || answered !== null || !inQuiz || done) return;
    const cur = queue[qidx];
    if (!cur) return;
    // 오답 강제 처리
    setAnswered("er"); setUserAns(null); setShowExp(false);
    setSessErr(p => p + 1);
    const r = cfgRound;
    const np = {
      answered: new Set([...(progMap[r]?.answered||[]), cur.id]),
      correct:  new Set([...(progMap[r]?.correct ||[])]),
      wrong:    new Set([...(progMap[r]?.wrong   ||[])])
    };
    np.wrong.add(cur.id);
    const nw = new Set(wrongMap[r]||[]); nw.add(cur.id);
    setProgMap(pm=>({...pm,[r]:np})); setWrongMap(wm=>({...wm,[r]:nw}));
    saveProg(r,np); saveWrong(r,nw);
    const ar = archRound;
    const nawm = new Set(awWrongMap[ar]||[]); nawm.add(cur.id);
    setAwWrongMap(m=>({...m,[ar]:nawm})); saveAwWrong(ar,nawm);
    // 1.3초 후 자동 다음 문제
    setTimeout(() => {
      const nextIdx = qidxRef.current + 1;
      if (nextIdx >= queueRef.current.length) {
        setDone(true); saveSession(null); setSavedSession(null);
      } else {
        setQidx(nextIdx); setAnswered(null); setUserAns(null);
        setShowExp(false); setFbList([]); setFbOpen(false);
      }
    }, 1300);
  }, [timerLeft]); // eslint-disable-line


  async function resetModule() {
    if (!confirm(`${activeModule} 모듈 전체 기록을 초기화하시겠습니까?`)) return;
    for (const r of ROUNDS) {
      const np = {answered:new Set(),correct:new Set(),wrong:new Set()};
      setProgMap(pm=>({...pm,[r]:np}));
      setWrongMap(wm=>({...wm,[r]:new Set()}));
      setMarkedMap(mm=>({...mm,[r]:new Set()}));
      saveProg(r,np); saveWrong(r,new Set()); saveMarked(r,new Set());
    }
  }

  // ── 헬퍼
  const getMod   = () => MODULE_REGISTRY.find(m => m.id === activeModule);
  const getAll   = () => getMod()?.getData() || [];
  const wCnt     = r => (wrongMap[r]||new Set()).size;
  const mCnt     = r => (markedMap[r]||new Set()).size;
  const wmCnt    = r => new Set([...(wrongMap[r]||new Set()), ...(markedMap[r]||new Set())]).size;
  const awCnt    = r => (awWrongMap[r]||new Set()).size;
  const amCnt    = r => (awMarkMap[r]||new Set()).size;
  const awTotal  = r => { const w=awWrongMap[r]||new Set(), m=awMarkMap[r]||new Set(); return new Set([...w,...m]).size; };
  const tCnt     = k => getAll().filter(q=> k==="15V" ? String(q.id).startsWith("15V") : q.topic===k).length;
  const tWrong   = (r,k) => getAll().filter(q=>(k==="15V" ? String(q.id).startsWith("15V") : q.topic===k)&&(wrongMap[r]||new Set()).has(q.id)).length;
  const tProg    = (r,k) => { const all=getAll().filter(q=> k==="15V" ? String(q.id).startsWith("15V") : q.topic===k); const ans=(progMap[r]?.answered||new Set()); const done=all.filter(q=>ans.has(q.id)).length; return {done, total:all.length, pct:all.length?Math.round(done/all.length*100):0}; };
  const TOTAL    = getAll().length;
  const getProg  = r => { const p=progMap[r]||{answered:new Set()}; return { ans:p.answered.size, pct:Math.round(p.answered.size/Math.max(TOTAL,1)*100) }; };
  const canStart = cfgMode !== "topic" || cfgTopics.length > 0;
  // 이어풀기 세션이 현재 설정과 매칭되는지 확인
  const hasResume = savedSession && savedSession.round===cfgRound && savedSession.mode===cfgMode
    && savedSession.module===activeModule
    && (cfgMode!=="topic" || (savedSession.topics||[]).join(",")===[...cfgTopics].sort().join(","))
    && (savedSession.qidx||0) > 0
    && (savedSession.queueIds||[]).length > (savedSession.qidx||0);
  const startCnt = cfgMode==="all" ? TOTAL : cfgMode==="rnd100" ? 100 : cfgMode==="topic" ? getAll().filter(q=>cfgTopics.includes(q.topic)).length : cfgMode==="wrong+marked" ? wmCnt(cfgRound) : 0;
  const cur      = applyEdit(queue[qidx]);
  const curMark  = cur && (markedMap[cfgRound]||new Set()).has(cur.id);

  // 아카이브 표시
  const archItems = r => {
    const wids = wrongMap[r]||new Set(), mids = markedMap[r]||new Set();
    if (archFilter==="wrong")  return getAll().filter(q=>wids.has(q.id));
    if (archFilter==="marked") return getAll().filter(q=>mids.has(q.id)&&!wids.has(q.id));
    return getAll().filter(q=>wids.has(q.id)||mids.has(q.id));
  };

  // 관리자 유저 목록 로드
  // ── 피드백 로드 (현재 문항)

  async function loadAllFeedbacks() {
    try {
      const allMods = {};
      for (const mod of MODULE_REGISTRY.filter(m=>m.status==="active")) {
        const modData = await fb.list(`feedbacks/${mod.id}`);
        const items = [];
        for (const [qid, qFbs] of Object.entries(modData||{})) {

          }
        }

      }
      return allMods;
    } catch { return {}; }
  }


  async function loadAdminUsers() {
    // Firebase에서 전체 유저 + 완전한 학습 통계 조회
    const fbAll = await fb.list('users');
    if (!fbAll) { setAdminUsers([]); return; }

    const users = [];
    for (const [safeId, userData] of Object.entries(fbAll)) {
      if (!userData || typeof userData !== 'object') continue;
      // info 서브키 있는 경우(신규)와 없는 경우(구버전) 모두 지원
      const info = userData.info || {};
      const id = info.id || userData.id || safeId;
      if (!id || id === ADMIN_ID) continue;
      const lastSeen = info.lastSeen || userData.lastSeen || 0;
      const lastDate = info.lastDate || userData.lastDate || '';

      const stats = userData?.stats || {};
      let total_ans=0, total_cor=0, total_wrg=0;
      const modStats = [];

      for (const mod of MODULE_REGISTRY.filter(m=>m.status==="active")) {
        const modData = stats[mod.id] || {};
        let m_ans=0, m_cor=0, m_wrg=0;
        for (const r of ROUNDS) {
          const p = modData[`prog_${r}`] || {};
          m_ans += (p.answered||[]).length;
          m_cor += (p.correct||[]).length;
          m_wrg += (p.wrong||[]).length;
        }
        total_ans+=m_ans; total_cor+=m_cor; total_wrg+=m_wrg;
        if (m_ans>0) modStats.push({mod:mod.label, ans:m_ans, cor:m_cor, wrg:m_wrg,
          pct: m_ans>0?Math.round(m_cor/m_ans*100):0});
      }
      users.push({ id, last:lastSeen, lastDate, ans:total_ans, cor:total_cor, wrg:total_wrg, modStats });
    }
    users.sort((a,b)=>(b.last||0)-(a.last||0));
    setAdminUsers(users);
  }

  async function adminSearchUser(searchId) {
    if (!searchId.trim()) return;
    const id = searchId.trim();
    const safeId = toSafeId(id);

    // Firebase에서 완전한 데이터 조회
    const userData = await fb.get(`users/${safeId}`);
    if (!userData) { setAdminResult({id, notFound:true}); return; }

    // info 서브키 있는 경우(신규)와 없는 경우(구버전) 모두 지원
    const info  = userData.info  || {};
    const stats = userData.stats || {};
    const lastSeen_ = info.lastSeen || userData.lastSeen || 0;
    const lastDate_ = info.lastDate || userData.lastDate || '';
    let total_ans=0, total_cor=0, total_wrg=0;
    const modStats = [];

    for (const mod of MODULE_REGISTRY.filter(m=>m.status==="active")) {
      const modData = stats[mod.id] || {};
      let m_ans=0, m_cor=0, m_wrg=0, m_wrg_cnt=0, m_mk_cnt=0;
      for (const r of ROUNDS) {
        const p = modData[`prog_${r}`] || {};
        m_ans += (p.answered||[]).length;
        m_cor += (p.correct||[]).length;
        m_wrg += (p.wrong||[]).length;
        m_wrg_cnt += (modData[`wrong_${r}`]||[]).length;
        m_mk_cnt  += (modData[`marked_${r}`]||[]).length;
      }
      total_ans+=m_ans; total_cor+=m_cor; total_wrg+=m_wrg;
      if (m_ans>0) modStats.push({mod:mod.label, ans:m_ans, cor:m_cor, wrg:m_wrg,
        pct:m_ans>0?Math.round(m_cor/m_ans*100):0, wrongCnt:m_wrg_cnt, markCnt:m_mk_cnt});
    }

    if (!lastSeen_ && total_ans===0) { setAdminResult({id, notFound:true}); return; }
    setAdminResult({id, last:lastSeen_, lastDate:lastDate_, ans:total_ans, cor:total_cor, wrg:total_wrg, modStats});

  function renderExp(exp) {
    if (!exp) return null;
    const boxStyle = {
      background:'var(--sf2)', border:'1px solid var(--bd2)',
      borderLeft:'3px solid var(--blue)', borderRadius:6,
      padding:'6px 10px', margin:'4px 0', fontSize:14,
      color:'var(--tx2)', fontFamily:"'Noto Sans KR', sans-serif", lineHeight:1.6
    };
    // ▸ 앞 또는 \n[AI해설] 앞에서 분리
    const segs = exp.split(/(?=▸)|\n(?=\[AI해설\])/).filter(s => s.trim());
    return segs.map((seg, si) => {
      const t = seg.trim();
      // [AI해설] 섹션
      if (t.startsWith('[AI해설]')) {
        return (
          <div key={si} style={{marginTop:10,paddingTop:8,borderTop:'1px dashed rgba(255,255,255,.1)',fontSize:14,color:'var(--tx3)',lineHeight:1.7}}>
            <span style={{display:'inline-block',background:'rgba(82,167,254,.15)',color:'var(--blue)',borderRadius:4,padding:'1px 6px',fontSize:10,fontWeight:700,marginRight:6}}>AI해설</span>
            {t.slice('[AI해설]'.length).trim()}
          </div>
        );
      }
      // [조문] 전체 섹션 → 박스
      if (t.startsWith('[조문]')) {
        return <div key={si} style={{...boxStyle, marginBottom: si < segs.length-1 ? 6 : 0}}>{t.slice('[조문]'.length).trim()}</div>;
      }
      // 일반 ▸ 섹션 — 인라인 제NNN조 / [법조문] / [조문] 박스 처리
      const parts = seg.split(/(제\d+조[^가-힣\n]{5,150}[가-힣]|\[법조문\][^\n]+|\[조문\][^\n]+)/g);
      const nextIsAI = segs[si+1]?.trim().startsWith('[AI해설]');
      return (
        <div key={si} style={{marginBottom: si < segs.length-1 && !nextIsAI ? 10 : 0}}>
          {parts.map((p, pi) => {
            const pt = p.trim();
            if (/^제\d+조/.test(pt) || /^\[법조문\]/.test(pt)) return <div key={pi} style={boxStyle}>{p}</div>;
            if (/^\[조문\]/.test(pt)) return <div key={pi} style={boxStyle}>{p.replace(/^\[조문\]\s*/,'')}</div>;
            return <span key={pi} style={{whiteSpace:'pre-wrap'}}>{p}</span>;
          })}
        </div>
      );
    });

                        <span className="fb-admin-uid">👤 {item.uid}</span>
                        <span className="fb-admin-date">{item.date}</span>
                      </div>
                      {item.original_q&&item.original_q!==item.question&&(
                        <div style={{fontSize:11,color:"var(--tx3)",marginBottom:4,
                          textDecoration:"line-through",padding:"4px 8px",background:"var(--sf2)",borderRadius:4}}>
                          {item.original_q}
                        </div>
                      )}
                      <div className="fb-admin-body" style={{fontSize:12}}>{item.question}</div>
                    </div>
                  ))}
                </div>
              ))}
            </div>

          </div>
        )}

      </div>
    </div>
    </>
  );
}
