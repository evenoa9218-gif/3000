["512", "★ 재정신청 기각결정이 확정된 사건에 대해서 관련 민사판결에서 다른 취지의 판결을 하였다면 이러한 판결은 그 자체가 새로 발견된 증거에 해당되므로 소추할 수 있다.", false, "▸ 관련 민사판결에서의 사실인정 및 판단은, 그러한 사실인정 및 판단의 근거가 된 증거자료가 새로 발견된 증거에 해당할 수 있음은 별론으로 하고, 그 자체가 새로 발견된 증거라고 할 수는 없다. [2014도17182]", "수사종결공소"],
["513", "★ 「형사소송법」제215조는 검사가 압수·수색영장을 청구할 수 있는 시기를 공소제기 전으로 한정하고 있지 않지만, 일단 공소가 제기된 후에는 피고사건에 관하여 검사로서는「형사소송법」제215조에 의하여 압수·수색을 할 수 없다.", true, "▸ 일단 공소가 제기된 후에는 피고사건에 관하여 검사로서는 제215조에 의하여 압수·수색을 할 수 없다. [2009도10412]", "수사종결공소"],
["514", "甲은 점유이탈물횡령죄로 기소되어 법원에서 제1심 재판을 받고 있다. 검사는 횡령죄로 공소장변경을 신청하고, 증거를 보완하기 위하여 乙 주거지 관할 지방법원의 금융계좌 등에 대한 압수·수색영장을 청구하였다. 법원 판사가 위 영장을 발부한 경우, 검사는 그 영장을 통해 확보한 수표발행전표 등을 위 재판의 증거로 사용할 수 있다.", false, "▸ 공소제기 후에는 피고사건에 관하여 검사로서는 제215조에 의하여 압수·수색을 할 수 없고, 그와 같이 수집된 증거는 원칙적으로 유죄의 증거로 삼을 수 없다. [2009도10412]", "수사종결공소"],
["515", "★ 공소제기 후에는 수사기관에 의한 피고인의 구속이 허용되지 않는다.", true, "▸ 공소제기 후 구속·압수·수색 등 피고인의 기본적 인권에 직접 영향을 미치는 강제처분은 원칙적으로 수소법원의 판단에 의하여 이루어지지 않으면 안 된다. [2009도10412]", "수사종결공소"],
["516", "★ 수사기관은 공소제기 후에도 피고인이나 제3자가 소지하고 있는 피고사건에 관한 증거물을 임의로 제출하면 영장 없이 이를 압수할 수 있다.", true, "▸ 임의제출물 압수는 점유취득 과정에서 강제력이 사용되지 않으므로 공소제기 후에도 허용된다(일반적 견해).", "수사종결공소"],
["517", "★ 검사의 피고인에 대한 당해 공소사실에 관한 진술조서가 기소된 후에 작성된 것이라는 이유만으로도 당사자주의, 공판중심주의에 비추어 증거능력이 부정된다.", false, "▸ 검사 작성의 피고인에 대한 진술조서가 공소제기 후에 작성된 것이라는 이유만으로는 곧 그 증거능력이 없다고 할 수 없다. [84도1646]", "수사종결공소"],
["518", "참고인 조사는 공소제기 후에도 허용된다는 것이 일반적인 견해이고, 판례에 의하면 공소제기 후 참고인 수사가 허용되지 않는 경우가 있다.", true, "▸ 참고인 조사는 공소제기 후에도 허용된다는 것이 일반적 견해이다. 그러나 판례에 의하면 당사자주의·공판중심주의에 반하는 경우 허용되지 않는 경우가 있다.", "수사종결공소"],
["519", "甲이 법정에서 피고인 乙에게 유리한 증언을 하자 검사가 甲을 소환하여 그 증언 내용을 일방적으로 번복시키는 방식으로 甲의 진술조서를 작성하여 이를 증거로 제출하였다. 甲이 다시 법정에 출석하여 위 진술조서의 진정성립을 인정하고 乙에게 반대신문의 기회가 부여되었다면 그 진술조서는 증거능력이 있다.", false, "▸ 이미 증언을 마친 증인을 검사가 소환한 후 피고인에게 유리한 그 증언 내용을 추궁하여 이를 일방적으로 번복시키는 방식으로 작성한 진술조서는 피고인이 증거로 할 수 있음에 동의하지 아니하는 한 증거능력이 없다. 후에 진정성립을 인정하고 반대신문의 기회가 부여되었다고 하더라도 그 진술조서는 증거능력이 없다. [99도1108]", "수사종결공소"],
["520", "위 사례에서 만약 검사가 甲으로 하여금 진술서를 작성하도록 하였다고 하더라도 피고인이 이를 증거로 함에 동의하지 않는 한 진술서는 증거능력이 인정되지 않는다.", true, "▸ 이미 증언을 마친 증인에 대하여 기존 증언과 같은 취지를 번복하는 내용의 진술서도 피고인이 증거동의하지 않는 한 증거능력이 없다. [2012도534]", "수사종결공소"],
["521", "위 사례에서 검사가 甲을 위증죄의 피의자로 소환하여 공판 시 위증을 하였다는 자백을 받아 이를 피의자신문조서로 작성한 경우, 그 피의자신문조서는 피고인 아닌 사람의 진술을 기재한 서류로서「형사소송법」제312조 제4항에 따라 진정성립이 인정되면, 乙의 증거동의가 없더라도 乙에 대해 증거능력이 인정된다.", false, "▸ 이러한 피의자신문조서도 피고인이 증거로 함에 동의하지 않는 한 증거능력이 없다. 당사자주의·공판중심주의·직접심리주의에 반하고 피고인의 공정한 재판을 받을 권리를 침해하기 때문이다. [2017도1660]", "수사종결공소"],
["522", "위 사례에서 원진술자인 甲이 다시 법정에 출석하여 증언을 하면서 위 진술조서와 같은 내용으로 증언을 하였다면 그 증언 자체는 유죄의 증거로 할 수 있다.", true, "▸ 진술조서 자체는 증거능력이 없으나, 그 후 원진술자인 종전 증인이 다시 법정에 출석하여 같은 내용으로 한 증언 자체는 유죄의 증거로 할 수 있음은 별론이다. [99도1108]", "수사종결공소"],
["523", "★ 제1심에서 무죄판결이 선고되어 검사가 항소한 후, 수사기관이 항소심 공판기일에 증인으로 신청하여 신문할 수 있는 사람을 특별한 사정 없이 미리 수사기관에 소환하여 작성한 진술조서는 증거능력이 없고, 피고인이 증거로 할 수 있음에 동의한 경우도 마찬가지이다.", false, "▸ 이러한 진술조서는 피고인이 '증거동의'하지 않는 한 증거능력이 없다. 즉, 피고인이 증거동의하면 증거능력이 인정된다. [2013도6825]", "수사종결공소"],
["524", "★ 사전면담 시 피고인에 대한 회유나 압박 등이 없었다는 사정은 검사가 증인의 법정진술이나 면담과정으로 사전면담 시점, 이유와 방법, 구체적 내용 등을 밝힘으로써 증명하여야 한다.", true, "▸ 사전면담 시 회유나 압박 등이 없었다는 사정은 검사가 사전면담 시점, 이유와 방법, 구체적 내용 등을 밝힘으로써 증명하여야 한다. [2020도15891]", "수사종결공소"],
["525", "범죄사실의 일부에 대한 공소는 그 효력이 전부에 미친다.", true, "▸ 제248조 제1항에 따라 범죄사실의 일부에 대한 공소는 그 효력이 전부에 미친다.", "수사종결공소"],
["526", "공소장에는 죄명·공소사실과 함께 적용법조를 기재하여야 하지만 적용법조의 기재는 공소의 범위를 확정하는 데 보조기능을 가짐에 불과하므로 적용법조의 기재에 오기가 있거나 그것이 누락된 경우라 할지라도 이로 인하여 피고인의 방어에 실질적 불이익이 없는 한 공소제기의 효력에는 영향이 없다.", true, "▸ [AI해설] 적용법조의 기재는 공소의 범위를 확정하는 데 보조기능을 가짐에 불과하므로, 오기가 있거나 누락되더라도 피고인의 방어에 실질적 불이익이 없는 한 공소제기의 효력에는 영향이 없다. [2000도6113]", "수사종결공소"],
["527", "하나의 행위가 여러 범죄의 구성요건을 동시에 충족하는 경우에 공소제기권자는 자의적으로 공소권을 행사하여 소추재량을 현저히 벗어났다는 등의 특별한 사정이 없는 한 증명의 난이 등 여러 사정을 고려하여 그 중 일부 범죄에 관해서만 공소를 제기할 수도 있다.", true, "▸ [AI해설] 하나의 행위가 여러 범죄의 구성요건을 동시에 충족하는 경우에도, 자의적 공소권 행사 등의 특별한 사정이 없는 한 일부 범죄에 관해서만 공소를 제기할 수 있다. [2017도13458]", "수사종결공소"],
["528", "★ 하나의 행위가 부작위범인 직무유기죄와 작위범인 허위공문서작성·행사죄의 구성요건을 동시에 충족하는 경우, 공소제기권자가 작위범인 허위공문서작성·행사죄로 공소를 제기하지 아니하고 부작위범인 직무유기죄로만 공소를 제기할 수는 없다.", false, "▸ 하나의 행위가 직무유기죄와 허위공문서작성·행사죄의 구성요건을 동시에 충족하는 경우, 공소제기권자는 재량에 의하여 직무유기죄로만 공소를 제기할 수 있다. [2005도4202]", "수사종결공소"],
["529", "법원이 경찰서장의 즉결심판청구를 기각하여 경찰서장이 사건을 관할 지방검찰청으로 송치하였으나 검사가 이를 정식재판청구가 있은 사건으로 오인하여 그 사건기록을 법원에 송부한 경우, 검사에 의한 공소장의 제출 없는 이상 공소제기가 성립되었다고 볼 수 없다.", true, "▸ 검사에 의한 공소장의 제출은 공소제기라는 소송행위가 성립하기 위한 본질적 요소이므로, 공소장의 제출이 없는 경우에는 소송행위로서의 공소제기가 성립되었다고 할 수 없다. [2003도2735]", "수사종결공소"],
["530", "원래 공소제기가 없었음에도 피고인의 소환이 이루어지는 등 사실상의 소송계속이 발생한 상태에서 검사가 약식명령을 청구하는 공소장을 제1심법원에 제출하면, 사실상의 소송계속의 발생시로 소급하여 공소제기의 효력이 인정되므로, 제1심법원으로서는 이에 기하여 유·무죄의 실체판단을 하여야 한다.", false, "▸ 추후 당해 소송행위가 적법하게 이루어진 경우에는 '그때부터' 위 소송행위가 성립된 것으로 볼 수 있다. 소급효가 인정되지 않는다. [2003도2735]", "수사종결공소"],
["531", "★ 공소장에 검사의 간인이 없더라도 공소장의 형식과 내용이 연속된 것으로 일체성이 인정되고 동일한 검사가 작성하였다고 인정되는 한, 그 공소장을 효력이 없는 서류라고 할 수는 없다.", true, "▸ 공소장에 검사의 간인이 없더라도 일체성이 인정되고 동일한 검사가 작성하였다고 인정되는 한, 효력이 없는 서류라고 할 수 없다. [2019도16259]", "수사종결공소"],
["532", "★ 공소제기에 있어서 검사의 기명날인 또는 서명이 없는 상태로 공소장을 관할법원에 제출하는 것은 법률의 규정에 위반되나, 기명날인 또는 서명을 추후 보완함으로써 공소제기의 하자는 치유될 수 있다.", true, "▸ 기명날인 또는 서명이 없는 상태로 제출하는 것은 법률 규정 위반이지만, 기명날인 또는 서명을 추후 보완함으로써 공소제기의 하자가 치유될 수 있다. [2019도17150]", "수사종결공소"],
["533", "★ 공소장에 검사의 기명날인 또는 서명이 없는 상태로 관할법원에 제출하였으나 피고인과 변호인이 이의를 제기하지 않고 변론에 응하였다면 그 하자는 치유된다.", false, "▸ 공소제기에 현저한 방식 위반이 있는 경우에는 공소제기의 절차가 법률의 규정에 위반하여 무효인 경우에 해당하고, 피고인과 변호인이 이의를 제기하지 아니하고 변론에 응하였다고 하여 그 하자가 치유되지는 않는다. [2019도17150]", "수사종결공소"],
["534", "★ 구두진술에 의한 검사의 공소제기는 공소제기 절차의 법률 규정 위반에 해당하여 법원은 공소기각의 판결을 선고하여야 한다.", true, "▸ 구두진술에 의한 검사의 공소제기는 현저한 방식 위반에 해당하여 공소제기의 절차가 법률의 규정에 위반하여 무효인 때(제327조 제2호)에 해당하므로 공소기각의 판결을 선고하여야 한다.", "수사종결공소"],
["535", "★ 수사기관이 피고인에게 실질적인 불이익을 가함으로써 소추재량을 현저히 벗어난 경우에는 이를 공소권의 남용으로 보아 공소제기의 효력을 부인할 수 있다.", true, "▸ [AI해설] 수사기관이 피고인에게 실질적인 불이익을 가함으로써 소추재량을 현저히 벗어난 경우에는 공소권의 남용으로 공소제기의 효력을 부인할 수 있다. [2016도5423]", "수사종결공소"],
["536", "★ 검사가 단순한 직무상의 과실에 의하여 공소권을 행사하여 피고인에게 불이익을 주는 것만으로도 공소권남용이 인정된다.", false, "▸ 자의적 공소권의 행사로 인정되려면 단순히 직무상의 과실에 의한 것만으로는 부족하고 적어도 미필적이나마 어떤 의도가 있음이 인정되어야 한다. [2010도9349]", "수사종결공소"],
["537", "甲, 乙, 丙은 특수절도 범행을 하였다. 검사 P는 甲과 乙을 함께 기소하였으나 丙은 범행모의단계에서 기여도가 적다는 점을 고려하여 기소유예처분을 하였다. 甲과 乙은 기소하면서 丙은 기소유예처분한 것은 공소제기절차가 법률의 규정에 위반된 경우이므로 법원은 공소기각판결을 선고해야 한다.", false, "▸ 어떤 사람에 대하여 공소가 제기된 경우 그 공소가 제기된 사람과 동일하거나 다소 중한 범죄구성요건에 해당하는 행위를 하였음에도 불기소된 사람이 있다는 사유만으로는 공소권남용에 해당한다고 할 수 없다. [2010도9349]", "수사종결공소"],
["538", "검사는 종전에 기소유예 처분을 하였다가 4년여가 지난 시점에 다시 기소하였고, 피의사실과 공소사실 사이에 이를 번복할 만한 사정변경이 없다고 하더라도 공소권을 자의적으로 행사한 것으로서 소추재량권을 현저히 일탈하였다.", true, "▸ 검사가 종전 기소유예 처분 후 4년여 만에 다시 기소하고 종전 피의사실과 공소사실 사이에 사정변경이 없는 점 등에 비추어, 위 공소제기는 공소권을 자의적으로 행사한 것으로서 소추재량권을 현저히 일탈하였다. [2016도14772, 제327조 제2호 공소기각판결]", "수사종결공소"],
["539", "★ 甲이 절취한 차량을 무면허로 운전하다가 적발되어 절도범행의 기소중지자로 검거되었음에도 무면허운전의 범행만이 기소되어 유죄의 확정판결을 받고 그 형의 집행 중 가석방되면서 다시 그 절도범행의 기소중지자로 긴급체포되어 절도범행과 이미 처벌받은 무면허운전의 일부 범행까지 포함하여 기소된 경우, 甲에 대한 후행 기소는 적법하다.", false, "▸ 후행 기소는 함께 재판받을 이익을 박탈함으로써 현저하게 피고인의 권리나 이익을 침해하는 것이어서 공소권을 자의적으로 행사한 것이다. [2001도3026]", "수사종결공소"],
["540", "★ 공소사실의 특정은 공소제기된 범죄의 성격에 비추어 그 공소의 원인이 된 사실을 다른 공소사실과 구별할 수 있을 정도로 그 일시, 장소, 방법, 목적 등을 적시하여 특정하면 족하고, 그 일부가 다소 불명확하더라도 그와 함께 적시된 다른 사항들에 의하여 그 공소사실을 특정할 수 있고 피고인의 방어권 행사에 지장이 없다면, 공소제기의 효력에는 영향이 없다.", true, "▸ 공소사실의 특정은 다른 공소사실과 구별할 수 있을 정도로 특정하면 족하고, 일부 불명확해도 다른 사항들로 특정 가능하고 방어권 행사에 지장이 없다면 공소제기의 효력에 영향이 없다. [2000도2968]", "수사종결공소"],
["541", "★ 범죄의 일시는 이중기소나 시효에 저촉되지 않을 정도로, 장소는 토지관할을 가릴 수 있을 정도로, 방법에 있어서는 범죄구성요건을 밝히는 정도로 기재하면 족하다.", true, "▸ 공소사실 특정에 필요 이상 엄격하게 요구하는 것도 공소 제기와 유지에 장애를 초래할 수 있으므로, 일시·장소·방법의 기재 정도는 각각 위와 같은 정도로 족하다. [2014도2727]", "수사종결공소"],
["542", "★ 피고인에 대하여 2013. 12.경부터 2014. 1.경 사이 약 10분간 소란을 피워 주점 영업 업무방해(공소시효 7년) 범행을 저질렀다는 혐의로 2020. 12. 30. 기소된 경우, 공소사실이 특정되었다고 볼 수 없다.", true, "▸ 범죄의 '일시'가 공소시효 완성 여부를 판별할 수 없을 정도로 개괄적으로 기재되었다면 공소사실이 특정되었다고 볼 수 없다(2022도8257). [범행일이 2013. 12. 31. 이후인지 여부에 따라 공소시효 완성 여부가 달라짐]", "수사종결공소"],
["543", "★ 포괄일죄에 대한 공소장을 작성하는 경우에는 그 일죄의 일부를 구성하는 개개의 행위에 대하여 구체적으로 특정되지 아니하더라도 그 전체범행의 시기와 종기, 범행방법, 피해자나 상대방, 범행횟수나 피해액의 합계 등을 명시하면 이로써 그 범죄사실은 특정된 것이라고 할 수 있다.", true, "▸ 포괄일죄의 경우 개개 행위에 대한 특정 없이도 전체범행의 시기와 종기, 범행방법, 피해자, 범행횟수나 피해액의 합계 등을 명시하면 범죄사실은 특정된 것이라고 할 수 있다. [2016도19186]", "수사종결공소"],
["544", "★ 교사범이나 방조범의 경우에는 정범의 범죄 구성요건을 충족하는 구체적 사실을 특정할 필요가 없다.", false, "▸ 교사범, 방조범의 사실 적시에 있어서도 정범의 범죄 구성요건이 되는 사실 전부를 적시하여야 하고, 이 기재가 없는 교사범, 방조범의 사실 적시는 죄가 되는 사실의 적시라고 할 수 없다. [2016도2518]", "수사종결공소"],
["545", "법률의 해석 및 적용 문제는 법원의 전권이라 할 것이므로, 공소사실이 아닌 어느 처벌조항을 준용할지에 관한 해석 및 판단에 있어서 법원은 검사의 공소장 기재 적용법조에 구속되지 않는다.", true, "▸ [AI해설] 법률의 해석 및 적용은 법원의 전권이므로, 어느 처벌조항을 준용할지에 관하여 법원은 검사의 공소장 기재 적용법조에 구속되지 않는다. [2018도3443]", "수사종결공소"],
["546", "공소장이 적법하게 변경되었다면, 당초의 공소장에 공소사실이 특정되지 않았는지의 여부는 더 이상 문제가 되지 아니한다.", true, "▸ [AI해설] 공소장이 적법하게 변경되었다면, 당초의 공소장에 공소사실이 특정되지 않았는지의 여부는 더 이상 문제가 되지 아니한다. [2011도769]", "수사종결공소"],
["547", "★ 공소장의 기재가 불명확할 경우 비록 공소사실의 보완이 가능하더라도 법원이 검사에게 공소사실 특정에 대한 석명에 이르지 아니하고 공소사실의 불특정을 이유로 공소기각의 판결을 하여도 적법하다.", false, "▸ 공소장의 기재가 불명확한 경우 법원은 검사에게 석명을 구한 다음, 그래도 검사가 이를 명확하게 하지 않은 때에야 공소기각함이 상당하다. 석명 없이 바로 공소기각하는 것은 위법이다. [2004도5972]", "수사종결공소"],
["548", "★ 피고인을 특정하지 않은 공소제기임에도 피고인과 변호인이 이의를 제기하지 않고 변론에 응하였다면 그 공소제기의 하자는 치유된다.", false, "▸ 공소의 제기에 현저한 방식 위반이 있는 경우에는 공소제기의 절차가 법률의 규정에 위반하여 무효인 경우에 해당하고, 피고인과 변호인이 이의를 제기하지 아니하고 변론에 응하였다고 하여 그 하자가 치유되지는 않는다. [2008도11813]", "수사종결공소"],
["549", "★ 유가증권변조 사건의 공소사실이 범행일자를 '2005. 1. 말경에서 같은 해 2. 4. 사이'로, 범행장소를 '서울 불상지'로, 범행방법을 '불상의 방법으로 수취인의 기재를 삭제'로 되어 있는 경우, 변조된 유가증권이 압수되어 현존하고 있는 이상 공소사실이 특정되었다고 볼 수 있다.", true, "▸ 변조된 유가증권이 압수되어 현존하고 있는 이상 공소사실이 특정되었다고 볼 수 있다. [2007도11000]", "수사종결공소"],
["550", "★ 문서의 위조여부가 문제되는 사건에서 그 위조된 문서가 이미 압수되어 현존하고 있는 경우, 그 범죄 일시와 장소, 방법 등은 범죄의 동일성 인정과 이중기소의 방지, 시효 저촉 여부 등을 가름할 수 있는 범위에서 문서의 위조사실을 뒷받침할 수 있는 정도로만 기재되어 있으면 충분하다.", true, "▸ 위조된 문서가 압수되어 현존하고 있는 경우, 범죄 일시와 장소, 방법 등은 동일성 인정과 이중기소 방지, 시효 저촉 여부를 가름할 수 있는 범위에서 위조사실을 뒷받침할 수 있는 정도로 기재하면 충분하다. [2008도11042]", "수사종결공소"],
["551", "★ 사문서변조의 공소사실에 변조행위의 일시·장소와 방법, 변조의 실행행위자 등이 기재되지 않았다는 이유만으로 공소사실이 특정되지 않았다고 할 수 없다.", false, "▸ 범죄구성요건의 특정 요소에 관한 기재 자체가 누락된 것이므로 공소사실이 특정되지 않았다. [2008도9327]", "수사종결공소"],
["552", "★ 검사가 피고인이 필로폰을 투약하였다고 하여 마약류관리에관한법률위반(향정)으로 기소하면서 공소장에 범행일시를 모발감정 결과에 기초하여 투약가능기간을 역으로 추정한 '2010. 11.경'으로, 투약장소를 '부산 사하구 이하 불상지'로 기재한 경우에는 공소사실이 특정되었다고 볼 수 없어 공소기각판결을 하여야 한다.", true, "▸ 피고인이 필로폰 투약사실을 부인하고 뚜렷한 증거가 없음에도 모발감정 결과에 기초하여 투약가능기간을 추정한 다음 개괄적으로만 범행시기를 적시한 경우에는 공소내용이 특정되었다고 볼 수 없다. [2011도11817]", "수사종결공소"],
["553", "★ '성명불상자들과 합동하여 통행 중인 성명불상 여자로부터 품명불상의 재물을 절취'라는 기재는 공소사실이 특정되었다고 볼 수 없다.", true, "▸ [AI해설] 피해자와 피해 품목이 모두 불상인 경우는 공소사실이 특정되었다고 볼 수 없다. [75도294]", "수사종결공소"],
["554", "★ '불상의 방법으로 피해자를 가격하여 그 충격으로 피해자가 뒤로 넘어지면서 우측 후두부가 도로 바닥에 부딪쳐 사망에 이르렀다'는 기재만으로 폭행치사죄의 폭행사실을 특정한 적법한 공소제기에 해당한다.", false, "▸ 위 기재만으로는 '폭행의 구체적 사실'을 기재하였다고 할 수 없으므로 공소사실이 특정된 적법한 공소제기에 해당하지 않는다. [98도4181]", "수사종결공소"],
["555", "★ 강간죄 또는 강제추행죄에 대한 공소사실을 '피고인이 1980.12. 일자불상경부터 1981.9.5. 전일경까지 사이에 피해자를 협박하여 약 20여회 강간 또는 강제추행하였다'라고 기재한 경우, 그 범행일시가 명시되지 아니하여 공소사실을 특정한 것으로 볼 수 없다.", true, "▸ 미성년자의제강간죄 또는 미성년자의제강제추행죄는 행위시마다 1개의 범죄가 성립하므로 범행일시가 명시되지 아니하면 공소사실을 특정한 것으로 볼 수 없다. [82도2442]", "수사종결공소"],
["556", "★ 범죄사실 상호간에 범죄의 일시, 장소, 수단 및 객체 등이 달라서 수개의 범죄사실로 인정되는 경우에는 이들 수개의 범죄사실을 예비적 또는 택일적으로 기재할 수 없다.", false, "▸ 범죄사실의 동일성이 인정되는 범위 내에서는 물론, 수개의 범죄사실로 인정되는 경우에도 예비적 또는 택일적으로 기재할 수 있다. [65도114]", "수사종결공소"],
["557", "공소사실을 예비적으로 추가하는 공소장변경 신청이 있을 경우 법원은 공소사실의 동일성 여부와 관계없이 이를 허가할 수 있다.", false, "▸ 법원은 공소사실의 '동일성을 해하지 아니하는 한도'에서 공소장변경을 허가하여야 한다(제298조 제1항).", "수사종결공소"],
["558", "검사는 甲을 신용훼손죄로 기소하였다가 공판 중 동일한 사실관계에 대하여 예비적으로 업무방해죄의 공소사실 및 적용법조를 추가한다는 공소장변경신청을 하였다. 공소장변경이 적법하게 이루어진 경우, 법원은 신용훼손죄에 대하여 판단하지 않고 업무방해죄의 성립여부만을 판단할 수 있다.", false, "▸ 법원은 주위적 공소사실을 먼저 심판하고 만일 유죄가 인정되지 않으면 다음으로 예비적 공소사실을 심판하여야 하며, 이를 위반하여 판단하면 위법하므로 상소이유가 된다. [76도1126]", "수사종결공소"],
["559", "검사가 절도죄로 공소제기한 피고인에 대하여 제1심 법원은 유죄를 선고하였다. 이후 항소심 계속 중 검사가 장물죄를 예비적으로 추가하는 공소장변경을 신청하였다. 공소장변경을 허가한 항소심 법원은 절도죄에 대하여 유죄판결을 하는 경우 판결이유에서 장물죄에 대해서도 적시하여야 한다.", false, "▸ 주위적 공소사실을 유죄로 인정하는 경우 예비적 공소사실에 대해서는 이유 부분에서도 판단할 필요가 없다. 주위적을 무죄로 판단하는 경우에는 판결이유에서 그 이유를 기재하여야 하며, 모두 무죄인 경우에는 주문과 이유 모두에 기재하여야 한다.", "수사종결공소"],
["560", "공소제기 당시 피고인이 구속되어 있거나 체포 또는 구속된 후 석방된 경우, 공소장에는 체포영장, 긴급체포서, 구속영장 기타 구속에 관한 서류를 각 첨부하여서는 아니된다.", false, "▸ 공소제기 당시 피고인이 구속되어 있거나 체포 또는 구속된 후 석방된 경우에는 공소장에 체포영장, 긴급체포서, 구속영장 기타 구속에 관한 서류를 반드시 첨부하여야 한다(규칙 제118조 제1항). 공소장에는 법원에 예단이 생기게 할 수 있는 서류 기타 물건을 첨부하거나 내용을 인용하여서는 아니된다(동 규칙 제2항).", "수사종결공소"],
["561", "검사가 약식명령을 청구하는 경우 약식명령의 청구와 동시에 증거서류 및 증거물을 법원에 제출하여야 하는데, 이는 약식절차가 서면심리에 의한 재판이어서 공소장일본주의의 예외를 인정한 것이므로 약식명령의 청구와 동시에 증거서류 및 증거물이 법원에 제출되었다 하여 공소장일본주의를 위반하였다 할 수 없고, 그 후 약식명령에 대한 정식재판청구가 제기되었음에도 법원이 증거서류 및 증거물을 검사에게 반환하지 않고 보관하고 있다고 하여 그 이전에 이미 적법하게 제기된 공소제기의 절차가 위법하게 된다고 할 수 없다.", true, "▸ 약식절차는 서면심리에 의한 재판이어서 공소장일본주의의 예외를 인정한 것이므로, 증거서류가 동시에 제출되었다고 공소장일본주의 위반이 아니다. 이후 정식재판청구가 있어도 이미 적법하게 제기된 공소제기의 절차가 위법하게 되지 않는다. [2007도3906]", "수사종결공소"],
["562", "★ 공소장일본주의에 위배된 공소제기라고 인정되는 때에는 그 절차가 법률의 규정을 위반하여 무효인 때에 해당하는 것으로 보아 공소기각의 판결을 선고하는 것이 원칙이다.", true, "▸ [AI해설] 공소장일본주의에 위배된 공소제기라고 인정되는 때에는 공소기각의 판결을 선고하는 것이 원칙이다. [2009도7436]", "수사종결공소"],
["563", "★ 공소장의 기재가 공소장일본주의를 위반하였더라도 공판절차가 마무리되어 법관의 심증형성이 이루어진 단계에서는 공소장일본주의 위반을 주장하여 이미 진행된 소송절차의 효력을 다툴 수는 없다.", true, "▸ 공소장일본주의 위반이 있더라도 피고인측으로부터 이의가 제기되지 않아 공판절차가 마무리되어 법관의 심증형성이 이루어진 단계에서는 이를 주장하여 소송절차의 효력을 다툴 수 없다. [2009도7436]", "수사종결공소"],
["564", "★ 공소장일본주의에 위배하여 공소가 제기된 경우에도 증거조사절차가 마무리되어 법관의 심증형성 단계에 이른 때에는 그 이전에 피고인 측으로부터 이의가 유효하게 제기되어 있더라도 공소장일본주의 위배의 하자가 치유된다.", false, "▸ 피고인 측으로부터 '이의가 유효하게 제기되어 있는 이상' 공판절차가 진행되어 법관의 심증형성의 단계에 이르렀다고 하여 공소장일본주의 위배의 하자가 치유된다고 볼 수 없다. [2012도2957]", "수사종결공소"],
["565", "★ 피고인의 변호인이 공소장 기재방식에 대하여 의견서로 공소장일본주의에 반한다고 이의를 하였으나 법원이 공판절차 초기 쟁점정리 과정에서 공소장 중 모두사실 부분은 범죄의 구성요건과 상관이 없어 심리하지 않겠다고 고지하고 증거조사 등의 공판절차를 진행하였다면 공소장 기재방식의 하자가 치유된다.", false, "▸ 제1심 법원이 공판절차 초기 쟁점정리 과정에서 모두사실 부분은 범죄의 구성요건과 상관이 없어 심리하지 않겠다고 고지하고 공판절차를 진행하였다 하더라도 공소장 기재방식의 하자가 치유된다고 볼 수 없다. [2012도2957]", "수사종결공소"],
["566", "★ 명예훼손·모욕·협박 등과 같이 특정한 표현의 구체적인 내용에 따라 범죄의 성부가 판가름되는 경우나 특허권·상표권 침해사범처럼 사안의 성질상 도면 등에 의한 특정이 필요한 경우 등에는 서류 기타 물건의 내용을 직접 인용하거나 요약 또는 사본하여 첨부할 수 있다.", true, "▸ 예외적으로 명예훼손·모욕·협박 등 특정 표현의 구체적 내용이 필요한 경우나 특허권·상표권 침해사범처럼 도면 등에 의한 특정이 필요한 경우에는 공소장에 서류 기타 물건의 내용을 직접 인용하거나 요약 또는 사본하여 첨부할 수 있다. [2009도7436]", "수사종결공소"],
["567", "★ 상습범가중 또는 누범가중의 경우에는 공소장에 누범이나 상습범을 구성하는 전과사실을 기재하는 것이 허용된다.", true, "▸ 상습범(구성요건인 전과), 범죄사실의 내용을 이루는 전과(협박 수단인 전과), 누범전과(범죄사실에 준함), 집행유예 결격인 전과는 기재가 허용된다(통설).", "수사종결공소"],
["568", "★ 공소장의 공소사실 첫머리에 피고인이 전에 받은 소년부송치처분과 직업없음이 기재되어 있더라도 이는 피고인을 특정할 수 있는 사항을 기재한 것으로 공소제기의 절차가 법률의 규정에 위반된 것이라고 할 수 없다.", true, "▸ 공소사실 첫머리에 소년부송치처분과 직업없음이 기재되어 있더라도 피고인을 특정할 수 있는 사항을 기재한 것으로 공소제기의 절차가 법률의 규정에 위반된 것이라고 할 수 없다. [90도1813]", "수사종결공소"],
["569", "★ 살인, 방화죄로 공소가 제기된 경우에 공소사실에 기재된 동기가 공소범죄사실의 직접적인 동기가 아닌 경우에는 그 동기의 기재는 공소장의 효력에 영향을 미친다.", false, "▸ 살인, 방화 등의 경우 범죄의 직접적인 동기 또는 공소범죄사실과 밀접불가분의 관계에 있는 동기를 공소사실에 기재하는 것이 공소장일본주의 위반이 아님은 명백하고, 설사 범죄의 직접적인 동기가 아닌 경우에도 동기의 기재는 공소장의 효력에 영향을 미치지 아니한다. [2007도748]", "수사종결공소"],
["570", "★ 공소시효가 완성된 범죄사실을 공소사실 이외의 사실로 기재한 것은 위법하다.", false, "▸ 공소시효가 완성된 범죄사실을 공소범죄사실 이외의 사실로 기재한 공소장이 형소법 제254조 제3항의 규정에 위배된다고 볼 수 없다. [83도1979] [판례와 달리 여죄를 기재하는 것은 공소장일본주의에 반한다는 것이 일반적 견해]", "수사종결공소"],
["571", "★ 공소제기 당시에는 공소시효가 완성되지 않았으나 판결의 확정이 없이 공소를 제기한 때로부터 25년을 경과한 경우에는 면소판결을 한다.", true, "▸ 공소가 제기된 범죄는 판결의 확정이 없이 공소를 제기한 때로부터 25년을 경과하면 공소시효가 완성한 것으로 간주한다(제249조 제2항, 제326조 제3호).", "수사종결공소"],
["572", "공소시효기간의 기준이 되는 형은 처단형이며 2개 이상의 형을 병과하거나 2개 이상의 형에서 그 1개를 과할 범죄에는 그 중 중한 형을 기준으로 공소시효의 기간을 결정한다.", false, "▸ 공소시효기간의 기준이 되는 형은 '처단형'이 아니라 '법정형'이다. 두 개 이상의 형을 병과하거나 두 개 이상의 형에서 한 개를 과할 범죄에 대해서는 무거운 법정형에 의하여 제249조를 적용한다(제250조).", "수사종결공소"],
["573", "「형법」에 의하여 형을 가중 또는 감경한 경우에는 가중 또는 감경하지 아니한 형에 의하여 공소시효기간의 규정을 적용한다.", true, "▸ 형법에 의하여 형을 가중 또는 감경한 경우에는 가중 또는 감경하지 아니한 형에 의하여 공소시효기간의 규정을 적용한다(제251조).", "수사종결공소"],
["574", "사람을 살해한 범죄(종범 제외)로 사형에 해당하는 범죄에 대하여는 형사소송법에 규정된 공소시효를 적용하지 아니한다.", true, "▸ 제253조의2에 따라 사람을 살해한 범죄(종범 제외)로 사형에 해당하는 범죄에 대하여는 형사소송법에 규정된 공소시효를 적용하지 아니한다.", "수사종결공소"],
["575", "★ 甲이 乙(19세 미만)의 나체를 촬영한 행위는「아동·청소년의 성보호에 관한 법률」제11조 제1항(성착취물 제작)에 의해 처벌 가능하고, 위 죄의 법정형은 무기 또는 5년 이상의 징역에 해당하므로 乙가 성년에 달한 날부터 15년의 경과로 공소시효가 완성된다.", true, "▸ 미성년자에 대한 아동·청소년대상 성범죄의 공소시효는 피해자인 아동·청소년이 성년에 달한 날부터 진행한다(아청법 제20조 제1항). 법정형이 무기 또는 5년 이상의 징역인 경우 공소시효는 무기징역 기준 15년이다. [2025변시]", "수사종결공소"],
["576", "범죄 후 법률의 개정에 의하여 법정형이 가벼워진 경우에는「형법」제1조 제2항에 의하여 당해 범죄사실에 적용될 가벼운 법정형(신법의 법정형)이 공소시효기간의 기준이 된다.", true, "▸ [AI해설] 범죄 후 법률의 개정에 의하여 법정형이 가벼워진 경우에는 형법 제1조 제2항에 의하여 신법의 법정형이 공소시효기간의 기준이 된다. [87도84]", "수사종결공소"],
["577", "★ 상상적 경합관계에 있는 죄들 중 일부의 죄에 대해 공소시효가 완성되었다고 하여 그 죄와 상상적 경합관계에 있는 다른 죄의 공소시효까지 완성되는 것은 아니다.", true, "▸ 1개의 행위가 여러 개의 죄에 해당하는 경우 공소시효를 적용함에 있어서는 각 죄마다 따로 따져야 할 것이므로, 일부 죄의 공소시효가 완성되어도 상상적 경합관계에 있는 다른 죄의 공소시효까지 완성되는 것은 아니다. [2006도6356]", "수사종결공소"],
["578", "★ 사기죄와 변호사법위반죄가 상상적 경합의 관계에 있는 경우, 변호사법위반죄의 공소시효가 완성되었다고 하여 사기죄의 공소시효까지 완성되는 것은 아니다.", true, "▸ 상상적 경합관계에 있는 죄들은 각각 별개로 공소시효가 적용되므로, 변호사법위반죄의 공소시효가 완성되어도 사기죄의 공소시효까지 완성되는 것은 아니다. [2006도6356]", "수사종결공소"],
["579", "공소시효를 정지·연장·배제하는 특례조항을 신설하면서 소급적용에 관한 경과규정을 두지 않은 경우 그 조항을 소급하여 적용하는 것은 적법절차원칙과 소급금지원칙을 천명한 헌법의 정신에 반하여 허용될 수 없다.", true, "▸ [AI해설] 공소시효 정지·연장·배제 특례조항을 신설하면서 소급적용에 관한 경과규정을 두지 않은 경우 그 조항을 소급하여 적용하는 것은 적법절차원칙과 소급금지원칙을 천명한 헌법의 정신에 반하여 법치주의 이념을 훼손하지 않는 범위 내에서 해석하여야 한다. [2020도3694]", "수사종결공소"],
["580", "피고인의 신병이 확보되기 전에 공소가 제기되었다고 하더라도 그러한 사정만으로 공소가 부적법한 것이 아니고, 공소가 제기되면 공소시효의 진행이 정지된다.", true, "▸ 피고인의 신병이 확보되기 전에 공소가 제기되었다고 하더라도 공소가 부적법한 것이 아니고, 공소가 제기되면 공소시효의 진행이 정지된다. [2016도15526, 제253조 제1항]", "수사종결공소"],
["581", "★ 공소장변경절차에 의하여 공소사실이 변경됨에 따라 그 법정형에 차이가 있는 경우에는 변경된 공소사실에 대한 법정형이 공소시효기간의 기준이 되고, 그 공소시효의 완성 여부도 공소장 변경시를 기준으로 한다.", false, "▸ 공소장변경절차에 의하여 공소사실이 변경된 경우 변경된 공소사실에 대한 법정형이 공소시효기간의 기준이 된다(O). 그러나 공소시효의 완성 여부는 '공소제기 당시'를 기준으로 판단할 것이고 '공소장 변경시'를 기준으로 삼을 것은 아니다. [2002도2939]", "수사종결공소"],
["582", "★ 검사가 甲의 횡령행위에 대해 그 행위종료일부터 7년이 경과하여 특정경제범죄가중처벌등에관한법률위반(횡령)죄로 기소한 경우, 만약 甲이 취득한 이득액이 5억 이상이라는 사실이 증명되지 않았다면 법원은 공소장 변경 없이 형법상의 횡령죄를 인정할 수 있고, 특정경제범죄가중처벌등에관한법률위반(횡령)죄의 공소시효가 지나지 않았더라도 형법상 횡령죄의 공소시효가 지났다면 면소판결을 선고할 수 있다.", true, "▸ 공소장 변경 없이도 법원이 인정할 수 있는 사실에 대한 법정형을 기준으로 하면 공소제기 당시 이미 공소시효가 완성된 경우에는 면소판결을 선고할 수 있다. [2013도182]", "수사종결공소"],
["583", "★ 미수범의 범죄행위는 행위를 종료하지 못하였거나 결과가 발생하지 아니하여 더 이상 범죄가 진행될 수 없는 때에 종료하고, 그때부터 미수범의 공소시효가 진행한다.", true, "▸ 공소시효는 범죄행위가 종료한 때부터 진행한다(제252조 제1항). 미수범의 범죄행위는 행위를 종료하지 못하였거나 결과가 발생하지 아니하여 더 이상 범죄가 진행될 수 없는 때에 종료하고, 그때부터 미수범의 공소시효가 진행한다. [2016도14820]", "수사종결공소"],
["584", "★ 분양대책위원회의 공동대표인 甲이 업무상 임무에 위배하여 주상복합아파트 일부 세대에 관한 분양계약서를 받아 그에 관한 소유권이전등기를 하여 재산상 이익을 취득하려고 하였으나 소유권이전등기를 마치지 못하였다. 甲이 범한 업무상배임미수의 범죄행위는 甲이 행위를 종료하지 못하였거나 결과가 발생하지 아니하여 더 이상 범죄가 진행될 수 없는 때에 종료하고, 그때부터 공소시효가 진행된다.", true, "▸ 미수범의 범죄행위는 행위를 종료하지 못하였거나 결과가 발생하지 아니하여 더 이상 범죄가 진행될 수 없는 때에 종료하고, 그때부터 미수범의 공소시효가 진행한다. [2016도14820]", "수사종결공소"],
["585", "건설회사의 공동대표인 甲과 乙은 공무원 丙에게 뇌물을 제공하기로 공모한 다음 丙에게 2,000만 원을 공여하였다. 만약 丙가 현금 2,000만 원 자체를 뇌물로 받은 것이 아니라 그 직무에 관하여 2,000만 원을 무이자로 차용한 것으로 밝혀진 경우에는 그 차용 당시에 금융이익 상당의 뇌물을 수수한 것으로 보아야 하므로, 그 공소시효는 금전을 무이자로 차용한 때로부터 기산한다.", true, "▸ [AI해설] 무이자 차용이 뇌물수수로 인정되는 경우 공소시효는 금전을 무이자로 차용한 때로부터 기산한다. [2011도7282]", "수사종결공소"],
["586", "채무자 甲은 채권자 乙의 가압류집행을 면탈할 목적으로, 자신이 제3채무자 丙에 대해 가지고 있는 채권을 2016. 12. 8. 丁에게 허위로 양도하였다. 한편 乙은 甲의 丙에 대한 위 채권에 대하여 2016. 12. 1. 법원에 가압류신청을 하였고 법원의 가압류결정 정본은 2016. 12. 8. 丙에게 송달되었다. 甲에 대한 강제집행면탈죄가 성립하는 경우, 공소시효는 甲이 丁에게 채권양도의 통지를 한 때가 아니라 乙에게 채권을 허위양도한 때부터 진행한다.", false, "▸ 제3채무자(丙)에 대한 채권을 허위로 양도한 경우에 제3채무자에게 채권 양도의 통지가 행하여짐으로써 그 범죄행위가 종료하여 그때부터 공소시효가 진행된다. 공소시효의 기산점은 허위양도 시점이 아니라 제3채무자에게 채권양도의 통지가 행해진 때이다. [2011도6855]", "수사종결공소"],
["587", "피고인의 범죄단체 가입의 점에 대한 공소시효는 이와 포괄일죄의 관계에 있는 범죄단체 구성원으로서의 활동의 범죄행위가 종료한 때로부터 진행한다.", true, "▸ 범죄단체를 구성하거나 이에 가입한 자가 더 나아가 구성원으로 활동하는 경우 이는 포괄일죄의 관계에 있으므로, 가입의 점에 대한 공소시효는 구성원으로서의 활동의 범죄행위가 종료한 때로부터 진행한다. [2015도7081]", "수사종결공소"],
["588", "공익법인이 주무관청의 승인을 받지 않은 채 수익사업을 하는 행위는 시간적 계속성이 구성요건적 행위의 요소로 되어 있다는 점에서 계속범에 해당한다고 보아야 할 것이므로, 승인을 받지 않은 수익사업이 계속되고 있는 동안에는 아직 공소시효가 진행하지 않는다.", true, "▸ [AI해설] 공익법인이 주무관청의 승인 없이 수익사업을 하는 행위는 계속범에 해당하므로, 수익사업이 계속되는 동안에는 공소시효가 진행하지 않는다. [2004도4751]", "수사종결공소"],
["589", "정당법에서 규정하는 공무원이나 사립학교의 교원이 정당의 당원이 된 죄와 국가공무원법에서 규정하는 공무원이 정당 그 밖의 정치단체에 가입한 죄는 공무원이나 사립학교의 교원 등이 정당 등에 가입함으로써 즉시 성립하고 그와 동시에 완성되는 즉시범이므로 그 범죄성립과 동시에 공소시효가 진행한다.", true, "▸ [AI해설] 정당 또는 정치단체 가입죄는 가입과 동시에 성립하고 완성되는 즉시범이므로 범죄성립과 동시에 공소시효가 진행한다. [2012도12867]", "수사종결공소"],
["590", "★ 공소시효는 소송조건을 갖추지 않더라도 공소가 제기되면 진행이 정지된다.", true, "▸ 제253조 제1항에 따라 공소가 제기되면 공소시효의 진행이 정지된다. 공소기각의 재판이 확정된 경우에도 공소시효가 정지되므로 소송조건을 갖추지 않더라도 상관 없다.", "수사종결공소"],
["591", "★ 허가권자 공무원 甲은 실무담당자 乙의 방조 아래, 빌딩건축허가와 관련하여 업자 丙으로부터 2,000만 원의 뇌물을 받았다. 乙이 뇌물수수방조죄의 처벌을 면할 목적으로 미국으로 출국한 경우, 그 도피 기간 동안 공범인 甲의 뇌물수수죄에 대한 공소시효도 정지된다.", false, "▸ 국외 도피로 인한 공소시효 정지는 당해 범인에게만 적용되고 다른 공범에게는 적용되지 않는다.", "수사종결공소"],
["592", "★ 「형사소송법」제253조 제3항의 '범인이 형사처분을 면할 목적으로 국외에 있는 경우'는 범인이 국내에서 범죄를 저지르고 형사처분을 면할 목적으로 국외로 도피한 경우에 한정되고, 범인이 국외에서 범죄를 저지르고 형사처분을 면할 목적으로 국외에서 체류를 계속하는 경우는 포함되지 않는다.", false, "▸ 제253조 제3항이 정한 '범인이 형사처분을 면할 목적으로 국외에 있는 경우'는 범인이 국내에서 범죄를 저지르고 국외로 도피한 경우뿐만 아니라, 범인이 '국외에서 범죄를 저지르고' 형사처분을 면할 목적으로 국외에서 체류를 계속하는 경우도 포함된다. [2015도5916]", "수사종결공소"],
["593", "★ 甲이 영국 체류 중에 현지 물품 구매대행업을 하면서 국내 구매자들로부터 돈을 받고도 임의로 소비하여 횡령하자 구매자들이 甲을 고소하였다. 만약 甲이 한국경찰의 출석통지 소식을 들었음에도 형사처분을 면할 목적으로 귀국하지 않고 영국에 계속 체류하였다 하더라도, 甲이 국외에서 범죄를 저지르고 국외에서 체류를 계속하는 경우이므로 甲의 위 횡령에 대한 공소시효의 진행은 정지되지 않는다.", false, "▸ 범인이 국외에서 범죄를 저지르고 형사처분을 면할 목적으로 국외에서 체류를 계속하는 경우도 제253조 제3항에 포함된다. 따라서 공소시효의 진행은 정지된다. [2015도5916]", "수사종결공소"],
["594", "범인이 가지는 여러 국외 체류 목적 가운데 형사처분을 면할 목적이 포함되어 있는 경우에 공소시효가 정지된다.", true, "▸ '형사처분을 면할 목적'은 국외 체류의 유일한 목적으로 되는 것에 한정되지 않고 범인이 가지는 여러 국외 체류 목적 중에 포함되어 있으면 족하다. [2008도4101]", "수사종결공소"],
["595", "피고인이 당해 사건으로 처벌받을 가능성이 있음을 인지하였다고 보기 어려운 경우라면 피고인이 다른 고소사건과 관련하여 형사처분을 면할 목적으로 국외에 있었다고 하더라도, 당해 사건과 관련하여 형사처분을 면할 목적으로 국외에 있었다고 볼 수 없다.", true, "▸ [AI해설] 당해 사건으로 처벌받을 가능성을 인지하기 어려운 경우, 다른 사건 관련 형사처분 면탈 목적이 당해 사건에도 미친다고 볼 수 없다. [2013도9162]", "수사종결공소"],
["596", "★ 법정최고형이 징역 5년인 부정수표단속법위반죄를 저지른 자가 중국으로 출국하여 그곳에서 다른 범죄로 징역 14년을 선고받고 8년 이상 복역한 후 가족이 있는 우리나라로 추방되어 부정수표단속법위반죄로 공소가 제기되었다면 수감기간 동안에 공소시효의 진행이 정지되지 않는다.", false, "▸ 범인이 외국에서 다른 범죄로 수감된 경우, 그 수감기간 중 당해 범죄에 대한 형사처분을 면할 목적이 유지되고 있었는지 여부는 검사가 입증하여야 한다. 수감기간 동안에도 목적이 유지되고 있었다면 공소시효가 정지될 수 있다. [2008도4101]", "수사종결공소"],
["597", "★ 범인이 공소가 제기된 후 형사처분을 면할 목적으로 국외에 있는 경우「형사소송법」제249조 제2항의 소위 의제공소시효가 정지된다.", true, "▸ 피고인이 형사처분을 면할 목적으로 국외에 있는 경우 그 기간 동안 제249조 제2항에 따른 기간의 진행은 정지된다(제253조 제4항). [종전 판례(2020도13547)는 제249조 제2항이 포함되지 않는다고 했으나, 이후 규정 신설로 현재는 정지됨]", "수사종결공소"],
["598", "★ 재정신청이 있으면 재정결정이 확정될 때까지 공소시효의 진행이 정지된다. 재정신청 기각결정에 대해 즉시항고한 경우에도 공소시효의 진행이 정지된다. [변23]", true, "▸ 재정신청이 있으면 재정결정이 확정될 때까지 공소시효의 진행이 정지된다(제262조의4). 재정신청 기각결정에 대해 즉시항고한 경우에도 동일하다.", "수사종결공소"],
["599", "★ 검사로부터 甲을 모욕죄로 공소를 제기하지 아니한다는 통지를 받은 乙이 법원에 재정신청을 하였다면 재정결정이 확정될 때까지 공소시효의 진행은 정지된다. 그러나 재정신청에 대한 고등법원의 기각결정에 대하여는 즉시항고 등의 방법으로 불복할 수 없다. [변18]", false, "▸ 재정신청이 있으면 재정결정이 확정될 때까지 공소시효의 진행이 정지된다(O). 재정신청 기각결정에 대하여는 제415조에 따른 즉시항고를 할 수 있다(제262조 제4항). 즉시항고 가능하므로 '불복할 수 없다'는 부분이 틀렸다.", "수사종결공소"],
["600", "★ 공범 중 1인에 대한 공소의 제기로 다른 공범자에 대한 공소시효의 진행이 정지되며, 공소가 제기된 공범에 대하여 유죄, 무죄 또는 면소의 재판이 있는 경우, 그 재판이 확정된 때로부터 다른 공범자에 대한 공소시효가 다시 진행된다.", true, "▸ 공범의 1인에 대한 시효정지는 다른 공범자에게 효력이 미치고 당해 사건의 재판이 확정된 때로부터 진행한다(제253조 제2항). 공범 중 1인에 대한 재판 결과가 공소기각 또는 관할위반인 경우뿐만 아니라 유죄, 무죄, 면소인 경우에도 그 재판이 확정된 때로부터 다시 공소시효가 진행된다. [2011도15137]", "수사종결공소"],
["601", "★ 공범 중 1인으로 기소된 자가 범죄의 증명이 없다는 이유로 무죄의 판결을 선고받아 그 판결이 확정되었더라도, 무죄로 확정된 그 피고사건에서 공범으로 지적된 진범인에 대하여 공소시효정지의 효력이 생긴다.", false, "▸ 구성요건에 해당하는 위법행위를 공동으로 하였다고 인정되나 책임조각을 이유로 무죄로 되는 경우에는 공소시효정지의 효력이 있으나, '범죄의 증명이 없다는 이유로 무죄'의 확정판결을 선고받은 경우에는 그를 공범이라고 할 수 없어 그에 대하여 제기된 공소로써는 진범에 대한 공소시효정지의 효력이 없다. [98도4621]", "수사종결공소"],
["602", "★ 甲은 자동차를 구입하여 장애인에 대한 면세 혜택 등의 적용을 받기 위해 乙의 명의를 빌려 등록하였다. 명의수탁자 乙과 그의 딸 丙은 공모하여, 乙는 甲에게 자동차이전등록서류를 교부하고, 丙는 그 자동차를 명의신탁자 甲 몰래 가져와 이를 다른 사람에게 처분하였다. 공소시효의 진행은 개별적으로 진행되므로 乙이 먼저 기소되어 유죄판결을 받아 그 판결이 확정된 경우 乙이 기소되어 판결이 확정될 때까지의 기간 동안 丙에 대한 공소시효의 진행은 정지되지 않는다.", false, "▸ 제253조 제2항에 따라 공범의 1인에 대한 공소제기로 다른 공범자에게 시효정지의 효력이 미친다. 따라서 乙에 대한 공소제기로 丙에 대한 공소시효의 진행이 정지된다. [2006도4498]", "수사종결공소"],
["603", "★ 「형사소송법」제253조 제2항의 '공범'에는 뇌물공여죄와 뇌물수수죄 사이와 같은 대향범 관계에 있는 자는 포함되지 않는다.", true, "▸ 제253조 제2항은 공소제기 효력의 인적 범위를 확장하는 예외를 마련한 것이므로 엄격하게 해석하여야 하고 피고인에게 불리한 방향으로 확장해서는 아니 된다. 대향범 관계에 있는 자 사이에서는 형법 총칙의 공범규정이 적용되지 아니하므로, 제253조 제2항의 '공범'에는 대향범 관계에 있는 자는 포함되지 않는다. [2012도4842]", "수사종결공소"],
["604", "★ 건축허가권자 공무원 甲은 실무담당자 乙의 방조 아래, 빌딩건축허가와 관련하여 건축업자 丙으로부터 2,000만 원의 뇌물을 받았다. 丙이 뇌물공여죄로 기소되어 유죄판결이 확정된 경우, 甲의 뇌물수수죄에 대한 공소시효는 丙에 대한 사건이 기소된 때로부터 확정된 때까지 정지된다.", false, "▸ 뇌물공여죄와 뇌물수수죄는 대향범 관계에 있으므로 제253조 제2항의 '공범'에 포함되지 않는다. 따라서 丙에 대한 공소제기로 甲의 뇌물수수죄에 대한 공소시효가 정지되지 않는다. [2012도4842]", "수사종결공소"],
["605", "★ 구성요건상으로는 단독으로 실행할 수 있는 형식으로 되어 있는데 단지 구성요건이 대향범의 형태로 실행되는 경우에도 대향범의 관계에 있으므로「형사소송법」제253조 제2항의 공소시효 정지 규정이 적용되지 않는다.", false, "▸ 대향범에 대하여 공범에 관한 형법 총칙 규정이 적용될 수 없다는 법리는 해당 처벌규정의 구성요건 자체에서 2인 이상의 서로 대향적 행위의 존재를 필요로 하는 필요적 공범인 대향범을 전제로 한다. 구성요건상으로는 단독으로 실행할 수 있는 형식으로 되어 있는데 단지 구성요건이 대향범의 형태로 실행되는 경우에는 대향범에 관한 법리가 적용된다고 볼 수 없다. [2020도7866]", "수사종결공소"],
["606", "★ 공범 중 1인에 대해 약식명령이 확정된 후 그에 대한 정식재판청구권회복결정이 있었다고 하더라도 그 사이의 기간 동안에는 특별한 사정이 없는 한 다른 공범자에 대한 공소시효는 정지함이 없이 계속 진행한다.", true, "▸ 약식명령이 확정된 후 정식재판청구권회복결정이 있었더라도 그 사이의 기간 동안에는 다른 공범자에 대한 공소시효는 정지함이 없이 계속 진행한다. [2011도15137]", "수사종결공소"],
["607", "공소장변경은 서면에 의하여야 하므로, 피고인이 공판정에 재정하여 그 동의하에 검사가 공판정에서 구술로 공소장변경허가신청을 한 경우에는 법원이 이를 허가하였더라도 효력이 없다.", false, "▸ 법원은 피고인이 재정하는 공판정에서는 피고인에게 이익이 되거나 피고인이 동의하는 경우 구술에 의한 공소장변경을 허가할 수 있다(규칙 제142조 제5항).", "공판심리"],
["608", "★ 검사가 구두로 공소장변경허가신청을 하면서 변경하려는 공소사실의 일부만 진술하고 나머지는 전자적 형태의 문서로 저장한 저장매체를 제출한 경우, 저장매체에 저장된 전자적 형태의 문서로 제출된 부분은 공소장변경허가신청이 된 것이라고 할 수 없으므로 법원이 그 부분에 대해서까지 공소장변경허가를 하였더라도 적법한 공소장변경이 된 것으로 볼 수 없다.", true, "▸ 검사가 공소장변경허가신청서에 의한 공소장변경허가를 구하면서 변경하려는 공소사실을 전자적 형태의 문서로 작성하여 그 문서가 저장된 저장매체를 첨부한 경우에는 저장매체에 저장된 전자적 형태의 문서 부분에 대해서는 공소장변경허가신청이 된 것이라고 할 수 없다. [2015도3682]", "공판심리"],
["609", "★ 검사가 공소장변경허가신청서를 제출하지 않고 검사의 의견을 기재한 서면을 제출하였다면 이를 공소장변경허가신청서를 제출한 것으로 볼 수 있다.", true, "▸ [AI해설] 검사가 공소장변경허가신청서를 제출하지 않고 검사의 의견을 기재한 서면을 제출하였다면 이를 공소장변경허가신청서를 제출한 것으로 볼 수 있다. [2021도13108]", "공판심리"],
["610", "★ 「형사소송규칙」은 '공소장변경허가신청서가 제출된 경우 법원은 그 부본을 피고인 또는 변호인에게 즉시 송달하여야 한다'고 규정하고 있는데, 이는 피고인과 변호인 모두에게 부본을 송달하여야 한다는 취지가 아니므로 공소장변경신청서를 피고인과 변호인 중 어느 한 쪽에 대해서만 송달하였다고 하여 위법하다고 할 수 없다.", true, "▸ 법원은 공소장변경허가신청서의 부본을 피고인 '또는' 변호인에게 즉시 송달하여야 한다(규칙 제142조 제3항). 양쪽 모두에게 송달할 의무는 없다. [2014도14843]", "공판심리"],
["611", "★ 공연추행죄로 기소된 피고인이 제1심에서 무죄가 선고되자 검사가 항소심에서 공연음란죄를 예비적으로 추가하는 공소장변경허가신청서를 제출하였는데, 항소심이 공소장변경허가신청서 부본을 피고인 및 변호인에게 송달하거나 교부하지 않은 채 공판절차를 진행하여 예비적 공소사실인 공연음란죄를 유죄로 판단한 것은, 판결에 영향을 미친 공소장변경절차에 관한 법령 위반은 아니다.", false, "▸ 서면에 의한 공소장변경허가신청이 있는데도 법원이 피고인 또는 변호인에게 공소장변경허가신청서 부본을 송달·교부하지 않은 채 공소장변경을 허가하고 유죄판결을 하였다면, 판결에 영향을 미친 법령 위반에 해당한다. 다만 피고인과 변호인이 충분히 변론할 기회를 부여받는 등 방어권이나 변호권이 본질적으로 침해되지 않았다고 볼 만한 특별한 사정이 있다면 예외이다. [2019도7217]", "공판심리"],
["612", "★ 제1심법원이 공소장변경허가신청에 대한 결정을 공판정에서 고지한 경우, 그 사실은 공판조서의 필요적 기재사항이다.", true, "▸ 공소장변경허가 여부 결정을 공판정에서 고지하였다면 그 사실은 공판조서의 필요적 기재사항이다(판결 기타의 재판을 선고 또는 고지한 사실; 제51조 제2항 제14호). [2023도3038]", "공판심리"],
["613", "★ 법원이 검사에게 공소장변경을 요구할 것인지 여부는 재량에 속하는 것이므로, 법원이 검사에게 공소장변경을 요구하지 아니하였다고 하여 위법하다고 할 수 없다.", true, "▸ 법원은 심리의 경과에 비추어 상당하다고 인정할 때에는 공소사실 또는 적용법조의 추가 또는 변경을 요구하여야 한다(제298조 제2항). 공소장변경을 요구할 것인지 여부는 재량에 속하는 것이므로, 법원이 검사에게 공소장의 변경을 요구하지 아니하였다고 하여 위법하다고 할 수 없다.", "공판심리"],
["614", "★ 검사의 공소장변경허가신청이 공소사실의 동일성 범위 안에 있는 것이라도 법원은 이를 허가하지 않을 수 있다.", false, "▸ 검사의 공소장변경허가신청이 공소사실의 동일성을 해하지 아니하는 한 법원은 이를 '허가하여야 한다'는 뜻으로 해석된다. [2020도13812]", "공판심리"],
["615", "★ 甲은 乙로부터 노트북컴퓨터를 위탁받아 보관하고 丙로부터 태블릿PC를 위탁받아 보관하던 중 이를 일괄 매각하여 도박 자금을 마련하였다. 검사는 甲을 횡령죄 및 도박죄로 기소하였다. 만약 甲이 위 매각행위로 횡령한 물건에 피해자 丙으로부터 위탁받아 보관 중이던 태블릿PC도 포함된 사실이 추가로 드러나자 검사가 이를 공소사실에 추가하는 공소장변경신청을 한 경우, 특별한 사정이 없는 한 법원은 이를 허가하여야 한다.", true, "▸ 법원은 공소사실의 동일성을 해하지 아니하는 한도에서 공소장변경을 허가하여야 한다(제298조 제1항). 상상적 경합관계에 있는 다른 피해자들에 대한 횡령을 추가하는 취지의 공소장변경은 공소사실의 동일성이 인정된다. [2023도3038]", "공판심리"],
["616", "★ 일죄의 관계에 있는 여러 범죄사실 중 일부의 범죄사실에 대하여 공소가 제기된 뒤에 항소심에서 나머지 부분을 추가하는 공소장변경 신청이 있는 경우에는 공소사실의 동일성이 인정되는 때에도 법원은 이를 허가하여서는 아니 된다.", false, "▸ 일죄의 관계에 있는 여러 범죄사실 중 일부에 대하여 공소가 제기된 후 항소심에서 나머지 부분을 추가하는 공소장변경 신청이 있는 경우에도, 공소사실의 동일성이 인정되면 법원은 이를 허가하여야 한다. [2013도8118]", "공판심리"],
["617", "★ 법원이 적법하게 공판의 심리를 종결한 후 검사가 변론재개신청과 함께 적법한 공소장변경허가신청을 한 경우 항소심법원은 반드시 종결한 심리를 재개하여 공소장변경을 허가하여야 한다.", false, "▸ 법원이 적법하게 공판의 심리를 종결한 뒤에 이르러 검사가 공소장변경허가신청을 하였다 하여 반드시 공판의 심리를 재개하여 공소장변경을 허가하여야 하는 것이 아니며, 이는 변론재개신청과 함께 된 것이라 하더라도 마찬가지이다. [2007도984]", "공판심리"],
["618", "★ 甲과 乙은 서로 공모하지 않은 채 甲이 먼저 상해의 고의로 丙의 머리를 수회 때렸고, 이로부터 약 1시간 후 乙은 丙에게 다가가 상해의 고의로 丙의 머리를 수회 때렸다. 甲과 乙은 각각 상해죄로 기소되어 제1심에서 유죄판결을 받자 항소하였다. 항소심법원이 적법하게 공판의 심리를 종결한 후 丙가 사망하자 검사가 공소사실을 각각 상해치사죄로 변경하는 공소장변경신청을 하면서 변론재개신청을 하더라도, 항소심법원이 종결한 심리를 재개하여 공소장변경을 허가할 의무는 없다.", true, "▸ 변론종결 이후에 사망이라는 사정이 발생하였더라도 법원은 반드시 심리를 재개하여 공소장변경을 허가할 의무가 없다. [2007도984]", "공판심리"],
["619", "★ 공소장변경이 피고인의 방어권 행사에 불이익을 증가시킬 염려가 있다고 인정하는 경우에도 법원은 피고인이나 변호인의 청구가 있을 때에만 공판절차를 정지할 수 있다.", false, "▸ 공소사실 또는 적용법조의 추가, 철회 또는 변경이 피고인의 불이익을 증가할 염려가 있다고 인정한 때에는 '직권' 또는 피고인이나 변호인의 '청구'에 의하여 공판절차를 정지할 수 있다(제298조 제4항).", "공판심리"],
["620", "★ 법원이 예비적으로 추가된 공소사실에 대하여 공소장변경 허가결정을 한 경우, 원래의 공소사실과 예비적으로 추가된 공소사실 사이에 동일성이 인정되지 않더라도 공소장변경 허가를 한 법원이 스스로 이를 취소할 수는 없다.", false, "▸ 공소장변경허가결정에 위법사유가 있는 경우에는 공소장변경허가를 한 법원이 스스로 이를 취소할 수 있다. [2001도116]", "공판심리"],
["621", "★ 법원의 공소장변경 허가결정은 판결 전의 소송절차에 관한 결정이므로 그 결정에 대하여 독립하여 항고할 수 있다.", false, "▸ 판결 전의 소송절차에 관한 결정에 대하여는 특히 즉시항고를 할 수 있는 경우 외에는 항고하지 못한다(제403조 제1항). 공소사실의 추가·철회 또는 변경의 허가에 관한 결정에 위법이 있으면 그 판결에 대하여 '상소'를 하는 방법으로만 불복할 수 있다. [2023도3038]", "공판심리"],
["622", "★ 제1심법원이 공소장변경허가신청에 대하여 불허가 결정을 한 경우, 검사는 이에 불복하여 그 결정에 대한 즉시항고를 제기할 수 있다.", false, "▸ 공소장변경 허가에 관한 결정은 판결 전의 소송절차에 관한 결정으로서 즉시항고로 독립하여 불복할 수 없고, 위법이 판결에 영향을 미친 경우 그 판결에 대하여 상소하는 방법으로만 불복할 수 있다. [2023도3038]", "공판심리"],
["623", "★ 공소사실이 변경 전의 공소사실과 기본적 사실관계에서 동일하다면 그것이 새로운 공소의 추가적 제기와 다르지 않다고 하더라도 공소장의 변경은 항소심에서도 할 수 있다.", true, "▸ 현행법상 형사항소심의 구조가 사후심으로서의 성격만을 가지는 것은 아니므로, 공소사실의 동일성이 인정되면 항소심에서도 공소장변경을 할 수 있다.", "공판심리"],
["624", "★ 피고인의 상고에 의하여 상고심에서 원심판결을 파기하고 사건을 항소심에 환송한 경우에도 공소사실의 동일성이 인정되면 공소장변경을 허용하여 이를 심판대상으로 삼을 수 있다.", true, "▸ 형사항소심의 구조가 사후심으로서의 성격만을 가지는 것은 아니므로, 피고인의 상고로 사건이 항소심에 환송된 경우에도 공소사실의 동일성이 인정되면 공소장변경을 허용하여 심판대상으로 삼을 수 있다. [2003도8153]", "공판심리"],
["625", "피해자가 제1심에서 처벌불원의사를 표시한 후에도 검사가 항소심에서 공소사실을 폭행에서 상해로 변경하는 공소장변경을 할 수 있고, 이 경우 항소심이 변경된 공소사실인 상해의 점에 대해 심리·판단하여 유죄로 인정한 것은 적법하다.", true, "▸ 반의사불벌죄에서 피해자의 처벌을 희망하지 아니하는 의사표시 또는 처벌을 희망하는 의사표시의 철회가 있는 경우에도, 동일성이 인정되는 범위 내에서 비친고죄인 다른 공소사실로 공소장을 변경할 수 있으며 이러한 경우 변경된 공소사실에 대하여 심리·판단하여야 한다. [2011도2233]", "공판심리"],
["626", "친고죄에서 피해자의 고소가 없거나 고소가 취소되었음에도 친고죄로 기소된 뒤 당초에 기소된 공소사실과 동일성이 인정되는 비친고죄로 공소장을 변경할 수 있으며 이러한 경우 변경된 공소사실에 대하여 심리·판단하여야 한다. 이는 반의사불벌죄에서 피해자의 처벌을 희망하지 아니하는 의사표시 또는 처벌을 희망하는 의사표시의 철회가 있는 경우에도 마찬가지이다.", true, "▸ 친고죄로 기소된 후 고소가 취소되더라도 동일성이 인정되는 비친고죄로 공소장을 변경할 수 있고, 반의사불벌죄에서 처벌불원 의사표시가 있는 경우도 마찬가지이다. [2011도2233]", "공판심리"],
["627", "★ 약식명령에 대하여 피고인만이 정식재판을 청구한 사건에서 법정형에 유기징역형만 있는 범죄로 공소장을 변경하는 것도 허용된다.", true, "▸ 사서명위조죄와 위조사서명행사죄의 법정형에 유기징역형만 있다 하더라도 불이익변경금지 원칙 등을 이유로 공소장변경을 불허할 것은 아니다. [2011도14986]", "공판심리"],
["628", "★ 공소사실의 동일성이 인정되지 않는 범죄사실을 공소사실로 추가하는 취지의 공소장변경이 있는 경우, 법원은 그 변경신청을 허가할 수 있다.", false, "▸ 공소사실의 동일성이 인정되지 않는 범죄사실을 공소사실로 추가하는 취지의 공소장변경이 있는 경우, 법원은 그 변경신청을 기각하여야 한다. [2022도6993]", "공판심리"],
["629", "★ 포괄일죄의 경우에 그 공소장변경허가 여부를 결정함에 있어서는 포괄일죄를 구성하는 개개 공소사실별로 종전 것과의 동일성 여부를 따지기보다는 변경된 공소사실이 전체적으로 포괄일죄의 범주 내에 있는지 여부, 즉 단일하고 계속된 범의 하에 동종의 범행을 반복하여 행하고 그 피해법익도 동일한 경우에 해당한다고 볼 수 있는지 여부에 초점을 맞추어야 한다.", true, "▸ [AI해설] 포괄일죄의 경우 공소장변경허가 여부는 개개 공소사실별로 동일성 여부를 따지기보다 변경된 공소사실이 전체적으로 포괄일죄의 범주 내에 있는지에 초점을 맞추어야 한다. [2006도514]", "공판심리"],
["630", "★ 검사는 甲을 흉기를 휴대하고 다방에 모여 강도예비를 하였다는 강도예비로 기소하였고 재판 도중에 강도예비를 주위적 공소사실로,「폭력행위 등 처벌에 관한 법률」제7조 위반을 예비적 공소사실로 공소장변경을 신청하였다. 강도예비의 공소사실과「폭력행위 등 처벌에 관한 법률」제7조(우범자) 위반의 공소사실은 그 동일성의 범위를 벗어나므로 제1심법원은 공소장변경을 허가하여서는 아니 된다.", false, "▸ 흉기를 휴대하고 다방에 모여 강도예비를 하였다는 공소사실과 정당한 이유없이 폭력범죄에 공용될 우려가 있는 흉기를 휴대하고 있었다는 폭력행위등처벌에관한법률 제7조 위반 공소사실은 기본적 사실이 동일하므로 공소장변경은 적법하다. [86도2396]", "공판심리"],
["631", "★ 검사가 당초 '피고인이 甲 등에게 필로폰 약 0.3g을 교부하였다'고 하여 마약류관리에관한법률위반(향정)으로 공소를 제기하였다가 '피고인이 甲 등에게 필로폰을 구해주겠다고 속여 甲 등에게서 필로폰 대금을 편취하였다'는 사기 범죄사실을 예비적으로 추가하는 공소장변경을 신청한 경우, 위 두 범죄사실은 기본적인 사실관계가 동일하므로 공소장변경은 허용된다.", false, "▸ 마약류관리에관한법률위반(향정)의 범죄사실과 사기의 범죄사실은 수단·방법 등 범죄사실의 내용이나 행위의 태양 및 피해법익이 다르고 죄질에도 현저한 차이가 있어, 기본적인 사실관계가 동일하다고 볼 수 없다. [2010도16659]", "공판심리"],
["632", "★ 피고인이 거래처로부터 돈을 수금하여 보관하던 중 횡령하였다는 공소사실과 그 돈의 수금권한이 없는데도 있는 것처럼 가장하고 수금하여 이를 편취하였다는 공소사실은 동일성이 인정되지 않는다.", false, "▸ 피고인이 거래처로부터 돈을 수금하여 보관하던 중 횡령하였다는 사실과 수금권한이 없는데도 있는 것처럼 가장하고 수금하여 편취하였다는 사실은 동일한 기본적 사실에 대한 법률적 평가를 달리한 데 불과하므로 공소장변경은 적법하다. [83도3074, 비양립관계]", "공판심리"],
["633", "★ 피고인이 피해자를 살해하려고 목을 누르는 등 폭행을 가하였으나 미수에 그쳤다는 살인미수의 공소사실에 대하여 예비적으로 피고인이 피해자를 강간하려고 위와 같은 폭행을 가하였으나 미수에 그치고 피해자에게 상해를 입혔다는 강간치상의 공소사실을 추가하는 공소장변경은 공소사실의 동일성을 해친다고 볼 수 없다.", true, "▸ [AI해설] 살인미수 공소사실에 예비적으로 강간치상 공소사실을 추가하는 공소장변경은 공소사실의 동일성을 해친다고 볼 수 없다. [84도660]", "공판심리"],
["634", "★ 포괄일죄인 영업범에서 공소제기의 효력은 공소가 제기된 범죄사실과 동일성이 인정되는 범죄사실의 전체에 미치므로, 공판심리 중에 그 범죄사실과 동일성이 인정되는 범죄사실이 추가로 발견된 경우에 검사는 공소장변경절차에 의하여 그 범죄사실을 공소사실로 추가할 수 있다.", true, "▸ [AI해설] 포괄일죄인 영업범에서 공소제기의 효력은 동일성이 인정되는 범죄사실의 전체에 미치므로, 공판심리 중 추가로 발견된 범죄사실은 공소장변경절차에 의하여 추가할 수 있다. [2016도21342]", "공판심리"],
["635", "★ 포괄일죄에 관한 기존 처벌법규에 대하여 그 표현이나 형량과 관련한 개정을 하는 경우가 아니라 애초에 죄가 되지 아니하던 행위를 구성요건의 신설로 포괄일죄의 처벌대상으로 삼는 경우에는 신설된 포괄일죄 처벌법규가 시행되기 이전의 행위에 대하여는 신설된 법규를 적용하여 처벌할 수 없다.", true, "▸ 애초에 죄가 되지 않던 행위를 구성요건의 신설로 포괄일죄의 처벌대상으로 삼는 경우, 신설된 포괄일죄 처벌법규 시행 이전의 행위에는 신설된 법규를 적용하여 처벌할 수 없다.", "공판심리"],
["636", "★ 상습강제추행죄가 시행되기 이전에 범해진 강제추행행위는 습벽에 의한 것이라도 상습강제추행죄로 처벌할 수 없고, 개정형법의 시행 전에 상습으로 행해진 강제추행죄 등은 상습범이 아닌 수죄의 경합범으로 처벌하여야 한다.", true, "▸ 상습강제추행죄 시행 이전의 습벽에 의한 강제추행행위는 상습강제추행죄로 처벌할 수 없고, 수죄의 경합범으로 처벌하여야 한다.", "공판심리"],
["637", "★ 보이스피싱 사기죄 공소사실에 대해 제1심 판결이 선고된 후 항소심에서 형법 제114조의 범죄단체 조직 및 활동의 공소사실을 추가하는 공소장변경은 허가될 수 있다.", false, "▸ 보이스피싱 사기죄 공소사실과 범죄단체 조직·활동 공소사실은 동일성이 없으므로 공소장변경은 허가될 수 없다. [2020도10814]", "공판심리"],
["638", "★ 공소장이 변경되지 않았더라도 법원은 공소사실의 동일성이 인정되는 범위 내에서 심리의 경과에 비추어 피고인의 방어권 행사에 실질적인 불이익을 초래할 염려가 없다고 인정되는 때에는 직권으로 공소장에 기재된 공소사실과 다른 범죄사실을 인정할 수 있다.", true, "▸ 법원은 공소사실의 동일성이 인정되는 범위 내에서 심리의 경과에 비추어 피고인의 방어권 행사에 실질적인 불이익을 초래할 염려가 없다고 인정되는 때에는, 공소장이 변경되지 않았더라도 직권으로 다른 범죄사실을 인정할 수 있다.", "공판심리"],
["639", "★ 공소장변경절차 없이도 법원이 심리·판단할 수 있는 죄가 한 개가 아니라 여러 개인 경우로서 피고인의 방어권 행사에 실질적인 불이익이 없는 경우에, 법원으로서는 그 중 어느 하나를 임의로 선택하여 심리·판단할 수 있다.", false, "▸ 법원으로서는 그 중 어느 하나를 임의로 선택할 수 있는 것이 아니라 검사에게 공소사실 및 적용법조에 관한 석명을 구하여 공소장을 보완하게 한 다음 이에 따라 심리·판단하여야 한다. [2005도279]", "공판심리"],
["640", "★ 甲이 X건물과 Y건물을 이중매매하였고 검사가 甲의 X, Y건물에 대한 배임행위를 포괄하여 특정경제범죄가중처벌등에관한법률위반(배임)죄로 기소하였는데 법원 심리결과 단순 배임죄의 경합범으로 확인되었다고 하더라도, 법원이 공소장변경 없이 단순 배임죄의 실체적 경합으로 인정하는 것은 허용되지 아니한다.", false, "▸ 실체적 경합범으로 기소된 것을 포괄일죄로, 포괄일죄로 기소된 것을 실체적 경합범으로, 실체적 경합범으로 기소된 것을 상상적 경합범으로 인정하는 것은 공소장변경이 없더라도 직권으로 인정할 수 있다.", "공판심리"],
["641", "★ 피고인의 방어권 행사에 실질적인 불이익을 주는 것이 아니라면 공소장변경 없이 단독범으로 기소된 공소사실을 공동정범으로 인정하거나 공동정범으로 기소된 것을 단독범으로 인정할 수 있다.", true, "▸ 공동정범으로 기소된 공소사실을 공소장변경 없이 단독범으로 인정하거나, 단독범으로 기소된 것을 공동정범으로 인정하더라도 피고인에게 예기치 않은 타격을 주어 방어권 행사에 실질적 불이익을 줄 우려가 없다면 공소장변경이 필요하지 않다. [2018도5909, 2013도10112]", "공판심리"],
["642", "★ 「형법」제34조 제1항의 간접정범은 정범과 동일한 형 또는 그보다 감경된 형으로 처벌되는 점 등에 비추어 볼 때, 정범으로 기소된 피고인에게 법원이 공소장변경 없이 직권으로 위 간접정범 규정을 적용하였더라도 피고인의 방어권 행사에 실질적인 불이익을 초래하였다고 할 수 없다.", true, "▸ 간접정범은 정범과 동일한 형 또는 그보다 감경된 형으로 처벌되는 점 등에 비추어, 공소장 변경 없이 직권으로 간접정범 규정을 적용하였더라도 방어권 행사에 실질적인 불이익을 초래하였다고 할 수 없다. [2016도21075]", "공판심리"],
["643", "★ 검사가 공동정범으로 기소하였으나 법원이 甲에게 방조의 죄책이 인정된다고 판단하여 공소장변경 없이 방조범을 인정하는 경우, 심리과정에서 방조범에 대해 전혀 언급이 없거나 공방이 이뤄지지 않았다 하더라도 이는 甲의 방어권행사에 실질적인 불이익을 초래한 것이 아니므로 위법하지 아니하다.", false, "▸ 관세포탈죄의 공동정범으로 공소가 제기된 사건의 심리과정에서 단 한번도 언급된 바 없는 관세포탈의 방조사실을 법원이 공소장의 변경도 없이 유죄로 인정하는 것은 피고인의 방어권 행사에 실질적인 불이익을 초래할 염려가 있다. [94도1684]", "공판심리"],
["644", "★ 법원은 심리 중 丙의 행위가 특수절도죄(합동)의 공동정범이 아니라 종범에 해당하는 사실을 인정한 경우에 직권으로 이를 종범으로 인정하지 않고 특수절도죄의 공동정범에 대하여 무죄를 선고하는 것은 허용되지 않는다.", false, "▸ 법원은 공소사실의 동일성이 인정되는 범위 내에서 공소가 제기된 범죄사실보다 가벼운 범죄사실이 인정되는 경우 방어에 실질적인 불이익을 주는 것이 아니라면 공소장 변경 없이 직권으로 가벼운 범죄사실을 인정할 수 있다. 그러나 이는 직권인정의 권한이지 의무는 아니므로, 무죄 선고도 허용된다. [2001도4013]", "공판심리"],
["645", "★ 일반법과 특별법의 동일한 구성요건에 모두 해당하는 범죄사실에 대하여 검사가 형이 가벼운 일반법을 적용하여 기소한 경우 법원이 공소장변경 없이 형이 더 무거운 특별법위반의 죄로 처단할 수 없다.", true, "▸ [AI해설] 검사가 형이 가벼운 일반법으로 기소한 경우, 법원이 공소장변경 없이 형이 더 무거운 특별법위반의 죄로 처단할 수 없다. [2016도11880]", "공판심리"],
["646", "★ 미성년자 약취 후 재물을 요구하였으나 취득하지는 못한 자에 대하여 '미성년자 약취 후 재물취득 미수'에 의한 특정범죄 가중처벌 등에 관한 법률 위반죄로 기소된 공소사실에 대하여 공소장변경의 절차 없이도 법원이 직권으로 '미성년자 약취 후 재물요구 기수'에 의한 같은 법 위반죄를 인정할 수 있다.", false, "▸ 법원이 공소장변경 없이 '미성년자 약취 후 재물요구 기수'에 의한 특가법위반죄로 인정하여 미수감경을 배제하는 것은 피고인의 방어권 행사에 실질적인 불이익을 초래한다. [2008도3747]", "공판심리"],
["647", "★ 살인죄의 구성요건은 폭행치사 사실을 포함하므로, 법원은 살인죄가 인정되지 않더라도 공소장 변경 없이 폭행치사죄를 인정할 수 있다.", false, "▸ 살인죄의 공소사실에 대하여 공소장의 변경 없이 폭행치사죄를 인정하는 것은 피고인 방어권 행사에 불이익을 주는 것이므로, 법원은 검사의 공소장변경 없이는 폭행치사죄로 처단할 수 없다. [2001도1091]", "공판심리"],
["648", "★ 법원은 장물보관죄로 공소제기된 사건을 검사의 공소장변경 절차없이 업무상과실장물보관죄로 의율처단할 수 있다.", false, "▸ 장물보관죄로 공소제기된 사건을 검사의 공소장변경 절차없이 업무상과실 장물보관죄로 의율처단할 수는 없다. [83도3334]", "공판심리"],
["649", "★ 관세포탈미수로 인한 특정범죄가중처벌등에관한법률위반(관세)죄로 공소제기된 경우에는 공소장변경 없이 관세포탈예비로 인한 특정범죄가중처벌등에관한법률위반(관세)죄로 인정할 수 없다.", true, "▸ 미수를 예비·음모로 공소장변경없이 직권으로 인정할 수 없다. [82도2939]", "공판심리"],
["650", "★ 변제할 의사와 능력 없이 피해자로부터 금원을 빌린 사실로 기소된 공소사실을 공소장변경 절차 없이 피해자에게 제3자를 소개케 하여 동액의 금원을 차용하고 피해자에게 그에 대한 보증채무를 부담케 하여 재산상의 이익을 취득하였다는 사실로 인정하였다 할지라도 거기에 어떠한 위법이 있다 할 수 없다.", true, "▸ [AI해설] 공소사실의 동일성이 인정되는 범위 내에서 피고인의 방어권에 불이익이 없는 경우 공소장변경 없이 직권으로 유사한 사기 범죄사실을 인정하는 것은 위법이 아니다. [84도312]", "공판심리"],
["651", "甲과 乙이 공모하여 식당에서 현금 10만 원과 신용카드를 절취하고, 乙은 그 동안 망을 보았다는 특수절도 공소사실로 기소되었다. 만약 乙과의 공모 사실이 인정되지 않는다면, 공소장변경이 없더라도 甲에 대하여 단독 절도죄로 유죄를 인정할 수 있다.", true, "▸ 특수절도죄로 공소제기한 사실을 법원이 검사의 공소장변경절차없이 절도죄로 인정하더라도 위법이라 할 수 없다. [73도1256]", "공판심리"],
["652", "★ 강간죄로 기소된 공소사실에 대하여 공소장변경의 절차 없이도 법원이 직권으로 폭행죄만을 인정할 수 있다.", true, "▸ 폭행의 사실은 강간의 공소사실에 포함되어 있고 충분한 심리가 이루어졌으므로, 강간 범행이 인정되지 않는 경우 공소장변경 절차 없이 폭행죄만 인정하더라도 피고인의 방어권 행사에 실질적 불이익을 초래할 염려가 없다.", "공판심리"],
["653", "강도치상죄 공소사실에서 날치기가 반항억압을 목적으로 함이 없이 점유탈취의 과정에서 우연히 가해진 것에 불과한 경우, 법원은 공소장변경이 없어도 절도죄와 폭행치상죄의 실체적 경합범으로 처벌할 수 있다.", true, "▸ [AI해설] 날치기가 반항억압 목적이 없는 경우, 법원은 공소장변경 없이 강도치상죄 공소사실에 대하여 절도죄와 폭행치상죄의 실체적 경합범으로 처벌할 수 있다. [2003도2316]", "공판심리"],
["654", "★ 검사가 甲, 乙을 폭력행위등처벌에관한법률위반(공동공갈)죄로 공소제기하였으나, 법원이 '공동'의 점이 인정되지 않는다고 판단하였다면 공소장변경 없이 형법상 단순공갈죄의 성립을 인정할 수 있다.", true, "▸ 폭처법위반(공동폭행·공동협박)죄로 공소제기된 것을 법원이 2인 이상의 공동 사실이 인정되지 아니할 때에는 공소장 변경절차 없이도 형법상 폭행, 협박에 관하여 심리·판단할 수 있다. [90도2022]", "공판심리"],
["655", "★ 공소사실의 동일성이 인정되는 경우라 하더라도 법원은 허위사실적시 출판물에 의한 명예훼손의 공소사실에 대하여 공소장변경 없이 사실적시 출판물에 의한 명예훼손으로 처벌할 수 없다.", false, "▸ 검사가 허위사실적시 명예훼손죄로 기소하였으나 허위임에 대한 입증이 없는 경우, 법원은 공소장변경 없이 사실적시 명예훼손죄를 직권으로 인정할 수 있다. 다만 직권으로 인정하지 않았다고 하여 위법은 아니다. [2007도1220]", "공판심리"],
["656", "★ 검사가 허위사실적시 명예훼손죄로 기소하였으나, 심리결과 적시한 사실이 허위임에 대한 입증이 없는 경우 법원은 공소장변경 없이 사실적시 명예훼손죄를 인정해야 한다.", false, "▸ 법원은 공소장변경 없이 사실적시 명예훼손죄를 직권으로 인정할 수 있으나, 인정하지 않았다고 하여 위법하다고 할 수 없다. 직권인정 의무는 없다. [2007도1220]", "공판심리"],
["657", "★ 명예훼손으로 공소가 제기되고 제1심 공판절차 진행 중 명예훼손죄의 성립에 필요한 구체적인 사실의 적시가 인정되지 않아 모욕죄만 인정되는 경우라면, 제1심법원은 검사의 공소장변경신청 없이 모욕죄만을 인정하여 유죄판결을 선고할 수 있다.", false, "▸ 명예훼손죄의 공소사실에 대하여 공소장변경 없이 모욕죄로 인정할 수 없다. [70도1859]", "공판심리"],
["658", "★ 비록 사실인정에 변화가 없고 그 사실에 대한 법률적 평가만을 달리하는 경우라도, 배임죄로 기소된 공소사실에 대하여 법원이 공소장변경 없이 횡령죄로 인정하는 것은 구성요건을 달리하는 것이어서 허용되지 않는다.", false, "▸ 횡령죄와 배임죄는 같은 죄질의 재산범죄로서 형벌에서도 경중의 차이가 없고 동일한 범죄사실에 대하여 단지 법률적용만을 달리하는 경우에 해당하므로, 법원은 공소장변경 없이도 배임죄를 횡령죄로, 횡령죄를 배임죄로 처벌할 수 있다. [2013도9481, 99도2651]", "공판심리"],
["659", "甲은 자신의 명의로 자동차 등록을 마치면서 乙캐피탈로부터 3,000만 원을 대출받고 캐피탈 앞으로 저당권을 설정하였다. 그 후 甲은 乙캐피탈의 동의 없이 사채업자 丙에게 1,000만 원을 빌리면서 담보로 위 승용차를 인도하였다. 이에 乙캐피탈이 甲을 고소하자 검사는 甲을 배임죄로 기소하였다. 이 경우 법원은 공소장 변경 없이 甲에 대한 권리행사방해죄를 인정할 수 있다.", false, "▸ 권리행사방해죄와 배임죄는 구성요건과 보호법익이 달라 법원이 공소장 변경 없이 배임죄를 유죄로 인정하는 것은 피고인의 방어권 행사에 실질적인 불이익을 초래할 염려가 있다. [2017도4578]", "공판심리"],
["660", "★ 강간치상죄로 기소한 경우, 법원의 심리결과 치상의 점에 관하여 증명이 없는 때에는 법원은 공소장변경절차를 거쳐야만 강간죄를 인정할 수 있다.", false, "▸ 강간치상죄는 강간죄의 결과적 가중범으로서 강간치상의 공소사실 중에는 강간죄의 공소사실도 포함되어 있으므로, 법원은 공소장변경절차없이 강간죄의 공소사실에 관하여 심리판단할 수 있다. [87도2673]", "공판심리"],
["661", "★ 장물취득의 공소사실에 대해 장물보관의 범죄사실을 인정하는 것은 법적 평가에 차이가 있을 뿐 공소사실의 동일성이 인정되는 범위 내에 있으므로 공소장변경이 필요하지 않다.", true, "▸ 공소제기된 장물취득의 점과 실제로 인정되는 장물보관의 범죄사실 사이에는 법적 평가에 차이가 있을 뿐 공소사실의 동일성이 인정된다. [2003도1366]", "공판심리"],
["662", "★ 공소제기된 장물취득의 점과 실제로 인정되는 장물보관의 범죄사실 사이에 법적 평가에 차이가 있을 뿐 공소사실의 동일성이 인정된다면, 법원은 공소사실의 변경이 없더라도 직권으로 장물보관의 범죄사실을 유죄로 인정하여야 한다.", true, "▸ 법원은 공소사실의 변경이 없더라도 직권으로 장물보관의 범죄사실을 유죄로 인정하여야 한다. 직권으로 인정할 수 있을 뿐만 아니라 직권으로 인정해야 할 의무도 있다. [2003도1366]", "공판심리"],
["663", "★ 준강간죄의 장애미수 범죄사실로 기소되었으나 피고인이 당시 인식한 피해자의 상태에 관하여 충분한 심리가 이루어졌다면, 법원은 준강간죄의 불능미수 범죄사실을 직권으로 인정하였어야 한다.", true, "▸ 준강간죄의 불능미수가 중대한 범죄이고, 준강간죄의 장애미수와 사이에 범죄의 중대성, 죄질, 처벌가치 등 측면에서 별다른 차이가 없어, 공소장이 변경되지 않는다면 적정절차에 의한 신속한 실체적 진실의 발견이라는 형사소송의 목적에 비추어 현저히 정의와 형평에 반하므로 준강간죄의 불능미수 범죄사실을 직권으로 인정하였어야 한다. [2021도9043]", "공판심리"],
["664", "★ 공소취소는 반드시 서면으로 해야 하나, 공소사실의 철회는 서면이나 구술로도 할 수 있다.", false, "▸ 공소취소는 이유를 기재한 서면으로 하여야 한다. 단, 공판정에서는 구술로써 할 수 있다(제255조 제2항). 공소사실 철회(공소장변경)도 공판정에서 구술로 할 수 있다(규칙 제142조 제1항, 제5항). 공소취소도 공판정에서는 구술로 가능하므로 '반드시 서면으로'는 틀렸다.", "공판심리"],
["665", "★ 공소취소는 1심판결선고 전까지 가능하나 재심절차에서는 공소취소를 할 수 없다.", true, "▸ [AI해설] 공소취소는 1심판결선고 전까지 가능하나 재심절차에서는 공소취소를 할 수 없다. [76도3203]", "공판심리"],
["666", "★ 공소장변경의 방식에 의한 공소사실의 철회는 공소사실의 동일성이 인정되는 범위 내의 일부 공소사실에 한하여 가능한 것이므로, 공소장에 기재된 수개의 공소사실이 서로 동일성이 없고 실체적 경합관계에 있는 경우에 그 일부를 소추대상에서 철회하려면 공소장변경의 방식에 의할 것이 아니라 공소의 일부취소절차에 의하여야 한다.", true, "▸ [AI해설] 수개의 공소사실이 실체적 경합관계에 있는 경우 그 일부를 철회하려면 공소장변경 방식이 아니라 공소의 일부취소절차에 의하여야 한다. [91도1438]", "공판심리"],
["667", "★ 실체적 경합관계에 있는 수개의 공소사실의 전부 또는 일부를 철회하는 공소취소를 하고 공소기각결정이 확정된 경우에는 재기소제한이 적용되지 않는다.", false, "▸ 실체적 경합관계에 있는 수개의 공소사실의 전부 또는 일부를 철회하는 공소취소의 경우 재기소 제한이 적용된다(2004도3203).", "공판심리"],
["668", "포괄일죄로 기소된 공소사실 중 일부에 대하여 공소장변경방식으로 이루어지는 공소사실의 일부철회의 경우 형사소송법 제329조의 재기소제한이 적용된다.", false, "▸ 포괄일죄로 기소된 공소사실 중 일부에 대하여 공소장변경의 방식으로 이루어지는 공소사실의 일부 철회의 경우에는 제329조의 규정의 제한이 적용되지 아니한다. [2004도3203]", "공판심리"],
["669", "甲은 2021. 12. 1. 乙의 휴대전화 1대를 절취하였고, 2022. 4. 18. 丙의 지갑 1개를 절취하였고, 2022. 5. 10. 丁의 신용카드 1매를 절취하였다. 이에 대하여 검사는 2024. 1. 5. 甲을 상습절도죄로 기소하였다. 그런데 검사가 공판절차 진행 중 ③ 부분의 공소사실을 철회한 경우, 그 범죄사실에 대한 다른 중요한 증거를 발견한 것이 아니더라도 점유이탈물횡령죄로 다시 공소를 제기할 수 있다.", true, "▸ 포괄일죄로 기소된 공소사실 중 일부에 대하여 공소장변경의 방식으로 이루어지는 공소사실의 일부 철회의 경우에는 제329조의 재기소제한이 적용되지 아니한다. [2004도3203]", "공판심리"],
["670", "★ 공소취소에 의한 공소기각의 결정이 확정된 때에는 공소취소 후 그 범죄사실에 대한 다른 중요한 증거를 발견한 경우에 한하여 다시 공소를 제기할 수 있다.", true, "▸ 제329조에 따라 공소취소에 의한 공소기각의 결정이 확정된 때에는 다른 중요한 증거를 발견한 경우에 한하여 다시 공소를 제기할 수 있다.", "공판심리"],
["671", "★ 검사가 동일한 사건에 대하여 동일한 법원에 다시 공소를 제기한 경우, 수소법원은 공소기각판결을 선고하여야 한다.", true, "▸ 공소가 제기된 사건에 대하여 다시 공소가 제기되었을 때 판결로써 공소기각의 선고를 하여야 한다(제327조 제3호).", "공판심리"],
["672", "甲은 대표이사와의 갈등으로 퇴사한 후 회사 비리를 알리겠다며 각각 3차례에 걸쳐 대표이사에게 협박 메일을 발송하였다. 검사가 甲의 1차 협박 범행을 먼저 기소하고 다시 2, 3차의 협박 범행을 추가로 기소하였는데, 이를 병합하여 심리하는 과정에서 전후에 기소된 각각의 범행이 모두 포괄하여 하나의 협박죄를 구성하는 것으로 밝혀진 경우, 법원이 석명절차나 공소장 변경절차를 거치지 아니하고 전후에 기소된 범죄사실 전부에 대하여 실체판단을 하는 것은 위법하다.", false, "▸ 협박죄의 포괄일죄로 공소장을 변경하는 절차가 없었다거나 석명절차를 거치지 아니하였다 하더라도, 전후에 기소된 범죄사실 전부에 대하여 실체판단을 할 수 있고, 추가기소된 부분에 대하여 공소기각판결을 할 필요는 없다. [2007도2595, 공소장변경의제설]", "공판심리"],
["673", "검사 및 변호인은 공판준비기일에 출석하여야 한다.", false, "▸ 검사 및 변호인에게 공판준비기일에 대한 출석 의무는 없다(제266조의8 제1항). 법원은 필요하다고 인정하는 때에는 피고인을 소환할 수 있으며 피고인은 법원의 소환이 없는 때에도 공판준비기일에 출석할 수 있다.", "공판심리"],
["674", "법원은 공판준비기일이 지정된 사건에 관하여 변호인이 없는 때에는 직권으로 변호인을 선정하여야 한다.", true, "▸ 제266조의8 제1항에 따라 법원은 공판준비기일이 지정된 사건에 관하여 변호인이 없는 때에는 직권으로 변호인을 선정하여야 한다.", "공판심리"],
["675", "법원은 필요하다고 인정하는 때에는 피고인을 소환할 수 있으며, 피고인은 법원의 소환이 없는 때에도 공판준비기일에 출석할 수 있다.", true, "▸ 제266조의8 제5항에 따라 법원은 필요하다고 인정하는 때에는 피고인을 소환할 수 있으며, 피고인은 소환이 없는 때에도 공판준비기일에 출석할 수 있다.", "공판심리"],
["676", "★ 피고인 출석 없이도 공판준비기일을 개정할 수 있기 때문에 법원의 소환없이 공판준비기일에 출석한 피고인에게는 진술거부권을 고지할 의무는 없다.", false, "▸ 피고인의 출석 의무가 없으므로 출석 없이도 공판준비기일을 개정할 수 있다. 그러나 피고인이 출석하면 진술거부권을 고지하여야 한다(제266조의8 제6항).", "공판심리"],
["677", "공판준비기일에 신청되지 못한 증거라도 법원은 직권으로 이를 조사할 수 있다.", true, "▸ 공판준비기일에서 신청하지 못한 증거는 소송을 현저히 지연시키지 아니하는 때 등에 한하여 공판기일에 신청할 수 있으나(제266조의13 제1항), 법원은 직권으로 증거를 조사할 수 있다(동조 제2항).", "공판심리"],
["678", "법원은 검사, 피고인 또는 변호인의 의견을 들어 공판준비기일을 지정할 수 있고, 이 경우 당해 신청에 관한 법원의 결정에 대하여는 불복할 수 없다.", true, "▸ 제266조의7 제1항, 제2항에 따라 법원은 검사, 피고인 또는 변호인의 의견을 들어 공판준비기일을 지정할 수 있고, 그 결정에 대하여는 불복할 수 없다.", "공판심리"],
["679", "법원은 공판준비절차에서 공소사실 또는 적용법조를 명확하게 하는 행위를 할 수 있다.", true, "▸ 제266조의9 제1항 제1호에 따라 법원은 공판준비절차에서 공소사실 또는 적용법조를 명확하게 하는 행위를 할 수 있다.", "공판심리"],
["680", "법원은 공판준비절차에서 공소사실 또는 적용법조의 추가·철회 또는 변경을 허가할 수 없다.", false, "▸ 법원은 공판준비절차에서 공소사실 또는 적용법조의 추가·철회 또는 변경을 허가하는 행위를 할 수 있다(제266조의9 제1항 제2호).", "공판심리"],
["681", "법원은 검사, 피고인 또는 변호인의 신청이 없더라도 공판준비에 필요하다고 인정한 때에는 공판기일 전에 피고인 또는 증인을 신문할 수 있고 검증, 감정 또는 번역을 명할 수 있다.", false, "▸ 법원은 검사, 피고인 또는 변호인의 '신청에 의하여' 공판준비에 필요하다고 인정한 때에는 공판기일 전에 피고인 또는 증인을 신문할 수 있고 검증, 감정 또는 번역을 명할 수 있다(제273조 제1항).", "공판심리"],
["682", "★ 피고인에게 변호인이 있는 경우에도 피고인은 검사에게 공소제기된 사건에 관한 서류 또는 물건의 목록과 공소사실의 인정 또는 양형에 영향을 미칠 수 있는 서류의 열람·등사 또는 서면의 교부를 신청할 수 있다.", false, "▸ 피고인 또는 변호인은 검사에게 관련 서류등의 열람·등사 또는 서면의 교부를 신청할 수 있다. 다만, 피고인에게 변호인이 있는 경우에는 피고인은 열람만을 신청할 수 있다(제266조의3 제1항).", "공판심리"],
["683", "피고인 또는 변호인이 검사에게 열람·등사 또는 교부를 신청할 수 있는 서류 등에는 공소사실의 인정 또는 양형에 영향을 미칠 수 있는 서류 또는 물건만 해당되고, 녹음테이프와 비디오테이프 등 특수매체는 사생활 침해 및 전파가능성이 높기 때문에 포함되지 않는다.", false, "▸ 제266조의3 제1항의 서류등은 도면·사진·녹음테이프·비디오테이프·컴퓨터용 디스크, 그 밖에 정보를 담기 위하여 만들어진 물건으로서 문서가 아닌 특수매체를 포함한다. 다만 특수매체에 대한 등사는 필요 최소한의 범위에 한한다(제266조의3 제6항).", "공판심리"],
["684", "검사는 피고인 또는 변호인의 신청이 있는 경우 서류 등의 목록에 대하여는 열람 또는 등사를 거부할 수 없다.", true, "▸ 검사는 국가안보 등의 사유로 열람·등사를 거부하거나 제한할 수 있으나, 서류등의 목록에 대하여는 열람 또는 등사를 거부할 수 없다(제266조의3 제5항).", "공판심리"],
["685", "검사는 열람·등사 또는 서면의 교부를 거부하거나 그 범위를 제한하는 때에는 14일 이내에 피고인 또는 변호인에게 그 이유를 서면 또는 구두의 방법으로 통지하여야 한다.", false, "▸ 검사는 열람·등사 또는 서면의 교부를 거부하거나 그 범위를 제한하는 때에는 '지체 없이' 그 이유를 '서면으로' 통지하여야 한다(제266조의3 제3항).", "공판심리"],
["686", "피고인 또는 변호인은 검사가 서류 등의 열람·등사 또는 서면의 교부를 거부하거나 그 범위를 제한한 때에는 법원에 그 서류 등의 열람·등사 또는 서면의 교부를 허용하도록 청구할 수 있다.", true, "▸ 제266조의4 제1항에 따라 피고인 또는 변호인은 검사가 열람·등사 또는 서면의 교부를 거부하거나 그 범위를 제한한 때에는 법원에 그 서류 등의 열람·등사 또는 서면의 교부를 허용하도록 청구할 수 있다.", "공판심리"],
["687", "★ 수사서류에 대한 법원의 열람·등사 허용 결정이 있음에도 검사가 열람·등사를 거부하는 경우, 수사서류 각각에 대하여 검사가 열람등사를 거부할 정당한 사유가 있는지를 심사할 필요 없이 거부행위는 그 자체로써 기본권의 침해이다.", true, "▸ 법원의 열람·등사 허용 결정이 있음에도 검사가 열람·등사를 거부하는 경우 수사서류 각각에 대하여 거부할 정당한 사유가 있는지를 심사할 필요 없이 그 거부행위 자체로써 청구인들의 기본권을 침해한다. [2009헌마257]", "공판심리"],
["688", "★ 형사소송법상 검사가 수사서류의 열람·등사에 관한 법원의 허용결정을 지체 없이 이행하지 아니하는 때에는 해당 증인 및 서류 등에 대한 증거신청을 할 수 없도록 규정되어 있으므로, 검사는 그와 같은 불이익을 감수하면 법원의 열람·등사의 결정을 따르지 않아도 위법하지 아니하다.", false, "▸ 제266조의4 제5항은 검사가 그와 같은 불이익을 감수하기만 하면 법원의 결정을 따르지 않을 수도 있다는 의미가 아니다. 검사의 거부행위는 피고인의 열람·등사권을 침해하고, 나아가 피고인의 신속·공정한 재판을 받을 권리 및 변호인의 조력을 받을 권리까지 침해한다. [2009헌마257]", "공판심리"],
["689", "★ 법원의 증거개시에 관한 결정에 대하여는 즉시항고를 할 수 있다.", false, "▸ 법원이 검사에게 수사서류 등의 열람·등사 또는 서면의 교부를 허용할 것을 명한 결정은 판결 전의 소송절차에 관한 결정에 해당하는데, 위 결정에 대하여는 형소법에서 별도로 즉시항고에 관한 규정을 두고 있지 않으므로 제402조에 의한 항고의 방법으로도 불복할 수 없다. [2012모1393]", "공판심리"],
["690", "검사는 피고인 또는 변호인이 공판기일 또는 공판준비절차에서 현장부재·심신상실 또는 심신미약 등 법률상·사실상의 주장을 한 때에는 피고인 또는 변호인에게 그 주장과 관련된 서류 등의 열람·등사 또는 서면의 교부를 요구할 수 있다.", true, "▸ 제266조의11 제1항에 따라 검사는 피고인 또는 변호인이 공판기일 또는 공판준비절차에서 법률상·사실상의 주장을 한 때에는 그 주장과 관련된 서류 등의 열람·등사 또는 서면의 교부를 요구할 수 있다.", "공판심리"],
["691", "제1회 공판기일은 소환장의 송달 후 5일 이상의 유예기간을 두어야 하나, 피고인의 이의가 없는 때에는 유예기간을 두지 아니할 수 있다.", true, "▸ 제1회 공판기일은 소환장의 송달 후 5일 이상의 유예기간을 두어야 한다. 피고인이 이의없는 때에는 그 유예기간을 두지 아니할 수 있다(제269조).", "공판심리"],
["692", "★ 교도소 또는 구치소에 구속된 자에 대한 송달은 그 소장에게 송달하면 구속된 자에게 전달된 여부와 관계없이 효력이 발생한다.", true, "▸ [AI해설] 교도소 또는 구치소에 구속된 자에 대한 송달은 그 소장에게 송달하면 구속된 자에게 전달된 여부와 관계없이 그 효력이 생긴다. [91도3272, 형소법 제65조]", "공판심리"],
["693", "다른 사건으로 신체구속을 당한 자에게는 송달영수인에 관한 규정을 적용하지 않는다.", false, "▸ 제60조 제4항이 규정한 신체구속을 당한 자라 함은 그 사건에서 신체를 구속 당한 자를 가리키는 것이므로, 다른 사건으로 신체구속을 당한 자에게는 그 사건에 관하여 송달받기 위한 신고의무를 면제받을 수 없다. 즉 해당 사건에 관하여 송달영수인에 관한 규정이 적용된다. [76모69]", "공판심리"],
["694", "피고인이 재판권이 미치지 않는 장소에 있는 경우에 공시송달을 할 수 없다.", false, "▸ 피고인이 재판권이 미치지 아니하는 장소에 있는 경우에 다른 방법으로 송달할 수 없는 때에도 공시송달을 할 수 있다(제63조).", "공판심리"],
["695", "★ 법원이 수감 중인 피고인에 대하여 공소장 부본과 피고인소환장 등을 종전 주소지 등으로 송달하거나 공시송달의 방법으로 송달하였다면 이는 위법하다.", true, "▸ [AI해설] 법원이 수감 중인 피고인에 대하여 공소장 부본과 피고인소환장 등을 종전 주소지 등으로 송달하거나 공시송달의 방법으로 송달하였다면 이는 위법하다. [2013도2714]", "공판심리"],
["696", "재판을 받는 자가 구치소에 수용되어 있는 경우에는, 재판을 받는 자가 재판의 내용을 현실적으로 알게 되었는지 여부와 관계없이 재판서 등본이 모사전송의 방법으로 구치소장에게 송부된 때 그 재판이 고지되었다고 보아야 한다.", true, "▸ 재판서 등본을 모사전송의 방법으로 송부하는 것은 재판을 고지하는 '다른 적당한 방법'에 해당한다. 재판을 받는 자가 그 재판의 내용을 알 수 있는 상태에 이른 경우라면 현실적으로 알았는지 여부에 관계없이 그 재판이 고지되었다고 보아야 한다. [2004모208]", "공판심리"],
["697", "최초의 공시송달은 법원게시장에 공시한 날로부터 2주일을 경과하면 그 효력이 생기고, 2회 이후의 공시송달은 5일을 경과하면 그 효력이 있다.", true, "▸ 제64조 제4항에 따라 최초의 공시송달은 2주일, 2회 이후의 공시송달은 5일을 경과하면 효력이 생긴다.", "공판심리"],
["698", "재판장은 피고인의 퇴정을 제지하거나 법정의 질서를 유지하기 위하여 필요한 처분을 할 수 있다.", true, "▸ 제281조 제2항에 따라 재판장은 피고인의 퇴정을 제지하거나 법정의 질서를 유지하기 위하여 필요한 처분을 할 수 있다.", "공판심리"],
["699", "소송에 관한 서류는 공판의 개정 전에는 공익상 필요 기타 상당한 이유가 없으면 공개하지 못한다.", true, "▸ 제47조에 따라 소송에 관한 서류는 공판의 개정 전에는 공익상 필요 기타 상당한 이유가 없으면 공개하지 못한다.", "공판심리"],
["700", "법정의 규모·질서의 유지·심리의 원활한 진행 등을 고려하여 방청을 희망하는 피고인들의 가족·친지 기타 일반 국민에게 미리 방청권을 발행하게 하고 그 소지자에 한하여 방청을 허용하는 등의 방법으로 방청인의 수를 제한하는 조치를 취하는 것이 공개재판주의의 취지에 반하는 것은 아니다.", true, "▸ [AI해설] 방청인의 수를 제한하는 조치를 취하는 것이 공개재판주의의 취지에 반하는 것은 아니다. [90도646]", "공판심리"],
["701", "동일한 피고인에 대하여 2개 이상의 사건이 각각 별도로 공소제기되었을 경우 반드시 병합심리하여 동시에 판결을 선고하여야만 하는 것은 아니다.", true, "▸ [AI해설] 동일한 피고인에 대하여 2개 이상의 사건이 별도로 공소제기된 경우 반드시 병합심리하여 동시에 판결을 선고하여야만 하는 것은 아니다. [83도3013]", "공판심리"],
["702", "검사가 다수인의 집합에 의하여 구성되는 집합범이나 2인 이상이 공동하여 죄를 범하여 공범의 관계에 있는 피고인들에 대하여 여러 개의 사건으로 나누어 공소를 제기한 경우에, 법원이 변론을 병합하지 아니하였다고 하여 형사소송절차에서의 구두변론주의와 직접심리주의에 위반한 것이라고 볼 수 없다.", true, "▸ [AI해설] 공범에 대하여 여러 개의 사건으로 나누어 공소제기한 경우에도, 법원이 변론을 병합하지 않았다고 하여 구두변론주의와 직접심리주의에 위반한 것이라고 볼 수 없다. [90도764]", "공판심리"],
["703", "검사 또는 변호인은 증거조사 종료 후에 순차로 피고인에게 공소사실 및 정상에 관하여 필요한 사항을 신문할 수 있다. 다만, 재판장은 필요하다고 인정하는 때에는 증거조사가 완료되기 전이라도 이를 허가할 수 있다.", true, "▸ 제296조의2 제1항에 따라 검사 또는 변호인은 증거조사 종료 후에 피고인에게 공소사실 및 정상에 관하여 필요한 사항을 신문할 수 있다. 재판장은 필요하다고 인정하는 때에는 증거조사가 완료되기 전이라도 이를 허가할 수 있다.", "공판심리"],
["704", "재판장은 피고인을 신문하는 경우 피고인의 연령·성별·국적 등의 사정을 고려하여 그 심리적 안정의 도모와 원활한 의사소통을 위하여 필요한 경우에는 직권 또는 피고인·법정대리인·검사의 신청에 따라 피고인과 신뢰관계에 있는 자를 동석하게 할 수 있다.", true, "▸ 제276조의2 제1항 제2호에 따라 재판장은 직권 또는 피고인·법정대리인·검사의 신청에 따라 피고인과 신뢰관계에 있는 자를 동석하게 할 수 있다.", "공판심리"],
["705", "★ 최종의견 진술의 기회는 피고인이나 변호인에게 주어지면 되는바, 재판장이 변호인의 최후변론이 끝나자마자 곧바로 선고기일을 지정·고지함으로써 피고인에게 최종의견 진술의 기회를 주지 아니한 채 변론을 종결하고 판결을 선고하였다 하더라도 이는 소송절차의 법령위반에 해당한다고 볼 수는 없다.", false, "▸ 형소법 제303조는 피고인과 변호인 모두에게 최종의견 진술의 기회를 주어야 한다. 피고인이나 변호인에게 최종의견 진술의 기회를 주지 아니한 채 변론을 종결하고 판결을 선고하는 것은 소송절차의 법령위반에 해당한다. [2018도327]", "공판심리"],
["706", "법원이 검사나 피고인에게 주장 및 입증을 위한 충분한 기회를 주었다가 변론을 종결한 이상 다른 특별한 사정이 없는 한 그 후에 이루어진 변론재개신청을 법원이 받아들이지 아니하였다고 하여 이를 위법하다고 할 수는 없다.", true, "▸ 변론종결 후 변론재개신청이 있는 경우에도 종결한 변론을 재개하느냐의 여부는 법원의 재량에 속한다. 주장 및 입증을 위한 충분한 기회를 주었다가 변론을 종결한 이상 그 후 변론재개신청을 받아들이지 않아도 위법하지 않다. [2014도1414]", "공판심리"],
["707", "★ 변론종결 후 선임된 변호인의 변론재개신청을 들어주지 않았다면 이는 심리미진에 해당한다.", false, "▸ 변론종결 후 선임된 변호인의 변론재개신청을 들어주지 아니하였다 하여 심리미진의 위법이 있는 것은 아니다. [86도769]", "공판심리"],
["708", "★ 법원이 적법하게 공판의 심리를 종결하였더라도 피고인이 증인신청을 하면 법원은 공판의 심리를 재개하여 증인신문을 하여야 한다.", false, "▸ 법원이 적법하게 공판의 심리를 종결한 뒤에 이르러 증인신문을 신청하더라도 반드시 공판의 심리를 재개하여 증인신문을 하여야 하는 것이 아니다. [2010도7947]", "공판심리"],
["709", "★ 재판장이 주문을 낭독하여 선고 내용이 외부적으로 표시된 이상 재판서에 기재된 주문과 이유를 잘못 낭독하거나 설명하는 등 실수가 있거나 판결 내용에 잘못이 있음이 발견된 경우와 같이 특별한 사정이 있는 경우에 변경 선고가 허용된다.", true, "▸ 재판장이 일단 주문을 낭독한 이후라도 선고가 종료되기 전까지는 일단 낭독한 주문의 내용을 정정하여 다시 선고할 수 있다. 다만 재판서에 기재된 주문과 이유를 잘못 낭독하거나 판결 내용에 잘못이 있음이 발견된 경우와 같이 특별한 사정이 있는 경우에 변경 선고가 허용된다. [2017도3884]", "공판심리"],
["710", "판결서는 서명날인에 갈음하여 기명날인할 수 없는 재판서이다.", true, "▸ 판결서 기타 대법원규칙이 정하는 재판서를 제외한 재판서에 대하여는 서명날인에 갈음하여 기명날인할 수 있다(제41조 제3항). 기명날인이 불가한 재판서는 판결과 각종 영장(감정유치장 및 감정처분허가장 포함)이다(규칙 제25조의2).", "공판심리"],
["711", "면소의 재판을 할 것이 명백한 사건에 관하여는 공판기일에 피고인의 출석을 요하지 아니한다.", true, "▸ 제277조 제2호에 따라 면소의 재판을 할 것이 명백한 사건에 관하여는 공판기일에 피고인의 출석을 요하지 아니한다.", "공판심리"],
["712", "★ 장기 3년 이하의 징역 또는 금고에 해당하는 사건에서 피고인의 불출석허가신청이 있고 법원이 이를 허가한 사건에는 피고인의 출석을 요하지 않지만, 판결을 선고하는 공판기일에는 출석하여야 한다.", false, "▸ 제277조 제3호에 따라 장기 3년 이하의 징역 또는 금고에 해당하는 사건에서 불출석 허가를 받은 경우에는 판결 선고기일을 포함하여 공판기일에 피고인의 출석을 요하지 않는다.", "공판심리"],
["713", "피고인이 출석하지 아니하면 개정하지 못하는 경우에, 구속된 피고인이 정당한 사유 없이 출석을 거부하고 교도관에 의한 인치가 불가능하거나 현저히 곤란하다고 인정되는 때에는 피고인의 출석 없이 공판절차를 진행할 수 있다.", true, "▸ 제277조의2 제1항에 따라 구속된 피고인이 정당한 사유 없이 출석을 거부하고 교도관에 의한 인치가 불가능하거나 현저히 곤란하다고 인정되는 때에는 피고인의 출석 없이 공판절차를 진행할 수 있다.", "공판심리"],
["714", "★ 제1심 공판절차에서 피고인에 대한 송달불능보고서가 접수된 때부터 6개월이 지나도록 피고인의 소재를 확인할 수 없는 경우에는 대법원규칙으로 정하는 바에 따라 피고인의 진술 없이 재판할 수 있으나, 사형, 무기 또는 장기 10년이 넘는 징역이나 금고에 해당하는 사건의 경우에는 피고인의 진술 없이 재판할 수 없다.", true, "▸ 소송촉진 등에 관한 특례법 제23조에 따라 제1심 공판절차에서 피고인에 대한 송달불능보고서가 접수된 때부터 6개월이 지나도록 소재를 확인할 수 없는 경우 피고인의 진술 없이 재판할 수 있으나, 사형, 무기 또는 장기 10년이 넘는 징역이나 금고에 해당하는 사건에서는 불가하다.", "공판심리"],
["715", "증거신청은 검사가 먼저 이를 한 후 다음에 피고인 또는 변호인이 이를 한다.", true, "▸ 규칙 제133조에 따라 증거신청은 검사가 먼저 이를 한 후 다음에 피고인 또는 변호인이 이를 한다.", "공판심리"],
["716", "검사, 피고인 또는 변호인은 특별한 사정이 없는 한 증거들을 일괄하여 신청하여야 한다.", true, "▸ 규칙 제132조에 따라 검사, 피고인 또는 변호인은 특별한 사정이 없는 한 증거들을 일괄하여 신청하여야 한다.", "공판심리"],
["717", "검사, 피고인 또는 변호인은 증거조사에 관하여 이의신청을 할 수 있고, 법원은 이의신청에 대하여 결정을 하여야 한다.", true, "▸ 제296조에 따라 검사, 피고인 또는 변호인은 증거조사에 관하여 이의신청을 할 수 있고, 법원은 이의신청에 대하여 결정을 하여야 한다.", "공판심리"],
["718", "증거조사에 대한 이의신청은 법령의 위반이 있거나 상당하지 아니함을 이유로 하여 이를 할 수 있다. 그러나 증거신청에 대한 법원의 결정에 대해서는 법령의 위반이 있음을 이유로 하여서만 이의신청을 할 수 있다.", true, "▸ 제296조 제1항의 이의신청(증거조사)은 법령의 위반이 있거나 상당하지 아니함을 이유로 할 수 있다. 다만, 제295조의 규정에 의한 증거결정에 대한 이의신청은 법령의 위반이 있음을 이유로 하여서만 할 수 있다(규칙 제135조의2).", "공판심리"],
["719", "법원은 증거조사에 관한 이의신청이 있을 때마다 즉시 결정하여야 하며, 이 결정에 대해서도 1회에 한하여 다시 이의신청 할 수 있다.", false, "▸ 이의신청에 대한 결정은 이의신청이 있은 후 즉시 하여야 한다(규칙 제138조). 그러나 이의신청에 대한 결정에 의하여 판단이 된 사항에 대하여는 다시 이의신청을 할 수 없다(규칙 제140조).", "공판심리"],
["720", "증거신청의 채택 여부는 법원의 재량으로서 법원이 필요하지 않다고 인정할 때에는 증거를 조사하지 않을 수 있다.", true, "▸ [AI해설] 증거신청의 채택 여부는 법원의 재량으로서 법원이 필요하지 않다고 인정할 때에는 증거를 조사하지 않을 수 있다. [2010도7947]", "공판심리"],
["721", "★ 소재탐지나 구인장 발부가 불가능한 것이 아님에도 불구하고, 불출석 증인에 대하여 소재탐지나 구인장 발부 없이 증인채택 결정을 취소하는 것은 법원의 재량을 벗어나는 것으로서 위법하다.", true, "▸ [AI해설] 불출석 증인에 대해 소재탐지나 구인장 발부가 불가능한 것이 아님에도 불구하고, 소재탐지나 구인장 발부 없이 증인채택 결정을 취소하는 것은 재량을 벗어나 위법하다. [2020도2623]", "공판심리"],
["722", "증거결정에 불복이 있어도 그 결정에 대하여 즉시 이의신청을 할 수 없고, 다만 증거결정에 법령위반이 있는 경우에 한해 이의신청을 하거나 그로 말미암아 사실을 오인하여 판결에 영향을 미친 경우에 상소의 이유로 삼을 수 있다.", true, "▸ [AI해설] 증거결정에 불복이 있어도 즉시 이의신청을 할 수 없고, 법령위반이 있는 경우에 한해 이의신청을 하거나 판결에 영향을 미친 경우 상소의 이유로 삼을 수 있다. [90도646]", "공판심리"],
["723", "법원은 서류 또는 물건이 증거로 제출된 경우에 이에 관한 증거결정을 함에 있어서는 제출한 자로 하여금 그 서류 또는 물건을 상대방에게 제시하게 하여 상대방으로 하여금 그 서류 또는 물건의 증거능력 유무에 관한 의견을 진술하게 하여야 한다. 다만, 간이공판절차에서의 증거능력에 관한 특례에 의하여 증거동의가 있는 것으로 간주되는 경우에는 그러하지 아니하다.", true, "▸ 규칙 제134조 제2항에 따라 증거로 제출된 서류 또는 물건은 상대방에게 제시하여 증거능력 유무에 관한 의견을 진술하게 하여야 한다. 다만, 간이공판절차의 특례에 의하여 증거동의가 있는 것으로 간주되는 경우에는 예외이다.", "공판심리"],
["724", "甲은 점유이탈물횡령죄로 기소되어 법원에서 제1심 재판을 받고 있다. 검사는 법원에 사실조회를 신청하여 위 수표발행전표 등을 확보할 수 있다.", true, "▸ 법원은 직권 또는 검사, 피고인이나 변호인의 신청에 의하여 공무소 또는 공사단체에 조회하여 필요한 사항의 보고 또는 그 보관서류의 송부를 요구할 수 있다(제272조 제1항).", "공판심리"],
["725", "검찰청이 보관하고 있는 불기소처분기록에 포함된 불기소결정서는 변호인의 열람·지정에 의한 공개의 대상이 되지 않는다.", false, "▸ 검찰청이 보관하고 있는 불기소처분기록에 포함된 불기소결정서는 특별한 사정이 없는 한 변호인의 열람·지정에 의한 공개의 대상이 된다. [2012도1284]", "공판심리"],
["726", "검사, 피고인이나 변호인의 신청에 의하여 법원이 공무소 또는 공사단체에 조회를 요구하여 송부 받은 서류는 검사, 피고인 또는 변호인이 공판정에서 개별적으로 지시설명하여 조사하여야 한다.", true, "▸ 제291조 제1항에 따라 법원이 공무소 또는 공사단체에 조회를 요구하여 송부 받은 서류는 공판정에서 개별적으로 지시설명하여 조사하여야 한다.", "공판심리"],
["727", "★ '증거물인 서면'을 조사하기 위해서는 증거서류의 조사방식인 낭독·내용고지 또는 열람의 절차와 증거물의 조사방식인 제시의 절차가 함께 이루어져야 한다.", true, "▸ 본래 증거물이지만 증거서류의 성질도 가지고 있는 '증거물인 서면'을 조사하기 위해서는 증거서류의 조사방식인 낭독·내용고지 또는 열람의 절차와 증거물의 조사방식인 제시의 절차가 함께 이루어져야 한다. [2013도2511, 예: 무고 사건의 고소장]", "공판심리"],
["728", "★ 피고인이나 변호인이 무죄에 관한 자료로 제출한 서증 가운데 유죄임을 뒷받침하는 내용이 있다 하여도 법원은 검사의 원용(동의)이 없는 한 당해 서류의 진정성립 여부 등을 조사하고 아울러 당해 서류에 대한 피고인이나 변호인의 의견과 변명의 기회를 준 다음이 아니면 당해 서증을 유죄인정의 증거로 사용할 수 없다.", true, "▸ 증거공통의 원칙이란 증거의 증명력은 그 제출자나 신청자의 입증취지에 구속되지 않는다는 것이다. 그러나 증거능력이나 조사절차를 불필요하게 할 수 있는 힘은 없으므로, 피고인이나 변호인이 무죄 자료로 제출한 서증을 유죄 증거로 사용하려면 검사의 원용이 있어야 한다. [87도966, 2013도12155]", "공판심리"],
["729", "★ 증거능력이 없어 증거로 채택되지 아니한 증거서류 또는 증거물을 제출받아 일단 제출받은 경우에는 이를 증거신청인에게 반환하여야 한다.", false, "▸ 법원은 증거신청을 기각·각하하거나 증거신청에 대한 결정을 보류하는 경우 증거신청인으로부터 당해 증거서류 또는 증거물을 제출받아서는 아니 된다(규칙 제134조 제4항). 제출받지 않는 것이 원칙이다.", "공판심리"],
["730", "★ 검사가 수사보고서에 첨부하여 제출한 체포 장면이 녹화된 동영상에 대해 증거조사절차 없이 유죄 증거로 채택하는 것은 위법하다.", true, "▸ 녹음·녹화매체 등에 대한 증거조사는 이를 재생하여 청취 또는 시청하는 방법으로 하도록 규정하고 있으므로, 형사소송규칙에서 정한 증거조사절차를 거치지 아니한 채 유죄의 증거로 채택한 것은 잘못이다. [2009도13846]", "공판심리"],
["731", "정당한 사유 없이 소환에 응하지 아니하는 증인에 대하여 법원은 500만 원 이하의 과태료를 부과하여 출석을 간접강제할 수 있지만 직접 구인할 수는 없다.", false, "▸ 법원은 소환에 응하지 아니한 증인에 대하여 소송비용 부담 명령과 500만원 이하의 과태료를 부과할 수 있을 뿐만 아니라(제151조 제1항), 정당한 사유없이 소환에 응하지 아니하는 증인은 구인할 수 있다(제152조).", "공판심리"],
["732", "★ 법원은 감치의 재판을 받은 증인이 감치의 집행 중에 증언을 한 때에는 즉시 감치결정을 취소하고 그 증인을 석방하도록 명하여야 한다.", true, "▸ 제151조 제7항에 따라 법원은 감치의 재판을 받은 증인이 감치의 집행 중에 증언을 한 때에는 즉시 감치결정을 취소하고 그 증인을 석방하도록 명하여야 한다.", "공판심리"],
["733", "증인소환장을 송달받은 乙이 정당한 사유 없이 증인으로 출석하지 아니한 때에는 법원은 결정으로 당해 불출석으로 인한 소송비용을 증인이 부담하도록 명하고 500만 원 이하의 과태료를 부과할 수 있으며, 乙은 이러한 결정에 대해 즉시항고를 할 수 있다.", true, "▸ 소송비용 부담, 과태료와 감치의 결정에 대하여는 즉시항고를 할 수 있다. 다만, 이 경우에는 즉시항고에 집행정지 효력이 인정되지 않는다(제151조 제8항).", "공판심리"],
["734", "증인이 16세 미만일 경우 선서하게 하지 아니하고 신문하여야 한다.", true, "▸ 증인이 16세 미만의 자 또는 선서의 취지를 이해하지 못하는 자에 해당한 때에는 선서하게 하지 아니하고 신문하여야 한다(제159조).", "공판심리"],
["735", "채권자인 甲과 그의 아내 乙은 빚을 갚지 못하고 있는 채무자 丙을 찾아가 함께 심한 폭설을 하였다. 사건현장에 있던 丙의 아들 丁(5세)가 사건을 목격하였고 당시 상황을 이해하고 답변할 수 있다고 하더라도, 丁는 16세 미만의 선서무능력자이므로 그 증언은 증거로 할 수 없다.", false, "▸ 비록 선서무능력자라 하여도 그 증언 내지 진술의 전후 사정으로 보아 의사판단력이 있다고 인정된다면 증언능력이 있다. [84도619]", "공판심리"],
["736", "★ 4세의 선서무능력자가 선서 후 한 증언은 증언능력 유무와 관계없이 증언 자체의 효력이 부정된다.", false, "▸ 선서무능력자에 대하여 선서하게 하고 신문한 경우라 할지라도 그 선서만이 무효가 되고, 그 증언의 효력에 관하여는 영향이 없으며 유효하다. [4290형상23]", "공판심리"],
["737", "甲은 乙에게 술을 훔쳐오라고 하였고, 이에 乙은 편의점에 들어가 양주 1병을 절취하였다. 검사는 공동피고인으로서 乙을 절도죄로, 甲을 절도교사죄로 함께 기소하였다. 乙이 법정에서 甲이 교사하였다고 진술하더라도 증인으로서 진술한 것이 아니면 乙의 법정진술은 증거능력이 없다.", false, "▸ 공범인 공동피고인의 자백은 이에 대한 피고인의 반대신문권이 보장되어 있어 증인으로 신문한 경우와 다를 바 없으므로 독립한 증거능력이 있다. [2006도1944]", "공판심리"],
["738", "★ 피고인 甲은 피고인 乙로부터 뇌물을 수수하였다는 공소사실로, 피고인 乙은 피고인 甲에게 뇌물을 공여하였다는 공소사실로 기소되어 공동피고인으로 재판을 받고 있다. 乙이 피고인신문에서 甲에게 뇌물공여사실을 자백한 진술은 甲의 乙에 대한 반대신문권이 보장되어 있어 甲의 공소사실에 대한 증거로 쓸 수 있지만, 乙이 기억에 반하는 허위의 진술을 하더라도 위증죄가 성립하지 않는다.", true, "▸ 공범인 공동피고인의 자백은 반대신문권이 보장되어 있어 독립한 증거능력이 있다(O). 乙은 피고인 지위에서 신문을 받으므로 선서 없이 신문하고, 따라서 위증죄가 성립하지 않는다(O).", "공판심리"],
["739", "★ 甲과 乙은 모두 체포되어 강도치상죄의 공동정범으로 기소되어 재판을 받고 있다. 乙은 법정에서 甲과 모의한 사실이 있다고 진술하였다. 이와 관련하여 변론의 분리 없이도 乙의 甲의 범죄사실에 대한 증인적격이 인정된다.", false, "▸ 공범인 공동피고인은 당해 소송절차에서는 피고인의 지위에 있으므로 다른 공동피고인의 공소사실에 관하여 증인이 될 수 없다. 소송절차가 분리되어 피고인의 지위에서 벗어나게 되면 다른 공동피고인에 대한 공소사실에 관하여 증인이 될 수 있다. [2012도6848, 2008도3300]", "공판심리"],
["740", "★ 피고인과 별개의 범죄사실로 기소되어 병합심리중인 공동피고인은 피고인의 범죄사실에 관하여는 증인의 지위에 있다 할 것이므로 선서없이 한 공동피고인의 법정진술은 피고인의 범죄사실을 인정하는 증거로 할 수 없다.", true, "▸ 피고인과 별개의 범죄사실로 기소되어 병합심리중인 공동피고인(공범 아닌 공동피고인)은 다른 피고인의 범죄사실에 관하여 증인의 지위에 있으므로, 선서없이 한 법정진술은 다른 피고인의 범죄사실을 인정하는 증거로 할 수 없다. [82도1000]", "공판심리"],
["741", "공동피고인인 절도범 甲과 장물범 乙의 경우, 乙의 피고인신문 과정에서 '甲으로부터 장물인 줄 알고 금반지를 취득하였다'는 답변은 甲에 대한 유죄의 증거가 된다.", false, "▸ 절도범과 장물범은 공범 아닌 공동피고인의 관계이므로, 乙이 피고인 지위에서 한 법정진술은 甲에 대하여 증거능력이 없다. [2005도7601]", "공판심리"],
["742", "위 사례에서 乙에 대한 검사 작성의 피의자신문조서에 대하여 甲은 부동의하고 乙은 진정성립 및 임의성을 인정할 경우, 乙에 대한 검사 작성의 피의자신문조서는 甲에 대한 유죄의 증거가 된다.", false, "▸ 공범 아닌 공동피고인이므로 제312조 제4항이 적용된다. 피고인의 지위에서 진정성립 및 임의성을 인정하였다고 하더라도 위 피의자신문조서는 甲에 대하여 증거능력이 없다. [2005도7601]", "공판심리"],
["743", "甲과 乙이 기소되어 병합심리되는데, 甲이 피고인신문절차에서 '乙이 나를 먼저 때렸다'고 진술한 경우, 이 진술은 乙의 폭행죄에 대하여 증거능력이 있다.", false, "▸ 甲과 乙은 쌍방 폭행으로 기소된 공범 아닌 공동피고인이다. 따라서 甲이 피고인의 지위에서 한 법정진술은 乙에 대하여 증거능력이 없다.", "공판심리"],
["744", "甲과 乙이 쌍방 폭행사건으로 기소되어 공동피고인으로 재판을 받고 있는 경우, 분리 전 甲과 乙은 공범 아닌 공동피고인의 관계에 있으므로 甲은 乙의 피고사건에 관하여 증인적격이 없고, 따라서 甲이 변론이 분리되지 않은 상태에서 증인으로 진술하더라도 甲은 위증죄의 주체가 될 수 없다.", false, "▸ 공범 아닌 공동피고인이므로 변론 분리와 상관 없이 증인적격이 인정된다. 따라서 증인으로서 허위진술을 하면 위증죄의 주체가 될 수 있다.", "공판심리"],
["745", "검사는 특수(합동)절도를 범한 甲과 乙에 대하여 공소를 제기하였다. 그러면서 甲에 대하여는 甲이 단독으로 범한 절도도 경합범으로 함께 기소하였다. 甲의 단독 절도 범죄사실과 관련하여 乙이 피고인신문 과정에서 '甲이 절도를 하는 것을 보았습니다'라고 진술한 경우, 이 진술은 甲의 단독 절도 범죄사실에 대한 증거능력이 있다.", false, "▸ 甲의 단독 절도 범죄사실에 乙은 목격자에 불과하여 공범 관계에 있지 않으므로(공범 아닌 공동피고인), 乙의 피고인 지위에서의 법정진술은 甲에 대하여 증거로 할 수 없다.", "공판심리"],
["746", "甲이 乙을 조수석에 태우고 자동차를 운전하다가 부주의로 사람을 치고 나서 乙을 달래어 乙이 자신이 운전하여 사고를 낸 것으로 경찰에 허위로 자수하였다. 甲과 乙이 해당 범죄로 기소된 상황에서, 乙은 甲과 법률상 혼인하였다가 이혼하였더라도 증언거부권이 있다.", true, "▸ 제148조의 '자기나 친족 관계에 있었던 자'는 과거에 친족이었던 자도 포함하므로, 이혼한 전 배우자의 형사사건에서도 증언을 거부할 수 있다.", "공판심리"],
["747", "누구든지 자기나 친족 관계에 있었던 자 또는 그 법정대리인, 후견감독인에 해당하는 자가 형사소추 또는 공소제기를 당하거나 유죄판결을 받을 사실이 드러날 염려가 있는 증언을 거부할 수 있다.", true, "▸ 제148조에 따라 위 조건에 해당하는 경우 증언을 거부할 수 있다. '친족 관계에 있었던 자'도 포함된다.", "공판심리"],
["748", "법관, 의사, 변호사 등 비밀유지의무가 있는 자는 그 직무에 관하여 알게 된 사실로서 타인의 비밀에 관한 것에 대하여는 그 승낙이 없거나 중대한 공익상 필요가 없는 한 증언을 거부할 수 있다.", true, "▸ 제149조에 따라 변호사, 의사 등 비밀유지의무자는 직무상 알게 된 사실로서 타인의 비밀에 관한 것에 대하여, 그 승낙이 없거나 중대한 공익상 필요가 없는 한 증언을 거부할 수 있다.", "공판심리"],
["749", "★ 증언거부사유가 있음에도 형사사건의 증인이 증언거부권을 고지받지 못함으로 인하여 그 증언거부권을 행사하는 데 사실상 장애가 초래되었다고 볼 수 있는 경우에는 위증죄가 성립하지 않는다.", true, "▸ 증언거부사유가 있음에도 증인이 증언거부권을 고지받지 못함으로 인하여 그 증언거부권을 행사하는 데 사실상 장애가 초래되었다고 볼 수 있는 경우에는 위증죄의 성립을 부정하여야 한다. [2008도942]", "공판심리"],
["750", "甲과 乙이 쌍방 폭행사건으로 기소되어 공동피고인으로 재판을 받으면서 공판기일에 甲은 乙을 때린 적이 없다고 주장하고 있는 상황에서, 법원은 甲을 증인으로 채택하고 증인신문을 하였다. 이때 재판장이 甲에게 증언거부권을 고지하지 아니하였다면, 재판장으로부터 증언거부권을 고지받지 않고 한 甲의 증언은 위증죄가 성립하지 않는다.", true, "▸ 증언거부사유가 있음에도 증언거부권을 고지받지 못함으로 인하여 그 증언거부권을 행사하는 데 사실상 장애가 초래되었다고 볼 수 있는 경우에는 위증죄의 성립을 부정하여야 한다. [2008도942]", "공판심리"],
["751", "★ 도상해 범행을 일관되게 부인하였으나 유죄판결이 확정된 자는, 별건으로 기소된 공범의 형사사건에서 자신의 범행사실을 사실대로 진술할 기대가능성이 없으므로, 자신의 범행을 부인하는 허위의 증언을 하였다고 하더라도 위증죄가 성립하지 않는다.", false, "▸ 이미 유죄의 확정판결을 받은 경우에는 일사부재리의 원칙에 의해 다시 처벌되지 아니하므로, 피고인은 공범의 형사사건에서 그 범행에 대한 증언을 거부할 수 없다. 따라서 기대가능성이 없다고 할 수 없어 위증죄가 성립할 수 있다. [2005도10101]", "공판심리"],
["752", "★ 자신에 대한 유죄판결이 확정된 증인이 공범에 대한 형사사건에서 증언할 당시 앞으로 재심을 청구할 예정이라면 증인에게 「형사소송법」제148조에 의한 증언거부권이 인정된다.", false, "▸ 자신에 대한 유죄판결이 확정된 증인이 공범에 대한 피고사건에서 증언할 당시 앞으로 재심을 청구할 예정이라고 하여도, 이를 이유로 제148조에 의한 증언거부권이 인정되지는 않는다. [2011도11994]", "공판심리"],
["753", "★ 반대신문권의 보장은 형식적·절차적인 것이 아니라 실질적·효과적인 것이어야 하므로, 피고인에게 불리한 증거인 증인이 주신문의 경우와 달리 반대신문에 대하여는 답변을 하지 아니하는 등 진술 내용의 모순이나 불합리를 그 증인신문 과정에서 드러내는 것이 사실상 곤란하였고, 그것이 피고인에게 책임 있는 사유에 기인한 것이 아닌 경우라면, 특별한 사정이 존재하지 아니하는 이상 그 증인의 법정진술은 위법한 증거로서 증거능력을 인정하기 어렵다.", true, "▸ 반대신문권의 보장은 실질적·효과적이어야 하며, 실질적 반대신문기회가 부여되지 아니한 채 이루어진 증인의 법정진술은 위법한 증거로서 증거능력을 인정하기 어렵다. 다만, 피고인의 책문권 포기의 의사는 '명시적'인 것이어야 한다. [2016도17054]", "공판심리"],
["754", "★ 형사소송법 제297조의 규정에 따라 재판장은 증인이 피고인의 면전에서 충분한 진술을 할 수 없다고 인정한 때에는 피고인을 퇴정하게 함으로써 피고인의 직접적인 증인 대면을 제한하고 피고인의 반대신문권을 배제할 수 있다.", false, "▸ 제297조의 규정에 따라 피고인을 퇴정하게 하고 증인신문을 진행함으로써 피고인의 직접적인 증인 대면을 제한할 수 있지만, 이러한 경우에도 피고인의 반대신문권을 배제하는 것은 허용되지 않는다. [2011도15608]", "공판심리"],
["755", "★ 변호인이 없는 피고인을 퇴정케 하고 증인신문을 한 다음 피고인에게 실질적인 반대신문의 기회를 부여하지 않았다면, 다음 공판기일에서 재판장이 증인신문결과를 공판조서에 의하여 고지하여 피고인이 '변경할 점과 이의할 점이 없다'고 진술하더라도 실질적인 반대신문의 기회를 부여받지 못한 하자는 치유되지 않는다.", false, "▸ 다음 공판기일에서 재판장이 증인신문 결과 등을 공판조서에 의하여 고지하였는데 피고인이 '변경할 점과 이의할 점이 없다'고 진술하여 책문권 포기 의사를 명시함으로써 실질적인 반대신문의 기회를 부여받지 못한 하자가 치유되었다. [2009도9344]", "공판심리"],
["756", "★ 「형사소송법」제165조의2 비디오 등 중계장치 등에 의한 증인신문에 있어서 「형사소송규칙」에서 피고인과 증인 사이의 차폐시설 설치만을 규정하고 있으므로 검사, 변호인, 방청인과 증인 사이에 차폐시설 등을 설치하는 방식으로 증인신문을 할 수 없다.", false, "▸ 제165조의2 제3호도 대상을 '피고인 등'이라고 규정하고 있으므로, 법원은 피고인뿐만 아니라 검사, 변호인, 방청인 등에 대하여도 차폐시설 등을 설치하는 방식으로 증인신문을 할 수 있다. [2014도18006]", "공판심리"],
["757", "소송관계인의 참여없이 법정외에서 시행한 증인신문조서에 대하여 공판기일에서 증거조사 자체를 시행하지 아니하였다면 증인신문조서는 증거능력이 있을 수 없다.", true, "▸ 소송관계인의 참여 없이 법정외에서 시행한 증인신문조서에 대하여 공판기일에서 증거조사 자체를 시행하지 아니하였다면 증거능력이 없다.", "공판심리"],
["758", "★ 법정 외에서 증인신문을 실시함에 있어서 피고인에 대하여 통지하지 아니하여 참여기회를 주지 않았다면, 그 후 속개 공판기일에서 피고인과 변호인이 그 증인신문조사에 대하여 별 의견이 없다고 진술하였더라도 그 증인신문조사의 하자는 치유되지 않는다.", false, "▸ 법정외에서 증인신문을 실시하면서 피고인에 대하여 통지하지 아니하여 참여기회를 주지 않은 잘못이 있다고 하더라도, 그 후 속개 공판기일에서 피고인과 변호인이 그 증인신문조사에 대하여 별 의견이 없다고 진술하였다면 그 잘못은 책문권의 포기로 치유된다.", "공판심리"],
["759", "법원이 피고인에게 증인신문의 시일과 장소를 미리 통지함이 없이 증인신문을 시행하였음은 위법하나, 그 후 증인신문결과를 증인신문조서에 의하여 소송관계인에게 고지하였고 피고인이나 변호인이 이의를 하지 않았다면 위의 하자는 책문권의 포기로 치유된다.", true, "▸ [AI해설] 증인신문 시일과 장소를 미리 통지하지 않은 위법이 있더라도, 증인신문결과를 고지하고 피고인이나 변호인이 이의를 하지 않았다면 책문권의 포기로 치유된다. [73도2967]", "공판심리"],
["760", "피고인의 참여신청에도 불구하고 그의 참여 없이 실시된 증인신문은 변호인이 참여하였다고 하더라도 위법하다.", true, "▸ 검사, 피고인 또는 변호인은 증인신문에 참여할 수 있다(제163조 제1항). 피고인의 참여신청에도 불구하고 참여 없이 실시된 증인신문은 변호인이 참여하였다고 하더라도 위법하다. [68도1481]", "공판심리"],
["761", "★ 공판기일에 증인은 출석하였으나 피고인이 정당한 사유 없이 출석하지 아니하여 형소법 제276조의 규정에 의하여 공판기일을 연기할 수밖에 없는 경우, 법원이 이미 출석하여 있는 증인에 대하여 공판기일 외의 신문으로서 증인신문을 하고 다음 공판기일에 그 증인신문조서에 대한 서증조사를 하는 것은 증거조사절차로서 위법하다.", false, "▸ 이미 출석하여 있는 증인에 대하여 공판기일 외의 신문으로서 증인신문을 하고 다음 공판기일에 그 증인신문조서에 대한 서증조사를 하는 것은 증거조사절차로서 적법하다. [2000도...]", "공판심리"],
["762", "법원은 증인이 멀리 떨어진 곳 또는 교통이 불편한 곳에 살고 있거나 건강상태 등 그 밖의 사정으로 말미암아 법정에 직접 출석하기 어렵다고 인정하는 때에는 검사와 피고인 또는 변호인의 의견을 들어 비디오 등 중계장치에 의한 중계시설을 통하여 신문할 수 있다.", true, "▸ 제165조의2 제2항에 따라 법원은 증인이 법정에 직접 출석하기 어렵다고 인정하는 때에는 비디오 등 중계장치에 의한 중계시설을 통하여 신문할 수 있다.", "공판심리"],
["763", "외국인이라도 국어에 통하는 자인 경우에는 통역하게 할 필요가 없으나 대한민국 국민이라도 국어에 통하지 아니하면 통역하게 하여야 한다.", true, "▸ [AI해설] 외국인이라도 국어에 통하면 통역 불요, 대한민국 국민이라도 국어에 통하지 않으면 통역하여야 한다. [2007도9327]", "공판심리"],
["764", "법원은 13세 미만의 피해자를 증인으로 신문하는 경우, 재판에 지장을 초래할 우려가 있는 등 부득이한 경우가 아닌 한 피해자와 신뢰관계에 있는 자를 동석하게 하여야 한다.", true, "▸ 법원은 범죄로 인한 피해자가 13세 미만이거나 신체적 또는 정신적 장애로 사물을 변별하거나 의사를 결정할 능력이 미약한 경우에 재판에 지장을 초래할 우려가 있는 등 부득이한 경우가 아닌 한 피해자와 신뢰관계에 있는 자를 동석하게 하여야 한다(제163조의2 제2항).", "공판심리"],
["765", "법원은 증인의 연령, 직업, 건강상태 기타의 사정을 고려하여 검사, 피고인 또는 변호인의 의견을 묻고 법정 외에 소환하거나 현재지에서 신문할 수 있다.", true, "▸ 제165조에 따라 법원은 증인의 연령, 직업, 건강상태 기타의 사정을 고려하여 법정 외에 소환하거나 현재지에서 신문할 수 있다.", "공판심리"],
["766", "증인신문은 각 증인에 대하여 신문하여야 하고, 신문하지 아니한 증인이 재정한 때에는 퇴정을 명하여야 하지만, 필요한 때에는 증인과 다른 증인 또는 피고인과 대질하게 할 수 있다.", true, "▸ 증인신문은 각 증인에 대하여 개별로 신문하여야 하고, 미신문 증인은 퇴정하여야 하나 필요한 때에는 증인과 다른 증인 또는 피고인과 대질하게 할 수 있다.", "공판심리"],
["767", "주신문에서는 유도신문이 원칙적으로 허용되나 반대신문에서는 유도신문이 허용되지 않는다.", false, "▸ 주신문에서는 원칙적으로 유도신문이 허용되지 않고, 반대신문에서는 필요한 때에는 유도신문을 할 수 있다(규칙 제75조 제2항, 제76조 제2항).", "공판심리"],
["768", "★ 공무원 甲에 대한 허위공문서작성 및 동행사 사건에서, 증인 乙에 대한 증인신문 당시 검사의 주신문에 대하여 乙이 적의 또는 반감을 보이지 않았음에도 검사가 유도신문을 한 경우, 甲이 그 다음 공판기일에 위 증인신문조서에 대해 '변경할 점과 이의할 점이 없다'고 진술하였다면 주신문의 하자가 치유된다.", true, "▸ 피고인이 책문권 포기 의사를 명시함으로써 유도신문에 의하여 이루어진 주신문의 하자가 치유되었다. [2012도2937]", "공판심리"],
["769", "반대신문은 주신문에 나타난 사항과 이에 관련된 사항에 관하여 하며, 이 경우 필요할 때에는 유도신문을 할 수 있다.", true, "▸ 반대신문은 주신문에 나타난 사항과 이에 관련된 사항에 관하여 한다(규칙 제76조 제1항). 반대신문에 있어서 필요할 때에는 유도신문을 할 수 있다(동조 제2항).", "공판심리"],
["770", "★ 반대신문의 기회에 주신문에 나타나지 아니한 새로운 사항에 관하여 신문하고자 할 때에는 재판장의 허가를 받아야 한다.", true, "▸ 반대신문의 기회에 주신문에 나타나지 아니한 새로운 사항에 관하여 신문하고자 할 때에는 재판장의 허가를 받아야 하고(규칙 제76조 제4항), 그 사항에 관하여는 주신문으로 본다(동조 제5항).", "공판심리"],
["771", "★ 甲과 乙과 丙이 공모하여 피해자로부터 금품을 갈취한 공소사실로 기소된 경우, 甲이 사법경찰관이 작성한 乙에 대한 피의자신문조서에 대하여 증거로 함에 동의하지 않은 경우라도 乙이 법정에서 경찰 수사 도중 위 피의자신문조서에 기재된 것과 같은 내용으로 진술하였다는 취지로 증언하였다면 이러한 증언은 甲에 대한 유죄인정의 증거로 사용할 수 있다.", false, "▸ 이러한 증언은 원진술자인 공동피고인이 그 자신에 대한 경찰 작성의 피의자신문조서의 진정성립을 인정하는 취지에 불과하여 조서와 분리하여 독자적인 증거가치를 인정할 것이 아니므로, 조서의 증거능력이 부정되는 이상 위와 같은 증언 역시 유죄 인정의 증거로 쓸 수 없다. [2020도15669]", "공판심리"],
["772", "검사는 범죄로 인한 피해자 또는 그 법정대리인(피해자가 사망한 경우에는 그 배우자·직계친족·형제자매를 포함한다)의 신청이 있는 때에는 당해 사건의 공소제기 여부, 공판의 일시·장소, 재판결과, 피의자·피고인의 구속·석방 등 구금에 관한 사실을 신속하게 통지하여야 한다.", true, "▸ 제259조의2에 따라 검사는 피해자 또는 그 법정대리인의 신청이 있는 때에는 당해 사건의 공소제기 여부 등을 신속하게 통지하여야 한다.", "공판심리"],
["773", "★ 甲과 乙은 서로 짜고 여러 사람들에게 丁을 모욕하는 말을 떠들고 다녔다. 丁은 甲과 乙을 모욕의 범죄사실로 고소하였다. 甲과 乙의 모욕죄에 대한 공판심리 중 피해자인 丁은 丙을 증인으로 신문해 줄 것을 수소법원에 신청할 수 있다.", false, "▸ 검사, 피고인 또는 변호인은 서류나 물건을 증거로 제출하거나 증인·감정인 등의 신문을 신청할 수 있다(제294조 제1항). 피해자는 재판절차진술권만 있고 증인신청권은 없다.", "공판심리"],
["774", "법원은 범죄로 인한 피해자 또는 그 법정대리인의 신청이 있는 때에는 피해자 등이 공판절차에서 충분히 진술하여 다시 진술할 필요가 없다고 인정되거나 공판절차가 현저히 지연될 우려가 있는 경우를 제외하고는 피해자 등을 증인으로 신문하여야 한다.", true, "▸ 제294조의2 제1항에 따라 법원은 피해자 또는 그 법정대리인의 신청이 있는 때에는, 예외사유에 해당하지 않는 한 피해자 등을 증인으로 신문하여야 한다.", "공판심리"],
["775", "제1심 법원에서는 甲에게 乙에 대한 살인죄(기수)의 유죄를 인정하였다. 乙의 부(父)는 신청에 의하여 공판정에 증인으로 출석하여 甲의 처벌에 관한 의견까지 진술할 수 있다.", true, "▸ 법원은 피해자등을 신문하는 경우 피해의 정도 및 결과, 피고인의 처벌에 관한 의견, 그 밖에 당해 사건에 관한 의견을 진술할 기회를 주어야 한다(제294조의2 제2항). 피해자가 사망한 경우 직계친족에게 진술권이 있다.", "공판심리"],
["776", "★ 법원은 동일한 범죄사실에 대하여 피해자 진술신청을 한 자가 수인인 경우에는 신청한 모든 피해자를 증인으로 신문하여야 한다.", false, "▸ 법원은 동일한 범죄사실에서 제294조의2의 규정에 의한 신청인이 여러 명인 경우에는 진술할 자의 수를 제한할 수 있다(동조 제3항).", "공판심리"],
["777", "소송계속 중인 사건의 피해자는 소송기록의 열람 또는 등사를 재판장에게 신청할 수 있다.", true, "▸ 제294조의4 제1항에 따라 소송계속 중인 사건의 피해자(피해자가 사망하거나 심신에 중대한 장애가 있는 경우에는 그 배우자·직계친족·형제자매 포함), 피해자 법정대리인 또는 위임받은 변호사는 소송기록의 열람 또는 등사를 재판장에게 신청할 수 있다.", "공판심리"],
["778", "고소 또는 고발에 의하여 공소를 제기한 사건에 관하여 피고인이 무죄 또는 면소의 판결을 받은 경우에 고소인 또는 고발인에게 고의 또는 중대한 과실이 있는 때에는 그 자에게 소송비용의 전부 또는 일부를 부담하게 할 수 있다.", true, "▸ 제188조에 따라 고소 또는 고발에 의해 공소제기된 사건에서 피고인이 무죄 또는 면소 판결을 받은 경우 고소인 또는 고발인에게 고의 또는 중대한 과실이 있는 때에는 소송비용의 전부 또는 일부를 부담하게 할 수 있다.", "공판심리"],
["779", "피고인이 공판정에서 공소사실에 대하여 자백한 때에는 법원은 그 공소사실에 한하여 간이공판절차에 의하여 심판할 것을 결정할 수 있다.", true, "▸ 제286조의2에 따라 피고인이 공판정에서 공소사실에 대하여 자백한 때에는 법원은 그 공소사실에 한하여 간이공판절차에 의하여 심판할 것을 결정할 수 있다. 간이공판절차는 제1심만 가능하다.", "공판심리"],
["780", "피고인이 공판준비절차에서 공소사실에 대하여 자백한 때에도 법원은 그 공소사실에 한하여 간이공판절차에 의하여 심판할 것을 결정할 수 있다.", false, "▸ '공판정'에서의 자백에 한정되므로 공판준비절차에서 자백한 때에는 간이공판절차에 의하여 심판할 수 없다(제286조의2 참조).", "공판심리"],
["781", "피고인이 공판정에서 공소사실을 다투면서 간이공판절차에 의하여 심판할 것을 신청하는 경우, 법원은 검사의 의견을 들어 간이공판절차에 의하여 심판할 수 있다.", false, "▸ 피고인이 공판정에서 공소사실을 다투는 경우에는 자백한 때에 해당하지 않으므로 간이공판절차로 진행할 수 없다(제286조의2 참조).", "공판심리"],
["782", "★ 피고인의 진술이 자백이 되려면 공판정에서 공소장 기재사실을 인정하고 나아가 위법성이나 책임의 조각사유가 되는 사실을 진술하지 않는 것으로 충분하지 않고, 명시적으로 유죄를 자인하는 진술까지 하여야 한다.", false, "▸ 간이공판절차의 결정의 요건인 자백이라 함은 공소장 기재사실을 인정하고 나아가 위법성이나 책임조각사유가 되는 사실을 진술하지 아니하는 것으로 충분하고, 명시적으로 유죄를 자인하는 진술이 있어야 하는 것은 아니다. [87도1269]", "공판심리"],
["783", "★ 피고인이 제1회 공판기일에서 공소사실에 대하여 검사가 신문을 할 때 공소사실이 모두 사실과 다름없다고 진술한 경우, 이후 변호인이 신문을 할 때에는 범의나 공소사실을 부인하더라도 그 공소사실은 간이공판절차에 의하여 심판할 수 있다.", false, "▸ 피고인이 검사가 신문을 할 때에는 공소사실이 모두 사실과 다름없다고 진술하였으나 변호인이 신문을 할 때에는 범의나 공소사실을 부인하였다면 그 공소사실은 간이공판절차에 의하여 심판할 대상이 아니다. [97도3421]", "공판심리"],
["784", "★ 피고인이 법정에서 공소사실은 모두 사실과 다름없다고 하면서 술에 만취되어 기억이 없다는 취지로 진술한 경우, 법원은 간이공판절차 개시결정을 할 수 있다.", false, "▸ 피고인이 술에 만취되어 교통사고 사실을 몰랐다고 범의를 부인함과 동시에 그 범행 당시 심신상실의 상태에 있었다는 주장은, 간이공판절차에 의하여 심판할 대상에 해당하지 아니한다. [2004도2116]", "공판심리"],
["785", "피고인은 간이공판절차 개시결정에 대하여 항고할 수 없다.", true, "▸ 간이공판절차 결정은 판결 전의 소송절차에 관한 결정으로 특히 즉시항고할 수 있다는 규정이 없으므로 항고할 수 없다(제403조 제1항 참조).", "공판심리"],
["786", "간이공판절차에서는 공판조서의 일부인 증거목록에 증거방법을 표시하고 증거조사를 '증거조사함'이라고 표시하는 방법으로 하였더라도 위법하지 아니하다.", true, "▸ [AI해설] 간이공판절차에서 공판조서의 증거목록에 증거방법을 표시하고 증거조사를 '증거조사함'이라고 표시하는 방법은 적법하다. [80도333]", "공판심리"],
["787", "간이공판절차에 있어서는 교호신문의 방식에 의하지 않고 법원이 상당하다고 인정하는 방법으로 증인신문을 할 수 있다.", true, "▸ 제286조의2의 결정이 있는 사건에 대하여는 제161조의2(증인신문의 방식), 제290조 내지 제293조, 제297조의 규정을 적용하지 아니하며 법원이 상당하다고 인정하는 방법으로 증거조사를 할 수 있다(제297조의2).", "공판심리"],
["788", "★ 간이공판절차에서 법원은 증거조사결과에 대하여 반드시 피고인의 의견을 물어야 한다.", false, "▸ 제297조의2에 따라 제293조(증거조사 결과와 피고인의 의견)를 적용하지 않으므로, 간이공판절차에서 법원은 반드시 증거조사결과에 대하여 피고인의 의견을 물어야 하는 것은 아니다.", "공판심리"],
["789", "★ 법원이 절도 공소사실에 대하여 간이공판절차에 의하여 심판할 것을 결정하였다면, 사법경찰관 작성의 참고인 진술조서는 피고인이 증거로 함에 동의한 것으로 간주되므로 피고인이 이를 증거로 함에 이의를 제기하더라도 피고인에 대한 유죄의 증거로 쓸 수 있다.", false, "▸ 제318조의3에 따라 간이공판절차에서는 증거동의가 간주되지만, 검사, 피고인 또는 변호인이 증거로 함에 이의가 있는 때에는 그러하지 아니하다. 이의를 제기하면 증거동의 간주 효력이 부정된다.", "공판심리"],
["790", "★ 간이공판절차에서도 전문법칙과는 달리, 자백의 보강법칙은 적용된다.", true, "▸ 간이공판절차에서는 '전문법칙'에 의하여 증거능력이 없는 증거도 증거동의가 간주된다(제318조의3). 그러나 자유심증주의, 자백보강법칙, 자백배제법칙, 위법수집증거배제법칙은 간이공판절차에서도 그대로 적용된다.", "공판심리"],
["791", "★ 간이공판절차에서는 위법수집증거라도 증거동의에 의하여 증거능력이 인정된다.", false, "▸ 간이공판절차에서 위법수집증거배제법칙은 그대로 적용된다. 위법수집증거는 증거동의가 간주되더라도 증거능력이 인정되지 않는다.", "공판심리"],
["792", "법원이 간이공판절차의 개시결정을 할 때에는 검사의 의견을 들을 필요가 없으나, 그 결정을 취소할 때에는 검사의 의견을 들어야 한다.", true, "▸ 법원은 피고인의 자백이 신빙할 수 없다고 인정되거나 간이공판절차로 심판하는 것이 현저히 부당하다고 인정할 때에는 검사의 의견을 들어 그 결정을 취소하여야 한다(제286조의3). 개시결정 시에는 검사 의견 청취 의무 없다.", "공판심리"],
["793", "★ 간이공판절차결정이 취소된 때에는 검사, 피고인 또는 변호인의 이의가 없는 경우에도 법원은 공판절차를 갱신하여야 한다.", false, "▸ 간이공판절차결정이 취소된 때에는 공판절차를 갱신하여야 한다. 단, 검사, 피고인 또는 변호인이 이의가 없는 때에는 그러하지 아니하다(제301조의2).", "공판심리"],
["794", "★ 甲이 제1심 법원에서 무고죄 공소사실을 자백하여 간이공판절차로 진행된 경우, 甲이 항소심에서 범행을 부인하면, 간이공판절차의 효력이 상실되므로 다시 증거조사를 하여야 한다.", false, "▸ 제1심에서 증거로 할 수 있었던 증거는 항소법원에서도 증거로 할 수 있으므로, 항소심에서 범행을 부인하더라도 제1심에서 이미 증거능력이 있었던 증거는 항소심에서도 그대로 유지되어 심판의 기초가 될 수 있고 다시 증거조사를 할 필요가 없다. [97도3421]", "공판심리"],
["795", "간이공판절차의 요건이 갖추어지지 않았음에도 불구하고 제1심법원이 간이공판절차에 의하여 심판한 경우는 제1심판결에 대한 항소이유로 된다.", true, "▸ [AI해설] 간이공판절차의 요건이 갖추어지지 않았음에도 간이공판절차에 의하여 심판한 경우 판결에 영향을 미친 법률 위반의 위법이 있어 항소이유가 된다. [95도1859]", "공판심리"],
["796", "★ 법원은 국민참여재판 대상사건에 대하여 반드시 피고인에게 국민참여재판을 원하는지 여부를 확인하여야 한다.", true, "▸ 국민의 형사재판 참여에 관한 법률 제8조 제1항에 따라 법원은 국민참여재판 대상사건에 대하여 반드시 피고인에게 국민참여재판을 원하는지 여부를 확인하여야 한다.", "공판심리"],
["797", "★ 공소장 부본을 송달받은 날부터 7일 이내에 의사확인서를 제출하지 아니한 피고인도 제1회 공판기일이 열리기 전까지는 국민참여재판 신청을 할 수 있고, 법원은 그 의사를 확인하여 국민참여재판으로 진행할 수 있다.", true, "▸ [AI해설] 의사확인서를 7일 이내에 제출하지 않았더라도 제1회 공판기일 전까지는 국민참여재판을 신청할 수 있다. [2009모1032]", "공판심리"],
["798", "★ 제1심 법원이 피고인의 의사에 따라 국민참여재판으로 진행함에 있어 별도의 국민참여재판 개시결정을 할 필요는 없으나 그에 관한 이의가 있어 국민참여재판으로 진행하기로 결정한 경우, 검사는 그 결정에 대하여 즉시항고를 할 수 있다.", false, "▸ 제1심 법원이 국민참여재판으로 진행하기로 하는 결정은 판결 전의 소송절차에 관한 결정에 해당하며, 그에 대하여 특별히 즉시항고를 허용하는 규정이 없으므로 항고할 수 없다. [2009모1032]", "공판심리"],
["799", "국민참여재판으로 진행하는 것은 상당하지 않다는 검사의 이의가 있어 공판준비기일에서 피고인과 검사의 의견을 다시 들은 후 국민참여재판으로 진행하기로 결정하였는데, 이에 대해 검사가 항고한 경우, 법원은 항고기각결정을 해야 한다.", true, "▸ 국민참여재판 개시결정에 대하여는 즉시항고를 허용하는 규정이 없으므로 항고할 수 없고, 항고를 제기하였다면 법원은 항고기각결정을 해야 한다. [2009모1032]", "공판심리"],
["800", "★ 법원은 공범관계에 있는 피고인들 중 일부가 국민참여재판을 원하지 않아 국민참여재판을 진행하는 데 어려움이 있다고 판단한 경우 국민참여재판을 하지 않는 결정을 할 수 있다.", true, "▸ 국참법 제9조 제1항 제2호에 따라 법원은 공범 관계에 있는 피고인들 중 일부가 국민참여재판을 원하지 않아 국민참여재판을 진행하는 데 어려움이 있다고 판단한 경우 배제결정을 할 수 있다.", "공판심리"],
["801", "★ 제1심 법원이 피고인이 국민참여재판을 원하는지에 대한 의사확인 절차를 거치지 아니하고 통상의 공판절차로 재판을 진행한 경우, 제1심의 공판절차는 위법하고 항소심에서도 그 하자의 치유가 인정될 수 없다.", false, "▸ 피고인이 항소심에서 국민참여재판을 원하지 아니한다고 하면서 위와 같은 제1심의 절차적 위법을 문제삼지 아니할 의사를 명백히 표시하는 경우에는 그 하자가 치유되어 제1심 공판절차는 전체로서 적법하게 된다. [2012도13896]", "공판심리"],
["802", "★ 제1심 법원이 국민참여재판 대상사건의 피고인에게 국민참여재판을 원하는지 확인하지 아니한 채 통상의 공판절차에 따라 재판을 진행하였더라도, 항소심 제1회 공판기일에 이에 대하여 이의가 없다는 피고인과 변호인의 진술만으로도 제1심의 공판절차상 하자가 치유된다.", false, "▸ 하자가 치유되기 위해서는 피고인에게 국민참여재판절차 등에 관한 '충분한 안내'가 이루어지고 그 희망 여부에 관하여 '숙고할 수 있는 상당한 시간'이 사전에 부여되어야 한다. 단순한 이의 없다는 진술만으로는 치유되지 않는다. [2012도13896]", "공판심리"],
["803", "★ 법원이 국민참여재판 신청에 대해 배제결정 없이 통상의 공판절차로 재판을 진행하는 것은 위법하지만, 이러한 공판절차에서 이루어진 소송행위는 유효하다.", false, "▸ 의사의 확인절차를 거치지 아니한 채 통상의 공판절차로 재판을 진행하였다면, 이는 피고인의 국민참여재판을 받을 권리에 대한 중대한 침해로서 그 절차는 위법하고 이러한 위법한 공판절차에서 이루어진 소송행위도 무효라고 보아야 한다. [2012도13896]", "공판심리"],
["804", "★ 제1심의 공판절차상 하자가 치유되지 않는 경우에 해당하면 항소심은 직권으로 제1심판결을 파기하고 다시 판결하여야 한다.", false, "▸ 하자가 치유되지 않는 경우에는 제1심 공판절차에서 이루어진 소송행위를 무효라고 보아 직권으로 제1심판결을 '파기'하고 사건을 제1심법원으로 '환송'하여야 한다. [2012도13896]", "공판심리"],
["805", "★ 국민참여재판에 관하여 변호인이 없는 때에는 「형사소송법」제33조 제1항 각 호의 어느 하나에 해당하는 경우가 아니더라도 법원은 직권으로 변호인을 선정하여야 한다.", true, "▸ 이 법에 따른 국민참여재판에 관하여 변호인이 없는 때에는 법원은 직권으로 변호인을 선정하여야 한다(국참법 제7조).", "공판심리"],
["806", "피고인이 국민참여재판을 원하는 의사를 표시한 경우에 사건을 공판준비절차에 부쳐야 하지만, 공판준비절차에 부치기 전에 국민참여재판 배제결정이 있는 때에는 그러하지 아니하다.", true, "▸ 국참법 제36조 제1항에 따라 피고인이 국민참여재판을 원하는 의사를 표시한 경우에는 사건을 공판준비절차에 부쳐야 하지만, 공판준비절차에 부치기 전에 국민참여재판 배제결정이 있는 때에는 그러하지 아니하다.", "공판심리"],
["807", "★ 국민참여재판에서 공판준비기일은 원칙적으로 공개하여야 하나, 배심원은 공판준비기일에는 참여하지 아니한다.", true, "▸ 공판준비기일은 공개한다(국참법 제37조 제3항). 다만, 법원은 공개함으로써 절차의 진행이 방해될 우려가 있는 때에는 공개하지 아니할 수 있다. 배심원은 공판준비기일에 참여하지 아니한다(동조 제4항).", "공판심리"],
["808", "★ 국민참여재판은 간이공판절차에 의한 증거능력과 증거조사의 특칙을 적용하기에 부적합한 재판이기 때문에 간이공판절차에 관한 규정을 적용하지 아니한다.", true, "▸ 국민참여재판에는 형사소송법 제286조의2(간이공판절차의 결정)를 적용하지 아니한다(국참법 제43조).", "공판심리"],
["809", "★ 공소사실의 일부 철회 또는 변경으로 인하여 대상사건에 해당하지 않게 된 경우에도 법원은 국민참여재판을 계속 진행하여야 하나, 법원은 국민참여재판에 의하지 않고 당해 사건을 지방법원 본원 합의부가 심판하기로 결정할 수 있고 그러한 결정에 대해서는 불복할 수 없다.", true, "▸ 공소사실의 일부 철회 또는 변경으로 대상사건에 해당하지 않게 된 경우에도 재판을 계속 진행한다. 다만, 법원은 국민참여재판으로 진행하는 것이 적당하지 아니하다고 인정하는 때에는 결정으로 지방법원 본원 합의부가 심판하게 할 수 있고, 이 결정에 대하여는 불복할 수 없다(국참법 제6조).", "공판심리"],
["810", "★ 피고인의 질병으로 공판절차가 장기간 정지되어 국민참여재판을 계속 진행하기 적절하지 않다고 인정하는 경우 사건을 지방법원 본원 합의부가 국민참여재판에 의하지 않고 심판하게 할 수 있다.", true, "▸ 국참법 제6조 제1항에 따라 심리의 상황이나 그 밖의 사정을 고려하여 국민참여재판으로 진행하는 것이 적당하지 아니하다고 인정하는 때에는 지방법원 본원 합의부가 심판하게 할 수 있다.", "공판심리"],
["811", "배심원은 만 20세 이상의 대한민국 국민 중에서 국민의 형사재판 참여에 관한 법률로 정하는 바에 따라 선정된다.", true, "▸ 국민의 형사재판 참여에 관한 법률 제16조에 따라 배심원은 만 20세 이상의 대한민국 국민 중에서 선정된다.", "공판심리"],
["812", "★ 국민참여재판에서 배심원은 사실의 인정, 법령의 적용 및 형의 양정에 관한 의견을 제시할 권한은 있으나, 법원의 증거능력에 관한 심리에는 참여하지 않는다.", true, "▸ 배심원은 사실의 인정, 법령의 적용 및 형의 양정에 관한 의견을 제시할 권한이 있으나(법률 제12조 제1항), 증거능력에 관한 심리에는 참여하지 않는다(법률 제44조).", "공판심리"],
["813", "배심원은 유·무죄에 관하여 전원의 의견이 일치하지 아니하는 때에는 평결을 하기 전에 심리에 관여한 판사의 의견을 들어야 하고, 이 경우 유·무죄의 평결은 다수결의 방법으로 한다.", true, "▸ 법률 제46조 제3항에 따라 배심원은 전원의 의견이 일치하지 아니하는 때에는 평결 전에 심리에 관여한 판사의 의견을 들어야 하고, 유·무죄의 평결은 다수결의 방법으로 한다.", "공판심리"],
["814", "배심원의 유·무죄에 관한 평결과 의견은 법원을 기속하지 아니한다.", true, "▸ 법률 제46조에 따라 배심원의 유·무죄에 관한 평결과 의견은 법원을 기속하지 아니한다.", "공판심리"],
["815", "배심원과 예비배심원은 피고인이나 증인에 대하여 필요한 사항을 신문해 줄 것을 재판장에게 요청할 수 있다.", true, "▸ 법률 제41조 제1항 제1호에 따라 배심원과 예비배심원은 피고인이나 증인에 대하여 필요한 사항을 신문해 줄 것을 재판장에게 요청할 수 있다.", "공판심리"],
["816", "★ 공판절차가 개시된 후 새로 재판에 참여하는 예비배심원이 있는 경우 법원은 공판절차를 갱신할 필요가 없다.", false, "▸ 공판절차가 개시된 후 새로 재판에 참여하는 배심원 또는 예비배심원이 있는 때에는 절차를 갱신하여야 한다(법률 제45조 제1항).", "공판심리"],
["817", "배심원이 법정에서 폭언 또는 그 밖의 부당한 언행을 하여 배심원에서 해임되었다는 이유로 검사의 신청에 따라 법원으로부터 배심원 해임결정을 받은 경우, 그 배심원의 변호인은 이에 불복할 수 없다.", true, "▸ 법률 제32조 제1항 제6호, 제3항에 따라 배심원이 법정에서 부당한 언행을 하여 해임결정을 받은 경우 불복할 수 없다.", "공판심리"],
["818", "직무를 계속 수행하기 어려운 사정이 있는 배심원이 법원에 사임을 신청하여 법원이 배심원의 해임을 결정한 경우, 이에 대하여 피고인은 불복할 수 없다.", true, "▸ 법률 제33조 제1항, 제2항, 제4항에 따라 배심원이 사임 신청을 하여 법원이 해임을 결정한 경우 피고인은 불복할 수 없다.", "공판심리"],
["819", "★ 재판장이 최종 설명 때 공소사실에 관한 설명을 일부 빠뜨렸거나 미흡하게 한 잘못이 있다면 국참법 제46조 제1항에 따라 설명의무가 있는 사항을 설명하지 않은 위법한 조치이므로 이와 같이 위법한 공판절차에서 이루어진 소송행위는 전부 무효라고 보아야 한다.", false, "▸ 재판장이 최종 설명 때 공소사실에 관한 설명을 일부 빠뜨렸거나 미흡하게 한 잘못이 있다고 하더라도, 그 잘못이 배심원의 평결에 직접적인 영향을 미쳐 피고인의 국민참여재판을 받을 권리 등을 본질적으로 침해하고 판결의 정당성마저 인정받기 어려운 정도에 이른 것인지를 신중하게 판단하여야 하고, 그렇지 않은 경우 소송행위 전부를 무효로 쉽게 단정할 것이 아니다. [2014도8377]", "공판심리"],
["820", "반의사불벌죄에서 '처벌불원의 의사표시' 또는 '처벌희망 의사표시 철회'의 유무나 그 효력에 관한 사실은 엄격한 증명의 대상이 되지 않는다.", true, "▸ 엄격한 증명의 대상이 아니라 자유로운 증명의 대상이다. [2010도5610]", "증거법기본"],
["821", "출입국사범의 필요적 고발사건에서 지방출입국·외국인관서의 장의 적법한 고발이 있었는지 여부가 문제 되는 경우에 법원은 증거조사의 방법이나 증거능력의 제한을 받지 아니하고 제반 사정을 종합하여 적당하다고 인정되는 방법에 의하여 자유로운 증명으로 고발 유무를 판단하면 된다.", true, "▸ [AI해설] 출입국사범 필요적 고발사건에서 고발 유무는 자유로운 증명으로 판단하면 된다. [2021도404]", "증거법기본"],
["822", "★ 진술의 임의성에 다툼이 있을 때에는 피고인이 그 임의성을 의심할 만한 합리적이고 구체적인 사실을 입증하여야 하고 검사가 그 임의성의 의문점을 없애는 것은 아니다.", false, "▸ 임의성에 다툼이 있을 때에는 그 임의성을 의심할 만한 합리적이고 구체적인 사실을 피고인이 증명할 것이 아니고, 검사가 그 임의성의 의문점을 없애는 증명을 하여야 한다. [2012도9879]", "증거법기본"],
["823", "피고인의 검찰 진술의 임의성의 유무가 다투어지는 경우에는 법원은 자유로운 증명으로 그 임의성 여부를 판단하면 된다.", true, "▸ [AI해설] 피고인의 검찰 진술의 임의성이 다투어지는 경우 법원은 자유로운 증명으로 판단하면 된다. [2010도14720]", "증거법기본"],
["824", "몰수대상이 되는지 여부나 추징액의 인정 등 몰수·추징의 사유는 범죄구성요건 사실에 관한 것이 아니어서 엄격한 증명은 필요 없다.", true, "▸ 몰수·추징의 사유는 범죄구성요건 사실에 관한 것이 아니어서 엄격한 증명은 필요 없다. [2014도4708]", "증거법기본"],
["825", "외국인이 대한민국 영역 외에서 대한민국 국민에 대하여 범죄를 저지른 경우, 형법 제6조 단서에 규정된 행위지의 법률에 의하여 범죄를 구성하는지 여부는 엄격한 증명에 의하여 검사가 이를 증명하여야 한다.", true, "▸ 형법 제6조 단서에 의하여 행위지 법률에 의하여 범죄를 구성하지 아니하거나 소추 또는 형의 집행을 면제할 경우에는 우리 형법을 적용하여 처벌할 수 없고, 이를 엄격한 증명에 의하여 검사가 증명하여야 한다. [2011도6507]", "증거법기본"],
["826", "★ 공범관계에 있어서 공모는 법률상 어떤 정형을 요구하는 것이 아니므로, 이러한 공모관계를 인정하기 위하여 엄격한 증명이 요구되지는 않는다.", false, "▸ 공모관계를 인정하기 위해서는 엄격한 증명이 요구된다. [2011도9721]", "증거법기본"],
["827", "★ 이웃주민 乙, 丙이 있는 자리에서 甲은 '丁은 징역 살다온 전과자다'라고 수회 소리쳤다. 명예훼손죄 판단에 있어서 甲 발언의 전파가능성에 대한 증명은 검사의 자유로운 증명으로 충분하다.", false, "▸ 명예훼손죄의 구성요건으로서 전파될 가능성에 관하여는 검사의 엄격한 증명이 필요하다. 전파될 가능성에 대한 증명의 정도로 단순히 가능성이 아닌 '개연성'이 요구된다. [2020도5813]", "증거법기본"],
["828", "목적과 용도를 정하여 위탁한 금전을 수탁자가 임의로 소비하면 횡령죄를 구성할 수 있으며 피해자 등이 목적과 용도를 정하여 금전을 위탁한 사실 및 그 목적과 용도가 무엇인지는 엄격한 증명의 대상이 된다.", true, "▸ [AI해설] 횡령죄에서 목적과 용도를 정하여 금전을 위탁한 사실 및 그 목적과 용도는 엄격한 증명의 대상이 된다. [2013도8121]", "증거법기본"],
["829", "★ 사문서위조죄의 행위자에게 '행사할 목적'이 있었다는 점은 검사가 증명하여야 하나, 그 증명은 반드시 엄격한 증명에 의하여야 하는 것은 아니다.", false, "▸ '행사할 목적'은 사문서위조죄의 구성요건이므로 엄격한 증명을 요한다.", "증거법기본"],
["830", "횡령죄의 행위자에게 '불법영득의사'가 있었다는 점은 검사가 증명하여야 하나, 그 증명은 반드시 엄격한 증명에 의하여야 하는 것은 아니다.", false, "▸ 불법영득의사를 실현하는 행위로서의 횡령행위가 있다는 점은 검사가 입증하여야 하고, 그 입증은 법관으로 하여금 합리적인 의심을 할 여지가 없을 정도의 확신을 생기게 하는 증명력을 가진 엄격한 증거에 의하여야 한다. [94도998]", "증거법기본"],
["831", "범죄구성요건사실의 존부를 알아내기 위해 과학공식 등의 경험칙을 적용하는 경우, 그 법칙 적용의 전제가 되는 개별적이고 구체적인 사실에 대해서도 엄격한 증명을 요하는바, 위드마크 공식의 경우 그 적용을 위한 자료로 섭취한 알코올의 양, 음주 시각, 체중 등이 필요하므로 그런 전제사실에 대한 엄격한 증명이 요구된다.", true, "▸ 위드마크 공식 적용의 전제가 되는 섭취 알코올의 양, 음주 시각, 체중 등의 전제사실에 대해 엄격한 증명이 요구된다. [2008도5531]", "증거법기본"],
["832", "성폭력범죄의 처벌 등에 관한 법률 제7조 제1항의 13세 미만의 미성년자에 대한 강간죄가 성립하려면, 피고인이 피해자가 13세 미만의 여자임을 알면서 그를 강간하였다는 사실이 검사에 의하여 입증되어야 한다.", true, "▸ [AI해설] 13세 미만 미성년자에 대한 강간죄의 성립에는 피해자가 13세 미만임을 알면서 강간하였다는 사실이 검사에 의해 입증되어야 한다. [2012도7377]", "증거법기본"],
["833", "★ 甲의 행위가 정당방위 또는 정당행위에 해당한다는 점은 甲이 입증하여야 하나, 그 증명은 법관으로 하여금 의심할 여지가 없을 정도의 확신을 가지게 하는 증명력을 가진 엄격한 증거에 의하여야 하는 것은 아니다.", false, "▸ 피고인이 위법성조각사유나 책임조각사유를 주장하는 경우에는 '검사'가 그 부존재에 대한 거증책임을 부담하고, '엄격한 증명'으로 입증해야 한다. 甲이 아니라 검사가 거증책임을 부담한다.", "증거법기본"],
