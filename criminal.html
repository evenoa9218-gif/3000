["834", "★ 형법 제310조의 성립요건인 적시한 사실이 진실한 사실로서 오로지 공공의 이익에 해당된다는 점은 행위자가 엄격한 증거에 의하여 합리적 의심의 여지가 없을 정도로 증명하여야 한다.", false, "▸ 이는 행위자가 증명하여야 한다. 그러나 그 증명은 유죄 인정에 요구되는 것과 같이 엄격한 증거에 의할 것을 요하지 않으므로, 전문증거에 대한 증거능력 제한 규정도 적용될 여지가 없다(자유로운 증명). [95도1473]", "증거법기본"],
["835", "자동차를 운전하는 자가 선행차량에 충격되어 쓰러진 피해자를 다시 역과하여 사망하게 하였다는 공소사실에서 역과 당시 피해자가 생존해 있었다는 점에 관한 증명책임은 검사에게 있다.", true, "▸ 형사재판에서 공소가 제기된 범죄사실에 대한 증명책임은 검사에게 있고, 피고인이 일으킨 후행 교통사고 당시에 피해자가 생존해 있었다는 증거가 없다면 피고인의 이익으로 판단할 수밖에 없다. [2014도3163]", "증거법기본"],
["836", "★ 재판의 공개금지사유가 없음에도 불구하고 재판의 심리에 관한 공개를 금지하기로 한 공개금지결정은 피고인의 공개재판을 받을 권리를 침해한 것으로서 비공개로 진행된 증인신문절차에서 이루어진 증인의 증언은 증거능력이 없으나, 만약 변호인의 반대신문권이 보장되었을 경우에는 이를 증거로 사용할 수 있다.", false, "▸ 위와 같은 증언은 증거능력이 없고, 변호인의 반대신문권이 보장되었더라도 달리 볼 수 없다. 이러한 법리는 공개금지결정의 선고가 없는 등으로 공개금지결정의 사유를 알 수 없는 경우에도 마찬가지이다. [2013도2511]", "증거법기본"],
["837", "★ 검찰관이 형사사법공조절차를 거치지 아니한 채 외국으로 현지출장을 나가 참고인진술조서를 작성한 경우, 조사 대상자가 우리나라 국민이고 조사에 스스로 응함으로써 조사의 방식이나 절차에 강제력이나 위력은 물론 어떠한 비자발적 요소도 개입될 여지가 없었고 해당 국가 사이에 국제법상 관할의 원인이 될 만한 아무런 연관성이 없다면 위 참고인진술조서는 위법수집증거라고 할 수 없다.", true, "▸ [AI해설] 위 경우 참고인진술조서는 위법수집증거가 아니다. [2011도3809]", "증거법기본"],
["838", "★ 사법경찰관이 피고인이 아닌 乙을 사실상 강제연행하여 불법체포한 상태에서 피고인의 행위를 처벌하기 위해 乙로부터 자술서를 받은 경우, 이를 피고인에 대한 유죄인정의 증거로 사용할 수 없다.", true, "▸ 수사기관이 헌법과 형소법이 정한 절차에 따르지 아니하고 수집한 증거는 유죄 인정의 증거로 삼을 수 없는 것이 원칙이므로, 수사기관이 '피고인 아닌 자'를 상대로 적법한 절차에 따르지 아니하고 수집한 증거는 원칙적으로 '피고인'에 대한 유죄 인정의 증거로 삼을 수 없다. [2009도6717]", "증거법기본"],
["839", "★ 검사가 범죄를 인지하였음에도 불구하고 범죄인지서를 작성하지 않은 상태에서 피의자신문을 한 경우 원칙적으로 위법한 수사에 해당하며, 그 수사과정에서 작성된 피의자신문조서는 증거능력이 없다.", false, "▸ 검찰사건사무규칙은 검찰청의 편의를 위한 사무처리절차 규정이므로, 인지절차가 이루어지기 전에 수사를 하였다는 이유만으로 그 수사가 위법하다고 볼 수는 없다. 따라서 그 수사과정에서 작성된 피의자신문조서나 진술조서 등의 증거능력도 이를 부인할 수 없다. [2000도2968]", "증거법기본"],
["840", "★ 위법한 체포 상태에서 음주측정요구가 이루어진 경우, 음주측정요구를 위한 위법한 체포와 그에 이은 음주측정요구는 주취운전이라는 범죄행위에 대한 증거 수집을 위하여 연속하여 이루어진 것으로서 그 일련의 과정을 전체적으로 보아 위법한 음주측정요구가 있었던 것으로 볼 수밖에 없다.", true, "▸ 위법한 체포와 그에 이은 음주측정요구는 일련의 과정으로서 전체적으로 위법한 음주측정요구가 있었던 것으로 볼 수밖에 없고, 이에 불응하였다고 하여 음주측정거부로 처벌할 수 없다. [2004도8404]", "증거법기본"],
["841", "★ 위법한 강제연행 상태에서 호흡측정 방법에 의한 알코올 측정을 한 직후 피의자가 호흡측정결과에 대한 탄핵을 하기 위하여 스스로 혈액채취 방법에 의한 측정을 요구하여 혈액채취가 이루어졌다면 특별한 사정이 없는 한 그러한 혈액채취에 의한 측정결과는 유죄의 증거로 쓸 수 있다.", false, "▸ 강제연행 상태로부터 시간적·장소적으로 단절되었다고 볼 수도 없고 피의자의 심적 상태 또한 완전히 벗어났다고 볼 수 없는 상황에서의 혈액채취는 불법체포와 증거수집 사이의 인과관계가 단절된 것으로 볼 수 없다. 따라서 그 측정 결과도 유죄 인정의 증거로 쓸 수 없고, 피고인이나 변호인이 증거동의하였다고 하여도 달리 볼 것은 아니다. [2010도2094]", "증거법기본"],
["842", "★ 호텔 투숙객 甲이 마약을 투약하였다는 신고를 받고 출동한 경찰관이 임의동행을 거부하는 甲을 강제로 경찰서로 데리고 가서 채뇨 요구를 하자 이에 甲이 응하여 소변검사가 이루어진 경우, 그 결과물인 소변검사 시인서는 증거능력이 없다.", true, "▸ [AI해설] 강제연행 상태에서 이루어진 채뇨 결과물인 소변검사 시인서는 증거능력이 없다. [2012도13611]", "증거법기본"],
["843", "★ 피고인이 경찰관들에게 영장 없이 강제로 연행된 상태에서 1차 채뇨절차가 이루어졌다고 하더라도, 그 후 피고인이 법관이 발부한 영장에 의하여 적법하게 구금되고 압수·수색영장에 의하여 2차 채뇨가 이루어진 이상, 이와 같은 사정은 체포과정에서의 절차적 위법과 2차적 증거수집 사이의 인과관계를 희석하게 할 만한 정황에 속한다.", true, "▸ 1차 위법한 채뇨 이후 적법하게 구금되어 영장에 의해 2차 채뇨가 이루어진 사정은 절차적 위법과 2차적 증거수집 사이의 인과관계를 희석시킬 만한 정황에 속한다.", "증거법기본"],
["844", "피의자가 석방된 후 상당한 시간이 경과하였음에도 동일한 내용의 자백을 하였다거나 범행의 피해품을 수사기관에 임의로 제출하였다는 사정 등은 통상 2차적 증거의 증거능력을 인정할 만한 정황에 속한다.", true, "▸ [AI해설] 피의자 석방 후 상당한 시간이 경과하여 동일한 내용의 자백을 하거나 피해품을 임의로 제출한 사정 등은 2차적 증거의 증거능력을 인정할 만한 정황에 속한다. [2012도13607]", "증거법기본"],
["845", "★ 압수·수색영장에 야간집행을 허가하는 판사의 수기와 날인이 있고, 그 아래 서명날인란에 판사의 서명만 있고 날인이 없으며, 영장 앞면과 별지 사이에 판사의 간인이 있는 경우, 해당 영장은 형사소송법이 정한 요건을 갖추지 못하여 적법하게 발부되었다고 볼 수 없다.", true, "▸ 이 사건 영장은 법관의 서명날인란에 서명만 있고 날인이 없으므로, 형사소송법이 정한 요건을 갖추지 못하여 적법하게 발부되었다고 볼 수 없다. [2018도20504]", "증거법기본"],
["846", "★ 서명날인란에 날인이 없는 압수·수색검증영장에 따라 수사기관이 수집한 증거 및 이에 기초하여 획득한 2차적 증거는 위법수집증거로서 증거능력이 부정된다.", false, "▸ 당시 수사기관으로서는 영장이 적법하게 발부되었다고 신뢰할 만한 합리적인 근거가 있었고, 의도적으로 영장주의를 회피할 의도를 가지고 압수수색을 하였다고 보기 어렵다. 이러한 경우에까지 증거물의 증거능력을 배제하는 것은 적법절차의 원칙과 실체적 진실 규명의 조화를 도모하려는 취지에 반하는 결과를 초래할 수 있으므로 증거능력이 인정된다. [2018도20504]", "증거법기본"],
["847", "구속영장의 집행 당시 구속영장이 사전에 제시된 바 없다면 그와 같은 구속 중에 수집한 피의자신문조서는 원칙적으로 유죄인정의 증거로 사용할 수 없다.", true, "▸ [AI해설] 구속영장이 사전에 제시되지 않은 상태에서 수집한 피의자신문조서는 원칙적으로 유죄인정의 증거로 사용할 수 없다. [2009도526]", "증거법기본"],
["848", "★ 강도 현행범으로 체포된 피고인에게 진술거부권을 고지하지 아니한 채 자백을 받았다면, 비록 최초 자백 이후 40여 일이 지난 후에 변호인의 충분한 조력을 받으면서 공개된 법정에서 피고인이 다시 임의로 자백하였다고 하더라도 그 법정자백은 증거로 사용할 수 없다.", false, "▸ 최초 자백 이후 40여 일이 지난 후 변호인의 충분한 조력을 받으면서 공개된 법정에서 임의로 이루어진 법정자백은, 예외적으로 유죄 인정의 증거로 사용할 수 있는 2차적 증거에 해당한다. [2008도11437]", "증거법기본"],
["849", "현행범을 체포한 경찰관 乙이 진술거부권을 고지하지 않고 甲을 조사하여 자백을 받은 경우, 乙이 공판기일에 증인으로 출석하여, 甲이 피해자의 집에서 도망쳐 나오는 장면을 목격하였다고 증언하더라도 그 증언은 증거능력이 없다.", false, "▸ 현행범을 체포한 경찰관의 진술이라 하더라도 범행을 목격한 부분에 관하여는 여느 목격자의 진술과 다름없이 증거능력이 있다. [95도535]", "증거법기본"],
["850", "★ 범행 현장에서 함께 술을 마신 테이블 위에 놓여 있던 맥주컵의 지문채취가 먼저 이루어진 이상, 수사기관이 그 이후에 지문채취 대상물을 적법한 절차에 의하지 아니한 채 압수하였다고 하더라도, 위와 같이 채취된 지문은 위법하게 압수한 지문채취 대상물로부터 획득한 2차적 증거에 해당하지 아니한다.", true, "▸ 지문채취 대상물에 대한 지문채취가 먼저 이루어진 이상, 이후에 지문채취 대상물을 적법한 절차에 의하지 아니한 채 압수하였다고 하더라도, 위와 같이 채취된 지문은 위법하게 압수한 지문채취 대상물로부터 획득한 2차적 증거에 해당하지 아니한다. [2008도7471]", "증거법기본"],
["851", "★ 甲이 지하철역 에스컬레이터에서 휴대전화 카메라를 이용하여 여성의 신체를 촬영하는 것을 발견하고 甲을 현행범인으로 체포하면서 甲의 휴대전화를 압수하였다. 사법경찰관 乙이 작성한 압수조서의 '압수경위'란의 내용은 형사소송법 제313조에서 정한 '피고인이 아닌 자가 작성한 진술서'로 본다.", false, "▸ 위 압수조서 중 '압수경위'란에 기재된 내용은 피고인이 범행을 저지르는 현장을 직접 목격한 사람의 진술이 담긴 것으로서 형소법 제312조 제5항에서 정한 '피고인이 아닌 자가 수사과정에서 작성한 진술서'에 준하는 것으로 볼 수 있다. 제313조가 아닌 제312조 제5항이다. [2019도13290]", "증거법기본"],
["852", "★ 위 사례에서 만약 휴대전화에 대한 압수가 위법한 경우, 乙이 작성한 압수조서 중 '압수경위'란에 기재된 내용은 위법하게 수집된 증거에 터잡아 획득한 2차적 증거로서 피고인이 증거로 함에 동의하더라도 원칙적으로 증거능력이 없다.", false, "▸ 위 압수조서 중 '압수경위'란에 기재된 내용은 휴대전화기에 대한 임의제출절차가 적법하였는지에 영향을 받지 않는 별개의 독립적인 증거에 해당한다. 따라서 위법한 압수의 2차적 증거가 아니라 독립적 증거로서 증거능력이 인정될 수 있다. [2019도13290]", "증거법기본"],
["853", "사인이 위법하게 증거를 수집한 경우 법원으로서는 효과적인 형사소추 및 형사소송에서의 진실발견이라는 공익과 개인의 인격적 이익 등의 보호이익을 비교형량하여 허용 여부를 결정하여야 한다.", true, "▸ [AI해설] 사인에 의한 위법수집증거는 공익과 보호이익을 비교형량하여 허용 여부를 결정하여야 한다. [2008도3990]", "증거법기본"],
["854", "★ 피고인이 문서위조를 위해 연습한 흔적이 남아 있는 업무일지는 공익과 사익을 비교형량할 때 피고인의 소송사기를 증명하기 위한 유죄의 증거로 사용할 수 있지만, 만약 그 업무일지가 제3자에 의하여 절취된 것이고 소송사기의 피해자가 대가를 지급하고 취득한 것이라면 유죄의 증거로 사용할 수 없다.", false, "▸ 설령 그것이 제3자에 의하여 절취된 것으로서 피해자측이 대가를 지급하였다 하더라도, 공익의 실현을 위하여는 이 사건 업무일지를 범죄의 증거로 제출하는 것이 허용되어야 한다. [2008도1584]", "증거법기본"],
["855", "자백배제법칙에 관한 형사소송법 제309조의 '피고인의 자백'에는 수사기관을 상대로 행한 피의자의 자백도 포함된다.", true, "▸ 제309조는 피고인의 자백으로 규정하고 있으나, 피의자·참고인·증인 등의 지위에서 행한 자백도 이에 해당한다.", "증거법기본"],
["856", "★ 피고인의 자백이 임의성이 없다고 의심할 만한 사유가 있는 때에 해당한다 할지라도 그 임의성이 없다고 의심하게 된 사유들과 피고인의 자백과의 사이에 인과관계가 존재하지 않은 것이 명백한 때에는 그 자백은 임의성이 있는 것으로 인정된다.", true, "▸ 임의성이 없다고 의심할 만한 사유가 있으면 인과관계의 존재가 추정되므로, 인과관계가 존재하지 않음이 명백한 때에 한하여 임의성이 있는 것으로 인정된다. [84도2252]", "증거법기본"],
["857", "구속된 피의자를 일정 기간 동안 거의 매일 검사실로 소환하여 밤늦게까지 조사를 하였다면 이는 임의성을 의심할 만한 사정에 해당하고, 검사가 그 임의성의 의문점을 해소하는 입증을 하지 못하면 피의자에 대한 진술조서는 증거능력이 없다.", true, "▸ [AI해설] 구속 피의자를 거의 매일 검사실로 소환하여 밤늦게까지 조사한 것은 임의성을 의심할 만한 사정에 해당하고, 검사가 임의성의 의문점을 해소하는 입증을 하지 못하면 진술조서는 증거능력이 없다. [2001도3931]", "증거법기본"],
["858", "★ 피고인이 수사기관에서 가혹행위 등으로 인하여 임의성 없는 자백을 하고, 그 후 검찰이나 법정에서도 임의성 없는 심리상태가 계속되어 동일한 내용의 자백을 하였다면 검찰이나 법정에서의 자백도 임의성 없는 자백이라고 보아야 한다.", true, "▸ [AI해설] 임의성 없는 심리상태가 계속된 상태에서 한 검찰 또는 법정 자백도 임의성 없는 자백이라고 보아야 한다. [2012도9879]", "증거법기본"],
["859", "★ 피고인의 자백이, 신문에 참여한 검찰수사관이 절도 피의사실을 모두 자백하면 피의사실 부분은 가볍게 처리하고 특가법(절도)죄 대신 형법상 절도죄를 적용하겠다는 각서를 작성하여 미리 자백을 유도한 것에 기인한 것이라 하여 위 자백이 기망에 의하여 임의로 진술한 것이 아니라고 의심할 만한 이유가 있는 때에 해당한다고 볼 수 없다.", false, "▸ 특가법위반으로 중형을 받게 되니 단순 수뢰죄의 가벼운 형으로 처벌되도록 하겠다고 약속하고 자백을 유도한 것이라면 그 자백은 임의성에 의심이 간다. 이와 같은 약속에 기한 자백은 임의성을 의심할 만한 이유가 있는 때에 해당할 수 있다. [83도...]", "증거법기본"],
["860", "발견되면 피의자가 자백하겠다고 한 약속이 검사의 강요나 위계에 의하여 이루어졌다던가 또는 불기소나 경한 죄의 소추 등 이익과 교환조건으로 된 것으로 인정되지 않는다면 위와 같은 자백의 약속하에 된 자백이라 하여 곧 임의성 없는 자백이라고 단정할 수는 없다.", true, "▸ [AI해설] 자백 약속이 검사의 강요나 위계에 의한 것이거나 이익과 교환조건으로 된 것이 아니라면, 그 약속하에 한 자백이라 하여 곧 임의성 없는 자백이라고 단정할 수 없다. [83도712]", "증거법기본"],
["861", "★ 타인의 진술을 내용으로 하는 진술이 전문증거인지 여부는 요증사실과의 관계에서 정해지는데, 원진술의 내용인 사실이 요증사실인 경우에는 전문증거이나 원진술의 존재 자체가 요증사실인 경우에는 본래증거이지 전문증거가 아니다.", true, "▸ 전문증거 여부는 요증사실과의 관계에서 정해진다. 원진술의 내용인 사실이 요증사실이면 전문증거이고, 원진술의 존재 자체가 요증사실이면 본래증거이다.", "전문법칙"],
["862", "★ 어떤 진술이 기재된 서류가 그 내용의 진실성이 범죄사실에 대한 직접증거로 사용될 때는 전문증거가 된다고 하더라도, 그와 같은 진술을 하였다는 것 자체 또는 그 진술의 진실성과 관계없는 간접사실에 대한 정황증거로 사용될 때는 반드시 전문증거가 되는 것은 아니다.", true, "▸ 진술이 기재된 서류가 내용의 진실성 입증에 사용되면 전문증거이지만, 진술을 하였다는 것 자체 또는 진실성과 관계없는 간접사실에 대한 정황증거로 사용될 때는 반드시 전문증거가 되는 것은 아니다. [2017도19499]", "전문법칙"],
["863", "★ 어떠한 내용의 진술을 하였다는 사실 자체에 대한 정황증거로 사용될 것이라는 이유로 서류의 증거능력을 인정한 다음 그 사실을 다시 진술 내용이나 그 진실성을 증명하는 간접사실로 사용하는 경우에 그 서류는 전문증거에 해당한다.", true, "▸ 진술을 하였다는 사실 자체에 대한 정황증거라는 이유로 증거능력을 인정한 후 그 사실을 다시 진술 내용이나 진실성을 증명하는 간접사실로 사용하는 경우 그 서류는 전문증거에 해당한다. [2018도2738 전합]", "전문법칙"],
["864", "★ 피해자가 제2회 공판기일 법정에서 甲으로부터 강제추행을 당하였다고 증언하였고, 다른 동료 직원 丙는 같은 공판기일 법정에서 '이 사건 다음 날 피해자로부터 甲에게 추행을 당했다는 말을 들었다'고 증언하였다. 丙의 증언을 피해자가 丙에게 위와 같은 진술을 하였다는 것 자체에 대한 증거로 사용되는 경우에는 전문법칙이 적용되지 않으므로, 「형사소송법」제316조 제2항의 요건을 갖추지 못하더라도 丙의 진술이 피해자의 진술에 부합한다고 보아 피해자의 진술 내용의 진실성을 증명하는 간접사실로 사용할 수 있다.", false, "▸ 어떠한 내용의 진술을 하였다는 사실 자체에 대한 정황증거로 사용될 것이라는 이유로 증거능력을 인정한 다음 그 사실을 다시 진술 내용이나 그 진실성을 증명하는 간접사실로 사용하는 경우 그 서류는 전문증거에 해당한다. 따라서 丙의 진술이 피해자의 진술 내용의 진실성을 증명하는 간접사실로 사용되는 경우 전문진술에 해당하여 제316조 제2항의 요건을 갖추어야 한다. [2020도17109]", "전문법칙"],
["865", "★ 디지털 저장매체로부터 출력한 문건을 진술증거로 사용하는 경우, 그 기재 내용의 진실성에 관하여는 전문법칙이 적용되므로, 문서의 압수·수색의 주체가 검사인가 사법경찰관인가에 따라 증거능력의 인정요건이 달라지게 된다.", false, "▸ 형소법 제313조 제1항은 압수·수색의 주체와 무관하게 적용된다. 또한 정보저장매체에 기억된 문자정보의 내용의 진실성이 아닌 그 문자정보의 존재 자체가 직접 증거로 되는 경우에는 전문법칙이 적용되지 아니한다. [2010도3504]", "전문법칙"],
["866", "★ 甲은 편의점에서 점원 乙를 협박한 후 현금을 강취하여 강도죄로 기소되었는데, 甲은 공판과정에서 일체의 증거에 동의하지 않고 있다. 丙는 '甲이 돈을 내놓지 않으면 죽이겠다고 말하며 현금을 빼앗아갔다'라고 공판정에서 증언하였다면, 丙의 증언은 甲에 대한 강도죄 관련 「형사소송법」제316조 제1항의 요건을 충족할 경우에만 증거가 된다.", false, "▸ 丙의 진술 자체가 강도죄의 요증사실이고(협박 내용 및 금원 탈취), 甲의 진술의 존재 자체가 강도죄의 요증사실이므로 모두 원진술의 존재 자체가 요증사실인 경우로 전문증거가 아니다. 따라서 제316조 제1항의 요건을 갖출 필요 없이 증거로 사용할 수 있다. [2018도2738 전합]", "전문법칙"],
["867", "★ 제3자의 진술을 담고 있는 서류 등의 증거가 제3자의 진술내용의 진실성이 범죄사실에 대한 직접증거로 사용될 때는 전문증거가 된다.", true, "▸ 어떤 진술이 기재된 서류가 그 내용의 진실성이 범죄사실에 대한 직접증거로 사용될 때는 전문증거가 되지만, 그 진술을 하였다는 것 자체 또는 그 진술의 진실성과 관계없는 간접사실에 대한 정황증거로 사용될 때는 반드시 전문증거가 되는 것은 아니다. [2017도19499]", "전문법칙"],
["868", "★ 甲이 특정범죄가중처벌등에관한법률위반(알선수재)죄로 기소된 피고인으로부터 건축허가를 받으려면 담당공무원에게 사례비를 주어야 한다는 말을 들었다는 취지의 법정진술을 한 경우, 원진술의 존재 자체가 알선수재죄에서의 요증사실이므로 甲의 진술은 전문증거가 아니라 본래증거에 해당한다.", true, "▸ 피고인의 위와 같은 원진술의 존재 자체가 알선수재죄에 있어서의 요증사실이므로, 이를 직접 경험한 甲이 피고인으로부터 위와 같은 말들을 들었다고 하는 진술들은 전문증거가 아니라 본래증거에 해당한다. [2008도8007]", "전문법칙"],
["869", "★ 반국가단체로부터 지령을 받고 국가기밀을 탐지·수집하였다는 공소사실로 기소된 피고인의 컴퓨터에 저장된 국가기밀문건은 전문증거에 해당한다.", false, "▸ 정보저장매체에 기억된 문자정보의 내용의 진실성이 아닌 그와 같은 내용의 문자정보의 존재 자체가 직접 증거로 되는 경우에는 전문법칙이 적용되지 아니한다. [2010도3504, 국가보안법]", "전문법칙"],
["870", "★ 피고인이 수표를 발행하였으나 예금부족 또는 거래정지처분으로 지급되지 아니하게 하였다는 부정수표단속법위반의 공소사실을 증명하기 위하여 제출되는 수표는 증거물인 서면이지만 그 증거능력은 증거서류의 예에 의하여 판단하여야 한다.", false, "▸ 수표는 그 서류의 존재 또는 상태 자체가 증거가 되는 것이어서 증거물인 서면에 해당하므로 증거능력은 증거물의 예에 의하여 판단하여야 하고, 이에 대하여는 형소법 제310조의2에서 정한 전문법칙이 적용될 여지가 없다. [2015도2275]", "전문법칙"],
["871", "★ 甲이 법정에서 '피고인이 체육관 부지를 공시지가로 매입하게 해 주겠다고 말했다'고 한 진술은 그러한 권한과 의사가 없었던 피고인의 사기죄에 있어서는 전문증거가 아니라 본래증거에 해당한다.", true, "▸ 피고인의 위와 같은 원진술의 존재 자체가 사기죄 또는 변호사법 위반죄에 있어서의 요증사실이므로, 이를 직접 경험한 甲이 피고인으로부터 위와 같은 말을 들었다고 하는 진술은 전문증거가 아니라 본래증거에 해당한다. [2012도2937]", "전문법칙"],
["872", "★ 구속적부심문조서는 「형사소송법」제311조(법원 또는 법관의 조서)에 해당되는 문서로 당연히 그 증거능력이 인정된다.", false, "▸ ① 구속적부심문조서는 형소법 제311조가 규정한 문서에는 해당하지 않는다. ② 피고인이 증거로 함에 부동의하더라도 형소법 제315조 제3호에 의하여 당연히 그 증거능력이 인정된다. [2003도5693, 구속전피의자심문조서도 동일 99도2317]", "전문법칙"],
["873", "★ 공범자가 당해 피고인과 별개의 공판절차에서 피고인으로서 공동범행에 관하여 한 진술이 기재된 공판조서가 당해 피고인의 공판에서 증거로 제출된 경우, 이는 특히 신용할 만한 정황에 의하여 작성된 문서이므로 「형사소송법」제315조 제3호에 의하여 증거능력이 인정된다.", true, "▸ 다른 피고인에 대한 형사사건의 공판조서는 형소법 제315조 제3호에 정한 서류로서 당연히 증거능력이 있고, 공판조서 중 일부인 증인신문조서 역시 제315조 제3호에 정한 서류로서 당연히 증거능력이 있다. [2004도4428]", "전문법칙"],
["874", "★ 甲과 乙이 피해자의 자전거를 편취한 사기죄의 공범인데, 乙만 먼저 공소제기 되어 재판을 받았고 이후 甲이 따로 공소제기 되었다면, 乙에 대한 피고사건에서 작성된 공판조서는 「형사소송법」제311조(법원 또는 법관의 조서)에 해당하므로 甲에 대한 유죄의 증거로 사용할 수 있다.", false, "▸ 다른 피고인에 대한 형사사건의 공판조서는 형소법 제315조 제3호에 정한 서류로서 당연히 증거능력이 있다. 제311조가 아니라 제315조 제3호에 해당한다. [2004도4428]", "전문법칙"],
["875", "★ 보험사기 사건에서 건강보험심사평가원이 수사기관의 의뢰에 따라 그 보내온 자료를 토대로 입원진료의 적정성에 대한 의견을 제시하는 내용의 '건강보험심사평가원의 입원진료 적정성 여부 등 검토의뢰에 대한 회신'은 사무 처리 내역을 계속적, 기계적으로 기재한 문서가 아니므로 「형사소송법」제315조 제3호의 '기타 특히 신용할 만한 정황에 의하여 작성된 문서'에 해당하지 않는다.", true, "▸ 건강보험심사평가원의 회신은 사무 처리 내역을 계속적·기계적으로 기재한 문서가 아니므로 제315조 제2호에도 해당하지 않고, 제3호의 '기타 특히 신용할 만한 정황에 의하여 작성된 문서'에 해당하지 않는다. [2017도12671]", "전문법칙"],
["876", "체포·구속인접견부는 유치된 피의자가 죄증을 인멸하거나 도주를 기도하는 등 유치장의 안전과 질서를 위태롭게 하는 것을 방지하기 위한 목적으로 작성되는 서류이므로 「형사소송법」제315조에 규정된 당연히 증거능력이 있는 서류로 볼 수 없다.", true, "▸ 체포·구속인접견부는 유치장의 안전과 질서 유지 목적으로 작성되는 서류이므로 형소법 제315조에 규정된 당연히 증거능력이 있는 서류로 볼 수 없다. [2011도5459]", "전문법칙"],
["877", "★ 대한민국 주중국 대사관 영사가 작성한 사실확인서 중 공인 부분을 제외한 나머지 부분이 비록 영사의 공무수행 과정 중 작성되었지만 공적인 증명보다는 상급자 등에 대한 보고를 목적으로 하는 것이더라도, 그 부분은 「형사소송법」제315조 제3호의 '기타 특히 신용할 만한 정황에 의하여 작성된 문서'에 해당한다.", false, "▸ 대한민국 주중국 대사관 영사가 작성한 사실확인서 중 공인 부분을 제외한 나머지 부분이 공적인 증명보다는 상급자 등에 대한 보고를 목적으로 하는 것인 경우, 형소법 제315조 제1호 또는 제3호에 해당하지 않는다. [2007도7257]", "전문법칙"],
["878", "★ 성매매업소 업주가 성매매를 전후하여 영업상 참고하기 위하여 고객정보를 입력한 메모리카드에 기재된 내용은 「형사소송법」제315조 제2호의 영업상 필요로 작성된 통상문서로서 당연히 증거능력이 인정된다.", true, "▸ 성매매업소 업주가 영업상 참고하기 위하여 고객정보를 입력한 메모리카드에 기재된 내용은 영업상 필요로 작성된 통상문서에 해당하여 형소법 제315조 제2호에 의하여 당연히 증거능력이 인정된다. [2007도3219]", "전문법칙"],
["879", "★ 피의자의 날인 또는 서명이 누락된 피의자신문조서는 증거능력이 없으나, 피의자가 이의없이 조사를 받은 후 타당한 이유없이 날인 또는 서명을 거부하였다는 취지가 조서말미에 기재되었다면 그 조서의 증거능력이 있다.", false, "▸ 피고인의 기명만이 있고 그 날인이나 무인이 없는 피의자신문조서는 증거능력 없다(81도1370). 피고인이 날인이나 간인을 거부하였기 때문이어서 그 취지가 조서말미에 기재되었다거나, 피고인이 법정에서 그 피의자신문조서의 임의성을 인정하였다고 하여 달리 볼 것은 아니다(99도237).", "전문법칙"],
["880", "★ 피의자의 진술을 기재한 서류 또는 문서가 검사의 수사과정에서 작성된 것이라면 '진술조서, 진술서, 자술서'의 어떤 형식을 취하였더라도 피의자신문조서와 마찬가지로 취급된다.", true, "▸ 피의자의 진술을 기재한 서류 또는 문서가 검사의 수사과정에서 작성된 것이라면 '진술조서, 진술서, 자술서'의 어떤 형식을 취하였더라도 피의자신문조서와 마찬가지로 취급된다. [2008도8213]", "전문법칙"],
["881", "★ 절도범과 장물범이 공동피고인으로 기소된 경우, 피고인이 증거로 함에 동의한 바 없는 검사 작성의 공동피고인에 대한 피의자신문조서가 증거능력을 인정받기 위해서는 공동피고인의 증언에 의하여 그 성립의 진정이 인정되어야 한다.", true, "▸ 공동피고인인 절도범과 그 장물범은 서로 다른 공동피고인의 범죄사실에 관하여는 증인의 지위에 있다 할 것이므로, 피고인이 증거로 함에 동의한 바 없는 공동피고인에 대한 피의자신문조서는 공동피고인의 증언에 의하여 그 성립의 진정이 인정되어야 한다. [2005도7601]", "전문법칙"],
["882", "★ 미국 범죄수사대(CID), 연방수사국(FBI)의 수사관들이 작성한 수사보고서는 피고인이 그 내용을 부인하는 이상 증거로 쓸 수 없다.", true, "▸ 제312조 제3항의 검사 이외의 수사기관에는 달리 특별한 사정이 없는 한 외국의 권한 있는 수사기관도 포함된다. 따라서 피고인이 그 내용을 부인하는 이상 증거로 쓸 수 없다. [2003도6548]", "전문법칙"],
["883", "★ 「형사소송법」제312조 제3항은 검사 이외의 수사기관이 작성한 해당 피고인과 공범관계에 있는 다른 피고인이나 피의자에 대한 피의자신문조서를 해당 피고인에 대한 유죄의 증거로 채택할 경우에도 적용되는데, 이때 공범에는 형법 총칙의 공범 이외에 필요적 공범 관계에 있는 자들도 포함된다.", true, "▸ 제312조 제3항은 공범 관계에 있는 다른 피고인·피의자에 대한 피의자신문조서를 해당 피고인에 대한 유죄의 증거로 채택할 경우에도 적용되고, 이때 공범에는 형법 총칙의 공범 이외에 필요적 공범 관계에 있는 자들도 포함된다.", "전문법칙"],
["884", "★ 피고인과 공범관계에 있는 공동피고인에 대해 검사 이외의 수사기관이 작성한 피의자신문조서는 그 공동피고인이 피의자신문조서에 기재된 것과 같은 내용으로 진술하였다는 취지로 증언하였더라도 당해 피고인이 공판기일에서 그 조서의 내용을 부인하면 증거능력이 부정된다.", true, "▸ 당해 피고인과 공범관계가 있는 다른 피의자에 대한 검사 이외의 수사기관 작성의 피의자신문조서는 그 피의자의 법정진술에 의하여 그 성립의 진정이 인정되더라도 당해 피고인이 공판기일에서 그 조서의 내용을 부인하면 증거능력이 부정된다. [2003도7185]", "전문법칙"],
["885", "★ 검사는 공동피고인으로서 甲을 절도죄로, 乙을 절도교사죄로 함께 기소하였다. 사법경찰관 작성의 甲에 대한 피의자신문조서에 대하여 乙이 부동의한 경우, 증인신문을 통해 원진술자인 甲이 그 성립을 인정하고 乙에게 반대신문권이 보장되며 특신상태가 인정되면 「형사소송법」제312조 제4항에 의하여 증거능력을 인정할 수 있다.", true, "▸ 甲과 乙은 공범 관계에 있으므로 제312조 제4항이 적용된다. 원진술자인 甲이 성립을 인정하고 乙에게 반대신문권이 보장되며 특신상태가 인정되면 증거능력이 인정된다.", "전문법칙"],
["886", "★ 甲과 乙은 합동하여 피해자를 상대로 손가방을 탈취한 날치기 합동강도 공소사실로 각 기소되었다. 甲의 손가방 탈취 범행의 관련하여, 자백 취지의 乙에 대한 사법경찰관 작성 피의자신문조서에 대해 甲이 법정에서 내용부인하더라도, 「형사소송법」제314조에 의해서 증거능력을 인정할 수 있다.", false, "▸ 피고인과 공범관계가 있는 다른 피의자에 대한 검사 이외의 수사기관 작성의 피의자신문조서는 해당 피고인이 공판기일에서 조서의 내용을 부인하면 증거능력이 부정되고, 이 경우 제314조도 적용되지 아니한다. [2003도7185]", "전문법칙"],
["887", "★ 피고인 甲이 사업주(실질적 경영귀속주체)인 사업체의 종업원 乙이 법규위반행위를 하여 甲이 양벌규정에 의하여 기소되고, 사법경찰관이 작성한 乙에 대한 피의자신문조서가 증거로 제출되었으나 甲이 이를 부동의하고 재판 진행 중 乙이 지병으로 사망한 경우, 위 피의자신문조서는 「형사소송법」제314조에 의하여 증거능력이 인정될 수 있다.", false, "▸ 乙과 甲 사이의 관계(양벌규정)도 공범 관계와 유사하게 보므로, 피고인이 공판기일에서 조서의 내용을 부인한 이상 제314조도 적용되지 아니한다. [2003도7185]", "전문법칙"],
["888", "★ 공동피고인 甲과 별개로 기소된 乙은 법정 이전에 경찰 수사단계에서 범행을 자백하는 자술서를 작성·제출하였고, 공판기일에 진술을 요하는 乙가 사망하여 위 자술서는 그 작성이 특히 신빙할 수 있는 상태에서 이루어진 경우에 해당한다면, 甲이 이를 증거로 사용함에 동의하지 않더라도 乙의 자술서는 증거로 사용할 수 있다.", true, "▸ 피고인이 아닌 자가 수사과정에서 작성한 진술서는 제312조 제5항 내지 제313조에 따르고 제314조가 적용 가능하다. 사망으로 진술 불능이고 특신상태가 인정되면 피고인의 동의 없이도 증거로 사용할 수 있다.", "전문법칙"],
["889", "乙가 경찰 수사단계에서 작성한 자술서는 피고인 이외의 자가 수사과정에서 작성한 진술서이므로 그 증거능력이 부정되고 형사소송법 제314조도 적용되지 아니한다.", false, "▸ 피고인 이외의 자가 수사과정에서 작성한 진술서는 제313조·제312조 제5항에 따르고 제314조가 적용 가능하다. 사망으로 진술 불능이고 특신상태가 인정되면 제314조에 의해 증거능력이 인정될 수 있다.", "전문법칙"],
["890", "★ 검찰에 송치되기 전에 검사가 구속피의자를 상대로 작성한 피의자신문조서라도 송치 후에 작성된 검사 작성의 피의자신문조서와 마찬가지로 취급된다.", false, "▸ 검찰에 송치되기 전에 구속피의자로부터 받은 검사 작성의 피의자신문조서는 송치 후에 작성된 피의자신문조서와 마찬가지로 취급하기는 어렵다. [94도1228]", "전문법칙"],
["891", "★ 검사 작성의 피의자신문조서에 작성자인 검사의 서명날인이 되어 있지 아니한 경우, 진술자인 피고인의 서명날인이 되어 있다거나 피고인이 법정에서 그 피의자신문조서에 대하여 진정성립과 임의성을 인정하더라도 해당 조서는 증거능력이 없다.", true, "▸ 검사 작성의 피의자신문조서에 작성자인 검사의 서명날인이 되어 있지 아니한 경우, 피고인의 서명날인이 있거나 피고인이 진정성립과 임의성을 인정하더라도 증거능력이 없다. [2001도4091, 검사 이외의 수사기관 작성 피의자신문조서도 동일 94도1735]", "전문법칙"],
["892", "★ 검사 작성 피의자신문조서의 증거능력 인정 요건인 '내용의 인정'은 그 기재 내용이 진술 내용대로 기재되어 있다는 것을 의미한다.", false, "▸ 개정된 형소법 제312조 제1항에서 '그 내용을 인정할 때'라 함은 피의자신문조서의 기재 내용이 진술 내용대로 기재되어 있다는 의미가 아니고, 그와 같이 진술한 내용이 실제 사실과 부합한다는 것을 의미한다. [2023도2102]", "전문법칙"],
["893", "★ 시청 건축 인·허가 담당 공무원 甲은 건축업자 乙로부터 뇌물로 1억 원을 받은 혐의로 검사 P가 甲과 乙을 대질신문하고 피의자신문조서를 작성하였다. 검사 P가 작성한 피의자신문조서 중 乙의 진술 부분은 甲이 부동의하더라도, 적법절차위반 등 다른 특별한 사정이 없는 한 「형사소송법」제314조의 요건을 충족하면 증거능력이 인정된다.", false, "▸ 검사가 작성한 피의자신문조서에 대해서는 검사 이외의 수사기관이 작성한 피의자신문조서와 동일하게 제314조는 적용될 여지가 없다고 본다. 피고인이 내용을 부인하는 경우 제314조에 의해 증거능력을 인정할 수 없다.", "전문법칙"],
["894", "★ 「형사소송법」제312조 제1항의 '검사가 작성한 피의자신문조서'란 당해 피고인에 대한 피의자신문조서만이 아니라 당해 피고인과 공범관계에 있는 다른 피고인이나 피의자에 대하여 검사가 작성한 피의자신문조서도 포함하는 개념으로서, 이때의 '공범'에는 대향범도 포함된다.", true, "▸ 제312조 제1항의 '검사가 작성한 피의자신문조서'에는 당해 피고인과 공범관계에 있는 다른 피고인이나 피의자에 대해 검사가 작성한 피의자신문조서도 포함되고, 이때 '공범'에는 대향범도 포함된다. [2023도3741]", "전문법칙"],
["895", "★ 甲과 乙은 공모하여 피해자의 자전거를 편취한 사기죄의 공범으로 함께 기소된 공동피고인이라면, 乙에 대한 검사 작성의 피의자신문조서는 적법한 절차와 방식에 따라 작성된 것으로서 乙이 법정에서 실질적 진정성립을 인정하고 임의성과 특신상태가 인정되며 甲에게 반대신문의 기회가 부여된 경우에는 甲이 이를 증거로 함에 부동의하였더라도 甲에 대한 유죄의 증거로 사용할 수 있다.", false, "▸ 피고인이 자신과 공범관계에 있는 다른 피고인이나 피의자에 대하여 검사가 작성한 피의자신문조서의 내용을 부인하는 경우에는 제312조 제1항에 따라 유죄의 증거로 쓸 수 없다. [2023도3741]", "전문법칙"],
["896", "★ 甲이 식당에 들어가 절도범행을 한 상황이 식당에 설치된 CCTV에 모두 녹화되었다. 검사가 위 CCTV 녹화기록을 증거로 제출하였는데, 제1심 법원이 공판기일에 CCTV에 대한 검증을 행한 경우, 그 검증결과가 바로 증거가 되는 것이고 그 검증의 결과를 기재한 검증조서가 서증으로서 증거가 되는 것은 아니다.", true, "▸ 수소법원이 공판기일에 검증을 행한 경우에는 그 검증결과 즉 법원이 오관의 작용에 의하여 판단한 결과가 바로 증거가 되고, 그 검증의 결과를 기재한 검증조서가 서증으로서 증거가 되는 것은 아니다. [2009도8949]", "전문법칙"],
["897", "★ 사법경찰관이 현장검증을 행하여 검증조서를 작성하였고, 검증조서에는 피고인이 乙에게 '네가 운전했다고 말해라'는 진술기재부분과 범행을 재연하는 사진이 첨부되어 있는데, 피고인이 법정에서 검증조서에 대해서만 증거로 함에 동의하고 진술기재부분과 재연사진에 대해서는 그 성립의 진정 및 내용을 부인하였다면, 검증조서에 기재된 진술기재부분과 재연사진을 제외한 검증조서의 나머지 부분에 대해서만 증거능력이 인정된다.", true, "▸ 피고인이 검증조서에 대해서만 증거동의하고 진술기재부분과 재연사진에 대해서는 부인하였으므로, 피고인이 동의한 검증조서의 나머지 부분에 대해서만 증거능력이 인정된다.", "전문법칙"],
["898", "★ 甲과 乙은 식당에서 피해자의 현금 10만 원을 절취하였고, 乙은 그 동안 망을 보았다. 사법경찰관이 식당 현장상황에 관하여 甲의 범행재연사진을 포함하여 검증조서를 작성하였다면, 그 검증조서 중 위 사진 부분은 비진술증거이므로 피고인 甲이 증거로 함에 동의하지 않았더라도 증거능력이 있다.", true, "▸ 검증조서 중 범행재연사진 부분은 비진술증거에 해당하여 전문법칙이 적용되지 않으므로, 피고인이 동의하지 않았더라도 증거능력이 인정될 수 있다.", "전문법칙"],
["899", "★ 사법경찰관 작성의 검증조서에 대하여 피고인이 증거로 함에 동의만 하였을 뿐 법정에서 검증조서에 기재된 진술내용 및 범행을 재연한 부분에 대하여 그 성립의 진정 및 내용을 인정하는 흔적을 찾아 볼 수 없고 오히려 이를 부인하고 있는 경우, 위 검증조서 중 범행에 부합되는 피고인의 진술을 기재한 부분이나 범행을 재연한 부분을 제외한 나머지 부분만을 증거로 채용하여야 한다.", true, "▸ [AI해설] 검증조서 중 피고인의 진술기재 부분과 범행재연 부분에 대해 피고인이 부인하는 경우 그 부분을 제외한 나머지 부분만 증거로 채용하여야 한다. [98도159]", "전문법칙"],
["900", "진술자의 진술내용을 보충하기 위해 검증조서나 감정서에 첨부된 사진은 진술증거의 일부를 이루는 보조수단으로 진술증거인 검증조서나 감정서와 일체로 증거능력이 판단된다.", true, "▸ 검증조서에는 검증목적물의 현상을 명확하게 하기 위하여 도화나 사진을 첨부할 수 있고(제49조 제2항), 이는 검증결과를 쉽게 이해하기 위한 것으로 검증조서와 일체를 이루므로 검증조서로서 증거능력이 인정된다. 감정서도 동일하다.", "전문법칙"],
["901", "★ 사인(私人)이 피고인 아닌 자의 진술을 녹음한 녹음테이프에 대하여 법원이 실시한 검증의 내용이, 녹음테이프에 녹음된 대화내용이 검증조서에 첨부된 녹취서에 기재된 내용과 같다는 것에 불과한 경우, 그 검증조서는 형사소송법 제311조의 '법원의 검증의 결과를 기재한 조서'에 해당하여 그 조서 중 위 진술내용은 위 제311조에 의하여 증거능력이 인정된다.", false, "▸ 녹음테이프 검증조서의 기재 중 피고인의 진술내용을 증거로 사용하기 위해서는 제313조 제1항 단서에 따라 공판준비 또는 공판기일에서 그 작성자인 피해자의 진술에 의하여 녹음테이프에 녹음된 피고인의 진술내용이 피고인이 진술한 대로 녹음된 것임이 증명되고 그 진술이 특히 신빙할 수 있는 상태하에서 행하여진 것임이 인정되어야 한다. [2005도2945]", "전문법칙"],
["902", "★ 사법경찰관이 작성한 수사보고서 안에 검증의 결과에 해당하는 기재가 있는 경우 이 부분은 「형사소송법」제312조 제6항의 '검사 또는 사법경찰관이 검증의 결과를 기재한 조서'에 해당한다.", false, "▸ 수사보고서 안에 검증의 결과에 해당하는 기재가 있더라도 이를 제312조의 '검사 또는 사법경찰관이 검증의 결과를 기재한 조서'라고 할 수 없을 뿐만 아니라 제313조의 진술서나 그 진술을 기재한 서류라고 할 수도 없고, 제311조, 제315조, 제316조의 적용대상도 아니므로 그 기재 부분은 증거로 할 수 없다. [2000도2933]", "전문법칙"],
["903", "★ 사법경찰관 사무취급이 작성한 실황조서가 사고발생 직후 사고장소에서 긴급을 요하여 판사의 영장없이 시행된 것으로서 제216조 제3항에 의한 검증에 따라 작성된 것이라면 사후영장을 받지 않는 한 유죄의 증거로 삼을 수 없다.", true, "▸ [AI해설] 사후영장을 받지 않은 검증조서는 유죄의 증거로 삼을 수 없다. [88도1399]", "전문법칙"],
["904", "★ 甲은 강제집행면탈죄 및 특수절도죄로, 乙은 특수절도죄로 각 기소되어 함께 재판받고 있다. 乙은 피의자신문과정에서 '甲이 허위의 채무를 부담하여 허위의 채권양도계약을 체결하는 것을 목격하였다'고 진술하였는데, 이러한 진술이 기재된 경찰 작성의 乙에 대한 피의자신문조서는 「형사소송법」제312조 제3항이 적용되어 당해 피고인인 甲이 공판기일에서 내용을 부인하는 이상 甲의 강제집행면탈에 대한 증거로 쓸 수 없다.", false, "▸ 乙은 甲에 대한 강제집행면탈죄 공소사실에 대해서는 공범이 아니므로, 사법경찰관이 작성한 乙에 대한 피의자신문조서는 실질적으로 참고인 진술조서에 해당하여 제312조 제4항이 적용된다. 제312조 제3항이 아니라 제4항이 적용된다.", "전문법칙"],
["905", "★ 「형사소송법」에서 사법경찰관과 검사가 작성한, 참고인에 대한 참고인 진술조서의 증거능력 인정요건은 동일하지 않다.", false, "▸ 현재는 참고인에 대한 진술조서뿐만 아니라 피의자신문조서의 경우에도 검사와 사법경찰관의 차이가 없다. 사법경찰관 작성 참고인 진술조서와 검사 작성 참고인 진술조서 모두 제312조 제4항이 적용된다.", "전문법칙"],
["906", "★ 수사기관이 진술자의 성명을 '가명'으로 기재하여 조서를 작성하였다고 해서 그 이유만으로 그 조서가 '적법한 절차와 방식'에 따라 작성되지 않았다고 할 것은 아니다.", true, "▸ 수사기관이 진술자의 성명을 '가명'으로 기재하여 조서를 작성하였다고 해서 그 이유만으로 그 조서가 '적법한 절차와 방식'에 따라 작성되지 않았다고 할 것은 아니다. [2011도7757]", "전문법칙"],
["907", "★ 甲은 이중매매를 교사하거나 적극 가담한 경우에 해당하고, 丙은 甲과 乙 사이의 매매계약 사실을 모른 채 위 아파트를 매수하였다면 丙에 대한 사법경찰관 작성의 진술조서는 甲이 내용을 부인하면 증거능력이 없다.", true, "▸ 丙이 甲과 乙 사이의 위 매매계약 사실을 모른 채 위 아파트를 매수하였다면 丙은 공범이 아니므로 제312조 제4항이 적용된다. 甲이 내용을 부인하면 성립의 진정이 인정되지 않아 증거능력이 없다. [2010도7624]", "전문법칙"],
["908", "★ 「형사소송법」제312조 제4항의 '기재 내용이 원진술자가 진술한 대로 기재된 것이라 함'은 조서 작성 당시 원진술자의 진술대로 기재되었는지의 여부만을 의미하는 것으로, 이와 같이 진술하게 된 연유나 그 진술의 신빙성 여부는 고려할 것이 아니다.", true, "▸ 「형사소송법」제312조 제4항의 '기재 내용이 원진술자가 진술한 대로 기재된 것이라 함'은 조서 작성 당시 원진술자의 진술대로 기재되었는지의 여부만을 의미하고, 이와 같이 진술하게 된 연유나 그 진술의 신빙성 여부는 고려할 것이 아니다. [2005도1849]", "전문법칙"],
["909", "★ 검사가 작성한 참고인진술조서에 대하여 피고인이 증거로 함에 부동의한 경우, 진술자가 법정에서 검사나 재판장의 신문에 대하여 수사기관에서 사실대로 진술하였다는 취지로 증언하더라도, 원진술자가 그 진술기재의 내용을 열람하거나 고지받지 못한 채로 그와 같이 증언한 것이라면 그 진술조서는 증거능력이 없다.", true, "▸ [AI해설] 원진술자가 진술기재의 내용을 열람하거나 고지받지 못한 채로 '사실대로 진술하였다'고 증언한 경우 진술한 대로 기재된 것의 증명이 없으므로 증거능력이 없다. [94도1384]", "전문법칙"],
["910", "★ 증인이 검사가 작성한 자신에 대한 진술조서의 일부에 대하여만 성립의 진정을 인정하는 것은 허용되지 않는다.", false, "▸ 진술한 대로 기재되어 있다고 하는 부분에 한하여 증거능력의 다른 요건을 심사하면 된다고 할 것이고, 그 밖에 실질적 진정성립이 부정되는 부분에 대해서는 증거능력을 부정하여야 한다. 즉, 일부에 대하여만 성립의 진정을 인정하는 것도 허용된다. [2010도15499]", "전문법칙"],
["911", "★ 피고인 아닌 자의 진술을 기재한 조서에 대한 실질적 진정성립을 증명할 수 있는 수단인 '영상녹화물'은 「형사소송법」 및 「형사소송규칙」에 규정된 방식과 절차에 따라 제작되어 조사 신청된 영상녹화물을 의미한다.", true, "▸ 제312조 제4항에서 규정한 '영상녹화물이나 그 밖의 객관적인 방법'에서의 '영상녹화물'은 형사소송법 및 형사소송규칙에 규정된 방식과 절차에 따라 제작되어 조사 신청된 영상녹화물을 의미한다. [2022도364]", "전문법칙"],
["912", "★ 피해자의 진술을 영상녹화한 사법경찰관이 사전에 영상녹화에 동의한다는 취지의 서면 동의서를 받지 않았고, 피해자가 자신의 진술조서를 열람하는 도중 영상녹화가 중단되어 조서 열람과정 일부와 조서에 기명날인 또는 서명을 마치는 과정이 녹화되지 않았다면, 그와 같은 영상녹화물에 의하여는 특별한 사정이 없는 한 피고인 아닌 자의 진술을 기재한 조서의 실질적 진정성립을 증명할 수 없다.", true, "▸ 수사기관이 작성한 피고인이 아닌 자의 진술을 기재한 조서에 대하여 실질적 진정성립을 증명하기 위해 영상녹화물의 조사를 신청하려면 사전 서면 동의서를 받고 조사 전 과정이 영상녹화되어야 하는바, 이를 위반한 영상녹화물로는 진정성립을 증명할 수 없다. [2022도364]", "전문법칙"],
["913", "★ '영상녹화물이나 그 밖의 객관적인 방법'이란 피고인의 진술을 과학적·기계적·객관적으로 재현해 낼 수 있는 방법만을 의미하고, 그 외에 조사관 또는 조사 과정에 참여한 통역인 등의 증언은 이에 해당한다고 볼 수 없다.", true, "▸ '영상녹화물이나 그 밖의 객관적인 방법'이란 피고인의 진술을 과학적·기계적·객관적으로 재현해 낼 수 있는 방법만을 의미하고, 조사관 또는 조사 과정에 참여한 통역인 등의 증언은 이에 해당한다고 볼 수 없다. [2015도16586]", "전문법칙"],
["914", "★ 검사 작성의 참고인진술조서의 증거능력이 인정되기 위해서는 피고인 또는 변호인이 공판준비 또는 공판기일에 그 기재 내용에 관하여 원진술자를 신문할 수 있어야 하지만, 이 경우 피고인 또는 변호인의 반대신문이 실제로 행해져야 하는 것은 아니다.", true, "▸ 제312조 제4항의 요건으로서 반대신문 기회가 보장되어야 하지만, 실제로 반대신문이 행해져야 하는 것은 아니고 기회가 보장되면 된다.", "전문법칙"],
["915", "★ 피해자가 변호인의 반대신문을 절반가량 남겨둔 상황에서 속행된 증인신문기일에 출석하지 않고 이후 소재불명이 되어 피고인 측에 반대신문의 기회는 제공되었으나 반대신문사항을 모두 신문하지 못한 때에는 실질적 반대신문의 기회가 부여되지 않았으므로 수사기관이 작성한 피해자에 대한 진술조서의 증거능력은 인정되지 않는다.", true, "▸ 반대신문을 절반가량 남겨둔 상황에서 소재불명이 된 경우는 '피고인 또는 변호인이 공판기일에 그 기재 내용에 관하여 피해자를 신문할 수 있었던 때'의 요건을 갖추지 못하여 전문법칙의 예외를 인정할 수 없다. [2016도17054]", "전문법칙"],
["916", "★ 「형사소송법」제312조 제4항의 '특히 신빙할 수 있는 상태'란 그 진술내용이나 조서의 작성에 허위개입의 여지가 거의 없고, 그 진술내용의 신용성이나 임의성을 담보할 구체적이고 외부적인 정황이 있는 경우를 말하며 검사가 엄격한 증명을 통해 증명하여야 한다.", false, "▸ '특히 신빙할 수 있는 상태'는 증거능력의 요건에 해당하므로 검사가 그 존재에 대하여 구체적으로 주장·증명하여야 하지만, 이는 소송상의 사실에 관한 것이므로 엄격한 증명을 요하지 아니하고 자유로운 증명으로 족하다. [2012도2937]", "전문법칙"],
["917", "★ 검사가 아동인 피해자의 진술내용에 대하여 대검찰청 과학수사부 소속 진술분석관에게 분석을 의뢰하여 진술분석관이 피해자를 면담하고 그 내용을 녹화한 영상녹화물은, 수사과정 외에서 작성된 것이라고 볼 수 없으므로 「형사소송법」제313조 제1항에 따라 증거능력을 인정할 수 없으나, 수사기관이 작성한 피고인이 아닌 자의 진술을 기재한 조서로 볼 수 있으므로 「형사소송법」제312조에 의하여 증거능력을 인정할 수 있다.", false, "▸ 이 사건 영상녹화물은 수사과정 외에서 작성된 것이라고 볼 수 없으므로 형소법 제313조 제1항에 따라 증거능력을 인정할 수 없고, 수사기관이 작성한 피의자신문조서나 피고인이 아닌 자의 진술을 기재한 조서가 아니고 진술서도 아니므로 제312조에 의하여 증거능력을 인정할 수도 없다. [2023도15133]", "전문법칙"],
["918", "★ 참고인이 수사과정에서 진술서를 작성하였지만 수사기관이 그에 대한 조사과정을 기록하지 아니한 경우에는, 특별한 사정이 없는 한 수사과정에서 진술서가 작성되었다 할 수 없으므로 증거능력을 인정할 수 없다.", true, "▸ [AI해설] 수사기관이 조사과정을 기록하지 않은 경우, 특별한 사정이 없는 한 수사과정에서 진술서가 작성되었다고 볼 수 없으므로 증거능력이 없다. [2022도9510]", "전문법칙"],
["919", "★ 「형사소송법」제312조 제5항의 적용 대상인 '수사과정에서 작성한 진술서'란 수사가 시작된 이후에 수사기관의 관여 아래 수사관서 내에서 작성된 것을 말하므로, 수사관서 이외의 장소에서 수사기관의 요청에 따라 피의자가 작성한 진술서는 수사과정에서 작성한 진술서에 해당하지 않는다.", false, "▸ 제312조 제5항의 적용대상인 '수사과정에서 작성한 진술서'란 수사가 시작된 이후에 수사기관의 관여 아래 작성된 것이거나, 개시된 수사와 관련하여 수사과정에 제출할 목적으로 작성한 것으로, 명칭이나 작성된 장소 여부를 불문한다. [2022도9510]", "전문법칙"],
["920", "★ 검사가 제출한 증거 중 고발장에 대하여 피고인 및 변호인이 부동의 의견을 밝히고, 같은 고발장이 첨부된 검찰주사보 작성의 수사보고에 대하여는 증거동의를 하여 증거조사가 이루어진 경우, 수사보고에 대한 증거동의의 효력은 첨부된 고발장에도 당연히 미치므로 위 고발장을 유죄의 증거로 삼을 수 있다.", false, "▸ 변호인이 고발장을 증거로 함에 부동의하면서도 같은 고발장을 첨부문서로 포함하고 있는 수사보고서에 대하여는 증거동의한 경우, 위 고발장은 유죄의 증거로 삼을 수 없다. [2011도3809]", "전문법칙"],
["921", "★ 甲이 강간행을 인정하는 내용의 메모지를 자필로 작성하였는데, 그 메모지가 증거로 제출된 경우, 甲이 그 성립의 진정을 부인하면 필적감정에 의하여 성립의 진정함이 증명되더라도 증거로 사용할 수 없다.", false, "▸ 피고인이 자필로 작성한 진술서는 작성자 또는 진술자의 자필이거나 그 서명 또는 날인이 있는 것이므로 제313조 제1항에 해당한다. 피고인이 진정성립을 부인하는 경우에도 객관적 방법으로 성립의 진정함이 증명되면 증거로 할 수 있다(제313조 제2항).", "전문법칙"],
["922", "★ 변호사 甲이 의뢰인 乙을 안심시키기 위해 '민형사상 아무런 문제가 되지 않는다'는 내용의 법률의견서를 작성해 주었다. 위 법률의견서는 「형사소송법」제313조에서 정한 '피고인 아닌 자가 작성한 진술서나 그 진술을 기재한 서류'에 해당한다.", true, "▸ 압수된 디지털 저장매체로부터 출력한 문건으로서 그 실질에 있어 제313조 제1항에 규정된 '피고인 아닌 자가 작성한 진술서나 그 진술을 기재한 서류'에 해당한다. [2009도6788]", "전문법칙"],
["923", "★ 사법경찰관이 적법한 압수·수색영장에 근거하여 변호사의 법률의견서를 압수한 경우, 위 법률의견서는 위법수집증거라고 할 수 없다.", true, "▸ 법률의견서는 변호사가 업무상 위탁을 받은 관계로 알게 된 타인의 비밀에 관한 것이지만, 사법경찰관이 적법한 압수·수색영장에 근거하여 압수하였다면 위법수집증거라고 할 수 없다. [2009도6788]", "전문법칙"],
["924", "★ 공판기일에 변호사가 법률의견서의 진정성립 등에 관하여 형사소송법 제149조에 따라 정당하게 증언거부권을 행사한 경우에는 형사소송법 제314조에 의하여 법률의견서의 증거능력을 인정할 수 없다.", true, "▸ 공판기일에 변호사가 법률의견서의 진정성립 등에 관하여 제149조에 따라 정당하게 증언거부권을 행사한 경우에 해당하므로, 제314조에 의하여 법률의견서의 증거능력을 인정할 수 없다. [2009도6788]", "전문법칙"],
["925", "★ 조세범칙조사를 담당하는 세무공무원이 피고인이 된 혐의자 또는 참고인에 대하여 심문한 내용을 기재한 조서는 피고인 또는 피고인이 아닌 자가 작성한 진술서나 그 진술을 기재한 서류에 해당하므로 「형사소송법」제313조에 따라 증거능력의 존부를 판단하여야 한다.", true, "▸ 조세범칙조사를 담당하는 세무공무원이 작성한 조서는 제313조에 따라 공판준비 또는 공판기일에서 작성자·진술자의 진술에 따라 성립의 진정함이 증명되고 특히 신빙할 수 있는 상태 아래에서 행하여진 때에 한하여 증거능력이 인정된다. [2022도8824]", "전문법칙"],
["926", "★ 검찰주사보가 甲의 특수절도 사건의 피해자 乙과의 전화대화내용을 문답형식의 수사보고서로 작성하였다면, 수사보고서는 전문증거로서 「형사소송법」제313조가 적용되는데 수사보고서에 진술자 乙의 서명 또는 날인이 없으므로 증거능력이 없다.", true, "▸ 수사보고서(참고인 전화진술)는 형소법 제313조 제1항 본문에 정한 '피고인 아닌 자의 진술을 기재한 서류'인 전문증거에 해당하나, 그 진술자의 서명 또는 날인이 없을 뿐만 아니라 공판기일에서 진술자의 진술에 의해 성립의 진정함이 증명되지도 않았으므로 증거능력이 없다. [2010도5610]", "전문법칙"],
["927", "★ 감정인이 법원의 명에 의하여 감정을 하고 그 감정결과를 기재한 감정서는 직무상 증명할 수 있는 사항에 관하여 작성한 문서이므로 피고인이 증거로 함에 부동의하더라도 당연히 증거능력이 있다.", false, "▸ 국립과학수사연구소장 작성의 필적감정의뢰 회보는 당연히 증거능력이 있는 서류라고 할 수 없고, 피고인이 증거로 함에 동의하지 않는 한 제313조에 따라 공판기일에서 작성자인 감정인의 진술에 의하여 그 성립의 진정함이 증명되는 때에 한하여 증거능력을 가진다(99도4036). 제313조 제3항이 적용된다.", "전문법칙"],
["928", "★ 검사는 乙을 살인죄로 기소하였다. 乙의 친구 丙가 법정에 출석하여 乙로부터 '자신이 피해자를 살해하였다'는 이야기를 들은 적이 있다고 진술한 경우, 원진술자인 乙이 법정에 출석하여 있는 한 丙의 진술은 유죄의 증거로 사용될 수 없다.", false, "▸ 피고인 아닌 자(丙)의 진술이 피고인(乙)의 진술을 내용으로 하는 전문진술이므로 제316조 제1항이 적용되어 피고인(乙)의 진술이 특신상태하에서 행하여졌음이 증명된 때에 한하여 증거로 할 수 있고, 진술불능을 요하지 않는다. 乙이 법정에 출석해 있더라도 특신상태가 증명되면 사용 가능하다.", "전문법칙"],
["929", "★ 수사관 丙가 법정에서 '甲이 수사과정에서 범행을 자백하였다'라고 진술하였을 경우, 甲의 진술이 특히 신빙할 수 있는 상태하에서 행하여졌음이 증명되면, 丙의 법정진술을 甲에 대한 유죄의 증거로 사용할 수 있다.", true, "▸ 수사관의 법정진술은 피고인의 진술을 내용으로 하는 전문진술이므로 특신상태 요건이 충족되면 증거로 사용할 수 있다(제316조 제1항). [조사자 증인]", "전문법칙"],
["930", "甲 종중의 대표자 乙이 친구 丙에게 '甲 종중은 피고인에게 ×토지에 관한 명의신탁을 한 적이 없다'고 이야기하였고, 丙가 제1심 공판절차에 증인으로 출석하여 乙로부터 위 내용을 들었다는 취지의 진술 중 乙의 진술을 내용으로 하는 부분은 피고인 아닌 자의 피고인 아닌 자의 진술을 내용으로 하는 것이므로, 진술불능 요건과 특신상태 요건을 갖추면 증거능력이 인정된다.", true, "▸ 丙의 법정진술 중 乙의 진술을 내용으로 하는 부분은 피고인 아닌 자(丙)의 피고인 아닌 자(乙)의 진술을 내용으로 하는 전문진술이므로, 제316조 제2항이 적용되어 진술불능 요건과 특신상태 요건을 갖추면 증거능력이 인정된다.", "전문법칙"],
["931", "甲이 피해자 乙(만 17세)을 강간하였고, 乙은 丙(乙의 부모)에게 강간피해사실을 알렸는데, 甲의 제1심 공판절차에 증인으로 출석하여 乙이 丙에게 한 진술이 특히 신빙할 수 있는 상태에서 행하여졌다면 丙의 위 증언은 증거능력이 있다.", true, "▸ 丙의 증언은 피고인 아닌 乙의 진술을 내용으로 하는 전문진술이므로 형소법 제316조 제2항에 따라 진술불능 요건 및 특신상태 요건을 충족하여야 한다. 乙이 정상적인 진술이 전혀 불가능한 정도의 심각한 정신병으로 출석할 수 없었다면 진술불능 요건이 충족되고, 특신상태 요건도 충족되면 증거능력이 있다.", "전문법칙"],
["932", "★ 검사는 공동피고인으로서 甲을 절도죄로, 乙을 절도교사죄로 함께 기소하였다. 丙가 법정에서 '甲으로부터 乙이 교사하였다는 이야기를 들었다'고 진술한 경우, 乙에 대한 공판절차에서 丙의 법정진술은 「형사소송법」제316조 제2항의 요건이 인정되어야 증거능력이 인정되는데, 원진술자인 甲이 공동피고인으로서 법정에 출석하여 있으므로 원진술자가 진술을 할 수 없는 상태라고 볼 수 없어 乙이 동의하지 않는 한 丙의 법정진술은 증거능력이 없다.", true, "▸ 丙의 법정진술은 피고인 아닌 자(丙)의 피고인 아닌 자(甲)의 진술을 내용으로 하는 전문진술로 제316조 제2항이 적용된다. 원진술자인 甲이 공동피고인으로서 법정에 출석하고 있으므로 진술불능 요건에 충족되지 않아 乙이 동의하지 않는 한 증거능력이 없다.", "전문법칙"],
["933", "★ 위 사례에서 丙가 검찰에서 참고인으로 출석하여 '甲으로부터 乙이 절도를 시켰다는 이야기를 들었다'고 진술한 경우, 위 참고인진술조서는 재전문진술이 기재된 조서에 해당하므로 乙이 동의하지 않는 한 乙에 대하여 증거능력이 인정되지 않는다.", true, "▸ 위 참고인진술조서는 재전문진술이 기재된 조서가 아니라 제312조 제4항 및 제316조 제2항의 요건을 모두 갖추어야 증거능력이 인정되는 전문진술 기재 조서이다. 피고인 乙에 대하여는, 원진술자인 甲이 법정에 출석하고 있으므로 진술불능 요건에 충족되지 않아 乙이 동의하지 않는 한 증거능력이 없다.", "전문법칙"],
["934", "★ 전문진술이 기재된 조서는 「형사소송법」제312조 또는 제314조의 규정의 요건과 「형사소송법」제316조의 규정의 요건을 갖추는 경우 증거능력이 인정된다.", true, "▸ 전문진술이 기재된 조서는 제312조 또는 제314조의 규정 및 제316조에 해당하는 각 증거능력 인정요건을 모두 갖추는 경우 예외적으로 증거능력이 인정된다. [2000도159]", "전문법칙"],
["935", "★ 재전문진술이나 재전문진술을 기재한 조서에 대하여는 피고인이 증거로 하는 데 동의하더라도 이를 증거로 할 수 없다.", false, "▸ 형소법은 재전문진술이나 재전문진술을 기재한 조서에 대하여 증거능력을 인정하는 규정을 두고 있지 아니하나, 피고인이 증거동의하면 재전문증거도 증거로 할 수 있다. [2000도159]", "전문법칙"],
["936", "★ 甲의 ㄴ 범죄사실에 대하여 제출된 乙에 대한 검사 작성의 피의자신문조서에 '丙으로부터 甲이 절도를 하였다는 말을 들었습니다'라는 내용이 기재되어 있는 경우, 丙이 이 사건 법정에 증인으로 출석하여 '甲이 절도를 하는 것을 보았고, 이 이야기를 乙에게 하였습니다'라는 내용으로 증언하였더라도 이 조서는 증거능력이 없다.", true, "▸ 위 조서는 피고인 아닌 자(乙)의 진술이 피고인 아닌 자(丙)의 진술을 내용으로 하는 전문진술이 기재된 조서에 해당하여, 제316조 제2항 및 제312조의 요건을 모두 갖추어야 한다. 사안에서 丙이 법정에 출석하고 있으므로 제316조 제2항의 진술불능 요건을 갖추지 못하여 증거능력이 없다.", "전문법칙"],
["937", "★ 甲과 乙은 丙과 공모하여 피해자로부터 금품을 갈취하였다. 丙은 경찰 수사 단계에서 범행을 자백하는 취지의 진술서를 작성한 이후 갑자기 사망하였고, 이에 검사는 丙의 동생인 丁가 丙으로부터 '나는 甲, 乙과 함께 피해자의 금품을 갈취하였다'라는 말을 들었다는 것을 알고 丁를 조사하여 그와 같은 내용의 丁에 대한 진술조서를 작성한 경우, 丁에 대한 진술조서는 재전문진술이 기재된 서류이므로 乙이 증거동의하더라도 乙에 대한 유죄 인정의 증거로 사용할 수 없다.", false, "▸ 검사와 피고인이 증거로 할 수 있음을 동의한 서류 또는 물건은 진정한 것으로 인정한 때에는 증거로 할 수 있다(제318조 제1항). 증거동의하면 재전문진술이 기재된 서류도 증거로 할 수 있다. [2000도159]", "전문법칙"],
["938", "★ 「형사소송법」제314조의 적용에 있어서 증인이 소재불명이거나 그 밖에 이에 준하는 사유로 인하여 진술할 수 없는 때에 해당한다고 법원이 인정할 수 있으려면 증인의 법정 출석을 위한 가능하고도 충분한 노력을 다하였음에도 부득이 증인의 법정 출석이 불가능하게 되었다는 사정을 검사가 입증하여야 한다.", true, "▸ 법원이 소재불명 등의 사유로 진술할 수 없는 때에 해당한다고 인정하려면 검사가 증인의 법정 출석을 위한 가능하고도 충분한 노력을 다하였음에도 부득이 출석이 불가능하게 되었다는 사정을 입증하여야 한다. [2013도1435]", "전문법칙"],
["939", "★ 甲은 乙를 살해하였다. 사법경찰관 丙는 우연히 이를 목격한 행인 丁를 조사하고 진술조서를 작성하였다. 甲이 丁에 대한 진술조서를 증거로 함에 동의하지 않은 경우라도 위 진술조서에 기재된 丁의 주소로 보낸 증인소환장이 주소불명으로 송달되지 않자 검사가 증인신청을 철회하였다면, 위 진술조서를 甲에 대한 유죄 인정의 증거로 사용할 수 있다.", false, "▸ 소환장이 주소불명 등으로 송달불능이 되어 소재탐지촉탁까지 하여 소재수사를 하였는데도 소재를 확인할 수 없는 경우라야 제314조에 해당하고, 단지 소환장이 주소불명으로 송달불능되었다는 것만으로는 이에 해당한다고 보기에 부족하다. [2010도2602]", "전문법칙"],
["940", "★ 소재탐지촉탁을 하여 소재수사를 하였으나 그 소재를 확인할 수 없는 경우라도, 진술조서에 기재된 증인의 전화번호로 연락하여 보지 아니하였다면 법정 출석을 위한 가능하고도 충분한 노력을 다하지 않은 경우이므로 형사소송법 제314조에서 정한 '진술을 요하는 자가 소재불명 그 밖에 이에 준하는 사유로 인하여 진술할 수 없는 때'에 해당한다.", false, "▸ 소재탐지촉탁을 하여 소재탐지불능보고서가 제출되었더라도 기록에 나타난 전화번호로 연락하였다는 사정이 없는 경우에는 제314조의 소재불명 등에 해당한다고 인정할 수 없다. [2013도1435]", "전문법칙"],
["941", "★ 법원의 소환에 계속하여 불응하고 구인장도 집행되지 않아 丁에 대한 법정에서의 신문이 불가능한 경우, 검사가 丁에 대한 구인장의 강제력에 기하여 丁의 법정 출석을 위한 가능하고도 충분한 노력을 다하였음에도 불구하고 부득이 丁의 법정 출석이 불가능하게 되었다는 사정을 입증하더라도 위 진술조서를 甲에 대한 유죄 인정의 증거로 사용할 수 없다.", false, "▸ 법원의 소환에 계속 불응하고 구인하여도 구인장이 집행되지 아니하는 등 법정에서의 신문이 불가능한 상태의 경우에는 제314조 소정의 '공판정에 출정하여 진술을 할 수 없는 때'에 해당하므로 증거로 사용할 수 있다. [2000도1765]", "전문법칙"],
["942", "★ 丁가 甲에 대한 공문서부정행사 정식재판에 증인으로 소환받고도 출산을 앞두고 있다는 이유로 출석하지 아니한 경우, 甲이 증거부동의한 丁에 대한 사법경찰관 작성 진술조서는 「형사소송법」제314조에 의하여 증거능력이 인정될 수 없다.", true, "▸ 출산을 앞두고 있다는 이유만으로는 제314조의 '진술할 수 없는 때'에 해당한다고 볼 수 없으므로 제314조에 의한 증거능력이 있다고 할 수 없다. [99도915]", "전문법칙"],
["943", "★ 甲은 피해자 乙(만 17세)을 강간하였고, 검사는 乙에 대한 진술조서를 작성하고 그 진술조서를 증거로 제출하였다(검사는 乙을 증인으로 신청했지만, 乙은 정상적인 진술이 전혀 불가능한 정도의 심각한 정신병으로 출석할 수 없었다). 乙에 대한 검사 작성의 진술조서는 乙의 진술이 특히 신빙할 수 있는 상태에서 행하여졌다면 증거능력이 있다.", true, "▸ 乙은 정상적인 진술이 전혀 불가능한 정도의 심각한 정신병으로 출석할 수 없었으므로 제314조의 '질병'으로 인하여 진술할 수 없는 때에 해당한다. 특신상태 요건을 갖추면 증거능력이 인정된다.", "전문법칙"],
["944", "★ 피고인이 증거서류의 진정성립을 묻는 검사의 질문에 대하여 진술거부권을 행사하였는데, 이는 「형사소송법」제314조의 '그 밖에 이에 준하는 사유로 인하여 진술할 수 없는 때'에 해당한다.", false, "▸ 증거서류의 진정성립을 묻는 검사의 질문에 대하여 진술거부권을 행사하여 진술을 거부한 경우는 형소법 제314조의 '그 밖에 이에 준하는 사유로 인하여 진술할 수 없는 때'에 해당하지 아니한다. [2012도16001]", "전문법칙"],
["945", "★ 수사기관에서 진술한 참고인이 법정에서 증언을 거부하여 피고인이 반대신문을 못한 경우에는 정당하게 증언거부권을 행사한 것이 아니라도, 피고인이 증인의 증언거부 상황을 초래하였다는 등의 특별한 사정이 없는 한 제314조의 '그 밖에 이에 준하는 사유로 인하여 진술할 수 없는 때'에 해당하지 않는다.", false, "▸ 수사기관에서 진술한 참고인이 법정에서 증언을 거부하여 피고인이 반대신문을 못한 경우에는 정당하게 증언거부권을 행사한 것이 아니라도, 피고인이 증언거부 상황을 초래하였다는 등의 특별한 사정이 없는 한 제314조의 적용을 배제할 이유가 없다. [2018도13949]", "전문법칙"],
["946", "★ 유죄판결이 확정되었음에도 정당한 이유 없이 출석하지 아니한 경우에는, 피고인이 증인의 증언거부 상황을 초래하였다는 등의 특별한 사정이 없는 한 제314조의 '그 밖에 이에 준하는 사유로 인하여 진술할 수 없는 때'에 해당하지 않는다.", true, "▸ 유죄판결이 확정된 증인이 정당한 이유 없이 출석하지 않는 경우, 특별한 사정이 없는 한 제314조의 '그 밖에 이에 준하는 사유로 인하여 진술할 수 없는 때'에 해당하지 않는다고 본다.", "전문법칙"],
["947", "★ 수사기관에서 丁이 가명으로 서명·날인하였고, 재판장은 丁에게 증언거부권이 있음을 고지하였다. 丁이 증언을 거부하여도 「형사소송법」제314조에 따라 특신상태가 증명되면 丁의 진술조서는 증거능력이 인정된다.", false, "▸ 법정에 출석한 증인이 형소법 제148조, 제149조 등에서 규정된 정당한 이유에 따라 정당하게 증언거부권을 행사하여 증언을 거부한 경우는 형소법 제314조의 '그 밖에 이에 준하는 사유로 인하여 진술할 수 없는 때'에 해당하지 아니한다. [2009도6788]", "전문법칙"],
["948", "★ 甲과 乙은 丙과 공모하여 피해자로부터 금품을 갈취하였다. 丙은 경찰 수사 단계에서 범행을 자백하는 취지의 진술서를 작성한 이후 갑자기 사망하였고, 이에 검사는 丙의 동생인 丁가 丙으로부터 '나는 甲, 乙과 함께 피해자의 금품을 갈취하였다'라는 말을 들었다는 것을 알고 丁를 조사하여 그와 같은 내용의 丁에 대한 진술조서를 작성한 경우, 丁에 대한 진술조서는 丁가 증언을 거부하여 진정성립이 인정되지 않더라도 丙이 사망하여 진술할 수 없는 경우에 해당하므로 甲에 대한 유죄 인정의 증거로 사용할 수 있다.", false, "▸ 丁에 대한 진술조서 중 丙의 진술을 내용으로 하는 부분은 전문진술이 기재된 조서에 해당하여 제312조 제4항 및 제316조 제2항의 요건을 모두 갖추어야 한다. 丁가 증언을 거부한 것은 제314조 진술불능에 해당하지 않으므로 증거로 사용할 수 없다.", "전문법칙"],
["949", "★ 甲은 피해자 乙(만 17세)을 강간하였고, 乙의 부(父) 丙는 甲에게 乙이 강간당했다는 이야기를 들었는데, 검사는 甲이 강간사실을 인정하고 사죄하였다는 취지의 丙에 대한 진술조서를 작성하였다. 丙가 甲에 대한 공소기 전에 사망하였다면, 丙에 대한 검사 작성의 진술조서 중 '甲이 乙에 대한 강간행위를 시인하였다'는 부분은 甲이 丙에게 한 진술 및 丙의 검찰 진술이 특히 신빙할 수 있는 상태에서 행하여졌다면 증거능력이 있다.", true, "▸ 위 진술조서 중 해당 부분은 피고인 아닌 자(丙)의 진술이 피고인(甲)의 진술을 내용으로 하는 전문진술이 기재된 조서로 제312조 제4항 및 제316조 제1항의 요건을 모두 충족하여야 한다. 丙가 사망하여 제314조 진술불능 요건이 충족되었고, 특신상태 요건도 충족되면 증거능력이 인정된다.", "전문법칙"],
["950", "★ 수사기관에서 피해자인 유아가 공판정에서 진술을 하였으나 증인신문 당시 대부분의 사항에 관하여 기억이 나지 않는다는 취지로 진술하여 수사기관에서 행한 진술이 재현 불가능하게 된 경우 「형사소송법」제314조에서 규정한 '진술을 요하는 자가 사망·질병·외국거주·소재불명, 그 밖에 이에 준하는 사유로 인하여 진술할 수 없는 때'에 해당한다.", true, "▸ 피해자인 유아가 법정에서 기억이 나지 않는다는 취지로 진술하여 수사기관에서 행한 진술이 재현 불가능하게 된 경우 제314조의 '그 밖에 이에 준하는 사유로 인하여 진술할 수 없는 때'에 해당한다. [2005도9561]", "전문법칙"],
["951", "★ 피고인 아닌 자의 공판기일에서의 진술이 피고인 아닌 타인의 진술을 그 내용으로 하는 경우 「형사소송법」제316조 제2항이 요구하는 특히 신빙할 수 있는 상태하에서 행하여졌음에 대한 증명은 단지 그러한 개연성이 있다는 정도로는 부족하고 합리적인 의심의 여지를 배제하는 정도에 이르러야 한다.", true, "▸ 제316조 제2항의 특신상태 요건 증명은 단지 개연성이 있다는 정도로는 부족하고 합리적인 의심의 여지를 배제하는 정도에 이르러야 한다. [2015도12981]", "전문법칙"],
["952", "사법경찰관 丙가 '내가 乙를 강간하였다'는 甲의 말을 조사 과정에서 들었다고 공판정에서 진술했다고 하더라도, 甲의 진술은 변호인의 동석 없이 이루어졌고 또한 甲이 자신의 진술의 경위나 과정에 관하여 공판정에서 치열하게 다투고 있다면 특히 신빙할 수 있는 상태에서 행해졌다고 단정할 수 없다.", true, "▸ 피고인이 그 진술 경위나 과정에 관하여 치열하게 다투고 있는 점, 진술이 구금된 상태에서 변호인의 동석 없이 이루어진 점 등을 고려하면, 피고인의 진술이 특히 신빙할 수 있는 상태하에서 행하여졌다는 점이 증명되었다고 보기 어렵다. [2011도5459]", "전문법칙"],
["953", "★ 수사기관이 범죄를 수사하면서 현재 범행이 행하여지고 있거나 행하여진 직후이고 증거보전의 필요성 및 긴급성이 있으며 일반적으로 허용되는 상당한 방법으로 촬영하였더라도 동 촬영이 영장 없이 이루어진 때에는 이는 위법하다.", false, "▸ 수사기관이 범죄를 수사하면서 현재 범행이 행하여지고 있거나 행하여진 직후이고, 증거보전의 필요성 및 긴급성이 있으며, 일반적으로 허용되는 상당한 방법으로 촬영한 경우라면 위 촬영이 영장 없이 이루어졌다 하여 위법하다고 할 수 없다. [2019도7891]", "전문법칙"],
["954", "★ 수사기관이 범죄를 수사하면서 불특정 다수의 출입이 가능한 장소에 통상적인 방법으로 출입하여 아무런 물리력이나 강제력을 사용하지 않고 통상적인 방법으로 위법행위를 확인하는 것은 특별한 사정이 없는 한 임의수사의 한 방법으로서 허용된다.", true, "▸ [AI해설] 불특정 다수의 출입이 가능한 장소에 통상적인 방법으로 출입하여 물리력이나 강제력 없이 위법행위를 확인하는 것은 특별한 사정이 없는 한 임의수사로서 허용된다. [2019도7891]", "전문법칙"],
["955", "★ 무인장비에 의한 제한속도 위반차량 단속을 통하여 촬영된 과속운전 차량의 차량번호 등의 사진은 위법하게 수집된 증거로서 증거능력이 없다.", false, "▸ 무인장비에 의한 단속을 통하여 촬영된 과속운전 차량의 차량번호 등의 사진은 위법하게 수집된 증거로서 증거능력이 없다고 말할 수 없다. [98도3329]", "전문법칙"],
["956", "★ 집회·시위 현장에서의 촬영행위는 일반적 인격권, 개인정보자기결정권 및 집회의 자유 등의 기본권 제한을 수반하는 것이므로 영장 없이 이루어졌다면 그 자체로 위법하다.", false, "▸ 경찰은 집회·시위현장에서 범죄가 발생한 때에는 증거수집을 위해 이를 촬영할 수 있다. 영장 없이 이루어졌다고 하여 그 자체로 위법하다고 할 수 없다. [2014헌마843]", "전문법칙"],
["957", "★ 甲이 진술 당시 술에 취하여 횡설수설하였다는 것을 확인하기 위하여 제출된 甲의 진술이 녹음된 녹음테이프는 전문증거에 해당한다.", false, "▸ 甲이 술에 취하여 횡설수설하였다는 사실 자체가 요증사실이라면 그 녹음테이프는 원진술의 존재 자체가 요증사실인 경우로 전문증거가 아니다. [2007도10755]", "전문법칙"],
["958", "★ 상해의 증거로 제시된 상해부위를 촬영한 사진은 비진술증거로서 전문법칙이 적용되지 않는다.", true, "▸ 상해의 증거로 제시된 상해부위를 촬영한 사진은 비진술증거로서 전문법칙이 적용되지 않는다. [2007도3906]", "전문법칙"],
["959", "★ 범죄 현장을 촬영한 현장사진은 비진술증거에 해당하므로 사진 가운데 촬영일자 부분 역시 전문법칙이 적용되지 않는다.", false, "▸ 현장사진은 비진술증거이지만, 사진의 촬영일자 부분은 진술증거에 해당하므로 별도로 증거능력이 있는지를 살펴보아야 한다. [2007도1230]", "전문법칙"],
["960", "★ 乙이 자신의 동생 丙에게 보낸 '甲이 나에게 돌려주지 않으면 죽여버린다고 협박하였다'는 내용의 문자메시지를 촬영한 사진을 검사가 甲이 협박한 사실을 입증하기 위해 증거로 신청한 경우, 문자메시지를 촬영한 사진은 전문증거이다.", true, "▸ 이 사건 문자메시지의 내용을 촬영한 사진은 증거서류 중 피해자의 진술서에 준하는 것으로 취급함이 상당하고, 작성자인 피해자가 법정에 출석하여 성립의 진정함이 증명되면 증거로 할 수 있다. [2010도8735]", "전문법칙"],
["961", "★ 甲이 정보통신망을 통하여 '너를 죽이고 싶다'라는 문자메시지를 반복적으로 乙에게 도달하게 하는 행위를 하였다는 정보통신망이용촉진및정보보호등에관한법률위반의 공소사실에 대하여 휴대전화기에 저장된 문자정보(위 협박문자)가 그 증거가 되는 경우, 그 문자 정보는 피고인의 진술에 해당하므로 「형사소송법」제313조 제1항의 요건이 충족되어야 증거능력이 인정된다.", false, "▸ 문자정보가 범행의 직접적인 수단이 될 뿐 경험자의 진술에 갈음하는 대체물에 해당하지 않는 경우에는 전문법칙이 적용될 여지가 없다. 따라서 제313조 제1항의 요건이 충족되어야 하는 것은 아니다. [2006도2556]", "전문법칙"],
["962", "★ 사법경찰관 丙는 제보에 따라 甲이 운영하는 성매매업소를 단속하기 위해 영업시간에 손님으로 가장하여 성매매가 가능한지 여부를 문의하였고, 그 과정에서 甲과 나누는 대화를 녹음하였다. 甲이 丙가 자신과의 대화를 녹음한다는 사실을 인식하지 못하였다면, 이는 공개되지 아니한 타인 간의 대화를 녹음한 경우에 해당하고 영장 없이 이루어졌기 때문에 위법하다.", false, "▸ 수사기관이 적법한 절차와 방법에 따라 범죄를 수사하면서 현재 그 범행이 행하여지고 있거나 행하여진 직후이고, 증거보전의 필요성 및 긴급성이 있으며, 일반적으로 허용되는 상당한 방법으로 범행현장에서 현행범인 등 관련자들과 나누는 대화를 녹음한 경우라면, 위 녹음이 영장 없이 이루어졌다 하여 이를 위법하다고 단정할 수 없다. [2020도9370]", "전문법칙"],
["963", "★ 사법경찰관 丙는 성매매알선을 범죄사실로 하여 甲을 현행범인으로 체포하면서 위 업소를 수색하여 발견한 비닐포장된 콘돔 7개를 업소시설과 함께 사진 촬영하였다. 강제로 점유를 취득하는 압수 등 강제처분이 있었던 것은 아니지만, 업소를 촬영한 것도 영장이 없는 한 위법하기 때문에 위 사진은 증거능력이 없다.", false, "▸ 제216조 제1항 제2호에 의하여 예외적으로 영장에 의하지 아니한 강제처분을 할 수 있는 경우에 해당하므로 사진 촬영이 적법하고 증거능력이 인정된다. [2020도9370]", "전문법칙"],
["964", "★ 수사기관이 아닌 사인(私人)이 피고인 아닌 사람과의 대화내용을 녹음한 녹음테이프에 대한 증거능력을 부여하기 위해서는 녹음테이프가 원본이거나 원본으로부터 복사 과정에서 편집되는 등의 인위적 개작 없이 원본 내용 그대로 복사된 것, 형소법 제313조 제1항에 따라 공판준비나 공판기일에서 원진술자의 진술에 의하여 녹음테이프에 녹음된 각자의 진술내용이 자신이 진술한 대로 녹음된 점이 인정되어야 한다.", true, "▸ [AI해설] 사인이 타인과의 대화를 녹음한 테이프는 원본 동일성 + 원진술자의 성립 진정 인정이 요건이다. [2010도7497]", "전문법칙"],
["965", "★ 甲은 친구인 乙에게 자신의 범행을 이야기하였는데, 乙이 그 대화를 녹음한 테이프의 원본이 증거로 제출된 경우, 공판기일에서 乙의 진술에 의하여 녹음테이프에 녹음된 甲의 진술내용이 甲이 진술한 대로 녹음된 것이 증명되고 그 진술이 특히 신빙할 수 있는 상태하에서 행하여진 것이 인정되는 때에는 증거로 사용할 수 있다.", true, "▸ 녹음내용 중 甲의 진술부분은 피고인 아닌 乙이 피고인 甲의 진술을 녹음한 것이므로 제313조 제1항 단서가 적용되어, 작성자인 乙이 성립을 인정하고 甲이 특신상태에서 진술하였다는 점이 입증되면 증거능력이 인정된다. [2001도3106]", "전문법칙"],
["966", "★ 사법경찰관 丙는 조사과정의 영상녹화를 위해 미리 영상녹화사실을 피의자 甲과 참고인 乙에게 각각 알려주었으나 甲은 촬영을 거부하고 乙는 동의한 경우, 甲에 대한 영상녹화물은 기억환기를 위한 자료로 활용할 수 없지만, 乙에 대한 영상녹화물은 참고인 진술조서의 실질적 진정성립을 증명하기 위한 방법으로 사용할 수 있다.", false, "▸ 피의자의 진술을 영상녹화하려면 미리 피의자에게 영상녹화사실을 알려주어야 하지만 동의를 요하지 않는다. 甲이 촬영을 거부하였더라도 미리 알려주었으므로 甲에 대한 영상녹화물은 기억환기를 위한 자료로 활용할 수 있다. 乙에 대한 영상녹화물은 진정성립 증명 또는 기억환기용으로 사용할 수 있다.", "전문법칙"],
["967", "★ 수사기관이 참고인을 조사하는 과정에서 형소법 제221조 제1항에 따라 작성한 영상녹화물은, 다른 법률에서 달리 규정하고 있는 등의 특별한 사정이 없는 한, 공소사실을 직접 증명할 수 있는 독립적인 증거로 사용될 수 없다.", true, "▸ 수사기관이 참고인을 조사하는 과정에서 형소법 제221조 제1항에 따라 작성한 영상녹화물은, 다른 법률에서 달리 규정하고 있는 등의 특별한 사정이 없는 한, 공소사실을 직접 증명할 수 있는 독립적인 증거로 사용될 수 없다. [2012도5041]", "전문법칙"],
["968", "★ 「형사소송법」제318조의2 제2항에 따른 영상녹화물의 재생은 법원의 직권이나 검사의 신청이 있는 경우에 한하고, 기억의 환기가 필요한 피고인 또는 피고인 아닌 자에게만 이를 재생하여 시청하게 하여야 한다.", false, "▸ 제318조의2 제2항에 따른 영상녹화물의 재생은 '검사의 신청이 있는 경우'에 한하므로 법원이 직권으로 시청하게 할 수는 없다(규칙 제134조의5 제1항).", "전문법칙"],
["969", "★ 피고인 또는 피고인이 아닌 자의 진술을 내용으로 하는 영상녹화물은 공판준비 또는 공판기일에 피고인 또는 피고인이 아닌 자가 진술함에 있어서 기억이 명백하지 아니한 사항에 관하여 기억을 환기시켜야 할 필요가 있다고 인정되는 경우에 피고인 또는 피고인이 아닌 자에게 재생하여 시청하게 할 수 있다.", true, "▸ 형소법 제318조의2 제2항에 따라, 진술을 내용으로 하는 영상녹화물은 기억이 명백하지 아니한 사항에 관하여 기억을 환기시켜야 할 필요가 있다고 인정되는 경우에만 재생하여 시청하게 할 수 있다.", "전문법칙"],
["970", "★ 아동·청소년 대상 성범죄 피해자의 진술이 담긴 영상녹화물에 대해 피고인이 증거 부동의 의견을 밝힌 경우, 담당 재판부는 성폭법상 동석한 신뢰관계에 있는 사람 또는 진술조력인의 진술에 의한 진정성립 제도가 폐지되었으므로, 피해자를 증인으로 소환하여 진술을 듣고 피고인에게 반대신문권을 행사할 기회를 줄 필요가 있는지 등에 관하여 심리·판단하였어야 한다.", true, "▸ 성폭법 제26조 제6항 중 위헌결정의 심판대상이 되지 않은 부분도 과잉금지원칙에 위반될 수 있으므로, 아청법상 피해자를 증인으로 소환하여 진술을 듣고 피고인에게 반대신문권을 행사할 기회를 줄 필요가 있는지 등에 관하여 심리·판단하였어야 한다. [2021도14530]", "전문법칙"],
["971", "★ 컴퓨터디스크에 기억된 정보를 증거로 제출하는 경우에는 이를 읽을 수 있도록 출력하여 인증한 등본으로 낼 수 있다.", true, "▸ 규칙 제134조의7 제1항에 따라 컴퓨터디스크에 기억된 정보를 증거로 제출하는 경우에는 이를 읽을 수 있도록 출력하여 인증한 등본으로 낼 수 있다.", "전문법칙"],
["972", "★ 컴퓨터디스크에 기억된 문자정보를 증거로 하는 경우에 상대방이 요구한 때에는 컴퓨터디스크에 입력한 사람과 입력한 일시, 출력한 사람과 출력한 일시를 밝혀야 한다.", true, "▸ 규칙 제134조의7 제2항에 따라 컴퓨터디스크에 기억된 문자정보를 증거로 하는 경우에 상대방이 요구한 때에는 입력한 사람과 입력한 일시, 출력한 사람과 출력한 일시를 밝혀야 한다.", "전문법칙"],
["973", "★ 전자문서 파일의 사본이나 출력물이 복사·출력 과정에서 편집되는 등 인위적 개작 없이 원본 내용을 그대로 복사·출력한 것이라는 사실은 전자문서 파일의 사본이나 출력물의 생성과 전달 및 보관 등의 절차에 관여한 사람의 증언이나 진술, 원본이나 사본 파일 생성 직후의 해시값의 비교, 전자문서 파일에 대한 감정 결과 등 제반 사정을 종합하여 판단할 수 있다.", true, "▸ 전자문서 파일의 원본 동일성은 사본의 생성과 전달 및 보관 절차에 관여한 사람의 증언이나 진술, 해시값 비교, 감정 결과 등 제반 사정을 종합하여 판단할 수 있다. [2017도13263]", "전문법칙"],
["974", "★ 디지털 저장매체로부터 출력한 문건을 증거로 사용하기 위해서는 정보저장매체 원본에 저장된 내용과 출력한 문건의 동일성이 인정되어야 하고, 이를 위해서는 디지털 저장매체 원본이 압수시부터 문건 출력시까지 변경되지 않았음이 담보되어야 한다.", true, "▸ 디지털 저장매체로부터 출력한 문건을 증거로 사용하기 위해서는 정보저장매체 원본에 저장된 내용과 출력한 문건의 동일성이 인정되어야 하고, 이를 위해서는 원본이 압수시부터 문건 출력시까지 변경되지 않았음이 담보되어야 한다. [2017도13263]", "전문법칙"],
["975", "★ 복제한 정보저장매체로부터 출력한 문건을 증거로 사용하기 위해서는 정보저장매체 원본과 복제한 매체 사이에 자료의 동일성도 인정되어야 할 뿐만 아니라, 이를 확인하는 과정에서 이용한 컴퓨터의 기계적 정확성, 프로그램의 신뢰성, 입력·처리·출력의 각 단계에서 조작자의 전문적인 기술능력과 정확성이 담보되어야 한다.", true, "▸ 복제한 정보저장매체로부터 출력한 문건을 증거로 사용하기 위해서는 원본과 복제 매체 사이의 동일성, 그리고 확인과정에서 컴퓨터의 기계적 정확성, 프로그램의 신뢰성, 조작자의 전문적인 기술능력과 정확성이 담보되어야 한다. [2017도13263]", "전문법칙"],
["976", "★ 피의자신문조서를 복사한 다음 원본과 상위 없다는 인증을 하여 초본 형식으로 제출된 경우, 이와 같은 피의자신문조서초본은 진술증거로서 전문법칙이 적용된다.", true, "▸ 피의자신문조서초본은 진술증거로서 전문법칙이 적용된다. ① 피의자신문조서의 원본이 존재하거나 존재하였을 것, ② 원본 제출이 불능 또는 곤란한 사정이 있을 것, ③ 원본을 정확하게 전사하였을 것의 요건을 전제로 원본과 동일하게 취급할 수 있다. [2000도5461]", "전문법칙"],
["977", "★ 검사와 피고인이 증거로 할 수 있음에 동의한 서류라고 하더라도 법원이 진정한 것으로 인정한 때에 증거로 할 수 있다.", true, "▸ 제318조 제1항에 따라 검사와 피고인이 증거로 할 수 있음을 동의한 서류 또는 물건은 진정한 것으로 인정한 때에는 증거로 할 수 있다.", "증거동의탄핵증명력"],
["978", "★ 개개의 증거에 대하여 개별적으로 증거동의를 받지 아니하고 검사가 제시한 모든 증거에 대하여 피고인이 증거로 함에 동의한다는 방식으로 증거동의가 이루어진 것일지라도 증거동의로서의 효력을 부정할 이유가 되지 못한다.", true, "▸ 일괄적인 방식으로 증거동의가 이루어졌다고 하더라도 증거동의로서의 효력을 부정할 이유가 되지 못한다. [82도2873]", "증거동의탄핵증명력"],
["979", "★ 피고인이 증거동의의 법적 효과에 대하여 잘 모르고 동의한 것이었다고 주장하나 그렇게 볼 만한 자료가 없고 변호인이 공판정에 재정하고 있으면서 피고인이 하는 동의에 대하여 아무런 이의나 취소를 한 사실이 없다면 그 동의에 법률적 하자가 있다고는 할 수 없다.", true, "▸ [AI해설] 피고인이 법적 효과를 잘 모르고 동의하였다고 주장하더라도, 변호인이 재정하면서 이의를 제기하지 않았다면 법률적 하자가 있다고 볼 수 없다. [83도1019]", "증거동의탄핵증명력"],
["980", "★ 증거동의의 의사표시는 증거조사가 완료되기 전까지 철회할 수 있으나, 일단 증거조사가 완료된 뒤에는 철회가 인정되지 아니하므로 제1심에서 한 증거동의를 제2심에서 철회할 수 없다.", true, "▸ 형소법 제318조에 규정된 증거동의의 의사표시는 증거조사가 완료되기 전까지 취소 또는 철회할 수 있으나, 일단 증거조사가 완료된 뒤에는 취소 또는 철회가 인정되지 아니하므로 제1심에서 한 증거동의를 제2심에서 취소할 수 없다. [2004도4428]", "증거동의탄핵증명력"],
["981", "★ 진술에 임의성이 인정되지 않아 증거능력이 없는 증거라고 할지라도 당사자가 동의하고 법원이 진정한 것으로 인정한 경우에는 증거능력이 있다.", false, "▸ 임의성이 인정되지 아니하여 증거능력이 없는 진술증거는 피고인이 증거로 함에 동의하더라도 증거로 삼을 수 없다. [2004도7900]", "증거동의탄핵증명력"],
["982", "★ 위법수집증거에 해당하여 그 증거능력이 부정되는 경우 피고인이나 변호인이 이를 증거로 함에 동의하더라도 증거로 사용할 수 없다.", true, "▸ 위법수집증거에 해당하여 증거능력이 부정되는 경우 피고인이나 변호인이 증거동의하더라도 증거로 사용할 수 없다. [2009도2109 등]", "증거동의탄핵증명력"],
["983", "★ 변호인은 피고인의 명시한 의사에 반하여 증거로 함에 동의할 수 있다.", false, "▸ 변호인은 피고인의 '명시한 의사에 반하지 아니하는 한' 피고인을 대리하여 증거로 함에 동의할 수 있다. 피고인의 명시한 의사에 반하는 동의는 허용되지 않는다. [2004도4428]", "증거동의탄핵증명력"],
["984", "★ 증거동의의 주체는 검사와 피고인이므로, 변호인의 경우 피고인의 명시적인 위임이 없는 한 피고인을 대리하여 증거로 함에 동의할 수 없다.", false, "▸ 변호인은 피고인의 '명시적인 위임'이 없더라도 피고인의 '명시한 의사에 반하지 아니하는 한' 피고인을 대리하여 증거로 함에 동의할 수 있다. [2004도4428]", "증거동의탄핵증명력"],
["985", "★ 제1회 공판기일에 乙 및 乙의 변호인은 혈액감정의뢰회보에 대하여 증거부동의를 하였는데, 제3회 공판기일에 乙이 출석하지 아니한 상태에서 乙의 변호인이 이를 증거로 하는 데 동의하였다면 위 증거동의는 효력이 있다.", false, "▸ 피고인이 출석한 공판기일에서 증거로 함에 부동의한다는 의견이 진술된 경우에는, 그 후 피고인이 출석하지 아니한 공판기일에 변호인만이 출석하여 종전 의견을 번복하여 증거로 함에 동의하였다 하더라도 이는 특별한 사정이 없는 한 효력이 없다. [2013도3]", "증거동의탄핵증명력"],
["986", "★ 검사가 신청한 증거들에 관한 변호인의 증거동의에 대하여 피고인이 즉시 이의하지 아니하면 그 증거들의 증거능력이 인정되고, 그 이후 피고인이 증거조사 완료 전에 변호인의 위 동의를 취소하거나 철회한다고 하더라도 일단 부여된 증거능력은 그대로 유지된다.", false, "▸ 변호인의 동의에 대하여 피고인이 즉시 이의하지 아니하는 경우에는 변호인의 동의로 증거능력이 인정된다. 다만, 피고인은 증거조사 완료 전까지 변호인의 동의를 취소·철회할 수 있고, 취소·철회하면 일단 부여된 증거능력은 소멸된다. [99도2029]", "증거동의탄핵증명력"],
["987", "★ 약식명령에 불복하여 정식재판을 청구한 피고인이 정식재판절차의 제1심에서 2회 연속 불출정하여 증거동의가 간주된 후 증거조사를 완료한 경우, 피고인이 항소심에 출석하여 공소사실을 부인하면서 간주된 증거동의를 철회 또는 취소한다는 의사표시를 하면 증거능력이 상실된다.", false, "▸ 비록 피고인이 항소심에 출석하여 간주된 증거동의를 철회 또는 취소한다는 의사표시를 하더라도 그로 인하여 일단 부여된 증거능력이 상실되는 것이 아니다. [2007도5776]", "증거동의탄핵증명력"],

["1012", "★ 자백의 임의성이 있어 증거능력이 부여되는 경우에는 그 진실성과 신빙성까지도 당연히 인정된다.", false, "▸ 자백의 임의성이 인정된다고 하더라도 이것은 그 자백이 엄격한 증명의 자료로서 사용될 자격(증거능력)이 있다는 것에 지나지 않고, 그 자백의 진실성과 신빙성(증명력)까지도 당연히 인정되어야 하는 것은 아니다. [83도712]", "증거동의탄핵증명력"],
["1013", "★ 乙이 검찰에서는 자금을 조성하여 甲에게 정치자금으로 제공하였다고 진술하였다가 제1심 법정에서는 정치자금으로 제공한 사실을 부인하면서 자금의 사용처를 달리 증언하였다고 하더라도, 제1심 법원은 乙의 검찰 진술의 신빙성을 인정하여 「정치자금법」상 금품수수 혐의로 공소제기된 甲에게 유죄를 선고할 수 있다.", true, "▸ 공판중심주의 등을 감안하더라도, 乙의 법정진술을 믿을 수 없는 사정 아래에서 乙이 법정에서 검찰진술을 번복하였다는 이유만으로 조성 자금을 피고인에게 정치자금으로 공여하였다는 검찰진술의 신빙성이 부정될 수는 없다. [2013도11650]", "증거동의탄핵증명력"],
["1014", "★ 거짓말탐지기의 검사결과가 증거능력이 있는 경우에도 그 검사결과는 검사를 받는 사람의 진술의 신빙성을 감하는 정황증거로서의 기능을 하는데 그친다.", true, "▸ 거짓말탐지기의 검사결과가 증거능력이 있는 경우에도 그 검사결과는 검사를 받는 사람의 진술의 신빙성을 감하는 정황증거로서의 기능을 하는데 그친다. [87도968]", "증거동의탄핵증명력"],
["1015", "★ 친족관계에 의한 성범죄를 당하였다는 미성년자 피해자의 진술은 진술 이후 감정·가족들의 계속되는 회유와 압박 등으로 인하여 번복되거나 불분명해지는 특수성을 갖고 있으므로, 피해자가 법정에서 수사기관에서의 진술을 번복하는 경우, 수사기관 진술 내용 자체의 신빙성 인정 여부와 함께 법정에서 진술을 번복한 동기나 이유 등을 충분히 심리하여 어느 진술에 신빙성이 있는지를 신중하게 판단하여야 한다.", true, "▸ 친족 성범죄 미성년자 피해자 진술은 특수성이 있으므로, 수사기관 진술 신빙성과 함께 법정에서 번복한 동기·이유 등을 충분히 심리하여야 한다. [2020도2433]", "증거동의탄핵증명력"],
["1016", "★ 양심적 병역거부를 주장하는 피고인이 자신의 병역거부가 아니면 인격적 존재가치가 파멸되고 말 것이라는 절박하고 확고하며 진실한 것이라는 사실의 존재를 수긍할 만한 소명 자료를 법원에 제출하는 경우, 검사는 제출된 자료의 신빙성을 탄핵하는 방법으로 양심의 부존재를 증명하면 된다.", true, "▸ 피고인이 소명 자료를 제출하면 검사는 이를 탄핵하는 방법으로 양심의 부존재를 증명하면 된다. [2016도10912 전합]", "증거동의탄핵증명력"],
["1017", "★ 주식회사의 대표이사가 회사의 돈을 인출하여 사용하였는데 그 사용처에 관한 증거자료를 제시하지 못하고 있고 그 인출사유와 사용처에 관하여 납득할 만한 합리적인 설명을 하지 못하고 있다면, 그가 불법영득의 의사로 회사의 돈을 인출하여 개인적 용도로 사용한 것으로 추단할 수 있다.", true, "▸ [AI해설] 대표이사가 사용처를 제시하지 못하고 합리적 설명을 하지 못하면 불법영득의사로 개인적 용도로 사용한 것으로 추단할 수 있다. [2013도2510]", "증거동의탄핵증명력"],
["1018", "★ 항소심으로서는 제1심의 판단을 그대로 유지하는 것이 현저히 부당하다고 인정되는 예외적인 경우가 아니라면, 제1심 증인이 한 진술의 신빙성 유무에 대한 제1심의 판단이 항소심의 판단과 다르다는 이유만으로 이에 대한 제1심의 판단을 함부로 뒤집어서는 안 된다.", true, "▸ 항소심은 제1심의 판단을 그대로 유지하는 것이 현저히 부당하다고 인정되는 예외적인 경우가 아니라면, 제1심 증인 진술의 신빙성에 대한 제1심 판단을 함부로 뒤집어서는 안 된다. [2018도17748]", "증거동의탄핵증명력"],
["1019", "★ 범인식별 절차에 있어 목격자 진술의 신빙성을 높게 평가할 수 있게 하려면, 범인의 인상착의 등에 관한 목격자의 진술 내지 묘사를 사전에 상세히 기록화한 다음, 용의자를 포함하여 그와 인상착의가 비슷한 여러 사람을 동시에 목격자와 대면시켜 범인을 지목하도록 하여야 한다.", true, "▸ 목격자 진술의 신빙성을 높게 평가할 수 있게 하려면 목격자의 진술을 사전에 기록화하고, 용의자와 인상착의가 비슷한 여러 사람을 동시에 목격자와 대면시켜 범인을 지목하도록 하여야 한다. [2007도5201]", "증거동의탄핵증명력"],
["1020", "★ 용의자의 인상착의 등에 의한 범인식별 절차에 있어 용의자의 사진 한 장만을 목격자에게 제시하여 범인 여부를 확인하게 하는 것은 그 사진상의 인물이 범인으로 의심받고 있다는 무의식적 암시를 목격자에게 줄 수 있는 가능성이 있다.", true, "▸ 용의자의 사진 한 장만을 목격자에게 제시하여 범인 여부를 확인하게 하는 것은 그 사진상의 인물이 범인으로 의심받고 있다는 무의식적 암시를 목격자에게 줄 수 있는 가능성이 있다. [2007도5201]", "증거동의탄핵증명력"],
["1021", "★ 범죄 발생 직후 목격자의 기억이 생생하게 살아있는 상황에서 현장이나 그 부근에서 범인식별 절차를 실시하는 경우에도 용의자와 목격자의 일대일 대면은 허용될 수 없다.", false, "▸ 범죄 발생 직후 목격자의 기억이 생생한 상황에서 현장이나 그 부근에서 범인식별 절차를 실시하는 경우에는 범죄의 신속한 해결을 위한 즉각적인 대면의 필요성이 인정되므로, 용의자와 목격자의 일대일 대면도 허용된다. [2008도12111]", "증거동의탄핵증명력"],
["1022", "★ 전과에 관한 사실은 누범가중의 사유가 되는 경우에도 피고인의 자백만으로 인정할 수 있다.", true, "▸ 전과에 관한 사실은 누범가중의 사유가 되는 경우에도 피고인의 자백만으로 인정할 수 있다. [73도280]", "증거동의탄핵증명력"],
["1023", "★ 피고인이 제출한 항소이유서에 '진심으로 뉘우치고 있습니다'라고 기재되어 있더라도, 이어진 검사 및 변호인의 각 신문에 대하여 범죄사실을 일관되게 부인한다면 범죄사실을 자백한 것이라고 볼 수 없다.", true, "▸ 항소이유서에 '뉘우치고 있습니다'라고 기재되어 있더라도 그 후 범죄사실을 일관되게 부인하였다면 자백에 해당하지 않는다. [99도3341]", "증거동의탄핵증명력"],
["1024", "★ 피고인이 공판정에서 공소사실에 대하여 자백을 하였다면 검사가 작성한 피고인에 대한 피의자신문조서를 자백의 보강증거로 사용할 수 없다.", true, "▸ 피고인의 법정진술과 검찰 피의자신문조서의 진술기재는 피고인의 법정 및 검찰에서의 자백으로서 제310조에서 규정하는 자백의 개념에 포함되어 그 자백만으로는 유죄의 증거로 삼을 수 없다. 피고인의 법정 자백을 수사기관에서의 자백으로 보강할 수 없다. [2007도10937]", "증거동의탄핵증명력"],
