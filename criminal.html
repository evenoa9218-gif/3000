["169", "피교사자의 객체의 착오는 교사자에게는 방법의 착오가 된다는 데 견해가 일치한다.", false, "▸ 피교사자의 객체의 착오는 교사자에게는 객체의 착오가 된다는 견해와 방법의 착오가 된다는 견해 등이 대립한다.\n\n[V. 구성요건적 착오 - 부합론 참고] ① 구체적 부합설: 행위자의 인식사실과 발생결과가 구체적으로 부합하는 경우에 고의기수를 인정. ② 법정적 부합설(판례): 인식사실과 발생결과가 동일한 구성요건 또는 죄질인 경우 고의기수를 인정. ③ 추상적 부합설: 가벌적이라는 점에서 추상적으로 중첩하는 범위 내에서 경한 범죄의 고의기수를 인정. 판례는 법정적 부합설의 입장에서 타격의 착오가 있는 경우라 할지라도 행위자의 살인의 범의 성립에 방해가 되지 않는다고 본다(83도2813). [결론 요약] 구체적 사실의 착오·객체의 착오: 세 견해 모두 발생사실에 대한 고의기수 인정. 구체적 사실의 착오·방법의 착오: 구체적 부합설은 인식사실 미수와 발생사실 과실의 상상적 경합, 법정적·추상적 부합설은 발생사실에 대한 고의기수 인정. 추상적 사실의 착오·방법의 착오: 구체적·법정적 부합설은 인식사실 미수와 발생사실 과실의 상상적 경합, 추상적 부합설은 경한 죄의 기수와 중한 죄의 과실(또는 미수)의 상상적 경합.\n\n[제2절 참고 - 고의 관련 조문] 형법 제13조(고의): 죄의 성립요소인 사실을 인식하지 못한 행위는 벌하지 아니한다. 단, 법률에 특별한 규정이 있는 경우에는 예외로 한다. 형법 제15조(사실의 착오) ①: 특별히 무거운 죄가 되는 사실을 인식하지 못한 행위는 무거운 죄로 벌하지 아니한다.", "구성요건론"],
["170", "甲은 乙에게 A의 승용차를 절취하라고 교사하였는데, 乙은 A의 승용차로 알고 B의 승용차를 절취하였다. 甲은 절도죄의 교사범이 성립하지 않는다.", false, "▸ 정범 乙의 착오는 구체적 사실의 착오 중 객체의 착오에 해당한다. 판례인 법정적 부합설에 의하면 피교사자의 객체의 착오가 교사자에게 객체의 착오인지 방법의 착오인지와 관계없이 발생사실에 대한 교사범이 성립한다. 따라서 甲은 B의 승용차에 대한 절도교사범이 성립한다.\n\n[V. 구성요건적 착오 - 부합론 참고] ① 구체적 부합설: 행위자의 인식사실과 발생결과가 구체적으로 부합하는 경우에 고의기수를 인정. ② 법정적 부합설(판례): 인식사실과 발생결과가 동일한 구성요건 또는 죄질인 경우 고의기수를 인정. ③ 추상적 부합설: 가벌적이라는 점에서 추상적으로 중첩하는 범위 내에서 경한 범죄의 고의기수를 인정. 판례는 법정적 부합설의 입장에서 타격의 착오가 있는 경우라 할지라도 행위자의 살인의 범의 성립에 방해가 되지 않는다고 본다(83도2813). [결론 요약] 구체적 사실의 착오·객체의 착오: 세 견해 모두 발생사실에 대한 고의기수 인정. 구체적 사실의 착오·방법의 착오: 구체적 부합설은 인식사실 미수와 발생사실 과실의 상상적 경합, 법정적·추상적 부합설은 발생사실에 대한 고의기수 인정. 추상적 사실의 착오·방법의 착오: 구체적·법정적 부합설은 인식사실 미수와 발생사실 과실의 상상적 경합, 추상적 부합설은 경한 죄의 기수와 중한 죄의 과실(또는 미수)의 상상적 경합.\n\n[제2절 참고 - 고의 관련 조문] 형법 제13조(고의): 죄의 성립요소인 사실을 인식하지 못한 행위는 벌하지 아니한다. 단, 법률에 특별한 규정이 있는 경우에는 예외로 한다. 형법 제15조(사실의 착오) ①: 특별히 무거운 죄가 되는 사실을 인식하지 못한 행위는 무거운 죄로 벌하지 아니한다.", "구성요건론"],
["171", "살해의 의도로 피해자를 구타하였으나 이로 인하여 직접 사망한 것이 아니라 그 후 죄적을 인멸할 목적으로 행한 매장행위에 의하여 피해자가 사망하게 된 경우, 살인미수죄와 과실치사죄의 경합범이 된다.", false, "▸ 피해자가 피고인들이 살해의 의도로 행한 구타행위에 의하여 직접 사망한 것이 아니라 죄적을 인멸할 목적으로 행한 매장행위에 의해 사망하게 되었다 하더라도, 전 과정을 개괄적으로 보면 피해자의 살해라는 처음에 예견된 사실이 결국 실현된 것이기 때문에 살인죄의 죄책을 면할 수 없다(88도650).\n\n[제2절 참고 - 고의 관련 조문] 형법 제13조(고의): 죄의 성립요소인 사실을 인식하지 못한 행위는 벌하지 아니한다. 단, 법률에 특별한 규정이 있는 경우에는 예외로 한다. 형법 제15조(사실의 착오) ①: 특별히 무거운 죄가 되는 사실을 인식하지 못한 행위는 무거운 죄로 벌하지 아니한다.", "구성요건론"],
["172", "상해의 고의로 행한 구타행위로 상해를 입은 피해자가 정신을 잃고 빈사상태에 빠지자 사망한 것으로 오인하고, 자신의 행위를 은폐하고 피해자가 자살한 것처럼 가장하기 위해 피해자를 호텔 베란다 밖으로 떨어뜨려 사망하게 하였다면, 상해죄와 과실치사죄의 경합범이 된다.", false, "▸ 피고인이 피해자에게 상해를 가함으로써 피해자가 정신을 잃고 빈사상태에 빠지자, 피해자가 사망한 것으로 오인하고, 피고인의 행위를 은폐하고 피해자가 자살한 것처럼 가장하기 위하여 피해자를 베란다로 옮긴 후 베란다 밑 아래의 바닥으로 떨어뜨려 피해자로 하여금 현장에서 뇌손상 등으로 사망에 이르게 하였다면, 피고인의 행위는 포괄하여 단일의 상해치사죄에 해당한다(94도2361).\n\n[제2절 참고 - 고의 관련 조문] 형법 제13조(고의): 죄의 성립요소인 사실을 인식하지 못한 행위는 벌하지 아니한다. 단, 법률에 특별한 규정이 있는 경우에는 예외로 한다. 형법 제15조(사실의 착오) ①: 특별히 무거운 죄가 되는 사실을 인식하지 못한 행위는 무거운 죄로 벌하지 아니한다.", "구성요건론"],
["173", "「형법」에서 살인미수를 과실치사보다 특별히 무겁게 처벌하도록 한 것은 결과불법 측면보다 행위불법 측면을 중시한 예가 된다.", true, "▸ 사망의 결과가 발생한 과실치사가 사망의 결과가 발생하지 않은 살인미수보다 결과불법이 크다. 그러나 고의범인 살인미수가 과실범인 과실치사보다 행위불법이 크다.\n\n[제3절 참고 - 과실 관련 조문] 형법 제14조(과실): 정상적으로 기울여야 할 주의를 게을리하여 죄의 성립요소인 사실을 인식하지 못한 행위는 법률에 특별한 규정이 있는 경우에만 처벌한다.", "구성요건론"],
["174", "주의의무의 판단기준과 관련하여, 주의의무위반을 일반인의 주의능력을 기준으로 판단하는 객관설은 예측가능성을 담보할 수 있으므로 평등원칙에 충실하다.", true, "▸ 객관설은 행위자의 능력을 고려하지 않고 일반인의 주의능력을 기준으로 하므로 동일한 기준이 적용된다.\n\n[제3절 참고 - 과실 관련 조문] 형법 제14조(과실): 정상적으로 기울여야 할 주의를 게을리하여 죄의 성립요소인 사실을 인식하지 못한 행위는 법률에 특별한 규정이 있는 경우에만 처벌한다.", "구성요건론"],
["175", "주의의무의 판단기준에 관한 주관설에 따르면 행위자가 평균인 이하의 능력을 가졌기 때문에 결과발생을 예견할 가능성이 없더라도 주의의무위반에 따른 결과가 발생한 이상 과실범의 불법은 긍정된다.", false, "▸ 주관설은 행위자 본인이 주의할 수 있는 능력을 기준으로 한다. 따라서 주관설에 의하면 평균인 이하의 능력을 가져 결과발생을 예견할 수 없다면 과실범의 불법은 부정된다. 반대로 행위자가 평균인 이상의 능력을 가진 경우에는 그가 할 수 있는 모든 조치를 다해야 한다.\n\n[제3절 참고 - 과실 관련 조문] 형법 제14조(과실): 정상적으로 기울여야 할 주의를 게을리하여 죄의 성립요소인 사실을 인식하지 못한 행위는 법률에 특별한 규정이 있는 경우에만 처벌한다.", "구성요건론"],
["176", "인식 있는 과실과 인식 없는 과실은 형법상 동일하게 취급된다.", true, "▸ 불법과 책임의 경중에는 차이가 없다.\n\n[제3절 참고 - 과실 관련 조문] 형법 제14조(과실): 정상적으로 기울여야 할 주의를 게을리하여 죄의 성립요소인 사실을 인식하지 못한 행위는 법률에 특별한 규정이 있는 경우에만 처벌한다.", "구성요건론"],
["177", "과실범에 있어서의 인식 없는 과실은 결과 발생의 가능성에 대한 인식 자체도 없는 경우로 그 결과 발생을 인식하지 못하였다는 데에 대한 부주의, 즉 규범적 실재로서의 과실 책임이 있다.", true, "▸ [AI해설] 인식 없는 과실은 결과 발생의 가능성에 대한 인식 자체가 없는 경우로서, 그 결과 발생을 인식하지 못하였다는 데 대한 부주의, 즉 규범적 요소로서의 과실책임이 있다는 것이 판례의 태도이다(83도3007).\n\n[제3절 참고 - 과실 관련 조문] 형법 제14조(과실): 정상적으로 기울여야 할 주의를 게을리하여 죄의 성립요소인 사실을 인식하지 못한 행위는 법률에 특별한 규정이 있는 경우에만 처벌한다.", "구성요건론"],
["178", "중과실은 행위자가 극히 근소한 주의를 함으로써 결과발생을 인식할 수 있음에도 불구하고 부주의로서 이를 인식하지 못한 경우를 말하는 것이고 경과실과의 구별은 구체적인 경우에 사회통념을 고려하여 결정될 문제이다.", true, "▸ [AI해설] 중과실은 행위자가 극히 근소한 주의를 기울였다면 결과발생을 인식할 수 있었음에도 부주의로 이를 인식하지 못한 경우를 말하고, 경과실과의 구별은 구체적인 경우에 사회통념을 고려하여 결정할 문제라는 것이 판례의 태도이다(4292형상761).\n\n[제3절 참고 - 과실 관련 조문] 형법 제14조(과실): 정상적으로 기울여야 할 주의를 게을리하여 죄의 성립요소인 사실을 인식하지 못한 행위는 법률에 특별한 규정이 있는 경우에만 처벌한다.", "구성요건론"],
["179", "행정상 단속을 주안으로 하는 법규 위반행위는 과실범 처벌규정은 없으나 해석상 과실범도 벌할 뜻이 명확한 경우에도 형법의 원칙에 따라 고의가 있어야 벌 할 수 있다.", false, "▸ 행정상의 단속을 주안으로 하는 법규라 하더라도 '명문규정이 있거나 해석상 과실범도 벌할 뜻이 명확한 경우'를 '제외'하고는 '고의'가 있어야 벌할 수 있다(2009도9807).\n\n[제3절 참고 - 과실 관련 조문] 형법 제14조(과실): 정상적으로 기울여야 할 주의를 게을리하여 죄의 성립요소인 사실을 인식하지 못한 행위는 법률에 특별한 규정이 있는 경우에만 처벌한다.", "구성요건론"],
["180", "과실행위는 법률에 특별한 규정이 있는 경우에 한해서 처벌의 대상이 되지만 행정상의 단속을 중점으로 하는 법규의 경우에는 명시적 규정이 없더라도 원칙적으로 처벌의 대상이 된다.[모25]", false, "▸ 행정상의 단속을 주안으로 하는 법규라 하더라도 '명문규정이 있거나 해석상 과실범도 벌할 뜻이 명확한 경우'를 '제외'하고는 '고의'가 있어야 벌할 수 있다(2009도9807).\n\n[제3절 참고 - 과실 관련 조문] 형법 제14조(과실): 정상적으로 기울여야 할 주의를 게을리하여 죄의 성립요소인 사실을 인식하지 못한 행위는 법률에 특별한 규정이 있는 경우에만 처벌한다.", "구성요건론"],
["181", "甲이 함께 술을 마신 乙과 도로 중앙선에 잠시 서 있다가 지나가는 차량의 유무를 확인하지 아니하고, 고개를 숙인 채 서 있는 乙의 팔을 갑자기 끌어당겨 도로를 무단횡단하던 도중에 지나가던 차량에 乙이 충격당하여 사망한 경우, 甲이 만취하여 사리분별능력이 떨어진 상태라면 甲에게 차량의 통행여부 및 횡단가능여부를 확인할 주의의무가 있다고 볼 수 없다.", false, "▸ 피고인이 피해자의 안전을 위하여 차량의 통행여부 및 횡단가능여부를 확인하여야 할 주의의무가 있다 할 것이므로, 피고인으로서는 위와 같은 주의의무를 다하지 않은 이상 교통사고와 그로 인한 피해자의 사망에 대하여 과실책임을 면할 수 없다(2002도2800).\n\n[제3절 참고 - 과실 관련 조문] 형법 제14조(과실): 정상적으로 기울여야 할 주의를 게을리하여 죄의 성립요소인 사실을 인식하지 못한 행위는 법률에 특별한 규정이 있는 경우에만 처벌한다.", "구성요건론"],
["182", "다수의 사람이 특정한 범죄를 공동으로 하여 각자의 범죄를 실현하는 것이 공동정범이라고 보는 범죄공동설의 시각에서는, 고의범에서만 공동정범이 성립할 수 있다고 본다.[모25]", true, "▸ [범죄공동설] ① 공동정범은 2인 이상이 '특정 범죄'를 공동으로 실행하는 것이라는 견해이다. ② 이 견해에 의하면 특정범죄에 대한 '고의'의 공동이 필요하다. ③ 따라서 서로 다른 종류의 고의범 상호간, 고의범과 과실범 상호간, 과실범 상호간, 범죄의 일부분만을 공동으로 한 경우에는 공동정범이 성립할 수 없다. ④ 공동정범의 성립 범위를 제한하여 책임주의 원칙에 충실하지만, 형사정책적 합목적성을 충족하지 못한다는 문제가 있다.\n\n[제3절 참고 - 과실 관련 조문] 형법 제14조(과실): 정상적으로 기울여야 할 주의를 게을리하여 죄의 성립요소인 사실을 인식하지 못한 행위는 법률에 특별한 규정이 있는 경우에만 처벌한다.", "구성요건론"],
["183", "공동정범을 전법률적·자연적 의미의 행위를 공동으로 행하여 범죄를 실행하는 경우로 보는 견해는 과실범의 공동정범과 결과적 가중범의 공동정범을 모두 긍정한다.[모25]", true, "▸ [행위공동설] ① 공동정범은 '전구성요건적 또는 자연적 의미의 행위'를 공동으로 하는 것으로, 공동정범의 공동의 대상은 특정범죄가 아니라 사실상의 행위 그 자체라는 견해이다. ② 따라서 서로 다른 종류의 고의범 상호간, 고의범과 과실범 상호간, 과실범 상호간, 범죄의 일부분만을 공동으로 한 경우에도 공동정범이 성립할 수 있다. ③ 형사정책적 합목적성을 충족하지만, 책임주의 원칙에 반한다는 문제가 있다.\n\n[제3절 참고 - 과실 관련 조문] 형법 제14조(과실): 정상적으로 기울여야 할 주의를 게을리하여 죄의 성립요소인 사실을 인식하지 못한 행위는 법률에 특별한 규정이 있는 경우에만 처벌한다.", "구성요건론"],
["184", "범죄를 행위자의 반사회적 성격의 징표로 이해하는 행위공동설의 시각에서는, 과실범 간의 공동정범이나 고의범과 과실범 간의 공동정범도 성립할 수 있으며 범죄의 일부분만을 공동으로 한 경우에도 공동정범이 성립할 수 있다고 본다.[모25]", true, "▸ [행위공동설] ① 공동정범은 '전구성요건적 또는 자연적 의미의 행위'를 공동으로 하는 것으로, 공동정범의 공동의 대상은 특정범죄가 아니라 사실상의 행위 그 자체라는 견해이다. ② 따라서 서로 다른 종류의 고의범 상호간, 고의범과 과실범 상호간, 과실범 상호간, 범죄의 일부분만을 공동으로 한 경우에도 공동정범이 성립할 수 있다. ③ 형사정책적 합목적성을 충족하지만, 책임주의 원칙에 반한다는 문제가 있다.\n\n[제3절 참고 - 과실 관련 조문] 형법 제14조(과실): 정상적으로 기울여야 할 주의를 게을리하여 죄의 성립요소인 사실을 인식하지 못한 행위는 법률에 특별한 규정이 있는 경우에만 처벌한다.", "구성요건론"],
["185", "공동정범이 성립하기 위하여서는 특정한 범죄를 공동으로 할 의사가 필요하므로, 2인 이상이 어떠한 과실행위를 서로의 의사연락 아래 하여 범죄에 해당하는 결과를 발생시킨 경우에는 공동정범이 성립하지 않는다.[모25]", false, "▸ ① 제30조에 '공동하여 죄를 범한 때의 죄'는 고의범이고 과실범이고를 불문한다. 공동정범의 주관적 요건인 공동의 의사도 고의를 공동으로 가질 의사임을 필요로 하지 않고 고의행위이고 과실행위이고 간에 그 행위를 공동으로 할 의사이면 족하다. ② 2인 이상이 어떠한 과실행위를 서로의 의사연락 아래 하여 범죄되는 결과를 발생케 하였다면 과실범의 공동정범이 성립한다(4294형상598).\n\n[제3절 참고 - 과실 관련 조문] 형법 제14조(과실): 정상적으로 기울여야 할 주의를 게을리하여 죄의 성립요소인 사실을 인식하지 못한 행위는 법률에 특별한 규정이 있는 경우에만 처벌한다.", "구성요건론"],
["186", "甲과 乙은 자신들이 근무하는 A 회사 공장 외벽에 설치된 분리수거장 옆에서 담배를 피우다가 아무 생각 없이 각자 담배꽁초를 분리수거장 쪽에 던지고 자리를 떠났다. 그 이후 분리수거장에 있던 종이박스 등에 불씨가 옮겨붙어 화재가 발생하였고 그로 인해 A 회사 소유의 비료 포대가 전소되었다. 甲과 乙이 각자 담배를 피우고 담배꽁초를 버리는 과정에서 서로 어떠한 공동인식이나 의사연락이 없었다면, 甲과 乙에게 과실범의 공동정범은 성립하지 않는다.", true, "▸ 과실범의 공동정범은 행위자들 사이에 공동의 목표와 의사연락이 있는 경우에 성립하는 것인바, 함께 담배를 피웠을 뿐인 이 사건의 피고인들에게는 '공동의 목표'가 있었다고 보기 어려워 위와 같은 공동정범의 법리가 적용될 수는 없다(대구지방법원 2020노3595).\n\n[제3절 참고 - 과실 관련 조문] 형법 제14조(과실): 정상적으로 기울여야 할 주의를 게을리하여 죄의 성립요소인 사실을 인식하지 못한 행위는 법률에 특별한 규정이 있는 경우에만 처벌한다.", "구성요건론"],
["187", "과실에 의한 공동정범은 물론 과실에 의한 위험범의 성립도 가능하다.[변19]", true, "▸ 과실에 의한 위험범도 처벌규정이 존재한다(형법 제170조 실화죄).\n\n[제3절 참고 - 과실 관련 조문] 형법 제14조(과실): 정상적으로 기울여야 할 주의를 게을리하여 죄의 성립요소인 사실을 인식하지 못한 행위는 법률에 특별한 규정이 있는 경우에만 처벌한다.", "구성요건론"],
["188", "의료행위와 환자에게 발생한 상해·사망 등 결과 사이에 인과관계가 인정되는 경우에도, 검사가 공소사실에 기재한 바와 같은 업무상과실로 평가할 수 있는 행위의 존재 또는 그 업무상과실의 내용을 구체적으로 증명하지 못하였다면, 의료행위로 인하여 환자에게 상해·사망 등 결과가 발생하였다는 사정만으로 의사의 업무상과실을 추정하거나 단순한 가능성·개연성 등 막연한 사정을 근거로 함부로 이를 인정할 수는 없다.[모25]", true, "▸ 의료행위와 환자에게 발생한 상해·사망 등 결과 사이에 인과관계가 인정되는 경우에도, 검사가 공소사실에 기재한 바와 같은 업무상과실로 평가할 수 있는 행위의 존재 또는 그 업무상과실의 내용을 구체적으로 증명하지 못하였다면, 의료행위로 인하여 환자에게 상해·사망 등 결과가 발생하였다는 사정만으로 의사의 업무상과실을 추정하거나 단순한 가능성·개연성 등 막연한 사정을 근거로 함부로 이를 인정할 수는 없다(2022도11163).\n\n[제3절 참고 - 과실 관련 조문] 형법 제14조(과실): 정상적으로 기울여야 할 주의를 게을리하여 죄의 성립요소인 사실을 인식하지 못한 행위는 법률에 특별한 규정이 있는 경우에만 처벌한다.", "구성요건론"],
["189", "★ 의료과오사건에서 의사의 과실 유무를 판단할 때에는 동일 업종에 종사하는 일반적 보통인의 주의정도를 표준으로 하고, 사고 당시의 일반적인 의학 수준과 의료환경 및 조건 등을 고려하여야 한다.", true, "▸ ① 의료사고에서 과실의 유무를 판단할 때에는 같은 업무와 직무에 종사하는 보통인의 주의정도를 표준으로 하여야 하며, 여기에는 사고 당시의 일반적인 의학의 수준과 의료환경 및 조건, 의료행위의 특수성 등이 고려되어야 하고, ② 이러한 법리는 한의사의 경우에도 마찬가지이다(2010도10104).\n\n[제3절 참고 - 과실 관련 조문] 형법 제14조(과실): 정상적으로 기울여야 할 주의를 게을리하여 죄의 성립요소인 사실을 인식하지 못한 행위는 법률에 특별한 규정이 있는 경우에만 처벌한다.", "구성요건론"],
["190", "의료사고에서 의사의 과실을 인정하기 위한 요건과 판단기준은 한의사와 다르다.", false, "▸ ① 의료사고에서 과실의 유무를 판단할 때에는 같은 업무와 직무에 종사하는 보통인의 주의정도를 표준으로 하여야 하며, 여기에는 사고 당시의 일반적인 의학의 수준과 의료환경 및 조건, 의료행위의 특수성 등이 고려되어야 하고, ② 이러한 법리는 한의사의 경우에도 마찬가지이다(2010도10104).\n\n[제3절 참고 - 과실 관련 조문] 형법 제14조(과실): 정상적으로 기울여야 할 주의를 게을리하여 죄의 성립요소인 사실을 인식하지 못한 행위는 법률에 특별한 규정이 있는 경우에만 처벌한다.", "구성요건론"],
["191", "미용성형을 시술하는 의사로서는 회복이 어려운 후유증이 발생할 개연성이 높은 경우 그 미용성형 시술을 거부 내지는 중단하여야 할 의무가 있다.", true, "▸ [AI해설] 미용성형을 시술하는 의사로서는 회복이 어려운 후유증이 발생할 개연성이 높은 경우 그 미용성형 시술을 거부하거나 중단하여야 할 의무가 있다는 것이 판례의 태도이다(2007도1977).\n\n[제3절 참고 - 과실 관련 조문] 형법 제14조(과실): 정상적으로 기울여야 할 주의를 게을리하여 죄의 성립요소인 사실을 인식하지 못한 행위는 법률에 특별한 규정이 있는 경우에만 처벌한다.", "구성요건론"],
["192", "환자의 명시적인 수혈 거부 의사가 존재하여 수혈하지 아니함을 전제로 환자의 동의를 받아 수술하였는데 수술 과정에서 수혈을 하지 않으면 생명에 위험이 발생할 수 있는 응급상태에 이른 경우에, 환자의 생명을 보존하기 위한 수혈을 선택하지 않은 의사에게는 업무상 과실이 있으나 피해자의 승낙으로서 위법성이 조각된다.", false, "▸ ① 환자의 생명과 자기결정권을 비교형량하기 어려운 특별한 사정이 있다고 인정되는 경우에 의사가 자신의 직업적 양심에 따라 환자의 양립할 수 없는 두 개의 가치 중 어느 하나를 존중하는 방향으로 행위하였다면, 이러한 행위는 처벌할 수 없다. ② 망인의 생명과 자기결정권을 비교형량하기 어려운 특별한 사정이 있으므로, 타가수혈하지 아니한 사정만을 가지고 의사로서 진료상의 '주의의무'를 다하지 아니하였다고 할 수 없다(2009도14407). [구성요건해당성 부정]\n\n[제3절 참고 - 과실 관련 조문] 형법 제14조(과실): 정상적으로 기울여야 할 주의를 게을리하여 죄의 성립요소인 사실을 인식하지 못한 행위는 법률에 특별한 규정이 있는 경우에만 처벌한다.", "구성요건론"],
["193", "★ 의사가 특정 진료방법을 선택하여 진료를 하였다면 해당 진료방법 선택과정에 합리성이 결여되어 있다고 볼 만한 사정이 없는 이상, 진료의 결과만을 근거로 하여 그 진료방법을 선택한 것이 과실에 해당한다고 말할 수 없다.", true, "▸ 의사에게는 적절하다고 판단되는 진료방법을 선택할 폭넓은 재량권이 있으므로, 의사가 특정 진료방법을 선택하여 진료를 하였다면 해당 진료방법 선택과정에 합리성이 결여되어 있다고 볼 만한 사정이 없는 이상 진료의 결과만을 근거로 하여 그 중 어느 진료방법만이 적절하고 다른 진료방법을 선택한 것은 과실에 해당한다고 말할 수 없다(2014도11315).\n\n[제3절 참고 - 과실 관련 조문] 형법 제14조(과실): 정상적으로 기울여야 할 주의를 게을리하여 죄의 성립요소인 사실을 인식하지 못한 행위는 법률에 특별한 규정이 있는 경우에만 처벌한다.", "구성요건론"],
["194", "수술 후 회복과정에 있는 환자에게 인공호흡 준비를 갖추지 않은 상태에서는 사용할 수 없는 약제가 의사들의 과실로 인하여 잘못 처방되었고, 종합병원의 간호사인 피고인이 처방 약제의 기본적인 약효나 부작용 및 주사 투약에 따르는 주의사항 등을 미리 확인 숙지하였다면 과실로 처방된 것임을 알 수 있었음에도 그대로 주사하여 환자가 의식불명 상태에 이르게 된 경우, 간호사인 피고인에게 업무상과실이 인정된다.", true, "▸ 약효와 주의사항 및 그 오용의 치명적 결과를 미리 확인하였다면 위 처방이 너무나 엉뚱한 약제를 투약하라는 내용이어서 필시 착오 또는 실수에 기인한 것이라고 의심할 만한 사정이 있음을 쉽게 인식할 수 있었다면 간호사에게는 그 처방을 기계적으로 실행하기에 앞서 당해 처방의 경위와 내용을 관련자에게 재확인함으로써 그 실행으로 인한 위험을 방지할 주의의무가 있다(2005도8980).\n\n[제3절 참고 - 과실 관련 조문] 형법 제14조(과실): 정상적으로 기울여야 할 주의를 게을리하여 죄의 성립요소인 사실을 인식하지 못한 행위는 법률에 특별한 규정이 있는 경우에만 처벌한다.", "구성요건론"],
["195", "★ 의료행위에 앞서 환자에게 그로 인하여 발생할 수 있는 위험성 등을 구체적으로 설명하여야 하는 주체는 원칙적으로 주된 지위에서 진료하는 의사이므로, 만약 다른 의사에게 설명까지 위임하였다면 자신의 주의의무를 위반한 것이다.[모25]", false, "▸ 의료행위에 앞서 환자에게 그로 인하여 발생할 수 있는 위험성 등을 구체적으로 설명하여야 하는 주체는 원칙적으로 주된 지위에서 진료하는 의사라 할 것이나 특별한 사정이 없는 한 다른 의사를 통한 설명으로도 충분하다(2022도1499).\n\n[제3절 참고 - 과실 관련 조문] 형법 제14조(과실): 정상적으로 기울여야 할 주의를 게을리하여 죄의 성립요소인 사실을 인식하지 못한 행위는 법률에 특별한 규정이 있는 경우에만 처벌한다.", "구성요건론"],
["196", "★ 신뢰의 원칙에 따라 업무상과실범의 성립을 제한하려는 입장에서는 결과불법 측면보다 행위불법 측면이 중시된다.[변26]", true, "▸ 신뢰의 원칙은 객관적 주의의무위반, 즉 과실의 범위를 제한하기 위한 이론이므로 행위불법의 측면을 중시하는 입장이다.\n\n[제3절 참고 - 과실 관련 조문] 형법 제14조(과실): 정상적으로 기울여야 할 주의를 게을리하여 죄의 성립요소인 사실을 인식하지 못한 행위는 법률에 특별한 규정이 있는 경우에만 처벌한다.", "구성요건론"],
["197", "신뢰의 원칙은 허용된 위험의 원리와 더불어 주의의무를 제한하는 기능을 수행하고 의사와 약사 사이는 물론이고 약사와 제약회사 사이에서도 적용될 수 있다.[변13]", true, "▸ 약사는 약의 표시를 신뢰하고 이를 사용한 경우에는 과실이 없다고 볼 수 있다(74도2046). [신뢰의 원칙은 객관적 주의의무의 범위를 제한하는 기능]\n\n[제3절 참고 - 과실 관련 조문] 형법 제14조(과실): 정상적으로 기울여야 할 주의를 게을리하여 죄의 성립요소인 사실을 인식하지 못한 행위는 법률에 특별한 규정이 있는 경우에만 처벌한다.", "구성요건론"],
["198", "의사가 환자에 대하여 주된 의사의 지위에서 진료하는 경우라도, 다른 의사에게 그 관련된 협의진료를 의뢰한 경우처럼 서로 대등한 지위에서 각자의 의료영역을 나누어 환자 진료의 일부를 분담하였다면, 진료를 분담받은 다른 의사의 전적인 과실로 환자에게 발생한 결과에 대하여는 책임을 인정할 수 없다.", true, "▸ 의사가 환자에 대하여 주된 의사의 지위에서 진료하는 경우라도, 자신은 환자의 수술이나 시술에 전념하고 마취과 의사로 하여금 마취와 환자 감시 등을 담당토록 하거나, 특정 의료영역에 관한 진료 도중 환자에게 나타난 문제점이 자신이 맡은 의료영역 내지 전공과목에 관한 것이 아니라 그에 선행하거나 병행하여 이루어진 다른 의사의 의료영역 내지 전공과목에 속하는 등의 사유로 다른 의사에게 그 관련된 협의진료를 의뢰한 경우처럼 서로 대등한 지위에서 각자의 의료영역을 나누어 환자 진료의 일부를 분담하였다면 진료를 분담받은 다른 의사의 전적인 과실로 환자에게 발생한 결과에 대하여는 책임을 인정할 수 없다(2022도1499).\n\n[제3절 참고 - 과실 관련 조문] 형법 제14조(과실): 정상적으로 기울여야 할 주의를 게을리하여 죄의 성립요소인 사실을 인식하지 못한 행위는 법률에 특별한 규정이 있는 경우에만 처벌한다.", "구성요건론"],
["199", "★ 내과의사가 신경과 전문의에 대한 협의진료 결과 신경과 영역에서 이상이 없다는 회신을 받았고, 그 회신을 신뢰하여 뇌혈관계통 질환의 가능성을 염두에 두지 않고 내과 영역의 진료 행위를 계속하다가 피해자의 증세가 호전되기에 이르자 퇴원하도록 조치한 경우, 피해자의 지주막하출혈을 발견하지 못한 데 대하여 내과의사의 업무상과실을 인정할 수 없다.", true, "▸ [AI해설] 내과의사가 신경과 전문의의 협의진료 회신을 신뢰하여 내과 영역의 진료를 계속하다가 퇴원조치한 경우, 지주막하출혈을 발견하지 못한 데 대하여 내과의사의 업무상과실을 인정할 수 없다는 것이 판례의 태도이다(2001도3292).\n\n[제3절 참고 - 과실 관련 조문] 형법 제14조(과실): 정상적으로 기울여야 할 주의를 게을리하여 죄의 성립요소인 사실을 인식하지 못한 행위는 법률에 특별한 규정이 있는 경우에만 처벌한다.", "구성요건론"],
["200", "직책상 주된 의사의 지위에서 지휘·감독 관계에 있는 다른 의사에게 특정 의료행위를 위임하는 수직적 분업의 경우에는, 그 다른 의사에게 전적으로 위임된 것이 아닌 이상 주된 의사는 자신이 주로 담당하는 환자에 대하여 다른 의사가 하는 의료행위의 내용이 적절한 것인지 여부를 확인하고 감독하여야 할 업무상 주의의무가 있다.", true, "▸ [AI해설] 수직적 분업관계에서 다른 의사에게 특정 의료행위가 전적으로 위임된 것이 아닌 이상, 주된 의사는 자신이 담당하는 환자에 대하여 다른 의사의 의료행위 내용이 적절한지 확인·감독할 업무상 주의의무가 있다는 것이 판례의 태도이다(2022도1499).\n\n[제3절 참고 - 과실 관련 조문] 형법 제14조(과실): 정상적으로 기울여야 할 주의를 게을리하여 죄의 성립요소인 사실을 인식하지 못한 행위는 법률에 특별한 규정이 있는 경우에만 처벌한다.", "구성요건론"],
["201", "의사가 간호사에게 수혈을 하도록 지시하였으나 간호사가 수혈할 혈액 봉지를 바꾸어 수혈한 경우 의사에게 과실이 인정되지 않는다.", false, "▸ ① 수혈은 종종 그 과정에서 부작용을 수반하는 의료행위이므로, 수혈을 담당하는 의사는 혈액형의 일치 여부는 물론 수혈의 완성 여부를 확인하고, 수혈 도중에도 세심하게 환자의 반응을 주시하여 부작용이 있을 경우 필요한 조치를 취할 준비를 갖추는 등의 주의의무가 있다. ② 혈액봉지가 바뀔 위험이 있는 상황에서 피고인이 그에 대한 아무런 조치도 취함이 없이 간호사에게 혈액봉지의 교체를 일임한 것이 관행에 따른 것이라는 이유만으로 정당화될 수는 없다(97도2812).\n\n[제3절 참고 - 과실 관련 조문] 형법 제14조(과실): 정상적으로 기울여야 할 주의를 게을리하여 죄의 성립요소인 사실을 인식하지 못한 행위는 법률에 특별한 규정이 있는 경우에만 처벌한다.", "구성요건론"],
["202", "주치의 甲은 경력 7년의 책임간호사 乙에게 종전 처방과 같이 환자 A에게 별다른 부작용이 없었던 소염제·항생제 등을 대퇴부 정맥에 연결된 튜브를 통하여 투여할 것을 지시하였는데 甲의 예견과는 달리 乙이 간호실습생 丙에게 단독으로 정맥주사를 하게 하였고 丙이 대퇴부 정맥튜브와 뇌실외배액관을 착오하여 뇌실외배액관에 주사액을 주입함으로써 A가 사망한 경우, 甲에게 현장에 입회하여 乙의 주사행위를 감독할 업무상 주의의무가 있다고 볼 수 없다.", true, "▸ 간호사가 '진료의 보조'를 함에 있어서는 모든 행위 하나하나마다 항상 의사가 현장에 입회하여 일일이 지도·감독하여야 한다고 할 수는 없고, 경우에 따라서는 의사가 진료의 보조행위 현장에 입회할 필요 없이 일반적인 지도·감독을 하는 것으로 족한 경우도 있을 수 있다(2001도3667). [위 사안에서 의사의 과실 부정]\n\n[제3절 참고 - 과실 관련 조문] 형법 제14조(과실): 정상적으로 기울여야 할 주의를 게을리하여 죄의 성립요소인 사실을 인식하지 못한 행위는 법률에 특별한 규정이 있는 경우에만 처벌한다.", "구성요건론"],
["203", "중앙선 표시가 있는 직선도로에 있어서 특별한 사정이 없는 한 그 대향차선상의 차량은 그 차선을 유지운행하고 도로중앙선을 넘어 반대차선에 진입하지 않으리라고 믿고 운전하면 되고, 대향차선상을 달려오는 차량을 발견하였다 하여 자기가 운전하는 차를 정지 또는 서행하거나 일일이 차량의 동태를 예의주시할 의무가 있다고 할 수 없다.", true, "▸ [AI해설] 중앙선이 있는 직선도로에서 대향차량이 중앙선을 넘어오지 않으리라 믿고 운전하면 족하고, 대향차량을 발견했다고 하여 일일이 그 동태를 예의주시할 의무는 없다는 것이 판례의 태도이다(83도3086).\n\n[제3절 참고 - 과실 관련 조문] 형법 제14조(과실): 정상적으로 기울여야 할 주의를 게을리하여 죄의 성립요소인 사실을 인식하지 못한 행위는 법률에 특별한 규정이 있는 경우에만 처벌한다.", "구성요건론"],
["204", "50여m 후방에서 따라오던 후행차량이 중앙선을 넘어 피고인 운전차량의 좌측으로 돌진하는 등 극히 비정상적인 방법으로 진행하여 충돌하였더라도, 피고인이 좌회전 금지구역에서 좌회전한 행위와 이 사건 사고발생 사이에는 상당인과관계가 인정된다.", false, "▸ 피고인이 좌회전 금지구역에서 좌회전한 것은 잘못이나 이러한 경우에도 피고인으로서는 50여m 후방에서 따라오던 후행차량이 중앙선을 넘어 피고인 운전차량의 좌측으로 돌진하는 등 극히 비정상적인 방법으로 진행할 것까지를 예상하여 사고발생 방지조치를 취하여야 할 업무상 주의의무가 있다고 할 수는 없고, 따라서 피고인이 좌회전 금지구역에서 좌회전한 행위와 이 사건 사고발생 사이에 상당인과관계가 인정되지 아니한다(95도1200).\n\n[제3절 참고 - 과실 관련 조문] 형법 제14조(과실): 정상적으로 기울여야 할 주의를 게을리하여 죄의 성립요소인 사실을 인식하지 못한 행위는 법률에 특별한 규정이 있는 경우에만 처벌한다.", "구성요건론"],
["205", "교차로를 녹색등화에 따라 직진하는 차량의 운전자는 특별한 사정이 없는 이상, 다른 차량들도 교통법규를 준수하고 충돌을 피하기 위하여 적절한 조치를 취할 것으로 믿고 운전하면 족하고, 다른 차량이 신호를 위반하고 직진하는 차량의 앞을 가로질러 좌회전할 경우까지를 예상하여 그에 따른 사고발생을 미연에 방지할 특별한 조치까지 강구할 업무상의 주의의무는 없다.", true, "▸ 운전자가 제한속도를 지키며 진행하였더라면 피해자가 좌회전하여 진입하는 것을 발견한 후에 충돌을 피할 수 있었다는 등의 사정이 없는 한, 운전자가 제한속도를 초과하여 과속으로 진행한 잘못이 있다 하더라도 그러한 잘못과 교통사고의 발생 사이에 상당인과관계가 있다고 볼 수는 없다(98도1854).\n\n[제3절 참고 - 과실 관련 조문] 형법 제14조(과실): 정상적으로 기울여야 할 주의를 게을리하여 죄의 성립요소인 사실을 인식하지 못한 행위는 법률에 특별한 규정이 있는 경우에만 처벌한다.", "구성요건론"],
["206", "도로상에서 자기 차로를 따라 진행하는 운전자가 갑자기 진행 차로의 정중앙에서 벗어나 다른 차로와 근접한 위치에서 운전하였다면, 다른 차로에서 뒤따라오는 차량과의 관계에서 운전자로서의 업무상의 주의의무를 위반한 과실이 있다.", false, "▸ 단순히 갑자기 진행차로의 정중앙에서 벗어나 다른 차로와 근접한 위치에서 운전하였다는 것만으로는 다른 차로에서 뒤따라오는 차량과의 관계에서 운전자로서의 업무상의 주의의무를 위반한 과실이 있다고 할 수 없다(98도297).\n\n[제3절 참고 - 과실 관련 조문] 형법 제14조(과실): 정상적으로 기울여야 할 주의를 게을리하여 죄의 성립요소인 사실을 인식하지 못한 행위는 법률에 특별한 규정이 있는 경우에만 처벌한다.", "구성요건론"],
["207", "횡단보도에서 신호를 무시하고 갑자기 무단횡단하는 오토바이 운전자를 치어 사망에 이르게 한 차량의 운전자는 교통법규를 준수해서 그 차량을 운행했더라도 업무상과실치사죄의 죄책을 면할 수 없다.[모25]", false, "▸ 제한속도를 준수하며 진행하는 피고인으로서는 신호기의 차량진행신호에 따라 그대로 진행하면 족하고 위 피해자 운전의 오토바이가 신호를 무시하고 갑자기 위 횡단보도를 무단횡단할 경우까지를 예상하여 사고예방을 위한 필요한 조치를 취하여야 할 업무상 주의의무는 없다(94도548).\n\n[제3절 참고 - 과실 관련 조문] 형법 제14조(과실): 정상적으로 기울여야 할 주의를 게을리하여 죄의 성립요소인 사실을 인식하지 못한 행위는 법률에 특별한 규정이 있는 경우에만 처벌한다.", "구성요건론"],
["208", "운전자에게 야간에 무등화인 자전거를 타고 차도를 무단횡단하는 경우까지를 예상하여 제한속력을 감속하고 잘 보이지 않는 반대차선상의 동태까지 살피면서 서행운행할 주의의무가 있다고 할 수 없다.", true, "▸ [AI해설] 운전자에게 야간에 무등화 자전거를 타고 차도를 무단횡단하는 경우까지 예상하여 감속·서행할 주의의무는 없다는 것이 판례의 태도이다(84도1695).\n\n[제3절 참고 - 과실 관련 조문] 형법 제14조(과실): 정상적으로 기울여야 할 주의를 게을리하여 죄의 성립요소인 사실을 인식하지 못한 행위는 법률에 특별한 규정이 있는 경우에만 처벌한다.", "구성요건론"],
["209", "★ 고속도로를 운행하는 자동차의 운전자로서는 일반적인 경우에 고속도로를 횡단하는 보행자가 있을 것까지 예견하여 보행자와의 충돌사고를 예방하기 위하여 급정차 등의 조치를 취할 수 있도록 대비하면서 운전할 주의의무가 없다.", true, "▸ [AI해설] 고속도로를 운행하는 자동차 운전자에게는 통상 보행자가 고속도로를 횡단할 것까지 예견하여 급정차 등 대비할 주의의무가 없다는 것이 판례의 태도이다(2000도2671).\n\n[제3절 참고 - 과실 관련 조문] 형법 제14조(과실): 정상적으로 기울여야 할 주의를 게을리하여 죄의 성립요소인 사실을 인식하지 못한 행위는 법률에 특별한 규정이 있는 경우에만 처벌한다.", "구성요건론"],
["210", "甲이 1차로에서 2차로로 진로를 변경하여 고속버스를 추월한 직후에 A가 우측 도로변에 서 있다가 甲 운전의 자동차 30 내지 40m 전방에서 고속도로를 무단횡단하기 위하여 2차로로 갑자기 뛰어들었고, 甲은 그제서야 무단횡단하는 피해자 등을 발견하였는데 충격을 피할 수 있는 조치를 하기에 이미 늦어 A를 충격하게 된 경우, 甲이 야간에 고속버스와의 안전거리를 확보하지 아니한 채 진행하다가 고속버스의 우측으로 제한최고속도를 시속 20km 초과하여 고속버스를 추월한 잘못이 있더라도, 甲의 위와 같은 잘못과 이 사건 사고결과와의 사이에 상당인과관계가 인정되지 않는다.", true, "▸ [AI해설] 야간에 안전거리를 확보하지 않고 제한최고속도를 초과하여 고속버스를 추월한 잘못이 있더라도, 무단횡단하는 보행자를 충격한 사고결과와의 사이에 상당인과관계가 인정되지 않는다는 것이 판례의 태도이다(2000도2671).\n\n[제3절 참고 - 과실 관련 조문] 형법 제14조(과실): 정상적으로 기울여야 할 주의를 게을리하여 죄의 성립요소인 사실을 인식하지 못한 행위는 법률에 특별한 규정이 있는 경우에만 처벌한다.", "구성요건론"],
["211", "★ 자동차전용도로에서 시속 50km의 속력으로 자동차를 운전한 자가 운전 중 20m 전방의 사람을 발견하였을 때 통상의 주의의무만 다하였더라면 사고를 미연에 방지할 수 있었다면, 자동차를 운전하는 자로서는 그 사람의 동정을 주의 깊게 살펴 불의에 야기될지도 모르는 사고를 미연에 방지하여야 할 업무상의 주의의무가 있다.", true, "▸ [AI해설] 자동차전용도로에서 전방의 사람을 발견하였을 때 통상의 주의의무만 다하였더라면 사고를 방지할 수 있었던 경우에는 운전자에게 그 동정을 주의 깊게 살펴 사고를 미연에 방지할 업무상 주의의무가 있다는 것이 판례의 태도이다(77도2559).\n\n[제3절 참고 - 과실 관련 조문] 형법 제14조(과실): 정상적으로 기울여야 할 주의를 게을리하여 죄의 성립요소인 사실을 인식하지 못한 행위는 법률에 특별한 규정이 있는 경우에만 처벌한다.", "구성요건론"],
["212", "고속도로상을 운행하는 자동차운전자는 통상의 경우 보행인이 그 도로의 중앙방면으로 갑자기 뛰어드는 일이 없으리라는 신뢰하에서 운행하는 것이지만 위 도로를 횡단하려는 피해자를 그 차의 제동거리 밖에서 발견하였다면 피해자가 반대 차선의 교행차량 때문에 도로를 완전히 횡단하지 못하고 그 진행차선쪽에서 멈추거나 다시 되돌아 나가는 경우를 예견해야 하는 것이다.", true, "▸ [AI해설] 고속도로를 횡단하려는 보행자를 제동거리 밖에서 발견한 경우에는, 그 보행자가 교행차량으로 인해 진행차선쪽에서 멈추거나 되돌아 나갈 가능성까지 예견해야 한다는 것이 판례의 태도이다(80도3305).\n\n[제3절 참고 - 과실 관련 조문] 형법 제14조(과실): 정상적으로 기울여야 할 주의를 게을리하여 죄의 성립요소인 사실을 인식하지 못한 행위는 법률에 특별한 규정이 있는 경우에만 처벌한다.", "구성요건론"],
["213", "★ 직진 및 좌회전신호에 의하여 좌회전하는 2대의 차량 뒤를 따라 직진하는 차량의 운전사로서는 횡단보도의 신호가 적색인 상태에서 반대차선상에 정지하여 있는 차량의 뒤로 보행자가 횡단보도를 건너오지 않을 것이라고 신뢰하는 것이 당연하고 그렇지 아니할 사태까지 예상하여 그에 대한 주의의무를 다하여야 한다고는 할 수 없고, 운전사가 무면허인 상태에서 제한속도를 초과하여 진행한 잘못이 있다 하더라도 그러한 잘못이 사고의 원인이 되었다고는 볼 수 없다.", true, "▸ [AI해설] 좌회전 차량 뒤를 따라 직진하는 차량의 운전자는 적색신호에 정지한 반대차선 차량 뒤로 보행자가 건너오지 않을 것으로 신뢰하면 족하고, 무면허·제한속도 초과 등의 잘못이 있더라도 그것이 사고의 원인이 되었다고 볼 수 없다는 것이 판례의 태도이다(87도1332).\n\n[제3절 참고 - 과실 관련 조문] 형법 제14조(과실): 정상적으로 기울여야 할 주의를 게을리하여 죄의 성립요소인 사실을 인식하지 못한 행위는 법률에 특별한 규정이 있는 경우에만 처벌한다.", "구성요건론"],
["214", "살인죄와 상해치사죄 및 과실치사죄의 법정형이 서로 다른 것은 결과불법보다 행위불법 측면을 중시한 결과이다.", true, "▸ 결과불법은 동일하지만, 행위불법에 따라 형이 다른 것이다.\n\n[제4절 참고 - 결과적 가중범 조문 및 유형 정리] 형법 제15조(사실의 착오) ②: 결과 때문에 형이 무거워지는 죄의 경우에 그 결과의 발생을 예견할 수 없었을 때에는 무거운 죄로 벌하지 아니한다. [미수범 처벌규정 존재] 진정결과적가중범: 인질치사상죄, 강도치사상죄, 해상강도치사상죄, 성폭법위반(강간등치사상). 부진정결과적가중범: 현주건조물일수치사상죄. [미수범 처벌규정 부존재(외관상 존재)] 진정결과적가중범: 특수공무집행방해치사죄, 교통방해치사죄, 형법상 강간등치사상죄, 특가법위반(운전자폭행등)치사죄. 부진정결과적가중범: 현주건조물방화치사상죄(제164조 제2항), 특수공무집행방해치상죄(제144조 제2항), 교통방해치상죄(제188조), (존속)중상해죄(제258조), 중유기죄(제271조 제3항·제4항), 중손괴죄(제368조 제2항), 중권리행사방해죄(제336조), 특가법위반(운전자폭행등)치상죄(특가법 제5조의10 제2항).", "구성요건론"],
["215", "결과적 가중범은 고의 있는 기본범죄에 전형적으로 내포된 잠재적인 위험이 중한 결과로 실현된 것이라는 점에서 일반 과실범에 의한 결과 실현보다 행위반가치가 크다.", true, "▸ 결과불법은 동일하지만, 행위불법에 따라 형이 다른 것이다.\n\n[제4절 참고 - 결과적 가중범 조문 및 유형 정리] 형법 제15조(사실의 착오) ②: 결과 때문에 형이 무거워지는 죄의 경우에 그 결과의 발생을 예견할 수 없었을 때에는 무거운 죄로 벌하지 아니한다. [미수범 처벌규정 존재] 진정결과적가중범: 인질치사상죄, 강도치사상죄, 해상강도치사상죄, 성폭법위반(강간등치사상). 부진정결과적가중범: 현주건조물일수치사상죄. [미수범 처벌규정 부존재(외관상 존재)] 진정결과적가중범: 특수공무집행방해치사죄, 교통방해치사죄, 형법상 강간등치사상죄, 특가법위반(운전자폭행등)치사죄. 부진정결과적가중범: 현주건조물방화치사상죄(제164조 제2항), 특수공무집행방해치상죄(제144조 제2항), 교통방해치상죄(제188조), (존속)중상해죄(제258조), 중유기죄(제271조 제3항·제4항), 중손괴죄(제368조 제2항), 중권리행사방해죄(제336조), 특가법위반(운전자폭행등)치상죄(특가법 제5조의10 제2항).", "구성요건론"],
["216", "기본범죄가 예비단계에 그친 상태에서 중한 결과가 발생한 경우에도 결과적 가중범의 기수범이 성립한다.", false, "▸ 기본범죄는 기수 또는 미수이어야 한다. 실행의 착수 전인 예비단계에 그친 경우에는 결과적 가중범이 성립할 여지가 없다.\n\n[제4절 참고 - 결과적 가중범 조문 및 유형 정리] 형법 제15조(사실의 착오) ②: 결과 때문에 형이 무거워지는 죄의 경우에 그 결과의 발생을 예견할 수 없었을 때에는 무거운 죄로 벌하지 아니한다. [미수범 처벌규정 존재] 진정결과적가중범: 인질치사상죄, 강도치사상죄, 해상강도치사상죄, 성폭법위반(강간등치사상). 부진정결과적가중범: 현주건조물일수치사상죄. [미수범 처벌규정 부존재(외관상 존재)] 진정결과적가중범: 특수공무집행방해치사죄, 교통방해치사죄, 형법상 강간등치사상죄, 특가법위반(운전자폭행등)치사죄. 부진정결과적가중범: 현주건조물방화치사상죄(제164조 제2항), 특수공무집행방해치상죄(제144조 제2항), 교통방해치상죄(제188조), (존속)중상해죄(제258조), 중유기죄(제271조 제3항·제4항), 중손괴죄(제368조 제2항), 중권리행사방해죄(제336조), 특가법위반(운전자폭행등)치상죄(특가법 제5조의10 제2항).", "구성요건론"],
["217", "진정결과적 가중범에서 기본범죄에 대하여 위법성조각사유가 인정되면 중한 결과에 대한 과실범만 문제된다.", true, "▸ 결과적 가중범이 인정되기 위해서는 위법성과 책임도 존재하여야 한다. 따라서 진정결과적 가중범에서 기본범죄에 대하여 위법성조각사유가 인정되면 기본범죄가 성립하지 않으므로, 결과적 가중범이 성립할 수 없다.\n\n[제4절 참고 - 결과적 가중범 조문 및 유형 정리] 형법 제15조(사실의 착오) ②: 결과 때문에 형이 무거워지는 죄의 경우에 그 결과의 발생을 예견할 수 없었을 때에는 무거운 죄로 벌하지 아니한다. [미수범 처벌규정 존재] 진정결과적가중범: 인질치사상죄, 강도치사상죄, 해상강도치사상죄, 성폭법위반(강간등치사상). 부진정결과적가중범: 현주건조물일수치사상죄. [미수범 처벌규정 부존재(외관상 존재)] 진정결과적가중범: 특수공무집행방해치사죄, 교통방해치사죄, 형법상 강간등치사상죄, 특가법위반(운전자폭행등)치사죄. 부진정결과적가중범: 현주건조물방화치사상죄(제164조 제2항), 특수공무집행방해치상죄(제144조 제2항), 교통방해치상죄(제188조), (존속)중상해죄(제258조), 중유기죄(제271조 제3항·제4항), 중손괴죄(제368조 제2항), 중권리행사방해죄(제336조), 특가법위반(운전자폭행등)치상죄(특가법 제5조의10 제2항).", "구성요건론"],
["218", "기본행위와 중한 결과 사이에 인과관계가 있다고 하더라도 행위자가 행위 시에 그 결과의 발생을 예견할 수 없을 때에는 중한 죄로 벌할 수 없다.", true, "▸ 결과적 가중범은 행위자가 행위시에 그 결과의 발생을 예견할 수 없을 때에는 비록 그 행위와 결과 사이에 인과관계가 있다 하더라도 중한 죄로 벌할 수 없다(88도178). [결과적 가중범이 아닌 고의의 기본범죄 성립만이 문제된다.]\n\n[제4절 참고 - 결과적 가중범 조문 및 유형 정리] 형법 제15조(사실의 착오) ②: 결과 때문에 형이 무거워지는 죄의 경우에 그 결과의 발생을 예견할 수 없었을 때에는 무거운 죄로 벌하지 아니한다. [미수범 처벌규정 존재] 진정결과적가중범: 인질치사상죄, 강도치사상죄, 해상강도치사상죄, 성폭법위반(강간등치사상). 부진정결과적가중범: 현주건조물일수치사상죄. [미수범 처벌규정 부존재(외관상 존재)] 진정결과적가중범: 특수공무집행방해치사죄, 교통방해치사죄, 형법상 강간등치사상죄, 특가법위반(운전자폭행등)치사죄. 부진정결과적가중범: 현주건조물방화치사상죄(제164조 제2항), 특수공무집행방해치상죄(제144조 제2항), 교통방해치상죄(제188조), (존속)중상해죄(제258조), 중유기죄(제271조 제3항·제4항), 중손괴죄(제368조 제2항), 중권리행사방해죄(제336조), 특가법위반(운전자폭행등)치상죄(특가법 제5조의10 제2항).", "구성요건론"],
["219", "결과적 가중범의 공동정범은 기본행위를 공동으로 할 의사와 결과를 공동으로 할 의사가 있어야 성립한다.", false, "▸ 결과적 가중범인 상해치사죄의 공동정범은 폭행 기타의 신체침해 행위를 공동으로 할 의사가 있으면 성립되고 결과를 공동으로 할 의사는 필요 없다(2013도1222).\n\n[제4절 참고 - 결과적 가중범 조문 및 유형 정리] 형법 제15조(사실의 착오) ②: 결과 때문에 형이 무거워지는 죄의 경우에 그 결과의 발생을 예견할 수 없었을 때에는 무거운 죄로 벌하지 아니한다. [미수범 처벌규정 존재] 진정결과적가중범: 인질치사상죄, 강도치사상죄, 해상강도치사상죄, 성폭법위반(강간등치사상). 부진정결과적가중범: 현주건조물일수치사상죄. [미수범 처벌규정 부존재(외관상 존재)] 진정결과적가중범: 특수공무집행방해치사죄, 교통방해치사죄, 형법상 강간등치사상죄, 특가법위반(운전자폭행등)치사죄. 부진정결과적가중범: 현주건조물방화치사상죄(제164조 제2항), 특수공무집행방해치상죄(제144조 제2항), 교통방해치상죄(제188조), (존속)중상해죄(제258조), 중유기죄(제271조 제3항·제4항), 중손괴죄(제368조 제2항), 중권리행사방해죄(제336조), 특가법위반(운전자폭행등)치상죄(특가법 제5조의10 제2항).", "구성요건론"],
["220", "상해치사죄의 공동정범은 폭행 기타의 신체침해 행위와 과실에 의한 중한 결과를 공동으로 할 의사가 있어야 성립한다.", false, "▸ 결과적 가중범인 상해치사죄의 공동정범은 폭행 기타의 신체침해 행위를 공동으로 할 의사가 있으면 성립되고 결과를 공동으로 할 의사는 필요 없다(2013도1222).\n\n[제4절 참고 - 결과적 가중범 조문 및 유형 정리] 형법 제15조(사실의 착오) ②: 결과 때문에 형이 무거워지는 죄의 경우에 그 결과의 발생을 예견할 수 없었을 때에는 무거운 죄로 벌하지 아니한다. [미수범 처벌규정 존재] 진정결과적가중범: 인질치사상죄, 강도치사상죄, 해상강도치사상죄, 성폭법위반(강간등치사상). 부진정결과적가중범: 현주건조물일수치사상죄. [미수범 처벌규정 부존재(외관상 존재)] 진정결과적가중범: 특수공무집행방해치사죄, 교통방해치사죄, 형법상 강간등치사상죄, 특가법위반(운전자폭행등)치사죄. 부진정결과적가중범: 현주건조물방화치사상죄(제164조 제2항), 특수공무집행방해치상죄(제144조 제2항), 교통방해치상죄(제188조), (존속)중상해죄(제258조), 중유기죄(제271조 제3항·제4항), 중손괴죄(제368조 제2항), 중권리행사방해죄(제336조), 특가법위반(운전자폭행등)치상죄(특가법 제5조의10 제2항).", "구성요건론"],
["221", "결과적 가중범은 중한 결과가 발생하여야 성립되는 범죄이므로 「형법」에는 결과적 가중범의 미수를 처벌하는 규정을 두고 있지 않다.", false, "▸ 강도치사상죄(제342조) 등 규정상으로는 결과적 가중범의 미수범을 처벌하는 것으로 보이는 규정을 두고 있다. [외관상]\n\n[제4절 참고 - 결과적 가중범 조문 및 유형 정리] 형법 제15조(사실의 착오) ②: 결과 때문에 형이 무거워지는 죄의 경우에 그 결과의 발생을 예견할 수 없었을 때에는 무거운 죄로 벌하지 아니한다. [미수범 처벌규정 존재] 진정결과적가중범: 인질치사상죄, 강도치사상죄, 해상강도치사상죄, 성폭법위반(강간등치사상). 부진정결과적가중범: 현주건조물일수치사상죄. [미수범 처벌규정 부존재(외관상 존재)] 진정결과적가중범: 특수공무집행방해치사죄, 교통방해치사죄, 형법상 강간등치사상죄, 특가법위반(운전자폭행등)치사죄. 부진정결과적가중범: 현주건조물방화치사상죄(제164조 제2항), 특수공무집행방해치상죄(제144조 제2항), 교통방해치상죄(제188조), (존속)중상해죄(제258조), 중유기죄(제271조 제3항·제4항), 중손괴죄(제368조 제2항), 중권리행사방해죄(제336조), 특가법위반(운전자폭행등)치상죄(특가법 제5조의10 제2항).", "구성요건론"],
["222", "결과적 가중범의 미수범 규정이 있는 경우, 기본범죄가 미수에 그친 때에는 결과적 가중범의 미수범이 성립된다.", false, "▸ 제337조의 강도상해와 치상죄는 재물강취의 기수와 미수를 불문하고 범인이 강도범행의 기회에 사람을 상해하거나 치상하게 되면 성립하는 것이다(86도1526). [판례는 결과적 가중범의 미수를 인정하지 않음]\n\n[제4절 참고 - 결과적 가중범 조문 및 유형 정리] 형법 제15조(사실의 착오) ②: 결과 때문에 형이 무거워지는 죄의 경우에 그 결과의 발생을 예견할 수 없었을 때에는 무거운 죄로 벌하지 아니한다. [미수범 처벌규정 존재] 진정결과적가중범: 인질치사상죄, 강도치사상죄, 해상강도치사상죄, 성폭법위반(강간등치사상). 부진정결과적가중범: 현주건조물일수치사상죄. [미수범 처벌규정 부존재(외관상 존재)] 진정결과적가중범: 특수공무집행방해치사죄, 교통방해치사죄, 형법상 강간등치사상죄, 특가법위반(운전자폭행등)치사죄. 부진정결과적가중범: 현주건조물방화치사상죄(제164조 제2항), 특수공무집행방해치상죄(제144조 제2항), 교통방해치상죄(제188조), (존속)중상해죄(제258조), 중유기죄(제271조 제3항·제4항), 중손괴죄(제368조 제2항), 중권리행사방해죄(제336조), 특가법위반(운전자폭행등)치상죄(특가법 제5조의10 제2항).", "구성요건론"],
["223", "강간이 미수에 그친 경우라도 강간의 수단이 된 폭행으로 인하여 피해자가 상해를 입었다면 강간치상죄가 성립할 수 있고, 이 경우 피고인이 자의로 실행에 착수한 행위를 중지하였더라도 마찬가지이다.", true, "▸ [AI해설] 강간이 미수에 그친 경우라도 강간의 수단이 된 폭행으로 피해자가 상해를 입었다면 강간치상죄가 성립할 수 있고, 이는 피고인이 자의로 실행에 착수한 행위를 중지한 경우(중지미수)에도 마찬가지라는 것이 판례의 태도이다(88도1628).\n\n[제4절 참고 - 결과적 가중범 조문 및 유형 정리] 형법 제15조(사실의 착오) ②: 결과 때문에 형이 무거워지는 죄의 경우에 그 결과의 발생을 예견할 수 없었을 때에는 무거운 죄로 벌하지 아니한다. [미수범 처벌규정 존재] 진정결과적가중범: 인질치사상죄, 강도치사상죄, 해상강도치사상죄, 성폭법위반(강간등치사상). 부진정결과적가중범: 현주건조물일수치사상죄. [미수범 처벌규정 부존재(외관상 존재)] 진정결과적가중범: 특수공무집행방해치사죄, 교통방해치사죄, 형법상 강간등치사상죄, 특가법위반(운전자폭행등)치사죄. 부진정결과적가중범: 현주건조물방화치사상죄(제164조 제2항), 특수공무집행방해치상죄(제144조 제2항), 교통방해치상죄(제188조), (존속)중상해죄(제258조), 중유기죄(제271조 제3항·제4항), 중손괴죄(제368조 제2항), 중권리행사방해죄(제336조), 특가법위반(운전자폭행등)치상죄(특가법 제5조의10 제2항).", "구성요건론"],
["224", "★ 甲이 A에 대한 살인의 고의로 A가 자고 있는 집에 불을 놓아 불이 A의 집 안방 천장까지 붙었으나 A가 잠에서 깨어 집 밖으로 빠져나오는 바람에 살인의 목적을 달성하지 못하였다면, 甲은 현주건조물방화치사죄의 미수범으로 처벌된다.[변24]", false, "▸ ① 현주건조물방화죄는 화력이 매개물을 떠나 목적물인 건조물 스스로 연소할 수 있는 상태에 이름으로써 기수가 된다. ② 피고인이 피해자의 사체 위에 옷가지 등을 올려놓고 불을 붙인 천조각을 던져 그 불길이 방안을 태우면서 천정에까지 옮겨 붙었다면 설령 그 불이 완전연소에 이르지 못하고 도중에 진화되었다고 하더라도, 일단 천정에 옮겨 붙은 이상 그때에 이미 현주건조물방화죄는 기수에 이르렀다(2006도9164). [현주건조물방화치사죄는 미수범 처벌규정이 없다. 현주건조물방화죄(기수)와 살인미수죄의 장애미수 또는 중지미수가 성립한다.]\n\n[제4절 참고 - 결과적 가중범 조문 및 유형 정리] 형법 제15조(사실의 착오) ②: 결과 때문에 형이 무거워지는 죄의 경우에 그 결과의 발생을 예견할 수 없었을 때에는 무거운 죄로 벌하지 아니한다. [미수범 처벌규정 존재] 진정결과적가중범: 인질치사상죄, 강도치사상죄, 해상강도치사상죄, 성폭법위반(강간등치사상). 부진정결과적가중범: 현주건조물일수치사상죄. [미수범 처벌규정 부존재(외관상 존재)] 진정결과적가중범: 특수공무집행방해치사죄, 교통방해치사죄, 형법상 강간등치사상죄, 특가법위반(운전자폭행등)치사죄. 부진정결과적가중범: 현주건조물방화치사상죄(제164조 제2항), 특수공무집행방해치상죄(제144조 제2항), 교통방해치상죄(제188조), (존속)중상해죄(제258조), 중유기죄(제271조 제3항·제4항), 중손괴죄(제368조 제2항), 중권리행사방해죄(제336조), 특가법위반(운전자폭행등)치상죄(특가법 제5조의10 제2항).", "구성요건론"],

["226", "★ 甲이 위험한 물건인 전기충격기를 사용하여 A에 대한 강간을 시도하다가 미수에 그쳤다 하더라도 그로 인하여 A에게 약 2주간의 치료를 요하는 안면부 좌상 등 치상의 결과를 초래하였다면, 甲에게는 「성폭력범죄의 처벌 등에 관한 특례법」 위반의 특수강간치상죄의 기수가 성립한다.", true, "▸ ① 성폭법 제4조 제1항에서 정한 특수강간의 죄를 범한 경우뿐만 아니라 특수강간의 실행에 착수하였으나 미수에 그친 경우라고 하더라도, 이로 인하여 피해자가 상해를 입었으면 특수강간치상죄가 성립한다. ② 후자의 경우 특수강간치상죄의 기수범이 성립할 뿐, 성폭법 제15조가 다시 적용되어 특수강간치상죄의 미수범이 성립하는 것은 아니다. ③ 성폭법 제15조에서 정한 제8조 제1항에 대한 미수범 처벌규정은 제8조 제1항에 특수강간치상죄와 함께 규정된 특수강간상해죄의 미수범, 즉 특수강간의 죄를 범하거나 미수에 그친 사람이 상해의 고의를 가지고 피해자에게 상해를 가하려다가 미수에 그친 경우에 적용될 뿐, 제8조 제1항에서 정한 특수강간치상죄에는 적용된다고 볼 수 없다. 형법과 형사특별법에 규정되어 있는 결과적 가중범 중 특수강간치상죄와 같이 별도의 미수범 처벌규정을 두고 있는 것은 입법자가 결과적 가중범에는 성질상 미수범 규정이 적용될 수 없다는 전제에서 간결하고 효율적으로 조문을 구성한 결과로 볼 수 있을 뿐, 결과적 가중범의 미수범을 인정하기 위한 입법형식이라고 할 수 없다. 따라서 이러한 규정을 들어 결과적 가중범의 미수범을 인정하고 형을 감경할 수 있다고 보는 것은 입법자의 실질적 의사에 반하게 된다(2023도10405).\n\n[제4절 참고 - 결과적 가중범 조문 및 유형 정리] 형법 제15조(사실의 착오) ②: 결과 때문에 형이 무거워지는 죄의 경우에 그 결과의 발생을 예견할 수 없었을 때에는 무거운 죄로 벌하지 아니한다. [미수범 처벌규정 존재] 진정결과적가중범: 인질치사상죄, 강도치사상죄, 해상강도치사상죄, 성폭법위반(강간등치사상). 부진정결과적가중범: 현주건조물일수치사상죄. [미수범 처벌규정 부존재(외관상 존재)] 진정결과적가중범: 특수공무집행방해치사죄, 교통방해치사죄, 형법상 강간등치사상죄, 특가법위반(운전자폭행등)치사죄. 부진정결과적가중범: 현주건조물방화치사상죄(제164조 제2항), 특수공무집행방해치상죄(제144조 제2항), 교통방해치상죄(제188조), (존속)중상해죄(제258조), 중유기죄(제271조 제3항·제4항), 중손괴죄(제368조 제2항), 중권리행사방해죄(제336조), 특가법위반(운전자폭행등)치상죄(특가법 제5조의10 제2항).", "구성요건론"],
["227", "★ 「성폭력범죄의 처벌 등에 관한 특례법」은 결과적 가중범인 특수강간치상죄의 미수범을 처벌하는 규정을 두고 있는데, 이는 입법자가 결과적 가중범의 미수범을 인정하기 위한 입법이라고 볼 수 있다.[변26]", false, "▸ ① 성폭법 제4조 제1항에서 정한 특수강간의 죄를 범한 경우뿐만 아니라 특수강간의 실행에 착수하였으나 미수에 그친 경우라고 하더라도, 이로 인하여 피해자가 상해를 입었으면 특수강간치상죄가 성립한다. ② 후자의 경우 특수강간치상죄의 기수범이 성립할 뿐, 성폭법 제15조가 다시 적용되어 특수강간치상죄의 미수범이 성립하는 것은 아니다. ③ 형법과 형사특별법에 규정되어 있는 결과적 가중범 중 특수강간치상죄와 같이 별도의 미수범 처벌규정을 두고 있는 것은 입법자가 결과적 가중범에는 성질상 미수범 규정이 적용될 수 없다는 전제에서 간결하고 효율적으로 조문을 구성한 결과로 볼 수 있을 뿐, 결과적 가중범의 미수범을 인정하기 위한 입법형식이라고 할 수 없다(2023도10405).\n\n[제4절 참고 - 결과적 가중범 조문 및 유형 정리] 형법 제15조(사실의 착오) ②: 결과 때문에 형이 무거워지는 죄의 경우에 그 결과의 발생을 예견할 수 없었을 때에는 무거운 죄로 벌하지 아니한다. [미수범 처벌규정 존재] 진정결과적가중범: 인질치사상죄, 강도치사상죄, 해상강도치사상죄, 성폭법위반(강간등치사상). 부진정결과적가중범: 현주건조물일수치사상죄. [미수범 처벌규정 부존재(외관상 존재)] 진정결과적가중범: 특수공무집행방해치사죄, 교통방해치사죄, 형법상 강간등치사상죄, 특가법위반(운전자폭행등)치사죄. 부진정결과적가중범: 현주건조물방화치사상죄(제164조 제2항), 특수공무집행방해치상죄(제144조 제2항), 교통방해치상죄(제188조), (존속)중상해죄(제258조), 중유기죄(제271조 제3항·제4항), 중손괴죄(제368조 제2항), 중권리행사방해죄(제336조), 특가법위반(운전자폭행등)치상죄(특가법 제5조의10 제2항).", "구성요건론"],
["228", "★ 「성폭력범죄의 처벌 등에 관한 특례법」이 규정하고 있는 특수강간치상죄와 관련하여 특수강간이 미수인 상태에서 그 기회에 과실로 상해의 중한 결과가 발생한 경우 결과적 가중범의 미수가 인정될 수 없기 때문에 특수강간미수와 과실치상죄의 상상적 경합으로 처리되어야 한다.[변14]", false, "▸ 성폭법 제4조 제1항에서 정한 특수강간의 죄를 범한 경우뿐만 아니라 특수강간의 실행에 착수하였으나 미수에 그친 경우라고 하더라도, 이로 인하여 피해자가 상해를 입었으면 특수강간치상죄(기수)가 성립하고, 특수강간미수와 과실치상죄의 상상적 경합으로 처리되는 것이 아니다(2023도10405).\n\n[제4절 참고 - 결과적 가중범 조문 및 유형 정리] 형법 제15조(사실의 착오) ②: 결과 때문에 형이 무거워지는 죄의 경우에 그 결과의 발생을 예견할 수 없었을 때에는 무거운 죄로 벌하지 아니한다. [미수범 처벌규정 존재] 진정결과적가중범: 인질치사상죄, 강도치사상죄, 해상강도치사상죄, 성폭법위반(강간등치사상). 부진정결과적가중범: 현주건조물일수치사상죄. [미수범 처벌규정 부존재(외관상 존재)] 진정결과적가중범: 특수공무집행방해치사죄, 교통방해치사죄, 형법상 강간등치사상죄, 특가법위반(운전자폭행등)치사죄. 부진정결과적가중범: 현주건조물방화치사상죄(제164조 제2항), 특수공무집행방해치상죄(제144조 제2항), 교통방해치상죄(제188조), (존속)중상해죄(제258조), 중유기죄(제271조 제3항·제4항), 중손괴죄(제368조 제2항), 중권리행사방해죄(제336조), 특가법위반(운전자폭행등)치상죄(특가법 제5조의10 제2항).", "구성요건론"],
["229", "부진정결과적 가중범의 예로는 현주건조물방화치사상죄, 현주건조물일수치사상죄, 중체포·감금죄 등이 있다.[변16]", false, "▸ 사람을 체포 또는 감금하여 가혹한 행위를 가한 자는 7년 이하의 징역에 처한다(제277조). 중체포·감금죄는 체포·감금과 가혹한 행위의 결합범으로 부진정결과적 가중범이 아니다(결합범). 현주건조물방화치'사상'죄, 현주건조물일수치'사상'죄는 부진정결과적 가중범이다.\n\n[III. 부진정결과적 가중범 - 인정이유 참고(현주건조물방화치사죄)] A의 집에 방화하여 '과실'로 A가 사망한 경우(A가 없는 줄 알고 방화했는데 A가 있었던 경우): 진정·부진정 어느 해석이든 결론은 현주건조물방화치사죄(제164조 제2항, 사형·무기 또는 7년 이상의 징역)로 동일하다. A의 집에 방화하여 '고의'로 A를 살해한 경우(A가 있는 것을 알고 죽이기 위해 방화한 경우): 진정결과적가중범으로만 해석하면 현주건조물방화죄(제164조 제1항)와 살인죄(제250조 제1항)의 상상적 경합이 되어 더 무거운 살인죄의 형(사형·무기 또는 5년 이상의 징역)으로 처벌되는 데 그치는 반면, 부진정결과적가중범으로 해석하면 현주건조물방화치사죄(사형·무기 또는 7년 이상의 징역)가 성립하여 더 무겁게 처벌된다. 즉 진정결과적가중범으로만 해석하면 고의로 살해한 경우가 과실로 사망하게 한 경우보다 형이 가벼워지는 불균형이 발생하므로, 부진정결과적가중범으로 해석하여 이러한 형의 불균형을 해소한다.\n\n[제4절 참고 - 결과적 가중범 조문 및 유형 정리] 형법 제15조(사실의 착오) ②: 결과 때문에 형이 무거워지는 죄의 경우에 그 결과의 발생을 예견할 수 없었을 때에는 무거운 죄로 벌하지 아니한다. [미수범 처벌규정 존재] 진정결과적가중범: 인질치사상죄, 강도치사상죄, 해상강도치사상죄, 성폭법위반(강간등치사상). 부진정결과적가중범: 현주건조물일수치사상죄. [미수범 처벌규정 부존재(외관상 존재)] 진정결과적가중범: 특수공무집행방해치사죄, 교통방해치사죄, 형법상 강간등치사상죄, 특가법위반(운전자폭행등)치사죄. 부진정결과적가중범: 현주건조물방화치사상죄(제164조 제2항), 특수공무집행방해치상죄(제144조 제2항), 교통방해치상죄(제188조), (존속)중상해죄(제258조), 중유기죄(제271조 제3항·제4항), 중손괴죄(제368조 제2항), 중권리행사방해죄(제336조), 특가법위반(운전자폭행등)치상죄(특가법 제5조의10 제2항).", "구성요건론"],
["230", "고의 또는 과실에 의해 중한 결과를 발생시킨 부진정결과적가중범의 미수를 처벌하는 규정은 존재하지 않는다.", false, "▸ 부진정결과적 가중범인 현주건조물일수치'사상'죄의 경우 미수범 처벌규정이 존재한다. 이와 달리 현주건조물방화치사상죄는 미수범 처벌규정이 없다.\n\n[III. 부진정결과적 가중범 - 인정이유 참고(현주건조물방화치사죄)] A의 집에 방화하여 '과실'로 A가 사망한 경우(A가 없는 줄 알고 방화했는데 A가 있었던 경우): 진정·부진정 어느 해석이든 결론은 현주건조물방화치사죄(제164조 제2항, 사형·무기 또는 7년 이상의 징역)로 동일하다. A의 집에 방화하여 '고의'로 A를 살해한 경우(A가 있는 것을 알고 죽이기 위해 방화한 경우): 진정결과적가중범으로만 해석하면 현주건조물방화죄(제164조 제1항)와 살인죄(제250조 제1항)의 상상적 경합이 되어 더 무거운 살인죄의 형(사형·무기 또는 5년 이상의 징역)으로 처벌되는 데 그치는 반면, 부진정결과적가중범으로 해석하면 현주건조물방화치사죄(사형·무기 또는 7년 이상의 징역)가 성립하여 더 무겁게 처벌된다. 즉 진정결과적가중범으로만 해석하면 고의로 살해한 경우가 과실로 사망하게 한 경우보다 형이 가벼워지는 불균형이 발생하므로, 부진정결과적가중범으로 해석하여 이러한 형의 불균형을 해소한다.\n\n[제4절 참고 - 결과적 가중범 조문 및 유형 정리] 형법 제15조(사실의 착오) ②: 결과 때문에 형이 무거워지는 죄의 경우에 그 결과의 발생을 예견할 수 없었을 때에는 무거운 죄로 벌하지 아니한다. [미수범 처벌규정 존재] 진정결과적가중범: 인질치사상죄, 강도치사상죄, 해상강도치사상죄, 성폭법위반(강간등치사상). 부진정결과적가중범: 현주건조물일수치사상죄. [미수범 처벌규정 부존재(외관상 존재)] 진정결과적가중범: 특수공무집행방해치사죄, 교통방해치사죄, 형법상 강간등치사상죄, 특가법위반(운전자폭행등)치사죄. 부진정결과적가중범: 현주건조물방화치사상죄(제164조 제2항), 특수공무집행방해치상죄(제144조 제2항), 교통방해치상죄(제188조), (존속)중상해죄(제258조), 중유기죄(제271조 제3항·제4항), 중손괴죄(제368조 제2항), 중권리행사방해죄(제336조), 특가법위반(운전자폭행등)치상죄(특가법 제5조의10 제2항).", "구성요건론"],
["231", "부진정결과적 가중범은 중한 결과에 대한 고의가 있어도 성립한다.[변17]", true, "▸ 부진정결과적 가중범은 '고의 기본범죄'를 범하고, '과실 또는 고의에 의하여 중한 결과'가 발생하는 것을 가중처벌하는 규정이다. 따라서 기본범죄는 고의범에 한정된다. 진정결과적 가중범도 기본범죄는 고의범에 한정된다.\n\n[III. 부진정결과적 가중범 - 인정이유 참고(현주건조물방화치사죄)] A의 집에 방화하여 '과실'로 A가 사망한 경우(A가 없는 줄 알고 방화했는데 A가 있었던 경우): 진정·부진정 어느 해석이든 결론은 현주건조물방화치사죄(제164조 제2항, 사형·무기 또는 7년 이상의 징역)로 동일하다. A의 집에 방화하여 '고의'로 A를 살해한 경우(A가 있는 것을 알고 죽이기 위해 방화한 경우): 진정결과적가중범으로만 해석하면 현주건조물방화죄(제164조 제1항)와 살인죄(제250조 제1항)의 상상적 경합이 되어 더 무거운 살인죄의 형(사형·무기 또는 5년 이상의 징역)으로 처벌되는 데 그치는 반면, 부진정결과적가중범으로 해석하면 현주건조물방화치사죄(사형·무기 또는 7년 이상의 징역)가 성립하여 더 무겁게 처벌된다. 즉 진정결과적가중범으로만 해석하면 고의로 살해한 경우가 과실로 사망하게 한 경우보다 형이 가벼워지는 불균형이 발생하므로, 부진정결과적가중범으로 해석하여 이러한 형의 불균형을 해소한다.\n\n[제4절 참고 - 결과적 가중범 조문 및 유형 정리] 형법 제15조(사실의 착오) ②: 결과 때문에 형이 무거워지는 죄의 경우에 그 결과의 발생을 예견할 수 없었을 때에는 무거운 죄로 벌하지 아니한다. [미수범 처벌규정 존재] 진정결과적가중범: 인질치사상죄, 강도치사상죄, 해상강도치사상죄, 성폭법위반(강간등치사상). 부진정결과적가중범: 현주건조물일수치사상죄. [미수범 처벌규정 부존재(외관상 존재)] 진정결과적가중범: 특수공무집행방해치사죄, 교통방해치사죄, 형법상 강간등치사상죄, 특가법위반(운전자폭행등)치사죄. 부진정결과적가중범: 현주건조물방화치사상죄(제164조 제2항), 특수공무집행방해치상죄(제144조 제2항), 교통방해치상죄(제188조), (존속)중상해죄(제258조), 중유기죄(제271조 제3항·제4항), 중손괴죄(제368조 제2항), 중권리행사방해죄(제336조), 특가법위반(운전자폭행등)치상죄(특가법 제5조의10 제2항).", "구성요건론"],

["233", "부진정결과적 가중범은 중한 결과에 대하여 과실뿐만 아니라 고의가 있는 경우에도 성립하고 이때 중한 결과에 대한 고의는 기본범죄의 실행행위 시점이 아닌 중한 결과가 발생한 시점에 존재하여야 한다.", false, "▸ ① 결과적 가중범의 중한 결과에 대한 고의 또는 과실은 기본범죄의 실행행위 시점에 존재하여야 한다. ② 기본범죄 이후에 비로소 중한 결과에 대한 고의나 과실이 존재하는 경우에는 별개의 범죄를 구성할 뿐이다.\n\n[III. 부진정결과적 가중범 - 인정이유 참고(현주건조물방화치사죄)] A의 집에 방화하여 '과실'로 A가 사망한 경우(A가 없는 줄 알고 방화했는데 A가 있었던 경우): 진정·부진정 어느 해석이든 결론은 현주건조물방화치사죄(제164조 제2항, 사형·무기 또는 7년 이상의 징역)로 동일하다. A의 집에 방화하여 '고의'로 A를 살해한 경우(A가 있는 것을 알고 죽이기 위해 방화한 경우): 진정결과적가중범으로만 해석하면 현주건조물방화죄(제164조 제1항)와 살인죄(제250조 제1항)의 상상적 경합이 되어 더 무거운 살인죄의 형(사형·무기 또는 5년 이상의 징역)으로 처벌되는 데 그치는 반면, 부진정결과적가중범으로 해석하면 현주건조물방화치사죄(사형·무기 또는 7년 이상의 징역)가 성립하여 더 무겁게 처벌된다. 즉 진정결과적가중범으로만 해석하면 고의로 살해한 경우가 과실로 사망하게 한 경우보다 형이 가벼워지는 불균형이 발생하므로, 부진정결과적가중범으로 해석하여 이러한 형의 불균형을 해소한다.\n\n[제4절 참고 - 결과적 가중범 조문 및 유형 정리] 형법 제15조(사실의 착오) ②: 결과 때문에 형이 무거워지는 죄의 경우에 그 결과의 발생을 예견할 수 없었을 때에는 무거운 죄로 벌하지 아니한다. [미수범 처벌규정 존재] 진정결과적가중범: 인질치사상죄, 강도치사상죄, 해상강도치사상죄, 성폭법위반(강간등치사상). 부진정결과적가중범: 현주건조물일수치사상죄. [미수범 처벌규정 부존재(외관상 존재)] 진정결과적가중범: 특수공무집행방해치사죄, 교통방해치사죄, 형법상 강간등치사상죄, 특가법위반(운전자폭행등)치사죄. 부진정결과적가중범: 현주건조물방화치사상죄(제164조 제2항), 특수공무집행방해치상죄(제144조 제2항), 교통방해치상죄(제188조), (존속)중상해죄(제258조), 중유기죄(제271조 제3항·제4항), 중손괴죄(제368조 제2항), 중권리행사방해죄(제336조), 특가법위반(운전자폭행등)치상죄(특가법 제5조의10 제2항).", "구성요건론"],
["234", "가해행위시에 중상해의 고의는 없고 단지 상해의 고의만 있었을 뿐이라면, 그 가해행위로 인하여 중상해의 결과가 발생한 경우, 중상해에 대한 예견가능성이 인정되더라도 중상해죄의 죄책을 물을 수 없다.", false, "▸ ① 중상해죄는 부진정결과적 가중범이다. ② 부진정결과적 가중범인 중상해죄는 미수범 처벌규정이 없으므로, 중상해의 고의로 상해를 가하였으나 단순 상해에 그친 경우에는 단순상해죄의 기수, 상해조차 발생하지 않은 경우에는 단순상해죄의 미수에 해당한다.\n\n[III. 부진정결과적 가중범 - 인정이유 참고(현주건조물방화치사죄)] A의 집에 방화하여 '과실'로 A가 사망한 경우(A가 없는 줄 알고 방화했는데 A가 있었던 경우): 진정·부진정 어느 해석이든 결론은 현주건조물방화치사죄(제164조 제2항, 사형·무기 또는 7년 이상의 징역)로 동일하다. A의 집에 방화하여 '고의'로 A를 살해한 경우(A가 있는 것을 알고 죽이기 위해 방화한 경우): 진정결과적가중범으로만 해석하면 현주건조물방화죄(제164조 제1항)와 살인죄(제250조 제1항)의 상상적 경합이 되어 더 무거운 살인죄의 형(사형·무기 또는 5년 이상의 징역)으로 처벌되는 데 그치는 반면, 부진정결과적가중범으로 해석하면 현주건조물방화치사죄(사형·무기 또는 7년 이상의 징역)가 성립하여 더 무겁게 처벌된다. 즉 진정결과적가중범으로만 해석하면 고의로 살해한 경우가 과실로 사망하게 한 경우보다 형이 가벼워지는 불균형이 발생하므로, 부진정결과적가중범으로 해석하여 이러한 형의 불균형을 해소한다.\n\n[제4절 참고 - 결과적 가중범 조문 및 유형 정리] 형법 제15조(사실의 착오) ②: 결과 때문에 형이 무거워지는 죄의 경우에 그 결과의 발생을 예견할 수 없었을 때에는 무거운 죄로 벌하지 아니한다. [미수범 처벌규정 존재] 진정결과적가중범: 인질치사상죄, 강도치사상죄, 해상강도치사상죄, 성폭법위반(강간등치사상). 부진정결과적가중범: 현주건조물일수치사상죄. [미수범 처벌규정 부존재(외관상 존재)] 진정결과적가중범: 특수공무집행방해치사죄, 교통방해치사죄, 형법상 강간등치사상죄, 특가법위반(운전자폭행등)치사죄. 부진정결과적가중범: 현주건조물방화치사상죄(제164조 제2항), 특수공무집행방해치상죄(제144조 제2항), 교통방해치상죄(제188조), (존속)중상해죄(제258조), 중유기죄(제271조 제3항·제4항), 중손괴죄(제368조 제2항), 중권리행사방해죄(제336조), 특가법위반(운전자폭행등)치상죄(특가법 제5조의10 제2항).", "구성요건론"],
["235", "중상해의 고의로 상해행위를 하였으나 단순상해의 결과가 발생하면 상해기수죄로, 단순상해의 결과도 발생하지 않으면 중상해미수죄로 처벌된다.", false, "▸ ① 중상해죄는 부진정결과적 가중범이다. ② 부진정결과적 가중범인 중상해죄는 미수범 처벌규정이 없으므로, 중상해의 고의로 상해를 가하였으나 단순 상해에 그친 경우에는 단순상해죄의 기수, 상해조차 발생하지 않은 경우에는 단순상해죄의 미수에 해당한다.\n\n[III. 부진정결과적 가중범 - 인정이유 참고(현주건조물방화치사죄)] A의 집에 방화하여 '과실'로 A가 사망한 경우(A가 없는 줄 알고 방화했는데 A가 있었던 경우): 진정·부진정 어느 해석이든 결론은 현주건조물방화치사죄(제164조 제2항, 사형·무기 또는 7년 이상의 징역)로 동일하다. A의 집에 방화하여 '고의'로 A를 살해한 경우(A가 있는 것을 알고 죽이기 위해 방화한 경우): 진정결과적가중범으로만 해석하면 현주건조물방화죄(제164조 제1항)와 살인죄(제250조 제1항)의 상상적 경합이 되어 더 무거운 살인죄의 형(사형·무기 또는 5년 이상의 징역)으로 처벌되는 데 그치는 반면, 부진정결과적가중범으로 해석하면 현주건조물방화치사죄(사형·무기 또는 7년 이상의 징역)가 성립하여 더 무겁게 처벌된다. 즉 진정결과적가중범으로만 해석하면 고의로 살해한 경우가 과실로 사망하게 한 경우보다 형이 가벼워지는 불균형이 발생하므로, 부진정결과적가중범으로 해석하여 이러한 형의 불균형을 해소한다.\n\n[제4절 참고 - 결과적 가중범 조문 및 유형 정리] 형법 제15조(사실의 착오) ②: 결과 때문에 형이 무거워지는 죄의 경우에 그 결과의 발생을 예견할 수 없었을 때에는 무거운 죄로 벌하지 아니한다. [미수범 처벌규정 존재] 진정결과적가중범: 인질치사상죄, 강도치사상죄, 해상강도치사상죄, 성폭법위반(강간등치사상). 부진정결과적가중범: 현주건조물일수치사상죄. [미수범 처벌규정 부존재(외관상 존재)] 진정결과적가중범: 특수공무집행방해치사죄, 교통방해치사죄, 형법상 강간등치사상죄, 특가법위반(운전자폭행등)치사죄. 부진정결과적가중범: 현주건조물방화치사상죄(제164조 제2항), 특수공무집행방해치상죄(제144조 제2항), 교통방해치상죄(제188조), (존속)중상해죄(제258조), 중유기죄(제271조 제3항·제4항), 중손괴죄(제368조 제2항), 중권리행사방해죄(제336조), 특가법위반(운전자폭행등)치상죄(특가법 제5조의10 제2항).", "구성요건론"],
["236", "★ 부진정결과적 가중범에서 고의로 중한 결과를 발생하게 한 행위가 별도의 구성요건에 해당하고 그 고의범의 법정형이 결과적 가중범의 법정형보다 더 무거운 경우에는 고의범과 결과적 가중범이 상상적 경합관계에 있지만, 고의범에 대하여 더 무겁게 처벌하는 규정이 없는 경우에는 결과적가중범이 고의범에 대하여 '특별관계'에 있으므로 결과적 가중범만 성립하고, 고의범은 별도로 성립하지 않는다.[변10]", true, "▸ (2008도7311) [고의범이 부진정결과적 가중범에 정한 형과 '같은' 경우에는 부진정결과적 가중범만 성립한다.]\n\n[III. 부진정결과적 가중범 - 인정이유 참고(현주건조물방화치사죄)] A의 집에 방화하여 '과실'로 A가 사망한 경우(A가 없는 줄 알고 방화했는데 A가 있었던 경우): 진정·부진정 어느 해석이든 결론은 현주건조물방화치사죄(제164조 제2항, 사형·무기 또는 7년 이상의 징역)로 동일하다. A의 집에 방화하여 '고의'로 A를 살해한 경우(A가 있는 것을 알고 죽이기 위해 방화한 경우): 진정결과적가중범으로만 해석하면 현주건조물방화죄(제164조 제1항)와 살인죄(제250조 제1항)의 상상적 경합이 되어 더 무거운 살인죄의 형(사형·무기 또는 5년 이상의 징역)으로 처벌되는 데 그치는 반면, 부진정결과적가중범으로 해석하면 현주건조물방화치사죄(사형·무기 또는 7년 이상의 징역)가 성립하여 더 무겁게 처벌된다. 즉 진정결과적가중범으로만 해석하면 고의로 살해한 경우가 과실로 사망하게 한 경우보다 형이 가벼워지는 불균형이 발생하므로, 부진정결과적가중범으로 해석하여 이러한 형의 불균형을 해소한다.\n\n[제4절 참고 - 결과적 가중범 조문 및 유형 정리] 형법 제15조(사실의 착오) ②: 결과 때문에 형이 무거워지는 죄의 경우에 그 결과의 발생을 예견할 수 없었을 때에는 무거운 죄로 벌하지 아니한다. [미수범 처벌규정 존재] 진정결과적가중범: 인질치사상죄, 강도치사상죄, 해상강도치사상죄, 성폭법위반(강간등치사상). 부진정결과적가중범: 현주건조물일수치사상죄. [미수범 처벌규정 부존재(외관상 존재)] 진정결과적가중범: 특수공무집행방해치사죄, 교통방해치사죄, 형법상 강간등치사상죄, 특가법위반(운전자폭행등)치사죄. 부진정결과적가중범: 현주건조물방화치사상죄(제164조 제2항), 특수공무집행방해치상죄(제144조 제2항), 교통방해치상죄(제188조), (존속)중상해죄(제258조), 중유기죄(제271조 제3항·제4항), 중손괴죄(제368조 제2항), 중권리행사방해죄(제336조), 특가법위반(운전자폭행등)치상죄(특가법 제5조의10 제2항).", "구성요건론"],

["238", "★ 형법 제144조 제2항의 특수공무집행방해치상죄는 결과적 가중범이므로 행위자가 그 결과를 의도할 필요는 없고, 그 결과의 발생을 예견할 수 있으면 족하다.", true, "▸ ① 제144조 제2항 소정의 특수공무집행방해치상죄는 결과적 가중범이므로 행위자가 그 결과를 의도할 필요는 없고 그 결과의 발생을 예견할 수 있으면 족하다(80도796). [부진정 결과적 가중범이므로 중한 결과에 대한 예견가능성(과실)만 있어도 가능하다. 물론 고의가 있어도 성립한다.] ② 특수공무집행방해치상죄는 원래 결과적가중범이기는 하지만 이는 중한 결과에 대하여 예견가능성이 있었음에도 불구하고 예견하지 못한 경우에 벌하는 진정결과적가중범이 아니라 그 결과에 대한 예견가능성이 있었음에도 불구하고 예견하지 못한 경우뿐만 아니라 고의가 있는 경우까지도 포함하는 부진정결과적가중범이다(94도2842). ③ 직무를 집행하는 공무원에 대하여 위험한 물건을 휴대하여 고의로 상해를 가한 경우에는 특수공무집행방해치상죄만 성립할 뿐, 이와는 별도로 특수상해죄를 구성하지 않는다(2008도7311). [승용차는 위험한 물건이므로 특수공무집행방해치상죄만 성립한다.]\n\n[III. 부진정결과적 가중범 - 인정이유 참고(현주건조물방화치사죄)] A의 집에 방화하여 '과실'로 A가 사망한 경우(A가 없는 줄 알고 방화했는데 A가 있었던 경우): 진정·부진정 어느 해석이든 결론은 현주건조물방화치사죄(제164조 제2항, 사형·무기 또는 7년 이상의 징역)로 동일하다. A의 집에 방화하여 '고의'로 A를 살해한 경우(A가 있는 것을 알고 죽이기 위해 방화한 경우): 진정결과적가중범으로만 해석하면 현주건조물방화죄(제164조 제1항)와 살인죄(제250조 제1항)의 상상적 경합이 되어 더 무거운 살인죄의 형(사형·무기 또는 5년 이상의 징역)으로 처벌되는 데 그치는 반면, 부진정결과적가중범으로 해석하면 현주건조물방화치사죄(사형·무기 또는 7년 이상의 징역)가 성립하여 더 무겁게 처벌된다. 즉 진정결과적가중범으로만 해석하면 고의로 살해한 경우가 과실로 사망하게 한 경우보다 형이 가벼워지는 불균형이 발생하므로, 부진정결과적가중범으로 해석하여 이러한 형의 불균형을 해소한다.\n\n[제4절 참고 - 결과적 가중범 조문 및 유형 정리] 형법 제15조(사실의 착오) ②: 결과 때문에 형이 무거워지는 죄의 경우에 그 결과의 발생을 예견할 수 없었을 때에는 무거운 죄로 벌하지 아니한다. [미수범 처벌규정 존재] 진정결과적가중범: 인질치사상죄, 강도치사상죄, 해상강도치사상죄, 성폭법위반(강간등치사상). 부진정결과적가중범: 현주건조물일수치사상죄. [미수범 처벌규정 부존재(외관상 존재)] 진정결과적가중범: 특수공무집행방해치사죄, 교통방해치사죄, 형법상 강간등치사상죄, 특가법위반(운전자폭행등)치사죄. 부진정결과적가중범: 현주건조물방화치사상죄(제164조 제2항), 특수공무집행방해치상죄(제144조 제2항), 교통방해치상죄(제188조), (존속)중상해죄(제258조), 중유기죄(제271조 제3항·제4항), 중손괴죄(제368조 제2항), 중권리행사방해죄(제336조), 특가법위반(운전자폭행등)치상죄(특가법 제5조의10 제2항).", "구성요건론"],

["240", "사법경찰관 P가 특정경제범죄가중처벌등에관한법률위반(배임)죄로 甲에 대한 체포영장을 발부받은 후 집 앞 주차장에 차량을 주차하고 있는 甲을 발견하고 위 체포영장에 기하여 체포하였다. 甲이 이와 같은 체포 과정에서 자신의 차량으로 사법경찰관 P를 충격하여 상해를 가했다면, 甲에게 특수공무집행방해치상죄 및 특수상해죄가 성립하고, 양 죄는 상상적 경합 관계이다.", false, "▸ 직무를 집행하는 공무원에 대하여 위험한 물건을 휴대하여 고의로 상해를 가한 경우에는 특수공무집행방해치상죄만 성립할 뿐, 이와는 별도로 특수상해죄를 구성하지 않는다(2008도7311). [승용차는 위험한 물건이므로 특수공무집행방해치상죄만 성립한다.]\n\n[III. 부진정결과적 가중범 - 인정이유 참고(현주건조물방화치사죄)] A의 집에 방화하여 '과실'로 A가 사망한 경우(A가 없는 줄 알고 방화했는데 A가 있었던 경우): 진정·부진정 어느 해석이든 결론은 현주건조물방화치사죄(제164조 제2항, 사형·무기 또는 7년 이상의 징역)로 동일하다. A의 집에 방화하여 '고의'로 A를 살해한 경우(A가 있는 것을 알고 죽이기 위해 방화한 경우): 진정결과적가중범으로만 해석하면 현주건조물방화죄(제164조 제1항)와 살인죄(제250조 제1항)의 상상적 경합이 되어 더 무거운 살인죄의 형(사형·무기 또는 5년 이상의 징역)으로 처벌되는 데 그치는 반면, 부진정결과적가중범으로 해석하면 현주건조물방화치사죄(사형·무기 또는 7년 이상의 징역)가 성립하여 더 무겁게 처벌된다. 즉 진정결과적가중범으로만 해석하면 고의로 살해한 경우가 과실로 사망하게 한 경우보다 형이 가벼워지는 불균형이 발생하므로, 부진정결과적가중범으로 해석하여 이러한 형의 불균형을 해소한다.\n\n[제4절 참고 - 결과적 가중범 조문 및 유형 정리] 형법 제15조(사실의 착오) ②: 결과 때문에 형이 무거워지는 죄의 경우에 그 결과의 발생을 예견할 수 없었을 때에는 무거운 죄로 벌하지 아니한다. [미수범 처벌규정 존재] 진정결과적가중범: 인질치사상죄, 강도치사상죄, 해상강도치사상죄, 성폭법위반(강간등치사상). 부진정결과적가중범: 현주건조물일수치사상죄. [미수범 처벌규정 부존재(외관상 존재)] 진정결과적가중범: 특수공무집행방해치사죄, 교통방해치사죄, 형법상 강간등치사상죄, 특가법위반(운전자폭행등)치사죄. 부진정결과적가중범: 현주건조물방화치사상죄(제164조 제2항), 특수공무집행방해치상죄(제144조 제2항), 교통방해치상죄(제188조), (존속)중상해죄(제258조), 중유기죄(제271조 제3항·제4항), 중손괴죄(제368조 제2항), 중권리행사방해죄(제336조), 특가법위반(운전자폭행등)치상죄(특가법 제5조의10 제2항).", "구성요건론"],

["242", "현주건조물방화치사죄는 사망의 결과에 대하여 과실이 있는 경우뿐만 아니라 고의가 있는 경우에도 성립하는 부진정 결과적가중범이다.[변20]", true, "▸ ① 현주건조물방화치사상죄는 과실이 있는 경우뿐만 아니라 고의가 있는 경우도 포함된다. ② 현주건조물내에 있는 사람을 강타하여 실신케 한 후 동건조물에 방화하여 소사케 한 피고인을 현주건조물에의 방화죄와 살인죄의 상상적 경합으로 의율할 것은 아니다(82도2341).\n\n[III. 부진정결과적 가중범 - 인정이유 참고(현주건조물방화치사죄)] A의 집에 방화하여 '과실'로 A가 사망한 경우(A가 없는 줄 알고 방화했는데 A가 있었던 경우): 진정·부진정 어느 해석이든 결론은 현주건조물방화치사죄(제164조 제2항, 사형·무기 또는 7년 이상의 징역)로 동일하다. A의 집에 방화하여 '고의'로 A를 살해한 경우(A가 있는 것을 알고 죽이기 위해 방화한 경우): 진정결과적가중범으로만 해석하면 현주건조물방화죄(제164조 제1항)와 살인죄(제250조 제1항)의 상상적 경합이 되어 더 무거운 살인죄의 형(사형·무기 또는 5년 이상의 징역)으로 처벌되는 데 그치는 반면, 부진정결과적가중범으로 해석하면 현주건조물방화치사죄(사형·무기 또는 7년 이상의 징역)가 성립하여 더 무겁게 처벌된다. 즉 진정결과적가중범으로만 해석하면 고의로 살해한 경우가 과실로 사망하게 한 경우보다 형이 가벼워지는 불균형이 발생하므로, 부진정결과적가중범으로 해석하여 이러한 형의 불균형을 해소한다.\n\n[제4절 참고 - 결과적 가중범 조문 및 유형 정리] 형법 제15조(사실의 착오) ②: 결과 때문에 형이 무거워지는 죄의 경우에 그 결과의 발생을 예견할 수 없었을 때에는 무거운 죄로 벌하지 아니한다. [미수범 처벌규정 존재] 진정결과적가중범: 인질치사상죄, 강도치사상죄, 해상강도치사상죄, 성폭법위반(강간등치사상). 부진정결과적가중범: 현주건조물일수치사상죄. [미수범 처벌규정 부존재(외관상 존재)] 진정결과적가중범: 특수공무집행방해치사죄, 교통방해치사죄, 형법상 강간등치사상죄, 특가법위반(운전자폭행등)치사죄. 부진정결과적가중범: 현주건조물방화치사상죄(제164조 제2항), 특수공무집행방해치상죄(제144조 제2항), 교통방해치상죄(제188조), (존속)중상해죄(제258조), 중유기죄(제271조 제3항·제4항), 중손괴죄(제368조 제2항), 중권리행사방해죄(제336조), 특가법위반(운전자폭행등)치상죄(특가법 제5조의10 제2항).", "구성요건론"],

["245", "★ 피해자의 재물을 강취한 후 그를 살해할 목적으로 현주건조물에 방화하여 사망에 이르게 한 경우, 강도살인죄는 현주건조물방화치사죄에 대하여 특별관계에 있다.[변17]", false, "▸ 피해자들의 재물을 강취한 후 그들을 살해할 목적으로 현주건조물에 방화하여 사망에 이르게 한 경우, 강도살인죄와 현주건조물방화치사죄의 상상적 경합범이 성립한다(98도3416).\n\n[III. 부진정결과적 가중범 - 인정이유 참고(현주건조물방화치사죄)] A의 집에 방화하여 '과실'로 A가 사망한 경우(A가 없는 줄 알고 방화했는데 A가 있었던 경우): 진정·부진정 어느 해석이든 결론은 현주건조물방화치사죄(제164조 제2항, 사형·무기 또는 7년 이상의 징역)로 동일하다. A의 집에 방화하여 '고의'로 A를 살해한 경우(A가 있는 것을 알고 죽이기 위해 방화한 경우): 진정결과적가중범으로만 해석하면 현주건조물방화죄(제164조 제1항)와 살인죄(제250조 제1항)의 상상적 경합이 되어 더 무거운 살인죄의 형(사형·무기 또는 5년 이상의 징역)으로 처벌되는 데 그치는 반면, 부진정결과적가중범으로 해석하면 현주건조물방화치사죄(사형·무기 또는 7년 이상의 징역)가 성립하여 더 무겁게 처벌된다. 즉 진정결과적가중범으로만 해석하면 고의로 살해한 경우가 과실로 사망하게 한 경우보다 형이 가벼워지는 불균형이 발생하므로, 부진정결과적가중범으로 해석하여 이러한 형의 불균형을 해소한다.\n\n[제4절 참고 - 결과적 가중범 조문 및 유형 정리] 형법 제15조(사실의 착오) ②: 결과 때문에 형이 무거워지는 죄의 경우에 그 결과의 발생을 예견할 수 없었을 때에는 무거운 죄로 벌하지 아니한다. [미수범 처벌규정 존재] 진정결과적가중범: 인질치사상죄, 강도치사상죄, 해상강도치사상죄, 성폭법위반(강간등치사상). 부진정결과적가중범: 현주건조물일수치사상죄. [미수범 처벌규정 부존재(외관상 존재)] 진정결과적가중범: 특수공무집행방해치사죄, 교통방해치사죄, 형법상 강간등치사상죄, 특가법위반(운전자폭행등)치사죄. 부진정결과적가중범: 현주건조물방화치사상죄(제164조 제2항), 특수공무집행방해치상죄(제144조 제2항), 교통방해치상죄(제188조), (존속)중상해죄(제258조), 중유기죄(제271조 제3항·제4항), 중손괴죄(제368조 제2항), 중권리행사방해죄(제336조), 특가법위반(운전자폭행등)치상죄(특가법 제5조의10 제2항).", "구성요건론"],
