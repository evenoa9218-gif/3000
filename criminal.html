// ── Firebase REST API 헬퍼 (SDK 없이 fetch로 직접 사용) ──
const FB_URL = "https://project-1720248149706690221-default-rtdb.asia-southeast1.firebasedatabase.app";

const fb = {
  // 값 읽기
  get: async (path) => {
    try {
      const r = await fetch(`${FB_URL}/${path}.json`);
      if (!r.ok) return null;
      return await r.json();
    } catch { return null; }
  },
  // 값 쓰기 (PUT: 덮어쓰기)
  set: async (path, data) => {
    const r = await fetch(`${FB_URL}/${path}.json`, {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(data)
    });
    if (!r.ok) throw new Error(`Firebase set failed: HTTP ${r.status}`);
  },
  // 값 병합 (PATCH: 부분 업데이트)
  update: async (path, data) => {
    try {
      await fetch(`${FB_URL}/${path}.json`, {
        method: 'PATCH',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(data)
      });
    } catch {}
  },
  // 전체 목록 읽기
  list: async (path) => {
    try {
      const r = await fetch(`${FB_URL}/${path}.json`);
      if (!r.ok) return {};
      const data = await r.json();
      return data || {};
    } catch { return {}; }
  }
};

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

// window.storage — GitHub Pages에서는 localStorage로 폴백
window.storage = window.storage || (() => {
  const PREFIX = 'qhub_';
  return {
    get: async (key) => {
      try {
        const v = localStorage.getItem(PREFIX + key);
        return v !== null ? { key, value: v } : null;
      } catch { return null; }
    },
    set: async (key, value) => {
      try {
        localStorage.setItem(PREFIX + key, value);
        return { key, value };
      } catch { return null; }
    },
    delete: async (key) => {
      try { localStorage.removeItem(PREFIX + key); return { key, deleted: true }; } catch { return null; }
    },
    list: async (prefix) => {
      try {
        const keys = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith(PREFIX + (prefix||''))) {
            keys.push(k.slice(PREFIX.length));
          }
        }
        return { keys };
      } catch { return { keys: [] }; }
    }
  };
})();

["016", "☆ 합의부는 2개의 관련사건이 사물관할을 달리하는 경우에 결정으로 단독판사에게 속한 사건을 병합하여 심리할 수 있지만, 2개의 관련사건이 사물관할과 토지관할을 모두 달리하는 경우에는 병합하여 심리할 수 없다.", false, "▸ ① 사물관할을 달리하는 수개의 관련사건이 각각 법원합의부와 단독판사에 계속된 때에는 합의부는 결정으로 단독판사에 속한 사건을 병합하여 심리할 수 있다(형소법 제10조). ② 법 제10조의 규정은 법원합의부와 단독판사에 계속된 각 사건이 토지관할을 달리하는 경우에도 이를 적용한다(형사소송규칙 제4조).", "소송주체"],
["017", "☆ 피고인 甲의 A사건은 지방법원 본원 항소부에, 甲의 B사건은 고등법원에 계속되어 있는 경우 甲은 대법원의 결정에 의하여 고등법원에서 병합심리를 받을 수 있다.", false, "▸ 사물관할을 달리하는 수개의 관련사건이 각각 법원합의부와 단독판사에 계속된 때에는 합의부는 결정으로 단독판사에 속한 사건을 병합하여 심리할 수 있다(형소법 제10조). [사물관할을 달리하므로 고등법원이 결정한다. 대법원X]", "소송주체"],
["018", "단독판사 관할 피고사건의 항소사건이 지방법원 합의부에 계속중일 때 그 변론종결시까지 청구된 치료감호사건의 관할법원은 고등법원이고, 피고사건의 관할법원도 치료감호사건의 관할을 따라 고등법원이 된다. 따라서 치료감호사건이 지방법원이나 지방법원지원에 청구되어 피고사건 항소심을 담당하는 합의부에 배당된 경우 그 합의부는 치료감호사건과 피고사건을 모두 고등법원에 이송하여야 한다.", true, "▸ 치료감호법 제3조 제2항. [2009도6946]", "소송주체"],
["019", "관할이전의 사유가 존재하는 경우 검사는 직근상급법원에 관할의 이전을 신청할 의무가 있지만, 피고인은 관할의 이전을 신청할 권리만 있다.", true, "▸ 관할법원이 법률상의 이유 또는 특별한 사정으로 재판권을 행할 수 없는 때(제1호), 범죄의 성질, 지방의 민심, 소송의 상황 기타 사정으로 재판의 공평을 유지하기 어려운 염려가 있는 때(제2호)에는 검사는 직근 상급법원에 관할이전을 신청'하여야' 한다. 피고인도 이 신청을 '할 수' 있다(제15조).", "소송주체"],
["020", "법원이 검사의 공소장변경을 허용하였다고 하여 재판의 공평을 유지하기 어려울 염려가 있다고 인정되지 아니하므로 이를 이유로 한 관할이전신청은 이유없다.", true, "▸ [AI해설] 공소장변경 허용은 형소법 제15조에서 정한 재판의 공평을 유지하기 어려울 염려가 있는 경우에 해당하지 않으므로, 이를 이유로 한 관할이전신청은 이유 없다. [84초45]", "소송주체"],
["021", "법원은 피고인이 그 관할구역 내에 현재하지 아니하는 경우에 특별한 사정이 있으면 결정으로 사건을 피고인의 현재지를 관할하는 동급 법원에 이송하여야 한다.", false, "▸ 피고인의 현재지를 관할하는 동급 법원에 이송'할 수' 있다(제8조 제1항).", "소송주체"],
["022", "☆ 피고인이 국민참여재판을 원하는 의사를 표시한 경우 지방법원 지원 합의부가 배제결정을 하지 아니하는 경우에는 지방법원 지원 합의부는 국민참여재판절차 회부결정을 하여 사건을 지방법원 본원 합의부로 이송하여야 한다.", true, "▸ 국민의 형사재판 참여에 관한 법률 제10조 제1항", "소송주체"],
["023", "법원은 소년에 대한 피고사건을 심리한 결과 보호처분에 해당할 사유가 있다고 인정하면 결정으로써 사건을 관할 소년부에 송치하여야 한다.", true, "▸ 소년법 제50조", "소송주체"],
["024", "피고인에 대한 절도 사건의 제1심 법원 재판장이 피해자와 5년 전에 이혼하였던 사람인 경우, 당해 재판장은 피고사건에 관한 직무집행에서 제척되지 않는다.", false, "▸ 이혼한 배우자는 형소법 제17조 제2호에서 말하는 친족에 해당하므로 제척사유에 해당한다(제17조 제2호).", "소송주체"],
["025", "★ 통역인이 피해자의 사실혼 배우자인 경우 통역인은 제척된다.", false, "▸ 사실혼관계에 있는 사람은 민법에서 정한 친족이라고 할 수 없어 형소법 제17조 제2호에서 말하는 친족에 해당하지 않으므로, 통역인이 피해자의 사실혼 배우자라고 하여도 제25조 제1항, 제17조 제2호에서 정한 제척사유가 있다고 할 수 없다.", "소송주체"],
["026", "★ 외국인 근로자 甲은 A의 운전면허증을 절취한 사건으로 기소되었다. 공판기일에 A의 사실혼 배우자 B가 증인으로 출석하여 운전면허증을 도난당한 상황을 증언한 후 이어서 A의 증언을 통역하였다. 통역인이 사실혼 배우자인 경우는 제척사유에 해당하지 않으나 통역인이 사건에 관하여 증인으로 증언한 때에는 직무집행에서 제척되므로 B가 통역한 A에 대한 증인신문조서는 유죄의 증거로 사용할 수 없다.", true, "▸ 통역인이 사건에 관하여 증인으로 증언한 때에는 직무집행에서 제척되고(형소법 제25조, 제17조 제4호), 제척사유가 있는 통역인이 통역한 증인의 증인신문조서는 유죄 인정의 증거로 사용할 수 없다. [2010도13583]", "소송주체"],
["027", "☆ 선거관리위원장으로 공직선거법위반 혐의사실에 대하여 수사기관에 수사의뢰를 한 법관이 당해 형사피고사건을 재판하는 경우는「형사소송법」제17조 제6호의 제척원인인 '법관이 사건에 관하여 사법경찰관의 직무를 행한 때'에 해당한다고 볼 수 없다.", true, "▸ [AI해설] 선거관리위원장으로서 수사기관에 수사의뢰를 한 것은 형소법 제17조 제6호의 '사법경찰관의 직무를 행한 때'에 해당하지 않는다. [99도155]", "소송주체"],
["028", "☆ 선거관리위원장으로서 공직선거법위반 혐의사실에 대하여 수사기관에 수사의뢰를 한 법관이 당해 피고사건의 재판을 하는 경우는「형사소송법」제17조 제7호의 제척원인인 '법관이 사건에 관하여 그 기초되는 조사에 관여한 때'에 해당한다고 볼 수 없다.", true, "▸ 선거관리위원장으로서 수사기관에 수사의뢰를 한 것은 형소법 제17조 제7호의 '기초되는 조사에 관여한 때'에 해당하지 않는다. [99도155]", "소송주체"],
["029", "☆ 고발인의 고발사실 중 검사가 불기소한 부분에 관하여 한 재정신청사건에 관하여 이를 기각한 법관이, 고발인의 고발사실 중 공소가 제기된 부분의 항소심에서 재판장으로 관여한 경우에는 제척사유에 해당한다.", false, "▸ 고발사실 일부에 대한 재정신청사건에 관여하여 그 신청을 기각한 것이 그 나머지 부분에 대한 이 사건에 있어 '법관이 사건에 관하여 전심재판 또는 그 기초되는 조사, 심리에 관여한 때'(제17조 제7호)에 해당한다고 볼 수 없다. [2013도10316]", "소송주체"],
["030", "☆ 공소제기 전 검사의 증거보전신청에 의하여 증인신문을 한 법관이 공소제기 후 제1심 법관으로 관여한 경우에는「형사소송법」제17조 제7호의 전심재판 또는 그 기초되는 조사, 심리에 관여한 법관에 해당하여 제척사유에 해당한다.", false, "▸ 공소제기 전 형소법 제184조 증거보전절차에 의한 증인신문을 한 법관이 항소심 판결에 관여하더라도 형소법 제17조 제7호에서 정한 '전심재판 또는 기초되는 조사, 심리에 관여한 법관'이라고 할 수 없다. [71도974]", "소송주체"],
["031", "☆ 법관이 수사단계에서 피의자였던 피고인에 대하여 구속영장을 발부한 경우는 형사소송법 제17조 제7호 소정의 '법관이 사건에 관하여 전심재판 또는 그 기초되는 조사, 심리에 관여한 때'에 해당한다고 볼 수 없다.", true, "▸ 수사단계에서 구속영장을 발부한 법관이 해당 사건의 제1심판결에 관여하더라도 제17조 제7호의 제척사유에 해당하지 않는다. [89도612]", "소송주체"],
["032", "☆ 구속적부심에 관여한 법관이 그 사건에 대한 제1심재판에 관여한 경우 제척사유에 해당하지 않는다.", true, "▸ 구속적부심에 관여한 법관이 그 사건에 대한 제1심재판에 관여한 경우 제척사유에 해당하지 않는다. [4293형상166]", "소송주체"],
["033", "☆ 파기환송 전의 원심재판에 관여한 법관이 환송 후의 재판에 관여한 경우에는 제척사유에 해당한다.", false, "▸ 환송판결의 원심에 관여한 재판관이 환송후의 원심재판관으로 관여하였다 하여 형소법 제17조에 위배된다고 볼 수 없다. [78도3204]", "소송주체"],
["034", "★ 약식명령을 발부한 법관이 정식재판절차의 제1심판결에 관여하였다고 하여「형사소송법」제17조 제7호에 정한 '법관이 사건에 관하여 전심재판 또는 그 기초되는 조사, 심리에 관여한 때'에 해당하여 제척의 원인이 된다고 볼 수는 없다.", true, "▸ 약식절차와 제1심 정식재판 공판절차는 동일한 심급 내에서 서로 절차만 달리할 뿐이므로, 약식명령이 제1심 공판절차의 전심재판에 해당하는 것은 아니다. [2002도944]", "소송주체"],
["035", "★ 약식명령을 내린 판사가 그 정식재판 절차의 항소심판결에 관여함은「형사소송법」제17조 제7호 소정의 '법관이 사건에 관하여 전심재판 또는 그 기초되는 조사, 심리에 관여한 때'에 해당하여 제척의 원인이 된다.", true, "▸ 약식명령을 발부한 법관이 그 정식재판 절차의 항소심판결에 관여함은 법관이 사건에 관하여 전심재판 또는 그 기초되는 조사심리에 관여한 때에 해당하여 제척·기피의 원인이 된다. [85도281]", "소송주체"],
["036", "★ 약식명령을 발부한 판사 R이 甲에 대한 정식재판 절차의 항소심 제2차 공판까지 관여하였다가 제3차 공판에서 경질되어 그 판결에 관여하지 아니한 경우, 전심재판에 관여한 법관이 불복이 신청된 당해 사건의 재판에 관여하였다고 할 수 없다.", true, "▸ 불복이 신청된 당해 사건의 판결절차를 말하는 것이므로, 항소심 공판에 관여한 바 있어도 후에 경질되어 그 판결에는 관여하지 아니한 경우는 전심재판에 관여한 법관이 불복이 신청된 당해 사건의 재판에 관여하였다고 할 수 없다. [85도281]", "소송주체"],
["037", "재심청구사건의 원심재판장이 재심대상판결의 제1심에 관여하였다면 재심청구사건에서 제척 또는 기피의 원인이 된다.", false, "▸ 전심이라 함은 불복신청을 한 '당해 사건'의 전심을 말하는 것으로서 재심청구사건에 있어서 재심대상이 되는 사건은 전심에 해당하지 않으므로, 원심재판장이 재심대상판결의 제1심에 관여했다 하더라도 이 사건 재심청구사건에서 제척 또는 기피의 원인이 되는 것이 아니다. [82모11]", "소송주체"],
["038", "제척사유가 있는 법관이 항소심의 심판에 관여한 경우는 상고이유 중 '판결에 영향을 미친 헌법·법률·명령 또는 규칙의 위반이 있는 때'에 해당하지 않는다.", false, "▸ 약식명령을 한 판사가 그 약식명령에 대한 정식재판 절차의 항소심인 원심의 판결에 관여하였다면 원심판결에는 법률상 그 재판에 관여하지 못할 판사가 그 사건의 심리에 관여하여 판결에 영향을 미친 법률 위반의 위법이 있다. [2011도17, 절대적 항소이유(제361조의5 제7호), 상대적 상고이유(제383조 제1호)]", "소송주체"],
["039", "범죄의 피해자인 검사가 그 사건의 수사에 관여하거나, 압수·수색영장의 집행에 참여한 검사가 다시 수사에 관여하였다 하여 그 수사가 위법하다고 볼 수 없다.", true, "▸ 검사에 대한 제척·기피 규정은 존재하지 않으므로, 범죄의 피해자인 검사가 수사에 관여하거나 영장 집행에 참여한 검사가 다시 수사에 관여해도 위법하지 않다. [2011도12918]", "소송주체"],
["040", "지방법원 지원 판사에 대한 제척·기피사건의 관할은 지방법원 지원 합의부에 속한다.", true, "▸ 지방법원과 그 지원의 합의부는 지방법원판사에 대한 제척·기피사건을 제1심으로 심판한다(법원조직법 제32조 제1항 제5호). 기피신청에 대한 재판은 기피당한 법관의 소속법원합의부에서 결정으로 하여야 한다(형소법 제21조 제1항).", "소송주체"],
["041", "기피신청이 소송의 지연을 목적으로 함이 명백한 경우에는 그 신청 자체가 부적법한 것이므로 신청을 받은 법원 또는 법관은 이를 결정으로 기각할 수 있는 것이고, 소송지연을 목적으로 함이 명백한 기피신청인지의 여부는 기피신청인이 제출한 소명방법만에 의하여 판단할 것은 아니고, 당해 법원에 현저한 사실이거나 당해 사건 기록에 나타나 있는 제반 사정들을 종합하여 판단할 수 있다.", true, "▸ 소송지연을 목적으로 함이 명백한 기피신청인지의 여부는 기피신청인이 제출한 소명방법만에 의하여 판단할 것은 아니고, 당해 법원에 현저한 사실이거나 당해 사건 기록에 나타나 있는 제반 사정들을 종합하여 판단할 수 있다. [2001모2]", "소송주체"],
["042", "☆ 피고인의 기피신청이 있어「형사소송법」제22조에 따라 소송진행을 정지하여야 함에도, 기피신청을 받은 법관이 본안의 소송절차를 정지하지 않고 그대로 증거조사를 실시하였다면, 기피신청을 받은 법관이 한 증거조사는 효력이 없지만, 그 후 그 기피신청에 대한 기각결정이 확정된 경우에는 법원은 그 증거조사에서 인정된 증거를 사용할 수 있다.", false, "▸ 기피신청을 받은 법관이 형소법 제22조에 위반하여 본안의 소송절차를 정지하지 않은 채 그대로 소송을 진행하여서 한 소송행위는 그 효력이 없고, 이는 그 후 그 기피신청에 대한 기각결정이 확정되었다고 하더라도 마찬가지이다. [2012도8544]", "소송주체"],
["043", "☆ 기피신청을 기각한 결정에 대하여는 즉시항고를 할 수 있다.", true, "▸ 제23조 제1항", "소송주체"],
["044", "☆ 법관이 당사자의 증거신청을 채택하지 아니하거나 이미 한 증거결정을 취소하더라도 그 사유만으로는 '불공평한 재판을 할 염려가 있는 때'에 해당한다고 보기 어렵다.", true, "▸ 법관이 당사자의 증거신청을 채택하지 않거나 이미 한 증거결정을 취소한 사유만으로는 불공평한 재판을 할 염려가 있는 객관적 사정이 있다고 보기 어렵다. [2001모2]", "소송주체"],
["045", "검사의 피고인에 관한 공소장변경허가신청에 대하여 불허가 결정을 한 사유만으로 재판의 공평을 기대하기 어려운 객관적인 사정이 있다고 보기 어렵다.", true, "▸ 공소장변경허가신청에 대한 불허가 결정 사유만으로는 불공평한 재판을 할 염려가 있는 객관적인 사정이 있다고 보기 어렵다. [2001모2]", "소송주체"],
["046", "법관이 스스로 기피의 원인이 있다고 판단한 때에는 소속법원에 서면으로 회피를 신청하여야 한다.", true, "▸ 법관이 제18조에 해당하는 사유가 있다고 사료한 때에는 회피하여야 한다(제24조 제1항). 회피는 소속법원에 서면으로 신청하여야 한다(동조 제2항).", "소송주체"],
["047", "형사미성년자도 공소가 제기되면 당사자가 된다.", true, "▸ 자연인은 나이 및 책임능력과 관계 없이 당사자능력이 인정된다. [형사미성년자에 대해서는 책임이 조각되어 전단무죄를 선고한다.]", "소송주체"],
["048", "피고인이 사망하거나 피고인인 법인이 존속하지 아니하게 되었을 경우, 법원은 공소기각결정을 하여야 한다.", true, "▸ 제328조 제1항 제2호 (공소기각의 결정)", "소송주체"],
["049", "소송능력이 없는 자에 대한 공소제기는 효력이 없다.", false, "▸ 소송능력은 소송조건이 아니므로 공소제기의 효력에 영향이 없다. 다만, 소송능력은 소송행위의 유효요건이므로, 소송능력이 없는 피고인의 소송행위는 무효이다.", "소송주체"],
["050", "피고사건의 공판계속 중에 피고인 법인의 청산종료등기가 경료되더라도 피고사건이 종결되지 않는 한 형사소송법상 법인의 당사자능력은 그대로 존속한다.", true, "▸ 법인에 대한 청산종결 등기가 되었더라도 청산사무가 종결되지 않는 한 그 범위 내에서는 청산법인으로 존속한다. 그 사건이 종결될 때까지 법인의 청산사무는 종료되지 않고 형소법상 당사자능력도 그대로 존속한다. [2018도14261]", "소송주체"],
["051", "피고인이 법인인 때에는 그 대표자가 소송행위를 대표하며 수인이 공동하여 법인을 대표하는 경우에는 소송행위에 관하여도 공동으로 대표한다.", false, "▸ 피고인 또는 피의자가 법인인 때에는 그 대표자가 소송행위를 대표한다(제27조 제1항). 수인이 공동하여 법인을 대표하는 경우에도 소송행위에 관하여는 각자가 대표한다(동조 제2항).", "소송주체"],
["052", "☆ 피모용자가 약식명령을 송달받고 이에 대하여 정식재판의 청구를 하여 피모용자를 상대로 심리를 하는 과정에서 성명모용 사실이 발각되고 검사가 공소장을 정정하는 등 사실상의 소송계속이 발생하고 형식상 또는 외관상 피고인의 지위를 갖게 된 경우에는 법원으로서는 피모용자에게 적법한 공소의 제기가 없었음을 밝혀주는 의미에서 형소법 제327조 제2호를 유추적용하여 공소기각의 판결을 한다.", true, "▸ 피모용자가 형식상 피고인의 지위를 갖게 된 경우 법원은 피모용자에게 적법한 공소 제기가 없었음을 밝혀주는 의미에서 형소법 제327조 제2호를 유추적용하여 공소기각 판결을 한다. [97도2215]", "소송주체"],
["053", "☆ 피모용자가 약식명령을 송달받고 이에 대하여 정식재판을 청구하여 피모용자를 상대로 심리를 하는 과정에서 성명모용 사실이 발각된 경우, 진정한 피고인인 모용자에게는 아직 약식명령의 송달이 없었다고 할 것이므로 검사는 공소장에 기재된 피고인 표시를 정정하고 법원은 이에 따라 약식명령의 피고인 표시를 정정하여 본래의 약식명령과 함께 이 정정결정을 모용자에게 송달할 때 비로소 적법한 송달이 있다.", true, "▸ 성명모용이 발각된 경우 진정한 피고인인 모용자에게는 아직 약식명령의 송달이 없었다고 할 것이므로, 검사는 공소장 피고인 표시를 정정하고 법원은 약식명령의 피고인 표시를 정정하여 이 정정결정을 모용자에게 송달할 때 비로소 적법한 송달이 있다. [97도2215]", "소송주체"],
["054", "☆ 甲은 무전취식을 하고 출동한 경찰관에게 자신의 형 A의 인적 사항을 알려주었고, 이에 따라 甲은 A의 이름으로 「경범죄 처벌법」상 통고처분을 받았다. 이후 모용사실이 드러나자 통고처분 절차가 중단되고 甲은 범칙금을 납부하지 않았다. 만약 검사가 동일한 무전취식에 대해 사기죄의 공소사실로 甲을 기소하였고 공소사실에 대한 증명이 충분하다면 법원은 유죄 판결을 선고하여야 한다.", false, "▸ 피의자가 다른 사람의 성명을 모용한 탓으로 공소장에 피모용자가 피고인으로 표시되었더라도 검사는 모용자에 대하여 공소를 제기한 것이므로 모용자가 피고인이 된다. 이 법리는 경범죄처벌법에 따른 통고처분의 효력에도 마찬가지로 적용되므로, 통고처분의 효력이 甲에게 미쳐 공소기각 판결이 선고되어야 한다. [2023도751, 제327조 제2호 공소기각판결]", "소송주체"],
["055", "진술거부권은 현재 피의자나 피고인으로서 수사 또는 공판절차에 계속중인 자 뿐만 아니라 장차 피의자나 피고인이 될 자에게도 보장되며, 형사절차뿐 아니라 행정절차나 국회조사절차 등에서도 보장된다.", true, "▸ [AI해설] 진술거부권은 현재의 피의자·피고인뿐 아니라 장차 그 지위가 될 자에게도 보장되고, 형사절차뿐 아니라 행정절차나 국회조사절차에서도 보장된다(헌법 제12조 제2항). [96헌가11]", "소송주체"],
["056", "피고인 또는 피의자는 자신에게 불이익한 사실뿐만 아니라 이익되는 사실에 대하여도 진술을 거부할 수 있다.", true, "▸ 형소법은 불리한 진술로 한정하고 있지 않다(제44조의3 및 제283조의2).", "소송주체"],
["057", "주취운전의 혐의를 받고 있는 운전자에게 호흡측정기에 의한 주취여부의 측정에 응할 것을 요구하는 것은 진술거부권을 침해한 것이 아니다.", true, "▸ 호흡측정기에 의한 음주측정은 언어나 신체 동작에 의한 진술을 요구하는 것이 아니므로 진술거부권의 보호 범위에 속하지 않는다. [96헌가11, 2009도7924]", "소송주체"],
["058", "재판장은 피고인에 대하여 통상 인정신문 이전에 진술거부권에 대하여 1회 고지하면 되지만, 공판절차를 갱신하는 때에는 다시 고지하여야 한다.", true, "▸ 공판절차를 갱신할 때에도 재판장은 피고인에게 진술거부권 등을 고지하여야 한다(규칙 제144조 제1항, 제1호).", "소송주체"],
["059", "모든 국민은 형사상 자기에게 불리한 진술을 강요당하지 아니할 권리가 보장되어 있으므로, 법원이 피고인의 진술거부권 행사를 가중적 양형의 조건으로 삼는 것은 어떠한 경우에도 허용될 수 없다.", false, "▸ ① 진술거부권 행사를 가중적 양형의 조건으로 삼는 것은 결과적으로 피고인에게 자백을 강요하는 것이 되어 허용될 수 없다. ② 다만, 방어권 행사의 범위를 넘어 객관적이고 명백한 증거가 있음에도 진실의 발견을 적극적으로 숨기거나 법원을 오도하려는 시도에 기인한 경우에는 가중적 양형 조건으로 참작될 수 있다. [2001도192]", "소송주체"],
["060", "조사대상자의 진술 내용이 단순히 제3자의 범죄에 관한 경우가 아니라 자신과 제3자에게 공동으로 관련된 범죄에 관한 것이거나 제3자의 피의사실뿐만 아니라 자신의 피의사실에 관한 것이기도 하여 실질이 피의자신문조서의 성격을 가지는 경우에 수사기관은 진술을 듣기 전에 미리 진술거부권을 고지하여야 한다.", true, "▸ 진술 내용이 자신의 피의사실에 관한 것이기도 하여 실질이 피의자신문조서의 성격을 가지는 경우에 수사기관은 진술을 듣기 전에 미리 진술거부권을 고지하여야 한다. [2014도5939]", "소송주체"],
["061", "☆ 진술거부권 고지의 대상이 되는 피의자의 지위는 수사기관이 범죄인지서를 작성하는 등의 형식적인 사건수리 절차를 거치기 전이라도 조사대상자에 대하여 범죄의 혐의가 있다고 보아 실질적으로 수사를 개시하는 행위를 한 때에 인정되므로, 진술조서의 형식을 취하더라도 실질이 피의자신문조서의 성격을 가지는 경우에는 수사기관은 진술을 듣기 전에 조사대상자에게 미리 진술거부권을 고지하여야 한다.", true, "▸ 피의자 지위는 형식적인 사건수리 절차를 거치기 전이라도 실질적으로 수사를 개시하는 행위를 한 때에 인정되므로, 진술조서 형식을 취하더라도 실질이 피의자신문조서의 성격을 가지는 경우에는 수사기관은 진술 전에 미리 진술거부권을 고지하여야 한다. [2014도5939]", "소송주체"],
["062", "☆ 피의자의 지위는 수사기관이 조사대상자에 대한 범죄 혐의를 인정하여 수사를 개시하는 행위를 한 때 인정되므로, 이러한 피의자 지위에 이르지 아니한 자에 대하여는 수사기관이 진술거부권을 고지하지 아니하였더라도 진술의 증거능력이 부정되지 아니한다.", true, "▸ 피의자 지위에 이르지 않은 자에 대하여는 수사기관이 진술거부권을 고지하지 않았더라도 진술의 증거능력이 부정되지 않는다. [2011도8125]", "소송주체"],
["063", "☆ 수사기관이 피의자의 범의를 명백하게 하기 위하여 A를 참고인으로 조사하는 과정에서 진술거부권을 고지하지 않고 진술조서를 작성하였는데, 추후 계속된 수사를 통하여 A가 피의자와 공범관계에 있을 가능성이 인정되었다면 A에 대한 위 조사 당시 A는 이미 피의자의 지위에 있었다고 볼 수 있으므로 A에 대한 위 진술조서는 증거능력이 없다.", false, "▸ 피고인들과 공범관계에 있을 가능성만으로 A가 참고인으로서 검찰 조사를 받을 당시 검사가 A에 대한 범죄혐의를 인정하고 수사를 개시하여 피의자 지위에 있게 되었다고 단정할 수 없다. [2011도8125]", "소송주체"],
["064", "피고인 또는 피의자는 진술거부권을 포기하고 피고사건 또는 피의사건에 관하여 진술할 수 있으며, 더 나아가 피고인의 경우에는 진술거부권을 포기하고 증인적격을 취득할 수 있다.", false, "▸ 피고인은 형사소송의 당사자이므로 증인적격이 없다. 진술거부권을 포기하더라도 피고인이 증인 지위를 취득하는 것은 불가능하다.", "소송주체"],
["065", "★ 수사기관이 피의자신문 시 피의자에게 미리 진술거부권을 고지하지 않았다고 하더라도 진술의 임의성이 인정되는 경우라면 증거능력이 인정된다.", false, "▸ 수사기관이 피의자를 신문함에 있어서 피의자에게 미리 진술거부권을 고지하지 않은 때에는 그 피의자의 진술은 위법하게 수집된 증거로서 진술의 임의성이 인정되는 경우라도 증거능력이 부인되어야 한다. [2008도8213]", "소송주체"],
["066", "★ 수사기관이 피의자를 신문함에 있어서 피의자에게 미리 진술거부권을 고지하지 않은 때에는 설령 그 진술의 임의성이 인정되는 경우라도 증거능력이 부정되지만 이는 진술거부권을 고지받지 못한 당해 피의자에 대하여 유죄의 증거로 사용할 수 없다는 의미이므로, 공범에 대하여는 유죄의 증거로 사용할 수 있다.", false, "▸ 검사가 공범에게 미리 진술거부권이 있음을 고지한 사실을 인정할 만한 아무런 자료가 없으므로, 진술의 임의성이 인정되는 경우라도 위법하게 수집된 증거로서 증거능력이 없어 '피고인'에 대한 유죄의 증거로 쓸 수 없다. [2008도8213]", "소송주체"],
["067", "☆ 검사가 피의자에게 진술거부권을 고지하였으나, 검사 작성의 피의자신문조서에 진술거부권 행사 여부에 대한 피의자의 답변이 자필로 기재되어 있지 아니하거나 그 답변 부분에 피의자의 기명날인 또는 서명이 되어 있지 아니하였다면 그 피의자신문조서는 '적법한 절차와 방식'에 따라 작성된 것이라고 할 수 없으므로, 그 증거능력을 인정할 수 없다.", true, "▸ 검사 또는 사법경찰관은 피의자가 진술을 거부할 권리 등을 행사할 것인지의 여부를 질문하고 이에 대한 피의자의 답변을 피의자로 하여금 자필로 기재하게 하거나 기명날인 또는 서명하게 하여야 한다(제244조의3 제2항). [2010도3359]", "소송주체"],
["068", "변호인의 선임은 심급마다 변호인과 연명날인한 서면으로 제출하여야 한다고 규정하고 있는「형사소송법」제32조 제1항의 변호인선임신고서는 특별한 사정이 없는 한 원본을 의미한다고 할 것이고, 사본은 이에 해당하지 않는다.", true, "▸ [AI해설] 형소법 제32조 제1항에서 정한 변호인선임신고서는 특별한 사정이 없는 한 원본을 의미하며, 사본은 이에 해당하지 않는다. [2003모429]", "소송주체"],
["069", "공소제기 전의 변호인 선임은 제1심에도 그 효력이 있다.", true, "▸ 공소제기 전에 이루어진 변호인 선임은 제1심에도 효력이 있다(제32조 제2항).", "소송주체"],
["070", "공소사실의 동일성이 인정되어 공소장이 변경된 경우, 변호인 선임의 효력은 변경된 공소사실에도 미친다.", true, "▸ 변호인의 선임은 심급마다 변호인과 연명날인한 서면으로 제출하여야 한다(제32조 제1항). 공소사실의 동일성이 인정되어 공소장이 변경되더라도 변호인 선임의 효력은 변경된 공소사실에도 미친다.", "소송주체"],
["071", "☆ 원심법원에서의 변호인 선임은 파기환송, 파기이송이 있은 후에도 효력이 있다.", true, "▸ [AI해설] 원심법원에서의 변호인 선임은 파기환송 또는 파기이송이 있은 후에도 그 효력이 있다(형사소송규칙 제158조).", "소송주체"],
["072", "☆ 1인의 피고인을 위하여 수인의 국선변호인을 선정할 수 없다.", false, "▸ 국선변호인은 피고인 또는 피의자마다 1인을 선정한다. 다만, 사건의 특수성에 비추어 필요하다고 인정할 때에는 1인의 피고인 또는 피의자에게 수인의 국선변호인을 선정할 수 있다(규칙 제15조 제1항).", "소송주체"],
["073", "수인의 피고인 사이에 이해관계가 상반되지 않더라도 이들에게 동일한 국선변호인을 선정하는 것은 위법하다.", false, "▸ 피고인 또는 피의자 수인간에 이해가 상반되지 아니할 때에는 그 수인의 피고인 또는 피의자를 위하여 동일한 국선변호인을 선정할 수 있다(규칙 제15조 제2항).", "소송주체"],
["074", "☆ 이해가 상반된 피고인들 중 어느 피고인이 법무법인을 변호인으로 선임하고, 법무법인이 담당변호사들을 지정하였을 때, 법원이 그 담당변호사들 중 1인 또는 수인을 다른 피고인을 위한 국선변호인으로 선정한다면, 다른 피고인은 국선변호인의 실질적 조력을 받을 수 없게 되고, 이러한 국선변호인 선정은 국선변호인의 조력을 받을 피고인의 권리를 침해하는 것이다.", true, "▸ 이해가 상반된 피고인들 중 어느 피고인이 선임한 법무법인의 담당변호사를 다른 피고인의 국선변호인으로 선정한다면, 다른 피고인은 국선변호인의 실질적 조력을 받을 수 없게 되어 국선변호인의 조력을 받을 권리가 침해된다. [2015도9951]", "소송주체"],
["075", "법원은 피고인의 나이·지능 및 교육 정도 등을 참작하여 권리보호를 위하여 필요하다고 인정하면 피고인의 명시적 의사에 반하는 경우에도 국선변호인을 선정하여야 한다.", false, "▸ 법원은 피고인의 나이·지능 및 교육 정도 등을 참작하여 권리보호를 위하여 필요하다고 인정하면 '피고인의 명시적 의사에 반하지 아니하는 범위'에서 변호인을 선정하여야 한다(제33조 제3항).", "소송주체"],
["076", "☆ 피고인에 대하여 제1심법원이 집행유예를 선고하였으나 검사만이 양형부당을 이유로 항소한 경우, 항소심이 변호인이 선임되지 않은 피고인에 대하여 검사의 양형부당 항소를 받아들여 형을 선고하는 경우에는 판결 선고 후 피고인을 법정구속한 뒤에 국선변호인을 선정하는 것이 바람직하다.", false, "▸ 이 경우 판결 선고 후 법정구속 뒤에 비로소 국선변호인을 선정하는 것보다는, 피고인의 권리보호를 위해 판결 선고 전 공판심리 단계에서부터 형소법 제33조 제3항에 따라 피고인의 명시적 의사에 반하지 아니하는 범위 안에서 국선변호인을 선정해 주는 것이 바람직하다. [2016도7622]", "소송주체"],
["077", "진단서나 정신감정 등 객관적인 자료가 없다면, 소송기록과 소명자료에 드러난 제반 사정에 비추어 피고인의 의식상태나 사물에 대한 변별능력, 행위통제능력이 결여되거나 저하된 상태로 의심되더라도 법원이 국선변호인을 선정해야 하는 사유인 '피고인이 심신장애의 의심이 있는 때'에 해당한다고 볼 수 없다.", false, "▸ '피고인이 심신장애의 의심이 있는 때'란 진단서나 정신감정 등 객관적 자료가 없더라도, 소송기록과 소명자료에 드러난 제반 사정에 비추어 피고인의 의식상태나 변별능력·행위통제능력이 결여되거나 저하된 상태로 의심되어 피고인이 공판심리단계에서 효과적으로 방어권을 행사하지 못할 우려가 있다고 인정되는 경우를 포함한다. [2023도7561]", "소송주체"],
["078", "☆ 불법촬영 범죄의 피해자에 대하여 변호사가 없는 경우 검사는 피해자에게 국선변호사를 선정하여 줄 수 있다.", true, "▸ 검사는 성폭력범죄의 피해자에게 변호사가 없는 경우 국선변호사를 선정하여 형사절차에서 피해자의 권익을 보호할 수 있다. 다만, 19세 미만 피해자등에게 변호사가 없는 경우에는 국선변호사를 선정하여야 한다(성폭법 제27조 제6항).", "소송주체"],
["079", "☆ 판결만 선고할 경우에도 필요적 변호사건이면 변호인 없이 개정하지 못한다.", false, "▸ 필요적 변호사건에 관하여는 변호인 없이 개정하지 못한다. 단, 판결만을 선고할 경우에는 예외로 한다(제282조).", "소송주체"],
["080", "피고인이 미성년자 또는 70세 이상인 경우 필요적 변호사건에 해당된다.", true, "▸ 제33조 제1항 제2호(피고인이 미성년자인 때), 제3호(피고인이 70세 이상인 때)", "소송주체"],
["081", "★「형사소송법」제33조(국선변호인)에 규정된 법원이 직권으로 변호인을 선정하여야 할 사유 중 하나인 '피고인이 구속된 때'의 의미에 피고인이 해당 형사사건이 아닌 별개의 사건, 즉 별건으로 구속되어 있거나 다른 형사사건에서 유죄로 확정되어 수형 중인 경우도 포함된다고 보는 것은 문언해석의 한계를 벗어나지 않는다.", true, "▸ 형소법 제33조 제1항 제1호의 '피고인이 구속된 때'라 함은 피고인이 해당 형사사건에서 구속되어 재판을 받고 있는 경우에 한정된다고 볼 수 없고, 피고인이 별건으로 구속영장이 발부되어 집행되거나 다른 형사사건에서 유죄판결이 확정되어 그 판결의 집행으로 구금 상태에 있는 경우 또한 포괄하고 있다. [2021도6357]", "소송주체"],
["082", "☆ 변호인 없는 불구속 피고인에 대하여 국선변호인을 선정하지 않은 채 판결을 선고한 다음 법정구속을 하더라도 구속되기 이전까지는「형사소송법」제33조 제1항 제1호의 '피고인이 구속된 때'에 해당하지 않는다.", true, "▸ 변호인 없는 불구속 피고인에 대하여 국선변호인을 선정하지 않은 채 판결을 선고한 다음 법정구속을 하더라도 구속되기 이전까지는 형소법 제33조 제1항 제1호의 '피고인이 구속된 때'에 해당하지 않는다. [2010도17353]", "소송주체"],
["083", "★ 필요적 변호사건에서 법원의 공판절차가 변호인 없이 이루어진 경우, 그와 같은 위법한 공판절차에서 이루어진 소송행위는 무효이다.", true, "▸ 필요적 변호사건에 해당하는 사건에서 제1심의 공판절차가 변호인 없이 이루어져 증거조사와 피고인신문 등 심리가 이루어졌다면, 그와 같은 위법한 공판절차에서 이루어진 증거조사와 피고인신문 등 일체의 소송행위는 모두 무효이다. [2011도6325]", "소송주체"],
["084", "★ 필요적 변호사건에서 제1심의 공판절차가 변호인 없이 이루어진 경우 항소심은 위법한 제1심판결을 파기하고 피고인의 심급의 이익을 박탈하지 않기 위하여 사건을 제1심법원으로 환송하여야 한다.", false, "▸ 항소심으로서는 변호인이 있는 상태에서 소송행위를 새로이 한 후 위법한 제1심판결을 '파기'하고, 항소심에서의 증거조사 및 진술 등 심리 결과에 기하여 '다시 판결'하여야 한다. [2011도6325, 항소심은 파기·자판이 원칙]", "소송주체"],
["085", "☆ 필요적 변호사건에서 변호인 출석 없이 실체적 심리가 이루어진 경우 그 심리절차는 무효이지만, 그 절차에서의 소송행위 외에 다른 절차에서 적법하게 이루어진 소송행위까지 모두 무효라고 볼 수는 없다.", true, "▸ 필요적 변호사건에서 변호인 출석 없이 실체적 심리가 이루어진 경우 그 심리절차는 무효이지만, 그 절차에서의 소송행위 외에 다른 절차에서 적법하게 이루어진 소송행위까지 모두 무효라고 볼 수는 없다. [99도915]", "소송주체"],
["086", "☆ 필요적 변호사건의 공판절차가 사선 변호인과 국선 변호인이 모두 불출석한 채 개정되어 국선 변호인 선정 취소 결정이 고지된 후 변호인 없이 피해자에 대한 증인신문 등 심리가 이루어진 경우, 그와 같은 위법한 공판절차에서 이루어진 피해자에 대한 증인신문 등 일체의 소송행위는 모두 무효이다.", true, "▸ 필요적 변호사건의 공판절차가 사선·국선 변호인이 모두 불출석한 채 개정되어 변호인 없이 피해자에 대한 증인신문 등 심리가 이루어진 경우, 그와 같은 위법한 공판절차에서 이루어진 일체의 소송행위는 모두 무효이다. [90도646]", "소송주체"],
["087", "☆ 변호인이 적극적으로 피고인 또는 피의자로 하여금 허위진술을 하도록 하는 것이 아니라 단순히 헌법상 권리인 진술거부권이 있음을 알려 주고 그 행사를 권고하는 것은 허용된다.", true, "▸ 변호인이 적극적으로 피고인 또는 피의자로 하여금 허위진술을 하도록 하는 것이 아니라 단순히 헌법상 권리인 진술거부권이 있음을 알려 주고 그 행사를 권고하는 것을 가리켜 변호사로서의 진실의무에 위배되는 것이라고는 할 수 없다. [2006모656]", "소송주체"],
["088", "변호인이 피의자 또는 피고인으로 하여금 수사기관이나 법원에 대하여 허위진술을 하도록 하는 것은 허용되지 않는다.", true, "▸ 형사변호인의 기본적인 임무가 피고인 또는 피의자를 보호하고 그의 이익을 대변하는 것이라고 하더라도, 그러한 이익은 법적으로 보호받을 가치가 있는 정당한 이익으로 제한되고, 변호인이 의뢰인의 요청에 따른 변론행위라는 명목으로 수사기관이나 법원에 대하여 적극적으로 허위의 진술을 하거나 피고인 또는 피의자로 하여금 허위진술을 하도록 하는 것은 허용되지 않는다. [2012도6027]", "소송주체"],
["089", "★ 甲이 피의자로서 임의동행으로 연행된 경우에는 甲에게 변호인으로 선임된 L과 접견교통권이 인정되지만, 피내사자로서 임의동행 형식으로 연행된 경우에는 접견교통권이 인정되지 않는다.", false, "▸ 임의동행의 형식으로 수사기관에 연행된 피의자에게도 변호인과의 접견교통권은 당연히 인정되고, 임의동행의 형식으로 연행된 '피내사자'의 경우에도 이는 마찬가지이다. [96모18]", "소송주체"],
["090", "☆ 피내사자 신분이라고 하더라도 변호인과의 접견교통권은 피내사자의 인권보장과 방어준비를 위한 필수불가결한 권리이므로 법령에 의한 제한이 없는 한 법원의 결정으로도 이를 제한할 수 없다.", true, "▸ 접견교통권은 법령에 의한 제한이 없는 한 수사기관의 처분은 물론 법원의 결정으로도 이를 제한할 수 없다. 피내사자의 경우에도 마찬가지이다. [96모18]", "소송주체"],
["091", "수사단계에서 불구속 상태로 조사를 받고 있는 불구속 피의자인 경우에는 변호인과의 접견교통권이 인정되지 아니한다.", false, "▸ 변호인과의 자유로운 접견은 불구속 피의자·피고인의 경우에도 인정된다. [2000헌마138]", "소송주체"],
["092", "미결수용자의 변호인 접견권은 국가안전보장·질서유지 또는 공공복리를 위해 필요한 경우 법률로써 제한될 수 있다.", true, "▸ 구속된 자와 변호인 간의 접견이 실제로 이루어지는 경우에 변호인과의 자유로운 접견은 어떠한 명분으로도 제한될 수 없는 성질의 것이다. 그러나 변호인과의 접견 자체에 대해 아무런 제한도 가할 수 없다는 것을 의미하지 않으므로 미결수용자의 변호인 접견권 역시 국가안전보장, 질서유지 또는 공공복리를 위해 필요한 경우에는 법률로써 제한될 수 있다. [2009헌마341]", "소송주체"],
["093", "★ 신체구속을 당한 사람이 그 변호인을 자신의 범죄행위에 공범으로 가담시키려고 하였다면 신체구속을 당한 사람과 그 변호인의 접견교통을 금지할 수 있다.", false, "▸ 변호인의 접견교통의 상대방인 신체구속을 당한 사람이 그 변호인을 자신의 범죄행위에 공범으로 가담시키려고 하였다는 등의 사정만으로 그 변호인의 신체구속을 당한 사람과의 접견교통을 금지하는 것이 정당화될 수 없다. [2006모657]", "소송주체"],
["094", "수사기관이 구금장소를 임의적으로 변경하여 접견교통을 어렵게 한 것은 접견교통권의 행사에 중대한 장애를 초래하는 것이므로 위법하다.", true, "▸ 수사기관이 구금장소를 임의적으로 변경하여 접견교통을 어렵게 한 것은 접견교통권의 행사에 중대한 장애를 초래하는 것이므로 위법하다. [95모94]", "소송주체"],
["095", "공소가 제기된 이후의 공판절차에서 법원이 변호인과 구속된 피고인 사이의 접견교통권을 침해하는 결정을 한 경우에는 항고할 수 있다.", true, "▸ 법원의 관할 또는 판결 전의 소송절차에 관한 결정에 대하여는 즉시항고를 할 수 있는 경우 외에는 항고를 하지 못하나(제403조 제1항), '구금'에 관한 결정은 예외이다(제403조 제2항). 접견교통권을 침해하는 결정은 구금에 관한 결정에 해당하므로 항고할 수 있다.", "소송주체"],
["096", "☆ 신체구속을 당한 피고인 또는 피의자에 대한 변호인의 접견교통권은 수사기관의 처분 등에 의해 이를 제한할 수 없고, 다만 법령에 의하여서는 제한이 가능하다.", true, "▸ 변호인의 접견교통권은 신체구속을 당한 피고인이나 피의자의 인권보장과 방어준비를 위하여 필수불가결한 권리로서 법령에 의한 제한이 없는 한 수사기관의 처분은 물론 법원의 결정으로도 이를 제한할 수 없다. [91모24]", "소송주체"],
["097", "☆ 이 사건으로 긴급체포된 피의자의 변호인이 피의자에 대한 접견을 신청하였으나 수사기관이 접견신청일로부터 상당한 기간이 경과하도록 접견을 허용하지 않은 경우, 피의자의 변호인은「형사소송법」제417조에 따라 준항고를 제기할 수 있다.", true, "▸ 검사 또는 사법경찰관의 구금·압수에 관한 처분 및 제243조의2에 따른 변호인 참여 등에 관한 처분에 대하여 불복이 있으면 제417조에 따른 준항고를 제기할 수 있다. 접견신청일이 경과하도록 접견이 이루어지지 아니한 것은 실질적으로 접견불허가처분이 있는 것과 동일시된다. [91모24]", "소송주체"],
["098", "★ 甲이 체포되어 구속영장이 청구되어 신문받고 있는 과정에서 변호인이 되려는 L이 甲에 대한 접견교통을 신청하였음에도 불구하고 검사가 이를 허용하기 위한 조치를 취하지 않았을 경우 이는 변호인의 접견교통권을 침해한 것이고, 위 접견교통권은 헌법상 기본권에 해당하므로 변호인이 되려는 L은 그 침해를 이유로 헌법소원심판을 청구할 수 있다.", true, "▸ '변호인이 되려는 자'의 접견교통권 역시 헌법상 기본권으로서 보장되어야 한다. 검사의 접견불허행위는 헌법이나 법률의 근거 없이 이를 제한한 것이므로 변호인인 청구인의 접견교통권을 침해하였다. [2015헌마1204]", "소송주체"],
["099", "☆ 변호인뿐만 아니라 변호인이 되려는 의사를 표시한 자가 객관적으로 변호인이 될 가능성이 있다고 인정된다면 신체구속을 당한 피의자와 접견하지 못하도록 제한하여서는 아니 된다.", true, "▸ [AI해설] 변호인이 되려는 의사를 표시한 자가 객관적으로 변호인이 될 가능성이 있다고 인정된다면 그를 이유로 신체구속을 당한 피의자와의 접견을 제한하는 것은 허용되지 않는다. [2013도16162]", "소송주체"],
["100", "★ 검사가 甲을 긴급체포하여 조사 중, 甲의 친구인 변호사 A가 甲의 변호인이 되기 위하여 검사에게 접견신청을 하였으나, 검사가 변호인선임신고서의 제출을 요구하면서 변호인 접견을 못하게 한 상태에서 검사가 작성한 甲에 대한 피의자신문조서는 甲에 대한 유죄의 증거로 사용할 수 없다.", true, "▸ 검사 작성의 피의자신문조서가 검사에 의하여 피의자에 대한 변호인의 접견이 부당하게 제한되고 있는 동안에 작성된 경우에는 증거능력이 없다. [90도1285]", "소송주체"],
["101", "변호인 L이 구금된 피고인과 자유로이 서신을 주고받을 권리는 헌법 제12조 제4항에서의 변호인의 조력을 받을 권리에 포함되므로, 피고인을 구금하고 있는 수용시설에서 서신의 상대방인 L이 변호인이라는 사실을 확인할 수 있어야 자유로운 서신 왕래를 허용하는 것은 甲의 변호인의 조력을 받을 권리를 침해하는 것이다.", false, "▸ 미결수용자와 변호인 사이의 서신으로서 그 비밀을 보장받기 위해서는, ① 교도소측에서 상대방이 변호인이라는 사실을 확인할 수 있어야 하고, ② 서신을 통하여 형벌법령에 저촉되는 내용이 기재되어 있다고 의심할 만한 합리적인 이유가 있는 경우가 아니어야 한다. 따라서 상대방이 변호인임을 확인할 수 있어야 서신 비밀을 보장하는 것은 권리침해가 아니다. [92헌마144]", "소송주체"],
["102", "변호인선임에 관한 서면을 제출하지 아니한 변호인도 피의자신문에 참여할 수 있다.", false, "▸ 피의자나 피의자신문에 참여하려는 변호인은 변호인의 피의자신문 참여 전에 검사에게 변호인선임에 관한 서면을 제출해야 한다(검찰사건사무규칙 제22조 제3항, 경찰수사규칙 제12조 제2항 제1호).", "소송주체"],
["103", "신체구속을 당하지 아니한 피의자의 변호인도 체포·구속된 피의자의 변호인과 마찬가지로 피의자신문 참여를 신청할 수 있다.", true, "▸ [AI해설] 검사 또는 사법경찰관은 피의자 또는 그 변호인·법정대리인·배우자·직계친족·형제자매의 신청에 따라 변호인을 피의자와 접견하게 하거나 정당한 사유가 없는 한 피의자에 대한 신문에 참여하게 하여야 한다(제243조의2 제1항). 구속 여부를 불문하고 적용된다.", "소송주체"],
["104", "신문에 참여하고자 하는 변호인이 2인 이상인 때에는 피의자가 신문에 참여할 변호인 1인을 지정하고, 지정이 없는 경우에는 검사 또는 사법경찰관이 지정할 수 있다.", true, "▸ 제243조의2 제2항", "소송주체"],
["105", "수사기관은 피의자를 신문하기 전에 변호인의 조력을 받을 수 있다는 것을 알려주어야 한다.", true, "▸ 제244조의3 제1항", "소송주체"],
["106", "수사기관은 변호인이 피의자신문을 방해하거나 수사기밀을 누설할 염려가 있는 경우 변호인의 피의자신문 참여권을 제한할 수 있다.", true, "▸ 형소법 제243조의2 제1항에서 '정당한 사유'란 변호인이 피의자신문을 방해하거나 수사기밀을 누설할 염려가 있음이 객관적으로 명백한 경우 등을 말한다. [2015모2357]", "소송주체"],
["107", "☆ 피의자신문에 참여한 변호인은 신문 후 의견을 진술할 수 있는 것이 원칙이나, 신문 중이라도 부당한 신문방법에 대하여 이의를 제기할 수 있고, 검사 또는 사법경찰관의 승인을 얻어 의견을 진술할 수 있다.", true, "▸ 신문에 참여한 변호인은 신문 후 의견을 진술할 수 있다. 다만, 신문 중이라도 부당한 신문방법에 대하여 이의를 제기할 수 있고, 검사 또는 사법경찰관의 승인을 받아 의견을 진술할 수 있다(제243조의2 제3항).", "소송주체"],
["108", "☆ 피의자신문에 참여한 변호인은 신문 중에 신문방법의 위법함을 이유로 이의제기를 할 수 있지만 부당함을 이유로는 이의제기를 할 수 없다.", false, "▸ 신문 중이라도 부당한 신문방법에 대하여 이의를 제기할 수 있다(제243조의2 제3항). 위법한 신문방법뿐만 아니라 '부당한' 신문방법에 대해서도 이의제기가 허용된다.", "소송주체"],
["109", "★ 피의자가 변호인의 참여를 원한다는 의사를 명백하게 표시하였음에도 수사기관이 정당한 사유 없이 변호인을 참여하게 하지 아니한 채 피의자를 신문하여 작성한 피의자신문조서는 증거로 할 수 없다.", true, "▸ 피의자가 변호인의 참여를 원한다는 의사를 명백하게 표시하였음에도 수사기관이 정당한 사유 없이 변호인을 참여하게 하지 아니한 채 작성한 피의자신문조서는 형소법 제312조의 '적법한 절차와 방식에 위반된 증거'이자 제308조의2의 '적법한 절차에 따르지 아니하고 수집한 증거'에 해당하므로 증거로 할 수 없다. [2010도3359]", "소송주체"],
["110", "★ 변호인의 피의자신문 참여에 관한 사법경찰관의 처분에 대하여는 준항고로 불복할 수 있으나, 검사의 처분에 대하여는 즉시항고로 불복하여야 한다.", false, "▸ 검사 또는 사법경찰관의 구금·압수에 관한 처분과 제243조의2에 따른 변호인의 참여 등에 관한 처분에 대하여 불복이 있으면 제417조에 따른 준항고로 불복할 수 있다. 검사의 처분도 즉시항고가 아닌 준항고의 대상이다.", "소송주체"],
["111", "★ 변호인이 피의자신문이 진행되는 중에 검사의 부당한 신문방법에 대한 이의제기를 하였다는 이유만으로 검사가 변호인을 조사실에서 퇴거시키는 조치를 하였다면 이는 위법하고, 검사의 이와 같은 처분은 준항고의 대상이 된다.", true, "▸ 변호인이 부당한 신문방법에 대한 이의제기를 하였다는 이유만으로 변호인을 조사실에서 퇴거시키는 조치는 정당한 사유 없이 변호인의 피의자신문 참여권을 제한하는 것으로서 허용될 수 없다. 이러한 처분은 제417조 준항고의 대상이 된다. [2015모2357]", "소송주체"],
["112", "☆ 사법경찰관이 甲을 피의자신문 하던 중 甲의 옆에 착석한 국선변호인 L에게 수사방해 및 수사기밀유출에 대한 우려가 없고, 조사실의 장소적 제약이 없음에도 甲의 뒤에 가서 앉으라고 요청하였다면, 이는 변호인의 변호권을 침해하는 것이다.", true, "▸ 수사기관이 피의자신문을 하면서 정당한 사유가 없는데도 변호인에 대하여 피의자로부터 떨어진 곳으로 옮겨 앉으라고 지시를 한 다음 이러한 지시에 따르지 않았음을 이유로 변호인의 피의자신문 참여권을 제한하는 것은 허용될 수 없다. [2008모793]", "소송주체"],
["113", "☆ 검사 또는 사법경찰관이 구금된 피의자를 신문할 때 피의자 또는 변호인으로부터 보호장비를 해제해 달라는 요구를 받고도 거부한 조치는「형사소송법」제417조가 규정한 준항고의 대상이 되는 '구금에 관한 처분'에 해당한다.", true, "▸ 검사는 조사실에서 피의자를 신문할 때 해당 피의자에게 그러한 특별한 사정이 없는 이상 교도관에게 보호장비의 해제를 요청할 의무가 있다. 검사 또는 사법경찰관이 구금된 피의자를 신문할 때 피의자 또는 변호인으로부터 보호장비를 해제해 달라는 요구를 받고도 거부한 조치는 형소법 제417조에서 정한 '구금에 관한 처분'에 해당한다. [2015모2357]", "소송주체"],
["114", "☆ 변호인으로 선임된 L이 피의자신문 절차에서 인정신문을 시작하기 전에 검사에게 피의자 甲의 수갑을 해제하여 달라고 계속 요구하였으나 검사가 도주, 자해, 다른 사람에 대한 위해 등의 위험이 없음에도 L의 요구를 거부한 경우, 검사의 거부 조치에 대해서 L은「형사소송법」제417조의 준항고를 제기할 수 있다.", true, "▸ 검사가 인정신문 시작 전 변호인으로부터 수갑 해제를 명시적이고 거듭 요구받고도 교도관에게 수갑 해제를 요청하지 않았고, 당시 형집행법 제97조 제1항 각 호에 규정된 위험이 분명하고 구체적으로 드러나는 특별한 사정이 있다고 볼 만한 자료가 없으므로, 이 사건 거부처분은 위법하다. [2015모2357]", "소송주체"],
["115", "소송요건의 존부 등 직권조사사유에 관하여는 공소장에 기재되지 않았거나 공소장 변경이 없다고 하더라도 법원이 반드시 심판하여야 한다.", true, "▸ [AI해설] 소송요건의 존부 등 직권조사사유에 관하여는 공소장에 기재되지 않았거나 공소장 변경이 없다고 하더라도 법원이 반드시 심판하여야 한다. [2019도15117]", "소송주체"],
["116", "형사소송법상 소송능력이라고 함은 소송당사자가 유효하게 소송행위를 할 수 있는 능력, 즉 피고인 또는 피의자가 자기의 소송상의 지위와 이해관계를 이해하고 이에 따라 방어행위를 할 수 있는 의사능력을 의미한다.", true, "▸ [AI해설] 형사소송법상 소송능력이란 소송당사자가 유효하게 소송행위를 할 수 있는 능력, 즉 피고인 또는 피의자가 자기의 소송상 지위와 이해관계를 이해하고 이에 따라 방어행위를 할 수 있는 의사능력을 의미한다. [2009도6058]", "소송주체"],
["117", "★ 변호인이 될 자가 변호인선임서를 제출하지 아니한 채 항소이유서를 제출하고, 이유서 제출기간 경과 후에 선임서를 제출한 경우 위 항소이유서 제출은 적법·유효하다고 할 수 없다.", true, "▸ 변호인의 선임은 심급마다 변호인과 연명날인한 서면으로 제출하여야 한다(형소법 제32조 제1항). 따라서 변호인 선임서를 제출하지 않은 채 항소이유서만을 제출하고 항소이유서 제출기간이 지난 후에 변호인 선임서를 제출하였다면 그 항소이유서는 적법·유효한 변호인의 항소이유서가 될 수 없다. [2014도12737]", "소송주체"],
["118", "☆ 피고인의 변호인이 변호인선임신고서 사본을 첨부하여 정식재판청구서를 접수한 다음 정식재판청구기간 이후에 비로소 변호인선임신고서 원본을 첨부하여 다시 정식재판청구서를 접수한 경우, 그 정식재판청구는 유효하다.", false, "▸ 변호인선임신고서는 특별한 사정이 없는 한 원본을 의미하고, 사본은 이에 해당하지 않는다. 변호인선임신고서를 제출하지 아니한 변호인 명의로 정식재판청구서만을 제출하고 정식재판청구기간 경과 후에 비로소 변호인선임신고서를 제출한 경우, 변호인 명의로 제출한 위 정식재판청구서는 적법·유효한 정식재판청구서로서의 효력이 없다. [2003모429]", "소송주체"],
["119", "☆ 착오에 의한 소송행위가 무효로 되기 위하여서는 첫째 통상인의 판단을 기준으로 하여 만일 착오가 없었다면 그러한 소송행위를 하지 않았으리라고 인정되는 중요한 점(동기를 포함)에 관하여 착오가 있고, 둘째 착오가 행위자 또는 대리인이 책임질 수 없는 사유로 인하여 발생하였으며, 셋째 그 행위를 유효로 하는 것이 현저히 정의에 반한다고 인정될 것 등 세 가지 요건을 필요로 한다.", true, "▸ 착오에 의한 소송행위가 무효가 되려면 ① 통상인 기준으로 착오 없었다면 하지 않았을 중요한 점에 관한 착오, ② 행위자 또는 대리인이 책임질 수 없는 사유로 착오 발생, ③ 그 행위를 유효로 하는 것이 현저히 정의에 반할 것, 이 세 가지 요건을 필요로 한다. [92모1]", "소송주체"],
["120", "★ 교도관이 내어 주는 상소권포기서를 항소장으로 잘못 믿어 이를 확인하지 않고 서명무인하였다면, 항소인에게 과실이 있다고 보기는 어려워 상소포기는 무효이다.", false, "▸ 교도관이 내어 주는 상소권포기서를 항소장으로 잘못 믿은 나머지 이를 확인하여 보지도 않고 서명무인하였다는 점에 있어서는 재항고인에게 과실이 없다고 보기는 어렵고, 따라서 재항고인의 항소포기는 유효하다. [95모49]", "소송주체"],
["121", "보호감호를 선고받은 피고인이 보호감호가 선고된 것으로 알고 상고를 제기하였다가 보호감호청구가 기각되었다는 취지의 교도관의 말과 공판에 출정한 교도관이 작성한 판결선고결과보고서의 기재를 믿은 나머지 착오에 빠져 판결등본송달을 기다리지 않고 상고취하를 함으로써 보호감호처분이 확정된 경우, 상고취하를 무효로 볼 수 없다.", true, "▸ 위 상고취하에 피고인의 과실이 없었다고 단정할 수 없어 이를 무효로 볼 수 없다. [92모1]", "소송주체"],
["122", "정당한 출석요구에 응하지 아니한 피혐의자에 대하여 사법경찰관이 체포영장을 신청한 때에는 사법경찰관이 수사를 개시한 것으로 본다.", true, "▸ 검사 또는 사법경찰관이 ① 피혐의자의 수사기관 출석조사, ② 피의자신문조서의 작성, ③ 긴급체포, ④ 체포·구속영장의 청구 또는 신청 중 어느 하나에 해당하는 행위에 착수한 때에는 수사를 개시한 것으로 본다(검사와 사법경찰관의 상호협력과 일반적 수사준칙에 관한 규정 제16조 제1항).", "수사일반"],
["123", "내사는 범죄혐의의 유무를 확인하기 위하여 범죄인지 전에 행해지는 수사기관 내부의 조사활동에 불과하므로, 단지 내사 그 자체만으로는 피내사자에게 어떠한 의무를 부과하거나 피내사자의 기본권에 직접적이고 구체적인 침해를 가한다고 볼 수 없으므로, 헌법소원심판의 대상이 되는 공권력 행사로 보기 어렵다.", true, "▸ 내사는 범죄인지 전에 행해지는 수사기관 내부의 조사활동에 불과하므로, 단지 내사 그 자체만으로는 피내사자의 기본권에 직접적이고 구체적인 침해를 가한다고 볼 수 없어 헌법소원심판의 대상이 되는 공권력 행사로 보기 어렵다. [2011헌마30]", "수사일반"],
["124", "☆ 친고죄에 대한 수사가 장차 고소가 있을 가능성이 없는 상태하에서 행하여졌다고 하더라도 고소가 있기 전에 수사를 하였다는 이유만으로 그 수사가 위법한 것은 아니다.", false, "▸ 친고죄에 있어서 고소는 소추조건에 불과하고 수사의 조건은 아니므로, 고소가 있기 전에 수사하였다는 이유만으로 위법하지 않다. 그러나 '장차 고소나 고발의 가능성이 없는 상태하에서 행해졌다는 등의 특단의 사정'이 있는 경우는 위법하게 된다. [2008도7724]", "수사일반"],
["125", "☆ 경찰관이 노래방의 도우미 알선 영업단속 실적을 올리기 위하여 그에 대한 제보나 첩보가 없는데도 손님을 가장하고 들어가 도우미를 불러줄 것을 요구하였으나 한 차례 거절당한 후에 다시 찾아가 도우미를 불러 줄 것을 요구하여 도우미가 오자 단속하였다면 이는 위법한 함정수사에 해당한다.", true, "▸ 본래 범의를 가지지 아니한 자에 대하여 수사기관이 사술이나 계략 등을 써서 범의를 유발케 하여 범죄인을 검거하는 함정수사는 위법함을 면할 수 없다. 이 사건 단속은 수사기관이 사술이나 계략 등을 써서 피고인의 범의를 유발케 한 것으로서 위법하다. [2007도1903]", "수사일반"],
["126", "★ 수사기관과 직접 관련이 있는 유인자가 피유인자와의 개인적 친밀관계를 이용하여 피유인자의 동정심에 호소하거나, 금전적·심리적 압박이나 위협 등을 가하거나, 거절하기 힘든 유혹을 하거나, 범행방법을 구체적으로 제시하고 범행에 사용될 금전까지 제공하는 등으로 과도하게 개입함으로써 피유인자로 하여금 범의를 일으키게 하는 것은 위법한 함정수사에 해당하여 허용되지 않는다.", true, "▸ 수사기관과 직접 관련이 있는 유인자가 개인적 친밀관계 이용, 금전적·심리적 압박, 범행방법 구체적 제시 및 금전 제공 등으로 과도하게 개입하여 피유인자의 범의를 유발케 하는 것은 위법한 함정수사에 해당한다. [2006도2339]", "수사일반"],
["127", "★ 유인자가 수사기관과 직접적인 관련을 맺지 아니한 상태에서 피유인자를 상대로 단순히 수차례 반복적으로 범행을 부탁하였을 뿐 수사기관이 사술이나 계략 등을 사용하였다고 볼 수 없는 경우에는 그로 인하여 피유인자의 범의가 유발되었고, 유인자의 제보로 수사가 개시되었더라도 위법한 함정수사에 해당하지 아니한다.", true, "▸ 유인자가 수사기관과 직접적인 관련이 없는 상태에서 단순히 수차례 반복적으로 범행을 부탁한 것에 불과하고 수사기관이 사술이나 계략을 사용하였다고 볼 수 없다면, 범의가 유발되었더라도 위법한 함정수사에 해당하지 않는다. [2006도2339]", "수사일반"],
["128", "★ 위법한 함정수사에 기하여 공소를 제기한 피고사건은 범죄로 되지 아니하므로「형사소송법」제325조의 규정에 따라 법원은 판결로써 무죄를 선고하여야 한다.", false, "▸ 위법한 함정수사에 기한 공소제기는 그 절차가 법률의 규정에 위반하여 무효인 때에 해당하므로 제327조 제2호에 의한 공소기각 '판결'을 하여야 한다. 제325조의 무죄판결 사유가 아니다. [2005도1247]", "수사일반"],
["129", "★ 범의를 유발케 하여 범죄인을 검거하는 함정수사에 기하여 공소를 제기한 경우 법원은 결정으로 공소를 기각하여야 한다.", false, "▸ 위법한 함정수사에 기한 공소제기는 그 절차가 법률의 규정에 위반하여 무효인 때에 해당하므로 '결정'이 아닌 제327조 제2호에 의한 공소기각 '판결'을 하여야 한다. [2005도1247]", "수사일반"],
["130", "사법경찰관리가 신분비공개수사를 진행하고자 할 때에는 사전에 상급 경찰관서 수사부서의 장의 승인을 받아야 하며, 그 수사기간은 3개월을 초과할 수 없다.", true, "▸ 사법경찰관리가 신분비공개수사를 진행하고자 할 때에는 사전에 상급 경찰관서 수사부서의 장의 승인을 받아야 한다. 이 경우 그 수사기간은 3개월을 초과할 수 없다(아청법 제25조의3 제1항).", "수사일반"],
["131", "사법경찰관리가 신분위장수사를 하려는 경우에는 긴급을 요하는 때가 아닌 한 사전에 검사에게 서면으로 허가를 신청하여 법원의 허가를 받아야 한다.", true, "▸ 사법경찰관리는 신분위장수사를 하려는 경우에는 검사에게 신분위장수사에 대한 허가를 신청하고, 검사는 법원에 그 허가를 청구한다(아청법제25조의3 제3항). 사법경찰관리는 위 절차를 거칠 수 없는 긴급을 요하는 때에는 법원의 허가 없이 신분위장수사를 할 수 있다(제25조의5 제1항).", "수사일반"],
["132", "사법경찰관리가 신분비공개수사 또는 신분위장수사를 통하여 수집한 증거 및 자료 등은 목적이 된 디지털 성범죄나 이와 관련되는 범죄를 수사·소추하거나 그 범죄를 예방하기 위하여 사용하는 경우나 범죄로 인한 관련된 징계절차에서 사용할 수 있으나, 증거 및 자료 수집의 대상자가 제기하는 손해배상청구소송에서 사용할 수는 없다.", false, "▸ 신분비공개수사 또는 신분위장수사를 통하여 수집한 증거 및 자료 등은 ① 해당 디지털 성범죄 등의 수사·소추 또는 예방, ② 관련 징계절차, ③ 증거 및 자료 수집의 대상자가 제기하는 손해배상청구소송에서의 사용, ④ 다른 법률의 규정에 의한 사용의 어느 하나에 해당하는 경우 외에는 사용할 수 없다(아청법 제25조의6). 손해배상청구소송에서도 사용가능하다.", "수사일반"],
["133", "「민법」상 행위능력이 없는 사람이라도 피해를 입은 사실을 이해하고 고소에 따른 사회생활상의 이해관계를 알아차릴 수 있는 사실상의 의사능력을 갖추었다면 고소능력이 인정된다.", true, "▸ 고소능력은 피해를 입은 사실을 이해하고 고소에 따른 사회생활상의 이해관계를 알아차릴 수 있는 사실상의 의사능력으로 족하므로, 민법상 행위능력이 없는 사람이라도 고소능력이 인정될 수 있다. [2007도4962]", "수사일반"],
["134", "친고죄에서 고소는 서면뿐만 아니라 구술로도 할 수 있고, 다만 구술에 의한 고소를 받은 검사 또는 사법경찰관은 조서를 작성하여야 하지만 그 조서가 독립된 조서일 필요는 없으며, 수사기관이 고소권자를 증인 또는 피해자로서 신문한 경우에 그 진술에 범인의 처벌을 요구하는 의사표시가 포함되어 있고 그 의사표시가 조서에 기재되면 고소는 적법하다.", true, "▸ 친고죄에서 고소는 서면뿐만 아니라 구술로도 가능하고, 수사기관이 고소권자를 증인·피해자로서 신문하는 경우 그 진술에 범인의 처벌을 요구하는 의사표시가 포함되어 조서에 기재되면 적법한 고소이다. [2011도4451]", "수사일반"],
["135", "☆ 甲, 乙, 丙은 합동으로 A의 집에 들어가 A 소유의 다이아몬드 반지 1개를 가지고 나왔다. 피해자 A는 경찰에 도난신고를 할 당시에는 범인이 누구인지 알지 못하고 무조건 범인 모두를 처벌해 달라고 고소하였다. A의 고소는 범인을 특정하지 않은 것이므로 부적법하다.", false, "▸ 고소인은 범죄사실을 특정하여 신고하면 족하고 범인이 누구인지, 나아가 범인 중 처벌을 구하는 자가 누구인지를 적시할 필요도 없다. 범인의 성명이 불명이거나 범행의 일시·장소·방법 등이 명확하지 않다고 하더라도 고소의 효력에는 영향이 없다. [94도2423, 84도1704]", "수사일반"],
["136", "★ 유효한 고소에 기초한 친고죄의 공소제기 후 제1심판결 선고 전에 유효한 고소취소가 있으면 법원은 공소기각판결을 선고하여야 한다.", true, "▸ 공소제기 후 제1심판결 선고 전에 고소취소가 있으면 제327조 제5호에 의한 공소기각판결을 선고하여야 한다.", "수사일반"],
["137", "☆ 채권자인 甲과 그의 아내 乙은 빚을 갚지 못하고 있는 채무자 A를 찾아가 함께 심한 욕설을 하였다. A가 경찰청 인터넷 홈페이지에 '甲과 乙을 철저히 조사해 달라'는 취지의 민원을 접수하는 형태로 甲과 乙에 대한 조사를 촉구하는 의사표시를 하였더라도「형사소송법」에 따른 적법한 고소를 한 것으로 볼 수 없다.", true, "▸ 고소는 고소권자가 수사기관에 범죄사실을 신고하여 범인의 소추·처벌을 요구하는 의사표시이다. 피해자가 경찰청 인터넷 홈페이지에 '피고인을 철저히 조사해 달라'는 취지의 민원을 접수하는 형태로 조사를 촉구하는 의사표시를 한 것은 형소법에 따른 적법한 고소로 보기 어렵다. [2010도9524]", "수사일반"],
["138", "★ 검사가 모욕의 피해자 A의 고소 없이 甲을 모욕죄로 공소제기한 이후라도 A가 제1심 법원에 고소장을 제출하여 고소가 추완된 경우에는 제1심 법원은 공소기각의 판결이 아니라 실체재판을 하여야 한다.", false, "▸ 공소제기 후의 고소 추완은 허용되지 아니하므로 적법한 고소가 없어 형소법 제327조 제2호에 따라 공소를 기각하여야 한다. [2005도8976, 모욕죄·사자명예훼손죄·비밀침해죄·업무상비밀누설죄는 친고죄]", "수사일반"],
["139", "고발이 소추조건인 조세범칙사건에 대하여 세무공무원의 고발 없이 공소가 제기된 후에 세무공무원이 고발을 하여도 그 공소절차의 무효는 치유되지 않는다.", true, "▸ [AI해설] 소추조건인 고발이 없이 공소가 제기된 경우 그 절차적 무효는 사후의 고발로 치유되지 않는다. [70도942]", "수사일반"],
["140", "★ 법정대리인의 고소권은 무능력자의 보호를 위하여 법정대리인에게 주어진 독립대리권이므로, 피해자의 명시한 의사에 반하여 행사할 수 없다.", false, "▸ 법정대리인의 고소권은 무능력자의 보호를 위하여 법정대리인에게 주어진 고유권이므로, 법정대리인은 피해자의 고소권 소멸 여부에 관계없이 고소할 수 있고, 이러한 고소권은 피해자의 명시한 의사에 반하여도 행사할 수 있다. [2002도2520]", "수사일반"],
["141", "법정대리인의 고소권의 성격을 고유권으로 보는 견해와 독립대리권으로 보는 견해는 법정대리인이 피해자의 명시한 의사에 반하여 고소할 수 있는지의 여부에 대하여 차이가 있다.", false, "▸ 피해자의 법정대리인은 독립하여 고소할 수 있으므로(제225조 제1항), 피해자의 명시한 의사에 반하여 고소할 수 있다는 점에서 두 견해 모두 차이가 없다. 차이는 피해자의 고소권이 소멸한 경우에도 법정대리인이 고소할 수 있는지, 피해자가 법정대리인의 고소를 취소할 수 있는지 여부에 있다.", "수사일반"],
["142", "피해자의 법정대리인은 독립하여 고소할 수 있으므로, 고소 당시에 이혼한 생모도 피해자의 친권자로서 독립하여 고소할 수 있다.", true, "▸ 피해자의 법정대리인은 독립하여 고소할 수 있으므로, 고소 당시에 이혼한 생모도 피해자의 친권자로서 독립하여 고소할 수 있다. [87도1707]", "수사일반"],
["143", "★ 甲과 A는 동거하지 않는 형제 사이인데 A가 실종되었다. 甲은 2023. 1.경 법원이 선임한 A의 부재자 재산관리인으로서 A 앞으로 공탁된 수용보상금 7억 원을 수령하였다. 그 후 법원은 2023. 3.경 A의 부재자 재산관리인을 甲에서 B로 개임하였다. 그럼에도 甲은 B에게 공탁금의 존재를 알려 주지도 않고 인계하지도 않았다. 2023. 5.경 위 사실을 알게 된 B가 2023. 6.경 법원으로부터 고소권 행사에 관하여 허가를 받고 나서 바로 甲을 위 사실에 관하여 특정경제범죄가중처벌등에관한법률위반(배임)죄로 수사기관에 고소하였다. B는 A의 부재자 재산관리인으로서 그 관리대상인 A의 재산에 대한 범죄행위에 관하여 법원으로부터 고소권 행사에 관한 허가를 얻었으므로 A의 법정대리인으로서 적법한 고소권자에 해당한다.", true, "▸ 법원이 선임한 부재자 재산관리인이 그 관리대상인 부재자의 재산에 대한 범죄행위에 관하여 법원으로부터 고소권 행사에 관한 허가를 얻은 경우 부재자 재산관리인은 법정대리인으로서 적법한 고소권자에 해당한다. [2021도2488]", "수사일반"],
["144", "형사소송법 제236조의 고소대리는 대리권이 정당한 고소권자에 의하여 수여되었음이 실질적으로 증명되면 충분하고, 그 방식에 특별한 제한은 없으므로, 고소를 할 때 반드시 위임장을 제출한다거나 '대리'라는 표시를 하여야 하는 것은 아니다.", true, "▸ 고소대리에 있어서 대리권이 정당한 고소권자에 의하여 수여되었음이 실질적으로 증명되면 충분하고, 그 방식에 특별한 제한이 없으므로 반드시 위임장을 제출하거나 '대리'라는 표시를 하여야 하는 것은 아니다. [2001도3081]", "수사일반"],
["145", "성폭력범죄 피해자의 변호사는 형사절차에서 피해자 등의 대리가 허용될 수 있는 모든 소송행위에 대한 포괄적인 대리권을 가지므로 피해자의 변호사는 피해자를 대리하여 피고인에 대한 처벌을 희망하는 의사표시를 철회하거나 처벌을 희망하지 않는다는 의사표시를 할 수 있다.", true, "▸ 성폭력범죄 피해자의 변호사는 형사절차에서 피해자 등의 대리가 허용될 수 있는 모든 소송행위에 대한 포괄적인 대리권을 가진다(성폭법 제27조 제5항). 따라서 피해자의 변호사는 피해자를 대리하여 피고인에 대한 처벌을 희망하는 의사표시를 철회하거나 처벌을 희망하지 않는다는 의사표시를 할 수 있다. [2019도10678]", "수사일반"],
["146", "「형사소송법」제230조 제1항의 '범인을 알게 된 날'이라는 것은 통상인의 입장에서 보아 고소권자가 고소를 할 수 있을 정도로 범죄사실과 범인을 아는 것을 의미하고, 범죄사실을 안다는 것은 고소권자가 친고죄에 해당하는 범죄의 피해가 있었다는 사실관계에 관하여 확정적인 인식이 있음을 말한다.", true, "▸ '범인을 알게 된 날'이란 통상인의 입장에서 고소권자가 고소를 할 수 있을 정도로 범죄사실과 범인을 아는 것을 의미하고, 범죄사실을 안다는 것은 친고죄에 해당하는 범죄의 피해가 있었다는 사실관계에 관하여 확정적인 인식이 있음을 말한다. [2018도1818]", "수사일반"],
["147", "영업범 등 포괄일죄의 경우 고소권자가 범죄행위가 계속되는 도중에 범인을 알았다 하더라도 최후의 범죄행위가 종료한 때에 고소기간이 진행된다.", true, "▸ 제230조의 '범인을 알게 된 날'이란 범죄행위가 종료된 후에 범인을 알게 된 날을 가리키는 것으로서, 고소권자가 범죄행위가 계속되는 도중에 범인을 알았다 하더라도, 고소기간은 '범죄행위가 종료된 때'부터 계산하여야 한다. [2004도5014]", "수사일반"],
["148", "☆ 변호사 甲이 친고죄의 피해자인 의뢰인 乙로부터 가해자인 A에 대한 고소대리권을 수여받아 고소를 제기한 경우, 고소기간은 고소대리인인 甲이 범죄사실을 알게 된 날부터 기산한다.", false, "▸ 고소대리인의 고소기간은 대리고소인이 아니라 정당한 고소권자를 기준으로 고소권자가 범인을 알게 된 날부터 기산한다. [2001도3081]", "수사일반"],
["149", "피해자의 법정대리인은 피해자의 고소권 소멸 여부에 관계없이 고소할 수 있고, 법정대리인의 고소기간은 법정대리인 자신이 범인을 알게 된 날로부터 진행한다.", true, "▸ 법정대리인의 고소권은 고유권으로서 피해자의 고소권 소멸 여부에 관계없이 고소할 수 있는 것이므로 법정대리인이 범인을 알게 된 날로부터 진행한다. [87도857]", "수사일반"],
["150", "☆ 친고죄에서 적법한 고소가 있었는지는 엄격한 증명의 대상이 되고, 일죄의 관계에 있는 친고죄 범죄사실 일부에 대한 고소의 효력은 일죄 전부에 대하여 미친다.", false, "▸ 친고죄에서 적법한 고소의 존부는 '자유로운 증명'의 대상이다. 일죄의 관계에 있는 범죄사실 일부에 대한 고소의 효력은 일죄 전부에 대하여 미친다는 점은 옳다. [2011도4451]", "수사일반"],
["151", "친고죄에 있어서 양벌규정에 따라 처벌하기 위해서는 행위자에 대한 고소뿐만 아니라 양벌규정에 의하여 처벌받는 자에 대하여도 고소가 필요하다.", false, "▸ 친고죄의 경우에 있어서도 행위자의 범죄에 대한 고소가 있으면 족하고, 양벌규정에 의하여 처벌받는 자에 대하여 별도 고소를 요한다고 할 수는 없다. [94도2423]", "수사일반"],
["152", "고소불가분의 원칙상 친고죄의 공범 중 일부에 대하여만 처벌을 구하고 나머지에 대하여는 처벌을 원하지 않는 내용의 고소는 적법한 고소라고 할 수 없다.", true, "▸ 고소불가분의 원칙상 친고죄의 공범 중 일부에 대하여만 처벌을 구하고 나머지에 대하여는 처벌을 원하지 않는 내용의 고소는 적법한 고소라고 할 수 없다. [2008도7462]", "수사일반"],
["153", "乙과 丙은 서로 짜고 B를 포함한 여러 사람들에게 甲을 모욕하는 말을 떠들고 다녔다. 이에 甲은 乙과 丙을 모욕의 범죄사실로 고소하였다. 乙과 丙이 모욕죄의 공범으로 기소되어 제1심 공판심리 중 甲이 乙에 대한 고소를 취소하면 수소법원은 乙과 丙 모두에 대하여 공소기각의 판결을 선고해야 한다.", true, "▸ 친고죄의 공범 중 그 1인 또는 수인에 대한 고소 또는 그 취소는 다른 공범자에 대하여도 효력이 있으므로(제233조), 甲이 乙에 대한 친고죄인 모욕죄의 고소를 취소하면 乙과 丙 모두에 대하여 공소기각판결(제327조 제5호)을 선고해야 한다.", "수사일반"],
["154", "甲, 乙, 丙은 합동으로 A 소유의 다이아몬드 반지 1개를 절취하였다는 공소사실로 기소되었다. 甲의 누나로서, 결혼하여 따로 살고 있는 A는 경찰에 무조건 범인 모두를 처벌해 달라고 고소하였는데, 나중에 친동생 甲이 처벌되는 것을 원하지 않아 제1심 공판 중 甲에 대한 고소만을 취소하였다. 고소의 주관적 불가분원칙에 의하여 법원은 甲, 乙, 丙 모두에 대하여 공소기각의 판결을 하여야 한다.", false, "▸ 甲은 피해자 A의 동거하지 않는 동생이므로 甲에 대한 특수절도죄는 상대적 친고죄에 해당한다. 신분관계가 없는 공범에 대하여는 친족상도례를 적용하지 않으므로(형법 제344조, 제328조 제3항), 법원은 甲에 대해서는 공소기각판결(제327조 제5호), 乙·丙에 대하여는 유·무죄의 실체판결을 해야 한다.", "수사일반"],
["155", "★ 고소는 수사기관에 대한 법률행위적 소송행위이므로 고소의 취소도 공소제기 전후를 불문하고 수사기관에 대하여 하여야 한다.", false, "▸ 고소취소나 처벌불원의사는 공소제기 전에는 고소사건을 담당하는 수사기관에, 공소제기 후에는 수소법원에 대하여 이루어져야 한다. [2011도17264]", "수사일반"],
["156", "☆ A가 甲을 모욕으로 적법하게 고소하였다가 甲과 합의가 되어 '모욕에 대한 고소를 취소한다'는 합의서를 甲에게 작성하여 준 경우, 甲이 합의서를 자신의 모욕 사건에 대한 항소심이 진행되던 중에 제출하였다 하더라도, 검사가 모욕으로 공소제기하기 이전에 합의하였다면, 항소심 법원은 甲에 대해 공소기각판결을 선고하여야 한다.", false, "▸ 고소는 제1심 판결선고 전까지 취소할 수 있다(제232조). 합의서가 작성되었다고 하더라도 수사기관 또는 제1심법정에 제출되어야 고소취소의 효력이 생기고, 항소심 제출은 효력이 없다. [2011도17264]", "수사일반"],
["157", "★ 민사사건에서 '이 사건과 관련하여 서로 상대방에 대해 제기한 형사사건의 고소를 모두 취하한다'는 내용이 포함된 조정이 성립된 것만으로도 형사사건의 고소가 취소된 것으로 볼 수 있다.", false, "▸ 고소인이 수사기관이나 제1심법정에 제출하지 아니한 경우, 민사사건에서 '형사사건의 고소를 모두 취하한다'는 조정이 성립된 것만으로는 고소를 취소하였다거나 처벌을 원하지 아니한다는 의사를 표시한 것으로 보기 어렵다. [2003도8136]", "수사일반"],
["158", "乙은 甲을 모욕죄로 경찰서에 신고하여 처벌을 원한다고 진술하였으나, 사건이 검찰에 송치된 후에 甲으로부터 500만 원을 돌려받고 '원만히 합의되었으므로 앞으로 어떠한 민·형사상의 책임을 묻지 않겠다'는 취지의 합의서를 작성하여 검사에게 제출하였다. 乙이 작성한 합의서에 비록 고소를 취소한다고 명시한 문구가 없더라도 위와 같은 합의서를 제출한 것은 고소를 취소한 것으로 볼 수 있다.", true, "▸ 고소를 취소한다는 명시적 문구가 없더라도 그 합의서의 내용으로 보아 실질적으로 고소취소의 의사표시가 포함되어 있으면 고소취소로 볼 수 있다. [2001도6777]", "수사일반"],
["159", "★ 고소는 제1심 판결선고 전까지 취소할 수 있으므로 친고죄의 공범 중 일부에 대하여 제1심 판결이 선고된 후라도 제1심 판결선고 전의 다른 공범자에 대하여는 고소를 취소할 수 있고, 고소를 취소한 경우 친고죄에 대한 고소취소로서의 효력이 있다.", false, "▸ 친고죄의 공범 중 그 일부에 대하여 제1심판결이 선고된 후에는 제1심판결선고전의 다른 공범자에 대하여도 그 고소를 취소할 수 없고 그 고소취소가 있다 하더라도 그 효력을 발생할 수 없다. [85도1940]", "수사일반"],
["160", "☆ 친고죄에서 고소권자의 고소가 유효함에도 고소의 효력이 없다는 이유로 공소를 기각한 제1심 판결에 대하여 항소심 절차가 진행되던 중 고소인이 고소를 취소하였는데 항소심이 제1심의 공소기각 부분이 위법하다는 이유로 사건을 파기환송한 경우, 환송 후의 제1심 법원은 고소취소를 이유로 공소기각판결을 선고할 수 없다.", false, "▸ 환송 후의 제1심판결 선고 전에 고소가 취소되면 형소법 제327조 제5호에 의하여 판결로써 공소를 기각하여야 한다. 다시 제1심이므로 고소취소의 효력이 있다. [2009도9112]", "수사일반"],
["161", "★ 친고죄로 고소를 제기하였다가 공소제기 전 고소를 취소한 후 고소기간 내에 다시 동일한 친고죄로 고소하여 공소제기된 경우, 수소법원은「형사소송법」제327조 제2호의 '공소제기의 절차가 법률의 규정에 위반하여 무효인 때'에 해당함을 이유로 판결로써 공소기각의 선고를 하여야 한다.", true, "▸ 고소를 취소한 자는 다시 고소할 수 없다(제232조 제2항). 고소취소를 철회하는 의사표시를 다시 하였다고 하여도 그것은 효력이 없으므로, 이에 기한 공소제기는 그 절차가 법률의 규정에 위반하여 무효인 때에 해당한다. [2007도425]", "수사일반"],
["162", "☆ 친고죄에 있어서의 피해자의 고소권은 공법상의 권리라고 할 것이므로 법이 특히 명문으로 인정하는 경우를 제외하고는 자유처분을 할 수 없고, 따라서 일단 제기한 고소는 취소할 수 있으나 고소 전에 고소권을 포기할 수 없다.", true, "▸ 친고죄에서 피해자의 고소권은 공법상의 권리이므로 특히 명문으로 인정하는 경우를 제외하고는 자유처분을 할 수 없어 고소권의 포기에 관한 규정이 없으므로 고소 전에 고소권을 포기할 수 없다. [67도471]", "수사일반"],
["163", "☆ 피해자가 고소장을 제출하여 처벌을 희망하는 의사를 분명히 표시한 후 고소를 취소한 바 없다고 하더라도, 고소 전에 피해자가 처벌을 원치 않는다는 의사를 표시하였다면 그 후에 한 피해자의 고소는 부적법하다.", false, "▸ 피해자가 고소장을 제출하여 처벌을 희망하는 의사를 분명히 표시한 후 고소를 취소한 바 없다면, 비록 고소 전에 피해자가 처벌을 원치 않았다 하더라도 그 후에 한 피해자의 고소는 유효하다. [2007도4977]", "수사일반"],
["164", "★ 비친고죄에 해당하는 죄로 기소되어 항소심에서 친고죄에 해당하는 죄로 공소장이 변경된 후 공소제기 전에 행하여진 고소가 취소되었다면 항소심법원은 공소기각의 판결을 선고하여야 한다.", false, "▸ 항소심에서 비로소 고소인이 고소를 취소하였다면 친고죄에 대한 고소취소로서의 효력이 없다. 항소심을 제1심이라 할 수는 없으므로 제1심 판결선고 전의 고소취소에 해당하지 않기 때문이다. [96도1922, 반의사불벌죄도 동일: 85도2518]", "수사일반"],
["165", "☆ 고소권자가 비친고죄로 고소한 사건이더라도 검사가 사건을 친고죄로 구성하여 공소를 제기하였다면 공소장 변경절차를 거쳐 공소사실이 비친고죄로 변경되지 아니하는 한, 법원은 친고죄에서 소송조건이 되는 고소가 유효하게 존재하는지를 직권으로 조사·심리하여야 한다.", true, "▸ 고소권자가 비친고죄로 고소한 사건이더라도 검사가 친고죄로 구성하여 공소를 제기하였다면 공소사실이 비친고죄로 변경되지 아니하는 한, 법원은 소송조건인 고소의 유효 여부를 직권으로 조사·심리하여야 한다. [2013도7987]", "수사일반"],
["166", "★ 사채업자 甲은 소규모 간판업자 乙에게 300만 원을 빌려 주었다가 돌려 받지 못하자, 乙을 찾아가 \"당장 돈을 내놓지 않으면 사람을 시켜 죽도 새도 모르게 죽여버리겠다.\"라고 乙을 위협하여 원금과 이자조로 현금 400만 원을 받았다. 공갈죄의 수단으로서 한 협박은 공갈죄에 흡수되어 별도로 협박죄를 구성하지 않으므로, 乙이 甲을 협박죄로 고소하였다가 취소하였다고 하여도 이는 甲을 공갈죄로 처벌하는 데에 장애가 되지 않는다.", true, "▸ 검사가 공소를 제기할 당시 범죄사실을 협박죄로 구성하여 기소하였더라도, 그 후 공판 중에 기본적 사실관계가 동일하여 공소사실을 공갈미수로 공소장 변경이 허용된 이상 그 공소제기의 하자는 치유된다. [96도2151]", "수사일반"],
["167", "☆ 친족상도례는 공갈의 죄 및 장물에 관한 죄에 적용될 수 있지만 강도의 죄 및 손괴의 죄에는 적용되지 않는다.", true, "▸ 친족상도례는 특수절도·특수공갈 등 특수범이나 상습범인 경우에도 적용된다. 그러나 강요, 점유강취, 중권리행사방해, 강제집행면탈, 강도(준강도), 손괴죄에는 적용되지 않는다. 특히 형법 제37장 권리행사방해죄 중 '제323조 권리행사방해죄에만' 친족상도례가 적용된다.", "수사일반"],
["168", "☆ 「특정경제범죄 가중처벌 등에 관한 법률」에는 친족상도례에 관한 규정을 적용한다는 명시적인 규정이 없으므로 특정경제범죄가중처벌등에관한법률위반(사기)죄에는 친족상도례에 관한 규정이 적용되지 않는다.", false, "▸ 친족상도례는 특경법위반(사기)죄에도 그대로 적용된다. [89도582]", "수사일반"],
["169", "甲은 동거하지 않는 이종사촌동생인 A의 기망에 의하여 A로부터 부동산을 비싸게 매수하자 A가 취득한 전매차익 1,000만 원을 받아내기 위하여, 후배 乙과 함께 A의 집으로 찾아가 전매차익을 돌려주지 않으면 죽여버리겠다고 협박하여 A로부터 1,000만 원을 돌려받았다. 검사가 甲과 乙을 폭력행위등처벌에관한법률위반(공동공갈)죄로 기소한 경우, A가 고소한 적이 없다고 하더라도 법원은 甲과 乙에 대하여 공소기각 판결을 할 수 없다.", false, "▸ 친족상도례는 폭처법위반죄에도 그대로 적용된다. A(甲의 이종사촌동생)와의 관계에서 甲에게는 친족상도례 적용으로 상대적 친고죄가 되어 A의 고소 없이 甲에 대한 공소는 제327조 제2호에 의해 기각되어야 한다. 乙에 대해서는 친족관계 없으므로 실체판결을 해야 한다. [2010도5795]", "수사일반"],
["170", "☆ 甲은 A를 상대로 날치기 강도 범행을 하여 A 소유의 자기앞수표(액면금 1억 원) 총 5매가 들어있는 손가방을 가지고 갔다. 甲은 따로 살고 있는 사촌 형 乙에게 위 사실관계를 모두 말해 주면서 위 현금 5억 원을 당분간 보관해 달라고 부탁하였고, 乙은 그 돈을 건네받아 보관하였다. 乙에 대한 장물보관죄에 대하여는 甲과 乙 사이의 친족관계를 이유로 그 형을 감경 또는 면제하여야 한다.", false, "▸ 본범과 장물범 사이에는 형법 제328조 제1항의 친족상도례만 적용되고, 제2항은 적용되지 않는다. 乙은 甲과 따로 살고 있는 사촌 형(4촌)으로 제2항의 친족관계에 해당하므로 친족상도례가 적용되지 않는다.", "수사일반"],
["171", "친족관계는 원칙적으로 범행 당시에 존재하여야 한다.", true, "▸ 친족상도례의 적용을 위한 친족관계는 원칙적으로 범행 당시에 존재하여야 한다. [96도1731]", "수사일반"],
["172", "☆ 범인이 자신과 사돈지간인 피해자를 속여 재물을 편취한 경우, 사기죄의 범인에 대해 친족상도례를 적용할 수 없다.", true, "▸ 민법 제767조는 '혈족의 배우자의 혈족'을 인척에 포함시키지 않고 있으므로, 사돈지간은 인척관계가 아니어서 친족상도례가 적용되지 않는다. [2011도2170]", "수사일반"],
["173", "☆ 사기죄를 범하는 자가 금원을 편취하기 위한 수단으로 피해자와 혼인신고를 한 것이어서 그들 사이에 참다운 관계의 설정을 바라는 효과의사가 없어 혼인이 무효인 경우라면, 그러한 피해자에 대한 사기죄에서는 친족상도례를 적용할 수 없다.", false, "▸ 혼인이 무효인 경우라도 혼인신고가 이루어져 있어 법률상 배우자 지위가 형성된 이상 친족상도례가 적용된다. 다만 이는 헌법불합치 결정이 선고된 제328조 제1항에 관한 내용이다. [2014도11533]", "수사일반"],
["174", "피고인이 타가에 친양자로 입양되는 경우, 생가를 중심으로 한 종전의 친족관계는 소멸되어 생부 또는 생모와 사이에 친족상도례가 적용되지 않는다.", true, "▸ 친양자의 입양 전의 친족관계는 친양자 입양이 확정된 때에 종료하므로(민법 제908조의3 제2항), 생가를 중심으로 한 종전의 친족관계는 소멸되어 친족상도례가 적용되지 않는다.", "수사일반"],
["175", "★ 부(父)가 혼인 외의 출생자를 인지하는 경우에 그 인지의 소급효는 형법상 친족상도례에 관한 규정의 적용에는 미치지 아니한다.", false, "▸ 父가 혼인 외의 출생자를 인지하는 경우에 있어서는 민법 제860조에 의하여 그 자의 출생시에 소급하여 인지의 효력이 생기는 것이며, 이와 같은 인지의 소급효는 친족상도례에 관한 규정의 적용에도 미친다. [96도1731]", "수사일반"],
["176", "A와 B를 기망하여 이들의 합유로 되어 있는 부동산에 대한 매매계약을 체결하고 소유권을 이전받은 다음 잔금을 지급하지 않은 경우, A와는 동거하지 않는 4촌 혈족이지만 B와는 아무런 친족관계가 없다면, A에 대한 사기죄 부분은 상대적 친고죄에 해당하지만, B에 대한 사기죄 부분은 친족상도례가 적용되지 않는다.", false, "▸ 사기의 일부 피해자와 친족관계에 있으나 다른 피해자와는 친족관계가 없는 경우, 편취한 부동산이 피해자들의 합유로 등기되어 있다면 친족상도례 규정이 적용되지 않는다. 친족인 피해자와의 관계에서도 적용되지 않는다. [2015도3160]", "수사일반"],
["177", "★ 甲은 삼촌 A와 따로 살고 있다. 甲은 어느 날 비어 있는 A의 집에 몰래 들어가 A가 보관 중이던 A의 친구 B 소유의 노트북을 절취하였다. 甲과 점유자인 A 사이에 친족관계가 존재하므로 A의 고소가 없다면 甲은 절도죄로 기소될 수 없다.", false, "▸ 친족상도례에 관한 규정은 범인과 피해물건의 소유자 및 점유자 모두 사이에 친족관계가 있는 경우에만 적용되는 것이고, 절도범인이 피해물건의 소유자나 점유자의 어느 일방과 사이에서만 친족관계가 있는 경우에는 그 적용이 없다. [80도131]", "수사일반"],
["178", "★ 법원을 기망하여 제3자로부터 재물을 편취한 경우 피해자는 법원이 아니라 재물을 편취당한 제3자이므로 제3자와 사기죄를 범한 자가 비동거 친족관계에 있을 때에는 제3자의 고소가 있어야 공소를 제기할 수 있다.", true, "▸ 사기죄에서 피기망자인 법원은 피해자가 될 수 없고 재물을 편취당한 제3자가 피해자이다. 피해자인 제3자와 사기죄를 범한 자가 직계혈족의 관계에 있을 때에는 제354조·제328조 제1항에 의하여 형을 면하여야 하고, 비동거친족 관계라면 상대적 친고죄로서 고소가 있어야 공소를 제기할 수 있다. [2014도8076]", "수사일반"],
["179", "★ 횡령죄와 관련하여 친족상도례는 범인과 피해물건의 소유자 및 위탁자 쌍방 간에「형법」제328조 소정의 친족관계가 있는 경우에만 적용되고, 범인과 피해물건의 소유자 간에만 친족관계가 있거나 범인과 위탁자 간에만 친족관계가 있는 경우에는 적용될 수 없다.", true, "▸ 횡령죄에서 친족상도례는 범인과 피해물건의 소유자 및 위탁자 쌍방 간에 친족관계가 있는 경우에만 적용되고, 어느 일방과의 관계에서만 친족관계가 있는 경우에는 적용될 수 없다. [2008도3438]", "수사일반"],
["180", "★ 甲은 따로 살고 있는 삼촌 A의 집에 몰래 들어가 A의 통장을 절취한 후 인근 현금자동지급기로 가서 우연히 알아낸 비밀번호를 이용하여 A의 계좌에서 자신의 계좌로 100만 원을 이체하였다. 甲의 이체행위와 관련하여 A 명의의 계좌의 금융기관을 피해자에 해당한다고 볼 수 없으므로, 甲이 A의 계좌에서 자신의 계좌로 100만 원을 이체한 행위에 친족상도례가 적용된다.", false, "▸ 친척 소유 예금통장을 절취하여 현금자동지급기로 다른 금융기관의 자기 계좌로 이체한 경우(컴퓨터등사용사기), 범행으로 인한 피해자는 이체된 예금 상당액의 채무를 이중으로 지급해야 할 위험에 처하게 되는 그 친척 거래 금융기관이므로, 친족상도례를 적용할 수 없다. [2006도2704]", "수사일반"],
["181", "★ 친족상도례와 같은 상대적 친고죄의 경우 비신분자에 대한 고소는 신분자에 대하여 효력이 없고 신분자에 대한 고소의 취소는 비신분자에 대하여 효력이 없다.", true, "▸ 상대적 친고죄에서 고소·고소취소의 효력은 비신분자와 신분자 각각에 대해 독립적으로 작용한다. 비신분자에 대한 고소는 신분자에게 효력이 없고, 신분자에 대한 고소취소도 비신분자에게 효력이 없다(제344조, 제328조 제3항).", "수사일반"],
["182", "★ 甲이 乙에게 절도를 교사하고 이에 따라 乙이 자신과 동거하지 않는 삼촌 丙의 신용카드를 절취한 경우, 丙의 고소가 없더라도 甲을 절도교사죄로 처벌할 수 있다.", true, "▸ 乙과 丙은 동거하지 않는 3촌 혈족관계이므로 상대적 친고죄에 해당한다(제344조, 제328조 제2항). 신분관계가 없는 공범에 대하여는 친족상도례를 적용하지 아니하므로(제328조 제3항), 甲과 丙은 친족관계가 없어 친족상도례가 적용되지 않는다. [따라서 甲은 丙의 고소 없이도 처벌 가능]", "수사일반"],
["183", "☆ 甲은 乙에게 乙의 삼촌인 A의 신용카드를 절취하도록 교사하고, 이에 따라 乙이 A의 신용카드를 절취하였다. 乙이 A와 동거하지 않고 있다면, 乙의 절도죄는 형법상 친족상도례에 따라 A의 고소가 있어야 처벌할 수 있다.", true, "▸ 乙과 A는 비동거 3촌 혈족이므로 제344조, 제328조 제2항이 적용되어 상대적 친고죄에 해당한다. 따라서 A의 고소가 있어야 처벌할 수 있다.", "수사일반"],
["184", "세무공무원 등의 고발이 있어야 공소를 제기할 수 있는 조세범처벌법위반죄에 대하여 고발을 받아 수사한 검사가 불기소처분을 하였다가 나중에 공소를 제기하는 경우에는 세무공무원 등의 새로운 고발이 있어야 하는 것은 아니다.", true, "▸ [AI해설] 조세범처벌법위반죄에 대하여 고발을 받아 수사한 검사가 불기소처분을 하였다가 나중에 공소를 제기하는 경우에는 세무공무원 등의 새로운 고발이 있어야 하는 것은 아니다. [2009도6614]", "수사일반"],
["185", "동일한 부가가치세의 과세기간 내에 행하여진 조세포탈기간이나 포탈액수의 일부에 대한 조세포탈죄의 고발이 있는 경우 그 고발의 효력은 그 과세기간 내의 조세포탈기간 및 포탈액수 전부에 미친다.", true, "▸ 고발은 범죄사실에 대한 소추를 요구하는 의사표시로서 그 효력은 고발장에 기재된 범죄사실과 동일성이 인정되는 사실 모두에 미친다. [2009도3282]", "수사일반"],
["186", "☆ 조세법에 대한 국세청장 등의 고발에도 고소·고발 불가분의 원칙이 적용되므로 양벌규정에 의하여 처벌받는 법인에 대한 고발은 행위자인 자연인에게까지 미친다.", false, "▸ 조세범처벌법 제6조에 따른 고발에 있어서는 고소·고발 불가분의 원칙이 적용되지 아니하므로, 고발의 구비 여부는 양벌규정에 의하여 처벌받는 자연인인 행위자와 법인에 대하여 개별적으로 논하여야 한다. [2004도4066]", "수사일반"],
["187", "☆ 피고인 A, B는 공동하여 공정거래위원회의 고발이 있어야 공소를 제기할 수 있는 독점규제및공정거래에관한법률위반의 범행을 저질렀는데, 공정거래위원회가 A만 고발하였다 하더라도, 고발대상에서 제외된 B에 대하여도 고발의 효력이 미치므로 법원은 B에 대하여 공소기각판결을 하여서는 아니된다.", false, "▸ 친고죄에 관한 고소의 주관적 불가분원칙을 규정한 형소법 제233조는 공정거래위원회의 고발(소추조건)에는 적용되지 않는다. B에 대해서는 제327조 제2호 공소기각판결을 해야 한다. [2008도4762]", "수사일반"],
["188", "★ 항소심은 피고인이 반의사불벌죄에 있어서 처벌불원의 의사표시의 부존재를 항소이유로 주장하지 않는 경우에는 제1심판결 선고 전에 처벌불원의 의사표시가 있었는지 여부를 직권으로 조사·판단할 필요는 없다.", false, "▸ 반의사불벌죄에 있어서 처벌불원의 의사표시의 부존재는 소극적 소송조건으로서 직권조사사항이다. [2002도158]", "수사일반"],
["189", "피해자의 고소가 없음에도 검사가 甲을「형법」제307조 제1항 명예훼손과「형법」제311조 모욕으로 기소하였다면(피해자에 대한 별개의 사건), 법원으로서는 명예훼손과 모욕에 대해 공소기각판결을 하여야 한다.", false, "▸ 명예훼손죄는 반의사불벌죄이고, 모욕죄는 친고죄이므로, 모욕죄에 대해서만 형소법 제327조 제2호에 의하여 공소기각판결을 하고, 명예훼손죄에 대해서는 실체판결을 하여야 한다.", "수사일반"],
["190", "☆ 甲은 혈중알코올농도 0.12%의 술에 취한 상태로 승용차를 운전하다가 도로에서 중앙선을 침범한 과실로 다른 승용차를 충격하여 운전자인 A에게 상해를 입혔다. 만약 甲이 교통사고 당시 음주의 영향으로 정상적인 운전이 곤란한 상태였음이 인정되지 않고, 수사기관에 피해자 A의 甲에 대한 처벌불원서가 제출되었다면, 검사는 교통사고처리특례법위반(치상)의 점에 대하여는 공소를 제기할 수 없다.", false, "▸ 교특법 제3조 제2항 단서 제2호(중앙선침범), 제8호(음주운전)에 해당하므로 교특법위반(치상)죄는 반의사불벌죄가 적용되지 않는다(교특법 제3조 제2항).", "수사일반"],
["191", "☆ 甲은 혈중알콜농도는 0.15%로 술에 취한 상태에서 자동차를 운전하다가 A 소유의 상점 출입문을 들이받아 파손하였다. 甲이 A 소유의 상점 출입문을 파손한 점은 도로교통법위반죄를 구성하지만, A가 甲을 처벌하지 말아달라는 의사표시를 한 경우 검사는 甲을 도로교통법위반으로 기소할 수 없다.", true, "▸ 업무상과실 재물손괴로 인한 도로교통법위반죄는 교특법 제3조 제2항의 각호 단서에 해당하는지와 관계없이 반의사불벌죄에 해당하고, 종합보험에 가입된 경우 처벌되지 않는다(교특법 제3조, 제4조).", "수사일반"],
["192", "☆ 2인 이상이 공동으로 폭행죄를 범하여 폭력행위등처벌에관한법률위반(공동폭행)죄로 처벌되는 경우에도 피해자의 명시한 의사에 반하여 공소를 제기할 수 없다.", false, "▸ 폭처법상 공동폭행(제2조 제2항)은 반의사불벌죄 규정이 적용되지 않는다(폭처법 제2조 제4항).", "수사일반"],
["193", "甲은 A를 강간하였는데, A가 甲을 고소하자 이에 보복하기 위해서 A를 협박하였다. A가 경찰에서 甲의 협박에 대한 처벌불원서를 제출하였으나 검사가 특정범죄가중처벌등에관한법률위반(보복협박등)죄로 공소를 제기한 경우, 법원은 이 죄에 대하여「형사소송법」제327조 제2호에 의하여 공소를 기각하는 판결을 하여야 한다.", false, "▸ 특가법 제5조의9 제2항에 해당하는 행위에 대하여 형법 제283조 제3항(반의사불벌 규정)이 적용될 여지가 없다. [98도631]", "수사일반"],
["194", "★ 반의사불벌죄에 있어서 청소년인 피해자에게 비록 의사능력이 있다 하더라도 피고인에 대하여 처벌을 희망하지 않는다는 의사표시 또는 처벌을 희망하는 의사표시의 철회는 피해자가 단독으로 이를 할 수 없고 법정대리인의 동의가 있어야 한다.", false, "▸ 반의사불벌죄에서 처벌을 희망하지 않는다는 의사표시 또는 그 철회는 소송능력에 관한 일반원칙에 따라 의사능력이 있는 피해자가 단독으로 할 수 있고, 거기에 법정대리인의 동의가 있어야 한다거나 법정대리인에 의해 대리되어야만 한다고 볼 것은 아니다. [2009도6058]", "수사일반"],
["195", "★ 성년후견인의 법정대리권 범위에 통상적인 소송행위가 포함되어 있거나 성년후견 개시심판에서 정하는 바에 따라 성년후견인이 소송행위를 할 때 가정법원의 허가를 얻었다면, 성년후견인은 반의사불벌죄에서 명문의 규정이 없더라도 의사무능력자인 피해자를 대리하여 피고인 또는 피의자에 대하여 처벌을 희망하지 않는다는 의사를 결정하거나 처벌을 희망하는 의사표시를 철회하는 행위를 할 수 있다.", false, "▸ 반의사불벌죄의 처벌불원의사는 원칙적으로 대리가 허용되지 않는다. '성년후견인'은 명문의 규정이 없는 한 의사무능력자인 피해자를 대리하여 처벌을 희망하지 않는다는 의사를 결정하거나 처벌 희망 의사표시를 철회하는 행위를 할 수 없다. [2021도11126]", "수사일반"],
["196", "★ 폭행죄는 반의사불벌죄로서 피해자가 폭행과 무관한 사유로 사망한 경우 그 상속인이 피해자를 대신하여 처벌불원의 의사표시를 할 수 있다.", false, "▸ 피해자가 사망한 후 그 상속인이 피해자를 대신하여 처벌불원의 의사표시를 할 수는 없다. [2010도2680]", "수사일반"],
["197", "☆ 乙이 제1심에서 폭행죄로 벌금 100만 원을 선고받고 항소하였는데, 항소심 계속 중 피해자 甲이 乙에 대한 처벌의사를 철회하였다면, 항소심 법원은 乙에게 공소기각판결을 하여야 한다.", false, "▸ 반의사불벌죄 폭행죄의 처벌불원의사는 '제1심 판결 선고 전'까지 할 수 있다(제232조 제3항, 제1항). 항소심 계속 중의 처벌의사 철회는 효력이 없다.", "수사일반"],
["198", "☆ 제1심법원이 반의사불벌죄로 기소된 피고인에 대하여「소송촉진 등에 관한 특례법」제23조에 따라 피고인에 대한 송달불능보고서가 접수된 때부터 6개월이 지나도록 피고인의 소재를 확인할 수 없어 피고인의 진술 없이 유죄를 선고하여 판결이 확정된 경우, 만일 피고인이 항소권회복청구를 함으로써 항소심 재판을 받게 되었다면 피해자는 그 항소심 절차에서 처벌을 희망하는 의사표시를 철회할 수 없다.", true, "▸ 피고인이 재심이 아닌 항소권회복청구를 하여 항소심 재판을 받게 된 경우 항소심을 제1심이라고 할 수 없는 이상 항소심 절차에서는 처벌을 희망하는 의사표시를 철회할 수 없다. [2016도9470]", "수사일반"],
["199", "★ 피해자가 반의사불벌죄의 공범 중 그 1인에 대하여 처벌을 희망하는 의사를 철회한 경우, 다른 공범자에 대하여도 처벌희망의사가 철회된 것으로 볼 수 있다.", false, "▸ 반의사불벌죄에 고소와 고소취소의 불가분에 관한 제233조를 준용하는 규정을 두지 아니한 것은 친고죄와는 달리 공범자간에 불가분의 원칙을 적용하지 아니하고자 함에 있다. [93도1689]", "수사일반"],
["200", "☆ 불심검문하는 사람이 경찰관이고 검문하는 이유가 자신의 범죄행위에 관한 것임을 피고인이 충분히 알고 있었다고 보이더라도, 경찰관이 신분증을 제시하지 않았다면, 그 불심검문은 위법하다.", false, "▸ 검문하는 사람이 경찰관이고 검문하는 이유가 범죄행위에 관한 것임을 피고인이 충분히 알고 있었다고 보이는 경우에는 신분증을 제시하지 않았다고 하여 그 불심검문이 위법한 공무집행이라고 할 수 없다. [2014도7976, 경찰관 직무집행법 제3조 제4항]", "수사일반"],
["201", "경찰관직무집행법상 불심검문에 따른 임의동행은 정지시킨 장소에서 질문하는 것이 동행을 요구받은 사람에게 불리하거나 교통의 방해가 된다고 인정되는 때에 가능하다.", true, "▸ 경찰관은 정지시킨 장소에서 질문을 하는 것이 그 사람에게 불리하거나 교통에 방해가 된다고 인정될 때에는 질문을 하기 위하여 가까운 경찰서·지구대·파출소 또는 출장소로 동행할 것을 요구할 수 있다(경직법 제3조 제2항).", "수사일반"],
["202", "불심검문에 수반하여 흉기 소지 여부를 조사하는 것은 수색에 해당하므로 허용되지 않는다.", false, "▸ 경찰관은 불심검문 대상자에게 질문을 할 때에 그 사람이 흉기를 가지고 있는지를 조사할 수 있다(경직법 제3조 제3항).", "수사일반"],
["203", "적법한 불심검문이 되기 위해서는 불심검문 대상자에게 체포나 구속에 이를 정도의 혐의가 있어야 한다.", false, "▸ 불심검문 당시의 구체적 상황은 물론 사전에 얻은 정보나 전문적 지식 등에 기초하여 불심검문 대상자인지를 객관적·합리적인 기준에 따라 판단하여야 하나, 반드시 불심검문 대상자에게 형소법상 체포나 구속에 이를 정도의 혐의가 있을 것을 요한다고 할 수는 없다. [2011도13999]", "수사일반"],
["204", "경찰관은 범죄행위로 인하여 사람의 생명·신체에 위해를 끼치거나 재산에 중대한 손해를 끼칠 우려가 있는 긴급한 경우에는 그 행위를 제지할 수 있는데, 그 제지조치가 적법한지는 사후적으로 순수한 객관적 기준에서 판단하여야 한다.", false, "▸ 경찰관의 제지 조치가 적법한지는 제지 조치 당시의 구체적 상황을 기초로 판단하여야 하고, 사후적으로 순수한 객관적 기준에서 판단할 것은 아니다. [2016도19417]", "수사일반"],
["205", "피의자신문의 경우 피의자에게 출석의무는 없으므로 피의자는 출석을 거부할 수 있고, 일단 출석하여 신문 중에도 언제나 퇴거할 수 있다.", true, "▸ 피의자신문 절차는 어디까지나 법 제199조 제1항 본문, 제200조의 규정에 따른 임의수사의 한 방법으로 진행되어야 한다. [2013모160]", "수사일반"],
["206", "피의자신문조서는 피의자에게 열람하게 하거나 읽어 들려주어야 하며, 피의자가 이의를 제기하거나 의견을 진술한 때에는 이를 조서에 추가로 기재하여야 한다.", true, "▸ 피의자신문조서는 피의자에게 열람하게 하거나 읽어 들려주어야 하며, 진술한 대로 기재되지 아니하였거나 사실과 다른 부분의 유무를 물어 피의자가 이의를 제기하거나 의견을 진술한 때에는 이를 조서에 추가로 기재하여야 한다(제244조 제1항, 제2항).", "수사일반"],
["207", "참고인의 지위는 피의자의 그것과 달리 수사에 대한 협조자로서 당연히 진술을 거부할 수 있기 때문에 검사 또는 사법경찰관이 참고인으로부터 진술을 듣기 전에 참고인에게 진술거부권을 고지할 필요는 없으며, 참고인은 조사 중에도 아무런 제한 없이 조사장소로부터 자유롭게 퇴거할 수 있다.", true, "▸ 참고인 조사는 임의수사이므로 출석의무나 진술의무가 없다. 진술거부권 고지의 대상도 아니고, 언제든지 자유롭게 퇴거할 수 있다.", "수사일반"],
["208", "마약류 투약 혐의의 수사를 위한「형사소송법」제199조 제1항에 따른 임의동행의 경우에도, 동행한 사람을 6시간을 초과하여 경찰관서에 머물게 할 수 없다는「경찰관 직무집행법」제3조 제6항이 적용된다.", false, "▸ 마약류 투약 혐의에 대한 수사를 위한 임의동행은 형소법 제199조 제1항에 따른 임의동행에 해당하므로, 경찰관 직무집행법 제3조 제2항 및 제6항은 적용되지 않는다. [2020도398]", "수사일반"],
["209", "★ 甲은 백화점에서 A의 지갑을 절취하기 위해 A와 부딪치며 양복 상의 주머니에 손을 넣는 순간 발각되어 도주하다가 곧바로 뒤쫓아 온 보안요원 X에게 붙잡혔다. 甲은 X로부터 그 경위를 확인받던 중 체포된 상태를 벗어나기 위해 X의 얼굴을 주먹으로 수차례 때려 전치 4주의 상해를 입히고 도주하였다. 사건이 발생한 지 1시간이 지난 후 X의 신고를 받고 출동한 사법경찰관 P가 인근 버스 정류장에 서있던 甲에게 임의동행을 요청하자, 甲은 영장의 제시를 요구하면서 동행을 거부하였다. 그럼에도 P가 甲을 순찰차에 강제로 태워 파출소로 연행하려 하자 甲은 이를 벗어날 목적으로 P의 복부를 발로 차 전치 2주의 상해를 입혔다. P의 甲에 대한 체포는 적법한 현행범인의 체포라고 볼 수 없다.", true, "▸ 사건 발생 후 1시간이 지난 상황에서 임의동행을 요청하면서 거부하는 甲을 강제로 순찰차에 태워 연행하려 한 것은 적법한 현행범인의 체포가 아니다. [2005도6810]", "수사일반"],
["210", "☆ 위 사례에서 사법경찰관 P가 사후적으로 피의사실의 요지, 체포이유 등을 甲에게 고지하는 등 절차를 밟아 甲을 긴급체포하였고 하더라도 긴급체포는 위법하다.", true, "▸ 사법경찰관이 불법체포로부터 6시간 상당이 경과한 이후에 비로소 피고인에 대하여 긴급체포의 절차를 밟았다고 하더라도 이는 동행의 형식 아래 행해진 불법 체포에 기하여 사후적으로 취해진 것에 불과하므로, 그와 같은 긴급체포 또한 위법하다고 아니할 수 없다. [2005도6810]", "수사일반"],
["211", "☆ 위 사례에서 만약 사법경찰관 P가 사후적으로 피의사실의 요지, 체포이유 등을 甲에게 고지하는 등 절차를 밟아 甲을 긴급체포하였는데, 만일 P가 잠간 경찰서 내의 다른 사무실에 간 사이 甲이 도주하였다면 도주죄로 처벌된다.", false, "▸ 피고인은 불법체포된 자로서 형법 제145조 제1항 소정의 '법률에 의하여 체포 또는 구금된 자'가 아니어서 도주죄의 주체가 될 수 없다. [2005도6810]", "수사일반"],
["212", "★ 피의자가 죄를 범하였다고 의심할 만한 상당한 이유가 있고 정당한 이유없이 출석요구에 응하지 아니하거나 아니할 우려가 있는 때라고 하더라도 명백히 체포의 필요가 인정되지 아니하는 경우에는 지방법원판사는 체포영장청구를 기각하여야 한다.", true, "▸ 체포영장의 청구를 받은 판사는 체포의 사유가 있다고 인정되는 경우에도 피의자의 연령과 경력, 가족관계나 교우관계, 범죄의 경중 및 태양 기타 제반 사정에 비추어 피의자가 도망할 염려가 없고 증거를 인멸할 염려가 없는 등 명백히 체포의 필요가 없다고 인정되는 때에는 체포영장의 청구를 기각하여야 한다(규칙 제96조의2).", "체포구속"],
["213", "체포영장을 집행함에 있어서는 원본을 제시하여야 하므로, 사법경찰관 A가 체포영장을 소지하지 아니하여 영장 원본을 제시할 수 없는 경우에는 급속을 요하는 경우라도 영장을 집행할 수 없다.", false, "▸ 체포영장을 소지하지 아니한 경우에 급속을 요하는 때에는 피고인에 대하여 공소사실의 요지와 영장이 발부되었음을 고하고 집행할 수 있다. 집행을 완료한 후에는 신속히 체포영장을 제시하고 그 사본을 교부하여야 한다(제200조의6, 제85조 제3항).", "체포구속"],
["214", "★ 사법경찰관 A가 체포영장의 제시 및 미란다원칙을 고지하려고 할 때, 만약 체포영장이 발부된 甲이 흉기를 꺼내 폭력으로 대항하여 甲을 실력으로 제압할 수밖에 없는 경우에는 A가 甲을 제압하고 지체 없이 체포영장을 제시하면서 미란다원칙을 고지할 수 있다.", true, "▸ 체포영장의 제시나 고지 등은 체포를 위한 실력행사에 들어가기 이전에 미리 하는 것이 원칙이다. 폭력으로 대항하는 피의자를 실력으로 제압하는 경우에는 제압하는 과정에서 하거나, 여의치 않은 경우에는 일단 제압한 후에 지체 없이 하여야 한다. [2017도10866]", "체포구속"],
["215", "사법경찰관들은 적법하게 甲에 대한 체포영장을 발부받아 다음 날 함께 甲의 주거지 앞에서 甲을 기다리다가 甲을 체포하였다. 그러나 사법경찰관들은 체포 당시 甲에 대한 체포영장을 소지하지는 않았다. 사법경찰관들이 甲의 주거지 앞에서 甲을 기다리다가 체포한 것은 체포영장의 제시 없이 체포할 수 있는 급속을 요하는 때에 해당하므로, 위법한 체포에 해당하지 않는다.", false, "▸ 경찰관이 체포영장이 발부된 다음 날 이를 집행하기 위하여 피고인의 주거지 앞에서 피고인을 기다리다가 체포한 것을 두고 체포영장을 소지할 여유가 없이 피의자를 조우한 경우 등의 급속을 요하는 때에 해당한다고 볼 수는 없다. [2022도10564]", "체포구속"],
["216", "★ 체포영장에 의하여 체포한 피의자를 구속하고자 할 때에는 검사는 체포한 때로부터 48시간 이내에 관할지방법원판사로부터 구속영장을 발부받아야 한다.", false, "▸ 체포영장에 의하여 체포한 피의자를 구속하고자 할 때에는 체포한 때로부터 48시간 이내에 구속영장을 '청구'하여야 한다(제200조의2 제5항). 발부가 아닌 청구이다.", "체포구속"],
["217", "☆ 체포한 피의자를 구속하고자 할 때에는 체포한 때로부터 48시간 이내에 구속영장을 청구하여야 하고, 그 기간 내에 구속영장을 청구하지 아니하는 때에는 즉시 피의자를 석방하여야 한다.", true, "▸ 체포영장에 의한 체포(제200조의2 제5항), 현행범인 체포(제213조의2, 제200조의2 제5항), 긴급체포(제200조의4 제1항, 제2항) 모두 체포한 때로부터 48시간 이내에 구속영장을 청구해야 하고, 미청구 시 즉시 석방해야 한다.", "체포구속"],
["218", "사법경찰관 甲은 정보통신망이용촉진및정보보호등에관한법률위반(음란물유포)의 범죄 혐의를 이유로 발부받은 압수·수색영장에 기하여 피의자 A의 주거지를 수색하는 과정에서 대마가 발견되자, A를 체포하지 않으면 도망하거나 증거를 인멸할 염려가 있어 A를 대마소지로 인한 마약류관리에관한법률위반(대마)죄의 현행범인으로 체포하였다면, 甲이 A를 체포영장 없이 체포한 행위는 적법하다.", true, "▸ 현행범인은 누구든지 영장없이 체포할 수 있다(제212조). 대마는 소지 자체가 범죄이므로 현행범인에 해당한다.", "체포구속"],
["219", "☆ 현행범인으로 규정된 '범죄의 실행의 직후인 자'라고 함은 범죄의 실행행위를 종료한 직후의 범인이라는 것이 체포를 당하는 자의 입장에서 볼 때 명백한 경우를 일컫는 것이다.", false, "▸ 제211조의 '실행하고 난 직후의 사람'이라고 함은, 범죄의 실행행위를 종료한 직후의 범인이라는 것이 '체포하는 자의 입장'에서 볼 때 명백한 경우를 말한다. '체포를 당하는 자의 입장'이 아니다. [2007도1249]", "체포구속"],
["220", "☆ 시간적으로나 장소적으로 보아 체포를 당하는 자가 방금 범죄를 실행한 범인이라는 점에 관한 죄증이 명백히 존재하는 것으로 인정되는 경우에만 '범죄의 실행의 즉후인 자'에 해당하는 현행범인으로 볼 수 있다.", true, "▸ '범죄의 실행행위를 종료한 직후'란 범죄행위를 끝마친 순간 또는 이에 아주 접착된 시간적 단계를 의미하므로, 시간적·장소적으로 보아 체포를 당하는 자가 방금 범죄를 실행한 범인이라는 점에 관한 죄증이 명백히 존재하는 것으로 인정되는 경우에만 현행범인으로 볼 수 있다. [2007도1249]", "체포구속"],
["221", "☆ 신고를 받고 출동한 경찰관이 피의자가 음주운전을 종료한 후 40분 이상이 경과한 시점에서 길가에 앉아 있던 피의자에게서 술 냄새가 난다는 점만을 근거로 피의자를 음주운전의 현행범으로 체포한 것은 위법하다.", true, "▸ 음주운전을 종료한 후 40분 이상이 경과한 시점에서 길가에 앉아 있던 운전자를 술 냄새가 난다는 점만을 근거로 음주운전의 현행범으로 체포한 것은 적법한 공무집행으로 볼 수 없다. [2007도1249]", "체포구속"],
["222", "★ 순찰 중인 사법경찰관 P가 교통사고를 낸 차량이 도주하였다는 무전연락을 받고 주변을 수색하다가 사고시점으로부터 약 10분 후 사고지점과 약 1km 떨어진 도로변에서 범퍼 등의 파손상태로 보아 사고차량으로 인정되는 차량에서 내리는 甲을 발견한 경우 범죄에 사용되었다고 인정함에 충분한 물건을 소지하고 있는 때에 해당하므로, P는 甲을 준현행범인으로서 영장 없이 체포할 수 있다.", true, "▸ 형소법 제211조 제2항 제2호 소정의 '장물이나 범죄에 사용되었다고 인정함에 충분한 흉기 기타의 물건을 소지하고 있는 때'에 해당하므로 준현행범인으로서 영장 없이 체포할 수 있다. [99도4341]", "체포구속"],
["223", "★ 사법경찰관 P가 甲을 영장 없이 현행범으로 체포하기 위해서는 甲에게 도망 또는 증거인멸의 염려가 있어야 하고, 만약 체포 당시 상황을 기초로 판단하였을 때에 이러한 요건을 갖추지 못하였다면 그러한 체포는 위법한 체포에 해당한다.", true, "▸ 현행범인으로 체포하기 위하여는 행위의 가벌성, 범죄의 현행성·시간적 접착성, 범인·범죄의 명백성 이외에 체포의 필요성 즉, 도망 또는 증거인멸의 염려가 있어야 하고, 이러한 요건을 갖추지 못한 현행범인 체포는 위법한 체포에 해당한다. [2011도3682]", "체포구속"],
["224", "검사 또는 사법경찰관은 피의자를 체포하는 경우에는 피의사실의 요지, 체포의 이유와 변호인을 선임할 수 있음을 말하고 변명할 기회를 주어야 한다.", true, "▸ 검사 또는 사법경찰관은 피의자를 체포하는 경우에는 피의사실의 요지, 체포의 이유와 변호인을 선임할 수 있음을 말하고 변명할 기회를 주어야 한다(제200조의5).", "체포구속"],
["225", "★ 사법경찰관이 현행범인을 체포하는 경우에는 반드시 피의사실의 요지, 체포의 이유와 변호인을 선임할 수 있음을 말하고 변명할 기회를 주어야 하며, 이와 같은 고지는 원칙적으로 체포를 위한 실력행사에 들어가기 전에 미리 하여야 하는데, 이는 긴급체포의 경우에도 마찬가지이다.", true, "▸ 검사 또는 사법경찰관리가 현행범인을 체포하거나 인도받은 경우에는 미란다원칙을 고지해야 한다(제213조의2, 제200조의5). 고지는 실력행사 전에 미리 하는 것이 원칙이고, 달아나거나 폭력으로 대항하는 경우 제압 후 지체 없이 하면 된다. 긴급체포의 경우에도 동일하다. [2011도7193, 2008도11226]", "체포구속"],
["226", "☆ 甲은 경찰관 A로부터 불심검문을 받고 운전면허증을 교부하였는데 A가 이를 곧바로 돌려주지 않고 신분조회를 위해 순찰차로 가는 것을 보자 화가 나 인근 주민 여러 명이 있는 가운데 A에게 큰 소리로 욕설을 하였다. 이에 A는「형사소송법」제200조의5에 따라 피의사실의 요지, 체포의 이유, 변호인선임권 등을 고지한 후 甲을 모욕죄의 현행범으로 체포하였다. A가 甲을 체포할 당시 甲은 모욕 범행을 실행 중이거나 실행행위를 종료한 즉후인 자에 해당하므로 현행범인이다.", true, "▸ 甲은 모욕 범행을 실행 중이거나 실행행위를 종료한 즉후인 자에 해당하여 현행범인에는 해당한다. 그러나 체포 필요성이 충족되지 않아 체포는 위법하다. [2011도3682]", "체포구속"],
["227", "☆ 위 사례에서 甲에 대한 체포는 현행범인 체포의 요건을 갖추지 못하여 위법한 체포에 해당한다.", true, "▸ 피고인이 도망하거나 증거를 인멸할 염려가 있다고 보기 어렵고, 모욕 범행은 불심검문에 항의하는 과정에서 저지른 일시적·우발적 행위로서 경미하며, 피해자인 경찰관이 범행현장에서 즉시 범인을 체포할 급박한 사정이 있다고 보기도 어려우므로, 체포는 위법하다. [2011도3682]", "체포구속"],
["228", "☆ 위 사례에서 만약 경찰관 A가 甲을 모욕죄의 현행범으로 체포하려 하자 甲이 이에 반항하는 과정에서 A에게 상해를 가하여, 검사가 甲을 공무집행방해죄와 상해죄로 기소하였다면, 법원은 甲의 행위가 위법한 공무집행에 대한 항의과정에서 발생한 것이므로 두 죄 모두 정당방위를 이유로 무죄를 선고하여야 한다.", false, "▸ 공무집행방해죄는 구성요건해당성이 없고, 상해죄는 정당방위로 위법성이 조각된다. '두 죄 모두 정당방위를 이유로'라는 표현이 잘못되었다. [2011도3682]", "체포구속"],
["229", "교통안전과 위험방지를 위한 필요가 없음에도 주취운전을 하였다고 인정할 만한 상당한 이유가 있다는 이유만으로 이루어지는 음주측정은 이미 행하여진 주취운전이라는 범죄행위에 대한 증거 수집을 위한 수사절차로서의 의미를 가지는 것이므로, 수사상의 강제처분에 관한「형사소송법」상의 절차에 따라야 하고, 이러한 절차를 무시한 채 이루어진 강제연행은 위법한 체포에 해당한다.", true, "▸ [AI해설] 교통안전을 위한 필요 없이 수사 목적으로 이루어지는 음주측정은 수사상 강제처분에 해당하므로 형소법상 절차를 따라야 하고, 이를 무시한 강제연행은 위법한 체포이다. [2004도8404]", "체포구속"],
["230", "사법경찰관이 현행범인을 체포한 후 구속영장을 신청하지 아니하고 석방한 경우에는 즉시 검사에게 보고하여야 하고, 검사는 석방일로부터 30일 이내에 일정한 사항을 법원에 통지하여야 한다.", false, "▸ 현행범인 체포에는 긴급체포에 관한 제200조의4 제4항 및 제6항을 준용하는 규정이 없다. 따라서 이 경우에도 사법경찰관은 검사에게 보고할 의무가 없고, 검사도 법원에 통지할 의무가 없다.", "체포구속"],
["231", "현행범체포에 있어서 체포의 목적을 달성하기 위하여 필요한 범위 내에서 사인이라도 강제력을 행사할 수 있다.", true, "▸ 현행범인은 누구든지 영장 없이 체포할 수 있으므로 사인의 현행범인 체포는 법령에 의한 행위로서 위법성이 조각된다. 적정한 한계를 벗어나는 행위인가 여부는 정당행위의 일반적 요건을 갖추었는지 여부에 따라 결정된다. [98도3029]", "체포구속"],
["232", "외국인 해적들인 甲, 乙, 丙, 丁은 선박을 강취하여 선원들을 인질로 삼아 석방대가를 요구하자, 해군은 甲 등을 총격 종료 직후 현장에서 체포하여 비행기로 부산 김해공항으로 이송하였고, 공항에서 사법경찰관에게 신병을 인도하였다. 해군이 甲 등을 체포한 것은 수사기관이 아닌 이에 의한 현행범인 체포이다.", true, "▸ 청해부대 소속 군인들이 피고인들을 현행범인으로 체포한 것은 검사 등이 아닌 이에 의한 현행범인 체포에 해당한다. [2011도12927]", "체포구속"],
["233", "검사 또는 사법경찰관리 아닌 자가 현행범인을 체포한 때에는 즉시 검사 등에게 인도하여야 하는데, 여기서 '즉시'라고 함은 반드시 체포시점과 시간적으로 밀착된 시점이어야 하는 것은 아니고, '정당한 이유 없이 인도를 지연하거나 체포를 계속하는 등으로 불필요한 지체를 함이 없이'라는 뜻이다.", true, "▸ 사인이 현행범인을 체포한 때에는 즉시 검사 등에게 인도하여야 한다(제213조 제1항). 여기서 '즉시'란 불필요한 지체 없이의 의미이다. [2011도12927]", "체포구속"],
["234", "★ 수사기관이 아닌 甲이 현행범 A를 체포할 때 피의사실의 요지, 체포의 이유와 변호인을 선임할 수 있음을 말하고 변명할 기회를 주어야 할 의무는 없고, A를 인도받은 사법경찰관이 인도받을 때 위 절차를 밟으면 된다.", true, "▸ 검사 또는 사법경찰관리가 현행범인을 '체포'하거나 현행범인을 '인도받은 경우'에는 피의사실의 요지, 체포의 이유와 변호인을 선임할 수 있음을 말하고 변명할 기회를 주어야 한다(제213조의2, 제200조의5).", "체포구속"],
["235", "★ 검사 또는 사법경찰관리가 아닌 이에 의하여 현행범인이 체포된 후 불필요한 지체 없이 검사 등에게 인도된 경우 체포 후 구속영장 청구시한인 48시간의 기산점은 체포시가 아니라 검사 등이 현행범인을 인도받은 때이다.", true, "▸ 검사 등이 아닌 이에 의하여 현행범인이 체포된 후 불필요한 지체 없이 검사 등에게 인도된 경우 위 48시간의 기산점은 체포시가 아니라 검사 등이 현행범인을 인도받은 때이다. [2011도12927]", "체포구속"],
["236", "★ 甲은 주간에 A의 집에 들어가 자전거 1대를 절취하여 가던 중 귀가하던 A에게 2024. 9. 1. 15:00에 체포되었다. 사법경찰관 P는 같은 날 15:30 甲을 지체 없이 인수받았다. 그 후 P는 검사 S에게 구속영장을 신청하였고, S는 법원에 2024. 9. 3. 15:15 영장을 청구하였다. S의 구속영장청구는 현행범이 체포된 때로부터 48시간이 경과한 시점에 이루어진 것으로 법원은 이를 기각하여야 한다.", false, "▸ 기산점은 P가 인도받은 때인 2024.9.1. 15:30이다. 48시간 후는 2024.9.3. 15:30이므로, S가 2024.9.3. 15:15에 청구한 것은 48시간 이내의 적법한 청구이다. 기각사유가 없다. [2011도12927]", "체포구속"],
["237", "사법경찰관 A가 피의자 甲을 절도 혐의로 긴급체포한 후 조사하였으나, 甲의 혐의를 입증할 증거가 부족하다고 판단하여 석방한 경우, A는 甲의 위 절도 범행과 다른 별개의 범죄인 모욕죄 혐의에 관하여는 甲을 긴급체포할 수 없다.", true, "▸ 긴급체포는 법정형이 사형·무기 또는 장기 3년 이상의 징역이나 금고에 해당하는 죄에 대하여만 할 수 있다(제200조의3 제1항). 모욕죄는 1년 이하의 징역이나 금고 또는 200만원 이하의 벌금에 처하는 범죄이므로 긴급체포가 불가능하다.", "체포구속"],
["238", "★ 긴급체포가 요건을 갖추었는지 여부는 사후에 밝혀진 사정을 기초로 판단하여야 하고, 이에 관한 수사주체의 판단에는 상당한 재량의 여지가 있다.", false, "▸ 긴급체포의 요건 충족 여부는 사후에 밝혀진 사정이 아니라 체포 당시의 상황을 기초로 판단하여야 한다. 수사주체의 판단에는 상당한 재량의 여지가 있으나, 경험칙에 비추어 현저히 합리성을 잃은 경우에는 위법한 체포이다. [2000도5701]", "체포구속"],
["239", "☆ A가 필로폰을 투약한다는 제보를 받은 경찰관이 A의 주거지를 방문하였다가, 그곳에서 A를 발견하고 A의 전화번호로 전화를 하여 나오라고 하였으나 응하지 않자 A의 집 문을 강제로 열고 들어가 긴급체포한 경우, 피고인이 마약에 관한 죄를 범하였다고 의심할 만한 상당한 이유가 있었다면, 경찰관이 A의 신원과 주거지 및 전화번호 등을 모두 파악하고 있었고, 당시 마약 투약의 범죄 증거가 급속하게 소멸될 상황도 아니었다고 하더라도, 적법한 체포에 해당한다.", false, "▸ 경찰관이 이미 피고인의 신원과 주거지 및 전화번호 등을 모두 파악하고 있었고, 당시 마약 투약의 범죄 증거가 급속하게 소멸될 상황도 아니었던 점 등의 사정을 감안하면, 미리 체포영장을 받을 시간적 여유가 없었던 경우에 해당하지 않아 긴급체포는 위법하다. [2016도5814]", "체포구속"],
["240", "☆ 수사기관에 자진출석한 참고인에 대한 긴급체포는 언제나 위법하다.", false, "▸ 수사기관에 자진출석한 사람을 긴급체포할 수 있는지에 대하여, 판례는 '언제나 위법'이 아니라 긴급체포 요건을 충족하였는지에 따라 판단하고 있다. [2006도148]", "체포구속"],
["241", "☆ 검사가 참고인조사를 받는 줄 알고 검찰청에 자진출석한 변호사 사무실 사무장을 긴급체포의 요건을 갖추지 못하였음에도 긴급체포하자 변호사가 이를 제지하는 과정에서 검사에게 상해를 가한 경우, 공무집행방해죄가 성립하지 않는다.", true, "▸ 검사나 사법경찰관이 수사기관에 자진출석한 사람을 긴급체포의 요건을 갖추지 못하였음에도 실력으로 체포하려고 하였다면 적법한 공무집행이라고 할 수 없다. 그 변호사가 이를 제지하는 과정에서 검사에게 상해를 가한 것은 정당방위에 해당한다. [2006도148]", "체포구속"],
["242", "도로교통법위반사건에서 기소유예 처분을 받은 甲이 그 후 이 사건에 대해 진정서를 검찰청에 제출함으로써 이루어진 진정사건을 담당한 검사가, 甲에 대한 위 피의사건을 재기한 후 담당검사인 자신의 교체를 요구하고자 부장검사 부속실에서 대기하고 있던 甲을 도로교통법위반죄로 긴급체포하였다면, 이러한 체포는 위법하다.", true, "▸ 수사기관 청사에서 민원 목적으로 대기 중인 사람에 대한 긴급체포는 긴급체포 요건을 충족하지 못한 위법한 체포이다. [2002모81]", "체포구속"],
["243", "A에 대한 사기혐의에 대한 고소사건을 담당하던 경찰관이 A가 회사에도 출근하지 않고 거주지에도 귀가하지 않는 등 소재를 감추자 법원의 압수수색영장에 의한 휴대전화 위치추적 등의 방법으로 A의 소재를 파악하려고 하던 중, 주거지로 귀가하던 A를 발견하고 긴급체포하였다면, 이러한 체포는 적법하다.", true, "▸ [AI해설] 피의자가 소재를 감추며 도주 중인 상황에서 우연히 발견하여 긴급체포한 경우, 미리 체포영장을 받을 시간적 여유가 없었던 경우에 해당하여 적법하다. [2005도7569]", "체포구속"],
["244", "검사가 검사실에서 긴급체포하는 경우에는 피의사실의 요지, 체포이유 등을 고지할 필요가 없다.", false, "▸ 검사 또는 사법경찰관은 피의자를 체포하는 경우에는 피의사실의 요지, 체포의 이유와 변호인을 선임할 수 있음을 말하고 변명할 기회를 주어야 한다(제200조의5). 예외 없이 적용된다.", "체포구속"],
["245", "☆ 사법경찰관이 피의자를 긴급체포하기 위하여 달아나는 피의자를 쫓아가 붙들거나 폭력으로 대항하는 피의자를 실력으로 제압하는 경우에도, 피의사실의 요지, 체포의 이유와 변호인을 선임할 수 있음을 반드시 긴급체포를 위한 실력행사에 들어가기 이전에 미리 고지하여야 한다.", false, "▸ 고지는 긴급체포를 위한 실력행사에 들어가기 이전에 미리 하여야 하는 것이 원칙이나, 달아나는 피의자를 쫓아가 붙들거나 폭력으로 대항하는 피의자를 실력으로 제압하는 경우에는 붙들거나 제압하는 과정에서 하거나, 그것이 여의치 않은 경우에는 일단 붙들거나 제압한 후에 지체없이 하여야 한다. [2008도2794]", "체포구속"],
["246", "검사가 긴급체포한 경우 긴급체포서를 작성할 필요가 없다.", false, "▸ 검사 또는 사법경찰관은 피의자를 긴급체포한 경우에는 즉시 긴급체포서를 작성하여야 한다(제200조의3 제3항).", "체포구속"],
["247", "사법경찰관 A가 피의자 甲을 절도 혐의로 긴급체포한 후 조사하였으나, 甲의 혐의를 입증할 증거가 부족하다고 판단하여 석방한 경우, 그 후 A가 甲의 위 절도 범행과 다른 별개의 범죄인 강간치상 혐의에 관하여 甲을 긴급체포한 경우에는 즉시 검사의 승인을 얻어야 한다.", true, "▸ 사법경찰관이 피의자를 긴급체포한 경우에는 즉시 검사의 승인을 얻어야 한다(제200조의3 제2항). 강간치상죄는 긴급체포 대상 범죄이다.", "체포구속"],
["248", "검사는 긴급체포한 피의자에 대하여 구속영장을 청구하지 아니하고 석방한 경우에는 즉시 긴급체포서의 사본 등을 첨부하여 법원에 통지하고 사후승인을 얻어야 한다.", false, "▸ 석방한 날부터 '30일' 이내에 서면으로 긴급체포서의 사본 등을 첨부하여 법원에 '통지'하여야 하지만, 법원으로부터 사후승인을 얻어야 하는 것은 아니다(제200조의4 제4항).", "체포구속"],
["249", "★ 피의자가 긴급체포되어 조사를 받고 구속영장이 청구되지 않아 석방된 경우 긴급체포 당시의 상황과 경위, 긴급체포 후 조사 과정 등에 특별한 위법이 있다고 볼 수 없더라도 사후에 석방통지가 법에 따라 이루어지지 않았다면 긴급체포에 의한 유치 중에 작성된 피의자신문조서의 증거능력은 부정된다.", false, "▸ 긴급체포 후 조사 과정 등에 위법이 있다고 볼 수 없는 이상, 단지 사후에 석방통지가 법에 따라 이루어지지 않았다는 사정만으로 긴급체포에 의한 유치 중에 작성된 피의자신문조서들의 작성이 소급하여 위법하게 된다고 볼 수 없다. [2011도6035]", "체포구속"],
["250", "검사가 긴급체포한 피의자를 구속하기 위하여 관할지방법원판사에게 구속영장을 청구하였으나 구속영장을 발부받지 못한 때에는 피의자를 즉시 석방하여야 한다.", true, "▸ 구속영장을 청구하지 아니하거나 발부받지 못한 때에는 피의자를 즉시 석방하여야 한다(제200조의4 제2항).", "체포구속"],
["251", "검사의 구속영장 청구 전 피의자 대면조사는 긴급체포의 합당성이나 구속영장 청구에 필요한 사유를 보강하기 위한 목적으로도 할 수 있다.", false, "▸ 검사의 구속영장 청구 전 피의자 대면조사는 긴급체포의 적법성을 의심할 만한 사유가 기록 기타 객관적 자료에 나타나는 예외적인 경우에 한하여 허용될 뿐, 긴급체포의 합당성이나 구속영장 청구에 필요한 사유를 보강하기 위한 목적으로 실시되어서는 아니 된다. [2008도11999]", "체포구속"],
["252", "☆ 위법한 긴급체포에 의한 유치 중에 검사가 작성한 피의자신문조서는 위법하게 수집된 증거로서 특별한 사정이 없는 한 유죄의 증거로 할 수 없다.", true, "▸ 긴급체포의 위법은 영장주의에 위배되는 중대한 것이니 그 체포에 의한 유치 중에 작성된 피의자신문조서는 위법하게 수집된 증거로서 특별한 사정이 없는 한 이를 유죄의 증거로 할 수 없다. [2000도5701]", "체포구속"],
["253", "수사기관이 피의사건과 관련하여 발부받은 구속영장은 명령장이므로 구속영장을 발부받은 후에는 피의자를 구속하지 않거나 구속한 피의자를 석방할 수는 없다.", false, "▸ 법원이 직권으로 발부하는 구속영장은 명령장이고, 수사기관의 청구에 의하여 발부하는 구속영장은 허가장이다(96헌바28). 허가장이므로 반드시 구속해야 하는 것은 아니다.", "체포구속"],
["254", "형사재판 과정에서 범죄사실의 존재를 증명함에 충분한 증거가 없다는 이유로 무죄판결이 확정되었다고 하더라도 그러한 사정만으로 바로 검사의 구속 및 공소제기가 위법하다고 할 수 없고, 검사의 판단이 그 당시의 자료에 비추어 경험칙이나 논리칙상 도저히 합리성을 긍정할 수 없는 정도에 이른 경우에만 위법성을 인정할 수 있다.", true, "▸ [AI해설] 무죄판결 확정만으로 검사의 구속 및 공소제기가 위법하다고 할 수 없고, 당시 자료에 비추어 도저히 합리성을 긍정할 수 없는 정도에 이른 경우에만 위법성을 인정할 수 있다. [2001다23447]", "체포구속"],
["255", "「형사소송법」제70조 제2항에 규정되어 있는 법죄의 중대성, 재범의 위험성, 피해자 및 중요 참고인 등에 대한 위해우려는 독립적인 구속사유이다.", false, "▸ 제70조 제2항은 새로운 '구속사유'를 신설하거나 추가한 것이 아니라, 이러한 '구속사유를 심사할 때 고려해야 할 사항'을 명시한 것이다. [2009헌바8]", "체포구속"],
["256", "☆ 구속영장을 청구받은 지방법원판사는 체포된 피의자에 대하여 지체 없이 피의자를 심문해야 하나, 체포되지 않은 피의자에 대하여는 직권으로 심문여부를 결정한다.", false, "▸ 체포된 피의자에 대하여 지체 없이 심문하여야 한다(제201조의2 제1항). 미체포 피의자에 대해서도 구인한 후 심문하여야 한다. 다만, 피의자가 도망하는 등의 사유로 심문할 수 없는 경우에는 그러하지 아니하다(동조 제2항).", "체포구속"],
["257", "★ 검사가 甲에 대해 구속영장을 청구한 경우 구속영장을 청구받은 판사는 甲을 심문하여야 하고, 심문할 甲에게 변호인이 없는 경우에는 필요적 변호사건이 아니기 때문에 지방법원판사는 甲의 청구가 있는 경우에 한해 변호인을 선정할 수 있다.", false, "▸ 심문할 피의자에게 변호인이 없는 때에는 지방법원판사는 직권으로 변호인을 선정하여야 한다. 필요적 변호사건 여부와 무관하고, 甲의 청구 없이도 직권으로 선정한다(제201조의2 제8항).", "체포구속"],
["258", "★ 구속 전 피의자심문을 받을 甲에게 변호인이 없는 때에는 판사는 직권으로 변호인을 선정하여야 하고, 이 경우 甲에 대한 구속영장 청구가 기각되더라도 변호인의 선정은 제1심까지 효력이 있다.", false, "▸ 심문할 피의자에게 변호인이 없는 때에는 지방법원판사는 직권으로 변호인을 선정하여야 한다. 그러나 피의자에 대한 구속영장 청구가 기각되어 효력이 소멸한 경우를 제외하고는 제1심까지 효력이 있다(제201조의2 제8항). 기각되면 변호인 선정의 효력이 소멸된다.", "체포구속"],
["259", "체포된 피의자에 대한 구속영장을 청구 받은 판사는 피의자가 죄를 범하였다고 의심할 만한 이유가 있는 경우에 구인영장을 발부하여 피의자를 구인한 후 심문하여야 한다.", false, "▸ 체포된 피의자의 경우 체포영장의 효력으로 구인하면 되고, 별도로 구인영장을 발부받을 필요가 없다(제201조의2 제1항).", "체포구속"],
["260", "체포되지 않은 피의자에 대한 구속영장을 청구 받은 판사는 피의자가 죄를 범하였다고 의심할 만한 이유가 있는 경우에 구인영장을 발부하여 피의자를 구인한 후 심문하여야 한다.", true, "▸ 체포되지 않은 피의자에 대하여 구속영장 청구를 받은 판사는 죄를 범하였다고 의심할 만한 이유가 있는 경우에 구인영장을 발부하여 피의자를 구인한 후 심문하여야 한다(제201조의2 제2항).", "체포구속"],
["261", "검사가 사법경찰관이 신청한 영장을 정당한 이유 없이 판사에게 청구하지 아니한 경우 사법경찰관이 관할 고등검찰청에 영장청구 여부에 대한 심의를 신청하기 위해서는「검찰청법」에 따른 항고를 거쳐야 한다.", false, "▸ 검사가 영장을 정당한 이유 없이 청구하지 아니한 경우 사법경찰관은 그 검사 소속의 지방검찰청 소재지를 관할하는 고등검찰청에 영장청구 여부에 대한 심의를 신청할 수 있다(제221조의5 제1항). 검찰청법 항고는 불필요하다.", "체포구속"],
["262", "성폭력범죄의 피해자가 형사절차상 입을 수 있는 피해를 방어하고 법률적 조력을 보장하기 위하여 선임한 변호사는 피의자에 대한 구속 전 피의자심문절차에 출석하여 의견을 진술할 수 없다.", false, "▸ 성폭력범죄 피해자의 변호사는 피의자에 대한 구속 전 피의자심문, 증거보전절차, 공판준비기일 및 공판절차에 출석하여 의견을 진술할 수 있다(성폭법 제27조 제3항).", "체포구속"],
["263", "★ 지방법원판사가 구속영장청구를 기각한 경우에는 검사는 구속영장을 재청구하거나 항고나 준항고를 통해 불복할 수 있다.", false, "▸ 체포영장 또는 구속영장 청구에 대한 지방법원판사의 재판은 항고의 대상인 '법원의 결정'에도, 준항고의 대상인 '재판장 또는 수명법관의 구금 등에 관한 재판'에도 해당하지 아니한다. 검사는 재청구는 가능하나 항고·준항고는 불가하다. [2006모646]", "체포구속"],
["264", "☆ 검사가 구속영장의 청구를 함에 있어서 동일한 범죄사실에 관하여 그 피의자에 대하여 전에 구속영장을 청구하거나 발부받은 사실이 있을 때에는 다시 구속영장을 청구하는 취지 및 이유를 기재하여야 한다.", true, "▸ 동일한 범죄사실에 관하여 그 피의자에 대하여 전에 구속영장을 청구하거나 발부받은 사실이 있을 때에는 다시 구속영장을 청구하는 취지 및 이유를 기재하여야 한다(제201조 제5항). [검사의 영장 재청구가 가능하다는 것을 전제]", "체포구속"],
["265", "「형사소송법」제205조 제1항 소정의 구속기간의 연장을 허가하지 아니하는 지방법원 판사의 결정에 대하여는 항고할 수 없으나 준항고는 가능하다.", false, "▸ 제205조 제1항 소정의 구속기간의 연장을 허가하지 아니하는 지방법원 판사의 결정에 대하여는 항고의 방법으로는 불복할 수 없고, 그 지방법원 판사는 수소법원으로서의 재판장 또는 수명법관도 아니므로 준항고의 대상도 되지 않는다. [97모1]", "체포구속"],
["266", "★ 구속영장에 의하여 구속된 피의자 甲은 검사로부터의 피의자신문을 위한 출석요구를 받았음에도 이에 응하지 않고 있다. 검사는 甲을 검사실로 구인하기 위하여 지방법원 판사로부터 별개의 구인을 위한 영장을 발부받아야 한다.", false, "▸ 구금된 피의자가 수사기관 조사실에 출석을 거부한다면 수사기관은 그 구속영장의 효력에 의하여 피의자를 조사실로 구인할 수 있다. 별개 구인영장은 불필요하다. [2013모160]", "체포구속"],
["267", "☆ 피의자에 대한 구속영장의 집행이 그 발부 시로부터 정당한 사유 없이 시간이 지체되어 이루어졌다고 하더라도, 구속영장이 그 유효기간 내에 집행되었다면 정당한 사유 없이 지체된 기간 동안의 체포 내지 구금 상태가 위법하게 되는 것은 아니다.", false, "▸ 구속영장의 제시와 집행이 정당한 사유 없이 시간이 지체되어 이루어졌다면, 구속영장이 그 유효기간 내에 집행되었다고 하더라도 위 기간 동안의 체포 내지 구금 상태는 위법하다. [2020도16438]", "체포구속"],
["268", "☆ 외국인을 체포·구속하는 경우 지체 없이 외국인에게 영사통보권 등이 있음을 고지하지 않았다면, 그러한 체포나 구속 절차는 국내법과 같은 효력을 가지는「영사관계에 관한 비엔나협약」을 위반한 것으로 위법하다.", true, "▸ 외국인을 체포·구속하는 경우 지체 없이 영사통보권 등이 있음을 고지하지 않으면 비엔나협약 위반이다. 다만, 피고인이 검찰 수사 단계에서 영사관 통보 가능성을 알게 되었음에도 요구하지 않은 경우에는 실질적 불이익이 없어 증거 사용은 가능하다. [2021도17103]", "체포구속"],
["269", "상소제기 후 소송기록이 상소법원에 도달하지 않고 있는 사이에는 피고인을 구속할 필요가 있는 경우에도 기록이 없는 상소법원에서 구속의 요건이나 필요성 여부에 대한 판단을 하여 피고인을 구속하는 것은 실질적으로 불가능하다.", true, "▸ [AI해설] 상소제기 후 소송기록이 상소법원에 도달하기까지는 원심법원이 구속 등을 하도록 규정한 규칙 제57조 제1항이 형소법 제105조 규정에 저촉된다고 보기는 어렵다. [2007모460]", "체포구속"],
["270", "구속사건에 대해서는 법원이 구속기간내에 재판을 하면 되는 것이고 구속만기 25일을 앞두고 제1회 공판이 있었다 하여 헌법에 정한 신속한 재판을 받을 권리를 침해하였다 할 수 없다.", true, "▸ [AI해설] 구속사건에서 구속기간 내에 재판을 하면 되고, 구속만기 25일 전에 제1회 공판이 있었다 하여 신속한 재판을 받을 권리 침해가 아니다. [90도672]", "체포구속"],
["271", "법원이 공판진행 중 피고인에 대한 구속영장을 발부하여 피고인을 구속하였는데, 집행기관이 즉시 공소사실의 요지와 변호인을 선임할 수 있음을 알려주지 않았다면, 그 구속영장은 효력이 없다.", false, "▸ 피고인을 구속한 때에는 즉시 공소사실의 요지와 변호인을 선임할 수 있음을 알려야 한다(제88조). 그러나 제88조는 사후청문절차에 관한 규정으로서 이를 위반하였다 하여 구속영장의 효력에 어떠한 영향을 미치는 것은 아니다. [2000모134]", "체포구속"],
["272", "☆ 이미 변호인을 선정하여 공판절차에서 변명과 증거의 제출을 다하고 그의 변호 아래 판결을 선고받아 피고인의 절차적 권리가 실질적으로 보장되었다고 볼 수 있는 경우에는 법원이 피고인에 대하여 구속영장을 발부할 때 사전에 피고인에 대하여 범죄사실의 요지의 고지 등 사전청문절차의 전부 또는 일부를 거치지 아니한 채 구속영장을 발부하였다는 점만으로 그 발부결정이 위법하다고 볼 것은 아니다.", true, "▸ 이미 변호인을 선정하여 공판절차에서 절차적 권리가 실질적으로 보장된 경우에는 사전청문절차의 전부 또는 일부를 거치지 아니한 채 구속영장을 발부하더라도 이러한 점만으로 발부결정을 위법하다고 볼 것은 아니다. [2015모1032]", "체포구속"],
["273", "★ 구속의 효력은 형사소송법이 정한 방식에 따라 작성된 구속영장에 기재된 범죄사실에만 미치는 것이므로, 구속기간이 만료될 무렵에 종전 구속영장에 기재된 범죄사실과 다른 범죄사실로 피고인을 구속하였다면 피고인에 대한 구속은 위법하다.", false, "▸ 구속의 효력은 원칙적으로 구속영장에 기재된 범죄사실에만 미치는 것이므로, 구속기간이 만료될 무렵에 종전 구속영장에 기재된 범죄사실과 다른 범죄사실로 피고인을 구속하였다는 사정만으로는 피고인에 대한 구속이 위법하다고 할 수 없다. [이중구속 허용취지, 2000모134]", "체포구속"],
["274", "★ 피고인에 대한 1차 구속영장 표지에 그 죄명 중 하나로 무고가 기재되어 있으나 그 구속영장의 범죄사실에는 무고에 관한 기재가 전혀 없는 경우, 1차 구속영장의 효력은 무고의 범죄사실에 대하여는 원칙적으로 미치지 아니하므로, 법원이 피고인에 대하여 무고죄로 2차 구속영장을 발부한 것은 정당하다.", true, "▸ 구속의 효력은 원칙적으로 구속영장에 기재된 범죄사실에만 미치는 것이다. 1차 구속영장의 범죄사실에 무고에 관한 기재가 전혀 없다면 그 효력이 무고의 범죄사실에 미치지 않으므로, 무고죄로 별도의 2차 구속영장을 발부한 것은 정당하다. [2000모134]", "체포구속"],
["275", "횡령혐의로 구속되었으나 사기죄로 기소된 피고인에 대하여, 구속영장에 기재된 횡령죄의 범죄사실과 공소장에 기재된 사기죄의 공소사실의 범행일시와 장소가 같고 범행의 목적물과 그 행위의 내용인 사실도 각각 같다면 사기죄에 대한 영장실질심사를 새롭게 하지 않았다고 하더라도 위법하다고 볼 수는 없다.", true, "▸ 구속영장의 효력은 구속영장에 기재된 범죄사실 및 그 사실의 기초가 되는 사회적 사실관계가 기본적인 점에서 동일한 공소사실에 미친다. [2001모85]", "체포구속"],
["276", "☆ 법원이 구속 피고인에 대하여 집행유예의 판결을 선고하는 경우 구속영장의 효력이 소멸하므로 판결의 확정 전이라도 피고인을 석방하여야 한다.", true, "▸ 무죄, 면소, 형의 면제, 형의 선고유예, 형의 집행유예, 공소기각 또는 벌금이나 과료를 과하는 판결이 '선고된 때'에는 구속영장은 효력을 잃는다(제331조). 확정 전이라도 선고와 동시에 구속영장은 실효된다.", "체포구속"],
["277", "사형 또는 자유형의 판결이 확정되면 그날로부터 형의 집행이 시작되므로 구속영장은 그 효력이 상실된다.", true, "▸ 구속 중인 피고인에 대하여 자유형(실형)의 판결이 '확정'된 때에는 구속영장은 실효된다. 따라서 피고인을 계속 구금하기 위하여는 확정된 유죄 부분에 대한 형집행의 절차를 취하여야 한다. [99초355]", "체포구속"],
["278", "판결내용 자체가 아니고 다만 피고인의 신병확보를 위한 구속 등 소송절차가 법령에 위반된 경우에는, 그로 인하여 피고인의 방어권이나 변호인의 조력을 받을 권리가 본질적으로 침해되고 판결의 정당성마저 인정하기 어렵다고 보이는 정도에 이르지 않는 한, 그것 자체만으로는 판결에 영향을 미친 위법이라고 할 수 없다.", true, "▸ [AI해설] 구속 등 소송절차 위반이 피고인의 방어권 등을 본질적으로 침해하는 정도에 이르지 않는 한 판결에 영향을 미친 위법이라고 할 수 없다. [2018도19034]", "체포구속"],
["279", "☆ 체포된 피의자를 구속영장에 의하여 구속한 경우에 그 구속기간은 피의자를 체포한 날부터 기산한다.", true, "▸ 구속기간은 피의자를 체포 또는 구인한 날부터 기산한다(제203조의2).", "체포구속"],
["280", "사법경찰관 A는 체포영장에 의하여 체포된 甲에게 구속의 필요성이 인정되어 체포된 다음 날 구속영장을 신청하였고, 검사의 구속영장 청구와 지방법원판사가 발부한 구속영장에 의해 甲이 구속된 경우, A는 구속영장에 의해 甲이 구속된 때로부터 10일 이내에 검사에게 甲을 인치하지 아니하면 석방하여야 한다.", false, "▸ 사법경찰관이 피의자를 구속한 때에는 10일 이내에 피의자를 검사에게 인치하지 아니하면 석방하여야 한다(제202조). 구속기간은 피의자를 체포한 날부터 기산한다(제203조의2). A는 甲을 '체포한 날'부터 10일 이내에 甲을 검사에게 인치하여야 한다.", "체포구속"],
["281", "甲의 재판에서 甲의 기피신청에 의하여 소송절차가 정지된 기간은 법원의 피고인 구속기간에 산입되지 않는다.", true, "▸ 제22조, 제298조 제4항, 제306조 제1항 및 제2항의 규정에 의하여 공판절차가 정지된 기간 및 공소제기전의 체포·구인·구금 기간은 구속기간에 산입하지 아니한다(제92조 제3항). [제22조(기피신청과 소송의 정지)]", "체포구속"],
["282", "☆ 피고인에 대한 구속기간에는 공소제기전의 체포기간도 산입한다.", false, "▸ 공소제기전의 체포·구인·구금 기간은 '법원'의 구속기간에 산입하지 아니한다(제92조 제3항).", "체포구속"],
["283", "공판과정에서 구속을 계속할 필요가 있는 때에는 제1심 법원은 결정으로 2개월 단위로 2차에 한하여 구속기간을 갱신할 수 있다.", true, "▸ 구속기간은 2개월로 한다(제92조 제1항). 특히 구속을 계속할 필요가 있는 경우에는 심급마다 2개월 단위로 2차에 한하여 결정으로 갱신할 수 있다. 다만, 상소심은 부득이한 경우에는 3차에 한하여 갱신할 수 있다(동조 제2항).", "체포구속"],
["284", "사법경찰관 P는 2023. 10. 2. 피의자 甲을 절도죄로 체포하면서 피의사실의 요지, 체포이유 등을 고지하였다. P는 검사에게 구속영장을 신청하였고, 검사는 같은 날 17:00 관할 법원에 구속영장청구서 및 수사관계서류를 제출하였다. 관할 법원 영장전담판사는 2023. 10. 3. 10:00 구속전 피의자심문절차를 실시하였고, 같은 날 13:00 구속영장을 발부하면서 수사관계서류를 검찰청에 반환하였다. P의 구속절차가 적법하다면, P는 2023. 10. 13. 24:00까지 甲을 검사에게 인치하여야 한다.", true, "▸ 피의자심문을 하는 경우 법원이 수사관계서류 및 증거물을 접수한 날부터 구속영장을 발부하여 검찰청에 반환한 날까지의 기간은 구속기간에 산입하지 아니한다(제201조의2 제7항). 기산일은 체포일 2023.10.2., 경찰 구속기간 10일인데, 서류를 법원에 접수한 10.2.부터 반환받은 10.3.까지 2일을 공제 → 2023.10.13. 24:00까지 인치해야 한다.", "체포구속"],
["285", "★ 공소제기 후의 피고인은 체포·구속적부심사를 청구할 수 없다.", true, "▸ 체포되거나 구속된 '피의자' 또는 그 변호인, 법정대리인, 배우자, 직계친족, 형제자매나 가족, 동거인 또는 고용주는 관할법원에 체포 또는 구속의 적부심사를 청구할 수 있다(제214조의2 제1항). 공소제기 후 피고인은 청구 자격 없음.", "체포구속"],
["286", "체포영장에 의해 체포된 피의자뿐만 아니라 체포영장에 의하지 아니하고 긴급체포된 피의자도 체포적부심사의 청구권자에 해당한다.", true, "▸ 긴급체포 등 체포영장에 의하지 아니하고 체포된 피의자의 경우에도 그 적부심사를 청구할 권리를 가진다. [97모21]", "체포구속"],
["287", "체포·구속적부심사의 청구를 받은 법원은 청구서가 접수된 때로부터 48시간 이내에 피의자를 심문하고 수사관계서류와 증거물을 조사하여야 한다.", true, "▸ 제214조의2 제4항에 따라 법원은 청구서 접수 후 48시간 이내에 피의자를 심문하고 수사관계서류와 증거물을 조사하여야 한다.", "체포구속"],
["288", "☆ 체포적부심사를 청구한 피의자에게 변호인이 없는 때에는 지체 없이 국선변호인을 선정해야 하나, 심문 없이 적부심사청구에 대해 기각 결정을 하는 경우에는 그러하지 아니하다.", false, "▸ 체포되거나 구속된 피의자에게 변호인이 없는 때에는 제33조를 준용한다(제214조의2 제10항). 심문 없이 기각 결정을 하는 경우에도 예외 없이 국선변호인을 선정하여야 한다.", "체포구속"],
["289", "☆ 甲은 컴퓨터등사용사기죄 등의 혐의로 긴급체포되었고, 甲은 체포적부심사를 청구하였다. 체포적부심사를 청구한 甲에게 법원은 보증금납입을 조건으로 석방을 명할 수 있다.", false, "▸ 현행법상 체포된 피의자에 대하여는 보증금 납입을 조건으로 한 석방이 허용되지 않는다. 보증금납입조건부 석방은 구속적부심사에서만 가능하다. [97모21]", "체포구속"],
["290", "☆ 체포적부심사청구를 받은 법원이 청구가 이유 있다고 인정한 때에는 결정으로 체포된 피의자의 석방을 명하여야 하며, 검사는 이 결정에 대해 항고하지 못한다.", true, "▸ 기각결정과 석방결정에 대해서는 항고할 수 없다(제214조의2 제8항).", "체포구속"],
["291", "수사기관이 청구인들을 각 체포한 후 청구인들 모두를 체포의 법정 시한 가까이 계속 구금하다가 체포시한 종료가 임박한 시점에 이르러서야 석방한 경우, 체포적부심사를 거치지 않고 곧바로 헌법소원을 청구할 수 있다.", false, "▸ 체포에 대하여는 헌법과 형소법이 정한 체포적부심사라는 구제절차가 존재함에도 불구하고, 체포적부심사절차를 거치지 않고 제기된 헌법소원심판청구는 보충성의 원칙에 반하여 부적법하다. [2008헌마628]", "체포구속"],
["292", "피의자를 구속한 사법경찰관은 체포되거나 구속된 피의자와 적부심사청구권자 중에서 피의자가 지정하는 사람에게 적부심사를 청구할 수 있음을 알려야 한다.", true, "▸ 피의자를 체포하거나 구속한 검사 또는 사법경찰관은 체포되거나 구속된 피의자와 제1항에 규정된 사람 중에서 피의자가 지정하는 사람에게 제1항에 따른 적부심사를 청구할 수 있음을 알려야 한다(제214조의2 제2항).", "체포구속"],
["293", "☆ 구속적부심사에서 피의자에게 변호인이 없는 때에는 법원은 직권으로 국선변호인을 선정해야 한다.", true, "▸ 제214조의2 제10항에서 제33조를 준용하므로, 구속적부심사에서 피의자에게 변호인이 없는 때에는 법원은 직권으로 국선변호인을 선정하여야 한다.", "체포구속"],
["294", "검사·변호인·청구인은 구속적부심문기일에 출석하여 의견을 진술할 수 있다.", true, "▸ 제214조의2 제9항에 따라 검사·변호인·청구인은 구속적부심문기일에 출석하여 의견을 진술할 수 있다.", "체포구속"],
["295", "구속적부심사건 피의자의 변호인에게는 수사기록 중 고소장과 피의자신문조서의 열람·등사를 알 권리가 인정된다.", true, "▸ [AI해설] 구속적부심사 피의자의 변호인에게 수사기록 중 고소장과 피의자신문조서의 열람·복사를 알 권리가 인정된다. [2000헌마474]", "체포구속"],
["296", "★ 구속적부심사청구 후 검사가 피의자를 기소한 경우 법원은 구속적부심사청구를 기각하여야 하며 피고인은 수소법원에 보석을 청구할 수 있다.", true, "▸ 심사 청구 후 기소가 이루어진 경우에도 법원은 그 청구를 기각하여야 한다(제214조의2 제4항). 기소 후에는 수소법원에 보석을 청구할 수 있다.", "체포구속"],
["297", "공범 또는 공동피의자의 구속적부심사 순차청구가 수사방해의 목적임이 명백하다고 하더라도 법원은 피의자에 대한 심문 없이 그 청구를 기각할 수는 없다.", false, "▸ 법원은 공범이나 공동피의자의 순차청구가 수사 방해를 목적으로 하고 있음이 명백한 때에는 심문 없이 결정으로 청구를 기각할 수 있다(제214조의2 제3항).", "체포구속"],
["298", "피의자가 보증금납입조건부석방을 허가받기 위해서는 구속적부심사를 청구해야 한다.", false, "▸ 피의자 등이 구속적부심사를 청구하면 법원이 '직권'으로 보증금납입조건부 석방결정을 할 수 있을 뿐이다. 청구서에 보증금납입조건부 석방을 기재하더라도 이는 직권발동촉구의 의미에 불과하다.", "체포구속"],
["299", "체포영장이나 구속영장을 발부한 법관은 구속적부심사에 관여하지 못하지만, 구속적부심사를 담당할 판사가 없는 경우에는 그러하지 아니하다.", true, "▸ 제214조의2 제12항에 따라 체포영장이나 구속영장을 발부한 법관은 구속적부심사에 관여하지 못하나, 그 판사 외에 다른 판사가 없는 경우에는 예외이다.", "체포구속"],
["300", "법원은 구속적부심사에서 구속된 피의자가 죄증을 인멸할 염려가 있다고 믿을만한 충분한 이유가 있는 때에는 보증금납입조건부 피의자석방결정을 할 수 없다.", true, "▸ 제214조의2 제1항 제1호에 따라 피의자가 죄증을 인멸할 염려가 있다고 믿을만한 충분한 이유가 있는 때에는 보증금납입조건부 석방결정을 할 수 없다.", "체포구속"],
["301", "☆ 법원이 구속된 피의자에 대하여 보증금납입을 조건으로 석방결정을 한 때에는 피의자나 검사가 그 취소의 실익이 있다고 하더라도「형사소송법」제402조에 따른 항고를 할 수 없다.", false, "▸ 제214조의2 제8항은 제3항과 제4항의 기각결정 및 석방결정에 대하여 항고하지 못하도록 규정하고 있으나, 제5항(보증금납입조건부 석방결정)에 대하여 항고하지 못한다는 규정은 없다. 보증금납입조건부 석방결정에 대하여는 취소의 실익이 있는 한 제402조에 의하여 항고할 수 있다. [97모21]", "체포구속"],
["302", "구속된 피의자로부터 구속적부심사의 청구를 받은 법원이 보증금납입조건부 피의자석방결정을 내린 경우 보증금이 납입된 후에야 피의자를 석방할 수 있다.", true, "▸ 보증금납입의 조건은 이를 이행한 후가 아니면 석방허가결정을 집행하지 못한다(제100조, 제214조의2 제7항 준용).", "체포구속"],
["303", "보석은 유효한 구속영장을 전제로 구속의 집행을 정지시키는 것에 불과하다.", true, "▸ 구속취소는 구속을 실효시키는 제도이지만, 보석은 구속의 집행만을 정지시키는 제도이다. 보석이 취소되면 당연히 구속영장의 효력이 되살아난다.", "체포구속"],
["304", "피고인이 집행유예 기간 중에 재차 동일한 범죄를 저질러 집행유예가 취소되고 구속되어 있는 상태에서 보석을 청구한 경우, 법원은 피고인에 대하여 보석을 허가할 수 없다.", false, "▸ 집행유예의 기간 중에 있어 집행유예의 결격자라고 하여 보석을 허가할 수 없는 것은 아니다. 해당 사유는 필요적 보석의 예외에 해당하지 않는다. [90모22]", "체포구속"],
["305", "보석을 허가하거나 구속을 취소하는 법원의 결정에 대하여 검사는 즉시항고를 할 수 있다.", false, "▸ 검사는 구속취소 결정에 대해서는 즉시항고를 할 수 있으나(제97조 제4항), 보석 결정에 대해서는 '항고만' 할 수 있다(제403조). [위헌결정 93헌가2]", "체포구속"],
["306", "고등법원의 결정에 대한 재항고는 형사소송법상 즉시항고로 규정되어 있으므로, 고등법원의 보석취소결정에 대하여는 즉시항고가 가지는 집행정지의 효력이 인정된다.", false, "▸ 제415조가 고등법원의 결정에 대한 재항고를 즉시항고로 규정하고 있다고 하여 당연히 즉시항고가 가지는 집행정지의 효력이 인정된다고 볼 수는 없다. 고등법원의 보석취소결정에 대하여는 집행정지의 효력을 인정할 수 없다. [2020모633]", "체포구속"],
["307", "보석보증금몰수결정은 반드시 보석취소결정과 동시에 하여야만 하는 것이 아니라 보석취소결정 후에 별도로 할 수도 있다.", true, "▸ 제103조 제1항에 따라 보석보증금을 몰수하려면 반드시 보석취소와 동시에 하여야만 가능한 것이 아니라 보석취소 후에 별도로 보증금몰수결정을 할 수도 있다. [2000모22]", "체포구속"],
["308", "구속영장의 효력이 소멸한 때에는 보석조건은 즉시 그 효력을 상실한다.", true, "▸ 제104조의2 제1항에 따라 구속영장의 효력이 소멸한 때에는 보석조건은 즉시 그 효력을 상실한다.", "체포구속"],
["309", "구속의 사유가 없거나 소멸된 때에는 법원은 직권 또는 검사, 피고인, 변호인과 제30조 제2항에 규정한 자의 청구에 의하여 결정으로 구속을 취소하여야 한다.", true, "▸ 제93조에 따라 구속의 사유가 없거나 소멸된 때에는 법원은 직권 또는 검사, 피고인, 변호인과 변호인선임권자의 청구에 의하여 결정으로 구속을 취소하여야 한다.", "체포구속"],
["310", "구속취소청구를 불허한 결정에 관여하지 아니한 법관이 항고에 대한 의견서를 첨부하여 항고법원에 송부한 것은 직접심리주의에 반하여 위법하다.", false, "▸ 제1심결정에 관여하지 아니한 법관이 항고에 대한 의견서를 첨부하여 항고법원에 송부한 것은 직접심리주의에 위배되는 위법이 있다고 할 수 없다. [86모10]", "체포구속"],
["311", "이미 구속영장이 실효된 경우라도 피고인이 계속 구금되어 있는 때에는 구속의 취소 결정을 할 수 있다.", false, "▸ 구속취소는 구속영장의 효력이 존속하고 있음을 전제로 하는 것이고, 다른 사유로 이미 구속영장이 실효된 경우에는 피고인이 계속 구금되어 있더라도 제93조에 의한 구속의 취소 결정을 할 수 없다. [99초355]", "체포구속"],
["312", "법원은 상당한 이유가 있는 경우 직권 또는 검사·피고인·변호인과 변호인선임권자의 청구에 의하여 구속의 집행을 정지할 수 있다.", false, "▸ 법원은 상당한 이유가 있는 때에는 결정으로 구속의 집행을 정지할 수 있다(제101조 제2항). 검사나 피고인 등의 청구권은 없고 '직권'만 가능하다.", "체포구속"],
["313", "구속집행정지결정을 할 때에는 급속을 요하는 경우를 제외하고 검사의 의견을 물어야 한다.", true, "▸ 구속집행정지의 결정을 함에는 검사의 의견을 물어야 한다. 다만, 급속을 요하는 경우에는 그러하지 아니하다(제101조 제2항).", "체포구속"],
["314", "상소기간 중 소송기록이 원심법원에 있는 때에는 구속의 집행정지에 대한 결정은 원심법원이 이를 하여야 한다.", true, "▸ 상소기간 중 또는 상소 중의 사건에 관하여 구속기간의 갱신, 구속의 취소, 보석, 구속의 집행정지와 그 정지의 취소에 대한 결정은 소송기록이 원심법원에 있는 때에는 원심법원이 하여야 한다(제105조).", "체포구속"],
["315", "경찰관 甲이 도로를 순찰하던 중 벌금 미납으로 지명수배된 피고인과 조우하게 되어 벌금 미납으로 인한 노역장 유치의 집행을 위하여 구인하려 하였는데, 피고인이 이에 저항하여 甲을 폭행함으로써 경찰관의 공무집행을 방해한 경우, 甲이 피고인을 구인하는 과정에서 형집행장이 발부되어 있는 사실을 고지하지 않았다면 甲의 직무집행은 위법하므로, 피고인에게 공무집행방해죄가 성립하지 않는다.", true, "▸ 사법경찰관리가 벌금 미납으로 인한 지명수배 사실을 고지하였더라도 특별한 사정이 없는 한 이를 형집행장이 발부되어 있는 사실까지 고지한 것으로 볼 수 없으므로, 형집행장이 발부되어 있는 사실을 고지하지 않은 직무집행은 적법한 직무집행에 해당한다고 할 수 없다. [2017도9458]", "체포구속"],
