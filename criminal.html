["423", "★ 원인에 있어서 자유로운 행위의 가벌성의 근거를 원인설정행위와 실행행위의 불가분적 관련에서 찾는 견해는 책임능력 결함상태에서 구성요건 해당행위를 시작한 때에 실행의 착수가 있는 것으로 본다.[변14]", true, "▸ 책임모델(예외모델)은 원인에 있어서 자유로운 행위의 가벌성의 근거를 원인설정행위와 실행행위의 불가분적 관련에서 찾는 견해로, 책임능력 결함상태에서 구성요건 해당행위(실행행위)를 시작한 때에 비로소 실행의 착수가 있는 것으로 본다. 이 견해는 실행의 착수시기를 실행행위시로 보아 구성요건적 정형성을 유지할 수 있다는 장점이 있으나, 원인행위시에는 책임능력이 있었고 실행행위시에는 책임능력이 없었음에도 책임을 인정하는 것이어서 행위와 책임의 동시존재 원칙에 대한 예외를 인정하는 결과가 되어 책임주의에 반할 위험이 있다는 비판을 받는다. [예외모델은 원인설정행위가 아니라 '책임능력 결함상태에서의 실행행위'를 실행행위로 보는 것이므로, 원인설정행위를 실행행위라고 이해한다는 서술은 타당하지 않다.]\n\n[제3절 참고 - 원인에 있어서 자유로운 행위 이론 정리] 구성요건모델(일치모델): 책임근거=원인설정행위(간접정범 유사, 자신을 도구로 이용), 실행행위=원인설정행위, 행위·책임 동시존재원칙=유지, 비판=구성요건적 행위정형성이 결여되어 죄형법정주의에 반할 위험. 책임모델(예외모델): 책임근거=원인설정행위와 결과실현행위의 불가분적 관련, 실행행위=결과실현행위, 동시존재원칙=예외, 비판=책임주의에 반할 우려. 반무의식상태설: 책임근거=실행행위, 실행행위=결과실현행위, 동시존재원칙=유지, 비판=대부분의 경우에 행위자의 책임능력이 인정되어 법적 안정성을 해한다.", "책임론"],

["426", "원인에 있어서 자유로운 행위의 가벌성의 근거를 책임능력 결함상태에서의 실행행위에서 찾는 견해는 일종의 '반무의식상태'에서 실행행위가 이루어지는 한 그 주관적 요소를 인정할 수 있다. 이 견해에 대해서는 대부분의 경우에 행위자의 책임능력이 인정되어 법적 안정성을 해하는 결과를 초래한다는 비판이 있다.[변14]", true, "▸ 반무의식상태설은 원인에 있어서 자유로운 행위의 가벌성의 근거를 책임능력 결함상태에서의 실행행위에서 찾으면서, 일종의 '반무의식상태'에서 실행행위가 이루어지는 한 그 주관적 요소(고의·과실)를 인정할 수 있다고 본다. 이 견해에 대해서는 대부분의 경우에 행위자의 책임능력이 인정되어 법적 안정성을 해하는 결과를 초래한다는 비판이 있다.\n\n[제3절 참고 - 원인에 있어서 자유로운 행위 이론 정리] 구성요건모델(일치모델): 책임근거=원인설정행위(간접정범 유사, 자신을 도구로 이용), 실행행위=원인설정행위, 행위·책임 동시존재원칙=유지, 비판=구성요건적 행위정형성이 결여되어 죄형법정주의에 반할 위험. 책임모델(예외모델): 책임근거=원인설정행위와 결과실현행위의 불가분적 관련, 실행행위=결과실현행위, 동시존재원칙=예외, 비판=책임주의에 반할 우려. 반무의식상태설: 책임근거=실행행위, 실행행위=결과실현행위, 동시존재원칙=유지, 비판=대부분의 경우에 행위자의 책임능력이 인정되어 법적 안정성을 해한다.", "책임론"],
["427", "甲은 A를 살해하기로 결심하였으나, 범행을 실행하기로 한 날 막상 용기가 나지 않자 범죄행위를 시작하기 전에 술을 마시고 심신미약 상태가 된 다음 A의 집을 찾아갔다. 원인에 있어서 자유로운 행위를 '행위와 책임의 동시존재 원칙'의 예외로 파악하는 견해는, 甲의 A에 대한 살인죄의 실행의 착수시기를 음주시로 본다.", false, "▸ ① 행위와 책임의 동시존재 원칙의 예외로 파악하는 견해(책임모델)는 실행의 착수시기를 책임능력 결함상태에서 구성요건 해당행위를 시작한 때로 본다. ② 간접정범으로 이해하는 견해(구성요건모델)는 원인행위시에 실행의 착수를 인정하므로 甲은 음주시에 이미 살인의 실행에 착수한 것이고, 후회하고 범행을 중지하였으므로 중지미수에 해당한다. 책임모델에 의하면 이 경우 살인예비만이 가능하다.", "책임론"],
["428", "위 사례에서 원인에 있어서 자유로운 행위를 자신을 책임능력 없는 도구로 이용하는 간접정범으로 이해하는 견해에 의하면, 甲이 A를 찾아가다가 범행계획을 후회하여 다시 되돌아온 경우, 甲은 살인죄의 중지미수에 해당한다.", true, "▸ ① 행위와 책임의 동시존재 원칙의 예외로 파악하는 견해(책임모델)는 실행의 착수시기를 책임능력 결함상태에서 구성요건 해당행위를 시작한 때로 본다. ② 간접정범으로 이해하는 견해(구성요건모델)는 원인행위시에 실행의 착수를 인정하므로 甲은 음주시에 이미 살인의 실행에 착수한 것이고, 후회하고 범행을 중지하였으므로 중지미수에 해당한다. 책임모델에 의하면 이 경우 살인예비만이 가능하다.", "책임론"],
["429", "「형법」 제10조 제3항은 고의에 의한 원인에 있어서의 자유로운 행위에만 적용되고 과실에 의한 원인에 있어서의 자유로운 행위까지는 포함하지 않는다.", false, "▸ 제10조 제3항은 고의에 의한 원인에 있어서의 자유로운 행위만이 아니라 '과실에 의한 원인에 있어서의 자유로운 행위'까지도 포함하는 것으로서 위험의 발생을 '예견할 수' 있었는데도 자의로 심신장애를 야기한 경우도 적용 대상이 된다(92도999). [예견가능성이 없었다면 과실도 존재하지 않으므로 제10조 제3항이 적용될 수 없다.]", "책임론"],
["430", "원인행위시 심신장애 상태에서의 위법행위로 나아갈 예견가능성이 없었던 경우라고 하더라도 「형법」 제10조 제3항이 적용된다.", false, "▸ 제10조 제3항은 고의에 의한 원인에 있어서의 자유로운 행위만이 아니라 '과실에 의한 원인에 있어서의 자유로운 행위'까지도 포함하는 것으로서 위험의 발생을 '예견할 수' 있었는데도 자의로 심신장애를 야기한 경우도 적용 대상이 된다(92도999). [예견가능성이 없었다면 과실도 존재하지 않으므로 제10조 제3항이 적용될 수 없다.]", "책임론"],
["431", "대마초 흡연 시에 이미 범행을 예견하고 자의로 심신장애를 야기한 경우, 그로 인해 범행시에 의사결정능력이 없거나 미약했다면 심신장애로 인한 감경을 할 수 있다.", false, "▸ 피고인들은 상습적으로 대마초를 흡연하는 자들로서 이 사건 각 살인범행 당시에도 대마초를 흡연하여 그로 인하여 심신이 다소 미약한 상태에 있었음은 인정되나, 이는 위 피고인들이 피해자들을 살해할 의사를 가지고 범행을 공모한 후에 대마초를 흡연하고, 위 각 범행에 이른 것으로 대마초 흡연시에 이미 범행을 예견하고도 자의로 위와 같은 심신장애를 야기한 경우에 해당하므로, 형법 제10조 제3항에 의하여 심신장애로 인한 감경 등을 할 수 없다(96도857).", "책임론"],
["432", "음주운전을 할 의사를 가지고 음주만취한 후 운전을 결행하여 교통사고를 일으켰다면, 음주 시에 교통사고를 일으킬 위험성을 예견하였는데도 자의로 심신장애를 야기한 경우에 해당하므로 심신장애로 인한 감경 등을 할 수 없다.", true, "▸ 형법 제10조 제3항은 고의에 의한 원인에 있어서의 자유로운 행위만이 아니라 '과실에 의한 원인에 있어서의 자유로운 행위'까지도 포함하는 것으로서 위험의 발생을 '예견할 수' 있었는데도 자의로 심신장애를 야기한 경우도 그 적용 대상이 된다. 따라서 피고인이 음주운전을 할 의사를 가지고 음주만취한 후 운전을 결행하여 교통사고를 일으켰다면 피고인은 음주시에 교통사고를 일으킬 위험성을 예견하였는데도 자의로 심신장애를 야기한 경우에 해당하므로 위 법조항에 의하여 심신장애로 인한 감경 등을 할 수 없다(92도999). [판례에 의하면 도로교통법위반(음주운전), 교특법위반죄(위험운전치사상 동일), 특가법위반(도주치사상)죄 모두 성립하고, 형법 제10조 제1항, 제2항이 적용되지 않는다.]", "책임론"],
["433", "甲이 음주운전을 할 의사를 가지고 음주만취한 후 운전을 결행하여 부주의로 보행자 A를 충격하여 A를 그 현장에서 즉사시키고 도주하였다면, 이는 음주시에 교통사고를 일으킬 위험성을 예견하였는데도 자의로 심신장애를 야기한 경우에 해당하므로 甲에 대한 형사처벌이 가능하다.", true, "▸ 형법 제10조 제3항은 고의에 의한 원인에 있어서의 자유로운 행위만이 아니라 '과실에 의한 원인에 있어서의 자유로운 행위'까지도 포함하는 것으로서 위험의 발생을 '예견할 수' 있었는데도 자의로 심신장애를 야기한 경우도 그 적용 대상이 된다. 따라서 피고인이 음주운전을 할 의사를 가지고 음주만취한 후 운전을 결행하여 교통사고를 일으켰다면 피고인은 음주시에 교통사고를 일으킬 위험성을 예견하였는데도 자의로 심신장애를 야기한 경우에 해당하므로 위 법조항에 의하여 심신장애로 인한 감경 등을 할 수 없다(92도999). [판례에 의하면 도로교통법위반(음주운전), 교특법위반죄(위험운전치사상 동일), 특가법위반(도주치사상)죄 모두 성립하고, 형법 제10조 제1항, 제2항이 적용되지 않는다.]", "책임론"],
["434", "甲은 골목길에서 행인을 상대로 강도를 하기로 마음먹었으나, 용기가 나지 않자 소주 3병을 마셨다. 甲이 골목길을 걸어가던 A를 발견하고 몽둥이로 A를 구타하여 A에게 약 7주간의 치료를 요하는 상해를 가한 후 가방을 들고 갔다. 甲은 범행 당시 음주로 인한 심신상실 상태였더라도 처벌된다.", true, "▸ 판례에 의하면 고의든 과실이든 원인에 있어서 자유로운 행위에 해당하고, 유형론에 의하더라도 고의 원인에 있어서 자유로운 행위에 해당하므로 심신상실이 적용되지 않는다.", "책임론"],
["435", "엄격고의설에 의하면 타인을 살해한 사람이 법외면적이고 법적대적 태도로 인하여 자신의 행위의 위법성을 인식하지 못하였다면 그를 형사처벌할 수 없다.", false, "▸ 엄격고의설은 위법성의 인식을 고의의 내용으로 보아, 위법성을 현실적으로 인식하여야 책임고의가 인정된다고 본다. 다만, 과실범으로 처벌할 수 있다. 엄격고의설에 의하면, 과실치사죄로 처벌할 수 있다.\n\n[제4절 참고 - 위법성 인식 조문] 형법 제16조(법률의 착오): 자기의 행위가 법령에 의하여 죄가 되지 아니하는 것으로 오인한 행위는 그 오인에 정당한 이유가 있는 때에 한하여 벌하지 아니한다.", "책임론"],
["436", "엄격책임설에 의하면 위법성의 인식 여부는 고의 성립에 영향을 미치지 않는다.", true, "▸ 엄격책임설에 의하면 위법성의 인식은 고의와 별개의 책임요소이다.\n\n[제4절 참고 - 위법성 인식 조문] 형법 제16조(법률의 착오): 자기의 행위가 법령에 의하여 죄가 되지 아니하는 것으로 오인한 행위는 그 오인에 정당한 이유가 있는 때에 한하여 벌하지 아니한다.", "책임론"],
["437", "제한적 책임설에 의하면 법이 인정하지 않는 위법성조각사유를 존재하는 것으로 오신한 경우는 위법성조각사유의 전제사실에 관한 착오에 해당하여 행위자의 형사책임을 판단함에 있어서 구성요건착오 규정을 유추적용하여야 한다.", false, "▸ 유추적용제한책임설에 의하면 구성요건착오 규정을 유추적용하지만, 법효과제한책임설에 의하면 책임고의가 조각된다.\n\n[제4절 참고 - 위법성 인식 조문] 형법 제16조(법률의 착오): 자기의 행위가 법령에 의하여 죄가 되지 아니하는 것으로 오인한 행위는 그 오인에 정당한 이유가 있는 때에 한하여 벌하지 아니한다.", "책임론"],
["438", "고의의 성립에 위법성의 인식이 필요하다는 고의설과 위법성의 인식은 고의와는 분리된 독립한 책임요소로 보는 책임설의 입장 모두, 금지착오는 고의의 성립에 영향을 미치지 못하고 착오가 회피불가능할 때에는 책임을 조각하지만 회피가능할 때에는 책임을 감경할 수 있을 뿐이라는 결론에 이른다.", false, "▸ 고의설에 의하면 위법성의 인식이 없다면 고의(책임요소)가 조각된다.\n\n[제4절 참고 - 위법성 인식 조문] 형법 제16조(법률의 착오): 자기의 행위가 법령에 의하여 죄가 되지 아니하는 것으로 오인한 행위는 그 오인에 정당한 이유가 있는 때에 한하여 벌하지 아니한다.", "책임론"],
["439", "사인인 甲이 현행범인을 체포하면서 그 범인을 자기 집 안에 감금까지 할 수 있다고 생각하고 감금한 경우, 소극적 구성요건요소이론에 따르면 甲의 착오는 법률의 착오에 해당한다.[변14]", false, "▸ 위법성조각사유의 법적 한계를 오인하여 위법성을 인식하지 못한 경우이다(위전착X). 소극적 구성요건요소이론에 의하면, 이에 대한 착오도 구성요건착오에 해당한다. 위법성의 인식을 책임의 요소로 보는 통설에 의하면 법률의 착오에 해당한다.\n\n[제4절 참고 - 위법성 인식 조문] 형법 제16조(법률의 착오): 자기의 행위가 법령에 의하여 죄가 되지 아니하는 것으로 오인한 행위는 그 오인에 정당한 이유가 있는 때에 한하여 벌하지 아니한다.", "책임론"],
["440", "범죄의 성립에 있어서 위법의 인식은 그 범죄사실이 사회정의와 조리에 어긋난다는 것을 인식하는 것으로서 족하고 구체적인 해당 법조문까지 인식할 것을 요하는 것은 아니다.", true, "▸ [AI해설] 범죄의 성립에 있어서 위법의 인식은 그 범죄사실이 사회정의와 조리에 어긋난다는 것을 인식하는 것으로서 족하고 구체적인 해당 법조문까지 인식할 것을 요하는 것은 아니라는 것이 판례의 태도이다(86도2673).\n\n[제4절 참고 - 위법성 인식 조문] 형법 제16조(법률의 착오): 자기의 행위가 법령에 의하여 죄가 되지 아니하는 것으로 오인한 행위는 그 오인에 정당한 이유가 있는 때에 한하여 벌하지 아니한다.", "책임론"],
["441", "자신의 행위가 사회정의와 조리에 어긋난다는 것을 인식하였다고 하더라도 금지규범에 위반한다는 것을 인식하지 못하였다면 위법성의 인식이 없다.", false, "▸ 금지규범에 위반한다는 것을 인식할 필요까지는 없다.\n\n[제4절 참고 - 위법성 인식 조문] 형법 제16조(법률의 착오): 자기의 행위가 법령에 의하여 죄가 되지 아니하는 것으로 오인한 행위는 그 오인에 정당한 이유가 있는 때에 한하여 벌하지 아니한다.", "책임론"],
["442", "간통이 형사처벌된다고 착오하고 간통행위를 한 경우는 불능범에 해당한다.[변25]", false, "▸ 반전된 '금지' 착오(소위 환각범)에 해당한다. 반전된 구성요건적 착오(반전된 '사실'의 착오)는 불능미수를 의미한다.\n\n[제4절 참고 - 위법성 인식 조문] 형법 제16조(법률의 착오): 자기의 행위가 법령에 의하여 죄가 되지 아니하는 것으로 오인한 행위는 그 오인에 정당한 이유가 있는 때에 한하여 벌하지 아니한다.", "책임론"],
["443", "간통이 범죄가 된다고 생각하고 배우자 있는 자와 간음을 하였다면 이와 같은 착오는 반전된 구성요건적 착오에 해당한다.", false, "▸ 반전된 '금지' 착오(소위 환각범)에 해당한다. 반전된 구성요건적 착오(반전된 '사실'의 착오)는 불능미수를 의미한다.\n\n[제4절 참고 - 위법성 인식 조문] 형법 제16조(법률의 착오): 자기의 행위가 법령에 의하여 죄가 되지 아니하는 것으로 오인한 행위는 그 오인에 정당한 이유가 있는 때에 한하여 벌하지 아니한다.", "책임론"],
["444", "법률의 착오는 행위자가 행위를 금지하는 법규의 존재 자체를 인식하지 못하는 법률의 부지뿐만 아니라, 일반적으로 범죄가 되는 경우이지만 자기의 특수한 경우에는 법령에 의하여 허용된 행위로서 죄가 되지 아니한다고 그릇 인식한 경우를 포함한다.", false, "▸ 형법 제16조는 단순한 법률의 부지를 말하는 것이 아니고 일반적으로 범죄가 되는 경우이지만 자기의 특수한 경우에는 법령에 의하여 허용된 행위로서 죄가 되지 아니한다고 그릇 인식하고 그와 같이 그릇 인식함에 정당한 이유가 있는 경우에는 벌하지 않는다는 취지이다(2005도4592).\n\n[제4절 참고 - 위법성 인식 조문] 형법 제16조(법률의 착오): 자기의 행위가 법령에 의하여 죄가 되지 아니하는 것으로 오인한 행위는 그 오인에 정당한 이유가 있는 때에 한하여 벌하지 아니한다.", "책임론"],
["445", "일본 영주권을 가진 재일교포가 국내 입국시 관세신고를 하지 않아도 되는 것으로 착오하였다는 사정은 법률의 착오에 해당한다.", false, "▸ 제16조의 법률의 착오에 해당한다고 할 수 없다(2006도1993). [법률의 부지]\n\n[제4절 참고 - 위법성 인식 조문] 형법 제16조(법률의 착오): 자기의 행위가 법령에 의하여 죄가 되지 아니하는 것으로 오인한 행위는 그 오인에 정당한 이유가 있는 때에 한하여 벌하지 아니한다.", "책임론"],
["446", "★ 형법 제16조의 정당한 이유는 행위자에게 자기 행위의 위법 가능성에 대해 심사숙고하거나 조회할 수 있는 계기가 있어 자신의 지적 능력을 다하여 이를 회피하기 위한 진지한 노력을 다하였더라면 스스로의 행위에 대하여 위법성을 인식할 수 있는 가능성이 있었는데도 이를 다하지 못한 결과 자기 행위의 위법성을 인식하지 못한 것인지 여부에 따라 판단해야 한다.[변16]", true, "▸ (2021도10903) [행위자의 지적 능력을 고려하여 평가한다.]\n\n[제4절 참고 - 위법성 인식 조문] 형법 제16조(법률의 착오): 자기의 행위가 법령에 의하여 죄가 되지 아니하는 것으로 오인한 행위는 그 오인에 정당한 이유가 있는 때에 한하여 벌하지 아니한다.", "책임론"],
["447", "★ 형법 제16조와 관련하여, 법률의 착오에 있어 정당한 이유가 있는지 여부는 행위자의 지적 능력과 관계없이 평가하여야 한다.", false, "▸ (2021도10903) [행위자의 지적 능력을 고려하여 평가한다.]\n\n[제4절 참고 - 위법성 인식 조문] 형법 제16조(법률의 착오): 자기의 행위가 법령에 의하여 죄가 되지 아니하는 것으로 오인한 행위는 그 오인에 정당한 이유가 있는 때에 한하여 벌하지 아니한다.", "책임론"],
["448", "★ 「형법」 제16조의 '정당한 이유' 심사는 행위자에게 자기 행위의 위법가능성에 대해 심사숙고하거나 조회할 수 있는 계기가 있어 자신의 지적능력을 다하여 이를 회피하기 위한 진지한 노력을 다하였을 것을 전제로 하고, 이때 필요한 노력의 정도는 구체적인 행위정황과 행위자 개인의 인식능력은 고려하되 행위자가 속한 사회집단에 따라 달리 평가할 것은 아니다.[변25]", false, "▸ 위법성의 인식에 필요한 노력의 정도는 구체적인 행위정황과 행위자 개인의 인식능력, 행위자가 속한 사회집단에 따라 달리 평가되어야 한다(2021도10903).\n\n[제4절 참고 - 위법성 인식 조문] 형법 제16조(법률의 착오): 자기의 행위가 법령에 의하여 죄가 되지 아니하는 것으로 오인한 행위는 그 오인에 정당한 이유가 있는 때에 한하여 벌하지 아니한다.", "책임론"],
["449", "★ 법률 위반 행위 중간에 일시적으로라도 판례에 따라 그 행위가 처벌대상이 되지 않는 것으로 해석된 적이 있었다면, 이를 조회한 행위자로서는 자신의 행위가 처벌되지 않는 것으로 믿은 데에 정당한 이유가 있어 책임이 조각된다.[변26]", false, "▸ 법률 위반 행위 중간에 일시적으로 판례에 따라 그 행위가 처벌대상이 되지 않는 것으로 해석되었던 적이 있었다고 하더라도 그것만으로 자신의 행위가 처벌되지 않는 것으로 믿은 데에 정당한 이유가 있다고 할 수 없다(2021도10903).\n\n[제4절 참고 - 위법성 인식 조문] 형법 제16조(법률의 착오): 자기의 행위가 법령에 의하여 죄가 되지 아니하는 것으로 오인한 행위는 그 오인에 정당한 이유가 있는 때에 한하여 벌하지 아니한다.", "책임론"],
["450", "변호사 자격을 가진 국회의원 甲이 선거에 영향을 미칠 수 있는 내용이 포함된 의정보고서를 발간하는 과정에서 보좌관을 통해 관할 선거관리위원회 직원에게 구두로 문의하여 답변을 받은 결과 그 의정보고서를 발간하는 것이 선거법규에 저촉되지 않는다고 오인한 경우, 형법 제16조의 정당한 이유가 인정되지 않는다.[변14]", true, "▸ 피고인은 변호사 자격을 가진 국회의원으로서 법률전문가라고 할 수 있는바(더구나 피고인은 헌법소원을 제기하고 헌법재판소의 판단을 받은 바 있다), 관할 선거관리위원회의 지도계장에게 구두로 문의를 하였을 뿐 관할 선거관리위원회에 정식으로 질의를 하여 공식적인 답신을 받은 것도 아니므로, 자신의 지적 능력을 다하여 이를 회피하기 위한 진지한 노력을 다하였다고 볼 수 없어 정당한 이유가 있다고 하기 어렵다(2005도3717).\n\n[제4절 참고 - 위법성 인식 조문] 형법 제16조(법률의 착오): 자기의 행위가 법령에 의하여 죄가 되지 아니하는 것으로 오인한 행위는 그 오인에 정당한 이유가 있는 때에 한하여 벌하지 아니한다.", "책임론"],
["451", "부동산중개업자가 부동산중개업협회의 자문을 통하여 인원 수 제한 없이 중개보조원을 채용하는 것이 허용되는 것으로 믿고서 제한인원을 초과하여 중개보조원을 채용함으로써 부동산중개업법 위반행위에 이르게 되었다면 이는 자신의 행위가 법령에 저촉되지 않는 것으로 오인함에 정당한 이유가 있는 경우에 해당한다.", false, "▸ 그러한 사정만으로 자신의 행위가 법령에 저촉되지 않는 것으로 오인함에 정당한 이유가 있는 경우에 해당한다거나 범의가 없었다고 볼 수는 없다(2000도2943).\n\n[제4절 참고 - 위법성 인식 조문] 형법 제16조(법률의 착오): 자기의 행위가 법령에 의하여 죄가 되지 아니하는 것으로 오인한 행위는 그 오인에 정당한 이유가 있는 때에 한하여 벌하지 아니한다.", "책임론"],
["452", "★ 법원의 무죄판결을 신뢰하여 행위한 경우에는 법률의 착오에 정당한 이유가 있는 것으로 인정될 수 있으나, 검사의 혐의 없음 불기소처분을 믿고 행위한 경우에는 검사의 불기소처분에는 확정력이 없으므로 법률의 착오에 정당한 이유가 있는 것으로 인정될 수 없다.[변16]", false, "▸ ① 피고인이 대법원의 판례에 비추어 자신의 행위가 무허가 의약품의 제조·판매행위에 해당하지 아니하는 것으로 오인하였다고 하더라도, 이는 사안을 달리하는 사건에 관한 대법원의 판례의 취지를 오해하였던 것에 불과하여 그와 같은 사정만으로는 그 오인에 정당한 사유가 있다고 볼 수 없다(95도1081). ② 가감삼십전대보초와 한약 가지수에만 차이가 있는 십전대보초를 제조하고 그 효능에 관하여 광고를 한 사실에 대하여 이전에 검찰의 혐의없음 결정을 받은 적이 있다면, 피고인이 비록 한의사·약사·한약업사 면허나 의약품판매업 허가가 없이 의약품인 가감삼십전대보초를 판매하였다고 하더라도 자기의 행위가 법령에 의하여 죄가 되지 않는 것으로 믿을 수밖에 없었고, 또 그렇게 오인함에 있어서 정당한 이유가 있는 경우에 해당한다(95도717).\n\n[제4절 참고 - 위법성 인식 조문] 형법 제16조(법률의 착오): 자기의 행위가 법령에 의하여 죄가 되지 아니하는 것으로 오인한 행위는 그 오인에 정당한 이유가 있는 때에 한하여 벌하지 아니한다.", "책임론"],
["453", "검사가 피고인들의 행위에 대하여 범죄혐의가 없다고 무혐의 처리하였다가 곧바로 고소인의 항고를 받아들여 재기수사명령에 의한 재수사 결과 기소에 이른 경우, 그 무혐의처분 이후 이루어진 피고인의 위반 행위는 죄가 되지 아니하는 것으로 오인한 데 정당한 이유가 있는 경우에 해당한다.", false, "▸ 피고인들의 행위가 불기소처분 이전부터 저질러졌다면 그 무혐의 처분결정을 믿고 이에 근거하여 이루어진 것이 아님이 명백하고, 무혐의 처분일 이후에 이루어진 행위에 대하여도 그 무혐의 처분에 대하여 곧바로 고소인의 항고가 받아들여져 재기수사명령에 따라 재수사되어 기소에 이르게 된 이상, 정당한 이유가 있었다고 할 수 없다(94도1793).\n\n[제4절 참고 - 위법성 인식 조문] 형법 제16조(법률의 착오): 자기의 행위가 법령에 의하여 죄가 되지 아니하는 것으로 오인한 행위는 그 오인에 정당한 이유가 있는 때에 한하여 벌하지 아니한다.", "책임론"],
["454", "건설폐기물처리시설의 설치·운영에 관한 질의회신에 따라 자기의 행위가 죄가 되지 아니한다고 오인하였다고 하더라도, 행정관청의 질의회신을 자기에게 유리하게 잘못 해석한 것에 불과한 경우에는 정당한 이유가 있는 법률의 착오에 해당한다고 볼 수 없다.", true, "▸ [AI해설] 건설폐기물처리시설의 설치·운영에 관한 질의회신에 따라 자기의 행위가 죄가 되지 아니한다고 오인하였다고 하더라도, 행정관청의 질의회신을 자기에게 유리하게 잘못 해석한 것에 불과한 경우에는 정당한 이유가 있는 법률의 착오에 해당한다고 볼 수 없다는 것이 판례의 태도이다(2008도8607).\n\n[제4절 참고 - 위법성 인식 조문] 형법 제16조(법률의 착오): 자기의 행위가 법령에 의하여 죄가 되지 아니하는 것으로 오인한 행위는 그 오인에 정당한 이유가 있는 때에 한하여 벌하지 아니한다.", "책임론"],
["455", "피고인이 도시정비법상 정비사업 관련 자료의 열람·복사 허용에 관한 의무조항과 관련하여 조합의 자문변호사로부터 조합원의 전화번호와 신축건물 동호수 배정 결과를 공개하지 않는 것이 좋겠다는 취지의 답변을 받은 경우에는, 법률전문가인 변호사의 자문을 신뢰한 것이므로 자신의 행위가 도시정비법 위반의 범죄가 되지 않는다고 오인한 것에 정당한 이유가 인정된다.", false, "▸ 피고인이 조합의 자문변호사로부터 조합원의 전화번호와 신축건물 동호수 배정 결과를 공개하지 않는 것이 좋겠다는 취지의 답변을 받았더라도, 이는 자문변호사 개인의 독자적 견해에 불과하고 도시정비법의 전체적 규율 내용에 관한 면밀한 검토와 체계적 해석에 터 잡은 법률해석으로는 보이지 않으며, 피고인의 직업·경력·사회적 지위 등을 고려할 때 피고인이 변호사의 자문을 받았다는 사정만으로 자신의 행위가 죄가 되지 않는다고 오인한 것에 정당한 이유가 있다고 보기는 어렵다(2019도18700).\n\n[제4절 참고 - 위법성 인식 조문] 형법 제16조(법률의 착오): 자기의 행위가 법령에 의하여 죄가 되지 아니하는 것으로 오인한 행위는 그 오인에 정당한 이유가 있는 때에 한하여 벌하지 아니한다.", "책임론"],
["456", "★ 피고인이 복싱 클럽 관장과 회원인 피해자(17세)의 몸싸움을 지켜보던 중 피해자가 왼손을 주머니에 넣어 휴대용 녹음기를 꺼내어 움켜쥐자 호신용 작은 칼을 꺼내는 것으로 오인하여 이를 확인하기 위하여 피해자의 왼손 주먹을 강제로 펴게 함으로써 피해자 약 4주간의 치료가 필요한 좌 제4수지 중위지골 골절의 상해를 가한 경우, 판례에 의하면 피고인의 오인에 정당한 이유가 있다면 위법성은 인정되지만 책임이 조각되어 피고인은 처벌되지 않는다.", false, "▸ (2023도10768) [① 판례에 의하면 오인에 정당한 이유가 있는 경우 위법성이 조각된다. ② 엄격책임설에 의하면, 형법 제16조가 적용되어 오인에 정당한 이유가 있는 경우 책임이 조각된다. ③ 법효과제한책임설에 의하면, 책임고의가 조각되어 고의책임을 지지 않는다.]\n\n[제5절 참고 - 위법성조각사유의 전제사실의 착오(위전착) 학설] ① 소극적 구성요건요소이론: 위법성조각사유는 소극적 구성요건요소이므로 이에 대한 착오는 불법고의를 조각한다. ② 유추적용제한책임설(구성요건착오유추적용설): 구성요건적 착오 규정을 유추적용하여 불법고의가 조각된다. ③ 법효과제한책임설: 구성요건적 고의는 인정되지만 책임고의가 탈락하여 고의범으로 처벌할 수 없고 책임단계에서 법효과만 제한하여 과실범으로 처벌한다. ④ 엄격책임설: 금지착오에 해당하여 형법 제16조를 적용한다. ⑤ 판례: 착오에 '정당한 이유'가 있으면 '위법성'이 조각된다(68도370 등). [악의가담자의 책임] 소극적구성요건요소이론·유추적용제한책임설: 불법고의가 조각되므로 의사지배가 있으면 간접정범이 성립할 수 있으나 교사·방조범은 성립할 수 없다(제한적 종속형식). 판례: 정당한 이유가 있으면 위법성이 조각되어 간접정범만 가능, 정당한 이유가 없으면 고의범으로 처벌되어 교사·방조범만 가능. 법효과제한책임설: 고의책임을 조각하고 과실범만 성립 가능하므로 의사지배 유무에 따라 간접정범 또는 교사·방조범이 성립. 엄격책임설: 정당한 이유가 있으면 고의책임이 조각되어 의사지배 유무에 따라 간접정범 또는 교사·방조범, 정당한 이유가 없으면 고의범으로 처벌되어 교사·방조범만 가능.", "책임론"],

["459", "★ 甲이 중대장의 허가를 받지 않고 관사이탈을 하였으나 甲은 당번병으로서의 그 임무범위에 속하는 일로 오인하였고 그 오인에 정당한 이유가 있었다고 하더라도 범죄가 성립한다.", false, "▸ 중대장의 지시에 따라 관사를 지키고 있던 중 중대장의 처로부터 비가 오고 밤이 늦어 혼자 귀가할 수 없으니 관사로부터 1.5킬로미터가량 떨어진 지점까지 우산을 들고 마중을 나오라는 연락을 받고 당번병으로서 당연히 해야 할 일로 생각하고 그 지점까지 나가 동인을 마중하여 귀가하였다면, 당번병의 관사이탈 행위는 당번병으로서의 그 임무범위 내에 속하는 일로 오인하고 한 행위로서 그 오인에 정당한 이유가 있어 위법성이 없다(86도1406).\n\n[제5절 참고 - 위법성조각사유의 전제사실의 착오(위전착) 학설] ① 소극적 구성요건요소이론: 위법성조각사유는 소극적 구성요건요소이므로 이에 대한 착오는 불법고의를 조각한다. ② 유추적용제한책임설(구성요건착오유추적용설): 구성요건적 착오 규정을 유추적용하여 불법고의가 조각된다. ③ 법효과제한책임설: 구성요건적 고의는 인정되지만 책임고의가 탈락하여 고의범으로 처벌할 수 없고 책임단계에서 법효과만 제한하여 과실범으로 처벌한다. ④ 엄격책임설: 금지착오에 해당하여 형법 제16조를 적용한다. ⑤ 판례: 착오에 '정당한 이유'가 있으면 '위법성'이 조각된다(68도370 등). [악의가담자의 책임] 소극적구성요건요소이론·유추적용제한책임설: 불법고의가 조각되므로 의사지배가 있으면 간접정범이 성립할 수 있으나 교사·방조범은 성립할 수 없다(제한적 종속형식). 판례: 정당한 이유가 있으면 위법성이 조각되어 간접정범만 가능, 정당한 이유가 없으면 고의범으로 처벌되어 교사·방조범만 가능. 법효과제한책임설: 고의책임을 조각하고 과실범만 성립 가능하므로 의사지배 유무에 따라 간접정범 또는 교사·방조범이 성립. 엄격책임설: 정당한 이유가 있으면 고의책임이 조각되어 의사지배 유무에 따라 간접정범 또는 교사·방조범, 정당한 이유가 없으면 고의범으로 처벌되어 교사·방조범만 가능.", "책임론"],
["460", "★ 甲은 야생 멧돼지에게 쫓기던 중 乙의 집을 발견하고 뛰어들어가 몸을 숨겨 위기를 모면하였다. 집주인 乙은 甲을 도둑으로 오인하여, 그를 쫓아내려는 의도로 \"도둑이야!\"라고 외쳤다. 甲이 자초지종을 설명하려고 다가가자 乙은 자신을 공격하려는 것으로 오인하여 가슴을 힘껏 밀어 넘어뜨렸다. 이 사안에서 乙이 오인한 점에 대하여는 정당한 이유가 인정된다면 엄격책임설에 따르면 乙의 행위는 폭행의 구성요건적 고의뿐만 아니라 위법성의 인식도 부정되지는 않으므로 폭행죄가 인정된다.[변12]", false, "▸ ① 엄격책임설에 의하면, 착오에 정당한 이유가 있으면 책임이 조각된다. 따라서 무죄에 해당한다. ② 유추적용제한책임설에 의하면, 불법고의가 조각되므로 구성요건해당성이 없어 무죄에 해당한다. ③ 법효과제한책임설에 의하면, 구성요건적 고의는 인정되지만, 책임고의가 조각되어 무죄에 해당한다.\n\n[제5절 참고 - 위법성조각사유의 전제사실의 착오(위전착) 학설] ① 소극적 구성요건요소이론: 위법성조각사유는 소극적 구성요건요소이므로 이에 대한 착오는 불법고의를 조각한다. ② 유추적용제한책임설(구성요건착오유추적용설): 구성요건적 착오 규정을 유추적용하여 불법고의가 조각된다. ③ 법효과제한책임설: 구성요건적 고의는 인정되지만 책임고의가 탈락하여 고의범으로 처벌할 수 없고 책임단계에서 법효과만 제한하여 과실범으로 처벌한다. ④ 엄격책임설: 금지착오에 해당하여 형법 제16조를 적용한다. ⑤ 판례: 착오에 '정당한 이유'가 있으면 '위법성'이 조각된다(68도370 등). [악의가담자의 책임] 소극적구성요건요소이론·유추적용제한책임설: 불법고의가 조각되므로 의사지배가 있으면 간접정범이 성립할 수 있으나 교사·방조범은 성립할 수 없다(제한적 종속형식). 판례: 정당한 이유가 있으면 위법성이 조각되어 간접정범만 가능, 정당한 이유가 없으면 고의범으로 처벌되어 교사·방조범만 가능. 법효과제한책임설: 고의책임을 조각하고 과실범만 성립 가능하므로 의사지배 유무에 따라 간접정범 또는 교사·방조범이 성립. 엄격책임설: 정당한 이유가 있으면 고의책임이 조각되어 의사지배 유무에 따라 간접정범 또는 교사·방조범, 정당한 이유가 없으면 고의범으로 처벌되어 교사·방조범만 가능.", "책임론"],

["464", "★ 甲이 지하철에서 옆 사람이 손잡이를 잡기 위해 팔을 올리는 것을 성추행하는 것으로 경솔하게 오인하여 그 손을 쳐서 전치 4주의 상해를 입힌 경우, 甲의 착오에 대한 엄격책임설과 제한적 책임설의 결론은 동일하다.[변14]", false, "▸ ① 엄격책임설에 의하면 형법 제16조를 적용하여 착오에 정당한 이유가 없으면 甲에게 상해죄가 성립하고, 과실이 없으면 상해죄는 물론 과실치상죄도 성립하지 않는다. ② 법효과제한책임설에 의하면 책임고의가 조각되므로, 甲에게는 상해죄가 성립하지 않고, 과실이 있는 경우 과실치상죄만 성립할 수 있다. ③ 유추적용제한책임설은 불법고의가 조각되므로 甲에게는 상해죄가 성립하지 않고, 과실이 있는 경우 과실치상죄만 성립할 수 있다. ④ 甲은 경솔하게 오인하였으므로 착오에 정당한 이유가 없고, 과실이 존재한다. 따라서 엄격책임설에 의하면 상해죄, 법효과제한책임설 및 유추적용제한책임설에 의하면 과실치상죄가 성립한다.\n\n[제5절 참고 - 위법성조각사유의 전제사실의 착오(위전착) 학설] ① 소극적 구성요건요소이론: 위법성조각사유는 소극적 구성요건요소이므로 이에 대한 착오는 불법고의를 조각한다. ② 유추적용제한책임설(구성요건착오유추적용설): 구성요건적 착오 규정을 유추적용하여 불법고의가 조각된다. ③ 법효과제한책임설: 구성요건적 고의는 인정되지만 책임고의가 탈락하여 고의범으로 처벌할 수 없고 책임단계에서 법효과만 제한하여 과실범으로 처벌한다. ④ 엄격책임설: 금지착오에 해당하여 형법 제16조를 적용한다. ⑤ 판례: 착오에 '정당한 이유'가 있으면 '위법성'이 조각된다(68도370 등). [악의가담자의 책임] 소극적구성요건요소이론·유추적용제한책임설: 불법고의가 조각되므로 의사지배가 있으면 간접정범이 성립할 수 있으나 교사·방조범은 성립할 수 없다(제한적 종속형식). 판례: 정당한 이유가 있으면 위법성이 조각되어 간접정범만 가능, 정당한 이유가 없으면 고의범으로 처벌되어 교사·방조범만 가능. 법효과제한책임설: 고의책임을 조각하고 과실범만 성립 가능하므로 의사지배 유무에 따라 간접정범 또는 교사·방조범이 성립. 엄격책임설: 정당한 이유가 있으면 고의책임이 조각되어 의사지배 유무에 따라 간접정범 또는 교사·방조범, 정당한 이유가 없으면 고의범으로 처벌되어 교사·방조범만 가능.", "책임론"],

["466", "★ 甲은 乙과 丙을 횡령과 모욕의 범죄사실로 고소하였다. 이후 甲은 도로상에서 만난 丙이 \"왜 나를 고소했느냐?\"라고 따지면서 대들자 마침 그곳을 지나가는 동생 丁에게 \"강도인 저 사람이 칼을 갖고 형을 협박하니 좀 때려라.\"라고 하면서 상해의 고의로 옆에 있던 위험한 물건인 몽둥이를 건네주었고, 甲의 말만 믿은 丁은 甲을 방위할 의사로 丙에게 약 3주간의 치료를 요하는 상해를 가하였다. 丁이 丙을 강도로 오인한 데 대하여 정당한 이유가 인정되지 않는 경우, 엄격책임설에 의하면 甲은 특수상해죄의 교사범이 성립한다.[변18]", true, "▸ 丁이 丙을 강도로 오인한 데 정당한 이유가 인정되지 않는 경우, 엄격책임설에 의하면 丁은 책임이 조각되지 않으므로 특수상해죄, 甲은 특수상해교사죄가 성립한다.\n\n[제5절 참고 - 위법성조각사유의 전제사실의 착오(위전착) 학설] ① 소극적 구성요건요소이론: 위법성조각사유는 소극적 구성요건요소이므로 이에 대한 착오는 불법고의를 조각한다. ② 유추적용제한책임설(구성요건착오유추적용설): 구성요건적 착오 규정을 유추적용하여 불법고의가 조각된다. ③ 법효과제한책임설: 구성요건적 고의는 인정되지만 책임고의가 탈락하여 고의범으로 처벌할 수 없고 책임단계에서 법효과만 제한하여 과실범으로 처벌한다. ④ 엄격책임설: 금지착오에 해당하여 형법 제16조를 적용한다. ⑤ 판례: 착오에 '정당한 이유'가 있으면 '위법성'이 조각된다(68도370 등). [악의가담자의 책임] 소극적구성요건요소이론·유추적용제한책임설: 불법고의가 조각되므로 의사지배가 있으면 간접정범이 성립할 수 있으나 교사·방조범은 성립할 수 없다(제한적 종속형식). 판례: 정당한 이유가 있으면 위법성이 조각되어 간접정범만 가능, 정당한 이유가 없으면 고의범으로 처벌되어 교사·방조범만 가능. 법효과제한책임설: 고의책임을 조각하고 과실범만 성립 가능하므로 의사지배 유무에 따라 간접정범 또는 교사·방조범이 성립. 엄격책임설: 정당한 이유가 있으면 고의책임이 조각되어 의사지배 유무에 따라 간접정범 또는 교사·방조범, 정당한 이유가 없으면 고의범으로 처벌되어 교사·방조범만 가능.", "책임론"],

["468", "★ 혼잡한 놀이동산에서 남성 甲은 여성 A(21세)를 자신의 여자친구로 착각하고 놀라게 할 목적으로 양팔을 높이 들어 가까이 접근해 뒤에서 갑자기 껴안으려 하였다. 간식을 사 오다 이 광경을 목격한 A의 남자친구 乙은 甲이 A를 성추행하려 한다고 오해하여 다짜고짜 발로 甲의 복부를 1회 가격하여 甲에게 장파열상을 입게 하였다. 만약 甲에 대한 乙의 착오를 위법성조각사유의 전제사실에 관한 착오로 보고 엄격책임설에 따라 해결하면, 乙의 행위는 위법성이 인정되고 다만 「형법」 제16조의 정당한 이유가 있는 경우에 한하여 책임이 조각된다.[변25]", true, "▸ ① 엄격책임설에 의하면 착오에 정당한 이유가 있으면 책임이 조각된다. ② 엄격책임설에 의하면 乙의 착오에 정당한 이유가 있으면 乙은 고의책임이 조각되므로, 악의가담자인 丙의 의사지배가 인정되면 간접정범, 의사지배가 인정되지 않으면 교사·방조범이 성립할 수 있다. 만약 乙의 착오에 정당한 이유가 없으면 乙은 고의범으로 처벌되므로, 丙에게 간접정범은 성립할 수 없고, 교사·방조범만 성립할 수 있다.\n\n[제5절 참고 - 위법성조각사유의 전제사실의 착오(위전착) 학설] ① 소극적 구성요건요소이론: 위법성조각사유는 소극적 구성요건요소이므로 이에 대한 착오는 불법고의를 조각한다. ② 유추적용제한책임설(구성요건착오유추적용설): 구성요건적 착오 규정을 유추적용하여 불법고의가 조각된다. ③ 법효과제한책임설: 구성요건적 고의는 인정되지만 책임고의가 탈락하여 고의범으로 처벌할 수 없고 책임단계에서 법효과만 제한하여 과실범으로 처벌한다. ④ 엄격책임설: 금지착오에 해당하여 형법 제16조를 적용한다. ⑤ 판례: 착오에 '정당한 이유'가 있으면 '위법성'이 조각된다(68도370 등). [악의가담자의 책임] 소극적구성요건요소이론·유추적용제한책임설: 불법고의가 조각되므로 의사지배가 있으면 간접정범이 성립할 수 있으나 교사·방조범은 성립할 수 없다(제한적 종속형식). 판례: 정당한 이유가 있으면 위법성이 조각되어 간접정범만 가능, 정당한 이유가 없으면 고의범으로 처벌되어 교사·방조범만 가능. 법효과제한책임설: 고의책임을 조각하고 과실범만 성립 가능하므로 의사지배 유무에 따라 간접정범 또는 교사·방조범이 성립. 엄격책임설: 정당한 이유가 있으면 고의책임이 조각되어 의사지배 유무에 따라 간접정범 또는 교사·방조범, 정당한 이유가 없으면 고의범으로 처벌되어 교사·방조범만 가능.", "책임론"],

["470", "★ 피고인에게 적법행위를 기대할 가능성이 있는지 여부를 판단하기 위하여는 행위 당시의 구체적인 상황하에 행위자 대신에 사회적 평균인을 두고 이 평균인의 관점에서 그 기대가능성 유무를 판단하여야 한다.[변12]", true, "▸ [AI해설] 피고인에게 적법행위를 기대할 가능성이 있는지 여부를 판단하기 위하여는 행위 당시의 구체적인 상황하에 행위자 대신에 사회적 평균인을 두고 이 평균인의 관점에서 그 기대가능성 유무를 판단하여야 한다는 것이 판례의 태도이다(2005도10101).", "책임론"],

["472", "임금 등 지급의무의 존부와 범위에 관하여 다툴 만한 근거가 있다면 사용자가 그 임금 등을 지급하지 않은 데에 상당한 이유가 있다고 보아야 하므로, 사용자에게 근로기준법 제109조 제1항, 제36조 위반의 고의가 있었다고 보기 어렵다.", true, "▸ 임금 등 지급의무의 존부와 범위에 관하여 다툴 만한 근거가 있다면 사용자가 그 임금 등을 지급하지 않은 데에 상당한 이유가 있다고 보아야 하므로, 사용자에게 근로기준법 위반의 고의가 있었다고 보기 어렵다(2022도2188).", "책임론"],
["473", "★ 직장의 상사가 범법행위를 하는 데 가담한 부하가 그 상사와 직무상 지휘·복종관계에 있는 경우, 부하에게는 상사의 범법행위에 가담하지 않을 기대가능성이 없다.[변23]", false, "▸ 직장의 상사가 범법행위를 하는데 가담한 부하에게 직무상 지휘복종관계에 있다하여 범법행위에 가담하지 않을 기대가능성이 없다고 할 수 없다(99도1911).", "책임론"],
["474", "★ 현역입영 또는 소집통지서를 받고도 정당한 사유 없이 이에 응하지 않은 사람을 처벌하는 「병역법」 제88조 제1항에서의 정당한 사유는 책임조각사유인 기대불가능성을 말하는 것이다.", false, "▸ 병역법 제88조 제1항은 국방의 의무를 실현하기 위하여 현역입영 또는 소집통지서를 받고도 정당한 사유 없이 이에 응하지 않은 사람을 처벌함으로써 입영기피를 억제하고 병력구성을 확보하기 위한 규정이다. 위 조항에 따르면 정당한 사유가 있는 경우에는 피고인을 벌할 수 없는데, 여기에서 정당한 사유는 구성요건 해당성을 조각하는 사유이다. 이는 형법상 위법성조각사유인 정당행위나 책임조각사유인 기대불가능성과는 구별된다(2016도10912).", "책임론"],
["475", "형법 제12조(강요된 행위)는 적법행위의 기대가능성이 없으므로 책임조각이 인정되는 규정이라고 할 수 있다.[변12]", true, "▸ [AI해설] 형법 제12조(강요된 행위)는 적법행위의 기대가능성이 없으므로 책임이 조각되는 규정이라는 것이 판례의 취지이다(83도2543 취지).\n\n[제6절 참고 - 강요된 행위 조문] 형법 제12조(강요된 행위): 저항할 수 없는 폭력이나 자기 또는 친족의 생명, 신체에 대한 위해를 방어할 방법이 없는 협박에 의하여 강요된 행위는 벌하지 아니한다.", "책임론"],
["476", "★ 「형법」 제12조(강요된 행위)의 '저항할 수 없는 폭력'이란 윤리적 의미에서 강압된 경우가 아니라 심리적 의미에서 육체적으로 어떤 행위를 절대적으로 하지 아니할 수 없게 하는 경우를 말한다.[변17]", false, "▸ 형법 제12조 소정의 저항할 수 없는 폭력은, 심리적인 의미에 있어서 육체적으로 어떤 행위를 절대적으로 하지 아니할 수 없게 하는 경우와 윤리적 의미에 있어서 강압된 경우를 말하고, 협박이란 자기 또는 친족의 생명, 신체에 대한 위해를 달리 막을 방법이 없는 협박을 말하며, 강요라 함은 피강요자의 자유스런 의사결정을 하지 못하게 하면서 특정한 행위를 하게 하는 것을 말한다(83도2276).\n\n[제6절 참고 - 강요된 행위 조문] 형법 제12조(강요된 행위): 저항할 수 없는 폭력이나 자기 또는 친족의 생명, 신체에 대한 위해를 방어할 방법이 없는 협박에 의하여 강요된 행위는 벌하지 아니한다.", "책임론"],
["477", "장애미수는 형의 임의적 감경사유, 중지미수는 필요적 감면사유, 불능미수는 임의적 감면사유이다.", true, "▸ 형법 제25조, 제26조, 제27조\n\n[제1절 참고 - 미수범 조문] 형법 제25조(미수범) ① 범죄의 실행에 착수하여 행위를 종료하지 못하였거나 결과가 발생하지 아니한 때에는 미수범으로 처벌한다. ② 미수범의 형은 기수범보다 감경할 수 있다.", "미수론"],
["478", "범죄의 실행에 착수하여 행위를 종료하지 못하였거나 결과가 발생하지 아니한 경우는 해당 죄에 미수범 처벌규정이 없더라도 그 행위를 미수범으로 처벌할 수 있다.", false, "▸ 미수범을 처벌할 죄는 각칙의 해당 죄에서 정한다(제29조). [미수범 처벌규정이 있어야 미수범으로 처벌할 수 있다.]\n\n[제1절 참고 - 미수범 조문] 형법 제25조(미수범) ① 범죄의 실행에 착수하여 행위를 종료하지 못하였거나 결과가 발생하지 아니한 때에는 미수범으로 처벌한다. ② 미수범의 형은 기수범보다 감경할 수 있다.", "미수론"],
["479", "미수범 처벌근거에 대한 학설 중 주관설에 의할 경우 미수와 기수는 동일하게 처벌되어야 한다.[변18]", true, "▸ 주관설은 미수범의 처벌근거를 법적대적 의사로 보는 견해이다. 이 견해에 의하면 미수와 기수는 법적대적 의사가 동일하므로 동일하게 처벌되어야 한다.\n\n[제1절 참고 - 미수범 조문] 형법 제25조(미수범) ① 범죄의 실행에 착수하여 행위를 종료하지 못하였거나 결과가 발생하지 아니한 때에는 미수범으로 처벌한다. ② 미수범의 형은 기수범보다 감경할 수 있다.", "미수론"],
["480", "★ 미수범은 구성요건의 객관적 요소가 하나라도 충족되지 아니한 때에 성립하는 것으로, 현행법상 고의범은 물론이고 과실범에 대해서도 성립될 수 있다.[변15]", false, "▸ 미수는 고의범에서만 문제된다. 과실범의 미수범을 처벌하는 규정은 없다.\n\n[제1절 참고 - 미수범 조문] 형법 제25조(미수범) ① 범죄의 실행에 착수하여 행위를 종료하지 못하였거나 결과가 발생하지 아니한 때에는 미수범으로 처벌한다. ② 미수범의 형은 기수범보다 감경할 수 있다.", "미수론"],
["481", "미수범이 성립하기 위해서는 확정적으로 행위의사가 있어야 하나 행위의사가 확정적이면 그 실행이 일정한 조건의 발생에 좌우되는 때에도 고의는 인정된다.[변16]", true, "▸ 행위의사는 무조건적 확정적인 실현의사가 있어야 하지만, 그 실행이 조건의 발생에 좌우되는 것은 관계 없다.\n\n[제1절 참고 - 미수범 조문] 형법 제25조(미수범) ① 범죄의 실행에 착수하여 행위를 종료하지 못하였거나 결과가 발생하지 아니한 때에는 미수범으로 처벌한다. ② 미수범의 형은 기수범보다 감경할 수 있다.", "미수론"],
["482", "목적과 같은 초과주관적 요소가 필요한 범죄에 있어서는 그 미수범의 성립에 있어서도 초과주관적 요소가 구비되어야 한다.[변18]", true, "▸ 고의 이외에 목적, 동기, 불법영득의사 등 초과주관적 구성요건요소가 필요한 범죄의 경우 미수범도 이 요소를 구비해야 한다.\n\n[제1절 참고 - 미수범 조문] 형법 제25조(미수범) ① 범죄의 실행에 착수하여 행위를 종료하지 못하였거나 결과가 발생하지 아니한 때에는 미수범으로 처벌한다. ② 미수범의 형은 기수범보다 감경할 수 있다.", "미수론"],
["483", "거동범에서는 미수 중 범죄의 실행에 착수하였으나 행위를 종료하지 못한 '착수미수(미종료미수)'는 인정되지만, 범죄의 실행에 착수하여 행위는 종료하였으나 결과가 발생하지 아니한 '실행미수(종료미수)'는 인정되지 않는다.[모25]", true, "▸ 거동범은 결과의 발생을 요하지 않고 일정한 구성요건적 행위만으로 구성요건을 충족하는 범죄(기수)를 말한다. 따라서 거동범의 경우에는 범죄의 실행에 착수하여 행위는 종료하였으나 결과가 발생하지 아니한 실행미수는 인정되지 않는다.\n\n[제1절 참고 - 미수범 조문] 형법 제25조(미수범) ① 범죄의 실행에 착수하여 행위를 종료하지 못하였거나 결과가 발생하지 아니한 때에는 미수범으로 처벌한다. ② 미수범의 형은 기수범보다 감경할 수 있다.", "미수론"],
["484", "★ 피고인이 신고하지 않은 400만 엔이 들어 있는 휴대용 가방을 보안검색대에 올려놓거나 이를 휴대하고 통과하지 않더라도 공항 내에서 탑승을 기다리고 있던 중에 체포된 경우라면 이미 외국환거래법이 규정한 국외반출죄의 실행의 착수는 인정된다.[변14]", false, "▸ ① 외국환거래법 제28조 제1항 제3호에서 규정하는, 신고를 하지 아니하거나 허위로 신고하고 지급수단·귀금속 또는 증권을 수출하는 행위는 지급수단 등을 국외로 반출하기 위한 행위에 근접·밀착하는 행위가 행하여진 때에 그 실행의 착수가 있다. ② 500만 엔을 기탁화물로 부치려고 한 경우에는 기탁화물로 부칠 때 이미 국외로 반출하기 위한 행위에 근접·밀착한 행위가 이루어졌다고 보아 실행의 착수가 있었다. ③ 그러나 피고인이 휴대용 가방에 넣어 비행기에 탑승하려고 한 경우 그 휴대용 가방을 보안검색대에 올려 놓거나 이를 휴대하고 통과하는 때에 비로소 실행의 착수가 있다. 피고인이 휴대용 가방을 가지고 보안검색대에 나아가지 않은 채 공항 내에서 탑승을 기다리고 있던 중에 체포되었다면 일화 400만 엔에 대하여는 실행의 착수가 있다고 볼 수 없다(2000도4298).\n\n[제1절 참고 - 미수범 조문] 형법 제25조(미수범) ① 범죄의 실행에 착수하여 행위를 종료하지 못하였거나 결과가 발생하지 아니한 때에는 미수범으로 처벌한다. ② 미수범의 형은 기수범보다 감경할 수 있다.", "미수론"],
["485", "★ 필로폰을 매수하려는 자로부터 필로폰을 구해 달라는 부탁과 함께 금전을 지급받았다면, 당시 피고인이 필로폰을 소지 또는 입수한 상태에 있었거나 그것이 가능하였다는 등 매매행위에 근접·밀착한 상태에서 그 대금을 지급받은 것이 아니라 단순히 필로폰을 구해 달라는 부탁과 함께 대금 명목으로 금전을 지급받은 것에 불과하다고 하더라도, 필로폰 매매행위의 실행을 착수한 것으로 볼 수 있다.", false, "▸ 피고인이 필로폰을 소지 또는 입수한 상태에 있었거나 그것이 가능하였다는 등 매매행위에 근접·밀착한 상태에서 그 대금을 지급받은 것이 아니라 단순히 필로폰을 구해 달라는 부탁과 함께 대금 명목으로 금전을 지급받은 것에 불과한 경우에는 필로폰 매매행위의 실행의 착수에 이른 것이라고 볼 수 없다(2014도16920).\n\n[제1절 참고 - 미수범 조문] 형법 제25조(미수범) ① 범죄의 실행에 착수하여 행위를 종료하지 못하였거나 결과가 발생하지 아니한 때에는 미수범으로 처벌한다. ② 미수범의 형은 기수범보다 감경할 수 있다.", "미수론"],
["486", "★ 피고인이 격분하여 피해자를 살해할 것을 마음먹고 밖으로 나가 낫을 들고 피해자에게 다가서려고 하였으나 제3자 이를 제지하여 그 틈을 타서 피해자가 도망함으로써 살인의 목적을 이루지 못한 경우 살인미수에 해당한다.", true, "▸ 피고인이 낫을 들고 접근함으로써 실행행위에 착수하였다(85도2773).\n\n[제1절 참고 - 미수범 조문] 형법 제25조(미수범) ① 범죄의 실행에 착수하여 행위를 종료하지 못하였거나 결과가 발생하지 아니한 때에는 미수범으로 처벌한다. ② 미수범의 형은 기수범보다 감경할 수 있다.", "미수론"],
["487", "간첩의 목적으로 외국 또는 북한에서 국내에 침투하는 경우, 기밀탐지가 가능한 국내에 침투상륙한 후 기밀탐지에 근접한 행위를 함으로써 비로소 간첩죄의 실행의 착수가 있다.", false, "▸ 간첩의 목적으로 외국 또는 북한에서 국내에 침투 또는 월남하는 경우에는 기밀탐지가 가능한 국내에 침투·상륙함으로써 간첩죄의 실행의 착수가 있다(84도1381).\n\n[제1절 참고 - 미수범 조문] 형법 제25조(미수범) ① 범죄의 실행에 착수하여 행위를 종료하지 못하였거나 결과가 발생하지 아니한 때에는 미수범으로 처벌한다. ② 미수범의 형은 기수범보다 감경할 수 있다.", "미수론"],
["488", "「성매매알선 등 행위의 처벌에 관한 법률」 제19조에서 정한 성매매알선죄는 성매매죄 정범에 종속되는 종범이 아니라 성매매죄 정범의 존재와 관계없이 그 자체로 독자적인 정범을 구성하므로, 알선자가 성매매를 하려는 당사자들의 의사를 연결하여 더 이상 알선자의 개입이 없더라도 당사자 사이에 성매매에 이를 수 있을 정도의 주선행위를 하였다면 성매수자에게 실제로는 성매매에 나아가려는 의사가 없었다고 하더라도 위 법에서 정한 성매매알선죄가 성립한다.[모25]", true, "▸ 알선자가 주선행위를 하였다면 성매수자에게 실제 성매매에 나아가려는 의사가 없었다고 하더라도 성매매알선죄가 성립한다. 성매매 당사자인 단속 경찰관에게 성매수 의사가 있었는지 여부와 무관하게 기수에 이르렀다(2020도9807).\n\n[제1절 참고 - 미수범 조문] 형법 제25조(미수범) ① 범죄의 실행에 착수하여 행위를 종료하지 못하였거나 결과가 발생하지 아니한 때에는 미수범으로 처벌한다. ② 미수범의 형은 기수범보다 감경할 수 있다.", "미수론"],
["489", "오로지 결과불법만을 중시하는 견해는 중지미수를 장애미수보다 가볍게 처벌하도록 한 규정의 근거를 설명하기 어렵다.[변26]", true, "▸ 중지미수와 장애미수는 모두 결과가 발생하지 않았다는 점에서 결과불법이 동일하다. '자의성'을 요건으로 하는 중지미수는 행위불법을 중요하게 고려하고 있다. 따라서 오로지 결과불법만을 중시하는 견해에 의하면 중지미수와 장애미수는 동일하게 처벌되어야 한다.\n\n[제2절 참고 - 중지범 조문] 형법 제26조(중지범): 범인이 실행에 착수한 행위를 자의로 중지하거나 그 행위로 인한 결과의 발생을 자의로 방지한 경우에는 형을 감경하거나 면제한다.", "미수론"],
["490", "★ 중지미수는 범죄의 실행행위에 착수하고 범죄가 완수되기 전에 자기의 자유로운 의사에 따라 범죄의 실행행위를 중지하는 것으로서 장애미수와 대칭되는 개념이다.[변20]", true, "▸ (85도2002)\n\n[제2절 참고 - 중지범 조문] 형법 제26조(중지범): 범인이 실행에 착수한 행위를 자의로 중지하거나 그 행위로 인한 결과의 발생을 자의로 방지한 경우에는 형을 감경하거나 면제한다.", "미수론"],
["491", "중지미수에 있어서 자의성 판단기준에 관한 학설 중 Frank의 공식은 행위자가 할 수 있었음에도 불구하고 하기를 원하지 않아서 범죄행위를 중지한 경우는 중지미수에 해당하지만 행위자가 범죄행위를 하려고 하였지만 할 수가 없어서 중지한 경우는 장애미수라고 하여 양자를 구별하고 있다.[변16]", true, "▸ 프랑크공식은 '가능성'을 기준으로 한다.\n\n[제2절 참고 - 중지범 조문] 형법 제26조(중지범): 범인이 실행에 착수한 행위를 자의로 중지하거나 그 행위로 인한 결과의 발생을 자의로 방지한 경우에는 형을 감경하거나 면제한다.", "미수론"],
["492", "자의성 판단기준에 관한 규범설에 의하면 더 나은 범행의 기회를 잡기 위하여 중지한 경우에는 자의성을 인정할 수 없다.", true, "▸ 규범설은 법으로의 회귀한 경우에만 중지미수를 인정하므로, 더 나은 기회를 잡기 위해 중지한 경우에는 자의성이 부정된다.\n\n[제2절 참고 - 중지범 조문] 형법 제26조(중지범): 범인이 실행에 착수한 행위를 자의로 중지하거나 그 행위로 인한 결과의 발생을 자의로 방지한 경우에는 형을 감경하거나 면제한다.", "미수론"],
["493", "★ 甲이 장롱 안에 있는 옷가지에 불을 놓아 사람이 주거로 사용하는 건물을 불태우려 하였으나 불길이 치솟는 것을 보고 겁이 나서 물을 부어 불을 끈 것이라면, 자의에 의한 현주건조물방화죄의 중지미수가 성립하지 않는다.[변23]", true, "▸ 치솟는 불길에 놀라거나 자신의 신체 안전에 대한 위해 또는 범행 발각시의 처벌 등에 두려움을 느끼는 것은 일반 사회통념상 범죄를 완수함에 장애가 되는 사정에 해당한다(97도957).\n\n[제2절 참고 - 중지범 조문] 형법 제26조(중지범): 범인이 실행에 착수한 행위를 자의로 중지하거나 그 행위로 인한 결과의 발생을 자의로 방지한 경우에는 형을 감경하거나 면제한다.", "미수론"],
["494", "살인의 의사로 피해자의 목과 가슴을 칼로 여러 차례 찔렀는데 피해자가 가슴에서 많은 피를 흘리는 것을 보고 겁이 나서 범행을 중단한 것은 일반 사회통념상 범죄를 완수함에 장애가 되는 사정에 해당하여 중지미수의 자의성이 인정되지 않는다.[모25]", true, "▸ 자의에 의한 중지미수라고 볼 수 없다(99도640).\n\n[제2절 참고 - 중지범 조문] 형법 제26조(중지범): 범인이 실행에 착수한 행위를 자의로 중지하거나 그 행위로 인한 결과의 발생을 자의로 방지한 경우에는 형을 감경하거나 면제한다.", "미수론"],
["495", "★ 甲이 A에게 위조한 주식인수계약서와 통장사본을 보여주면서 50억 원의 투자를 받았다고 거짓말하며 자금 대여를 요청한 후 A와 함께 50억 원의 입금 여부를 확인하기 위해 은행에 가던 중 범행이 발각될 것이 두려워 은행 입구에서 차용을 포기하고 돌아간 행위는 사기죄의 중지미수에 해당하지 않는다.[변16]", true, "▸ 피고인이 범행이 발각될 것이 두려워 범행을 중지한 것으로서, 일반 사회통념상 범죄를 완수함에 장애가 되는 사정에 해당한다(2011도10539).\n\n[제2절 참고 - 중지범 조문] 형법 제26조(중지범): 범인이 실행에 착수한 행위를 자의로 중지하거나 그 행위로 인한 결과의 발생을 자의로 방지한 경우에는 형을 감경하거나 면제한다.", "미수론"],
["496", "범행당일 미리 제보를 받은 세관직원들이 범행장소 주변에 잠복근무를 하고 있어 그들이 왔다 갔다하는 것을 본 피고인이 범행의 발각을 두려워한 나머지 자신이 분담하기로 한 실행행위에 이르지 못한 경우, 중지미수에 해당하지 않는다.", true, "▸ 피고인이 범행의 발각을 두려워한 나머지 자신이 분담하기로 한 실행행위에 이르지 못한 경우, 이는 피고인의 자의에 의한 범행의 중지가 아니다(85도2339).\n\n[제2절 참고 - 중지범 조문] 형법 제26조(중지범): 범인이 실행에 착수한 행위를 자의로 중지하거나 그 행위로 인한 결과의 발생을 자의로 방지한 경우에는 형을 감경하거나 면제한다.", "미수론"],
["497", "강도가 강간하려고 하였으나 잠자던 피해자의 어린 딸이 잠에서 깨어 울고, 피해자가 시장에 간 남편이 곧 돌아온다고 하면서 임신중이라고 말하자 도주한 경우에는 자의로 강간행위를 중지하였다고 볼 수 없다.", true, "▸ (93도347)\n\n[제2절 참고 - 중지범 조문] 형법 제26조(중지범): 범인이 실행에 착수한 행위를 자의로 중지하거나 그 행위로 인한 결과의 발생을 자의로 방지한 경우에는 형을 감경하거나 면제한다.", "미수론"],
["498", "강간을 하려고 피해자를 작은 방으로 끌고가 팬티를 강제로 벗기던 중 피해자가 수술한 지 얼마 안되어 배가 아프다면서 애원하는 바람에 그 뜻을 이루지 못하였다면, 강간죄의 중지미수에 해당한다.", false, "▸ 피고인이 간음행위를 중단한 것은 피해자를 불쌍히 여겨서가 아니라 피해자의 신체조건상 강간을 하기에 지장이 있다고 본 데에 기인한 것이므로, 이는 일반의 경험상 강간행위를 수행함에 장애가 되는 외부적 사정에 의하여 범행을 중지한 것에 지나지 않는 것으로서 중지범의 요건인 자의성을 결여하였다(92도917).\n\n[제2절 참고 - 중지범 조문] 형법 제26조(중지범): 범인이 실행에 착수한 행위를 자의로 중지하거나 그 행위로 인한 결과의 발생을 자의로 방지한 경우에는 형을 감경하거나 면제한다.", "미수론"],
["499", "피고인이 피해자를 강간하려다가 피해자의 다음 번에 만나 친해지면 응해 주겠다는 취지의 간곡한 부탁으로 인하여 그 목적을 이루지 못하고 피해자를 자신의 차에 태워 집에까지 데려다 주었다면 중지미수에 해당하지 않는다.", false, "▸ 자의로 피해자에 대한 강간행위를 중지한 것이고 피해자의 다음에 만나 친해지면 응해 주겠다는 취지의 간곡한 부탁은 사회통념상 범죄실행에 대한 장애라고 여겨지지는 아니하므로 피고인의 행위는 중지미수에 해당한다(93도1851).\n\n[제2절 참고 - 중지범 조문] 형법 제26조(중지범): 범인이 실행에 착수한 행위를 자의로 중지하거나 그 행위로 인한 결과의 발생을 자의로 방지한 경우에는 형을 감경하거나 면제한다.", "미수론"],
["500", "★ 실행미수가 중지범으로 인정되기 위해서는 단순히 행위의 계속을 포기하는 것으로 족하지 않고 행위자가 자의에 의하여 결과의 발생을 방지할 것이 요구된다.[변18]", true, "▸ ① [착수미수] 추가적 행위를 통해 범죄 완성이 가능한 착수미수의 중지는 실행에 착수한 행위를 자의로 중지하여 실행을 포기하면 된다(제26조 전단). ② [실행미수] 행위자가 추가적인 행위가 필요 없다고 판단한 경우로, 실행미수가 중지범으로 인정되기 위해서는 단순히 행위의 계속을 포기하는 것으로 족하지 않고 행위자가 자의에 의하여 결과의 발생을 방지할 것이 요구된다(제26조 후단). 따라서 결과발생 방지행위, 결과의 불발생과 방지행위 사이의 인과관계가 있어야 한다.\n\n[제2절 참고 - 중지범 조문] 형법 제26조(중지범): 범인이 실행에 착수한 행위를 자의로 중지하거나 그 행위로 인한 결과의 발생을 자의로 방지한 경우에는 형을 감경하거나 면제한다.", "미수론"],
["501", "★ 범죄의 실행에 착수하여 실행행위는 마쳤으나 결과가 발생하지 아니한 실행미수(종료미수)에 있어서 중지미수가 인정되기 위해서는 단순한 부작위만으로 충분하지 않고 실행행위로 인한 결과의 발생을 적극적으로 방지하여야 한다.[모25]", true, "▸ ① [착수미수] 추가적 행위를 통해 범죄 완성이 가능한 착수미수의 중지는 실행에 착수한 행위를 자의로 중지하여 실행을 포기하면 된다(제26조 전단). ② [실행미수] 행위자가 추가적인 행위가 필요 없다고 판단한 경우로, 실행미수가 중지범으로 인정되기 위해서는 단순히 행위의 계속을 포기하는 것으로 족하지 않고 행위자가 자의에 의하여 결과의 발생을 방지할 것이 요구된다(제26조 후단). 따라서 결과발생 방지행위, 결과의 불발생과 방지행위 사이의 인과관계가 있어야 한다.\n\n[제2절 참고 - 중지범 조문] 형법 제26조(중지범): 범인이 실행에 착수한 행위를 자의로 중지하거나 그 행위로 인한 결과의 발생을 자의로 방지한 경우에는 형을 감경하거나 면제한다.", "미수론"],
["502", "★ 실행미수의 중지범이 성립하기 위한 객관적 요건인 결과발생의 방지는 행위자 자신뿐만 아니라 제3자의 도움을 받아서 행하여도 무방하다.", true, "▸ 제3자의 도움을 받아서 행하여도 무방하다. [119신고 등]\n\n[제2절 참고 - 중지범 조문] 형법 제26조(중지범): 범인이 실행에 착수한 행위를 자의로 중지하거나 그 행위로 인한 결과의 발생을 자의로 방지한 경우에는 형을 감경하거나 면제한다.", "미수론"],
["503", "실행미수는 행위자가 단순히 중지하는 것만으로는 부족하고 적극적으로 결과의 발생을 방지하여야 하므로, 행위자가 결과 발생을 방지할 수 있는 충분한 조치를 하였지만 행위자가 통상 예견할 수 없는 다른 원인으로 결과가 발생한 경우에도 중지미수를 인정할 수 없다.", false, "▸ 전혀 예견할 수 없는 다른 원인으로 결과가 발생한 경우(예: 병원 화재로 사망한 경우)에는 결과를 귀속시킬 수 없으므로 결과불발생이 의제된다.\n\n[제2절 참고 - 중지범 조문] 형법 제26조(중지범): 범인이 실행에 착수한 행위를 자의로 중지하거나 그 행위로 인한 결과의 발생을 자의로 방지한 경우에는 형을 감경하거나 면제한다.", "미수론"],
["504", "★ 甲이 살인의 고의로 치사량의 독약을 복용시키려 하였으나 착오로 치사량에 현저히 미달하는 양의 독약을 복용시킨 다음 후회하여 乙에게 해독제를 먹인 경우, 방지행위와 결과불발생 사이에 인과관계를 요하는 견해에 따르면 살인죄의 불능미수가 성립한다.[변25]", true, "▸ 불능미수는 애초에 결과발생이 불가능하므로 방지행위와 결과 불발생 사이에 인과관계가 없어 불능미수의 중지미수를 인정할 수 있는지 문제된다. 이에 대하여, ① 결과발생이 처음부터 불가능한 경우에는 방지행위와 결과 불발생 사이에 인과관계가 없다는 이유로 중지미수를 부정하는 부정설, ② 자의성의 판단은 행위자의 주관을 기준으로 해야 하므로 결과발생이 불가능하다는 것을 몰랐던 행위자에게는 중지미수를 인정해야 한다는 긍정설이 있다. 방지행위와 결과 불발생 사이에 인과관계를 요하는 견해에 의하면 불능미수는 방지행위와 결과불발생 사이에 인과관계가 없으므로 중지미수가 인정되지 않고 불능미수만 성립한다.\n\n[제2절 참고 - 중지범 조문] 형법 제26조(중지범): 범인이 실행에 착수한 행위를 자의로 중지하거나 그 행위로 인한 결과의 발생을 자의로 방지한 경우에는 형을 감경하거나 면제한다.", "미수론"],
["505", "★ 甲은 乙과 함께 A가 경영하는 사무실의 금품을 절취하기로 공모하여 甲은 그 부근 포장마차에 있고 乙은 위 사무실의 열려진 출입문을 통하여 안으로 들어가 물건을 물색하고 있는 동안 甲은 자신의 범행전력등을 생각하여 가책을 느낀 나머지 스스로 결의를 바꾸어 A에게 乙의 침입사실을 알려 그와 함께 乙을 체포하였다면 甲에게는 중지미수가 인정된다.", true, "▸ (85도2831) [만약 이미 乙이 금품을 들고 나오는 것을 체포한 경우에는 이미 결과가 발생하였으므로(91도476) 중지미수가 아닌 절도기수에 해당한다.]\n\n[제2절 참고 - 중지범 조문] 형법 제26조(중지범): 범인이 실행에 착수한 행위를 자의로 중지하거나 그 행위로 인한 결과의 발생을 자의로 방지한 경우에는 형을 감경하거나 면제한다.", "미수론"],
["506", "★ 일반적으로 공범이 자신의 행위를 중지한 것만으로는 중지미수가 성립하지 않지만, 다른 공범 또는 정범의 행위를 중단시키거나 결과발생을 저지하기 위한 진지한 노력이 있었을 경우에는 비록 결과가 발생하였다 할지라도 그 공범에게는 예외적으로 중지미수가 성립될 수 있다.[변16]", false, "▸ ① 다른 공범의 범행을 중지하게 하지 아니한 이상 자기만의 범의를 철회·포기하여도 중지미수로는 인정될 수 없다. ② 피고인이 다른 피고인과의 공모하에 강간행위에 나아간 이상 비록 피고인이 강간행위에 나아가지 않았더라도 중지미수에 해당하지는 않는다(2004도8259).\n\n[제2절 참고 - 중지범 조문] 형법 제26조(중지범): 범인이 실행에 착수한 행위를 자의로 중지하거나 그 행위로 인한 결과의 발생을 자의로 방지한 경우에는 형을 감경하거나 면제한다.", "미수론"],
["507", "★ 甲, 乙은 A를 순차적으로 강간하기 위해 합동하여 A를 텐트 안으로 끌고 간 후, 甲이 A를 간음할 동안 乙은 망을 본 후, 다시 乙이 텐트에 들어가 A를 강간하려 하였으나 A가 강간을 하지 말아 달라고 애원하자 죄책감에 강간을 하지 않은 경우, 乙에게는 특수강간죄의 중지미수가 인정된다.", false, "▸ ① 다른 공범의 범행을 중지하게 하지 아니한 이상 자기만의 범의를 철회·포기하여도 중지미수로는 인정될 수 없다. ② 피고인이 다른 피고인과의 공모하에 강간행위에 나아간 이상 비록 피고인이 강간행위에 나아가지 않았더라도 중지미수에 해당하지는 않는다(2004도8259).\n\n[제2절 참고 - 중지범 조문] 형법 제26조(중지범): 범인이 실행에 착수한 행위를 자의로 중지하거나 그 행위로 인한 결과의 발생을 자의로 방지한 경우에는 형을 감경하거나 면제한다.", "미수론"],
["508", "★ 공동정범 중 1인의 자의에 의한 실행중지만으로는 그의 중지미수를 인정할 수 없으며, 공동정범 전원의 실행행위를 중지시키거나 모든 결과발생을 완전히 방지한 때 공동정범 전체의 중지미수가 인정된다.[변21]", false, "▸ 중지미수의 형감경은 책임감경사유, 형면제는 인적처벌조각사유이므로 중지미수의 효과는 일신전속적이다. 따라서 자의로 중지한 자에게는 중지미수, 다른 공범에 대해서는 장애미수(또는 불능미수)가 성립한다.\n\n[제2절 참고 - 중지범 조문] 형법 제26조(중지범): 범인이 실행에 착수한 행위를 자의로 중지하거나 그 행위로 인한 결과의 발생을 자의로 방지한 경우에는 형을 감경하거나 면제한다.", "미수론"],
["509", "★ 甲과 乙이 공동으로 A를 살해하려고 칼로 찔렀으나 A가 상처만 입고 죽지 않자 乙은 그대로 가버리고 甲만이 A를 살리려고 노력하여 A가 사망하지 않은 경우 甲에게만 중지미수에 의한 형의 감면이 인정된다.[변16]", true, "▸ 중지미수의 형감경은 책임감경사유, 형면제는 인적처벌조각사유이므로 중지미수의 효과는 일신전속적이다. 따라서 자의로 중지한 자에게는 중지미수, 다른 공범에 대해서는 장애미수(또는 불능미수)가 성립한다.\n\n[제2절 참고 - 중지범 조문] 형법 제26조(중지범): 범인이 실행에 착수한 행위를 자의로 중지하거나 그 행위로 인한 결과의 발생을 자의로 방지한 경우에는 형을 감경하거나 면제한다.", "미수론"],
["510", "중지미수의 형을 필요적으로 감면하는 근거를 불법감소·소멸에서 찾는 견해에 따르면 정범이 자의로 실행을 중지한 경우 그 교사범이나 방조범에게도 중지미수가 성립한다.", true, "▸ 이 견해에 의하면 불법감소·소멸이 연대되므로 교사범이나 방조범에게도 감면혜택을 부여하게 된다. [불법 연대, 책임 개별화]\n\n[제2절 참고 - 중지범 조문] 형법 제26조(중지범): 범인이 실행에 착수한 행위를 자의로 중지하거나 그 행위로 인한 결과의 발생을 자의로 방지한 경우에는 형을 감경하거나 면제한다.", "미수론"],
["511", "객관적 구성요건 요소인 범죄의 주체, 객체, 수단 등의 요소를 갖추지 못하여 처음부터 구성요건이 충족될 수 없다면 실행의 착수가 존재할 수 없으므로 개념상으로 미수범 성립이 가능하지 않다는 '구성요건의 흠결론'에 따르면, 살아 있는 사람을 시체로 오인하여 은닉하였더라도 시체은닉죄의 객체를 갖추지 못하여 시체은닉죄의 불능미수는 성립할 수 없다.[모25]", true, "▸ 구성요건 흠결이론은 객관적 구성요건 중 '결과 또는 인과관계'가 흠결된 경우에만 미수를 인정하고, 이외의 구성요건요소인 행위주체, 객체, 수단, 행위상황 등이 흠결된 경우에는 불가벌적 불능범이 된다는 이론이다. 다만, 형법 제27조의 해석상 이 이론은 인정될 수 없다.\n\n[제3절 참고 - 불능미수 조문 및 위험성 판단 사례] 형법 제27조(불능범): 실행의 수단 또는 대상의 착오로 인하여 결과의 발생이 불가능하더라도 위험성이 있는 때에는 처벌한다. 단, 형을 감경 또는 면제할 수 있다. [위험성 판단 학설] 구객관설: 절대적 불능과 상대적 불능으로 구별. 구체적 위험설: 행위 당시 행위자가 인식한 사정과 일반인이 인식할 수 있었던 사정을 기초로 일반인의 입장에서 판단. 추상적 위험설(판례): 행위 당시 행위자가 인식한 사실만을 기초로 일반인의 입장에서 판단. [대표 사례별 결론 요약] 치사량에 현저히 미달하는 독약 사용: 세 학설 모두 불능미수. 행위자만 설탕을 독으로 오인(일반인은 설탕임을 앎): 구객관설·추상적 위험설은 불능범, 구체적 위험설만 불능미수. 행위자와 일반인 모두 독으로 오인: 구객관설만 불능범, 나머지는 불능미수. 무해하다는 표시가 있는 제초제에 살인력이 있다고 오인: 구객관설·추상적 위험설은 불능범, 구체적 위험설만 불능미수. 설탕에 애초 살인력이 있다고 오인(누가 봐도 불가능): 세 학설 모두 불능범. 총알이 장전된 것을 서로 알고 발사: 구객관설 판단 불필요, 구체적·추상적 위험설 모두 불능미수. 사정거리 밖임을 일반인은 알았으나 행위자만 사정거리 내로 오인: 구체적 위험설은 불능범, 추상적 위험설은 불능미수. 총알 불량으로 발사되지 않은 경우(쌍방 불량 여부 인식 못함): 구체적·추상적 위험설 모두 불능미수. 빈 주머니를 절취하려 한 소매치기 사례, 빈 금고에서 절취하려 한 사례: 모두 불능미수.", "미수론"],

["522", "병안에 들어 있는 것이 설탕이라는 것을 알고 있었지만, 설탕으로도 사람을 죽일 수 있다고 믿고 이를 먹여 살해하려고 한 경우 구체적 위험설과 추상적 위험설 모두 불능범에 해당한다.", true, "▸ 설탕으로도 사람을 죽일 수 있다고 생각하고 설탕을 먹인 경우, 행위자와 일반인 모두 그것이 설탕임을 인식하고 있었으므로 구체적 위험설은 물론 추상적 위험설에 의하더라도 불능범(결과발생의 위험성 없음)에 해당한다.\n\n[제3절 참고 - 불능미수 조문 및 위험성 판단 사례] 형법 제27조(불능범): 실행의 수단 또는 대상의 착오로 인하여 결과의 발생이 불가능하더라도 위험성이 있는 때에는 처벌한다. 단, 형을 감경 또는 면제할 수 있다. [위험성 판단 학설] 구객관설: 절대적 불능과 상대적 불능으로 구별. 구체적 위험설: 행위 당시 행위자가 인식한 사정과 일반인이 인식할 수 있었던 사정을 기초로 일반인의 입장에서 판단. 추상적 위험설(판례): 행위 당시 행위자가 인식한 사실만을 기초로 일반인의 입장에서 판단. [대표 사례별 결론 요약] 치사량에 현저히 미달하는 독약 사용: 세 학설 모두 불능미수. 행위자만 설탕을 독으로 오인(일반인은 설탕임을 앎): 구객관설·추상적 위험설은 불능범, 구체적 위험설만 불능미수. 행위자와 일반인 모두 독으로 오인: 구객관설만 불능범, 나머지는 불능미수. 무해하다는 표시가 있는 제초제에 살인력이 있다고 오인: 구객관설·추상적 위험설은 불능범, 구체적 위험설만 불능미수. 설탕에 애초 살인력이 있다고 오인(누가 봐도 불가능): 세 학설 모두 불능범. 총알이 장전된 것을 서로 알고 발사: 구객관설 판단 불필요, 구체적·추상적 위험설 모두 불능미수. 사정거리 밖임을 일반인은 알았으나 행위자만 사정거리 내로 오인: 구체적 위험설은 불능범, 추상적 위험설은 불능미수. 총알 불량으로 발사되지 않은 경우(쌍방 불량 여부 인식 못함): 구체적·추상적 위험설 모두 불능미수. 빈 주머니를 절취하려 한 소매치기 사례, 빈 금고에서 절취하려 한 사례: 모두 불능미수.", "미수론"],

["524", "만약 실제로는 설탕이 들어 있었음에도 착오로 인하여 병에는 독약으로 크게 표기되어 있었고, 이에 독약으로 오인하고 이를 먹여 살해하려고 하였다면, 구체적 위험설과 추상적 위험설 모두 불능범에 해당한다.", false, "▸ 행위자뿐만 아니라 일반인도 병의 표기를 보고 독약으로 인식할 수 있었던 경우이므로, 인식된 사정(독약)을 기초로 하면 위험성이 인정되어 구체적 위험설과 추상적 위험설 모두 불능미수에 해당한다.\n\n[제3절 참고 - 불능미수 조문 및 위험성 판단 사례] 형법 제27조(불능범): 실행의 수단 또는 대상의 착오로 인하여 결과의 발생이 불가능하더라도 위험성이 있는 때에는 처벌한다. 단, 형을 감경 또는 면제할 수 있다. [위험성 판단 학설] 구객관설: 절대적 불능과 상대적 불능으로 구별. 구체적 위험설: 행위 당시 행위자가 인식한 사정과 일반인이 인식할 수 있었던 사정을 기초로 일반인의 입장에서 판단. 추상적 위험설(판례): 행위 당시 행위자가 인식한 사실만을 기초로 일반인의 입장에서 판단. [대표 사례별 결론 요약] 치사량에 현저히 미달하는 독약 사용: 세 학설 모두 불능미수. 행위자만 설탕을 독으로 오인(일반인은 설탕임을 앎): 구객관설·추상적 위험설은 불능범, 구체적 위험설만 불능미수. 행위자와 일반인 모두 독으로 오인: 구객관설만 불능범, 나머지는 불능미수. 무해하다는 표시가 있는 제초제에 살인력이 있다고 오인: 구객관설·추상적 위험설은 불능범, 구체적 위험설만 불능미수. 설탕에 애초 살인력이 있다고 오인(누가 봐도 불가능): 세 학설 모두 불능범. 총알이 장전된 것을 서로 알고 발사: 구객관설 판단 불필요, 구체적·추상적 위험설 모두 불능미수. 사정거리 밖임을 일반인은 알았으나 행위자만 사정거리 내로 오인: 구체적 위험설은 불능범, 추상적 위험설은 불능미수. 총알 불량으로 발사되지 않은 경우(쌍방 불량 여부 인식 못함): 구체적·추상적 위험설 모두 불능미수. 빈 주머니를 절취하려 한 소매치기 사례, 빈 금고에서 절취하려 한 사례: 모두 불능미수.", "미수론"],
["525", "甲이 A에게 치사량에 미달한 독약을 탄 음료수를 먹게 하여 살해하려고 하였으나 A가 음료수를 토해서 살인에 실패한 경우, 법원은 해당 독약의 치사량을 심리한 다음 살인죄의 장애미수인지 불능미수인지를 판단해야 하고, 만약 甲이 사용한 독의 양이 치사량에 현저히 미달하여 결과발생이 불가능했다면 甲에게는 살인죄의 장애미수가 성립한다.", false, "▸ 피고인이 피해자를 독살하려 하였으나 동인이 토함으로써 그 목적을 이루지 못한 경우에는 피고인이 사용한 독의 양이 치사량 미달이어서 결과발생이 불가능한 경우도 있을 수 있고, 형법은 장애미수와 불능미수를 구별하여 처벌하고 있으므로 해당 독약의 치사량을 심리하여 어느 경우에 해당하는지 가려야 한다(83도2967). 치사량 미달로 결과발생이 불가능한 경우라면 장애미수가 아니라 불능미수 성립 여부가 문제된다.\n\n[제3절 참고 - 불능미수 조문 및 위험성 판단 사례] 형법 제27조(불능범): 실행의 수단 또는 대상의 착오로 인하여 결과의 발생이 불가능하더라도 위험성이 있는 때에는 처벌한다. 단, 형을 감경 또는 면제할 수 있다. [위험성 판단 학설] 구객관설: 절대적 불능과 상대적 불능으로 구별. 구체적 위험설: 행위 당시 행위자가 인식한 사정과 일반인이 인식할 수 있었던 사정을 기초로 일반인의 입장에서 판단. 추상적 위험설(판례): 행위 당시 행위자가 인식한 사실만을 기초로 일반인의 입장에서 판단. [대표 사례별 결론 요약] 치사량에 현저히 미달하는 독약 사용: 세 학설 모두 불능미수. 행위자만 설탕을 독으로 오인(일반인은 설탕임을 앎): 구객관설·추상적 위험설은 불능범, 구체적 위험설만 불능미수. 행위자와 일반인 모두 독으로 오인: 구객관설만 불능범, 나머지는 불능미수. 무해하다는 표시가 있는 제초제에 살인력이 있다고 오인: 구객관설·추상적 위험설은 불능범, 구체적 위험설만 불능미수. 설탕에 애초 살인력이 있다고 오인(누가 봐도 불가능): 세 학설 모두 불능범. 총알이 장전된 것을 서로 알고 발사: 구객관설 판단 불필요, 구체적·추상적 위험설 모두 불능미수. 사정거리 밖임을 일반인은 알았으나 행위자만 사정거리 내로 오인: 구체적 위험설은 불능범, 추상적 위험설은 불능미수. 총알 불량으로 발사되지 않은 경우(쌍방 불량 여부 인식 못함): 구체적·추상적 위험설 모두 불능미수. 빈 주머니를 절취하려 한 소매치기 사례, 빈 금고에서 절취하려 한 사례: 모두 불능미수.", "미수론"],
["526", "만약 음료수에 든 독약이 치사량에 현저히 미달하여 A가 응급실에서 치료를 받았을 뿐 생명에는 지장이 없었던 경우, 甲이 독약이 든 음료수를 A에게 건네줄 당시 甲이 인식한 사정을 놓고 일반인이 객관적으로 판단하여 보았을 때 살인의 결과가 발생할 위험성이 있었다면 살인죄의 불능미수가 성립한다.", true, "▸ 불능미수의 위험성은 '행위자'가 행위 당시에 인식한 사정을 놓고, '일반인'이 객관적으로 판단하여 결과 발생의 가능성이 있는지 여부를 따져야 한다(2018도16002).\n\n[제3절 참고 - 불능미수 조문 및 위험성 판단 사례] 형법 제27조(불능범): 실행의 수단 또는 대상의 착오로 인하여 결과의 발생이 불가능하더라도 위험성이 있는 때에는 처벌한다. 단, 형을 감경 또는 면제할 수 있다. [위험성 판단 학설] 구객관설: 절대적 불능과 상대적 불능으로 구별. 구체적 위험설: 행위 당시 행위자가 인식한 사정과 일반인이 인식할 수 있었던 사정을 기초로 일반인의 입장에서 판단. 추상적 위험설(판례): 행위 당시 행위자가 인식한 사실만을 기초로 일반인의 입장에서 판단. [대표 사례별 결론 요약] 치사량에 현저히 미달하는 독약 사용: 세 학설 모두 불능미수. 행위자만 설탕을 독으로 오인(일반인은 설탕임을 앎): 구객관설·추상적 위험설은 불능범, 구체적 위험설만 불능미수. 행위자와 일반인 모두 독으로 오인: 구객관설만 불능범, 나머지는 불능미수. 무해하다는 표시가 있는 제초제에 살인력이 있다고 오인: 구객관설·추상적 위험설은 불능범, 구체적 위험설만 불능미수. 설탕에 애초 살인력이 있다고 오인(누가 봐도 불가능): 세 학설 모두 불능범. 총알이 장전된 것을 서로 알고 발사: 구객관설 판단 불필요, 구체적·추상적 위험설 모두 불능미수. 사정거리 밖임을 일반인은 알았으나 행위자만 사정거리 내로 오인: 구체적 위험설은 불능범, 추상적 위험설은 불능미수. 총알 불량으로 발사되지 않은 경우(쌍방 불량 여부 인식 못함): 구체적·추상적 위험설 모두 불능미수. 빈 주머니를 절취하려 한 소매치기 사례, 빈 금고에서 절취하려 한 사례: 모두 불능미수.", "미수론"],
["527", "★ 乙은 A를 살해하기 위하여 일정량 이상을 먹으면 사람이 죽을 수도 있는 초우부리를 달인 물을 마시게 하였으나 A가 이를 토해버려 사망하지 않았다. 乙이 A를 살해하기 위해 초우부리를 달인 물을 마시게 하였으나 A가 이를 토해버려 사망하지 않아 乙에게 살인미수죄가 성립한다.[변23]", true, "▸ 일정량 이상을 먹으면 사람이 죽을 수도 있는 초오두 또는 부자를 달인 물을 마시게 하여 피해자를 살해하려다 미수에 그친 행위는 불능범이 아닌 살인미수죄에 해당한다(2007도3687).\n\n[제3절 참고 - 불능미수 조문 및 위험성 판단 사례] 형법 제27조(불능범): 실행의 수단 또는 대상의 착오로 인하여 결과의 발생이 불가능하더라도 위험성이 있는 때에는 처벌한다. 단, 형을 감경 또는 면제할 수 있다. [위험성 판단 학설] 구객관설: 절대적 불능과 상대적 불능으로 구별. 구체적 위험설: 행위 당시 행위자가 인식한 사정과 일반인이 인식할 수 있었던 사정을 기초로 일반인의 입장에서 판단. 추상적 위험설(판례): 행위 당시 행위자가 인식한 사실만을 기초로 일반인의 입장에서 판단. [대표 사례별 결론 요약] 치사량에 현저히 미달하는 독약 사용: 세 학설 모두 불능미수. 행위자만 설탕을 독으로 오인(일반인은 설탕임을 앎): 구객관설·추상적 위험설은 불능범, 구체적 위험설만 불능미수. 행위자와 일반인 모두 독으로 오인: 구객관설만 불능범, 나머지는 불능미수. 무해하다는 표시가 있는 제초제에 살인력이 있다고 오인: 구객관설·추상적 위험설은 불능범, 구체적 위험설만 불능미수. 설탕에 애초 살인력이 있다고 오인(누가 봐도 불가능): 세 학설 모두 불능범. 총알이 장전된 것을 서로 알고 발사: 구객관설 판단 불필요, 구체적·추상적 위험설 모두 불능미수. 사정거리 밖임을 일반인은 알았으나 행위자만 사정거리 내로 오인: 구체적 위험설은 불능범, 추상적 위험설은 불능미수. 총알 불량으로 발사되지 않은 경우(쌍방 불량 여부 인식 못함): 구체적·추상적 위험설 모두 불능미수. 빈 주머니를 절취하려 한 소매치기 사례, 빈 금고에서 절취하려 한 사례: 모두 불능미수.", "미수론"],
["528", "살해의 의사로 우물에 농약을 혼입하였지만, 악취가 나서 보통의 경우 마시기 어렵고 또 혼입한 농약의 분량이 사람을 치사에 이르게 할 정도는 아니었던 경우 살인죄의 불능범에 해당한다.", false, "▸ 피고인이 우물과 펌프에 혼입한 농약이 악취가 나서 보통의 경우 마시기 어렵고 또 혼입한 농약의 분량이 사람을 치사에 이르게 할 정도는 아니었던 경우라도 그 농약의 혼입으로 살인의 결과가 발생할 위험성이 절대로 없다고 단정할 수 없으므로 살인미수죄의 죄책을 진다(73도353).\n\n[제3절 참고 - 불능미수 조문 및 위험성 판단 사례] 형법 제27조(불능범): 실행의 수단 또는 대상의 착오로 인하여 결과의 발생이 불가능하더라도 위험성이 있는 때에는 처벌한다. 단, 형을 감경 또는 면제할 수 있다. [위험성 판단 학설] 구객관설: 절대적 불능과 상대적 불능으로 구별. 구체적 위험설: 행위 당시 행위자가 인식한 사정과 일반인이 인식할 수 있었던 사정을 기초로 일반인의 입장에서 판단. 추상적 위험설(판례): 행위 당시 행위자가 인식한 사실만을 기초로 일반인의 입장에서 판단. [대표 사례별 결론 요약] 치사량에 현저히 미달하는 독약 사용: 세 학설 모두 불능미수. 행위자만 설탕을 독으로 오인(일반인은 설탕임을 앎): 구객관설·추상적 위험설은 불능범, 구체적 위험설만 불능미수. 행위자와 일반인 모두 독으로 오인: 구객관설만 불능범, 나머지는 불능미수. 무해하다는 표시가 있는 제초제에 살인력이 있다고 오인: 구객관설·추상적 위험설은 불능범, 구체적 위험설만 불능미수. 설탕에 애초 살인력이 있다고 오인(누가 봐도 불가능): 세 학설 모두 불능범. 총알이 장전된 것을 서로 알고 발사: 구객관설 판단 불필요, 구체적·추상적 위험설 모두 불능미수. 사정거리 밖임을 일반인은 알았으나 행위자만 사정거리 내로 오인: 구체적 위험설은 불능범, 추상적 위험설은 불능미수. 총알 불량으로 발사되지 않은 경우(쌍방 불량 여부 인식 못함): 구체적·추상적 위험설 모두 불능미수. 빈 주머니를 절취하려 한 소매치기 사례, 빈 금고에서 절취하려 한 사례: 모두 불능미수.", "미수론"],
["529", "★ 준강간죄의 객체를 '사람'이 아닌 '심신상실 또는 항거불능의 상태에 있는 사람'이라고 보는 것은 형벌조항의 문언의 범위를 벗어나는 해석이다.", false, "▸ ① 심신상실 또는 항거불능의 상태는 피해자인 사람에게 존재하여야 하므로 준강간죄에서 행위의 대상은 '심신상실 또는 항거불능의 상태에 있는 사람'이다. 구성요건에 해당하는 행위는 그러한 상태를 이용하여 간음하는 것이다. ② 행위자가 피해자가 심신상실 또는 항거불능의 상태에 있다고 인식하고 그 상태를 이용해 간음할 의사로 간음하였으나 피해자가 실제로는 그러한 상태에 있지 않았던 경우에는, 실행의 수단 또는 대상의 착오로 구성요건적 결과의 발생이 처음부터 불가능하였던 것이다. ③ 행위자가 행위 당시 인식한 사정을 놓고 일반인이 객관적으로 판단하여 결과발생 위험성이 있었다면 준강간죄의 불능미수가 성립한다(2018도16002).\n\n[제3절 참고 - 불능미수 조문 및 위험성 판단 사례] 형법 제27조(불능범): 실행의 수단 또는 대상의 착오로 인하여 결과의 발생이 불가능하더라도 위험성이 있는 때에는 처벌한다. 단, 형을 감경 또는 면제할 수 있다. [위험성 판단 학설] 구객관설: 절대적 불능과 상대적 불능으로 구별. 구체적 위험설: 행위 당시 행위자가 인식한 사정과 일반인이 인식할 수 있었던 사정을 기초로 일반인의 입장에서 판단. 추상적 위험설(판례): 행위 당시 행위자가 인식한 사실만을 기초로 일반인의 입장에서 판단. [대표 사례별 결론 요약] 치사량에 현저히 미달하는 독약 사용: 세 학설 모두 불능미수. 행위자만 설탕을 독으로 오인(일반인은 설탕임을 앎): 구객관설·추상적 위험설은 불능범, 구체적 위험설만 불능미수. 행위자와 일반인 모두 독으로 오인: 구객관설만 불능범, 나머지는 불능미수. 무해하다는 표시가 있는 제초제에 살인력이 있다고 오인: 구객관설·추상적 위험설은 불능범, 구체적 위험설만 불능미수. 설탕에 애초 살인력이 있다고 오인(누가 봐도 불가능): 세 학설 모두 불능범. 총알이 장전된 것을 서로 알고 발사: 구객관설 판단 불필요, 구체적·추상적 위험설 모두 불능미수. 사정거리 밖임을 일반인은 알았으나 행위자만 사정거리 내로 오인: 구체적 위험설은 불능범, 추상적 위험설은 불능미수. 총알 불량으로 발사되지 않은 경우(쌍방 불량 여부 인식 못함): 구체적·추상적 위험설 모두 불능미수. 빈 주머니를 절취하려 한 소매치기 사례, 빈 금고에서 절취하려 한 사례: 모두 불능미수.", "미수론"],
["530", "★ 甲이 피해자가 심신상실 또는 항거불능의 상태에 있다고 인식하고 그러한 상태를 이용하여 간음할 의사로 피해자를 간음하였으나 실행의 착수 당시부터 피해자가 실제로는 심신상실 또는 항거불능의 상태에 있지 않은 경우, 甲의 행위 당시에 일반인이 인식할 수 있었던 사정을 놓고 일반인이 객관적으로 판단하여 보았을 때 준강간의 결과가 발생할 위험성이 있었다면 준강간죄의 불능미수가 성립한다.[변24]", false, "▸ ① 심신상실 또는 항거불능의 상태는 피해자인 사람에게 존재하여야 하므로 준강간죄에서 행위의 대상은 '심신상실 또는 항거불능의 상태에 있는 사람'이다. 구성요건에 해당하는 행위는 그러한 상태를 이용하여 간음하는 것이다. ② 행위자가 피해자가 심신상실 또는 항거불능의 상태에 있다고 인식하고 그 상태를 이용해 간음할 의사로 간음하였으나 피해자가 실제로는 그러한 상태에 있지 않았던 경우에는, 실행의 수단 또는 대상의 착오로 구성요건적 결과의 발생이 처음부터 불가능하였던 것이다. ③ '행위자'가 행위 당시 인식한 사정을 놓고 '일반인'이 객관적으로 판단하여 결과발생 위험성이 있었다면 준강간죄의 불능미수가 성립한다(2018도16002).\n\n[제3절 참고 - 불능미수 조문 및 위험성 판단 사례] 형법 제27조(불능범): 실행의 수단 또는 대상의 착오로 인하여 결과의 발생이 불가능하더라도 위험성이 있는 때에는 처벌한다. 단, 형을 감경 또는 면제할 수 있다. [위험성 판단 학설] 구객관설: 절대적 불능과 상대적 불능으로 구별. 구체적 위험설: 행위 당시 행위자가 인식한 사정과 일반인이 인식할 수 있었던 사정을 기초로 일반인의 입장에서 판단. 추상적 위험설(판례): 행위 당시 행위자가 인식한 사실만을 기초로 일반인의 입장에서 판단. [대표 사례별 결론 요약] 치사량에 현저히 미달하는 독약 사용: 세 학설 모두 불능미수. 행위자만 설탕을 독으로 오인(일반인은 설탕임을 앎): 구객관설·추상적 위험설은 불능범, 구체적 위험설만 불능미수. 행위자와 일반인 모두 독으로 오인: 구객관설만 불능범, 나머지는 불능미수. 무해하다는 표시가 있는 제초제에 살인력이 있다고 오인: 구객관설·추상적 위험설은 불능범, 구체적 위험설만 불능미수. 설탕에 애초 살인력이 있다고 오인(누가 봐도 불가능): 세 학설 모두 불능범. 총알이 장전된 것을 서로 알고 발사: 구객관설 판단 불필요, 구체적·추상적 위험설 모두 불능미수. 사정거리 밖임을 일반인은 알았으나 행위자만 사정거리 내로 오인: 구체적 위험설은 불능범, 추상적 위험설은 불능미수. 총알 불량으로 발사되지 않은 경우(쌍방 불량 여부 인식 못함): 구체적·추상적 위험설 모두 불능미수. 빈 주머니를 절취하려 한 소매치기 사례, 빈 금고에서 절취하려 한 사례: 모두 불능미수.", "미수론"],

["534", "★ 소송비용을 편취할 의사로 소송비용의 지급을 구하는 손해배상청구의 소를 제기한 경우 소송사기죄의 불능미수가 성립한다.[변25]", false, "▸ ① 불능범의 판단 기준으로서 위험성 판단은 행위자가 행위 당시에 인식한 사정을 놓고 이것이 객관적으로 일반인의 판단으로 보아 결과 발생의 가능성이 있느냐를 따져야 한다. ② 소송비용의 지급을 구하는 손해배상청구의 소는 소의 이익이 흠결된 부적법한 소로서 각하를 면할 수 없어 승소할 수 없으므로, 그 소송사기 범행은 실행수단의 착오로 인하여 결과발생이 불가능할 뿐만 아니라 위험성도 없다. ③ 이러한 경우는 사기죄의 불능범에 해당한다(2005도8105).\n\n[제3절 참고 - 불능미수 조문 및 위험성 판단 사례] 형법 제27조(불능범): 실행의 수단 또는 대상의 착오로 인하여 결과의 발생이 불가능하더라도 위험성이 있는 때에는 처벌한다. 단, 형을 감경 또는 면제할 수 있다. [위험성 판단 학설] 구객관설: 절대적 불능과 상대적 불능으로 구별. 구체적 위험설: 행위 당시 행위자가 인식한 사정과 일반인이 인식할 수 있었던 사정을 기초로 일반인의 입장에서 판단. 추상적 위험설(판례): 행위 당시 행위자가 인식한 사실만을 기초로 일반인의 입장에서 판단. [대표 사례별 결론 요약] 치사량에 현저히 미달하는 독약 사용: 세 학설 모두 불능미수. 행위자만 설탕을 독으로 오인(일반인은 설탕임을 앎): 구객관설·추상적 위험설은 불능범, 구체적 위험설만 불능미수. 행위자와 일반인 모두 독으로 오인: 구객관설만 불능범, 나머지는 불능미수. 무해하다는 표시가 있는 제초제에 살인력이 있다고 오인: 구객관설·추상적 위험설은 불능범, 구체적 위험설만 불능미수. 설탕에 애초 살인력이 있다고 오인(누가 봐도 불가능): 세 학설 모두 불능범. 총알이 장전된 것을 서로 알고 발사: 구객관설 판단 불필요, 구체적·추상적 위험설 모두 불능미수. 사정거리 밖임을 일반인은 알았으나 행위자만 사정거리 내로 오인: 구체적 위험설은 불능범, 추상적 위험설은 불능미수. 총알 불량으로 발사되지 않은 경우(쌍방 불량 여부 인식 못함): 구체적·추상적 위험설 모두 불능미수. 빈 주머니를 절취하려 한 소매치기 사례, 빈 금고에서 절취하려 한 사례: 모두 불능미수.", "미수론"],
