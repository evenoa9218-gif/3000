// ── Firebase REST API 헬퍼 (SDK 없이 fetch로 직접 사용) ──
const FB_URL = "https://project-1720248149706690221-default-rtdb.asia-southeast1.firebasedatabase.app";

const fb = {
  // 값 읽기
  get: async (path) => {
    try {
      const r = await fetch(`${FB_URL}/${path}.json`);
      if (!r.ok) return null;
      return await r.json();
    } catch { return null; }
  },
  // 값 쓰기 (PUT: 덮어쓰기)
  set: async (path, data) => {
    const r = await fetch(`${FB_URL}/${path}.json`, {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(data)
    });
    if (!r.ok) throw new Error(`Firebase set failed: HTTP ${r.status}`);
  },
  // 값 병합 (PATCH: 부분 업데이트)
  update: async (path, data) => {
    try {
      await fetch(`${FB_URL}/${path}.json`, {
        method: 'PATCH',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(data)
      });
    } catch {}
  },
  // 전체 목록 읽기
  list: async (path) => {
    try {
      const r = await fetch(`${FB_URL}/${path}.json`);
      if (!r.ok) return {};
      const data = await r.json();
      return data || {};
    } catch { return {}; }
  }
};

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

// window.storage — GitHub Pages에서는 localStorage로 폴백
window.storage = window.storage || (() => {
  const PREFIX = 'qhub_';
  return {
    get: async (key) => {
      try {
        const v = localStorage.getItem(PREFIX + key);
        return v !== null ? { key, value: v } : null;
      } catch { return null; }
    },
    set: async (key, value) => {
      try {
        localStorage.setItem(PREFIX + key, value);
        return { key, value };
      } catch { return null; }
    },
    delete: async (key) => {
      try { localStorage.removeItem(PREFIX + key); return { key, deleted: true }; } catch { return null; }
    },
    list: async (prefix) => {
      try {
        const keys = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith(PREFIX + (prefix||''))) {
            keys.push(k.slice(PREFIX.length));
          }
        }
        return { keys };
      } catch { return { keys: [] }; }
    }
  };
})();

["012", "「디엔에이신원확인정보의 이용 및 보호에 관한 법률」이 시행 당시 디엔에이감식시료 채취 대상 범죄로 이미 징역이나 금고 이상의 실형을 선고받아 그 형이 확정되어 수용 중인 사람에게도 적용될 수 있도록 한 위 법률 부칙 제2조 제1항은 소급입법금지원칙에 위배된다.[변21]", false, "▸ DNA 수집이용은 수형인 등에게 심리적 압박으로 인한 범죄예방효과를 가진다는 점에서 보안처분의 성격을 지니지만, 처벌적인 효과가 없는 비형벌적 보안처분으로서 소급입법금지원칙이 적용되지 않는다(2011헌마28).", "죄형법정주의"],
["013", "★ 「특정 범죄자에 대한 위치추적 전자장치 부착 등에 관한 법률」에 의한 전자감시제도는 사후적 처분인 형벌과 구별되는 일종의 보안처분으로서, 위 법률이 개정되어 부착명령기간을 연장하도록 규정하고 있더라도 소급입법금지의 원칙에 위배되지 아니한다.", true, "▸ 전자감시제도는 일종의 보안처분으로, 범죄행위를 한 자에 대한 응보를 주된 목적으로 그 책임을 추궁하는 사후적 처분인 형벌과 구별되어 그 본질을 달리하는 것으로서 형벌에 관한 소급입법금지의 원칙이 그대로 적용되지 않으므로, 위 법률이 개정되어 부착명령 기간을 연장하도록 규정하고 있더라도 그것이 소급입법금지의 원칙에 반한다고 볼 수 없다(2010도11996).", "죄형법정주의"],
["014", "「성폭력범죄의 처벌 등에 관한 특례법」상 신상정보 공개·고지명령은 보안처분으로서 형벌적 효과나 신체의 자유를 박탈하는 효과를 가져오지 아니하므로 그에 대해서는 소급효금지의 원칙이 적용되지 않는다.", true, "▸ [AI해설] 성폭력범죄자 신상정보 공개·고지명령은 보안처분으로서 형벌적 효과나 신체의 자유 박탈 효과를 가지지 않으므로 소급효금지원칙이 적용되지 않는다는 것이 판례의 태도이다(2012도2947).", "죄형법정주의"],
["015", "「아동·청소년의 성보호에 관한 법률」에 정한 공개명령 제도는 일종의 보안처분이지만, 형벌과 본질을 달리하지 않으므로 소급입법금지의 원칙이 적용된다.", false, "▸ 아청법에 정한 공개명령 제도는 일종의 보안처분으로 형벌과 구별되므로 형벌에 관한 소급입법금지의 원칙이 그대로 적용되지 않으므로, 공개명령 제도가 시행되기 이전에 범한 범죄에도 공개명령 제도를 적용하도록 아청법이 개정되었다고 하더라도 소급입법금지의 원칙에 반한다고 볼 수 없다(2010도14393).", "죄형법정주의"],
["016", "★ 처벌법규의 구성요건이 서술적 개념으로 규정되어 있지 않다면 이는 죄형법정주의에서 파생되는 명확성의 원칙에 어긋난다.[변25]", false, "▸ 죄형법정주의 명확성의 원칙은 법률이 처벌하고자 하는 행위가 무엇이며 그에 대한 형벌이 어떠한 것인지를 누구나 예견할 수 있고 그에 따라 자신의 행위를 결정할 수 있도록 구성요건을 명확하게 규정하는 것을 의미하나, 처벌법규의 구성요건이 명확하여야 한다고 하여 모든 구성요건을 단순한 서술적 개념으로 규정하여야 하는 것은 아니다(2022도10961).", "죄형법정주의"],
["017", "다소 광범위하여 법관의 보충적인 해석을 필요로 하는 개념을 사용하였다고 하더라도 건전한 상식과 법감정을 가진 사람이면 통상의 해석방법에 의하여 당해 처벌법규의 보호법익과 금지된 행위 및 처벌의 종류와 정도를 알 수 있도록 규정하였다면 처벌법규의 명확성에 배치되지 않는다.", true, "▸ [AI해설] 처벌법규가 다소 광범위하여 보충적 해석이 필요한 개념을 사용하였더라도, 건전한 상식과 법감정을 가진 사람이 통상의 해석방법으로 보호법익과 금지행위, 처벌의 종류·정도를 알 수 있다면 명확성원칙에 위배되지 않는다는 것이 판례의 태도이다(2022도10961).", "죄형법정주의"],
["018", "처벌법규의 입법목적이나 그 전체적 내용, 구조 등을 살펴보아 법률 전문가의 이해와 판단으로서 그의 구성요건 요소에 해당하는 행위유형을 정형화하거나 한정할 합리적 해석기준을 찾을 수 있다면 죄형법정주의가 요구하는 형벌법규의 명확성의 원칙에 반하는 것이 아니다.", false, "▸ 처벌법규의 입법목적이나 그 전체적 내용, 구조 등을 살펴보아 사물의 변별능력을 제대로 갖춘 '일반인'의 이해와 판단으로서 그의 구성요건 요소에 해당하는 행위유형을 정형화하거나 한정할 합리적 해석기준을 찾을 수 있다면 죄형법정주의가 요구하는 형벌법규의 명확성의 원칙에 반하는 것이 아니다(98도3665).", "죄형법정주의"],
["019", "비의료인의 주도적 자금 출연 내지 주도적 관여 사정만을 근거로 비의료인이 실질적으로 의료기관을 개설·운영하였다고 판단할 경우, 허용되는 행위와 허용되지 않는 행위의 구별이 불명확해져 죄형법정주의 원칙에 반할 수 있다.", true, "▸ ① 의료법인 명의로 개설된 의료기관의 경우, 의료인의 자격이 없는 일반인의 주도적 출연 내지 주도적 관여만을 근거로 비의료인이 의료기관을 개설·운영한 것으로 평가하기 어렵다. 비의료인의 주도적 자금 출연 내지 주도적 관여 사정만을 근거로 비의료인이 실질적으로 의료기관을 개설·운영하였다고 판단할 경우, 허용되는 행위와 허용되지 않는 행위의 구별이 불명확해져 죄형법정주의 원칙에 반할 수 있다. ② 따라서 의료법인 명의로 개설된 의료기관을 실질적으로 비의료인이 개설·운영하였다고 판단하려면, 비의료인이 의료법인 명의 의료기관의 개설·운영에 주도적으로 관여하였다는 점을 기본으로 하여, 비의료인이 외형상 형태만을 갖추고 있는 의료법인을 탈법적인 수단으로 악용하여 적법한 의료기관 개설·운영으로 가장하였다는 사정이 인정되어야 한다(2017도1807).", "죄형법정주의"],
["020", "형법 제349조 제1항의 '궁박'이나 '현저하게 부당한 이익'이라는 개념은 불명확성을 가지고 있으므로 죄형법정주의 명확성의 원칙에 위반된다.", false, "▸ 약간의 불명확성은 법관의 통상적인 해석 작용에 의하여 충분히 보완될 수 있고 건전한 상식과 통상적인 법감정을 가진 일반인이라면 금지되는 행위가 무엇인지를 예측할 수 있으므로 명확성의 원칙에 위배되지 아니한다(2005헌바19).", "죄형법정주의"],
["021", "★ 입법에도 불구하고 입법자가 의도하지 않았던 규율의 공백이 있는 사안에 대하여 법규범의 체계, 입법 의도와 목적 등에 비추어 정당하다고 평가되는 한도 내에서 그와 유사한 사안에 관한 법규범을 적용할 수 있다.[모25]", true, "▸ ① 입법에도 불구하고 입법자가 의도하지 않았던 규율의 공백이 있는 사안에 대하여 법규범의 체계, 입법 의도와 목적 등에 비추어 정당하다고 평가되는 한도 내에서 그와 유사한 사안에 관한 법규범을 적용할 수 있다. ② 형법 제307조 제1항의 행위에 대한 위법성조각사유를 규정한 형법 제310조는 군형법 제64조 제3항의 행위에 대해 유추적용된다(2023도13333).", "죄형법정주의"],
["022", "★ 형벌법규의 해석에서도 법률문언의 통상적인 의미를 벗어나지 않는 한 그 법률의 입법 취지와 목적, 입법연혁 등을 고려한 목적론적 해석이 배제되는 것은 아니다.", true, "▸ [AI해설] 형벌법규 해석에서 법률문언의 통상적 의미를 벗어나지 않는 범위 내라면 입법 취지·목적, 입법연혁 등을 고려한 목적론적 해석도 허용된다는 것이 판례의 태도이다(2005도6525).", "죄형법정주의"],
["023", "형벌법규의 해석은 엄격하여야 하고, 문언의 가능한 의미를 벗어나 피고인에게 불리한 방향으로 해석하는 것은 죄형법정주의의 확장해석금지 원칙에 따라 허용되지 아니한다.", true, "▸ [AI해설] 형벌법규의 해석은 엄격하여야 하며, 문언의 가능한 의미를 벗어나 피고인에게 불리하게 해석하는 것은 죄형법정주의의 확장해석금지원칙상 허용되지 않는다는 것이 판례의 태도이다(2015도8335).", "죄형법정주의"],
["024", "법률을 해석할 때 입법 취지와 목적, 제·개정 연혁, 법질서 전체와의 조화, 다른 법령과의 관계 등을 고려하는 체계적·논리적 해석 방법을 사용할 수 있으나, 문언 자체가 비교적 명확한 개념으로 구성되어 있다면 원칙적으로 이러한 해석 방법은 활용할 필요가 없거나 제한될 수밖에 없다.", true, "▸ [AI해설] 법률해석에서 입법 취지·목적, 제·개정 연혁, 법질서 전체와의 조화 등을 고려하는 체계적·논리적 해석은 문언이 비교적 명확한 경우 활용할 필요가 없거나 제한된다는 것이 판례의 태도이다(2015도8335).", "죄형법정주의"],
["025", "★ 법령에서 쓰인 용어에 관해 정의규정이 없는 경우에는 원칙적으로 사전적인 정의 등 일반적으로 받아들여진 의미에 따라야 한다.[모25]", true, "▸ [AI해설] 법령에 쓰인 용어에 대한 정의규정이 없으면 원칙적으로 사전적 정의 등 일반적으로 받아들여진 의미에 따라 해석하여야 한다는 것이 판례의 태도이다(2015도8335).", "죄형법정주의"],
["026", "★ 지상의 항공기가 이동할 때 '운항 중'이 된다는 이유만으로 그때 다니는 지상의 길까지 '항로'로 해석하는 것은 문언의 가능한 의미를 벗어난다.", true, "▸ A 항공사 부사장인 甲이 기장으로 하여금 계류장의 탑승교에서 분리되어 푸시백 중이던 비행기를 다시 탑승구 쪽으로 돌아가게 한 경우를, 「항공보안법」 제42조에 규정된 위력으로써 '운항 중'인 항공기의 항로를 변경하게 하였다고 보는 것은 문언의 가능한 의미를 벗어난다(2015도8335).", "죄형법정주의"],
["027", "'당한 자'라는 문언은 타인이 어떠한 행위를 하여 그로부터 위해 등을 입는 것을 뜻하고 스스로 어떠한 행위를 한 자를 포함하는 개념이 아니다. 형사법은 고의범과 과실범을 구분하여 구성요건을 정하고 있는데, 위와 같은 문언은 과실범을 처벌하는 경우에 사용하는 것으로 볼 수 있다.", true, "▸ 영유아보육법 제54조 제3항에서 처벌의 대상이 되는 자 중 '영상정보를 훼손당한 자'에 영상정보를 삭제·은닉 등의 방법으로 직접 훼손하는 행위를 한 자를 포함하는 것은 문언의 가능한 범위를 벗어난다(2019도9044).", "죄형법정주의"],
["028", "「도로교통법」 제154조 제2호의 '원동기장치자전거면허를 받지 아니하고'라는 법률문언의 통상적인 의미에는 '운전면허를 받았으나 그 후 운전면허의 효력이 정지된 경우'가 포함된다고 해석할 수 없다.[변17]", true, "▸ '운전면허를 받지 아니하고'라는 법률문언의 통상적인 의미에 '운전면허를 받았으나 그 후 운전면허의 효력이 정지된 경우'가 당연히 포함된다고는 해석할 수 없다(2011도7725). [법이 개정되었음]", "죄형법정주의"],
["029", "블로그 등 사적 인터넷 게시공간의 운영자가 게시된 이적표현물인 타인의 글을 삭제할 권한이 있는데도 이를 삭제하지 않고 그대로 둔 경우, 그 운영자의 행위를 「국가보안법」 제7조 제5항의 '소지'로 보는 것은 유추해석금지원칙에 반한다.[변17]", true, "▸ [AI해설] 이적표현물을 삭제할 권한이 있음에도 삭제하지 않고 그대로 방치한 행위를 국가보안법상 '소지'로 해석하는 것은 문언의 가능한 의미를 벗어난 유추해석으로서 허용되지 않는다는 것이 판례의 태도이다(2010도8336).", "죄형법정주의"],
["030", "★ 구 「특정 범죄자에 대한 위치추적 전자장치 부착 등에 관한 법률」 제5조 제1항 제3호에서 부착명령청구 요건으로 정한 '성폭력범죄를 2회 이상 범하여(유죄의 확정판결을 받은 경우를 포함한다)'에 '「소년법」에 의한 보호처분을 받은 전력'이 포함된다고 보는 것은 유추해석금지원칙에 반하지 않는다.[변17]", false, "▸ 피부착명령청구자가 소년법에 의한 보호처분을 받은 전력이 있다고 하더라도, 이는 유죄의 확정판결을 받은 경우에 해당하지 아니함이 명백하므로, 피부착명령청구자가 2회 이상 성폭력범죄를 범하였는지를 판단할 때 소년보호처분을 받은 전력을 고려할 것이 아니다(2011도15057).", "죄형법정주의"],
["031", "☆ 한국환경공단은 환경부장관의 위탁을 받아 건설폐기물 인계·인수에 관한 내용 등의 전산처리를 위한 전자정보처리프로그램인 올바로시스템을 구축·운영하고 있으므로, 그 업무를 수행하는 한국환경공단 임직원은 공전자기록의 작성권한자인 공무원에 해당하고, 한국환경공단은 공무소에 해당한다.", false, "▸ 한국환경공단이 환경부장관의 위탁을 받아 건설폐기물 인계·인수에 관한 내용 등의 전산처리를 위한 전자정보처리프로그램인 올바로시스템을 구축·운영하고 있더라도, 그 업무를 수행하는 한국환경공단 임직원을 공전자기록의 작성권한자인 공무원으로 보거나 한국환경공단을 공무소로 볼 수는 없다. 그리고 한국환경공단법 등이 한국환경공단 임직원을 형법 제129조 내지 제132조의 적용에 있어 공무원으로 본다고 규정한다고 하여 한국환경공단을 형법 제227조의2에 정한 공무원 또는 공무소에 해당한다고 보는 것은 형벌법규를 피고인에게 불리하게 확장해석하거나 유추해석하는 것이어서 죄형법정주의 원칙에 반한다(2016도19170).", "죄형법정주의"],
["032", "정보통신망법 제49조의 '타인의 비밀 침해 또는 누설'에서 요구되는 '정보통신망에 침입하는 등 부정한 수단 또는 방법'에 사용자가 식별부호를 입력하여 정보통신망에 접속된 상태에 있는 것을 기화로 정당한 접근권한 없는 사람이 사용자 몰래 정보통신망의 장치나 기능을 이용하는 등의 방법을 포함하는 것으로 해석하는 것은 죄형법정주의에 위배된다.", false, "▸ 사용자가 식별부호를 입력하여 정보통신망에 접속된 상태에 있는 것을 기화로 정당한 접근권한 없는 사람이 사용자 몰래 정보통신망의 장치나 기능을 이용하는 등의 방법으로 타인의 비밀을 취득·누설하는 행위도 포함된다. 그와 같은 해석이 죄형법정주의에 위배된다고 볼 수는 없다(2017도15226).", "죄형법정주의"],
["033", "원산지표시법 제14조 제2항에서 '제1항의 죄로 형을 선고받고 그 형이 확정된 후'라고 정하였으므로 공판절차 등에서 벌금형을 선고받아 확정된 경우 외에 법원으로부터 벌금형의 약식명령을 고지받은 경우까지 포함된다고 해석하는 것은 피고인에게 불리한 방향으로 지나치게 확장해석하거나 유추해석하는 것으로 허용될 수 없다.", false, "▸ 원산지표시법에서 정한 '제1항의 죄로 형을 선고받고 그 형이 확정된 후'에는 확정된 벌금형에는 공판절차에서 형을 선고받아 확정된 경우뿐만 아니라 약식절차에서 벌금형의 약식명령을 고지받아 확정된 경우까지 포함된다(2022도10961).", "죄형법정주의"],
["034", "형법 제138조(법정소동죄)에서의 '법원의 재판'에 '헌법재판소의 심판'을 포함시키는 해석은 피고인에게 불리한 확장해석이나 유추해석에 해당하지 않는다.", true, "▸ [AI해설] 형법 제138조 법정소동죄의 '법원의 재판'에 '헌법재판소의 심판'을 포함시키는 해석은 문언의 가능한 의미 범위 내의 해석으로서 피고인에게 불리한 확장·유추해석에 해당하지 않는다는 것이 판례의 태도이다(2020도12017).", "죄형법정주의"],
["035", "★ 형면제 사유에 관하여 범위를 제한적으로 유추적용하는 것은 죄형법정주의에 어긋나지 않는다.[변25]", false, "▸ 유추해석금지의 원칙은 모든 형벌법규의 구성요건과 가벌성에 관한 규정에 준용되므로, 위법성 및 책임의 조각사유나 소추조건 또는 처벌조각사유인 형면제 사유에 관하여 범위를 제한적으로 유추적용하는 것은 죄형법정주의의 파생원칙인 유추해석금지의 원칙을 위반하여 허용될 수 없다(2021도17733).", "죄형법정주의"],
["036", "★ 소추요건인 고발의 주체와 시기의 범위를 가능한 문언의 의미를 벗어나 행위자에게 불리하게 확대하는 것은 유추해석금지의 원칙에 반한다.", true, "▸ 국회에서의 증언·감정 등에 관한 법률 제15조 제1항 본문과 관련하여, 특별위원회가 소멸하였음에도 과거 특별위원회가 존속할 당시 재적위원이었던 사람이 연서로 고발할 수 있다고 해석하는 것은 소추요건인 고발의 주체와 시기에 관하여 그 범위를 행위자에게 불리하게 확대하는 것이다. 이는 가능한 문언의 의미를 벗어나므로 유추해석금지의 원칙에 반한다(2017도14749).", "죄형법정주의"],
["037", "★ 구 「청소년의 성보호에 관한 법률」 제16조의 반의사불벌죄의 경우 성범죄의 피해자인 청소년에게 의사능력이 있는 이상, 그 청소년의 처벌희망 의사표시의 철회에 법정대리인의 동의가 필요하다고 보는 것은 유추해석금지원칙에 반한다.[변17]", true, "▸ ① 소송조건에는 죄형법정주의의 파생원칙인 유추해석금지 원칙이 적용된다. ② 명문의 근거 없이 그 의사표시에 법정대리인의 동의가 필요하다고 보는 것은 유추해석에 의하여 소극적 소송조건의 요건을 제한하고 피고인·피의자에 대한 처벌가능성의 범위를 확대하는 결과가 되어 죄형법정주의 내지 거기에서 파생된 유추해석금지의 원칙에도 반한다(2009도6058 전합).", "죄형법정주의"],
["038", "★ 구 공직선거 및 선거부정방지법 제262조의 '자수'를 '범행발각 전에 자수한 경우'로 한정하는 것은 제한적 유추해석이 아니라 목적론적 축소해석에 불과하므로 죄형법정주의의 파생원칙인 유추해석금지의 원칙에 위반되지 않는다.", false, "▸ 공직선거법 제262조의 '자수'를 '범행발각 전에 자수한 경우'로 한정하는 풀이는 단순한 목적론적 축소해석에 그치는 것이 아니라, 형면제 사유에 대한 제한적 유추를 통하여 처벌범위를 실정법 이상으로 확대한 것으로서 죄형법정주의의 파생원칙인 유추해석금지의 원칙에 위반된다(96도1167).", "죄형법정주의"],
["039", "전화를 걸어 상대방의 휴대전화에 벨소리가 울리게 하거나 부재중 전화 문구 등이 표시되도록 하였다면, 실제 전화통화가 이루어졌는지와 상관없이, 피고인이 전화 또는 정보통신망을 도구로 사용하여 피해자의 휴대전화에 음향, 글 등을 '도달'하게 한 것으로 평가할 수 있으므로, 스토킹범죄의 처벌 등에 관한 법률 제2조 제1호 (다)목에서 정한 스토킹행위에 해당한다.", true, "▸ [AI해설] 실제 통화 여부와 무관하게 벨소리·부재중 문구 등을 상대방 휴대전화에 표시되게 한 행위도 정보통신망을 이용해 음향·글 등을 '도달'하게 한 것으로 평가되어 스토킹행위에 해당한다는 것이 판례의 태도이다(2022도12037).", "죄형법정주의"],
["040", "의사 등이 직접 진찰하여야 할 환자를 진찰하지 않은 채 그 환자를 대상자로 표시하여 진단서·증명서 또는 처방전을 작성·교부하였다면 의료법 제17조 제1항을 위반한 것으로 보아야 하지만, 처방전에 기재된 환자가 실제로 존재하지 않는 허무인인 경우에는 죄형법정주의의 원칙상 이를 처벌할 수는 없다.", false, "▸ 의사 등이 직접 진찰하여야 할 환자를 진찰하지 않은 채 그 환자를 대상자로 표시하여 진단서·증명서 또는 처방전을 작성·교부하였다면 의료법 제17조 제1항을 위반한 것으로 보아야 하고, 이는 환자가 실제 존재하지 않는 허무인인 경우에도 마찬가지이다(2020도13899).", "죄형법정주의"],
["041", "형벌법규에서 '타인'이나 '다른 사람'이 반드시 생존하는 사람만을 의미하는 것은 아니고 형벌법규가 보호하고자 하는 법익과 법문의 논리적 의미를 분명히 밝히는 체계적·논리적 해석을 통하여 사망한 사람도 포함될 수 있다.", true, "▸ 의료법 제19조에서 비밀의 누설을 금지하고 있는 '다른 사람'에는 생존하는 개인 이외에 이미 사망한 사람도 포함된다(2018도2844).", "죄형법정주의"],
["042", "「군형법」 제64조 제1항의 상관면전모욕죄의 구성요건은 '상관을 그 면전에서 모욕하는' 것인데, 여기에서 '면전에서'라 함은 얼굴을 마주 대한 상태를 의미하는 것임이 분명하므로, 전화를 통하여 하는 것을 면전에서의 대화라고는 할 수 없다.", true, "▸ [AI해설] 군형법상 상관면전모욕죄의 '면전에서'는 얼굴을 마주한 상태를 의미하므로 전화를 통한 발언은 면전에서의 대화로 볼 수 없다는 것이 판례의 태도이다(2002도2539).", "죄형법정주의"],
["043", "피고인과 피해자가 소속된 부대가 주한미군을 지원하는 작전을 수행하는 대한민국의 국군부대로 그 본부가 주한 미군기지 안에 위치하고 있다면, 군사기지법 제2조 제1호의 '군사기지'에 해당되지 않으므로, 군형법 제60조의6 제1호가 적용되지 않고 형법이 적용되어 폭행은 반의사불벌죄에 해당한다.", false, "▸ 군인등이 대한민국의 국군이 군사작전을 수행하기 위한 근거지에서 군인등을 폭행했다면 그곳이 대한민국의 영토 내인지, 외국군의 군사기지인지 등과 관계없이 군형법 제60조의6 제1호에 따라 형법 제260조 제3항(반의사불벌죄)이 적용되지 않는다(2020도927). [주한미군기지도 군사기지]", "죄형법정주의"],
["044", "군인에 대하여 항문성교나 그 밖의 추행을 한 사람을 처벌하는 군형법 제92조의6는 동성인 군인 사이의 항문성교나 그 밖에 이와 유사한 행위가 사적 공간에서 자발적 의사 합치에 따라 이루어지는 등 군이라는 공동사회의 건전한 생활과 군기를 직접적, 구체적으로 침해한 것으로 보기 어려운 경우에는 적용되지 않는다.", true, "▸ [AI해설] 군형법 제92조의6은 동성 군인 간 항문성교 등의 행위가 사적 공간에서 자발적 의사합치로 이루어져 군의 건전한 생활과 군기를 직접적·구체적으로 침해하였다고 보기 어려운 경우에는 적용되지 않는다는 것이 판례의 태도이다(2019도3047).", "죄형법정주의"],
["045", "피고인 乙 회사의 대표인 피고인 甲이 피고인 乙 회사가 운영하는 식당과 별도의 장소에 일정한 시설을 갖추어 식품을 만든 다음 피고인 乙 회사가 각지에서 직영하는 음식점들에 배송하는 방법으로 일괄 공급함으로써 그 음식점들을 거쳐서 최종소비자가 취식할 수 있게 한 행위는 무등록 식품제조·가공업을 한 것에 해당한다.", true, "▸ [AI해설] 별도 장소에서 식품을 만들어 자신이 운영하는 여러 음식점에 일괄 배송·공급함으로써 최종소비자가 취식하게 한 행위는 무등록 식품제조·가공업에 해당한다는 것이 판례의 태도이다(2020도13815).", "죄형법정주의"],
["046", "약사가 아닌 사람이 이미 개설된 약국의 시설과 인력을 인수하고 그 운영을 지배·관리하는 등 종전 개설자의 약국 개설·운영행위와 단절되는 새로운 개설·운영행위를 한 것으로 볼 수 있는 경우라면 약사법에서 금지하는 약사가 아닌 사람의 약국 개설행위에 해당한다.", true, "▸ [AI해설] 약사가 아닌 사람이 기존 약국의 시설과 인력을 인수하여 종전 개설자의 영업과 단절되는 새로운 개설·운영행위를 한 것으로 볼 수 있다면 약사법이 금지하는 무자격 약국개설행위에 해당한다는 것이 판례의 태도이다(2021도9051).", "죄형법정주의"],
["047", "★ 「형법」 제1조 제1항 \"범죄의 성립과 처벌은 행위 시의 법률에 따른다.\"라고 할 때의 '행위 시'라 함은 범죄행위 종료 시를 의미하므로 구법 시행 시 행위가 종료하였으나 결과는 신법 시행 시에 발생한 경우에는 신법이 적용된다.[변23]", false, "▸ 범죄의 성립과 처벌은 행위시의 법률에 의한다(형법 제1조 제1항)고 할 때의 '행위시'라 함은 '범죄행위'의 종료시를 의미한다(94도563). [범죄행위 종료시의 법인 행위시법을 적용함]", "죄형법정주의"],
["048", "★ 포괄일죄로 되는 개개의 범죄행위가 법 개정 전후에 걸쳐서 행해진 경우, 신·구법의 법정형에 대한 경중을 비교한 후 더 경한 법을 적용하여 포괄일죄로 처단하여야 한다.[변26]", false, "▸ 포괄일죄로 되는 '개개의 범죄행위'가 법 개정의 전후에 걸쳐서 행하여진 경우에는 신법과 구법의 법정형에 대한 경중을 비교하여 볼 필요도 없이 범죄실행 종료 시의 법이라고 할 수 있는 신법을 적용하여 포괄일죄로 처단하여야 한다(2019도19067). [신법이 행위시법]", "죄형법정주의"],
["049", "★ 실행행위 도중 법률이 변경되어 실행행위가 신·구법에 걸쳐 행하여진 때에는 신법 시행 전에 이미 실행행위가 착수되었으므로 이 행위에는 구법이 적용되어야 한다.[변15]", false, "▸ 변호사법 개정으로 화해관여행위가 처벌대상이 되었고, 피고인의 사건수임계약 체결과 화해관여행위가 위 변호사법의 개정 이전에 착수된 것이라 하더라도 그와 같은 관여행위가 법률개정 이후에 종료된 것이라면 변호사법위반으로 처벌할 수 있다(94도563). [범죄실행 종료시의 법은 신법]", "죄형법정주의"],
["050", "★ 계속범의 경우 실행행위가 종료되는 시점의 법률이 적용되어야 하므로, 법률이 개정되면서 그 부칙에 '개정된 법 시행 전의 행위에 대한 벌칙의 적용에 있어서는 종전의 규정에 의한다'는 경과규정을 두고 있는 경우에도 행위 전체에 대해 개정된 법을 적용하여야 한다.[변14]", false, "▸ ① 일반적으로 계속범의 경우 '실행행위가 종료되는 시점'에서의 법률이 적용되어야 할 것이다. ② 법률이 개정되면서 그 부칙에서 '개정된 법 시행 전의 행위에 대한 벌칙의 적용에 있어서는 종전의 규정에 의한다'는 경과규정을 두고 있는 경우 개정된 법이 시행되기 전의 행위에 대해서는 개정 전의 법을, 그 이후의 행위에 대해서는 개정된 법을 각각 적용하여야 한다(2001도3990). [건축법상 처벌의 대상이 되는 건축물의 용도변경행위]", "죄형법정주의"],
["051", "★ 허가받지 아니한 업체와 건설폐기물의 처리를 위한 도급계약을 체결한 자가 무허가 건설폐기물 처리업체에 위탁하여 건설폐기물을 처리하는 행위를 처벌하는 법률이 신설된 후에도 그 도급계약에 따른 건설폐기물의 처리행위를 계속하였다면, 처벌규정 신설 후에 이루어진 무허가 처리업체에 의한 건설폐기물의 위탁처리에 대하여 위 법률조항이 적용된다.[변14]", true, "▸ 구 건설폐기물의 재활용촉진에 관한 법률 제63조 제1의2호가 금지하는 행위는 건설폐기물을 허가받지 아니한 업체에 위탁하여 처리하는 행위인데, 이는 위탁처리를 위한 도급계약의 성립과 함께 범죄가 기수에 이르러 범죄행위가 종료되는 이른바 즉시범이 아니고 그 도급계약에 따른 건설폐기물의 처리행위를 계속함으로써 위법상태가 지속되는 동안 범죄행위도 종료되지 않고 계속되는 계속범의 성격을 갖는 것이므로, 도급계약이 처벌규정인 위 법률조항이 신설되기 전에 체결되었다고 하더라도, 그에 따른 건설폐기물의 처리행위가 처벌규정의 신설 후에도 종료되지 않고 계속적으로 이루어진 이상, 처벌규정 신설 후에 이루어진 무허가 처리업체에 의한 건설폐기물의 위탁처리에 대하여 위 법률조항이 적용된다(2008도8607).", "죄형법정주의"],
["052", "형을 종전보다 가볍게 형벌법규를 개정하면서 부칙으로 개정된 법의 시행 전의 범죄에 대하여 종전의 형벌법규를 적용하도록 개정하는 경우 신법우선주의에 반한다.", false, "▸ 형법 제1조 제2항 및 제8조에 의하면 범죄 후 법률의 변경에 의하여 형이 구법보다 가벼운 때에는 원칙적으로 신법에 따라야 하지만, 신법에 경과규정을 두어 이러한 신법의 적용을 배제하는 것도 허용되는 것으로서, 형을 종전보다 가볍게 형벌법규를 개정하면서 그 부칙에서 개정된 법의 시행 전의 범죄에 대하여는 종전의 형벌법규를 적용하도록 규정한다 하여 형벌불소급의 원칙이나 신법우선의 원칙에 반한다고 할 수 없다(2011도1303).", "죄형법정주의"],
["053", "형법 제1조 제2항과 형사소송법 제326조 제4호의 규정은 입법자가 법령의 변경 이후에도 종전 법령 위반행위에 대한 형사처벌을 유지한다는 내용의 경과규정을 따로 두는 경우에도 그대로 적용되어야 한다.", false, "▸ 형법 제1조 제2항과 형사소송법 제326조 제4호의 규정은 입법자가 법령의 변경 이후에도 종전 법령 위반행위에 대한 형사처벌을 유지한다는 내용의 경과규정을 따로 두지 않는 한 그대로 적용되어야 한다(2020도16420).", "죄형법정주의"],
["054", "스스로 유효기간을 구체적인 일자나 기간으로 특정하여 효력의 상실을 예정하고 있던 법령이 그 유효기간을 경과함으로써 더 이상 효력을 갖지 않게 된 경우는 형법 제1조 제2항에서 말하는 법령의 변경에 해당한다고 볼 수 없다.", true, "▸ [AI해설] 스스로 유효기간을 구체적 일자·기간으로 특정하여 효력 상실을 예정한 한시법이 그 유효기간 경과로 실효된 경우는 형법 제1조 제2항이 정한 '법령의 변경'에 해당하지 않는다는 것이 판례의 태도이다(2020도16420).", "죄형법정주의"],
["055.①", "법률이념의 변경에 의한 것이 아닌 다른 사정의 변천에 따라 그때그때의 특수한 필요에 대처하기 위하여 법령을 개폐하는 경우에는 「형법」 제1조 제2항의 규정을 적용할 수 없다.", false, "▸ 형법 제1조 제2항과 형사소송법 제326조 제4호에서 말하는 법령의 변경은 범죄의 성립 및 처벌에 관한 형벌법규 자체 또는 그로부터 수권·위임된 법령의 변경을 의미하고, 종전 법령이 범죄로 정하여 처벌한 것이 부당하였다거나 과형이 과중하였다는 반성적 고려에 따라 변경된 것인지 여부는 따지지 않으므로, 법률이념의 변경이 아닌 다른 사정의 변천에 따른 법령 개폐라 하더라도 형법 제1조 제2항이 적용된다(2020도16420 전합). [동기설 폐지]", "죄형법정주의"],
["055.②", "범죄 후 법률의 변경에 따라 범죄를 구성하지 아니하게 되거나 형이 가벼워진 경우, 반성적 고려에 따라 법률이 변경된 것인지 여부를 따지지 않고 변경된 법률을 적용하여야 한다.", true, "▸ 범죄의 성립과 처벌에 관하여 규정한 형벌법규 자체 또는 그로부터 수권 내지 위임을 받은 법령의 변경에 따라 범죄를 구성하지 아니하게 되거나 형이 가벼워진 경우에는, 종전 법령이 범죄로 정하여 처벌한 것이 부당하였다거나 과형이 과중하였다는 반성적 고려에 따라 변경된 것인지 여부를 따지지 않고 원칙적으로 형법 제1조 제2항(재판시법주의)과 형사소송법 제326조 제4호(면소)가 적용된다(2020도16420). [개정 도로교통법상 개인형 이동장치(전동킥보드) 음주운전 행위는 자동차등에 관한 제148조의2가 아니라 자전거등에 관한 제156조 제11호의 적용 대상이 됨으로써, 구성요건을 규정한 형벌법규 자체의 개정에 따라 형이 가벼워진 경우에 해당하므로, 종전 법령이 반성적 고려에 따라 변경된 것인지 여부를 따지지 않고 형법 제1조 제2항을 적용하여 신법인 제156조 제11호로 처벌할 수 있을 뿐임(동기설 폐지)]", "죄형법정주의"],
["056", "★ 형법 제1조 제2항과 형사소송법 제326조 제4호에서 말하는 법령의 변경은 해당 형벌법규에 따른 범죄의 성립 및 처벌과 직접 관련된 것이어야 하고, 이는 결국 해당 형벌법규의 가벌성에 관한 형사법적 관점의 변화를 전제로 한 법령의 변경을 의미한다.", true, "▸ 해당 형벌법규 자체 또는 그로부터 수권 내지 위임을 받은 법령이 아닌 다른 법령이 변경된 경우 형법 제1조 제2항과 형사소송법 제326조 제4호를 적용하려면, 해당 형벌법규에 따른 범죄의 성립 및 처벌과 직접적으로 관련된 형사법적 관점의 변화를 주된 근거로 하는 법령의 변경에 해당하여야 하므로, 이와 관련이 없는 법령의 변경으로 인하여 해당 형벌법규의 가벌성에 영향을 미치게 되는 경우에는 형법 제1조 제2항과 형소법 제326조 제4호가 적용되지 않는다(2020도16420).", "죄형법정주의"],
["057", "★ 형사처벌에 관한 규범적 가치판단의 요소가 배제된 극히 기술적인 규율의 변경 등에 따라 간접적인 영향을 받는 것에 불과한 경우에는 형법 제1조 제2항에서 말하는 법령의 변경에 해당한다고 볼 수 없다.", true, "▸ 해당 형벌법규와 수권 내지 위임관계에 있지 않고 보호목적과 입법취지를 달리하는 민사적·행정적 규율의 변경이나, 형사처벌에 관한 규범적 가치판단의 요소가 배제된 극히 기술적인 규율의 변경 등에 따라 간접적인 영향을 받는 것에 불과한 경우는 형법 제1조 제2항과 형사소송법 제326조 제4호에서 말하는 법령의 변경에 해당한다고 볼 수 없다(2020도16420).", "죄형법정주의"],
["058", "법무사인 피고인이 개인파산·회생사건 관련 법률사무를 위임받아 취급하여 변호사법 제109조 제1호 위반으로 기소되었는데, 범행 이후 개정된 법무사법 제2조 제1항 제6호에 의하여 '개인의 파산사건 및 개인회생사건 신청의 대리'가 법무사의 업무로 추가된 경우, 형사법적 관점의 변화를 주된 근거로 하는 법령의 변경에 해당하여, 재판시법주의가 적용된다.", false, "▸ 위 법무사법 개정은 범죄사실의 해당 형벌법규 자체인 변호사법 제109조 제1호 또는 그로부터 수권 내지 위임을 받은 법령이 아닌 별개의 다른 법령의 개정에 불과하고, 위 법무사법 개정은 형사법적 관점의 변화를 주된 근거로 하는 법령의 변경에 해당하지 않는다(2022도4610). [형법 제1조 제2항과 형소법 제326조 제4호를 적용하지 아니하고 변호사법 제109조 제1호 위반의 유죄]", "죄형법정주의"],
["059", "법인에 대한 양벌규정에 면책규정이 신설된 것은 범죄 후 법률의 변경에 의하여 그 행위가 범죄를 구성하지 않거나 형이 구법보다 경한 경우에 해당하므로, 개정된 양벌규정이 적용된다.[변13]", true, "▸ [AI해설] 법인에 대한 양벌규정에 면책규정이 신설된 것은 범죄 후 법률의 변경에 의하여 그 행위가 범죄를 구성하지 않거나 형이 구법보다 경하게 된 경우에 해당하므로 개정된 양벌규정이 적용된다는 것이 판례의 태도이다(2011도11264).", "죄형법정주의"],
["060", "★ 범죄 후 법률의 변경에 의하여 형이 경하게 변경되는 경우나 형의 변경이 없는 경우에는 형법 제1조 제2항에 따라 재판시법을 적용한다.[변23]", false, "▸ 범죄 후 법률의 변경이 있더라도 형이 중하게 변경되는 경우나 형의 변경이 없는 경우에는 제1조 제1항에 따라 행위시법을 적용하여야 한다(2021도10855).", "죄형법정주의"],
["061", "★ 범죄행위 시와 재판 시 사이에 수차 법률이 개정되어 형이 변경된 경우 그 전부의 법률을 비교하여 가장 형이 가벼운 법률을 적용하여야 한다.[변15]", true, "▸ 행위시와 재판시 사이에 수차 법령의 변경이 있는 경우에는 제1조 제2항에 의하여 직권으로 행위시법과 제1, 2심 판시법의 세가지 규정에 의한 형의 경중을 비교하여 그중 가장 형이 경한 법규정을 적용하여 심판하여야 한다(68도1324).", "죄형법정주의"],
["062", "★ 범죄 후 법률의 개정에 의하여 법정형이 가벼워진 경우에는 법률에 특별한 규정이 없는 한 신법의 법정형이 공소시효기간의 기준이 된다.[변15]", true, "▸ 범죄 후 법률의 개정에 의하여 법정형이 가벼워진 경우에는 형법 제1조 제2항에 의하여 당해 범죄사실에 적용될 가벼운 법정형(신법의 법정형)이 공소시효기간의 기준이 된다(2008도4376).", "죄형법정주의"],
["063", "★ 재판확정 후 법률의 변경에 의해 범죄를 구성하지 않게 된 행위에 대하여서는 형의 집행을 면제한다.[모25]", true, "▸ 재판이 확정된 후 법률이 변경되어 그 행위가 범죄를 구성하지 아니하게 된 경우에는 형의 집행을 면제한다(형법 제1조 제3항).", "죄형법정주의"],
["064", "★ 외국인이 대한민국 공무원에게 그 공무원이 취급하는 사무에 관하여 알선한다는 명목으로 금품을 수수하는 행위가 대한민국 영역 내에서 이루어졌다 하더라도, 금품수수의 명목이 된 알선행위를 하는 장소가 대한민국 영역 외인 경우라면 대한민국의 형벌법규인 「변호사법」을 적용할 수 없다.[변19]", false, "▸ 외국인이 대한민국 공무원에게 알선한다는 명목으로 금품을 수수하는 행위가 대한민국 영역 내에서 이루어진 이상, 비록 금품수수의 명목이 된 알선행위를 하는 장소가 대한민국 영역 외라 하더라도 대한민국 영역 내에서 죄를 범한 것이라고 하여야 할 것이므로, 형법 제2조에 의하여 대한민국의 형벌법규인 변호사법 제90조 제1호가 적용되어야 한다(99도3403). [구성요건은 알선 명목 '수수']", "죄형법정주의"],
["065", "★ 「형법」 제2조는 \"본법은 대한민국영역내에서 죄를 범한 내국인과 외국인에게 적용한다\"라고 규정하고 있는바, 이를 적용함에 있어서 공모공동정범의 경우 공모지도 범죄지로 보아야 한다.[모25]", true, "▸ 형법 제2조를 적용함에 있어서 공모공동정범의 경우 공모지도 범죄지로 보아야 한다(98도2734). [공모지가 한국이므로 속지주의 적용]", "죄형법정주의"],
["066", "미국인이 서울 강남구의 한 커피숍에서 甲, 乙과 필로폰 매수를 공모한 후, 홍콩에 있는 호텔에서 홍콩인 丙으로부터 필로폰 2㎏을 미화 25,000달러에 매수하였다면, 위 미국인에 대해 대한민국 형법이 적용될 수 없다.", false, "▸ 형법 제2조를 적용함에 있어서 공모공동정범의 경우 공모지도 범죄지로 보아야 한다(98도2734). [공모지가 한국이므로 속지주의 적용]", "죄형법정주의"],
["067", "북한에서 행하여진 범죄에 대해서는 대한민국 형법이 적용되지 않는다.[변21]", false, "▸ 헌법 제3조는 대한민국의 영토는 한반도와 그 부속도서로 한다고 규정하고 있어 북한도 대한민국의 영토에 속하는 것이 분명하다(97도2021).", "죄형법정주의"],
["068", "★ 도박죄를 처벌하지 않는 미국 라스베가스에 있는 호텔 도박장에서 상습적으로 도박한 대한민국 국민의 경우 대한민국 형법을 적용하여 甲을 처벌할 수 없다.[변21]", false, "▸ 필리핀국에서 카지노의 외국인 출입이 허용된다 하여도 형법 제3조에 따라 필리핀국에서 도박을 한 대한민국 국민에게 대한민국 형법이 적용된다(99도3337).", "죄형법정주의"],
["069", "외국에 거주하는 위장결혼 알선 브로커인 한국인 甲은, 국내에 거주하는 노숙자 乙에게 100만 원을 송금해 주기로 하고 진정한 혼인의사가 없는 乙로 하여금 외국인 여성 A와의 혼인 신고서를 작성하여 ○○구청 공무원 B에게 제출하도록 하였다. B는 가족관계등록부와 동일한 공전자기록에 乙과 A가 혼인한 것으로 입력하여 등록하였다. 외국에 거주하는 甲도 우리 「형법」의 적용 대상이 된다.[변19]", true, "▸ 속인주의(형법 제3조).", "죄형법정주의"],
["070", "미국인이 미국 공항에서 중국인을 살해하였는데, 피해자가 총상을 입고 대한민국 국적의 항공기에 피신한 후 사망한 경우 살인을 한 미국인에 대해 대한민국 형법을 적용할 수 없다.", false, "▸ '죄를 범한'에는 행위지와 결과발생지 모두 포함한다(통설). 따라서 결과발생지인 사망지도 범죄지에 속하므로 대한민국 형법을 적용할 수 있다. [기국주의]", "죄형법정주의"],
["071", "영국인이 미국 영해에서 운항 중인 대한민국 국적의 선박에서 미국인을 살해한 경우에는 우리나라 「형법」이 적용된다.[변24]", true, "▸ 기국주의(형법 제4조).", "죄형법정주의"],
["072", "일본인이 행사할 목적으로 중국에서 미화 100달러 지폐를 위조한 경우에는 우리나라 「형법」이 적용된다.[변24]", true, "▸ 보호주의(형법 제5조 제4호).", "죄형법정주의"],
["073", "★ 「형법」 제6조 본문에서 정한 '대한민국 또는 대한민국 국민에 대하여 죄를 범한 때'란 대한민국 또는 대한민국 국민의 법익이 직접적으로 침해되는 결과를 야기하는 죄를 범한 경우를 의미한다.[변21]", true, "▸ [AI해설] 형법 제6조 본문의 '대한민국 또는 대한민국 국민에 대하여 죄를 범한 때'란 대한민국 또는 대한민국 국민의 법익이 직접적으로 침해되는 결과를 야기하는 죄를 범한 경우를 의미한다는 것이 판례의 태도이다(2011도6507).", "죄형법정주의"],
["074", "★ 외국인이 대한민국 영역 외에서 대한민국 국민에 대하여 범죄를 저지른 경우, 형법 제6조 단서에 규정된 행위지의 법률에 의하여 범죄를 구성하는지 여부는 엄격한 증명에 의하여 검사가 이를 증명하여야 한다.", true, "▸ 형법 제6조 본문에 의하여 외국인이 대한민국 영역 외에서 대한민국 국민에 대하여 범죄를 저지른 경우 우리 형법이 적용되지만, 같은 조 단서에 의하여 행위지 법률에 의하여 범죄를 구성하지 아니하거나 소추 또는 형의 집행을 면제할 경우에는 우리 형법을 적용하여 처벌할 수 없고, 이 경우 행위지 법률에 의하여 범죄를 구성하는지는 엄격한 증명에 의하여 검사가 이를 증명하여야 한다(2011도6507).", "죄형법정주의"],
["075", "미국인이 미국에서 총으로 대한민국 국민을 살해한 경우 세계주의에 의하여 대한민국 형법이 적용된다.", false, "▸ 형법 제6조 보호주의가 적용된다.", "죄형법정주의"],
["076", "★ 캐나다 시민권자인 甲은 캐나다에서 대한민국 국민인 피해자를 기망하여 1억 원을 자신의 캐나다 계좌로 수령하여 편취하였다. 甲은 대한민국 국민을 기망한 것이므로 행위지인 캐나다의 법과 관계없이 당연히 우리 형법이 적용된다.", false, "▸ 형법 제6조 본문에 의하여 우리 형법이 적용되지만, 같은 조 단서에 의하여 행위지 법률에 의하여 범죄를 구성하지 아니하거나 소추 또는 형의 집행을 면제할 경우에는 우리 형법을 적용하여 처벌할 수 없고, 이 경우 행위지 법률에 의하여 범죄를 구성하는지는 엄격한 증명에 의하여 검사가 이를 증명하여야 한다(2011도6507).", "죄형법정주의"],
["077", "★ 캐나다 시민권자인 甲이 캐나다에서 대한민국 국민인 A 명의로 위조한 사문서를 대한민국 국민인 B에게 행사하여 B로부터 1억 원을 편취하였다. 甲에 대한 위조사문서행사죄는 대한민국 형법을 적용하여 처벌할 수 있다.", false, "▸ 형법 제234조의 위조사문서행사죄는 형법 제5조 제1호 내지 제7호에 열거된 죄에 해당하지 않고, 위조사문서행사를 형법 제6조의 대한민국 또는 대한민국 국민의 법익을 직접적으로 침해하는 행위라고 볼 수도 없으므로, 피고인의 행위에 대하여는 우리나라에 재판권이 없다(2011도6507).", "죄형법정주의"],
["078", "★ 중국인이 우리나라로 입국하기 위하여 중국에 있는 우리나라 영사관에서 그곳에 비치된 여권발급신청서를 위조한 경우 보호주의에 의하여 우리 「형법」이 적용된다.[변24]", false, "▸ 중국 북경시에 소재한 대한민국 영사관 내부는 여전히 중국의 영토에 속할 뿐 이를 대한민국의 영토로서 그 영역에 해당한다고 볼 수 없을 뿐 아니라, 사문서위조죄가 제6조의 대한민국 또는 대한민국 국민에 대하여 범한 죄에 해당하지 아니함은 명백하므로, 외국인의 국외범에 해당하여 재판권이 없다(2006도5010).", "죄형법정주의"],
["079", "중국인이 중국에서 대한민국 국적 주식회사의 인장을 위조한 경우 형법 제6조가 적용되어, 대한민국 법원에 재판권이 있다.", false, "▸ 사인위조죄(제239조 제1항)는 제6조의 대한민국 또는 대한민국국민에 대하여 범한 죄에 해당하지 아니하므로, 외국인의 국외범으로서 재판권이 없다(2002도4929).", "죄형법정주의"],
["080", "대한민국 국민이 아닌 사람이 외국에 거주하다가 그곳을 떠나 반국가단체의 지배하에 있는 지역으로 들어가는 행위는, 국가보안법 제6조 제1항, 제2항의 탈출 개념에 포함되지 않는다.[변15]", true, "▸ ① 대한민국 국민이 아닌 사람이 외국에 거주하다가 그곳을 떠나 반국가단체의 지배하에 있는 지역으로 들어가는 행위는, 대한민국의 영역에 대한 통치권이 실지로 미치는 지역을 떠나는 행위 또는 대한민국의 국민에 대한 통치권으로부터 벗어나는 행위 어디에도 해당하지 않으므로, 이는 국가보안법 제6조 제1항, 제2항의 탈출 개념에 포함되지 않는다. ② 독일인이 독일 내에서 북한의 지령을 받아 베를린 주재 북한이익대표부를 방문하고 그곳에서 북한공작원을 만났다면 국가보안법 제6조 제2항 및 제8조 제1항의 각 구성요건상 범죄지는 모두 독일이므로 이는 외국인의 국외범에 해당하여, 형법 제5조와 제6조에서 정한 요건에 해당하지 않는 이상 위 각 조항을 적용하여 처벌할 수 없다(2004도4899). [반국가단체의 구성원 등과 회합·통신 기타의 방법으로 연락을 한 자]", "죄형법정주의"],
["081", "★ 우리나라 「형법」상 약취·유인 및 인신매매의 죄는 그 예비·음모를 제외하고 우리나라 영역 밖에서 죄를 범한 외국인에게도 적용된다.[변24]", true, "▸ 형법 제287조(미성년자의 약취, 유인), 제288조(추행 등 목적 약취, 유인 등), 제289조(인신매매), 제290조(약취, 유인, 매매·이송 등 상해치상), 제291조(약취, 유인, 매매, 이송 등 살인치사), 제292조(약취, 유인, 매매, 이송된 사람의 수수·은닉 등), 제294조(미수범)에 대해 세계주의를 규정하고 있다. 즉, 형법상 약취유인의 죄와 인신매매죄의 미수범을 포함하여 세계주의를 규정하고 있으나, 예비·음모의 경우에는 세계주의가 적용되지 않는다. [예비·음모죄의 처벌규정은 제296조]", "죄형법정주의"],
["082", "범죄에 의하여 외국에서 형의 전부 또는 일부의 집행을 받은 자에 대하여는 그 형을 감경 또는 면제할 수 있다.[변14]", false, "▸ 그 집행된 형의 전부 또는 일부를 선고하는 형에 '산입한다'(형법 제7조).", "죄형법정주의"],
["083", "대한민국 국민이 외국에서 살인죄를 범하였다가 외국법원에서 무죄 취지의 재판을 받고 석방된 후 국내에서 다시 기소되었다고 하더라도 이는 일사부재리의 원칙에 반하는 것이 아니며, 외국에서 미결 상태로 구금된 기간에 대하여도 '외국에서 집행된 형의 산입'에 관한 「형법」 제7조가 적용되어야 한다.[변18]", false, "▸ 무죄판결을 받기까지 상당 기간 '미결구금'되었더라도 이를 유죄판결에 의하여 형이 실제로 집행된 것으로 볼 수는 없으므로, 그 미결구금 기간은 제7조에 의한 산입의 대상이 될 수 없다(2017도5977).", "죄형법정주의"],
["084", "양벌규정의 '법인의 대표자'는 그 명칭 여하를 불문하고 당해 법인을 실질적으로 경영하면서 사실상 대표하고 있는 자를 포함한다.", true, "▸ [AI해설] 양벌규정의 '법인의 대표자'는 그 명칭 여하를 불문하고 당해 법인을 실질적으로 경영하면서 사실상 대표하고 있는 자를 포함한다는 것이 판례의 태도이다(96도1703).", "범죄의주체"],
["085", "법인 대표자의 법규위반행위에 대한 법인의 책임은 법인 자신의 법규위반행위로 평가될 수 있는 행위에 대한 법인의 직접책임으로서, 대표자의 고의에 의한 위반행위에 대하여는 법인 자신의 고의에 의한 책임을, 대표자의 과실에 의한 위반행위에 대하여는 법인 자신의 과실에 의한 책임을 부담한다.", true, "▸ 법인 대표자의 법규위반행위에 대한 법인의 책임은 법인 자신의 법규위반행위로 평가될 수 있는 행위에 대한 법인의 직접책임으로서, 대표자의 고의에 의한 위반행위에 대하여는 법인 자신의 고의에 의한 책임을, 대표자의 과실에 의한 위반행위에 대하여는 법인 자신의 과실에 의한 책임을 부담하는 것이다. 법인의 '대표자' 관련 부분은 대표자의 책임을 요건으로 하여 법인을 처벌하므로 책임주의원칙에 반하지 아니한다(2009헌가25).", "범죄의주체"],
["086", "양벌규정에서 직접 행위자가 아닌 법인은 국가형벌권 행사의 대상으로서 구성요건에서 정한 위반행위의 방지를 위한 주의와 감독의 해태 등을 근거로 별도의 형벌규정에 따라 법인의 직접책임 또는 자기책임에 기초하여 처벌되는 것이다.[모25]", true, "▸ [AI해설] 양벌규정에서 직접 행위자가 아닌 법인은 국가형벌권 행사의 대상으로서 구성요건에서 정한 위반행위의 방지를 위한 주의와 감독의 해태 등을 근거로 별도의 형벌규정에 따라 법인의 직접책임 또는 자기책임에 기초하여 처벌되는 것이라는 것이 판례의 태도이다(2024도15290).", "범죄의주체"],
["087", "법인의 대표자 등이 법인의 재산을 국외로 도피한 경우 행위자를 벌하는 외에 그 법인에도 벌금형을 과하는 「특정경제범죄 가중처벌 등에 관한 법률」 제4조 제4항을 법인의 대표자가 법인의 자금을 횡령하여 국외로 도피한 행위로 인해 법인이 손해만 입고 이익을 얻은 바 없는 경우에도 적용하는 것은 책임주의원칙에 반한다.", false, "▸ 설령 법인이 대표자 등의 국외재산도피 행위로 피해만 입고 이익을 얻은 바 없다 하더라도 이를 심판대상조항과 같은 법정형으로 처벌하는 것이 책임과 비례하지 않는 가혹한 형벌이라고 보기 어렵다(2015헌바443).", "범죄의주체"],
["088", "'법인의 대표자나 법인 또는 개인의 대리인·사용인 기타의 종업원이 그 법인 또는 개인의 업무에 관하여 제○○조의 규정에 의한 위반행위를 한 때에는 행위자를 벌하는 외에 그 법인 또는 개인에 대하여도 해당 조문의 벌금형을 과한다'는 내용의 양벌규정 중 '종업원' 부분은 법치국가의 원리 및 죄형법정주의로부터 도출되는 책임주의원칙에 반한다.", true, "▸ 종업원 관련 부분은 단순히 법인이 고용한 종업원 등이 업무에 관하여 범죄행위를 하였다는 이유만으로 법인에 대하여 형사처벌을 과하고 있는바, 이는 다른 사람의 범죄에 대하여 그 책임 유무를 묻지 않고 형벌을 부과함으로써 법치국가의 원리 및 죄형법정주의로부터 도출되는 책임주의원칙에 반한다(2009헌가25).", "범죄의주체"],
["089", "법인의 대리인·사용인 기타의 종업원이 그 법인의 업무에 관하여 위반행위를 한 경우 법인도 처벌하는 양벌 조항은, 형벌의 자기책임원칙에 비추어 보면 위반행위가 발생한 그 업무와 관련하여 법인이 상당한 주의 또는 관리감독 의무를 게을리한 때에 한하여 적용된다.", true, "▸ 형벌의 자기책임원칙에 비추어 보면, 위반행위가 발생한 그 업무와 관련하여 법인이 상당한 주의 또는 관리감독 의무를 게을리한 때에 한하여 구 산업안전보건법 제71조의 양벌규정이 적용된다(2008도7834).", "범죄의주체"],
["090", "양벌규정에서 법인의 사용인에는 법인과 정식 고용계약이 체결되어 근무하는 자뿐만 아니라 그 법인의 업무를 직접 또는 간접으로 수행하면서 법인의 통제·감독하에 있는 자도 포함된다.[모25]", true, "▸ 구 방문판매 등에 관한 법률 제63조에서 말하는 '법인의 사용인'에는 법인과 정식 고용계약이 체결되어 근무하는 자뿐만 아니라 그 법인의 업무를 직접 또는 간접으로 수행하면서 법인의 통제·감독하에 있는 자도 포함된다(2003도4966).", "범죄의주체"],
["091", "법인의 사용인이 객관적으로 법인의 업무를 위하여 행하는 것으로 인정할 수 있는 행위가 있어야 양벌규정에 의해 법인이 함께 처벌되는데, 사용인 등이 법인의 업무를 위한다는 의사를 가지고 행위하는 것까지 요구되지는 않는다.[모25]", false, "▸ 신용정보의 이용 및 보호에 관한 법률 제34조에 법인을 처벌하기 위한 요건으로서 규정한 '법인의 업무에 관하여' 행한 것으로 보기 위해서는 객관적으로 법인의 업무를 위하여 하는 것으로 인정할 수 있는 행위가 있어야 하고, 주관적으로는 피용자 등이 법인의 업무를 위하여 한다는 의사를 가지고 행위함을 요한다(2004도1639).", "범죄의주체"],
["092", "양벌규정에 따른 처벌을 위해 사업자의 관리감독의무 위배를 요구하는 과실책임설에서는 이를 묻지 않는 무과실책임설에 비할 때 결과불법 측면보다 행위불법 측면이 중시된다.", true, "▸ 과실은 행위불법의 요소이다.", "범죄의주체"],
["093", "★ 벌칙규정의 적용대상자가 일정한 '업무주'로 한정되어 있는 경우, 업무주가 아니면서 그 업무를 실제로 집행하는 자가 그 벌칙규정의 위반행위를 하였다면, 그 집행하는 자는 그 벌칙규정을 적용대상으로 하고 있는 '양벌규정'에 의해 처벌될 수 있다.", true, "▸ 양벌규정은 적용대상자를 당해 업무를 실제로 집행하는 자에게까지 확장함으로써 그러한 자가 당해 업무집행과 관련하여 벌칙규정의 위반행위를 한 경우 위 양벌규정에 의하여 처벌할 수 있도록 한 행위자의 처벌규정임과 동시에 그 위반행위의 이익귀속주체인 업무주에 대한 처벌규정이다(95도2870). [양벌규정의 수범자 확대기능]", "범죄의주체"],
["094", "★ 양벌규정에 의해서 법인 또는 개인을 처벌하는 경우 그 처벌은 직접 법률을 위반한 행위자에 대한 처벌에 종속하며, 행위자에 대한 선임감독상 과실로 인하여 처벌되는 것이므로, 행위자에 대한 처벌이 법인 또는 개인에 대한 처벌의 전제조건이 된다.[변19]", false, "▸ 양벌규정에 의한 영업주의 처벌은 금지위반행위자인 종업원의 처벌에 종속하는 것이 아니라 독립하여 그 자신의 종업원에 대한 선임감독상의 과실로 인하여 처벌되는 것이므로 영업주의 과실책임을 묻는 경우 금지위반행위자인 종업원에게 구성요건상의 자격이 없다고 하더라도 영업주의 범죄성립에는 아무런 지장이 없다(87도1213).", "범죄의주체"],
["095", "지방자치단체가 그 고유의 자치사무를 처리하는 경우에는 지방자치단체는 국가기관의 일부가 아니라 국가기관과는 별도의 독립한 공법인이므로, 지방자치단체 소속 공무원이 지방자치단체 고유의 자치사무를 수행하던 중 구 도로법 제81조 내지 제85조의 규정에 의한 위반행위를 한 경우에는 지방자치단체는 같은 법 제86조의 양벌규정에 따라 처벌대상이 되는 법인에 해당한다.", true, "▸ 지방자치단체의 장이 국가로부터 위임받은 기관위임사무에 해당하는 경우에는 해당 지방자치단체가 양벌규정에 따른 처벌대상이 될 수 없다(2008도6530).", "범죄의주체"],
["096", "법인격 없는 기관에 대하여 양벌규정을 적용할 것인지에 대해서 명시적인 규정을 두고 있지 않다면, 죄형법정주의의 원칙상 법인격 없는 기관을 양벌규정에 의하여 처벌할 수는 없다.[모25]", true, "▸ 법인격 없는 공공기관에 대하여도 위 양벌규정을 적용할 것인지 여부에 대하여는 명문의 규정을 두고 있지 않으므로, 죄형법정주의의 원칙상 '법인격 없는 공공기관'을 위 양벌규정에 의하여 처벌할 수 없고, 그 경우 행위자 역시 위 양벌규정으로 처벌할 수 없다(2020도1942). [경찰청 X]", "범죄의주체"],
["097", "합병으로 인하여 소멸한 법인이 그 종업원 등의 위법행위에 대해 양벌규정에 따라 부담하던 형사책임은 그 성질상 이전을 허용하지 않는 것으로서 합병으로 인하여 존속하는 법인에 승계되지 않는다.", true, "▸ [AI해설] 합병으로 인하여 소멸한 법인이 그 종업원 등의 위법행위에 대해 양벌규정에 따라 부담하던 형사책임은 그 성질상 이전을 허용하지 않는 것으로서 합병으로 인하여 존속하는 법인에 승계되지 않는다는 것이 판례의 태도이다(2015도13946).", "범죄의주체"],
["098", "법인이 설립되기 이전의 자연인의 행위는 법인에게 어떠한 선임감독상의 과실이 있다고 할 수 없으므로, 특별한 근거규정이 없는 한 법인이 설립되기 이전에 자연인이 한 행위에 대하여 양벌규정을 적용하여 법인을 처벌할 수는 없다.[모25]", true, "▸ [AI해설] 법인이 설립되기 이전의 자연인의 행위는 법인에게 어떠한 선임감독상의 과실이 있다고 할 수 없으므로, 특별한 근거규정이 없는 한 법인이 설립되기 이전에 자연인이 한 행위에 대하여 양벌규정을 적용하여 법인을 처벌할 수는 없다는 것이 판례의 태도이다(2015도10388).", "범죄의주체"],
["099", "결과범에서는 인과관계가 요구되지만, 거동범에서는 인과관계가 요구되지 않는다.", true, "▸ [AI해설] 결과범은 구성요건상 일정한 결과의 발생을 요건으로 하므로 행위와 결과 사이의 인과관계(형법 제17조)가 요구되지만, 거동범(형식범)은 결과 발생과 무관하게 일정한 행위 자체로 구성요건이 충족되므로 인과관계 문제가 발생하지 않는다.\n\n[제1절 참고 - 인과관계 학설 개관] 형법 제17조(인과관계): 어떤 행위라도 죄의 요소되는 위험발생에 연결되지 아니한 때에는 그 결과로 인하여 벌하지 아니한다. ① 조건설, ② 원인설, ③ 상당인과관계설(경험칙상 상당한 행위만이 원인이 된다는 견해), ④ 합법칙적 조건설 및 객관적 귀속이론(행위와 결과 사이의 인과관계는 합법칙적 조건관계로 결정하되, 결과의 행위자 귀속 여부는 규범적으로 별도 검토)이 대립한다. 판례는 상당인과관계설의 입장에서, 실행행위가 결과 발생의 유일하거나 직접적인 원인일 필요는 없고 다른 사실이 개재되어 그것이 직접적 원인이 되었더라도 통상 예견할 수 있는 것이면 상당인과관계를 인정한다(93도3612). 다만 상당인과관계설은 판단기준이 불명확하다는 비판이 있어, 인과관계와 결과귀속을 구별하는 객관적 귀속이론이 타당하다는 견해도 유력하다.", "구성요건론"],
["100", "추상적 위험범에서 위험은 입법의 이유이지만 범죄의 요소로 법률에 규정되어 있지는 않다.", true, "▸ 추상적 위험범에서의 위험발생은 구성요건이 아니다.\n\n[제1절 참고 - 인과관계 학설 개관] 형법 제17조(인과관계): 어떤 행위라도 죄의 요소되는 위험발생에 연결되지 아니한 때에는 그 결과로 인하여 벌하지 아니한다. ① 조건설, ② 원인설, ③ 상당인과관계설(경험칙상 상당한 행위만이 원인이 된다는 견해), ④ 합법칙적 조건설 및 객관적 귀속이론(행위와 결과 사이의 인과관계는 합법칙적 조건관계로 결정하되, 결과의 행위자 귀속 여부는 규범적으로 별도 검토)이 대립한다. 판례는 상당인과관계설의 입장에서, 실행행위가 결과 발생의 유일하거나 직접적인 원인일 필요는 없고 다른 사실이 개재되어 그것이 직접적 원인이 되었더라도 통상 예견할 수 있는 것이면 상당인과관계를 인정한다(93도3612). 다만 상당인과관계설은 판단기준이 불명확하다는 비판이 있어, 인과관계와 결과귀속을 구별하는 객관적 귀속이론이 타당하다는 견해도 유력하다.", "구성요건론"],
["101", "물건에 대한 방화로 '공공의 위험 발생'까지 요구되는 일반물건방화죄와 같은 구체적 위험범은 결과범에 해당하므로, 실행행위와 결과 간의 인과관계가 요구된다.[모25]", true, "▸ ① 결과범은 상태범 또는 계속범, 침해범 또는 구체적 위험범일 수도 있다. 결과범에는 행위와 결과 사이에 인과관계(및 객관적 귀속)가 요구되고, 인과관계가 없으면 기수에 이르지 못한다. ② 구체적 위험범은 보호법익에 대한 구체적·현실적 위험의 발생이 구성요건에 명시되어 있는 범죄를 말하므로 결과의 발생이 구성요건의 내용이다. ③ 그러나 거동범은 행위만 있으면 범죄가 성립하므로 인과관계는 문제되지 않는다.\n\n[제1절 참고 - 인과관계 학설 개관] 형법 제17조(인과관계): 어떤 행위라도 죄의 요소되는 위험발생에 연결되지 아니한 때에는 그 결과로 인하여 벌하지 아니한다. ① 조건설, ② 원인설, ③ 상당인과관계설(경험칙상 상당한 행위만이 원인이 된다는 견해), ④ 합법칙적 조건설 및 객관적 귀속이론(행위와 결과 사이의 인과관계는 합법칙적 조건관계로 결정하되, 결과의 행위자 귀속 여부는 규범적으로 별도 검토)이 대립한다. 판례는 상당인과관계설의 입장에서, 실행행위가 결과 발생의 유일하거나 직접적인 원인일 필요는 없고 다른 사실이 개재되어 그것이 직접적 원인이 되었더라도 통상 예견할 수 있는 것이면 상당인과관계를 인정한다(93도3612). 다만 상당인과관계설은 판단기준이 불명확하다는 비판이 있어, 인과관계와 결과귀속을 구별하는 객관적 귀속이론이 타당하다는 견해도 유력하다.", "구성요건론"],
["102", "조건설은 중요한 원인과 중요하지 않은 원인을 구별하지 않고 모든 조건을 동일한 원인으로 파악하여, 행위와 결과 사이에 그 행위가 없었더라면 결과가 발생하지 않았다고 볼 수 있는 모든 조건에 대하여 인과관계를 인정한다.", true, "▸ 조건설(등가설, 절대적 제약공식)은 일정한 선행사실이 없었다면 결과가 발생하지 않았을 것이라는 가설적 제거절차(공식)에 따라 모든 조건에 대하여 동등하게 인과관계를 인정하는 견해이다.\n\n[제1절 참고 - 인과관계 학설 개관] 형법 제17조(인과관계): 어떤 행위라도 죄의 요소되는 위험발생에 연결되지 아니한 때에는 그 결과로 인하여 벌하지 아니한다. ① 조건설, ② 원인설, ③ 상당인과관계설(경험칙상 상당한 행위만이 원인이 된다는 견해), ④ 합법칙적 조건설 및 객관적 귀속이론(행위와 결과 사이의 인과관계는 합법칙적 조건관계로 결정하되, 결과의 행위자 귀속 여부는 규범적으로 별도 검토)이 대립한다. 판례는 상당인과관계설의 입장에서, 실행행위가 결과 발생의 유일하거나 직접적인 원인일 필요는 없고 다른 사실이 개재되어 그것이 직접적 원인이 되었더라도 통상 예견할 수 있는 것이면 상당인과관계를 인정한다(93도3612). 다만 상당인과관계설은 판단기준이 불명확하다는 비판이 있어, 인과관계와 결과귀속을 구별하는 객관적 귀속이론이 타당하다는 견해도 유력하다.", "구성요건론"],
["103", "가설적 제거절차에 의하여 인과관계를 판단하는 조건설은 이중적 인과관계를 부정하게 된다.", true, "▸ 조건설을 엄격하게 적용하면, 두 개의 조건 중 어느 하나만으로도 결과 발생이 충분한 이중적(택일적) 인과관계의 경우 각 조건을 개별적으로 제거해도 결과가 여전히 발생하므로 인과관계가 부정되는 문제가 있다.\n\n[제1절 참고 - 인과관계 학설 개관] 형법 제17조(인과관계): 어떤 행위라도 죄의 요소되는 위험발생에 연결되지 아니한 때에는 그 결과로 인하여 벌하지 아니한다. ① 조건설, ② 원인설, ③ 상당인과관계설(경험칙상 상당한 행위만이 원인이 된다는 견해), ④ 합법칙적 조건설 및 객관적 귀속이론(행위와 결과 사이의 인과관계는 합법칙적 조건관계로 결정하되, 결과의 행위자 귀속 여부는 규범적으로 별도 검토)이 대립한다. 판례는 상당인과관계설의 입장에서, 실행행위가 결과 발생의 유일하거나 직접적인 원인일 필요는 없고 다른 사실이 개재되어 그것이 직접적 원인이 되었더라도 통상 예견할 수 있는 것이면 상당인과관계를 인정한다(93도3612). 다만 상당인과관계설은 판단기준이 불명확하다는 비판이 있어, 인과관계와 결과귀속을 구별하는 객관적 귀속이론이 타당하다는 견해도 유력하다.", "구성요건론"],
["104", "조건설에 대하여는 단독으로 동일한 결과를 발생시킬 수 있는 수개의 조건이 결합하여 결과가 발생한 경우에 행위자의 책임을 인정해야 함에도 인과관계를 부인하게 되는 불합리한 결과가 발생한다는 비판이 있다.", true, "▸ 조건설에 대하여는, 단독으로도 동일한 결과를 발생시킬 수 있는 수개의 조건(이중적 인과관계)이 결합하여 결과가 발생한 경우 가설적 제거공식을 엄격 적용하면 각 행위자의 책임을 인정해야 함에도 인과관계를 부인하게 되는 불합리가 있다는 비판이 있다.\n\n[제1절 참고 - 인과관계 학설 개관] 형법 제17조(인과관계): 어떤 행위라도 죄의 요소되는 위험발생에 연결되지 아니한 때에는 그 결과로 인하여 벌하지 아니한다. ① 조건설, ② 원인설, ③ 상당인과관계설(경험칙상 상당한 행위만이 원인이 된다는 견해), ④ 합법칙적 조건설 및 객관적 귀속이론(행위와 결과 사이의 인과관계는 합법칙적 조건관계로 결정하되, 결과의 행위자 귀속 여부는 규범적으로 별도 검토)이 대립한다. 판례는 상당인과관계설의 입장에서, 실행행위가 결과 발생의 유일하거나 직접적인 원인일 필요는 없고 다른 사실이 개재되어 그것이 직접적 원인이 되었더라도 통상 예견할 수 있는 것이면 상당인과관계를 인정한다(93도3612). 다만 상당인과관계설은 판단기준이 불명확하다는 비판이 있어, 인과관계와 결과귀속을 구별하는 객관적 귀속이론이 타당하다는 견해도 유력하다.", "구성요건론"],
["105", "결과발생을 위해 경험칙상 상당한 조건만이 원인이 되고 이 경우 인과관계가 인정된다는 견해에 의하면, 사실적 측면과 규범적 측면을 모두 고려하여 행위와 결과 사이의 높은 가능성이라는 개연성 관계를 판단한다.", true, "▸ 상당인과관계설은 사실적 측면(조건관계)과 규범적 측면(상당성)을 모두 고려하여, 행위와 결과 사이에 경험칙상 상당한 개연성이 있는 경우에 한하여 인과관계를 인정하는 견해이다.\n\n[제1절 참고 - 인과관계 학설 개관] 형법 제17조(인과관계): 어떤 행위라도 죄의 요소되는 위험발생에 연결되지 아니한 때에는 그 결과로 인하여 벌하지 아니한다. ① 조건설, ② 원인설, ③ 상당인과관계설(경험칙상 상당한 행위만이 원인이 된다는 견해), ④ 합법칙적 조건설 및 객관적 귀속이론(행위와 결과 사이의 인과관계는 합법칙적 조건관계로 결정하되, 결과의 행위자 귀속 여부는 규범적으로 별도 검토)이 대립한다. 판례는 상당인과관계설의 입장에서, 실행행위가 결과 발생의 유일하거나 직접적인 원인일 필요는 없고 다른 사실이 개재되어 그것이 직접적 원인이 되었더라도 통상 예견할 수 있는 것이면 상당인과관계를 인정한다(93도3612). 다만 상당인과관계설은 판단기준이 불명확하다는 비판이 있어, 인과관계와 결과귀속을 구별하는 객관적 귀속이론이 타당하다는 견해도 유력하다.", "구성요건론"],
["106", "이 견해에 대하여는 인과관계와 결과귀속을 혼동한 잘못이 있을 뿐 아니라 인과관계의 판단척도가 모호하여 법적안정성을 해칠 우려가 있다는 비판이 있다.", true, "▸ 상당인과관계설에 대하여는 인과관계 판단과 결과귀속 판단을 혼동하였다는 비판, 그리고 '상당성'이라는 판단척도가 모호하여 법적 안정성을 해칠 우려가 있다는 비판이 있다.\n\n[제1절 참고 - 인과관계 학설 개관] 형법 제17조(인과관계): 어떤 행위라도 죄의 요소되는 위험발생에 연결되지 아니한 때에는 그 결과로 인하여 벌하지 아니한다. ① 조건설, ② 원인설, ③ 상당인과관계설(경험칙상 상당한 행위만이 원인이 된다는 견해), ④ 합법칙적 조건설 및 객관적 귀속이론(행위와 결과 사이의 인과관계는 합법칙적 조건관계로 결정하되, 결과의 행위자 귀속 여부는 규범적으로 별도 검토)이 대립한다. 판례는 상당인과관계설의 입장에서, 실행행위가 결과 발생의 유일하거나 직접적인 원인일 필요는 없고 다른 사실이 개재되어 그것이 직접적 원인이 되었더라도 통상 예견할 수 있는 것이면 상당인과관계를 인정한다(93도3612). 다만 상당인과관계설은 판단기준이 불명확하다는 비판이 있어, 인과관계와 결과귀속을 구별하는 객관적 귀속이론이 타당하다는 견해도 유력하다.", "구성요건론"],
["107", "행위가 시간적으로 뒤따르는 외계의 변화에 연결되고, 외계변화가 행위와 합법칙적으로 결합되어 구성요건적 결과로 실현되었을 때에 인과관계가 인정된다는 견해에 의하면, 행위와 결과 간의 전개과정이 이미 확립되어 있는 자연과학적 인과법칙에 부합하는가를 심사하여 인과관계를 판단한다.", true, "▸ 합법칙적 조건설은 행위가 시간적으로 뒤따르는 외계의 변화(결과)에 연결되고, 그 외계변화가 행위와 합법칙적으로 결합되어 구성요건적 결과로 실현되었을 때 인과관계를 인정하는 견해로서, 이미 확립된 자연과학적 인과법칙에 부합하는지를 심사한다.\n\n[제1절 참고 - 인과관계 학설 개관] 형법 제17조(인과관계): 어떤 행위라도 죄의 요소되는 위험발생에 연결되지 아니한 때에는 그 결과로 인하여 벌하지 아니한다. ① 조건설, ② 원인설, ③ 상당인과관계설(경험칙상 상당한 행위만이 원인이 된다는 견해), ④ 합법칙적 조건설 및 객관적 귀속이론(행위와 결과 사이의 인과관계는 합법칙적 조건관계로 결정하되, 결과의 행위자 귀속 여부는 규범적으로 별도 검토)이 대립한다. 판례는 상당인과관계설의 입장에서, 실행행위가 결과 발생의 유일하거나 직접적인 원인일 필요는 없고 다른 사실이 개재되어 그것이 직접적 원인이 되었더라도 통상 예견할 수 있는 것이면 상당인과관계를 인정한다(93도3612). 다만 상당인과관계설은 판단기준이 불명확하다는 비판이 있어, 인과관계와 결과귀속을 구별하는 객관적 귀속이론이 타당하다는 견해도 유력하다.", "구성요건론"],
["108", "이 견해에 대하여는 당대의 지식수준에서 알려진 법칙적 관계의 내용이 명확하게 제시되어 있지 않고, 인과관계를 인정하는 범위가 너무 넓어 결과책임을 제한하려는 형법의 목적을 실현하는 데에 문제가 있다는 비판이 있다.", true, "▸ 합법칙적 조건설에 대하여는, 당대의 지식수준에서 알려진 법칙적 관계의 내용이 명확히 제시되어 있지 않고 인과관계 인정 범위가 지나치게 넓어 결과책임을 제한하려는 형법의 목적 실현에 문제가 있다는 비판이 있다.\n\n[제1절 참고 - 인과관계 학설 개관] 형법 제17조(인과관계): 어떤 행위라도 죄의 요소되는 위험발생에 연결되지 아니한 때에는 그 결과로 인하여 벌하지 아니한다. ① 조건설, ② 원인설, ③ 상당인과관계설(경험칙상 상당한 행위만이 원인이 된다는 견해), ④ 합법칙적 조건설 및 객관적 귀속이론(행위와 결과 사이의 인과관계는 합법칙적 조건관계로 결정하되, 결과의 행위자 귀속 여부는 규범적으로 별도 검토)이 대립한다. 판례는 상당인과관계설의 입장에서, 실행행위가 결과 발생의 유일하거나 직접적인 원인일 필요는 없고 다른 사실이 개재되어 그것이 직접적 원인이 되었더라도 통상 예견할 수 있는 것이면 상당인과관계를 인정한다(93도3612). 다만 상당인과관계설은 판단기준이 불명확하다는 비판이 있어, 인과관계와 결과귀속을 구별하는 객관적 귀속이론이 타당하다는 견해도 유력하다.", "구성요건론"],
["109", "공동정범 관계에 있는 여러 사람의 행위가 경합하여 결과가 발생되었으나 그 결과발생의 원인행위가 밝혀지지 아니한 경우에는 각 행위자를 미수범으로 처벌해야 한다.", false, "▸ 공범관계에 있어 공동가공의 의사가 있었다면 동시범 등의 문제는 제기될 여지가 없다(85도1892). [공동정범의 경우 공범 모두의 행위와 결과 사이에 인과관계를 따지면 되므로 기수범으로 처벌된다.]\n\n[제1절 참고 - 인과관계 학설 개관] 형법 제17조(인과관계): 어떤 행위라도 죄의 요소되는 위험발생에 연결되지 아니한 때에는 그 결과로 인하여 벌하지 아니한다. ① 조건설, ② 원인설, ③ 상당인과관계설(경험칙상 상당한 행위만이 원인이 된다는 견해), ④ 합법칙적 조건설 및 객관적 귀속이론(행위와 결과 사이의 인과관계는 합법칙적 조건관계로 결정하되, 결과의 행위자 귀속 여부는 규범적으로 별도 검토)이 대립한다. 판례는 상당인과관계설의 입장에서, 실행행위가 결과 발생의 유일하거나 직접적인 원인일 필요는 없고 다른 사실이 개재되어 그것이 직접적 원인이 되었더라도 통상 예견할 수 있는 것이면 상당인과관계를 인정한다(93도3612). 다만 상당인과관계설은 판단기준이 불명확하다는 비판이 있어, 인과관계와 결과귀속을 구별하는 객관적 귀속이론이 타당하다는 견해도 유력하다.", "구성요건론"],
["110", "위험증대설은 적법한 대체행위를 하였다고 하더라도 동일한 결과가 발생하였을 것이 확실한 경우에 객관적 귀속을 긍정한다.", false, "▸ ① 합법적 대체행위이론(주의의무위반관련성)은 과실범에서 주의의무를 다하였더라도 결과 발생이 확실한 경우 객관적 귀속이 부정되고, 결과가 발생하지 않았을 것이 확실한 경우 객관적 귀속이 인정된다. ② 주의의무를 다하였더라도 결과가 발생할 것인지가 불확실한 경우 객관적 귀속이 인정되는지에 대하여, 결과가 발생하지 않았을 확실성에 가까운 개연성이 인정되는 경우에만 귀속을 인정하는 무죄추정설과, 결과가 발생하지 않았을 가능성만 있는 경우에도 귀속을 인정하는 위험증대설이 있고, 판례는 상당인과관계설의 입장에서 무죄추정설에 가깝다(2005도8822). [적법한 대체행위를 하였다고 하더라도 동일한 결과가 발생하였을 것이 확실한 경우에는 어떤 견해에 의하더라도 객관적 귀속이 '부정'된다.]\n\n[제1절 참고 - 인과관계 학설 개관] 형법 제17조(인과관계): 어떤 행위라도 죄의 요소되는 위험발생에 연결되지 아니한 때에는 그 결과로 인하여 벌하지 아니한다. ① 조건설, ② 원인설, ③ 상당인과관계설(경험칙상 상당한 행위만이 원인이 된다는 견해), ④ 합법칙적 조건설 및 객관적 귀속이론(행위와 결과 사이의 인과관계는 합법칙적 조건관계로 결정하되, 결과의 행위자 귀속 여부는 규범적으로 별도 검토)이 대립한다. 판례는 상당인과관계설의 입장에서, 실행행위가 결과 발생의 유일하거나 직접적인 원인일 필요는 없고 다른 사실이 개재되어 그것이 직접적 원인이 되었더라도 통상 예견할 수 있는 것이면 상당인과관계를 인정한다(93도3612). 다만 상당인과관계설은 판단기준이 불명확하다는 비판이 있어, 인과관계와 결과귀속을 구별하는 객관적 귀속이론이 타당하다는 견해도 유력하다.", "구성요건론"],
["111", "★ 의사가 설명의무를 위반한 채 의료행위를 하여 피해자에게 상해가 발생하였다고 하더라도, 업무상 과실로 인한 형사책임을 지기 위해서는 피해자의 상해와 의사의 설명의무 위반 내지 승낙취득 과정의 잘못 사이에 상당인과관계가 존재하여야 한다.", true, "▸ [AI해설] 의사가 설명의무를 위반한 채 의료행위를 하여 피해자에게 상해가 발생하였더라도, 업무상 과실로 인한 형사책임을 지기 위해서는 피해자의 상해와 의사의 설명의무 위반 내지 승낙취득 과정의 잘못 사이에 상당인과관계가 존재하여야 한다는 것이 판례의 태도이다(2010도10104).\n\n[제1절 참고 - 인과관계 학설 개관] 형법 제17조(인과관계): 어떤 행위라도 죄의 요소되는 위험발생에 연결되지 아니한 때에는 그 결과로 인하여 벌하지 아니한다. ① 조건설, ② 원인설, ③ 상당인과관계설(경험칙상 상당한 행위만이 원인이 된다는 견해), ④ 합법칙적 조건설 및 객관적 귀속이론(행위와 결과 사이의 인과관계는 합법칙적 조건관계로 결정하되, 결과의 행위자 귀속 여부는 규범적으로 별도 검토)이 대립한다. 판례는 상당인과관계설의 입장에서, 실행행위가 결과 발생의 유일하거나 직접적인 원인일 필요는 없고 다른 사실이 개재되어 그것이 직접적 원인이 되었더라도 통상 예견할 수 있는 것이면 상당인과관계를 인정한다(93도3612). 다만 상당인과관계설은 판단기준이 불명확하다는 비판이 있어, 인과관계와 결과귀속을 구별하는 객관적 귀속이론이 타당하다는 견해도 유력하다.", "구성요건론"],
["112", "의사가 시술의 위험성에 관하여 설명을 하였더라면 환자가 시술을 거부하였을 것이라는 점이 합리적 의심의 여지가 없이 증명되지 못한 경우에는 의사의 설명의무 위반과 환자의 상해 또는 사망 사이에 상당인과관계를 인정할 수 없다.[변15]", true, "▸ 의사의 설명의무 위반을 이유로 한 형사상 책임을 묻기 위해서는 의사가 시술의 위험성에 관하여 설명을 하였더라면 환자가 시술을 거부하였을 것이라는 점이 합리적 의심의 여지가 없이 증명되어야 한다(2016도13089).\n\n[제1절 참고 - 인과관계 학설 개관] 형법 제17조(인과관계): 어떤 행위라도 죄의 요소되는 위험발생에 연결되지 아니한 때에는 그 결과로 인하여 벌하지 아니한다. ① 조건설, ② 원인설, ③ 상당인과관계설(경험칙상 상당한 행위만이 원인이 된다는 견해), ④ 합법칙적 조건설 및 객관적 귀속이론(행위와 결과 사이의 인과관계는 합법칙적 조건관계로 결정하되, 결과의 행위자 귀속 여부는 규범적으로 별도 검토)이 대립한다. 판례는 상당인과관계설의 입장에서, 실행행위가 결과 발생의 유일하거나 직접적인 원인일 필요는 없고 다른 사실이 개재되어 그것이 직접적 원인이 되었더라도 통상 예견할 수 있는 것이면 상당인과관계를 인정한다(93도3612). 다만 상당인과관계설은 판단기준이 불명확하다는 비판이 있어, 인과관계와 결과귀속을 구별하는 객관적 귀속이론이 타당하다는 견해도 유력하다.", "구성요건론"],
["113", "한의사인 피고인이 피해자에게 문진하여 과거 봉침을 맞고도 별다른 이상반응이 없었다는 답변을 듣고 부작용에 대한 충분한 사전 설명 없이 봉침시술을 하였는데, 피해자가 위 시술 직후 쇼크반응을 나타내는 등 상해를 입은 경우, 피고인이 봉침시술에 앞서 설명의무를 다하였더라도 피해자가 반드시 봉침시술을 거부하였을 것이라고 볼 수 없다면, 피고인의 설명의무 위반과 상해 사이에 상당인과관계를 인정하기 어렵다.", true, "▸ 상해와 의사의 설명의무 위반 내지 승낙취득 과정의 잘못 사이에 상당인과관계가 존재하여야 한다는 법리는 한의사의 경우에도 마찬가지이다(2010도10104).\n\n[제1절 참고 - 인과관계 학설 개관] 형법 제17조(인과관계): 어떤 행위라도 죄의 요소되는 위험발생에 연결되지 아니한 때에는 그 결과로 인하여 벌하지 아니한다. ① 조건설, ② 원인설, ③ 상당인과관계설(경험칙상 상당한 행위만이 원인이 된다는 견해), ④ 합법칙적 조건설 및 객관적 귀속이론(행위와 결과 사이의 인과관계는 합법칙적 조건관계로 결정하되, 결과의 행위자 귀속 여부는 규범적으로 별도 검토)이 대립한다. 판례는 상당인과관계설의 입장에서, 실행행위가 결과 발생의 유일하거나 직접적인 원인일 필요는 없고 다른 사실이 개재되어 그것이 직접적 원인이 되었더라도 통상 예견할 수 있는 것이면 상당인과관계를 인정한다(93도3612). 다만 상당인과관계설은 판단기준이 불명확하다는 비판이 있어, 인과관계와 결과귀속을 구별하는 객관적 귀속이론이 타당하다는 견해도 유력하다.", "구성요건론"],
["114", "의사 甲이 고령의 간경변증 환자 A에게 수술과정에서 출혈 등으로 신부전이 발생하여 생명이 위험할 수 있다는 점에 대하여 설명하지 아니하고 수술하던 도중 출혈 등으로 A가 사망한 경우, A가 당해 수술의 위험성을 충분히 인식하고 있어 甲이 설명의무를 다하였더라도 A가 수술을 거부하지 않았을 것으로 인정된다면 甲의 설명의무위반과 A의 사망 사이에 인과관계가 부정된다.", true, "▸ [AI해설] 환자가 수술의 위험성을 충분히 인식하고 있어 의사가 설명의무를 다하였더라도 수술을 거부하지 않았을 것으로 인정되는 경우에는 의사의 설명의무위반과 환자의 사망 사이에 인과관계가 부정된다는 것이 판례의 태도이다(2014도11315).\n\n[제1절 참고 - 인과관계 학설 개관] 형법 제17조(인과관계): 어떤 행위라도 죄의 요소되는 위험발생에 연결되지 아니한 때에는 그 결과로 인하여 벌하지 아니한다. ① 조건설, ② 원인설, ③ 상당인과관계설(경험칙상 상당한 행위만이 원인이 된다는 견해), ④ 합법칙적 조건설 및 객관적 귀속이론(행위와 결과 사이의 인과관계는 합법칙적 조건관계로 결정하되, 결과의 행위자 귀속 여부는 규범적으로 별도 검토)이 대립한다. 판례는 상당인과관계설의 입장에서, 실행행위가 결과 발생의 유일하거나 직접적인 원인일 필요는 없고 다른 사실이 개재되어 그것이 직접적 원인이 되었더라도 통상 예견할 수 있는 것이면 상당인과관계를 인정한다(93도3612). 다만 상당인과관계설은 판단기준이 불명확하다는 비판이 있어, 인과관계와 결과귀속을 구별하는 객관적 귀속이론이 타당하다는 견해도 유력하다.", "구성요건론"],
["115", "甲과 乙은 자신들이 근무하는 A 회사 공장 외벽에 설치된 분리수거장 옆에서 담배를 피우다가 아무 생각 없이 각자 담배꽁초를 분리수거장 쪽에 던지고 자리를 떠났다. 그 이후 분리수거장에 있던 종이박스 등에 불씨가 옮겨붙어 화재가 발생하였고 그로 인해 A 회사 소유의 비료 포대가 전소되었다. 甲과 乙의 각 주의의무 위반이 화재 발생의 하나의 조건이 되지 않았더라도, 甲과 乙 각자에게 실화죄의 죄책을 인정할 수 있다.", false, "▸ ① [각자 인과관계가 판명난 경우] 실화죄에 있어서 공동의 과실이 경합되어 화재가 발생한 경우 적어도 각 과실이 화재의 발생에 대하여 하나의 조건이 된 이상은 그 공동적 원인을 제공한 사람들은 각자 실화죄의 책임을 면할 수 없다(2022도16120). ② [각자 인과관계가 판명나지 아니한 경우] 甲과 乙의 각 주의의무위반이 화재 발생의 하나의 조건이 되지 않았다면, 원인행위가 판명나지 않았으므로 형법 제19조가 적용되어 모두 실화죄의 미수범에 해당하는데, 과실범인 실화죄는 미수범 처벌규정이 없어 불가벌이다.\n\n[제1절 참고 - 인과관계 학설 개관] 형법 제17조(인과관계): 어떤 행위라도 죄의 요소되는 위험발생에 연결되지 아니한 때에는 그 결과로 인하여 벌하지 아니한다. ① 조건설, ② 원인설, ③ 상당인과관계설(경험칙상 상당한 행위만이 원인이 된다는 견해), ④ 합법칙적 조건설 및 객관적 귀속이론(행위와 결과 사이의 인과관계는 합법칙적 조건관계로 결정하되, 결과의 행위자 귀속 여부는 규범적으로 별도 검토)이 대립한다. 판례는 상당인과관계설의 입장에서, 실행행위가 결과 발생의 유일하거나 직접적인 원인일 필요는 없고 다른 사실이 개재되어 그것이 직접적 원인이 되었더라도 통상 예견할 수 있는 것이면 상당인과관계를 인정한다(93도3612). 다만 상당인과관계설은 판단기준이 불명확하다는 비판이 있어, 인과관계와 결과귀속을 구별하는 객관적 귀속이론이 타당하다는 견해도 유력하다.", "구성요건론"],
["116", "위 사안에서 만약 甲과 乙이 담배를 피우고 담배꽁초를 버린 것이 상호 독립행위인 경우, 화재 발생의 원인된 행위가 누구로부터 비롯된 것인지 판명되지 아니한 때에는 甲과 乙 모두에게 죄가 성립하지 않는다.", true, "▸ ① [각자 인과관계가 판명난 경우] 실화죄에 있어서 공동의 과실이 경합되어 화재가 발생한 경우 적어도 각 과실이 화재의 발생에 대하여 하나의 조건이 된 이상은 그 공동적 원인을 제공한 사람들은 각자 실화죄의 책임을 면할 수 없다(2022도16120). ② [각자 인과관계가 판명나지 아니한 경우] 甲과 乙의 각 주의의무위반이 화재 발생의 하나의 조건이 되지 않았다면, 원인행위가 판명나지 않았으므로 형법 제19조가 적용되어 모두 실화죄의 미수범에 해당하는데, 과실범인 실화죄는 미수범 처벌규정이 없어 불가벌이다.\n\n[제1절 참고 - 인과관계 학설 개관] 형법 제17조(인과관계): 어떤 행위라도 죄의 요소되는 위험발생에 연결되지 아니한 때에는 그 결과로 인하여 벌하지 아니한다. ① 조건설, ② 원인설, ③ 상당인과관계설(경험칙상 상당한 행위만이 원인이 된다는 견해), ④ 합법칙적 조건설 및 객관적 귀속이론(행위와 결과 사이의 인과관계는 합법칙적 조건관계로 결정하되, 결과의 행위자 귀속 여부는 규범적으로 별도 검토)이 대립한다. 판례는 상당인과관계설의 입장에서, 실행행위가 결과 발생의 유일하거나 직접적인 원인일 필요는 없고 다른 사실이 개재되어 그것이 직접적 원인이 되었더라도 통상 예견할 수 있는 것이면 상당인과관계를 인정한다(93도3612). 다만 상당인과관계설은 판단기준이 불명확하다는 비판이 있어, 인과관계와 결과귀속을 구별하는 객관적 귀속이론이 타당하다는 견해도 유력하다.", "구성요건론"],
["117", "甲이 운전하던 차가 이미 정차하였으나 뒤쫓아 오던 차가 추돌하는 바람에 甲이 앞차를 충돌하여 사고가 발생한 경우, 甲에게 앞차와의 안전거리를 준수하지 않은 위법이 있다면, 甲이 안전거리를 준수하지 않은 과실과 피해결과 사이에 상당인과관계가 있다.", false, "▸ 피고인 운전의 차가 이미 정차하였음에도 뒤쫓아오던 차의 충돌로 인하여 앞차를 충격하여 사고가 발생한 경우, 설사 피고인에게 안전거리를 준수하지 않은 위법이 있었더라도 그것이 피해결과에 대하여 인과관계가 있다고 단정할 수 없다(82도3222).\n\n[제1절 참고 - 인과관계 학설 개관] 형법 제17조(인과관계): 어떤 행위라도 죄의 요소되는 위험발생에 연결되지 아니한 때에는 그 결과로 인하여 벌하지 아니한다. ① 조건설, ② 원인설, ③ 상당인과관계설(경험칙상 상당한 행위만이 원인이 된다는 견해), ④ 합법칙적 조건설 및 객관적 귀속이론(행위와 결과 사이의 인과관계는 합법칙적 조건관계로 결정하되, 결과의 행위자 귀속 여부는 규범적으로 별도 검토)이 대립한다. 판례는 상당인과관계설의 입장에서, 실행행위가 결과 발생의 유일하거나 직접적인 원인일 필요는 없고 다른 사실이 개재되어 그것이 직접적 원인이 되었더라도 통상 예견할 수 있는 것이면 상당인과관계를 인정한다(93도3612). 다만 상당인과관계설은 판단기준이 불명확하다는 비판이 있어, 인과관계와 결과귀속을 구별하는 객관적 귀속이론이 타당하다는 견해도 유력하다.", "구성요건론"],
["118", "자동차의 운전자가 통상 예견되는 상황에 대비하여 결과를 회피할 수 있는 정도의 주의의무를 다하지 못한 것이 교통사고 발생의 직접적인 원인이 되었다고 하더라도, 자동차가 보행자를 직접 충격한 것이 아니고 보행자가 자동차의 급정거에 놀라 도로에 넘어져 상해를 입은 경우에는 운전자의 업무상 주의의무 위반과 교통사고 발생 사이에 상당인과관계를 인정할 수 없다.", false, "▸ 자동차의 운전자가 통상 예견되는 상황에 대비하여 결과를 회피할 수 있는 정도의 주의의무를 다하지 못한 것이 교통사고 발생의 직접적인 원인이 되었다면, 비록 자동차가 보행자를 직접 충격한 것이 아니고 보행자가 자동차의 급정거에 놀라 도로에 넘어져 상해를 입은 경우라고 할지라도, 업무상 주의의무 위반과 교통사고 발생 사이에 상당인과관계를 인정할 수 있다(2022도1401).\n\n[제1절 참고 - 인과관계 학설 개관] 형법 제17조(인과관계): 어떤 행위라도 죄의 요소되는 위험발생에 연결되지 아니한 때에는 그 결과로 인하여 벌하지 아니한다. ① 조건설, ② 원인설, ③ 상당인과관계설(경험칙상 상당한 행위만이 원인이 된다는 견해), ④ 합법칙적 조건설 및 객관적 귀속이론(행위와 결과 사이의 인과관계는 합법칙적 조건관계로 결정하되, 결과의 행위자 귀속 여부는 규범적으로 별도 검토)이 대립한다. 판례는 상당인과관계설의 입장에서, 실행행위가 결과 발생의 유일하거나 직접적인 원인일 필요는 없고 다른 사실이 개재되어 그것이 직접적 원인이 되었더라도 통상 예견할 수 있는 것이면 상당인과관계를 인정한다(93도3612). 다만 상당인과관계설은 판단기준이 불명확하다는 비판이 있어, 인과관계와 결과귀속을 구별하는 객관적 귀속이론이 타당하다는 견해도 유력하다.", "구성요건론"],
["119", "운전자가 차를 세워 시동을 끄고 1단 기어가 들어가 있는 상태에서 시동열쇠를 끼워 놓은 채 11세 남짓한 어린이를 조수석에 남겨두고 차에서 내려온 동안 그 어린이가 시동열쇠를 돌리며 액셀러레이터 페달을 밟아 차량이 진행하여 사고가 발생하였다면, 위 어린이를 먼저 하차시키던가 운전기기를 만지지 않도록 주의를 주거나 손브레이크를 채운 뒤 시동열쇠를 빼는 등 사고를 미리 막을 수 있는 제반조치를 취할 업무상 주의의무를 다하지 않은 과실은 사고결과와 인과관계가 있다.", true, "▸ [AI해설] 시동열쇠를 끼워둔 채 어린이를 조수석에 남겨두고 하차하여 어린이가 조작한 차량에 의해 사고가 발생한 경우, 사고를 미리 막을 수 있는 제반조치를 취할 업무상 주의의무를 다하지 않은 과실은 사고결과와 인과관계가 인정된다는 것이 판례의 태도이다(86도1048).\n\n[제1절 참고 - 인과관계 학설 개관] 형법 제17조(인과관계): 어떤 행위라도 죄의 요소되는 위험발생에 연결되지 아니한 때에는 그 결과로 인하여 벌하지 아니한다. ① 조건설, ② 원인설, ③ 상당인과관계설(경험칙상 상당한 행위만이 원인이 된다는 견해), ④ 합법칙적 조건설 및 객관적 귀속이론(행위와 결과 사이의 인과관계는 합법칙적 조건관계로 결정하되, 결과의 행위자 귀속 여부는 규범적으로 별도 검토)이 대립한다. 판례는 상당인과관계설의 입장에서, 실행행위가 결과 발생의 유일하거나 직접적인 원인일 필요는 없고 다른 사실이 개재되어 그것이 직접적 원인이 되었더라도 통상 예견할 수 있는 것이면 상당인과관계를 인정한다(93도3612). 다만 상당인과관계설은 판단기준이 불명확하다는 비판이 있어, 인과관계와 결과귀속을 구별하는 객관적 귀속이론이 타당하다는 견해도 유력하다.", "구성요건론"],
["120", "임차인이 자신의 비용으로 설치·사용하던 가스설비의 휴즈콕크를 아무런 조치 없이 제거하고 이사를 간 후 가스공급을 개별적으로 차단할 수 있는 주밸브가 열려져 가스가 유입되어 폭발사고가 발생하였다면, 그 휴즈콕크를 제거하면서 그 제거부분에 아무런 조치를 하지 않고 방치한 임차인의 과실은 가스폭발사고와 상당인과관계가 인정된다.", true, "▸ ① [임차인] 임차인의 과실은 가스폭발사고와 상당인과관계가 인정된다(주밸브가 열려진 원인 및 점화원이 밝혀지지 않았다고 하여 달리 볼 것은 아니다). ② [임대인] 그러나 임대인이 종전의 임차인으로부터 가스와 관련한 수선요청을 받았다거나 휴즈콕크를 제거하였다는 사실을 고지받았다고 볼 만한 자료가 없고, 임대인으로서는 임차인이 그 제거부분에 아무런 조치를 취함이 없이 임의로 휴즈콕크를 제거하여 갔으리라고 상상하기 어려워 보이는 점 등에 비추어 보면, 임대인이 이 사건 주택을 임대함에 있어서 이 사건 휴즈콕크가 제거된 사실을 발견하지 못함으로써 결과적으로 하자 있는 상태의 주택을 임대하게 되었다고 하더라도 가스누출로 인한 가스폭발사고에 대하여 어떠한 과실책임이 있다고 보기 어렵다(99도5086).\n\n[제1절 참고 - 인과관계 학설 개관] 형법 제17조(인과관계): 어떤 행위라도 죄의 요소되는 위험발생에 연결되지 아니한 때에는 그 결과로 인하여 벌하지 아니한다. ① 조건설, ② 원인설, ③ 상당인과관계설(경험칙상 상당한 행위만이 원인이 된다는 견해), ④ 합법칙적 조건설 및 객관적 귀속이론(행위와 결과 사이의 인과관계는 합법칙적 조건관계로 결정하되, 결과의 행위자 귀속 여부는 규범적으로 별도 검토)이 대립한다. 판례는 상당인과관계설의 입장에서, 실행행위가 결과 발생의 유일하거나 직접적인 원인일 필요는 없고 다른 사실이 개재되어 그것이 직접적 원인이 되었더라도 통상 예견할 수 있는 것이면 상당인과관계를 인정한다(93도3612). 다만 상당인과관계설은 판단기준이 불명확하다는 비판이 있어, 인과관계와 결과귀속을 구별하는 객관적 귀속이론이 타당하다는 견해도 유력하다.", "구성요건론"],
["121", "가습기 살균제 제조업자가 가습기 살균제의 주요 성분에 대한 급성 흡입독성시험을 실시하였다면 해당 제품의 유해성을 확인할 수 있었음에도 불구하고 그와 같은 시험을 실시하지 아니하였고 해당 가습기 살균제를 사용한 다수의 사람이 가습기 살균제의 독성으로 인하여 사망한 경우, 급성 흡입독성시험을 실시하지 않은 업무상과실과 피해자의 사망 사이에 인과관계가 인정된다.", true, "▸ [AI해설] 가습기 살균제 제조업자가 실시할 수 있었던 급성 흡입독성시험을 실시하지 않은 업무상과실과 이를 사용한 피해자들의 사망 사이에는 인과관계가 인정된다는 것이 판례의 태도이다(2017도12537).\n\n[제1절 참고 - 인과관계 학설 개관] 형법 제17조(인과관계): 어떤 행위라도 죄의 요소되는 위험발생에 연결되지 아니한 때에는 그 결과로 인하여 벌하지 아니한다. ① 조건설, ② 원인설, ③ 상당인과관계설(경험칙상 상당한 행위만이 원인이 된다는 견해), ④ 합법칙적 조건설 및 객관적 귀속이론(행위와 결과 사이의 인과관계는 합법칙적 조건관계로 결정하되, 결과의 행위자 귀속 여부는 규범적으로 별도 검토)이 대립한다. 판례는 상당인과관계설의 입장에서, 실행행위가 결과 발생의 유일하거나 직접적인 원인일 필요는 없고 다른 사실이 개재되어 그것이 직접적 원인이 되었더라도 통상 예견할 수 있는 것이면 상당인과관계를 인정한다(93도3612). 다만 상당인과관계설은 판단기준이 불명확하다는 비판이 있어, 인과관계와 결과귀속을 구별하는 객관적 귀속이론이 타당하다는 견해도 유력하다.", "구성요건론"],
["122", "4일 가량 물조차 제대로 마시지 못하고 잠도 자지 아니하여 거의 탈진 상태에 이른 피해자의 손과 발을 17시간 이상 묶어 두고 좁은 차량 속에서 움직이지 못하게 감금한 행위와 묶인 부위의 혈액 순환에 장애가 발생하여 혈전이 형성되고 그 혈전이 폐동맥을 막아 사망에 이르게 된 결과 사이에는 상당인과관계가 있다.", true, "▸ [AI해설] 탈진 상태의 피해자를 장시간 묶어 감금한 행위와 그로 인한 혈전으로 사망에 이른 결과 사이에는 상당인과관계가 인정된다는 것이 판례의 태도이다(2002도4315).\n\n[제1절 참고 - 인과관계 학설 개관] 형법 제17조(인과관계): 어떤 행위라도 죄의 요소되는 위험발생에 연결되지 아니한 때에는 그 결과로 인하여 벌하지 아니한다. ① 조건설, ② 원인설, ③ 상당인과관계설(경험칙상 상당한 행위만이 원인이 된다는 견해), ④ 합법칙적 조건설 및 객관적 귀속이론(행위와 결과 사이의 인과관계는 합법칙적 조건관계로 결정하되, 결과의 행위자 귀속 여부는 규범적으로 별도 검토)이 대립한다. 판례는 상당인과관계설의 입장에서, 실행행위가 결과 발생의 유일하거나 직접적인 원인일 필요는 없고 다른 사실이 개재되어 그것이 직접적 원인이 되었더라도 통상 예견할 수 있는 것이면 상당인과관계를 인정한다(93도3612). 다만 상당인과관계설은 판단기준이 불명확하다는 비판이 있어, 인과관계와 결과귀속을 구별하는 객관적 귀속이론이 타당하다는 견해도 유력하다.", "구성요건론"],
["123", "교통방해치사상죄가 성립하려면 교통방해행위가 피해자의 사상이라는 결과를 발생하게 한 유일하거나 직접적인 원인이 될 필요가 없고, 그 행위와 결과 사이에 피해자나 제3자의 과실 등 다른 사실이 개재된 경우라도 그와 같은 사실이 통상 예견될 수 있는 것이라면 상당인과관계를 인정할 수 있다.", true, "▸ 교통방해행위가 피해자 사상의 유일하거나 직접적인 원인일 필요는 없고, 그 행위와 결과 사이에 피해자나 제3자의 과실 등 다른 사실이 개재되었더라도 통상 예견될 수 있는 것이라면 상당인과관계가 인정된다. 편도 2차로 고속도로 1차로에 정차한 행위로 뒤따르던 차량이 연쇄추돌하여 사망자가 발생한 사안에서도, 다른 차량 운전자가 주의의무를 완전히 다하지 않을 수 있음을 충분히 알 수 있었다는 이유로 상당인과관계와 예견가능성이 인정되어 일반교통방해치사상죄가 성립하였다(2014도6206).\n\n[제1절 참고 - 인과관계 학설 개관] 형법 제17조(인과관계): 어떤 행위라도 죄의 요소되는 위험발생에 연결되지 아니한 때에는 그 결과로 인하여 벌하지 아니한다. ① 조건설, ② 원인설, ③ 상당인과관계설(경험칙상 상당한 행위만이 원인이 된다는 견해), ④ 합법칙적 조건설 및 객관적 귀속이론(행위와 결과 사이의 인과관계는 합법칙적 조건관계로 결정하되, 결과의 행위자 귀속 여부는 규범적으로 별도 검토)이 대립한다. 판례는 상당인과관계설의 입장에서, 실행행위가 결과 발생의 유일하거나 직접적인 원인일 필요는 없고 다른 사실이 개재되어 그것이 직접적 원인이 되었더라도 통상 예견할 수 있는 것이면 상당인과관계를 인정한다(93도3612). 다만 상당인과관계설은 판단기준이 불명확하다는 비판이 있어, 인과관계와 결과귀속을 구별하는 객관적 귀속이론이 타당하다는 견해도 유력하다.", "구성요건론"],
["124", "甲이 고속도로 2차로를 따라 자동차를 운전하다가 1차로를 진행하던 A의 차량 앞에 급하게 끼어든 후 곧바로 정차하여, A의 차량 및 이를 뒤따르던 차량 2대는 연이어 급제동하여 정차하였으나 그 뒤를 따라오던 B의 차량이 앞의 차량들을 연쇄적으로 추돌케 하여 B를 사망에 이르게 한 경우, B에게 주의의무를 위반한 과실이 있다면 甲의 정차 행위와 B의 사망 사이에 인과관계가 인정되지 않는다.", false, "▸ 편도 2차로의 고속도로 1차로 한가운데에 정차한 피고인은 현장의 교통상황이나 일반인의 운전 습관·행태 등에 비추어 고속도로를 주행하는 다른 차량 운전자들이 제한속도 준수나 안전거리 확보 등의 주의의무를 완전하게 다하지 않을 수도 있다는 점을 알았거나 충분히 알 수 있었으므로, 피고인의 정차 행위와 사상의 결과 발생 사이에 상당인과관계가 있고 사상의 결과 발생에 대한 예견가능성도 인정되므로, 피고인에게 일반교통방해치사상죄가 성립한다(2014도6206).\n\n[제1절 참고 - 인과관계 학설 개관] 형법 제17조(인과관계): 어떤 행위라도 죄의 요소되는 위험발생에 연결되지 아니한 때에는 그 결과로 인하여 벌하지 아니한다. ① 조건설, ② 원인설, ③ 상당인과관계설(경험칙상 상당한 행위만이 원인이 된다는 견해), ④ 합법칙적 조건설 및 객관적 귀속이론(행위와 결과 사이의 인과관계는 합법칙적 조건관계로 결정하되, 결과의 행위자 귀속 여부는 규범적으로 별도 검토)이 대립한다. 판례는 상당인과관계설의 입장에서, 실행행위가 결과 발생의 유일하거나 직접적인 원인일 필요는 없고 다른 사실이 개재되어 그것이 직접적 원인이 되었더라도 통상 예견할 수 있는 것이면 상당인과관계를 인정한다(93도3612). 다만 상당인과관계설은 판단기준이 불명확하다는 비판이 있어, 인과관계와 결과귀속을 구별하는 객관적 귀속이론이 타당하다는 견해도 유력하다.", "구성요건론"],
["125", "살인의 실행행위와 피해자의 사망 사이에 다른 사실이 개재되어 그 사실이 사망의 직접적인 원인이 되었다면, 그 사실이 통상 예견할 수 있는 것이라 하더라도 살인의 실행행위와 피해자의 사망 사이에 인과관계가 없는 것으로 보아야 한다.", false, "▸ 살인의 실행행위가 피해자의 사망이라는 결과를 발생하게 한 유일한 원인이거나 직접적인 원인이어야만 되는 것은 아니므로, 살인의 실행행위와 피해자의 사망과의 사이에 다른 사실이 개재되어 그 사실이 치사의 직접적인 원인이 되었다고 하더라도 그와 같은 사실이 통상 예견할 수 있는 것에 지나지 않는다면 살인의 실행행위와 피해자의 사망과의 사이에 인과관계가 있다(93도3612).\n\n[제1절 참고 - 인과관계 학설 개관] 형법 제17조(인과관계): 어떤 행위라도 죄의 요소되는 위험발생에 연결되지 아니한 때에는 그 결과로 인하여 벌하지 아니한다. ① 조건설, ② 원인설, ③ 상당인과관계설(경험칙상 상당한 행위만이 원인이 된다는 견해), ④ 합법칙적 조건설 및 객관적 귀속이론(행위와 결과 사이의 인과관계는 합법칙적 조건관계로 결정하되, 결과의 행위자 귀속 여부는 규범적으로 별도 검토)이 대립한다. 판례는 상당인과관계설의 입장에서, 실행행위가 결과 발생의 유일하거나 직접적인 원인일 필요는 없고 다른 사실이 개재되어 그것이 직접적 원인이 되었더라도 통상 예견할 수 있는 것이면 상당인과관계를 인정한다(93도3612). 다만 상당인과관계설은 판단기준이 불명확하다는 비판이 있어, 인과관계와 결과귀속을 구별하는 객관적 귀속이론이 타당하다는 견해도 유력하다.", "구성요건론"],
["126", "강간 피해자가 집에 돌아가 음독자살한 경우 강간행위와 자살 사이에 인과관계를 인정할 수 있다.", false, "▸ 강간을 당함으로 인하여 생긴 수치심과 장래에 대한 절망감이 있었다 하더라도 강간행위와 피해자의 자살행위 사이에 인과관계를 인정할 수는 없다(82도1446).\n\n[제1절 참고 - 인과관계 학설 개관] 형법 제17조(인과관계): 어떤 행위라도 죄의 요소되는 위험발생에 연결되지 아니한 때에는 그 결과로 인하여 벌하지 아니한다. ① 조건설, ② 원인설, ③ 상당인과관계설(경험칙상 상당한 행위만이 원인이 된다는 견해), ④ 합법칙적 조건설 및 객관적 귀속이론(행위와 결과 사이의 인과관계는 합법칙적 조건관계로 결정하되, 결과의 행위자 귀속 여부는 규범적으로 별도 검토)이 대립한다. 판례는 상당인과관계설의 입장에서, 실행행위가 결과 발생의 유일하거나 직접적인 원인일 필요는 없고 다른 사실이 개재되어 그것이 직접적 원인이 되었더라도 통상 예견할 수 있는 것이면 상당인과관계를 인정한다(93도3612). 다만 상당인과관계설은 판단기준이 불명확하다는 비판이 있어, 인과관계와 결과귀속을 구별하는 객관적 귀속이론이 타당하다는 견해도 유력하다.", "구성요건론"],
["127", "폭행 또는 협박으로 타인의 재물을 강취하려는 행위와 이에 극도의 흥분을 느끼고 공포심에 사로잡혀 이를 피하려다 입은 상해 사이에는 상당인과관계가 인정된다.", true, "▸ [AI해설] 폭행 또는 협박으로 재물을 강취하려는 행위와 이에 극도의 흥분·공포심을 느껴 이를 피하려다 입은 상해 사이에는 상당인과관계가 인정된다는 것이 판례의 태도이다(96도1142).\n\n[제1절 참고 - 인과관계 학설 개관] 형법 제17조(인과관계): 어떤 행위라도 죄의 요소되는 위험발생에 연결되지 아니한 때에는 그 결과로 인하여 벌하지 아니한다. ① 조건설, ② 원인설, ③ 상당인과관계설(경험칙상 상당한 행위만이 원인이 된다는 견해), ④ 합법칙적 조건설 및 객관적 귀속이론(행위와 결과 사이의 인과관계는 합법칙적 조건관계로 결정하되, 결과의 행위자 귀속 여부는 규범적으로 별도 검토)이 대립한다. 판례는 상당인과관계설의 입장에서, 실행행위가 결과 발생의 유일하거나 직접적인 원인일 필요는 없고 다른 사실이 개재되어 그것이 직접적 원인이 되었더라도 통상 예견할 수 있는 것이면 상당인과관계를 인정한다(93도3612). 다만 상당인과관계설은 판단기준이 불명확하다는 비판이 있어, 인과관계와 결과귀속을 구별하는 객관적 귀속이론이 타당하다는 견해도 유력하다.", "구성요건론"],
["128", "피해자가 상해행위를 피하려고 도로를 건너 도주하다가 차량에 치여 사망한 경우, 상해행위와 피해자의 사망 사이에 상당인과관계가 있다.", true, "▸ [AI해설] 피해자가 상해행위를 피하려고 도로를 건너 도주하다가 차량에 치여 사망한 경우, 상해행위와 사망 사이에 상당인과관계가 인정된다는 것이 판례의 태도이다(96도529).\n\n[제1절 참고 - 인과관계 학설 개관] 형법 제17조(인과관계): 어떤 행위라도 죄의 요소되는 위험발생에 연결되지 아니한 때에는 그 결과로 인하여 벌하지 아니한다. ① 조건설, ② 원인설, ③ 상당인과관계설(경험칙상 상당한 행위만이 원인이 된다는 견해), ④ 합법칙적 조건설 및 객관적 귀속이론(행위와 결과 사이의 인과관계는 합법칙적 조건관계로 결정하되, 결과의 행위자 귀속 여부는 규범적으로 별도 검토)이 대립한다. 판례는 상당인과관계설의 입장에서, 실행행위가 결과 발생의 유일하거나 직접적인 원인일 필요는 없고 다른 사실이 개재되어 그것이 직접적 원인이 되었더라도 통상 예견할 수 있는 것이면 상당인과관계를 인정한다(93도3612). 다만 상당인과관계설은 판단기준이 불명확하다는 비판이 있어, 인과관계와 결과귀속을 구별하는 객관적 귀속이론이 타당하다는 견해도 유력하다.", "구성요건론"],
["129", "피고인이 아파트 안방에서 안방 문에 못질을 하여 동거하던 피해자가 술집에 나갈 수 없게 감금하고, 피해자를 때리고 옷을 벗기는 등 가혹한 행위를 하여 피해자가 이를 피하기 위하여 창문을 통해 밖으로 뛰어 내리려 하자 피고인이 이를 제지한 후, 피고인이 거실로 나오는 사이에 피해자가 갑자기 안방 창문을 통하여 알몸으로 아파트 아래 잔디밭에 뛰어 내리다가 다발성 실질장기파열상 등을 입고 사망한 경우, 피고인의 중감금행위와 피해자의 사망 사이에는 인과관계가 있어 피고인은 중감금치사죄의 죄책을 진다.", true, "▸ [AI해설] 중감금 행위로 인해 피해자가 이를 벗어나려다 추락사한 경우, 중감금행위와 사망 사이에 인과관계가 인정되어 중감금치사죄가 성립한다는 것이 판례의 태도이다(91도2085).\n\n[제1절 참고 - 인과관계 학설 개관] 형법 제17조(인과관계): 어떤 행위라도 죄의 요소되는 위험발생에 연결되지 아니한 때에는 그 결과로 인하여 벌하지 아니한다. ① 조건설, ② 원인설, ③ 상당인과관계설(경험칙상 상당한 행위만이 원인이 된다는 견해), ④ 합법칙적 조건설 및 객관적 귀속이론(행위와 결과 사이의 인과관계는 합법칙적 조건관계로 결정하되, 결과의 행위자 귀속 여부는 규범적으로 별도 검토)이 대립한다. 판례는 상당인과관계설의 입장에서, 실행행위가 결과 발생의 유일하거나 직접적인 원인일 필요는 없고 다른 사실이 개재되어 그것이 직접적 원인이 되었더라도 통상 예견할 수 있는 것이면 상당인과관계를 인정한다(93도3612). 다만 상당인과관계설은 판단기준이 불명확하다는 비판이 있어, 인과관계와 결과귀속을 구별하는 객관적 귀속이론이 타당하다는 견해도 유력하다.", "구성요건론"],
["130", "甲이 자신이 경영하는 속셈학원의 강사로 A를 채용하고 학습교재를 설명하겠다는 구실로 유인하여 호텔 객실에 감금한 후 강간하려 하자, A가 완강히 반항하던 중 甲이 대실시간 연장을 위해 전화하는 사이에 객실 창문을 통해 탈출하려다가 지상에 추락하여 사망하였다면, 피고인의 강간미수행위와 피해자의 사망과의 사이에 상당인과관계가 인정되지 않으므로 甲에게는 강간미수죄가 성립한다.", false, "▸ 피고인의 강간미수행위와 피해자의 사망과의 사이에 상당인과관계가 있어 강간치사죄가 성립한다(95도425).\n\n[제1절 참고 - 인과관계 학설 개관] 형법 제17조(인과관계): 어떤 행위라도 죄의 요소되는 위험발생에 연결되지 아니한 때에는 그 결과로 인하여 벌하지 아니한다. ① 조건설, ② 원인설, ③ 상당인과관계설(경험칙상 상당한 행위만이 원인이 된다는 견해), ④ 합법칙적 조건설 및 객관적 귀속이론(행위와 결과 사이의 인과관계는 합법칙적 조건관계로 결정하되, 결과의 행위자 귀속 여부는 규범적으로 별도 검토)이 대립한다. 판례는 상당인과관계설의 입장에서, 실행행위가 결과 발생의 유일하거나 직접적인 원인일 필요는 없고 다른 사실이 개재되어 그것이 직접적 원인이 되었더라도 통상 예견할 수 있는 것이면 상당인과관계를 인정한다(93도3612). 다만 상당인과관계설은 판단기준이 불명확하다는 비판이 있어, 인과관계와 결과귀속을 구별하는 객관적 귀속이론이 타당하다는 견해도 유력하다.", "구성요건론"],
["131", "승용차로 피해자를 가로막아 승차하게 한 후 피해자의 하차 요구를 무시한 채 당초 목적지가 아닌 다른 장소를 향하며 시속 약 60km 내지 70km의 속도로 진행하여 피해자를 차량에서 내리지 못하게 하였다고 하더라도, 피해자가 그와 같은 감금상태를 벗어날 목적으로 차량을 빠져 나오려다가 떨어져 사망에 이르게 된 것이라면, 감금행위와 사망 사이에는 상당인과관계가 인정되지 않으므로 감금치사죄가 성립하지 않는다.", false, "▸ 감금행위와 피해자의 사망 사이에는 상당인과관계가 있다(99도5286).\n\n[제1절 참고 - 인과관계 학설 개관] 형법 제17조(인과관계): 어떤 행위라도 죄의 요소되는 위험발생에 연결되지 아니한 때에는 그 결과로 인하여 벌하지 아니한다. ① 조건설, ② 원인설, ③ 상당인과관계설(경험칙상 상당한 행위만이 원인이 된다는 견해), ④ 합법칙적 조건설 및 객관적 귀속이론(행위와 결과 사이의 인과관계는 합법칙적 조건관계로 결정하되, 결과의 행위자 귀속 여부는 규범적으로 별도 검토)이 대립한다. 판례는 상당인과관계설의 입장에서, 실행행위가 결과 발생의 유일하거나 직접적인 원인일 필요는 없고 다른 사실이 개재되어 그것이 직접적 원인이 되었더라도 통상 예견할 수 있는 것이면 상당인과관계를 인정한다(93도3612). 다만 상당인과관계설은 판단기준이 불명확하다는 비판이 있어, 인과관계와 결과귀속을 구별하는 객관적 귀속이론이 타당하다는 견해도 유력하다.", "구성요건론"],
["132", "피고인이 피해자를 2회에 걸쳐 두 손으로 힘껏 밀어 땅바닥에 넘어뜨려 피해자가 쇼크성 심장마비로 사망한 경우, 피해자에게 당시 심관성동맥경화 및 심근섬유화 증세 등의 심장질환의 지병이 있었고, 음주로 만취된 상태였으며 그것이 피해자의 사망에 영향을 주었다면 피고인의 폭행과 사망 사이에 상당인과관계는 인정되지 않는다.", false, "▸ 피해자를 2회에 걸쳐 두 손으로 힘껏 밀어 땅바닥에 넘어뜨리는 폭행을 가함으로써 그 충격으로 인한 쇼크성 심장마비로 사망케 하였다면 비록 위 피해자에게 심관성동맥경화 및 심근섬유화증세 등의 심장질환의 지병이 있었고 음주로 만취된 상태였으며 그것이 피해자가 사망함에 있어 영향을 주었다고 해서 피고인의 폭행과 피해자의 사망 간에 상당인과관계가 없다고 할 수 없다(85도2433).\n\n[제1절 참고 - 인과관계 학설 개관] 형법 제17조(인과관계): 어떤 행위라도 죄의 요소되는 위험발생에 연결되지 아니한 때에는 그 결과로 인하여 벌하지 아니한다. ① 조건설, ② 원인설, ③ 상당인과관계설(경험칙상 상당한 행위만이 원인이 된다는 견해), ④ 합법칙적 조건설 및 객관적 귀속이론(행위와 결과 사이의 인과관계는 합법칙적 조건관계로 결정하되, 결과의 행위자 귀속 여부는 규범적으로 별도 검토)이 대립한다. 판례는 상당인과관계설의 입장에서, 실행행위가 결과 발생의 유일하거나 직접적인 원인일 필요는 없고 다른 사실이 개재되어 그것이 직접적 원인이 되었더라도 통상 예견할 수 있는 것이면 상당인과관계를 인정한다(93도3612). 다만 상당인과관계설은 판단기준이 불명확하다는 비판이 있어, 인과관계와 결과귀속을 구별하는 객관적 귀속이론이 타당하다는 견해도 유력하다.", "구성요건론"],
["133", "피고인이 피해자의 뺨을 1회 때리고 오른손으로 목을 쳐 피해자로 하여금 넘어지면서 머리를 땅바닥에 부딪치게 하여 상해를 가하고, 이로 인하여 두부 손상을 입은 피해자로 하여금 병원에서 입원치료를 받다가 합병증으로 사망에 이르게 한 경우, 피고인의 범행과 피해자의 사망 사이에 인과관계가 인정된다.[변25]", true, "▸ [AI해설] 폭행으로 두부 손상을 입은 피해자가 입원치료 중 합병증으로 사망에 이른 경우, 폭행과 사망 사이에 인과관계가 인정된다는 것이 판례의 태도이다(2011도17648).\n\n[제1절 참고 - 인과관계 학설 개관] 형법 제17조(인과관계): 어떤 행위라도 죄의 요소되는 위험발생에 연결되지 아니한 때에는 그 결과로 인하여 벌하지 아니한다. ① 조건설, ② 원인설, ③ 상당인과관계설(경험칙상 상당한 행위만이 원인이 된다는 견해), ④ 합법칙적 조건설 및 객관적 귀속이론(행위와 결과 사이의 인과관계는 합법칙적 조건관계로 결정하되, 결과의 행위자 귀속 여부는 규범적으로 별도 검토)이 대립한다. 판례는 상당인과관계설의 입장에서, 실행행위가 결과 발생의 유일하거나 직접적인 원인일 필요는 없고 다른 사실이 개재되어 그것이 직접적 원인이 되었더라도 통상 예견할 수 있는 것이면 상당인과관계를 인정한다(93도3612). 다만 상당인과관계설은 판단기준이 불명확하다는 비판이 있어, 인과관계와 결과귀속을 구별하는 객관적 귀속이론이 타당하다는 견해도 유력하다.", "구성요건론"],
["134", "피고인이 피해자의 멱살을 잡아 흔들고 주먹으로 가슴과 얼굴을 1회씩 구타하고 멱살을 붙들고 넘어뜨리는 등 신체 여러 부위에 외상이 생길 정도로 심하게 폭행을 가함으로써 평소에 오른쪽 관상동맥폐쇄 및 심실의 허혈성심근섬유화증세 등의 심장질환을 앓고 있던 피해자의 심장에 더욱 부담을 주어 나쁜 영향을 초래하도록 하였다면, 비록 피해자가 관상동맥부전과 허혈성심근경색 등으로 사망하였더라도, 피고인의 폭행과 피해자의 사망과 간에 상당인과관계가 인정된다.", true, "▸ [AI해설] 지병이 있는 피해자에게 폭행을 가하여 심장에 부담을 주어 사망에 이르게 한 경우, 관상동맥부전 등이 사망의 직접 원인이었더라도 폭행과 사망 사이에 상당인과관계가 인정된다는 것이 판례의 태도이다(89도556).\n\n[제1절 참고 - 인과관계 학설 개관] 형법 제17조(인과관계): 어떤 행위라도 죄의 요소되는 위험발생에 연결되지 아니한 때에는 그 결과로 인하여 벌하지 아니한다. ① 조건설, ② 원인설, ③ 상당인과관계설(경험칙상 상당한 행위만이 원인이 된다는 견해), ④ 합법칙적 조건설 및 객관적 귀속이론(행위와 결과 사이의 인과관계는 합법칙적 조건관계로 결정하되, 결과의 행위자 귀속 여부는 규범적으로 별도 검토)이 대립한다. 판례는 상당인과관계설의 입장에서, 실행행위가 결과 발생의 유일하거나 직접적인 원인일 필요는 없고 다른 사실이 개재되어 그것이 직접적 원인이 되었더라도 통상 예견할 수 있는 것이면 상당인과관계를 인정한다(93도3612). 다만 상당인과관계설은 판단기준이 불명확하다는 비판이 있어, 인과관계와 결과귀속을 구별하는 객관적 귀속이론이 타당하다는 견해도 유력하다.", "구성요건론"],
["135", "피고인이 주먹으로 피해자의 복부를 1회 강타하여 장파열로 인한 복막염으로 사망케 하였다면, 비록 의사의 수술 지연 등 과실이 피해자의 사망의 공동원인이 되었다 하더라도 피고인의 행위가 사망의 결과에 대한 유력한 원인이 된 이상 그 폭력행위와 치사의 결과간에는 인과관계가 있다 할 것이어서 피고인은 피해자의 사망의 결과에 대해 폭행치사의 죄책을 면할 수 없다.", true, "▸ [AI해설] 폭행으로 장파열을 일으켜 복막염으로 사망에 이른 경우, 의사의 수술 지연 등 과실이 사망의 공동원인이 되었더라도 폭행이 사망의 유력한 원인인 이상 인과관계가 인정되어 폭행치사죄가 성립한다는 것이 판례의 태도이다(84도831).\n\n[제1절 참고 - 인과관계 학설 개관] 형법 제17조(인과관계): 어떤 행위라도 죄의 요소되는 위험발생에 연결되지 아니한 때에는 그 결과로 인하여 벌하지 아니한다. ① 조건설, ② 원인설, ③ 상당인과관계설(경험칙상 상당한 행위만이 원인이 된다는 견해), ④ 합법칙적 조건설 및 객관적 귀속이론(행위와 결과 사이의 인과관계는 합법칙적 조건관계로 결정하되, 결과의 행위자 귀속 여부는 규범적으로 별도 검토)이 대립한다. 판례는 상당인과관계설의 입장에서, 실행행위가 결과 발생의 유일하거나 직접적인 원인일 필요는 없고 다른 사실이 개재되어 그것이 직접적 원인이 되었더라도 통상 예견할 수 있는 것이면 상당인과관계를 인정한다(93도3612). 다만 상당인과관계설은 판단기준이 불명확하다는 비판이 있어, 인과관계와 결과귀속을 구별하는 객관적 귀속이론이 타당하다는 견해도 유력하다.", "구성요건론"],
["136", "피고인이 제왕절개수술 후 대량출혈이 있었던 피해자를 전원 조치하였으나 전원을 받은 병원 의료진의 조치가 다소 미흡하여 도착 후 약 1시간 20분이 지나 수혈이 시작되었으나 과다출혈 등으로 피해자가 사망한 사안에서, 비록 피고인의 전원지체 등의 과실로 신속한 수혈 등의 조치가 지연되었다고 하더라도 피고인의 과실과 피해자의 사망 사이에 인과관계가 있다고 할 수 없다.", false, "▸ ① 피고인에게 전원과정에서 피해자의 상태 및 응급조치의 긴급성에 관하여 충분히 설명하지 않은 과실이 있다. ② 피고인이 제왕절개수술 후 대량출혈이 있었던 피해자를 전원 조치하였으나 전원받는 병원 의료진의 조치가 다소 미흡하여 도착 후 약 1시간 20분이 지나 수혈이 시작된 사안에서, 피고인의 전원지체 등의 과실로 신속한 수혈 등의 조치가 지연된 이상 피해자의 사망과 피고인의 과실 사이에 인과관계가 인정된다(2009도7070).\n\n[제1절 참고 - 인과관계 학설 개관] 형법 제17조(인과관계): 어떤 행위라도 죄의 요소되는 위험발생에 연결되지 아니한 때에는 그 결과로 인하여 벌하지 아니한다. ① 조건설, ② 원인설, ③ 상당인과관계설(경험칙상 상당한 행위만이 원인이 된다는 견해), ④ 합법칙적 조건설 및 객관적 귀속이론(행위와 결과 사이의 인과관계는 합법칙적 조건관계로 결정하되, 결과의 행위자 귀속 여부는 규범적으로 별도 검토)이 대립한다. 판례는 상당인과관계설의 입장에서, 실행행위가 결과 발생의 유일하거나 직접적인 원인일 필요는 없고 다른 사실이 개재되어 그것이 직접적 원인이 되었더라도 통상 예견할 수 있는 것이면 상당인과관계를 인정한다(93도3612). 다만 상당인과관계설은 판단기준이 불명확하다는 비판이 있어, 인과관계와 결과귀속을 구별하는 객관적 귀속이론이 타당하다는 견해도 유력하다.", "구성요건론"],
["137", "고의를 구성요건적 고의와 책임고의로 나누어 고의의 이중적 지위(기능)를 인정하는 견해에 의하면 책임고의에는 위법성의 인식은 포함되지만, 객관적 행위상황의 인식은 포함되지 않는다.", false, "▸ 고의의 이중적 지위를 인정하는 견해에 의하면, 객관적 행위상황의 인식을 의미하는 구성요건적 고의와 심정반가치로서의 책임고의는 구별되고, 이러한 견해에 의하면 책임고의는 위법성의 인식과는 분리된 독자적인 책임요소이다.\n\n[제2절 참고 - 고의 관련 조문] 형법 제13조(고의): 죄의 성립요소인 사실을 인식하지 못한 행위는 벌하지 아니한다. 단, 법률에 특별한 규정이 있는 경우에는 예외로 한다. 형법 제15조(사실의 착오) ①: 특별히 무거운 죄가 되는 사실을 인식하지 못한 행위는 무거운 죄로 벌하지 아니한다.", "구성요건론"],
["138", "건장한 체격의 군인이 왜소한 체격의 사람을 폭행하고 특히 급소인 목을 설골이 부러질 정도로 세게 졸라 사망하게 한 경우에는 살인의 고의가 인정된다.[변18]", true, "▸ [AI해설] 건장한 체격의 군인이 왜소한 체격의 사람을 폭행하고 특히 급소인 목을 설골이 부러질 정도로 세게 졸라 사망하게 한 경우에는 살인의 고의가 인정된다는 것이 판례의 태도이다(2000도5590).\n\n[제2절 참고 - 고의 관련 조문] 형법 제13조(고의): 죄의 성립요소인 사실을 인식하지 못한 행위는 벌하지 아니한다. 단, 법률에 특별한 규정이 있는 경우에는 예외로 한다. 형법 제15조(사실의 착오) ①: 특별히 무거운 죄가 되는 사실을 인식하지 못한 행위는 무거운 죄로 벌하지 아니한다.", "구성요건론"],
["139", "범죄구성요건의 주관적 요소로서 미필적 고의라 함은 범죄사실의 발생 가능성을 불확실한 것으로 표상하면서 이를 용인하고 있는 경우를 말하고, 미필적 고의가 있었다고 하려면 범죄사실의 발생 가능성에 대한 인식이 있음은 물론 나아가 범죄사실이 발생할 위험을 용인하는 내심의 의사가 있어야 한다.[변18]", true, "▸ 용인설의 입장이다(2004도74).\n\n[제2절 참고 - 고의 관련 조문] 형법 제13조(고의): 죄의 성립요소인 사실을 인식하지 못한 행위는 벌하지 아니한다. 단, 법률에 특별한 규정이 있는 경우에는 예외로 한다. 형법 제15조(사실의 착오) ①: 특별히 무거운 죄가 되는 사실을 인식하지 못한 행위는 무거운 죄로 벌하지 아니한다.", "구성요건론"],
["140", "행위자에게 미필적 고의가 있었는지는 행위자의 진술에 의존하지 않고 외부에 나타난 행위의 형태와 행위의 상황 등 구체적인 사정을 기초로 일반인이라면 해당 범죄사실이 발생할 가능성을 어떻게 평가할 것인지를 고려하면서 평균인의 입장에서 그 심리상태를 추인하여야 한다.", false, "▸ 구체적인 사정을 기초로 하여 '일반인'이라면 당해 범죄사실이 발생할 가능성을 어떻게 평가할 것인가를 고려하면서 '행위자'의 입장에서 그 심리상태를 추인하여야 한다(2004도74).\n\n[제2절 참고 - 고의 관련 조문] 형법 제13조(고의): 죄의 성립요소인 사실을 인식하지 못한 행위는 벌하지 아니한다. 단, 법률에 특별한 규정이 있는 경우에는 예외로 한다. 형법 제15조(사실의 착오) ①: 특별히 무거운 죄가 되는 사실을 인식하지 못한 행위는 무거운 죄로 벌하지 아니한다.", "구성요건론"],
["141", "예리한 식도로 타인의 하복부를 찔러 직경 5cm, 깊이 15cm 이상의 자상을 입힌 결과 그 타인이 내장파열 및 다량의 출혈뿐만 아니라 자창의 감염으로 인해 사망에 이른 경우에는 행위자에게 고의에 의한 살인의 죄책을 물을 수 없다.[변10]", false, "▸ 일반적으로 내장파열 및 다량의 출혈과 자창의 감염으로 사망의 결과를 발생하게 하리라는 점을 경험상 예견할 수 있는 것이므로 피고인에게 살인의 결과에 대한 확정적 고의는 없다 치더라도 미필적 인식은 있었다고 볼 것이다(82도2525).\n\n[제2절 참고 - 고의 관련 조문] 형법 제13조(고의): 죄의 성립요소인 사실을 인식하지 못한 행위는 벌하지 아니한다. 단, 법률에 특별한 규정이 있는 경우에는 예외로 한다. 형법 제15조(사실의 착오) ①: 특별히 무거운 죄가 되는 사실을 인식하지 못한 행위는 무거운 죄로 벌하지 아니한다.", "구성요건론"],
["142", "청소년유해업소의 업주로서는 대상자의 연령을 공적 증명에 의하여 확실히 확인할 수 있는 때까지 유흥업소 채용을 보류하거나 거부하여야 함에도 불구하고, 주민등록증의 사진과 얼굴이 다르다는 의문을 가지면서도 고용계약을 하였다면 청소년임에도 불구하고 그들을 고용한다는 점에 관한 미필적 고의가 인정된다.", true, "▸ [AI해설] 주민등록증의 사진과 얼굴이 다르다는 의문을 가지면서도 연령을 공적 증명에 의해 확인하지 않고 고용계약을 하였다면 청소년을 고용한다는 점에 대한 미필적 고의가 인정된다는 것이 판례의 태도이다(2004도255).\n\n[제2절 참고 - 고의 관련 조문] 형법 제13조(고의): 죄의 성립요소인 사실을 인식하지 못한 행위는 벌하지 아니한다. 단, 법률에 특별한 규정이 있는 경우에는 예외로 한다. 형법 제15조(사실의 착오) ①: 특별히 무거운 죄가 되는 사실을 인식하지 못한 행위는 무거운 죄로 벌하지 아니한다.", "구성요건론"],
["143", "甲은 피해자 A(만 7세)를 도로에서 약 17미터 떨어진 야산 속의 경작하지 않는 밭으로 데리고 들어가 주먹으로 얼굴을 수차례 때리고, 가지고 있던 스카프로 A의 목을 감아 스카프의 양끝을 양손으로 나누어 잡고 A의 머리를 땅에 비비면서 약 4분 동안 2회에 걸쳐 목을 졸라 실신시킨 후 A를 버려둔 채 그곳을 떠났고, 그로 인하여 A는 사망한 채로 다음날 발견되었다. 살인죄의 고의는 자기의 행위로 인하여 피해자가 사망할 수도 있다는 사실을 인식·예견하는 것으로 족하므로 甲에게 살인의 고의가 인정된다.", true, "▸ 살인죄의 범의는 자기의 행위로 인하여 피해자가 사망할 수도 있다는 사실을 인식·예견하는 것으로 족하고 피해자의 사망을 희망하거나 목적으로 할 필요는 없고, 또 확정적인 고의가 아닌 미필적 고의로도 족한 것이다(94도2511).\n\n[제2절 참고 - 고의 관련 조문] 형법 제13조(고의): 죄의 성립요소인 사실을 인식하지 못한 행위는 벌하지 아니한다. 단, 법률에 특별한 규정이 있는 경우에는 예외로 한다. 형법 제15조(사실의 착오) ①: 특별히 무거운 죄가 되는 사실을 인식하지 못한 행위는 무거운 죄로 벌하지 아니한다.", "구성요건론"],
["144", "대구지하철화재 사고 현장을 수습하기 위한 청소 작업이 한창 진행되고 있는 시간 중에 실종자 유족들로부터 이의제기가 있었음에도 대구지하철공사 사장이 즉각 청소 작업을 중단하도록 지시하지 아니하였고 수사기관과 협의하거나 확인하지 아니하였다고 하여 그러한 청소 작업으로 인하여 증거인멸의 결과가 발생할 가능성을 용인하는 내심의 의사까지 있었다고 단정하기는 어렵다.", true, "▸ [AI해설] 대구지하철화재 사고 현장 청소 작업을 즉각 중단시키지 않았다는 사정만으로 증거인멸의 결과 발생 가능성을 용인하는 내심의 의사까지 있었다고 단정하기는 어렵다는 것이 판례의 태도이다(2004도74).\n\n[제2절 참고 - 고의 관련 조문] 형법 제13조(고의): 죄의 성립요소인 사실을 인식하지 못한 행위는 벌하지 아니한다. 단, 법률에 특별한 규정이 있는 경우에는 예외로 한다. 형법 제15조(사실의 착오) ①: 특별히 무거운 죄가 되는 사실을 인식하지 못한 행위는 무거운 죄로 벌하지 아니한다.", "구성요건론"],
["145", "절도죄에 있어서 재물의 타인성을 오신하여 그 재물이 자기에게 취득할 것(빌린 것)이 허용된 동일한 물건으로 오인하고 가져온 경우에는 범죄사실에 대한 인식이 있다고 할 수 없으므로 범의가 조각되어 절도죄가 성립하지 아니한다.", true, "▸ [AI해설] 절도죄에 있어서 재물의 타인성을 오신하여 그 재물이 자기에게 취득이 허용된 동일한 물건으로 오인하고 가져온 경우에는 범죄사실에 대한 인식이 없어 범의가 조각되므로 절도죄가 성립하지 아니한다는 것이 판례의 태도이다(83도1762).\n\n[제2절 참고 - 고의 관련 조문] 형법 제13조(고의): 죄의 성립요소인 사실을 인식하지 못한 행위는 벌하지 아니한다. 단, 법률에 특별한 규정이 있는 경우에는 예외로 한다. 형법 제15조(사실의 착오) ①: 특별히 무거운 죄가 되는 사실을 인식하지 못한 행위는 무거운 죄로 벌하지 아니한다.", "구성요건론"],
["146", "甲이 피해자에게 밍크 45마리에 관하여 자기에게 그 권리가 있다고 주장하면서 이를 가져간 데 대하여 피해자의 묵시적인 동의가 있었다고 하더라도, 甲의 주장이 후에 허위임이 밝혀졌다면, 甲의 행위는 절도죄에 해당한다.", false, "▸ 피고인이 피해자에게 이 사건 밍크 45마리에 관하여 자기에게 그 권리가 있다고 주장하면서 이를 가져간 데 대하여 피해자의 묵시적인 동의가 있었다면 피고인의 주장이 후에 허위임이 밝혀졌더라도 피고인의 행위는 절도죄의 절취행위에는 해당하지 않는다(90도1211).\n\n[제2절 참고 - 고의 관련 조문] 형법 제13조(고의): 죄의 성립요소인 사실을 인식하지 못한 행위는 벌하지 아니한다. 단, 법률에 특별한 규정이 있는 경우에는 예외로 한다. 형법 제15조(사실의 착오) ①: 특별히 무거운 죄가 되는 사실을 인식하지 못한 행위는 무거운 죄로 벌하지 아니한다.", "구성요건론"],
["147", "친족상도례가 적용되기 위하여는 친족관계가 객관적으로 존재하고, 행위자가 이를 인식하여야 한다.", false, "▸ 본가의 소유물로 오신하였다고 하더라도 그 오신은 형면제 사유에 불과한 것이므로 그 오신은 본건 범죄의 성립이나 처벌에 아무런 영향을 미치지 않는다(66도104). [형법 제328조 제1항 헌법불합치]\n\n[제2절 참고 - 고의 관련 조문] 형법 제13조(고의): 죄의 성립요소인 사실을 인식하지 못한 행위는 벌하지 아니한다. 단, 법률에 특별한 규정이 있는 경우에는 예외로 한다. 형법 제15조(사실의 착오) ①: 특별히 무거운 죄가 되는 사실을 인식하지 못한 행위는 무거운 죄로 벌하지 아니한다.", "구성요건론"],
["148", "甲이 A가 자신의 아버지임을 알아보지 못하고 A를 살해한 경우, 이와 같은 착오는 존속살해의 고의를 조각하지 못한다.[변14]", false, "▸ 보통살인의 고의로 존속을 살해(장모)한 경우 제15조 제1항에 의하여 장모에 대한 보통살인죄만 성립한다(4293형상494). [가중·감경적 구성요건도 객관적 구성요건이므로 고의의 인식대상이다.]\n\n[제2절 참고 - 고의 관련 조문] 형법 제13조(고의): 죄의 성립요소인 사실을 인식하지 못한 행위는 벌하지 아니한다. 단, 법률에 특별한 규정이 있는 경우에는 예외로 한다. 형법 제15조(사실의 착오) ①: 특별히 무거운 죄가 되는 사실을 인식하지 못한 행위는 무거운 죄로 벌하지 아니한다.", "구성요건론"],
["149", "사전수뢰죄에 있어서 '공무원 또는 중재인이 된 때'와 같은 객관적 처벌조건은 고의의 인식대상이다.", false, "▸ 고의의 인식대상은 객관적 구성요건요소에 해당하는 사실이므로 객관적 처벌조건은 고의의 인식대상이 아니다.\n\n[제2절 참고 - 고의 관련 조문] 형법 제13조(고의): 죄의 성립요소인 사실을 인식하지 못한 행위는 벌하지 아니한다. 단, 법률에 특별한 규정이 있는 경우에는 예외로 한다. 형법 제15조(사실의 착오) ①: 특별히 무거운 죄가 되는 사실을 인식하지 못한 행위는 무거운 죄로 벌하지 아니한다.", "구성요건론"],
["150", "상습절도의 '상습성'은 동종의 범행을 반복하는 습벽으로 고의의 인식대상이 아니다.", true, "▸ 상습성은 행위자가 갖추고 있으면 되고, 고의의 대상이 아니므로 행위자가 인식할 필요는 없다.\n\n[제2절 참고 - 고의 관련 조문] 형법 제13조(고의): 죄의 성립요소인 사실을 인식하지 못한 행위는 벌하지 아니한다. 단, 법률에 특별한 규정이 있는 경우에는 예외로 한다. 형법 제15조(사실의 착오) ①: 특별히 무거운 죄가 되는 사실을 인식하지 못한 행위는 무거운 죄로 벌하지 아니한다.", "구성요건론"],
["151", "형법 제166조 제2항의 자기소유 일반건조물방화죄에서 '공공의 위험발생'은 고의의 인식대상이 아니다.", false, "▸ 타인소유 일반건조물방화죄는 추상적 위험범이지만, 자기소유건조물방화죄는 구체적 위험범으로 '공공의 위험발생'은 고의의 인식대상이다(형법 제166조).\n\n[제2절 참고 - 고의 관련 조문] 형법 제13조(고의): 죄의 성립요소인 사실을 인식하지 못한 행위는 벌하지 아니한다. 단, 법률에 특별한 규정이 있는 경우에는 예외로 한다. 형법 제15조(사실의 착오) ①: 특별히 무거운 죄가 되는 사실을 인식하지 못한 행위는 무거운 죄로 벌하지 아니한다.", "구성요건론"],
["152", "고의 외에 초과주관적 위법요소로서 '향정신성의약품을 제조할 목적'과 같은 목적에 대하여도 고의와 마찬가지로 적극적 의욕이나 확정적 인식임을 요하지 아니하고 미필적 인식이 있으면 족하다.", true, "▸ ① 향정신성의약품관리법 제40조 제2항 등의 초과주관적 위법요소로서 향정신성의약품을 제조할 목적에 대하여는 적극적 의욕이나 확정적 인식임을 요하지 아니하고 미필적 인식이 있으면 족하다고 할 것이다(97도2368). ② 내란선동죄의 '국헌을 문란할 목적'도 미필적 인식으로 족하다(2014도10978).\n\n[제2절 참고 - 고의 관련 조문] 형법 제13조(고의): 죄의 성립요소인 사실을 인식하지 못한 행위는 벌하지 아니한다. 단, 법률에 특별한 규정이 있는 경우에는 예외로 한다. 형법 제15조(사실의 착오) ①: 특별히 무거운 죄가 되는 사실을 인식하지 못한 행위는 무거운 죄로 벌하지 아니한다.", "구성요건론"],
["153", "예비죄는 목적범이므로 고의 이외에 기본범죄를 범할 목적까지 있어야 하는데, 미필적 인식으로 족하다.", true, "▸ 강도예비음모죄가 성립하기 위해서는 예비·음모 행위자에게 '미필적으로라도' 강도를 할 목적이 있음이 인정되어야 하고 그에 이르지 않고 단순히 준강도할 목적이 있음에 그치는 경우에는 강도예비·음모죄로 처벌할 수 없다(2004도6432).\n\n[제2절 참고 - 고의 관련 조문] 형법 제13조(고의): 죄의 성립요소인 사실을 인식하지 못한 행위는 벌하지 아니한다. 단, 법률에 특별한 규정이 있는 경우에는 예외로 한다. 형법 제15조(사실의 착오) ①: 특별히 무거운 죄가 되는 사실을 인식하지 못한 행위는 무거운 죄로 벌하지 아니한다.", "구성요건론"],
["154", "고의가 인정된다고 해서 곧바로 목적범의 목적이 인정되는 것은 아니다.", true, "▸ 목적범에서의 목적은 범죄 성립을 위한 초과주관적 위법요소로서 고의 외에 별도로 요구되는 것이다(2010도1189).\n\n[제2절 참고 - 고의 관련 조문] 형법 제13조(고의): 죄의 성립요소인 사실을 인식하지 못한 행위는 벌하지 아니한다. 단, 법률에 특별한 규정이 있는 경우에는 예외로 한다. 형법 제15조(사실의 착오) ①: 특별히 무거운 죄가 되는 사실을 인식하지 못한 행위는 무거운 죄로 벌하지 아니한다.", "구성요건론"],
["155", "甲이 A를 살해할 의도를 갖고 A와 비슷한 외모의 B를 A로 오인하여 B에게 총을 발사한 결과 B가 사망에 이른 경우, 구체적 부합설에 따르면 甲에게는 A에 대한 살인미수죄와 B에 대한 과실치사죄의 상상적 경합이 성립한다.[변24]", false, "▸ 구체적 사실의 착오 중 객체의 착오에 해당하므로 구체적 부합설을 포함 어떠한 견해에 의하더라도 고의가 전용되어 발생사실에 대한 살인기수가 성립한다.\n\n[V. 구성요건적 착오 - 부합론 참고] ① 구체적 부합설: 행위자의 인식사실과 발생결과가 구체적으로 부합하는 경우에 고의기수를 인정. ② 법정적 부합설(판례): 인식사실과 발생결과가 동일한 구성요건 또는 죄질인 경우 고의기수를 인정. ③ 추상적 부합설: 가벌적이라는 점에서 추상적으로 중첩하는 범위 내에서 경한 범죄의 고의기수를 인정. 판례는 법정적 부합설의 입장에서 타격의 착오가 있는 경우라 할지라도 행위자의 살인의 범의 성립에 방해가 되지 않는다고 본다(83도2813). [결론 요약] 구체적 사실의 착오·객체의 착오: 세 견해 모두 발생사실에 대한 고의기수 인정. 구체적 사실의 착오·방법의 착오: 구체적 부합설은 인식사실 미수와 발생사실 과실의 상상적 경합, 법정적·추상적 부합설은 발생사실에 대한 고의기수 인정. 추상적 사실의 착오·방법의 착오: 구체적·법정적 부합설은 인식사실 미수와 발생사실 과실의 상상적 경합, 추상적 부합설은 경한 죄의 기수와 중한 죄의 과실(또는 미수)의 상상적 경합.\n\n[제2절 참고 - 고의 관련 조문] 형법 제13조(고의): 죄의 성립요소인 사실을 인식하지 못한 행위는 벌하지 아니한다. 단, 법률에 특별한 규정이 있는 경우에는 예외로 한다. 형법 제15조(사실의 착오) ①: 특별히 무거운 죄가 되는 사실을 인식하지 못한 행위는 무거운 죄로 벌하지 아니한다.", "구성요건론"],
["156", "법정적부합설에 따를 경우, 만일 甲이 A의 집 앞에서 기다리고 있다가 B를 A로 착각하여 칼로 찔러 살해했다면 甲에게는 A에 대한 살인미수죄와 B에 대한 과실치사죄가 성립하고 양 죄는 상상적 경합 관계이다.", false, "▸ 구체적 사실의 착오 중 객체의 착오에 해당하므로 구체적 부합설을 포함 어떠한 견해에 의하더라도 고의가 전용되어 발생사실에 대한 살인기수가 성립한다.\n\n[V. 구성요건적 착오 - 부합론 참고] ① 구체적 부합설: 행위자의 인식사실과 발생결과가 구체적으로 부합하는 경우에 고의기수를 인정. ② 법정적 부합설(판례): 인식사실과 발생결과가 동일한 구성요건 또는 죄질인 경우 고의기수를 인정. ③ 추상적 부합설: 가벌적이라는 점에서 추상적으로 중첩하는 범위 내에서 경한 범죄의 고의기수를 인정. 판례는 법정적 부합설의 입장에서 타격의 착오가 있는 경우라 할지라도 행위자의 살인의 범의 성립에 방해가 되지 않는다고 본다(83도2813). [결론 요약] 구체적 사실의 착오·객체의 착오: 세 견해 모두 발생사실에 대한 고의기수 인정. 구체적 사실의 착오·방법의 착오: 구체적 부합설은 인식사실 미수와 발생사실 과실의 상상적 경합, 법정적·추상적 부합설은 발생사실에 대한 고의기수 인정. 추상적 사실의 착오·방법의 착오: 구체적·법정적 부합설은 인식사실 미수와 발생사실 과실의 상상적 경합, 추상적 부합설은 경한 죄의 기수와 중한 죄의 과실(또는 미수)의 상상적 경합.\n\n[제2절 참고 - 고의 관련 조문] 형법 제13조(고의): 죄의 성립요소인 사실을 인식하지 못한 행위는 벌하지 아니한다. 단, 법률에 특별한 규정이 있는 경우에는 예외로 한다. 형법 제15조(사실의 착오) ①: 특별히 무거운 죄가 되는 사실을 인식하지 못한 행위는 무거운 죄로 벌하지 아니한다.", "구성요건론"],
["157", "甲이 A를 살해하기 위해 A를 향하여 총을 쏘았으나 총알이 빗나가 A의 옆에 있던 B에게 맞아 B가 즉사한 경우, 구성요건적 착오에 관한 구체적 부합설에 의하면 甲에게는 B에 대한 살인죄의 죄책이 인정되지 않지만, 법정적 부합설과 추상적 부합설에 의하면 甲은 B에 대한 살인죄의 죄책을 진다.", true, "▸ 구체적 사실의 착오 중 방법의 착오의 경우, 구체적 부합설에 의하면 甲은 A에 대한 살인미수죄와 B에 대한 과실치사죄의 상상적 경합범의 책임을 진다. 법정적 부합설과 추상적 부합설에 의하면 발생사실인 B에 대한 살인기수의 죄책을 진다.\n\n[V. 구성요건적 착오 - 부합론 참고] ① 구체적 부합설: 행위자의 인식사실과 발생결과가 구체적으로 부합하는 경우에 고의기수를 인정. ② 법정적 부합설(판례): 인식사실과 발생결과가 동일한 구성요건 또는 죄질인 경우 고의기수를 인정. ③ 추상적 부합설: 가벌적이라는 점에서 추상적으로 중첩하는 범위 내에서 경한 범죄의 고의기수를 인정. 판례는 법정적 부합설의 입장에서 타격의 착오가 있는 경우라 할지라도 행위자의 살인의 범의 성립에 방해가 되지 않는다고 본다(83도2813). [결론 요약] 구체적 사실의 착오·객체의 착오: 세 견해 모두 발생사실에 대한 고의기수 인정. 구체적 사실의 착오·방법의 착오: 구체적 부합설은 인식사실 미수와 발생사실 과실의 상상적 경합, 법정적·추상적 부합설은 발생사실에 대한 고의기수 인정. 추상적 사실의 착오·방법의 착오: 구체적·법정적 부합설은 인식사실 미수와 발생사실 과실의 상상적 경합, 추상적 부합설은 경한 죄의 기수와 중한 죄의 과실(또는 미수)의 상상적 경합.\n\n[제2절 참고 - 고의 관련 조문] 형법 제13조(고의): 죄의 성립요소인 사실을 인식하지 못한 행위는 벌하지 아니한다. 단, 법률에 특별한 규정이 있는 경우에는 예외로 한다. 형법 제15조(사실의 착오) ①: 특별히 무거운 죄가 되는 사실을 인식하지 못한 행위는 무거운 죄로 벌하지 아니한다.", "구성요건론"],
["158", "법정적 부합설에 의하면 법감정에 충실한 해석을 할 수 있다는 장점이 있다.", true, "▸ 법정적 부합설은 발생사실이 인식사실과 동일한 구성요건 내지 죄질의 범위 안에 있으면 고의기수를 인정하므로, 일반인의 법감정에 부합하는 결론을 도출할 수 있다는 장점이 있다.\n\n[V. 구성요건적 착오 - 부합론 참고] ① 구체적 부합설: 행위자의 인식사실과 발생결과가 구체적으로 부합하는 경우에 고의기수를 인정. ② 법정적 부합설(판례): 인식사실과 발생결과가 동일한 구성요건 또는 죄질인 경우 고의기수를 인정. ③ 추상적 부합설: 가벌적이라는 점에서 추상적으로 중첩하는 범위 내에서 경한 범죄의 고의기수를 인정. 판례는 법정적 부합설의 입장에서 타격의 착오가 있는 경우라 할지라도 행위자의 살인의 범의 성립에 방해가 되지 않는다고 본다(83도2813). [결론 요약] 구체적 사실의 착오·객체의 착오: 세 견해 모두 발생사실에 대한 고의기수 인정. 구체적 사실의 착오·방법의 착오: 구체적 부합설은 인식사실 미수와 발생사실 과실의 상상적 경합, 법정적·추상적 부합설은 발생사실에 대한 고의기수 인정. 추상적 사실의 착오·방법의 착오: 구체적·법정적 부합설은 인식사실 미수와 발생사실 과실의 상상적 경합, 추상적 부합설은 경한 죄의 기수와 중한 죄의 과실(또는 미수)의 상상적 경합.\n\n[제2절 참고 - 고의 관련 조문] 형법 제13조(고의): 죄의 성립요소인 사실을 인식하지 못한 행위는 벌하지 아니한다. 단, 법률에 특별한 규정이 있는 경우에는 예외로 한다. 형법 제15조(사실의 착오) ①: 특별히 무거운 죄가 되는 사실을 인식하지 못한 행위는 무거운 죄로 벌하지 아니한다.", "구성요건론"],
["159", "구체적 부합설에 대하여는 고의의 기수책임을 인정하는 범위가 지나치게 협소하다는 비판이 제기된다.", true, "▸ 구체적 부합설은 인식사실과 발생사실이 구체적으로 일치하는 경우에만 고의기수를 인정하므로, 방법의 착오 사안에서 고의기수 책임을 인정하는 범위가 지나치게 좁아진다는 비판이 있다.\n\n[V. 구성요건적 착오 - 부합론 참고] ① 구체적 부합설: 행위자의 인식사실과 발생결과가 구체적으로 부합하는 경우에 고의기수를 인정. ② 법정적 부합설(판례): 인식사실과 발생결과가 동일한 구성요건 또는 죄질인 경우 고의기수를 인정. ③ 추상적 부합설: 가벌적이라는 점에서 추상적으로 중첩하는 범위 내에서 경한 범죄의 고의기수를 인정. 판례는 법정적 부합설의 입장에서 타격의 착오가 있는 경우라 할지라도 행위자의 살인의 범의 성립에 방해가 되지 않는다고 본다(83도2813). [결론 요약] 구체적 사실의 착오·객체의 착오: 세 견해 모두 발생사실에 대한 고의기수 인정. 구체적 사실의 착오·방법의 착오: 구체적 부합설은 인식사실 미수와 발생사실 과실의 상상적 경합, 법정적·추상적 부합설은 발생사실에 대한 고의기수 인정. 추상적 사실의 착오·방법의 착오: 구체적·법정적 부합설은 인식사실 미수와 발생사실 과실의 상상적 경합, 추상적 부합설은 경한 죄의 기수와 중한 죄의 과실(또는 미수)의 상상적 경합.\n\n[제2절 참고 - 고의 관련 조문] 형법 제13조(고의): 죄의 성립요소인 사실을 인식하지 못한 행위는 벌하지 아니한다. 단, 법률에 특별한 규정이 있는 경우에는 예외로 한다. 형법 제15조(사실의 착오) ①: 특별히 무거운 죄가 되는 사실을 인식하지 못한 행위는 무거운 죄로 벌하지 아니한다.", "구성요건론"],
["160", "구체적 사실의 착오에 관하여 추상적 부합설은 구체적 부합설과 같은 결론을 낸다.", false, "▸ 구체적 사실의 착오(동일한 구성요건 내의 착오)에 관하여는 추상적 부합설도 법정적 부합설과 마찬가지로 발생사실에 대한 고의기수를 인정하므로, 추상적 부합설이 구체적 부합설과 같은 결론을 낸다는 서술은 타당하지 않다.\n\n[V. 구성요건적 착오 - 부합론 참고] ① 구체적 부합설: 행위자의 인식사실과 발생결과가 구체적으로 부합하는 경우에 고의기수를 인정. ② 법정적 부합설(판례): 인식사실과 발생결과가 동일한 구성요건 또는 죄질인 경우 고의기수를 인정. ③ 추상적 부합설: 가벌적이라는 점에서 추상적으로 중첩하는 범위 내에서 경한 범죄의 고의기수를 인정. 판례는 법정적 부합설의 입장에서 타격의 착오가 있는 경우라 할지라도 행위자의 살인의 범의 성립에 방해가 되지 않는다고 본다(83도2813). [결론 요약] 구체적 사실의 착오·객체의 착오: 세 견해 모두 발생사실에 대한 고의기수 인정. 구체적 사실의 착오·방법의 착오: 구체적 부합설은 인식사실 미수와 발생사실 과실의 상상적 경합, 법정적·추상적 부합설은 발생사실에 대한 고의기수 인정. 추상적 사실의 착오·방법의 착오: 구체적·법정적 부합설은 인식사실 미수와 발생사실 과실의 상상적 경합, 추상적 부합설은 경한 죄의 기수와 중한 죄의 과실(또는 미수)의 상상적 경합.\n\n[제2절 참고 - 고의 관련 조문] 형법 제13조(고의): 죄의 성립요소인 사실을 인식하지 못한 행위는 벌하지 아니한다. 단, 법률에 특별한 규정이 있는 경우에는 예외로 한다. 형법 제15조(사실의 착오) ①: 특별히 무거운 죄가 되는 사실을 인식하지 못한 행위는 무거운 죄로 벌하지 아니한다.", "구성요건론"],
["161", "구체적 사실의 착오 중 방법의 착오는 객체의 착오와 달리 그 범죄의 성립에 영향을 미친다는 것이 판례의 입장이다.", false, "▸ 소위 타격의 착오(방법의 착오)가 있는 경우라 할지라도 행위자의 살인의 범의 성립에 방해가 되지 아니한다(83도2813). [판례 법정적 부합설]\n\n[V. 구성요건적 착오 - 부합론 참고] ① 구체적 부합설: 행위자의 인식사실과 발생결과가 구체적으로 부합하는 경우에 고의기수를 인정. ② 법정적 부합설(판례): 인식사실과 발생결과가 동일한 구성요건 또는 죄질인 경우 고의기수를 인정. ③ 추상적 부합설: 가벌적이라는 점에서 추상적으로 중첩하는 범위 내에서 경한 범죄의 고의기수를 인정. 판례는 법정적 부합설의 입장에서 타격의 착오가 있는 경우라 할지라도 행위자의 살인의 범의 성립에 방해가 되지 않는다고 본다(83도2813). [결론 요약] 구체적 사실의 착오·객체의 착오: 세 견해 모두 발생사실에 대한 고의기수 인정. 구체적 사실의 착오·방법의 착오: 구체적 부합설은 인식사실 미수와 발생사실 과실의 상상적 경합, 법정적·추상적 부합설은 발생사실에 대한 고의기수 인정. 추상적 사실의 착오·방법의 착오: 구체적·법정적 부합설은 인식사실 미수와 발생사실 과실의 상상적 경합, 추상적 부합설은 경한 죄의 기수와 중한 죄의 과실(또는 미수)의 상상적 경합.\n\n[제2절 참고 - 고의 관련 조문] 형법 제13조(고의): 죄의 성립요소인 사실을 인식하지 못한 행위는 벌하지 아니한다. 단, 법률에 특별한 규정이 있는 경우에는 예외로 한다. 형법 제15조(사실의 착오) ①: 특별히 무거운 죄가 되는 사실을 인식하지 못한 행위는 무거운 죄로 벌하지 아니한다.", "구성요건론"],
["162", "甲이 A를 살해할 의사로 농약을 숭늉 그릇에 넣어 A의 식당에 놓아두었는데, 그 정을 알지 못한 A의 장녀 B가 마시고 사망하였다. 甲은 B에 대한 살인죄로 처벌된다.", true, "▸ 피고인이 A와 동인의 처를 살해할 의사로서 농약 1포를 숭늉그릇에 투입하여 A의 식당에 놓아둠으로써 그 정을 알지 못한 A의 장녀가 이를 마시게 되어 장녀를 사망케 하였다면 피고인이 A의 장녀를 살해할 의사는 없었다 하더라도 피고인은 사람을 살해할 의사로서 이와 같은 행위를 하였고 그 행위에 의하여 살해라는 결과가 발생한 이상 A의 장녀에 대하여 살인죄가 성립한다(68도84).\n\n[V. 구성요건적 착오 - 부합론 참고] ① 구체적 부합설: 행위자의 인식사실과 발생결과가 구체적으로 부합하는 경우에 고의기수를 인정. ② 법정적 부합설(판례): 인식사실과 발생결과가 동일한 구성요건 또는 죄질인 경우 고의기수를 인정. ③ 추상적 부합설: 가벌적이라는 점에서 추상적으로 중첩하는 범위 내에서 경한 범죄의 고의기수를 인정. 판례는 법정적 부합설의 입장에서 타격의 착오가 있는 경우라 할지라도 행위자의 살인의 범의 성립에 방해가 되지 않는다고 본다(83도2813). [결론 요약] 구체적 사실의 착오·객체의 착오: 세 견해 모두 발생사실에 대한 고의기수 인정. 구체적 사실의 착오·방법의 착오: 구체적 부합설은 인식사실 미수와 발생사실 과실의 상상적 경합, 법정적·추상적 부합설은 발생사실에 대한 고의기수 인정. 추상적 사실의 착오·방법의 착오: 구체적·법정적 부합설은 인식사실 미수와 발생사실 과실의 상상적 경합, 추상적 부합설은 경한 죄의 기수와 중한 죄의 과실(또는 미수)의 상상적 경합.\n\n[제2절 참고 - 고의 관련 조문] 형법 제13조(고의): 죄의 성립요소인 사실을 인식하지 못한 행위는 벌하지 아니한다. 단, 법률에 특별한 규정이 있는 경우에는 예외로 한다. 형법 제15조(사실의 착오) ①: 특별히 무거운 죄가 되는 사실을 인식하지 못한 행위는 무거운 죄로 벌하지 아니한다.", "구성요건론"],
["163", "甲이 A, B, C 등 3명과 싸우다가 힘이 달리자 갑자기 인근 가게에서 식칼을 가지고 와 상해의 고의로 이들 3명을 상대로 휘두르다가 빗나가 옆에 있던 D에게 상해를 입혔다면 甲에게 D의 상해에 대한 특수상해의 고의가 인정된다.", true, "▸ 甲에게 상해의 범의가 인정되며 상해를 입은 사람이 목적한 사람이 아닌 다른 사람이라 하여 과실상해죄에 해당한다고 할 수 없다(87도1745).\n\n[V. 구성요건적 착오 - 부합론 참고] ① 구체적 부합설: 행위자의 인식사실과 발생결과가 구체적으로 부합하는 경우에 고의기수를 인정. ② 법정적 부합설(판례): 인식사실과 발생결과가 동일한 구성요건 또는 죄질인 경우 고의기수를 인정. ③ 추상적 부합설: 가벌적이라는 점에서 추상적으로 중첩하는 범위 내에서 경한 범죄의 고의기수를 인정. 판례는 법정적 부합설의 입장에서 타격의 착오가 있는 경우라 할지라도 행위자의 살인의 범의 성립에 방해가 되지 않는다고 본다(83도2813). [결론 요약] 구체적 사실의 착오·객체의 착오: 세 견해 모두 발생사실에 대한 고의기수 인정. 구체적 사실의 착오·방법의 착오: 구체적 부합설은 인식사실 미수와 발생사실 과실의 상상적 경합, 법정적·추상적 부합설은 발생사실에 대한 고의기수 인정. 추상적 사실의 착오·방법의 착오: 구체적·법정적 부합설은 인식사실 미수와 발생사실 과실의 상상적 경합, 추상적 부합설은 경한 죄의 기수와 중한 죄의 과실(또는 미수)의 상상적 경합.\n\n[제2절 참고 - 고의 관련 조문] 형법 제13조(고의): 죄의 성립요소인 사실을 인식하지 못한 행위는 벌하지 아니한다. 단, 법률에 특별한 규정이 있는 경우에는 예외로 한다. 형법 제15조(사실의 착오) ①: 특별히 무거운 죄가 되는 사실을 인식하지 못한 행위는 무거운 죄로 벌하지 아니한다.", "구성요건론"],
["164", "甲은 상해의 고의로 사람에게 돌을 던졌으나 빗나가서 그 옆에 있던 마을 주민이 세운 장승에 맞았고, 장승의 일부가 손괴되었다. 甲의 행위는 추상적 사실의 착오에 해당하여 상해미수죄와 과실재물손괴죄의 상상적 경합으로 처벌된다.", false, "▸ ① 추상적 사실의 착오 중 방법의 착오에 해당한다. 구체적 부합설과 법정적 부합설에 의하면 상해미수죄가 성립한다('돌'은 위험한 물건에 해당하므로 특수상해미수죄가 더 정확하다고 본다). [과실재물손괴는 처벌규정이 없음] ② 추상적 부합설에 의하면 상해미수죄와 재물손괴기수의 상상적 경합관계에 해당한다.\n\n[V. 구성요건적 착오 - 부합론 참고] ① 구체적 부합설: 행위자의 인식사실과 발생결과가 구체적으로 부합하는 경우에 고의기수를 인정. ② 법정적 부합설(판례): 인식사실과 발생결과가 동일한 구성요건 또는 죄질인 경우 고의기수를 인정. ③ 추상적 부합설: 가벌적이라는 점에서 추상적으로 중첩하는 범위 내에서 경한 범죄의 고의기수를 인정. 판례는 법정적 부합설의 입장에서 타격의 착오가 있는 경우라 할지라도 행위자의 살인의 범의 성립에 방해가 되지 않는다고 본다(83도2813). [결론 요약] 구체적 사실의 착오·객체의 착오: 세 견해 모두 발생사실에 대한 고의기수 인정. 구체적 사실의 착오·방법의 착오: 구체적 부합설은 인식사실 미수와 발생사실 과실의 상상적 경합, 법정적·추상적 부합설은 발생사실에 대한 고의기수 인정. 추상적 사실의 착오·방법의 착오: 구체적·법정적 부합설은 인식사실 미수와 발생사실 과실의 상상적 경합, 추상적 부합설은 경한 죄의 기수와 중한 죄의 과실(또는 미수)의 상상적 경합.\n\n[제2절 참고 - 고의 관련 조문] 형법 제13조(고의): 죄의 성립요소인 사실을 인식하지 못한 행위는 벌하지 아니한다. 단, 법률에 특별한 규정이 있는 경우에는 예외로 한다. 형법 제15조(사실의 착오) ①: 특별히 무거운 죄가 되는 사실을 인식하지 못한 행위는 무거운 죄로 벌하지 아니한다.", "구성요건론"],
["165", "甲이 마당에 있는 乙의 도자기를 손괴하려고 돌을 던졌으나 빗나가 옆에 있던 乙에게 상해를 입힌 경우, 법정적 부합설에 따르면 甲은 상해죄로 처벌된다.", false, "▸ ① 추상적 사실의 착오 중 방법의 착오에 해당한다. 구체적 부합설과 법정적 부합설에 의하면, 재물손괴미수죄와 과실치상죄의 상상적 경합범이 성립하고, ② 추상적 부합설에 의하면 재물손괴기수죄와 과실치상죄의 상상적 경합범이 성립한다.\n\n[V. 구성요건적 착오 - 부합론 참고] ① 구체적 부합설: 행위자의 인식사실과 발생결과가 구체적으로 부합하는 경우에 고의기수를 인정. ② 법정적 부합설(판례): 인식사실과 발생결과가 동일한 구성요건 또는 죄질인 경우 고의기수를 인정. ③ 추상적 부합설: 가벌적이라는 점에서 추상적으로 중첩하는 범위 내에서 경한 범죄의 고의기수를 인정. 판례는 법정적 부합설의 입장에서 타격의 착오가 있는 경우라 할지라도 행위자의 살인의 범의 성립에 방해가 되지 않는다고 본다(83도2813). [결론 요약] 구체적 사실의 착오·객체의 착오: 세 견해 모두 발생사실에 대한 고의기수 인정. 구체적 사실의 착오·방법의 착오: 구체적 부합설은 인식사실 미수와 발생사실 과실의 상상적 경합, 법정적·추상적 부합설은 발생사실에 대한 고의기수 인정. 추상적 사실의 착오·방법의 착오: 구체적·법정적 부합설은 인식사실 미수와 발생사실 과실의 상상적 경합, 추상적 부합설은 경한 죄의 기수와 중한 죄의 과실(또는 미수)의 상상적 경합.\n\n[제2절 참고 - 고의 관련 조문] 형법 제13조(고의): 죄의 성립요소인 사실을 인식하지 못한 행위는 벌하지 아니한다. 단, 법률에 특별한 규정이 있는 경우에는 예외로 한다. 형법 제15조(사실의 착오) ①: 특별히 무거운 죄가 되는 사실을 인식하지 못한 행위는 무거운 죄로 벌하지 아니한다.", "구성요건론"],
["166", "甲은 乙에게 A를 살해하라고 교사했는데 乙은 A가 귀가하는 것을 기다리다가 A로 생각되는 사람을 권총으로 살해하였다. 그러나 乙의 총에 사망한 사람은 B였다. 법정적 부합설에 의하면 甲은 B에 대한 살인죄의 교사범으로 처벌된다.[변14]", true, "▸ ① 구체적 사실의 착오 중 객체의 착오이므로 정범 乙은 어떤 견해에 의하더라도 B에 대한 살인기수죄에 해당한다. ② 피교사자의 객체의 착오가 교사자에게 객체의 착오인지, 방법의 착오인지 견해가 대립하지만, 법정적 부합설은 구체적 사실의 착오인 경우 객체의 착오와 방법의 착오 모두 발생사실에 대한 고의를 인정하므로 甲은 B에 대한 살인죄의 교사범으로 처벌된다. ③ 甲의 착오를 객체의 착오로 보면 구체적 부합설에 의하더라도 甲은 B에 대한 살인교사범이 성립한다. ④ 甲의 착오를 방법의 착오로 보고 구체적 부합설에 의하면 甲은 A에 대한 살인교사미수죄와 B에 대한 과실치사죄의 상상적 경합범이 성립한다.\n\n[V. 구성요건적 착오 - 부합론 참고] ① 구체적 부합설: 행위자의 인식사실과 발생결과가 구체적으로 부합하는 경우에 고의기수를 인정. ② 법정적 부합설(판례): 인식사실과 발생결과가 동일한 구성요건 또는 죄질인 경우 고의기수를 인정. ③ 추상적 부합설: 가벌적이라는 점에서 추상적으로 중첩하는 범위 내에서 경한 범죄의 고의기수를 인정. 판례는 법정적 부합설의 입장에서 타격의 착오가 있는 경우라 할지라도 행위자의 살인의 범의 성립에 방해가 되지 않는다고 본다(83도2813). [결론 요약] 구체적 사실의 착오·객체의 착오: 세 견해 모두 발생사실에 대한 고의기수 인정. 구체적 사실의 착오·방법의 착오: 구체적 부합설은 인식사실 미수와 발생사실 과실의 상상적 경합, 법정적·추상적 부합설은 발생사실에 대한 고의기수 인정. 추상적 사실의 착오·방법의 착오: 구체적·법정적 부합설은 인식사실 미수와 발생사실 과실의 상상적 경합, 추상적 부합설은 경한 죄의 기수와 중한 죄의 과실(또는 미수)의 상상적 경합.\n\n[제2절 참고 - 고의 관련 조문] 형법 제13조(고의): 죄의 성립요소인 사실을 인식하지 못한 행위는 벌하지 아니한다. 단, 법률에 특별한 규정이 있는 경우에는 예외로 한다. 형법 제15조(사실의 착오) ①: 특별히 무거운 죄가 되는 사실을 인식하지 못한 행위는 무거운 죄로 벌하지 아니한다.", "구성요건론"],
["167", "위 사안에서 乙의 착오를 객체의 착오로 보고 이에 기반을 둔 甲의 착오도 객체의 착오로 보고 구체적 부합설을 따르는 견해에 의하면 甲은 살인미수죄와 과실치사죄의 상상적 경합이 되어 살인미수죄의 죄책을 진다.", false, "▸ 甲의 착오를 객체의 착오로 보면 구체적 부합설에 의하더라도 고의가 전용되어 甲은 B에 대한 살인교사범(살인기수)이 성립하고, 살인미수죄와 과실치사죄의 상상적 경합이 된다는 서술은 타당하지 않다.\n\n[V. 구성요건적 착오 - 부합론 참고] ① 구체적 부합설: 행위자의 인식사실과 발생결과가 구체적으로 부합하는 경우에 고의기수를 인정. ② 법정적 부합설(판례): 인식사실과 발생결과가 동일한 구성요건 또는 죄질인 경우 고의기수를 인정. ③ 추상적 부합설: 가벌적이라는 점에서 추상적으로 중첩하는 범위 내에서 경한 범죄의 고의기수를 인정. 판례는 법정적 부합설의 입장에서 타격의 착오가 있는 경우라 할지라도 행위자의 살인의 범의 성립에 방해가 되지 않는다고 본다(83도2813). [결론 요약] 구체적 사실의 착오·객체의 착오: 세 견해 모두 발생사실에 대한 고의기수 인정. 구체적 사실의 착오·방법의 착오: 구체적 부합설은 인식사실 미수와 발생사실 과실의 상상적 경합, 법정적·추상적 부합설은 발생사실에 대한 고의기수 인정. 추상적 사실의 착오·방법의 착오: 구체적·법정적 부합설은 인식사실 미수와 발생사실 과실의 상상적 경합, 추상적 부합설은 경한 죄의 기수와 중한 죄의 과실(또는 미수)의 상상적 경합.\n\n[제2절 참고 - 고의 관련 조문] 형법 제13조(고의): 죄의 성립요소인 사실을 인식하지 못한 행위는 벌하지 아니한다. 단, 법률에 특별한 규정이 있는 경우에는 예외로 한다. 형법 제15조(사실의 착오) ①: 특별히 무거운 죄가 되는 사실을 인식하지 못한 행위는 무거운 죄로 벌하지 아니한다.", "구성요건론"],
["168", "교사자의 객체의 착오는 교사자에게는 방법의 착오가 된다고 보면서 구체적 부합설을 취하는 경우, 甲에게는 B에 대한 과실치상죄만 인정된다.", false, "▸ 甲의 착오를 방법의 착오로 보고 구체적 부합설에 의하면 甲은 A에 대한 살인교사미수죄와 B에 대한 과실치사죄의 상상적 경합범이 성립하므로, B에 대한 과실치상죄만 인정된다는 서술은 타당하지 않다.\n\n[V. 구성요건적 착오 - 부합론 참고] ① 구체적 부합설: 행위자의 인식사실과 발생결과가 구체적으로 부합하는 경우에 고의기수를 인정. ② 법정적 부합설(판례): 인식사실과 발생결과가 동일한 구성요건 또는 죄질인 경우 고의기수를 인정. ③ 추상적 부합설: 가벌적이라는 점에서 추상적으로 중첩하는 범위 내에서 경한 범죄의 고의기수를 인정. 판례는 법정적 부합설의 입장에서 타격의 착오가 있는 경우라 할지라도 행위자의 살인의 범의 성립에 방해가 되지 않는다고 본다(83도2813). [결론 요약] 구체적 사실의 착오·객체의 착오: 세 견해 모두 발생사실에 대한 고의기수 인정. 구체적 사실의 착오·방법의 착오: 구체적 부합설은 인식사실 미수와 발생사실 과실의 상상적 경합, 법정적·추상적 부합설은 발생사실에 대한 고의기수 인정. 추상적 사실의 착오·방법의 착오: 구체적·법정적 부합설은 인식사실 미수와 발생사실 과실의 상상적 경합, 추상적 부합설은 경한 죄의 기수와 중한 죄의 과실(또는 미수)의 상상적 경합.\n\n[제2절 참고 - 고의 관련 조문] 형법 제13조(고의): 죄의 성립요소인 사실을 인식하지 못한 행위는 벌하지 아니한다. 단, 법률에 특별한 규정이 있는 경우에는 예외로 한다. 형법 제15조(사실의 착오) ①: 특별히 무거운 죄가 되는 사실을 인식하지 못한 행위는 무거운 죄로 벌하지 아니한다.", "구성요건론"],
