// ── Firebase REST API 헬퍼 (SDK 없이 fetch로 직접 사용) ──
const FB_URL = "https://project-1720248149706690221-default-rtdb.asia-southeast1.firebasedatabase.app";

const fb = {
  // 값 읽기
  get: async (path) => {
    try {
      const r = await fetch(`${FB_URL}/${path}.json`);
      if (!r.ok) return null;
      return await r.json();
    } catch { return null; }
  },
  // 값 쓰기 (PUT: 덮어쓰기)
  set: async (path, data) => {
    const r = await fetch(`${FB_URL}/${path}.json`, {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(data)
    });
    if (!r.ok) throw new Error(`Firebase set failed: HTTP ${r.status}`);
  },
  // 값 병합 (PATCH: 부분 업데이트)
  update: async (path, data) => {
    try {
      await fetch(`${FB_URL}/${path}.json`, {
        method: 'PATCH',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(data)
      });
    } catch {}
  },
  // 전체 목록 읽기
  list: async (path) => {
    try {
      const r = await fetch(`${FB_URL}/${path}.json`);
      if (!r.ok) return {};
      const data = await r.json();
      return data || {};
    } catch { return {}; }
  }
};

// window.storage — GitHub Pages에서는 localStorage로 폴백
window.storage = window.storage || (() => {
  const PREFIX = 'qhub_';
  return {
    get: async (key) => {
      try {
        const v = localStorage.getItem(PREFIX + key);
        return v !== null ? { key, value: v } : null;
      } catch { return null; }
    },
    set: async (key, value) => {
      try {
        localStorage.setItem(PREFIX + key, value);
        return { key, value };
      } catch { return null; }
    },
    delete: async (key) => {
      try { localStorage.removeItem(PREFIX + key); return { key, deleted: true }; } catch { return null; }
    },
    list: async (prefix) => {
      try {
        const keys = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith(PREFIX + (prefix||''))) {
            keys.push(k.slice(PREFIX.length));
          }
        }
        return { keys };
      } catch { return { keys: [] }; }
    }
  };
})();

   총론·형소법까지 받아야 했다. 이제 모듈을 고른 뒤 그 모듈만 가져온다.

const MODULE_BUILDERS = {};   // 모듈 id → (rows) => 정규화된 배열
const MODULE_PENDING  = {};   // 모듈 id → Promise (같은 모듈을 두 번 받지 않는다)

function ensureModuleData(id){
  const build = MODULE_BUILDERS[id];
  if (!build) return Promise.resolve([]);
  if (!MODULE_PENDING[id]) {
    MODULE_PENDING[id] = fetch('data/' + encodeURIComponent(id) + '.json')
      .then(r => { if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(build)
      .catch(err => { delete MODULE_PENDING[id]; throw err; });  // 실패는 다시 시도할 수 있게 둔다
  }
  return MODULE_PENDING[id];
}

// ── 헬퍼 ─────────────────────────────────────────────
const TOPIC_ICONS = {}

// ── 메인 앱 ───────────────────────────────────────────
function App() {
  // ── 로그인/세션 상태
  const [uid,    setUid]    = useState(null);     // 현재 사용자 ID
  const [isAdmin,setIsAdmin]= useState(false);

  // ── 화면 상태
  const [screen, setScreen] = useState("hub");    // hub | quiz | archive | admin
  const [activeModule, setActiveModule] = useState(null); // 현재 선택된 모듈
  // 문항 데이터 도착 여부. 데이터는 컴포넌트 밖 변수라 React가 변화를 모르므로
  // dataReady를 올려 다시 그리게 한다.
  const [dataReady, setDataReady] = useState(0);
  const [dataBusy,  setDataBusy]  = useState(false);
  const [dataErr,   setDataErr]   = useState(null);
  useEffect(() => {
    if (!activeModule || screen === "hub") return;
    let 취소 = false;
    setDataBusy(true); setDataErr(null);
    ensureModuleData(activeModule)
      .then(() => { if(!취소){ setDataBusy(false); setDataReady(n=>n+1); } })
      .catch(() => { if(!취소){ setDataBusy(false); setDataErr("문제를 불러오지 못했습니다. 새로고침해 주세요."); } });
    return () => { 취소 = true; };
  }, [activeModule, screen]);

  // ── 퀴즈 설정
  const [cfgRound,  setCfgRound]  = useState(1);
  const [cfgMode,   setCfgMode]   = useState("all");
  const [cfgTopics, setCfgTopics] = useState([]);

  // ── 퀴즈 진행
  const [inQuiz,   setInQuiz]   = useState(false);
  const [queue,    setQueue]    = useState([]);
  const [qidx,     setQidx]     = useState(0);
  const [answered, setAnswered] = useState(null);
  const [userAns,  setUserAns]  = useState(null);
  const [showExp,  setShowExp]  = useState(false);
  const [sessCor,  setSessCor]  = useState(0);
  const [sessErr,  setSessErr]  = useState(0);
  const [sessMark, setSessMark] = useState(0);
  const [done,     setDone]     = useState(false);
  const [label,    setLabel]    = useState("");
  const [timerLeft, setTimerLeft] = useState(20);
  const timerRef  = React.useRef(null);
  const qidxRef   = React.useRef(0);
  const queueRef  = React.useRef([]);

  // ── 스토리지 (모듈별 회독별)
  const [hubStats,  setHubStats]  = useState({});  // {modId: {wc, mc, pct}}
  const [wrongMap,  setWrongMap]  = useState({});
  const [markedMap, setMarkedMap] = useState({});
  const [progMap,   setProgMap]   = useState({});

  // ── 아카이브
  const [archExp,     setArchExp]     = useState({});
  const [archFilter,  setArchFilter]  = useState("wrong");

  // ── 피드백
  const [fbOpen,    setFbOpen]    = useState(false);
  const [fbType,    setFbType]    = useState("오류 제보");
  const [fbText,    setFbText]    = useState("");
  const [fbList,    setFbList]    = useState([]);  // 현재 문항 피드백
  const [fbLoading, setFbLoading] = useState(false);
  const [archRound,   setArchRound]   = useState(1);
  const [awWrongMap,  setAwWrongMap]  = useState({});
  const [awMarkMap,   setAwMarkMap]   = useState({});

  // ── 문항 수정본 (공유)
  const [userEdits, setUserEdits] = useState({});

  // ── 이어풀기 세션
  const [savedSession, setSavedSession] = useState(null);

  // ── 관리자
  const [adminUsers,  setAdminUsers]  = useState([]);
  const [adminSearch, setAdminSearch] = useState("");
  const [adminResult, setAdminResult] = useState(null);
  const [adminFbs,    setAdminFbs]    = useState(null);  // null=미로드, {}=로드완료
  const [adminFbLoad, setAdminFbLoad] = useState(false);
  const [editOpen,    setEditOpen]    = useState(false);
  const [editTarget,  setEditTarget]  = useState(null);
  const [editQ,       setEditQ]       = useState('');
  const [editE,       setEditE]       = useState('');
  const [adminEdits,  setAdminEdits]  = useState(null);
  const [adminEditLoad,setAdminEditLoad]=useState(false);

  // ── 테마 (dark / light)
  const [theme, setTheme] = React.useState(() => {
    try { return localStorage.getItem('quiz_theme') || 'light'; } catch { return 'light'; }
  });
  React.useEffect(() => {
    document.documentElement.classList.toggle('light', theme === 'light');
    try { localStorage.setItem('quiz_theme', theme); } catch {}
  }, [theme]);

  // ── 초기화: 로컬스토리지에서 마지막 uid 복원
  useEffect(() => {
    const saved = localStorage.getItem("hub_last_uid") || "";
    if (saved) tryLogin(saved, true);
  }, []);

  // ── 스토리지 저장 헬퍼
  const sw = async (key, val) => { try { await window.storage.set(key, JSON.stringify(val)); } catch {} };
  const gr = async (key, fallback) => { try { const r = await window.storage.get(key); return r ? JSON.parse(r.value) : fallback; } catch { return fallback; } };

  // ── 로그인
  async function tryLogin(id, silent=false) {
    if (!id.trim()) return;
    const isAdm = id === ADMIN_ID;
    setUid(id);
    setIsAdmin(isAdm);
    localStorage.setItem("hub_last_uid", id);

    // 접속 시각 갱신 (PIN 로그인에서 이미 info 설정됨, 여기서는 lastSeen만 갱신)
    if (!isAdm) {
      const safeId = id.replace(/[.#$\[\]]/g, '_');
      try {
        const existing = await fb.get(`users/${safeId}/info`);
        await fb.set(`users/${safeId}/info`, {
          ...(existing || { id }),
          lastSeen: Date.now(),
          lastDate: new Date().toLocaleDateString('ko-KR')
        });
      } catch {}
      await sw(K_UTIME(id), Date.now());
    }

    // 첫 번째 활성 모듈 설정
    const firstMod = MODULE_REGISTRY.find(m => m.status === "active");
    if (firstMod) setActiveModule(firstMod.id);

    // 로그인하면 바로 이 과목의 모듈 화면으로 간다. 과목은 헤더에서 바꾼다 —
    // 들어올 때마다 과목 고르는 화면을 한 번 더 거치는 게 번거로웠다.
    sessionStorage.removeItem("ox_skip_subject");   // 옛 플래그 잔여물 정리
    setScreen("hub");
    loadHubStats(id);
  }

  // ── 모듈 스토리지 로드
  async function loadHubStats(userId) {
    if (!userId) return;
    const sid = toSafeId(userId);
    const stats = {};
    for (const mod of MODULE_REGISTRY.filter(m=>m.status==="active")) {
      const allWrong = new Set(), allMarked = new Set();
      let answered=0, total=mod.count||0;
      for (const r of ROUNDS) {
        const fbW = await fb.get(fbPath.wrong(sid,mod.id,r));
        const w = fbW || await gr(K_WRONG(userId,mod.id,r), []);
        w.forEach(id=>allWrong.add(id));
        const fbM = await fb.get(fbPath.marked(sid,mod.id,r));
        const m2 = fbM || await gr(K_MARKED(userId,mod.id,r), []);
        m2.forEach(id=>allMarked.add(id));
      }
      // 진행률: 1회독 기준
      const fbP = await fb.get(fbPath.prog(sid,mod.id,1));
      const lsP = await gr(K_PROG(userId,mod.id,1), {answered:[]});
      const p = fbP || lsP;
      answered = (p.answered||[]).length;
      const pct = total ? Math.round(answered/total*100) : 0;
      stats[mod.id] = {wc: allWrong.size, mc: allMarked.size, answered, pct};
    }
    setHubStats(stats);
  }

  async function loadModuleData(mid) {
    if (!uid) return;
    const sid = toSafeId(uid);
    const wm = {}, mm = {}, pm = {}, awm = {}, amm = {};

    for (const r of ROUNDS) {
      // Firebase 우선, 없으면 localStorage 폴백
      const fbW = await fb.get(fbPath.wrong(sid,mid,r));
      wm[r] = new Set(fbW || await gr(K_WRONG(uid,mid,r), []));

      const fbM = await fb.get(fbPath.marked(sid,mid,r));
      mm[r] = new Set(fbM || await gr(K_MARKED(uid,mid,r), []));

      const fbP = await fb.get(fbPath.prog(sid,mid,r));
      const lsP = await gr(K_PROG(uid,mid,r), {answered:[],correct:[],wrong:[]});
      const p   = fbP || lsP;
      pm[r] = { answered:new Set(p.answered||[]), correct:new Set(p.correct||[]), wrong:new Set(p.wrong||[]) };

      const fbAW = await fb.get(fbPath.awWrong(sid,mid,r));
      awm[r] = new Set(fbAW || await gr(K_AW_WRONG(uid,mid,r), []));

      const fbAM = await fb.get(fbPath.awMark(sid,mid,r));
      amm[r] = new Set(fbAM || await gr(K_AW_MARK(uid,mid,r), []));
    }

    setWrongMap(wm); setMarkedMap(mm); setProgMap(pm);
    setAwWrongMap(awm); setAwMarkMap(amm);

    // 아카이브 회독
    const fbAR = await fb.get(fbPath.archRound(sid,mid));
    const arVal = fbAR ?? await gr(K_AW_ROUND(uid,mid), 1);
    setArchRound(arVal);

    // 세션
    const fbSess = await fb.get(fbPath.session(sid,mid));
    const lsSess = await gr(K_SESSION(uid,mid), null);
    setSavedSession(fbSess || lsSess);

    // 수정본 (Firebase 공유)
    const fbEdits = await fb.list(`edits/${mid}`);
    const edits = {};
    for (const ed of Object.values(fbEdits||{})) {
      if (ed?.qid) edits[ed.qid] = {question:ed.question, explanation:ed.explanation};
    }
    setUserEdits(edits);
  }

  useEffect(() => { if (uid && activeModule) loadModuleData(activeModule); }, [uid, activeModule]);

  // 수정본 저장 (공유: 모든 유저에게 적용)
  const saveEdit = async (qid, q, e) => {
    const next = {...userEdits};
    if (q === null) {
      delete next[qid];
    } else {
      next[qid] = { ...(next[qid]||{}), question: q, explanation: e };
    }
    setUserEdits(next);
    await window.storage.set(K_EDITS(activeModule), JSON.stringify(next));
  };

  // 현재 문항에 수정본 적용
  const applyEdit = (q) => {
    if (!q) return q;
    const ed = userEdits[q.id];
    if (!ed) return q;
    return { ...q, question: ed.question ?? q.question, explanation: ed.explanation ?? q.explanation };
  };

  // 이중 저장: Firebase(공유) + localStorage(빠른 읽기)
  const _fbsw = (path, data) => { fb.set(path, data); }; // fire-and-forget

  const saveWrong = (r,s) => {
    const arr = [...s];
    sw(K_WRONG(uid,activeModule,r), arr);
    _fbsw(fbPath.wrong(toSafeId(uid),activeModule,r), arr);
  };
  const saveMarked = (r,s) => {
    const arr = [...s];
    sw(K_MARKED(uid,activeModule,r), arr);
    _fbsw(fbPath.marked(toSafeId(uid),activeModule,r), arr);
  };
  const saveProg = (r,p) => {
    const obj = {answered:[...p.answered],correct:[...p.correct],wrong:[...p.wrong]};
    sw(K_PROG(uid,activeModule,r), obj);
    _fbsw(fbPath.prog(toSafeId(uid),activeModule,r), obj);
  };
  const saveAwWrong = (r,s) => {
    const arr = [...s];
    sw(K_AW_WRONG(uid,activeModule,r), arr);
    _fbsw(fbPath.awWrong(toSafeId(uid),activeModule,r), arr);
  };
  const saveAwMark = (r,s) => {
    const arr = [...s];
    sw(K_AW_MARK(uid,activeModule,r), arr);
    _fbsw(fbPath.awMark(toSafeId(uid),activeModule,r), arr);
  };
  const saveArchRound = (r) => {
    sw(K_AW_ROUND(uid,activeModule), r);
    _fbsw(fbPath.archRound(toSafeId(uid),activeModule), r);
  };
  const saveSession = (sess) => {
    sw(K_SESSION(uid,activeModule), sess || null);
    _fbsw(fbPath.session(toSafeId(uid),activeModule), sess || null);
  };

  // ── 퀴즈 시작
  function launchQuiz(round, mode, topics, resumeData=null, forceNew=false) {
    const mod = MODULE_REGISTRY.find(m => m.id === activeModule);
    if (!mod) return;
    const all = mod.getData();
    let pool, lbl;

    // 아카이브 전용 회독(aw_*): archRound 기준
    if (mode === "aw_wrong") {
      const r = archRound;
      pool = all.filter(q => (awWrongMap[r]||new Set()).has(q.id));
      if (!pool.length) return;
      lbl = `아카이브 ${r}회독 · 오답 (${pool.length}문제)`;
    } else if (mode === "aw_mark") {
      const r = archRound;
      pool = all.filter(q => (awMarkMap[r]||new Set()).has(q.id));
      if (!pool.length) return;
      lbl = `아카이브 ${r}회독 · 헷갈림 (${pool.length}문제)`;
    } else if (mode === "aw_all") {
      const r = archRound;
      const wids = awWrongMap[r]||new Set(), mids = awMarkMap[r]||new Set();
      pool = all.filter(q => wids.has(q.id)||mids.has(q.id));
      if (!pool.length) return;
      lbl = `아카이브 ${r}회독 · 전체 (${pool.length}문제)`;
    } else if (mode === "wrong+marked") {
      const wids = wrongMap[round]||new Set(), mids = markedMap[round]||new Set();
      pool = all.filter(q => wids.has(q.id) || mids.has(q.id));
      if (!pool.length) return;
      lbl = `${round}회독 오답+헷갈림 (${pool.length}문제)`;
    } else if (mode === "rnd100") {
      pool = shuffle([...all]).slice(0, 100);
      lbl = `${round}회독 무작위 100문제`;
    } else if (mode === "star") {
      pool = all.filter(q => q.star);
      if (!pool.length) return;
      lbl = `${round}회독 · ⭐ 중요문제 (${pool.length}문제)`;
    } else if (mode === "topic") {
      pool = topics.length > 0 ? all.filter(q => topics.some(t => t === "15V" ? String(q.id).startsWith("15V") : q.topic === t)) : [...all];
      lbl = `${round}회독 · ${topics.length > 0 ? topics.map(t=>mod.topics.find(x=>x.key===t)?.label||t).join(', ') : '전체'} (${pool.length}문제)`;
    } else {
      pool = [...all];
      lbl = `${round}회독 전체 ${all.length}문제`;
    }

    // 이어풀기: resumeData가 있으면 복원, 없으면 섞어서 시작
    let finalQueue, startIdx;
    // forceNew=false이고 resumeData 없으면 savedSession 자동 사용
    const effectiveResume = forceNew ? null : (resumeData || savedSession);
    const topicsMatch = mode !== "topic" || (
      effectiveResume &&
      [...(effectiveResume.topics||[])].sort().join(",") === [...topics].sort().join(",")
    );
    if (effectiveResume && effectiveResume.mode === mode && effectiveResume.round === round
      && effectiveResume.module === activeModule && topicsMatch) {
      // 저장된 큐 순서 복원 (ID 배열로 저장 → 실제 문제 객체로 매핑)
      const qMap = Object.fromEntries(all.map(q=>[q.id, q]));
      const restored = (effectiveResume.queueIds||[]).map(id=>qMap[id]).filter(Boolean);
      if (restored.length > 0) {
        finalQueue = restored;
        startIdx = effectiveResume.qidx || 0;
        lbl = effectiveResume.label || lbl;
      } else {
        finalQueue = shuffle(pool);
        startIdx = 0;
      }
    } else {
      finalQueue = shuffle(pool);
      startIdx = 0;
    }

    // 세션 저장
    const sessData = {
      mode, round, topics,
      queueIds: finalQueue.map(q=>q.id),
      qidx: startIdx,
      label: lbl,
      module: activeModule,
    };
    saveSession(sessData);
    setSavedSession(sessData);

    setQueue(finalQueue);
    setQidx(startIdx); setAnswered(null); setUserAns(null); setShowExp(false);
    setFbList([]); setFbOpen(false);
    setSessCor(0); setSessErr(0); setSessMark(0);
    setDone(false); setLabel(lbl); setInQuiz(true); setScreen("quiz");
  }

  function exitQuiz() {
    // 종료 시 현재 위치 저장 (qidx 갱신된 상태 유지 → 이어풀기용)
    setInQuiz(false); setDone(false); setScreen("quiz");
  }

  function handleAnswer(choice) {
    if (answered !== null) return;
    const cur = queue[qidx];
    const correct = choice === cur.answer;
    setUserAns(choice); setAnswered(correct ? "ok" : "er"); setShowExp(false);
    const r = cfgRound;
    const np = {
      answered: new Set([...(progMap[r]?.answered||[]), cur.id]),
      correct:  new Set([...(progMap[r]?.correct||[])]),
      wrong:    new Set([...(progMap[r]?.wrong||[])])
    };
    const nw = new Set(wrongMap[r]||[]);
    if (correct) { np.correct.add(cur.id); setSessCor(p=>p+1); }
    else { np.wrong.add(cur.id); nw.add(cur.id); setSessErr(p=>p+1); }
    setProgMap(pm=>({...pm,[r]:np}));
    setWrongMap(wm=>({...wm,[r]:nw}));
    saveProg(r,np); saveWrong(r,nw);

    // 아카이브 회독용 오답 추가 (메인 오답은 아카이브 현재 회독에도 자동 적재)
    if (!correct) {
      const ar = archRound;
      const nawm = new Set(awWrongMap[ar]||[]);
      nawm.add(cur.id);
      setAwWrongMap(m=>({...m,[ar]:nawm}));
      saveAwWrong(ar, nawm);
    }
  }

  function toggleMark() {
    const cur = queue[qidx]; const r = cfgRound;
    const nm = new Set(markedMap[r]||[]);
    if (nm.has(cur.id)) { nm.delete(cur.id); setSessMark(p=>Math.max(0,p-1)); }
    else { nm.add(cur.id); setSessMark(p=>p+1); }
    setMarkedMap(mm=>({...mm,[r]:nm}));
    saveMarked(r,nm);

    // 아카이브 회독용 헷갈림도 동기화
    const ar = archRound;
    const namm = new Set(awMarkMap[ar]||[]);
    if (nm.has(cur.id)) namm.add(cur.id); else namm.delete(cur.id);
    setAwMarkMap(m=>({...m,[ar]:namm}));
    saveAwMark(ar, namm);
  }

  function handleNext() {
    if (qidx+1 >= queue.length) {
      setDone(true);
      saveSession(null); // 완료 시 세션 삭제
      setSavedSession(null);
    } else {
      const nextIdx = qidx+1;
      setQidx(nextIdx);
      setAnswered(null); setUserAns(null); setShowExp(false);
      setFbList([]); setFbOpen(false);
      // 세션 qidx 갱신
      if (savedSession) {
        const updated = {...savedSession, qidx: nextIdx};
        setSavedSession(updated);
        saveSession(updated);
      }
    }
  }

  // ── rnd100 타이머: qidx·inQuiz 변화 시 리셋 ──────────────
  useEffect(() => { qidxRef.current = qidx; }, [qidx]);
  useEffect(() => { queueRef.current = queue; }, [queue]);

  useEffect(() => {
    if (cfgMode !== "rnd100" || !inQuiz || done) {
      clearInterval(timerRef.current); return;
    }
    clearInterval(timerRef.current);
    setTimerLeft(20);
    timerRef.current = setInterval(() => {
      setTimerLeft(t => { if (t <= 1) { clearInterval(timerRef.current); return 0; } return t - 1; });
    }, 1000);
    return () => clearInterval(timerRef.current);
  }, [qidx, inQuiz, cfgMode, done]);

  // 답변 시 타이머 정지
  useEffect(() => { if (answered !== null) clearInterval(timerRef.current); }, [answered]);

  // 시간 초과 처리
  useEffect(() => {
    if (timerLeft !== 0 || cfgMode !== "rnd100" || answered !== null || !inQuiz || done) return;
    const cur = queue[qidx];
    if (!cur) return;
    // 오답 강제 처리
    setAnswered("er"); setUserAns(null); setShowExp(false);
    setSessErr(p => p + 1);
    const r = cfgRound;
    const np = {
      answered: new Set([...(progMap[r]?.answered||[]), cur.id]),
      correct:  new Set([...(progMap[r]?.correct ||[])]),
      wrong:    new Set([...(progMap[r]?.wrong   ||[])])
    };
    np.wrong.add(cur.id);
    const nw = new Set(wrongMap[r]||[]); nw.add(cur.id);
    setProgMap(pm=>({...pm,[r]:np})); setWrongMap(wm=>({...wm,[r]:nw}));
    saveProg(r,np); saveWrong(r,nw);
    const ar = archRound;
    const nawm = new Set(awWrongMap[ar]||[]); nawm.add(cur.id);
    setAwWrongMap(m=>({...m,[ar]:nawm})); saveAwWrong(ar,nawm);
    // 1.3초 후 자동 다음 문제
    setTimeout(() => {
      const nextIdx = qidxRef.current + 1;
      if (nextIdx >= queueRef.current.length) {
        setDone(true); saveSession(null); setSavedSession(null);
      } else {
        setQidx(nextIdx); setAnswered(null); setUserAns(null);
        setShowExp(false); setFbList([]); setFbOpen(false);
      }
    }, 1300);
  }, [timerLeft]); // eslint-disable-line


  async function resetModule() {
    if (!confirm(`${activeModule} 모듈 전체 기록을 초기화하시겠습니까?`)) return;
    for (const r of ROUNDS) {
      const np = {answered:new Set(),correct:new Set(),wrong:new Set()};
      setProgMap(pm=>({...pm,[r]:np}));
      setWrongMap(wm=>({...wm,[r]:new Set()}));
      setMarkedMap(mm=>({...mm,[r]:new Set()}));
      saveProg(r,np); saveWrong(r,new Set()); saveMarked(r,new Set());
    }
  }

  // ── 헬퍼
  const getMod   = () => MODULE_REGISTRY.find(m => m.id === activeModule);
  const getAll   = () => getMod()?.getData() || [];
  const wCnt     = r => (wrongMap[r]||new Set()).size;
  const mCnt     = r => (markedMap[r]||new Set()).size;
  const wmCnt    = r => new Set([...(wrongMap[r]||new Set()), ...(markedMap[r]||new Set())]).size;
  const awCnt    = r => (awWrongMap[r]||new Set()).size;
  const amCnt    = r => (awMarkMap[r]||new Set()).size;
  const awTotal  = r => { const w=awWrongMap[r]||new Set(), m=awMarkMap[r]||new Set(); return new Set([...w,...m]).size; };
  const tCnt     = k => getAll().filter(q=> k==="15V" ? String(q.id).startsWith("15V") : q.topic===k).length;
  const tWrong   = (r,k) => getAll().filter(q=>(k==="15V" ? String(q.id).startsWith("15V") : q.topic===k)&&(wrongMap[r]||new Set()).has(q.id)).length;
  const tProg    = (r,k) => { const all=getAll().filter(q=> k==="15V" ? String(q.id).startsWith("15V") : q.topic===k); const ans=(progMap[r]?.answered||new Set()); const done=all.filter(q=>ans.has(q.id)).length; return {done, total:all.length, pct:all.length?Math.round(done/all.length*100):0}; };
  const TOTAL    = getAll().length;
  const getProg  = r => { const p=progMap[r]||{answered:new Set()}; return { ans:p.answered.size, pct:Math.round(p.answered.size/Math.max(TOTAL,1)*100) }; };
  const canStart = cfgMode !== "topic" || cfgTopics.length > 0;
  // 이어풀기 세션이 현재 설정과 매칭되는지 확인
  const hasResume = savedSession && savedSession.round===cfgRound && savedSession.mode===cfgMode
    && savedSession.module===activeModule
    && (cfgMode!=="topic" || (savedSession.topics||[]).join(",")===[...cfgTopics].sort().join(","))
    && (savedSession.qidx||0) > 0
    && (savedSession.queueIds||[]).length > (savedSession.qidx||0);
  const startCnt = cfgMode==="all" ? TOTAL : cfgMode==="rnd100" ? 100 : cfgMode==="topic" ? getAll().filter(q=>cfgTopics.includes(q.topic)).length : cfgMode==="wrong+marked" ? wmCnt(cfgRound) : 0;
  const cur      = applyEdit(queue[qidx]);
  const curMark  = cur && (markedMap[cfgRound]||new Set()).has(cur.id);

  // 아카이브 표시
  const archItems = r => {
    const wids = wrongMap[r]||new Set(), mids = markedMap[r]||new Set();
    if (archFilter==="wrong")  return getAll().filter(q=>wids.has(q.id));
    if (archFilter==="marked") return getAll().filter(q=>mids.has(q.id)&&!wids.has(q.id));
    return getAll().filter(q=>wids.has(q.id)||mids.has(q.id));
  };

  async function loadAdminUsers() {
    // Firebase에서 전체 유저 + 완전한 학습 통계 조회
    const fbAll = await fb.list('users');
    if (!fbAll) { setAdminUsers([]); return; }

    const users = [];
    for (const [safeId, userData] of Object.entries(fbAll)) {
      if (!userData || typeof userData !== 'object') continue;
      // info 서브키 있는 경우(신규)와 없는 경우(구버전) 모두 지원
      const info = userData.info || {};
      const id = info.id || userData.id || safeId;
      if (!id || id === ADMIN_ID) continue;
      const lastSeen = info.lastSeen || userData.lastSeen || 0;
      const lastDate = info.lastDate || userData.lastDate || '';

      const stats = userData?.stats || {};
      let total_ans=0, total_cor=0, total_wrg=0;
      const modStats = [];

      for (const mod of MODULE_REGISTRY.filter(m=>m.status==="active")) {
        const modData = stats[mod.id] || {};
        let m_ans=0, m_cor=0, m_wrg=0;
        for (const r of ROUNDS) {
          const p = modData[`prog_${r}`] || {};
          m_ans += (p.answered||[]).length;
          m_cor += (p.correct||[]).length;
          m_wrg += (p.wrong||[]).length;
        }
        total_ans+=m_ans; total_cor+=m_cor; total_wrg+=m_wrg;
        if (m_ans>0) modStats.push({mod:mod.label, ans:m_ans, cor:m_cor, wrg:m_wrg,
          pct: m_ans>0?Math.round(m_cor/m_ans*100):0});
      }
      users.push({ id, last:lastSeen, lastDate, ans:total_ans, cor:total_cor, wrg:total_wrg, modStats });
    }
    users.sort((a,b)=>(b.last||0)-(a.last||0));
    setAdminUsers(users);
  }

  async function adminSearchUser(searchId) {
    if (!searchId.trim()) return;
    const id = searchId.trim();
    const safeId = toSafeId(id);

    // Firebase에서 완전한 데이터 조회
    const userData = await fb.get(`users/${safeId}`);
    if (!userData) { setAdminResult({id, notFound:true}); return; }

    // info 서브키 있는 경우(신규)와 없는 경우(구버전) 모두 지원
    const info  = userData.info  || {};
    const stats = userData.stats || {};
    const lastSeen_ = info.lastSeen || userData.lastSeen || 0;
    const lastDate_ = info.lastDate || userData.lastDate || '';
    let total_ans=0, total_cor=0, total_wrg=0;
    const modStats = [];

    for (const mod of MODULE_REGISTRY.filter(m=>m.status==="active")) {
      const modData = stats[mod.id] || {};
      let m_ans=0, m_cor=0, m_wrg=0, m_wrg_cnt=0, m_mk_cnt=0;
      for (const r of ROUNDS) {
        const p = modData[`prog_${r}`] || {};
        m_ans += (p.answered||[]).length;
        m_cor += (p.correct||[]).length;
        m_wrg += (p.wrong||[]).length;
        m_wrg_cnt += (modData[`wrong_${r}`]||[]).length;
        m_mk_cnt  += (modData[`marked_${r}`]||[]).length;
      }
      total_ans+=m_ans; total_cor+=m_cor; total_wrg+=m_wrg;
      if (m_ans>0) modStats.push({mod:mod.label, ans:m_ans, cor:m_cor, wrg:m_wrg,
        pct:m_ans>0?Math.round(m_cor/m_ans*100):0, wrongCnt:m_wrg_cnt, markCnt:m_mk_cnt});
    }

    if (!lastSeen_ && total_ans===0) { setAdminResult({id, notFound:true}); return; }
    setAdminResult({id, last:lastSeen_, lastDate:lastDate_, ans:total_ans, cor:total_cor, wrg:total_wrg, modStats});
  }

  function renderExp(exp) {
    if (!exp) return null;
    const boxStyle = {
      background:'var(--sf2)', border:'1px solid var(--bd2)',
      borderLeft:'3px solid var(--blue)', borderRadius:6,
      padding:'6px 10px', margin:'4px 0', fontSize:14,
      color:'var(--tx2)', fontFamily:"'Noto Sans KR', sans-serif", lineHeight:1.6
    };
    // ▸ 앞 또는 \n[AI해설] 앞에서 분리
    const segs = exp.split(/(?=▸)|\n(?=\[AI해설\])/).filter(s => s.trim());
    return segs.map((seg, si) => {
      const t = seg.trim();
      // [AI해설] 섹션
      if (t.startsWith('[AI해설]')) {
        return (
          <div key={si} style={{marginTop:10,paddingTop:8,borderTop:'1px dashed rgba(255,255,255,.1)',fontSize:14,color:'var(--tx3)',lineHeight:1.7}}>
            <span style={{display:'inline-block',background:'rgba(82,167,254,.15)',color:'var(--blue)',borderRadius:4,padding:'1px 6px',fontSize:10,fontWeight:700,marginRight:6}}>AI해설</span>
            {t.slice('[AI해설]'.length).trim()}
          </div>
        );
      }
      // [조문] 전체 섹션 → 박스
      if (t.startsWith('[조문]')) {
        return <div key={si} style={{...boxStyle, marginBottom: si < segs.length-1 ? 6 : 0}}>{t.slice('[조문]'.length).trim()}</div>;
      }
      // 일반 ▸ 섹션 — 인라인 제NNN조 / [법조문] / [조문] 박스 처리
      const parts = seg.split(/(제\d+조[^가-힣\n]{5,150}[가-힣]|\[법조문\][^\n]+|\[조문\][^\n]+)/g);
      const nextIsAI = segs[si+1]?.trim().startsWith('[AI해설]');
      return (
        <div key={si} style={{marginBottom: si < segs.length-1 && !nextIsAI ? 10 : 0}}>
          {parts.map((p, pi) => {
            const pt = p.trim();
            if (/^제\d+조/.test(pt) || /^\[법조문\]/.test(pt)) return <div key={pi} style={boxStyle}>{p}</div>;
            if (/^\[조문\]/.test(pt)) return <div key={pi} style={boxStyle}>{p.replace(/^\[조문\]\s*/,'')}</div>;
            return <span key={pi} style={{whiteSpace:'pre-wrap'}}>{p}</span>;
          })}
        </div>
      );
    });
  }

                {editOpen && editTarget && (
                  <div className="fb-overlay" onClick={e=>{if(e.target===e.currentTarget)setEditOpen(false);}}>
                    <div className="fb-modal" onClick={e=>e.stopPropagation()}>
                      <div className="fb-modal-title">✏ 문제 수정</div>
                      <div className="fb-modal-sub" style={{marginBottom:14,fontSize:11,color:"var(--tx3)"}}>
                        수정 내용은 모든 이용자에게 즉시 반영됩니다.
                      </div>
                      <div style={{fontSize:12,color:"var(--tx2)",marginBottom:6,fontWeight:600}}>문제</div>
                      <textarea className="fb-textarea" rows={5} value={editQ}
                        onChange={e=>setEditQ(e.target.value)}/>
                      <div style={{fontSize:12,color:"var(--tx2)",margin:"12px 0 6px",fontWeight:600}}>해설</div>
                      <textarea className="fb-textarea" rows={3} value={editE}
                        onChange={e=>setEditE(e.target.value)}/>
                      <div className="fb-row" style={{justifyContent:"space-between"}}>
                        <button className="fb-cancel" style={{color:"var(--er)",borderColor:"var(--er)"}}
                          onClick={()=>resetEdit(editTarget.id)}>원복</button>
                        <div style={{display:"flex",gap:8}}>
                          <button className="fb-cancel" onClick={()=>setEditOpen(false)}>취소</button>
                          <button className="fb-submit" onClick={submitEdit}>저장</button>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* 피드백 모달 */}
                {fbOpen && (
                  <div className="fb-overlay" onClick={e=>{if(e.target===e.currentTarget)setFbOpen(false);}}>
                    <div className="fb-modal">
                      <div className="fb-modal-title">💬 피드백 작성</div>
                      <div className="fb-modal-sub">No.{cur.id} · {getMod()?.topics.find(t=>t.key===cur.topic)?.label||cur.topic}</div>
                      <div className="fb-qref">{(cur.question||'').split('§').pop().trim().slice(0,100)}...</div>
                      <div style={{fontSize:11,color:"var(--tx3)",marginBottom:8}}>유형 선택</div>
                      <div className="fb-select-row">
                        {["오류 제보","정답 이의","해설 보완","기능 요청","기타"].map(t=>(
                          <button key={t} className={`fb-type ${fbType===t?"sel":""}`} onClick={()=>setFbType(t)}>{t}</button>
                        ))}
                      </div>
                      <textarea className="fb-textarea" rows={4}
                        placeholder="내용을 입력해주세요..."
                        value={fbText}
                        onChange={e=>setFbText(e.target.value)}/>
                      <div className="fb-row">
                        <button className="fb-cancel" onClick={()=>setFbOpen(false)}>취소</button>
                        <button className="fb-submit" disabled={fbLoading||!fbText.trim()}
                          onClick={()=>submitFeedback(cur.id, activeModule)}>
                          {fbLoading?"저장 중...":"제출"}
                        </button>
                      </div>
                    </div>
                  </div>
                )}
                {cfgMode === "rnd100" && answered === null && (
                  <div style={{display:"flex",justifyContent:"center",marginBottom:4}}>
                    <CircleTimer timeLeft={timerLeft} />
                  </div>
                )}
                <div className="ox-row">
                  <button className={`ox o ${userAns===true?"sel-o":""}`}  onClick={()=>handleAnswer(true)}  disabled={answered!==null}>○</button>
                  <button className={`ox x ${userAns===false?"sel-x":""}`} onClick={()=>handleAnswer(false)} disabled={answered!==null}>✕</button>
                </div>
                {answered !== null && (
                  <button className="next-btn" onClick={handleNext}>{qidx+1<queue.length?"다음 문제 →":"결과 보기"}</button>
                )}
              </>
            )}

            {/* 완료 */}
            {inQuiz && done && (
              <div className="done-card">
                <div className="done-icon">🏛</div>
                <div className="done-title">완료!</div>
                <div className="done-sub">{label}</div>
                <div className="done-stats">
                  <div className="ds c"><div className="ds-n">{sessCor}</div><div className="ds-l">정답</div></div>
                  <div className="ds w"><div className="ds-n">{sessErr}</div><div className="ds-l">오답</div></div>
                  <div className="ds r"><div className="ds-n">{queue.length>0?Math.round(sessCor/queue.length*100):0}%</div><div className="ds-l">정답률</div></div>
                  <div className="ds m"><div className="ds-n">{sessMark}</div><div className="ds-l">헷갈림</div></div>
                </div>
                <div className="act-row">
                  <button className="act-btn" onClick={exitQuiz}>← 설정으로</button>
                  <button className="act-btn" onClick={()=>launchQuiz(cfgRound,cfgMode,cfgTopics)}>다시 풀기</button>
                  {wmCnt(cfgRound)>0&&<button className="act-btn" style={{borderColor:"rgba(248,81,73,.4)",color:"var(--er)"}} onClick={()=>launchQuiz(cfgRound,"wrong+marked",[])}>오답+헷갈림 {wmCnt(cfgRound)}문제</button>}
                  <button className="act-btn pri" onClick={()=>{setScreen("hub");exitQuiz();}}>모듈 선택</button>
                </div>
              </div>
            )}
          </div>
        )}

        {/* ════ 오답 아카이브 ════ */}
        {screen==="archive" && (
          <div className="su">

            {/* ── 아카이브 전용 회독 섹션 ── */}
            <div className="card" style={{marginBottom:16}}>
              <div className="card-title" style={{marginBottom:12}}>🗂 오답·헷갈림 회독 풀기</div>
              <div style={{fontSize:12,color:"var(--tx3)",marginBottom:10}}>
                매 회독에서 틀린·헷갈린 문제가 아카이브 회독에 자동 누적됩니다.
              </div>
              <div className="arch-round-tabs">
                {ROUNDS.map(r=>(
                  <button key={r} className={`art ${archRound===r?"act":""}`} onClick={()=>{setArchRound(r);saveArchRound(r);}}>
                    {r}회독
                    {awTotal(r)>0&&<span className="art-cnt">{awTotal(r)}</span>}
                  </button>
                ))}
              </div>
              {awTotal(archRound)>0 ? (
                <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:10}}>
                  {awCnt(archRound)>0&&(
                    <button className="retry-btn" style={{flex:1,margin:0}}
                      onClick={()=>launchQuiz(archRound,"aw_wrong",[])}>
                      ↺ {archRound}회독 오답 {awCnt(archRound)}문제 풀기
                    </button>
                  )}
                  {amCnt(archRound)>0&&(
                    <button className="retry-btn mk" style={{flex:1,margin:0}}
                      onClick={()=>launchQuiz(archRound,"aw_mark",[])}>
                      ↺ {archRound}회독 헷갈림 {amCnt(archRound)}문제 풀기
                    </button>
                  )}
                  <button className="retry-btn" style={{flex:1,margin:0,borderColor:"var(--gold)",color:"var(--gold)",background:"rgba(212,168,83,.08)"}}
                    onClick={()=>launchQuiz(archRound,"aw_all",[])}>
                    ↺ {archRound}회독 전체 ({awTotal(archRound)}문제)
                  </button>
                </div>
              ) : (
                <div style={{fontSize:13,color:"var(--tx3)",textAlign:"center",padding:"10px 0"}}>
                  {archRound}회독 아카이브에 문제가 없습니다.
                </div>
              )}
            </div>

            {/* ── 메인 회독별 오답 목록 ── */}
            {ROUNDS.map(r=>{
              const items = archItems(r);
              const wids = wrongMap[r]||new Set(), mids = markedMap[r]||new Set();
              return (
                <div key={r} style={{marginBottom:26}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10,paddingBottom:7,borderBottom:"1px solid var(--bd2)"}}>
                    <span style={{fontSize:14,fontWeight:700,color:"var(--gold)",fontFamily:"'Noto Serif KR',serif"}}>{r}회독</span>
                    <span style={{fontSize:11,color:"var(--tx3)",fontFamily:"'IBM Plex Mono',monospace",marginLeft:"auto"}}>오답 {wCnt(r)} · 헷갈림 {mCnt(r)}</span>
                  </div>
                  <div className="arch-filter-row">
                    <button className={`arch-filter ${archFilter==="wrong"?"act":""}`} onClick={()=>setArchFilter("wrong")}>오답만</button>
                    <button className={`arch-filter purple ${archFilter==="marked"?"act purple":""}`} onClick={()=>setArchFilter("marked")}>헷갈림만</button>
                    <button className={`arch-filter ${archFilter==="all"?"act":""}`} onClick={()=>setArchFilter("all")}>전체</button>
                  </div>
                  {items.length > 0 ? (
                    <>
                      {archFilter!=="marked"&&wCnt(r)>0&&<button className="retry-btn" onClick={()=>{setCfgRound(r);launchQuiz(r,"wrong",[]);}}>↺ {r}회독 오답 {wCnt(r)}문제 다시 풀기</button>}
                      {archFilter!=="wrong"&&mCnt(r)>0&&<button className="retry-btn mk" onClick={()=>{setCfgRound(r);launchQuiz(r,"marked",[]);}}>↺ {r}회독 헷갈리는 문제 {mCnt(r)}문제 다시 풀기</button>}
                      {items.map(q=>{
                        const k=`${r}-${q.id}`;
                        const isW=wids.has(q.id), isMk=mids.has(q.id);
                        return (
                          <div key={q.id} className={`arch-item ${archExp[k]?"exp":""} ${isMk&&!isW?"mk-item":""}`}
                            onClick={()=>setArchExp(p=>({...p,[k]:!p[k]}))}>
                            <div className="arch-q">No.{q.id} {q.question}</div>
                            {q.star && <span className="star-badge">⭐ 중요</span>}
                            <div className="arch-ans">정답: {q.answer?"○ 옳은 지문":"× 틀린 지문"}</div>
                            <span className="arch-tag">{TOPIC_ICONS[q.topic]||"📌"} {getMod()?.topics.find(t=>t.key===q.topic)?.label||q.topic}</span>
                            {isW&&<span className="arch-tag">오답</span>}
                            {isMk&&<span className="arch-tag mk">🔖 헷갈림</span>}
                            <div className="arch-exp">{q.explanation}</div>
                          </div>
                        );
                      })}
                    </>
                  ) : (
                    <div style={{fontSize:13,color:"var(--tx3)",padding:"6px 0 14px",textAlign:"center"}}>
                      {archFilter==="wrong"?"오답 없음":archFilter==="marked"?"헷갈림 표시 없음":"기록 없음"} ✓
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}

        {/* ════ 관리자 ════ */}
        {screen==="admin" && isAdmin && (
          <div className="su">
            {/* 유저 현황 */}
            <div className="card">
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
                <div className="card-title" style={{marginBottom:0}}>👥 접속 유저 현황</div>
                <button className="act-btn" style={{flex:"none",padding:"6px 14px",fontSize:12}} onClick={loadAdminUsers}>🔄 새로고침</button>
                <span style={{fontSize:11,color:"var(--tx3)",marginLeft:"auto"}}>총 {adminUsers.length}명</span>
              </div>
              <div className="admin-note">
                ✅ Firebase를 통해 모든 기기·브라우저에서 접속한 유저가 자동으로 표시됩니다.
              </div>
              {/* ID 직접 검색 */}
              <div className="admin-search">
                <input placeholder="유저 ID 직접 입력..." value={adminSearch}
                  onChange={e=>setAdminSearch(e.target.value)}
                  onKeyDown={e=>e.key==="Enter"&&adminSearchUser(adminSearch)}/>
                <button onClick={()=>adminSearchUser(adminSearch)}>조회</button>
              </div>
              {adminResult && (
                <div style={{background:adminResult.notFound?"var(--er-bg)":"var(--sf2)",border:`1px solid ${adminResult.notFound?"rgba(248,81,73,.3)":"var(--bd)"}`,borderRadius:10,padding:"12px 16px",marginBottom:12}}>
                  {adminResult.notFound ? (
                    <div style={{color:"var(--er)",fontSize:13}}>유저 '{adminResult.id}'의 기록이 없습니다.</div>
                  ) : (
                    <>
                      <div style={{fontWeight:700,color:"var(--gold)",marginBottom:8}}>👤 {adminResult.id}</div>
                      <div style={{display:"flex",gap:12,fontSize:12,flexWrap:"wrap"}}>
                        <span style={{color:"var(--tx3)"}}>시도 <b style={{color:"var(--tx)",fontFamily:"'IBM Plex Mono',monospace"}}>{adminResult.ans}</b></span>
                        <span style={{color:"var(--ok)"}}>정답 <b style={{fontFamily:"'IBM Plex Mono',monospace"}}>{adminResult.cor}</b></span>
                        <span style={{color:"var(--er)"}}>오답 <b style={{fontFamily:"'IBM Plex Mono',monospace"}}>{adminResult.wrg}</b></span>
                        <span style={{color:"var(--gold)"}}>정답률 <b style={{fontFamily:"'IBM Plex Mono',monospace"}}>{adminResult.ans>0?Math.round(adminResult.cor/adminResult.ans*100)+"%":"-"}</b></span>
                        {(adminResult.lastDate||adminResult.last>0)&&<span style={{color:"var(--tx3)"}}>마지막 접속: <b>{adminResult.lastDate||new Date(adminResult.last).toLocaleDateString("ko-KR")}</b></span>}
                      </div>
                      {adminResult.modStats?.map(m=>(
                        <div key={m.mod} style={{fontSize:11,background:"var(--bg)",border:"1px solid var(--bd2)",borderRadius:6,padding:"5px 10px",marginTop:5,color:"var(--tx3)"}}>
                          <b style={{color:"var(--tx)"}}>{m.mod}</b> ·
                          시도 <b style={{color:"var(--tx)"}}>{m.ans}</b> ·
                          정답 <b style={{color:"var(--ok)"}}>{m.cor}</b> ·
                          오답 <b style={{color:"var(--er)"}}>{m.wrg}</b> ·
                          정답률 <b style={{color:"var(--gold)"}}>{m.pct}%</b>
                          {m.wrongCnt>0&&<> · 오답뱅크 <b style={{color:"var(--er)"}}>{m.wrongCnt}</b></>}
                          {m.markCnt>0&&<> · 헷갈림 <b style={{color:"var(--purple)"}}>{m.markCnt}</b></>}
                        </div>
                      ))}
                      {/* PIN 초기화 버튼 */}
                      {!adminResult.notFound && (
                        <button style={{marginTop:10,padding:"6px 14px",fontSize:11,
                          background:"var(--er-bg)",border:"1px solid rgba(248,81,73,.3)",
                          color:"var(--er)",borderRadius:8,cursor:"pointer"}}
                          onClick={async()=>{
                            if(!confirm(`${adminResult.id}의 PIN을 초기화하시겠습니까?`)) return;
                            const safeId = adminResult.id.replace(/[.#$[\]]/g,'_');
                            const info = await fb.get(`users/${safeId}/info`);
                            if(info) {
                              const {pin:_,...rest} = info;
                              await fb.set(`users/${safeId}/info`, rest);
                              alert('PIN이 초기화되었습니다. 다음 로그인 시 새 PIN을 설정합니다.');
                            }
                          }}>
                          🔑 PIN 초기화
                        </button>
                      )}
                    </>
                  )}
                </div>
              )}
              {adminUsers.length === 0 ? (
                <div style={{textAlign:"center",padding:"20px",color:"var(--tx3)"}}>아직 접속한 유저가 없습니다.</div>
              ) : adminUsers.map(u=>(
                <div key={u.id} className="admin-user-card" style={{flexDirection:"column",alignItems:"flex-start"}}>
                  <div style={{display:"flex",alignItems:"center",gap:10,width:"100%",flexWrap:"wrap"}}>
                    <span className="admin-uid">👤 {u.id}</span>
                    <div className="admin-stats" style={{flex:1}}>
                      <span className="admin-stat">시도 <b>{u.ans}</b></span>
                      <span className="admin-stat ok">정답 <b>{u.cor}</b></span>
                      <span className="admin-stat er">오답 <b>{u.wrg}</b></span>
                      <span className="admin-stat gold">정답률 <b>{u.ans>0?Math.round(u.cor/u.ans*100)+"%" :"-"}</b></span>
                      {(u.lastDate||u.last>0)&&<span className="admin-stat">마지막 접속 <b style={{color:"var(--gold)"}}>{u.lastDate||new Date(u.last).toLocaleDateString("ko-KR")}</b></span>}
                    </div>
                  </div>
                  {u.modStats && u.modStats.length > 0 && (
                    <div style={{display:"flex",gap:8,marginTop:6,flexWrap:"wrap",width:"100%"}}>
                      {u.modStats.map(m=>(
                        <div key={m.mod} style={{fontSize:11,background:"var(--bg)",border:"1px solid var(--bd2)",borderRadius:6,padding:"4px 10px",color:"var(--tx3)"}}>
                          <b style={{color:"var(--tx)"}}>{m.mod}</b> · 시도 {m.ans} · 정답률 {m.pct}%
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              ))}
            </div>

            {/* 수정 내역 */}

            {/* 피드백 목록 */}
            <div className="card" style={{marginTop:12}}>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
                <div className="card-title" style={{marginBottom:0}}>💬 피드백 목록</div>
                <button className="act-btn" style={{flex:"none",padding:"6px 14px",fontSize:12}}
                  onClick={async()=>{
                    setAdminFbLoad(true);
                    const data = await loadAllFeedbacks();
                    setAdminFbs(data);
                    setAdminFbLoad(false);
                  }}>
                  {adminFbLoad ? "로딩중..." : adminFbs===null ? "📥 불러오기" : "🔄 새로고침"}
                </button>
                {adminFbs!==null && (
                  <span style={{fontSize:11,color:"var(--tx3)",marginLeft:"auto"}}>
                    총 {Object.values(adminFbs).reduce((s,a)=>s+a.length,0)}건
                  </span>
                )}
              </div>

              {adminFbs===null && (
                <div style={{textAlign:"center",padding:"20px",color:"var(--tx3)",fontSize:13}}>
                  불러오기 버튼을 눌러 피드백을 확인하세요.
                </div>
              )}

              {adminFbs!==null && Object.keys(adminFbs).length===0 && (
                <div style={{textAlign:"center",padding:"20px",color:"var(--tx3)",fontSize:13}}>
                  피드백이 없습니다.
                </div>
              )}

              {adminFbs!==null && Object.entries(adminFbs).map(([mid, items])=>(
                <div key={mid} style={{marginBottom:16}}>
                  <div style={{fontSize:12,fontWeight:700,color:"var(--gold)",marginBottom:8,
                    paddingBottom:4,borderBottom:"1px solid var(--bd)"}}>
                    {MODULE_REGISTRY.find(m=>m.id===mid)?.label || mid} ({items.length}건)
                  </div>
                  {items.map((item,i)=>(
                    <div key={i} className="fb-admin-item">
                      <div className="fb-admin-meta">
                        <span className="fb-admin-no">#{item.qid}</span>
                        <span className="fb-admin-type">{item.type}</span>
                        <span className="fb-admin-uid">👤 {item.uid}</span>
                        <span className="fb-admin-date">{item.date||new Date(item.ts).toLocaleDateString("ko-KR")}</span>
                      </div>
                      <div className="fb-admin-body">{item.text}</div>
                    </div>
                  ))}
                </div>
              ))}
            </div>

            {/* 수정 내역 카드 */}
            <div className="card" style={{marginTop:12}}>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
                <div className="card-title" style={{marginBottom:0}}>✏ 수정 내역</div>
                <button className="act-btn" style={{flex:"none",padding:"6px 14px",fontSize:12}}
                  onClick={async()=>{
                    setAdminEditLoad(true);
                    const data = await loadAllEdits();
                    setAdminEdits(data);
                    setAdminEditLoad(false);
                  }}>
                  {adminEditLoad?"로딩중...":adminEdits===null?"📥 불러오기":"🔄 새로고침"}
                </button>
                {adminEdits!==null && (
                  <span style={{fontSize:11,color:"var(--tx3)",marginLeft:"auto"}}>
                    총 {Object.values(adminEdits).reduce((s,a)=>s+a.length,0)}건
                  </span>
                )}
              </div>
              {adminEdits===null && (
                <div style={{textAlign:"center",padding:"20px",color:"var(--tx3)",fontSize:13}}>
                  불러오기 버튼을 눌러 수정 내역을 확인하세요.
                </div>
              )}
              {adminEdits!==null && Object.keys(adminEdits).length===0 && (
                <div style={{textAlign:"center",padding:"20px",color:"var(--tx3)",fontSize:13}}>
                  수정 내역이 없습니다.
                </div>
              )}
              {adminEdits!==null && Object.entries(adminEdits).map(([mid,items])=>(
                <div key={mid} style={{marginBottom:16}}>
                  <div style={{fontSize:12,fontWeight:700,color:"var(--gold)",marginBottom:8,
                    paddingBottom:4,borderBottom:"1px solid var(--bd)"}}>
                    {MODULE_REGISTRY.find(m=>m.id===mid)?.label||mid} ({items.length}건)
                  </div>
                  {items.map((item,i)=>(
                    <div key={i} className="fb-admin-item" style={{marginBottom:8}}>
                      <div className="fb-admin-meta">
                        <span className="fb-admin-no">#{item.qid}</span>
                        <span className="fb-admin-uid">👤 {item.uid}</span>
                        <span className="fb-admin-date">{item.date}</span>
                      </div>
                      {item.original_q&&item.original_q!==item.question&&(
                        <div style={{fontSize:11,color:"var(--tx3)",marginBottom:4,
                          textDecoration:"line-through",padding:"4px 8px",background:"var(--sf2)",borderRadius:4}}>
                          {item.original_q}
                        </div>
                      )}
                      <div className="fb-admin-body" style={{fontSize:12}}>{item.question}</div>
                    </div>
                  ))}
                </div>
              ))}
            </div>

          </div>
        )}

      </div>
    </div>
    </>
  );
}


/* ── 관리자: 수정 내역 컴포넌트 ─────────────────────────── */


/* ── 로그인 화면 컴포넌트 ─────────────────────────────── */
/* 과목 전환 — 세 과목이 각각 다른 HTML이라 전환은 페이지 이동이다.
   (한 파일에 다 담으면 문항 데이터가 수 MB라 첫 로딩이 무거워진다.)
   예전에는 로그인할 때마다 과목 고르는 화면을 한 번 더 거쳤는데,
   들어올 때마다 번거로워 헤더에서 바로 바꾸도록 옮겼다. */
const SUBJECT_PAGES = [
  { id: "civil",    label: "민사법", href: "index.html" },
  { id: "criminal", label: "형사법", href: "criminal.html" },
  { id: "public",   label: "공법",   href: "public-law.html" },
];

function SubjectSwitch({ current }) {
  // 드롭다운이 아니라 세 과목을 다 펼쳐 둔다. 지금 어느 과목인지 한눈에 보이고,
  // 바꿀 때도 한 번만 누르면 된다(드롭다운은 열고 고르는 두 동작이었다).
  return (
    <div className="subject-tabs" role="group" aria-label="과목 전환">
      {SUBJECT_PAGES.map(s =>
        s.id === current
          ? <span key={s.id} className="subject-tab on" aria-current="page">{s.label}</span>
          : <a key={s.id} className="subject-tab" href={s.href}>{s.label}</a>)}
    </div>
  );
}

function SubjectSelect({ onSelect, currentSubject }) {
  const btn = (id, label, ac, bc, gc) => {
    const active = currentSubject === id;
    return (
      <button key={id}
        onClick={()=>onSelect(id)}
        onTouchEnd={(e)=>{e.preventDefault();onSelect(id);}}
        style={{
        width:"100%", padding:"17px 20px", borderRadius:12, textAlign:"left",
        border: active ? `2px solid ${bc}` : "1px solid rgba(255,255,255,.13)",
        background: active ? `rgba(${ac},.15)` : "rgba(255,255,255,.05)",
        color: active ? `rgba(${ac},1)` : "rgba(255,255,255,.65)",
        fontSize:15, fontWeight: active ? 700 : 500, cursor:"pointer",
        letterSpacing:".02em", touchAction:"manipulation",
        boxShadow: active ? `0 0 20px rgba(${gc},.35)` : "none",
      }}>
        ⚖ {label}
        {active && <span style={{float:"right",fontSize:11,opacity:.55,fontWeight:400}}>선택됨</span>}
      </button>
    );
  };
  return (
    <React.Fragment>
<div className="login-wrap">
        <div className="login-box">
          <div className="login-header">
            <div className="login-logo">⚖︎ OX Quiz</div>
            <div className="login-title" style={{letterSpacing:".04em"}}>과목을 선택하세요</div>
          </div>
          <div className="login-card" style={{padding:"22px 20px"}}>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {btn("civil",    "민사법", "122,184,216", "rgba(122,184,216,.75)", "122,184,216")}
              {btn("criminal", "형사법", "212,120,138", "rgba(212,120,138,.75)", "212,120,138")}
              {btn("public",   "공법",   "196,160,112", "rgba(196,160,112,.75)", "196,160,112")}
            </div>
          </div>
        </div>
      </div>
    </React.Fragment>
  );
}

function CircleTimer({ timeLeft, total = 20 }) {
  const r = 13, circ = +(2 * Math.PI * r).toFixed(2);
  const offset = +(circ * (1 - timeLeft / total)).toFixed(2);
  const color = timeLeft <= 5 ? '#f87171' : timeLeft <= 10 ? '#fbbf24' : 'var(--gold)';
  return (
    <svg width="34" height="34" viewBox="0 0 34 34">
      <circle cx="17" cy="17" r={r} fill="none" stroke="rgba(255,255,255,.09)" strokeWidth="3"/>
      <circle cx="17" cy="17" r={r} fill="none" stroke={color} strokeWidth="3"
        strokeDasharray={circ} strokeDashoffset={offset}
        strokeLinecap="round"
        style={{transform:'rotate(-90deg)',transformOrigin:'17px 17px',
          transition:'stroke-dashoffset 0.9s linear, stroke 0.3s'}}/>
    </svg>
  );
}


function LoginScreen({ onLogin }) {
  const FB_BASE = "https://project-1720248149706690221-default-rtdb.asia-southeast1.firebasedatabase.app";

  const [step, setStep]       = React.useState("id");   // id | pin_new | pin_check
  const [uid,  setUid]        = React.useState(localStorage.getItem("hub_last_uid")||"");
  const [pin,  setPin]        = React.useState(["","","",""])
  const [status, setStatus]   = React.useState({msg:"", type:"info"});
  const [loading, setLoading] = React.useState(false);
  const pinRefs = [React.useRef(), React.useRef(), React.useRef(), React.useRef()];

  // Firebase 단순 fetch
  const fbGet = async (path) => {
    try {
      const r = await fetch(`${FB_BASE}/${path}.json`);
      return r.ok ? await r.json() : null;
    } catch { return null; }
  };
  const fbSet = async (path, data) => {
    try {
      await fetch(`${FB_BASE}/${path}.json`, {
        method:'PUT', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(data)
      });
    } catch {}
  };

  const toSafe = id => id.replace(/[.#$\[\]]/g,'_');

  // PIN 입력 핸들러
  const handlePinInput = (i, val) => {
    if (!/^[0-9]?$/.test(val)) return;
    const next = [...pin];
    next[i] = val;
    setPin(next);
    if (val && i < 3) pinRefs[i+1].current?.focus();
  };
  const handlePinKey = (i, e) => {
    if (e.key === "Backspace" && !pin[i] && i > 0) {
      pinRefs[i-1].current?.focus();
    }
    if (e.key === "Enter") handlePinSubmit();
  };
  const pinFull = pin.join("");

  // 1단계: 아이디 확인
  const handleUnifiedLogin = async () => {
    const id = uid.trim();
    if (!id) { setStatus({msg:"아이디를 입력해주세요.", type:"er"}); return; }
    if (!/^[a-zA-Z0-9가-힣_-]{1,20}$/.test(id)) {
      setStatus({msg:"20자 이내 한글/영문/숫자/_-만 가능합니다.", type:"er"}); return;
    }
    if (pinFull.length !== 4) { setStatus({msg:"PIN 4자리를 모두 입력해주세요.", type:"er"}); return; }

    setLoading(true);
    setStatus({msg:"확인 중...", type:"info"});
    const safeId = toSafe(id);

    const existing = await fbGet(`users/${safeId}/info`);

    if (existing && existing.pin) {
      // 기존 유저 — PIN 대조
      if (existing.pin !== pinFull) {
        setLoading(false);
        setStatus({msg:"PIN이 올바르지 않습니다.", type:"er"});
        setPin(["","","",""]);
        setTimeout(()=>pinRefs[0].current?.focus(), 50);
        return;
      }
      // PIN 일치 — 접속시간 갱신 후 로그인
      await fbSet(`users/${safeId}/info`, {
        ...existing,
        lastSeen: Date.now(),
        lastDate: new Date().toLocaleDateString('ko-KR')
      });
      setStatus({msg:"로그인 성공!", type:"ok"});
      setLoading(false);
      setTimeout(()=>onLogin(id), 300);
    } else {
      // 신규 유저 — PIN 저장 후 로그인
      await fbSet(`users/${safeId}/info`, {
        id, pin: pinFull,
        lastSeen: Date.now(),
        lastDate: new Date().toLocaleDateString('ko-KR')
      });
      setStatus({msg:"계정 생성 완료!", type:"ok"});
      setLoading(false);
      setTimeout(()=>onLogin(id), 500);
    }
  };

  const handleIdNext = async () => {

    const id = uid.trim();
    if (!id) return;
    if (!/^[a-zA-Z0-9가-힣_-]{1,20}$/.test(id)) {
      setStatus({msg:"20자 이내 한글/영문/숫자/_-만 가능합니다.", type:"er"}); return;
    }

    setLoading(true);
    setStatus({msg:"확인 중...", type:"info"});
    const safeId = toSafe(id);
    const existing = await fbGet(`users/${safeId}/info`);
    setLoading(false);

    if (existing && existing.pin) {
      // 기존 유저 → PIN 확인
      setPin(["","","",""]);
      setStep("pin_check");
      setStatus({msg:"등록된 PIN을 입력해주세요.", type:"info"});
      setTimeout(()=>pinRefs[0].current?.focus(), 100);
    } else {
      // 신규 유저 → PIN 등록
      setPin(["","","",""]);
      setStep("pin_new");
      setStatus({msg:"사용할 4자리 PIN을 설정해주세요.", type:"info"});
      setTimeout(()=>pinRefs[0].current?.focus(), 100);
    }
  };

  // 2단계: PIN 제출
  const handlePinSubmit = async () => {
    if (pinFull.length !== 4) {
      setStatus({msg:"4자리를 모두 입력해주세요.", type:"er"}); return;
    }
    const id = uid.trim();
    const safeId = toSafe(id);
    setLoading(true);

    if (step === "pin_new") {
      // 신규: PIN 저장 후 로그인
      await fbSet(`users/${safeId}/info`, {
        id, pin: pinFull,
        lastSeen: Date.now(),
        lastDate: new Date().toLocaleDateString('ko-KR')
      });
      setStatus({msg:"PIN 설정 완료!", type:"ok"});
      setLoading(false);
      setTimeout(()=>onLogin(id), 500);
    } else {
      // 기존: PIN 검증
      const existing = await fbGet(`users/${safeId}/info`);
      const correctPin = existing?.pin;
      if (correctPin === pinFull) {
        // 접속시간 갱신
        if (existing) {
          await fbSet(`users/${safeId}/info`, {
            ...existing,
            lastSeen: Date.now(),
            lastDate: new Date().toLocaleDateString('ko-KR')
          });
        }
        setStatus({msg:"로그인 성공!", type:"ok"});
        setLoading(false);
        setTimeout(()=>onLogin(id), 300);
      } else {
        setStatus({msg:"PIN이 일치하지 않습니다.", type:"er"});
        setPin(["","","",""]);
        setLoading(false);
        setTimeout(()=>pinRefs[0].current?.focus(), 50);
      }
    }
  };


  return (
    <React.Fragment>
      {/* 비디오 배경 */}

      {/* 로그인 폼 */}
      <div className="login-wrap">
        <div className="login-box">
          <div className="login-header">
            <div className="login-logo">⚖︎ OX Quiz</div>
            <div className="login-title">공법 선택형 기출 최신빈출지문</div>
          </div>
          <div className="login-card">
            {/* 아이디 입력 */}
            <div className="login-label">아이디</div>
            <input className="login-input" value={uid}
              placeholder="한글/영문/숫자 20자 이내"
              onChange={e=>{ setUid(e.target.value); setStatus({msg:"",type:"info"}); }}
              onKeyDown={e=>{ if(e.key==="Enter") pinRefs[0].current?.focus(); }}
              autoFocus />

            {/* PIN 입력 */}
            <div className="login-label" style={{marginTop:4}}>
              PIN {step==="pin_new" ? <span style={{color:"rgba(180,205,240,.6)",fontWeight:400}}>(신규 — 4자리 숫자 설정)</span> : ""}
            </div>
            <div className="pin-row" style={{marginTop:4}}>
              {[0,1,2,3].map(i=>(
                <input key={i} ref={pinRefs[i]}
                  className="pin-digit" type="password"
                  maxLength={1} value={pin[i]}
                  onChange={e=>handlePinInput(i, e.target.value)}
                  onKeyDown={e=>handlePinKey(i,e)} />
              ))}
            </div>
            <div className={`pin-status ${status.type}`} style={{color: status.type==="ok"?"rgba(120,200,120,.9)":status.type==="er"?"rgba(255,100,100,.9)":"rgba(180,205,240,.5)"}}>{status.msg}</div>
            <button className="login-btn" onClick={handleUnifiedLogin} disabled={loading}>
              {loading ? "처리 중..." : "로그인"}
            </button>

            <div className="login-hint" style={{marginTop:14}}>
              아이디 + PIN으로 어느 기기에서든 학습 기록이 이어집니다.<br/>
              처음 사용하는 아이디는 자동으로 계정이 생성됩니다.
            </div>
          </div>
        </div>
      </div>
    </React.Fragment>
  );
}


function AdminFeedbacks({ loadAllFeedbacks }) {
  const [data, setData] = React.useState({});
  const [loading, setLoading] = React.useState(false);
  const [filter, setFilter] = React.useState("전체");

  async function load() {
    setLoading(true);
    const d = await loadAllFeedbacks();
    setData(d);
    setLoading(false);
  }
  React.useEffect(()=>{ load(); }, []);

  const allItems = Object.values(data).flat();
  const filtered = filter==="전체" ? allItems : allItems.filter(f=>f.type===filter);
  const total = allItems.length;

  return (
    <div className="card" style={{marginTop:16}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
        <div className="card-title" style={{marginBottom:0}}>💬 피드백 목록 ({total}건)</div>
        <button className="act-btn" style={{flex:"none",padding:"6px 14px",fontSize:12}} onClick={load}>🔄 새로고침</button>
      </div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:14}}>
        {["전체","오류 제보","정답 이의","해설 보완","기능 요청","기타"].map(t=>(
          <button key={t}
            style={{padding:"4px 12px",borderRadius:14,border:"1px solid var(--bd)",
              background:filter===t?"var(--gold)":"var(--sf2)",
              color:filter===t?"#0d1117":"var(--tx3)",
              fontSize:11,cursor:"pointer",fontWeight:filter===t?700:400}}
            onClick={()=>setFilter(t)}>{t}</button>
        ))}
      </div>
      {loading ? (
        <div style={{textAlign:"center",padding:20,color:"var(--tx3)"}}>불러오는 중...</div>
      ) : filtered.length===0 ? (
        <div style={{textAlign:"center",padding:20,color:"var(--tx3)"}}>피드백이 없습니다.</div>
      ) : filtered.map((f,i)=>(
        <div key={i} className="fb-admin-item">
          <div className="fb-admin-meta">
            <span className="fb-admin-no">No.{f.qid}</span>
            <span className="fb-admin-type">{f.type}</span>
            <span className="fb-admin-uid">👤 {f.uid}</span>
            <span className="fb-admin-date">{f.date}</span>
          </div>
          <div className="fb-admin-q">{(f.mid||"")} · 문항 {f.qid}</div>
          <div className="fb-admin-body">{f.text}</div>
        </div>
      ))}
    </div>
  );
}

<script>
if('serviceWorker' in navigator){
  // 새 워커가 제어권을 넘겨받으면 한 번만 새로고침한다.
  // 이게 없으면 배포 직후 방문자에게 캐시에 남은 옛 화면이 그대로 보이고,
  // 손으로 새로고침하기 전까지 스스로 회복하지 못한다.
  const 최초등록 = !navigator.serviceWorker.controller;
  let 새로고침함 = false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(최초등록 || 새로고침함) return;   // 첫 방문이면 이미 최신이다
    새로고침함 = true;
    location.reload();
  });
  window.addEventListener('load',()=>{
    // updateViaCache:'none' — sw.js가 HTTP 캐시에 붙잡히면 새 배포를 못 본다.
    navigator.serviceWorker.register('/MCQ/sw.js',{updateViaCache:'none'}).catch(()=>{});
  });
}
</script>
