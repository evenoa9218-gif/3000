name: Auto merge deploy branch to main

on:
  push:
    branches:
      - claude/separate-data-json-N5k30

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge deploy branch into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          git merge --ff-only origin/claude/separate-data-json-N5k30 || \
            git merge -X theirs origin/claude/separate-data-json-N5k30 --no-edit
          git push origin main
